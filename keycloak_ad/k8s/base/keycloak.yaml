# Keycloak — 5부에서 손으로 띄운 그것을 클러스터에 올린다.
#
# 5부의 깃발과 환경 변수가 여기서 ConfigMap 과 Secret 이 된다.
# 값이 바뀐 것은 하나도 없고, **어디에 적느냐**만 달라졌다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak
  namespace: lunch
data:
  # 내 바깥 주소. 토큰의 iss 와 리다이렉트 주소가 여기서 나온다.
  # 운영 모드는 이것을 짐작하지 않고 **적으라고 요구한다**(5부 2장).
  KC_HOSTNAME: https://sso.campus.example

  # 앞에 인그레스가 있다고 알린다. 이게 없으면 Keycloak 이
  # 자기 주소를 http://…:8080 으로 알고 브라우저를 그리로 튕긴다.
  KC_PROXY_HEADERS: xforwarded

  # 클러스터 **안에서는** 평문으로 받는다. TLS 는 인그레스에서 끝난다
  # (2부 5장). 바깥에서 평문으로 들어올 길은 없다.
  KC_HTTP_ENABLED: "true"

  # 건강 확인과 지표를 켠다 → 관리 포트 9000 이 열린다.
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"

  KC_DB: postgres
  KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak

  # 여러 벌이 캐시를 나눠 쓰는 방법.
  # kubernetes 스택은 아래 헤드리스 Service 의 DNS 로 서로를 찾는다.
  KC_CACHE: ispn
  KC_CACHE_STACK: kubernetes

  # 캐시가 서로를 찾는 주소. 위의 헤드리스 Service 다.
  #
  # 여기 한 줄로 적는다. YAML 의 접기(>-)로 나누면 줄바꿈이
  # **공백**이 되어 이름이 깨진다 — 실제로 그렇게 해 보고 알았다.
  JAVA_OPTS_APPEND: -Djgroups.dns.query=keycloak-headless
---
# 서로를 찾는 데 쓰는 헤드리스 Service.
#
# Keycloak 두 벌이 세션 캐시를 나눠 가지려면 상대가 어디 있는지
# 알아야 한다. jgroups.dns.query 가 이 이름을 물어보고,
# 헤드리스라 **Pod 들의 주소가 그대로** 돌아온다.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-headless
  namespace: lunch
  labels:
    app.kubernetes.io/name: keycloak
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: jgroups
      port: 7800
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: lunch
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: lunch
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.3
          # --optimized = 이미지를 만들 때 kc.sh build 를 이미
          # 해 뒀다는 뜻이다.
          # 그래서 뜰 때 다시 굽지 않는다 — 몇십 초가 줄어든다(5부 2장).
          args: [start, --optimized]
          env:
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: user
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            # AD 의 사내 CA 를 믿게 한다(7부 5장).
            - name: KC_TRUSTSTORE_PATHS
              value: /opt/keycloak/conf/truststores
          envFrom:
            - configMapRef:
                name: keycloak
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
            - name: jgroups
              containerPort: 7800
          # 건강 확인은 **관리 포트**로 한다(5부 2장).
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: truststore
              mountPath: /opt/keycloak/conf/truststores
              readOnly: true
            # 읽기 전용 루트라 쓸 수 있는 자리를 따로 준다.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: truststore
          secret:
            secretName: ad-truststore
        - name: tmp
          emptyDir: {}
