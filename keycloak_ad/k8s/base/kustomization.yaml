# kustomization.yaml — "이 폴더의 것들을 이렇게 합쳐라".
#
# 템플릿 언어가 아니다. 값을 끼워 넣는 자리(<%= %>)가 없고,
# **다 갖춰진 YAML 을 겹쳐서 덮어쓴다**. 그래서 base/ 의 파일들은
# 그 자체로 완결돼 있고, 따로 떼어 kubectl 에 그냥 줄 수도 있다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 여기 적힌 것만 합쳐진다. 폴더에 파일을 두는 것만으로는 안 낀다 —
# "왜 내 매니페스트가 안 나오지" 의 첫 번째 원인이다.
resources:
  - namespace.yaml
  - postgres.yaml
  - keycloak.yaml
  - keycloak-ingress.yaml
  - networkpolicy.yaml
  - lunch-app.yaml
  - lunch-ingress.yaml
  - oauth2-proxy.yaml

# 모든 것에 공통으로 붙일 라벨. 나중에 통째로 지울 때 이 라벨로 고른다.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: lunch

# 비밀은 파일에 적어 커밋하지 않는다. 여기서는 배우려고 만들어 두지만,
# 진짜 클러스터에서는 External Secrets·Sealed Secrets 같은 것을 쓴다.
secretGenerator:
  - name: lunch-web
    literals:
      - client-secret=lunch-secret-demo
    options:
      # 켜 두면 이름 뒤에 내용의 해시가 붙어 lunch-web-abc123 이 된다.
      # 내용이 바뀌면 이름이 바뀌고, 그러면 Pod 가 저절로 다시 뜬다.
      # 여기서는 이름을 그대로 두려고 껐다.
      disableNameSuffixHash: true
  - name: postgres
    literals:
      - user=keycloak
      - password=postgres-demo-1234
    options:
      disableNameSuffixHash: true

  # 인증서는 값을 적지 않고 **파일에서 읽는다**. 그래야 인증서를
  # 바꿀 때 이 파일을 안 고쳐도 된다 — 1부 7장에서 만든 그 파일이다.
  #
  # 파일이 이 폴더 안에 있어야 한다. kustomize 는 자기 폴더 밖으로
  # 손을 못 뻗는다(certs/make_certs.sh 가 여기 한 벌 복사해 둔다).
  - name: ad-truststore
    files:
      - ad-ca.crt
    options:
      disableNameSuffixHash: true
  # oauth2-proxy 의 쿠키 열쇠. **32바이트여야 한다** —
  # 아니면 뜨다가 죽는다. 진짜로는 여기 적지 않고 밖에서 넣는다.
  - name: oauth2-proxy
    literals:
      - cookie-secret=lunch-demo-cookie-secret-0123456
    options:
      disableNameSuffixHash: true
