# 운영용 겹칠 것.
#
# base 에서 고치는 곳은 넷이다 — 벌 수, 판번호, 자원, 그리고
# 한 노드에 몰리지 않게 흩뿌리는 규칙.
# 주소는 base 의 것이 이미 운영 주소라 손대지 않는다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replicas:
  - name: lunch-web
    count: 3

images:
  - name: registry.campus.example/lunch/lunch-web
    newTag: 1.4.2

patches:
  - target:
      kind: Deployment
      name: lunch-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            memory: 256Mi
      # 한 대에 몰리지 않게 흩어 놓는다. 노드 하나가 죽어도
      # 나머지 두 벌이 살아 있어야 하기 때문이다.
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: lunch-web
