# 개발용 겹칠 것 — base 를 그대로 가져다 몇 군데만 고친다.
#
# base 를 복사해서 고치지 않는 것이 요점이다. 복사본은 반드시 어긋난다.
# 여기서는 "무엇이 다른가" 만 적으므로, 그 차이가 곧 문서가 된다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# 개발에서는 한 벌이면 된다.
replicas:
  - name: lunch-web
    count: 1

# 이미지 판번호만 바꾼다. 이름은 base 의 것을 찾아 쓴다.
images:
  - name: registry.campus.example/lunch/lunch-web
    newTag: 1.4.2-dev

patches:
  - target:
      kind: Ingress
      name: lunch-web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: lunch.dev.campus.example
      - op: replace
        path: /spec/tls/0/hosts/0
        value: lunch.dev.campus.example
  - target:
      kind: Deployment
      name: lunch-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/1
        value: -self=https://lunch.dev.campus.example
      - op: replace
        path: /spec/template/spec/containers/0/args/2
        value: -issuer=https://sso.dev.campus.example/realms/campus
