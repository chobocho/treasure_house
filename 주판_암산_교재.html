<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- deck-bookmark: 덱 엔진이 replaceState로 주소를 바꾸기 전에 진입 해시를 잡아둔다 -->
<script>window.__deckInitHash=location.hash;</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>주판으로 키우는 암산력 — 150페이지 완성 교재</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#1a1f2e; touch-action:manipulation; }
  body { font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; }

  /* ===== 고정 비율 무대(1280x800) : 화면에 맞춰 자동 축소 → 어떤 화면에서도 짤림 없음 ===== */
  #stage {
    position:absolute; left:50%; top:50%;
    width:1280px; height:800px;
    transform-origin:center center;
    background:#fdfaf3;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    overflow:hidden;
  }
  #progress { position:absolute; top:0; left:0; height:6px; background:linear-gradient(90deg,#e8763a,#d4452f); z-index:50; transition:width .3s; border-radius:0 3px 3px 0; }

  /* ===== 슬라이드 ===== */
  .slide { position:absolute; inset:0; display:flex; flex-direction:column; animation:slidein .35s ease; }
  @keyframes slidein { from { opacity:0; transform:translateX(28px); } to { opacity:1; transform:none; } }
  .shead {
    flex:0 0 auto; display:flex; align-items:center; gap:14px;
    padding:20px 36px 10px 36px;
  }
  .sectag {
    font-size:17px; font-weight:700; color:#fff; padding:5px 16px; border-radius:20px;
    background:var(--secColor,#8a6d3b); letter-spacing:.5px; white-space:nowrap;
  }
  .stitle { font-size:36px; font-weight:800; color:#3b2f1e; }
  .sbody { flex:1 1 auto; padding:8px 40px 14px 40px; overflow:hidden; position:relative; }
  .sfoot {
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:8px 36px 58px 36px; color:#9a8c72; font-size:16px;
  }
  .pageno { font-weight:700; color:#7a6a4d; }

  h3.bh { font-size:26px; color:#a3502c; margin:10px 0 8px; }
  p.bp { font-size:21px; line-height:1.55; color:#3d3526; margin:6px 0; }
  .hl { color:#c0392b; font-weight:800; }
  .hlb { color:#1f618d; font-weight:800; }

  .box { background:#fff; border:2px solid #e5d9bd; border-radius:14px; padding:16px 20px; margin:10px 0; }
  .tipbox { background:#fff7e0; border:2px solid #f0c94a; border-radius:14px; padding:12px 18px; font-size:19px; color:#6b5413; margin:10px 0; line-height:1.5; }
  .formula { font-size:30px; font-weight:800; color:#1f618d; text-align:center; padding:10px; background:#eef5fb; border-radius:12px; margin:8px 0; }
  .center { text-align:center; }
  .row { display:flex; gap:18px; align-items:flex-start; }
  .col { flex:1; }

  /* ===== 주판 ===== */
  .abwrap { display:inline-block; vertical-align:top; }
  .abacus {
    position:relative; background:linear-gradient(160deg,#9c6b3c,#7a4f28);
    border-radius:12px; padding:12px; box-shadow:inset 0 0 14px rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.25);
  }
  .ab-inner { position:relative; display:flex; gap:4px; background:#5d3c1d; border-radius:8px; padding:0 4px; }
  .rod { position:relative; width:46px; height:232px; }
  .rodline { position:absolute; left:50%; top:0; width:5px; height:100%; margin-left:-2.5px; background:linear-gradient(90deg,#caa46a,#8d6a3a); border-radius:2px; }
  .abbar { position:absolute; left:0; right:0; height:9px; background:linear-gradient(180deg,#3a2410,#241405); z-index:5; border-radius:3px; }
  .abdot { position:absolute; width:7px; height:7px; border-radius:50%; background:#f4e6c8; z-index:6; }
  .bead {
    position:absolute; left:2px; width:42px; height:27px; border-radius:14px / 13px;
    background:radial-gradient(ellipse at 32% 30%, #f2b066, #b05f1e 65%, #7e3f10);
    box-shadow:0 2px 4px rgba(0,0,0,.45);
    transition:top .16s ease; z-index:4; cursor:default;
  }
  .interactive .bead { cursor:pointer; }
  .bead.on { background:radial-gradient(ellipse at 32% 30%, #ffd27a, #d97a18 65%, #9c4d08); box-shadow:0 0 10px rgba(255,180,60,.7), 0 2px 4px rgba(0,0,0,.45); }
  .ab-digits { display:flex; gap:4px; padding:6px 4px 0; }
  .ab-digits span { width:46px; text-align:center; font-size:20px; font-weight:800; color:#ffe9bd; }
  .ab-caption { text-align:center; font-size:18px; font-weight:700; color:#5d4a2a; margin-top:6px; }

  /* ===== 연습문제 ===== */
  .drillgrid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-top:6px; }
  .drillgrid.c4 { grid-template-columns:repeat(4,1fr); }
  .prob {
    background:#fff; border:2px solid #dccfae; border-radius:12px; padding:8px 10px 10px;
    text-align:center;
  }
  .prob .pidx { font-size:16px; font-weight:800; color:#fff; background:#b08948; border-radius:50%; width:26px; height:26px; line-height:26px; display:inline-block; margin-bottom:4px; }
  .prob .nums { font-size:25px; font-weight:700; color:#2e2616; font-variant-numeric:tabular-nums; line-height:1.32; text-align:right; padding:0 16px; }
  .prob .nums .neg { color:#c0392b; }
  .prob hr { border:none; border-top:2.5px solid #6b5836; margin:5px 8px; }
  .prob .ans { font-size:26px; font-weight:800; color:#1e7e34; min-height:34px; visibility:hidden; }
  .show-ans .ans { visibility:visible; animation:pop .25s; }
  @keyframes pop { from { transform:scale(.6); opacity:0; } }

  .mentalgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px 30px; margin-top:8px; }
  .mrow { display:flex; align-items:baseline; gap:8px; font-size:25px; font-weight:700; color:#2e2616; background:#fff; border:2px solid #dccfae; border-radius:10px; padding:8px 14px; }
  .mrow .midx { font-size:16px; color:#b08948; font-weight:800; min-width:30px; }
  .mrow .expr { flex:1; font-variant-numeric:tabular-nums; letter-spacing:.5px; }
  .mrow .ans { color:#1e7e34; font-weight:800; min-width:60px; text-align:right; }

  .ansbtn {
    font-size:19px; font-weight:800; color:#fff; background:#2f8f46; border:none; border-radius:24px;
    padding:9px 26px; cursor:pointer; box-shadow:0 3px 0 #1d6330;
  }
  .ansbtn:active { transform:translateY(2px); box-shadow:none; }

  /* ===== 단계별 예시 ===== */
  .steps { display:flex; gap:14px; justify-content:center; align-items:flex-start; flex-wrap:nowrap; margin-top:6px; }
  .stepcell { text-align:center; }
  .steparrow { font-size:40px; color:#c0703a; align-self:center; padding-top:60px; }

  /* ===== 위젯 공통 ===== */
  .wbtn {
    font-size:20px; font-weight:800; color:#fff; background:#d4452f; border:none; border-radius:12px;
    padding:10px 24px; cursor:pointer; box-shadow:0 3px 0 #95291a; margin:4px;
  }
  .wbtn.blue { background:#2471a3; box-shadow:0 3px 0 #174e70; }
  .wbtn:active { transform:translateY(2px); box-shadow:none; }
  .winput {
    font-size:26px; font-weight:800; width:150px; padding:8px 12px; border:3px solid #b08948; border-radius:10px;
    text-align:center; color:#2e2616; background:#fff;
  }
  select.wsel { font-size:19px; font-weight:700; padding:7px 10px; border:2px solid #b08948; border-radius:9px; background:#fff; color:#3d3526; }
  .feedback { font-size:26px; font-weight:800; min-height:38px; margin-top:8px; }
  .fb-ok { color:#1e7e34; } .fb-no { color:#c0392b; }

  /* ===== 플래시 암산 ===== */
  .flashdisp {
    height:300px; display:flex; align-items:center; justify-content:center;
    background:#202840; color:#ffe28a; border-radius:18px; margin:8px 0;
    font-size:150px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:4px;
  }
  .flashctl { display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap; font-size:19px; color:#3d3526; font-weight:700; }

  /* ===== 표 ===== */
  table.nice { border-collapse:collapse; margin:8px auto; background:#fff; }
  table.nice th, table.nice td { border:2px solid #cdbb92; padding:8px 18px; font-size:23px; text-align:center; color:#3d3526; }
  table.nice th { background:#f3e7c8; font-weight:800; }
  table.nice td.em { color:#c0392b; font-weight:800; }

  /* ===== 내비게이션 ===== */
  #navbar {
    position:absolute; bottom:0; left:0; right:0; height:52px; z-index:60;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:linear-gradient(180deg, rgba(59,47,30,.92), rgba(40,31,18,.96));
  }
  .nbtn {
    font-size:19px; font-weight:800; color:#ffe9bd; background:rgba(255,255,255,.12);
    border:1px solid rgba(255,233,189,.35); border-radius:10px; padding:7px 18px; cursor:pointer;
  }
  .nbtn:active { background:rgba(255,255,255,.28); }
  #pginfo { color:#ffe9bd; font-size:19px; font-weight:800; min-width:120px; text-align:center; cursor:pointer; }

  /* ===== 목차 오버레이 ===== */
  #tocOverlay {
    position:absolute; inset:0; background:rgba(26,21,12,.96); z-index:100; display:none;
    padding:36px 60px; color:#f3e7c8; overflow:hidden;
  }
  #tocOverlay h2 { font-size:34px; margin-bottom:18px; color:#ffd27a; }
  .tocgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px 40px; }
  .tocitem {
    display:flex; justify-content:space-between; font-size:22px; font-weight:700; cursor:pointer;
    padding:10px 16px; border-radius:10px; background:rgba(255,255,255,.06);
  }
  .tocitem:active, .tocitem:hover { background:rgba(255,210,122,.22); }
  .tocclose { position:absolute; top:24px; right:34px; font-size:30px; color:#ffd27a; cursor:pointer; background:none; border:none; }

  /* 표지/수료증 */
  .cover { background:linear-gradient(150deg,#2c3e50 0%, #4a2c12 100%); color:#fff; }
  .cover .stitle, .cover p.bp { color:#fff; }
  .bigtitle { font-size:64px; font-weight:900; color:#ffd27a; text-shadow:0 4px 14px rgba(0,0,0,.5); line-height:1.25; }
  .cert {
    border:10px double #b08948; border-radius:16px; background:#fffdf4; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px;
  }

  /* 모바일·폴드(≤760px): 고정 슬라이드 본문이 잘리지 않도록 스크롤 허용 + 좌우 여백 축소 */
  @media(max-width:760px){
    .shead{padding:14px 16px 8px}
    .sbody{padding:8px 16px 14px;overflow:auto}
    .sfoot{padding:8px 16px 54px}
    .stitle{font-size:27px}
  }
</style>

<body>
<div id="stage">
  <div id="progress"></div>
  <div id="slideHost"></div>
  <div id="navbar">
    <button class="nbtn" id="btnFirst">⏮</button>
    <button class="nbtn" id="btnPrev">◀ 이전</button>
    <div id="pginfo">1 / 150</div>
    <button class="nbtn" id="btnNext">다음 ▶</button>
    <button class="nbtn" id="btnLast">⏭</button>
    <button class="nbtn" id="btnToc">목차</button>
    <button class="nbtn" id="btnFull">⛶</button>
  </div>
  <div id="tocOverlay">
    <button class="tocclose" id="tocClose">✕ 닫기</button>
    <h2>📖 목차</h2>
    <div class="tocgrid" id="tocList"></div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   주판으로 키우는 암산력 — 150페이지 인터랙티브 교재
   ============================================================ */

// ---------- 유틸 ----------
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function ri(r, min, max){ return min + Math.floor(r() * (max - min + 1)); }
function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function fmt(n){ return n.toLocaleString('ko-KR'); }
const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];

// ---------- 주판 위젯 ----------
// value: 표시할 수, rods: 자릿수(막대 수), interactive: 클릭 가능, scale: 크기 배율
function makeAbacus(opts){
  opts = opts || {};
  const rods = opts.rods || Math.max(3, String(Math.abs(opts.value||0)).length);
  const scale = opts.scale || 1;
  const interactive = !!opts.interactive;
  const showDigits = opts.showDigits !== false;

  const wrap = el('div', 'abwrap');
  const ab = el('div', 'abacus' + (interactive ? ' interactive' : ''));
  const inner = el('div', 'ab-inner');
  ab.appendChild(inner);

  const RODW = 46, GAP = 4, RODH = 232, BARY = 66;
  const digits = new Array(rods).fill(0); // 왼쪽부터

  const beadRefs = []; // [rod][ {heaven, earth:[..4]} ]
  for (let i = 0; i < rods; i++){
    const rod = el('div', 'rod');
    rod.appendChild(el('div', 'rodline'));
    const heaven = el('div', 'bead');
    rod.appendChild(heaven);
    const earth = [];
    for (let j = 0; j < 4; j++){
      const b = el('div', 'bead');
      rod.appendChild(b);
      earth.push(b);
    }
    beadRefs.push({ heaven, earth });
    if (interactive){
      heaven.addEventListener('click', () => {
        digits[i] = (digits[i] >= 5) ? digits[i] - 5 : digits[i] + 5;
        refresh();
      });
      earth.forEach((b, j) => {
        b.addEventListener('click', () => {
          const k = digits[i] % 5;
          const nk = (j < k) ? j : j + 1;
          digits[i] = Math.floor(digits[i] / 5) * 5 + nk;
          refresh();
        });
      });
    }
    inner.appendChild(rod);
  }
  // 가로 가름대 + 자리점(오른쪽에서 3자리마다)
  const bar = el('div', 'abbar');
  bar.style.top = BARY + 'px';
  inner.appendChild(bar);
  for (let i = 0; i < rods; i++){
    const fromRight = rods - 1 - i;
    if (fromRight % 3 === 0){
      const dot = el('div', 'abdot');
      dot.style.top = (BARY + 1) + 'px';
      dot.style.left = (4 + i * (RODW + GAP) + RODW / 2 - 3.5) + 'px';
      inner.appendChild(dot);
    }
  }

  let digitRow = null;
  if (showDigits){
    digitRow = el('div', 'ab-digits');
    for (let i = 0; i < rods; i++) digitRow.appendChild(el('span', '', '0'));
    ab.appendChild(digitRow);
  }

  function refresh(){
    for (let i = 0; i < rods; i++){
      const d = digits[i];
      const h = d >= 5, k = d % 5;
      const { heaven, earth } = beadRefs[i];
      heaven.classList.toggle('on', h);
      heaven.style.top = (h ? 38 : 4) + 'px';
      for (let j = 0; j < 4; j++){
        const on = j < k;
        earth[j].classList.toggle('on', on);
        earth[j].style.top = (on ? (80 + j * 28) : (200 - (3 - j) * 28)) + 'px';
      }
      if (digitRow) digitRow.children[i].textContent = d;
    }
    if (wrap._onchange) wrap._onchange(getValue());
  }
  function setValue(v){
    v = Math.max(0, Math.floor(v));
    for (let i = rods - 1; i >= 0; i--){ digits[i] = v % 10; v = Math.floor(v / 10); }
    refresh();
  }
  function getValue(){ return digits.reduce((a, d) => a * 10 + d, 0); }

  wrap.setValue = setValue;
  wrap.getValue = getValue;
  wrap.appendChild(ab);
  if (opts.caption) wrap.appendChild(el('div', 'ab-caption', opts.caption));
  setValue(opts.value || 0);

  if (scale !== 1){
    // transform은 레이아웃에 영향이 없으므로 외곽 크기를 직접 지정
    const w = rods * (RODW + GAP) + 4 + 24;
    const h = RODH + 24 + (showDigits ? 32 : 0) + (opts.caption ? 30 : 0);
    const outer = el('div', 'abwrap');
    outer.style.width = (w * scale) + 'px';
    outer.style.height = (h * scale) + 'px';
    wrap.style.transformOrigin = 'top left';
    wrap.style.transform = 'scale(' + scale + ')';
    outer.appendChild(wrap);
    outer.setValue = setValue; outer.getValue = getValue;
    return outer;
  }
  return wrap;
}

// ---------- 가감산 문제 생성기 ----------
// 한 단계의 기법 분류: '0' 직접 / '5' 5의 보수 / '10' 10의 보수
function addClass(total, d){
  const c = total % 10;
  if (c + d > 9) return '10';
  if ((c % 5) + (d % 5) <= 4 && Math.floor(c / 5) + Math.floor(d / 5) <= 1) return '0';
  return '5';
}
function subClass(total, d){
  const c = total % 10;
  if (c - d < 0) return '10';
  if ((c % 5) >= (d % 5) && Math.floor(c / 5) >= Math.floor(d / 5)) return '0';
  return '5';
}
// cfg: {five, ten, need, maxTotal}
function genSeq(r, len, cfg){
  for (let t = 0; t < 400; t++){
    let total = ri(r, 1, Math.min(9, cfg.maxTotal));
    const nums = [total];
    const used = { '5': false, '10': false };
    let ok = true;
    for (let i = 1; i < len; i++){
      const cands = [];
      for (let d = 1; d <= 9; d++){
        for (const sgn of [1, -1]){
          const nt = total + sgn * d;
          if (nt < 0 || nt > cfg.maxTotal) continue;
          const cls = sgn > 0 ? addClass(total, d) : subClass(total, d);
          if (cls === '5' && !cfg.five) continue;
          if (cls === '10' && !cfg.ten) continue;
          cands.push({ d: sgn * d, nt, cls });
        }
      }
      if (!cands.length){ ok = false; break; }
      const p = cands[ri(r, 0, cands.length - 1)];
      nums.push(p.d); total = p.nt;
      if (p.cls !== '0') used[p.cls] = true;
    }
    if (!ok) continue;
    if (cfg.need && !used[cfg.need]) continue;
    if (total === 0 && r() < 0.8) continue; // 답 0은 가끔만
    return { nums, ans: nums.reduce((a, b) => a + b, 0) };
  }
  return { nums: [2, 1, 1, 3], ans: 7 }; // 안전망
}
// 두/세 자리 가감산
function genBig(r, len, lo, hi){
  const nums = [ri(r, lo, hi)];
  let total = nums[0];
  for (let i = 1; i < len; i++){
    let d = ri(r, lo, hi);
    let sgn = (r() < 0.42 && total - d >= 0) ? -1 : 1;
    nums.push(sgn * d); total += sgn * d;
  }
  return { nums, ans: total };
}

// ---------- 슬라이드 공통 틀 ----------
let SECTIONS = [];
function addSection(title, color, builders){
  SECTIONS.push({ title, color, builders });
}
function chrome(sec, pageIdx, bodyEl, opts){
  opts = opts || {};
  const s = el('div', 'slide');
  s.style.setProperty('--secColor', sec.color);
  if (opts.coverStyle) s.classList.add('cover');
  const head = el('div', 'shead');
  head.appendChild(el('span', 'sectag', sec.title));
  if (opts.title) head.appendChild(el('span', 'stitle', opts.title));
  s.appendChild(head);
  const body = el('div', 'sbody');
  body.appendChild(bodyEl);
  s.appendChild(body);
  const foot = el('div', 'sfoot');
  const left = el('span', '', opts.footLeft || '주판으로 키우는 암산력');
  const right = el('span', 'pageno', (pageIdx + 1) + ' / ' + TOTAL);
  foot.appendChild(left); foot.appendChild(right);
  if (opts.ansToggle){
    const btn = el('button', 'ansbtn', '✅ 정답 보기');
    btn.addEventListener('click', () => {
      const on = s.classList.toggle('show-ans');
      btn.innerHTML = on ? '🙈 정답 숨기기' : '✅ 정답 보기';
    });
    foot.insertBefore(btn, right);
  }
  s.appendChild(foot);
  return s;
}

// ---------- 페이지 템플릿들 ----------
// 세로(호산식) 연습 페이지
function drillPage(title, subtitle, problems, opts){
  opts = opts || {};
  return function(sec, idx){
    const body = el('div');
    if (subtitle) body.appendChild(el('p', 'bp', subtitle));
    const grid = el('div', 'drillgrid' + (opts.cols === 4 ? ' c4' : ''));
    problems.forEach((p, i) => {
      const cell = el('div', 'prob');
      cell.appendChild(el('div', 'pidx', CIRCLED[i] || (i + 1)));
      const nums = el('div', 'nums');
      nums.innerHTML = p.nums.map(n =>

// ---------- 타이머 정리(플래시 암산 등) ----------
const activeTimers = [];
function later(fn, ms){ const id = setTimeout(fn, ms); activeTimers.push(id); return id; }
function clearTimers(){ while (activeTimers.length) clearTimeout(activeTimers.pop()); }

// ---------- 플래시 암산 트레이너 ----------
function flashTrainer(opts){
  opts = opts || {};
  const root = el('div');
  const ctl = el('div', 'flashctl');
  ctl.innerHTML =
    '자릿수 <select class="wsel" data-k="dig"><option value="1">1자리</option><option value="2">2자리</option><option value="3">3자리</option></select>' +
    '개수 <select class="wsel" data-k="cnt"><option>3</option><option>5</option><option>7</option><option>10</option><option>15</option></select>' +
    '속도 <select class="wsel" data-k="spd"><option value="2000">느리게(2초)</option><option value="1200">보통(1.2초)</option><option value="800">빠르게(0.8초)</option><option value="500">매우 빠르게(0.5초)</option><option value="300">달인(0.3초)</option></select>' +
    '<label style="font-weight:700"><input type="checkbox" data-k="sub"> 빼기 포함</label>';
  root.appendChild(ctl);
  const disp = el('div', 'flashdisp', '준비!');
  root.appendChild(disp);
  const bar = el('div', 'center');
  const startBtn = el('button', 'wbtn', '▶ 시작');
  const ansIn = el('input', 'winput'); ansIn.type = 'number'; ansIn.placeholder = '답';
  ansIn.style.display = 'none';
  const okBtn = el('button', 'wbtn blue', '확인'); okBtn.style.display = 'none';
  const fb = el('div', 'feedback center');
  bar.appendChild(startBtn); bar.appendChild(ansIn); bar.appendChild(okBtn);
  root.appendChild(bar); root.appendChild(fb);

  const sel = k => ctl.querySelector('[data-k="' + k + '"]');
  if (opts.dig) sel('dig').value = String(opts.dig);
  if (opts.cnt) sel('cnt').value = String(opts.cnt);
  if (opts.spd) sel('spd').value = String(opts.spd);

  let answer = 0, running = false;
  startBtn.addEventListener('click', () => {
    if (running) return;
    running = true;
    fb.textContent = ''; ansIn.style.display = 'none'; okBtn.style.display = 'none'; ansIn.value = '';
    const dig = +sel('dig').value, cnt = +sel('cnt').value, spd = +sel('spd').value;
    const useSub = sel('sub').checked;
    const lo = dig === 1 ? 1 : Math.pow(10, dig - 1);
    const hi = Math.pow(10, dig) - 1;
    const seq = []; let total = 0;
    for (let i = 0; i < cnt; i++){
      let n = lo + Math.floor(Math.random() * (hi - lo + 1));
      if (useSub && i > 0 && Math.random() < 0.4 && total - n >= 0) n = -n;
      seq.push(n); total += n;
    }
    answer = total;
    let i = -1;
    disp.style.fontSize = dig === 3 ? '120px' : '150px';
    function tick(){
      i++;
      if (i >= seq.length){
        disp.textContent = '= ?';
        ansIn.style.display = ''; okBtn.style.display = ''; ansIn.focus();
        running = false;
        return;
      }
      const n = seq[i];
      disp.textContent = (i > 0 && n >= 0 ? '+' : '') + n;
      disp.style.color = n < 0 ? '#ff9a8a' : '#ffe28a';
      later(() => { disp.textContent = ''; later(tick, 120); }, spd);
    }
    disp.textContent = '3';
    later(() => { disp.textContent = '2';
      later(() => { disp.textContent = '1';
        later(tick, 600); }, 600); }, 600);
  });
  function check(){
    if (ansIn.value === '') return;
    if (+ansIn.value === answer){
      fb.className = 'feedback center fb-ok'; fb.textContent = '🎉 정답! ' + fmt(answer);
    } else {
      fb.className = 'feedback center fb-no'; fb.textContent = '아쉬워요. 정답은 ' + fmt(answer) + ' (입력: ' + ansIn.value + ')';
    }
  }
  okBtn.addEventListener('click', check);
  ansIn.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  return root;
}

// ---------- 읽기 퀴즈 / 놓기 퀴즈 ----------
function readQuiz(maxVal, rods){
  const root = el('div', 'center');
  const holder = el('div');
  root.appendChild(holder);
  const bar = el('div');
  const input = el('input', 'winput'); input.type = 'number'; input.placeholder = '얼마일까요?';
  const okBtn = el('button', 'wbtn blue', '확인');
  const nextBtn = el('button', 'wbtn', '다음 문제 ▶');
  const fb = el('div', 'feedback');
  bar.appendChild(input); bar.appendChild(okBtn); bar.appendChild(nextBtn);
  root.appendChild(bar); root.appendChild(fb);
  let answer = 0, score = 0, tries = 0;
  function newQ(){
    answer = 1 + Math.floor(Math.random() * maxVal);
    holder.innerHTML = '';
    holder.appendChild(makeAbacus({ value: answer, rods, scale: 0.95, showDigits: false }));
    input.value = ''; fb.textContent = '';
  }
  okBtn.addEventListener('click', () => {
    if (input.value === '') return;
    tries++;
    if (+input.value === answer){ score++; fb.className = 'feedback fb-ok'; fb.textContent = '⭕ 정답! (' + score + '/' + tries + ')'; }
    else { fb.className = 'feedback fb-no'; fb.textContent = '❌ 정답은 ' + answer + ' (' + score + '/' + tries + ')'; }
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') okBtn.click(); });
  nextBtn.addEventListener('click', newQ);
  newQ();
  return root;
}
function setQuiz(maxVal, rods){
  const root = el('div', 'center');
  const target = el('div', '', '');
  target.style.cssText = 'font-size:44px;font-weight:900;color:#1f618d;margin-bottom:4px;';
  root.appendChild(target);
  const ab = makeAbacus({ value: 0, rods, scale: 0.95, interactive: true });
  root.appendChild(ab);
  const okBtn = el('button', 'wbtn blue', '확인');
  const nextBtn = el('button', 'wbtn', '다음 문제 ▶');
  const fb = el('div', 'feedback');
  root.appendChild(el('div')).append(okBtn, nextBtn);
  root.appendChild(fb);
  let answer = 0;
  function newQ(){
    answer = 1 + Math.floor(Math.random() * maxVal);
    target.textContent = '👉 ' + fmt(answer) + ' 을(를) 주판에 놓아 보세요';
    ab.setValue(0); fb.textContent = '';
  }
  okBtn.addEventListener('click', () => {
    if (ab.getValue() === answer){ fb.className = 'feedback fb-ok'; fb.textContent = '⭕ 완벽해요!'; }
    else { fb.className = 'feedback fb-no'; fb.textContent = '❌ 지금 주판은 ' + fmt(ab.getValue()) + ' 이에요. 다시!'; }
  });
  nextBtn.addEventListener('click', newQ);
  newQ();
  return root;
}

function tocSlide(sec, idx, half){
  const body = el('div');
  const list = el('div', 'tocgrid');
  const items = SECTIONS.map((s, i) => ({ s, i })).filter(x => x.i > 0);
  const part = half === 0 ? items.slice(0, Math.ceil(items.length / 2)) : items.slice(Math.ceil(items.length / 2));
  part.forEach(({ s }) => {
    const it = el('div', 'tocitem');
    it.style.cssText = 'background:#fff;border:2px solid #dccfae;color:#3d3526;';
    it.innerHTML = '<span>' + s.title + '</span><span style="color:#a3502c">' + s.startPage + 'p</span>';
    it.addEventListener('click', () => goTo(s.startPage - 1));
    list.appendChild(it);
  });
  body.appendChild(el('p', 'bp', half === 0 ? '제목을 누르면 해당 단원으로 바로 이동해요.' : '후반부 — 곱셈·나눗셈을 지나 암산의 세계로!'));
  body.appendChild(list);
  return chrome(sec, idx, body, { title: '목차 ' + (half + 1) + ' / 2' });
}

/* ============================================================
   렌더링 / 내비게이션
   ============================================================ */
let TOTAL = 0;
const SLIDES = [];
SECTIONS.forEach(sec => {
  sec.startPage = SLIDES.length + 1;
  sec.builders.forEach(fn => SLIDES.push({ sec, fn }));
});
TOTAL = SLIDES.length;
if (TOTAL !== 150) console.warn('페이지 수: ' + TOTAL + ' (목표 150)');

const host = document.getElementById('slideHost');
const pginfo = document.getElementById('pginfo');
const progress = document.getElementById('progress');
let cur = Math.min(TOTAL - 1, Math.max(0, +(localStorage.getItem('abacus-book-page') || 0)));
const cache = {};

function render(){
  clearTimers();
  host.innerHTML = '';
  if (!cache[cur]) cache[cur] = SLIDES[cur].fn(SLIDES[cur].sec, cur);
  host.appendChild(cache[cur]);
  pginfo.textContent = (cur + 1) + ' / ' + TOTAL;
  progress.style.width = ((cur + 1) / TOTAL * 100) + '%';
  localStorage.setItem('abacus-book-page', cur);
}
window.__deckGo=function(i){goTo(i);};   /* 책갈피 이어보기 */
function goTo(i){
  cur = Math.min(TOTAL - 1, Math.max(0, i));
  document.getElementById('tocOverlay').style.display = 'none';
  render();
}
document.getElementById('btnPrev').addEventListener('click', () => goTo(cur - 1));
document.getElementById('btnNext').addEventListener('click', () => goTo(cur + 1));
document.getElementById('btnFirst').addEventListener('click', () => goTo(0));
document.getElementById('btnLast').addEventListener('click', () => goTo(TOTAL - 1));
document.getElementById('btnToc').addEventListener('click', showToc);
document.getElementById('pginfo').addEventListener('click', showToc);
document.getElementById('tocClose').addEventListener('click', () => {
  document.getElementById('tocOverlay').style.display = 'none';
});
document.getElementById('btnFull').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
});
function showToc(){
  const list = document.getElementById('tocList');
  list.innerHTML = '';
  SECTIONS.forEach(sec => {
    const it = el('div', 'tocitem');
    it.innerHTML = '<span>' + sec.title + '</span><span style="color:#ffd27a">' + sec.startPage + 'p</span>';
    it.addEventListener('click', () => goTo(sec.startPage - 1));
    list.appendChild(it);
  });
  document.getElementById('tocOverlay').style.display = 'block';
}

// 키보드
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') goTo(cur + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') goTo(cur - 1);
  else if (e.key === 'Home') goTo(0);
  else if (e.key === 'End') goTo(TOTAL - 1);
});
// 스와이프 (인터랙티브 요소 위에서는 무시)
let tx = null, ty = null;
document.addEventListener('touchstart', e => {
  if (e.target.closest('input,button,select,.abacus,.flashdisp')) { tx = null; return; }
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) goTo(cur + (dx < 0 ? 1 : -1));
  tx = null;
}, { passive: true });

// ===== 화면 맞춤 (폴드 커버/메인 화면 모두 짤림 없이) =====
const stage = document.getElementById('stage');
function fit(){
  const vw = (window.visualViewport ? window.visualViewport.width : window.innerWidth);
  const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  const s = Math.min(vw / 1280, vh / 800) * 0.985;
  stage.style.left = (vw / 2) + 'px';
  stage.style.top = (vh / 2) + 'px';
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
fit();
render();
</script>
<!-- ===== deck-input-shim v1 : 방향키(↑↓ 스크롤 / ←→ 페이지) + 게임패드 ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckInputShim) return;
  window.__deckInputShim = true;

  /* ---------- 지금 보이는 슬라이드의 스크롤 컨테이너 찾기 ---------- */
  function scrollableAt(x, y) {
    if (!document.elementFromPoint) return null;
    var n = document.elementFromPoint(x, y);
    while (n && n !== document.documentElement) {
      var oy = getComputedStyle(n).overflowY;
      if ((oy === 'auto' || oy === 'scroll' || oy === 'overlay') &&
          n.scrollHeight - n.clientHeight > 4) return n;
      n = n.parentElement;
    }
    return null;
  }
  function scroller() {
    var el = scrollableAt(innerWidth / 2, innerHeight / 2) ||
             scrollableAt(innerWidth / 2, innerHeight * 0.35);
    if (el) return el;
    var m = document.querySelector('main');
    if (m && m.scrollHeight - m.clientHeight > 4) return m;
    return document.scrollingElement || document.documentElement;
  }
  function viewH(el) {
    return (el === document.scrollingElement || el === document.documentElement)
      ? innerHeight : el.clientHeight;
  }
  function isPageScroller(el) {
    return el === document.scrollingElement || el === document.documentElement || el === document.body;
  }
  function scrollStep(dir, smooth) {
    var el = scroller();
    el.scrollBy({ top: dir * Math.max(80, viewH(el) * 0.25),
                  left: 0, behavior: smooth ? 'smooth' : 'auto' });
  }

  /* ---------- 페이지 이동 (덱마다 다른 엔진에 공통으로 붙는다) ---------- */
  function pick(ids) {
    for (var i = 0; i < ids.length; i++) {
      var e = document.getElementById(ids[i]);
      if (e && (e.tagName === 'BUTTON' || e.tagName === 'A')) return e;

      if (down(g, 14)) ax -= 1;
      if (down(g, 13)) ay += 1;
      if (down(g, 12)) ay -= 1;

      bPrev = bPrev || down(g, 1) || down(g, 4) || down(g, 6);

  addEventListener('focus', function () { if (pads().length) start(); });

  /* 딥링크로 열었으면 안내하지 않는다.
     이때 location.hash는 못 쓴다 — 덱 엔진 대부분이 첫 장을 그리면서
     history.replaceState('#top')로 주소를 먼저 바꿔 놓기 때문에, 이 셸이
     도는 시점에는 늘 해시가 있는 것처럼 보인다(v1이 안내를 못 띄우던 원인).
     그래서 <head>에서 미리 잡아둔 진입 해시를 쓰고, 없으면 내비게이션
     타이밍의 원래 주소를 본다. */
  function openedWithHash() {
    if (typeof window.__deckInitHash === 'string') return window.__deckInitHash.length > 1;
    try {
      var e = performance.getEntriesByType('navigation')[0];
      if (e && e.name) return new URL(e.name).hash.length > 1;
    } catch (x) {}
    return !!location.hash;
  }
  function initHash() {
    if (typeof window.__deckInitHash === 'string' && window.__deckInitHash) return window.__deckInitHash;
    try {
      var e = performance.getEntriesByType('navigation')[0];
      if (e && e.name) return new URL(e.name).hash;
    } catch (x) {}
    return location.hash;
  }

  if (!openedWithHash()) {
    load(FILE).then(function (rec) {
      if (!rec) return;
      var worth = rec.kind === 'slide' ? rec.page > 1 : rec.scrollY > 200;
      if (!worth) return;
      // 덱이 스스로 지난 쪽을 복원해 이미 그 자리라면(주판 암산 교재 등) 굳이 묻지 않는다
      var now = snap();
      if (now.kind === rec.kind && rec.kind === 'slide' && now.page === rec.page) return;
      toast(rec);
    }).catch(function () {});
  } else {
    /* 포털의 🔖 링크처럼 '#s42'로 들어왔는데 엔진이 해시를 안 듣는 덱(한 장씩
       그려내는 6종)은 1쪽에 머문다 — 안내도 안 뜨니 그 쪽으로 옮겨준다. */
    var m = /^#s?(\d+)$/.exec(initHash() || '');
    if (m) setTimeout(function () {
      var v = slides() ? null : vpage();
      if (v && +m[1] >= 1 && +m[1] <= v.total && v.page !== +m[1])
        vjump({ page: +m[1], hash: initHash() });
    }, 250);
  }
})();
</script>
</body>
</html>
