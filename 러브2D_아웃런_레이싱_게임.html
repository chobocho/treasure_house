    local side = (i%2==0) and -1 or 1
    local off  = 1.4 + (i%3)*0.6
    segments[i].sprites[#segments[i].sprites+1] =
      { offset = side*off, kind = (i%4==0) and 'palm' or 'tree' }
  end
  cars = {}                                   -- 교통 차량 20대
  for i=1,20 do
    local seg = math.random(20, #segments-20)
    cars[i] = { offset=(math.random()*2-1)*0.7, z=seg*SEG_LEN,
                speed=MAX_SPEED*(0.25+math.random()*0.35),
                color=rgb(math.random(80,255),math.random(80,255),math.random(80,255)) }
    segments[seg].cars[#segments[seg].cars+1] = cars[i]
  end
end</pre>
<p>출발·도착선 색을 칠하고, 5칸마다 좌우로 나무를, 무작위 위치에 교통 차량 20대를 세그먼트에 부착합니다.</p>`},

{t:'⑥ 렌더 헬퍼 — quad / fog / mix', k:'CODE', h:`
<pre class="code" data-lang="lua">local function quad(x1,y1,x2,y2,x3,y3,x4,y4,col)
  love.graphics.setColor(col)
  love.graphics.polygon('fill', x1,y1, x2,y2, x3,y3, x4,y4)
end

local function fog(d, density)      -- d: 0(가까움)~1(멂)
  return math.exp(-density * d * d)
end
local function mix(a,b,t)           -- 두 색 선형 보간
  return { a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t, a[3]+(b[3]-a[3])*t }
end</pre>
<p>세 개의 작은 도구입니다. <b>quad</b> 는 색 채운 사각형, <b>fog</b> 는 안개량, <b>mix</b> 는 색 섞기. 렌더링 전체가 이 셋의 조합입니다.</p>`},

{t:'⑥ 렌더 헬퍼 — renderSegment', k:'CODE', h:`
<pre class="code" data-lang="lua">local function renderSegment(seg, fogAmt)
  local c = seg.color
  local p1,p2 = seg.p1.screen, seg.p2.screen
  local grass = fogAmt&lt;1 and mix(SKY_BOT,c.grass,fogAmt) or c.grass
  quad(0,p1.y, W,p1.y, W,p2.y, 0,p2.y, grass)              -- 잔디
  local r1,r2 = p1.w/6, p2.w/6                             -- 럼블
  quad(p1.x-p1.w-r1,p1.y, p1.x-p1.w,p1.y, p2.x-p2.w,p2.y, p2.x-p2.w-r2,p2.y, mix(SKY_BOT,c.rumble,fogAmt))
  quad(p1.x+p1.w+r1,p1.y, p1.x+p1.w,p1.y, p2.x+p2.w,p2.y, p2.x+p2.w+r2,p2.y, mix(SKY_BOT,c.rumble,fogAmt))
  quad(p1.x-p1.w,p1.y, p1.x+p1.w,p1.y, p2.x+p2.w,p2.y, p2.x-p2.w,p2.y, mix(SKY_BOT,c.road,fogAmt))  -- 도로
  if c.lane then                                           -- 차선
    for l=1,LANES-1 do
      local lx1 = p1.x - p1.w + (p1.w*2)*(l/LANES)
      local lx2 = p2.x - p2.w + (p2.w*2)*(l/LANES)
      quad(lx1-p1.w*0.02,p1.y, lx1+p1.w*0.02,p1.y, lx2+p2.w*0.02,p2.y, lx2-p2.w*0.02,p2.y, mix(SKY_BOT,c.lane,fogAmt))
    end
  end
end</pre>
<p>잔디→럼블→도로→차선 순으로 사각형을 겹쳐 세그먼트 하나를 완성합니다. 모든 색에 <span class="reg">mix(SKY_BOT, ..., fogAmt)</span> 로 안개가 입혀집니다.</p>`},

{t:'⑦ 스프라이트/차 그리기', k:'CODE', h:`
<pre class="code" data-lang="lua">-- 도로와 같은 월드→화면 계수에 비례 (원근 일치)
local function spriteBase(scale) return scale*ROAD_W*W/2 end

local function drawTree(cx, baseY, scale, fogAmt)
  local h = spriteBase(scale)*1.2
  if h &lt; 2 then return end                 -- 너무 작으면 생략
  local trunkW = math.max(2, h*0.12)
  love.graphics.setColor(mix(SKY_BOT, rgb(70,45,30), fogAmt))
  love.graphics.rectangle('fill', cx-trunkW/2, baseY-h*0.35, trunkW, h*0.35)
  love.graphics.setColor(mix(SKY_BOT, rgb(18,120,60), fogAmt))
  love.graphics.polygon('fill', cx,baseY-h, cx-h*0.35,baseY-h*0.30, cx+h*0.35,baseY-h*0.30)
end
-- drawPalm(h=spriteBase*1.5), drawCar(wpx=spriteBase*0.55)도 같은 방식:
--   spriteBase 에 비례해 크기를 정하고, mix 로 안개를 입혀 그린다</pre>
<p>도로변 오브젝트는 모두 <b>빌보드</b> — 세그먼트의 <span class="reg">screen.scale</span> 에 비례해 크기를 정하는 납작한 그림입니다. 멀면 작게, 가까우면 크게 자동으로 스케일됩니다.</p>`},

{t:'⑧ 배경 drawBackground', k:'CODE', h:`
<pre class="code" data-lang="lua">local function drawBackground(baseCurve)
  local steps=40                                  -- 하늘 그라디언트
  for i=0,steps-1 do
    local t=i/steps
    love.graphics.setColor(mix(SKY_TOP,SKY_BOT,t))
    love.graphics.rectangle('fill', 0, H*0.62*t, W, H*0.62/steps+1)
  end
  love.graphics.setColor(1,0.78,0.30)             -- 태양
  love.graphics.circle('fill', W/2 - baseCurve*W*0.15, H*0.42, H*0.16)
  love.graphics.setColor(0.36,0.13,0.30)          -- 먼 산 실루엣
  local off = -baseCurve*W*0.25
  love.graphics.polygon('fill', 0,H*0.6, off+W*0.2,H*0.42, off+W*0.4,H*0.58,
                        off+W*0.6,H*0.40, off+W*0.85,H*0.56, W,H*0.46, W,H*0.62, 0,H*0.62)
end</pre>
<p>40단 그라디언트 하늘 + 태양 + 산 실루엣. 태양·산이 <span class="reg">baseCurve</span> 에 따라 옆으로 밀려 패럴랙스를 만듭니다.</p>`},

{t:'⑨ 메인 render() — 도로 루프', k:'CODE', h:`
<pre class="code" data-lang="lua">local function render()
  local baseSeg = findSegment(position)
  local basePercent = (position % SEG_LEN)/SEG_LEN
  local camH = CAM_HEIGHT + baseSeg.p1.world.y
    + (baseSeg.p2.world.y - baseSeg.p1.world.y)*basePercent
  local maxy = H
  local x, dx = 0, -(baseSeg.curve * basePercent)
  drawBackground(baseSeg.curve)

  for n=0,DRAW_DIST-1 do                       -- 앞→뒤 투영(가까이→멀리)
    local seg = segments[(baseSeg.index + n) % #segments + 1]
    local looped = seg.index &lt; baseSeg.index
    local camZ = position - (looped and trackLength or 0)
    local fogAmt = fog(n/DRAW_DIST, FOG_DENSITY)
    project(seg.p1, playerX*ROAD_W - x,      camH, camZ)
    project(seg.p2, playerX*ROAD_W - x - dx, camH, camZ)
    x = x + dx;  dx = dx + seg.curve           -- 곡률 누적</pre>
<p>핵심은 <em>x=x+dx; dx=dx+curve</em> — 곡률을 <b>두 번 누적</b>해 도로가 휘어 보이게 하는 부분입니다.</p>`},

{t:'⑨ render() — 클리핑 & 스프라이트', k:'CODE', h:`
<pre class="code" data-lang="lua">    local skipped = seg.p1.camera.z &lt;= CAM_DEPTH -- 카메라 뒤
       or seg.p2.screen.y &gt;= seg.p1.screen.y    -- 뒤집힘
       or seg.p2.screen.y &gt;= maxy               -- 이미 가려짐
    if not skipped then
      renderSegment(seg, fogAmt)
      maxy = seg.p2.screen.y                    -- 가림 경계 갱신
    end
    seg._fog = fogAmt
    seg._drawn = not skipped  -- 안 그려진 세그먼트는 스프라이트도 생략
  end
  -- 스프라이트·차량은 뒤→앞(painter)으로 그려 겹침 처리
  for n=DRAW_DIST-1,0,-1 do
    local seg = segments[(baseSeg.index + n) % #segments + 1]
    if seg._drawn then ... drawPalm/drawTree/drawCar ... end
  end
end</pre>
<p><span class="reg">maxy</span> 로 이미 그린 가장 높은 지점을 기억해, 언덕 뒤에 가려진 도로를 건너뜁니다. 이것이 <b>언덕 오클루전</b>의 정체입니다.</p>`},

{t:'⑩ drawPlayer / drawHUD', k:'CODE', h:`
<pre class="code" data-lang="lua">local function drawPlayer()
  local cx, by = W/2 + playerX*W*0.12, H*0.92
  local bounce = (speed&gt;0) and math.sin(position*0.02)*2 or 0
  by = by + bounce
  local w = H*0.20
  love.graphics.setColor(rgb(230,30,40))               -- 빨간 차체
  love.graphics.rectangle('fill', cx-w/2, by-w*0.55, w, w*0.55, w*0.10)
  -- 창문·바퀴 사각형들 …
end

local function drawHUD()
  love.graphics.setColor(1,1,1)
  local kmh = math.floor(speed/MAX_SPEED*300)
  love.graphics.print(('SPEED  %3d km/h'):format(kmh), 16, 14)
  love.graphics.print(('LAP    %d'):format(hud.lap),   16, 34)
  love.graphics.print(('TIME   %5.1f'):format(hud.time), 16, 54)
  if hud.best then love.graphics.print(('BEST   %5.1f'):format(hud.best),16,74) end
  local gw=W-32                                         -- 속도 게이지
  love.graphics.setColor(0.2,0.2,0.25); love.graphics.rectangle('fill',16,H-24,gw,10)
  love.graphics.setColor(1,0.5,0.2); love.graphics.rectangle('fill',16,H-24,gw*(speed/MAX_SPEED),10)
end</pre>`},

{t:'⑪ love.load / resize / keypressed', k:'CODE', h:`
<pre class="code" data-lang="lua">local function resetGame()      -- 창은 건드리지 않고 게임 상태만 초기화
  math.randomseed(os.time())
  buildTrack()
  position, playerX, speed = 0,0,0
  hud = {lap=1, time=0, best=nil}
end

function love.load()
  love.window.setMode(900, 540, {resizable=true, minwidth=320, minheight=240})
  love.graphics.setDefaultFilter('nearest','nearest')
  W,H = love.graphics.getDimensions()
  CAM_DEPTH = 1 / math.tan((FOV/2)*math.pi/180)   -- 시야각→투영깊이
  PLAYER_Z  = CAM_HEIGHT * CAM_DEPTH              -- 카메라→플레이어 z 거리
  resetGame()
end

function love.resize(w,h) W,H = w,h end             -- 창 크기 갱신

function love.keypressed(k)
  if k=='escape' then love.event.quit() end
  if k=='r' then resetGame() end                    -- 재시작(창 유지)
  if k=='space' then playerX = 0 end                -- 시점 리셋
end</pre>
<p><span class="reg">love.load</span> 는 딱 한 번, 시작할 때 실행됩니다. 여기서 <em>CAM_DEPTH = 1/tan(fov/2)</em> 와 <em>PLAYER_Z = CAM_HEIGHT×CAM_DEPTH</em> 를 계산하고 트랙을 만듭니다.</p>`},

{t:'⑫ love.update (요약 재확인)', k:'CODE', h:`
<pre class="code" data-lang="lua">function love.update(dt)
  dt = math.min(dt, 1/30)
  local seg = findSegment(position + PLAYER_Z)
  local speedPct = speed/MAX_SPEED
  hud.time = hud.time + dt
  keys.up = love.keyboard.isDown('up')  -- (left/right/down 동일)
  if keys.up then speed = speed + ACCEL*dt
  elseif keys.down then speed = speed + BRAKE*dt
  else speed = speed + DECEL*dt end
  local dx = dt * 2 * speedPct
  if keys.left  then playerX = playerX - dx end
  if keys.right then playerX = playerX + dx end
  playerX = playerX - (dx*speedPct*seg.curve*CENTRIFUGAL)  -- 원심력
  -- 오프로드 감속·클램프·충돌 …
  position = position + speed*dt                            -- 전진
  while position &gt;= trackLength do position=position-trackLength
    hud.lap=hud.lap+1
    if not hud.best or hud.time&lt;hud.best then hud.best=hud.time end
    hud.time=0 end
end</pre>
<p>CH13 에서 자세히 본 그 루프입니다. 입력→물리→충돌→전진→랩의 순서를 다시 확인하세요.</p>`},

{t:'⑬ love.draw & 전체 파일 안내', k:'CODE', h:`
<pre class="code" data-lang="lua">function love.draw()
  render()       -- 하늘·도로·스프라이트·교통차
  drawPlayer()   -- 내 차
  drawHUD()      -- 정보(맨 위)
end</pre>
<p>이렇게 ①~⑬ 을 위에서 아래로 이어 붙이면 <b>완전히 동작하는 게임</b>이 됩니다. 각 조각의 역할을 한 번 더 정리하면:</p>
<ul class="b">
<li><b>상수·색·상태</b> — 무엇을(데이터)</li>
<li><b>project·트랙빌더·렌더러</b> — 어떻게 보일지(그리기)</li>
<li><b>update·draw 콜백</b> — 매 프레임 흐름(게임 루프)</li>
</ul>
<div class="note blue"><b>전체 파일은 outrun.lua 로 저장되어 있습니다.</b> 이 슬라이드들의 조각을 모두 이어 붙인 것과 동일합니다. 그대로 main.lua 로 저장해 <em>love .</em> 로 실행하면 아래 데모와 똑같이 동작합니다.</div>`},

{t:'폴드7의 도전 — 화면비가 변한다', k:'FOLD', h:`

{t:'해상도 독립 렌더 — 우리 코드는 이미 준비됨', k:'RESPONSIVE', h:`

{t:'터치 입력 — 폰에서 운전하기', k:'TOUCH', h:`
<p>폰에는 방향키가 없습니다. 화면을 <b>영역으로 나눠</b> 터치로 조작하게 만듭니다.</p>
<pre class="code" data-lang="lua">local zones = {}   -- 터치 id → 구역 이름
local touch = {left=false,right=false,up=false}
local function zoneAt(x, y)
  if y &lt;= H*0.6 then return nil end        -- 화면 아래쪽만 조작 영역
  if x &lt; W*0.33 then return 'left'         -- 좌 1/3
  elseif x &gt; W*0.66 then return 'right'    -- 우 1/3
  else return 'up' end                     -- 가운데=가속
end
local function refresh()
  touch.left, touch.right, touch.up = false, false, false
  for _, z in pairs(zones) do touch[z] = true end
end
function love.touchpressed(id, x, y)  zones[id] = zoneAt(x, y); refresh() end
function love.touchreleased(id, x, y) zones[id] = nil;          refresh() end

<script>
/* ═════════ 슬라이드 엔진 ═════════ */
const SLIDES=[];
CHAPTERS.forEach(function(ch,ci){
  SLIDES.push({ch:ci,cover:true});
  ch.slides.forEach(function(s){SLIDES.push({ch:ci,cover:false,t:s.t,k:s.k||'',h:s.h});});

const N=SLIDES.length;
let cur=0;
const stage=document.getElementById('stage'),barFill=document.getElementById('barFill'),
      cnt=document.getElementById('cnt'),chapLabel=document.getElementById('chapLabel'),
      dotsEl=document.getElementById('dots');

function strip(s){return s.replace(/<[^>]+>/g,'');}

/* 코드 하이라이터 */
const JS_KW=/\b(const|let|var|for|if|else|function|return|new|of|in|while|break|continue|void|true|false|null|typeof|class|this)\b/g;
const LUA_KW=/\b(local|function|end|for|if|elseif|then|else|return|while|do|in|not|and|or|nil|true|false|break|repeat|until|goto)\b/g;
function hl(root){
  root.querySelectorAll('pre.code').forEach(function(p){
    if(p.dataset.hlDone)return; p.dataset.hlDone='1';
    let t=p.innerHTML, lang=p.dataset.lang||'js', hold=[];
    function keep(m){hold.push(m);return '@@H'+(hold.length-1)+'@@';}
    if(lang==='lua'){t=t.replace(/--\[\[[\s\S]*?\]\]/g,function(m){return keep('<span class="c">'+m+'</span>');});
         t=t.replace(/--[^\n]*/g,function(m){return keep('<span class="c">'+m+'</span>');});}
    else if(lang==='math'){/* no comments */}
    else{t=t.replace(/\/\/[^\n]*/g,function(m){return keep('<span class="c">'+m+'</span>');});
         t=t.replace(/\/\*[\s\S]*?\*\//g,function(m){return keep('<span class="c">'+m+'</span>');});}
    t=t.replace(/('[^'\n]*'|"[^"\n]*")/g,function(m){return keep('<span class="s">'+m+'</span>');});
    t=t.replace(/\b(\d+(?:\.\d+)?(?:e-?\d+)?)\b/g,function(m){return keep('<span class="n">'+m+'</span>');});
    if(lang!=='math')t=t.replace(lang==='lua'?LUA_KW:JS_KW,'<span class="k">$&</span>');
    t=t.replace(/@@H(\d+)@@/g,function(_,i){return hold[+i];});
    p.innerHTML=t;
  });
}

function render(dir){
  stopDemos();
  const s=SLIDES[cur],ch=CHAPTERS[s.ch];
  barFill.style.width=((cur+1)/N*100)+'%';
  cnt.textContent=(cur+1)+' / '+N;
  chapLabel.textContent='CH.'+(s.ch+1)+'  '+strip(ch.title);
  const el=document.createElement('div');
  el.className='slide'+(dir<0?' back':'');
  if(s.cover){
    el.innerHTML='<div class="cover"><div class="icon">'+ch.icon+'</div>'
      +'<div class="chNo">CHAPTER '+(s.ch+1)+' / '+CHAPTERS.length+'</div>'
      +'<h1>'+ch.title+'</h1><div class="desc">'+ch.desc+'</div>'
      +'<div class="mini">'+ch.slides.length+' SLIDES ─ → 키 또는 스와이프</div></div>';
  }else{
    el.innerHTML='<div class="kick">'+s.k+'</div><h1 class="st">'+s.t+'</h1>'
      +'<div class="body">'+s.h+'</div>';
  }
  stage.replaceChildren(el);
  hl(el); initDemos(el);
  Array.prototype.forEach.call(dotsEl.children,function(d,i){d.classList.toggle('on',i===s.ch);});
  try{history.replaceState(null,'','#s'+(cur+1));}catch(e){}
}
function go(n,dir){
  n=Math.max(0,Math.min(N-1,n));
  if(n===cur&&stage.children.length)return;
  const d=(dir!==undefined)?dir:(n>=cur?1:-1);
  cur=n; render(d);
}
document.getElementById('btnPrev').onclick=function(){this.blur();go(cur-1,-1);};
document.getElementById('btnNext').onclick=function(){this.blur();go(cur+1,1);};

CHAPTERS.forEach(function(ch,ci){
  const b=document.createElement('button');b.className='d';b.title=strip(ch.title);
  b.onclick=function(){go(SLIDES.findIndex(function(s){return s.ch===ci;}),1);};
  dotsEl.appendChild(b);
});

const toc=document.getElementById('toc'),tocList=document.getElementById('tocList');
CHAPTERS.forEach(function(ch,ci){
  const start=SLIDES.findIndex(function(s){return s.ch===ci;});
  const b=document.createElement('button');b.className='item';
  b.innerHTML='<span>'+ch.icon+'</span><span class="no">'+String(start+1).padStart(3,'0')+'</span><span>'+ch.title+'</span>';
  b.onclick=function(){toc.hidden=true;go(start,1);};

document.getElementById('tocClose').onclick=function(){toc.hidden=true;};
toc.addEventListener('click',function(e){if(e.target===toc)toc.hidden=true;});

window.addEventListener('keydown',function(e){
  if(!toc.hidden){if(e.key==='Escape')toc.hidden=true;return;}
  const tg=e.target.tagName;
  if(tg==='INPUT'||tg==='BUTTON'||tg==='TEXTAREA')return;
  const gameOn=!!document.querySelector('canvas[data-demo="game"]');
  if(gameOn)return;/* 게임 슬라이드에서는 방향키가 운전에 쓰이므로 하단 버튼/스와이프로 이동 */
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1,1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1,-1);}
  else if(e.key==='Home'){go(0,-1);}
  else if(e.key==='End'){go(N-1,1);}
});
let tx0=0,ty0=0;
stage.addEventListener('touchstart',function(e){tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',function(e){
  if(e.target.closest('.demoWrap'))return;
  const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){if(dx<0)go(cur+1,1);else go(cur-1,-1);}
},{passive:true});

<script>
/* ═════════ 데모 프레임워크 ═════════ */
const DEMOS={};
let demoStops=[];
function stopDemos(){demoStops.forEach(function(f){try{f();}catch(e){}});demoStops=[];}
function initDemos(root){
  root.querySelectorAll('canvas[data-demo]').forEach(function(cv){
    const f=DEMOS[cv.dataset.demo];
    if(f){try{const stop=f(cv,cv.closest('.demoWrap'));if(stop)demoStops.push(stop);}catch(e){console.error(e);}}
  });
}
function loopDemo(fn){
  let run=true,id=0,t0=null,last=null;
  function tick(ts){if(!run)return;if(t0===null){t0=ts;last=ts;}
    const dt=Math.min((ts-last)/1000,1/20);last=ts;
    try{fn((ts-t0)/1000,dt);}catch(e){console.error(e);run=false;return;}
    id=requestAnimationFrame(tick);}
  id=requestAnimationFrame(tick);
  return function(){run=false;cancelAnimationFrame(id);};
}
function P(w,n){return w?w.querySelector('[data-p="'+n+'"]'):null;}
function ctx2d(cv){const c=cv.getContext('2d');c.imageSmoothingEnabled=false;return c;}
function bindVal(w,name,fmt){
  const inp=P(w,name),vs=w?w.querySelector('[data-v="'+name+'"]'):null;
  function upd(){if(vs)vs.textContent=fmt?fmt(+inp.value):inp.value;}
  if(inp){inp.addEventListener('input',upd);upd();}
  return inp;
}
function bindPad(w,keys){
  const fns=[];if(!w)return function(){};
  w.querySelectorAll('button[data-k]').forEach(function(b){
    const k=b.dataset.k;
    function dn(e){e.preventDefault();keys[k]=true;b.classList.add('on');}
    function up(e){e.preventDefault();keys[k]=false;b.classList.remove('on');}
    b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);
    b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
    fns.push(function(){b.removeEventListener('pointerdown',dn);b.removeEventListener('pointerup',up);
      b.removeEventListener('pointerleave',up);b.removeEventListener('pointercancel',up);});
  });
  return function(){fns.forEach(function(f){f();});};
}
function bindKeys(keys,codes){
  function kd(e){if(codes.indexOf(e.code)>=0){keys[e.code]=true;e.preventDefault();}}
  function ku(e){if(codes.indexOf(e.code)>=0){keys[e.code]=false;}}
  window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);
  return function(){window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);};
}

/* ═════════ 공용 유사 3D 도로 엔진 (본문 Lua/JS 코드와 동일 알고리즘) ═════════ */

function rmix(a,b,t){return [a[0]+(b[0]-a[0])*t|0,a[1]+(b[1]-a[1])*t|0,a[2]+(b[2]-a[2])*t|0];}
function rcss(c){return 'rgb('+c[0]+','+c[1]+','+c[2]+')';}
function rfog(d,dens){return Math.exp(-dens*d*d);}
function rproject(p,camX,camY,camZ,W,H,depth){
  const cz=Math.max(p.world.z-camZ,0.1);
  const sc=depth/cz;
  p.scale=sc;
  p.sx=Math.round(W/2 + sc*(p.world.x-camX)*W/2);
  p.sy=Math.round(H/2 - sc*(p.world.y-camY)*H/2);
  p.sw=Math.round(sc*RWIDTH*W/2);
}
function rlastY(S){return S.length?S[S.length-1].p2.world.y:0;}
function raddSeg(S,curve,y){
  const n=S.length,pY=rlastY(S);
  S.push({index:n,curve:curve,sprites:[],cars:[],
    p1:{world:{x:0,y:pY,z:n*RSEG}},
    p2:{world:{x:0,y:y, z:(n+1)*RSEG}},
    color:(Math.floor(n/RUMBLE)%2?RCOL.DARK:RCOL.LIGHT)});
}
function easeIn(a,b,p){return a+(b-a)*p*p;}
function easeIO(a,b,p){return a+(b-a)*(-Math.cos(p*Math.PI)/2+0.5);}
function raddRoad(S,enter,hold,leave,curve,dy){
  const sY=rlastY(S),eY=sY+(dy||0)*RSEG,tot=enter+hold+leave;
  for(let i=0;i<enter;i++)raddSeg(S,easeIn(0,curve,i/enter),easeIO(sY,eY,i/tot));
  for(let i=0;i<hold;i++) raddSeg(S,curve,easeIO(sY,eY,(enter+i)/tot));
  for(let i=0;i<leave;i++)raddSeg(S,easeIO(curve,0,i/leave),easeIO(sY,eY,(enter+hold+i)/tot));
}
function rfindSeg(S,z){return S[Math.floor(z/RSEG)%S.length];}

function rpoly(c,x1,y1,x2,y2,x3,y3,x4,y4,col){
  c.fillStyle=rcss(col);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineTo(x3,y3);c.lineTo(x4,y4);c.closePath();c.fill();
}
function rbackground(c,W,H,baseCurve,playerX){
  const g=c.createLinearGradient(0,0,0,H*0.62);
  g.addColorStop(0,rcss(SKYT));g.addColorStop(1,rcss(SKYB));
  c.fillStyle=g;c.fillRect(0,0,W,H);
  const off=-(baseCurve*W*0.16)-(playerX||0)*W*0.06;
  c.fillStyle='rgba(255,205,90,.95)';
  c.beginPath();c.arc(W/2+off*0.6,H*0.40,H*0.15,0,7);c.fill();
  c.fillStyle='rgb(92,34,78)';
  c.beginPath();c.moveTo(0,H*0.6);
  const pts=[[0.16,0.44],[0.32,0.56],[0.5,0.40],[0.66,0.55],[0.84,0.43],[1,0.55]];
  pts.forEach(function(p){c.lineTo(off*1.4+W*p[0],H*p[1]);});
  c.lineTo(W,H*0.6);c.closePath();c.fill();
}
function rrenderSeg(c,W,H,seg,fogA){
  const col=seg.color,p1=seg.p1,p2=seg.p2;
  rpoly(c,0,p1.sy,W,p1.sy,W,p2.sy,0,p2.sy, rmix(SKYB,col.grass,fogA));
  const r1=p1.sw/6,r2=p2.sw/6;
  rpoly(c,p1.sx-p1.sw-r1,p1.sy,p1.sx-p1.sw,p1.sy,p2.sx-p2.sw,p2.sy,p2.sx-p2.sw-r2,p2.sy, rmix(SKYB,col.rumble,fogA));
  rpoly(c,p1.sx+p1.sw+r1,p1.sy,p1.sx+p1.sw,p1.sy,p2.sx+p2.sw,p2.sy,p2.sx+p2.sw+r2,p2.sy, rmix(SKYB,col.rumble,fogA));
  rpoly(c,p1.sx-p1.sw,p1.sy,p1.sx+p1.sw,p1.sy,p2.sx+p2.sw,p2.sy,p2.sx-p2.sw,p2.sy, rmix(SKYB,col.road,fogA));
  if(col.lane){
    const lw1=Math.max(1,p1.sw*0.02),lw2=Math.max(1,p2.sw*0.02);
    for(let l=1;l<LANES;l++){
      const lx1=p1.sx-p1.sw+(p1.sw*2)*(l/LANES),lx2=p2.sx-p2.sw+(p2.sw*2)*(l/LANES);
      rpoly(c,lx1-lw1,p1.sy,lx1+lw1,p1.sy,lx2+lw2,p2.sy,lx2-lw2,p2.sy, rmix(SKYB,col.lane,fogA));
    }
  }
}
function rTree(c,cx,by,sw,fogA,palm){
  const h=sw*(palm?0.62:0.5);if(h<3)return;if(h>c.canvas.height*1.4)return;
  if(palm){
    c.strokeStyle=rcss(rmix(SKYB,[60,40,26],fogA));c.lineWidth=Math.max(1.5,h*0.05);
    c.beginPath();c.moveTo(cx,by);c.lineTo(cx-h*0.08,by-h);c.stroke();
    c.strokeStyle=rcss(rmix(SKYB,[30,150,74],fogA));c.lineWidth=Math.max(1.5,h*0.03);
    const tx=cx-h*0.08,ty=by-h;
    for(let a=-2;a<=2;a++){c.beginPath();c.moveTo(tx,ty);c.lineTo(tx+a*h*0.16,ty+Math.abs(a)*h*0.10-h*0.05);c.stroke();}
  }else{
    const tw=Math.max(2,h*0.12);
    c.fillStyle=rcss(rmix(SKYB,[74,48,30],fogA));c.fillRect(cx-tw/2,by-h*0.35,tw,h*0.35);
    c.fillStyle=rcss(rmix(SKYB,[20,130,64],fogA));
    c.beginPath();c.moveTo(cx,by-h);c.lineTo(cx-h*0.33,by-h*0.30);c.lineTo(cx+h*0.33,by-h*0.30);c.closePath();c.fill();
  }
}
function rCar(c,cx,by,sw,col,fogA){
  const wpx=sw*0.14,hpx=wpx*0.6;if(wpx<4)return;if(wpx>c.canvas.width)return;
  c.fillStyle=rcss(rmix(SKYB,col,fogA));
  c.fillRect(cx-wpx/2,by-hpx,wpx,hpx);
  c.fillStyle=rcss(rmix(SKYB,[22,22,28],fogA));c.fillRect(cx-wpx*0.34,by-hpx*0.85,wpx*0.68,hpx*0.4);
  c.fillStyle=rcss(rmix(SKYB,[255,60,50],fogA));
  c.fillRect(cx-wpx*0.42,by-hpx*0.2,wpx*0.15,hpx*0.16);c.fillRect(cx+wpx*0.27,by-hpx*0.2,wpx*0.15,hpx*0.16);
}
/* 트랙 종류 */
function trackStraight(S){raddRoad(S,50,300,50,0,0);}
function trackCurve(S,curve){raddRoad(S,40,20,40,0,0);raddRoad(S,40,120,40,curve,0);raddRoad(S,40,20,40,0,0);}
function trackHill(S,hill){raddRoad(S,30,20,30,0,0);raddRoad(S,50,40,50,0,hill);raddRoad(S,50,40,50,0,-hill);raddRoad(S,30,20,30,0,0);}
function trackSCurve(S){raddRoad(S,30,20,30,0,0);raddRoad(S,40,60,40,3.5,15);raddRoad(S,40,60,40,-3.5,-15);
  raddRoad(S,40,60,40,-2.5,20);raddRoad(S,40,60,40,2.5,-20);raddRoad(S,30,20,30,0,0);}
function trackFull(S){
  raddRoad(S,50,50,50,0,0);raddRoad(S,30,30,30,2,20);raddRoad(S,40,40,40,4,-40);
  raddRoad(S,30,30,30,-2,40);raddRoad(S,40,40,40,-6,0);raddRoad(S,20,20,20,0,60);
  raddRoad(S,40,40,40,4,-20);raddRoad(S,30,30,30,2,0);raddRoad(S,50,50,50,0,0);
  S[0].color=RCOL.START;S[1].color=RCOL.START;S[2].color=RCOL.START;
  for(let i=S.length-3;i<S.length;i++)S[i].color=RCOL.FIN;
}
function decorate(S){
  for(let i=18,k=0;i<S.length;i+=6,k++){const side=(k%2===0)?-1:1,off=1.3+(k%3)*0.6;
    S[i].sprites.push({offset:side*off,palm:(k%4===0)});}
}
function addTraffic(S,n){
  const cars=[];
  for(let i=0;i<n;i++){const si=(20+((i*37)%(S.length-40)))|0;
    const car={offset:((i*0.37)%1.4)-0.7,z:si*RSEG,speed:0.35+((i*0.13)%0.3),
      color:[120+((i*53)%135),120+((i*97)%135),140+((i*61)%115)]};
    S[si].cars.push(car);cars.push(car);}
  return cars;
}

/* 공용 렌더: state={position,playerX}, opt={depth,camH,fog,drawDist,bg,decor} */
function renderRoad(c,W,H,S,state,opt){
  const trackLen=S.length*RSEG;
  const depth=opt.depth,DD=opt.drawDist||260,fogD=opt.fog!=null?opt.fog:5;
  const baseSeg=rfindSeg(S,state.position);
  const basePct=(state.position%RSEG)/RSEG;
  const camH=(opt.camH||1000)+baseSeg.p1.world.y+(baseSeg.p2.world.y-baseSeg.p1.world.y)*basePct;
  let maxy=H,x=0,dx=-(baseSeg.curve*basePct);
  if(opt.bg!==false)rbackground(c,W,H,baseSeg.curve,state.playerX); else {c.fillStyle='#05030a';c.fillRect(0,0,W,H);}
  const drawn=[];
  for(let nn=0;nn<DD;nn++){
    const seg=S[(baseSeg.index+nn)%S.length];
    const looped=seg.index<baseSeg.index;
    const camZ=state.position-(looped?trackLen:0);
    const fogA=(fogD>0)?rfog(nn/DD,fogD):1;
    rproject(seg.p1, state.playerX*RWIDTH-x,      camH, camZ, W,H,depth);
    rproject(seg.p2, state.playerX*RWIDTH-x-dx,   camH, camZ, W,H,depth);
    x+=dx;dx+=seg.curve;
    seg._fog=fogA;
    if(seg.p1.world.z-camZ<1){continue;}
    if(seg.p2.sy>=seg.p1.sy || seg.p2.sy>=maxy){continue;}
    rrenderSeg(c,W,H,seg,fogA);
    maxy=seg.p2.sy;drawn.push(seg);
  }
  if(opt.decor!==false){
    for(let i=drawn.length-1;i>=0;i--){const seg=drawn[i],sw=seg.p1.sw;
      for(const sp of seg.sprites){
        const sx=seg.p1.sx+sp.offset*sw;rTree(c,sx,seg.p1.sy,sw,seg._fog,sp.palm);}
      for(const car of seg.cars){
        const sx=seg.p1.sx+car.offset*sw;rCar(c,sx,seg.p1.sy,sw,car.color,seg._fog);}
    }
  }
}

/* ── DEMO: 1D 원근 투영 (scale = depth / z) ── */
DEMOS.scale1d=function(cv,w){
  const c=ctx2d(cv),W=cv.width,H=cv.height;
  const zin=bindVal(w,'z',function(v){return v.toFixed(1);});
  const fin=bindVal(w,'fov',function(v){return v+'°';});
  return loopDemo(function(){
    c.fillStyle='#0a0618';c.fillRect(0,0,W,H);
    const z=zin?+zin.value:4, fov=fin?+fin.value:90;
    const depth=1/Math.tan(fov/2*Math.PI/180);
    const poleH=1.8, camH=1.0;
    const scale=depth/z;
    // 왼쪽: 옆에서 본 그림
    const gx=20,gy=H-40,pxPerM=26;
    c.strokeStyle='#3a2a55';c.lineWidth=1;
    c.beginPath();c.moveTo(gx,gy);c.lineTo(gx+z*pxPerM+40,gy);c.stroke();
    c.fillStyle='#25e6d0';c.beginPath();c.arc(gx,gy-camH*pxPerM,4,0,7);c.fill();
    c.fillStyle='#ff2d95';c.fillRect(gx+z*pxPerM,gy-poleH*pxPerM,3,poleH*pxPerM);
    c.strokeStyle='rgba(255,210,63,.5)';c.setLineDash([4,4]);
    c.beginPath();c.moveTo(gx,gy-camH*pxPerM);c.lineTo(gx+z*pxPerM,gy-poleH*pxPerM);
    c.moveTo(gx,gy-camH*pxPerM);c.lineTo(gx+z*pxPerM,gy);c.stroke();c.setLineDash([]);
    c.fillStyle='#9384aa';c.font='11px monospace';
    c.fillText('눈(카메라)',gx-6,gy-camH*pxPerM-8);c.fillText('기둥 z='+z.toFixed(1),gx+z*pxPerM-20,gy+16);
    // 오른쪽: 화면에 투영된 기둥 높이
    const sx=W*0.72, sh=scale*poleH*(H*0.5), sy=H*0.5;
    c.strokeStyle='#241338';c.strokeRect(W*0.58,20,W*0.4,H-40);
    c.fillStyle='#ff2d95';c.fillRect(sx-3,sy-sh/2,6,sh);
    c.fillStyle='#ffd23f';c.font='12px monospace';
    c.fillText('scale = depth/z = '+scale.toFixed(3),W*0.58+8,H-14);
    c.fillText('화면높이 ∝ scale',W*0.58+8,34);
  });
};

/* 공용 오토드라이브 데모 생성기 */
function autoRoad(cv,w,builder,opt){
  const c=ctx2d(cv),W=cv.width,H=cv.height;
  const speedIn=bindVal(w,'speed'),curveIn=bindVal(w,'curve',function(v){return(+v).toFixed(1);}),
        fovIn=bindVal(w,'fov',function(v){return v+'°';}),camIn=bindVal(w,'cam'),
        fogIn=bindVal(w,'fog',function(v){return(+v).toFixed(1);}),hillIn=bindVal(w,'hill');
  const st={position:0,playerX:0};let steer=0;
  return loopDemo(function(t,dt){
    const S=[];const p={curve:curveIn?+curveIn.value:undefined,hill:hillIn?+hillIn.value:undefined};
    builder(S,p);
    const fov=fovIn?+fovIn.value:100;
    const depth=1/Math.tan(fov/2*Math.PI/180);
    const spd=speedIn?+speedIn.value:0.5;
    st.position=(st.position+spd*RSEG*60*dt)%(S.length*RSEG);
    if(opt&&opt.steer)st.playerX=Math.sin(t*0.6)*0.6;
    renderRoad(c,W,H,S,st,{depth:depth,camH:camIn?+camIn.value:1000,
      fog:fogIn?+fogIn.value:(opt&&opt.fog!=null?opt.fog:0),
      drawDist:220,bg:!(opt&&opt.nobg),decor:!(opt&&opt.nodecor)});
  });
}
DEMOS.projection=function(cv,w){return autoRoad(cv,w,function(S){trackStraight(S);},{nodecor:true});};
DEMOS.roadflat  =function(cv,w){return autoRoad(cv,w,function(S){trackStraight(S);decorate(S);},{});};
DEMOS.curve     =function(cv,w){return autoRoad(cv,w,function(S,p){trackCurve(S,p.curve==null?3:p.curve);decorate(S);},{});};
DEMOS.hills     =function(cv,w){return autoRoad(cv,w,function(S,p){trackHill(S,p.hill==null?40:p.hill);decorate(S);},{});};
DEMOS.parallax  =function(cv,w){return autoRoad(cv,w,function(S){trackSCurve(S);decorate(S);},{steer:true});};
DEMOS.sprites   =function(cv,w){return autoRoad(cv,w,function(S){trackStraight(S);decorate(S);},{});};
DEMOS.fog       =function(cv,w){return autoRoad(cv,w,function(S){trackSCurve(S);decorate(S);},{fog:5});};

/* ── DEMO: 곡선 누적(중심선) 그리기 ── */
DEMOS.centerline=function(cv,w){
  const c=ctx2d(cv),W=cv.width,H=cv.height;
  const curveIn=bindVal(w,'curve',function(v){return(+v).toFixed(1);});
  return loopDemo(function(){
    c.fillStyle='#0a0618';c.fillRect(0,0,W,H);
    const curve=curveIn?+curveIn.value:3;
    const S=[];trackCurve(S,curve);
    let x=0,dx=0;const cx=W/2;
    c.strokeStyle='#ff2d95';c.lineWidth=3;c.beginPath();
    for(let i=0;i<S.length;i++){
      const yy=H-6-(i/S.length)*(H-20);
      const xx=cx+x*0.10;
      if(i===0)c.moveTo(xx,yy);else c.lineTo(xx,yy);
      x+=dx;dx+=S[i].curve;
    }
    c.stroke();
    c.fillStyle='#9384aa';c.font='11px monospace';
    c.fillText('아래=가까움  위=멀리 |  x += dx;  dx += curve',10,14);
  });
};

/* ── DEMO: 완전 플레이 가능한 미니 아웃런 ── */
DEMOS.game=function(cv,w){
  const c=ctx2d(cv),W=cv.width,H=cv.height;
  const S=[];trackFull(S);decorate(S);const cars=addTraffic(S,18);
  const trackLen=S.length*RSEG;
  const MAX=RSEG*60, depth=1/Math.tan(100/2*Math.PI/180);
  const PLAYER_Z=1000*depth; /* 카메라높이×카메라깊이 ≈ 차가 그려지는 지점 */
  const st={position:0,playerX:0};let speed=0,lap=1,time=0,best=null;
  const keys={};
  const stopPad=bindPad(w,keys);
  const stopKeys=bindKeys(keys,['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
  function K(name,code){return keys[name]||keys[code];}
  const stop=loopDemo(function(t,dt){
    const seg=rfindSeg(S,st.position+PLAYER_Z);
    const pct=speed/MAX;time+=dt;
    if(K('U','ArrowUp'))speed+=MAX/5*dt;
    else if(K('D','ArrowDown'))speed-=MAX*dt;
    else speed-=MAX/5*dt;
    const dxs=dt*2*pct;
    if(K('L','ArrowLeft'))st.playerX-=dxs;
    if(K('R','ArrowRight'))st.playerX+=dxs;
    st.playerX-=dxs*pct*seg.curve*0.3;
    if((st.playerX<-1||st.playerX>1)&&speed>MAX/4)speed-=MAX/2*dt;
    st.playerX=Math.max(-2,Math.min(2,st.playerX));
    speed=Math.max(0,Math.min(speed,MAX));
    const pseg=rfindSeg(S,st.position+PLAYER_Z);
    for(const car of pseg.cars){if(speed>car.speed*MAX&&Math.abs(st.playerX-car.offset)<0.5)speed=car.speed*MAX*0.5;}
    st.position+=speed*dt;
    while(st.position>=trackLen){st.position-=trackLen;lap++;if(best==null||time<best)best=time;time=0;}
    while(st.position<0)st.position+=trackLen;
    renderRoad(c,W,H,S,st,{depth:depth,camH:1000,fog:4,drawDist:240});
    // 플레이어 차
    const pcx=W/2+st.playerX*W*0.10,pby=H*0.93+((speed>0)?Math.sin(st.position*0.02)*2:0),pw=H*0.20;
    c.fillStyle='#e6202a';c.fillRect(pcx-pw/2,pby-pw*0.55,pw,pw*0.55);
    c.fillStyle='#14141c';c.fillRect(pcx-pw*0.3,pby-pw*0.5,pw*0.6,pw*0.28);
    c.fillStyle='#0f0f14';c.fillRect(pcx-pw*0.55,pby-pw*0.2,pw*0.16,pw*0.22);c.fillRect(pcx+pw*0.39,pby-pw*0.2,pw*0.16,pw*0.22);
    // HUD
    c.fillStyle='#fff';c.font='bold 13px monospace';
    c.fillText((speed/MAX*300|0)+' km/h',10,18);c.fillText('LAP '+lap,10,36);c.fillText('TIME '+time.toFixed(1),10,54);
    if(best)c.fillText('BEST '+best.toFixed(1),10,72);
    c.fillStyle='rgba(255,255,255,.15)';c.fillRect(10,H-14,W-20,7);
    c.fillStyle='#ff8a3d';c.fillRect(10,H-14,(W-20)*(speed/MAX),7);
  });
  return function(){stop();stopPad();stopKeys();};
};

/* 첫 슬라이드 표시 (해시 복원) */

<!-- ===== deck-input-shim v1 : 방향키(↑↓ 스크롤 / ←→ 페이지) + 게임패드 ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckInputShim) return;
  window.__deckInputShim = true;

  /* ---------- 지금 보이는 슬라이드의 스크롤 컨테이너 찾기 ---------- */
  function scrollableAt(x, y) {
    if (!document.elementFromPoint) return null;
    var n = document.elementFromPoint(x, y);
    while (n && n !== document.documentElement) {
      var oy = getComputedStyle(n).overflowY;
      if ((oy === 'auto' || oy === 'scroll' || oy === 'overlay') &&
          n.scrollHeight - n.clientHeight > 4) return n;
      n = n.parentElement;
    }
    return null;
  }
  function scroller() {
    var el = scrollableAt(innerWidth / 2, innerHeight / 2) ||
             scrollableAt(innerWidth / 2, innerHeight * 0.35);
    if (el) return el;
    var m = document.querySelector('main');
    if (m && m.scrollHeight - m.clientHeight > 4) return m;
    return document.scrollingElement || document.documentElement;
  }
  function viewH(el) {
    return (el === document.scrollingElement || el === document.documentElement)
      ? innerHeight : el.clientHeight;
  }
  function isPageScroller(el) {
    return el === document.scrollingElement || el === document.documentElement || el === document.body;
  }
  function scrollStep(dir, smooth) {
    var el = scroller();
    el.scrollBy({ top: dir * Math.max(80, viewH(el) * 0.25),
                  left: 0, behavior: smooth ? 'smooth' : 'auto' });
  }

  /* ---------- 페이지 이동 (덱마다 다른 엔진에 공통으로 붙는다) ---------- */
  function pick(ids) {
    for (var i = 0; i < ids.length; i++) {
      var e = document.getElementById(ids[i]);
      if (e && (e.tagName === 'BUTTON' || e.tagName === 'A')) return e;
    }
    return null;
  }
  function synth(key) {
    document.dispatchEvent(new KeyboardEvent('keydown',
      { key: key, code: key, bubbles: true, cancelable: true }));
  }
  function page(dir) {
    var b = dir > 0 ? pick(['nextBtn', 'btnNext', 'next'])
                    : pick(['prevBtn', 'btnPrev', 'prev']);
    if (b) { if (!b.disabled) b.click(); }
    else synth(dir > 0 ? 'ArrowRight' : 'ArrowLeft');
  }
  function toggleToc() {
    var b = pick(['tocBtn', 'btnToc', 'toc-btn', 'tocOpen']);
    if (b) b.click(); else synth('t');
  }

  /* ---------- 키보드: ↑↓ = 스크롤 (←→ 페이지는 각 덱 엔진이 처리) ---------- */
  function interactive(el) {
    if (!el) return false;
    var t = (el.tagName || '').toUpperCase();
    return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' ||
           t === 'CANVAS' || el.isContentEditable === true;
  }
  addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    if (e.defaultPrevented || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
    if (interactive(e.target) || interactive(document.activeElement)) return;
    var dir = e.key === 'ArrowDown' ? 1 : -1, repeat = e.repeat;
    // 이벤트 전파가 끝난 뒤에 판단한다 — 슬라이드 안의 데모(테트리스 등)가
    // 이 키를 가져갔으면(preventDefault) 스크롤하지 않는다.
    setTimeout(function () {
      if (e.defaultPrevented) return;
      // 문서 자체가 스크롤되는 덱은 브라우저 기본 동작에 맡긴다(이중 스크롤 방지).
      if (isPageScroller(scroller())) return;
      scrollStep(dir, !repeat);
    }, 0);
  });

  /* ---------- 게임패드 (조이패드) ----------
     좌스틱/D-pad 상하 = 스크롤, 좌우 = 이전/다음 페이지
     A·RB·RT = 다음, B·LB·LT = 이전, X·Start = 목차, Back = 첫 장     */
  var DEAD = 0.4, REPEAT = 320, held = {}, lastTurn = 0, lastDir = 0, raf = 0;

  function pads() {
    if (!navigator.getGamepads) return [];
    var out = [], g = navigator.getGamepads();
    for (var i = 0; i < g.length; i++) if (g[i]) out.push(g[i]);
    return out;
  }
  function down(g, i) { var b = g.buttons[i]; return !!b && (b.pressed || b.value > 0.5); }
  function edge(name, isDown, fn) {
    if (isDown) { if (!held[name]) { held[name] = 1; fn(); } }
    else held[name] = 0;
  }

  function poll(now) {
    var list = pads();
    if (!list.length) { raf = 0; return; }
    raf = requestAnimationFrame(poll);

    var ax = 0, ay = 0, bNext = false, bPrev = false, bToc = false, bHome = false;
    for (var k = 0; k < list.length; k++) {
      var g = list[k];
      ax += g.axes[0] || 0;
      ay += g.axes[1] || 0;
      if (down(g, 15)) ax += 1;
      if (down(g, 14)) ax -= 1;
      if (down(g, 13)) ay += 1;
      if (down(g, 12)) ay -= 1;
      bNext = bNext || down(g, 0) || down(g, 5) || down(g, 7);
      bPrev = bPrev || down(g, 1) || down(g, 4) || down(g, 6);
      bToc  = bToc  || down(g, 2) || down(g, 9);
      bHome = bHome || down(g, 8);
    }

    if (Math.abs(ay) > DEAD) {                       // 세로: 부드러운 연속 스크롤
      var mag = Math.min(1, (Math.abs(ay) - DEAD) / (1 - DEAD));
      scroller().scrollBy(0, (ay > 0 ? 1 : -1) * (6 + mag * 22));
    }
    var dir = Math.abs(ax) > DEAD ? (ax > 0 ? 1 : -1) : 0;
    if (dir) {                                       // 가로: 페이지 넘김(리핏 간격)
      if (dir !== lastDir || now - lastTurn > REPEAT) {
        lastDir = dir; lastTurn = now; page(dir);
      }
    } else { lastDir = 0; lastTurn = 0; }

    edge('next', bNext, function () { page(1); });
    edge('prev', bPrev, function () { page(-1); });
    edge('toc',  bToc,  toggleToc);
    edge('home', bHome, function () { synth('Home'); });
  }

  function start() { if (!raf) raf = requestAnimationFrame(poll); }
  addEventListener('gamepadconnected', start);
  addEventListener('focus', function () { if (pads().length) start(); });
  if (pads().length) start();
})();
</script>
</body>
</html>
