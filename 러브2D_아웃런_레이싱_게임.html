<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Love2D로 만드는 아웃런 스타일 레이싱 — 인터랙티브 슬라이드 (유사 3D · 수학 모델 · 완전 소스)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0b0518; --bg1:#150a2b; --bg2:#1e0d3a;
  --mag:#ff2d95; --org:#ff8a3d; --yel:#ffd23f; --cyn:#25e6d0; --vio:#a86bff; --blu:#4d7cff;
  --ink:#f6eefb; --ink-soft:#d6c8e6; --ink-dim:#9384aa;
  --panel:rgba(255,255,255,.05); --panel-bd:rgba(255,45,149,.34);
  --code-bg:#120a22;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Noto Sans KR',sans-serif;color:var(--ink);overflow:hidden;
  background:
    radial-gradient(1100px 560px at 85% -10%, rgba(255,45,149,.14), transparent 60%),
    radial-gradient(900px 520px at 8% 112%, rgba(37,230,208,.10), transparent 60%),
    linear-gradient(160deg,var(--bg0) 0%,var(--bg1) 55%,var(--bg2) 100%);
}
#app{height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#bar{height:5px;background:rgba(255,255,255,.08);flex:0 0 auto;}
#barFill{height:100%;width:0;background:linear-gradient(90deg,var(--mag),var(--org),var(--yel),var(--cyn),var(--vio));transition:width .25s;}
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:9px clamp(12px,2.5vw,28px);border-bottom:1px solid rgba(255,255,255,.07);}
header .logo{font-family:'Black Han Sans',sans-serif;font-size:clamp(14px,1.6vw,19px);color:var(--mag);
  white-space:nowrap;letter-spacing:.5px;}
header .logo .sub{color:var(--cyn);}
header .chap{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink-soft);font-size:clamp(12px,1.3vw,15px);text-align:center;}
header .cnt{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:var(--ink-dim);
  font-size:clamp(12px,1.3vw,15px);white-space:nowrap;}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;justify-content:center;
  padding:clamp(10px,2vh,22px) clamp(10px,3vw,36px);}
.slide{width:min(1180px,100%);display:flex;flex-direction:column;min-height:0;animation:enter .32s ease both;}
.slide.back{animation:enterBack .32s ease both;}
@keyframes enter{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
@keyframes enterBack{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:none;}}
.kick{color:var(--org);font-weight:700;font-size:clamp(11.5px,1.5vw,14.5px);letter-spacing:2.5px;margin-bottom:6px;}
h1.st{font-family:'Black Han Sans',sans-serif;font-weight:400;line-height:1.25;
  font-size:clamp(21px,3.3vw,38px);margin-bottom:clamp(10px,1.8vh,18px);letter-spacing:.3px;}
h1.st .em{color:var(--mag);}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding-right:6px;scrollbar-width:thin;scrollbar-color:rgba(255,45,149,.4) transparent;
  font-size:clamp(14.5px,1.7vw,18.5px);line-height:1.75;color:var(--ink-soft);}
.body::-webkit-scrollbar{width:6px;}
.body::-webkit-scrollbar-thumb{background:rgba(255,45,149,.35);border-radius:3px;}
.body b,.body strong{color:var(--ink);}
.body em{color:var(--org);font-style:normal;font-weight:700;}
.body p{margin:0 0 12px;}
.body ul.b{list-style:none;margin:4px 0 14px;}
.body ul.b>li{padding:6px 0 6px 26px;position:relative;}
.body ul.b>li::before{content:'▸';position:absolute;left:4px;color:var(--org);top:6px;}
.body ol{margin:4px 0 14px 24px;}
.body ol>li{padding:4px 0;}
.note{background:var(--panel);border:1px solid var(--panel-bd);border-left:4px solid var(--org);
  border-radius:10px;padding:12px 16px;margin:12px 0;font-size:.94em;}
.note.blue{border-left-color:var(--blu);border-color:rgba(77,124,255,.35);}
.note.mag{border-left-color:var(--mag);border-color:rgba(255,45,149,.4);}
.note.cyn{border-left-color:var(--cyn);border-color:rgba(37,230,208,.35);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0;}
@media (max-width:720px){.grid2{grid-template-columns:1fr;}}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 15px;}
.card h3{font-size:1em;color:var(--org);margin-bottom:6px;}
.card p{font-size:.9em;margin-bottom:0;}
table.tbl{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:.88em;}
table.tbl th{background:rgba(255,45,149,.14);color:var(--ink);padding:7px 10px;text-align:left;
  border:1px solid rgba(255,255,255,.12);white-space:nowrap;}
table.tbl td{padding:6px 10px;border:1px solid rgba(255,255,255,.10);}
table.tbl tr:nth-child(even) td{background:rgba(255,255,255,.03);}
.tblWrap{overflow-x:auto;}
pre.code{background:var(--code-bg);border:1px solid rgba(255,255,255,.12);border-radius:10px;
  padding:13px 16px;margin:10px 0 14px;overflow-x:auto;font-family:'JetBrains Mono',monospace;
  font-size:clamp(11.5px,1.35vw,14px);line-height:1.6;color:#ecdff6;white-space:pre;}
pre.code .c{color:#8f7db0;} pre.code .k{color:#57c7ff;} pre.code .n{color:#ffd23f;} pre.code .s{color:#ff9d6b;}
.codeLabel{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;
  background:rgba(77,124,255,.18);border:1px solid rgba(77,124,255,.4);color:#a9c3ff;
  border-radius:6px 6px 0 0;padding:2px 10px;margin-bottom:-11px;position:relative;z-index:1;margin-left:8px;}
.codeLabel.lua{background:rgba(37,230,208,.15);border-color:rgba(37,230,208,.4);color:#8ff0e4;}
.codeLabel.math{background:rgba(255,45,149,.15);border-color:rgba(255,45,149,.4);color:#ff9dc7;}
.reg{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.85em;background:rgba(168,107,255,.16);
  border:1px solid rgba(168,107,255,.45);color:#d4bfff;border-radius:6px;padding:1px 8px;margin:0 2px;white-space:nowrap;}
kbd{font-family:'JetBrains Mono',monospace;font-size:.82em;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.25);border-bottom-width:2.5px;border-radius:6px;padding:1px 7px;}
.tagrow{margin:8px 0;}
.tag{display:inline-block;background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.4);border-radius:999px;
  padding:2px 12px;font-size:12.5px;color:var(--yel);margin:2px 4px 2px 0;font-family:'JetBrains Mono',monospace;}
.demoWrap{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);border-radius:14px;
  padding:14px;margin:12px 0;}
.demoWrap .dTitle{font-size:12.5px;letter-spacing:1.5px;color:var(--cyn);font-family:'JetBrains Mono',monospace;
  margin-bottom:10px;}
.demoWrap .dTitle::before{content:'▶ LIVE DEMO  ';color:var(--mag);}
canvas.demo{width:100%;max-width:680px;display:block;margin:0 auto;
  border-radius:8px;background:#000;border:1px solid rgba(255,255,255,.18);touch-action:none;}
canvas.demo.wide{max-width:840px;}
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;margin-top:12px;
  font-size:13.5px;color:var(--ink-soft);}
.ctl label{display:flex;align-items:center;gap:8px;white-space:nowrap;}
.ctl input[type=range]{width:clamp(90px,18vw,170px);accent-color:var(--mag);}
.ctl .val{font-family:'JetBrains Mono',monospace;color:var(--org);min-width:52px;display:inline-block;}
.ctl button{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:13px;color:var(--ink);
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.25);border-radius:8px;
  padding:6px 14px;cursor:pointer;}
.ctl button.on{background:rgba(37,230,208,.3);border-color:var(--cyn);color:#a9f0e6;}
.padBtns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.padBtns button{font-size:17px;padding:10px 20px;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.3);border-radius:12px;color:var(--ink);cursor:pointer;touch-action:none;user-select:none;
  font-family:'JetBrains Mono',monospace;}
.padBtns button:active{background:rgba(255,45,149,.35);}
.big{text-align:center;font-size:clamp(17px,2.6vw,26px);line-height:1.7;margin:clamp(16px,6vh,60px) auto;max-width:820px;}
.big .hero{font-family:'Black Han Sans',sans-serif;font-size:clamp(26px,4.5vw,52px);display:block;margin:14px 0;color:var(--mag);}
.cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;}
.cover .icon{font-size:clamp(44px,9vw,90px);margin-bottom:14px;}
.cover .chNo{font-family:'JetBrains Mono',monospace;color:var(--ink-dim);letter-spacing:4px;font-size:clamp(12px,1.6vw,16px);}
.cover h1{font-family:'Black Han Sans',sans-serif;font-size:clamp(28px,5.4vw,58px);line-height:1.25;margin:10px 0 16px;}
.cover h1 .em{color:var(--mag);}
.cover .desc{color:var(--ink-soft);max-width:720px;font-size:clamp(14px,1.9vw,19px);line-height:1.8;}
.cover .mini{margin-top:22px;color:var(--ink-dim);font-size:13px;font-family:'JetBrains Mono',monospace;}
footer{flex:0 0 auto;display:flex;gap:10px;align-items:center;
  padding:10px clamp(12px,2.5vw,28px) calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.07);}
footer button{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:clamp(12.5px,1.4vw,15px);
  color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);
  border-radius:10px;padding:9px 16px;cursor:pointer;white-space:nowrap;}
footer button:hover{background:rgba(255,45,149,.2);}
#dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
#dots .d{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.16);cursor:pointer;border:none;padding:0;}
#dots .d.on{background:var(--mag);}
#toc{position:fixed;inset:0;background:rgba(11,5,24,.94);backdrop-filter:blur(8px);z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
#toc[hidden]{display:none;}
#toc h2{font-family:'Black Han Sans',sans-serif;color:var(--mag);margin-bottom:18px;font-size:clamp(20px,3vw,30px);}
#toc .list{display:grid;gap:10px;width:min(680px,100%);max-height:70vh;overflow-y:auto;}
#toc .item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid rgba(255,255,255,.14);
  border-radius:12px;padding:12px 18px;color:var(--ink);cursor:pointer;text-align:left;font-size:clamp(13.5px,1.7vw,17px);}
#toc .item:hover{border-color:var(--mag);}
#toc .item .no{font-family:'JetBrains Mono',monospace;color:var(--ink-dim);font-size:.85em;white-space:nowrap;}
#toc .close{margin-top:18px;background:none;border:1px solid rgba(255,255,255,.3);color:var(--ink-soft);
  border-radius:999px;padding:8px 22px;cursor:pointer;}
@media (max-width:560px){
  footer button.txt{padding:9px 12px;}
  .body{font-size:14.5px;}
}
</style>
</head>
<body>
<div id="app">
  <div id="bar"><div id="barFill"></div></div>
  <header>
    <div class="logo">OUTRUN<span class="sub">·LÖVE2D</span></div>
    <div class="chap" id="chapLabel"></div>
    <div class="cnt" id="cnt"></div>
  </header>
  <main id="stage"></main>
  <footer>
    <button id="btnPrev" class="txt">◀ 이전</button>
    <button id="btnToc" class="txt">☰ 목차</button>
    <div id="dots"></div>
    <button id="btnNext" class="txt">다음 ▶</button>
  </footer>
</div>
<div id="toc" hidden>
  <h2>목차</h2>
  <div class="list" id="tocList"></div>
  <button class="close" id="tocClose">닫기 ✕</button>
</div>
<script>
'use strict';
const CHAPTERS=[];
function CH(o){CHAPTERS.push(o);}
</script>
<script>
/* ───── CH 1. 인트로: 아웃런과 유사 3D ───── */
CH({
icon:'🏁', title:'아웃런과 <span class="em">유사 3D</span>',
desc:'1986년 아케이드 전설 아웃런의 감성을, 2D 스프라이트와 도로 띠로 흉내 내는 유사 3D(pseudo-3D) 기법으로 되살립니다. Love2D(Lua)로 처음부터 끝까지 직접 만듭니다.',
slides:[

{t:'이 데크에 오신 것을 환영합니다', k:'INTRO', h:`
<p>이 슬라이드는 <b>노을 지는 해안 도로를 질주하는 아웃런 스타일 레이싱 게임</b>을 처음부터 만드는 16장짜리 실습 강의입니다. 완성 코드는 단 하나의 Lua 파일이며, 각 장에서 그 파일을 조금씩 쌓아 올립니다.</p>
<ul class="b">
<li><b>무엇을 배우나</b> — 유사 3D 원근 투영 수학, 세그먼트 기반 도로, 곡선·언덕·안개, 교통 AI, 충돌, HUD</li>
<li><b>무엇으로 만드나</b> — <em>Love2D(LÖVE) 11.x</em> + <em>Lua</em>. 무료·초경량 2D 게임 프레임워크</li>
<li><b>전제 지식</b> — 프로그래밍 기초만 있으면 충분합니다. 수학은 필요한 순간에 그림과 데모로 풀어 설명합니다</li>
</ul>
<div class="note">이 장은 큰 그림을 잡는 장입니다. 코드보다 <b>왜 이렇게 만드는가</b>에 집중하세요.</div>`},

{t:'이 슬라이드 사용법', k:'GUIDE', h:`
<p>본격적으로 들어가기 전에 조작법부터 익히면 편합니다.</p>
<ul class="b">
<li><b>슬라이드 이동</b> — 하단의 <kbd>◀</kbd> <kbd>▶</kbd> 버튼, 또는 좌우 <b>스와이프</b>로 넘깁니다</li>
<li><b>LIVE DEMO 상자</b> — 실제로 움직이는 캔버스입니다. 슬라이더를 드래그하면 값이 바로 화면에 반영됩니다</li>
<li><b>게임 데모</b> — 실제 플레이가 가능합니다. 캔버스를 클릭한 뒤 방향키나 화면 버튼으로 운전하세요</li>
</ul>
<p>코드 블록에는 언어 라벨이 붙습니다.</p>
<div class="tagrow"><span class="tag">lua = Lua 게임 코드</span><span class="tag">js = 브라우저 데모</span><span class="tag">math = 수식·의사코드</span></div>
<div class="note blue">게임 데모 슬라이드에서는 방향키가 <b>운전</b>에 쓰입니다. 그 슬라이드에서 넘어갈 때는 하단 <kbd>◀</kbd> <kbd>▶</kbd> 버튼이나 스와이프를 쓰세요.</div>`},

{t:'1986년, 아웃런이라는 전설', k:'HISTORY', h:`
<p><b>OutRun</b>은 1986년 세가(Sega)의 스즈키 유(鈴木 裕)가 만든 아케이드 레이싱 게임입니다. 페라리 테스타로사를 몰고 유럽의 해안 도로를 달리는 이 게임은 여러 면에서 시대를 앞섰습니다.</p>
<ul class="b">
<li><b>체감형 캐비닛</b> — 실제로 좌우로 기울고 진동하는 좌석형 아케이드기</li>
<li><b>분기 코스</b> — 결승선마다 왼쪽/오른쪽을 골라 서로 다른 스테이지로</li>
<li><b>선곡 라디오</b> — Magical Sound Shower 등 시원한 BGM 선택</li>
<li><b>노을과 야자수</b> — 지금도 신스웨이브·레트로 미학의 원형으로 소환되는 비주얼</li>
</ul>
<div class="note">당시 아케이드에서 실시간 3D 하드웨어는 아직 일반적이지 않았습니다. 그런데도 아웃런은 <em>속도감 있는 3D 도로</em>를 완벽하게 구현했습니다. 그 비밀이 바로 <b>유사 3D</b>입니다.</div>`},

{t:'유사 3D(pseudo-3D)란?', k:'CONCEPT', h:`
<p><b>유사 3D</b>는 진짜 3D 지오메트리(다각형 메시)를 쓰지 않고, <em>2D 그림과 원근 수학만으로</em> 3D처럼 보이게 만드는 기법입니다.</p>
<p>도로를 앞뒤로 잘게 자른 수많은 <b>가로 띠(세그먼트)</b>로 생각합니다. 각 띠는 카메라에서 얼마나 먼지에 따라</p>
<ul class="b">
<li>먼 띠일수록 <b>가늘고</b>, <b>납작하고</b>, <b>화면 위쪽</b>에 그려지고</li>
<li>가까운 띠일수록 <b>넓고</b>, <b>화면 아래쪽</b>에 그려집니다</li>
</ul>
<p>이 띠들을 먼 것부터 차례로 쌓아 그리면, 사람 눈은 그것을 <em>지평선까지 뻗은 3D 도로</em>로 착각합니다.</p>
<div class="note cyn">핵심은 하나의 나눗셈입니다. <b>화면 크기 ∝ 1 / 거리</b>. 3장에서 이 수식을 낱낱이 파헤칩니다.</div>`},

{t:'진짜 3D vs 유사 3D', k:'COMPARE', h:`
<div class="tblWrap"><table class="tbl">
<tr><th>항목</th><th>진짜 3D</th><th>유사 3D (이 강의)</th></tr>
<tr><td>도로 표현</td><td>삼각형 메시 + 텍스처</td><td>가로 띠(사다리꼴) 폴리곤</td></tr>
<tr><td>카메라</td><td>4×4 행렬, 완전 자유</td><td>도로 위 고정 시점 1개</td></tr>
<tr><td>수학</td><td>행렬·쿼터니언·클리핑</td><td>나눗셈 한 번 (scale=depth/z)</td></tr>
<tr><td>배경</td><td>3D 지형·스카이박스</td><td>2D 그림 + 패럴랙스</td></tr>
<tr><td>비용</td><td>GPU·많은 코드</td><td>CPU만으로도 충분</td></tr>
</table></div>

<p>우리 소스는 <span class="reg">love.load</span> 안에서 <span class="reg">love.window.setMode(900,540,{resizable=true,...})</span>로 같은 일을 합니다. 둘 중 편한 방식을 쓰면 됩니다.</p>`},

{t:'4대 콜백', k:'CALLBACKS', h:`
<p>Love2D 게임은 우리가 정의하는 <b>콜백 함수</b>를 엔진이 알아서 불러 주는 구조입니다. 핵심은 넷.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>콜백</th><th>언제</th><th>역할</th></tr>
<tr><td>love.load</td><td>시작 시 1회</td><td>초기화 (창·상수·트랙)</td></tr>
<tr><td>love.update(dt)</td><td>매 프레임</td><td>상태 갱신 (입력·물리)</td></tr>
<tr><td>love.draw</td><td>매 프레임</td><td>화면 그리기</td></tr>
<tr><td>love.keypressed(k)</td><td>키 누를 때</td><td>단발성 키 처리</td></tr>
</table></div>
<div class="note">규칙: <b>상태 바꾸기는 update, 그리기는 draw.</b> 이 둘을 섞지 않는 것이 깔끔한 게임의 비결입니다.</div>`},

{t:'love.load — 준비', k:'LOAD', h:`
<p>게임 시작 시 <em>딱 한 번</em> 실행됩니다. 무거운 준비 작업은 모두 여기서.</p>
<span class="codeLabel lua">Lua · outrun.lua</span>
<pre class="code" data-lang="lua">local function resetGame()      -- 창은 건드리지 않고 게임 상태만 초기화
  math.randomseed(os.time())
  buildTrack()
  position, playerX, speed = 0,0,0
  hud = {lap=1, time=0, best=nil}
end

function love.load()
  love.window.setMode(900, 540, {resizable=true, minwidth=320, minheight=240})
  love.graphics.setDefaultFilter('nearest','nearest')
  W,H = love.graphics.getDimensions()
  CAM_DEPTH = 1 / math.tan((FOV/2)*math.pi/180)
  PLAYER_Z  = CAM_HEIGHT * CAM_DEPTH
  resetGame()
end</pre>
<ul class="b">
<li><span class="reg">W,H</span> — 화면 크기를 전역에 저장 (투영 공식에서 계속 씀)</li>
<li><span class="reg">CAM_DEPTH</span> — 시야각으로부터 카메라 깊이 계산 (3장 주제)</li>
<li><span class="reg">resetGame</span> — 게임 상태 초기화를 분리해 두면 <b>R 재시작</b>에서 창 설정을 건드리지 않고 재사용할 수 있습니다</li>
</ul>`},

{t:'love.update(dt) — delta time', k:'UPDATE', h:`
<p>매 프레임 실행되며, 인자 <b>dt</b>(delta time)는 <em>직전 프레임과의 시간 간격(초)</em>입니다. 60fps면 dt는 약 0.0167.</p>
<pre class="code" data-lang="lua">function love.update(dt)
  dt = math.min(dt, 1/30)          -- 렉이 튀어도 안전하게 상한
  if keys.up then speed = speed + ACCEL*dt end
  position = position + speed*dt   -- 시간에 비례해 전진
end</pre>
<div class="note mag">왜 dt를 곱하나? 프레임률은 기기마다 다릅니다. 이동량에 <b>dt를 곱하면</b> 60fps든 144fps든 <em>같은 시간에 같은 거리</em>를 움직여, 어디서나 속도가 일정합니다.</div>
<p>공식: <span class="reg">거리 = 속도 × dt</span>. 이것이 프레임 독립적 물리의 핵심입니다.</p>`},

{t:'입력 처리: keypressed vs isDown', k:'INPUT', h:`

</ul>`},

{t:'좌표계: 좌상단이 원점', k:'COORDS', h:`
<p>Love2D 화면 좌표는 <b>왼쪽 위가 (0,0)</b>이고, 수학 시간과 달리 <em>y가 아래로 갈수록 커집니다.</em></p>

{t:'love.graphics 기본 그리기', k:'DRAW-API', h:`

slides:[

{t:'이 장의 목표', k:'GOAL', h:`
<p>딱 하나의 질문에 답합니다. <b>3D 공간의 한 점(x, y, z)은 화면의 어느 픽셀(sx, sy)에 찍혀야 하는가?</b></p>
<ul class="b">
<li>이 변환을 <em>원근 투영(perspective projection)</em>이라 합니다</li>

<div class="note mag">겁먹지 마세요. 필요한 수학은 <b>나눗셈·곱셈·탄젠트 한 번</b>이 전부입니다. 그림과 데모로 하나씩 갑니다.</div>`},

{t:'세 개의 좌표계', k:'SPACES', h:`
<p>점 하나가 화면에 찍히기까지 <b>세 좌표계</b>를 거칩니다.</p>

<tr><td>카메라(camera)</td><td>카메라(눈)에서 본 상대 위치</td><td>월드 − 카메라</td></tr>
<tr><td>화면(screen)</td><td>실제 픽셀</td><td>sx, sy, sw</td></tr>
</table></div>
<ul class="b">
<li><b>x</b> = 좌우, <b>y</b> = 높이, <b>z</b> = 앞뒤(깊이)</li>

</ul>
<div class="note">투영은 <em>월드 → 카메라 → 화면</em> 순서로 진행됩니다.</div>`},

{t:'1단계: 카메라 좌표로', k:'CAMERA', h:`

<ul class="b">
<li>이제 <span class="reg">camera.z</span>는 <em>그 점이 눈앞에서 얼마나 먼가</em>를 뜻합니다</li>
<li><span class="reg">camera.y</span>는 눈높이 기준 위(+)/아래(−)</li>
<li><span class="reg">camera.x</span>는 시선 중심에서 좌(−)/우(+)</li>
</ul>
<div class="note blue">카메라는 도로 위 높이 <span class="reg">CAM_HEIGHT=1000</span>에 있으므로, 도로 바닥(y=0)의 camera.y는 −1000이 됩니다.</div>`},

{t:'원근의 직관: 왜 나누는가', k:'INTUITION', h:`
<p>손가락을 눈앞에 대면 크게 보이고, 멀리 뻗으면 작게 보입니다. <b>같은 크기의 물체라도 멀수록 작게 보인다</b> — 이것이 원근입니다.</p>
<p>수학으로는 놀랄 만큼 단순합니다.</p>
<pre class="code" data-lang="math">화면 크기 ∝ 1 / 거리
       즉  scale = (상수) / z</pre>
<ul class="b">
<li>z가 2배 멀어지면 → 화면 크기는 <b>절반</b></li>
<li>z가 10배 → 화면 크기는 <b>1/10</b></li>
<li>z가 무한대(지평선) → 크기 <b>0</b> (한 점으로 수렴)</li>
</ul>
<div class="note cyn">이 <b>1/z</b> 나눗셈 하나가 유사 3D의 전부입니다. 나머지는 화면에 맞추는 곱셈일 뿐입니다.</div>`},

{t:'핵심 공식: scale = depth / z', k:'MATH', h:`
<p>비례식의 상수를 <b>cameraDepth</b>라 부릅니다. 이것이 투영의 심장 공식입니다.</p>
<pre class="code" data-lang="math">scale = cameraDepth / z

  cameraDepth = 1 / tan(fov / 2)</pre>
<ul class="b">
<li><b>scale</b> — 이 거리에서 <em>월드 1단위가 화면에서 차지하는 비율</em></li>
<li><b>cameraDepth</b> — 눈에서 <em>투영면(스크린)까지의 거리</em></li>
<li><b>z</b> — 카메라 기준 깊이(camera.z)</li>
</ul>
<div class="note mag">scale은 이후 <b>모든 화면 좌표를 만드는 배율</b>입니다. x·y·폭 전부 이 scale을 곱해서 나옵니다.</div>`},

{t:'cameraDepth = 1/tan(fov/2)', k:'DEPTH', h:`
<p>왜 하필 <span class="reg">1/tan(fov/2)</span>일까요? 카메라를 옆에서 본 그림으로 이해합니다.</p>
<pre class="code" data-lang="math">눈 ●───────────┐ 투영면
   \\    fov/2   │ ↑ 화면 절반 높이 = 1 (정규화)
    \\           │
     \\──────────┘
     ← cameraDepth →

tan(fov/2) = (화면 절반 = 1) / cameraDepth
  ⇒ cameraDepth = 1 / tan(fov/2)</pre>
<ul class="b">
<li>화면 절반 높이를 <b>1</b>로 정규화하면, 눈에서 스크린까지 거리가 곧 cameraDepth</li>

<li>fov가 넓을수록 cameraDepth가 작아져 → 광각(줌아웃)</li>
</ul>`},

{t:'CAM_DEPTH를 코드로', k:'CODE', h:`
<p>우리 소스는 <span class="reg">love.load</span>에서 이 값을 한 번 계산해 상수로 씁니다. <span class="reg">FOV</span>는 100도.</p>

</ul>`},

{t:'데모로 보는 scale = depth/z', k:'DEMO1', h:`
<p>직접 만져 보며 감을 잡읍시다. 거리 <b>z</b>를 밀면 사각형이 작아지고, 시야각 <b>fov</b>를 바꾸면 배율이 달라집니다.</p>

<li>fov를 좁히면(망원) 같은 물체가 커 보입니다 (cameraDepth 증가)</li>
</ul>`},

{t:'2단계: 화면 X 좌표', k:'SCREEN-X', h:`
<p>scale을 얻었으니 화면 좌표로 갑니다. 먼저 가로.</p>
<pre class="code" data-lang="math">screenX = width/2 + scale · camera.x · width/2</pre>
<ul class="b">
<li><b>width/2</b> (앞) — 화면 <em>중앙</em>이 기준점. camera.x=0이면 정확히 가운데</li>
<li><b>scale · camera.x</b> — 멀면(scale 작음) 좌우 편차가 <em>줄어듦</em> → 원근</li>
<li><b>· width/2</b> (뒤) — 정규화 값을 픽셀 폭으로 환산</li>
</ul>
<div class="note">멀리 있는 두 점은 좌우로 벌어져 있어도 화면에선 가까이 모입니다. 그래서 도로가 <b>지평선의 한 점으로 수렴</b>합니다.</div>`},

{t:'3단계: 화면 Y 좌표', k:'SCREEN-Y', h:`
<p>세로는 부호가 <b>뺄셈</b>인 것이 포인트입니다. (2장의 y-아래로-증가 규칙 기억!)</p>
<pre class="code" data-lang="math">screenY = height/2 − scale · camera.y · height/2</pre>
<ul class="b">
<li><b>height/2</b> — 화면 중앙(지평선 높이)이 기준</li>
<li><b>− (뺄셈)</b> — 월드에서 <em>위(+y)</em>인 것을 화면에서 <em>위(작은 y)</em>로 보내려면 부호를 뒤집어야 함</li>
<li>도로 바닥은 camera.y가 음수(−CAM_HEIGHT) → 화면 <b>중앙보다 아래</b>에 그려짐</li>
</ul>
<div class="note blue">언덕(월드 y 변화)도 이 한 줄이 자동 처리합니다. y를 올리면 그 세그먼트가 화면에서 <em>위로</em> 솟습니다.</div>`},

{t:'4단계: 도로 폭', k:'SCREEN-W', h:`
<p>마지막으로 그 거리에서 <b>도로 반폭</b>이 화면에서 몇 픽셀인지 구합니다.</p>
<pre class="code" data-lang="math">screenW = scale · roadWidth · width/2

  roadWidth = ROAD_W = 2000 (도로 절반 폭, 월드 단위)</pre>
<ul class="b">
<li>구조가 screenX와 같습니다. <em>월드 길이 × scale × 화면환산</em></li>
<li>멀면 scale이 작아 <b>좁은 도로</b>, 가까우면 <b>넓은 도로</b></li>
<li>세그먼트의 사다리꼴은 <span class="reg">(screenX ± screenW)</span>로 좌우 모서리를 잡습니다</li>
</ul>
<div class="note cyn">이 세 값 <b>(sx, sy, sw)</b>만 있으면 세그먼트 하나를 완전히 그릴 수 있습니다. p1·p2 두 경계에 각각 적용하면 사다리꼴 완성.</div>`},

{t:'지평선: z가 커지면', k:'HORIZON', h:`
<p>공식이 극한에서 어떻게 되는지 보면 원근의 본질이 드러납니다.</p>
<pre class="code" data-lang="math">z → ∞  ⇒  scale = depth/z → 0

  screenX → width/2   (중앙)
  screenY → height/2  (중앙 높이 = 지평선)
  screenW → 0         (폭 없음)</pre>
<ul class="b">
<li>아주 먼 세그먼트들은 모두 <b>화면 중앙 한 점</b>으로 모입니다 = <em>소실점</em></li>
<li>그 높이 <span class="reg">height/2</span>가 곧 <b>지평선</b>입니다</li>
<li>그래서 아무리 도로가 길어도 화면 위쪽은 하늘이 차지합니다</li>
</ul>
<div class="note">지평선 위로는 그릴 세그먼트가 없으니, 거기에 <b>배경(하늘·태양·산)</b>을 깔면 됩니다 (8장).</div>`},

{t:'시야각(FOV)의 영향', k:'FOV', h:`
<p>같은 도로라도 FOV에 따라 느낌이 완전히 달라집니다.</p>
<div class="grid2">
<div class="card"><h3>좁은 FOV (60°)</h3><p>cameraDepth ↑ → 망원. 도로가 평평하게 압축되고 속도감이 줄어듭니다.</p></div>
<div class="card"><h3>넓은 FOV (120°)</h3><p>cameraDepth ↓ → 광각. 도로가 극적으로 벌어지고 스피드감이 강해집니다.</p></div>
</div>
<p>우리 게임은 <span class="reg">FOV=100</span>으로, 아웃런 특유의 <em>확 트인 속도감</em>을 냅니다. 앞 슬라이드의 projection 데모에서 fov 슬라이더로 직접 비교해 보세요.</p>`},

{t:'project() 함수 — 전체', k:'FUNC', h:`
<p>지금까지의 네 단계를 그대로 코드로 옮긴 것이 <span class="reg">project()</span>입니다. 한 점 <span class="reg">p</span>를 받아 세 좌표계를 채웁니다.</p>
<span class="codeLabel lua">Lua · outrun.lua</span>
<pre class="code" data-lang="lua">local function project(p, camX, camY, camZ)
  -- 1) 월드 → 카메라
  p.camera.x = (p.world.x or 0) - camX
  p.camera.y = (p.world.y or 0) - camY
  p.camera.z = (p.world.z or 0) - camZ
  -- 2) scale = depth / z  (분모는 0 나눗셈 보호)
  p.screen.scale = CAM_DEPTH / math.max(p.camera.z, 1e-6)</pre>
<p>여기까지가 <b>카메라 좌표 + scale</b>입니다. 다음 슬라이드에서 화면 좌표를 채웁니다.</p>`},

{t:'project() 함수 — 화면 좌표', k:'FUNC2', h:`
<p>이어서, scale로 <b>화면 픽셀</b>을 계산하는 나머지 절반입니다.</p>
<span class="codeLabel lua">Lua · outrun.lua</span>
<pre class="code" data-lang="lua">  -- 3) 화면 좌표 (math.floor로 픽셀 정렬)
  p.screen.x = math.floor((W/2) + (p.screen.scale * p.camera.x * W/2))
  p.screen.y = math.floor((H/2) - (p.screen.scale * p.camera.y * H/2))
  p.screen.w = math.floor(p.screen.scale * ROAD_W * W/2)
end</pre>
<ul class="b">
<li>세 줄이 각각 <b>screenX · screenY · screenW</b> 공식 그대로입니다</li>
<li>Y만 <b>−</b>(뺄셈), 나머지는 <b>+</b>·곱셈</li>
<li><span class="reg">math.floor</span>로 정수 픽셀에 맞춰 경계선 떨림을 줄입니다</li>
</ul>
<div class="note">공식 → 코드가 <em>1:1로 대응</em>합니다. 수학을 이해하면 코드가 저절로 읽힙니다.</div>`},

{t:'숫자로 확인하는 예제', k:'EXAMPLE', h:`
<p>실제 값을 넣어 봅시다. <span class="reg">CAM_DEPTH=0.839</span>, <span class="reg">ROAD_W=2000</span>, <span class="reg">CAM_HEIGHT=1000</span>, 화면 <span class="reg">W=900, H=540</span>. 도로 중앙(월드 x=0, y=0)의 한 점을 봅니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>깊이 z</th><th>scale = 0.839/z</th><th>screenY</th><th>screenW</th></tr>
<tr><td>1000 (가까움)</td><td>0.000839</td><td>≈ 496 (아래)</td><td>≈ 755</td></tr>
<tr><td>5000 (멂)</td><td>0.000168</td><td>≈ 315</td><td>≈ 151</td></tr>
<tr><td>→ ∞ (지평선)</td><td>→ 0</td><td>→ 270</td><td>→ 0</td></tr>
</table></div>
<pre class="code" data-lang="math">z=5000: scale = 0.839/5000 = 0.000168
  screenX = 450 + 0.000168·0·450 = 450   (중앙)
  screenY = 270 − 0.000168·(−1000)·270 = 315
  screenW = 0.000168·2000·450 = 151</pre>
<p>멀수록 <b>y는 270(지평선)에 가까워지고</b>, <b>폭은 0으로 줄어듭니다.</b> 공식이 정확히 작동합니다.</p>`},

{t:'풀 도로로 검증', k:'DEMO2', h:`
<p>마지막으로, 이 공식이 세그먼트 전체에 적용되면 어떤 도로가 되는지 봅니다. 카메라 높이와 시야각을 바꿔 <b>screenY·screenW 변화</b>를 눈으로 확인하세요.</p>
<div class="demoWrap"><div class="dTitle">원근 투영 · 완전한 직선 도로</div>
<canvas class="demo" data-demo="projection" width="640" height="360"></canvas>
<div class="ctl">
<label>카메라높이 <input type="range" data-p="cam" min="300" max="2500" step="50" value="1000"></label>
<label>시야각 <input type="range" data-p="fov" min="60" max="140" step="1" value="100"><span class="val" data-v="fov">100°</span></label>
<label>속도 <input type="range" data-p="speed" min="0" max="1" step="0.05" value="0.4"></label>
</div></div>
<ul class="b">
<li><b>카메라높이 ↑</b> → 도로를 <em>내려다보는</em> 시점, 지평선 아래 도로가 넓어짐</li>
<li><b>시야각 ↑</b> → 도로가 극적으로 벌어짐 (스피드감 ↑)</li>
</ul>`},

{t:'3장 정리', k:'RECAP', h:`
<div class="big">모든 것은 <span class="hero">scale = depth / z</span></div>
<ul class="b">
<li>월드 좌표를 <b>카메라 좌표</b>로 옮긴 뒤, <em>1/z</em>로 원근 배율 scale을 얻습니다</li>
<li><span class="reg">cameraDepth = 1/tan(fov/2)</span>가 배율의 상수, FOV가 시야를 정합니다</li>
<li>screenX·screenY·screenW는 <b>scale에 화면 크기를 곱한</b> 결과 (Y만 뺄셈)</li>
<li>z→∞면 모두 <b>지평선 한 점</b>으로 수렴 = 원근의 본질</li>
<li>이 전부가 <span class="reg">project()</span> 함수 한 개에 담깁니다</li>
</ul>
<div class="note cyn">투영을 손에 넣었습니다. 다음 장(4장)에서는 이 점들을 이어 <b>실제 도로 세그먼트</b>를 만들고 트랙을 짓습니다.</div>`},

]});
</script>
<script>

CH({
icon:'🛣️', title:'도로를 <span class="em">세그먼트</span>로',
desc:'도로는 하나의 긴 곡면이 아니라, z축을 따라 잘게 자른 사다리꼴 조각(세그먼트)의 리스트입니다. 자료구조를 정하고, 평평한 직선 도로를 만들고, 렌더 루프의 뼈대를 세웁니다.',
slides:[

{t:'도로 = 조각들의 리스트', k:'CONCEPT', h:`
<p>3장에서 만든 <em>project()</em>는 월드의 한 점을 화면으로 옮겨줍니다. 이제 그 점들을 모아 <b>도로</b>를 그릴 차례입니다.</p>
<p>핵심 발상: 도로를 하나의 매끈한 곡면으로 다루지 않습니다. 대신 z축(앞으로 뻗는 축)을 일정 간격으로 잘라, <em>사다리꼴 조각</em>을 죽 이어 붙입니다. 각 조각을 <b>세그먼트(segment)</b>라고 부릅니다.</p>
<ul class="b">
<li>세그먼트 하나는 <b>두 개의 z평면</b> 사이를 잇는 사다리꼴입니다.</li>
<li>가까운 면 <span class="reg">p1</span>, 먼 면 <span class="reg">p2</span>.</li>
<li>도로 전체 = <span class="reg">segments</span> 배열.</li>
</ul>
<div class="note">곡선도 언덕도, 결국 이 사다리꼴들을 어떻게 배치하느냐의 문제로 환원됩니다. 지금은 가장 단순한 <b>평평한 직선</b>부터 만듭니다.</div>`},

{t:'한 세그먼트 = 사다리꼴', k:'CONCEPT', h:`
<p>세그먼트는 z가 <span class="reg">n·SEG_LEN</span>인 가까운 모서리 <b>p1</b>과, z가 <span class="reg">(n+1)·SEG_LEN</span>인 먼 모서리 <b>p2</b> 사이의 띠입니다.</p>
<p>원근 투영을 거치면 먼 쪽(p2)은 화면에서 <em>좁고 위쪽</em>, 가까운 쪽(p1)은 <em>넓고 아래쪽</em>에 놓입니다. 그래서 사다리꼴이 됩니다.</p>
<ul class="b">
<li>가로 반폭은 <span class="reg">p.screen.w</span> — 투영 스케일에 비례해 자동으로 정해집니다.</li>
<li>세로 위치는 <span class="reg">p.screen.y</span> — 멀수록 화면 중앙(지평선)에 가까워집니다.</li>
</ul>
<div class="note blue">즉 우리는 각 세그먼트의 p1, p2 두 점만 투영하면 됩니다. 나머지는 그 두 점으로 사다리꼴을 채우는 일(5장)입니다.</div>`},

{t:'세그먼트 자료구조', k:'DATA', h:`
<p>세그먼트 하나가 담는 정보는 다음과 같습니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>필드</th><th>뜻</th></tr>
<tr><td><span class="reg">index</span></td><td>배열에서의 순번(0부터). z 계산과 색 교대에 쓰임</td></tr>
<tr><td><span class="reg">p1</span></td><td>가까운 모서리 점 {world, camera, screen}</td></tr>
<tr><td><span class="reg">p2</span></td><td>먼 모서리 점 {world, camera, screen}</td></tr>
<tr><td><span class="reg">curve</span></td><td>이 조각의 휘어짐 정도(곡률). 직선이면 0</td></tr>
<tr><td><span class="reg">color</span></td><td>라이트/다크 색 팔레트(럼블·도로·잔디)</td></tr>
<tr><td><span class="reg">sprites, cars</span></td><td>이 조각에 붙은 도로변 오브젝트·차량</td></tr>
</table></div>
<div class="note">지금 장에서는 <b>index / p1 / p2 / curve / color</b>에 집중합니다. sprites·cars는 뒤 장에서 채웁니다.</div>`},

{t:'점 하나는 좌표 3벌을 가진다', k:'DATA', h:`
<p>p1, p2 각각은 같은 점을 <b>세 좌표계</b>로 표현합니다. 3장 project()가 이 셋을 순서대로 채웁니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>좌표</th><th>내용</th></tr>
<tr><td><span class="reg">world</span></td><td>월드 좌표 {x, y, z}. 도로가 실제로 놓인 자리</td></tr>
<tr><td><span class="reg">camera</span></td><td>카메라 기준 상대 좌표(월드 − 카메라)</td></tr>
<tr><td><span class="reg">screen</span></td><td>화면 픽셀 {x, y, w, scale}</td></tr>
</table></div>
<pre class="code" data-lang="lua">p1 = { world={y=prevY, z=n*SEG_LEN},
       camera={}, screen={} }</pre>
<p>만들 때 <b>world만</b> 채워 두고, camera·screen은 빈 테이블로 둡니다. 매 프레임 render()가 project()로 채웁니다. 도로 모양은 world에 이미 고정되어 있고, 화면 좌표만 카메라 위치에 따라 새로 계산되는 구조입니다.</p>`},

{t:'SEG_LEN — 한 조각의 z 길이', k:'CONST', h:`
<p>세그먼트 하나가 z축으로 차지하는 길이는 상수 하나로 정합니다.</p>
<pre class="code" data-lang="lua">local SEG_LEN = 200   -- 세그먼트 하나의 z 길이</pre>
<p>따라서 index가 <span class="reg">n</span>인 세그먼트는 z 구간 <em>[n·200, (n+1)·200]</em>를 덮습니다.</p>
<ul class="b">
<li>SEG_LEN이 작을수록 조각이 촘촘 → 곡선·언덕이 부드럽지만 그릴 폴리곤이 많아짐.</li>
<li>클수록 가볍지만 각져 보임. 200은 균형점입니다.</li>
</ul>
<div class="note cyn">최고 속도도 이 값에 묶여 있습니다: <span class="reg">MAX_SPEED = SEG_LEN * 60</span> — 초당 세그먼트 60개를 지나가는 속도입니다.</div>`},

{t:'addSegment() — 조각 하나 추가', k:'LÖVE', h:`
<span class="codeLabel lua">Lua · addSegment</span>
<pre class="code" data-lang="lua">local function lastY()
  return (#segments==0) and 0
    or segments[#segments].p2.world.y
end

local function addSegment(curve, y)
  local n = #segments
  local prevY = lastY()
  segments[n+1] = {
    index = n,
    p1 = { world={y=prevY, z=n*SEG_LEN},
           camera={}, screen={} },
    p2 = { world={y=y, z=(n+1)*SEG_LEN},
           camera={}, screen={} },
    curve = curve,
    sprites = {}, cars = {},
    color = (math.floor(n/RUMBLE_LEN)%2==1)
              and COLORS.DARK or COLORS.LIGHT,
  }
end</pre>`},

{t:'addSegment 뜯어보기', k:'LÖVE', h:`
<p>인자는 딱 둘: 이 조각의 <b>curve</b>(곡률)와 <b>y</b>(먼 쪽 끝 높이)입니다.</p>
<ul class="b">
<li><b>index = #segments</b> — 지금까지 몇 개 쌓였는지가 곧 순번(0-기반).</li>
<li><b>z는 index로 자동</b>: p1.z = n·SEG_LEN, p2.z = (n+1)·SEG_LEN. 조각들이 z축에서 끊김 없이 이어집니다.</li>
<li><b>prevY = lastY()</b> — 직전 조각의 p2 높이를 이 조각의 p1로 물려받아, 도로 표면이 계단 없이 연속됩니다.</li>
<li><b>color</b> — <span class="reg">floor(index/RUMBLE_LEN)%2</span>로 3칸마다 라이트/다크가 번갈아. (색은 5장에서 자세히)</li>
</ul>
<div class="note">평평한 도로는 <span class="reg">y</span>를 계속 <b>0</b>으로 주면 됩니다. 언덕은 y를 올렸다 내렸다 하면 되고요.</div>`},

{t:'findSegment(z) — z로 조각 찾기', k:'LÖVE', h:`
<p>카메라가 z 위치 <span class="reg">position</span>에 있을 때, 지금 밟고 있는 세그먼트가 무엇인지 즉시 알아야 합니다. 나눗셈 한 번이면 됩니다.</p>
<span class="codeLabel lua">Lua · findSegment</span>
<pre class="code" data-lang="lua">local function findSegment(z)
  return segments[math.floor(z/SEG_LEN)
           % #segments + 1]
end</pre>
<ul class="b">
<li><b>floor(z / SEG_LEN)</b> → z가 몇 번째 조각 구간인지.</li>
<li><b>% #segments</b> → 트랙을 한 바퀴 넘어가면 다시 처음으로(순환 트랙).</li>
<li><b>+ 1</b> → Lua 배열은 1부터 시작하므로 보정.</li>
</ul>
<div class="note blue">이 함수 덕분에 무한히 도는 서킷을 유한한 배열로 표현할 수 있습니다. 랩(lap) 개념도 여기서 나옵니다.</div>`},

{t:'평평한 직선 도로 만들기', k:'BUILD', h:`
<p>이제 조각을 죽 쌓으면 도로가 생깁니다. 가장 단순한 버전 — <b>곡률 0, 높이 0</b>을 필요한 만큼 반복.</p>
<pre class="code" data-lang="lua">segments = {}
for i=1,500 do
  addSegment(0, 0)   -- curve=0, y=0 → 평평한 직선
end
trackLength = #segments * SEG_LEN</pre>
<p>단 몇 줄로 500조각(= z축 10만 단위) 길이의 곧은 도로가 만들어졌습니다. 색은 addSegment 안에서 3칸마다 자동 교대되므로, 벌써 <em>줄무늬 럼블</em>이 생길 준비가 됩니다.</p>
<div class="note cyn">실제 게임의 <span class="reg">buildTrack()</span>은 이 반복 대신 <span class="reg">addRoad()</span>로 곡선·언덕을 섞어 넣습니다(6장). 원리는 같습니다 — 결국 addSegment를 여러 번 부를 뿐.</div>`},

{t:'왜 그리는 순서가 중요한가', k:'RENDER', h:`
<p>사다리꼴들은 화면에서 서로 <b>겹칩니다</b>. 특히 언덕 뒤의 도로는 앞 언덕에 <em>가려져야</em> 자연스럽습니다. 그래서 순서·가림 처리가 필요합니다.</p>
<ul class="b">
<li><b>고전 방식(painter, 뒤→앞)</b>: 먼 조각부터 그리고 가까운 조각으로 덮어씌운다. 스프라이트·차량은 이 방식으로 그립니다.</li>
<li><b>이 게임의 도로(앞→뒤 + maxy)</b>: 가까운 조각부터 그리되, <em>이미 칠한 가장 높은 화면 y</em>를 기록해 두고, 그보다 아래로 내려오는 먼 조각은 <b>건너뜁니다</b>.</li>
</ul>
<div class="note">앞→뒤 + maxy 방식은 언덕에 가린 도로를 아예 그리지 않아 <b>덧칠(overdraw)이 없고 빠릅니다</b>. 다음 슬라이드부터 이 루프의 뼈대를 세웁니다.</div>`},

{t:'render() 뼈대 ① 기준 세그먼트', k:'RENDER', h:`
<p>렌더는 카메라가 서 있는 <b>기준 세그먼트</b>를 찾는 데서 시작합니다.</p>
<span class="codeLabel lua">Lua · render 앞부분</span>
<pre class="code" data-lang="lua">local baseSeg = findSegment(position)
local basePercent = (position % SEG_LEN)/SEG_LEN
local camH = CAM_HEIGHT + baseSeg.p1.world.y
  + (baseSeg.p2.world.y - baseSeg.p1.world.y)*basePercent
local maxy = H
local x, dx = 0, -(baseSeg.curve * basePercent)</pre>
<ul class="b">
<li><b>basePercent</b> — 기준 조각 안에서 얼마나 지나왔는지(0~1). 카메라 높이를 조각 사이에서 부드럽게 보간할 때 씀.</li>
<li><b>camH</b> — 눈높이. 언덕 위에 있으면 지형 높이만큼 함께 올라감.</li>
<li><b>maxy = H</b> — 처음엔 화면 맨 아래. 그릴수록 위로 좁혀 감(가림 처리).</li>
<li><b>x, dx</b> — 곡선 누적용(6장에서 본격 설명). 직선이면 0.</li>
</ul>`},

{t:'render() 뼈대 ② 앞으로 훑기', k:'RENDER', h:`
<p>기준 조각부터 <span class="reg">DRAW_DIST</span>개를 <b>가까운 것부터</b> 훑으며 p1·p2를 투영합니다.</p>
<span class="codeLabel lua">Lua · 메인 루프</span>
<pre class="code" data-lang="lua">for n=0,DRAW_DIST-1 do
  local seg = segments[(baseSeg.index+n)%#segments+1]
  local looped = seg.index &lt; baseSeg.index
  local camZ = position - (looped and trackLength or 0)

  project(seg.p1, playerX*ROAD_W - x,      camH, camZ)
  project(seg.p2, playerX*ROAD_W - x - dx, camH, camZ)
  x  = x + dx
  dx = dx + seg.curve
  ...</pre>
<ul class="b">
<li><b>DRAW_DIST = 300</b> — 앞으로 최대 300조각까지 그림(그 너머는 안개 속).</li>
<li><b>looped / camZ</b> — 트랙 끝을 넘어 순환할 때 z를 trackLength만큼 당겨 연속되게 함.</li>
<li><b>project 두 번</b> — p1, p2를 화면 좌표로. 이제 사다리꼴을 그릴 수 있음.</li>
</ul>`},

{t:'render() 뼈대 ③ maxy 클리핑', k:'RENDER', h:`
<p>투영이 끝나면, 이 조각을 <b>그릴지 버릴지</b> 세 조건으로 판정합니다.</p>
<span class="codeLabel lua">Lua · 그리기 판정</span>
<pre class="code" data-lang="lua">  if seg.p1.camera.z &lt;= CAM_DEPTH       -- 카메라 뒤
     or seg.p2.screen.y &gt;= seg.p1.screen.y -- 뒤집힘
     or seg.p2.screen.y &gt;= maxy then      -- 이미 가려짐
    -- 건너뜀
  else
    renderSegment(seg, fogAmt)
    maxy = seg.p2.screen.y
  end
end</pre>
<ul class="b">
<li><b>camera.z ≤ CAM_DEPTH</b>: 카메라 뒤/너무 가까움 → 투영이 폭발하므로 스킵.</li>
<li><b>p2.y ≥ p1.y</b>: 먼 모서리가 가까운 모서리보다 아래 → 뒤집힌 조각, 스킵.</li>
<li><b>p2.y ≥ maxy</b>: 먼 모서리가 이미 칠한 영역 아래 → 언덕에 가림, 스킵.</li>
</ul>`},

{t:'maxy가 지평선을 좁혀 간다', k:'RENDER', h:`
<p>핵심은 마지막 줄, <span class="reg">maxy = seg.p2.screen.y</span> 입니다.</p>
<p>세그먼트를 하나 그릴 때마다 <b>가장 위(작은 y)에 칠한 지점</b>을 maxy로 기록합니다. 다음(더 먼) 조각의 먼 모서리가 그보다 <em>아래에 있으면</em>, 그 조각은 이미 그린 도로/언덕에 완전히 가려진 것이므로 통째로 건너뜁니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>상황</th><th>maxy 효과</th></tr>
<tr><td>평지</td><td>y가 계속 위로 → 지평선까지 촘촘히 그림</td></tr>
<tr><td>언덕 뒤</td><td>정상 뒤 도로는 p2.y가 maxy보다 아래 → 스킵(덧칠 0)</td></tr>
</table></div>
<div class="note">그래서 painter처럼 뒤에서부터 덧칠하지 않아도, 가까운 것부터 그리며 <b>가림을 정확히</b> 처리할 수 있습니다.</div>`},

{t:'데모: 평평한 직선 도로', k:'DEMO', h:`
<p>지금까지의 조립을 눈으로 확인합시다. 세그먼트 색이 3칸마다 교대되며 <em>흘러가는</em> 것이 보입니다 — 도로가 실제로 움직이는 게 아니라, position이 늘며 findSegment가 가리키는 조각이 바뀌는 것입니다.</p>
<div class="demoWrap"><div class="dTitle">평평한 직선 도로 스크롤</div>
<canvas class="demo" data-demo="roadflat" width="640" height="360"></canvas>
<div class="ctl"><label>속도 <input type="range" data-p="speed" min="0" max="1" step="0.05" value="0.5"><span class="val" data-v="speed">0.5</span></label></div></div>
<ul class="b">
<li>가까운 조각은 넓고 크게, 먼 조각은 좁고 촘촘하게 — 원근 스케일의 결과.</li>
<li>먼 곳은 한 점(지평선)으로 수렴. 그 위는 아직 빈 하늘.</li>
</ul>`},

{t:'4장 정리', k:'RECAP', h:`
<p>도로를 <b>세그먼트 배열</b>로 표현하는 뼈대를 세웠습니다.</p>
<ul class="b">
<li>세그먼트 = 두 z평면(p1·p2) 사이의 <b>사다리꼴</b>. index로 z가 자동 결정.</li>
<li>각 점은 <b>world / camera / screen</b> 세 좌표를 가짐. world만 저장, 화면 좌표는 매 프레임 project.</li>
<li><b>addSegment(curve, y)</b>로 조각을 쌓고, <b>findSegment(z)</b>로 즉시 조회(순환).</li>
<li>render는 기준 조각부터 <b>앞으로 훑으며</b> 투영하고, <b>maxy 클리핑</b>으로 가림을 처리.</li>
</ul>
<div class="note blue">다음 장(5장): 투영된 p1·p2로 <b>실제 폴리곤</b> — 잔디·럼블·도로·차선을 그려 도로에 색을 입힙니다.</div>`},

]});

CH({
icon:'🎨', title:'도로 그리기: <span class="em">폴리곤·럼블·차선</span>',
desc:'투영된 두 모서리 p1·p2로 세그먼트 하나를 네 겹의 사다리꼴(잔디·럼블·도로·차선)로 채웁니다. 색을 라이트/다크로 교대해 속도감 나는 줄무늬를 만들고, 출발·도착 체커까지 입힙니다.',
slides:[

{t:'세그먼트 하나 = 네 겹의 폴리곤', k:'CONCEPT', h:`
<p>4장에서 각 세그먼트의 p1·p2 화면 좌표를 얻었습니다. 이제 그 사이를 <b>사다리꼴 4장</b>으로 겹쳐 칠하면 도로가 됩니다.</p>
<ol>
<li><b>잔디</b> — 화면 전체 폭(가장 아래에 깔림)</li>

</ol>
<div class="note">뒤엣것 위에 앞엣것을 덮는 순서이므로 <b>잔디 → 럼블 → 도로 → 차선</b> 순으로 그립니다. 모두 같은 두 y선(p1.y, p2.y) 사이를 채우는 사다리꼴입니다.</div>`},

{t:'사다리꼴의 네 꼭짓점', k:'MATH', h:`
<p>모든 폴리곤은 위(먼 쪽, p2)와 아래(가까운 쪽, p1) 두 변을 잇는 사다리꼴입니다. 도로 폴리곤의 꼭짓점은 다음과 같습니다.</p>
<pre class="code" data-lang="math">가까운 아래변(p1.y):  x ∈ [p1.x - p1.w,  p1.x + p1.w]
먼   위변(p2.y):      x ∈ [p2.x - p2.w,  p2.x + p2.w]</pre>
<ul class="b">
<li><b>p.x</b> — 그 모서리의 도로 중심 화면 x.</li>
<li><b>p.w</b> — 그 모서리의 도로 반폭(픽셀). 멀수록 작아짐 → 위변이 좁은 사다리꼴.</li>
</ul>
<div class="note blue">럼블·차선도 이 x 범위를 좌우로 살짝 늘리거나(럼블), 안쪽 비율로 나눠(차선) 같은 두 y선 사이에 그립니다.</div>`},

{t:'quad() — 채운 사각형 헬퍼', k:'LÖVE', h:`
<p>Love2D에서 임의의 4각형을 색으로 채우는 헬퍼를 하나 둡니다.</p>
<span class="codeLabel lua">Lua · quad</span>
<pre class="code" data-lang="lua">local function quad(x1,y1,x2,y2,x3,y3,x4,y4,col)
  love.graphics.setColor(col)
  love.graphics.polygon('fill', x1,y1, x2,y2,
                                x3,y3, x4,y4)
end</pre>
<p><span class="reg">love.graphics.polygon('fill', ...)</span>은 넘긴 꼭짓점을 이어 내부를 채웁니다. 꼭짓점은 시계/반시계 어느 방향이든 볼록 사각형이면 잘 채워집니다.</p>
<div class="note">색 <span class="reg">col</span>은 {r,g,b} 테이블(각 0~1). 안개가 낀 먼 조각은 이 색을 노을색과 섞어 넣습니다(뒤 슬라이드).</div>`},

{t:'① 잔디 — 전체 폭', k:'LÖVE', h:`
<p>가장 먼저, 화면 <b>가로 전체</b>를 잔디색으로 칠합니다. 도로 밖 배경이 되는 바닥입니다.</p>
<pre class="code" data-lang="lua">local p1,p2 = seg.p1.screen, seg.p2.screen
-- 잔디(전체 폭): 왼끝 0 ~ 오른끝 W
quad(0,p1.y, W,p1.y, W,p2.y, 0,p2.y, grass)</pre>
<ul class="b">
<li>x는 <b>0 ~ W</b> 고정(도로 폭과 무관), y만 p1.y·p2.y 두 선.</li>
<li>즉 잔디는 그 조각이 차지하는 <em>가로 띠 전체</em>를 채웁니다.</li>
<li>그 위에 럼블·도로를 덮으므로, 도로 양옆에 잔디가 남습니다.</li>
</ul>
<div class="note cyn">잔디색 <span class="reg">grass</span>는 라이트/다크 세그먼트에 따라 살짝 다른 초록입니다(색표는 뒤에).</div>`},

{t:'② 럼블 — 도로 양쪽 줄무늬', k:'LÖVE', h:`
<p>도로 가장자리의 빨강/흰 줄무늬(럼블 스트립)를 좌우 두 장 그립니다. 폭은 도로 반폭의 <b>1/6</b>.</p>
<span class="codeLabel lua">Lua · 럼블</span>
<pre class="code" data-lang="lua">local r1,r2 = p1.w/6, p2.w/6
-- 왼쪽 럼블(도로 왼끝에서 바깥으로 r만큼)
quad(p1.x-p1.w-r1,p1.y, p1.x-p1.w,p1.y,
     p2.x-p2.w,  p2.y, p2.x-p2.w-r2,p2.y,
     mix(SKY_BOT,c.rumble,fogAmt))
-- 오른쪽 럼블(도로 오른끝에서 바깥으로)
quad(p1.x+p1.w+r1,p1.y, p1.x+p1.w,p1.y,
     p2.x+p2.w,  p2.y, p2.x+p2.w+r2,p2.y,
     mix(SKY_BOT,c.rumble,fogAmt))</pre>
<p>왼쪽은 도로 왼끝(<span class="reg">x-w</span>)에서 바깥으로 r만큼, 오른쪽은 오른끝(<span class="reg">x+w</span>)에서 바깥으로 r만큼 채웁니다.</p>`},

{t:'③ 도로 — 가운데 아스팔트', k:'LÖVE', h:`
<p>럼블 안쪽을 도로색으로 채웁니다. 2장에서 본 사다리꼴 그대로입니다.</p>
<span class="codeLabel lua">Lua · 도로</span>
<pre class="code" data-lang="lua">quad(p1.x-p1.w,p1.y, p1.x+p1.w,p1.y,
     p2.x+p2.w,p2.y, p2.x-p2.w,p2.y,
     mix(SKY_BOT,c.road,fogAmt))</pre>
<ul class="b">

<li>위변: p2.x ± p2.w (좁음)</li>
</ul>
<p>이 시점에서 도로는 이미 형태가 완성됩니다. 남은 건 그 위에 차선을 얹는 일뿐입니다.</p>
<div class="note">잔디·럼블·도로가 <b>같은 두 y선</b>을 공유하므로 이음매에 틈이 생기지 않습니다.</div>`},

{t:'④ 차선 — 라이트 세그먼트에만', k:'LÖVE', h:`
<p>마지막으로 도로 위 흰 차선. LANES=3이므로 차선 구분선은 2개입니다.</p>
<span class="codeLabel lua">Lua · 차선</span>
<pre class="code" data-lang="lua">if c.lane then
  local lw1 = p1.w*0.02   -- 아래쪽 선 반폭
  local lw2 = p2.w*0.02   -- 위쪽 선 반폭

    quad(lx1-lw1,p1.y, lx1+lw1,p1.y,
         lx2+lw2,p2.y, lx2-lw2,p2.y,
         mix(SKY_BOT,c.lane,fogAmt))
  end
end</pre>
<p><span class="reg">c.lane</span>은 <b>라이트 팔레트에만</b> 정의되어 있어, 다크 조각에는 차선이 안 그려집니다 → 점선 효과.</p>`},

{t:'차선 x 위치의 수학', k:'MATH', h:`
<p>차선 <span class="reg">l</span>(1..LANES-1)의 중심 x는 도로를 <b>LANES등분</b>한 지점입니다.</p>
<pre class="code" data-lang="math">도로 왼끝  = p.x - p.w
도로 폭    = 2·p.w
차선 l 중심 = (p.x - p.w) + 2·p.w · (l / LANES)</pre>
<ul class="b">
<li>LANES=3이면 l=1 → 왼쪽 1/3 지점, l=2 → 2/3 지점.</li>
<li>선 반폭은 도로 반폭의 <b>2%</b>(<span class="reg">p.w*0.02</span>) — 멀수록 자동으로 가늘어짐.</li>
<li>p1(아래)·p2(위)에서 각각 계산해 이어 붙이므로 차선도 원근에 맞게 좁아집니다.</li>
</ul>`},

{t:'라이트/다크 색 교대', k:'MATH', h:`
<p>속도감의 핵심은 <b>색이 번갈아 흐르는 줄무늬</b>입니다. 세그먼트 색은 index로 결정합니다(4장 addSegment).</p>
<pre class="code" data-lang="math">RUMBLE_LEN = 3
색 = (floor(index / RUMBLE_LEN) % 2 == 1)
        ? DARK : LIGHT</pre>
<ul class="b">

<li>즉 <b>3칸마다</b> 라이트·다크가 교대. 이 3칸 묶음이 함께 흘러가며 속도를 체감시킵니다.</li>
<li>럼블(가장자리)과 도로·잔디 모두 이 팔레트를 따라 미묘하게 달라집니다.</li>

{t:'색 팔레트 표', k:'DATA', h:`

{t:'renderSegment() 전체 ①', k:'CODE', h:`
<p>지금까지의 네 겹을 하나로 묶은 실제 함수입니다(앞 절반).</p>
<span class="codeLabel lua">Lua · renderSegment</span>
<pre class="code" data-lang="lua">local function renderSegment(seg, fogAmt)
  local c = seg.color
  local p1,p2 = seg.p1.screen, seg.p2.screen
  local grass = fogAmt &lt; 1
    and mix(SKY_BOT, c.grass, fogAmt) or c.grass
  -- ① 잔디(전체 폭)
  quad(0,p1.y, W,p1.y, W,p2.y, 0,p2.y, grass)
  -- ② 럼블
  local r1,r2 = p1.w/6, p2.w/6
  quad(p1.x-p1.w-r1,p1.y, p1.x-p1.w,p1.y,
       p2.x-p2.w,p2.y, p2.x-p2.w-r2,p2.y,
       mix(SKY_BOT,c.rumble,fogAmt))
  quad(p1.x+p1.w+r1,p1.y, p1.x+p1.w,p1.y,
       p2.x+p2.w,p2.y, p2.x+p2.w+r2,p2.y,
       mix(SKY_BOT,c.rumble,fogAmt))</pre>`},

{t:'renderSegment() 전체 ②', k:'CODE', h:`
<span class="codeLabel lua">Lua · renderSegment (이어서)</span>
<pre class="code" data-lang="lua">  -- ③ 도로
  quad(p1.x-p1.w,p1.y, p1.x+p1.w,p1.y,
       p2.x+p2.w,p2.y, p2.x-p2.w,p2.y,
       mix(SKY_BOT,c.road,fogAmt))
  -- ④ 차선(라이트 색 세그먼트에만)
  if c.lane then
    local lw1 = p1.w*0.02
    local lw2 = p2.w*0.02
    for l=1,LANES-1 do
      local lx1 = p1.x - p1.w + (p1.w*2)*(l/LANES)
      local lx2 = p2.x - p2.w + (p2.w*2)*(l/LANES)
      quad(lx1-lw1,p1.y, lx1+lw1,p1.y,
           lx2+lw2,p2.y, lx2-lw2,p2.y,
           mix(SKY_BOT,c.lane,fogAmt))
    end
  end
end</pre>
<p>단 하나의 세그먼트가 <b>잔디 → 럼블(좌·우) → 도로 → 차선</b> 순으로 완성됩니다. render 루프가 이 함수를 조각마다 부릅니다.</p>`},

{t:'안개는 색을 노을과 섞는다', k:'MATH', h:`
<p>모든 quad 색이 <span class="reg">mix(SKY_BOT, 색, fogAmt)</span>로 감싸여 있습니다. 이는 먼 조각을 <b>배경 노을색으로 흐리게</b> 만드는 장치입니다.</p>
<pre class="code" data-lang="math">mix(a, b, t) = a + (b - a)·t
fogAmt = 1  → 원래 색 그대로(가까움)
fogAmt → 0  → SKY_BOT(노을 핑크)로 수렴(멂)</pre>
<ul class="b">
<li>render가 조각마다 <span class="reg">fog(n/DRAW_DIST, FOG_DENSITY)</span>로 fogAmt를 넘겨줌.</li>
<li>가까울수록 1, 멀수록 0에 가까워져 지평선이 배경에 자연스럽게 녹아듦.</li>
</ul>
<div class="note blue">안개 공식 <span class="reg">exp(-density·d²)</span>의 자세한 유도는 뒤 장(안개)에서 다룹니다. 여기선 "먼 색은 노을과 섞인다"만 기억하면 충분합니다.</div>`},

{t:'출발·도착 체커 색', k:'DATA', h:`

{t:'5장 정리', k:'RECAP', h:`

{t:'핵심 공식: x와 dx의 누적', k:'MATH', h:`

{t:'왜 멀수록 더 휘나', k:'MATH', h:`

{t:'열이 미끄러진다', k:'CONCEPT', h:`

{t:'부드러운 진입: ease 함수', k:'MATH', h:`
<p>곡률을 갑자기 0 → 6으로 주면 도로가 각지게 꺾입니다. 그래서 커브를 <b>서서히</b> 넣고 뺍니다. 두 보간 함수를 씁니다.</p>
<span class="codeLabel lua">Lua · ease</span>
<pre class="code" data-lang="lua">local function easeIn(a,b,p)
  return a + (b-a)*p*p
end
local function easeInOut(a,b,p)
  return a + (b-a)*(-math.cos(p*math.pi)/2 + 0.5)
end</pre>
<ul class="b">
<li><b>easeIn</b> — p²로 시작이 느리고 끝이 빠름. 곡률을 0에서 서서히 키울 때.</li>
<li><b>easeInOut</b> — 코사인 S커브. 시작·끝 모두 부드럽게. 높이(y) 보간에 주로 사용.</li>
</ul>`},

{t:'addRoad() — 커브 구간 만들기', k:'CODE', h:`
<p>addSegment를 여러 번 부르되, <b>진입(enter)·유지(hold)·이탈(leave)</b> 세 단계로 곡률을 넣고 빼는 함수입니다.</p>
<span class="codeLabel lua">Lua · addRoad</span>
<pre class="code" data-lang="lua">local function addRoad(enter, hold, leave, curve, y)
  local startY = lastY()
  local endY   = startY + (y or 0) * SEG_LEN
  local total  = enter + hold + leave
  -- p2(먼 모서리)의 y는 (i+1)/total — 마지막 세그먼트가 endY에 정확히 도달
  for i=0,enter-1 do
    addSegment(easeIn(0,curve,i/enter),
               easeInOut(startY,endY,(i+1)/total)) end
  for i=0,hold-1 do
    addSegment(curve,
               easeInOut(startY,endY,(enter+i+1)/total)) end
  for i=0,leave-1 do
    addSegment(easeInOut(curve,0,i/leave),
               easeInOut(startY,endY,(enter+hold+i+1)/total)) end
end</pre>`},

{t:'addRoad 세 단계 뜯어보기', k:'CODE', h:`

<tr><td><b>hold</b></td><td>curve 유지</td><td>일정</td></tr>
<tr><td><b>leave</b></td><td>curve → 0</td><td>easeInOut (부드럽게 풀림)</td></tr>
</table></div>
<ul class="b">
<li>커브가 <b>느슨하게 시작 → 최대로 감김 → 느슨하게 풀림</b>. 실제 도로의 클로소이드(완화곡선)를 흉내.</li>
<li>동시에 높이 y도 easeInOut으로 보간 → 커브와 언덕을 <b>한 번에</b> 넣을 수 있음.</li>

{t:'언덕은 왜 "공짜"인가', k:'CONCEPT', h:`
<p>지금까지 세그먼트는 <span class="reg">z</span>(깊이)와 <span class="reg">curve</span>(휨)만 신경 썼습니다. 그런데 우리 <b>project()</b>는 이미 <em>3차원</em> 좌표 <span class="reg">{x, y, z}</span>를 모두 받습니다.</p>
<ul class="b">
<li>곡선은 화면 <b>가로(x)</b>를 밀었습니다.</li>
<li>언덕은 화면 <b>세로(y)</b>를 밀 뿐입니다.</li>
<li>둘 다 같은 원근 투영 공식 하나로 처리됩니다.</li>
</ul>
<div class="note">핵심: 세그먼트마다 <b>world.y</b>(그 지점의 도로 높이)를 저장해 두면, 멀리 있는 언덕 꼭대기는 화면에서 <em>위로</em> 솟고, 골짜기는 <em>아래로</em> 꺼집니다. 새 렌더러가 필요 없습니다.</div>`},

{t:'세그먼트에 y를 저장한다', k:'LUA', h:`
<p>각 세그먼트는 시작점 <span class="reg">p1</span>과 끝점 <span class="reg">p2</span>를 갖습니다. 여기에 <b>world.y</b>를 넣습니다. 이전 세그먼트의 끝 높이가 다음 세그먼트의 시작 높이가 되도록 이어 붙입니다.</p>
<pre class="code" data-lang="lua">local function lastY()
  return (#segments==0) and 0
         or segments[#segments].p2.world.y
end

local function addSegment(curve, y)
  local n = #segments
  local prevY = lastY()          -- 앞 세그먼트 끝 높이
  segments[n+1] = {
    index = n,
    p1 = { world={y=prevY, z=n*SEG_LEN},     camera={}, screen={} },
    p2 = { world={y=y,     z=(n+1)*SEG_LEN}, camera={}, screen={} },
    curve = curve, sprites={}, cars={},
  }
end</pre>
<p><b>prevY → y</b> 로 이어지므로 도로 높이가 <em>끊기지 않고</em> 연속됩니다.</p>`},

{t:'투영 공식이 y를 화면으로 옮긴다', k:'MATH', h:`
<p>곡선 장에서 본 <b>project()</b>를 다시 봅시다. y줄 하나가 언덕을 만듭니다.</p>
<pre class="code" data-lang="math">scale   = CAM_DEPTH / (z - cameraZ)
screenX = W/2 + scale * (worldX - cameraX) * W/2
screenY = H/2 - scale * (worldY - cameraY) * H/2   ← 이 줄
screenW = scale * ROAD_W * W/2</pre>
<ul class="b">
<li><b>worldY &gt; cameraY</b> (도로가 눈보다 높음) → 괄호가 양수 → <span class="reg">H/2 -</span> 때문에 screenY가 <em>작아짐</em> = 화면 위로. 언덕이 솟습니다.</li>
<li>멀수록 <b>scale</b>이 작아 높이차가 눌립니다 → 자연스러운 원근.</li>
</ul>`},

{t:'왜 부호가 마이너스인가', k:'MATH', h:`
<p>화면 좌표계는 <b>y가 아래로</b> 증가합니다(상단 0, 하단 H). 반면 월드의 y는 <b>위로</b> 증가합니다. 방향이 반대라서 뒤집어 줘야 합니다.</p>
<pre class="code" data-lang="math">worldY 커짐(높아짐)  →  screenY 작아짐(위로)
∴  screenY = H/2 - (높이항)</pre>
<div class="note cyn">x축은 좌우 방향이 월드·화면 모두 같아서 <span class="reg">+</span>, y축만 <span class="reg">-</span> 인 것을 기억합시다. 딱 이 부호 하나 차이입니다.</div>`},

{t:'언덕높이를 손으로 느껴보기', k:'DEMO', h:`

{t:'그냥 계단이 되면 안 된다 — 보간', k:'CONCEPT', h:`
<p>만약 언덕 구간의 모든 세그먼트에 똑같은 목표 높이를 넣으면, 도로가 <b>수직 벽</b>처럼 툭 튀어오릅니다. 사람 눈에는 완만한 <em>오르막·내리막</em>이 필요합니다.</p>
<ul class="b">
<li>시작 높이 <span class="reg">startY</span> 에서 끝 높이 <span class="reg">endY</span> 까지 <b>천천히</b> 변해야 합니다.</li>
<li>가장 자연스러운 건 양 끝이 평평하고 가운데가 가파른 <b>S자 곡선</b>.</li>
</ul>
<div class="note">이 S자 보간을 <b>easeInOut</b>(가속→감속)이라 부릅니다. 곡선(curve)을 넣을 때 쓴 것과 같은 함수를 언덕 높이에도 그대로 씁니다.</div>`},

{t:'easeInOut — 부드러운 오르막', k:'MATH', h:`
<p>진행도 <span class="reg">p</span>(0→1)에 대해 두 값 a, b를 코사인으로 섞습니다.</p>
<pre class="code" data-lang="math">easeInOut(a, b, p) = a + (b - a) * (-cos(p·π)/2 + 0.5)

p=0   → cos(0)=1   → 계수 0    → a   (평평하게 출발)
p=0.5 → cos(π/2)=0 → 계수 0.5  → 중간(가장 가파름)
p=1   → cos(π)=-1  → 계수 1    → b   (평평하게 도착)</pre>
<p>양 끝 기울기가 0이라 <b>이음새가 매끈</b>합니다. 오르막이 갑자기 시작·정지하지 않습니다.</p>`},

{t:'비교용: easeIn', k:'LUA', h:`
<p>curve의 <b>진입부</b>에는 처음엔 천천히, 뒤로 갈수록 빨라지는 <b>easeIn</b>을 씁니다(제곱). 언덕에는 양끝이 매끈한 easeInOut이 어울립니다.</p>
<pre class="code" data-lang="lua">local function easeIn(a,b,p)
  return a + (b-a)*p*p            -- 처음 완만, 끝 가파름
end
local function easeInOut(a,b,p)
  return a + (b-a)*(-math.cos(p*math.pi)/2 + 0.5)
end</pre>
<div class="tagrow"><span class="tag">easeIn → 곡선 진입</span><span class="tag">easeInOut → 언덕·곡선 전체</span></div>`},

{t:'addRoad — 곡선과 언덕을 한 번에', k:'LUA', h:`
<p>한 구간을 <b>진입(enter)·유지(hold)·이탈(leave)</b> 세 토막으로 나눠 세그먼트를 찍습니다. <span class="reg">curve</span>는 easeIn/InOut으로, <span class="reg">y</span>는 전체 진행도에 대해 easeInOut으로 부드럽게 올립니다.</p>
<pre class="code" data-lang="lua">local function addRoad(enter, hold, leave, curve, y)
  local startY = lastY()
  local endY   = startY + (y or 0) * SEG_LEN
  local total  = enter + hold + leave
  -- p2(먼 모서리)의 y는 (i+1)/total — 마지막 세그먼트가 endY에 정확히 도달
  for i=0,enter-1 do
    addSegment(easeIn(0,curve,i/enter),
               easeInOut(startY,endY,(i+1)/total)) end
  for i=0,hold-1 do
    addSegment(curve,
               easeInOut(startY,endY,(enter+i+1)/total)) end
  for i=0,leave-1 do
    addSegment(easeInOut(curve,0,i/leave),
               easeInOut(startY,endY,(enter+hold+i+1)/total)) end
end</pre>`},

{t:'y 인자가 하는 일', k:'CONCEPT', h:`

<pre class="code" data-lang="lua">endY = startY + y * SEG_LEN</pre>

{t:'ROAD.HILL 프리셋', k:'LUA', h:`
<p>매번 숫자를 외우지 않도록, 자주 쓰는 언덕 세기를 이름으로 묶어 둡니다. 곡선(CURVE)·길이(LENGTH)와 같은 방식입니다.</p>
<pre class="code" data-lang="lua">local ROAD = {

}</pre>
<div class="tblWrap"><table class="tbl">
<tr><th>프리셋</th><th>y값</th><th>느낌</th></tr>

<tr><td>HILL.MEDIUM</td><td>40</td><td>뚜렷한 언덕</td></tr>

</table></div>`},

{t:'트랙에 언덕 심기', k:'LUA', h:`
<p>buildTrack에서 곡선과 언덕을 섞어 코스를 만듭니다. 곡선 인자 뒤에 HILL 프리셋만 붙이면 됩니다.</p>
<pre class="code" data-lang="lua">addRoad(50,50,50, 0, 0)                    -- 출발 직선(평지)

<p>음수 HILL은 내리막입니다. 오르막 뒤 내리막을 이어 붙이면 <em>롤러코스터</em> 같은 리듬이 생깁니다.</p>`},

{t:'차가 도로 위에 앉으려면 — 카메라도 언덕을 탄다', k:'CONCEPT', h:`
<p>여기가 언덕의 <b>진짜 함정</b>입니다. 도로만 위아래로 움직이고 카메라(눈높이)는 고정이면, 오르막에서 도로가 <em>하늘로 날아가</em> 버립니다.</p>
<ul class="b">
<li>플레이어 차는 화면 하단에 <b>고정</b>되어 있습니다.</li>

{t:'baseSegment 보간 — camH 계산', k:'LUA', h:`
<p>render() 첫머리에서 지금 카메라가 어느 세그먼트 위에 있는지 찾고, 세그먼트 <b>안에서의 위치(basePercent)</b>로 시작·끝 높이를 선형보간합니다.</p>
<pre class="code" data-lang="lua">local baseSeg = findSegment(position)
local basePercent = (position % SEG_LEN)/SEG_LEN

local camH = CAM_HEIGHT + baseSeg.p1.world.y
  + (baseSeg.p2.world.y - baseSeg.p1.world.y)*basePercent</pre>
<p><span class="reg">camH</span>가 이번 프레임의 <b>cameraY</b>로 project()에 들어갑니다. 세그먼트를 넘어가는 중간에도 높이가 <em>뚝뚝 끊기지 않고</em> 매끈하게 이어집니다.</p>`},

{t:'camH가 렌더로 흘러가는 경로', k:'LUA', h:`
<p>구한 camH를 모든 세그먼트 투영에 그대로 넘깁니다. 카메라가 언덕 위에 있으면 앞 도로 전체가 그만큼 내려 보입니다(상대적).</p>
<pre class="code" data-lang="lua">project(seg.p1, playerX*ROAD_W - x,      camH, camZ)
project(seg.p2, playerX*ROAD_W - x - dx, camH, camZ)</pre>
<div class="note cyn">두 번째 인자가 <b>cameraY = camH</b>. project() 안의 <span class="reg">worldY - cameraY</span>가 여기서 완성됩니다. 곡선(x)과 달리 언덕(y)은 카메라 y 하나만 매 프레임 갱신하면 끝입니다.</div>`},

{t:'꼭대기 너머는 자동으로 가려진다', k:'CONCEPT', h:`
<p>언덕 꼭대기(crest)를 넘으면, 그 뒤 골짜기 도로는 <b>보이지 않아야</b> 맞습니다. 실제 언덕처럼. 특별한 코드 없이 <em>maxy 클리핑</em>이 이걸 해결합니다.</p>
<pre class="code" data-lang="lua">if seg.p2.screen.y >= maxy then

<p>가까운 세그먼트를 그릴 때마다 <b>maxy</b>(화면에서 가장 위로 올라간 y)를 갱신합니다. 언덕 뒤 세그먼트는 화면상 더 아래(y가 큼)에 투영되므로 <span class="reg">screen.y &gt;= maxy</span>가 되어 그냥 건너뜁니다.</p>`},

{t:'CH7 정리', k:'RECAP', h:`
<div class="big">언덕은 <span class="hero">y 한 줄</span></div>
<ul class="b">
<li>세그먼트에 <b>world.y</b> 저장 → project()의 <span class="reg">screenY = H/2 - scale·(worldY-cameraY)·H/2</span> 가 알아서 솟구침/꺼짐을 그립니다.</li>
<li><b>easeInOut</b>으로 startY→endY를 매끈히 보간(계단 방지).</li>
<li><b>ROAD.HILL</b> LOW20 / MEDIUM40 / HIGH60 프리셋으로 코스 디자인.</li>
<li>카메라 <b>camH</b>도 baseSegment 높이를 따라가야 차가 노면에 붙습니다.</li>
<li>꼭대기 너머 가림은 <b>maxy 클리핑</b>이 공짜로 처리.</li>
</ul>
<div class="note">다음 장: 이 언덕 위로 <em>노을 하늘과 먼 산</em>을 깔아 아웃런 특유의 분위기를 만듭니다.</div>`},

]});

{t:'하늘 그라디언트 — 색을 쌓는 법', k:'CONCEPT', h:`

<p>속도를 올려도 <b>배경 이동 속도는 곡률에만</b> 묶여 있어 도로만큼 빨라지지 않습니다. 이게 깊이감의 핵심.</p>`},

{t:'지평선 62% — 배경과 도로의 경계', k:'CONCEPT', h:`
<p>하늘 띠를 <b>화면 위 62%</b>(H*0.62)까지만 채운 데는 이유가 있습니다. 그 아래는 도로 세그먼트가 덮을 영역이라, 굳이 하늘을 그릴 필요가 없습니다.</p>
<ul class="b">
<li>산·태양도 대략 <b>H*0.4~0.62</b> 사이 지평선 근처에 배치.</li>
<li>도로의 가장 먼 세그먼트가 화면상 이 지평선 부근에 투영됩니다.</li>
</ul>
<div class="note cyn">투영 수식상 소실선은 화면 세로 50%(H/2)이고, 62%는 거기에 <b>여유를 조금 더한 값</b>입니다 — 배경이 소실선 위로 빈틈없이 덮이게 합니다. 카메라를 크게 바꾸면 이 비율도 함께 손봐야 합니다.</div>`},

{t:'노을 색으로 안개까지 통일', k:'CONCEPT', h:`
<p>보너스: 먼 도로를 <b>SKY_BOT(노을핑크)</b>로 흐리게 섞으면, 지평선에서 도로가 하늘에 자연스럽게 녹아듭니다. 배경색과 안개색을 같게 두는 트릭입니다.</p>
<pre class="code" data-lang="lua">-- renderSegment: 멀수록 노을색으로 fade
local grass = fogAmt &lt; 1
  and mix(SKY_BOT, c.grass, fogAmt) or c.grass
quad(..., mix(SKY_BOT, c.road, fogAmt))</pre>
<div class="note mag">배경(SKY_BOT)과 안개(SKY_BOT)가 같은 색이라 도로 끝과 하늘의 <b>경계가 사라집니다</b>. 안개는 14장에서 자세히 다룹니다.</div>`},

{t:'CH8 정리', k:'RECAP', h:`
<div class="big">뒤에 한 겹, <span class="hero">노을</span></div>
<ul class="b">
<li>순서: <b>배경 → 도로 → 스프라이트 → 내 차 → HUD</b>. 배경은 render() 첫 줄.</li>
<li>하늘: 40개 띠 + <b>mix()</b> 선형보간 (SKY_TOP→SKY_BOT).</li>
<li>태양·산: 곡률 <span class="reg">baseCurve</span>에 반응해 <b>반대로·느리게</b> 미끄러짐.</li>
<li>패럴랙스 수식 <span class="reg">bgOffset = -curve·k - playerX·k2</span>.</li>
<li>도로는 곡률 <b>누적</b>, 배경은 <b>단일값</b> → 자연스러운 속도 차.</li>
</ul>
<div class="note">다음 장: 야자수·나무·표지판을 도로변에 세우는 <em>빌보드 스프라이트</em>와 원근 스케일.</div>`},

]});

/* ───── CH 9. 스프라이트: 도로변 오브젝트와 스케일 ───── */
CH({
icon:'🌴', title:'스프라이트 — 도로변 오브젝트와 <span class="em">스케일</span>',
desc:'나무·야자수·표지판은 3D 모델이 아니라, 카메라를 늘 정면으로 바라보는 납작한 2D 그림(빌보드)입니다. 세그먼트에 붙여 두면 원근 스케일이 공짜로 따라옵니다.',
slides:[

{t:'빌보드 스프라이트란', k:'CONCEPT', h:`
<p><b>빌보드(billboard)</b>는 언제나 카메라를 마주 보는 납작한 2D 이미지입니다. 유사 3D 레이싱에서 나무·야자수·표지판·상대 차까지 전부 빌보드입니다.</p>
<ul class="b">
<li>진짜 3D 메시가 아닙니다 → 계산이 <b>가볍습니다</b>.</li>
<li>멀면 작게, 가까우면 크게 — <b>스케일 하나</b>로 원근을 냅니다.</li>
<li>회전은 없습니다. 늘 정면. 그래서 "간판(billboard)".</li>
</ul>
<div class="note">아웃런 시대 하드웨어가 폴리곤을 못 돌리니, 대신 <em>스케일링 스프라이트</em>로 3D를 흉내 냈습니다. 우리도 똑같이 합니다.</div>`},

{t:'왜 세그먼트에 붙이나', k:'CONCEPT', h:`
<p>스프라이트를 독립 리스트로 관리하지 않고, 각 <b>세그먼트에 소속</b>시킵니다. 이유가 분명합니다.</p>
<ul class="b">
<li>세그먼트는 이미 <b>project()로 화면 위치·스케일</b>이 계산돼 있습니다 → 스프라이트가 그 값을 <em>공짜로</em> 재사용.</li>
<li>세그먼트가 <b>안 그려지면</b>(카메라 뒤/언덕에 가림) 그 위 스프라이트도 자동으로 안 그려집니다 → 클리핑 공짜.</li>
<li>세그먼트 z가 곧 스프라이트 z → <b>그리기 순서</b>가 저절로 정렬됩니다.</li>
</ul>
<div class="note cyn">"오브젝트를 도로 조각에 못박아 둔다"고 생각하면 됩니다. 도로가 처리되면 그 위 물건도 함께 처리됩니다.</div>`},

{t:'스프라이트 배치 데이터', k:'LUA', h:`
<p>각 세그먼트의 <span class="reg">sprites</span> 배열에 <b>offset</b>(도로중앙 기준 가로 위치)과 <b>kind</b>(종류)만 넣습니다. 위치·크기는 렌더 때 세그먼트가 알려줍니다.</p>
<pre class="code" data-lang="lua">-- buildTrack: 20번 세그먼트부터 5칸마다 하나씩
for i=20,#segments,5 do
  local side = (i%2==0) and -1 or 1   -- 좌/우 번갈아
  local off  = 1.4 + (i%3)*0.6        -- 도로 밖 1.4~2.6
  segments[i].sprites[#segments[i].sprites+1] =
    { offset = side*off,
      kind   = (i%4==0) and 'palm' or 'tree' }
end</pre>
<p><b>offset</b>은 도로폭(±1) 단위입니다. 1.4~2.6이면 <em>도로 바깥 잔디</em>에 섭니다.</p>`},

{t:'스케일: 원근이 크기를 정한다', k:'MATH', h:`
<p>스프라이트의 화면 위치와 크기는 <b>소속 세그먼트의 투영값</b>에서 나옵니다. 별도 계산이 거의 없습니다.</p>
<pre class="code" data-lang="math">seg.screenX = 세그먼트 중심의 화면 x
seg.screenW = 세그먼트의 화면 도로 반폭
seg.scale   = CAM_DEPTH / (z - cameraZ)

spriteScreenX = seg.screenX + offset * seg.screenW
spriteHeightPx = seg.screenW * k    (또는 scale * 상수)</pre>
<p><b>seg.scale</b>이 멀수록 작아지므로, 스프라이트 높이도 <em>자동으로</em> 줄어듭니다. 멀리 심은 나무는 알아서 콩알만 해집니다.</p>`},

{t:'offset을 화면 x로 옮기기', k:'MATH', h:`
<p>offset(월드폭 단위)에 세그먼트 스케일을 곱해 화면 픽셀로 바꿉니다. 도로 반폭 <span class="reg">ROAD_W</span>와 화면 반폭 <span class="reg">W/2</span>를 곱하는 건 도로 그릴 때와 똑같은 변환입니다.</p>
<pre class="code" data-lang="lua">local sc = seg.p1.screen.scale
local sx = seg.p1.screen.x
         + sc * sp.offset * ROAD_W * W/2
local by = seg.p1.screen.y    -- 도로면에 발을 딛음</pre>
<div class="note cyn"><b>by</b>(baseY)가 세그먼트의 화면 y라는 점이 중요합니다. 스프라이트는 이 지점에 <em>밑동</em>을 붙이고 위로 자랍니다. 그래서 언덕을 넘으면 나무도 도로와 함께 오르내립니다.</div>`},

{t:'화가 알고리즘 — 뒤에서 앞으로', k:'CONCEPT', h:`
<p>도로는 <b>앞→뒤</b>(가까이서 멀리)로 그렸습니다 — 그래야 maxy 클리핑으로 이미 가려진 먼 세그먼트를 건너뛸 수 있습니다. 하지만 스프라이트는 반대로 <b>뒤→앞</b>, 겹침을 위해 <em>먼 것부터</em> 그려야 합니다.</p>
<ul class="b">
<li>가까운 나무가 먼 나무를 <b>덮어야</b> 자연스럽습니다.</li>
<li>그러려면 <b>먼 것 먼저, 가까운 것 나중</b>에 그립니다(화가 알고리즘).</li>
</ul>
<pre class="code" data-lang="math">draw order:  먼 세그먼트  →  가까운 세그먼트
(나중에 그린 가까운 스프라이트가 위에 덮임)</pre>
<div class="note mag">깊이 버퍼(z-buffer)가 없어도, <b>그리는 순서</b>만 맞추면 겹침이 옳게 나옵니다.</div>`},

{t:'렌더 패스: 스프라이트 루프', k:'LUA', h:`
<p>도로 루프가 끝난 뒤, 세그먼트를 <b>DRAW_DIST-1 → 0</b> (먼→가까운) 역순으로 돌며 스프라이트를 그립니다. <span class="reg">seg._drawn</span>이 참인 세그먼트만.</p>
<pre class="code" data-lang="lua">for n=DRAW_DIST-1, 0, -1 do
  local seg = segments[(baseSeg.index+n) % #segments + 1]
  if seg._drawn then
    for _,sp in ipairs(seg.sprites) do
      local sc = seg.p1.screen.scale
      local sx = seg.p1.screen.x + sc*sp.offset*ROAD_W*W/2
      local by = seg.p1.screen.y
      if sp.kind=='palm' then drawPalm(sx,by,sc,seg._fog)
      else                    drawTree(sx,by,sc,seg._fog) end
    end
  end
end</pre>`},

{t:'_drawn 플래그로 클리핑', k:'LUA', h:`
<p>도로 루프에서 각 세그먼트가 실제로 그려졌는지를 <b>seg._drawn</b>에 기록해 둡니다. 스프라이트 루프는 이 플래그만 보고 건너뜁니다.</p>
<pre class="code" data-lang="lua">-- 도로 루프 안에서
local skipped = seg.p1.camera.z &lt;= CAM_DEPTH      -- 카메라 뒤
   or seg.p2.screen.y &gt;= seg.p1.screen.y          -- 뒤집힘
   or seg.p2.screen.y &gt;= maxy                     -- 이미 가려짐
if not skipped then renderSegment(seg, fogAmt); maxy = seg.p2.screen.y end
seg._fog   = fogAmt
seg._drawn = not skipped</pre>
<p>카메라 뒤거나 언덕에 가려 건너뛴(<span class="reg">skipped</span>) 세그먼트면 _drawn=false → 그 세그먼트 스프라이트는 통째로 스킵. 언덕에 가려 안 그려진 도로 위 나무도 자연히 사라집니다.</p>
<div class="note cyn">스프라이트가 세그먼트에 소속됐기에 <b>클리핑을 따로 계산할 필요가 없습니다</b>. 딱 이 플래그 하나면 됩니다.</div>`},

{t:'나무 그리기 — drawTree', k:'LUA', h:`
<p>도로가 쓰는 것과 <b>같은 월드→화면 계수</b>(scale·ROAD_W·W/2)에 비율을 곱해 픽셀 높이 h를 구합니다 — 그래야 원근이 도로와 정확히 일치합니다. h가 너무 작으면(&lt;2px) 아예 안 그려 성능을 아낍니다. 밑동 <span class="reg">baseY</span>에서 위로 자랍니다.</p>
<pre class="code" data-lang="lua">-- 도로와 같은 월드→화면 계수. 뒤의 상수는 도로 절반폭 대비 비율
local function spriteBase(scale) return scale*ROAD_W*W/2 end

local function drawTree(cx, baseY, scale, fogAmt)
  local h = spriteBase(scale)*1.2
  if h &lt; 2 then return end            -- 너무 멀면 생략
  local trunkW = math.max(2, h*0.12)
  love.graphics.setColor(mix(SKY_BOT, rgb(70,45,30), fogAmt))
  love.graphics.rectangle('fill',
     cx-trunkW/2, baseY-h*0.35, trunkW, h*0.35)   -- 기둥
  love.graphics.setColor(mix(SKY_BOT, rgb(18,120,60), fogAmt))
  love.graphics.polygon('fill',
     cx,baseY-h, cx-h*0.35,baseY-h*0.30, cx+h*0.35,baseY-h*0.30)
end</pre>`},

{t:'야자수 그리기 — drawPalm', k:'LUA', h:`
<p>야자수는 살짝 휜 기둥 하나에 잎 몇 가닥. 역시 scale에 비례한 h로 모든 치수를 잡습니다. 아웃런 하면 떠오르는 <em>바로 그</em> 실루엣.</p>
<pre class="code" data-lang="lua">local function drawPalm(cx, baseY, scale, fogAmt)
  local h = spriteBase(scale)*1.5
  if h &lt; 2 then return end
  love.graphics.setColor(mix(SKY_BOT, rgb(60,40,26), fogAmt))
  love.graphics.setLineWidth(math.max(2, h*0.05))
  love.graphics.line(cx, baseY, cx-h*0.08, baseY-h)  -- 휜 기둥
  love.graphics.setColor(mix(SKY_BOT, rgb(30,140,70), fogAmt))
  local tx,ty = cx-h*0.08, baseY-h
  for a=-2,2 do
    love.graphics.line(tx,ty, tx+a*h*0.14,
                       ty+math.abs(a)*h*0.10 - h*0.06)  -- 잎
  end
end</pre>`},

{t:'모든 치수를 scale로 묶는 이유', k:'CONCEPT', h:`
<p>drawTree/drawPalm은 기둥 굵기, 잎 길이, 선 두께까지 전부 <b>h(=scale·상수)</b>의 비율로 잡습니다. 이게 원근을 완성합니다.</p>
<ul class="b">
<li>멀리 있으면 scale ↓ → h ↓ → <b>모든 부분이 함께</b> 작아집니다.</li>
<li>비율로 묶어야 가까이서도 <em>찌그러지지 않고</em> 형태를 유지.</li>
</ul>
<pre class="code" data-lang="math">trunkW = h * 0.12      선굵기 = h * 0.05
잎길이 = h * 0.14      ...모두 h에 비례</pre>
<div class="note">절대 픽셀값을 섞으면 멀리서 잎만 커지는 식으로 깨집니다. <b>단 하나의 h</b>에서 모든 치수를 뽑는 게 규율입니다.</div>`},

{t:'안개도 스프라이트에 적용', k:'LUA', h:`
<p>세그먼트가 저장해 둔 <span class="reg">seg._fog</span>를 스프라이트 색에 mix()로 섞습니다. 멀리 있는 나무는 노을색으로 흐려져 배경에 녹아듭니다.</p>
<pre class="code" data-lang="lua">love.graphics.setColor(mix(SKY_BOT, rgb(18,120,60), fogAmt))</pre>
<p><b>fogAmt=1</b>(가까움)이면 원색, <b>0</b>(멂)이면 SKY_BOT(노을)로 완전히 사라집니다. 도로·산·스프라이트가 <em>같은 안개색</em>을 공유해 화면이 하나로 어우러집니다.</p>
<div class="note cyn">여기서도 CH8의 <b>mix()</b>가 재등장. 색 보간 하나로 그라디언트·안개·페이드를 전부 처리합니다.</div>`},

{t:'스프라이트 데모', k:'DEMO', h:`
<p>도로변 나무·야자수가 다가오며 <b>점점 커지는</b> 것을 봅시다. 멀 땐 콩알, 옆을 스칠 땐 화면을 꽉 채웁니다. 스케일 하나로 나오는 원근입니다.</p>
<div class="demoWrap"><div class="dTitle">도로변 스프라이트 — 원근 스케일</div>
<canvas class="demo" data-demo="sprites" width="640" height="360"></canvas>
<div class="ctl">
<label>속도 <input type="range" data-p="speed" min="0" max="1" step="0.05" value="0.5"></label>
</div></div>
<p>가까운 스프라이트가 먼 스프라이트를 <b>덮는</b> 것도 확인 — 화가 알고리즘이 작동하는 증거입니다.</p>`},

{t:'상대 차량도 결국 빌보드', k:'CONCEPT', h:`
<p>교통 차량(traffic)도 나무와 <b>완전히 같은 방식</b>으로 그립니다. 세그먼트에 붙이고, 스케일로 크기를 정하고, 화가 순서로 겹칩니다.</p>
<pre class="code" data-lang="lua">for _,car in ipairs(seg.cars) do
  local sc = seg.p1.screen.scale
  local sx = seg.p1.screen.x + sc*car.offset*ROAD_W*W/2
  drawCar(sx, seg.p1.screen.y, sc, car.color, seg._fog)
end</pre>
<p>차이라곤 <b>car.z가 움직인다</b>(차가 앞으로 달림)는 것뿐입니다. 매 프레임 소속 세그먼트를 다시 계산해 붙입니다.</p>
<div class="note mag">교통 차량의 배치·이동·충돌은 <b>CH11</b>에서 본격적으로 다룹니다. 지금은 "차도 빌보드"라는 것만 기억합시다.</div>`},

{t:'CH9 정리', k:'RECAP', h:`
<div class="big">납작한 그림, <span class="hero">깊은 세계</span></div>
<ul class="b">
<li><b>빌보드</b>: 늘 정면인 2D 스프라이트. 스케일 하나로 원근.</li>

<pre class="code" data-lang="lua">local position = 0   -- 카메라의 z 위치(월드, 앞으로 전진)

{t:'전진의 핵심 공식', k:'MATH', h:`

{t:'교통 배치 (buildTrack 1)', k:'CODE', h:`
<p>트랙을 다 만든 뒤 20대를 무작위 세그먼트에 뿌립니다.</p>
<span class="codeLabel lua">Lua · buildTrack — 차량</span>
<pre class="code" data-lang="lua">cars = {}

{t:'배치 파라미터 뜯어보기', k:'MATH', h:`
<p>위 코드의 숫자들이 교통의 질감을 정합니다.</p>

{t:'이중 저장 — 두 리스트의 이유', k:'WHY', h:`

{t:'차량 빌보드 그리기 (drawCar)', k:'DRAW', h:`

<pre class="code" data-lang="lua">local function drawCar(cx, baseY, scale, col, fogAmt)

{t:'화면 위치 계산', k:'MATH', h:`
<p>render()에서 차량의 화면 x는 세그먼트 스케일과 offset으로 구합니다. 스프라이트와 판박이입니다.</p>

{t:'절두체 컬링 — _drawn 플래그', k:'PERF', h:`

{t:'"내가 더 빠를 때만" 부딪힌다', k:'DESIGN', h:`

{t:'게임 루프란 무엇인가', k:'LOOP', h:`

{t:'love.update 의 처리 순서', k:'FLOW', h:`

{t:'love.update 실제 코드', k:'CODE', h:`

<pre class="code" data-lang="lua">  local pseg = findSegment(position)       -- ⑥ 충돌

  position = position + speed*dt           -- ⑦ 전진
  while position &gt;= trackLength do          --    랩 넘김
    position = position - trackLength
    hud.lap = hud.lap + 1
    if not hud.best or hud.time &lt; hud.best then hud.best = hud.time end
    hud.time = 0
  end
  while position &lt; 0 do position = position + trackLength end
end</pre>
<p>다음 슬라이드에서 이 <b>랩 넘김(lap-wrap)</b> 코드를 자세히 뜯어봅니다.</p>`},

{t:'랩 카운트 — position 이 트랙을 넘을 때', k:'LAP', h:`
<p>트랙은 <b>고리(loop)</b>입니다. 카메라의 z 위치 <span class="reg">position</span> 이 트랙 전체 길이 <span class="reg">trackLength</span> 를 넘으면, 한 바퀴를 돈 것입니다.</p>
<pre class="code" data-lang="lua">while position &gt;= trackLength do
  position = position - trackLength        -- 넘친 만큼만 남기고 되돌림
  hud.lap  = hud.lap + 1                    -- 랩 +1
  if not hud.best or hud.time &lt; hud.best then
    hud.best = hud.time                     -- 이번 랩이 더 빠르면 갱신
  end
  hud.time = 0                              -- 랩 타이머 리셋
end</pre>
<ul class="b">
<li><b>if 가 아니라 while</b> — 한 프레임에 트랙을 두 바퀴 넘길 만큼 빨라도 안전</li>
<li><em>position = position - trackLength</em> — 나머지를 보존해 위치가 매끄럽게 이어짐</li>
<li>베스트 타임은 <b>더 작을 때만</b> 갱신 (첫 랩은 무조건 기록)</li>
</ul>
<div class="note">왜 나머지 연산(%)이 아니라 뺄셈일까요? 랩 증가·베스트 갱신 같은 <b>부수 효과</b>를 정확히 "한 바퀴마다 한 번" 실행해야 하기 때문입니다.</div>`},

{t:'속도를 km/h 로 — 단위 변환', k:'MATH', h:`
<p>내부 속도 <span class="reg">speed</span> 는 "초당 월드 단위"라 사람이 읽기 어렵습니다. 화면에는 익숙한 km/h 로 바꿔 보여줍니다.</p>
<pre class="code" data-lang="math">kmh = floor( speed / MAX_SPEED * 300 )

speed = 0        →   0 km/h
speed = MAX_SPEED →  300 km/h  (최고속)</pre>
<p>즉 <b>속도 비율(0~1)에 300을 곱한</b> 값입니다. <span class="reg">MAX_SPEED</span> 는 <em>SEG_LEN * 60</em>, 곧 "초당 세그먼트 60개"였음을 떠올리세요. 실제 물리 단위와 화면 표기는 이렇게 분리해 두면 튜닝이 자유롭습니다.</p>
<div class="note blue">최고 표시 속도를 320으로 바꾸고 싶다면 물리는 그대로 두고 이 식의 300만 320으로 바꾸면 됩니다.</div>`},

{t:'HUD 그리기 — 텍스트 정보', k:'CODE', h:`
<span class="codeLabel lua">Lua · drawHUD()</span>
<pre class="code" data-lang="lua">local function drawHUD()
  love.graphics.setColor(1,1,1)
  local kmh = math.floor(speed/MAX_SPEED*300)
  love.graphics.print(('SPEED  %3d km/h'):format(kmh), 16, 14)
  love.graphics.print(('LAP    %d'):format(hud.lap),   16, 34)
  love.graphics.print(('TIME   %5.1f'):format(hud.time), 16, 54)
  if hud.best then
    love.graphics.print(('BEST   %5.1f'):format(hud.best), 16, 74)
  end</pre>
<ul class="b">
<li><em>('%3d'):format(x)</em> — Lua 문자열의 <b>string.format</b>. 자릿수를 맞춰 숫자가 덜덜 떨리지 않게 함</li>
<li><span class="reg">%5.1f</span> — 소수 첫째 자리까지, 전체 5칸 (예: " 12.3")</li>
<li>BEST 는 기록이 있을 때만(<span class="reg">hud.best</span> 가 nil 이 아닐 때) 출력</li>
</ul>`},

{t:'HUD 그리기 — 속도 게이지 바', k:'CODE', h:`
<pre class="code" data-lang="lua">  -- 속도 게이지 (화면 하단 가로 바)
  local gw = W-32
  love.graphics.setColor(0.2,0.2,0.25)          -- 어두운 바탕
  love.graphics.rectangle('fill', 16, H-24, gw, 10)
  love.graphics.setColor(1,0.5,0.2)             -- 주황 채움
  love.graphics.rectangle('fill', 16, H-24, gw*(speed/MAX_SPEED), 10)
end</pre>
<p>게이지는 두 개의 사각형입니다.</p>
<ul class="b">
<li><b>바탕</b> — 전체 폭 <span class="reg">gw</span> 만큼 어둡게</li>
<li><b>채움</b> — 폭에 <em>speed/MAX_SPEED</em>(0~1)를 곱해, 속도에 비례해 길어짐</li>
</ul>
<div class="note">막대 그래프·체력바·게이지는 모두 같은 패턴입니다: "바탕 사각형" 위에 "비율만큼 곱한 사각형". 색만 바꾸면 니트로 게이지도 됩니다.</div>`},

{t:'love.draw 의 그리기 순서', k:'DRAW', h:`
<p>그리기는 <b>뒤에서 앞으로</b>(painter's algorithm) 쌓습니다. 나중에 그린 것이 위에 덮입니다.</p>
<pre class="code" data-lang="lua">function love.draw()
  render()       -- ① 하늘·도로·스프라이트·교통차 (원경)
  drawPlayer()   -- ② 내 차 (화면 하단 고정, 항상 도로 위)
  drawHUD()      -- ③ HUD (항상 최상단)
end</pre>
<ul class="b">
<li><b>render()</b> 가 배경과 도로를 먼저 채움 — 가장 뒤</li>
<li><b>drawPlayer()</b> 는 내 차를 도로 위에 — 도로보다 앞</li>
<li><b>drawHUD()</b> 는 글자·게이지를 맨 위에 — 무엇에도 가려지지 않음</li>
</ul>
<div class="note blue">순서를 바꿔 HUD 를 먼저 그리면 도로가 글자를 덮어버립니다. "정보는 항상 맨 마지막에".</div>`},

{t:'델타 타임(dt)과 프레임레이트 독립', k:'MATH', h:`
<p>왜 모든 변화량에 <em>dt</em> 를 곱했을까요? <span class="reg">dt</span> 는 "지난 프레임과 이번 프레임 사이 흐른 초"입니다.</p>
<pre class="code" data-lang="math">이동거리 = 속도 × 시간
position += speed * dt

60fps:  dt≈0.0166,  1초 동안 60번 → speed*1초
30fps:  dt≈0.0333,  1초 동안 30번 → speed*1초   (같다!)</pre>
<p>dt 를 곱하지 않고 <span class="reg">position += speed</span> 로 두면, 빠른 PC에서는 차가 로켓처럼 날고 느린 폰에서는 기어갑니다. <b>dt 를 곱하면 어떤 프레임레이트에서도 "1초에 같은 거리"</b>가 됩니다.</p>
<div class="note">폴드7·저사양 폰·고주사율 모니터가 뒤섞인 환경에서 이 원칙은 필수입니다. 물리는 실제 시간에 묶고, 그리기만 프레임에 맡깁니다.</div>`},

{t:'dt 클램프 — 스파이크 방어', k:'STABLE', h:`
<p>딱 한 곳, dt 를 그대로 믿지 않는 지점이 있습니다.</p>
<pre class="code" data-lang="lua">dt = math.min(dt, 1/30)   -- dt 는 최대 1/30초로 제한</pre>
<ul class="b">
<li>앱이 잠깐 멈췄다 재개되면(탭 전환, GC, 로딩) dt 가 0.5초처럼 <b>튈</b> 수 있음</li>
<li>그 큰 dt 로 전진하면 차가 <b>벽/차량을 뚫고</b> 순간이동함(터널링)</li>
<li>상한을 두면 최악의 경우도 "1/30초 분량"만 진행 — 잠깐 슬로우모션일 뿐 안전</li>
</ul>
<div class="note mag">이것은 물리 시뮬레이션의 표준 방어책입니다. "완벽한 정확도"보다 "절대 폭발하지 않음"을 택하는 트레이드오프입니다.</div>`},

{t:'hud 상태를 resetGame 에서 초기화', k:'INIT', h:`
<p>랩·타임·베스트는 <span class="reg">hud</span> 테이블 한 곳에 모아 두었습니다. 게임 시작(그리고 <kbd>R</kbd> 재시작)마다 깨끗하게 초기화됩니다.</p>
<pre class="code" data-lang="lua">local hud = { lap=1, time=0, best=nil }   -- 선언

local function resetGame()                 -- 창은 그대로, 상태만 리셋
  math.randomseed(os.time())
  buildTrack()
  position, playerX, speed = 0,0,0
  hud = {lap=1, time=0, best=nil}
end

function love.keypressed(k)
  if k=='r' then resetGame() end            -- R = 재시작
end</pre>
<ul class="b">
<li><b>lap=1</b> — 첫 바퀴부터 카운트 (0 이 아니라 1)</li>
<li><b>best=nil</b> — 아직 기록 없음. 첫 랩이 끝나야 값이 생김</li>
<li><kbd>R</kbd> 은 <span class="reg">resetGame</span> 만 다시 불러 트랙·상태를 새로 만듭니다 — 창 설정(love.window.setMode)은 건드리지 않아 리사이즈된 창이 유지됩니다</li>
</ul>
<div class="note blue">관련 상태를 하나의 테이블로 묶으면 "초기화 누락" 버그가 사라집니다. lap 만 리셋하고 time 을 깜빡하는 실수를 구조가 막아 줍니다.</div>`},

{t:'완성된 게임을 직접 운전해 보기', k:'DEMO', h:`
<p>지금까지의 모든 것 — 투영·곡선·언덕·안개·스프라이트·물리·충돌·HUD·랩 — 이 하나로 합쳐진 결과입니다. 속도계와 LAP/TIME/BEST 를 확인하며 달려 보세요.</p>
<div class="demoWrap"><div class="dTitle">미니 아웃런 — 풀 플레이 (HUD·랩·베스트)</div>
<canvas class="demo" data-demo="game" width="640" height="360"></canvas>

<p><b>캔버스를 클릭</b>한 뒤 방향키(←↑↓→) 또는 위 버튼으로 운전하세요. 한 바퀴를 돌면 LAP 이 올라가고, 첫 랩 기록이 BEST 에 남습니다. 더 빠르게 돌면 BEST 가 갱신됩니다.</p>
<div class="note">게임 슬라이드에서는 방향키가 운전에 쓰입니다. 슬라이드 이동은 하단 ◀▶ 버튼이나 스와이프를 사용하세요.</div>`},

]});

/* ───── CH 14. 안개·색·연출 튜닝 ───── */
CH({
icon:'🌫️', title:'안개·색·<span class="em">연출 튜닝</span>',
desc:'거리 안개(distance fog)로 깊이감을 주고, 색을 노을빛으로 섞어 아웃런 특유의 네온·석양 무드를 만듭니다. 수식과 슬라이더로 직접 감을 잡습니다.',
slides:[

{t:'왜 안개가 필요한가', k:'WHY', h:`
<p>멀리 있는 세그먼트를 또렷한 색 그대로 그리면 두 가지 문제가 생깁니다.</p>
<ul class="b">
<li><b>지평선에서 색이 갑자기 끊겨</b> 보임 — DRAW_DIST 경계가 티가 남</li>
<li><b>깊이감이 약함</b> — 가까운 것과 먼 것이 똑같이 선명함</li>
</ul>
<p>현실에서 먼 산이 뿌옇게 보이듯, 멀수록 색을 <b>하늘/노을 색으로 흐리게</b> 섞으면 자연스럽게 사라지면서 깊이가 살아납니다. 이것이 <em>거리 안개(distance fog)</em>입니다.</p>
<div class="note cyn">아웃런에서 안개는 성능 트릭이기도 합니다. 먼 세그먼트가 어차피 하늘색에 녹으면, 굳이 멀리까지 또렷하게 그릴 필요가 없습니다.</div>`},

{t:'안개 수식 — 지수 감쇠', k:'MATH', h:`
<p>안개량은 거리의 제곱에 대한 <b>지수 함수</b>로 정합니다.</p>
<pre class="code" data-lang="math">d = n / DRAW_DIST        (0 = 가까움, 1 = 가장 멂)
fog = exp( -FOG_DENSITY * d * d )

fog = 1  → 안개 없음(원래 색 그대로)
fog = 0  → 완전히 하늘색에 파묻힘</pre>
<ul class="b">
<li><span class="reg">n</span> 은 카메라로부터 몇 번째 세그먼트인지 (0 ~ DRAW_DIST-1)</li>
<li><em>d*d</em> 로 제곱을 쓰면 가까운 곳은 거의 1로 또렷하고, <b>멀어질수록 급격히</b> 떨어짐 — 자연스러운 곡선</li>
<li><span class="reg">FOG_DENSITY</span> 가 클수록 안개가 빨리 짙어짐(우리 기본값 5)</li>
</ul>`},

{t:'fog() 함수', k:'CODE', h:`
<span class="codeLabel lua">Lua · fog()</span>
<pre class="code" data-lang="lua">local function fog(d, density)   -- d: 0(가까움)~1(멂)
  return math.exp(-density * d * d)
end</pre>
<p>렌더 루프에서는 세그먼트 번호 <span class="reg">n</span> 을 0~1 범위로 바꿔 넘깁니다.</p>
<pre class="code" data-lang="lua">for n=0,DRAW_DIST-1 do
  ...
  local fogAmt = fog(n/DRAW_DIST, FOG_DENSITY)
  ...
  renderSegment(seg, fogAmt)   -- 각 세그먼트에 안개량 전달
end</pre>
<p>한 줄짜리 함수지만, 이 <em>exp(-density·d²)</em> 곡선 하나가 화면 전체의 공기감을 만듭니다.</p>`},

{t:'색 섞기 헬퍼 — mix(a,b,t)', k:'CODE', h:`
<p>안개는 결국 "원래 색"과 "하늘 색"을 안개량만큼 <b>선형 보간(lerp)</b>하는 일입니다.</p>
<pre class="code" data-lang="lua">local function mix(a,b,t)   -- t=0 이면 a, t=1 이면 b
  return { a[1]+(b[1]-a[1])*t,
           a[2]+(b[2]-a[2])*t,
           a[3]+(b[3]-a[3])*t }
end</pre>
<pre class="code" data-lang="math">결과색 = a + (b - a) * t      (채널별로 R,G,B 각각)
t=0 → a,   t=0.5 → 중간색,   t=1 → b</pre>
<div class="note">보간 방향에 주의하세요. 우리는 <b>노을색(SKY_BOT)을 a, 원래색을 b</b> 로 두고 <em>t = fogAmt</em> 를 씁니다. 즉 fogAmt 가 1이면 원래색, 0이면 노을색이 됩니다.</div>`},

{t:'renderSegment 가 안개를 입히는 법', k:'CODE', h:`
<span class="codeLabel lua">Lua · renderSegment()</span>
<pre class="code" data-lang="lua">local function renderSegment(seg, fogAmt)
  local c = seg.color
  local p1,p2 = seg.p1.screen, seg.p2.screen
  local grass = fogAmt &lt; 1 and mix(SKY_BOT, c.grass, fogAmt) or c.grass
  quad(0,p1.y, W,p1.y, W,p2.y, 0,p2.y, grass)                 -- 잔디
  -- 도로도 같은 방식으로 안개 섞은 색을 씀
  quad(p1.x-p1.w,p1.y, p1.x+p1.w,p1.y,
       p2.x+p2.w,p2.y, p2.x-p2.w,p2.y, mix(SKY_BOT,c.road,fogAmt))</pre>
<ul class="b">
<li>도로·럼블·차선·잔디 <b>모든 면</b>에 <em>mix(SKY_BOT, 원래색, fogAmt)</em> 적용</li>
<li>가까운 세그먼트(fogAmt≈1)는 원래색, 먼 세그먼트는 노을 핑크에 녹음</li>
<li>스프라이트·차량(나무·야자수·교통차)도 같은 <span class="reg">fogAmt</span> 로 섞어 <b>일관된 공기감</b></li>
</ul>
<div class="note blue"><em>fogAmt &lt; 1</em> 일 때만 mix 를 호출하는 작은 최적화 — 가장 가까운 세그먼트는 계산을 건너뜁니다.</div>`},

{t:'안개 세기를 직접 조절해 보기', k:'DEMO', h:`
<p>슬라이더로 <b>안개세기(FOG_DENSITY)</b>를 바꿔 보세요. 값이 커질수록 지평선이 가까이 다가오고, 작을수록 도로가 멀리까지 또렷하게 뻗습니다.</p>
<div class="demoWrap"><div class="dTitle">거리 안개 — 세기 조절</div>
<canvas class="demo" data-demo="fog" width="640" height="360"></canvas>
<div class="ctl">
<label>안개세기 <input type="range" data-p="fog" min="0" max="12" step="0.5" value="5"><span class="val" data-v="fog">5.0</span></label>
</div></div>
<ul class="b">
<li><b>0</b> — 안개 없음. 먼 도로 색이 지평선에서 뚝 끊겨 보임</li>
<li><b>5</b> — 우리 기본값. 자연스러운 깊이감</li>
<li><b>12</b> — 짙은 안개. 코앞만 보이는 몽환적 무드</li>
</ul>`},

{t:'선형 보간(lerp) 직관 잡기', k:'MATH', h:`
<p>안개·하늘 그라디언트·이징까지, 이 게임의 "부드러움"은 거의 다 <b>lerp</b> 하나에서 나옵니다.</p>
<pre class="code" data-lang="math">lerp(a, b, t) = a + (b - a) * t

{t:'④ 원근 투영 project()', k:'CODE', h:`
<pre class="code" data-lang="lua">local function findSegment(z)
  return segments[math.floor(z/SEG_LEN) % #segments + 1]

local function project(p, camX, camY, camZ)
  p.camera.x = (p.world.x or 0) - camX
  p.camera.y = (p.world.y or 0) - camY
  p.camera.z = (p.world.z or 0) - camZ
  p.screen.scale = CAM_DEPTH / math.max(p.camera.z, 1e-6)  -- 핵심! (0 나눗셈 보호)

  p.screen.w = math.floor(p.screen.scale * ROAD_W * W/2)

{t:'⑤ 트랙 빌더 — addRoad(이징)', k:'CODE', h:`
<pre class="code" data-lang="lua">local function easeIn(a,b,p)    return a + (b-a)*p*p end
local function easeInOut(a,b,p) return a + (b-a)*(-math.cos(p*math.pi)/2 + 0.5) end

local function addRoad(enter, hold, leave, curve, y)
  local startY = lastY()
  local endY   = startY + (y or 0) * SEG_LEN
  local total  = enter + hold + leave
  -- (i+1)/total: 마지막 세그먼트가 endY에 정확히 도달
  for i=0,enter-1 do addSegment(easeIn(0,curve,i/enter),    easeInOut(startY,endY,(i+1)/total)) end
  for i=0,hold-1  do addSegment(curve,                      easeInOut(startY,endY,(enter+i+1)/total)) end
  for i=0,leave-1 do addSegment(easeInOut(curve,0,i/leave), easeInOut(startY,endY,(enter+hold+i+1)/total)) end
end</pre>
<p>커브를 <b>진입(enter)→유지(hold)→빠져나감(leave)</b> 세 구간으로 나눠, 곡률이 0에서 부드럽게 올라갔다 다시 0으로 돌아옵니다. 이징 함수가 급격한 꺾임을 없애 자연스러운 도로를 만듭니다.</p>`},
