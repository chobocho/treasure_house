<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🐞 AI처럼 디버깅하기 — 고급 AI 모델의 디버깅 사고법 대백과 (503 슬라이드)</title>
<meta name="description" content="Fable·Codex 같은 고급 AI 모델이 버그를 푸는 사고 루프를 사람이 따라 하도록 정리한 디버깅 교재. 가설-실험-반증 루프, 델타 디버깅, 이분 탐색, Linux/Windows 도구 체인, C·C++·Java·Python·Go·JavaScript·TypeScript·Lua 언어별 실전 예제와 케이스 스터디를 담은 동적 HTML 슬라이드">
<style>
  :root{
    --bg1:#0a1020; --bg2:#101a33; --panel:#131e38; --panel2:#0d1526;
    --ink:#e9eefb; --mut:#9fb2d6; --acc:#4fc3f7; --acc2:#8aa2ff;
    --line:rgba(140,170,225,.28); --line2:rgba(140,170,225,.14);
    --good:#7ce38b; --warn:#ffb454; --pink:#ff7a90; --purple:#e394ff;
    --mint:#94f5d0; --gold:#ffd166; --sky:#7dd3fc; --bad:#ff5d73;
    --win:#4fc3f7; --lin:#ffd166;
  }
  *{box-sizing:border-box}
  html{
    font-size:clamp(14px, 0.55vw + 0.55vh + 8px, 21px);
    -webkit-text-size-adjust:100%;
  }
  body{
    margin:0; height:100dvh; overflow:hidden;
    color:var(--ink);
    background:radial-gradient(1200px 800px at 75% -10%, #1b2c55 0%, transparent 60%),
               radial-gradient(900px 700px at -10% 110%, #14264a 0%, transparent 55%),
               linear-gradient(160deg, var(--bg1), var(--bg2));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    line-height:1.62; word-break:keep-all;
  }
  #deck{display:flex; flex-direction:column; height:100dvh}
  #bar{height:4px; background:linear-gradient(90deg,var(--acc),var(--acc2)); width:0%; transition:width .25s; flex:none}

  header#top{
    flex:none; display:flex; align-items:center; gap:.7em;
    padding:.45em clamp(.8em,2.5vw,1.6em); border-bottom:1px solid var(--line2);
    background:rgba(10,16,32,.6); backdrop-filter:blur(8px);
  }
  header#top .brand{font-weight:800; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  header#top .brand small{color:var(--mut); font-weight:400}
  #secbadge{
    margin-left:auto; font-size:.78em; font-weight:700; padding:.15em .8em;
    border-radius:999px; border:1px solid var(--line); white-space:nowrap; flex:none;
  }

  #stage{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    padding:clamp(.9em,2vh,1.6em) clamp(.9em,4vw,3em) 5.5em}
  .slide{max-width:1180px; margin:0 auto; animation:fadein .22s ease}
  @keyframes fadein{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

  .slide h1{font-size:clamp(1.3em,1.15em + 1.1vw,2em); line-height:1.25; margin:.1em 0 .55em}
  .slide h1 .no{color:var(--mut); font-size:.55em; font-weight:600; vertical-align:.35em; margin-right:.5em}
  .slide h2{font-size:1.18em; margin:1.1em 0 .45em; color:var(--sky)}
  .slide h3{font-size:1.02em; margin:.9em 0 .35em; color:var(--mint)}
  .slide h4{font-size:.95em; margin:.7em 0 .3em; color:var(--gold)}
  .slide p{margin:.45em 0}
  .slide ul,.slide ol{margin:.4em 0 .7em; padding-left:1.35em}
  .slide li{margin:.3em 0}
  .slide li>ul,.slide li>ol{margin:.15em 0}
  .slide strong{color:#fff}
  .slide em{color:var(--gold); font-style:normal}
  .slide a{color:var(--acc); text-decoration:none; border-bottom:1px dotted rgba(79,195,247,.5)}
  .slide a:hover{color:#9fe3ff}
  .mut{color:var(--mut)} .small{font-size:.85em}
  code{font-family:"SF Mono",Consolas,"D2Coding",monospace; background:rgba(80,120,200,.16);
       padding:.08em .38em; border-radius:6px; font-size:.9em; word-break:break-word}
  pre.code{
    background:#0a0f1e; border:1px solid var(--line2); border-radius:12px;
    padding:.9em 1.1em; overflow-x:auto; font-size:.8em; line-height:1.55;
    font-family:"SF Mono",Consolas,"D2Coding",monospace; margin:.6em 0;
  }
  pre.code code{background:none; padding:0; font-size:1em}
  pre.code.sh{border-left:3px solid var(--good)}
  pre.code.bad{border-left:3px solid var(--bad)}
  pre.code.fix{border-left:3px solid var(--good)}
  .cm{color:#6d82ab} .kw{color:#7dd3fc} .st{color:#a5e3a1} .nb{color:#ffd166}
  .fn{color:#e394ff} .ty{color:#94f5d0} .er{color:#ff7a90} .ok{color:#7ce38b}
  .pr{color:#ffb454} .hl{background:rgba(255,93,115,.18); border-radius:4px}

  .fx{
    background:linear-gradient(120deg, rgba(79,195,247,.10), rgba(138,162,255,.08));
    border-left:4px solid var(--acc); border-radius:10px;
    padding:.7em 1em; margin:.7em 0; font-size:1.04em; overflow-x:auto;
  }
  .fx .big{font-size:1.2em}
  .note{
    background:rgba(255,180,84,.08); border-left:4px solid var(--warn);
    border-radius:10px; padding:.6em 1em; margin:.7em 0; font-size:.93em;
  }
  .tip{
    background:rgba(124,227,139,.08); border-left:4px solid var(--good);
    border-radius:10px; padding:.6em 1em; margin:.7em 0; font-size:.93em;
  }
  .danger{
    background:rgba(255,93,115,.10); border-left:4px solid var(--bad);
    border-radius:10px; padding:.6em 1em; margin:.7em 0; font-size:.93em;
  }
  .quote{
    border-left:4px solid var(--purple); background:rgba(227,148,255,.07);
    border-radius:10px; padding:.6em 1em; margin:.7em 0; font-style:italic; color:#f0e4ff;
  }
  .quote .who{display:block; font-style:normal; font-size:.85em; color:var(--mut); margin-top:.35em}

  .cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr)); gap:1.1em; align-items:start}
  .cols3{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr)); gap:.9em; align-items:start}

  .tw{overflow-x:auto; margin:.6em 0}
  table.tbl{border-collapse:collapse; width:100%; font-size:.88em; min-width:460px}
  table.tbl th,table.tbl td{border:1px solid var(--line2); padding:.42em .7em; text-align:left; vertical-align:top}
  table.tbl th{background:rgba(79,195,247,.12); white-space:nowrap}
  table.tbl tr:nth-child(even) td{background:rgba(140,170,225,.05)}
  table.tbl td code{white-space:nowrap}
  table.tt{min-width:0; text-align:center; font-family:Consolas,monospace}
  table.tt th,table.tt td{text-align:center; padding:.25em .7em}
  table.tt td.r1{color:var(--good); font-weight:700}
  table.tt td.r0{color:var(--mut)}

  /* OS 배지 */
  .os{display:inline-block; font-size:.72em; font-weight:800; padding:.05em .55em;
      border-radius:6px; margin-right:.45em; vertical-align:.12em; letter-spacing:.02em}
  .os.w{background:rgba(79,195,247,.18); color:var(--win)}
  .os.l{background:rgba(255,209,102,.18); color:var(--lin)}
  .os.b{background:rgba(124,227,139,.18); color:var(--good)}
  .lg{display:inline-block; font-size:.72em; font-weight:800; padding:.05em .55em;
      border-radius:6px; margin-right:.45em; vertical-align:.12em;
      background:rgba(138,162,255,.18); color:var(--acc2)}

  /* OS 2단 비교 박스 */
  .osgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:.9em; margin:.7em 0}
  .osbox{border:1px solid var(--line2); border-radius:12px; padding:.7em .9em; background:var(--panel2)}
  .osbox.w{border-top:3px solid var(--win)}
  .osbox.l{border-top:3px solid var(--lin)}
  .osbox h4{margin:.1em 0 .4em; font-size:.98em}
  .osbox.w h4{color:var(--win)} .osbox.l h4{color:var(--lin)}
  .osbox pre.code{font-size:.76em; margin:.4em 0}

  /* 디버깅 루프 스텝 */
  .loop{display:flex; flex-wrap:wrap; gap:.45em; margin:.8em 0; justify-content:center}
  .loop .stp{
    flex:1 1 130px; max-width:200px; text-align:center; padding:.55em .5em;
    border:1px solid var(--line2); border-radius:12px; background:var(--panel2); font-size:.85em;
  }
  .loop .stp b{display:block; font-size:1.5em; line-height:1.2}
  .loop .stp .t{font-weight:700; color:var(--sky)}
  .loop .stp .d{color:var(--mut); font-size:.9em; line-height:1.4}
  .loop .stp.on{border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset}

  /* 카드 */
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr)); gap:.7em; margin:.7em 0}
  .card{border:1px solid var(--line2); border-radius:12px; padding:.65em .85em; background:var(--panel2)}
  .card .h{font-weight:700; color:var(--gold); margin-bottom:.25em}
  .card .s{font-size:.88em; color:var(--mut)}

  /* 잘못/올바름 대비 */
  .vs{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:.8em; margin:.7em 0}
  .vs .x,.vs .o{border-radius:12px; padding:.6em .85em; border:1px solid var(--line2)}
  .vs .x{background:rgba(255,93,115,.07); border-left:4px solid var(--bad)}
  .vs .o{background:rgba(124,227,139,.07); border-left:4px solid var(--good)}
  .vs .lb{font-weight:800; font-size:.85em; margin-bottom:.3em}
  .vs .x .lb{color:var(--bad)} .vs .o .lb{color:var(--good)}

  .timeline{list-style:none; padding-left:0}
  .timeline li{
    margin:.34em 0; padding:.4em .8em .4em 1em; border-left:3px solid var(--acc2);
    background:rgba(138,162,255,.06); border-radius:0 10px 10px 0;
  }
  .timeline .yr{display:inline-block; min-width:4.4em; font-weight:800; color:var(--gold); font-family:Consolas,monospace}

  .links{list-style:none; padding-left:0}
  .links li{margin:.45em 0; padding:.5em .9em; background:var(--panel2);
    border:1px solid var(--line2); border-radius:10px}
  .links li .k{display:inline-block; font-size:.72em; font-weight:700; padding:0 .6em;
    border-radius:6px; margin-right:.6em; vertical-align:.1em}
  .k.doc{background:rgba(79,195,247,.18); color:var(--acc)}
  .k.paper{background:rgba(227,148,255,.18); color:var(--purple)}
  .k.video{background:rgba(255,122,144,.18); color:var(--pink)}
  .k.src{background:rgba(124,227,139,.18); color:var(--good)}
  .k.wiki{background:rgba(255,209,102,.18); color:var(--gold)}
  .k.tool{background:rgba(148,245,208,.18); color:var(--mint)}

  .kbd{display:inline-block; background:#1b2a4d; border:1px solid var(--line); border-bottom-width:2px;
    border-radius:6px; padding:0 .45em; font-family:Consolas,monospace; font-size:.85em}

  /* 데모 */
  .demo{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:1em 1.1em; margin:.8em 0}
  .demo .row{display:flex; flex-wrap:wrap; gap:1em; align-items:flex-end; justify-content:center}
  .demo .ctl{display:flex; flex-wrap:wrap; gap:.55em .8em; align-items:center; justify-content:center; margin:.65em 0 .2em}
  .demo button, .demo select, .demo input[type=number]{
    background:#1b2a4d; color:var(--ink); border:1px solid var(--line);
    border-radius:9px; padding:.42em .95em; font-size:.92em; cursor:pointer; font-family:inherit;
  }
  .demo button:hover{background:#253762}
  .demo button.on{background:var(--acc); color:#04223a; font-weight:700}
  .demo button.ghost{background:transparent}
  .demo input[type=range]{width:min(280px,60vw); accent-color:var(--acc)}
  .demo input[type=text], .demo textarea{
    width:100%; background:#0a0f1e; color:var(--ink); border:1px solid var(--line);
    border-radius:9px; padding:.55em .7em; font-family:"SF Mono",Consolas,"D2Coding",monospace;
    font-size:.88em; resize:vertical;
  }
  .demo .field{display:flex; flex-wrap:wrap; gap:.5em .9em; align-items:center; margin:.5em 0}
  .demo .field label{font-size:.85em; color:var(--mut); min-width:4.2em}
  .demo .stat{font-family:Consolas,monospace; font-size:.88em; color:var(--mint); text-align:center; margin-top:.4em; min-height:1.3em}
  .demo .out{background:#0a0f1e; border:1px solid var(--line2); border-radius:10px;
    padding:.7em .9em; margin-top:.6em; font-family:"SF Mono",Consolas,"D2Coding",monospace;
    font-size:.8em; line-height:1.65; white-space:pre-wrap; word-break:break-word; overflow-x:auto;
    max-height:52vh; overflow-y:auto}
  .demo .out b{color:#9fe3ff; font-weight:600}
  .demo .title{font-weight:700; color:var(--sky); margin-bottom:.4em; font-size:.95em}
  .demo canvas{border-radius:8px; border:1px solid var(--line); background:#0a0f1e; max-width:100%; height:auto; touch-action:pan-y}

  /* 퀴즈 */
  .quiz .q{font-weight:700; margin:.3em 0 .55em}
  .quiz .opts{display:flex; flex-direction:column; gap:.45em}
  .quiz .opts button{text-align:left; padding:.5em .8em; font-size:.92em; line-height:1.45}
  .quiz .opts button.right{background:rgba(124,227,139,.22); border-color:var(--good)}
  .quiz .opts button.wrong{background:rgba(255,93,115,.18); border-color:var(--bad)}
  .quiz .exp{margin-top:.6em; font-size:.9em; display:none}
  .quiz .exp.show{display:block}

  /* 체크리스트 */
  .chk{list-style:none; padding-left:0}
  .chk li{margin:.3em 0; padding:.42em .8em; background:var(--panel2); border:1px solid var(--line2);
    border-radius:10px; cursor:pointer; font-size:.92em; display:flex; gap:.6em; align-items:flex-start}
  .chk li::before{content:"☐"; color:var(--mut); font-size:1.1em; line-height:1.3}
  .chk li.done{background:rgba(124,227,139,.10); border-color:rgba(124,227,139,.4)}
  .chk li.done::before{content:"☑"; color:var(--good)}
  .chk li.done .txt{color:var(--mut); text-decoration:line-through}

  /* 스택 트레이스 */
  .trace{background:#0a0f1e; border:1px solid var(--line2); border-radius:10px; padding:.7em .9em;
    font-family:"SF Mono",Consolas,"D2Coding",monospace; font-size:.78em; line-height:1.7; overflow-x:auto; margin:.6em 0}
  .trace .fr{white-space:pre}
  .trace .mine{color:var(--gold); font-weight:700}
  .trace .lib{color:var(--mut)}
  .trace .head{color:var(--bad); font-weight:700}

  /* 표지 */
  .cover{text-align:center; padding-top:4vh}
  .cover .mega{
    font-size:clamp(2.1em, 1.8em + 3vw, 4em); font-weight:900; line-height:1.15; margin:.2em 0;
    background:linear-gradient(90deg,var(--acc),#b3e5ff,var(--acc2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .cover .sub{font-size:1.1em; color:var(--mut); max-width:40em; margin:0 auto 1.4em}
  .cover .chips{display:flex; flex-wrap:wrap; gap:.55em; justify-content:center; margin:1.2em 0}
  .cover .chips span{border:1px solid var(--line); border-radius:999px; padding:.3em 1em; font-size:.86em; background:rgba(19,30,56,.7)}

  /* 하단 내비 */
  nav#ctl{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; align-items:center; justify-content:center; gap:.5em;
    padding:.5em max(.6em, env(safe-area-inset-left)) calc(.5em + env(safe-area-inset-bottom));
    background:rgba(9,14,28,.82); backdrop-filter:blur(10px); border-top:1px solid var(--line2);
  }
  nav#ctl button{
    background:#182849; color:var(--ink); border:1px solid var(--line);
    border-radius:11px; min-width:2.8em; min-height:2.5em; font-size:1em; cursor:pointer;
  }
  nav#ctl button:hover{background:#22345e}
  nav#ctl button.wide{padding:0 1em}
  #cnt{font-family:Consolas,monospace; font-size:.95em; color:var(--mut); min-width:6.2em; text-align:center}

  /* 목차 */
  #toc{
    position:fixed; inset:0; z-index:40; display:none; overflow-y:auto;
    background:rgba(7,11,23,.96); backdrop-filter:blur(10px);
    padding:1.2em clamp(1em,4vw,3em) 3em;
  }
  #toc.open{display:block}
  #toc .tochead{display:flex; align-items:center; gap:1em; flex-wrap:wrap; margin-bottom:1em}
  #toc h2{margin:.2em 0; font-size:1.35em}
  #toc .close{margin-left:auto; font-size:1.05em; background:#182849; color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:.45em 1.1em; cursor:pointer}
  #toc .jump{display:flex; gap:.5em; align-items:center; font-size:.9em; color:var(--mut); flex-wrap:wrap}
  #toc .jump input{width:5.5em; background:#101b36; border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:.4em .6em; font-size:1em}
  #toc .jump input.q{width:min(14em,52vw)}
  #toc h3{margin:1.1em 0 .4em; font-size:1em}
  #toc .tgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr)); gap:.4em}
  #toc .tgrid button{
    text-align:left; background:var(--panel2); color:var(--ink); border:1px solid var(--line2);
    border-radius:9px; padding:.4em .7em; font-size:.82em; cursor:pointer; line-height:1.4;
    font-family:inherit;
  }
  #toc .tgrid button:hover{border-color:var(--acc); background:#152442}
  #toc .tgrid button .n{color:var(--mut); font-family:Consolas,monospace; margin-right:.5em; font-size:.85em}
  #toc .tgrid button.cur{border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset}
  #toc .hide{display:none}

  /* 좁은 화면(폴드 커버·폰) */
  @media (max-width:640px){
    #stage{padding:1em .8em 5.6em}
    nav#ctl button.wide{padding:0 .65em}
    #cnt{min-width:4.8em; font-size:.82em}
    table.tbl{font-size:.8em}
    header#top .brand small{display:none}
    pre.code{font-size:.74em; padding:.75em .8em}
    .loop .stp{flex:1 1 96px; font-size:.78em}
  }
  /* 정사각형에 가까운 화면(갤럭시 폴드 펼침 등) */
  @media (min-aspect-ratio:4/5) and (max-aspect-ratio:5/4) and (min-width:700px){
    .slide{max-width:min(1180px, 94vw)}
  }
  @media (hover:none){ nav#ctl button:hover{background:#182849} }
</style>
</head>
<body>
<div id="deck">
  <div id="bar"></div>
  <header id="top">
    <span class="brand">🐞 AI처럼 디버깅하기 <small>— 가설·실험·반증의 사고 루프</small></span>
    <span id="secbadge"></span>
  </header>
  <main id="stage" aria-live="polite"></main>
  <nav id="ctl">
    <button id="bFirst" title="처음 (Home)">⏮</button>
    <button id="bPrev" class="wide" title="이전 (←)">◀ 이전</button>
    <span id="cnt">- / -</span>
    <button id="bNext" class="wide" title="다음 (→ / Space)">다음 ▶</button>
    <button id="bLast" title="끝 (End)">⏭</button>
    <button id="bToc" class="wide" title="목차 (T)">📑 목차</button>
  </nav>
</div>

<div id="toc">
  <div class="tochead">
    <h2>📑 전체 목차</h2>
    <div class="jump">
      <label for="jumpN">번호:</label>
      <input id="jumpN" type="number" min="1" inputmode="numeric">
      <button class="close" id="jumpGo" style="margin-left:0;padding:.4em .8em">이동</button>
      <input id="tocQ" class="q" type="search" placeholder="🔎 제목 검색…">
    </div>
    <button class="close" id="tocClose">✕ 닫기 (Esc)</button>
  </div>
  <div id="tocBody"></div>
</div>

<script>
'use strict';
/* ============================================================
 * AI처럼 디버깅하기 — 동적 슬라이드 덱
 * 고급 AI 모델(Fable / Codex 계열)이 버그를 푸는 사고 루프를
 * 사람이 따라 할 수 있게 정리한 교재. 503 슬라이드.
 * ============================================================ */

sl('사고법','② 재현 — 모든 것은 여기서 갈린다', `
<h1><span class="no">1.6</span>② 재현 — 승부처</h1>
<div class="fx big">재현할 수 없는 버그는 <strong>고쳤는지 확인할 수도 없다</strong>. 그래서 재현은 선택이 아니라 관문입니다.</div>
<h3>재현의 3등급</h3>
<div class="tw"><table class="tbl">
<thead><tr><th>등급</th><th>상태</th><th>다음 행동</th></tr></thead>
<tbody>
<tr><td>A</td><td>명령 한 줄로 100% 재현</td><td>바로 최소화·국소화로</td></tr>
<tr><td>B</td><td>10번에 1번 재현(플래키)</td><td>확률을 높이는 <em>증폭</em> 작업 먼저 (부하·지연 주입·반복 실행)</td></tr>
<tr><td>C</td><td>운영에서만, 로컬 재현 불가</td><td>관측성 강화(로그·트레이스·덤프)로 <em>증거 수집</em>이 당면 과제</td></tr>
</tbody>
</table></div>
<h3>등급을 올리는 표준 수단</h3>
<ul>
<li><strong>고정</strong>: 난수 seed, 시각(<code>freezegun</code>/가짜 clock), 스레드 수 1개, 로케일/타임존</li>
<li><strong>반복</strong>: <code>for i in \$(seq 1 500); do ./t || break; done</code> — 실패까지 반복</li>
<li><strong>증폭</strong>: 스레드 수 ↑, 슬립 주입, CPU 제한(<code>taskset -c 0</code>), 메모리 제한</li>
<li><strong>기록</strong>: <code>rr record</code>(Linux), TTD(Windows) — 한 번만 잡으면 무한 재생</li>
</ul>
<div class="note">B등급에서 “재현이 잘 안 되네” 하고 코드 읽기로 도망가는 것이 가장 흔한 함정입니다.
<strong>재현 확률을 올리는 작업 자체가 디버깅</strong>입니다. 확률이 올라가면 원인의 성격(경합? 타이밍? 순서?)도 함께 드러납니다.</div>`);

sl('사고법','③ 최소화 — 지우면서 증상을 유지', `
<h1><span class="no">1.7</span>③ 최소화 — 지우면서 유지하기</h1>
<p>최소화의 정의: <strong>증상은 유지한 채 입력·코드·환경을 계속 줄이는 것</strong>.
줄이면 남는 것이 곧 원인 후보이므로, 최소화는 그 자체로 국소화입니다.</p>
<div class="cols">
<div>
<h3>줄일 수 있는 4가지 축</h3>
<ol>
<li><strong>입력 데이터</strong> — 10MB JSON → 3줄</li>
<li><strong>코드</strong> — 모듈 20개 → 파일 1개</li>
<li><strong>환경</strong> — 도커+DB+캐시 → 단일 프로세스</li>
<li><strong>시간</strong> — 3시간 운영 → 10초 반복</li>
</ol>
<div class="tip">한 축이 막히면 다른 축을 줄이세요. 넷 다 줄이면 대개 <em>“이 5줄이 문제”</em>가 됩니다.</div>
</div>
<div>
<h3>최소화가 주는 부수입</h3>
<ul>
<li>버그 리포트가 <strong>남에게 전달 가능</strong>해진다(오픈소스 이슈 필수)</li>
<li>AI에게 줄 <strong>컨텍스트가 작아진다</strong> → 정확도 급상승</li>
<li>회귀 테스트로 <strong>그대로 승격</strong> 가능</li>
<li>“내 코드 탓인가 라이브러리 탓인가”가 자동으로 갈린다</li>
</ul>
<div class="note">최소화 도중 <em>증상이 사라지면</em> 방금 지운 것이 원인과 관련 있습니다.
그건 실패가 아니라 <strong>가장 값진 정보</strong>입니다. 되돌린 뒤 그 부분을 정밀 조사하세요.</div>
</div>
</div>
<div class="fx">2부에서 이 과정을 자동화하는 <strong>델타 디버깅(ddmin)</strong>과 <strong>git bisect</strong>를 다룹니다.</div>`);

sl('사고법','⑤ 예측 — 실험 전에 답을 적어라', `
<h1><span class="no">1.9</span>⑤ 예측 — 실험 전에 답을 적기</h1>
<p>사람이 가장 많이 건너뛰는 단계이자, AI 모델이 절대 안 건너뛰는 단계입니다.
<strong>실험 전에 예상 결과를 적어두면 사후 합리화가 불가능</strong>해집니다.</p>
<div class="cols">
<div>
<h3>왜 중요한가</h3>
<ul>
<li>결과를 보고 나서 “아 그럴 줄 알았어”는 <em>아무 정보도 주지 않는다</em></li>
<li>예측이 빗나가면 <strong>모델이 틀렸다는 확실한 신호</strong> — 가장 값진 순간</li>
<li>예측을 적으면 <em>어떤 관측을 봐야 하는지</em>가 정해져서 로그 폭포에서 안 헤맨다</li>
</ul>
</div>
<div>
<h3>예측 기록 예</h3>
<pre class="code"><code>가설: 풀 고갈로 인한 타임아웃
예측1: 실패 시각에 pool.active == max(10)
예측2: pool.waitCount &gt; 0 이 로그에 찍힘
예측3: max를 40으로 올리면 실패율 0
반증조건: active가 3인데도 타임아웃 → 가설 폐기</code></pre>
</div>
</div>
<div class="fx">좋은 실험은 <strong>가설이 참일 때와 거짓일 때 결과가 확실히 다른</strong> 실험입니다.
어느 쪽이든 같은 그림이 나오는 실험은 시간 낭비이므로 아예 하지 마세요.</div>
<div class="note"><strong>진단 능력(diagnosticity)</strong>: 실험 하나가 살아있는 가설 중 몇 개를 죽일 수 있는가?
가설 8개 중 4개를 죽이는 실험 &gt; 1개를 확인하는 실험. 이게 곧 “이분 탐색적 사고”입니다.</div>`);

sl('사고법','⑦ 국소화 — 이분 탐색이 왕도', `
<h1><span class="no">1.11</span>⑦ 국소화 — 이분 탐색이 왕도</h1>
<div class="fx big">정상 → 이상으로 <strong>상태가 뒤집히는 경계</strong>를 찾는 게임.
경계는 시간축·코드축·데이터축·버전축 어디에나 있습니다.</div>
<div class="cols">
<div>
<h3>4개의 축, 같은 기법</h3>
<ul>
<li><strong>버전축</strong>: <code>git bisect</code> — 커밋 1000개 → 10회</li>
<li><strong>코드축</strong>: 파이프라인 중간에서 값 검사 — 함수 100개 → 7회</li>
<li><strong>데이터축</strong>: 입력 절반씩 자르기 → ddmin</li>
<li><strong>시간축</strong>: 로그를 반으로 갈라 정상/이상 경계 찾기</li>
</ul>
<div class="tip">이분 탐색의 전제: <strong>단조성</strong>(경계 앞은 모두 정상, 뒤는 모두 이상).
플래키하면 각 지점에서 N회 반복해 확률로 판정하세요.</div>
</div>
<div>
<h3>정보이론적 근거</h3>
<p>후보가 N개일 때 실험 1회가 후보를 반으로 가르면 필요한 실험 수는 <code>log₂N</code>회.
한 개씩 확인하면 평균 <code>N/2</code>회.</p>
<div class="tw"><table class="tbl tt">

sl('사고법','에러 메시지를 제대로 읽는 법', `
<h1><span class="no">1.15</span>에러 메시지를 제대로 읽는 법</h1>
<p>에러 메시지는 <strong>이미 절반의 답</strong>입니다. 그런데 사람들은 첫 줄만 복사해 검색합니다.</p>
<h3>읽는 순서</h3>
<ol>
<li><strong>예외 타입</strong> — 무엇이 잘못됐는지의 분류 (NPE? 타입? IO? 권한?)</li>
<li><strong>메시지 본문</strong> — 값·경로·기대치가 들어 있다. <em>숫자와 따옴표 안의 문자열을 특히</em></li>
<li><strong>맨 아래 <code>Caused by</code></strong> — 진짜 원인. 위쪽은 래핑된 껍데기</li>
<li><strong>내 코드가 등장하는 첫 프레임</strong> — 조사 시작점</li>
<li><strong>부가 정보</strong> — 종료 코드, errno, 시그널, HRESULT</li>
</ol>
<div class="cols">
<div><div class="vs" style="grid-template-columns:1fr">
<div class="x"><div class="lb">✗ 이렇게 읽는다</div>
<div class="small">“NullPointerException 났네” → 구글 검색 → 스택오버플로 복붙</div></div>
<div class="o"><div class="lb">✓ 이렇게 읽는다</div>
<div class="small">“<code>Cannot invoke "Order.getId()" because "o" is null</code> —
JDK 14+ helpful NPE가 <strong>어떤 변수가 null인지</strong>까지 알려줬다.
<code>o</code>는 <code>repo.find(id)</code>의 반환. 즉 조회 실패 경로가 처리 안 됨.”</div></div>
</div></div>
<div>
<div class="tip"><strong>메시지 안의 보물</strong>
<ul>
<li><code>expected 3 got 0</code> → 경계/빈 컬렉션</li>
<li><code>/etc/app/conf.yaml</code> → 경로 확인 즉시 가능</li>
<li><code>errno 13 (EACCES)</code> → 권한, 코드 아님</li>
<li><code>at 0x00000000</code> → 널 포인터 역참조</li>
<li><code>0xC0000005</code> → Windows 액세스 위반</li>
</ul></div>
<div class="note">검색은 <strong>가변 부분을 지우고</strong> 하세요.
<code>File "/home/kim/app/x.py", line 42</code> 같은 내 환경 문자열은 빼야 결과가 나옵니다.</div>
</div>
</div>`);

sl('사고법','“무엇이 바뀌었나” — 최강의 질문', `
<h1><span class="no">1.18</span>“무엇이 바뀌었나?” — 최강의 질문</h1>
<div class="fx big">어제는 됐는데 오늘 안 된다면, 원인은 <strong>그 사이의 변경 집합</strong> 안에 100% 있습니다.</div>
<h3>바뀔 수 있는 것 8가지 (코드는 그중 하나일 뿐)</h3>

<div class="card"><div class="h">① 코드</div><div class="s"><code>git log --since="2 days ago"</code>, 내 브랜치뿐 아니라 머지된 것 전부</div></div>
<div class="card"><div class="h">② 의존성</div><div class="s">lock 파일 없이 <code>^1.2</code> 범위 설치 → 새벽에 마이너 릴리스</div></div>

<div class="card"><div class="h">⑥ 시간</div><div class="s">월말·윤초·DST·인증서 만료·토큰 TTL</div></div>
<div class="card"><div class="h">⑦ 규모</div><div class="s">사용자 증가로 임계치 통과(풀·파일디스크립터)</div></div>

sl('사고법','증상과 원인의 거리 — 인과 사슬', `
<h1><span class="no">1.19</span>증상과 원인의 거리</h1>
<p>버그의 난이도는 <strong>원인과 증상 사이의 거리</strong>로 결정됩니다. 거리가 멀수록 도구가 필요합니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>거리</th><th>예</th><th>필요한 무기</th></tr></thead>
<tbody>
<tr><td>0 — 같은 줄</td><td>오타, off-by-one</td><td>눈, 컴파일러 경고</td></tr>
<tr><td>1 — 같은 함수</td><td>초기화 누락</td><td>print, 디버거</td></tr>
<tr><td>2 — 모듈 간</td><td>계약 위반(null 허용 여부)</td><td>단위 테스트, 어서션</td></tr>
<tr><td>3 — 시간 지연</td><td>메모리 누수, 캐시 오염</td><td>프로파일러, 힙 스냅샷</td></tr>
<tr><td>4 — 공간 이동</td><td>버퍼 오버런이 <em>남의 변수</em>를 깨뜨림</td><td>ASan, valgrind, 워치포인트</td></tr>
<tr><td>5 — 비결정적</td><td>데이터 레이스</td><td>TSan, 스트레스, rr/TTD</td></tr>
<tr><td>6 — 계층 밖</td><td>컴파일러/커널/하드웨어/펌웨어</td><td>최소재현 + 버전 이분탐색</td></tr>
</tbody>

<li><strong>rr / TTD</strong>로 한 번만 기록해 두면 관찰이 실행에 영향을 주지 않음</li>
</ul>
<div class="note">디버그 빌드에서만 사라진다면 그 자체가 큰 단서입니다:

</div>
</div>
<pre class="code"><code><span class="cm">// 하이젠버그를 유발하는 전형: 관찰 지점이 무거움</span>
<span class="kw">for</span> (;;) {
  printf(<span class="st">"tick %d\\n"</span>, n);   <span class="cm">// stdout flush = 커널 진입 = 수십 µs</span>

}
<span class="cm">// 개선: 링버퍼에 쌓고 종료 시 한 번에 덤프</span>
buf[i++ &amp; MASK] = (Rec){ .ts = rdtsc(), .n = n };</code></pre>`);

sl('최소화','델타 디버깅 — 최소화의 이론', `
<h1><span class="no">2.13</span>델타 디버깅(Delta Debugging)</h1>
<div class="fx">Andreas Zeller의 <strong>ddmin</strong>: “증상을 유지하면서 더 이상 줄일 수 없는 입력”을 자동으로 찾는 알고리즘.
1-minimal — <em>어떤 한 조각을 빼도 증상이 사라지는</em> 상태.</div>
<h3>필요한 것 단 두 가지</h3>
<ol>
<li><strong>입력</strong> — 조각으로 나눌 수 있는 것 (문자, 줄, 토큰, HTML 노드, 커밋…)</li>
<li><strong>판정 함수 <code>test(input) → PASS / FAIL / UNRESOLVED</code></strong></li>
</ol>
<h3>알고리즘 골격</h3>
<pre class="code"><code>ddmin(c_fail):
  n = 2
  <span class="kw">while</span> |c_fail| &gt;= 2:
    subsets = c_fail 를 n등분
    <span class="cm"># ① 부분집합 자체가 실패하는가? (크게 줄이기)</span>
    <span class="kw">if</span> ∃ s ∈ subsets: test(s) == FAIL:
        c_fail = s; n = 2; <span class="kw">continue</span>
    <span class="cm"># ② 여집합이 실패하는가? (조금씩 깎기)</span>
    <span class="kw">if</span> ∃ s ∈ subsets: test(c_fail − s) == FAIL:
        c_fail = c_fail − s; n = max(n−1, 2); <span class="kw">continue</span>
    <span class="cm"># ③ 더 잘게</span>
    <span class="kw">if</span> n &lt; |c_fail|: n = min(2n, |c_fail|) <span class="kw">else</span>: <span class="kw">break</span>
  <span class="kw">return</span> c_fail</code></pre>
<div class="note">복잡도는 최악 O(n²)이지만 실제 입력에서는 대개 <strong>수십 회</strong>의 test 호출로 끝납니다.
사람이 손으로 30분 할 일을 30초에 합니다.</div>`);

sl('최소화','ddmin 구현 — 그대로 쓰는 40줄', `
<h1><span class="no">2.15</span>ddmin 구현 (Python, 그대로 사용 가능)</h1>
<pre class="code"><code><span class="cm"># ddmin.py — 줄 단위 입력 최소화기</span>
<span class="kw">import</span> subprocess, sys, tempfile, os

<span class="kw">def</span> <span class="fn">test</span>(lines) -&gt; bool:
    <span class="st">"""FAIL(=버그 재현)이면 True"""</span>
    <span class="kw">with</span> tempfile.NamedTemporaryFile(<span class="st">'w'</span>, suffix=<span class="st">'.txt'</span>, delete=<span class="kw">False</span>) <span class="kw">as</span> f:
        f.write(<span class="st">''</span>.join(lines)); path = f.name
    <span class="kw">try</span>:
        r = subprocess.run([<span class="st">'./app'</span>, path], capture_output=<span class="kw">True</span>, timeout=<span class="nb">10</span>)
        <span class="kw">return</span> r.returncode != <span class="nb">0</span>          <span class="cm"># 판정 기준을 여기서 정의</span>
    <span class="kw">except</span> subprocess.TimeoutExpired:
        <span class="kw">return</span> <span class="kw">True</span>                       <span class="cm"># 행(hang)도 실패로 간주</span>
    <span class="kw">finally</span>:
        os.unlink(path)

<span class="kw">def</span> <span class="fn">ddmin</span>(inp):
    n = <span class="nb">2</span>
    <span class="kw">while</span> len(inp) &gt;= <span class="nb">2</span>:
        chunk = max(len(inp) // n, <span class="nb">1</span>)
        subsets = [inp[i:i+chunk] <span class="kw">for</span> i <span class="kw">in</span> range(<span class="nb">0</span>, len(inp), chunk)]
        <span class="cm"># ① 부분집합만으로 재현되나</span>
        <span class="kw">for</span> s <span class="kw">in</span> subsets:
            <span class="kw">if</span> test(s): inp, n = s, <span class="nb">2</span>; <span class="kw">break</span>
        <span class="kw">else</span>:
            <span class="cm"># ② 하나를 뺀 나머지로 재현되나</span>
            <span class="kw">for</span> i, s <span class="kw">in</span> enumerate(subsets):
                rest = inp[:i*chunk] + inp[(i+1)*chunk:]
                <span class="kw">if</span> rest <span class="kw">and</span> test(rest):
                    inp, n = rest, max(n-<span class="nb">1</span>, <span class="nb">2</span>); <span class="kw">break</span>
            <span class="kw">else</span>:
                <span class="kw">if</span> n &gt;= len(inp): <span class="kw">break</span>
                n = min(n*<span class="nb">2</span>, len(inp))
    <span class="kw">return</span> inp

<span class="kw">if</span> __name__ == <span class="st">'__main__'</span>:
    lines = open(sys.argv[<span class="nb">1</span>]).readlines()
    <span class="kw">assert</span> test(lines), <span class="st">"원본이 실패하지 않습니다 — 재현부터 확인"</span>
    out = ddmin(lines)
    sys.stderr.write(f<span class="st">"\\n{len(lines)} → {len(out)} 줄\\n"</span>)
    sys.stdout.writelines(out)</code></pre>
<div class="tip"><code>assert test(lines)</code> 한 줄이 핵심입니다. <strong>원본이 실패하는지 먼저 확인</strong>하지 않으면
최소화기는 아무거나 반환합니다.</div>`);

sl('최소화','git bisect run — 완전 자동화', `

<div class="fx big">재현 스크립트 + <code>git bisect run</code> = <strong>커피 한 잔 사이에 원인 커밋 확정</strong></div>
<pre class="code sh"><code>$ git bisect start HEAD v1.4.0        <span class="cm"># bad good 을 한 번에</span>
$ git bisect run ./repro.sh
<span class="cm"># 종료 코드 규약</span>
<span class="cm">#   0        → good</span>
<span class="cm">#   1..124   → bad</span>
<span class="cm">#   125      → skip (판정 불가: 빌드 실패 등)</span>
<span class="cm">#   128 이상 → bisect 중단</span></code></pre>
<pre class="code sh"><code><span class="cm">#!/bin/sh</span>
<span class="cm"># repro.sh — 빌드 실패는 skip, 테스트 실패는 bad</span>

make -j8 &gt;/dev/null 2&gt;&amp;1 || <span class="kw">exit</span> 125     <span class="cm"># 판정 불가</span>
timeout 60 ./run_test &gt;/dev/null 2&gt;&amp;1
rc=$?
[ $rc -eq 124 ] &amp;&amp; <span class="kw">exit</span> 125             <span class="cm"># 타임아웃도 skip 처리(정책에 따라)</span>
<span class="kw">exit</span> $rc</code></pre>
<div class="osgrid">
<div class="osbox l"><h4>🐧 언어별 원라이너</h4>
<pre class="code sh"><code>$ git bisect run go test ./pkg/order -run TestPay
$ git bisect run python -m pytest -x -q tests/test_pay.py
$ git bisect run npx vitest run src/pay.test.ts
$ git bisect run mvn -q -Dtest=PayTest test</code></pre></div>
<div class="osbox w"><h4>🪟 Windows</h4>
<pre class="code sh"><code>&gt; git bisect run cmd /c <span class="st">"build.bat &amp;&amp; test.exe"</span>
<span class="cm"># PowerShell 스크립트를 쓸 때는 종료 코드 전달 주의</span>

sl('최소화','MRE — 최소 재현 예제 만들기', `
<h1><span class="no">2.20</span>MRE(Minimal Reproducible Example) 만들기</h1>
<div class="cols">
<div>
<h3>MRE의 3요건</h3>
<ol>
<li><strong>Minimal</strong> — 관련 없는 코드 전부 제거</li>
<li><strong>Reproducible</strong> — 복사·실행하면 그대로 재현</li>
<li><strong>Complete</strong> — import·의존성·데이터가 다 들어 있음</li>

<h3>만드는 순서</h3>
<ol>
<li>새 빈 프로젝트/파일 생성</li>
<li>실패 경로만 <strong>복사해 붙여넣기</strong> (원본 수정 아님)</li>
<li>실패 확인 → 안 되면 빠진 조건이 무엇인지가 곧 단서</li>
<li>절반씩 지우며 실패 유지 (수동 ddmin)</li>
<li>외부 의존을 상수·하드코딩으로 대체</li>
<li>파일 1개, 50줄 이하를 목표로</li>
</ol>
</div>
<div>
<pre class="code"><code><span class="cm"># 나쁜 예: 재현 불가</span>
<span class="st">"제 서비스에서 데이터를 처리하면 에러가 나요.
 코드는 회사 코드라 못 올려요. 도와주세요."</span>

<span class="cm"># 좋은 예: 그대로 실행 가능</span>
<span class="kw">import</span> pandas <span class="kw">as</span> pd            <span class="cm"># pandas==2.2.2, python 3.12</span>

<span class="cm"># 기대: b=NaN 행이 포함된 2행</span>
<span class="cm"># 실제: 1행만 나옴</span></code></pre>

</div>
</div>`);

sl('관찰','print의 함정 — 버퍼링과 순서', `
<h1><span class="no">3.4</span>print의 함정 — 버퍼링과 순서</h1>
<div class="danger"><strong>가장 잔인한 함정</strong>: 크래시 직전의 print가 <em>화면에 안 나온다</em>.
버퍼에 있던 내용이 프로세스와 함께 사라졌기 때문입니다. → “여기까지는 안 왔다”고 오판하게 됩니다.</div>
<div class="tw"><table class="tbl">
<thead><tr><th>스트림</th><th>기본 버퍼링</th><th>강제 flush</th></tr></thead>
<tbody>
<tr><td>stdout(터미널)</td><td>줄 단위</td><td>대체로 문제 없음</td></tr>
<tr><td>stdout(파이프/파일)</td><td><strong>블록(4~8KB)</strong></td><td>여기서 사고 발생</td></tr>
<tr><td>stderr</td><td>대부분 무버퍼</td><td>디버그 출력은 stderr 권장</td></tr>
</tbody>
</table></div>
<div class="cols">
<div><pre class="code"><code><span class="lg">C</span>     setvbuf(stdout, <span class="kw">NULL</span>, _IONBF, <span class="nb">0</span>); <span class="cm">// 또는 fflush()</span>
<span class="lg">Python</span> print(..., flush=<span class="kw">True</span>)  <span class="cm"># 또는 python -u</span>
<span class="lg">Java</span>   System.out.flush(); <span class="cm">// System.err 는 autoflush</span>
<span class="lg">Go</span>     <span class="cm">// os.Stderr 는 무버퍼. bufio 쓰면 Flush 필수</span>
<span class="lg">Node</span>   <span class="cm">// stdout이 파이프면 비동기! process.stdout.write 후</span>
       <span class="cm">// 즉시 process.exit() 하면 유실됨</span></code></pre>
<div class="note"><strong>Node.js 특유</strong>: <code>process.exit()</code>는 대기 중인 stdout 쓰기를 버립니다.
<code>process.exitCode = 1</code>로 설정하고 자연 종료시키세요.</div>
</div>
<div>
<h3>순서가 거짓말하는 경우</h3>
<ul>
<li><strong>stdout과 stderr을 섞어 볼 때</strong> — 버퍼링이 달라 순서가 뒤바뀜. <code>2&gt;&amp;1</code>로 합쳐도 왜곡 가능</li>
<li><strong>멀티스레드</strong> — 한 줄이 다른 줄 중간에 끼어듦. 원자적 한 줄 출력 필요</li>
<li><strong>비동기/이벤트 루프</strong> — 실행 순서 ≠ 코드 순서</li>
<li><strong>분산</strong> — 서버 간 클럭 스큐로 시각이 역전</li>
</ul>
<pre class="code"><code><span class="cm"># 멀티스레드: 문자열을 완성한 뒤 한 번에 write</span>
sys.stderr.write(f<span class="st">"[{threading.get_ident()}] {msg}\\n"</span>)
<span class="cm"># print(a, b, c) 는 내부적으로 여러 번 write → 섞임</span></code></pre>
</div>
</div>`);

sl('관찰','로그에서 신호 찾기 — Linux', `
<h1><span class="no">3.7</span>로그에서 신호 찾기 <span class="os l">LINUX</span></h1>
<pre class="code sh"><code><span class="cm"># 1) 에러만, 앞뒤 맥락 3줄</span>
$ rg -n -C3 <span class="st">'ERROR|Exception|panic'</span> app.log

<span class="cm"># 2) 특정 trace_id의 전체 여정 (여러 파일에서)</span>
$ rg -n <span class="st">'a1b2c3d4'</span> /var/log/svc-*/*.log | sort -t: -k2 -n

<span class="cm"># 3) 초당 에러 수 히스토그램</span>
$ rg -o <span class="st">'^\\S+T\\d\\d:\\d\\d:\\d\\d'</span> err.log | uniq -c | sort -rn | head

<span class="cm"># 4) JSON 로그 집계 (jq)</span>
$ jq -r <span class="st">'select(.level=="error") | [.stage,.err] | @tsv'</span> app.json \\
   | sort | uniq -c | sort -rn

<span class="cm"># 5) 지연 상위 20개 요청</span>

   | sort -rn | head -20

$ journalctl -u myapp -p err -f          <span class="cm"># 에러 이상만 실시간</span>

</div>
<div>
<div class="tw"><table class="tbl">

<h1><span class="no">4.1</span>디버거는 어떻게 동작하는가</h1>
<div class="cols">
<div>
<h3>핵심 메커니즘 3가지</h3>
<ol>
<li><strong>프로세스 제어</strong><br>
<span class="os l">LINUX</span> <code>ptrace(PTRACE_ATTACH/CONT/PEEKDATA…)</code><br>
<span class="os w">WIN</span> <code>DebugActiveProcess</code> + <code>WaitForDebugEvent</code></li>
<li><strong>소프트 브레이크포인트</strong> — 해당 주소의 1바이트를
<code>0xCC</code>(x86 <code>INT3</code>)로 교체. 실행이 닿으면 트랩 → 디버거가 원래 바이트 복원 후 정지</li>
<li><strong>하드웨어 브레이크포인트</strong> — CPU 디버그 레지스터(x86 DR0~DR3, 최대 4개).
<em>주소에 대한 읽기/쓰기/실행</em>을 감시 → 워치포인트의 정체</li>
</ol>
<div class="note">그래서 <strong>워치포인트는 4개까지만 빠릅니다</strong>. 그 이상은 소프트웨어 감시(단일 스텝 + 비교)로 떨어져 수백 배 느려집니다.</div>
</div>
<div>
<pre class="code"><code><span class="cm">// 개념적으로 디버거가 하는 일</span>
attach(pid);
orig = read_byte(addr);
write_byte(addr, <span class="nb">0xCC</span>);     <span class="cm">// INT3 심기</span>
cont();
wait_for_trap();            <span class="cm">// SIGTRAP / EXCEPTION_BREAKPOINT</span>
write_byte(addr, orig);     <span class="cm">// 원복</span>
set_pc(get_pc() - <span class="nb">1</span>);      <span class="cm">// INT3 크기만큼 되감기</span>
show_state();               <span class="cm">// 레지스터·스택·변수</span></code></pre>

<li>자체 무결성 검사가 있는 프로그램은 <code>0xCC</code>를 <em>탐지</em>할 수 있다(안티디버깅)</li>

</ul>
</div>
</div>`);

<div class="osbox w"><h4>🪟 WinDbg / Visual Studio</h4>
<pre class="code sh"><code><span class="cm">; WinDbg: ba = break on access</span>
0:000&gt; ba w4 0x00007ff6\`0004a120   <span class="cm">; 4바이트 쓰기 감시</span>

<span class="cm">; Visual Studio</span>
<span class="cm">; 중단점 창 → "데이터 중단점" 또는</span>
<span class="cm">; 디버그 중 조사식 우클릭 → "값이 변경되면 중단"</span></code></pre></div>
</div>
<div class="cols">
<div><div class="tip"><strong>전형적 사용 흐름</strong>
<ol><li>크래시 시점에 <code>obj-&gt;magic</code>이 0xdeadbeef가 아님을 확인</li>
<li>프로그램 재시작, 객체 생성 직후 <code>watch -l obj-&gt;magic</code></li>
<li>계속 실행 → <strong>덮어쓴 코드에서 정지</strong> → <code>bt</code>로 범인 확인</li></ol></div></div>
<div><div class="note"><strong>한계</strong>: 하드웨어 워치포인트는 x86에서 최대 4개, 크기도 1/2/4/8바이트 단위.

그럴 땐 <strong>ASan/valgrind</strong>나 <strong>rr reverse-continue</strong>가 대안입니다.</div></div>
</div>`);

<pre class="code"><code><span class="cm"># ① 특정 사용자/ID일 때만</span>

sl('디버거','심볼과 디버그 정보 (DWARF / PDB)', `
<h1><span class="no">4.6</span>심볼과 디버그 정보</h1>
<div class="fx">디버거가 <code>0x7f2a3c1b</code>를 <code>OrderRepo::find(int) at repo.cpp:88</code>로 바꿔주는 것은
<strong>디버그 정보</strong> 덕분입니다. 이게 없으면 스택 트레이스는 숫자 나열이 됩니다.</div>
<div class="osgrid">
<div class="osbox l"><h4>🐧 Linux — DWARF</h4>
<pre class="code sh"><code><span class="cm"># 빌드: -g(디버그정보) -O0~-O2, -fno-omit-frame-pointer 권장</span>
$ gcc -g3 -O2 -fno-omit-frame-pointer app.c -o app

<span class="cm"># 심볼 유무 확인</span>
$ file app                 <span class="cm"># "with debug_info, not stripped"</span>
$ readelf -S app | grep debug
$ nm -C app | head

<span class="cm"># 심볼 분리 보관(배포는 작게, 디버깅은 완전하게)</span>
$ objcopy --only-keep-debug app app.debug
$ strip --strip-debug app
$ objcopy --add-gnu-debuglink=app.debug app
(gdb) symbol-file app.debug

<span class="cm"># 주소 → 소스 라인</span>
$ addr2line -e app -f -C -i 0x401136</code></pre></div>
<div class="osbox w"><h4>🪟 Windows — PDB</h4>
<pre class="code sh"><code><span class="cm">; 빌드: /Zi (PDB 생성) + /DEBUG 링크</span>
&gt; cl /Zi /O2 app.c /link /DEBUG /PDBALTPATH:%_PDB%

<span class="cm">; 심볼 서버 설정 (핵심!)</span>
&gt; set _NT_SYMBOL_PATH=srv*C:\\sym*https://msdl.microsoft.com/download/symbols
0:000&gt; .sympath+ C:\\myproject\\bin
0:000&gt; .reload /f
0:000&gt; lm                  <span class="cm">; 모듈·심볼 상태 (deferred/pdb symbols)</span>
0:000&gt; !sym noisy          <span class="cm">; 심볼 로딩 실패 원인 보기</span></code></pre>
<ul class="small"><li>PDB는 <strong>빌드마다 GUID가 다름</strong> → 정확히 그 빌드의 PDB가 필요</li>
<li>배포 빌드의 PDB를 반드시 보관(심볼 서버)해야 덤프 분석 가능</li></ul></div>
</div>
<div class="danger">“<code>??</code>만 나오는 스택”, “<code>&lt;optimized out&gt;</code>”, “모듈 이름+오프셋만” —
전부 <strong>심볼 문제</strong>입니다. 코드를 의심하기 전에 심볼부터 확인하세요.</div>`);

<h1><span class="no">4.7</span>최적화 빌드 디버깅</h1>
<div class="tw"><table class="tbl">
<thead><tr><th>현상</th><th>원인</th><th>대응</th></tr></thead>
<tbody>
<tr><td><code>&lt;optimized out&gt;</code></td><td>변수가 레지스터에만 있거나 제거됨</td><td><code>-Og</code> 빌드, 또는 레지스터 직접 조사</td></tr>

<tr><td>함수가 스택에 없음</td><td>인라인·꼬리호출 최적화</td><td><code>bt -past-main</code>, <code>-fno-inline</code>로 재현</td></tr>
<tr><td>BP를 못 건다</td><td>해당 코드가 사라짐</td><td>주변 라인/함수 진입점에</td></tr>
<tr><td>디버그 빌드에선 정상</td><td><strong>UB 또는 레이스</strong></td><td>UBSan/ASan/TSan — 이게 핵심 신호</td></tr>

</table></div>
<pre class="code sh"><code><span class="cm"># 최적화는 유지하되 디버깅 가능성을 높이는 조합</span>

$ gcc -O2 -g3 -fno-inline -fno-omit-frame-pointer app.c

<span class="cm"># gdb에서 인라인 프레임까지 보기</span>
(gdb) bt -full
(gdb) info frame
(gdb) disassemble /s          <span class="cm"># 소스와 어셈블리 섞어 보기</span>
(gdb) info registers rax rbx rdi rsi</code></pre>
<div class="note"><strong>중요한 진단 신호</strong>: “<code>-O0</code>에서는 되고 <code>-O2</code>에서 깨진다”는
컴파일러 버그가 아니라 <strong>내 코드의 UB</strong>일 확률이 훨씬 높습니다.
strict aliasing 위반, 초기화되지 않은 변수, 시그니처 오버플로, 데이터 레이스 — 이 넷을 먼저 의심하세요.
<code>-fsanitize=undefined</code>로 5분이면 확인됩니다.</div>`);

sl('디버거','멀티스레드 디버깅', `
<h1><span class="no">4.9</span>멀티스레드 디버깅</h1>
<pre class="code sh"><code><span class="cm"># gdb</span>
(gdb) info threads                  <span class="cm"># 전체 스레드 목록(* 가 현재)</span>
(gdb) thread 5                      <span class="cm"># 5번으로 전환</span>
(gdb) thread apply all bt           <span class="cm"># ★ 모든 스레드 스택 = 데드락의 정답지</span>
(gdb) thread apply all bt full
(gdb) set scheduler-locking on      <span class="cm"># 스텝 시 다른 스레드 정지(레이스 조사)</span>
(gdb) b worker.c:33 thread 4        <span class="cm"># 특정 스레드에서만</span>

<span class="cm"># WinDbg</span>
0:000&gt; ~                            <span class="cm">; 스레드 목록</span>
0:000&gt; ~*k                          <span class="cm">; ★ 모든 스레드 스택</span>
0:000&gt; ~5s                          <span class="cm">; 5번 스레드로 전환</span>
0:000&gt; !locks                       <span class="cm">; 크리티컬 섹션 소유/대기</span>
0:000&gt; !analyze -v -hang            <span class="cm">; 행 분석</span></code></pre>
<div class="cols">
<div><h3>데드락 진단 3분 절차</h3>
<ol>
<li>행(hang) 상태에서 <strong>덤프 또는 부착</strong></li>
<li><code>thread apply all bt</code> / <code>~*k</code></li>
<li>스택에서 <code>lock</code>/<code>wait</code>/<code>join</code>/<code>futex</code>에 멈춘 스레드를 찾는다</li>
<li>각각이 <em>어떤 락을 들고 어떤 락을 기다리는지</em> 표로 정리 → 순환 발견</li>
</ol>
<div class="tip">Java는 도구가 대신 해줍니다: <code>jstack PID</code>가
<em>“Found one Java-level deadlock”</em>과 순환까지 출력합니다.</div>
</div>
<div>
<div class="note"><strong>디버거가 레이스를 숨긴다</strong><br>
스레드를 멈추는 순간 타이밍이 바뀌어 레이스가 재현되지 않습니다.
레이스에는 디버거가 아니라 <strong>TSan / Helgrind / rr</strong>을 쓰세요.
디버거는 <em>이미 멈춰버린</em> 데드락·행 분석에 강합니다.</div>
<pre class="code"><code><span class="cm"># 상태별 도구 선택</span>

<p>같은 조사를 반복한다면 스크립트로 만드세요. AI 모델이 잘하는 “지치지 않는 반복”을 <strong>도구에 위임</strong>하는 것입니다.</p>

<code>from libstdcxx.v6.printers import register_libstdcxx_printers</code>.
Clang/libc++는 <code>libcxx</code> 프린터를 따로 등록해야 합니다.</div></div>
</div>`);

sl('Linux','strace — 커널 경계에서 관찰하기', `
<h1><span class="no">5.6</span>strace — 시스템 콜 추적</h1>
<div class="fx big">“설정 파일을 못 읽는다”, “권한이 없다”, “어디에 접속하는지 모르겠다” — 이 부류는
<strong>코드를 읽지 말고 strace를 돌리세요</strong>. 30초면 끝납니다.</div>
<pre class="code sh"><code><span class="cm"># 기본</span>
$ strace ./app
$ strace -f ./app               <span class="cm"># 자식 프로세스/스레드 포함(거의 항상 필요)</span>
$ strace -p 1234                <span class="cm"># 실행 중 프로세스에 부착</span>
$ strace -o trace.txt -f ./app  <span class="cm"># 파일로</span>

<span class="cm"># 파일 관련만 (설정/경로 문제의 90%)</span>
$ strace -f -e trace=file ./app 2&gt;&amp;1 | grep -v ENOENT
$ strace -f -e trace=openat,stat,access ./app

<span class="cm"># 네트워크만</span>
$ strace -f -e trace=network -s 200 ./app

<span class="cm"># 요약 통계 (어떤 syscall이 시간을 먹나)</span>
$ strace -c -f ./app
$ strace -T -e trace=read,write ./app    <span class="cm"># 각 호출 소요시간</span>
$ strace -r ./app                        <span class="cm"># 상대 타임스탬프</span>
$ strace -tt -f ./app                    <span class="cm"># 절대 시각(us)</span>

<span class="cm"># 문자열 잘림 방지</span>
$ strace -s 1024 -e trace=write ./app</code></pre>
<pre class="code"><code><span class="cm"># 읽는 법: 반환값이 핵심</span>
openat(AT_FDCWD, <span class="st">"/etc/app/conf.yaml"</span>, O_RDONLY) = -1 <span class="er">ENOENT</span> (No such file or directory)
openat(AT_FDCWD, <span class="st">"/opt/app/conf.yaml"</span>, O_RDONLY) = -1 <span class="er">EACCES</span> (Permission denied)
connect(3, {sa_family=AF_INET, sin_port=htons(<span class="nb">5432</span>), sin_addr=...}) = -1 <span class="er">ECONNREFUSED</span></code></pre>
<div class="tip">세 줄만 봐도 원인이 확정됩니다: <strong>경로가 다름 / 권한 없음 / DB 미기동</strong>.
로그가 “초기화 실패”만 말할 때, strace는 <em>정확한 파일명과 errno</em>를 줍니다.</div>`);

sl('Linux','strace 실전 패턴 모음', `
<h1><span class="no">5.7</span>strace 실전 패턴</h1>
<div class="tw"><table class="tbl">
<thead><tr><th>문제</th><th>명령</th><th>볼 것</th></tr></thead>

<tr><td>설정을 어디서 읽나</td><td><code>strace -f -e trace=openat ./app 2&gt;&amp;1 | rg -v ENOENT</code></td><td>성공한 open의 경로</td></tr>

<tr><td>시그널로 죽음</td><td><code>strace -f ./app</code></td><td><code>+++ killed by SIGKILL +++</code></td></tr>
<tr><td>메모리 요청 급증</td><td><code>strace -e trace=mmap,brk -c</code></td><td>호출 횟수·크기</td></tr>
</tbody>
</table></div>
<pre class="code sh"><code><span class="cm"># 행(hang) 진단 3종 세트 — 부착만 하면 됨</span>

$ cat /proc/1234/stack              <span class="cm"># 커널 스택 (root)</span>

sl('Linux','ltrace와 동적 링크 디버깅', `
<h1><span class="no">5.8</span>ltrace · 동적 링크 문제</h1>
<div class="cols">
<div>
<h3>ltrace — 라이브러리 호출 추적</h3>
<pre class="code sh"><code>$ ltrace ./app
$ ltrace -e malloc+free ./app
$ ltrace -c ./app          <span class="cm"># 호출 통계</span>
$ ltrace -S ./app          <span class="cm"># syscall도 함께</span></code></pre>
<div class="note">정적 링크·PLT 회피 바이너리에서는 잘 안 잡힙니다.
현대적 대안은 <code>ltrace</code>보다 <strong>uprobe/bpftrace</strong>입니다.</div>
</div>
<div>
<h3>동적 링크 문제 해결</h3>
<pre class="code sh"><code>$ ldd ./app                        <span class="cm"># 의존 라이브러리와 해석 결과</span>
        libfoo.so.1 =&gt; <span class="er">not found</span>
$ LD_DEBUG=libs ./app              <span class="cm"># 탐색 과정 전부</span>
$ LD_DEBUG=help ./app              <span class="cm"># 옵션: files,symbols,bindings,versions</span>
$ readelf -d ./app | rg <span class="st">'NEEDED|RPATH|RUNPATH'</span>
$ ldconfig -p | rg libfoo
$ LD_LIBRARY_PATH=/opt/lib ./app   <span class="cm"># 임시 해결</span>
$ patchelf --set-rpath <span class="st">'$ORIGIN/../lib'</span> ./app  <span class="cm"># 영구</span></code></pre>
</div>
</div>
<h3>LD_PRELOAD — 함수 가로채기(디버깅용 훅)</h3>
<pre class="code"><code><span class="cm">// hook.c: 모든 malloc을 로깅  →  gcc -shared -fPIC hook.c -o hook.so -ldl</span>
#define _GNU_SOURCE
#include &lt;dlfcn.h&gt;
#include &lt;stdio.h&gt;
<span class="kw">void</span>* malloc(size_t n){
  <span class="kw">static</span> <span class="kw">void</span>* (*real)(size_t);
  <span class="kw">if</span> (!real) real = dlsym(RTLD_NEXT, <span class="st">"malloc"</span>);
  <span class="kw">void</span>* p = real(n);
  <span class="kw">if</span> (n &gt; <span class="nb">1</span>&lt;&lt;<span class="nb">20</span>) fprintf(stderr, <span class="st">"BIG malloc %zu -&gt; %p\\n"</span>, n, p);
  <span class="kw">return</span> p;
}
<span class="cm">// 사용: LD_PRELOAD=./hook.so ./app</span></code></pre>
<div class="tip">LD_PRELOAD는 <strong>소스 없이 남의 바이너리를 계측</strong>할 수 있는 강력한 수단입니다.
시간 고정(<code>time()</code> 후킹), 네트워크 실패 주입, 파일 경로 리다이렉트 등에 씁니다.</div>`);

sl('Linux','valgrind memcheck', `
<h1><span class="no">5.9</span>valgrind memcheck</h1>
<pre class="code sh"><code>$ gcc -g -O0 app.c -o app
$ valgrind --leak-check=full --show-leak-kinds=all \\
           --track-origins=yes --num-callers=30 \\
           --log-file=vg.log ./app</code></pre>
<pre class="code"><code><span class="er">==1234== Invalid write of size 4</span>
==1234==    at 0x109189: fill (app.c:12)          <span class="cm">← 잘못 쓴 위치</span>
==1234==    by 0x1091C7: main (app.c:20)
==1234==  Address 0x4a4d0a0 is 0 bytes after a block of size 40 alloc'd
==1234==    at 0x484086F: malloc (vg_replace_malloc.c:381)
==1234==    by 0x109165: fill (app.c:10)          <span class="cm">← 할당한 위치</span>

<span class="er">==1234== Conditional jump depends on uninitialised value(s)</span>
==1234==    at 0x1091A3: check (app.c:15)
==1234==  Uninitialised value was created by a stack allocation
==1234==    at 0x109180: check (app.c:14)          <span class="cm">← --track-origins 덕분</span></code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>메시지</th><th>의미</th><th>전형적 원인</th></tr></thead>
<tbody>
<tr><td>Invalid read/write</td><td>범위 밖 접근</td><td>off-by-one, 해제 후 사용</td></tr>
<tr><td>Uninitialised value</td><td>초기화 안 된 값 사용</td><td>스택 변수, malloc 후 미초기화</td></tr>
<tr><td><strong>definitely lost</strong></td><td>포인터 완전 소실 = 진짜 누수</td><td>free 누락</td></tr>
<tr><td>indirectly lost</td><td>부모가 소실돼 딸려 감</td><td>부모만 고치면 해결</td></tr>
<tr><td>possibly lost</td><td>내부 포인터만 남음</td><td>대개 무시 가능(풀·정적)</td></tr>
<tr><td>still reachable</td><td>종료 시 미해제, 포인터는 있음</td><td>보통 문제 아님</td></tr>
<tr><td>Mismatched free</td><td><code>new</code>/<code>free</code> 짝 안 맞음</td><td>C++ 혼용</td></tr>
</tbody>
</table></div>
<div class="note"><strong>속도</strong>: 10~50배 느립니다. 그래서 “느리지만 재컴파일 불필요”가 필요할 때 valgrind,
“빠르지만 재컴파일 필요”면 ASan을 씁니다. <em>둘 다 쓸 수 있으면 ASan이 먼저</em>입니다.</div>`);

sl('Linux','valgrind — massif · callgrind · helgrind', `
<h1><span class="no">5.10</span>valgrind 도구 모음</h1>
<div class="cols">
<div>
<h3>massif — 힙 사용량 시계열</h3>
<pre class="code sh"><code>$ valgrind --tool=massif --time-unit=B ./app
$ ms_print massif.out.1234 | head -60
<span class="cm"># 피크 시점의 할당 트리를 보여줌 → 누수 아닌 "과다 보유" 진단</span></code></pre>

<pre class="code sh"><code>$ valgrind --tool=dhat ./app
<span class="cm"># "짧게 살고 죽는 큰 할당"(풀링 후보)</span>
<span class="cm"># "할당했지만 거의 안 읽는 메모리" 탐지</span></code></pre>

$ callgrind_annotate callgrind.out.1234 | head -40
$ kcachegrind callgrind.out.1234   <span class="cm"># GUI</span>
<span class="cm"># 결정론적 카운트 → 미세 최적화 비교에 유리</span></code></pre>
</div>
<div>
<h3>helgrind / DRD — 경합·락 오류</h3>
<pre class="code sh"><code>$ valgrind --tool=helgrind ./app
$ valgrind --tool=drd --check-stack-var=yes ./app</code></pre>
<pre class="code"><code>Possible data race during write of size 4 at 0x...
   at 0x1091: worker (app.c:22)
 This conflicts with a previous read
   at 0x1080: main (app.c:35)
 Lock at 0x... was held by thread #1</code></pre>

<strong>TSan(ThreadSanitizer)이 정확도·속도 모두 우수</strong>하므로 재컴파일 가능하면 TSan을 쓰세요.</div>
<div class="tip"><strong>suppression 파일</strong>로 서드파티 오탐을 눌러 두면 신호 대 잡음비가 올라갑니다.<br>

sl('Linux','AddressSanitizer (ASan)', `
<h1><span class="no">5.11</span>AddressSanitizer — 메모리 오류의 표준</h1>
<pre class="code sh"><code>$ gcc -fsanitize=address -fno-omit-frame-pointer -g -O1 app.c -o app
$ ./app</code></pre>
<pre class="code"><code><span class="er">==1234==ERROR: AddressSanitizer: heap-use-after-free on address 0x602000000010</span>
READ of size 4 at 0x602000000010 thread T0
    #0 0x4f8b in use_after app.c:18
    #1 0x4f2c in main app.c:27
<span class="ok">0x602000000010 is located 0 bytes inside of 8-byte region</span>
<span class="ok">freed by thread T0 here:</span>          <span class="cm">← 언제 해제됐는지</span>
    #0 0x4a3c in free
    #1 0x4f77 in use_after app.c:17
<span class="ok">previously allocated by thread T0 here:</span>  <span class="cm">← 언제 할당됐는지</span>
    #1 0x4f60 in use_after app.c:15
SUMMARY: AddressSanitizer: heap-use-after-free app.c:18 in use_after</code></pre>
<div class="cols">
<div><h3>잡는 것</h3>
<ul class="small">
<li>heap/stack/global <strong>buffer overflow</strong></li>
<li><strong>use-after-free</strong>, use-after-return, use-after-scope</li>
<li>double free, invalid free</li>
<li>메모리 누수(LSan 내장)</li>
</ul>
<div class="tip">ASan의 진짜 가치는 <strong>할당·해제 스택까지</strong> 알려준다는 것.
“누가 언제 해제했는가”가 즉시 나오므로 거리 4 버그가 거리 0이 됩니다.</div>
</div>
<div>
<h3>유용한 런타임 옵션</h3>
<pre class="code sh"><code>$ export ASAN_OPTIONS=<span class="st">"detect_leaks=1:abort_on_error=1:\\
strict_string_checks=1:detect_stack_use_after_return=1:\\
check_initialization_order=1:log_path=/tmp/asan"</span>
$ export ASAN_SYMBOLIZER_PATH=$(which llvm-symbolizer)
<span class="cm"># 크래시 시 코어까지: abort_on_error=1 + ulimit -c unlimited</span>
<span class="cm"># gdb와 함께: break __asan_report_error</span></code></pre>
<div class="note"><strong>비용</strong>: 속도 약 2배, 메모리 약 3배. CI의 테스트 잡 하나를
ASan 빌드로 돌리는 것은 거의 항상 이득입니다.</div>
</div>
</div>`);

sl('Linux','UBSan · MSan · LSan', `
<h1><span class="no">5.12</span>UBSan · MSan · LSan</h1>
<div class="cols">
<div>
<h3>UBSan — 정의되지 않은 동작</h3>
<pre class="code sh"><code>$ gcc -fsanitize=undefined -fno-sanitize-recover=all -g app.c
<span class="cm"># 개별 체크</span>
-fsanitize=signed-integer-overflow,shift,null,bounds,alignment,
           float-cast-overflow,return,vla-bound,object-size</code></pre>
<pre class="code"><code>app.c:12:11: runtime error: signed integer overflow:
             2147483647 + 1 cannot be represented in type <span class="st">'int'</span>
app.c:20:5: runtime error: load of misaligned address 0x... for type <span class="st">'int'</span>
app.c:31:9: runtime error: index 10 out of bounds for type <span class="st">'int [10]'</span></code></pre>
<div class="tip">“<code>-O2</code>에서만 이상하다”의 정답이 대부분 여기서 나옵니다.
<strong>거의 공짜(오버헤드 20% 내외)</strong>이므로 개발 빌드에 상시 켜둘 만합니다.</div>
</div>
<div>
<h3>MSan — 초기화되지 않은 메모리</h3>
<pre class="code sh"><code>$ clang -fsanitize=memory -fno-omit-frame-pointer \\
        -fsanitize-memory-track-origins=2 -g app.c</code></pre>
<div class="note">MSan은 <strong>모든 의존 라이브러리도 MSan으로 빌드</strong>해야 오탐이 없습니다(libc++ 포함).
장벽이 높지만, valgrind보다 훨씬 빠르고 정확합니다.</div>
<h3>LSan — 누수 전용</h3>
<pre class="code sh"><code>$ clang -fsanitize=leak -g app.c     <span class="cm"># 단독</span>
$ ASAN_OPTIONS=detect_leaks=1 ./app  <span class="cm"># ASan에 포함</span>
$ LSAN_OPTIONS=suppressions=lsan.supp ./app</code></pre>
<div class="danger"><strong>조합 규칙</strong>: ASan+UBSan은 함께 가능,
<strong>ASan과 TSan/MSan은 동시 사용 불가</strong>(주소 공간 관리가 충돌). 빌드를 분리하세요.</div>
</div>
</div>`);

sl('Linux','ThreadSanitizer (TSan)', `
<h1><span class="no">5.13</span>ThreadSanitizer — 데이터 레이스 검출</h1>
<pre class="code sh"><code>$ gcc -fsanitize=thread -g -O1 app.c -o app -lpthread
$ TSAN_OPTIONS=<span class="st">"halt_on_error=1:history_size=7"</span> ./app</code></pre>
<pre class="code"><code><span class="er">WARNING: ThreadSanitizer: data race (pid=1234)</span>
  Write of size 4 at 0x55a3f0 by thread T2:
    #0 worker app.c:22
  Previous read of size 4 at 0x55a3f0 by main thread:
    #0 main app.c:35
  Location is global <span class="st">'counter'</span> of size 4 at 0x55a3f0
  Thread T2 (running) created by main thread at:
    #0 pthread_create
    #1 main app.c:30</code></pre>
<div class="fx big">TSan의 결정적 장점: <strong>실제로 충돌이 일어나지 않아도</strong>
“동기화 없이 같은 주소에 접근했다”는 <em>규칙 위반</em>을 검출합니다.
→ 100만 번에 한 번 나는 레이스를 <strong>1회 실행</strong>으로 잡습니다.</div>
<div class="cols">
<div>
<h3>지원</h3>
<div class="tw"><table class="tbl">
<thead><tr><th>언어</th><th>사용법</th></tr></thead>
<tbody>
<tr><td>C/C++</td><td><code>-fsanitize=thread</code> (gcc/clang)</td></tr>
<tr><td>Go</td><td><code>go test -race</code>, <code>go build -race</code> ← <strong>표준 장비</strong></td></tr>
<tr><td>Rust</td><td><code>RUSTFLAGS="-Zsanitizer=thread"</code> (nightly)</td></tr>
</tbody></table></div>
</div>
<div>
<div class="note"><strong>주의</strong>
<ul>
<li>메모리 5~10배, 속도 5~15배</li>
<li>모든 코드가 TSan 빌드여야 정확(미계측 라이브러리는 오탐/누락)</li>
<li>커스텀 동기화(인라인 어셈, 락프리)는 <code>__tsan_acquire/release</code> 애노테이션 필요</li>
</ul></div>
<div class="tip">CI에 <code>-race</code> 잡 하나만 추가해도 Go 프로젝트의 동시성 버그 대부분이 조기에 잡힙니다.
비용 대비 효과가 가장 큰 투자 중 하나입니다.</div>
</div>
</div>`);

sl('Linux','perf — CPU 프로파일링', `
<h1><span class="no">5.14</span>perf — “어디서 시간이 가는가”</h1>
<pre class="code sh"><code><span class="cm"># 1) 전체 지표 한 눈에</span>
$ perf stat -d ./app
  12,345,678,901  cycles       #  3.201 GHz
   8,901,234,567  instructions #  0.72  insn per cycle   ← IPC 낮으면 stall
      45,678,901  cache-misses # 23.4% of all cache refs ← 메모리 병목 신호
      12,345,678  branch-misses#  5.1%                   ← 분기 예측 실패

<span class="cm"># 2) 샘플링 프로파일</span>
$ perf record -F 999 -g --call-graph dwarf ./app
$ perf report --stdio --sort=overhead,symbol | head -40
$ perf report            <span class="cm"># 대화형 TUI (엔터로 콜그래프 펼치기)</span>

<span class="cm"># 3) 실행 중 프로세스</span>
$ perf top -p 1234
$ perf record -g -p 1234 -- sleep 30

<span class="cm"># 4) 특정 이벤트</span>
$ perf record -e cache-misses -g ./app
$ perf record -e <span class="st">'syscalls:sys_enter_openat'</span> -a -- sleep 5
$ perf list | head -50    <span class="cm"># 사용 가능한 이벤트</span>

<span class="cm"># 5) 권한</span>
$ sudo sysctl -w kernel.perf_event_paranoid=1
$ sudo sysctl -w kernel.kptr_restrict=0</code></pre>
<div class="cols">
<div><div class="tip"><strong>빌드 요구</strong>: <code>-fno-omit-frame-pointer</code>가 없으면 콜그래프가 엉망이 됩니다.
없다면 <code>--call-graph dwarf</code>(느리지만 정확) 또는 <code>lbr</code>(인텔).</div></div>
<div><div class="note"><strong>IPC 해석</strong>: IPC &lt; 1.0이면 CPU가 놀고 있다는 뜻 —
캐시 미스·분기 예측 실패·의존성 체인을 의심. IPC &gt; 2.0인데 느리면 <em>알고리즘</em> 문제입니다.</div></div>
</div>`);

sl('Linux','플레임그래프 만들기', `
<h1><span class="no">5.15</span>플레임그래프 — 한 장으로 보는 CPU</h1>
<pre class="code sh"><code>$ git clone https://github.com/brendangregg/FlameGraph
$ perf record -F 999 -g --call-graph dwarf -p 1234 -- sleep 30
$ perf script | ./FlameGraph/stackcollapse-perf.pl \\
              | ./FlameGraph/flamegraph.pl &gt; cpu.svg
$ xdg-open cpu.svg     <span class="cm"># 브라우저에서 클릭해 확대 가능</span>

<span class="cm"># 요즘은 한 줄로도 가능</span>
$ perf script report flamegraph -F 999 -g -p 1234 -- sleep 30</code></pre>
<div class="cols">
<div>
<h3>읽는 법</h3>
<ul>
<li><strong>x축은 시간이 아니라 샘플 비율</strong>(알파벳 순 정렬)</li>
<li>y축은 스택 깊이 — 아래가 호출자, 위가 피호출자</li>
<li><strong>넓은 평평한 봉우리</strong> = 그 함수 자체가 CPU를 씀 → 최적화 표적</li>
<li>넓지만 뾰족하게 갈라짐 = 하위 호출로 분산</li>
</ul>
</div>
<div>
<h3>변형</h3>
<div class="tw"><table class="tbl">
<thead><tr><th>종류</th><th>보는 것</th></tr></thead>
<tbody>
<tr><td>On-CPU</td><td>CPU를 쓰는 코드 (기본)</td></tr>
<tr><td><strong>Off-CPU</strong></td><td>대기(I/O·락)에 쓴 시간 — “CPU는 노는데 느림”의 정답</td></tr>
<tr><td>Differential</td><td>두 프로파일의 차이 — 회귀 원인 특정</td></tr>
<tr><td>Memory/alloc</td><td>할당 스택 (heaptrack, bpftrace)</td></tr>
</tbody></table></div>
<pre class="code sh"><code><span class="cm"># Off-CPU (bpftrace)</span>
$ sudo offcputime-bpfcc -p 1234 30 | ./flamegraph.pl &gt; off.svg</code></pre>
</div>
</div>
<div class="fx">“느리다”는 신고를 받으면 <strong>on-CPU와 off-CPU 두 장</strong>을 먼저 뽑으세요.
둘 중 어디가 넓은지에 따라 이후 조사 방향이 완전히 갈립니다.</div>`);

sl('Linux','bpftrace — 커널까지 보는 일회용 계측', `
<h1><span class="no">5.16</span>bpftrace — 원라이너 계측</h1>
<pre class="code sh"><code><span class="cm"># 어떤 프로세스가 파일을 여는가</span>
$ sudo bpftrace -e <span class="st">'tracepoint:syscalls:sys_enter_openat {
    printf("%s %s\\n", comm, str(args-&gt;filename)); }'</span>

<span class="cm"># 프로세스별 syscall 횟수</span>
$ sudo bpftrace -e <span class="st">'tracepoint:raw_syscalls:sys_enter { @[comm] = count(); }'</span>

<span class="cm"># read() 지연 히스토그램 (µs)</span>
$ sudo bpftrace -e <span class="st">'
  tracepoint:syscalls:sys_enter_read /pid == 1234/ { @s[tid] = nsecs; }
  tracepoint:syscalls:sys_exit_read /@s[tid]/ {
    @us = hist((nsecs - @s[tid]) / 1000); delete(@s[tid]); }'</span>

<span class="cm"># 특정 함수 호출자 스택 (uprobe — 소스 수정 불필요!)</span>
$ sudo bpftrace -e <span class="st">'uprobe:/opt/app/app:process_order {
    printf("id=%d\\n", arg0); @[ustack] = count(); }'</span>

<span class="cm"># TCP 재전송 감시</span>
$ sudo bpftrace -e <span class="st">'kprobe:tcp_retransmit_skb { @[comm] = count(); }'</span>

<span class="cm"># 페이지 폴트 상위</span>
$ sudo bpftrace -e <span class="st">'software:page-faults:1 { @[comm] = count(); }'</span></code></pre>
<div class="cols">
<div><div class="tip"><strong>BCC 도구 모음</strong>도 함께 알아두세요:
<code>execsnoop</code>(새 프로세스), <code>opensnoop</code>(파일 열기), <code>biolatency</code>(디스크 지연),
<code>tcpconnect</code>, <code>profile</code>, <code>offcputime</code>, <code>funclatency</code>, <code>memleak</code>.
<em>대부분의 궁금증에 이미 전용 도구가 있습니다.</em></div></div>
<div><div class="note"><strong>왜 강력한가</strong>: 재컴파일·재시작 없이 <em>운영 중인 프로세스</em>를
낮은 오버헤드로 계측합니다. strace가 부담스러운 프로덕션에서 사실상 유일한 선택지입니다.
커널 4.9+ / root 권한 필요.</div></div>
</div>`);

sl('Linux','rr — 역방향 디버깅 실전', `
<h1><span class="no">5.17</span>rr — 시간을 되감는 디버깅</h1>
<pre class="code sh"><code>$ sudo sysctl -w kernel.perf_event_paranoid=1
$ rr record ./app --input bad.json
$ rr replay                       <span class="cm"># 가장 최근 기록</span>
$ rr replay ~/.local/share/rr/app-3

(rr) c                            <span class="cm"># 크래시까지 실행</span>
Program received signal SIGSEGV
(rr) p node-&gt;next                 <span class="cm"># 0xdeadbeef — 오염됨</span>
(rr) watch -l node-&gt;next          <span class="cm"># 이 위치를 감시</span>
(rr) <span class="kw">reverse-continue</span>            <span class="cm"># ★ 거꾸로 실행 → 값을 바꾼 순간에 정지</span>
Hardware watchpoint 2: -location node-&gt;next
Old value = 0x5555557
New value = 0xdeadbeef
free_node (n=0x555555) at list.c:88
(rr) bt                           <span class="cm"># 범인의 스택!</span>
(rr) reverse-step / reverse-finish / reverse-next</code></pre>
<div class="cols">
<div><h3>rr이 해결하는 것</h3>
<ul>
<li><strong>비결정성 제거</strong> — 스레드 스케줄까지 기록·재현</li>
<li><strong>인과 역추적</strong> — “언제 이 값이 오염됐나”에 정확한 답</li>
<li><strong>무한 재시도</strong> — 지나쳐도 되감기만 하면 됨</li>
</ul>
<pre class="code sh"><code>$ rr record -n ./app          <span class="cm"># 시스템콜 버퍼링 끄기(정밀)</span>
$ rr record --chaos ./app     <span class="cm"># 스케줄 무작위화로 레이스 유도</span>
$ rr pack &amp;&amp; tar czf trace.tgz ~/.local/share/rr/app-3  <span class="cm"># 동료에게 전달</span></code></pre>
</div>
<div>
<div class="note"><strong>제약</strong>
<ul>
<li>x86/x86-64 위주(ARM 지원 제한적), Intel/AMD PMU 필요</li>
<li>가상화 환경·컨테이너에서 PMU 접근이 막힐 수 있음</li>
<li>단일 코어로 직렬화해 기록 → 실행이 1.2~2배 느림</li>
<li>GPU·특수 디바이스 사용 프로그램은 어려움</li>
</ul></div>
<div class="fx">한 번이라도 재현했다면 <strong>즉시 <code>rr record</code>로 다시 잡아두세요</strong>.
그 트레이스 하나가 이후 모든 조사의 자산이 됩니다.</div>
</div>
</div>`);

sl('Linux','/proc — 프로세스 내부 들여다보기', `
<h1><span class="no">5.18</span>/proc — 재컴파일 없는 관찰창</h1>
<pre class="code sh"><code>$ PID=$(pgrep -f myapp)
$ ls -l /proc/$PID/exe            <span class="cm"># 실행 중인 바이너리의 실제 경로</span>
$ ls -l /proc/$PID/cwd            <span class="cm"># 작업 디렉터리 (상대 경로 문제!)</span>
$ tr <span class="st">'\\0'</span> <span class="st">'\\n'</span> &lt; /proc/$PID/cmdline   <span class="cm"># 실제 인자</span>
$ tr <span class="st">'\\0'</span> <span class="st">'\\n'</span> &lt; /proc/$PID/environ   <span class="cm"># 실제 환경변수</span>
$ cat /proc/$PID/status           <span class="cm"># State/Threads/VmRSS/VmSwap/FDSize</span>
$ cat /proc/$PID/limits           <span class="cm"># ulimit 실제 적용값</span>
$ ls /proc/$PID/fd | wc -l        <span class="cm"># 열린 FD 수 (누수 확인)</span>
$ ls -l /proc/$PID/fd | tail -20  <span class="cm"># 무엇을 열고 있나</span>
$ cat /proc/$PID/stack            <span class="cm"># 커널 스택 (root)</span>
$ cat /proc/$PID/wchan; echo      <span class="cm"># 대기 중인 커널 함수</span>
$ cat /proc/$PID/maps             <span class="cm"># 메모리 맵(어떤 라이브러리가 어디에)</span>
$ cat /proc/$PID/smaps_rollup     <span class="cm"># RSS/PSS 요약</span>
$ cat /proc/$PID/io               <span class="cm"># 읽기/쓰기 바이트</span>
$ cat /proc/$PID/task/*/stat | wc -l   <span class="cm"># 스레드 수</span></code></pre>
<div class="cols">
<div><div class="tip"><strong>“설정을 못 읽어요” 3단 확인</strong>
<ol><li><code>/proc/PID/cwd</code> — 상대 경로의 기준이 예상과 다른가?</li>
<li><code>/proc/PID/environ</code> — 환경변수가 실제로 전달됐나?</li>
<li><code>strace -e openat</code> — 어떤 경로를 시도했나?</li></ol></div></div>
<div><div class="note"><strong>메모리 오해 주의</strong>: <code>VmRSS</code>는 공유 페이지를 포함하므로
프로세스 합계가 물리 메모리를 초과할 수 있습니다. 정확한 비교에는 <strong>PSS</strong>(<code>smaps_rollup</code>)를 쓰세요.</div></div>
</div>`);

sl('Linux','파일·FD·잠금 문제', `
<h1><span class="no">5.19</span>파일 · FD · 잠금</h1>
<pre class="code sh"><code><span class="cm"># 누가 이 파일을 열고 있나 (삭제/교체 불가 원인)</span>
$ lsof /var/log/app.log
$ fuser -v /var/lib/app/db.sqlite

<span class="cm"># 어떤 프로세스가 포트를 점유하나</span>
$ ss -tanp | rg <span class="st">':8080'</span>
$ lsof -i :8080

<span class="cm"># FD 누수 추적</span>
$ ls /proc/$PID/fd | wc -l          <span class="cm"># 주기적으로 관찰 → 단조 증가?</span>
$ lsof -p $PID | awk <span class="st">'{print $5}'</span> | sort | uniq -c | sort -rn
$ cat /proc/$PID/limits | rg <span class="st">'open files'</span>
$ sysctl fs.file-nr                 <span class="cm"># 시스템 전체</span>

<span class="cm"># 삭제됐지만 열려 있어 디스크를 먹는 파일 (df와 du가 다를 때!)</span>
$ lsof +L1
$ lsof -nP | rg <span class="st">'deleted'</span>

<span class="cm"># 디스크 사용량 추적</span>
$ df -h; du -x -d1 /var | sort -h | tail
$ df -i                             <span class="cm"># inode 고갈(파일 수 초과)</span></code></pre>
<div class="danger"><strong>“디스크가 100%인데 du로는 안 보인다”</strong>의 정답은 거의 항상
<em>삭제됐지만 열린 채로 남은 로그 파일</em>입니다. <code>lsof +L1</code>로 찾고,
해당 프로세스를 재시작하거나 <code>truncate -s0 /proc/PID/fd/N</code>으로 회수합니다.</div>
<div class="tip"><strong>EMFILE(Too many open files)</strong>이 보이면 코드의 누수 또는 ulimit 부족입니다.
<code>ls /proc/PID/fd</code>를 1분 간격으로 세어 증가 여부를 먼저 확인하세요.</div>`);

sl('Linux','네트워크 디버깅', `
<h1><span class="no">5.20</span>네트워크 디버깅</h1>
<pre class="code sh"><code><span class="cm"># 연결 상태 (netstat 대체)</span>
$ ss -tanp                     <span class="cm"># TCP 전체 + 프로세스</span>
$ ss -s                        <span class="cm"># 요약 (TIME-WAIT 폭증 확인)</span>
$ ss -tan state time-wait | wc -l
$ ss -lntp                     <span class="cm"># 리슨 중인 포트</span>
$ ss -ti dst 10.0.0.5          <span class="cm"># RTT·재전송·cwnd 등 상세</span>

<span class="cm"># 패킷 캡처</span>
$ sudo tcpdump -i any -nn <span class="st">'tcp port 5432'</span> -c 100 -w db.pcap
$ sudo tcpdump -i any -nn -A <span class="st">'tcp port 80 and host 10.0.0.5'</span>
$ sudo tcpdump -nn <span class="st">'tcp[tcpflags] &amp; (tcp-rst) != 0'</span>   <span class="cm"># RST만</span>
$ tshark -r db.pcap -q -z conv,tcp                     <span class="cm"># 대화 요약</span>

<span class="cm"># HTTP 진단</span>
$ curl -v --trace-time -o /dev/null -s -w \\
   <span class="st">'dns=%{time_namelookup} conn=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\\n'</span> \\
   https://api.example.com/health

<span class="cm"># DNS</span>
$ dig +trace api.example.com
$ getent hosts api.example.com    <span class="cm"># nsswitch 경로(앱과 동일)</span></code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>증상</th><th>의미</th></tr></thead>
<tbody>
<tr><td>연결 즉시 <code>ECONNREFUSED</code></td><td>서버 미기동 / 포트 불일치 (방화벽 아님)</td></tr>
<tr><td>연결이 <strong>타임아웃</strong></td><td>방화벽 DROP / 라우팅 / SG 규칙</td></tr>
<tr><td>연결 후 RST</td><td>LB·프록시 idle timeout, keep-alive 재사용 충돌</td></tr>
<tr><td>TIME-WAIT 폭증</td><td>연결 재사용 안 함 → 커넥션 풀 도입</td></tr>
<tr><td>간헐적 지연 100ms 단위</td><td>Nagle+delayed ACK, 재전송(RTO)</td></tr>
</tbody>
</table></div>`);

sl('Linux','시스템 리소스 진단', `
<h1><span class="no">5.21</span>시스템 리소스 — 60초 체크리스트</h1>
<pre class="code sh"><code>$ uptime                 <span class="cm"># load average: 1/5/15분. 코어 수와 비교</span>
$ dmesg -T | tail -30    <span class="cm"># OOM·하드웨어·드라이버 오류</span>
$ vmstat 1 5             <span class="cm"># r(실행대기) b(블록) si/so(스왑) us/sy/id/wa</span>
$ mpstat -P ALL 1 3      <span class="cm"># 코어별 — 한 코어만 100%면 단일스레드 병목</span>
$ pidstat -u -r -d 1 5   <span class="cm"># 프로세스별 CPU/메모리/디스크</span>
$ iostat -xz 1 3         <span class="cm"># %util, await — 디스크 포화</span>
$ free -m                <span class="cm"># available 이 핵심 (free 아님)</span>
$ sar -n DEV 1 3         <span class="cm"># 네트워크 처리량</span>
$ top -H -p $PID         <span class="cm"># 스레드별 CPU</span></code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>지표</th><th>이상 신호</th><th>다음 조사</th></tr></thead>
<tbody>
<tr><td><code>wa</code> (iowait) 높음</td><td>디스크/네트워크 대기</td><td><code>iostat -xz</code>, off-CPU 프로파일</td></tr>
<tr><td><code>sy</code> (system) 높음</td><td>syscall 과다·컨텍스트 스위치</td><td><code>strace -c</code>, <code>vmstat cs</code></td></tr>
<tr><td><code>si/so</code> 있음</td><td>스와핑 — 성능 붕괴</td><td>메모리 증설·누수 조사</td></tr>
<tr><td>load ≫ 코어 수</td><td>과부하 또는 D상태 프로세스</td><td><code>ps -eo state,comm | rg '^D'</code></td></tr>
<tr><td><code>%util</code> 100%</td><td>디스크 포화</td><td><code>biolatency</code>, 쿼리 최적화</td></tr>
<tr><td>한 코어만 100%</td><td>단일 스레드 병목·스핀락</td><td><code>perf top -t TID</code></td></tr>
</tbody>
</table></div>
<div class="tip">Brendan Gregg의 <em>USE 방법론</em>: 모든 리소스에 대해
<strong>Utilization(사용률) · Saturation(포화) · Errors(오류)</strong> 세 가지를 확인.
빠짐없이 훑는 체크리스트로 쓰기 좋습니다.</div>`);

sl('Linux','메모리 문제 — OOM과 누수', `
<h1><span class="no">5.22</span>메모리 — OOM killer와 누수</h1>
<pre class="code sh"><code><span class="cm"># 프로세스가 흔적 없이 사라졌다 → 가장 먼저 볼 곳</span>
$ dmesg -T | rg -i <span class="st">'killed process|out of memory|oom'</span>
$ journalctl -k --since <span class="st">"1 hour ago"</span> | rg -i oom
[Wed Jul 30 12:03:11] Out of memory: Killed process 4821 (myapp)
  total-vm:8388608kB, anon-rss:7340032kB, file-rss:0kB, oom_score_adj:0

<span class="cm"># cgroup(v2) 한도 — 컨테이너에서 특히 중요</span>
$ cat /sys/fs/cgroup/memory.max
$ cat /sys/fs/cgroup/memory.current
$ cat /sys/fs/cgroup/memory.events      <span class="cm"># oom_kill 카운터</span>

<span class="cm"># 어디서 메모리를 쓰나</span>
$ pmap -x $PID | sort -k3 -n | tail -20
$ cat /proc/$PID/smaps_rollup
$ ps -eo pid,rss,comm --sort=-rss | head</code></pre>
<div class="cols">
<div><h3>누수 추적 도구</h3>
<ul>
<li><strong>heaptrack</strong> — <code>heaptrack ./app</code> + GUI, 오버헤드 낮고 정확</li>
<li><strong>valgrind massif</strong> — 피크 시점 할당 트리</li>
<li><strong>ASan/LSan</strong> — 종료 시 미해제 스택</li>
<li><strong>bpftrace memleak</strong> — 운영 중 프로세스</li>
<li><strong>jemalloc/tcmalloc 프로파일러</strong> — <code>MALLOC_CONF=prof:true</code></li>
</ul></div>
<div><div class="note"><strong>“누수 아닌 누수”</strong>
<ul>
<li>메모리 <em>단편화</em> — 해제했지만 OS에 반환 안 됨</li>
<li>할당자 캐시(<code>malloc_trim(0)</code>으로 확인)</li>
<li>캐시·풀의 무한 성장 = 설계 문제</li>
<li>스레드마다 스택 8MB × 수천 개</li>
</ul>
RSS 증가가 곧 누수는 아닙니다. <strong>할당 스택 프로파일</strong>로 확인하세요.</div></div>
</div>`);

sl('Linux','systemd 서비스 디버깅', `

<pre class="code sh"><code>$ systemctl status myapp -l --no-pager

<div class="tw"><table class="tbl">

</table></div>

sl('Linux','바이너리 분석 도구', `
<h1><span class="no">5.25</span>바이너리 분석 — nm · objdump · readelf</h1>
<pre class="code sh"><code><span class="cm"># 이 바이너리는 무엇인가</span>
$ file ./app
$ readelf -h ./app                 <span class="cm"># 아키텍처·타입(EXEC/DYN)·엔트리</span>

<span class="cm"># 심볼</span>
$ nm -C --defined-only ./app | head
$ nm -C -u ./app                   <span class="cm"># undefined = 외부에서 필요한 심볼</span>
$ nm -C libfoo.so | rg <span class="st">'T .*Order'</span>   <span class="cm"># T=전역 텍스트</span>

<span class="cm"># “undefined reference” 링크 오류 해결</span>
$ nm -C -u main.o                  <span class="cm"># 무엇을 요구하는가</span>
$ nm -C libfoo.a | rg <span class="st">'process_order'</span>  <span class="cm"># 라이브러리가 제공하는가</span>
<span class="cm"># → C++이면 이름 맹글링 불일치(extern "C" 누락) 의심</span>

<span class="cm"># 디스어셈블</span>
$ objdump -d -C -S --no-show-raw-insn ./app | less   <span class="cm"># 소스 섞어서</span>
$ objdump -T libfoo.so | rg version                  <span class="cm"># 심볼 버전</span>
$ objdump -s -j .rodata ./app | head                 <span class="cm"># 문자열 상수</span>
$ strings -n 8 ./app | rg -i <span class="st">'password|key|http'</span>

<span class="cm"># 주소 → 소스 위치 (스택에 ??만 보일 때)</span>
$ addr2line -e ./app -f -C -i 0x401136
$ eu-stack -p $PID                 <span class="cm"># elfutils: 실행 중 스택 덤프</span></code></pre>
<div class="note"><strong>GLIBC 버전 오류</strong>(<code>version 'GLIBC_2.34' not found</code>)는

sl('Linux','시그널 카탈로그', `
<h1><span class="no">5.26</span>시그널 — 프로세스는 왜 죽었나</h1>
<div class="tw"><table class="tbl">
<thead><tr><th>시그널</th><th>번호</th><th>의미</th><th>전형적 원인</th></tr></thead>
<tbody>
<tr><td><strong>SIGSEGV</strong></td><td>11</td><td>잘못된 메모리 접근</td><td>널 포인터, 해제 후 사용, 스택 오버플로</td></tr>
<tr><td><strong>SIGABRT</strong></td><td>6</td><td><code>abort()</code></td><td>assert 실패, glibc 힙 손상 탐지, C++ 미포착 예외</td></tr>
<tr><td>SIGBUS</td><td>7</td><td>정렬·매핑 오류</td><td>비정렬 접근, mmap 파일 축소</td></tr>
<tr><td>SIGFPE</td><td>8</td><td>산술 오류</td><td>정수 0 나눗셈, INT_MIN / -1</td></tr>
<tr><td>SIGILL</td><td>4</td><td>잘못된 명령</td><td>CPU 미지원 명령(AVX-512), 손상된 코드</td></tr>
<tr><td><strong>SIGKILL</strong></td><td>9</td><td>강제 종료(포착 불가)</td><td><strong>OOM killer</strong>, <code>kill -9</code></td></tr>
<tr><td>SIGTERM</td><td>15</td><td>정상 종료 요청</td><td>systemd stop, 오케스트레이터</td></tr>
<tr><td>SIGPIPE</td><td>13</td><td>닫힌 파이프에 쓰기</td><td><code>| head</code>, 클라이언트 조기 종료</td></tr>
<tr><td>SIGTRAP</td><td>5</td><td>브레이크포인트</td><td>디버거, <code>__builtin_trap</code></td></tr>
<tr><td>SIGXCPU/XFSZ</td><td>24/25</td><td>한도 초과</td><td>ulimit CPU·파일 크기</td></tr>
</tbody>
</table></div>
<pre class="code sh"><code><span class="cm"># 종료 코드로 역추적</span>

$ dmesg -T | rg -i <span class="st">'segfault|general protection'</span>
[  123.456] app[4821]: segfault at 0 ip 0000555555555191 sp 00007fff...
             error 4 in app[555555555000+1000]</code></pre>

sl('Linux','권한 문제 — 퍼미션에서 SELinux까지', `
<h1><span class="no">5.28</span>권한 문제 진단 순서</h1>
<ol>
<li><strong>실행 주체 확인</strong> — <code>ps -eo pid,user,comm | rg myapp</code>, systemd면 <code>User=</code></li>
<li><strong>대상 퍼미션</strong> — <code>ls -l</code>, <strong>상위 디렉터리 전부의 x 비트</strong>(가장 흔한 함정)</li>
<li><strong>실제 시도 확인</strong> — <code>strace -f -e trace=file</code>로 EACCES 발생 경로 특정</li>
<li><strong>ACL</strong> — <code>getfacl /path</code></li>
<li><strong>MAC</strong> — SELinux/AppArmor</li>
<li><strong>capability</strong> — <code>getcap</code>, 컨테이너 <code>--cap-add</code></li>
</ol>
<pre class="code sh"><code><span class="cm"># 상위 디렉터리 권한 한 번에 보기 (x 비트 누락 탐지)</span>
$ namei -l /var/lib/app/data/db.sqlite

<span class="cm"># 특정 사용자로 접근 테스트</span>
$ sudo -u appuser -- test -r /etc/app/conf.yaml &amp;&amp; echo OK || echo DENIED
$ sudo -u appuser ls -l /var/lib/app

<span class="cm"># SELinux</span>
$ getenforce                       <span class="cm"># Enforcing / Permissive</span>
$ sudo ausearch -m AVC -ts recent  <span class="cm"># 거부 로그</span>
$ sudo sealert -a /var/log/audit/audit.log    <span class="cm"># 사람이 읽을 설명 + 해결책</span>
$ ls -Z /var/lib/app               <span class="cm"># 컨텍스트 확인</span>
$ sudo restorecon -Rv /var/lib/app
$ sudo setenforce 0                <span class="cm"># 임시 확인용(원인 확정 후 되돌릴 것)</span>

<span class="cm"># AppArmor</span>
$ sudo aa-status
$ sudo journalctl -k | rg -i apparmor.*DENIED</code></pre>
<div class="tip"><strong>결정적 실험</strong>: <code>setenforce 0</code>으로 증상이 사라지면 SELinux가 원인.

sl('Linux','셸 스크립트 디버깅', `
<h1><span class="no">5.30</span>셸 스크립트 디버깅</h1>
<pre class="code sh"><code><span class="cm">#!/usr/bin/env bash</span>
set -euo pipefail          <span class="cm"># 에러 즉시 종료·미정의 변수 오류·파이프 실패 전파</span>
IFS=$<span class="st">'\\n\\t'</span>              <span class="cm"># 공백 포함 파일명 안전</span>
trap <span class="st">'echo "ERR line $LINENO: $BASH_COMMAND" &gt;&amp;2'</span> ERR

<span class="cm"># 실행 추적</span>
$ bash -x script.sh                    <span class="cm"># 각 명령 출력</span>
$ bash -n script.sh                    <span class="cm"># 문법만 검사</span>

<span class="cm"># 스크립트 일부만 추적</span>
set -x; risky_part; set +x

<span class="cm"># 정적 분석 (필수)</span>
$ shellcheck script.sh</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>함정</th><th>증상</th><th>해결</th></tr></thead>
<tbody>

<tr><td>파이프의 종료 코드</td><td><code>a | b</code>는 b의 코드만</td><td><code>set -o pipefail</code>, <code>PIPESTATUS</code></td></tr>
<tr><td>서브셸 변수</td><td><code>while read</code> 안 변경이 사라짐</td><td>프로세스 치환 <code>&lt; &lt;(cmd)</code></td></tr>
<tr><td>cron에서만 실패</td><td>PATH·환경이 다름</td><td>절대 경로, <code>env</code>를 로그로 남기기</td></tr>

<tr><td><code>[ ]</code> vs <code>[[ ]]</code></td><td>빈 문자열에서 문법 오류</td><td>bash면 <code>[[ ]]</code></td></tr>
</tbody>
</table></div>

sl('Linux','실전 케이스 — “가끔 502”', `
<h1><span class="no">5.31</span>실전 — “가끔 502가 납니다” (Linux)</h1>
<div class="loop">
  <div class="stp on"><b>👁️</b><div class="t">관찰</div><div class="d">nginx 502, 0.5%</div></div>
  <div class="stp"><b>💡</b><div class="t">가설</div><div class="d">업스트림 조기 종료?</div></div>
  <div class="stp"><b>🧪</b><div class="t">실험</div><div class="d">tcpdump·로그 대조</div></div>
  <div class="stp"><b>📍</b><div class="t">국소화</div><div class="d">keep-alive 경합</div></div>
</div>
<pre class="code sh"><code><span class="cm"># ① nginx 에러 로그의 정확한 문구 (추측 금지)</span>
$ rg <span class="st">'upstream'</span> /var/log/nginx/error.log | tail -5
upstream prematurely closed connection <span class="kw">while</span> reading response header

<span class="cm"># ② 앱 쪽에는 에러가 없다 → 앱이 정상 종료시킨 연결</span>
$ jq -r <span class="st">'select(.status &gt;= 500)'</span> /var/log/app.json | wc -l   <span class="cm"># 0</span>

<span class="cm"># ③ 커넥션 수명 관찰</span>
$ sudo tcpdump -i lo -nn <span class="st">'tcp port 8080 and (tcp[tcpflags] &amp; tcp-fin != 0)'</span> -c 20
<span class="cm"># FIN이 앱→nginx 방향에서 대량 관측</span>

<span class="cm"># ④ 설정 비교 — 결정적 증거</span>
$ rg -i <span class="st">'keepalive'</span> /etc/nginx/nginx.conf     <span class="cm"># keepalive_timeout 75s</span>
$ rg -i <span class="st">'idle|keep'</span> /etc/app/server.yaml       <span class="cm"># idleTimeout: 5s  ← 짧다!</span></code></pre>
<div class="fx"><strong>원인</strong>: 업스트림(앱)의 idle timeout 5초 &lt; nginx keep-alive 75초.
nginx가 재사용하려는 순간 앱이 연결을 닫아 <em>경합</em> 발생 → 502.<br>
<strong>수정</strong>: 앱 idle timeout을 nginx보다 <em>길게</em>(예: 120s) 설정. 일반 규칙: <em>다운스트림 &lt; 업스트림</em>.</div>
<div class="tip">교훈: “가끔 실패”이면서 <strong>양쪽 로그에 에러가 없을 때</strong>는
경계(프록시-앱, 클라이언트-LB)의 <em>타임아웃 설정 불일치</em>를 가장 먼저 의심하세요.</div>`);

sl('Linux','실전 케이스 — 조용한 데이터 손상', `
<h1><span class="no">5.32</span>실전 — 배열 밖 쓰기가 남의 변수를 깨뜨림</h1>
<pre class="code bad"><code><span class="cm">// 증상: total 값이 가끔 이상해짐. 크래시는 없음.</span>
<span class="kw">void</span> collect(<span class="kw">int</span> n) {
    <span class="kw">int</span> buf[<span class="nb">16</span>];
    <span class="kw">int</span> total = <span class="nb">0</span>;
    <span class="kw">for</span> (<span class="kw">int</span> i = <span class="nb">0</span>; i &lt;= n; i++)   <span class="cm">// ← &lt;= (off-by-one)</span>
        buf[i] = read_item(i);
    <span class="kw">for</span> (<span class="kw">int</span> i = <span class="nb">0</span>; i &lt; n; i++) total += buf[i];
    printf(<span class="st">"total=%d\\n"</span>, total);
}</code></pre>
<h3>추적 과정</h3>
<ol>
<li><strong>증상</strong>: n=16일 때만 total이 이상 → <em>경계값 힌트</em></li>
<li><strong>가설</strong>: 배열 범위 밖 접근이 인접 변수(total)를 덮는다</li>
<li><strong>실험 A (5초)</strong>: <code>-fsanitize=address</code>로 재빌드 → 즉시 확정</li>
</ol>
<pre class="code"><code><span class="er">ERROR: AddressSanitizer: stack-buffer-overflow on address 0x7ffd...</span>
WRITE of size 4 at 0x7ffd... thread T0
    #0 collect app.c:6
Address is located in stack of thread T0 at offset 96 in frame collect
  This frame has 2 object(s):
    [32, 96) <span class="st">'buf'</span>   &lt;== <span class="er">Memory access at offset 96 overflows this variable</span>
    [96, 100) <span class="st">'total'</span>   ← 바로 옆!</code></pre>
<div class="cols">
<div><div class="tip"><strong>ASan 없이 gdb로 잡는 법</strong>
<pre class="code sh"><code>(gdb) b collect
(gdb) run
(gdb) watch total          <span class="cm"># total 변경 감시</span>
(gdb) c
Hardware watchpoint: total
Old value = 0
New value = 12345
collect (n=16) at app.c:6   <span class="cm">← buf[i] 대입 줄에서 total이 바뀜(!)</span></code></pre>
“<em>대입한 적 없는 변수가 바뀌는 줄</em>”이 곧 범인입니다.</div></div>
<div><div class="note"><strong>왜 크래시가 안 났나</strong>: 스택 안쪽이라 페이지 폴트가 발생하지 않습니다.
이것이 <em>메모리 오류가 조용히 데이터만 망가뜨리는</em> 전형입니다.
그래서 “크래시가 없으니 메모리 문제가 아니다”는 <strong>틀린 추론</strong>입니다.</div></div>
</div>`);
