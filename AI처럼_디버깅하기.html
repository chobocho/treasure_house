sl('Lua','Lua 디버깅 무기고', `
<h1><span class="no">7.77</span>Lua — 작지만 충분한 도구들</h1>
<div class="tw"><table class="tbl">
<thead><tr><th>도구</th><th>용도</th></tr></thead>
<tbody>
<tr><td><code>debug</code> 표준 라이브러리</td><td>스택·지역변수·훅 — <strong>핵심 무기</strong></td></tr>
<tr><td><code>pcall</code>/<code>xpcall</code></td><td>에러 포착 + 트레이스백</td></tr>
<tr><td><code>debug.traceback</code></td><td>스택 문자열</td></tr>
<tr><td><code>debug.sethook</code></td><td>줄·호출 단위 훅 → 자체 트레이서·프로파일러 제작</td></tr>
<tr><td><code>luacheck</code></td><td>정적 분석(전역 오염·미사용 변수)</td></tr>
<tr><td>MobDebug / ZeroBrane</td><td>원격 디버거(게임·임베디드에서 유용)</td></tr>
<tr><td><code>lua-cjson</code>, <code>inspect.lua</code></td><td>테이블 덤프</td></tr>
<tr><td>LuaJIT <code>-jv</code>, <code>-jp</code></td><td>JIT 추적·프로파일</td></tr>
<tr><td>OpenResty <code>lua-resty-*</code></td><td>nginx 환경 로깅·디버깅</td></tr>
</tbody>
</table></div>
<pre class="code"><code><span class="cm">-- 테이블을 사람이 읽을 수 있게 (inspect.lua 없이 직접)</span>
<span class="kw">local function</span> <span class="fn">dump</span>(v, indent, seen)
  indent, seen = indent <span class="kw">or</span> <span class="st">""</span>, seen <span class="kw">or</span> {}
  <span class="kw">if type</span>(v) ~= <span class="st">"table"</span> <span class="kw">then return</span> <span class="kw">tostring</span>(v) <span class="kw">end</span>
  <span class="kw">if</span> seen[v] <span class="kw">then return</span> <span class="st">"&lt;cycle&gt;"</span> <span class="kw">end</span>      <span class="cm">-- 순환 참조 방어</span>
  seen[v] = <span class="kw">true</span>
  <span class="kw">local</span> parts = {}
  <span class="kw">for</span> k, val <span class="kw">in</span> <span class="kw">pairs</span>(v) <span class="kw">do</span>
    parts[#parts+<span class="nb">1</span>] = <span class="kw">string</span>.format(<span class="st">"%s  [%s] = %s"</span>,
        indent, <span class="kw">tostring</span>(k), dump(val, indent..<span class="st">"  "</span>, seen))
  <span class="kw">end</span>
  <span class="kw">return</span> <span class="st">"{\\n"</span> .. <span class="kw">table</span>.concat(parts, <span class="st">",\\n"</span>) .. <span class="st">"\\n"</span> .. indent .. <span class="st">"}"</span>
<span class="kw">end</span>
io.stderr:write(dump(config), <span class="st">"\\n"</span>)</code></pre>
<div class="tip">Lua는 표준 라이브러리가 작아서 <strong>디버깅 유틸을 직접 만들어 프로젝트에 두는 것</strong>이 일반적입니다.
위 <code>dump</code>와 다음 슬라이드의 <code>D()</code> 매크로를 <code>debug_util.lua</code>로 만들어 두세요.</div>`);

sl('Lua','에러 처리와 트레이스백', `
<h1><span class="no">7.78</span>pcall · xpcall · 트레이스백</h1>
<pre class="code bad"><code><span class="cm">-- pcall은 에러 메시지만 주고 스택은 버린다</span>
<span class="kw">local</span> ok, err = <span class="kw">pcall</span>(risky)
<span class="kw">if not</span> ok <span class="kw">then print</span>(err) <span class="kw">end</span>
<span class="cm">-- app.lua:42: attempt to index a nil value (field 'user')</span>
<span class="cm">-- ← 어디서 호출됐는지 알 수 없음</span></code></pre>
<pre class="code fix"><code><span class="cm">-- xpcall + debug.traceback = 스택 보존</span>
<span class="kw">local</span> ok, err = <span class="kw">xpcall</span>(risky, <span class="kw">function</span>(e)
  <span class="kw">return</span> <span class="kw">debug</span>.traceback(<span class="kw">tostring</span>(e), <span class="nb">2</span>)
<span class="kw">end</span>)
<span class="kw">if not</span> ok <span class="kw">then</span>
  io.stderr:write(err, <span class="st">"\\n"</span>)
<span class="kw">end</span>
<span class="cm">-- app.lua:42: attempt to index a nil value (field 'user')</span>
<span class="cm">-- stack traceback:</span>
<span class="cm">--   app.lua:42: in function 'process'</span>
<span class="cm">--   main.lua:12: in main chunk</span>

<span class="cm">-- 인자 전달이 필요하면 (Lua 5.2+는 xpcall이 인자 지원)</span>
<span class="kw">local</span> ok, err = <span class="kw">xpcall</span>(risky, handler, arg1, arg2)</code></pre>
<div class="cols">
<div><pre class="code"><code><span class="cm">-- 에러를 값으로 던지기(구조화)</span>
<span class="kw">error</span>({code = <span class="st">"E_TIMEOUT"</span>, ms = <span class="nb">3500</span>})
<span class="cm">-- 받는 쪽</span>
<span class="kw">local</span> ok, e = <span class="kw">pcall</span>(f)
<span class="kw">if not</span> ok <span class="kw">and type</span>(e) == <span class="st">"table"</span> <span class="kw">then</span>
  log(e.code, e.ms)
<span class="kw">end</span>

<span class="cm">-- 호출자 위치를 에러에 붙이기</span>
<span class="kw">error</span>(<span class="st">"잘못된 인자"</span>, <span class="nb">2</span>)   <span class="cm">-- 레벨 2 = 내 호출자 위치</span></code></pre></div>
<div><div class="note"><strong>레벨의 의미</strong><br>
<code>error(msg, 1)</code> = error를 호출한 위치(기본)<br>
<code>error(msg, 2)</code> = <em>내 함수를 호출한 쪽</em> → 라이브러리 함수의 인자 검증에 적합<br>
<code>error(msg, 0)</code> = 위치 정보 없음</div>
<div class="tip"><strong>전역 안전망</strong>: 애플리케이션 진입점 전체를
<code>xpcall(main, traceback_handler)</code>로 감싸세요.
Lua는 미처리 에러 시 스택을 잃기 쉬워, 이 한 겹이 결정적입니다.</div>
</div>
</div>`);

sl('Lua','debug 라이브러리 활용', `
<h1><span class="no">7.79</span>debug 라이브러리 실전</h1>
<pre class="code"><code><span class="cm">-- ① 위치 정보가 붙은 로그</span>
<span class="kw">local function</span> <span class="fn">D</span>(fmt, ...)
  <span class="kw">local</span> i = <span class="kw">debug</span>.getinfo(<span class="nb">2</span>, <span class="st">"Sln"</span>)
  io.stderr:write(<span class="kw">string</span>.format(<span class="st">"[DBG %s:%d %s] "</span>,
      i.short_src, i.currentline, i.name <span class="kw">or</span> <span class="st">"?"</span>))
  io.stderr:write(<span class="kw">string</span>.format(fmt, ...), <span class="st">"\\n"</span>)
<span class="kw">end</span>
D(<span class="st">"items=%d user=%s"</span>, #items, <span class="kw">tostring</span>(user))

<span class="cm">-- ② 현재 함수의 지역 변수 전부 덤프</span>
<span class="kw">local function</span> <span class="fn">locals</span>(level)
  level = (level <span class="kw">or</span> <span class="nb">1</span>) + <span class="nb">1</span>
  <span class="kw">local</span> t, i = {}, <span class="nb">1</span>
  <span class="kw">while true do</span>
    <span class="kw">local</span> name, val = <span class="kw">debug</span>.getlocal(level, i)
    <span class="kw">if not</span> name <span class="kw">then break end</span>
    t[name] = val; i = i + <span class="nb">1</span>
  <span class="kw">end</span>
  <span class="kw">return</span> t
<span class="kw">end</span>

<span class="cm">-- ③ 업밸류(클로저가 캡처한 변수) 확인</span>
<span class="kw">for</span> i = <span class="nb">1</span>, <span class="kw">math</span>.huge <span class="kw">do</span>
  <span class="kw">local</span> n, v = <span class="kw">debug</span>.getupvalue(f, i)
  <span class="kw">if not</span> n <span class="kw">then break end</span>
  <span class="kw">print</span>(<span class="st">"upvalue"</span>, n, v)
<span class="kw">end</span>

<span class="cm">-- ④ 훅으로 실행 추적 (자체 트레이서)</span>
<span class="kw">debug</span>.sethook(<span class="kw">function</span>(event, line)
  <span class="kw">local</span> i = <span class="kw">debug</span>.getinfo(<span class="nb">2</span>, <span class="st">"Sn"</span>)
  io.stderr:write(<span class="kw">string</span>.format(<span class="st">"%s %s:%s %s\\n"</span>,
      event, i.short_src, line <span class="kw">or</span> <span class="st">"-"</span>, i.name <span class="kw">or</span> <span class="st">""</span>))
<span class="kw">end</span>, <span class="st">"l"</span>)          <span class="cm">-- "l"=줄, "c"=호출, "r"=반환</span>
<span class="cm">-- 끄기: debug.sethook()</span></code></pre>
<div class="tip"><code>debug.sethook(fn, "", 10000)</code>처럼 <strong>명령 카운트 훅</strong>을 쓰면
무한 루프를 감지해 강제 종료시킬 수 있습니다.
게임 모드·플러그인처럼 <em>남의 스크립트를 실행</em>하는 환경에서 필수 기법입니다.</div>`);

sl('Lua','nil 관련 함정', `
<h1><span class="no">7.80</span>nil — Lua 버그의 절반</h1>
<pre class="code bad"><code><span class="cm">-- ① 오타가 에러가 아니라 nil</span>
<span class="kw">local</span> cfg = {timeout = <span class="nb">30</span>}
<span class="kw">print</span>(cfg.timeOut)          <span class="cm">-- nil (오타를 아무도 안 알려줌!)</span>

<span class="cm">-- ② nil을 테이블에 넣으면 "삭제"</span>
t[k] = <span class="kw">nil</span>                  <span class="cm">-- 키 제거. #t 가 예상과 달라짐</span>
<span class="kw">local</span> arr = {<span class="nb">1</span>, <span class="kw">nil</span>, <span class="nb">3</span>}       <span class="cm">-- #arr 는 1 또는 3 (미정의!)</span>

<span class="cm">-- ③ 함수 인자 누락도 nil</span>
<span class="kw">function</span> <span class="fn">f</span>(a, b) <span class="kw">return</span> a + b <span class="kw">end</span>
f(<span class="nb">1</span>)                       <span class="cm">-- attempt to perform arithmetic on a nil value (local 'b')</span>

<span class="cm">-- ④ false 와 nil 구분</span>
<span class="kw">if</span> cfg.enabled <span class="kw">then</span> ... <span class="kw">end</span>  <span class="cm">-- false와 nil 둘 다 거짓 → 설정 누락을 감지 못함</span></code></pre>
<pre class="code fix"><code><span class="cm">-- 인자 검증(라이브러리 경계)</span>
<span class="kw">function</span> <span class="fn">f</span>(a, b)
  <span class="kw">assert</span>(<span class="kw">type</span>(a) == <span class="st">"number"</span>, <span class="st">"a는 숫자여야 함, got "</span> .. <span class="kw">type</span>(a))
  <span class="kw">assert</span>(<span class="kw">type</span>(b) == <span class="st">"number"</span>, <span class="st">"b는 숫자여야 함, got "</span> .. <span class="kw">type</span>(b))
  <span class="kw">return</span> a + b
<span class="kw">end</span>

<span class="cm">-- 설정 누락과 false 구분</span>
<span class="kw">if</span> cfg.enabled == <span class="kw">nil</span> <span class="kw">then error</span>(<span class="st">"cfg.enabled 미설정"</span>) <span class="kw">end</span>

<span class="cm">-- 오타 방지: 읽기 전용 프록시</span>
<span class="kw">local</span> cfg = <span class="kw">setmetatable</span>({}, {
  __index = <span class="kw">function</span>(_, k) <span class="kw">error</span>(<span class="st">"알 수 없는 설정 키: "</span> .. <span class="kw">tostring</span>(k), <span class="nb">2</span>) <span class="kw">end</span>,
  __newindex = <span class="kw">function</span>() <span class="kw">error</span>(<span class="st">"설정은 읽기 전용"</span>, <span class="nb">2</span>) <span class="kw">end</span>,
})</code></pre>
<div class="fx"><strong>Lua 디버깅의 핵심 전략</strong>: <code>nil</code>은 조용히 퍼져 나가
<em>한참 뒤에</em> 엉뚱한 곳에서 터집니다. 그래서 <strong>경계(함수 진입·설정 로드·외부 데이터)에서
즉시 assert</strong>하는 것이 증상-원인 거리를 0으로 만드는 유일한 방법입니다.</div>`);

sl('Lua','전역 변수 오염 잡기', `
<h1><span class="no">7.81</span>전역 변수 오염</h1>
<pre class="code bad"><code><span class="kw">function</span> <span class="fn">process</span>(items)
  count = <span class="nb">0</span>                <span class="cm">-- local 누락! 전역 오염</span>
  <span class="kw">for</span> i = <span class="nb">1</span>, #items <span class="kw">do</span> count = count + <span class="nb">1</span> <span class="kw">end</span>
  <span class="kw">return</span> count
<span class="kw">end</span>
<span class="cm">-- 다른 모듈에서도 count를 쓰면 서로 덮어씀 → 재현 어려운 버그</span></code></pre>
<pre class="code fix"><code><span class="cm">-- strict 모드: 선언 없는 전역 접근을 에러로 (프로젝트 첫 줄에)</span>
<span class="kw">local</span> declared = {}
<span class="kw">setmetatable</span>(_G, {
  __newindex = <span class="kw">function</span>(t, k, v)
    <span class="kw">if not</span> declared[k] <span class="kw">then</span>
      <span class="kw">local</span> i = <span class="kw">debug</span>.getinfo(<span class="nb">2</span>, <span class="st">"Sl"</span>)
      <span class="kw">error</span>(<span class="kw">string</span>.format(<span class="st">"전역 '%s' 할당 (%s:%d) — local 누락?"</span>,
            k, i.short_src, i.currentline), <span class="nb">2</span>)
    <span class="kw">end</span>
    <span class="kw">rawset</span>(t, k, v)

    <span class="kw">if not</span> declared[k] <span class="kw">then</span>
      <span class="kw">error</span>(<span class="st">"선언되지 않은 전역 읽기: "</span> .. k, <span class="nb">2</span>)
    <span class="kw">end</span>
  <span class="kw">end</span>,
})
<span class="kw">function</span> <span class="fn">global</span>(k) declared[k] = <span class="kw">true</span> <span class="kw">end</span>   <span class="cm">-- 의도적 전역 선언용</span></code></pre>
<pre class="code sh"><code><span class="cm"># 정적 분석으로 한 번에 찾기</span>

src/game.lua:40:9: unused variable 'tmp'

컴파일러가 없는 언어에서 “오타·local 누락·미사용 변수”를 잡아주는 유일한 자동 수단이며,

sl('Lua','테이블과 # 연산자 함정', `

<div class="tw"><table class="tbl">
<thead><tr><th>표현</th><th>결과</th><th>주의</th></tr></thead>
<tbody>
<tr><td><code>#{1,2,3}</code></td><td>3</td><td>정상</td></tr>
<tr><td><code>#{1,nil,3}</code></td><td><strong>1 또는 3</strong></td><td>구멍(hole)이 있으면 <em>미정의</em></td></tr>

<tr><td><code>#{a=1,b=2}</code></td><td>0</td><td>해시 부분은 세지 않음</td></tr>
<tr><td><code>ipairs</code></td><td>첫 nil에서 중단</td><td>구멍 뒤 원소 누락</td></tr>

<tr><td><code>table.insert(t, nil)</code></td><td>에러 또는 무시</td><td>버전에 따라 다름</td></tr>
</tbody>
</table></div>
<pre class="code bad"><code><span class="cm">-- 배열에서 삭제하며 순회 → 원소 건너뜀</span>
<span class="kw">for</span> i = <span class="nb">1</span>, #t <span class="kw">do</span>
  <span class="kw">if</span> bad(t[i]) <span class="kw">then table</span>.remove(t, i) <span class="kw">end</span>   <span class="cm">-- 인덱스 밀림!</span>
<span class="kw">end</span></code></pre>
<pre class="code fix"><code><span class="cm">-- 역순으로 순회</span>
<span class="kw">for</span> i = #t, <span class="nb">1</span>, <span class="nb">-1</span> <span class="kw">do</span>
  <span class="kw">if</span> bad(t[i]) <span class="kw">then table</span>.remove(t, i) <span class="kw">end</span>
<span class="kw">end</span>

<span class="cm">-- 또는 새 테이블로 (더 명확)</span>
<span class="kw">local</span> out = {}
<span class="kw">for</span> _, v <span class="kw">in</span> <span class="kw">ipairs</span>(t) <span class="kw">do</span>
  <span class="kw">if not</span> bad(v) <span class="kw">then</span> out[#out+<span class="nb">1</span>] = v <span class="kw">end</span>
<span class="kw">end</span>

<span class="cm">-- 개수를 직접 관리(구멍 허용 컬렉션)</span>

<div class="note"><strong>재현 가능한 순회</strong>: <code>pairs</code>의 순서는 실행마다 다를 수 있습니다.
출력·직렬화·해시 계산에는 반드시 <strong>키를 정렬</strong>해서 순회하세요.

sl('Lua','메타테이블 디버깅', `
<h1><span class="no">7.83</span>메타테이블 디버깅</h1>
<pre class="code"><code><span class="cm">-- 지금 이 객체의 메타테이블이 무엇인가</span>
<span class="kw">local</span> mt = <span class="kw">getmetatable</span>(obj)
<span class="kw">print</span>(mt, mt <span class="kw">and</span> mt.__index, mt <span class="kw">and</span> mt.__name)
<span class="cm">-- __metatable 필드가 있으면 getmetatable이 그것을 반환(보호됨)</span>

<span class="cm">-- rawget/rawset: 메타메서드를 우회해 "진짜" 값 확인</span>
<span class="kw">print</span>(obj.x)              <span class="cm">-- __index 가 개입할 수 있음</span>
<span class="kw">print</span>(<span class="kw">rawget</span>(obj, <span class="st">"x"</span>))   <span class="cm">-- 테이블에 실제로 있는 값만</span>
<span class="kw">print</span>(<span class="kw">rawequal</span>(a, b))     <span class="cm">-- __eq 우회</span>
<span class="kw">print</span>(<span class="kw">rawlen</span>(t))         <span class="cm">-- __len 우회</span></code></pre>
<pre class="code"><code><span class="cm">-- 접근을 추적하는 디버그 프록시 (강력한 기법)</span>
<span class="kw">local function</span> <span class="fn">trace_table</span>(t, name)
  <span class="kw">return</span> <span class="kw">setmetatable</span>({}, {
    __index = <span class="kw">function</span>(_, k)
      <span class="kw">local</span> i = <span class="kw">debug</span>.getinfo(<span class="nb">2</span>, <span class="st">"Sl"</span>)
      io.stderr:write((<span class="st">"[GET] %s.%s at %s:%d -&gt; %s\\n"</span>):format(
        name, <span class="kw">tostring</span>(k), i.short_src, i.currentline, <span class="kw">tostring</span>(t[k])))
      <span class="kw">return</span> t[k]
    <span class="kw">end</span>,
    __newindex = <span class="kw">function</span>(_, k, v)
      <span class="kw">local</span> i = <span class="kw">debug</span>.getinfo(<span class="nb">2</span>, <span class="st">"Sl"</span>)
      io.stderr:write((<span class="st">"[SET] %s.%s = %s at %s:%d\\n"</span>):format(
        name, <span class="kw">tostring</span>(k), <span class="kw">tostring</span>(v), i.short_src, i.currentline))
      t[k] = v

<span class="kw">end</span>
config = trace_table(config, <span class="st">"config"</span>)   <span class="cm">-- 누가 언제 읽고 쓰는지 전부 기록</span></code></pre>

<em>상속 체인이 깊어 값의 출처를 모를 때</em> 특히 유용합니다.</div>`);

sl('Lua','C API·임베디드 환경 디버깅', `
<h1><span class="no">7.86</span>C 연동·임베디드 환경</h1>
<pre class="code"><code><span class="cm">/* C 쪽: 스택 상태를 덤프하는 필수 유틸 */</span>
<span class="kw">static</span> <span class="kw">void</span> dump_stack(lua_State *L, <span class="kw">const</span> <span class="kw">char</span> *tag){
    <span class="kw">int</span> top = lua_gettop(L);
    fprintf(stderr, <span class="st">"=== stack [%s] top=%d ===\\n"</span>, tag, top);
    <span class="kw">for</span> (<span class="kw">int</span> i = <span class="nb">1</span>; i &lt;= top; i++){
        <span class="kw">int</span> t = lua_type(L, i);
        fprintf(stderr, <span class="st">"  %d(%d): %s = "</span>, i, i - top - <span class="nb">1</span>, lua_typename(L, t));
        <span class="kw">switch</span> (t){
        <span class="kw">case</span> LUA_TSTRING:  fprintf(stderr, <span class="st">"'%s'"</span>, lua_tostring(L, i)); <span class="kw">break</span>;
        <span class="kw">case</span> LUA_TBOOLEAN: fprintf(stderr, lua_toboolean(L,i) ? <span class="st">"true"</span> : <span class="st">"false"</span>); <span class="kw">break</span>;
        <span class="kw">case</span> LUA_TNUMBER:  fprintf(stderr, <span class="st">"%g"</span>, lua_tonumber(L, i)); <span class="kw">break</span>;
        <span class="kw">default</span>:           fprintf(stderr, <span class="st">"%p"</span>, lua_topointer(L, i));
        }
        fputc(<span class="st">'\\n'</span>, stderr);
    }
}</code></pre>
<div class="cols">
<div><div class="danger"><strong>C API 3대 사고</strong>
<ul>
<li><strong>스택 불균형</strong> — push/pop 개수 불일치 → 서서히 스택 넘침</li>
<li><strong>인덱스 실수</strong> — 양수(바닥부터)/음수(top부터) 혼동</li>
<li><strong>에러 시 자원 누수</strong> — <code>lua_error</code>는 longjmp → C의 정리 코드 건너뜀</li>
</ul>
함수 진입/종료에 <code>lua_gettop</code>을 찍어 <em>불변식</em>을 확인하세요.</div></div>
<div>
<pre class="code"><code><span class="cm">/* 스택 균형 검사 매크로 */</span>
#define STACK_CHECK_BEGIN(L) <span class="kw">int</span> _top = lua_gettop(L)
#define STACK_CHECK_END(L, n) \\
    assert(lua_gettop(L) == _top + (n))</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>환경</th><th>디버깅 진입점</th></tr></thead>

<tr><td>Redis</td><td><code>redis.log(redis.LOG_WARNING, ...)</code></td></tr>
<tr><td>Neovim</td><td><code>vim.print()</code>, <code>:messages</code>, <code>:lua =expr</code></td></tr>
<tr><td>임베디드</td><td>시리얼 출력 + 자체 <code>print</code> 재정의</td></tr>
</tbody></table></div>
</div>
</div>`);

<thead><tr><th>지표</th><th>의미</th><th>누수 판단에</th></tr></thead>
<tbody>
<tr><td><code>VSZ</code>/가상 크기</td><td>예약한 주소 공간</td><td class="r0">무의미 (수 TB도 정상)</td></tr>
<tr><td><code>RSS</code>/작업 집합</td><td>물리 메모리 상주분(공유 포함)</td><td>참고용 — 공유 라이브러리 중복 계산</td></tr>
<tr><td><strong>PSS</strong></td><td>공유분을 비례 배분</td><td class="r1">프로세스 간 비교에 정확</td></tr>
<tr><td><strong>Private/Anon</strong></td><td>이 프로세스만의 메모리</td><td class="r1"><strong>누수 판단은 이것</strong></td></tr>
<tr><td>Windows <code>Private Bytes</code></td><td>커밋된 전용 메모리</td><td class="r1">누수 판단</td></tr>
<tr><td>Windows <code>Working Set</code></td><td>물리 상주</td><td class="r0">OS가 회수하면 줄어 <em>누수를 숨김</em></td></tr>
<tr><td>JVM <code>Heap Used</code></td><td>GC 후 남은 힙</td><td class="r1">Full GC 후에도 안 줄면 누수</td></tr>
<tr><td>컨테이너 <code>memory.current</code></td><td>cgroup 사용량(페이지 캐시 포함)</td><td>OOMKill 기준 — 파일 캐시도 포함됨</td></tr>
</tbody>
</table></div>
<pre class="code sh"><code><span class="cm"># Linux — 정확한 값 보기</span>
$ grep -E <span class="st">'^(Rss|Pss|Private)'</span> /proc/$PID/smaps_rollup
$ ps -o pid,rss,vsz,comm -p $PID
$ cat /sys/fs/cgroup/memory.stat | head

<span class="cm"># Windows</span>
&gt; Get-Process app | Select PM, WS, NPM, CPU
&gt; typeperf <span class="st">"\\Process(app)\\Private Bytes"</span> -si 10</code></pre>
<div class="note"><strong>흔한 오해</strong>: “RSS가 2GB인데 힙 프로파일러는 500MB래요” —
공유 라이브러리·스택·JIT 코드·할당자 캐시·단편화가 차이를 만듭니다.
언어 힙 밖 메모리(네이티브)를 놓치고 있는 것일 수도 있습니다.</div>`);

sl('메모리','use-after-free 심화', `
<h1><span class="no">8.4</span>use-after-free 심화</h1>
<div class="cols">
<div>
<h3>왜 어려운가</h3>
<ul>
<li>해제 직후엔 값이 <strong>그대로 남아</strong> 정상 동작</li>
<li>다른 할당이 그 자리를 차지한 <em>뒤에야</em> 이상해짐</li>
<li>증상 지점과 원인 지점의 거리가 <strong>4~5</strong></li>
<li>부하가 늘수록 재사용이 빨라져 <em>운영에서만</em> 발생</li>
</ul>
<h3>결정적 도구</h3>
<ul>
<li><strong>ASan</strong> — 해제 메모리를 격리(quarantine)해 즉시 검출 + 할당/해제 스택</li>
<li><strong>PageHeap</strong> — 해제 페이지를 언맵 → 즉시 액세스 위반</li>
<li><strong>rr / TTD</strong> — 해제 시점으로 역행</li>
<li><code>MALLOC_PERTURB_</code> — 해제 메모리를 패턴으로 덮어 조기 발견</li>
</ul>
</div>
<div>
<pre class="code"><code><span class="cm">// 소유권을 코드로 표현해 UAF를 구조적으로 제거</span>
<span class="cm">// C++: unique_ptr / shared_ptr</span>
std::unique_ptr&lt;Node&gt; n = std::make_unique&lt;Node&gt;();
<span class="cm">// C: 소유권 규약을 이름과 주석으로 명시</span>
<span class="cm">//   *_create / *_destroy 쌍, *_borrow 는 소유권 없음</span>
Node* node_create(<span class="kw">void</span>);
<span class="kw">void</span>  node_destroy(Node*);      <span class="cm">// 호출 후 포인터 무효</span>
<span class="kw">const</span> Node* list_borrow(List*, <span class="kw">int</span>);  <span class="cm">// 소유권 이전 없음</span></code></pre>
<div class="danger"><strong>“가짜 수정” 주의</strong>: UAF를 만나면
해제를 지워버리고 싶은 유혹이 생깁니다. 그러면 UAF는 사라지고 <em>누수</em>가 생깁니다.
올바른 수정은 <strong>수명 규칙을 정하는 것</strong>이지 해제를 없애는 것이 아닙니다.</div>
<div class="tip"><strong>진단 신호</strong>: 크래시 시 포인터가
<code>0xfeeefeee</code>(Win 디버그 힙 해제 표시), <code>0xdddddddd</code>,
ASan의 <code>heap-use-after-free</code> — 즉시 확정입니다.</div>
</div>
</div>`);

sl('메모리','버퍼 오버런 심화', `
<h1><span class="no">8.5</span>버퍼 오버런 심화</h1>
<div class="tw"><table class="tbl">
<thead><tr><th>위치</th><th>덮는 대상</th><th>증상</th></tr></thead>
<tbody>
<tr><td>스택 버퍼</td><td>인접 지역변수 → 저장된 프레임 포인터 → <strong>반환 주소</strong></td><td>값 오염 → 이상한 곳으로 점프 → 크래시</td></tr>
<tr><td>힙 버퍼</td><td>인접 객체 → <strong>힙 메타데이터</strong></td><td>조용한 오염 → 나중에 malloc/free에서 크래시</td></tr>
<tr><td>전역 배열</td><td>인접 전역 변수</td><td>설정값이 저절로 바뀜</td></tr>
<tr><td>off-by-one</td><td>정확히 1바이트(대개 NUL)</td><td>가장 찾기 어려움</td></tr>
</tbody>
</table></div>
<pre class="code bad"><code><span class="cm">// 전형적인 off-by-one 3종</span>
<span class="kw">for</span> (i = <span class="nb">0</span>; i &lt;= n; i++) a[i] = ...;        <span class="cm">// &lt;= 는 거의 항상 버그</span>
<span class="kw">char</span> b[<span class="nb">16</span>]; strcpy(b, s);                    <span class="cm">// strlen(s)==16 이면 NUL이 밖으로</span>
memcpy(dst, src, <span class="kw">sizeof</span>(src));               <span class="cm">// src가 포인터면 8바이트만!</span></code></pre>
<pre class="code sh"><code><span class="cm"># 검출 설정 (거의 공짜)</span>
$ gcc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Warray-bounds=2
$ gcc -fsanitize=address                          <span class="cm"># 정확한 위치+인접 객체</span>
&gt; cl /GS /RTC1 /analyze ; gflags /p /enable app.exe /full</code></pre>
<div class="cols">
<div><div class="tip"><strong>진단 순서</strong>
<ol><li>ASan/PageHeap로 재실행 → 대개 즉시 확정</li>
<li>불가하면 워치포인트로 “덮인 변수”를 감시</li>
<li>덮인 값의 <em>패턴</em>이 단서: 문자열 조각이면 문자열 복사, 포인터 같으면 구조체 복사</li></ol></div></div>
<div><div class="note"><strong>스택 카나리</strong>가 잡아주는 경우:
<code>*** stack smashing detected ***</code>(Linux) /
<code>0xC0000409 STACK_BUFFER_OVERRUN</code>(Windows).
이 메시지가 보이면 <em>함수 반환 시점</em>이므로 범인은 <strong>그 함수 안</strong>에 있습니다.</div></div>
</div>`);

sl('메모리','GC 언어의 메모리 문제', `
<h1><span class="no">8.7</span>GC가 있어도 누수는 난다</h1>
<div class="fx big">GC는 <strong>도달 불가능한</strong> 객체만 회수합니다.
“쓰지 않지만 참조는 살아 있는” 객체는 영원히 남습니다 — 이것이 관리형 언어의 누수입니다.</div>
<div class="tw"><table class="tbl">
<thead><tr><th>패턴</th><th>언어별 사례</th><th>해결</th></tr></thead>
<tbody>
<tr><td>정적/전역 컬렉션 무한 증가</td><td>Java <code>static Map</code>, JS 모듈 변수, Python 모듈 캐시</td><td>크기 제한 캐시(LRU), TTL</td></tr>
<tr><td>이벤트 구독 미해제</td><td>Java 리스너, .NET <code>event +=</code>, JS <code>addEventListener</code></td><td>해제 규약, <code>AbortController</code>, weak 참조</td></tr>
<tr><td>클로저가 큰 객체 캡처</td><td>JS/Python/Java 람다</td><td>필요한 값만 캡처</td></tr>
<tr><td>스레드/타이머 미종료</td><td>모든 언어</td><td>수명 관리, <code>close()</code></td></tr>
<tr><td>ThreadLocal 미정리</td><td>Java 스레드풀</td><td><code>remove()</code> 필수</td></tr>
<tr><td>내부 클래스가 외부 참조</td><td>Java 비정적 내부 클래스, Android <code>Activity</code></td><td><code>static</code> + <code>WeakReference</code></td></tr>
<tr><td>네이티브 메모리</td><td>NIO 다이렉트 버퍼, 이미지 버퍼</td><td>명시적 해제, NMT로 추적</td></tr>
</tbody>
</table></div>
<pre class="code"><code><span class="cm">// 약참조로 “있으면 쓰고 없으면 만든다” 캐시</span>
Java   : WeakHashMap, SoftReference, Caffeine(만료·최대크기)
.NET   : ConditionalWeakTable, WeakReference&lt;T&gt;
JS     : WeakMap, WeakSet, WeakRef, FinalizationRegistry
Python : weakref.WeakValueDictionary, functools.lru_cache(maxsize=1024)
Go     : GC 대상이지만 map은 자동 축소 안 됨 → 주기적 재생성</code></pre>
<div class="note"><strong>Go의 map 함정</strong>: 원소를 <code>delete</code>해도
map의 버킷 메모리는 반환되지 않습니다. 대량 삽입·삭제를 반복하면 메모리가 유지됩니다.
필요하면 새 map을 만들어 교체하세요.</div>`);

sl('메모리','OOM 대응 절차 (운영)', `
<h1><span class="no">8.8</span>운영 OOM 대응 절차</h1>
<div class="loop">
  <div class="stp on"><b>🧊</b><div class="t">증거 보존</div><div class="d">덤프·로그 먼저</div></div>
  <div class="stp"><b>🩹</b><div class="t">완화</div><div class="d">재시작·한도 상향</div></div>
  <div class="stp"><b>🔍</b><div class="t">분류</div><div class="d">누수 vs 부족</div></div>
  <div class="stp"><b>🔧</b><div class="t">근본 수정</div><div class="d">보유 경로 제거</div></div>
</div>
<div class="cols">
<div>
<h3>① 증거 보존 (재시작 전에!)</h3>
<pre class="code sh"><code><span class="cm"># Java</span>
$ jcmd PID GC.heap_dump /var/dump/heap.hprof
$ jcmd PID GC.class_histogram &gt; /var/dump/histo.txt
<span class="cm"># .NET</span>
&gt; dotnet-gcdump collect -p PID
<span class="cm"># Native</span>
$ gcore -o /var/dump/snap PID
<span class="cm"># Node</span>
$ kill -USR2 PID     <span class="cm"># heapdump 설정 시</span>
<span class="cm"># Python</span>
$ py-spy dump --pid PID &gt; /var/dump/stack.txt</code></pre>
<div class="danger">재시작하면 원인은 사라집니다. <strong>덤프 수집을 운영 런북에 명시</strong>하세요.
자동화가 최선입니다(<code>HeapDumpOnOutOfMemoryError</code>, WER LocalDumps).</div>
</div>
<div>
<h3>② 즉시 확인할 것</h3>
<ul>
<li>OOM 주체: <strong>앱(힙)인가 커널/cgroup(전체)인가</strong></li>
<li>컨테이너면 <code>memory.max</code>와 힙 한도의 관계</li>
<li>같은 시각의 트래픽·배포·데이터 변화</li>
<li>다른 인스턴스도 같은가(전역 원인) 아니면 하나만인가</li>
</ul>
<pre class="code sh"><code>$ dmesg -T | grep -i <span class="st">'killed process'</span>
$ cat /sys/fs/cgroup/memory.events
$ kubectl get pod X -o json | jq <span class="st">'.status.containerStatuses[].lastState'</span></code></pre>
<div class="tip"><strong>힙 밖 메모리</strong>를 잊지 마세요.
JVM 컨테이너 OOMKill의 흔한 원인은 힙이 아니라
<em>Metaspace + 스레드 스택 + 다이렉트 버퍼 + 네이티브 라이브러리</em>의 합입니다.
<code>-XX:MaxRAMPercentage=70</code> 정도로 여유를 두세요.</div>
</div>
</div>`);

sl('메모리','실전 — 캐시가 메모리를 먹는다', `
<h1><span class="no">8.9</span>실전 — 무한 성장 캐시</h1>
<pre class="code bad"><code><span class="cm">// 아주 흔한 "성능 최적화"가 누수가 되는 순간</span>

Report get(String key){
    <span class="kw">return</span> CACHE.computeIfAbsent(key, k -&gt; buildReport(k));   <span class="cm">// 제거 없음!</span>
}</code></pre>
<div class="cols">
<div>
<h3>추적</h3>
<ol>
<li><strong>관찰</strong>: 힙이 하루 단위로 톱니 없이 <em>단조 증가</em></li>
<li><strong>덤프 diff</strong>: <code>HashMap$Node</code>가 40만 개 증가</li>
<li><strong>gcroot</strong>: <code>com.app.ReportService.CACHE</code>가 붙잡고 있음</li>
<li><strong>확정</strong>: 키가 사용자별·날짜별 조합 → 카디널리티 무한</li>
</ol>
<pre class="code sh"><code>&gt; dumpheap -stat | head
&gt; gcroot 0x00000007ab...
  -&gt; com.app.ReportService.CACHE (static)</code></pre>
</div>
<div>
<pre class="code fix"><code><span class="cm">// 캐시는 반드시 3가지를 가져야 한다:</span>
<span class="cm">//   최대 크기 · 만료 정책 · 지표</span>
<span class="kw">private static final</span> Cache&lt;String, Report&gt; CACHE =
    Caffeine.newBuilder()
        .maximumSize(<span class="nb">10_000</span>)
        .expireAfterWrite(Duration.ofMinutes(<span class="nb">10</span>))
        .recordStats()                    <span class="cm">// 히트율 모니터링</span>
        .build();</code></pre>
<div class="fx"><strong>캐시 3원칙</strong>
<ol>
<li>크기 상한 없는 캐시는 <em>누수의 다른 이름</em></li>
<li>키의 카디널리티를 추정하라 (사용자 수 × 날짜 = 무한)</li>
<li>히트율을 측정하라 — 5% 히트율 캐시는 <em>메모리만 먹는 코드</em></li>
</ol></div>
</div>
</div>
<div class="tip">같은 실수가 모든 언어에 있습니다:
Python <code>@lru_cache(maxsize=None)</code>, Go의 전역 map,
JS의 모듈 스코프 객체, C++의 static map. <em>패턴을 알면 언어를 옮겨도 잡힙니다.</em></div>`);

<h1><span class="no">8.12</span>실습 — counter++ 는 원자적이지 않다</h1>
<p><code>count++</code>는 <strong>load → add → store</strong> 세 단계입니다.
그 사이에 다른 스레드가 끼어들면 갱신이 사라집니다.</p>
<div class="demo" data-demo="race">
  <div class="title">⚔️ 경합 시뮬레이터</div>
  <div class="ctl">
    <label class="small mut">스레드</label>
    <select data-r="th"><option>2</option><option selected>4</option><option>8</option></select>
    <label class="small mut">각 반복</label>
    <select data-r="it"><option>10</option><option selected>50</option><option>200</option></select>
    <label class="small mut"><input type="checkbox" data-r="lock"> 락 사용</label>
    <button data-r="run">▶ 실행</button>
  </div>
  <div class="out" data-r="out"></div>
</div>
<div class="cols">
<div><pre class="code"><code><span class="cm">// 기계어 수준에서 본 count++</span>
mov eax, [count]   <span class="cm">; load</span>
add eax, 1         <span class="cm">; add     ← 여기서 선점되면?</span>
mov [count], eax   <span class="cm">; store   ← 다른 스레드의 갱신을 덮어씀</span></code></pre></div>
<div><pre class="code fix"><code>C11/C++  : atomic_fetch_add(&amp;c, 1);  /  std::atomic&lt;int&gt;
Java     : AtomicInteger.incrementAndGet() / LongAdder
Go       : atomic.Int64.Add(1)
C#       : Interlocked.Increment(ref c)
Python   : GIL이 있어도 안전하지 않음 → Lock 또는 itertools.count
Rust     : AtomicUsize::fetch_add(1, Ordering::Relaxed)</code></pre></div>
</div>
<div class="note"><strong>Python의 GIL 오해</strong>: GIL은 바이트코드 단위로만 원자성을 보장합니다.
<code>c += 1</code>은 여러 바이트코드이므로 <em>여전히 레이스가 발생</em>합니다.
“GIL이 있으니 스레드 안전하다”는 틀린 믿음입니다.</div>`);

<div class="cols">
<div>

</ol>
<h3>깨는 방법 (실무에서 쓰는 것)</h3>
<ul>
<li><strong>락 순서 전역 규칙</strong>(4번 제거) — 가장 실용적</li>
<li><strong>타임아웃 획득</strong>(2번 완화) — <code>tryLock(100ms)</code></li>

</ul>
</div>
<div>
<h3>진단 3분 절차</h3>
<pre class="code sh"><code><span class="cm"># 1) 모든 스레드 스택</span>
$ jstack -l PID              <span class="cm"># Java: 데드락 자동 탐지</span>
$ gdb -p PID -batch -ex <span class="st">'thread apply all bt'</span>
0:000&gt; ~*k ; !locks           <span class="cm">; WinDbg</span>
$ py-spy dump --pid PID       <span class="cm"># Python</span>
$ curl :6060/debug/pprof/goroutine?debug=2   <span class="cm"># Go</span>

<span class="cm"># 2) 표로 정리</span>
스레드  보유 락    대기 락
T1      Cache      Store
T2      Store      Cache      ← 순환 발견</code></pre>
<div class="tip"><strong>락 순서 규칙 만들기</strong>: 락에 번호를 부여하고
<em>항상 오름차순으로만 획득</em>합니다. 디버그 빌드에서 순서 위반 시 assert를 넣으면

sl('동시성','메모리 모델과 가시성', `
<h1><span class="no">8.14</span>가시성 — 값이 “보이지 않는” 문제</h1>
<div class="fx">멀티코어에서 한 스레드의 쓰기가 <strong>다른 스레드에게 언제 보이는지</strong>는
<em>메모리 모델</em>이 정합니다. 동기화가 없으면 <strong>영원히 안 보일 수도</strong> 있습니다.</div>
<pre class="code bad"><code><span class="cm">// 컴파일러가 루프 밖으로 읽기를 끌어낼 수 있다(호이스팅)</span>
<span class="kw">bool</span> running = <span class="kw">true</span>;
<span class="cm">// T1: while (running) { work(); }   → while(true) 로 최적화 가능</span>
<span class="cm">// T2: running = false;              → T1이 영원히 못 봄</span></code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>언어</th><th>가시성 보장 수단</th></tr></thead>
<tbody>
<tr><td>C/C++</td><td><code>std::atomic&lt;T&gt;</code>, <code>_Atomic</code>, 뮤텍스 (<code>volatile</code>은 <strong>아님</strong>)</td></tr>
<tr><td>Java</td><td><code>volatile</code>, <code>synchronized</code>, <code>java.util.concurrent</code>, <code>final</code> 필드</td></tr>
<tr><td>C#</td><td><code>volatile</code>, <code>Interlocked</code>, <code>lock</code>, <code>Volatile.Read/Write</code></td></tr>
<tr><td>Go</td><td>채널, <code>sync.Mutex</code>, <code>sync/atomic</code> (happens-before 문서화)</td></tr>
<tr><td>Rust</td><td>타입 시스템이 강제(<code>Send</code>/<code>Sync</code>) + <code>Atomic*</code></td></tr>
<tr><td>Python/JS</td><td>단일 스레드(GIL/이벤트루프) — 대신 <em>원자성</em> 문제는 남음</td></tr>
</tbody>
</table></div>
<div class="danger"><strong>C/C++의 <code>volatile</code>은 스레드 동기화 수단이 아닙니다.</strong>
메모리 맵 I/O를 위한 것이며, 메모리 순서를 보장하지 않습니다.
Java의 <code>volatile</code>과 의미가 완전히 다릅니다 — 이 혼동이 실제 버그를 만듭니다.</div>
<div class="tip"><strong>디버깅 신호</strong>: “디버거를 붙이거나 print를 넣으면 정상 동작한다”,
“<code>-O0</code>에서는 되는데 <code>-O2</code>에서 멈춘다” → 가시성/재정렬 문제를 강하게 의심하세요.</div>`);

<li><strong>실험</strong>: TTL을 1분으로 바꾸면 <em>1분마다</em> 발생 → 가설 확정</li>
<li><strong>측정</strong>: <code>heavyQuery</code> 호출 카운터 → 만료 순간 1000회</li>
</ol>
<pre class="code fix"><code><span class="cm">// ① 단일 비행(single-flight): 하나만 계산, 나머지는 대기</span>
Report get(String k){
    <span class="kw">return</span> cache.get(k, key -&gt; db.heavyQuery(key));
    <span class="cm">// Caffeine/Guava의 로딩 캐시는 키별 락으로 중복 제거</span>
}
<span class="cm">// Go: golang.org/x/sync/singleflight</span>
<span class="cm">// ② 조기 갱신: TTL의 90% 시점에 백그라운드 갱신</span>
<span class="cm">// ③ TTL 지터: 만료 시각을 ±10% 분산 → 동시 만료 방지</span></code></pre>
</div>
</div>
<div class="fx"><strong>일반화</strong>: “정확히 N분마다” 또는 “정각마다” 발생하는 문제는
<em>만료·스케줄·리프레시의 동시성</em>을 의심하세요. 주기성 자체가 결정적 단서입니다.</div>`);

sl('유형별','DB 트랜잭션·격리 수준', `
<h1><span class="no">8.39</span>트랜잭션 버그</h1>
<div class="tw"><table class="tbl">
<thead><tr><th>이상 현상</th><th>설명</th><th>방지 격리 수준</th></tr></thead>
<tbody>
<tr><td>Dirty read</td><td>커밋 안 된 데이터를 읽음</td><td>READ COMMITTED 이상</td></tr>
<tr><td>Non-repeatable read</td><td>같은 행을 두 번 읽으면 값이 다름</td><td>REPEATABLE READ 이상</td></tr>
<tr><td>Phantom read</td><td>같은 조건 조회에 행이 늘어남</td><td>SERIALIZABLE (또는 MySQL RR+갭락)</td></tr>
<tr><td><strong>Lost update</strong></td><td>읽고-수정-쓰기에서 한쪽이 사라짐</td><td>격리로 안 막힘 → <code>SELECT FOR UPDATE</code> 또는 버전</td></tr>
<tr><td>Write skew</td><td>각각은 유효하나 합쳐서 제약 위반</td><td>SERIALIZABLE</td></tr>
</tbody>
</table></div>
<pre class="code bad"><code><span class="cm">-- Lost update: 두 요청이 동시에 실행되면 하나가 사라짐</span>
SELECT balance FROM accounts WHERE id=<span class="nb">1</span>;      <span class="cm">-- 1000</span>
<span class="cm">-- 애플리케이션에서 -100 계산</span>
UPDATE accounts SET balance=<span class="nb">900</span> WHERE id=<span class="nb">1</span>;</code></pre>
<pre class="code fix"><code><span class="cm">-- ① 원자적 업데이트 (가장 단순·안전)</span>
UPDATE accounts SET balance = balance - <span class="nb">100</span>
 WHERE id=<span class="nb">1</span> AND balance &gt;= <span class="nb">100</span>;
<span class="cm">-- 영향받은 행이 0이면 잔액 부족</span>

<span class="cm">-- ② 비관적 락</span>
SELECT balance FROM accounts WHERE id=<span class="nb">1</span> FOR UPDATE;

<span class="cm">-- ③ 낙관적 락 (버전)</span>
UPDATE accounts SET balance=?, version=version+<span class="nb">1</span>
 WHERE id=? AND version=?;   <span class="cm">-- 0행이면 재시도</span></code></pre>
<div class="cols">
<div><div class="danger"><strong>트랜잭션 안에서 외부 호출 금지.</strong>
HTTP 호출·메시지 발행을 트랜잭션 안에 두면
락을 든 채 수 초를 대기해 <em>커넥션 풀 고갈</em>과 데드락을 부릅니다.
→ 아웃박스 패턴으로 분리하세요.</div></div>
<div><div class="tip"><strong>진단</strong>: <code>SHOW ENGINE INNODB STATUS</code>(MySQL),
<code>pg_locks</code>/<code>pg_stat_activity</code>(Postgres)로
잠금 대기 그래프를 볼 수 있습니다.
데드락 로그는 <em>두 트랜잭션이 어떤 순서로 무엇을 잠갔는지</em>까지 알려줍니다.</div></div>
</div>`);

sl('유형별','SQL 성능 디버깅', `
<h1><span class="no">8.40</span>SQL 성능</h1>
<pre class="code sh"><code><span class="cm">-- 실행 계획 (추정이 아니라 실제)</span>
EXPLAIN (ANALYZE, BUFFERS, VERBOSE) SELECT ...;     <span class="cm">-- PostgreSQL</span>
EXPLAIN ANALYZE SELECT ...;                          <span class="cm">-- MySQL 8+</span>
SET STATISTICS PROFILE ON;                           <span class="cm">-- SQL Server</span>

<span class="cm">-- 느린 쿼리 수집</span>
<span class="cm">-- PostgreSQL</span>

<span class="cm">-- MySQL</span>
SET GLOBAL slow_query_log=<span class="nb">1</span>; SET GLOBAL long_query_time=<span class="nb">0.5</span>;

</tbody>
</table></div>
<pre class="code bad"><code><span class="cm">-- 인덱스를 무력화하는 패턴들</span>

WHERE user_id = <span class="st">'123'</span>                        <span class="cm">-- 타입 불일치(int 컬럼)</span>

<span class="cm">-- 복합 인덱스는 선행 컬럼부터 사용해야 함: (a, b) 인덱스는 b 단독 조회에 못 씀</span></code></pre>`);

sl('유형별','네트워크·프로토콜 버그', `
<h1><span class="no">8.41</span>네트워크·프로토콜</h1>
<div class="tw"><table class="tbl">
<thead><tr><th>증상</th><th>가능한 원인</th><th>확인</th></tr></thead>

<pre class="code sh"><code><span class="cm"># 계층별로 잘라 내려가기 (분할 정복)</span>

$ curl -v --http1.1 https://host/health                            <span class="cm"># L7</span>

$ traceroute -T -p 443 host           <span class="cm"># 경로</span>

<span class="cm"># 프로토콜 원문 보기</span>

sl('유형별','TLS·인증서 문제', `
<h1><span class="no">8.42</span>TLS·인증서</h1>
<pre class="code sh"><code><span class="cm"># 인증서 체인·만료·SAN 확인 (가장 자주 쓰는 명령)</span>

$ curl -vI https://host 2&gt;&amp;1 | grep -E <span class="st">'SSL|subject|expire'</span>
&gt; Test-NetConnection host -Port 443
&gt; (Invoke-WebRequest https://host).BaseResponse   <span class="cm"># PowerShell</span></code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>오류</th><th>원인</th><th>해결</th></tr></thead>

<tr><td><code>self signed certificate</code></td><td>사내 TLS 검사 장비</td><td>사내 루트 CA를 신뢰 저장소에 추가</td></tr>
<tr><td><code>protocol version</code></td><td>TLS 1.0/1.1 비활성</td><td>클라이언트 업그레이드</td></tr>
<tr><td>브라우저는 되는데 앱은 실패</td><td>신뢰 저장소가 다름</td><td>OS/런타임별 CA 번들 확인</td></tr>
<tr><td>일부 클라이언트만 실패</td><td>구형 OS의 루트 CA 만료</td><td>대체 체인 제공</td></tr>
</tbody>
</table></div>

<div><div class="note"><strong>중간 인증서 누락</strong>이 가장 헷갈립니다.

<div><div class="danger"><strong>검증 비활성화는 해결이 아닙니다.</strong>

<tr><td>파일명 제한</td><td><code>/</code>, NUL만</td><td><code>&lt;&gt;:"/\\|?*</code>, 예약어(CON, NUL…)</td></tr>
<tr><td>원자적 교체</td><td><code>rename()</code></td><td><code>MoveFileEx REPLACE_EXISTING</code></td></tr>
<tr><td>권한</td><td>rwx + 상위 디렉터리 x</td><td>ACL·상속</td></tr>

<pre class="code bad"><code><span class="cm"># 비원자적 쓰기 — 중간에 죽으면 파일이 깨진다</span>

<pre class="code fix"><code><span class="cm"># 임시 파일 + fsync + 원자적 교체</span>

<span class="kw">with</span> open(tmp, <span class="st">"w"</span>) <span class="kw">as</span> f:
    f.write(json.dumps(big))
    f.flush(); os.fsync(f.fileno())     <span class="cm"># 디스크까지 보장</span>
os.replace(tmp, path)                   <span class="cm"># 원자적(같은 파일시스템)</span>

sl('AI협업','스택 트레이스·로그를 주는 법', `
<h1><span class="no">9.9</span>스택 트레이스·로그 제공 요령</h1>
<div class="tw"><table class="tbl">
<thead><tr><th>자료</th><th>주는 방법</th><th>이유</th></tr></thead>
<tbody>
<tr><td>스택 트레이스</td><td><strong>전문 그대로</strong>, <code>Caused by</code>·<code>Suppressed</code> 포함</td><td>요약하면 결정적 정보가 사라짐</td></tr>
<tr><td>여러 스레드 덤프</td><td>BLOCKED/WAITING 스레드 위주로 발췌 + 전체 개수</td><td>전부 주면 신호가 묻힘</td></tr>
<tr><td>대량 로그</td><td>집계 후 상위 N + 원본 샘플 몇 줄</td><td>패턴이 먼저 보여야 함</td></tr>
<tr><td>프로파일</td><td>텍스트 상위 20줄(<code>perf report --stdio</code>)</td><td>이미지보다 정확</td></tr>
<tr><td>코어 덤프</td><td><code>bt full</code>, <code>info registers</code> 출력</td><td>덤프 파일 자체는 전달 불가</td></tr>
<tr><td>diff</td><td><code>git diff</code> 원문</td><td>“이런 걸 바꿨어요” 설명보다 정확</td></tr>
</tbody>
</table></div>
<pre class="code sh"><code><span class="cm"># 대량 로그를 "요약 + 샘플"로 압축하는 실전 명령</span>
$ rg <span class="st">'ERROR'</span> app.log | sed -E <span class="st">'s/[0-9a-f]{8,}/ID/g; s/[0-9]+/N/g'</span> \\
  | sort | uniq -c | sort -rn | head -20        <span class="cm"># 패턴별 빈도</span>
$ rg -n -C5 <span class="st">'ERROR'</span> app.log | head -60                <span class="cm"># 대표 샘플</span>

<span class="cm"># 민감정보 마스킹 후 전달</span>
$ sed -E <span class="st">'s/(Bearer |password=|token=)[^ &amp;"]+/\\1***/g; s/[0-9]{3}-[0-9]{4}-[0-9]{4}/***/g'</span> app.log &gt; safe.log</code></pre>
<div class="tip"><strong>정규화 후 집계</strong>(숫자·ID를 <code>N</code>/<code>ID</code>로 치환)가
로그 분석의 핵심 기법입니다. 10만 줄이 <em>패턴 12개</em>로 줄어들고,
그중 하나가 급증한 것이 곧 원인인 경우가 많습니다. AI에게도 이 형태가 훨씬 유용합니다.</div>`);

sl('AI협업','큰 코드베이스에서 AI 활용', `
<h1><span class="no">9.10</span>코드베이스가 클 때</h1>
<div class="fx big">문제는 “AI가 코드를 못 읽는 것”이 아니라
<strong>어디를 읽어야 하는지 아무도 모르는 것</strong>입니다.
이 결정은 여전히 <em>증상에서 출발한 국소화</em>로 합니다.</div>
<div class="tw"><table class="tbl">
<thead><tr><th>단계</th><th>사람이 할 일</th><th>AI에게 시킬 일</th></tr></thead>
<tbody>
<tr><td>① 진입점 찾기</td><td>스택 트레이스·로그에서 파일 특정</td><td>—</td></tr>
<tr><td>② 구조 파악</td><td>디렉터리 트리 제공</td><td>“이 모듈들의 역할과 의존 관계 요약”</td></tr>
<tr><td>③ 흐름 추적</td><td>관련 파일 3~5개 제공</td><td>“요청이 A에서 D까지 가는 경로 정리”</td></tr>
<tr><td>④ 후보 탐색</td><td>—</td><td>“이 패턴의 다른 사용처를 찾는 rg 명령 작성”</td></tr>
<tr><td>⑤ 가설 검증</td><td>실험 실행</td><td>결과 해석·다음 실험 제안</td></tr>
</tbody>
</table></div>
<pre class="code sh"><code><span class="cm"># AI에게 줄 "지도" 만들기 — 전체 소스보다 훨씬 유용</span>
$ tree -L 2 -I <span class="st">'node_modules|.git|target|dist'</span>
$ rg --files-with-matches <span class="st">'class OrderService|def process_order'</span>
$ rg -n <span class="st">'TODO|FIXME|HACK'</span> src/ | head -20
$ git log --oneline -20 -- src/order/          <span class="cm"># 이 영역의 최근 변경</span>
$ git log -S<span class="st">'connection_timeout'</span> --oneline           <span class="cm"># 이 문자열이 도입된 커밋</span>
$ cloc src/ --by-file | head                    <span class="cm"># 규모 파악</span></code></pre>
<div class="tip"><code>git log -S'문자열'</code>(pickaxe)은 강력합니다.
“이 설정값이 언제 왜 들어왔는가”를 즉시 찾아 줍니다.
AI에게 그 커밋 메시지와 diff를 주면 <em>맥락 있는 답</em>이 돌아옵니다.</div>`);

sl('AI협업','에이전트에게 실행을 맡길 때', `
<h1><span class="no">9.11</span>도구 실행 권한을 줄 때의 규칙</h1>
<div class="tw"><table class="tbl">
<thead><tr><th>규칙</th><th>이유</th></tr></thead>

<tr><td><strong>운영 접근 금지</strong></td><td>운영 DB·배포·결제 API에는 자격증명을 아예 주지 않음</td></tr>

<tr><td><strong>변경은 작게</strong></td><td>커밋 단위를 작게 → 리뷰·되돌리기 용이</td></tr>
<tr><td><strong>비밀은 환경에서만</strong></td><td>대화·파일에 토큰을 넣지 않음</td></tr>
</tbody>

<pre class="code sh"><code><span class="cm"># 안전한 실험 공간 만들기</span>

<span class="cm">#                                              ↑ 네트워크 차단</span>

<span class="cm"># 되돌리기</span>

<div><div class="tip"><strong>승인 흐름</strong>: 변경 제안 → <code>git diff</code> 검토 →

sl('사례','① 디스크 100%인데 du로는 안 보임', `
<h1><span class="no">10.1</span>사례 ① 유령 디스크 사용 <span class="os l">LINUX</span></h1>
<div class="cols">
<div>
<h3>증상</h3>
<ul><li><code>df -h</code>: 100% 사용</li>
<li><code>du -sh /</code>: 합계는 40%뿐</li>
<li>애플리케이션이 <code>ENOSPC</code>로 실패</li></ul>
<h3>결정적 관측</h3>
<pre class="code sh"><code>$ lsof +L1
COMMAND  PID  ...  NLINK  NODE NAME
java    4821  ...      0  1234 /var/log/app/app.log (deleted)
                       ↑ 링크 수 0 = 삭제됐지만 열려 있음 (18GB)</code></pre>
</div>
<div>
<h3>원인</h3>
<p>로그 로테이션이 파일을 <code>rm</code>했지만, 애플리케이션이 <strong>같은 fd를 계속 열어둔 채</strong> 쓰고 있어

<h3>수정</h3>
<pre class="code sh"><code><span class="cm"># 즉시 회수(재시작 없이)</span>
$ truncate -s 0 /proc/4821/fd/3
<span class="cm"># 근본 수정: logrotate에 copytruncate 또는 postrotate 시그널</span>
postrotate
    kill -USR1 $(cat /var/run/app.pid)   <span class="cm"># 앱이 파일을 다시 열게</span>
endscript</code></pre>
</div>
</div>
<div class="fx"><strong>교훈</strong>: <code>df</code>와 <code>du</code>가 어긋나면 <em>삭제됐지만 열린 파일</em>을 의심하세요.
<code>lsof +L1</code> 한 줄이 몇 시간을 아낍니다. 같은 원리로 <em>“지운 것 같은데 안 지워진”</em> 현상을 설명합니다.</div>`);

sl('사례','② cron에서만 실패한다', `

<div class="cols">
<div>
<h3>증상</h3>
<ul><li>수동 실행: 정상</li>

$ diff &lt;(env | sort) &lt;(sort /tmp/cron.env)
&lt; PATH=/home/me/.pyenv/shims:/usr/local/bin:/usr/bin
&gt; PATH=/usr/bin:/bin                 ← 완전히 다름!

LANG=ko_KR.UTF-8

sl('사례','③ 컨테이너에서만 OOMKilled', `
<h1><span class="no">10.3</span>사례 ③ 컨테이너 OOM <span class="lg">Java</span></h1>
<div class="cols">
<div>
<h3>증상</h3>
<ul><li>Pod이 주기적으로 재시작, ExitCode <strong>137</strong></li>
<li>JVM 힙 그래프는 최대 1.2GB로 안정</li>
<li>컨테이너 limit은 2GB</li></ul>
<h3>결정적 관측</h3>
<pre class="code sh"><code>$ kubectl get pod app -o jsonpath=<span class="st">'{.status.containerStatuses[0].lastState}'</span>
{"terminated":{"exitCode":137,"reason":"<span class="er">OOMKilled</span>"}}

$ jcmd 1 VM.native_memory summary     <span class="cm"># NMT 활성화 필요</span>
Java Heap  reserved=1536MB, committed=1229MB
Class      committed=  180MB          <span class="cm">← Metaspace</span>
Thread     committed=  420MB          <span class="cm">← 스레드 420개 × 1MB (!)</span>
Code       committed=   96MB
GC         committed=   72MB
Total      committed= 2010MB          <span class="cm">← limit 초과</span></code></pre>
</div>
<div>
<h3>원인</h3>
<p>힙(1.2GB)만 보고 안심했지만, <strong>힙 밖 메모리</strong>(스레드 스택 420MB + Metaspace + 코드 캐시)가
합쳐져 컨테이너 한도를 넘김. 스레드 수가 늘어난 것은 커넥션 풀·비동기 클라이언트 설정 때문.</p>
<h3>수정</h3>
<pre class="code sh"><code>-XX:MaxRAMPercentage=60          <span class="cm"># 힙을 한도의 60%로</span>
-Xss512k                         <span class="cm"># 스레드 스택 축소</span>
-XX:MaxMetaspaceSize=256m
-XX:NativeMemoryTracking=summary <span class="cm"># 상시 계측</span>

</div>
</div>
<div class="fx"><strong>교훈</strong>: 관리형 런타임의 컨테이너 OOM은 <em>대부분 힙이 아닙니다</em>.
“힙은 여유 있는데 OOMKilled”라면 <strong>NMT/RSS로 전체 그림</strong>을 보세요.

sl('사례','⑤ 테스트는 통과, 운영은 하루 밀림', `
<h1><span class="no">10.5</span>사례 ⑤ 타임존</h1>
<div class="cols">
<div>
<h3>증상</h3>
<ul><li>일일 집계가 <strong>하루씩 밀려</strong> 계산됨</li>
<li>단위 테스트는 전부 통과</li>
<li>UTC+9 지역 사용자 데이터에서만 발생</li></ul>
<h3>결정적 관측</h3>
<pre class="code"><code><span class="cm"># 운영 서버(UTC)와 테스트(KST)의 차이</span>
&gt;&gt;&gt; datetime.now()            <span class="cm"># 서버: 2026-07-30 15:10 UTC</span>
&gt;&gt;&gt; date.today()              <span class="cm"># 2026-07-30 (UTC 기준)</span>
<span class="cm"># 그러나 사용자에겐 이미 2026-07-31 00:10 (KST)</span>

<span class="cm"># DB에는 UTC로 저장, 집계 쿼리는 서버 로컬 날짜로 GROUP BY</span>
GROUP BY DATE(created_at)     <span class="cm">-- 어느 타임존의 DATE인가?</span></code></pre>
</div>
<div>
<h3>원인</h3>
<p>“하루”의 경계가 <strong>사용자 타임존</strong>에서 정의되어야 하는데
서버 로컬(UTC) 기준으로 잘림. 테스트 머신이 KST라서 우연히 맞아 보였음.</p>
<h3>수정</h3>
<pre class="code"><code><span class="cm">-- 집계 시 타임존을 명시적으로 변환</span>
GROUP BY DATE(CONVERT_TZ(created_at, <span class="st">'+00:00'</span>, <span class="st">'+09:00'</span>))
<span class="cm">-- Postgres: (created_at AT TIME ZONE 'Asia/Seoul')::date</span>

<span class="cm"># 테스트는 반드시 UTC로 고정해 실행 → 서버와 동일 조건</span>
$ TZ=UTC pytest
<span class="cm"># CI 환경변수에 TZ=UTC 고정</span></code></pre>
</div>
</div>
<div class="fx"><strong>교훈</strong>: 테스트 머신의 타임존이 운영과 다르면
<em>타임존 버그가 테스트를 통과합니다</em>. CI에 <code>TZ=UTC</code>를 고정하고,
날짜 경계 로직은 <strong>명시적 타임존</strong>으로 작성하세요.
“오늘”은 언제나 <em>누구의 오늘인지</em> 답할 수 있어야 합니다.</div>`);

sl('사례','⑦ 재시도가 만든 중복 결제', `
<h1><span class="no">10.7</span>사례 ⑦ 멱등성 부재</h1>
<div class="cols">
<div>
<h3>증상</h3>
<ul><li>342건 중 7건이 <strong>이중 청구</strong></li>
<li>공통점: 결제사 응답이 3초 이상 걸린 요청</li>
<li>최근 변경: 재시도 정책 추가</li></ul>
<h3>결정적 관측</h3>
<pre class="code"><code><span class="cm"># 재시도별 Idempotency-Key 로깅 결과</span>
attempt=1 idem=<span class="er">7f3a-...-91</span> status=timeout
attempt=2 idem=<span class="er">c02b-...-4e</span> status=200   ← 키가 다르다!
<span class="cm"># 결제사는 서로 다른 요청으로 인식 → 두 번 청구</span></code></pre>
</div>
<div>
<h3>원인</h3>
<p>재시도 인터셉터가 <strong>요청 빌드 단계부터 재실행</strong>해서
<code>UUID.randomUUID()</code>가 매번 새 값을 생성.
첫 시도는 실제로 <em>성공했지만 응답만 유실</em>된 상태였음.</p>
<h3>수정</h3>
<pre class="code fix"><code><span class="cm">// 멱등성 키를 요청 진입점에서 1회 생성</span>
String idem = req.header(<span class="st">"Idempotency-Key"</span>)
                .orElseGet(() -&gt; UUID.randomUUID().toString());
ctx.put(<span class="st">"idem"</span>, idem);         <span class="cm">// 재시도는 이 값을 재사용</span>
<span class="cm">// 서버 측: idem_key UNIQUE 제약 + 기존 결과 반환</span></code></pre>
</div>
</div>
<div class="fx"><strong>교훈</strong>: <em>“응답을 못 받았다 ≠ 처리되지 않았다”</em>.
네트워크 타임아웃 뒤의 재시도는 <strong>반드시 멱등</strong>해야 합니다.
재시도를 도입할 때는 항상 “두 번 실행되면 어떻게 되는가”를 먼저 답하세요.</div>`);

sl('사례','⑧ 목록 API가 갈수록 느려진다', `
<h1><span class="no">10.8</span>사례 ⑧ N+1과 인덱스</h1>
<div class="cols">
<div>
<h3>증상</h3>
<ul><li>주문 목록 API가 데이터 증가와 함께 선형 악화</li>
<li>100건: 200ms → 1000건: 2.4s</li>
<li>CPU는 낮고 DB 대기가 대부분</li></ul>
<h3>결정적 관측</h3>
<pre class="code sh"><code><span class="cm"># 요청당 쿼리 수 로깅 추가</span>
[req a1b2] queries=<span class="er">1002</span> total_db_ms=2210
<span class="cm"># 쿼리 정규화 집계</span>
$ rg <span class="st">'^SELECT'</span> sql.log | sed <span class="st">'s/[0-9]\\+/?/g'</span> | sort | uniq -c | sort -rn
   <span class="er">1000</span> SELECT * FROM users WHERE id = ?
      1 SELECT * FROM orders LIMIT ?
      1 SELECT COUNT(*) FROM orders</code></pre>
</div>
<div>
<h3>원인 두 가지</h3>
<ol>
<li><strong>N+1</strong>: 주문마다 사용자 지연 로딩</li>
<li>수정 후에도 느림 → <code>EXPLAIN</code> 결과
<code>Seq Scan on orders</code>: <code>created_at</code> 인덱스 없음</li>
</ol>
<h3>수정</h3>
<pre class="code fix"><code><span class="cm">// ① 배치 로딩</span>
Map&lt;Long,User&gt; users = userRepo.findAllById(userIds)
    .stream().collect(toMap(User::getId, u-&gt;u));
<span class="cm">// ② 인덱스</span>
CREATE INDEX idx_orders_created ON orders(created_at DESC, id DESC);
<span class="cm">// ③ 커서 페이지네이션 (OFFSET 대신)</span>
WHERE (created_at, id) &lt; (?, ?) ORDER BY created_at DESC, id DESC LIMIT <span class="nb">50</span>;</code></pre>
</div>
</div>
<div class="fx"><strong>교훈</strong>: 성능 문제는 <strong>원인이 둘 이상</strong>인 경우가 흔합니다.
하나를 고쳐 절반만 개선되면 “실패”가 아니라 <em>남은 문제를 새로 조사</em>할 신호입니다.
그리고 <strong>요청당 쿼리 수</strong>는 가장 값싼 상시 지표입니다.</div>`);

sl('사례','⑨ 스레드풀에서 새는 ThreadLocal', `
<h1><span class="no">10.9</span>사례 ⑨ ThreadLocal 누수 <span class="lg">Java</span></h1>
<div class="cols">
<div>
<h3>증상</h3>
<ul><li>힙이 하루 단위로 서서히 증가</li>
<li>Full GC로도 회수 안 됨</li>
<li>재시작하면 정상 → 며칠 뒤 반복</li></ul>
<h3>결정적 관측</h3>
<pre class="code sh"><code>&gt; dumpheap -stat | head
  Count  TotalSize  Class
 <span class="er">120384</span>  <span class="er">385 MB</span>   com.app.RequestContext

&gt; gcroot 0x00000007a1b2c3d4
  -&gt; java.lang.Thread @0x... (http-nio-exec-42)
     -&gt; java.lang.ThreadLocal$ThreadLocalMap
        -&gt; com.app.RequestContext        ← 스레드가 붙잡고 있음</code></pre>
</div>
<div>
<h3>원인</h3>
<p><code>ThreadLocal</code>에 요청 컨텍스트를 넣고 <strong>제거하지 않음</strong>.
스레드풀의 스레드는 재사용되며 <em>영원히 살아 있으므로</em>
컨텍스트가 계속 누적됨(스레드 수 × 컨텍스트 크기).</p>
<h3>수정</h3>
<pre class="code fix"><code><span class="kw">try</span> {
    CONTEXT.set(ctx);
    chain.doFilter(req, res);
} <span class="kw">finally</span> {
    CONTEXT.remove();          <span class="cm">// ★ 반드시 finally에서</span>
    MDC.clear();               <span class="cm">// 로깅 컨텍스트도 함께</span>
}</code></pre>
</div>
</div>
<div class="fx"><strong>교훈</strong>: <em>스레드풀 + ThreadLocal</em>은 고전적 누수 조합입니다.
같은 원리가 <strong>비동기 컨텍스트</strong>(Node의 AsyncLocalStorage, Python contextvars)에도 적용됩니다.
“설정한 곳에서 반드시 정리한다”를 <code>finally</code>/<code>defer</code>/<code>with</code>로 <em>언어가 보장</em>하게 하세요.</div>`);

sl('사례','⑩ Go 맵 동시 쓰기로 프로세스 즉사', `
<h1><span class="no">10.10</span>사례 ⑩ concurrent map writes <span class="lg">Go</span></h1>
<div class="cols">
<div>
<h3>증상</h3>
<pre class="code"><code><span class="er">fatal error: concurrent map writes</span>
goroutine 187 [running]:
main.(*Cache).Set(...)  /app/cache.go:31
<span class="cm">// panic이 아니라 fatal error → recover 불가, 프로세스 즉시 종료</span></code></pre>
<h3>결정적 관측</h3>
<pre class="code sh"><code>$ go test -race ./cache
<span class="er">WARNING: DATA RACE</span>
Write at 0x00c000180000 by goroutine 12:
  main.(*Cache).Set  cache.go:31
Previous write by goroutine 8:
  main.(*Cache).Set  cache.go:31</code></pre>
</div>
<div>
<h3>원인</h3>
<p>Go 런타임은 맵의 동시 쓰기를 <strong>고의로 감지해 즉시 죽입니다</strong>
(조용한 손상보다 낫다는 설계 판단). 캐시 구조체에 락이 없었음.</p>
<h3>수정</h3>
<pre class="code fix"><code><span class="kw">type</span> Cache <span class="kw">struct</span> {
    mu sync.RWMutex
    m  <span class="kw">map</span>[<span class="kw">string</span>]<span class="kw">string</span>
}
<span class="kw">func</span> (c *Cache) Get(k <span class="kw">string</span>) (<span class="kw">string</span>, <span class="kw">bool</span>) {
    c.mu.RLock(); <span class="kw">defer</span> c.mu.RUnlock()
    v, ok := c.m[k]; <span class="kw">return</span> v, ok
}
<span class="kw">func</span> (c *Cache) Set(k, v <span class="kw">string</span>) {
    c.mu.Lock(); <span class="kw">defer</span> c.mu.Unlock()
    c.m[k] = v
}
<span class="cm">// 또는 sync.Map (읽기 위주 워크로드에 적합)</span></code></pre>
</div>
</div>
<div class="fx"><strong>교훈</strong>: Go는 이 실수를 <em>즉시 시끄럽게</em> 알려줍니다 — 좋은 설계입니다.
그러나 운영에서 프로세스가 죽는 형태이므로, <strong>CI에 <code>-race</code></strong>를 넣어
개발 단계에서 잡는 것이 유일한 예방책입니다.</div>`);

sl('사례','⑪ Windows 서비스만 파일을 못 찾음', `
<h1><span class="no">10.11</span>사례 ⑪ 작업 디렉터리 <span class="os w">WIN</span></h1>
<div class="cols">
<div>
<h3>증상</h3>
<ul><li>콘솔 실행: 정상</li>
<li>서비스로 실행: <code>config.yaml not found</code></li>
<li>파일은 exe 옆에 분명히 존재</li></ul>
<h3>결정적 관측</h3>
<pre class="code sh"><code><span class="cm">; Process Monitor 필터: Path ends with "config.yaml"</span>
app.exe  CreateFile  <span class="er">C:\\Windows\\System32\\config.yaml</span>  NAME NOT FOUND
<span class="cm">;              ↑ 서비스의 작업 디렉터리는 System32!</span></code></pre>
</div>
<div>
<h3>원인</h3>
<p>서비스는 기본 작업 디렉터리가 <code>C:\\Windows\\System32</code>입니다.
상대 경로 <code>./config.yaml</code>이 전혀 다른 곳을 가리킴.</p>
<h3>수정</h3>
<pre class="code fix"><code><span class="cm">// 실행 파일 위치 기준 절대 경로 사용</span>
<span class="kw">wchar_t</span> exePath[MAX_PATH];
GetModuleFileNameW(<span class="kw">NULL</span>, exePath, MAX_PATH);
PathRemoveFileSpecW(exePath);
PathCombineW(cfgPath, exePath, L<span class="st">"config.yaml"</span>);

<span class="cm">// .NET:  AppContext.BaseDirectory</span>
<span class="cm">// Java:  ProtectionDomain.getCodeSource().getLocation()</span>
<span class="cm">// Python: Path(__file__).resolve().parent</span>
<span class="cm">// Go:    os.Executable()</span></code></pre>
</div>
</div>
<div class="fx"><strong>교훈</strong>: <strong>상대 경로는 “실행 위치”가 아니라 “현재 작업 디렉터리” 기준</strong>입니다.
서비스·cron·컨테이너·IDE에서 각각 다르므로, 설정·리소스 경로는
<em>실행 파일 기준 절대 경로</em>나 명시적 환경변수로 해결하세요.
Linux에서도 <code>/proc/PID/cwd</code>로 같은 문제를 확인합니다.</div>`);

sl('사례','⑫ 정규식 하나가 서버를 멈춤 (ReDoS)', `
<h1><span class="no">10.12</span>사례 ⑫ 백트래킹 폭발</h1>
<div class="cols">
<div>
<h3>증상</h3>
<ul><li>특정 요청 이후 CPU 100%, 응답 없음</li>
<li>재시작하면 정상 → 같은 요청에 재발</li>
<li>입력 길이가 조금만 길어지면 급격히 악화</li></ul>
<h3>결정적 관측</h3>
<pre class="code sh"><code>$ py-spy dump --pid 1234
Thread 1234 (active)
  match (re.py:191)
  validate_email (validators.py:23)   ← 정규식에서 멈춤

<span class="cm"># 길이별 소요 시간 측정 → 지수적 증가 확인</span>
len=20: 0.001s   len=24: 0.02s   len=28: 0.4s
len=32: 6.5s     len=36: 100s+   ← 2^n</code></pre>
</div>
<div>
<h3>원인</h3>
<pre class="code bad"><code>^(a+)+$          <span class="cm"># 중첩 수량자 → 카탈로그적 백트래킹</span>
^([a-zA-Z0-9]+\\s?)+$
(\\w+\\s*)*@       <span class="cm"># 이메일 검증에서 흔한 패턴</span></code></pre>
<p>백트래킹 엔진에서 <em>같은 문자열을 나누는 방법이 지수적으로</em> 존재해
매칭 실패 시 모든 조합을 시도합니다.</p>
<h3>수정</h3>
<pre class="code fix"><code><span class="cm"># ① 중첩 수량자 제거, 소유 수량자/원자 그룹</span>
^[a-zA-Z0-9 ]+$
<span class="cm"># ② 길이 제한을 먼저</span>
<span class="kw">if</span> len(s) &gt; <span class="nb">254</span>: reject
<span class="cm"># ③ 선형 시간 엔진 사용 (Go regexp=RE2, Rust regex)</span>
<span class="cm"># ④ 타임아웃 지원 엔진(.NET Regex(…, TimeSpan))</span></code></pre>
</div>
</div>
<div class="fx"><strong>교훈</strong>: CPU 100% + 스택이 정규식이면 즉시 ReDoS를 의심하세요.
<em>사용자 입력을 정규식으로 검증할 때</em>는 항상 길이 제한과 패턴 검토가 필요합니다.
Go/Rust처럼 <strong>선형 시간 보장 엔진</strong>은 이 문제 자체를 없앱니다.</div>`);

sl('사례','⑬ 페이지네이션에서 항목이 중복·누락', `
<h1><span class="no">10.13</span>사례 ⑬ 불안정한 정렬 키</h1>
<div class="cols">
<div>
<h3>증상</h3>
<ul><li>페이지 1과 2에 <strong>같은 항목</strong>이 등장</li>
<li>어떤 항목은 아예 안 보임</li>
<li>데이터가 자주 바뀔수록 심함</li></ul>
<pre class="code bad"><code>SELECT * FROM orders
ORDER BY created_at DESC
LIMIT <span class="nb">20</span> OFFSET <span class="nb">40</span>;
<span class="cm">-- created_at 이 같은 행이 여러 개면 순서가 매번 달라짐</span>
<span class="cm">-- + OFFSET 사용 중 새 행이 삽입되면 전체가 밀림</span></code></pre>
</div>
<div>
<h3>수정</h3>
<pre class="code fix"><code><span class="cm">-- ① tie-breaker 추가 (고유 컬럼)</span>
ORDER BY created_at DESC, id DESC

<span class="cm">-- ② 커서(키셋) 페이지네이션 — OFFSET 제거</span>
SELECT * FROM orders
WHERE (created_at, id) &lt; (:last_created, :last_id)
ORDER BY created_at DESC, id DESC
LIMIT <span class="nb">20</span>;
<span class="cm">-- 삽입·삭제와 무관하게 안정적, 큰 OFFSET의 성능 문제도 해결</span></code></pre>
<div class="note">인덱스도 <code>(created_at DESC, id DESC)</code>로 맞춰야
정렬 없이 스캔됩니다.</div>
</div>
</div>
<div class="tw"><table class="tbl">
<thead><tr><th>같은 원리가 적용되는 곳</th></tr></thead>
<tbody>
<tr><td>API 목록 응답, 무한 스크롤, 데이터 내보내기, 배치 재처리</td></tr>
<tr><td>Elasticsearch <code>search_after</code>, Kafka 오프셋, S3 <code>continuation-token</code></td></tr>
</tbody>
</table></div>
<div class="fx"><strong>교훈</strong>: 정렬 키가 <strong>고유하지 않으면</strong> 순서는 보장되지 않습니다.
“가끔 중복/누락”이라는 증상에서 즉시 이 패턴을 떠올릴 수 있어야 합니다.
그리고 대용량에서는 <code>OFFSET</code> 자체가 성능 문제이므로 커서 방식이 정답입니다.</div>`);

sl('사례','⑭ 다른 사용자의 데이터가 보인다', `
<h1><span class="no">10.14</span>사례 ⑭ 캐시 키 누락 (보안 사고)</h1>
<div class="danger">이 사례는 성능 버그가 아니라 <strong>보안 사고</strong>입니다.
발견 즉시 캐시를 비우고 영향 범위를 조사해야 합니다.</div>
<div class="cols">
<div>
<h3>증상</h3>
<ul><li>사용자 A가 <strong>B의 대시보드</strong>를 봄</li>
<li>새로고침하면 정상으로 돌아옴</li>
<li>트래픽이 많은 시간대에만 발생</li></ul>
<h3>결정적 관측</h3>
<pre class="code"><code><span class="cm"># 캐시 키를 로그로 출력</span>
cache_key=<span class="er">"dashboard:2026-07-30"</span>   ← 사용자 식별자 없음!
<span class="cm"># 응답 헤더</span>
Cache-Control: <span class="er">public</span>, max-age=60   ← CDN까지 공유됨</code></pre>
</div>
<div>
<h3>원인</h3>
<p>개인화된 응답을 <strong>전역 키</strong>로 캐시. 먼저 요청한 사용자의 결과가
다음 사용자에게 그대로 반환됨. <code>Cache-Control: public</code> 때문에 CDN에도 저장.</p>
<h3>수정</h3>
<pre class="code fix"><code>cache_key = f<span class="st">"dashboard:v3:{tenant}:{user_id}:{locale}:{role_hash}:{date}"</span>
<span class="cm"># 응답 헤더</span>
Cache-Control: private, no-store       <span class="cm"># 개인화 응답은 공유 캐시 금지</span>
Vary: Authorization, Accept-Language</code></pre>
<div class="tip"><strong>사고 대응</strong>: 캐시 전체 무효화 → 로그로 영향받은 사용자 추정 →
보안·법무 보고 → 재발 방지(키 생성 함수 일원화 + 테스트).</div>
</div>
</div>
<div class="fx"><strong>교훈</strong>: 캐시 키에는 <strong>결과에 영향을 주는 모든 입력</strong>이 들어가야 합니다.
특히 <em>사용자·테넌트·권한·언어</em>. 이 규칙을 코드로 강제하려면
캐시 키 생성 함수를 하나로 만들고 <em>사용자 컨텍스트를 필수 인자</em>로 두세요.</div>`);

sl('사례','⑮ 브라우저는 되는데 서버는 SSL 실패', `
<h1><span class="no">10.15</span>사례 ⑮ 중간 인증서 누락</h1>
<div class="cols">
<div>
<h3>증상</h3>
<ul><li>브라우저에서는 정상 접속</li>
<li>서버 간 호출은 <code>unable to get local issuer certificate</code></li>
<li>일부 모바일 기기에서도 실패</li></ul>
<h3>결정적 관측</h3>
<pre class="code sh"><code>$ openssl s_client -connect api.partner.com:443 \\
    -servername api.partner.com &lt;/dev/null 2&gt;/dev/null | head -20
Certificate chain
 0 s:CN=api.partner.com
   i:CN=R3 Intermediate CA
<span class="er">(체인 끝 — 중간 인증서가 없음)</span>
<span class="cm"># 정상이라면 1 s:CN=R3 Intermediate CA 가 있어야 함</span></code></pre>
</div>
<div>
<h3>원인</h3>
<p>서버가 <strong>리프 인증서만</strong> 전송. 브라우저는 이전에 캐시했거나
AIA fetch로 중간 인증서를 스스로 가져오지만,
대부분의 서버 라이브러리·모바일은 그러지 않아 검증 실패.</p>
<h3>수정</h3>
<pre class="code sh"><code><span class="cm"># nginx: 리프 + 중간을 한 파일로</span>
$ cat leaf.crt intermediate.crt &gt; fullchain.crt
ssl_certificate /etc/ssl/fullchain.crt;
$ nginx -t &amp;&amp; nginx -s reload
<span class="cm"># 검증</span>

</div>

</div>
</div>

sl('사례','㉛ idle in transaction으로 커넥션 고갈', `
<h1><span class="no">10.31</span>사례 ㉛ 열린 채 방치된 트랜잭션</h1>
<div class="cols">
<div>
<h3>증상</h3>
<ul><li>풀이 가득 차 요청 대기</li>
<li>DB의 활성 쿼리는 <strong>0개</strong></li>
<li>느린 쿼리 로그도 비어 있음</li></ul>
<h3>결정적 관측</h3>
<pre class="code sh"><code>SELECT state, count(*), max(now()-state_change) AS max_age
FROM pg_stat_activity GROUP BY state;
 state                | count |  max_age
----------------------+-------+-----------
 <span class="er">idle in transaction</span>  |    <span class="er">12</span> | <span class="er">00:41:22</span>   ← 41분째 트랜잭션 유지
 idle                 |     3 |
 active               |     0 |</code></pre>
</div>
<div>
<h3>원인</h3>
<pre class="code bad"><code>tx = conn.begin()
data = fetch_from_external_api()   <span class="cm"># 트랜잭션 안에서 외부 호출!</span>

tx.commit()</code></pre>
<h3>수정</h3>
<pre class="code fix"><code><span class="cm"># ① 외부 호출을 트랜잭션 밖으로</span>
data = fetch_from_external_api()
<span class="kw">with</span> conn.begin():           <span class="cm"># 컨텍스트 매니저로 보장</span>
    save(data)

<span class="cm"># ② DB 레벨 안전장치</span>
ALTER ROLE app SET idle_in_transaction_session_timeout = <span class="st">'30s'</span>;
ALTER ROLE app SET statement_timeout = <span class="st">'10s'</span>;
<span class="cm"># ③ 풀 누수 감지: leak-detection-threshold</span></code></pre>
</div>
</div>
<div class="fx"><strong>교훈</strong>: 트랜잭션은 <strong>가능한 짧게</strong>, 그리고 <em>외부 I/O를 절대 포함하지 않게</em>.
DB 쪽 타임아웃(<code>idle_in_transaction_session_timeout</code>)을 설정해 두면
같은 실수가 전체 장애로 번지는 것을 막습니다.</div>`);

sl('사례','㉜ 인덱스가 있는데 안 쓴다', `
<h1><span class="no">10.32</span>사례 ㉜ 타입 불일치로 인덱스 무력화</h1>
<div class="cols">
<div>
<h3>증상</h3>
<ul><li>인덱스를 만들었는데 쿼리가 여전히 느림</li>
<li><code>EXPLAIN</code>에 <code>Seq Scan</code></li>
<li>같은 쿼리를 DB 콘솔에서 실행하면 빠름(!)</li></ul>
<h3>결정적 관측</h3>
<pre class="code sh"><code>EXPLAIN ANALYZE
SELECT * FROM orders WHERE user_id = <span class="st">'8123'</span>;   <span class="cm">-- 문자열 리터럴</span>
 <span class="er">Seq Scan</span> on orders (cost=0..24418 rows=1 width=..)
   Filter: ((user_id)::text = <span class="st">'8123'</span>::text)      <span class="cm">-- 컬럼을 캐스팅!</span>

SELECT * FROM orders WHERE user_id = <span class="nb">8123</span>;     <span class="cm">-- 정수</span>
 <span class="ok">Index Scan</span> using idx_orders_user on orders</code></pre>
</div>
<div>
<h3>원인</h3>
<p>ORM이 파라미터를 문자열로 바인딩. DB가 <strong>컬럼 쪽을 캐스팅</strong>하면
인덱스를 쓸 수 없습니다(함수 적용과 동일한 효과).</p>
<h3>같은 부류의 함정</h3>
<pre class="code"><code>WHERE DATE(created_at) = <span class="st">'2026-07-30'</span>     <span class="cm">-- 컬럼에 함수</span>
WHERE UPPER(email) = <span class="st">'A@B.COM'</span>            <span class="cm">-- 함수 인덱스 필요</span>
WHERE amount + <span class="nb">0</span> = <span class="nb">100</span>                  <span class="cm">-- 연산</span>
WHERE col LIKE <span class="st">'%foo'</span>                     <span class="cm">-- 선행 와일드카드</span>
WHERE col COLLATE X = ?                    <span class="cm">-- 콜레이션 불일치</span></code></pre>
</div>
</div>
<div class="fx"><strong>교훈</strong>: 인덱스를 만들었다고 쓰이는 것이 아닙니다.
<strong>반드시 <code>EXPLAIN (ANALYZE)</code>로 확인</strong>하고,
<em>Filter 절에 컬럼 캐스팅이나 함수가 보이면</em> 인덱스는 무력화된 것입니다.
“콘솔에서는 빠른데 앱에서는 느리다”면 바인딩 타입을 의심하세요.</div>`);

sl('사례','㉝ 롤링 배포 중 스키마 불일치', `
<h1><span class="no">10.33</span>사례 ㉝ 배포 중 버전 혼재</h1>
<div class="cols">
<div>
<h3>증상</h3>
<ul><li>배포 진행 중 5분간 <strong>일부</strong> 요청만 500</li>
<li>배포 완료 후 저절로 정상화</li>
<li>에러: <code>column "phone_number" does not exist</code></li></ul>
<h3>원인</h3>
<pre class="code"><code>마이그레이션: ALTER TABLE users RENAME phone TO phone_number;
배포 순서:
  T0  마이그레이션 실행 (컬럼 이름 변경)
  T1  새 코드 Pod 3개 시작       → 정상
  T2  <span class="er">구 코드 Pod 3개 아직 실행 중</span>  → phone 컬럼 참조 → 실패
  T5  전부 교체 완료             → 정상</code></pre>
</div>
<div>
<h3>수정 — 확장·수축 패턴</h3>
<pre class="code fix"><code><span class="kw">1단계(확장)</span>: 새 컬럼 추가 + 양쪽에 쓰기
    ALTER TABLE users ADD COLUMN phone_number text;
    -- 앱: phone과 phone_number 모두에 쓰기, 읽기는 phone
<span class="kw">2단계</span>: 기존 데이터 백필
<span class="kw">3단계</span>: 읽기를 phone_number로 전환 (배포)
<span class="kw">4단계(수축)</span>: 모든 인스턴스가 신버전임을 확인 후
    ALTER TABLE users DROP COLUMN phone;</code></pre>
<div class="note">각 단계 사이에는 <strong>구·신 버전이 동시에 동작 가능</strong>해야 합니다.
이것이 무중단 배포의 핵심 제약입니다.</div>
</div>
</div>
<div class="fx"><strong>교훈</strong>: 롤링 배포에서는 항상 <strong>N과 N+1 버전이 공존</strong>합니다.
따라서 모든 스키마·API·메시지 변경은 <em>양방향 호환</em>이어야 합니다.
“배포 중에만 에러”라는 증상은 이 규칙 위반의 신호입니다.</div>`);

sl('사례','㉞ 모바일 업로드가 중간에 사라짐', `
<h1><span class="no">10.34</span>사례 ㉞ 백그라운드 종료</h1>
<div class="cols">
<div>
<h3>증상</h3>

  <span class="er">empty #17</span>              ← 백그라운드 프로세스로 회수됨

<pre class="code fix"><code><span class="cm">// Android: WorkManager (프로세스 종료 후에도 재개)</span>
<span class="kw">val</span> req = OneTimeWorkRequestBuilder&lt;UploadWorker&gt;()
    .setConstraints(Constraints.Builder()
        .setRequiredNetworkType(NetworkType.CONNECTED).build())
    .setBackoffCriteria(BackoffPolicy.EXPONENTIAL, <span class="nb">30</span>, TimeUnit.SECONDS)
    .build()
WorkManager.getInstance(ctx).enqueue(req)

<span class="cm">// iOS: URLSession background configuration</span>
<span class="cm">// + 서버: 이어올리기(resumable upload) 지원</span></code></pre>
</div>
</div>

“예외가 없으니 정상 종료”가 아닙니다. 중요한 작업은
<em>OS가 보장하는 작업 스케줄러</em>에 위임하고, 서버는 <em>재개 가능</em>하게 설계하세요.</div>`);

sl('사례','㉟ 임베디드 워치독 리셋 추적', `
<h1><span class="no">10.35</span>사례 ㉟ 원인 모를 재부팅</h1>
<div class="cols">
<div>
<h3>증상</h3>
<ul><li>장비가 며칠에 한 번 재부팅</li>
<li>로그는 부팅 메시지부터 시작(이전 기록 없음)</li>
<li>재현 불가</li></ul>
<h3>추적 — 부팅 시 원인 기록</h3>
<pre class="code"><code><span class="cm">/* ① 리셋 원인 레지스터를 부팅 직후 읽어 보존 */</span>
uint32_t rcc = RCC-&gt;CSR;
<span class="kw">if</span> (rcc &amp; RCC_CSR_IWDGRSTF) log_boot(<span class="st">"IWDG(워치독) 리셋"</span>);
<span class="kw">if</span> (rcc &amp; RCC_CSR_SFTRSTF)  log_boot(<span class="st">"소프트웨어 리셋"</span>);
<span class="kw">if</span> (rcc &amp; RCC_CSR_BORRSTF)  log_boot(<span class="st">"브라운아웃(전원)"</span>);
RCC-&gt;CSR |= RCC_CSR_RMVF;      <span class="cm">/* 플래그 클리어 */</span>

<span class="cm">/* ② 워치독 리셋 직전 상태를 보존 RAM에 남기기 */</span>
<span class="kw">volatile</span> <span class="kw">struct</span> { uint32_t magic, task_id, tick; <span class="kw">char</span> stage[<span class="nb">16</span>]; }
    __attribute__((section(<span class="st">".noinit"</span>))) g_last;</code></pre>
</div>
<div>
<h3>결정적 관측</h3>
<pre class="code"><code>[BOOT] reset=IWDG  last.task=<span class="er">3</span> last.stage=<span class="st">"tls_handshake"</span> tick=48213
<span class="cm">/* 태스크 3이 TLS 핸드셰이크 중 워치독 타임아웃 */</span></code></pre>
<h3>원인·수정</h3>
<p>서버 응답 지연 시 TLS 핸드셰이크가 워치독 주기(2초)를 초과.
→ ① 네트워크 작업을 별도 태스크로 분리하고 워치독 급여를 유지,
② 소켓 타임아웃을 워치독 주기보다 짧게, ③ 단계별 진행 상황을 보존 RAM에 기록.</p>
</div>
</div>
<div class="fx"><strong>교훈</strong>: “로그가 없는 재시작”은 <strong>로그를 남길 수 없는 방식으로 죽었다</strong>는 뜻입니다.
전원·워치독·커널 패닉·OOM killer가 후보이며,
각각 <em>재부팅 후에 읽을 수 있는 흔적</em>(레지스터·보존 RAM·커널 로그)을 남깁니다.
그 흔적을 읽는 코드를 미리 넣어 두는 것이 유일한 해법입니다.</div>`);

sl('사례','㊲ GC 설정 변경 후 p99 폭증', `

<div class="cols">
<div>
<h3>증상</h3>

<li>평균 지연은 개선, <strong>p99가 3배</strong> 악화</li>

<h3>결정적 관측</h3>
<pre class="code sh"><code>$ rg <span class="st">'Pause Full'</span> gc.log | tail -3
[Pause Full (System.gc()) 28G-&gt;12G(32G) <span class="er">2143.7ms</span>]
<span class="cm"># Full GC 시간이 힙 크기에 비례해 증가</span>
$ jstat -gcutil PID 1000
  O    97.2   → Full GC → 40.1 → 다시 상승 (2분 주기)</code></pre>
</div>

<pre class="code fix"><code>-XX:+UseG1GC -XX:MaxGCPauseMillis=<span class="nb">200</span>
-Xmx<span class="nb">8</span>g                              <span class="cm"># 무작정 크게가 아니라 적정 크기</span>
-XX:+DisableExplicitGC                <span class="cm"># System.gc() 무시</span>
-Xlog:gc*:file=gc.log:time,uptime
<span class="cm"># 지연이 최우선이면 ZGC/Shenandoah 검토 (정지 시간 &lt; 10ms)</span>
-XX:+UseZGC</code></pre>
</div>
</div>
<div class="fx"><strong>교훈</strong>: <strong>“자원을 늘리면 빨라진다”는 항상 참이 아닙니다.</strong>
힙 크기·스레드 수·풀 크기·배치 크기는 모두 <em>최적점</em>이 있습니다.
변경 전후를 <strong>같은 지표(특히 p99)</strong>로 측정하지 않으면

<li>복구가 계속 실패</li></ul>
<h3>원인</h3>
<pre class="code bad"><code>ws.onclose = () =&gt; {
  setTimeout(connect, <span class="nb">1000</span>);   <span class="cm">// 모든 클라이언트가 정확히 1초 뒤</span>
};

</div>
<div>

<pre class="code fix"><code><span class="kw">let</span> attempt = <span class="nb">0</span>;
<span class="kw">function</span> scheduleReconnect(){
  <span class="kw">const</span> base = Math.min(<span class="nb">30000</span>, <span class="nb">1000</span> * <span class="nb">2</span> ** attempt++);
  <span class="kw">const</span> delay = Math.random() * base;      <span class="cm">// full jitter</span>
  setTimeout(connect, delay);
}
ws.onopen = () =&gt; { attempt = <span class="nb">0</span>; };        <span class="cm">// 성공 시 초기화</span>
<span class="cm">// 서버: 연결 수락 속도 제한(rate limit), 점진적 워밍업</span></code></pre>

</div>

<h1><span class="no">13.8</span>Linux 최종 카드 <span class="os l">LINUX</span></h1>
<div class="cols">
<div>
<pre class="code sh"><code><span class="cm"># 크래시</span>
ulimit -c unlimited; coredumpctl gdb NAME
gdb ./app core -batch -ex <span class="st">'bt full'</span> -ex <span class="st">'thread apply all bt'</span>
gcc -g -fsanitize=address,undefined ...

<span class="cm"># 행 / 데드락</span>
gdb -p PID -batch -ex <span class="st">'thread apply all bt'</span>
jstack -l PID | tee d1.txt        <span class="cm"># 10초 간격 3회</span>
py-spy dump --pid PID
curl :6060/debug/pprof/goroutine?debug=2

<span class="cm"># 느림</span>
perf stat -d ./app
perf record -F 999 -g -p PID -- sleep 30; perf report
offcputime-bpfcc -p PID 30
strace -c -f -p PID

<span class="cm"># 메모리</span>
valgrind --leak-check=full --track-origins=yes ./app
heaptrack ./app
grep -E <span class="st">'Rss|Pss'</span> /proc/PID/smaps_rollup
dmesg -T | grep -i <span class="st">'killed process'</span></code></pre>
</div>
<div>
<pre class="code sh"><code><span class="cm"># 파일 / 권한</span>
strace -f -e trace=file ./app 2&gt;&amp;1 | grep -v ENOENT
namei -l /path/to/file
lsof -p PID; lsof +L1; ls /proc/PID/fd | wc -l
getenforce; ausearch -m AVC -ts recent

<span class="cm"># 네트워크</span>
ss -tanp; ss -s; ss -ti dst HOST
tcpdump -i any -nn <span class="st">'port 5432'</span> -c 50 -w x.pcap
curl -v -o /dev/null -s -w <span class="st">'%{time_total}\\n'</span> URL
dig +trace HOST

<span class="cm"># 프로세스 진실</span>
ls -l /proc/PID/exe /proc/PID/cwd
tr <span class="st">'\\0'</span> <span class="st">'\\n'</span> &lt; /proc/PID/environ
cat /proc/PID/limits

<span class="cm"># 원인 커밋</span>
git bisect start HEAD v1.4.0
git bisect run ./repro.sh

<span class="cm"># 값이 언제 바뀌었나</span>

rr record ./app &amp;&amp; rr replay   <span class="cm"># reverse-continue</span></code></pre>
</div>
</div>`);

/* ---- 이분 탐색(git bisect) 시뮬레이터 ---- */
DEMOS.bisect = function(box){
  var q = function(s){ return box.querySelector('[data-r="' + s + '"]'); };
  var st = { n:64, bad:0, lo:0, hi:63, cur:0, steps:0, done:false };
  function reset(){
    st.n = +q('n').value;
    st.bad = 1 + Math.floor(seededRandom() * (st.n - 1));
    st.lo = 0; st.hi = st.n - 1; st.steps = 0; st.done = false;
    st.cur = Math.floor((st.lo + st.hi) / 2);
    render('새 버그를 심었습니다. 커밋 0은 정상(good), 커밋 ' + (st.n-1) + '은 버그(bad)로 가정합니다.');
  }
  var seed = 12345;
  function seededRandom(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  function render(msg){
    q('range').textContent = '남은 후보: [' + st.lo + ' … ' + st.hi + '] (' + (st.hi - st.lo + 1) + '개)  ▶ 지금 테스트할 커밋: #' + st.cur;
    var expected = Math.ceil(Math.log2(st.n));
    var out = q('out');
    var bar = '';
    var width = Math.min(st.n, 64);
    for (var i = 0; i < width; i++){
      var idx = Math.floor(i * st.n / width);
      var ch = (idx < st.lo || idx > st.hi) ? '·' : (idx === st.cur ? '▓' : '░');
      bar += ch;
    }
    out.innerHTML = (msg ? msg + '\n\n' : '') +
      '커밋 ' + st.n + '개 | 이분 탐색 예상 횟수 log₂(' + st.n + ') ≈ <b>' + expected + '</b>회 | 순차 탐색 평균 <b>' + Math.round(st.n/2) + '</b>회\n' +
      '진행: ' + bar + '\n' +
      '실행한 테스트 수: <b>' + st.steps + '</b>' +
      (st.done ? '\n\n<b>✅ 첫 버그 커밋 = #' + st.bad + '</b>  (' + st.steps + '회 만에 발견, 순차 탐색이면 평균 ' + Math.round(st.n/2) + '회)' : '');
  }
  function judge(good){
    if (st.done) return;
    st.steps++;
    var judged = st.cur;
    if (good) st.lo = st.cur + 1; else st.hi = st.cur;
    if (st.lo >= st.hi){ st.done = true; st.bad = st.lo; render('탐색 완료!'); return; }
    st.cur = Math.floor((st.lo + st.hi) / 2);
    render(good ? '#' + judged + ' 이하 구간을 잘라냈습니다 (good).' : '#' + judged + ' 초과 구간을 잘라냈습니다 (bad).');
  }
  q('good').addEventListener('click', function(){ judge(true); });
  q('bad').addEventListener('click', function(){ judge(false); });
  q('reset').addEventListener('click', reset);
  q('n').addEventListener('change', reset);
  q('auto').addEventListener('click', function(){
    if (st.done) reset();
    var t = setInterval(function(){
      if (st.done){ clearInterval(t); return; }
      judge(st.cur < st.bad);
    }, 260);
    TIMERS.push(t);
  });
  reset();
};

/* ---- 플래키 확률 계산기 ---- */
DEMOS.flaky = function(box){
  var q = function(s){ return box.querySelector('[data-r="' + s + '"]'); };
  function upd(){
    var p = +q('p').value / 1000;   // 0.001 ~ 0.5
    var n = +q('n').value;
    q('pv').textContent = (p * 100).toFixed(1) + '%';
    q('nv').textContent = n + '회';
    var atLeastOne = 1 - Math.pow(1 - p, n);
    var need95 = Math.ceil(Math.log(0.05) / Math.log(1 - p));
    var expected = (n * p).toFixed(1);
    q('out').innerHTML =
      '실패율 p = <b>' + (p*100).toFixed(1) + '%</b>, 반복 N = <b>' + n + '</b>\n' +
      '─────────────────────────────\n' +
      '최소 1회 재현할 확률 : <b>' + (atLeastOne*100).toFixed(2) + '%</b>   = 1-(1-p)^N\n' +
      '기대 실패 횟수       : <b>' + expected + '회</b>\n' +
      '95% 확신에 필요한 N  : <b>' + need95 + '회</b>   ≈ 3/p\n\n' +
      (atLeastOne < 0.5
        ? '⚠️ 이 반복 횟수로는 절반도 못 잡습니다. "안 나오네요"는 근거가 되지 못합니다.'
        : (atLeastOne > 0.95 ? '✅ 충분합니다. 이 조건에서 안 나오면 의미 있는 음성 결과입니다.'
                             : '△ 애매합니다. 판정을 하려면 N을 더 늘리세요.'));
  }
  q('p').addEventListener('input', upd);
  q('n').addEventListener('input', upd);
  q('run').addEventListener('click', function(){
    var p = +q('p').value / 1000, n = +q('n').value, hit = 0;
    for (var i = 0; i < n; i++) if (Math.random() < p) hit++;
    q('sim').textContent = '실제 시뮬레이션: ' + n + '회 중 ' + hit + '회 실패' +
      (hit === 0 ? '  ← 이번엔 한 번도 못 잡았습니다!' : '');
  });
  upd();
};

/* ---- ddmin 시뮬레이터 ---- */
DEMOS.ddmin = function(box){
  var q = function(s){ return box.querySelector('[data-r="' + s + '"]'); };
  var st = null;
  function test(s, pat){ return s.indexOf(pat) >= 0; }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function init(){
    var input = q('in').value, pat = q('pat').value;
    if (!test(input, pat)){
      q('out').innerHTML = '⚠️ 원본이 실패하지 않습니다. 최소화 전에 <b>재현부터</b> 확인하세요.';
      st = null; return false;
    }
    st = { arr: input.split(''), pat: pat, n: 2, tries: 0, done: false,
           lines: ['원본 (' + input.length + '자): ' + esc(input),
                   '실패 조건: 부분 문자열 "' + esc(pat) + '" 포함\n'] };
    return true;
  }
  /* while 루프 한 바퀴(부분집합 → 여집합 → 재분할)를 실행 */
  function round(){
    var arr = st.arr, n = st.n, pat = st.pat;
    if (arr.length < 2 || st.tries >= 400){ st.done = true; return; }
    var chunk = Math.max(Math.floor(arr.length / n), 1);
    var subsets = [];
    for (var i = 0; i < arr.length; i += chunk) subsets.push(arr.slice(i, i + chunk));
    for (var a = 0; a < subsets.length; a++){
      st.tries++;
      if (test(subsets[a].join(''), pat)){
        st.arr = subsets[a]; st.n = 2;
        st.lines.push('#' + st.tries + ' 부분집합 채택 → ' + st.arr.length + '자: ' + esc(st.arr.join('')));
        return;
      }
    }
    for (var b = 0; b < subsets.length; b++){
      st.tries++;
      var rest = arr.slice(0, b*chunk).concat(arr.slice((b+1)*chunk));
      if (rest.length && test(rest.join(''), pat)){
        st.arr = rest; st.n = Math.max(n - 1, 2);
        st.lines.push('#' + st.tries + ' 여집합 채택 → ' + st.arr.length + '자: ' + esc(st.arr.join('')));
        return;
      }
    }
    if (n >= arr.length){ st.done = true; return; }
    st.n = Math.min(n * 2, arr.length);
    st.lines.push('   (더 잘게 분할: n=' + st.n + ')');
  }
  function show(hint){
    var lines = st.lines.slice();
    if (st.done){
      lines.push('\n<b>✅ 최소 입력 (' + st.arr.length + '자): ' + esc(st.arr.join('')) + '</b>');
      lines.push('테스트 호출 횟수: <b>' + st.tries + '회</b>   (손으로 하면 수십 분)');
    } else if (hint){
      lines.push('\n▶ 현재 ' + st.arr.length + '자, n=' + st.n + ', 테스트 ' + st.tries + '회 — "한 단계"를 계속 누르세요.');
    }
    q('out').innerHTML = lines.join('\n');
  }
  function runAll(){
    if (!init()) return;
    while (!st.done) round();
    show();
  }
  q('run').addEventListener('click', runAll);
  q('step').addEventListener('click', function(){
    if (!st || st.done){ if (init()) show(true); return; }
    round();
    show(true);
  });
  runAll();
};

/* ---- 로그 인터리빙 ---- */
DEMOS.interleave = function(box){
  var q = function(s){ return box.querySelector('[data-r="' + s + '"]'); };
  q('run').addEventListener('click', function(){
    var th = +q('th').value, mode = q('mode').value;
    var threads = [], out = [];
    for (var t = 0; t < th; t++){
      var parts = mode === 'atomic'
        ? ['[T' + t + '] step=' + t + ' value=' + (t*100) + ' done']
        : ['[T' + t + '] ', 'step=' + t + ' ', 'value=' + (t*100) + ' ', 'done'];
      threads.push({ id: t, parts: parts, i: 0 });
    }
    var line = '';
    var remaining = th;
    while (remaining > 0){
      var t2 = threads[Math.floor(Math.random() * threads.length)];
      if (t2.i >= t2.parts.length) continue;
      line += t2.parts[t2.i++];
      if (t2.i >= t2.parts.length){
        line += '\n';
        remaining--;
        threads = threads.filter(function(x){ return x.i < x.parts.length; });
        if (!threads.length) break;
      }
    }
    q('out').innerHTML = (mode === 'atomic'
      ? '<b>한 번의 write로 완성된 줄</b> — 순서는 섞여도 줄은 온전합니다:\n\n'
      : '<b>여러 번 write</b> — 줄이 서로 끼어들어 <b>해독 불가</b>가 됩니다:\n\n')
      + line.replace(/</g,'&lt;');
  });
  q('run').click();
};

DEMOS.float = function(box){

      'Number.EPSILON = ' + Number.EPSILON + '\n' +
      '0.1+0.2 === 0.3 ? <b>' + (0.1+0.2 === 0.3) + '</b>   |   Math.abs(0.1+0.2-0.3) < 1e-9 ? <b>true</b>';
  }

/* ---- 경합(race) 시뮬레이터 ---- */
DEMOS.race = function(box){
  var q = function(s){ return box.querySelector('[data-r="' + s + '"]'); };
  q('run').addEventListener('click', function(){
    var threads = +q('th').value, iters = +q('it').value, locked = q('lock').checked;
    // counter++ 를 load/add/store 3단계로 모델링
    var shared = 0;
    if (locked){
      shared = threads * iters;
      q('out').innerHTML = '🔒 <b>락 사용</b>: load-add-store가 원자적으로 실행됩니다.\n' +
        '기대값 = ' + threads + ' × ' + iters + ' = <b>' + (threads*iters) + '</b>\n' +
        '실제값 = <b>' + shared + '</b>  ✅ 항상 일치';
      return;
    }
    // 인터리빙 시뮬레이션
    var queues = [];
    for (var t3 = 0; t3 < threads; t3++) queues.push(iters);
    var active = [];
    while (queues.some(function(x){ return x > 0; }) || active.length){
      if (active.length < threads && queues.some(function(x){ return x > 0; })){
        var cand = [];
        for (var k = 0; k < threads; k++) if (queues[k] > 0) cand.push(k);
        var pick = cand[Math.floor(Math.random()*cand.length)];
        queues[pick]--; active.push({ t: pick, s: 0, r: 0 });
      }
      if (!active.length) break;
      var ai = Math.floor(Math.random() * active.length);
      var op = active[ai];
      if (op.s === 0){ op.r = shared; op.s = 1; }
      else if (op.s === 1){ op.r = op.r + 1; op.s = 2; }
      else { shared = op.r; active.splice(ai, 1); }
    }
    var expect = threads * iters;
    q('out').innerHTML = '⚠️ <b>락 없음</b>: counter++ = load → add → store (3단계, 원자적이지 않음)\n' +
      '기대값 = ' + threads + ' × ' + iters + ' = <b>' + expect + '</b>\n' +
      '실제값 = <b>' + shared + '</b>' + (shared === expect ? '  ← 이번엔 우연히 맞았습니다(그래서 위험!)' : '  ❌ 갱신 손실 ' + (expect - shared) + '건') +
      '\n\n같은 코드가 매번 다른 답을 냅니다. 이것이 "가끔 틀리는" 버그의 정체입니다.';
  });
  q('run').click();
};

DEMOS.enc = function(box){
