sl('Windows','!analyze -v 읽는 법', `
<h1><span class="no">6.6</span><code>!analyze -v</code> 읽는 법</h1>
<pre class="code"><code>FAULTING_IP:
app!Order::total+1a
00007ff6\`0004a12a 8b4108   mov eax,dword ptr [rcx+8]

<span class="er">EXCEPTION_RECORD:  (.exr -1)</span>
ExceptionCode: <span class="er">c0000005</span> (Access violation)
ExceptionInformation[0]: 0000000000000000   <span class="cm">; 0=읽기, 1=쓰기, 8=실행(DEP)</span>
ExceptionInformation[1]: <span class="er">0000000000000008</span>   <span class="cm">; 접근하려던 주소</span>

PROCESS_NAME:  app.exe
<span class="ok">FAILURE_BUCKET_ID:  NULL_POINTER_READ_c0000005_app.exe!Order::total</span>
STACK_TEXT:
00 app!Order::total+0x1a
01 app!OrderService::sum+0x3c
02 app!main+0x77</code></pre>
<div class="cols">
<div><h3>핵심 해석</h3>
<ul>
<li><strong>ExceptionCode</strong> — 무슨 종류의 사고인가</li>
<li><strong>ExceptionInformation[0]</strong> — 0=읽기 / 1=쓰기 / 8=DEP</li>
<li><strong>ExceptionInformation[1]</strong> — <em>접근하려던 주소</em>.
<code>0x8</code>처럼 작은 값이면 <strong>널 객체의 필드 오프셋</strong> → 널 포인터 확정</li>
<li><strong>FAULTING_IP</strong>의 명령어 — <code>[rcx+8]</code>이면 rcx가 널</li>
<li><strong>STACK_TEXT</strong> — 내 코드가 처음 등장하는 프레임부터 조사</li>
</ul>
</div>
<div>
<pre class="code sh"><code><span class="cm">; 추가 확인</span>
0:000&gt; .ecxr          <span class="cm">; 예외 발생 시점 컨텍스트로</span>
0:000&gt; r rcx          <span class="cm">; rcx=0000000000000000  ← 널 확정</span>
0:000&gt; kv             <span class="cm">; 인자 포함 스택</span>
0:000&gt; dt app!Order @rcx   <span class="cm">; 구조체로 해석 시도</span>
0:000&gt; !address @rcx   <span class="cm">; 이 주소가 유효한가</span></code></pre>
<div class="note"><strong>주소로 원인 추정</strong><br>
<code>0x0~0xffff</code> → 널 포인터(+필드 오프셋)<br>
<code>0xcccccccc</code> → 초기화되지 않은 스택(디버그 CRT)<br>
<code>0xcdcdcdcd</code> → 초기화되지 않은 힙<br>
<code>0xfeeefeee</code> → 이미 해제된 힙 → <strong>UAF</strong><br>
<code>0xdddddddd</code> → 해제된 메모리(일부 CRT)</div>
</div>
</div>`);

sl('Windows','PageHeap · Application Verifier', `
<h1><span class="no">6.8</span>힙 손상 잡기 — PageHeap</h1>
<div class="fx big">Windows판 ASan에 해당. 각 할당 뒤에 <strong>가드 페이지</strong>를 두어
버퍼 오버런을 <em>발생 즉시</em> 액세스 위반으로 바꿉니다.</div>
<pre class="code sh"><code><span class="cm">; gflags (Windows SDK 포함)</span>
&gt; gflags /p /enable app.exe /full      <span class="cm">; full page heap 켜기</span>
&gt; gflags /p                            <span class="cm">; 현재 설정 확인</span>
&gt; gflags /p /disable app.exe           <span class="cm">; 끄기(반드시!)</span>

<span class="cm">; 이제 실행하면 오버런 순간 즉시 크래시</span>
&gt; windbgx app.exe
0:000&gt; !analyze -v
0:000&gt; !heap -p -a &lt;addr&gt;       <span class="cm">; 이 주소의 할당 스택!</span>

<span class="cm">; Application Verifier (GUI) — 더 광범위</span>
&gt; appverif
<span class="cm">;  Basics: Heaps, Handles, Locks, Memory, TLS, Exceptions</span>
<span class="cm">;  → 잘못된 핸들 사용, 락 오용, TLS 오류까지 검출</span></code></pre>
<div class="cols">
<div><div class="tip"><strong>!heap -p -a</strong>는 “이 메모리는 언제 어디서 할당됐나”를 알려줍니다.
PageHeap을 켜야 스택이 기록됩니다. UAF·오버런 조사에서 결정적입니다.</div></div>
<div><div class="danger"><strong>주의</strong>: full page heap은 메모리를 크게 늘리고(할당마다 페이지 단위) 속도를 떨어뜨립니다.
조사 후 <strong>반드시 <code>/disable</code></strong> 하세요. 켜둔 채 잊으면 운영 사고가 됩니다.
메모리가 부족하면 <code>/full /size 100 200</code>처럼 크기 범위를 제한하세요.</div></div>
</div>
<pre class="code sh"><code><span class="cm">; UMDH — 누수 추적(할당 스택 스냅샷 비교)</span>
&gt; gflags /i app.exe +ust          <span class="cm">; 사용자 스택 추적 활성화</span>
&gt; umdh -p:1234 -f:snap1.txt
&gt; (부하 실행)
&gt; umdh -p:1234 -f:snap2.txt
&gt; umdh snap1.txt snap2.txt -f:diff.txt   <span class="cm">; 증가한 할당 스택이 범인</span></code></pre>`);

0:000&gt; p- / t-           <span class="cm">; 역방향 step</span>
0:000&gt; ba w4 &lt;addr&gt;; g-  <span class="cm">; ★ 값이 바뀐 순간으로 역행</span></code></pre>
<h3>TTD의 킬러 기능 — 쿼리</h3>
<pre class="code sh"><code><span class="cm">; 전체 실행에서 특정 함수 호출을 모두 조회</span>
0:000&gt; dx @$cursession.TTD.Calls(<span class="st">"app!Order::free"</span>)
0:000&gt; dx @$cursession.TTD.Calls(<span class="st">"kernel32!CreateFileW"</span>)
       .Where(c =&gt; c.Parameters[0] != 0)
       .Select(c =&gt; <span class="kw">new</span> { c.TimeStart, File = ((<span class="kw">wchar_t</span>*)c.Parameters[0]) })

<span class="cm">; 특정 메모리 주소에 대한 모든 접근 이력</span>
0:000&gt; dx @$cursession.TTD.Memory(0x1234, 0x1238, <span class="st">"w"</span>)

<span class="cm">; 예외가 발생한 모든 시점</span>
0:000&gt; dx @$cursession.TTD.Events.Where(e =&gt; e.Type == <span class="st">"Exception"</span>)

<span class="cm">; 원하는 시점으로 점프</span>
0:000&gt; !tt 3F:12E</code></pre>
<div class="fx"><strong>“이 포인터를 누가 해제했나”</strong>를 5분에 답합니다:
<code>TTD.Calls("app!free")</code>로 전체 해제 이력을 뽑고, 문제의 주소를 인자로 가진 호출을 찾아
그 시점으로 <code>!tt</code> 점프한 뒤 <code>k</code>. Linux의 <code>rr</code>과 같은 위상의 도구입니다.</div>
<div class="note">제약: 사용자 모드만, 기록 파일이 큼(수 GB), 오버헤드 10~20배.
그래도 <em>재현되기만 하면</em> 가장 확실한 해결책입니다.</div>`);

sl('Windows','ETW · WPR/WPA · PerfView', `
<h1><span class="no">6.12</span>ETW — Windows 성능 추적의 표준</h1>

<span class="cm">; xperf (구식이지만 강력)</span>
&gt; xperf -on latency -stackwalk profile
&gt; xperf -d C:\\traces\\cpu.etl

<span class="cm">; PerfView (.NET 친화, ETW 래퍼)</span>
&gt; PerfView collect -ThreadTime

<div class="cols">
<div><h3>WPA에서 볼 것</h3>
<ul>

<li><strong>CPU Usage (Precise)</strong> — 컨텍스트 스위치, <em>대기 원인(Readying Thread)</em></li>
<li><strong>Disk/File I/O</strong> — 어떤 파일이 느린가</li>

</ul>
<div class="tip"><strong>“CPU는 낮은데 느리다”</strong>는 CPU Usage (Precise)의
<em>Ready Thread</em> 분석으로 풉니다. 누가 누구를 깨우고 기다렸는지가 나옵니다.
Linux의 off-CPU 분석에 해당합니다.</div>
</div>

</div>
</div>`);

sl('Windows','Windows 오류 코드 체계', `
<h1><span class="no">6.13</span>Windows 오류 코드 3종 체계</h1>
<div class="tw"><table class="tbl">
<thead><tr><th>체계</th><th>형태</th><th>얻는 법</th><th>해석</th></tr></thead>
<tbody>
<tr><td><strong>Win32 오류</strong></td><td>작은 10진수 (2, 5, 32)</td><td><code>GetLastError()</code></td><td><code>net helpmsg 5</code></td></tr>
<tr><td><strong>HRESULT</strong></td><td><code>0x80070005</code></td><td>COM/.NET API 반환</td><td>상위 비트=심각도, 하위 16비트=Win32</td></tr>
<tr><td><strong>NTSTATUS</strong></td><td><code>0xC0000005</code></td><td>커널/예외</td><td><code>0xC</code>로 시작 = 에러</td></tr>
</tbody>
</table></div>
<pre class="code sh"><code><span class="cm">; 코드 해석 명령들</span>
&gt; net helpmsg 5
액세스가 거부되었습니다.

&gt; certutil -error 0x80070005
0x80070005 (WIN32: 5 ERROR_ACCESS_DENIED) -- 액세스가 거부되었습니다.

<span class="cm">; PowerShell</span>
&gt; [ComponentModel.Win32Exception]::new(5).Message
&gt; [ComponentModel.Win32Exception]::new(0x80070005).Message

<span class="cm">; WinDbg</span>
0:000&gt; !error 5
0:000&gt; !error 0xc0000005
0:000&gt; !gle              <span class="cm">; 현재 스레드의 GetLastError</span></code></pre>
<h3>HRESULT 구조</h3>
<pre class="code"><code>0x8 0 07 0005
  │ │  │   └─ 코드 (Win32 오류 5 = ACCESS_DENIED)
  │ │  └───── Facility (0x07 = FACILITY_WIN32)
  │ └──────── 예약
  └────────── S=1: 실패 (0이면 성공)

<span class="cm">// HRESULT_FROM_WIN32(5) == 0x80070005</span>
<span class="cm">// 자주 보는 것들</span>
0x80070002 파일을 찾을 수 없음     0x80070005 액세스 거부
0x8007000E 메모리 부족            0x80070057 잘못된 매개변수
0x80004005 지정되지 않은 오류(E_FAIL)  0x800705B4 타임아웃</code></pre>
<div class="tip"><code>0x8004xxxx</code>처럼 <em>Facility가 Win32가 아닌</em> 코드는 COM/앱 고유 코드입니다.
그럴 땐 해당 제품 문서나 <code>err.exe</code>(Microsoft Error Lookup Tool)로 찾으세요.</div>`);

sl('Windows','예외 코드 카탈로그', `

<div class="tw"><table class="tbl">
<thead><tr><th>코드</th><th>이름</th><th>의미 · 흔한 원인</th></tr></thead>
<tbody>
<tr><td><code>0xC0000005</code></td><td>ACCESS_VIOLATION</td><td><strong>널/해제 포인터, 범위 밖 접근</strong> — 가장 흔함</td></tr>

<tr><td><code>0xC0000135</code></td><td>DLL_NOT_FOUND</td><td><strong>DLL 누락</strong> — 시작조차 못 함</td></tr>

<span class="cm">; .NET 예외</span>

&gt; gflags /i app.exe +htg   <span class="cm">; 핸들 추적(스택 기록)</span></code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>지표</th><th>정상 범위</th><th>이상 시 의심</th></tr></thead>
<tbody>
<tr><td>Handle Count</td><td>수백~수천</td><td>단조 증가 → CloseHandle 누락</td></tr>
<tr><td>Thread Count</td><td>고정적</td><td>증가 → 스레드 종료 안 함</td></tr>
<tr><td>GDI Objects</td><td>&lt; 10,000</td><td>한도 도달 시 UI 깨짐</td></tr>
<tr><td>User Objects</td><td>&lt; 10,000</td><td>윈도우·메뉴 누수</td></tr>
<tr><td>Private Bytes</td><td>안정</td><td>증가 → 메모리 누수</td></tr>
<tr><td>Working Set</td><td>변동 가능</td><td>Private Bytes와 함께 봐야 의미</td></tr>
</tbody>
</table></div>
<div class="tip"><strong>Private Bytes vs Working Set</strong>: 누수 판단은 <em>Private Bytes</em>로 하세요.
Working Set은 OS가 페이지를 회수하면 줄어들어 <em>누수를 숨깁니다</em>.
Linux의 RSS vs 가상 메모리 구분과 같은 함정입니다.</div>`);

sl('Windows','인코딩·경로 함정', `
<h1><span class="no">6.21</span>Windows 특유의 인코딩·경로 함정</h1>
<div class="tw"><table class="tbl">
<thead><tr><th>함정</th><th>증상</th><th>해결</th></tr></thead>
<tbody>

<tr><td><strong>대소문자 구분 없음</strong></td><td>Linux CI에서만 <code>Module not found</code></td><td>import 경로 대소문자 정확히</td></tr>
<tr><td><strong>경로 길이 260</strong></td><td>깊은 node_modules에서 실패</td><td>긴 경로 정책 활성화 + 앱 매니페스트</td></tr>

<tr><td><strong>예약된 이름</strong></td><td><code>con</code>, <code>aux</code>, <code>nul</code>, <code>com1</code> 파일 생성 실패</td><td>이름 변경</td></tr>
<tr><td><strong>백슬래시 이스케이프</strong></td><td>JSON/정규식에서 경로 깨짐</td><td>슬래시 사용 또는 <code>\\\\</code></td></tr>
<tr><td><strong>BOM</strong></td><td>JSON 파싱 실패, 스크립트 첫 줄 오류</td><td>UTF-8 without BOM으로 저장</td></tr>
<tr><td><strong>후행 공백/점</strong></td><td><code>"folder "</code> 생성 불가</td><td>입력 정규화</td></tr>

<pre class="code sh"><code><span class="cm"># 긴 경로 활성화 (관리자)</span>

sl('Windows','실전 케이스 — 힙 손상 추적', `
<h1><span class="no">6.23</span>실전 — 랜덤 위치에서 크래시 (힙 손상)</h1>
<div class="cols">
<div>
<h3>증상과 초기 관찰</h3>
<ul>
<li>크래시 위치가 <strong>매번 다름</strong> (malloc 내부, free 내부, 무관한 함수)</li>
<li><code>0xC0000374</code> (HEAP_CORRUPTION) 또는 무작위 AV</li>
<li>디버그 빌드에서는 재현 안 됨</li>
</ul>
<div class="fx">크래시 위치가 매번 다르다 = <strong>범인은 그 위치가 아니다</strong>.
이미 망가진 데이터를 <em>나중에 만난 사람</em>이 죽는 것입니다.</div>
</div>
<div>
<h3>추적 절차</h3>
<pre class="code sh"><code><span class="cm">; ① PageHeap 켜기 — 오버런 순간에 즉시 크래시</span>
&gt; gflags /p /enable app.exe /full

<span class="cm">; ② 재현 후 분석</span>
0:000&gt; !analyze -v
0:000&gt; !heap -p -a @rcx
    Address  ... allocated by:
      app!Order::Order+0x2a
      app!Repo::load+0x77          <span class="cm">; ← 할당 스택</span>

<span class="cm">; ③ 끄기 (필수)</span>
&gt; gflags /p /disable app.exe</code></pre>
</div>
</div>
<pre class="code bad"><code><span class="cm">// 실제 원인 코드</span>
<span class="kw">char</span>* name = (<span class="kw">char</span>*)malloc(strlen(src));      <span class="cm">// ← +1 누락</span>
strcpy(name, src);                              <span class="cm">// NUL이 1바이트 밖으로</span></code></pre>
<pre class="code fix"><code><span class="kw">size_t</span> n = strlen(src) + <span class="nb">1</span>;
<span class="kw">char</span>* name = (<span class="kw">char</span>*)malloc(n);
<span class="kw">if</span> (!name) <span class="kw">return</span> <span class="nb">-1</span>;
memcpy(name, src, n);          <span class="cm">// 또는 strcpy_s(name, n, src)</span></code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>OS</th><th>같은 문제를 잡는 도구</th></tr></thead>
<tbody>
<tr><td>Windows</td><td>PageHeap(gflags), Application Verifier, MSVC ASan(<code>/fsanitize=address</code>)</td></tr>
<tr><td>Linux</td><td>ASan, valgrind memcheck, <code>MALLOC_CHECK_=3</code>, glibc <code>malloc_perturb</code></td></tr>
</tbody>
</table></div>`);

sl('Windows','네트워크 진단 (Windows)', `
<h1><span class="no">6.25</span>네트워크 진단</h1>
<pre class="code sh"><code><span class="cm">; 연결·포트 점유</span>
&gt; netstat -ano | findstr :8080
&gt; Get-NetTCPConnection -LocalPort 8080 | Select State,OwningProcess
&gt; Get-Process -Id (Get-NetTCPConnection -LocalPort 8080).OwningProcess

<span class="cm">; 연결 테스트 (telnet 대체)</span>
&gt; Test-NetConnection api.example.com -Port 443 -InformationLevel Detailed
&gt; curl.exe -v https://api.example.com/health

<span class="cm">; DNS</span>
&gt; Resolve-DnsName api.example.com
&gt; ipconfig /displaydns | findstr /i example
&gt; ipconfig /flushdns

<span class="cm">; 패킷 캡처 (설치 없이!)</span>
&gt; pktmon start --etw -c --comp nics
&gt; pktmon stop
&gt; pktmon etl2pcap PktMon.etl -o out.pcap    <span class="cm">; Wireshark로 열기</span>
&gt; pktmon filter add -p 443

<span class="cm">; 방화벽</span>
&gt; Get-NetFirewallRule -Enabled True -Direction Inbound |
    Where DisplayName -like <span class="st">'*App*'</span> | Format-Table DisplayName,Action
&gt; netsh advfirewall firewall show rule name=all | findstr 8080

<span class="cm">; 프록시 (사내망 단골 원인)</span>
&gt; netsh winhttp show proxy
&gt; [System.Net.WebRequest]::GetSystemWebProxy().GetProxy(<span class="st">"https://x.com"</span>)</code></pre>
<div class="tip"><strong>사내 네트워크 3대 함정</strong>: ① 프록시 설정이 앱마다 다름(WinHTTP vs WinINET vs 앱 자체),
② TLS 검사 장비의 자체 서명 인증서 → 인증서 검증 실패, ③ 방화벽이 <em>거부가 아니라 무응답</em> → 타임아웃.
증상만으로 구분하려면 <code>Test-NetConnection</code>의 즉시 실패/지연 실패를 보세요.</div>`);

sl('Windows','성능 카운터와 작업 관리자 해석', `
<h1><span class="no">6.26</span>성능 카운터 해석</h1>
<pre class="code sh"><code>&gt; typeperf <span class="st">"\\Processor(_Total)\\% Processor Time"</span> <span class="st">"\\Memory\\Available MBytes"</span> \\
           <span class="st">"\\Process(app)\\Private Bytes"</span> <span class="st">"\\Process(app)\\Handle Count"</span> -si 5
&gt; Get-Counter <span class="st">'\\Process(app)\\% Processor Time'</span> -Continuous -SampleInterval 2
&gt; Get-Counter -ListSet Process | Select -Expand Paths | findstr /i thread
<span class="cm">; PerfMon GUI: perfmon.exe → 데이터 수집기 집합으로 장기 수집</span></code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>카운터</th><th>의미</th><th>이상 신호</th></tr></thead>
<tbody>
<tr><td>Processor\\% Processor Time</td><td>CPU 사용률</td><td>단일 코어 포화는 여기서 안 보임 → 코어별 확인</td></tr>
<tr><td>System\\Processor Queue Length</td><td>실행 대기 스레드</td><td>&gt; 코어 수 × 2면 과부하</td></tr>
<tr><td>Memory\\Available MBytes</td><td>가용 메모리</td><td>&lt; 10% → 페이징 위험</td></tr>
<tr><td>Memory\\Pages/sec</td><td>페이징</td><td>지속 高 = 메모리 부족</td></tr>
<tr><td>PhysicalDisk\\Avg. Disk sec/Read</td><td>디스크 지연</td><td>&gt; 20ms(HDD)/&gt;5ms(SSD)</td></tr>
<tr><td>Process\\Private Bytes</td><td>전용 메모리</td><td>단조 증가 = 누수</td></tr>
<tr><td>Process\\Handle Count</td><td>핸들</td><td>단조 증가 = 핸들 누수</td></tr>
<tr><td>.NET CLR Memory\\% Time in GC</td><td>GC 부담</td><td>&gt; 10% 지속이면 할당 과다</td></tr>
<tr><td>.NET CLR LocksAndThreads\\Contention Rate</td><td>락 경합</td><td>급증 = 동기화 병목</td></tr>
</tbody>
</table></div>
<div class="note"><strong>작업 관리자 “메모리” 열의 함정</strong>: 기본 표시는 <em>작업 집합(Working Set)</em>으로
공유 메모리를 포함하고 OS가 회수하면 줄어듭니다. 누수 판단에는
<strong>세부 정보 탭 → 열 추가 → “커밋 크기”(Private Bytes)</strong>를 쓰세요.</div>`);

sl('Windows','UAC · 권한 · 레지스트리', `
<h1><span class="no">6.27</span>UAC · 권한 · 레지스트리</h1>
<pre class="code sh"><code><span class="cm">; 현재 권한 상태</span>
&gt; whoami /all
&gt; whoami /groups | findstr /i <span class="st">"High Mandatory"</span>     <span class="cm">; 상승 여부</span>
&gt; ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(<span class="st">'Administrators'</span>)

<span class="cm">; 파일 ACL</span>
&gt; icacls <span class="st">"C:\\ProgramData\\App"</span>
&gt; icacls <span class="st">"C:\\ProgramData\\App"</span> /grant <span class="st">"NT SERVICE\\MyService:(OI)(CI)M"</span>
&gt; Get-Acl C:\\data\\x.db | Format-List

<span class="cm">; 레지스트리</span>
&gt; reg query <span class="st">"HKLM\\SOFTWARE\\MyApp"</span> /s
&gt; Get-ItemProperty <span class="st">'HKLM:\\SOFTWARE\\MyApp'</span>
&gt; reg export <span class="st">"HKLM\\SOFTWARE\\MyApp"</span> backup.reg      <span class="cm">; 변경 전 백업!</span>

<span class="cm">; 32/64비트 레지스트리 리디렉션 (단골 함정)</span>
&gt; reg query <span class="st">"HKLM\\SOFTWARE\\MyApp"</span> /reg:32
&gt; reg query <span class="st">"HKLM\\SOFTWARE\\MyApp"</span> /reg:64
<span class="cm">; 32비트 앱은 실제로 HKLM\\SOFTWARE\\WOW6432Node\\MyApp 를 봅니다</span></code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>증상</th><th>원인</th></tr></thead>
<tbody>
<tr><td>관리자로 실행하면 됨</td><td>파일/레지스트리 쓰기 권한 — Program Files·HKLM은 쓰기 금지</td></tr>
<tr><td>설정이 저장 안 됨(오류도 없음)</td><td><strong>UAC 가상화</strong> — VirtualStore로 리디렉션됨</td></tr>
<tr><td>탐색기에서는 보이는데 앱은 못 봄</td><td>WOW6432Node 리디렉션, 또는 Sysnative</td></tr>
<tr><td>관리자 프로세스가 매핑 드라이브 못 봄</td><td>UAC 토큰 분리 — 상승된 세션은 별도 드라이브 맵</td></tr>
<tr><td>스케줄 작업만 실패</td><td>실행 계정·“가장 높은 권한” 옵션·로그온 여부</td></tr>
</tbody>
</table></div>
<div class="tip">쓰기 가능한 표준 위치를 쓰세요: <code>%LOCALAPPDATA%</code>, <code>%PROGRAMDATA%</code>(ACL 설정 필요).
<em>Program Files 아래에 로그·설정을 쓰는 설계</em>는 Windows에서 사고를 부릅니다.</div>`);

sl('Windows','JIT 디버거와 자동 부착', `
<h1><span class="no">6.28</span>JIT 디버거 — 크래시 순간 자동 부착</h1>
<pre class="code sh"><code><span class="cm">; AeDebug: 미처리 예외 발생 시 실행될 디버거 지정</span>
&gt; reg query <span class="st">"HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\AeDebug"</span>
&gt; windbgx -I               <span class="cm">; WinDbg를 기본 JIT 디버거로 등록</span>

<span class="cm">; 자동 덤프만 원하면(운영 권장) — 대화형 창 없이</span>
&gt; procdump -ma -i C:\\dumps    <span class="cm">; JIT 디버거로 procdump 등록</span>
&gt; procdump -u                 <span class="cm">; 해제</span>

<span class="cm">; 코드에서 강제 중단</span>
<span class="kw">if</span> (getenv(<span class="st">"WAIT_DEBUGGER"</span>)) {
    <span class="kw">while</span> (!IsDebuggerPresent()) Sleep(<span class="nb">500</span>);
    DebugBreak();          <span class="cm">// 부착 후 여기서 멈춤</span>
}
<span class="cm">// .NET: System.Diagnostics.Debugger.Launch() / .Break()</span>
<span class="cm">// Python: import debugpy; debugpy.breakpoint()</span></code></pre>
<div class="cols">
<div><div class="tip"><strong>시작 직후 크래시</strong>를 잡는 표준 수법:

<div><div class="danger">IFEO/AeDebug 설정은 <strong>시스템 전역</strong>입니다.
조사 후 반드시 원복하세요. 특히 <code>Debugger</code> 값을 잘못 남기면
해당 실행 파일이 <em>영영 실행되지 않습니다</em>.</div></div>
</div>`);

sl('Windows','MSVC 컴파일·링크 오류', `
<h1><span class="no">6.29</span>MSVC 컴파일·링크 오류 해독</h1>
<div class="tw"><table class="tbl">
<thead><tr><th>코드</th><th>의미</th><th>흔한 원인·해결</th></tr></thead>
<tbody>
<tr><td><code>C2065</code></td><td>선언되지 않은 식별자</td><td>헤더 누락, 오타, <code>#ifdef</code> 조건</td></tr>
<tr><td><code>C2039</code></td><td>멤버 아님</td><td>버전 불일치, 전방 선언만 포함</td></tr>
<tr><td><code>C1083</code></td><td>포함 파일 못 찾음</td><td><code>/I</code> 경로, 대소문자, vcpkg 미설치</td></tr>
<tr><td><code>C4996</code></td><td>사용 중단 함수</td><td><code>_CRT_SECURE_NO_WARNINGS</code> 또는 <code>_s</code> 버전</td></tr>
<tr><td><code>LNK2019</code></td><td>확인되지 않은 외부 기호</td><td><strong>라이브러리 누락</strong>, <code>extern "C"</code>, 32/64 혼용</td></tr>
<tr><td><code>LNK2005</code></td><td>이미 정의됨</td><td>헤더에 정의 배치, 런타임 라이브러리 혼용(/MT vs /MD)</td></tr>
<tr><td><code>LNK1120</code></td><td>확인되지 않은 외부 참조 N개</td><td>LNK2019의 요약</td></tr>
<tr><td><code>LNK1104</code></td><td>파일 열 수 없음</td><td>이전 프로세스가 exe 잠금 중 / 경로</td></tr>
<tr><td><code>C4267/C4244</code></td><td>크기 축소 변환</td><td>64비트 이식 시 <code>size_t</code>→<code>int</code> — <em>진짜 버그일 수 있음</em></td></tr>
</tbody>
</table></div>
<pre class="code sh"><code><span class="cm">; LNK2019 해결 3단계</span>
&gt; dumpbin /symbols main.obj | findstr ProcessOrder    <span class="cm">; 무엇을 요구하나(맹글링 이름)</span>
&gt; dumpbin /exports foo.lib | findstr ProcessOrder     <span class="cm">; 라이브러리가 제공하나</span>
&gt; dumpbin /headers foo.lib | findstr machine          <span class="cm">; x86? x64?</span>
<span class="cm">; 맹글링 이름이 다르면 → extern "C" 또는 호출 규약(__stdcall) 불일치</span>

<span class="cm">; 런타임 라이브러리 혼용 확인 (LNK2005/이상 크래시)</span>
&gt; dumpbin /directives foo.lib | findstr /i <span class="st">"DEFAULTLIB"</span>
<span class="cm">; /MT(정적)와 /MD(동적)를 섞으면 힙이 두 개가 되어 free 크래시</span></code></pre>
<div class="danger"><strong>/MT와 /MD 혼용</strong>은 Windows C++의 고전적 재앙입니다.
DLL 경계를 넘어 <code>new</code>한 것을 <code>delete</code>하면 <em>다른 힙</em>에 반납하게 되어 힙 손상이 납니다.
DLL 경계에서는 <em>할당한 쪽이 해제</em>하도록 API를 설계하세요.</div>`);

sl('Windows','배치·cmd 스크립트 디버깅', `
<h1><span class="no">6.30</span>배치(cmd) 스크립트 디버깅</h1>
<pre class="code sh"><code>@echo off
setlocal enabledelayedexpansion   <span class="cm">rem 지연 확장 — 루프 안 변수 필수</span>

rem 실행 추적: @echo off 를 잠시 제거하거나
&gt; cmd /v:on /c script.bat         <span class="cm">rem 지연 확장 켜고 실행</span>
&gt; cmd /c script.bat ^&gt; out.txt 2^&gt;^&amp;1

rem 오류 확인
if errorlevel 1 echo FAILED with %errorlevel%
if !errorlevel! neq 0 goto :error   <span class="cm">rem 지연 확장 버전</span></code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>함정</th><th>설명</th></tr></thead>
<tbody>
<tr><td><strong>%var% vs !var!</strong></td><td>블록 안에서 <code>%var%</code>는 <em>파싱 시점</em> 값으로 고정. 루프에서는 <code>!var!</code></td></tr>
<tr><td>공백 포함 경로</td><td>항상 <code>"%PATH%"</code>처럼 인용</td></tr>
<tr><td><code>errorlevel</code> 비교</td><td><code>if errorlevel 1</code>은 “1 이상”. 정확히 비교하려면 <code>if %errorlevel%==1</code></td></tr>
<tr><td>UNC 경로에서 cd</td><td>cmd는 UNC를 현재 디렉터리로 못 씀 → <code>pushd \\\\srv\\share</code></td></tr>
<tr><td>특수문자</td><td><code>^ &amp; | &gt; &lt; %</code>는 이스케이프 필요</td></tr>
<tr><td>BOM/CRLF</td><td>UTF-8 BOM이 첫 명령을 깨뜨림</td></tr>
<tr><td>종료 코드 전달</td><td><code>exit /b %errorlevel%</code>로 명시</td></tr>
</tbody>
</table></div>
<div class="tip">새로 작성한다면 <strong>PowerShell을 쓰세요</strong>. 배치는 유지보수 중인 스크립트를 이해할 때만.
그래도 CI에서 배치를 만난다면 <code>echo on</code> + 각 단계 <code>echo [STEP n]</code>가 가장 확실합니다.</div>`);

sl('Windows','BSOD와 커널 모드 기초', `
<h1><span class="no">6.31</span>BSOD(블루스크린) 기초</h1>
<pre class="code sh"><code><span class="cm">; 덤프 설정 확인 (시스템 속성 &gt; 고급 &gt; 시작 및 복구)</span>
&gt; wmic recoveros get DebugInfoType, DebugFilePath
<span class="cm">; 0=없음 1=완전 2=커널 3=소형 7=자동</span>

<span class="cm">; 덤프 분석</span>
&gt; windbgx -z C:\\Windows\\MEMORY.DMP
0:kd&gt; !analyze -v
0:kd&gt; lm t n                <span class="cm">; 모듈·드라이버 목록</span>
0:kd&gt; !irp / !thread / !process
0:kd&gt; .bugcheck             <span class="cm">; 버그체크 코드</span>

<span class="cm">; 이벤트 로그로 흔적 확인</span>
&gt; Get-WinEvent -FilterHashtable @{LogName=<span class="st">'System'</span>; Id=41,1001} -MaxEvents 10</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>버그체크</th><th>이름</th><th>흔한 원인</th></tr></thead>
<tbody>
<tr><td><code>0x0000000A</code></td><td>IRQL_NOT_LESS_OR_EQUAL</td><td>드라이버가 잘못된 IRQL에서 페이징 메모리 접근</td></tr>
<tr><td><code>0x0000001E</code></td><td>KMODE_EXCEPTION_NOT_HANDLED</td><td>커널 모드 예외</td></tr>
<tr><td><code>0x00000050</code></td><td>PAGE_FAULT_IN_NONPAGED_AREA</td><td>잘못된 메모리 접근 / RAM 불량</td></tr>
<tr><td><code>0x0000007E</code></td><td>SYSTEM_THREAD_EXCEPTION</td><td>드라이버 버그</td></tr>
<tr><td><code>0x00000133</code></td><td>DPC_WATCHDOG_VIOLATION</td><td>드라이버가 DPC를 너무 오래 점유(SSD 펌웨어 등)</td></tr>
<tr><td><code>0x000000EF</code></td><td>CRITICAL_PROCESS_DIED</td><td>핵심 시스템 프로세스 종료</td></tr>
</tbody>
</table></div>
<div class="note"><strong>앱 개발자의 현실적 대응</strong>: BSOD의 원인은 대부분 드라이버·하드웨어입니다.
<code>!analyze -v</code>가 지목한 드라이버를 업데이트/제거하고,
메모리 진단(<code>mdsched.exe</code>)과 디스크 점검(<code>chkdsk</code>)을 수행하세요.
직접 커널 디버깅이 필요한 경우는 드뭅니다.</div>`);

sl('C','C 디버깅 무기고', `
<h1><span class="no">7.1</span>C — 디버깅 무기고</h1>
<div class="fx big">C는 <strong>런타임이 아무것도 검사해 주지 않습니다</strong>.
그래서 “컴파일러·sanitizer·정적분석기에게 검사를 시키는 것”이 C 디버깅의 절반입니다.</div>
<div class="osgrid">
<div class="osbox l"><h4>🐧 Linux</h4>
<pre class="code sh"><code><span class="cm"># 개발 표준 빌드</span>
$ gcc -std=c17 -g3 -O1 \\
      -Wall -Wextra -Wpedantic -Werror \\
      -Wshadow -Wconversion -Wcast-qual -Wstrict-prototypes \\
      -fsanitize=address,undefined \\
      -fno-omit-frame-pointer \\
      -fstack-protector-strong -D_FORTIFY_SOURCE=2 \\
      app.c -o app
<span class="cm"># 정적 분석</span>
$ gcc -fanalyzer -c app.c
$ clang --analyze app.c
$ cppcheck --enable=all --inconclusive app.c
$ scan-build make</code></pre></div>
<div class="osbox w"><h4>🪟 Windows (MSVC)</h4>
<pre class="code sh"><code>&gt; cl /std:c17 /Zi /W4 /WX /RTC1 /GS /sdl \\
     /fsanitize=address /analyze app.c
&gt; cl /D_CRT_SECURE_NO_WARNINGS ...   <span class="cm">; (권장 안 함)</span>

<span class="cm">; MinGW/clang 이면 Linux와 동일 플래그 사용 가능</span>
&gt; clang -g -fsanitize=address,undefined app.c -o app.exe
<span class="cm">; 런타임 검사</span>
<span class="cm">;   /RTC1 : 초기화 안 된 지역변수, 스택 손상</span>
<span class="cm">;   /GS   : 스택 쿠키</span>
<span class="cm">;   PageHeap(gflags) : 힙 오버런 즉시 검출</span></code></pre></div>
</div>
<div class="tip"><strong>가장 큰 투자 수익</strong>: <code>-Wall -Wextra -Werror</code>.
경고를 “나중에 볼 것”으로 두면 진짜 버그가 노이즈에 묻힙니다.
새 프로젝트라면 첫날부터 <code>-Werror</code>로 시작하세요.</div>`);

sl('C','컴파일러 경고가 잡아주는 진짜 버그', `

<pre class="code bad"><code><span class="cm">// 경고 없이 통과하지만 치명적인 코드들</span>

sl('C','세그폴트 진단 5단계', `
<h1><span class="no">7.3</span>세그폴트(SIGSEGV) 진단 5단계</h1>
<pre class="code sh"><code><span class="cm"># ① 코어 덤프 확보</span>
$ ulimit -c unlimited &amp;&amp; ./app        <span class="cm"># 또는 coredumpctl</span>

<span class="cm"># ③ 커널 메시지로 주소 확인</span>
$ dmesg -T | tail -3
app[4821]: segfault at 0 ip 000055.. sp 00007ff.. error 4 in app
<span class="cm">#   at 0        → 널 포인터</span>
<span class="cm">#   at 8/16/24  → 널 객체의 필드 접근 (구조체 오프셋)</span>
<span class="cm">#   error 4     → 사용자 모드 읽기 / 6 = 쓰기 / 5,7 = 실행</span>

<span class="cm"># ⑤ 여전히 모호하면 valgrind (재컴파일 불가 시)</span>
$ valgrind --track-origins=yes ./app</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>주소 패턴</th><th>원인</th></tr></thead>
<tbody>
<tr><td><code>0x0</code> 또는 매우 작은 값</td><td>널 포인터(+필드 오프셋)</td></tr>
<tr><td><code>0xffffffffffffffff</code></td><td>-1을 포인터로</td></tr>
<tr><td>이전에 유효했던 주소</td><td><strong>use-after-free</strong></td></tr>

sl('C','포인터 3대 사고 — 널·댕글링·UAF', `
<h1><span class="no">7.4</span>포인터 3대 사고</h1>
<div class="cols">
<div>
<pre class="code bad"><code><span class="cm">// ① 널 역참조 — 반환값 미검사</span>
FILE *f = fopen(path, <span class="st">"r"</span>);
fread(buf, <span class="nb">1</span>, n, f);        <span class="cm">// f가 NULL이면 즉사</span>

<span class="cm">// ② 댕글링 — 스코프를 벗어난 지역변수</span>
<span class="kw">char</span> *bad(<span class="kw">void</span>){
    <span class="kw">char</span> buf[<span class="nb">64</span>];
    sprintf(buf, <span class="st">"id=%d"</span>, id);
    <span class="kw">return</span> buf;             <span class="cm">// 스택 프레임 소멸!</span>
}

<span class="cm">// ③ use-after-free</span>
free(node);
printf(<span class="st">"%d\\n"</span>, node-&gt;id);  <span class="cm">// 해제된 메모리 읽기</span>
free(node);                  <span class="cm">// double free</span></code></pre>
</div>
<div>
<pre class="code fix"><code><span class="cm">// ① 항상 검사 + errno 활용</span>

<span class="kw">if</span> (!f) {
    fprintf(stderr, <span class="st">"fopen(%s): %s\\n"</span>, path, strerror(errno));
    <span class="kw">return</span> <span class="nb">-1</span>;
}

<span class="cm">// ② 호출자가 버퍼를 소유</span>
<span class="kw">int</span> fmt_id(<span class="kw">char</span> *out, <span class="kw">size_t</span> cap, <span class="kw">int</span> id){
    <span class="kw">return</span> snprintf(out, cap, <span class="st">"id=%d"</span>, id);
}

<span class="cm">// ③ 해제 후 즉시 무효화 (실수를 크래시로 승격)</span>
#define FREE(p) <span class="kw">do</span>{ free(p); (p) = <span class="kw">NULL</span>; }<span class="kw">while</span>(0)

<span class="cm">// 이후 node-&gt;id 는 확실히 널 역참조 → 즉시 발견</span></code></pre>
</div>

sl('C','버퍼 오버런과 문자열 함수', `
<h1><span class="no">7.5</span>버퍼 오버런과 문자열 함수</h1>

<span class="cm">// ② 곱셈 전 검사, 또는 calloc 사용(내부에서 검사)</span>
<span class="kw">if</span> (count &gt; SIZE_MAX / <span class="kw">sizeof</span>(item_t)) <span class="kw">return</span> ERR_RANGE;
<span class="kw">void</span> *p = calloc(count, <span class="kw">sizeof</span>(item_t));

<span class="cm">// ③ 타입을 맞추거나 명시적으로 캐스트</span>
<span class="kw">if</span> (i &gt;= <span class="nb">0</span> &amp;&amp; (<span class="kw">size_t</span>)i &lt; <span class="kw">sizeof</span>(buf)) ...

sl('C','printf 디버깅 실전 (C)', `
<h1><span class="no">7.7</span>C의 printf 디버깅 실전</h1>
<pre class="code"><code><span class="cm">/* debug.h — 프로젝트에 넣어두면 두고두고 씁니다 */</span>

  #include &lt;stdio.h&gt;
  #include &lt;time.h&gt;
  #define DBG(fmt, ...) <span class="kw">do</span>{ \\

  #define DBG_HEX(p, n) dbg_hex(__FILE__, __LINE__, #p, (<span class="kw">const</span> <span class="kw">unsigned</span> <span class="kw">char</span>*)(p), (n))
#<span class="kw">else</span>
  #define DBG(...)      ((<span class="kw">void</span>)0)
  #define DBG_HEX(p, n) ((<span class="kw">void</span>)0)
#endif

<span class="kw">static</span> <span class="kw">inline</span> <span class="kw">void</span> dbg_hex(<span class="kw">const</span> <span class="kw">char</span>*f, <span class="kw">int</span> l, <span class="kw">const</span> <span class="kw">char</span>*name,
                           <span class="kw">const</span> <span class="kw">unsigned</span> <span class="kw">char</span>*p, <span class="kw">size_t</span> n){
    fprintf(stderr, <span class="st">"[HEX %s:%d] %s (%zu bytes)\\n"</span>, f, l, name, n);
    <span class="kw">for</span> (<span class="kw">size_t</span> i = <span class="nb">0</span>; i &lt; n; i += <span class="nb">16</span>){
        fprintf(stderr, <span class="st">"  %04zx: "</span>, i);
        <span class="kw">for</span> (<span class="kw">size_t</span> j = <span class="nb">0</span>; j &lt; <span class="nb">16</span>; j++)
            <span class="kw">if</span> (i+j &lt; n) fprintf(stderr, <span class="st">"%02x "</span>, p[i+j]); <span class="kw">else</span> fputs(<span class="st">"   "</span>, stderr);
        fputs(<span class="st">" |"</span>, stderr);
        <span class="kw">for</span> (<span class="kw">size_t</span> j = <span class="nb">0</span>; j &lt; <span class="nb">16</span> &amp;&amp; i+j &lt; n; j++){
            <span class="kw">unsigned</span> <span class="kw">char</span> c = p[i+j];
            fputc((c &gt;= <span class="nb">32</span> &amp;&amp; c &lt; <span class="nb">127</span>) ? c : <span class="st">'.'</span>, stderr);

sl('C','파일 I/O와 errno 다루기', `
<h1><span class="no">7.11</span>파일 I/O와 errno</h1>
<pre class="code bad"><code>FILE *f = fopen(path, <span class="st">"r"</span>);
<span class="kw">if</span> (!f) { printf(<span class="st">"파일 열기 실패\\n"</span>); <span class="kw">return</span> <span class="nb">-1</span>; }   <span class="cm">// 정보 0</span></code></pre>
<pre class="code fix"><code>FILE *f = fopen(path, <span class="st">"r"</span>);
<span class="kw">if</span> (!f) {
    fprintf(stderr, <span class="st">"fopen('%s') failed: %s (errno=%d), cwd='%s'\\n"</span>,
            path, strerror(errno), errno, getcwd(buf, <span class="kw">sizeof</span> buf));
    <span class="kw">return</span> <span class="nb">-1</span>;
}</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>함정</th><th>설명</th></tr></thead>
<tbody>
<tr><td><strong>errno는 성공 시 안 지워짐</strong></td><td>실패를 확인한 <em>직후에만</em> 읽을 것. 그 사이 다른 호출이 덮어씀</td></tr>
<tr><td><code>printf</code>가 errno를 바꿈</td><td>errno를 지역 변수에 먼저 저장</td></tr>
<tr><td>텍스트/바이너리 모드</td><td>Windows에서 <code>"rb"</code> 없으면 CRLF 변환 → 크기 불일치</td></tr>
<tr><td>short read/write</td><td><code>read()</code>는 요청보다 적게 읽을 수 있음 → 루프 필수</td></tr>
<tr><td><code>EINTR</code></td><td>시그널로 중단 → 재시도 루프</td></tr>
<tr><td><code>fclose</code> 반환값 무시</td><td>버퍼 flush 실패(디스크 꽉참)를 놓침</td></tr>
<tr><td>상대 경로</td><td>cwd에 의존 → 서비스·cron에서 실패</td></tr>
</tbody>
</table></div>
<pre class="code"><code><span class="cm">/* short write / EINTR 안전 쓰기 — 실무에서 반드시 필요 */</span>
<span class="kw">ssize_t</span> write_all(<span class="kw">int</span> fd, <span class="kw">const</span> <span class="kw">void</span> *buf, <span class="kw">size_t</span> n){
    <span class="kw">const</span> <span class="kw">char</span> *p = buf; <span class="kw">size_t</span> left = n;
    <span class="kw">while</span> (left){
        <span class="kw">ssize_t</span> w = write(fd, p, left);
        <span class="kw">if</span> (w &lt; <span class="nb">0</span>){ <span class="kw">if</span> (errno == EINTR) <span class="kw">continue</span>; <span class="kw">return</span> <span class="nb">-1</span>; }
        p += w; left -= (<span class="kw">size_t</span>)w;
    }
    <span class="kw">return</span> (<span class="kw">ssize_t</span>)n;
}</code></pre>
<div class="tip">“가끔 파일이 잘려서 저장된다”는 신고의 정답이 위 코드입니다.
<code>write()</code>의 반환값을 무시하는 코드는 대용량·네트워크 FD에서 반드시 사고를 냅니다.</div>`);

sl('C','실전 케이스 — 연결 리스트 UAF', `
<h1><span class="no">7.12</span>실전 — 연결 리스트 use-after-free</h1>
<pre class="code bad"><code><span class="kw">void</span> free_list(Node *head){
    <span class="kw">for</span> (Node *n = head; n; n = n-&gt;next) {   <span class="cm">// ← n을 free한 뒤 n-&gt;next 읽음</span>
        free(n);
    }
}</code></pre>
<div class="cols">
<div>
<h3>증상</h3>
<ul>
<li>대부분 정상 동작(운 좋게 메모리가 안 덮임)</li>
<li>부하가 늘면 <strong>가끔</strong> 크래시</li>
<li>크래시 위치가 매번 다름 — <code>malloc</code> 내부일 때도</li>
</ul>
<h3>ASan 한 방</h3>
<pre class="code"><code><span class="er">ERROR: AddressSanitizer: heap-use-after-free</span>
READ of size 8 at 0x602... thread T0
    #0 free_list list.c:5
freed by thread T0 here:
    #1 free_list list.c:6      ← 같은 함수!</code></pre>
</div>
<div>
<pre class="code fix"><code><span class="kw">void</span> free_list(Node *head){
    Node *n = head;
    <span class="kw">while</span> (n) {
        Node *next = n-&gt;next;   <span class="cm">// 해제 전에 저장</span>
        free(n);
        n = next;
    }
}</code></pre>
<div class="tip"><strong>일반화된 규칙</strong>: 해제 대상에서 <em>필요한 값을 먼저 꺼내 놓는다</em>.
<code>fclose</code> 후 <code>FILE*</code> 필드 접근, <code>close(fd)</code> 후 <code>fd</code> 재사용도 같은 부류입니다.</div>
<div class="note"><strong>왜 코드 리뷰로 못 잡히나</strong>: <code>for (n = head; n; n = n->next)</code>는
너무 익숙한 관용구라 눈이 그냥 지나갑니다.
그래서 <em>사람 리뷰보다 sanitizer가 강한 영역</em>이 존재합니다.</div>
</div>
</div>
<pre class="code sh"><code><span class="cm"># 이런 부류를 CI에서 자동으로 걸러내는 최소 설정</span>
$ gcc -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer *.c -o test-asan
$ ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 ./test-asan</code></pre>`);

sl('C','C 디버깅 체크리스트', `

<li><span class="txt">디버그 정보(<code>-g3</code>)가 배포 빌드에도 <em>분리 보관</em>돼 있는가</span></li>
</ul>
<div class="fx big">C 디버깅의 절반은 <strong>“검사를 도구에게 위임했는가”</strong>로 결정됩니다.
사람의 주의력으로 메모리 안전성을 지키려는 시도는 통계적으로 실패합니다.</div>`);

sl('C++','스마트 포인터와 수명 문제', `
<h1><span class="no">7.15</span>수명(lifetime) 문제 진단</h1>
<pre class="code bad"><code><span class="cm">// ① 댕글링 참조 — 임시 객체에 바인딩</span>
<span class="kw">const</span> std::string&amp; name = getUser().name();   <span class="cm">// 임시가 즉시 소멸</span>
use(name);                                    <span class="cm">// UAF</span>

<span class="cm">// ② string_view 의 함정</span>
std::string_view sv = std::string(<span class="st">"temp"</span>);    <span class="cm">// 임시 소멸 → 댕글링</span>

<span class="cm">// ③ 컨테이너 재할당 후 포인터 사용</span>
<span class="kw">auto</span>&amp; first = vec[<span class="nb">0</span>];
vec.push_back(x);      <span class="cm">// 재할당 가능 → first 무효</span>
first = <span class="nb">10</span>;            <span class="cm">// UAF</span>

<span class="cm">// ④ 람다의 참조 캡처가 비동기로 살아남음</span>
<span class="kw">auto</span> f = [&amp;]{ use(local); };   <span class="cm">// local 소멸 후 실행되면 UAF</span>
pool.submit(f);

<span class="cm">// ⑤ shared_ptr 순환 참조 → 누수</span>
<span class="kw">struct</span> Node { std::shared_ptr&lt;Node&gt; next, prev; };  <span class="cm">// prev는 weak_ptr 여야</span></code></pre>
<pre class="code fix"><code><span class="kw">auto</span> user = getUser();                 <span class="cm">// 값으로 보관</span>
std::string s = <span class="st">"temp"</span>; std::string_view sv = s;
<span class="kw">auto</span> idx = <span class="nb">0</span>; vec.push_back(x); vec[idx] = <span class="nb">10</span>;   <span class="cm">// 인덱스 사용</span>
<span class="kw">auto</span> f = [local]{ use(local); };        <span class="cm">// 값 캡처 (또는 shared_ptr)</span>
<span class="kw">struct</span> Node { std::shared_ptr&lt;Node&gt; next; std::weak_ptr&lt;Node&gt; prev; };</code></pre>
<div class="cols">
<div><div class="tip"><strong>ASan의 use-after-scope</strong>가 ①②④를 잡습니다:
<code>-fsanitize=address -fsanitize-address-use-after-scope</code>.
Clang의 <code>-Wdangling</code>·<code>-Wreturn-stack-address</code>도 켜세요.</div></div>
<div><div class="note"><strong>순환 참조 진단</strong>: <code>shared_ptr</code> 누수는 valgrind에서
“still reachable”로 보이거나 아예 안 보입니다.
<code>use_count()</code>를 로깅하거나, 소멸자에 로그를 넣어 <em>“소멸자가 호출되지 않는다”</em>를 확인하세요.</div></div>
</div>`);

sl('C++','예외 디버깅', `
<h1><span class="no">7.16</span>C++ 예외 디버깅</h1>
<pre class="code sh"><code><span class="cm"># “terminate called after throwing an instance of ..." 만 보일 때</span>
(gdb) catch throw                 <span class="cm"># 던지는 순간 정지 → bt 로 발생 지점 확인</span>
(gdb) catch throw std::runtime_error
(gdb) b __cxa_throw
(gdb) b std::terminate
(gdb) run

<span class="cm"># WinDbg</span>
0:000&gt; sxe eh                     <span class="cm">; C++ throw 시 중단</span>
0:000&gt; .exr -1 ; k</code></pre>
<pre class="code"><code><span class="cm">// 중첩 예외 전부 출력 (C++11+)</span>
<span class="kw">void</span> print_exception(<span class="kw">const</span> std::exception&amp; e, <span class="kw">int</span> level = <span class="nb">0</span>){
    std::cerr &lt;&lt; std::string(level*<span class="nb">2</span>, <span class="st">' '</span>) &lt;&lt; <span class="st">"exception: "</span> &lt;&lt; e.what() &lt;&lt; <span class="st">'\\n'</span>;
    <span class="kw">try</span> { std::rethrow_if_nested(e); }
    <span class="kw">catch</span> (<span class="kw">const</span> std::exception&amp; nested) { print_exception(nested, level+<span class="nb">1</span>); }
    <span class="kw">catch</span> (...) {}
}

<span class="cm">// 미처리 예외에서 스택을 남기는 훅</span>
std::set_terminate([]{
    <span class="kw">if</span> (<span class="kw">auto</span> e = std::current_exception()) {
        <span class="kw">try</span> { std::rethrow_exception(e); }
        <span class="kw">catch</span> (<span class="kw">const</span> std::exception&amp; ex) { std::cerr &lt;&lt; <span class="st">"FATAL: "</span> &lt;&lt; ex.what() &lt;&lt; <span class="st">'\\n'</span>; }
        <span class="kw">catch</span> (...) { std::cerr &lt;&lt; <span class="st">"FATAL: unknown exception\\n"</span>; }
    }
    <span class="cm">// C++23: std::stacktrace::current() 로 스택도 출력 가능</span>
    std::abort();   <span class="cm">// 코어 덤프 생성</span>
});</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>메시지</th><th>의미</th></tr></thead>
<tbody>
<tr><td><code>terminate called after throwing…</code></td><td>어떤 catch에도 안 잡힘 → <code>catch throw</code>로 발생 지점 찾기</td></tr>
<tr><td><code>terminate called without an active exception</code></td><td>소멸자에서 예외, 또는 join 안 된 <code>std::thread</code> 소멸</td></tr>
<tr><td><code>pure virtual method called</code></td><td>생성/소멸 중 가상 호출</td></tr>
<tr><td><code>std::bad_alloc</code></td><td>메모리 부족 또는 <em>거대한 크기 계산 오류</em></td></tr>
<tr><td><code>std::system_error: Resource deadlock avoided</code></td><td>같은 스레드가 <code>join</code>/재귀 lock</td></tr>
</tbody>
</table></div>`);

sl('C++','STL 디버깅 — 반복자와 컨테이너', `
<h1><span class="no">7.17</span>STL 반복자·컨테이너 함정</h1>
<pre class="code bad"><code><span class="cm">// ① 삭제 중 반복자 무효화</span>
<span class="kw">for</span> (<span class="kw">auto</span> it = v.begin(); it != v.end(); ++it)
    <span class="kw">if</span> (*it &lt; <span class="nb">0</span>) v.erase(it);        <span class="cm">// it 무효 → UB</span>

<span class="cm">// ② map::operator[] 가 원소를 만들어 버림</span>
<span class="kw">if</span> (m[key] == <span class="nb">0</span>) ...                <span class="cm">// key가 없으면 삽입됨! size 증가</span>

<span class="cm">// ③ 빈 컨테이너의 front/back</span>
<span class="kw">auto</span> x = v.front();                <span class="cm">// v가 비면 UB (예외 아님!)</span>

<span class="cm">// ④ vector&lt;bool&gt; 은 컨테이너가 아님</span>
<span class="kw">bool</span>&amp; r = v[<span class="nb">0</span>];                    <span class="cm">// 컴파일 오류 (프록시 반환)</span>

<span class="cm">// ⑤ 부호 있는 인덱스와 size() 비교</span>
<span class="kw">for</span> (<span class="kw">int</span> i = <span class="nb">0</span>; i &lt; v.size(); i++)  <span class="cm">// -Wsign-compare</span></code></pre>
<pre class="code fix"><code>v.erase(std::remove_if(v.begin(), v.end(), [](<span class="kw">int</span> x){ <span class="kw">return</span> x&lt;<span class="nb">0</span>; }), v.end());
<span class="cm">// C++20: std::erase_if(v, pred);</span>

<span class="kw">if</span> (<span class="kw">auto</span> it = m.find(key); it != m.end() &amp;&amp; it-&gt;second == <span class="nb">0</span>) ...
<span class="kw">if</span> (!v.empty()) <span class="kw">auto</span> x = v.front();
<span class="kw">for</span> (std::size_t i = <span class="nb">0</span>; i &lt; v.size(); ++i)</code></pre>
<div class="cols">
<div><div class="tip"><strong>즉시 검출 설정</strong><br>
GCC: <code>-D_GLIBCXX_DEBUG</code> → 무효 반복자·범위 초과를 <em>명확한 메시지</em>로 abort<br>
MSVC: <code>_ITERATOR_DEBUG_LEVEL=2</code>(디버그 기본)<br>
libc++: <code>_LIBCPP_HARDENING_MODE</code></div></div>
<div><div class="danger"><strong>ABI 주의</strong>: <code>_GLIBCXX_DEBUG</code>는 컨테이너 레이아웃을 바꿉니다.

</div>`);

sl('C++','템플릿·빌드 오류 해독', `
<h1><span class="no">7.19</span>템플릿 오류 해독</h1>
<div class="cols">
<div>
<h3>1000줄 에러를 3줄로</h3>
<pre class="code sh"><code><span class="cm"># 첫 에러만 보기 (뒤는 전부 파생)</span>
$ g++ -fmax-errors=1 app.cpp
$ clang++ -ferror-limit=1 app.cpp

<span class="cm"># 템플릿 백트레이스 줄이기</span>
$ g++ -ftemplate-backtrace-limit=3
$ clang++ -fno-elide-type -fdiagnostics-show-template-tree

<span class="cm"># 에러 예쁘게</span>
$ g++ -fdiagnostics-color=always 2&gt;&amp;1 | less -R
$ pip install gccfilter   <span class="cm"># 또는 clang 사용(메시지 품질 우수)</span></code></pre>
<div class="tip"><strong>규칙</strong>: 템플릿 에러는 <em>첫 번째 것만</em> 읽으세요.
나머지는 대부분 첫 실패의 여파입니다. clang의 메시지가 gcc보다 읽기 쉬우므로
<em>에러 해독 전용으로 clang을 한 번 돌리는 것</em>도 실전 기법입니다.</div>
</div>
<div>
<h3>컴파일 타임 값 확인 기법</h3>
<pre class="code"><code><span class="cm">// 타입을 에러 메시지로 강제 출력</span>
<span class="kw">template</span>&lt;<span class="kw">typename</span> T&gt; <span class="kw">struct</span> WhatIsThis;
WhatIsThis&lt;<span class="kw">decltype</span>(x)&gt; _;   <span class="cm">// 에러 메시지에 T의 실제 타입이 나옴</span>

<span class="cm">// 값 확인</span>
<span class="kw">template</span>&lt;<span class="kw">int</span> N&gt; <span class="kw">struct</span> ShowValue;
ShowValue&lt;<span class="kw">sizeof</span>(MyStruct)&gt; _v;   <span class="cm">// "ShowValue&lt;40&gt;" 로 표시</span>

<span class="cm">// 정적 단언</span>
<span class="kw">static_assert</span>(std::is_trivially_copyable_v&lt;Packet&gt;,
              <span class="st">"Packet은 memcpy 가능해야 함"</span>);
<span class="kw">static_assert</span>(<span class="kw">sizeof</span>(Header) == <span class="nb">16</span>);

<span class="cm">// C++20 concepts — 에러 메시지가 극적으로 좋아짐</span>
<span class="kw">template</span>&lt;std::integral T&gt; <span class="kw">void</span> f(T);</code></pre>
<div class="note">C++20 <code>concept</code>를 쓰면 “왜 이 타입이 안 맞는지”가

sl('C++','C++ 성능 디버깅', `
<h1><span class="no">7.20</span>C++ 성능 디버깅</h1>
<pre class="code sh"><code><span class="cm"># 1) 어디가 느린지 (샘플링)</span>

&gt; wpr -start CPU ; wpr -stop cpu.etl ; wpa cpu.etl

<span class="cm"># 2) 왜 느린지 (마이크로아키텍처)</span>

<span class="cm"># 3) 정확한 명령어 수 비교 (A/B 최적화 검증)</span>
$ valgrind --tool=callgrind ./app &amp;&amp; callgrind_annotate

<span class="cm"># 4) 할당 추적</span>
$ heaptrack ./app &amp;&amp; heaptrack_gui heaptrack.app.1234.gz</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>흔한 원인</th><th>징후</th><th>확인 방법</th></tr></thead>

<tr><td>불필요한 복사</td><td>메모리 대역폭·할당 급증</td><td>복사 생성자에 브레이크포인트, <code>-Wextra</code></td></tr>
<tr><td>할당 폭주</td><td>malloc이 프로파일 상위</td><td>heaptrack, <code>operator new</code> 후킹</td></tr>
<tr><td>캐시 미스</td><td>IPC &lt; 1, cache-misses 高</td><td>구조체 재배치, SoA 변환</td></tr>
<tr><td>가상 호출 오버헤드</td><td>핫루프 내 간접 호출</td><td>템플릿·CRTP, devirtualization</td></tr>
<tr><td><code>std::endl</code> 남용</td><td>매 줄 flush → syscall 폭증</td><td><code>strace -c</code>, <code>'\\n'</code>으로 교체</td></tr>
<tr><td>shared_ptr 복사</td><td>원자적 refcount 경합</td><td><code>const&amp;</code>로 전달</td></tr>
<tr><td>예외를 흐름 제어로</td><td>throw가 핫패스에</td><td>프로파일에 <code>__cxa_throw</code> 등장</td></tr>
</tbody>
</table></div>
<pre class="code"><code><span class="cm">// 복사가 어디서 일어나는지 잡는 고전 기법</span>
<span class="kw">struct</span> Tracked {
    Tracked() = <span class="kw">default</span>;
    Tracked(<span class="kw">const</span> Tracked&amp;){ std::cerr &lt;&lt; <span class="st">"COPY\\n"</span>; <span class="cm">/* 여기 BP */</span> }
    Tracked(Tracked&amp;&amp;) <span class="kw">noexcept</span> { std::cerr &lt;&lt; <span class="st">"MOVE\\n"</span>; }
};</code></pre>
<div class="tip"><strong>측정 없는 최적화 금지</strong>. C++에서는 특히
“느릴 것 같은 곳”과 “실제로 느린 곳”이 다릅니다. 프로파일이 지목하지 않은 코드는 건드리지 마세요.</div>`);

sl('C++','실전 케이스 — 정적 초기화 순서', `
<h1><span class="no">7.21</span>실전 — static initialization order fiasco</h1>
<pre class="code bad"><code><span class="cm">// config.cpp</span>
Config g_config = load_config();          <span class="cm">// 전역 객체 A</span>

<span class="cm">// logger.cpp</span>
Logger g_logger(g_config.log_path);       <span class="cm">// 전역 객체 B가 A에 의존</span>
<span class="cm">// → 번역 단위 간 초기화 순서는 정의되지 않음!</span></code></pre>
<div class="cols">
<div>
<h3>증상</h3>
<ul>
<li>링크 순서를 바꾸면 <strong>동작이 바뀐다</strong></li>
<li>디버그 빌드는 되는데 릴리스에서 크래시</li>
<li>빈 문자열/널 경로로 로그 파일 생성 실패</li>
<li>스택 트레이스가 <code>_GLOBAL__sub_I_...</code>를 가리킴</li>
</ul>
<div class="tip"><strong>진단</strong>: 스택 최상위에 <code>__static_initialization_and_destruction</code>이나
<code>_GLOBAL__sub_I</code>가 보이면 즉시 이 문제를 의심하세요.<br>
ASan: <code>ASAN_OPTIONS=check_initialization_order=1:strict_init_order=1</code></div>
</div>
<div>
<pre class="code fix"><code><span class="cm">// 해결 1: 지연 초기화(Construct On First Use)</span>
Config&amp; config(){
    <span class="kw">static</span> Config c = load_config();   <span class="cm">// 첫 호출 시 초기화(스레드 안전, C++11+)</span>
    <span class="kw">return</span> c;
}
Logger&amp; logger(){
    <span class="kw">static</span> Logger l(config().log_path);
    <span class="kw">return</span> l;
}

<span class="cm">// 해결 2: 명시적 init() 를 main 에서 순서대로 호출</span>
<span class="kw">int</span> main(){
    init_config();
    init_logger();
    ...
}</code></pre>
<div class="note"><strong>소멸 순서도 문제</strong>입니다. 전역 객체의 소멸은 역순이지만
번역 단위 간에는 역시 미정의 — 종료 시 로거가 이미 죽은 뒤 다른 소멸자가 로그를 남기면 크래시합니다.
그래서 <em>“전역 객체를 최소화”</em>가 근본 해법입니다.</div>
</div>
</div>`);

sl('C++','C++ 디버깅 체크리스트', `
<h1><span class="no">7.22</span>C++ 디버깅 체크리스트</h1>
<ul class="chk" data-demo="chk">
<li><span class="txt">ASan/UBSan 빌드로 테스트를 한 번 통과시켰는가</span></li>
<li><span class="txt"><code>_GLIBCXX_DEBUG</code> 또는 <code>_ITERATOR_DEBUG_LEVEL=2</code>로 돌려봤는가</span></li>
<li><span class="txt">모든 다형 기반 클래스에 <strong>가상 소멸자</strong>가 있는가</span></li>
<li><span class="txt">참조·<code>string_view</code>·<code>span</code>이 임시 객체를 가리키지 않는가</span></li>
<li><span class="txt">람다의 캡처가 비동기 실행 후에도 유효한가</span></li>
<li><span class="txt"><code>shared_ptr</code> 순환이 없는가(부모 방향은 <code>weak_ptr</code>)</span></li>
<li><span class="txt">전역/정적 객체 간 초기화 의존이 없는가</span></li>
<li><span class="txt">모든 번역 단위가 <strong>동일한 빌드 플래그</strong>인가(ODR)</span></li>
<li><span class="txt">예외가 소멸자 밖으로 나가지 않는가</span></li>
<li><span class="txt"><code>std::thread</code>를 join/detach 하는가</span></li>
<li><span class="txt">테스트 실패 메시지에 값이 보이도록 <code>operator&lt;&lt;</code>를 제공했는가</span></li>
</ul>
<div class="fx big">C++ 디버깅의 특수성: <strong>수명(lifetime)과 소유권</strong>이 버그의 절반입니다.
“이 객체는 누가 소유하고 언제 죽는가”를 문장으로 답할 수 없으면, 그것이 곧 다음 버그입니다.</div>`);

sl('Java','스택 트레이스 정독법', `
<h1><span class="no">7.24</span>Java 스택 트레이스 정독</h1>
<div class="trace">
<div class="fr head">java.lang.RuntimeException: 주문 처리 실패</div>
<div class="fr mine">	at com.app.OrderService.process(OrderService.java:64)</div>
<div class="fr lib">	at org.springframework.aop...invoke(ReflectiveMethodInvocation.java:186)</div>
<div class="fr lib">	... 32 more</div>
<div class="fr head">Caused by: java.lang.NullPointerException: Cannot invoke "com.app.User.getId()" because "user" is null</div>
<div class="fr mine">	at com.app.OrderService.validate(OrderService.java:88)   ← <b>진짜 현장</b></div>
<div class="fr mine">	at com.app.OrderService.process(OrderService.java:61)</div>
<div class="fr head">	Suppressed: java.io.IOException: Stream closed</div>
<div class="fr mine">		at com.app.OrderService.close(OrderService.java:120)</div>
</div>
<div class="cols">
<div>
<h3>읽는 순서</h3>
<ol>
<li><strong>맨 아래 <code>Caused by</code></strong>부터 — 근본 원인</li>
<li>그 안에서 <strong>내 패키지 첫 프레임</strong></li>
<li><code>Suppressed</code>는 try-with-resources의 <em>정리 중 예외</em> — 별개 문제일 수 있음</li>
<li><code>... 32 more</code>는 상위와 중복된 프레임 생략</li>
</ol>
<div class="tip"><strong>Helpful NPE</strong>(JDK 14+, 15부터 기본 ON):
<code>Cannot invoke "User.getId()" because "user" is null</code> —
<em>어떤 변수가 null인지</em>까지 알려줍니다. 켜져 있지 않다면
<code>-XX:+ShowCodeDetailsInExceptionMessages</code>.</div>
</div>
<div>
<div class="danger"><strong>스택이 사라지는 경우</strong><br>
JIT가 같은 예외를 반복 throw하면 <em>스택 트레이스 없는 예외</em>로 최적화합니다
(<code>OmitStackTraceInFastThrow</code>).
운영에서 <code>NullPointerException</code>만 덜렁 찍힌다면 이것입니다.<br>
→ 조사 중에는 <code>-XX:-OmitStackTraceInFastThrow</code>로 끄세요.</div>
<pre class="code"><code><span class="cm">// 예외를 다시 던질 때 원인을 반드시 연결</span>
<span class="kw">catch</span> (IOException e) {
    <span class="kw">throw new</span> ServiceException(<span class="st">"주문 저장 실패 id="</span> + id, e);  <span class="cm">// ← e 전달!</span>
}
<span class="cm">// ✗ throw new ServiceException("실패");  // 원인 소실 = 디버깅 불가</span></code></pre>
</div>
</div>`);

<pre class="code"><code><span class="st">"http-nio-8080-exec-3"</span> #42 daemon prio=5 tid=0x00007f... nid=0x1a3c
   java.lang.Thread.State: <span class="er">BLOCKED</span> (on object monitor)

<div class="tw"><table class="tbl">
<thead><tr><th>스레드 상태</th><th>의미</th><th>대응</th></tr></thead>
<tbody>
<tr><td><strong>BLOCKED</strong></td><td><code>synchronized</code> 진입 대기</td><td>락 순서·경합 조사 — 데드락 후보</td></tr>
<tr><td><strong>WAITING</strong></td><td><code>wait()</code>, <code>join()</code>, 무기한 park</td><td>깨워줄 주체가 있는지 확인</td></tr>

<tr><td>RUNNABLE이 다수 + CPU 100%</td><td>진짜 CPU 소비</td><td>프로파일러로</td></tr>
</tbody>

sl('Java','OutOfMemoryError 유형별 대응', `
<h1><span class="no">7.26</span>OOM 유형별 진단</h1>
<div class="tw"><table class="tbl">
<thead><tr><th>메시지</th><th>의미</th><th>조사</th></tr></thead>
<tbody>
<tr><td><code>Java heap space</code></td><td>힙 부족 (누수 or 부족)</td><td>힙 덤프 + MAT</td></tr>
<tr><td><code>GC overhead limit exceeded</code></td><td>GC에 98% 시간, 회수 2% 미만</td><td>사실상 힙 부족</td></tr>
<tr><td><code>Metaspace</code></td><td>클래스 메타데이터 초과</td><td>클래스로더 누수(핫 리로드·동적 프록시)</td></tr>
<tr><td><code>Direct buffer memory</code></td><td>NIO 다이렉트 버퍼</td><td><code>-XX:MaxDirectMemorySize</code>, Netty 누수 탐지</td></tr>
<tr><td><code>unable to create native thread</code></td><td>OS 스레드 한도</td><td>스레드 누수, <code>ulimit -u</code></td></tr>
<tr><td><code>Requested array size exceeds VM limit</code></td><td>배열 크기 &gt; 2^31</td><td>크기 계산 버그</td></tr>
<tr><td>컨테이너 <code>OOMKilled</code>(137)</td><td><strong>힙 밖 메모리 포함 초과</strong></td><td>Metaspace+스택+네이티브 합산</td></tr>
</tbody>
</table></div>
<pre class="code sh"><code><span class="cm"># 운영 필수 설정 — OOM 순간 자동 덤프</span>
-XX:+HeapDumpOnOutOfMemoryError
-XX:HeapDumpPath=/var/log/app/heap.hprof
-XX:+ExitOnOutOfMemoryError            <span class="cm"># 좀비 상태 방지</span>
-Xlog:gc*:file=/var/log/app/gc.log:time,uptime:filecount=5,filesize=20M

<span class="cm"># 수동 수집·분석</span>
$ jcmd 1234 GC.heap_dump /tmp/heap.hprof
$ jmap -histo:live 1234 | head -30      <span class="cm"># 즉석 상위 타입</span>
$ jhat / Eclipse MAT / VisualVM 으로 열기

<span class="cm"># 컨테이너에서 힙 한도 자동 인식 (필수)</span>
-XX:MaxRAMPercentage=75.0               <span class="cm"># cgroup 한도 기준</span></code></pre>
<div class="tip"><strong>MAT 사용법 요약</strong>: 힙 덤프를 열고
<em>Leak Suspects Report</em>를 먼저 보세요. 대개 “어떤 컬렉션이 N MB를 붙잡고 있다”를
바로 알려줍니다. 그다음 <em>Dominator Tree</em>와 <em>Path to GC Roots</em>로 누가 참조하는지 확인합니다.</div>`);

</table></div>
<pre class="code sh"><code><span class="cm"># async-profiler — 운영에서도 쓸 수 있는 저오버헤드 프로파일러</span>
$ java -jar ap-loader.jar profiler -d 30 -e cpu -f cpu.html 1234
$ ... -e alloc -f alloc.html 1234       <span class="cm"># 할당 플레임그래프</span>
$ ... -e lock  -f lock.html 1234        <span class="cm"># 락 경합</span>
$ ... -e wall -t -f wall.html 1234      <span class="cm"># 벽시계 시간(대기 포함)</span>

<span class="cm"># JFR</span>
$ jcmd 1234 JFR.start name=p settings=profile duration=120s filename=/tmp/p.jfr
$ jfr summary /tmp/p.jfr
$ jfr print --events CPULoad,GCPhasePause /tmp/p.jfr | head -50</code></pre>
<div class="note"><strong>wall-clock 프로파일</strong>이 중요합니다. CPU 프로파일은 “대기 중인 스레드”를 보여주지 않아
<em>“느린데 CPU는 놀고 있다”</em>를 설명하지 못합니다. async-profiler의 <code>-e wall</code>이 그 답입니다.</div>`);

sl('Java','클래스로더·의존성 문제', `
<h1><span class="no">7.29</span>클래스로더 · 의존성 지옥</h1>
<div class="tw"><table class="tbl">
<thead><tr><th>예외</th><th>의미</th><th>원인</th></tr></thead>
<tbody>
<tr><td><code>ClassNotFoundException</code></td><td>런타임에 <strong>찾지 못함</strong></td><td>클래스패스 누락, 리플렉션 이름 오타</td></tr>
<tr><td><code>NoClassDefFoundError</code></td><td>컴파일 시엔 있었는데 <strong>지금 없음</strong></td><td>의존성 누락, <em>또는 static 초기화 실패</em></td></tr>
<tr><td><code>NoSuchMethodError</code></td><td>클래스는 있는데 메서드가 없음</td><td><strong>버전 불일치</strong> (전형적)</td></tr>
<tr><td><code>AbstractMethodError</code></td><td>구현체가 인터페이스 신버전 미구현</td><td>라이브러리 부분 업그레이드</td></tr>
<tr><td><code>IncompatibleClassChangeError</code></td><td>바이너리 호환성 파괴</td><td>재컴파일 없이 라이브러리 교체</td></tr>
<tr><td><code>LinkageError</code>/중복 클래스</td><td>같은 클래스가 두 jar에</td><td>shading 필요</td></tr>
</tbody>
</table></div>
<pre class="code sh"><code><span class="cm"># 어떤 jar에서 클래스가 로드됐는지 (핵심 진단)</span>
$ java -verbose:class -jar app.jar | grep <span class="st">'com.example.Foo'</span>
[Loaded com.example.Foo from file:/opt/app/lib/<span class="er">old-lib-1.2.jar</span>]

<span class="cm"># 실행 중 확인 (코드에서)</span>
System.out.println(Foo.<span class="kw">class</span>.getProtectionDomain().getCodeSource().getLocation());

<span class="cm"># 의존성 트리와 충돌</span>
$ mvn dependency:tree -Dverbose -Dincludes=com.google.guava
$ mvn dependency:analyze
$ gradle dependencies --configuration runtimeClasspath
$ gradle dependencyInsight --dependency guava

<span class="cm"># jar 안에 클래스가 있는지</span>
$ unzip -l app.jar | grep Foo.class
$ for j in lib/*.jar; do unzip -l $j | grep -q Foo.class &amp;&amp; echo $j; done</code></pre>
<div class="tip"><code>NoSuchMethodError</code>를 만나면 <strong>즉시 <code>-verbose:class</code></strong>를 켜세요.
“어떤 jar에서 로드됐는가”가 답의 90%입니다.
같은 클래스를 제공하는 jar가 둘 이상이면 클래스패스 순서에 따라 <em>운으로</em> 결정됩니다.</div>`);

sl('Java','동시성 디버깅 (Java)', `
<h1><span class="no">7.30</span>Java 동시성 디버깅</h1>
<pre class="code bad"><code><span class="cm">// ① 가시성 문제 — 다른 스레드가 변경을 영원히 못 볼 수 있음</span>
<span class="kw">private boolean</span> running = <span class="kw">true</span>;         <span class="cm">// volatile 없음</span>
<span class="kw">public void</span> stop(){ running = <span class="kw">false</span>; }
<span class="kw">public void</span> run(){ <span class="kw">while</span>(running){ work(); } }   <span class="cm">// 무한 루프 가능</span>

<span class="cm">// ② 복합 연산의 비원자성</span>
<span class="kw">if</span> (!map.containsKey(k)) map.put(k, v);      <span class="cm">// check-then-act</span>
count++;                                     <span class="cm">// read-modify-write</span>

<span class="cm">// ③ 동기화 컬렉션의 오해</span>
Map&lt;K,V&gt; m = Collections.synchronizedMap(...);
<span class="kw">for</span> (K k : m.keySet()) {}                    <span class="cm">// 순회는 여전히 수동 동기화 필요</span></code></pre>
<pre class="code fix"><code><span class="kw">private volatile boolean</span> running = <span class="kw">true</span>;
map.putIfAbsent(k, v);                       <span class="cm">// 또는 computeIfAbsent</span>
AtomicInteger count = <span class="kw">new</span> AtomicInteger();  count.incrementAndGet();
Map&lt;K,V&gt; m = <span class="kw">new</span> ConcurrentHashMap&lt;&gt;();</code></pre>
<div class="cols">
<div><h3>진단 도구</h3>
<ul>
<li><strong>jstack</strong> — BLOCKED/WAITING 분포, 데드락 자동 탐지</li>
<li><strong>async-profiler <code>-e lock</code></strong> — 락 경합 핫스팟</li>
<li><strong>JFR</strong> — <code>jdk.JavaMonitorEnter</code> 이벤트</li>
<li><strong>jcstress</strong> — 메모리 모델 수준 검증(라이브러리 개발자용)</li>
<li><strong>ThreadMXBean</strong> — 코드에서 데드락 감지</li>
</ul>
<pre class="code"><code>ThreadMXBean mx = ManagementFactory.getThreadMXBean();
<span class="kw">long</span>[] ids = mx.findDeadlockedThreads();
<span class="kw">if</span> (ids != <span class="kw">null</span>) { <span class="cm">/* 로그 남기고 알림 */</span> }</code></pre>
</div>
<div>
<div class="note"><strong>재현이 어려운 이유</strong>: 가시성 문제는 JIT 최적화가 개입한 뒤에야 나타납니다.
그래서 <em>짧은 테스트에서는 안 나오고 운영에서 1시간 뒤</em>에 나옵니다.<br>
→ 테스트에서는 <code>-Xint</code>(인터프리터) vs 기본 실행을 <strong>둘 다</strong> 해보고,
루프를 수백만 회 돌려 JIT를 유도하세요.</div>
<div class="tip"><strong>가상 스레드(JDK 21+)</strong> 디버깅: <code>jcmd PID Thread.dump_to_file -format=json /tmp/t.json</code>으로
수만 개의 가상 스레드 스택을 덤프할 수 있습니다. <code>jstack</code>은 가상 스레드를 보여주지 않습니다.</div>
</div>
</div>`);

<li><strong>관찰</strong>: 입력 1000, 출력 995 → 5건이 “사라짐”. 예외 없음 = <em>흐름이 아니라 데이터</em> 문제</li>
<li><strong>가설</strong>: 필터에서 걸림 / 예외 삼킴 / <strong>키 충돌</strong></li>
<li><strong>실험 (1분)</strong>: <code>assert len(results) == len(items)</code> 추가 → 즉시 실패</li>
<li><strong>확정</strong>: <code>Counter(it.user_id for it in items).most_common(3)</code> → 중복 5건</li>
</ol>
<pre class="code fix"><code>results = []
seen = collections.Counter()
<span class="kw">for</span> it <span class="kw">in</span> items:
    seen[it.user_id] += <span class="nb">1</span>
    results.append(transform(it))
<span class="kw">if</span> dups := [k <span class="kw">for</span> k, c <span class="kw">in</span> seen.items() <span class="kw">if</span> c &gt; <span class="nb">1</span>]:
    log.warning(<span class="st">"중복 user_id %d건: %s"</span>, len(dups), dups[:<span class="nb">5</span>])
<span class="kw">assert</span> len(results) == len(items)   <span class="cm"># 불변식</span></code></pre>
</div>
</div>
<div class="fx"><strong>일반 원리</strong>: “개수가 맞지 않는다”는 증상에는
<strong>입력 개수 == 출력 개수</strong> 불변식을 파이프라인 각 단계에 넣으세요.
어느 단계에서 줄어드는지가 <em>즉시</em> 드러납니다. 이것이 계층적 이분 탐색의 실제 적용입니다.</div>`);

<thead><tr><th>고루틴 상태</th><th>의미</th><th>의심</th></tr></thead>
<tbody>
<tr><td><code>running</code></td><td>실행 중</td><td>패닉 지점</td></tr>
<tr><td><code>chan send/receive</code></td><td>채널 대기</td><td>상대가 없거나 닫히지 않음 → <strong>고루틴 누수</strong></td></tr>
<tr><td><code>select</code></td><td>select 대기</td><td>default 없는 select + 모든 케이스 블록</td></tr>
<tr><td><code>semacquire</code></td><td>뮤텍스/WaitGroup 대기</td><td>락 미해제, Wait 카운트 불일치</td></tr>
<tr><td><code>IO wait</code></td><td>네트워크</td><td>타임아웃 미설정</td></tr>
<tr><td><code>sleep</code></td><td>time.Sleep</td><td>보통 정상</td></tr>
<tr><td>괄호 안 시간(<code>5 minutes</code>)</td><td>그 상태로 대기한 시간</td><td><strong>긴 값 = 누수 신호</strong></td></tr>
</tbody>
</table></div>
<pre class="code"><code><span class="cm">// 실행 중 모든 고루틴 스택 얻기 (SIGQUIT 대신 코드로)</span>
<span class="kw">import</span> <span class="st">"runtime"</span>
buf := make([]<span class="kw">byte</span>, <span class="nb">1</span>&lt;&lt;<span class="nb">20</span>)
n := runtime.Stack(buf, <span class="kw">true</span>)   <span class="cm">// true = 모든 고루틴</span>
log.Printf(<span class="st">"goroutines:\\n%s"</span>, buf[:n])
<span class="cm">// 또는: kill -QUIT PID  (GOTRACEBACK=all 이면 전부 출력)</span></code></pre>`);

        <span class="kw">go</span> <span class="kw">func</span>(u <span class="kw">string</span>){ ch &lt;- get(u) }(u)

<pre class="code sh"><code><span class="cm"># 진단: 고루틴 수 추적</span>

sl('Go','데이터 레이스와 -race', `
<h1><span class="no">7.50</span>go -race 완전 활용</h1>
<pre class="code sh"><code>$ go test -race -count=10 ./...
$ go run -race main.go
$ go build -race -o app-race .        <span class="cm"># 스테이징에 배포해도 좋음</span></code></pre>
<pre class="code"><code><span class="er">WARNING: DATA RACE</span>
Write at 0x00c0000b4010 by goroutine 8:
  main.(*Counter).Inc()
      /app/counter.go:15 +0x3c
Previous read at 0x00c0000b4010 by goroutine 7:
  main.(*Counter).Value()
      /app/counter.go:20 +0x2e
Goroutine 8 (running) created at:
  main.main()
      /app/main.go:22 +0x8c</code></pre>
<div class="cols">
<div><h3>해결 3가지 방법</h3>
<pre class="code fix"><code><span class="cm">// ① 뮤텍스</span>
<span class="kw">type</span> Counter <span class="kw">struct</span>{ mu sync.Mutex; n <span class="kw">int</span> }
<span class="kw">func</span> (c *Counter) Inc(){ c.mu.Lock(); c.n++; c.mu.Unlock() }

<span class="cm">// ② 원자 연산</span>
<span class="kw">var</span> n atomic.Int64
n.Add(<span class="nb">1</span>); v := n.Load()

<span class="cm">// ③ 채널로 소유권 이전 (Go 스타일)</span>
<span class="cm">// "Don't communicate by sharing memory;</span>
<span class="cm">//  share memory by communicating."</span></code></pre>
</div>
<div>
<div class="note"><strong>-race의 성격</strong>
<ul>
<li>비용: CPU 2~20배, 메모리 5~10배 → 운영 기본 배포엔 부적합</li>
<li><strong>실행된 코드 경로만</strong> 검사 → 테스트 커버리지가 곧 검출력</li>
<li>오탐이 거의 없음 — 경고가 나오면 <em>진짜 버그</em></li>
</ul></div>
<div class="tip"><code>-count=10</code>과 <code>-race</code>를 함께 쓰세요.
레이스는 스케줄에 의존하므로 반복이 검출 확률을 크게 올립니다.
CI 야간 잡에서 <code>-count=100</code>도 좋은 투자입니다.</div>
</div>
</div>
<pre class="code bad"><code><span class="cm">// Go 특유의 함정: 루프 변수 캡처 (Go 1.22 이전)</span>
<span class="kw">for</span> _, v := <span class="kw">range</span> items {
    <span class="kw">go</span> <span class="kw">func</span>(){ use(v) }()      <span class="cm">// 1.21까지: 모든 고루틴이 마지막 v를 봄</span>
}
<span class="cm">// 해결: go func(v T){...}(v)  또는 Go 1.22+ 로 업그레이드(의미 변경됨)</span></code></pre>`);

    },
}
req, _ := http.NewRequestWithContext(ctx, <span class="st">"GET"</span>, url, <span class="kw">nil</span>)
resp, err := client.Do(req)
<span class="kw">if</span> err != <span class="kw">nil</span> { <span class="kw">return</span> fmt.Errorf(<span class="st">"GET %s: %w"</span>, url, err) }
<span class="kw">defer</span> resp.Body.Close()                 <span class="cm">// ★ 반드시</span>
<span class="kw">defer</span> io.Copy(io.Discard, resp.Body)    <span class="cm">// 커넥션 재사용을 위해 본문 소진</span>

<span class="kw">select</span> {
<span class="kw">case</span> &lt;-ctx.Done(): <span class="kw">return</span> ctx.Err()
<span class="kw">case</span> &lt;-time.After(<span class="nb">10</span>*time.Second):
}</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>증상</th><th>확인</th></tr></thead>
<tbody>
<tr><td>고루틴이 계속 증가</td><td><code>Body.Close()</code> 누락, context 미전파</td></tr>
<tr><td><code>context deadline exceeded</code></td><td>어느 계층의 타임아웃인지 — 에러 래핑으로 식별</td></tr>
<tr><td><code>context canceled</code></td><td>상위가 취소 — 클라이언트 연결 끊김이 흔함(정상일 수도)</td></tr>
<tr><td>TIME_WAIT 폭증</td><td>커넥션 재사용 실패 → 본문 미소진, <code>MaxIdleConnsPerHost</code> 과소</td></tr>
<tr><td>간헐적 EOF</td><td>서버 idle timeout &lt; 클라이언트 keep-alive</td></tr>
</tbody>
</table></div>`);

    <span class="kw">var</span> parts []<span class="kw">string</span>
    <span class="kw">for</span> k := <span class="kw">range</span> m {          <span class="cm">// Go는 맵 순회 순서를 의도적으로 무작위화</span>
        parts = append(parts, k)
    }
    <span class="kw">return</span> strings.Join(parts, <span class="st">","</span>)
}</code></pre>
<div class="note">Go 런타임은 <strong>고의로</strong> 맵 순회 시작점을 난수화합니다.
“순서에 의존하지 마라”를 언어가 강제하는 것이죠.
그래서 이 버그는 <em>운에 따라</em> 드러납니다.</div>
</div>
<div>
<h3>추적</h3>
<ol>
<li><strong>관찰</strong>: 실패가 값이 아니라 <em>순서</em>에 관한 것</li>
<li><strong>가설</strong>: 순서 비결정 소스가 있다 (맵/고루틴/시간)</li>
<li><strong>실험</strong>: <code>go test -count=50</code> 로컬 → 재현! (CI만의 문제가 아니었음)</li>
<li><strong>확정</strong>: <code>grep -n "for .* := range .*map"</code></li>
</ol>
<pre class="code fix"><code>keys := make([]<span class="kw">string</span>, <span class="nb">0</span>, len(m))

<code>-count=N</code>으로 로컬 재현을 먼저 시도하세요.</div>
</div>

sl('JavaScript','비동기 디버깅 — 사라지는 스택', `
<h1><span class="no">7.59</span>비동기 스택 트레이스</h1>
<pre class="code bad"><code><span class="cm">// ① 콜백/프로미스 경계에서 스택이 끊긴다</span>

<span class="cm">// → 스택에 "어디서 setTimeout을 호출했는지"가 없음</span>

<span class="cm">// ② 미처리 프로미스 거부 — 조용히 사라짐</span>

<span class="cm">// ③ async 함수에서 try 밖의 await</span>
<span class="kw">async function</span> f(){
  <span class="kw">const</span> a = <span class="kw">await</span> g();     <span class="cm">// 여기서 reject되면 f의 호출자가 잡아야 함</span>

<pre class="code fix"><code><span class="cm">// 전역 안전망 — 반드시 설치</span>

  console.error(<span class="st">'unhandled rejection:'</span>, e.reason?.stack || e.reason);

window.addEventListener(<span class="st">'error'</span>, e =&gt; console.error(<span class="st">'uncaught:'</span>, e.error));

<span class="cm">// Node.js</span>
process.on(<span class="st">'unhandledRejection'</span>, (reason, p) =&gt; {

  process.exitCode = <span class="nb">1</span>;
});

sl('JavaScript','실전 케이스 — 무한 리렌더', `
<h1><span class="no">7.67</span>실전 — “페이지가 얼어붙어요”</h1>
<div class="cols">
<div>
<h3>관찰 → 가설</h3>
<ul>
<li>특정 페이지에서 브라우저 탭이 멈춤, 팬이 돌아감</li>
<li>Performance 녹화 → 같은 함수가 <strong>초당 수천 번</strong></li>
<li>콘솔에 <code>Maximum update depth exceeded</code>(React)</li>
</ul>
<pre class="code bad"><code><span class="cm">// 매 렌더마다 새 객체 → 의존성이 항상 "변경됨"</span>
useEffect(() =&gt; {
  fetchData(filters);
}, [filters]);            <span class="cm">// filters = {a:1} 리터럴이면 매번 새 참조</span>

<span class="cm">// 렌더 중 상태 변경</span>
<span class="kw">function</span> C(){
  <span class="kw">const</span> [n, setN] = useState(<span class="nb">0</span>);
  setN(n + <span class="nb">1</span>);           <span class="cm">// 무한 루프</span>
  <span class="kw">return</span> &lt;div&gt;{n}&lt;/div&gt;;
}</code></pre>
</div>
<div>
<h3>추적 도구</h3>
<ul>
<li><strong>Performance</strong> 탭: 반복되는 프레임 패턴</li>
<li><strong>React DevTools Profiler</strong>: “왜 이 컴포넌트가 렌더됐나”</li>
<li><code>console.count('render')</code>로 횟수 즉시 확인</li>
<li>중단점 + <strong>호출 스택</strong>: 누가 setState를 호출했나</li>
</ul>
<pre class="code fix"><code><span class="kw">const</span> filters = useMemo(() =&gt; ({a, b}), [a, b]);
useEffect(() =&gt; { fetchData(filters); }, [filters]);

<span class="cm">// 또는 원시값을 의존성으로</span>
useEffect(() =&gt; { fetchData({a, b}); }, [a, b]);</code></pre>
<div class="tip"><strong>일반 원리</strong>: “무한 루프”는 대개
<em>상태 변경 → 재실행 → 상태 변경</em>의 순환입니다.
스택 트레이스에서 <strong>같은 함수가 반복 등장</strong>하면 순환을 찾은 것입니다.
끊을 지점은 “변경이 필요 없는데 변경으로 인식되는 곳”입니다.</div>
</div>
</div>`);

sl('TypeScript','타입 에러 읽는 법', `
<h1><span class="no">7.71</span>긴 타입 에러 해독</h1>
<pre class="code"><code><span class="er">error TS2345:</span> Argument of type
  <span class="st">'{ id: number; name: string; tags: (string | undefined)[]; }'</span>
is not assignable to parameter of type <span class="st">'User'</span>.
  Types of property <span class="st">'tags'</span> are incompatible.
    Type <span class="st">'(string | undefined)[]'</span> is not assignable to type <span class="st">'string[]'</span>.
      Type <span class="st">'string | undefined'</span> is not assignable to type <span class="st">'string'</span>.
        Type <span class="st">'undefined'</span> is not assignable to type <span class="st">'string'</span>.   <span class="cm">← 진짜 원인</span></code></pre>
<div class="cols">
<div>
<h3>읽는 규칙</h3>
<ol>
<li><strong>가장 안쪽(마지막) 줄</strong>이 진짜 불일치</li>
<li>위로 올라가며 “어느 속성 경로”인지 확인</li>
<li>여러 오버로드 후보가 나오면 <em>가장 그럴듯한 하나</em>만 보기</li>
<li>제네릭이 <code>unknown</code>으로 추론됐다면 <strong>추론 실패</strong> — 명시적 타입 인자를 주고 다시 보기</li>
</ol>
</div>
<div>
<h3>타입 디버깅 기법</h3>
<pre class="code"><code><span class="cm">// ① 중간 타입을 강제로 노출</span>
<span class="kw">type</span> Debug&lt;T&gt; = { [K <span class="kw">in keyof</span> T]: T[K] } &amp; {};
<span class="kw">type</span> X = Debug&lt;ComplexType&gt;;    <span class="cm">// 호버하면 펼쳐진 형태로 보임</span>

<span class="cm">// ② 에러 메시지로 타입 출력</span>
<span class="kw">type</span> Show&lt;T&gt; = T <span class="kw">extends</span> <span class="kw">never</span> ? <span class="nb">1</span> : T;
<span class="kw">const</span> _: Show&lt;MyType&gt; = <span class="st">'force error'</span>;   <span class="cm">// 에러에 MyType 실체가 표시됨</span>

<span class="cm">// ③ 단언(assert) 유틸</span>
<span class="kw">type</span> Expect&lt;T <span class="kw">extends</span> <span class="kw">true</span>&gt; = T;
<span class="kw">type</span> Equal&lt;A, B&gt; = (&lt;T&gt;() =&gt; T <span class="kw">extends</span> A ? <span class="nb">1</span> : <span class="nb">2</span>) <span class="kw">extends</span>
                   (&lt;T&gt;() =&gt; T <span class="kw">extends</span> B ? <span class="nb">1</span> : <span class="nb">2</span>) ? <span class="kw">true</span> : <span class="kw">false</span>;
<span class="kw">type</span> _t1 = Expect&lt;Equal&lt;ReturnType&lt;<span class="kw">typeof</span> f&gt;, <span class="kw">string</span>&gt;&gt;;</code></pre>
</div>
</div>
<div class="tip">IDE에서 타입에 <strong>마우스를 올려 실제 추론 결과</strong>를 확인하는 습관이
타입 디버깅의 8할입니다. 추론된 타입이 예상과 다르면 그 지점이 문제의 출발점입니다.</div>`);

sl('TypeScript','타입과 런타임의 간극', `
<h1><span class="no">7.72</span>타입은 런타임을 보호하지 않는다</h1>
<pre class="code bad"><code><span class="cm">// 컴파일은 통과, 런타임은 폭발</span>
<span class="kw">interface</span> User { id: <span class="kw">number</span>; name: <span class="kw">string</span> }

<span class="kw">const</span> res = <span class="kw">await</span> fetch(<span class="st">'/api/user'</span>);
<span class="kw">const</span> user: User = <span class="kw">await</span> res.json();    <span class="cm">// ← json()은 any. 검증 0!</span>
console.log(user.name.toUpperCase());  <span class="cm">// 서버가 name을 안 주면 런타임 크래시</span>

<span class="cm">// 타입 단언은 "믿어라"일 뿐, 검사가 아님</span>
<span class="kw">const</span> u = data <span class="kw">as</span> User;              <span class="cm">// 컴파일러 입 막기</span>
<span class="kw">const</span> n = <span class="st">"5"</span> <span class="kw">as</span> <span class="kw">unknown</span> <span class="kw">as</span> <span class="kw">number</span>;  <span class="cm">// 이중 단언 = 위험 신호</span>
arr[<span class="nb">0</span>]!.name;                          <span class="cm">// non-null 단언 = 미래의 버그</span></code></pre>
<pre class="code fix"><code><span class="cm">// 경계에서 런타임 검증 (zod)</span>
<span class="kw">import</span> { z } <span class="kw">from</span> <span class="st">'zod'</span>;
<span class="kw">const</span> UserSchema = z.object({
  id: z.number().int().positive(),
  name: z.string().min(<span class="nb">1</span>),
  tags: z.array(z.string()).default([]),
});
<span class="kw">type</span> User = z.infer&lt;<span class="kw">typeof</span> UserSchema&gt;;   <span class="cm">// 타입은 스키마에서 파생</span>

<span class="kw">const</span> parsed = UserSchema.safeParse(<span class="kw">await</span> res.json());
<span class="kw">if</span> (!parsed.success) {
  <span class="cm">// 어떤 필드가 왜 틀렸는지 정확히 나옴 → 디버깅 시간 0</span>
  logger.error(<span class="st">'user schema mismatch'</span>, {issues: parsed.error.issues});
  <span class="kw">throw new</span> Error(<span class="st">'invalid user payload'</span>);
}
<span class="kw">const</span> user = parsed.data;</code></pre>
<div class="fx"><strong>디버깅 관점의 이득</strong>: 검증을 경계에 두면
“어디서 잘못된 데이터가 들어왔는가”가 <em>즉시</em> 확정됩니다.
검증이 없으면 그 값은 3개 계층을 지나 <em>엉뚱한 곳</em>에서 터집니다(증상-원인 거리 3~4).</div>
<div class="tip">검증할 곳: HTTP 응답, 요청 본문, 환경변수, DB 조회 결과(스키마 변경!), 메시지 큐 페이로드,
로컬스토리지, URL 파라미터, 설정 파일.</div>`);

sl('TypeScript','any·unknown·단언의 위험 관리', `

<pre class="code sh"><code><span class="cm"># 프로젝트에 any가 얼마나 새어 있나</span>
$ npx type-coverage --detail --at-least 95
$ npx tsc --noEmit --strict 2&gt;&amp;1 | grep -c <span class="st">'implicitly has an'</span>

<span class="cm"># ESLint 규칙 (typescript-eslint)</span>
<span class="st">"@typescript-eslint/no-explicit-any"</span>: <span class="st">"error"</span>
<span class="st">"@typescript-eslint/no-unsafe-assignment"</span>: <span class="st">"error"</span>
<span class="st">"@typescript-eslint/no-unsafe-member-access"</span>: <span class="st">"error"</span>
<span class="st">"@typescript-eslint/no-unsafe-argument"</span>: <span class="st">"error"</span>
<span class="st">"@typescript-eslint/no-floating-promises"</span>: <span class="st">"error"</span>   <span class="cm"># ★ await 누락</span>
<span class="st">"@typescript-eslint/no-misused-promises"</span>: <span class="st">"error"</span>
<span class="st">"@typescript-eslint/await-thenable"</span>: <span class="st">"error"</span></code></pre>
<div class="cols">
<div><pre class="code"><code><span class="cm">// unknown 으로 받고 좁혀 나가기 (권장)</span>
<span class="kw">function</span> handle(e: <span class="kw">unknown</span>) {
  <span class="kw">if</span> (e <span class="kw">instanceof</span> Error) log(e.message, e.stack);
  <span class="kw">else if</span> (<span class="kw">typeof</span> e === <span class="st">'string'</span>) log(e);
  <span class="kw">else</span> log(<span class="st">'unknown error'</span>, JSON.stringify(e));
}

<span class="cm">// 사용자 정의 타입 가드</span>
<span class="kw">function</span> isUser(v: <span class="kw">unknown</span>): v <span class="kw">is</span> User {
  <span class="kw">return</span> <span class="kw">typeof</span> v === <span class="st">'object'</span> &amp;&amp; v !== <span class="kw">null</span> &amp;&amp;
    <span class="st">'id'</span> <span class="kw">in</span> v &amp;&amp; <span class="kw">typeof</span> (v <span class="kw">as</span> any).id === <span class="st">'number'</span>;
}</code></pre></div>
<div>
<div class="danger"><strong><code>no-floating-promises</code>는 반드시 켜세요.</strong>
<code>await</code>를 빠뜨린 프로미스는 에러가 조용히 사라지고
순서가 뒤엉킵니다. TS 프로젝트에서 <em>가장 자주 발생하는 런타임 버그</em>이며,
이 규칙 하나로 전부 잡힙니다.</div>
<div class="note"><strong>단언이 필요한 정당한 경우</strong>도 있습니다
(테스트 픽스처, 검증 직후, 외부 라이브러리 타입 오류).
그럴 땐 <code>// 이유:</code> 주석을 반드시 남기세요.
주석 없는 <code>as</code>는 미래의 디버깅 비용입니다.</div>
</div>
</div>`);

sl('TypeScript','빌드·모듈 해석 문제', `

sl('TypeScript','실전 케이스 — 타입은 맞는데 런타임 실패', `
<h1><span class="no">7.75</span>실전 — 타입은 통과, 런타임은 실패</h1>
<div class="cols">
<div>
<h3>증상</h3>
<ul>
<li>운영 배포 후 <code>Cannot read properties of undefined (reading 'toFixed')</code></li>
<li>로컬·스테이징 정상, 특정 사용자만 실패</li>
<li>코드에는 <code>order.total: number</code>로 명시돼 있음</li>
</ul>
<pre class="code bad"><code><span class="kw">interface</span> Order { id: <span class="kw">number</span>; total: <span class="kw">number</span> }
<span class="kw">const</span> orders = (<span class="kw">await</span> api.get(<span class="st">'/orders'</span>)).data <span class="kw">as</span> Order[];
orders.map(o =&gt; o.total.toFixed(<span class="nb">2</span>));   <span class="cm">// 💥</span></code></pre>
</div>
<div>
<h3>추적</h3>
<ol>
<li><strong>관찰</strong>: 특정 사용자만 → <em>데이터 성질</em> 문제</li>
<li><strong>실험</strong>: 그 사용자의 API 응답을 직접 확인
<pre class="code sh"><code>$ curl -s .../orders -H <span class="st">"Authorization: ..."</span> | jq <span class="st">'.data[] | select(.total == null)'</span>
{<span class="st">"id"</span>: 8123, <span class="st">"total"</span>: null}   <span class="cm">← 취소된 주문은 total이 null</span></code></pre></li>
<li><strong>확정</strong>: 서버 스키마에 <code>total: number | null</code>이 반영 안 됨.
<code>as Order[]</code>가 그 사실을 <em>가려버림</em></li>
</ol>
<pre class="code fix"><code><span class="kw">const</span> OrderSchema = z.object({
  id: z.number(),
  total: z.number().nullable(),
});
<span class="kw">const</span> orders = z.array(OrderSchema).parse((<span class="kw">await</span> api.get(<span class="st">'/orders'</span>)).data);
orders.map(o =&gt; o.total?.toFixed(<span class="nb">2</span>) ?? <span class="st">'-'</span>);</code></pre>
</div>
</div>
<div class="fx"><strong>교훈</strong>: <code>as</code>는 <em>컴파일러를 침묵시키는 도구</em>이지 검증이 아닙니다.
“타입이 맞는데 런타임에 틀리다”면 거의 항상 <strong>경계에서 단언을 썼기 때문</strong>입니다.
버그를 고친 뒤 <code>grep -rn " as " src/</code>로 <em>형제 버그</em>를 함께 찾으세요.</div>`);

sl('TypeScript','TypeScript 체크리스트', `
<h1><span class="no">7.76</span>TypeScript 체크리스트</h1>
<ul class="chk" data-demo="chk">
<li><span class="txt"><code>strict: true</code>가 켜져 있는가</span></li>
<li><span class="txt"><code>noUncheckedIndexedAccess</code>를 검토했는가</span></li>
<li><span class="txt">외부 데이터(API·env·DB)를 <strong>런타임 검증</strong>하는가</span></li>
<li><span class="txt"><code>as</code> 단언마다 이유 주석이 있는가</span></li>
<li><span class="txt"><code>no-floating-promises</code> 규칙이 켜져 있는가</span></li>
<li><span class="txt">소스맵이 생성되고 <code>--enable-source-maps</code>로 실행하는가</span></li>
<li><span class="txt">CI에서 <code>tsc --noEmit</code>이 돌아가는가</span></li>
<li><span class="txt">에러 타입을 <code>unknown</code>으로 받고 좁히는가</span></li>
<li><span class="txt">타입 정의와 실제 API 스키마가 <strong>한 소스</strong>에서 나오는가(OpenAPI·zod)</span></li>
<li><span class="txt">중복 설치된 타입 패키지가 없는가(<code>npm ls</code>)</span></li>
</ul>
<div class="fx big">TypeScript의 디버깅 이득은 <strong>버그를 “컴파일 타임으로 이동”</strong>시키는 것입니다.
그런데 경계에서 <code>as</code>로 구멍을 뚫으면 그 이득이 통째로 사라집니다.
<em>구멍의 위치를 관리하는 것</em>이 TS 디버깅의 핵심입니다.</div>`);
