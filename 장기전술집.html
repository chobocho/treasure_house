function findPagesForChapter(name){
  for(let i=0;i<PAGES.length;i++){if(PAGES[i].chapter===name||PAGES[i].title===name)return i;}
  return 0;
}

function renderContentBlock(sec){
  let h='';
  if(sec.h)h+='<h3 class="section">'+escHtml(sec.h)+'</h3>';
  if(sec.p){for(const para of sec.p)h+='<p>'+escHtml(para)+'</p>';}
  if(sec.items){h+='<ul>'+sec.items.map(it=>'<li>'+escHtml(it)+'</li>').join('')+'</ul>';}
  if(sec.tbl){h+=renderTable(sec.tbl);}
  if(sec.tip){h+='<div class="tip">💡 '+escHtml(sec.tip)+'</div>';}
  if(sec.warn){h+='<div class="warn">⚠️ '+escHtml(sec.warn)+'</div>';}
  if(sec.hint){h+='<div class="tip">💡 '+escHtml(sec.hint)+'</div>';}
  if(sec.board){
    const b=startBoard(sec.board);
    h+='<div class="board-wrap">'+renderBoard(b,{scale:.65,id:'b-'+Math.random().toString(36).slice(2,8),interactive:sec.freeBoard})+'</div>';
  }
  if(sec.puzzle){
    h+=renderPuzzleBlock(sec.puzzle);
  }
  if(sec.maxim){h+='<div class="maxim">'+escHtml(sec.maxim)+'</div>';}
  return h;
}

const PUZZLE_STATE = {}; // pid -> {board, selected, lastMove, status, step, solved}

function renderPuzzleBlock(pid){
  const pz=PUZZLES[pid]; if(!pz)return '';
  if(!PUZZLE_STATE[pid]){
    PUZZLE_STATE[pid]={board:parseBoard(pz.board),initBoard:JSON.stringify(pz.board),selected:null,lastMove:null,status:'idle',step:0,statusText:pz.desc};
  }
  const id='pz-'+pid;
  const st=PUZZLE_STATE[pid];
  let h='<h3 class="section">🧩 '+escHtml(pz.title)+'</h3>';
  h+='<p>'+escHtml(pz.desc)+'</p>';
  h+='<div class="board-wrap" data-puzzle="'+pid+'">';
  h+=renderBoard(st.board,{id:id,interactive:true,lastMove:st.lastMove,scale:.65});
  h+='<div class="puzzle-ui">';
  h+='<div class="puzzle-status '+st.status+'" id="status-'+pid+'">'+escHtml(st.statusText)+'</div>';
  h+='<div class="puzzle-buttons">';
  h+='<button class="alt" data-act="hint" data-pz="'+pid+'">💡 힌트</button>';
  h+='<button class="gold" data-act="solve" data-pz="'+pid+'">✓ 정답 보기</button>';
  h+='<button data-act="reset" data-pz="'+pid+'">↻ 되돌리기</button>';
  h+='</div></div></div>';
  return h;
}

function renderPage(idx){
  const p=PAGES[idx]; if(!p)return'';
  let inner='';
  if(p.kind==='part'){
    inner='<div class="cover"><div class="deco">部</div><div class="han-title" style="font-size:48px">'+escHtml(p.title)+'</div><div class="info" style="margin-top:40px">다음 페이지부터 본 부의 내용이 시작됩니다.</div></div>';
    return '<div class="page" data-i="'+idx+'">'+inner+'<div class="page-num">'+(idx+1)+'</div></div>';
  }
  if(p.kind==='section'){
    for(const s of p.sec){
      if(s.type){inner+=renderSection(s);}
      else inner+=renderContentBlock(s);
    }
  }
  return '<div class="page" data-i="'+idx+'">'+inner+'<div class="page-chap">'+escHtml(p.chapter||'')+'</div><div class="page-num">'+(idx+1)+' / '+TOTAL+'</div></div>';
}

window.__deckGo=function(i){showPage(i);};   /* 책갈피 이어보기 */
function showPage(i){
  if(i<0)i=0;if(i>=TOTAL)i=TOTAL-1;
  cur=i;
  bookEl.innerHTML=renderPage(i);
  const pg=bookEl.querySelector('.page');
  // animate
  pg.classList.add('next');
  requestAnimationFrame(()=>{pg.classList.remove('next');pg.classList.add('active');});
  progressTxt.textContent=(i+1)+' / '+TOTAL;
  jumpInput.placeholder=(i+1);
  document.getElementById('prevBtn').disabled=(i===0);
  document.getElementById('nextBtn').disabled=(i===TOTAL-1);
  bindPuzzles();
}

function bindPuzzles(){
  bookEl.querySelectorAll('[data-puzzle]').forEach(wrap=>{
    const pid=wrap.dataset.puzzle;
    wrap.querySelectorAll('.cell-hit').forEach(cell=>{
      cell.addEventListener('click',e=>{
        const [c,r]=cell.dataset.cell.split('-').map(Number);
        onPuzzleClick(pid,c,r);
      });
    });
    wrap.querySelectorAll('button[data-act]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const act=btn.dataset.act;
        if(act==='reset')resetPuzzle(pid);
        else if(act==='hint')showHint(pid);
        else if(act==='solve')showSolution(pid);
      });
    });
  });
}

function onPuzzleClick(pid,c,r){
  const st=PUZZLE_STATE[pid]; if(!st||st.solved)return;
  const p=st.board[r][c];
  if(st.selected){
    const [sc,sr]=st.selected;
    if(sc===c&&sr===r){st.selected=null;refreshPuzzle(pid);return;}
    const mvs=legalMoves(st.board,sc,sr);
    if(mvs.some(([mc,mr])=>mc===c&&mr===r)){
      // attempt move
      attemptPuzzleMove(pid,sc,sr,c,r);
      return;
    }
    // re-select
    if(p && p.s==='cho'){st.selected=[c,r];refreshPuzzle(pid);return;}
    st.selected=null;refreshPuzzle(pid);
  } else {
    if(p && p.s==='cho'){st.selected=[c,r];refreshPuzzle(pid);}
  }
}

function attemptPuzzleMove(pid,fc,fr,tc,tr){
  const st=PUZZLE_STATE[pid], pz=PUZZLES[pid];
  const sol=pz.solution[st.step];
  // accept any solution in solution[0] if step=0 (multiple correct)
  const candidates = Array.isArray(sol)?sol:[sol];
  const expected = pz.solution[st.step];
  // Check: solution can be a single object or we allow multiple at same step?
  // For simplicity: pz.solution is array of single move objects per step
  if(expected.from[0]===fc && expected.from[1]===fr && expected.to[0]===tc && expected.to[1]===tr){
    // accept
    const piece=st.board[fr][fc];
    st.board[tr][tc]=piece;
    st.board[fr][fc]=null;
    st.lastMove=[[fc,fr],[tc,tr]];
    st.selected=null;
    st.step++;
    if(st.step>=pz.solution.length){
      st.solved=true;
      st.status='ok';
      st.statusText='✓ 외통! 정확한 풀이입니다. ('+(expected.note||'')+')';
      flash('🎉 정답!');
    } else {
      // execute forced response automatically
      st.status='ok';
      st.statusText='✓ '+expected.note+' — 한 응수 처리 중…';
      refreshPuzzle(pid);
      setTimeout(()=>{
        if(expected.response){
          const r=expected.response;
          const pp=st.board[r.from[1]][r.from[0]];
          if(pp){
            st.board[r.to[1]][r.to[0]]=pp;
            st.board[r.from[1]][r.from[0]]=null;
            st.lastMove=[[r.from[0],r.from[1]],[r.to[0],r.to[1]]];
          }
        }
        st.statusText='✓ 한의 응수: '+(expected.forced||'멍군')+'. 다음 수를 두세요.';
        refreshPuzzle(pid);
      },900);
      return;
    }
  } else {
    st.status='bad';
    st.statusText='✗ 외통이 안 됩니다. 다시 시도해 보세요.';
    st.selected=null;
    flash('❌ 다시!');
    setTimeout(()=>{
      // revert? Actually we never moved
      st.status='idle';
      st.statusText=pz.desc;
      refreshPuzzle(pid);
    },1500);
  }
  refreshPuzzle(pid);
}

function refreshPuzzle(pid){
  const wrap=bookEl.querySelector('[data-puzzle="'+pid+'"]'); if(!wrap)return;
  const st=PUZZLE_STATE[pid];
  const svgWrap=wrap.querySelector('svg');
  if(!svgWrap)return;
  // re-render board within wrap
  const inner=renderBoard(st.board,{id:'pz-'+pid,interactive:!st.solved,lastMove:st.lastMove,scale:.65});
  svgWrap.outerHTML=inner;
  // re-overlay selection
  if(st.selected){
    const [c,r]=st.selected;
    const [x,y]=px(c,r);
    const newSvg=wrap.querySelector('svg');
    // append selection ring + move dots
    const mvs=legalMoves(st.board,c,r);
    let extra=`<circle class="sel-ring" cx="${x}" cy="${y}" r="22"/>`;
    for(const [mc,mr] of mvs){
      const [mx,my]=px(mc,mr);
      if(st.board[mr][mc]){
        extra+=`<circle class="move-cap" cx="${mx}" cy="${my}" r="20"/>`;
      } else {
        extra+=`<circle class="move-dot" cx="${mx}" cy="${my}" r="7"/>`;
      }
    }
    // insert before closing svg
    newSvg.insertAdjacentHTML('beforeend',extra);
  }
  // update status
  const stEl=wrap.querySelector('.puzzle-status');
  if(stEl){stEl.className='puzzle-status '+st.status;stEl.textContent=st.statusText;}
  // rebind
  wrap.querySelectorAll('.cell-hit').forEach(cell=>{
    cell.addEventListener('click',()=>{
      const [c,r]=cell.dataset.cell.split('-').map(Number);
      onPuzzleClick(pid,c,r);
    });
  });
}

function resetPuzzle(pid){
  const pz=PUZZLES[pid];
  PUZZLE_STATE[pid]={board:parseBoard(pz.board),initBoard:JSON.stringify(pz.board),selected:null,lastMove:null,status:'idle',step:0,statusText:pz.desc,solved:false};
  refreshPuzzle(pid);
  // also reset status (in case className had ok/bad)
  const wrap=bookEl.querySelector('[data-puzzle="'+pid+'"]');
  if(wrap){const s=wrap.querySelector('.puzzle-status');if(s){s.className='puzzle-status idle';s.textContent=pz.desc;}}
}

function showHint(pid){
  const pz=PUZZLES[pid], st=PUZZLE_STATE[pid];
  st.statusText='💡 '+pz.hint;
  st.status='idle';
  refreshPuzzle(pid);
}

function showSolution(pid){
  const pz=PUZZLES[pid], st=PUZZLE_STATE[pid];
  // execute all solution steps
  let i=st.step;
  st.solved=true;
  while(i<pz.solution.length){
    const m=pz.solution[i];
    const p=st.board[m.from[1]][m.from[0]];
    if(!p)break;
    st.board[m.to[1]][m.to[0]]=p;
    st.board[m.from[1]][m.from[0]]=null;
    st.lastMove=[[m.from[0],m.from[1]],[m.to[0],m.to[1]]];
    i++;
  }
  st.step=i;
  st.status='ok';
  st.statusText='✓ 정답 표시: '+pz.solution.map(m=>'('+m.from.join(',')+')→('+m.to.join(',')+')').join(' → ');
  refreshPuzzle(pid);
}

function flash(msg){
  const el=document.getElementById('flash');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(window._fT);
  window._fT=setTimeout(()=>el.classList.remove('show'),1400);
}

// Navigation
document.getElementById('prevBtn').onclick=()=>showPage(cur-1);
document.getElementById('nextBtn').onclick=()=>showPage(cur+1);
document.getElementById('jumpBtn').onclick=()=>{const v=parseInt(jumpInput.value);if(v>=1&&v<=TOTAL)showPage(v-1);};
jumpInput.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=parseInt(jumpInput.value);if(v>=1&&v<=TOTAL)showPage(v-1);}});
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key===' ')showPage(cur+1);
  else if(e.key==='ArrowLeft')showPage(cur-1);
  else if(e.key==='Home')showPage(0);
  else if(e.key==='End')showPage(TOTAL-1);
});

// Swipe support
let touchX=null;
bookEl.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
bookEl.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>60){if(dx<0)showPage(cur+1);else showPage(cur-1);}touchX=null;},{passive:true});

// TOC panel
const tocPanel=document.getElementById('tocPanel'),tocOverlay=document.getElementById('tocOverlay'),tocList=document.getElementById('tocList');
function buildTOC(){
  let h='';
  for(let i=0;i<PARTS.length;i++){
    const p=PARTS[i];
    if(p.s.length===0){h+='<h3>'+escHtml(p.n)+'</h3>';continue;}
    const pg=findPagesForChapter(p.n);
    h+='<a data-jump="'+(pg+1)+'">'+(pg+1)+'. '+escHtml(p.n)+'</a>';
  }
  tocList.innerHTML=h;
  tocList.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{showPage(parseInt(a.dataset.jump)-1);closeTOC();}));
}
function openTOC(){tocPanel.classList.add('open');tocOverlay.classList.add('show');}
function closeTOC(){tocPanel.classList.remove('open');tocOverlay.classList.remove('show');}
document.getElementById('tocBtn').onclick=openTOC;
document.getElementById('tocClose').onclick=closeTOC;
tocOverlay.onclick=closeTOC;

// TOC links inside pages
bookEl.addEventListener('click',e=>{
  const a=e.target.closest('[data-jump]');
  if(a){const v=parseInt(a.dataset.jump);if(v>=1&&v<=TOTAL)showPage(v-1);}
});

buildTOC();
showPage(0);
console.log('총 페이지: '+TOTAL);
</script>
<!-- ===== deck-input-shim v1 : 방향키(↑↓ 스크롤 / ←→ 페이지) + 게임패드 ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckInputShim) return;
  window.__deckInputShim = true;

  /* ---------- 지금 보이는 슬라이드의 스크롤 컨테이너 찾기 ---------- */
  function scrollableAt(x, y) {
    if (!document.elementFromPoint) return null;
    var n = document.elementFromPoint(x, y);
    while (n && n !== document.documentElement) {
      var oy = getComputedStyle(n).overflowY;
      if ((oy === 'auto' || oy === 'scroll' || oy === 'overlay') &&
          n.scrollHeight - n.clientHeight > 4) return n;
      n = n.parentElement;
    }
    return null;
  }
  function scroller() {
    var el = scrollableAt(innerWidth / 2, innerHeight / 2) ||
             scrollableAt(innerWidth / 2, innerHeight * 0.35);
    if (el) return el;
    var m = document.querySelector('main');
    if (m && m.scrollHeight - m.clientHeight > 4) return m;
    return document.scrollingElement || document.documentElement;
  }
  function viewH(el) {
    return (el === document.scrollingElement || el === document.documentElement)
      ? innerHeight : el.clientHeight;
  }
  function isPageScroller(el) {
    return el === document.scrollingElement || el === document.documentElement || el === document.body;
  }
  function scrollStep(dir, smooth) {
    var el = scroller();
    el.scrollBy({ top: dir * Math.max(80, viewH(el) * 0.25),
                  left: 0, behavior: smooth ? 'smooth' : 'auto' });
  }

  /* ---------- 페이지 이동 (덱마다 다른 엔진에 공통으로 붙는다) ---------- */
  function pick(ids) {
    for (var i = 0; i < ids.length; i++) {
      var e = document.getElementById(ids[i]);
      if (e && (e.tagName === 'BUTTON' || e.tagName === 'A')) return e;
    }
    return null;
  }
  function synth(key) {
    document.dispatchEvent(new KeyboardEvent('keydown',
      { key: key, code: key, bubbles: true, cancelable: true }));
  }
  function page(dir) {
    var b = dir > 0 ? pick(['nextBtn', 'btnNext', 'next'])
                    : pick(['prevBtn', 'btnPrev', 'prev']);
    if (b) { if (!b.disabled) b.click(); }
    else synth(dir > 0 ? 'ArrowRight' : 'ArrowLeft');
  }
  function toggleToc() {
    var b = pick(['tocBtn', 'btnToc', 'toc-btn', 'tocOpen']);
    if (b) b.click(); else synth('t');
  }

  /* ---------- 키보드: ↑↓ = 스크롤 (←→ 페이지는 각 덱 엔진이 처리) ---------- */
  function interactive(el) {
    if (!el) return false;
    var t = (el.tagName || '').toUpperCase();
    return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' ||
           t === 'CANVAS' || el.isContentEditable === true;
  }
  addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    if (e.defaultPrevented || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
    if (interactive(e.target) || interactive(document.activeElement)) return;
    var dir = e.key === 'ArrowDown' ? 1 : -1, repeat = e.repeat;
    // 이벤트 전파가 끝난 뒤에 판단한다 — 슬라이드 안의 데모(테트리스 등)가
    // 이 키를 가져갔으면(preventDefault) 스크롤하지 않는다.
    setTimeout(function () {
      if (e.defaultPrevented) return;
      // 문서 자체가 스크롤되는 덱은 브라우저 기본 동작에 맡긴다(이중 스크롤 방지).
      if (isPageScroller(scroller())) return;
      scrollStep(dir, !repeat);
    }, 0);
  });

  /* ---------- 게임패드 (조이패드) ----------
     좌스틱/D-pad 상하 = 스크롤, 좌우 = 이전/다음 페이지
     A·RB·RT = 다음, B·LB·LT = 이전, X·Start = 목차, Back = 첫 장     */
  var DEAD = 0.4, REPEAT = 320, held = {}, lastTurn = 0, lastDir = 0, raf = 0;

  function pads() {
    if (!navigator.getGamepads) return [];
    var out = [], g = navigator.getGamepads();
    for (var i = 0; i < g.length; i++) if (g[i]) out.push(g[i]);
    return out;
  }
  function down(g, i) { var b = g.buttons[i]; return !!b && (b.pressed || b.value > 0.5); }
  function edge(name, isDown, fn) {
    if (isDown) { if (!held[name]) { held[name] = 1; fn(); } }
    else held[name] = 0;
  }

  function poll(now) {
    var list = pads();
    if (!list.length) { raf = 0; return; }
    raf = requestAnimationFrame(poll);

    var ax = 0, ay = 0, bNext = false, bPrev = false, bToc = false, bHome = false;
    for (var k = 0; k < list.length; k++) {
      var g = list[k];
      ax += g.axes[0] || 0;
      ay += g.axes[1] || 0;
      if (down(g, 15)) ax += 1;
      if (down(g, 14)) ax -= 1;
      if (down(g, 13)) ay += 1;
      if (down(g, 12)) ay -= 1;
      bNext = bNext || down(g, 0) || down(g, 5) || down(g, 7);
      bPrev = bPrev || down(g, 1) || down(g, 4) || down(g, 6);
      bToc  = bToc  || down(g, 2) || down(g, 9);
      bHome = bHome || down(g, 8);
    }

    if (Math.abs(ay) > DEAD) {                       // 세로: 부드러운 연속 스크롤
      var mag = Math.min(1, (Math.abs(ay) - DEAD) / (1 - DEAD));
      scroller().scrollBy(0, (ay > 0 ? 1 : -1) * (6 + mag * 22));
    }
    var dir = Math.abs(ax) > DEAD ? (ax > 0 ? 1 : -1) : 0;
    if (dir) {                                       // 가로: 페이지 넘김(리핏 간격)
      if (dir !== lastDir || now - lastTurn > REPEAT) {
        lastDir = dir; lastTurn = now; page(dir);
      }
    } else { lastDir = 0; lastTurn = 0; }

    edge('next', bNext, function () { page(1); });
    edge('prev', bPrev, function () { page(-1); });
    edge('toc',  bToc,  toggleToc);
    edge('home', bHome, function () { synth('Home'); });
  }

  function start() { if (!raf) raf = requestAnimationFrame(poll); }
  addEventListener('gamepadconnected', start);
  addEventListener('focus', function () { if (pads().length) start(); });
  if (pads().length) start();
})();
</script>
<!-- ===== deck-bookmark-shim v3 : IndexedDB 책갈피(읽던 위치 자동 저장 + 이어보기) ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckBookmarkShim) return;
  window.__deckBookmarkShim = true;
  if (!window.indexedDB) return;

  var DB_NAME = 'treasure-house', DB_VER = 1, STORE = 'bookmarks';

  var FILE = location.pathname.split('/').pop() || '';
  try { FILE = decodeURIComponent(FILE); } catch (e) {}
  if (!FILE || /^index\.html?$/i.test(FILE)) return;   // 포털(index.html)은 저장하지 않는다

  /* ---------- IndexedDB 래퍼 ----------
     · 실패한 연결은 캐시하지 않는다 — blocked처럼 일시적인 실패 뒤에 다시 시도한다
     · 버전 변경·저장공간 회수·사이트 데이터 삭제로 연결이 끊기면 버리고 다시 연다
     · 계속 막히는 환경(file://·시크릿·사이트 데이터 차단)이면 3번 만에 단념하고,
       첫 실패 한 번만 콘솔에 남긴다 — 화면에는 아무것도 띄우지 않는다              */
  var dbp = null, conn = null, fails = 0, warned = false, deadp = null;

  function warn(e) {
    if (warned) return;
    warned = true;
    try { console.warn('[bookmark] 책갈피를 건너뜁니다 — IndexedDB 사용 불가:', e); } catch (x) {}
  }
  function drop(c) { if (conn === c) { dbp = null; conn = null; } }
  function dead() {
    if (!deadp) {
      deadp = Promise.reject(new Error('bookmark: IndexedDB unavailable'));
      deadp.catch(function () {});             // 미처리 거부 경고 방지
    }
    return deadp;
  }
  function db() {
    if (fails >= 3) return dead();
    if (dbp) return dbp;
    var p = dbp = new Promise(function (res, rej) {
      var req;
      try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { rej(e); return; }
      req.onupgradeneeded = function () {
        var d = req.result;
        if (!d.objectStoreNames.contains(STORE))
          d.createObjectStore(STORE, { keyPath: 'id' }).createIndex('updated', 'updated');
      };
      req.onsuccess = function () {
        var d = req.result;
        conn = d; fails = 0;
        d.onversionchange = function () { drop(d); try { d.close(); } catch (x) {} };
        d.onclose         = function () { drop(d); };
        res(d);
      };
      req.onerror   = function () { rej(req.error || new Error('open error')); };
      req.onblocked = function () { rej(new Error('open blocked')); };
    });
    p.catch(function (e) {
      fails++;
      if (dbp === p) { dbp = null; conn = null; }
      warn(e);
    });
    return p;
  }
  function tx(mode, fn) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var t, r;
        // 닫힌 연결이면 여기서 InvalidStateError가 난다 — 버리고 다음 호출에서 다시 연다
        try { t = d.transaction(STORE, mode); r = fn(t.objectStore(STORE)); }
        catch (e) { drop(d); rej(e); return; }
        t.oncomplete = function () { res(r ? r.result : undefined); };
        t.onerror    = function () { rej(t.error || new Error('tx ' + mode + ' error')); };
        t.onabort    = function () { rej(t.error || new Error('tx ' + mode + ' aborted')); };
      });
    }).catch(function (e) { warn(e); throw e; });
  }
  function save(rec) { return tx('readwrite', function (os) { return os.put(rec); }); }
  function load(id)  { return tx('readonly',  function (os) { return os.get(id); }); }

  /* ---------- 지금 읽고 있는 위치 ---------- */
  var ACTIVE = ['on', 'active', 'current', 'shown', 'is-active'];

  function slides() {                          // 슬라이드 덱이면 슬라이드 목록, 아니면 null
    var sel = ['main > article', '.slide'];
    for (var i = 0; i < sel.length; i++) {
      var n = document.querySelectorAll(sel[i]);
      if (n.length > 1) return n;
    }
    return null;
  }
  function activeIndex(list) {                 // 활성 클래스 → URL 해시 순으로 판별
    for (var i = 0; i < list.length; i++) {
      var c = list[i].classList;
      for (var j = 0; j < ACTIVE.length; j++) if (c.contains(ACTIVE[j])) return i;
    }
    var id = location.hash.slice(1);
    try { id = decodeURIComponent(id); } catch (e) {}
    if (id) for (var k = 0; k < list.length; k++) if (list[k].id === id) return k;
    return -1;
  }
  function visibleIndex(list) {                // 전 슬라이드가 이어서 흐르는 덱용 보조 판별
    var best = -1, near = Infinity, h = window.innerHeight || 800;
    for (var i = 0; i < list.length; i++) {
      var r = list[i].getBoundingClientRect();
      if (r.bottom <= 0 || r.top >= h) continue;
      var d = Math.abs(r.top);
      if (d < near) { near = d; best = i; }
    }
    return best;
  }
  /* 한 장씩 그려내는 덱(stage.innerHTML = 슬라이드 하나)은 DOM에 슬라이드가
     늘 하나뿐이라 slides()가 null이다 — v2가 이런 덱 13종을 그냥 '긴 문서'로
     보고 scrollY 0만 저장해 책갈피가 아예 남지 않았다. 대신 화면의 쪽 표시
     ('7 / 503')를 읽어 몇 쪽인지 알아낸다.                                  */
  var cntEl = null;
  var CNT = /^\s*(\d+)\s*\/\s*(\d+)\s*$/;
  function counter() {
    if (cntEl && cntEl.isConnected && CNT.test(cntEl.textContent || '')) return cntEl;
    cntEl = null;
    var n = document.querySelectorAll('span, div, b, small, em, strong');
    for (var i = 0, lim = Math.min(n.length, 4000); i < lim; i++) {
      if (n[i].children.length) continue;
      var t = n[i].textContent || '';
      if (t.length > 16) continue;
      var m = CNT.exec(t);
      if (m && +m[2] > 1 && +m[1] >= 1 && +m[1] <= +m[2]) { cntEl = n[i]; break; }
    }
    return cntEl;
  }
  function vpage() {                           // 쪽 표시가 있으면 {page,total}, 없으면 null
    var e = counter();
    if (!e) return null;
    var m = CNT.exec(e.textContent || '');
    return m ? { page: +m[1], total: +m[2] } : null;
  }
  function heading() {                         // 긴 문서용 — 화면 상단을 지난 마지막 제목
    var hs = document.querySelectorAll('h1[id],h2[id],h3[id]'), out = '';
    for (var i = 0; i < hs.length; i++) {
      if (hs[i].getBoundingClientRect().top <= 90) out = '#' + hs[i].id; else break;
    }
    return out;
  }
  function snap() {
    var list = slides();
    if (list) {
      var i = activeIndex(list);
      if (i < 0) i = visibleIndex(list);
      if (i < 0) i = 0;
      var el = list[i];
      return { kind: 'slide', page: i + 1, total: list.length, scrollY: 0,
               hash: el.id ? '#' + el.id : '', ratio: (i + 1) / list.length };
    }
    var v = vpage();                           // 한 장씩 그려내는 덱
    if (v) {
      return { kind: 'slide', page: v.page, total: v.total, scrollY: 0,
               hash: location.hash.length > 1 ? location.hash : '',
               ratio: v.page / v.total };
    }
    var se = document.scrollingElement || document.documentElement;
    var max = Math.max(0, se.scrollHeight - se.clientHeight);
    var y = Math.round(se.scrollTop || window.pageYOffset || 0);
    return { kind: 'scroll', page: 0, total: 0, scrollY: y,
             hash: heading(), ratio: max ? Math.min(1, y / max) : 0 };
  }

  /* ---------- 자동 저장 ----------
     처음 상태는 기준선으로만 잡고 저장하지 않는다 — 첫 장으로 열자마자
     지난번 책갈피를 1쪽으로 덮어쓰지 않기 위해서다.                        */
  function sig(s) {
    return s.kind + ':' + s.page + ':' + (s.kind === 'scroll' ? Math.round(s.scrollY / 40) : 0);
  }
  var last = sig(snap());
  function tick(force) {
    if (document.hidden && !force) return;
    var s = snap(), cur = sig(s);
    if (cur === last) return;
    last = cur;
    s.id = FILE;
    s.title = (document.title || FILE).trim();
    s.updated = Date.now();
    // 저장이 실패하면 기준선을 풀어 다음 tick에서 다시 시도한다 — 연결이 끊겼다
    // 다시 붙는 동안 그 한 번의 위치가 통째로 사라지지 않도록.
    save(s).catch(function () { if (last === cur) last = ''; });
  }
  setInterval(tick, 1200);
  addEventListener('hashchange', function () { tick(); });
  addEventListener('visibilitychange', function () { if (document.hidden) tick(true); });
  addEventListener('pagehide', function () { tick(true); });

  /* ---------- 이어보기 ----------
     덱 엔진마다 이동 방식이 달라서 세 단계로 시도한다.
       ① 해시 지정 — hashchange를 듣는 엔진
       ② 다음/이전 버튼 클릭 또는 ←→ 키 — 해시를 안 듣는 한 장씩 엔진
       ③ scrollIntoView — 전 장이 이어서 흐르는 덱                        */
  function navBtn(dir) {
    var ids = dir > 0 ? ['nextBtn', 'btnNext', 'bNext', 'next', 'nextSlide']
                      : ['prevBtn', 'btnPrev', 'bPrev', 'prev', 'prevSlide'];
    for (var i = 0; i < ids.length; i++) {
      var e = document.getElementById(ids[i]);
      if (e && (e.tagName === 'BUTTON' || e.tagName === 'A')) return e;
    }
    return null;
  }
  function turn(dir) {
    var b = navBtn(dir);
    if (b) { if (!b.disabled) b.click(); return; }
    var k = dir > 0 ? 'ArrowRight' : 'ArrowLeft';
    document.dispatchEvent(new KeyboardEvent('keydown',
      { key: k, code: k, bubbles: true, cancelable: true }));
  }
  function step(target) {                      // 목표 쪽까지 한 장씩 넘긴다
    var guard = 400;
    (function next() {
      var l = slides();
      if (!l || --guard <= 0) return;
      var i = activeIndex(l);
      if (i < 0 || i === target) return;
      turn(i < target ? 1 : -1);
      setTimeout(function () {
        var l2 = slides();
        if (!l2) return;
        if (activeIndex(l2) === i) return;     // 안 움직이는 엔진이면 포기
        next();
      }, 30);
    })();
  }
  /* 한 장씩 그려내는 덱으로 돌아가기 —
       ① 엔진이 내놓은 window.__deckGo(0-기반 쪽 번호)  ② 해시  ③ 목차의 번호 입력칸
       ④ 다음/이전 버튼을 한 장씩(안 움직이면 즉시 포기)                       */
  function vjump(rec) {
    var target = rec.page;
    function at() { var v = vpage(); return v ? v.page : -1; }
    if (at() === target) return;
    if (typeof window.__deckGo === 'function') {
      try { window.__deckGo(target - 1); } catch (e) {}
      if (at() === target) return;
    }
    if (rec.hash && location.hash !== rec.hash) location.hash = rec.hash;
    setTimeout(function () {
      if (at() === target) return;
      var n = document.getElementById('jumpN'), g = document.getElementById('jumpGo');
      if (n && g) {
        n.value = String(target);
        try { g.click(); } catch (e) {}
        if (at() === target) return;
      }
      var guard = 1200;
      (function nextPage() {
        var from = at();
        if (from < 0 || from === target || --guard <= 0) return;
        turn(from < target ? 1 : -1);
        requestAnimationFrame(function () {
          if (at() === from) return;           // 안 움직이는 엔진이면 포기
          nextPage();
        });
      })();
    }, 150);
  }
  function jump(rec) {
    if (rec.kind !== 'slide') {
      var se = document.scrollingElement || document.documentElement;
      var max = Math.max(0, se.scrollHeight - se.clientHeight);
      var y = rec.scrollY <= max ? rec.scrollY : Math.round(rec.ratio * max);
      window.scrollTo({ top: y, behavior: 'smooth' });
      return;
    }
    var list = slides();
    if (!list) { vjump(rec); return; }
    var target = Math.min(list.length, Math.max(1, rec.page)) - 1;
    var el = (rec.hash && document.getElementById(rec.hash.slice(1))) || list[target];
    if (!el) return;
    var k = Array.prototype.indexOf.call(list, el);
    if (k >= 0) target = k;
    if (el.id && location.hash.slice(1) !== el.id) location.hash = '#' + el.id;
    setTimeout(function () {
      var l2 = slides();
      if (!l2) return;
      var i = activeIndex(l2);
      if (i === target) return;                // ① 해시로 이동 성공
      if (i >= 0) step(target);                // ② 한 장씩 넘기는 엔진
      else el.scrollIntoView({ block: 'start' });   // ③ 이어서 흐르는 덱
    }, 120);
  }
  function ago(t) {
    var d = Date.now() - t;
    if (d < 6e4)  return '방금 전';
    if (d < 36e5) return Math.floor(d / 6e4) + '분 전';
    if (d < 864e5) return Math.floor(d / 36e5) + '시간 전';
    if (d < 6048e5) return Math.floor(d / 864e5) + '일 전';
    return new Date(t).toLocaleDateString('ko-KR');
  }
  function bottomInset() {              // 화면 아래 고정 내비(◀ 1/67 ▶) 위로 띄우기
    var h = window.innerHeight || 800, gap = 14;
    if (!document.body) return gap;
    var list = [], c;
    for (c = document.body.firstElementChild; c; c = c.nextElementSibling) list.push(c);
    var extra = document.querySelectorAll('nav, footer');
    for (var i = 0; i < extra.length; i++) list.push(extra[i]);
    for (var j = 0; j < list.length; j++) {
      var n = list[j], t = n.tagName;
      if (t === 'SCRIPT' || t === 'STYLE' || t === 'LINK') continue;
      var cs = getComputedStyle(n);
      if (cs.position !== 'fixed' && cs.position !== 'sticky') continue;
      if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) === 0) continue;
      var r = n.getBoundingClientRect();
      if (!r.height || r.height > h * 0.5 || r.bottom < h - 4 || r.top > h) continue;
      gap = Math.max(gap, Math.round(h - r.top) + 10);
    }
    return gap;
  }
  function toast(rec) {
    var gap = bottomInset();
    var host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483000;pointer-events:none';
    var root = host.attachShadow ? host.attachShadow({ mode: 'open' }) : host;
    var where = rec.kind === 'slide'
      ? rec.page + ' / ' + rec.total + ' 쪽'
      : Math.round(rec.ratio * 100) + '% 지점';
    root.innerHTML =
      '<style>' +
      '.w{pointer-events:auto;display:flex;align-items:center;gap:10px;' +
      'margin:0 auto calc(' + gap + 'px + env(safe-area-inset-bottom,0px));' +
      'padding:10px 12px 10px 14px;max-width:min(94vw,460px);border-radius:14px;' +
      'background:rgba(18,28,40,.94);color:#eaf3fb;font:500 14px/1.4 -apple-system,BlinkMacSystemFont,' +
      '"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35);' +
      'animation:up .22s ease-out}' +
      '@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}' +
      '@media (prefers-reduced-motion:reduce){.w{animation:none}}' +
      '.t{flex:1;min-width:0}.t b{display:block;font-weight:700}' +
      '.t s{display:block;text-decoration:none;opacity:.72;font-size:12px;margin-top:2px}' +
      'button{font:inherit;border:0;border-radius:9px;padding:8px 12px;cursor:pointer}' +
      '.go{background:#4fc3f7;color:#06263a;font-weight:700}' +
      '.no{background:transparent;color:#9fb6c9;padding:8px 6px}' +
      '</style>' +
      '<div class="w"><span aria-hidden="true">🔖</span>' +
      '<div class="t"><b>지난번 ' + where + '까지 읽었어요</b><s>' + ago(rec.updated) + ' 저장됨</s></div>' +
      '<button class="go" type="button">이어보기</button>' +
      '<button class="no" type="button" aria-label="닫기">✕</button></div>';
    function close() { if (host.parentNode) host.parentNode.removeChild(host); }
    root.querySelector('.go').onclick = function () { close(); jump(rec); };
    root.querySelector('.no').onclick = close;
    document.body.appendChild(host);
    setTimeout(close, 15000);
  }

  /* 딥링크로 열었으면 안내하지 않는다.
     이때 location.hash는 못 쓴다 — 덱 엔진 대부분이 첫 장을 그리면서
     history.replaceState('#top')로 주소를 먼저 바꿔 놓기 때문에, 이 셸이
     도는 시점에는 늘 해시가 있는 것처럼 보인다(v1이 안내를 못 띄우던 원인).
     그래서 <head>에서 미리 잡아둔 진입 해시를 쓰고, 없으면 내비게이션
     타이밍의 원래 주소를 본다. */
  function openedWithHash() {
    if (typeof window.__deckInitHash === 'string') return window.__deckInitHash.length > 1;
    try {
      var e = performance.getEntriesByType('navigation')[0];
      if (e && e.name) return new URL(e.name).hash.length > 1;
    } catch (x) {}
    return !!location.hash;
  }
  function initHash() {
    if (typeof window.__deckInitHash === 'string' && window.__deckInitHash) return window.__deckInitHash;
    try {
      var e = performance.getEntriesByType('navigation')[0];
      if (e && e.name) return new URL(e.name).hash;
    } catch (x) {}
    return location.hash;
  }

  if (!openedWithHash()) {
    load(FILE).then(function (rec) {
      if (!rec) return;
      var worth = rec.kind === 'slide' ? rec.page > 1 : rec.scrollY > 200;
      if (!worth) return;
      // 덱이 스스로 지난 쪽을 복원해 이미 그 자리라면(주판 암산 교재 등) 굳이 묻지 않는다
      var now = snap();
      if (now.kind === rec.kind && rec.kind === 'slide' && now.page === rec.page) return;
      toast(rec);
    }).catch(function () {});
  } else {
    /* 포털의 🔖 링크처럼 '#s42'로 들어왔는데 엔진이 해시를 안 듣는 덱(한 장씩
       그려내는 6종)은 1쪽에 머문다 — 안내도 안 뜨니 그 쪽으로 옮겨준다. */
    var m = /^#s?(\d+)$/.exec(initHash() || '');
    if (m) setTimeout(function () {
      var v = slides() ? null : vpage();
      if (v && +m[1] >= 1 && +m[1] <= v.total && v.page !== +m[1])
        vjump({ page: +m[1], hash: initHash() });
    }, 250);
  }
})();
</script>
</body>
</html>
