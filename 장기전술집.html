<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- deck-bookmark: 덱 엔진이 replaceState로 주소를 바꾸기 전에 진입 해시를 잡아둔다 -->
<script>window.__deckInitHash=location.hash;</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국 장기 묘수 풀이 및 고급 전술집 — 인터랙티브 북</title>
<style>
:root{
  --bg0:#070611;--bg1:#0e1126;--bg2:#181a3a;
  --paper:#f5ecd6;--paper2:#ead9b0;--ink:#1a1206;
  --gold:#ffd866;--crimson:#c2434b;--azure:#2e7ec4;
  --grid:#3a2a14;--han:#1e4d7a;--cho:#9a2226;
  --soft:#b8a07a;--accent:#ffb347;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,'Noto Sans KR','Malgun Gothic',sans-serif;overflow:hidden;background:var(--bg0);color:#e8e6dc;-webkit-text-size-adjust:100%}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse at 20% 10%,#1c2150 0%,transparent 50%),
  radial-gradient(ellipse at 80% 90%,#3a1238 0%,transparent 50%),
  radial-gradient(ellipse at 50% 50%,#0a0e1e 0%,#000 100%);z-index:-2}
body::after{content:'';position:fixed;inset:0;background-image:radial-gradient(#ffd86618 1px,transparent 1px),radial-gradient(#fff1 1px,transparent 1px);background-size:80px 80px,30px 30px;background-position:0 0,15px 15px;z-index:-1;opacity:.5;animation:drift 60s linear infinite}
@keyframes drift{from{background-position:0 0,15px 15px}to{background-position:80px 80px,95px 95px}}

html,body{height:100%}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;position:relative}

header.top{background:linear-gradient(90deg,#1a1245,#3a1238,#1a1245);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffd86655;box-shadow:0 2px 18px #000;z-index:5}
header.top h1{font-size:15px;font-weight:600;letter-spacing:.5px;background:linear-gradient(90deg,#ffd866,#ffb347,#c2434b);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-ctrl{display:flex;gap:6px;align-items:center;flex-shrink:0}
.top-ctrl button{background:#ffd86622;border:1px solid #ffd86655;color:#ffd866;padding:4px 9px;border-radius:5px;cursor:pointer;font-size:12px;transition:all .2s}
.top-ctrl button:hover{background:#ffd86644;transform:translateY(-1px)}
.top-ctrl .progress{color:#ffd866;font-size:11px;font-variant-numeric:tabular-nums}

main.book{position:relative;overflow:hidden;perspective:2400px;display:flex;justify-content:center;align-items:center;padding:14px 8px}

.page{position:absolute;top:50%;left:50%;width:min(94vw,860px);height:calc(100vh - 110px);max-height:1100px;background:linear-gradient(135deg,var(--paper) 0%,var(--paper2) 100%);color:var(--ink);border-radius:10px;box-shadow:0 30px 80px #000c,0 10px 30px #0008,inset 0 0 60px #c2a06622;padding:28px 26px 50px;overflow-y:auto;overflow-x:hidden;transform-origin:center center;opacity:0;pointer-events:none;transform:translate(-50%,-50%) translateX(40px) rotateY(-30deg);transition:opacity .45s,transform .55s cubic-bezier(.22,.61,.36,1);-webkit-overflow-scrolling:touch}
.page::before{content:'';position:absolute;top:0;bottom:0;left:0;width:14px;background:linear-gradient(90deg,#0006,transparent);pointer-events:none;border-radius:10px 0 0 10px}
.page.active{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) translateX(0) rotateY(0)}
.page.prev{transform:translate(-50%,-50%) translateX(-40px) rotateY(30deg);opacity:0}
.page.next{transform:translate(-50%,-50%) translateX(40px) rotateY(-30deg);opacity:0}
.page::-webkit-scrollbar{width:8px}
.page::-webkit-scrollbar-track{background:#0001}
.page::-webkit-scrollbar-thumb{background:#3a2a1466;border-radius:4px}

.page-num{position:absolute;bottom:14px;right:24px;font-size:11px;color:#5c4624;opacity:.65;font-variant-numeric:tabular-nums}
.page-chap{position:absolute;bottom:14px;left:24px;font-size:11px;color:#5c4624;opacity:.65}

h2.chapter{font-size:28px;font-weight:800;color:var(--han);border-bottom:3px double var(--crimson);padding-bottom:8px;margin-bottom:16px;text-shadow:1px 1px 0 #fff8}
h3.section{font-size:18px;font-weight:700;color:var(--crimson);margin:16px 0 8px;padding-left:10px;border-left:4px solid var(--crimson)}
h4.sub{font-size:15px;font-weight:700;color:var(--han);margin:12px 0 6px}
.page p{font-size:14.5px;line-height:1.75;margin:8px 0;text-align:justify}
.page ul,.page ol{margin:8px 0 8px 22px}
.page li{font-size:14px;line-height:1.65;margin:3px 0}
.page strong{color:var(--crimson)}
.page em{font-style:normal;color:var(--han);font-weight:600;background:#ffd86633;padding:1px 4px;border-radius:3px}
.quote{border-left:4px solid var(--gold);background:#ffd86633;padding:10px 14px;margin:12px 0;font-style:italic;border-radius:4px;color:#5c4015;font-size:14px;line-height:1.6}
.tip{background:linear-gradient(135deg,#2e7ec418,#ffd86618);border:1px solid #2e7ec455;padding:10px 14px;margin:12px 0;border-radius:6px;font-size:13.5px;color:#1a3654}
.warn{background:linear-gradient(135deg,#c2434b18,#ffd86618);border:1px solid #c2434b55;padding:10px 14px;margin:12px 0;border-radius:6px;font-size:13.5px;color:#5a1015}

table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;background:#fff7e0}
th,td{border:1px solid #b8975533;padding:6px 8px;text-align:left}
th{background:linear-gradient(180deg,var(--han),#1a3654);color:#fff;font-weight:600}
tr:nth-child(even) td{background:#fff0c855}

.cover{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:radial-gradient(circle at 50% 30%,#3a1238 0%,#0e0820 60%,#000 100%);color:#fff}
.cover .han-title{font-size:64px;font-weight:900;letter-spacing:8px;background:linear-gradient(180deg,#ffd866,#ffb347,#c2434b);-webkit-background-clip:text;background-clip:text;color:transparent;margin:12px 0;text-shadow:0 4px 20px #ffd86644;line-height:1}
.cover .ko-title{font-size:24px;font-weight:600;color:#ffd866;margin:8px 0 24px;letter-spacing:2px}
.cover .subtitle{font-size:14px;color:#b8a07a;margin:6px 0;letter-spacing:1px}
.cover .deco{font-size:48px;margin:20px;letter-spacing:14px;color:#c2434b;text-shadow:0 0 20px #c2434b88}
.cover .info{margin-top:30px;font-size:12px;color:#8a7a55;line-height:2}
.cover-board{margin:18px 0;filter:drop-shadow(0 10px 30px #ffd86644)}

.toc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:10px}
.toc-grid a{display:flex;justify-content:space-between;padding:7px 10px;background:#fff8e7;border-left:3px solid var(--crimson);text-decoration:none;color:var(--ink);font-size:13px;border-radius:3px;cursor:pointer;transition:all .2s}
.toc-grid a:hover{background:#ffd86655;transform:translateX(3px)}
.toc-grid .ch{font-weight:700;color:var(--han)}
.toc-grid .pg{color:#8a6a30;font-variant-numeric:tabular-nums;font-size:11px}
.toc-part{grid-column:1/-1;margin-top:14px;padding:6px 10px;background:linear-gradient(90deg,var(--han),transparent);color:#fff;font-weight:700;font-size:14px;border-radius:3px;letter-spacing:1px}

/* Janggi board */
.board-wrap{display:flex;flex-direction:column;align-items:center;margin:14px auto;width:100%}
.board-caption{font-size:12px;color:#5c4624;margin-bottom:4px;text-align:center;font-style:italic}
svg.board{background:linear-gradient(180deg,#e8c878,#d4a85a);border:3px solid #4a2810;border-radius:6px;box-shadow:0 6px 22px #0007,inset 0 0 20px #8b5a2b88;display:block;width:min(380px,92%);height:auto;max-width:100%}
svg.board .grid{stroke:#3a2410;stroke-width:1.2;fill:none}
svg.board .diag{stroke:#3a2410;stroke-width:1.2;fill:none}
svg.board .border{stroke:#3a2410;stroke-width:2.5;fill:none}
svg.board .palace{fill:#fff3c899}
svg.board .pc-bg{stroke:#000;stroke-width:1.5}
svg.board .pc-han{fill:url(#hanGrad)}
svg.board .pc-cho{fill:url(#choGrad)}
svg.board .pc-txt{font-family:'Source Han Serif','Noto Serif KR',serif;font-weight:900;text-anchor:middle;dominant-baseline:central;font-size:22px;pointer-events:none}
svg.board .pc-txt.han{fill:#fff8d6}
svg.board .pc-txt.cho{fill:#fff0d0}
svg.board .coord{font-size:9px;fill:#4a2810cc;font-family:sans-serif;pointer-events:none}
svg.board .cell-hit{fill:transparent;cursor:pointer}
svg.board .cell-hit:hover{fill:#ffd86644}
svg.board .move-dot{fill:#2e7ec4;opacity:.45;pointer-events:none}
svg.board .move-cap{fill:none;stroke:#c2434b;stroke-width:2.5;opacity:.7;pointer-events:none}
svg.board .sel-ring{fill:none;stroke:#ffd866;stroke-width:3;opacity:.9;pointer-events:none;filter:drop-shadow(0 0 6px #ffd866)}
svg.board .last-move{fill:#2e7ec433;pointer-events:none}

.puzzle-ui{margin:8px 0 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.puzzle-hint{background:#ffd86655;border-radius:5px;padding:6px 10px;font-size:12.5px;color:#5c4015;max-width:96%;text-align:center;line-height:1.5}
.puzzle-buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.puzzle-buttons button{background:linear-gradient(180deg,#c2434b,#7a1a20);color:#fff;border:none;padding:6px 12px;border-radius:5px;cursor:pointer;font-size:12.5px;font-weight:600;box-shadow:0 2px 6px #0006;transition:all .2s}
.puzzle-buttons button:hover{transform:translateY(-1px);box-shadow:0 4px 10px #000a}
.puzzle-buttons button.alt{background:linear-gradient(180deg,#2e7ec4,#1a4870)}
.puzzle-buttons button.gold{background:linear-gradient(180deg,#ffb347,#a86028);color:#1a1206}
.puzzle-status{font-size:13px;font-weight:700;padding:6px 12px;border-radius:5px;min-height:28px;text-align:center;transition:all .3s}
.puzzle-status.ok{background:#3aa14655;color:#0f3818;border:1px solid #3aa146}
.puzzle-status.bad{background:#c2434b55;color:#5a1015;border:1px solid #c2434b}
.puzzle-status.idle{background:#0001;color:#5c4624}

.nav-bar{background:linear-gradient(90deg,#1a1245,#3a1238,#1a1245);padding:6px 10px;display:flex;justify-content:space-between;gap:8px;border-top:1px solid #ffd86655;box-shadow:0 -2px 18px #000;z-index:5}
.nav-bar button{flex:1;max-width:120px;background:linear-gradient(180deg,#ffd866,#c2434b);color:#1a1206;border:none;padding:8px;border-radius:6px;cursor:pointer;font-weight:700;font-size:13px;letter-spacing:1px;transition:all .2s;box-shadow:0 2px 8px #0006}
.nav-bar button:hover{transform:translateY(-2px);box-shadow:0 4px 12px #000a}
.nav-bar button:active{transform:translateY(0)}
.nav-bar button:disabled{opacity:.35;cursor:not-allowed;transform:none}
.nav-bar .jump{flex:1;display:flex;gap:4px;align-items:center;justify-content:center}
.nav-bar .jump input{width:60px;padding:6px;background:#0006;color:#ffd866;border:1px solid #ffd86655;border-radius:4px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.nav-bar .jump button{max-width:60px;padding:6px 8px;font-size:12px}

.toc-panel{position:fixed;top:0;left:-340px;width:320px;height:100%;background:linear-gradient(180deg,#0e1126,#1a1245);color:#e8e6dc;z-index:50;transition:left .35s;box-shadow:8px 0 30px #000c;overflow-y:auto;padding:14px 12px}
.toc-panel.open{left:0}
.toc-panel h3{color:#ffd866;font-size:15px;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid #ffd86644}
.toc-panel a{display:block;padding:5px 8px;color:#cfc7b5;font-size:13px;text-decoration:none;border-radius:3px;cursor:pointer;margin:2px 0}
.toc-panel a:hover{background:#ffd86622;color:#ffd866}
.toc-panel .close{position:absolute;top:8px;right:10px;background:none;color:#ffd866;border:1px solid #ffd86655;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:14px}
.toc-overlay{position:fixed;inset:0;background:#000a;z-index:40;display:none}
.toc-overlay.show{display:block}

.flash{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(135deg,#ffd866,#c2434b);color:#1a1206;padding:10px 18px;border-radius:8px;font-weight:700;box-shadow:0 10px 30px #0008;z-index:100;transition:transform .35s;font-size:13px}
.flash.show{transform:translateX(-50%) translateY(0)}

.legend-tbl{font-size:11.5px}
.legend-tbl td{padding:3px 6px}
.kbd{display:inline-block;padding:1px 6px;border:1px solid #8a6a30;border-bottom-width:2px;border-radius:3px;background:#fff8e7;font-size:11px;font-family:monospace;color:#5c4624}

.fig{display:flex;justify-content:center;gap:14px;margin:10px 0;flex-wrap:wrap;align-items:flex-start}
.fig figcaption{font-size:11.5px;color:#5c4624;text-align:center;margin-top:4px;font-style:italic;max-width:380px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.stat{background:linear-gradient(135deg,#fff8e7,#ead9b0);border-left:4px solid var(--han);padding:8px 10px;border-radius:4px}
.stat .v{font-size:24px;font-weight:900;color:var(--crimson);font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:#5c4624;margin-top:2px}

.maxim{font-size:18px;font-weight:700;text-align:center;color:var(--crimson);padding:14px 18px;background:radial-gradient(ellipse,#ffd86644,transparent);margin:14px 0;border-top:1px solid #c2434b66;border-bottom:1px solid #c2434b66}
.maxim::before{content:'「';font-size:24px;color:var(--gold)}
.maxim::after{content:'」';font-size:24px;color:var(--gold)}

@media (max-width:680px){
  header.top h1{font-size:13px}
  .top-ctrl button{padding:3px 7px;font-size:11px}
  .page{padding:18px 16px 38px}
  h2.chapter{font-size:22px}
  h3.section{font-size:16px}
  .page p,.page li{font-size:13.5px}
  .toc-grid{grid-template-columns:1fr}
  .cover .han-title{font-size:42px;letter-spacing:6px}
  .cover .ko-title{font-size:18px}
  .nav-bar button{font-size:12px;padding:6px}
}
</style>
</head>
<body>
<div id="app">
<header class="top">
  <h1>📜 한국 장기 묘수 풀이 및 고급 전술집</h1>
  <div class="top-ctrl">
    <span class="progress" id="progressTxt">1 / 1</span>
    <button id="tocBtn">≡ 목차</button>
  </div>
</header>
<main class="book" id="book"></main>
<nav class="nav-bar">
  <button id="prevBtn">◀ 이전</button>
  <div class="jump">
    <input type="number" id="jumpInput" min="1" placeholder="페이지">
    <button id="jumpBtn">이동</button>
  </div>
  <button id="nextBtn">다음 ▶</button>
</nav>
</div>

<div class="toc-overlay" id="tocOverlay"></div>
<aside class="toc-panel" id="tocPanel">
  <button class="close" id="tocClose">✕</button>
  <h3>📖 목차 (160+ 페이지)</h3>
  <div id="tocList"></div>
</aside>

<div class="flash" id="flash"></div>

<script>
/*=========================================================
  한국 장기 인터랙티브 책 엔진
  ========================================================*/

// ── 보드 좌표: board[row(1..10)][col(1..9)] = piece or null
// ── piece = { t: '車'|'包'|'馬'|'象'|'士'|'漢'|'楚'|'兵'|'卒'|'俥'|'砲'|'傌'|'相'|'仕', s: 'han'|'cho' }
// ── 표기: '車 馬 象 士 漢 包 兵' = 한,  '俥 傌 相 仕 楚 砲 卒' = 초

const PIECE_KO = {'車':'차','馬':'마','象':'상','士':'사','漢':'궁','包':'포','兵':'졸','俥':'차','傌':'마','相':'상','仕':'사','楚':'궁','砲':'포','卒':'졸'};
const HAN_PIECES = {'車':1,'馬':1,'象':1,'士':1,'漢':1,'包':1,'兵':1};
const CHO_PIECES = {'俥':1,'傌':1,'相':1,'仕':1,'楚':1,'砲':1,'卒':1};
// 정통 한국 장기 표기 — 양 진영 같은 한자, 색으로만 진영 구분.
// 궁(漢/楚)과 졸(兵/卒)만 진영별로 한자가 다르다 (한국 장기 정통).
const UNIFY = {'俥':'車','傌':'馬','相':'象','仕':'士','砲':'包'};

function sideOf(t){return HAN_PIECES[t]?'han':'cho'}
function emptyBoard(){const b=[];for(let r=0;r<=10;r++){const row=[];for(let c=0;c<=9;c++)row.push(null);b.push(row);}return b;}

function parseBoard(spec){
  // spec: object { '51':'漢', '11':'車', ... } where key = colrow
  const b = emptyBoard();
  for(const k in spec){
    const c = parseInt(k.slice(0,k.length-1)||k[0]);
    const r = parseInt(k.length===2?k[1]:k.slice(1));
    // robust: key 'cr' where c is single digit, r is 1 or 2 digit
    let col, row;
    if(k.length===2){col=+k[0];row=+k[1]}
    else if(k.length===3){col=+k[0];row=+k.slice(1)}
    else continue;
    b[row][col] = {t:spec[k], s:sideOf(spec[k])};
  }
  return b;
}

function inBoard(c,r){return c>=1&&c<=9&&r>=1&&r<=10}
function inPalace(c,r,side){
  if(c<4||c>6)return false;
  if(side==='han')return r>=1&&r<=3;
  return r>=8&&r<=10;
}
function inAnyPalace(c,r){return (c>=4&&c<=6)&&((r>=1&&r<=3)||(r>=8&&r<=10))}
// palace diagonal cells
const PALACE_DIAG_CELLS = {han:[[4,1],[6,1],[5,2],[4,3],[6,3]],cho:[[4,8],[6,8],[5,9],[4,10],[6,10]]};
function isPalaceDiagCell(c,r){
  for(const [pc,pr] of PALACE_DIAG_CELLS.han)if(pc===c&&pr===r)return true;
  for(const [pc,pr] of PALACE_DIAG_CELLS.cho)if(pc===c&&pr===r)return true;
  return false;
}

// Compute legal moves for piece at (c,r) on board b
function legalMoves(b,c,r){
  const p=b[r][c]; if(!p) return [];
  const side=p.s, type=p.t, mvs=[];
  const enemy=side==='han'?'cho':'han';
  const okDest=(nc,nr)=>{if(!inBoard(nc,nr))return false;const q=b[nr][nc];if(!q)return true;return q.s===enemy;};

  if(type==='車'||type==='俥'){
    // straight any distance
    for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
      let nc=c+dc,nr=r+dr;
      while(inBoard(nc,nr)){
        if(b[nr][nc]){if(b[nr][nc].s===enemy)mvs.push([nc,nr]);break;}
        mvs.push([nc,nr]);nc+=dc;nr+=dr;
      }
    }
    // palace diagonal
    if(isPalaceDiagCell(c,r)){
      const diags=[[1,1],[1,-1],[-1,1],[-1,-1]];
      for(const [dc,dr] of diags){
        let nc=c+dc,nr=r+dr;
        while(isPalaceDiagCell(nc,nr) && inAnyPalace(nc,nr)){
          if(b[nr][nc]){if(b[nr][nc].s===enemy)mvs.push([nc,nr]);break;}
          mvs.push([nc,nr]);nc+=dc;nr+=dr;
        }
      }
    }
  }
  else if(type==='包'||type==='砲'){
    // straight with exactly one bridge (not pao)
    for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
      let nc=c+dc,nr=r+dr,bridge=null;
      while(inBoard(nc,nr)){
        const q=b[nr][nc];
        if(!bridge){
          if(q){if(q.t==='包'||q.t==='砲')break;bridge=q;}
        } else {
          if(q){if(q.t==='包'||q.t==='砲')break;if(q.s===enemy)mvs.push([nc,nr]);break;}
          mvs.push([nc,nr]);
        }
        nc+=dc;nr+=dr;
      }
    }
    // palace diagonal: only valid pao-positions on diagonals
    if(isPalaceDiagCell(c,r)){
      for(const [dc,dr] of [[1,1],[1,-1],[-1,1],[-1,-1]]){
        let nc=c+dc,nr=r+dr,bridge=null;
        while(isPalaceDiagCell(nc,nr) && inAnyPalace(nc,nr)){
          const q=b[nr][nc];
          if(!bridge){if(q){if(q.t==='包'||q.t==='砲')break;bridge=q;}}
          else{if(q){if(q.t==='包'||q.t==='砲')break;if(q.s===enemy)mvs.push([nc,nr]);break;}mvs.push([nc,nr]);}
          nc+=dc;nr+=dr;
        }
      }
    }
  }
  else if(type==='馬'||type==='傌'){
    // 8 jumps with mek
    const jumps=[[1,2,0,1],[1,-2,0,-1],[-1,2,0,1],[-1,-2,0,-1],[2,1,1,0],[2,-1,1,0],[-2,1,-1,0],[-2,-1,-1,0]];
    for(const [dc,dr,mc,mr] of jumps){
      const nc=c+dc,nr=r+dr;
      if(!okDest(nc,nr))continue;
      if(b[r+mr][c+mc])continue; // mek blocked
      mvs.push([nc,nr]);
    }
  }
  else if(type==='象'||type==='相'){
    const jumps=[[2,3,0,1,1,2],[2,-3,0,-1,1,-2],[-2,3,0,1,-1,2],[-2,-3,0,-1,-1,-2],[3,2,1,0,2,1],[3,-2,1,0,2,-1],[-3,2,-1,0,-2,1],[-3,-2,-1,0,-2,-1]];
    for(const [dc,dr,m1c,m1r,m2c,m2r] of jumps){
      const nc=c+dc,nr=r+dr;
      if(!okDest(nc,nr))continue;
      if(b[r+m1r][c+m1c])continue;
      if(b[r+m2r][c+m2c])continue;
      mvs.push([nc,nr]);
    }
  }
  else if(type==='士'||type==='仕'||type==='漢'||type==='楚'){
    // 1 step within palace, plus diagonals on palace-diag
    const steps=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const [dc,dr] of steps){
      const nc=c+dc,nr=r+dr;
      if(!inPalace(nc,nr,side))continue;
      if(!okDest(nc,nr))continue;
      mvs.push([nc,nr]);
    }
    if(isPalaceDiagCell(c,r)){
      for(const [dc,dr] of [[1,1],[1,-1],[-1,1],[-1,-1]]){
        const nc=c+dc,nr=r+dr;
        if(!inPalace(nc,nr,side))continue;
        if(!isPalaceDiagCell(nc,nr))continue;
        if(!okDest(nc,nr))continue;
        mvs.push([nc,nr]);
      }
    }
  }
  else if(type==='兵'||type==='卒'){
    // forward + sideways
    const fwd=side==='han'?1:-1;
    const cands=[[0,fwd],[1,0],[-1,0]];
    for(const [dc,dr] of cands){
      const nc=c+dc,nr=r+dr;
      if(!okDest(nc,nr))continue;
      mvs.push([nc,nr]);
    }
    // palace diagonal forward inside enemy palace
    const enemyP=side==='han'?'cho':'han';
    if(inPalace(c,r,enemyP) && isPalaceDiagCell(c,r)){
      for(const [dc,dr] of [[1,fwd],[-1,fwd]]){
        const nc=c+dc,nr=r+dr;
        if(!inPalace(nc,nr,enemyP))continue;
        if(!isPalaceDiagCell(nc,nr))continue;
        if(!okDest(nc,nr))continue;
        mvs.push([nc,nr]);
      }
    }
  }
  return mvs;
}

// SVG rendering
const CELL=44, MARGIN=22, BW=8*CELL+2*MARGIN, BH=9*CELL+2*MARGIN;
function px(c,r){return [MARGIN+(c-1)*CELL, MARGIN+(r-1)*CELL];}

function renderBoard(b, opts={}){
  // opts: {interactive:bool, puzzleId, lastMove}
  const id=opts.id||'b'+Math.random().toString(36).slice(2,8);
  let svg=`<svg class="board" viewBox="0 0 ${BW} ${BH}" data-id="${id}" preserveAspectRatio="xMidYMid meet">`;
  svg+=`<defs>
    <radialGradient id="hanGrad-${id}" cx=".4" cy=".35"><stop offset="0" stop-color="#3a6e9e"/><stop offset="1" stop-color="#0d2940"/></radialGradient>
    <radialGradient id="choGrad-${id}" cx=".4" cy=".35"><stop offset="0" stop-color="#c2434b"/><stop offset="1" stop-color="#5a0a10"/></radialGradient>
    <pattern id="wood-${id}" patternUnits="userSpaceOnUse" width="40" height="40"><rect width="40" height="40" fill="#e8c878"/><path d="M0 10 Q 20 12 40 8 M0 22 Q 20 24 40 20 M0 34 Q 20 36 40 32" stroke="#c89a4a33" fill="none"/></pattern>
  </defs>`;
  svg+=`<rect x="0" y="0" width="${BW}" height="${BH}" fill="url(#wood-${id})"/>`;
  // palaces
  const [pxA,pyA]=px(4,1),[pxB,pyB]=px(6,3);
  svg+=`<rect class="palace" x="${pxA}" y="${pyA}" width="${pxB-pxA}" height="${pyB-pyA}"/>`;
  const [pxC,pyC]=px(4,8),[pxD,pyD]=px(6,10);
  svg+=`<rect class="palace" x="${pxC}" y="${pyC}" width="${pxD-pxC}" height="${pyD-pyC}"/>`;
  // grid lines
  for(let r=1;r<=10;r++){
    const [x1,y]=px(1,r),[x2]=px(9,r);
    // skip middle gap? Korean janggi has no river so full lines
    svg+=`<line class="grid" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>`;
  }
  for(let c=1;c<=9;c++){
    const [x,y1]=px(c,1),[,y2]=px(c,10);
    svg+=`<line class="grid" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/>`;
  }
  // palace diagonals
  const drawDiag=(c1,r1,c2,r2)=>{const [x1,y1]=px(c1,r1),[x2,y2]=px(c2,r2);return `<line class="diag" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;};
  svg+=drawDiag(4,1,6,3)+drawDiag(6,1,4,3)+drawDiag(4,8,6,10)+drawDiag(6,8,4,10);
  // coords
  for(let c=1;c<=9;c++){const [x,y]=px(c,1);svg+=`<text class="coord" x="${x}" y="${y-8}" text-anchor="middle">${c}</text>`;}
  for(let r=1;r<=10;r++){const [x,y]=px(1,r);svg+=`<text class="coord" x="${x-12}" y="${y+3}" text-anchor="middle">${r}</text>`;}
  // last move highlight
  if(opts.lastMove){
    for(const [c,r] of opts.lastMove){const [x,y]=px(c,r);svg+=`<rect class="last-move" x="${x-CELL/2+2}" y="${y-CELL/2+2}" width="${CELL-4}" height="${CELL-4}" rx="4"/>`;}
  }
  // pieces
  for(let r=1;r<=10;r++)for(let c=1;c<=9;c++){
    const p=b[r][c]; if(!p)continue;
    const [x,y]=px(c,r);
    const cls=p.s==='han'?'pc-han':'pc-cho';
    const fillUrl=p.s==='han'?`url(#hanGrad-${id})`:`url(#choGrad-${id})`;
    const display = UNIFY[p.t] || p.t;
    svg+=`<circle class="pc-bg" cx="${x}" cy="${y}" r="18" fill="${fillUrl}"/>`;
    svg+=`<text class="pc-txt ${p.s}" x="${x}" y="${y+1}" data-pc="${c}-${r}">${display}</text>`;
  }
  if(opts.interactive){
    for(let r=1;r<=10;r++)for(let c=1;c<=9;c++){
      const [x,y]=px(c,r);
      svg+=`<rect class="cell-hit" data-cell="${c}-${r}" x="${x-CELL/2}" y="${y-CELL/2}" width="${CELL}" height="${CELL}"/>`;
    }
  }
  svg+='</svg>';
  return svg;
}

    {h:'1.3 기물 움직임 — 궁·사·차',p:['궁(漢/楚): 궁성 안에서 1칸 직선. 궁성 대각선 위에 있을 때 그 대각선 한 칸도 가능. 절대 궁성 밖으로 나갈 수 없다.','사(士/仕): 궁과 동일. 궁의 호위.','차(車/俥): 직선 무제한 (체스의 룩과 동일). 궁성 안에서는 대각선으로도 움직일 수 있다. 가장 강력한 기물, 점수 13.'],board:'cha_palace',hint:'궁성 안 차는 차의 화신. 한쪽 사를 잡고 들어가면 거의 외통.'},
    {h:'1.4 기물 움직임 — 포(包)의 다리',p:['포(包/砲) — 한국 장기의 꽃. 직선으로 움직이되, 반드시 사이에 「다리(踏脚)」가 정확히 1개 있어야 그 너머로 이동·잡기.','다리는 어떤 기물이든 OK 단, 포(包·砲) 자체는 다리가 될 수 없다.','포는 포를 잡지 못한다 — 한국 장기 특수 규칙.'],board:'myeonpo',warn:'포의 가장 큰 적: 다리가 사라지는 순간.'},
    {h:'1.5 기물 움직임 — 마·상·졸',p:['마(馬/傌): 한 일(一)자 한 칸 + 대각 한 칸 = 「日」자 모양 8방향. 일자 칸에 다른 기물이 있으면 막힘(멱).','상(象/相): 한 일자 한 칸 + 대각 두 칸. 두 개의 멱: 일자 칸과 첫 대각 칸 모두 비어 있어야 한다.','병/졸: 앞 또는 옆 1칸. 뒤로는 절대 못 간다. 적의 궁성 안에서는 대각 1칸 전진 가능.'],board:'ma_mek'},
    {h:'1.6 점수와 기물 가치',tbl:[['기물','점수'],['차',13],['포',7],['마',5],['상',3],['사',3],['병/졸',2],['궁','(점수 없음, 잃으면 패)']],p:['한이 30점 만점, 초가 31.5점에서 출발(한이 1.5점 적어 한 선 보전).','전술적 가치: 종반 양사 안궁 차포 = 거의 이긴 형세. 차 1개를 위해 마+상은 절대 안 되며, 마+포 정도가 손익 분기.']},
    {h:'1.7 한국 장기 고유 규칙 6선',p:[],items:['포는 포를 잡지 못한다, 포는 포를 다리로 못 쓴다.','빅장(對王) 무승부 — 양 궁이 같은 줄에서 사이 기물 없이 마주 봄.','시작 진형 4종 — 마·상의 좌우 위치를 한 쪽씩 바꿀 수 있다.','장군 반복 금지 — 같은 장을 3회 반복 시 거는 쪽이 변화해야 한다.','민궁(사 모두 잃은 궁)은 종반에 매우 약하나, 외사·양사와 별개로 인정.','점수 무승부 시 점수 합산으로 승부 결정.'],board:'big_match'},
    {h:'1.8 「다리와 멱」 — 한국 장기의 미',p:['체스가 「힘과 공간」이라면 한국 장기는 「다리와 멱」이다. 포의 다리, 마·상의 멱. 이 두 개념이 한국 장기 전술의 90%를 결정한다.','다리를 만들고 부수는 기술, 멱을 막고 푸는 기술 — 두 가지를 숙달하면 곧바로 상위 레벨로 진입한다.'],board:'bridge_pawn',maxim:'한 수만 둬도 그림이 보인다.'}
  ]},

  {n:'2장 기보법과 좌표', s:[
    {h:'2.1 좌표 체계',p:['본 책은 (열, 행) = 「열행」 두 자리로 표기한다. 한 진영 시작궁: (5,2). 초 진영 시작궁: (5,9).','한이 위, 초가 아래인 절대 좌표를 쓴다. 묘수풀이는 풀이자 시점이 일관되어야 하므로.','한 차 시작 위치: 11, 91 (양 모서리). 초 차 시작 위치: 110, 910 (3자리: 행이 두 자리).'],board:'coord_demo',hint:'키보드 ← → 키로 페이지 넘김. 인터랙티브 보드는 기물을 탭하면 갈 수 있는 곳이 표시됩니다.'},
    {h:'2.2 이동 표기',p:['「[기물][출발 좌표] → [도착 좌표]」 형식이 기본.','잡기는 ×, 장군은 +, 외통은 #로 표기.','예시 보드: 한 차가 (1,1)에서 (1,3)으로 이동한 모양. 초 포 (8,2)→(8,5)는 졸 잡기. 마 (4,5)는 침투.'],board:'move_demo',tbl:[['표기','뜻'],['차11→13','(1,1) 차가 (1,3)으로 이동'],['포82×85','(8,2) 포가 (8,5) 적기물을 잡고 그 자리로'],['마23→45+','마가 이동, 장군'],['차41×45#','차가 잡기 → 외통']]},
    {h:'2.3 특수 표기',tbl:[['기호','의미'],['+','장군 (체크)'],['#','외통 (체크메이트)'],['‡','양수장 (더블체크)'],['-','멍군 (장군 풀기)'],['!','좋은 수'],['!!','묘수 (절묘)'],['?','나쁜 수'],['??','대실수'],['!?','흥미로운 수'],['±','한 우세'],['∓','초 우세']]},
    {h:'2.4 다이어그램 약속',p:['모든 칸은 전각 한자/한글/가운뎃점으로 채워 폭이 일정.','빈 칸 = 가운뎃점. 한은 위(1행), 초는 아래(10행).','본 책 다이어그램은 모두 「초가 둘 차례」가 기본.'],board:'init'},
    {h:'2.5 좌표 빨리 읽기 — 단순 종반 예',p:['훈련: 다음 좌표가 어디인지 1초 안에 답해보자. 32, 71, 89, 4a (= 4행 10), 95, 55.','보드 정중앙은 칸이 아니라 선이다 — 한국 장기는 짝수 행이므로.','아래 보드는 양사 안궁의 한 vs 초 차 (9,5)의 단순 종반. 초가 둘 차례 「차95→55+」 → 「차55→52#」 2수 외통.'],board:'end_demo',maxim:'좌표를 외우면 절반은 강해진다.'}
  ]},

  {n:'3장 핵심 용어 사전', s:[
    {h:'ㄱ — ㄴ — ㄷ',tbl:[['용어','뜻'],['겹사 (양사)','사 두 개가 모두 살아 있는 형태. 종반 방어력 최강.'],['관문','궁성으로 들어가는 좁은 통로.'],['궁성','보드 양 끝의 3×3 영역. 사·궁이 머무르는 공간.'],['귀(角)','궁성 모서리.'],['귀포','포가 궁성 귀에 자리 잡은 형태.'],['다리(踏脚)','포가 넘기 위해 필요한 중간 기물.'],['더블장','두 기물이 동시에 장군 = 양수장.'],['돌포','포를 가장자리로 돌려 가져오는 작전.']]},
    {h:'ㅁ — ㅂ',tbl:[['용어','뜻'],['멱','마·상의 일자 칸. 막히면 그 방향 못 감.'],['면포','자기 궁의 바로 앞 (궁성 중앙면) 의 포.'],['민궁(무궁)','사가 모두 죽은 궁.'],['받기수','장군을 막는 수 = 멍군.'],['버림수','일부러 약한 기물을 잃는 수.'],['복차','양차. 차 두 개 협공.'],['빅장(對王)','양 궁이 같은 줄에서 사이 기물 없이 마주 봄. 무승부 청구 가능.']]},
    {h:'ㅅ — ㅇ',tbl:[['용어','뜻'],['사면초가','포의 다리·차의 길이 모두 막힌 형세.'],['상다리','상이 포의 다리가 되어 주는 형태.'],['선수권','자기 차례에 위협을 만들어 상대 응수를 강제하는 권리.'],['안궁','궁을 안전한 자리에 놓는 것. 한국 장기 종반의 핵심.'],['양득','한 수로 두 기물 동시 위협 → 하나는 반드시 잡음.'],['양수걸이','두 기물 동시 위협.'],['양수장','두 기물이 동시 장군. 받기수가 어렵다.'],['연차','차 두 개가 같은 줄에서 협력.'],['외사','사 한 개만 남음.'],['원앙포','포 둘이 같은 줄에서 짝.'],['유인','상대 기물을 좋지 않은 자리로 끌어내기.']]},
    {h:'ㅈ — ㅊ',tbl:[['용어','뜻'],['장군','상대 궁을 위협하는 수. 「+」'],['전마','상대 진영 깊숙이 들어간 마.'],['졸 5형제','자기 졸 5마리가 모두 살아 있는 종반 진형.'],['차길','차가 직선으로 통과하는 줄.'],['차포 외통','차+포 협공 외통.'],['측궁','궁이 측면(4 또는 6 열)에 있는 안궁.']]},
    {h:'ㅋ — ㅎ',tbl:[['용어','뜻'],['큰 멱','상의 두 멱 중 두 번째 (대각선 중간) 멱.'],['틈수','약점을 노리는 수.'],['평궁','궁이 5열 정중앙.'],['포 사선','궁성 안에서 포가 대각으로 통제하는 줄.'],['한사','사면초가에 가까운 막다른 형세.'],['합공','두 기물 이상의 협공.'],['행마','마의 이동.'],['희생','더 큰 이득을 위해 기물 일부러 버림.']]},
    {h:'기물 한자 표기 (정통 한국 장기)',p:['정통 한국 장기는 양 진영 모두 동일한 한자(車·包·馬·象·士)를 쓰고 색으로만 진영 구분한다. 본 HTML 보드는 한=청색, 초=적색.','다만 궁과 졸은 진영별로 한자가 다르다 — 한궁 漢, 초궁 楚 / 한졸 兵, 초졸 卒.','일부 책에서 텍스트 매체에 진영 구분을 위해 변형 한자(俥·砲·傌·相·仕)를 차용하기도 한다.'],tbl:[['한자','한글','움직임'],['車','차','직선 무제한 (궁성 대각 가능)'],['包','포','다리 1개 넘김'],['馬','마','日자 8방향 (멱 막힘)'],['象','상','일자+대각2 (두 멱 막힘)'],['士','사','궁성 안 1칸'],['漢 / 楚','궁(한/초)','궁성 안 1칸'],['兵 / 卒','졸(한/초)','앞·옆 1칸']]}
  ]},

  {n:'제2부 — 기물별 기본 전술', s:[]},
  {n:'4장 차의 전술 — 직선의 폭군', s:[
    {h:'4.1 차의 본질',p:['차는 한국 장기 최강의 기물. 직선 무제한 + 궁성 안 대각선. 차가 어디 있느냐가 곧 형세를 결정한다.','차는 13점이지만, 위치에 따라 실제 가치는 5~25점까지 변한다. 갇힌 차는 5점, 7행 침투차는 20점, 궁성 진입차는 25점 (사실상 외통).']},
    {h:'4.2 열린 차길 (Open File)',p:['차가 가로/세로 한 줄에서 가로막는 기물 없이 끝까지 통하는 상태. 이 자체로 종반에서 큰 가치.','자기 졸이 자기 차길을 가리고 있을 때, 졸을 옆으로 빼서 차길을 연다 = 개통(開通).'],board:'open_file',hint:'5열을 차가 통째로 통제하면 한 궁이 4·5·6 사이를 빠져나갈 수 없다.'},
    {h:'4.3 양차 협공 (양차 사다리)',p:['차 두 개가 협력 → 가장 흔한 외통 패턴. 한 차가 한 줄을 잠그면 다른 차가 다른 줄을 잠그며 단계적으로 좁힌다.','수순: 차65→61+ (6열 통제). 한이 도망 → 차 침투 → 또 도망 → 차×궁 외통.'],board:'yangcha'},
    {h:'4.4 차포 합공',p:['포가 다리 위에서 차의 길을 보장. 차포의 핵심: 포가 잠재적 외통 위협, 차는 직접 위협. 한쪽을 막으면 다른 쪽이 결정타.','차 + 포의 「동축 5열 합공」은 양사 안궁의 천적.'],board:'chapo',maxim:'차포는 한 줄에서 같이 죽고, 양차는 다른 줄에서 협력한다.'},
    {h:'4.5 차의 침투',p:['상대 진영 깊숙이 (7~8행) 차가 들어가면 사·상·마 등을 무차별 잡는다.','차가 4행에 자리 잡으면 「차의 양수걸이」가 시작된다.'],board:'cha_penetrate',warn:'차가 갇히지 않게 주의 — 갇힌 차는 단순한 5점 기물.'},
    {h:'4.6 차의 궁성 진입',p:['궁성 안 차는 차의 화신. 한쪽 사를 잡고 들어가면 즉시 외통.','「차62→52+」 — 한 사가 (4,1) 1개뿐이라 막을 길 없음 → 외통.'],board:'cha_palace'},
    {h:'4.7 차의 7가지 핵심 기술',items:['개통(開通) — 자기 졸 옆으로 빼서 차길 열기.','잠금(封鎖) — 상대 차길을 자기 기물로 막기.','사다리 — 양차 단계적 압박.','합공 — 차+포 한 줄.','궁성 침투 — 사 1개 잡고 차 들어가면 외통.','빅장 활용 — 진 형세에서 빅장 만드는 차 수.','차 부문 — 작은 기물로 차 잡고 손해 보더라도 이득.']},
    {h:'4.8 차 손익 계산',tbl:[['교환','추천 여부'],['차 ↔ 마+상 (5+3)','비추 (차 -5)'],['차 ↔ 마+포 (5+7)','위치 따라 OK'],['차 ↔ 포+상 (7+3)','비추 (차 -3)'],['차 ↔ 마+졸+졸 (5+2+2)','비추'],['차 ↔ 차','위치 우세 측이 OK']],p:['자기 차가 갇혀 있고 상대 차가 활약 중이면, 차차 교환은 거의 항상 우위 측에 손해.']}
  ]},

  {n:'5장 포의 전술 — 다리의 예술', s:[
    {h:'5.1 포는 한국 장기의 영혼',p:['「다리 1개를 정확히 넘어야만 움직이고 잡는다」라는 단 한 가지 규칙이 무한한 전술을 만든다.','포를 잘 쓰는 사람이 한국 장기를 잘 둔다.','아래 보드: 한 면포 (5,2) + 자기 졸 (5,6) 다리. 초 포 (5,8)이 (5,6) 다리 1개로 위 사선 통제 시도.'],board:'bridge_pawn',maxim:'포는 다리 위에서 살고, 다리 밑에서 죽는다.'},
    {h:'5.2 다리 5종 분류 — 단단한 다리/졸 다리',p:['단단한 다리: 자기 사·궁·상 등 잘 안 움직이는 기물.','자기 졸 다리: 내가 옮길 수 있어 자유. 졸을 다리 삼으면 「언제든 다리를 빼서 포 사선을 살릴 수도 죽일 수도」.'],board:'bridge_solid',items:['단단한 다리 — 자기 사·궁·상 등 잘 안 움직이는 기물.','부서지기 쉬운 다리 — 상대 기물이 다리. 옮기면 무력.','자기 졸 다리 — 내가 옮길 수 있어 자유.','마 다리 — 마가 가야 할 때 사선이 끊김.','더블 다리 — 양 포 사이에 사 하나 (원앙포).']},
    {h:'5.2b 다리 5종 분류 — 마 다리',p:['자기 마가 적 포 다리. 마 비키면 적 포 사선이 끊긴다.','발견공격의 핵심: 마-포 조합. 동시에 자기 차의 사선이 살아남.'],board:'bridge_horse'},
    {h:'5.2c 다리 부수기',p:['상대 포의 사선이 자기 궁을 위협할 때, 다리 기물을 잡거나 옆으로 옮긴다.','다리 0개가 되면 포는 가장 무력한 기물. 사선이 살아 있어도 실제 위협 불가.','다리 2개도 마찬가지. 정확히 1개여야 포가 움직임.'],board:'bridge_two',warn:'다리가 2개면 포는 아예 못 움직인다.'},
    {h:'5.3 면포(面包)',p:['한궁 바로 앞 (5,2)에 자리한 포. 한궁이 다리. 면포는 자기 궁의 「수호자」.','면포가 있으면, 상대 포가 같은 5열에서 다리 1개 걸쳐 면포 잡으려 해도 「포는 포를 잡지 못함」으로 안전. 하지만 차로 잡힐 수 있다.'],board:'myeonpo',tip:'면포 앞에 졸·상이 다리로 막아 줘야 안전.'},
    {h:'5.4 귀포(角包)와 원앙포',p:['귀포는 측면을 통제. 대각선 사선 + 상대 진영 측 압박.','원앙포 — 같은 줄에 포 둘. 사이에 다리 1개 (보통 졸). 졸을 빼면 둘 다 무력.'],board:'yuanang',tbl:[['포 유형','수비','공격','자유도'],['면포','★★★★★','★★','★'],['귀포','★★','★★★','★★★'],['원앙포','★★★','★★★★','★★'],['평포','★','★★','★★★★★']]},
    {h:'5.5 포의 5대 전술',items:['포의 다리 만들기 — 자기 마·상을 다리 자리에.','포의 다리 부수기 — 다리 기물을 잡거나 옆으로 옮기기.','포의 멀리뛰기 — 사선 끝까지 보내 상대 진영 깊숙이.','포의 옆돌기 — 가로 직선으로 측면 공격.','포의 자살수 — 포 자체를 다리로 만들기 위해 희생.'],board:'bridge_make'},
    {h:'5.6 포의 사고 패턴 — 포끼리 마주봄',p:['포가 포를 만나면 어느 쪽도 못 잡는다 (포는 포를 잡지 못함). 또한 포는 포의 다리가 되지 못한다.','아래 보드: 한 포 (5,3)와 초 포 (5,7) 사이에 졸 (5,5) 다리 1개. 그러나 다리가 졸 1개라도 포 사선은 다른 포를 잡지 못함.'],board:'pao_facing',items:['현재 다리는 무엇인가? 자기? 상대? 옮길 수 있는가?','다리 빼면 포는 어디까지 보이나? — 사선 통제 변화.','다리를 추가하면 포는 어디까지 못 가나? — 다리 2개 = 무력.','포 자체를 다리로 쓸 수 있나? — 못 씀.','포가 포를 만나면? — 어느 쪽도 못 잡음.']},
    {h:'5.7 포의 종반 가치',p:['종반에서 포는 「상대 사가 1개 이하일 때 매우 강하다」.','양사가 다리 자체. 사 1개면 다리 부족 → 포 사선 약화. 외사·무궁이면 포가 직접 외통 시도 가능.','아래 보드: 다리 없는 무력한 포의 모습. 사선이 살아 있어도 실제 위협 불가.'],board:'bridge_broken',warn:'다리가 없으면 포는 가장 무력한 기물.'}
  ]},

  {n:'6장 마의 전술 — 멱과 길목', s:[
    {h:'6.1 마의 본질',p:['마는 한국 장기에서 가장 자주 죽는 기물이자, 가장 자주 결정타를 만드는 기물이다.','「日」자 모양 8방향. 각 방향: 일자 한 칸 → 대각 한 칸.'],board:'ma_mek',maxim:'마는 멱을 두려워하고, 멱은 졸을 두려워한다.'},
    {h:'6.2 멱의 기하학',p:['마(4,6)에서 도착 자리 8개가 있고, 각 도착은 멱(일자 칸)을 공유한다.','한 멱 (4,5) 한 칸 막으면 (4,4)·(3,4)·(5,4) 세 자리 동시 봉쇄. 이게 마의 「한 멱 다중 봉쇄」의 묘미.'],board:'mamyeon',hint:'마는 자기 멱이 자기 기물로 막히면 그 방향 못 감.'},
    {h:'6.3 마의 5대 전술',items:['길목 점령 — 일자 칸을 자기 기물로 채워 멱 만들기.','멱 풀기 — 자기 마의 멱을 푸는 작은 수 (졸 옆이동, 사 비키기).','마 양수걸이 — 8방향이라 양수걸이의 왕.','발견장군 마 — 차·포 사선을 마가 가리고 있다가 마가 옆으로 빠지며 발견.','마 외통 — 상대 외사·무궁에 마 1개 외통.'],board:'ma_8way'},
    {h:'6.4 면마와 귀마',p:['면마: 자기 궁 바로 앞 자리에 마. 안정적이지만 진출이 늦다.','귀마: 궁성 옆자리. 진출 자유롭지만 수비 약화.','한국 장기 표준 포진은 「양귀마」가 가장 흔하다.','아래 보드: 한 면마 (5,2) 셋업. 한궁 (5,1)의 안전 도구가 되지만 면포·사 보호가 추가로 필요.'],board:'mamyeon'},
    {h:'6.5 멱 풀기 한 수의 위력',p:['자기 졸이 자기 마의 멱을 4개 동시에 막고 있을 때, 졸 옆 이동 한 수가 마의 활동 범위를 4배로 확장한다.','「졸56→46」 한 수로 마의 멱 (5,6)이 비어 마가 (4,7) 등 4자리에 자유롭게 진출.','아래 보드: 마 (5,5)가 자기 졸 (5,6)·(4,5) 두 멱으로 거의 갇힌 상태. 졸을 한 칸만 옮겨도 마의 활동이 폭발.'],board:'ma_blocked',tip:'자기 마의 멱은 항상 가급적 비워라.'},
    {h:'6.6 마의 양수걸이',p:['마는 8방향이라 양수걸이의 왕. 「삼중 양수걸이」 (한 마가 세 기물 동시 위협) 도 흔하다.','마의 「궁 + 차」 양수걸이 — 외통 + 큰 이득.','특히 「양수장(Royal Fork)」 — 마가 한궁 + 적 차/포 동시 위협. 한이 우선 장군 받아야 → 다른 기물 잡힘.'],board:'ma_fork'},
    {h:'6.7 마의 종반 가치',tbl:[['종반 형태','평가'],['양마 + 차','강력'],['마 + 포','균형 (포 다리는 마)'],['마 단독 vs 외사·무궁','외통 가능'],['마 단독 vs 양사','외통 거의 불가']],board:'ma_penetrate'}
  ]},

  {n:'7장 상의 전술 — 큰 발의 미학', s:[
    {h:'7.1 상의 본질',p:['상은 8방향, 일자 1칸 + 대각 2칸 = 「田」자보다 한 칸 더 멀리.','두 개의 멱을 둘 다 풀어야만 움직인다. 상은 우직하지만, 상의 사선이 통하면 차가 부럽지 않다.'],board:'sang_lines',maxim:'상은 두 개의 멱을 풀고서야 비로소 산다.'},
    {h:'7.2 상의 멱 두 개',p:['상의 이동 = (Δx, Δy) = (±1, ±3) 또는 (±3, ±1) 의 8방향.','상(5,5) → (3,2) 가려면 일자 (5,4) → 대각 (4,3) → 대각 (3,2). 멱은 (5,4)와 (4,3).','멱이 두 개라 봉쇄는 마보다 쉽다.','아래 보드: 상의 일자 멱과 대각 멱이 모두 막힌 상태. 상은 완전 갇힘.'],board:'sang_blocked'},
    {h:'7.3 상의 5대 전술',items:['상 사선 만들기 — 자기 진영 깊숙한 곳에서 한 수에 상대 진영까지.','멱 풀기 — 두 멱 모두 비우려면 두 수 분량의 정리 필요.','상포 합공 — 상이 포 다리.','상의 외통 — 상 + 차/포 합공.','상의 양수걸이 — 8방향이라 가능 (단 멱 때문에 실용성 낮음).'],board:'sang_8way'},
    {h:'7.4 상포 합공',p:['상이 자기 포의 다리가 되려면, 상의 멱 위치에 자기 포가 없어야 한다.','그래서 흔히 「포-상 배치 = 한 칸 사이 띄움」.'],board:'sangpo',warn:'상이 포 다리가 되면 상도 잡힐 위험이 있다.'},
    {h:'7.5 상의 종반',p:['상은 종반에 무력하다. 상 단독으로는 외통 거의 불가. 상 둘만 있는 경우 외통 못 만든다 (체스의 비숍 두 개와 다름).','그러나 상 + 차/포 한 쌍이면 강력.','아래 보드: 상포 합공 셋업. 상이 포의 다리가 되며 동시에 자기도 사선을 통제.'],board:'sangpo_combo',tip:'상은 멱 풀린 채로 가두고 적 진영 끝까지 보낸다.'},
    {h:'7.6 상 활용의 어려움',p:['상의 두 멱을 모두 풀어야 움직일 수 있으므로, 진출 한 수에 보조 수가 필요할 때가 많다.','상은 「준비된 뒤에 활약」하는 기물. 면상진은 시작 시점부터 상을 활용할 의도이다.','아래 보드: 한 양 포 (2,4)(8,4)와 초 상 (5,5)의 양수걸이. 상이 8방향이라 가능하지만 멱 때문에 실용성 낮음.'],board:'sang_fork'}
  ]},

  {n:'8장 사·궁·병졸의 활용', s:[
    {h:'8.1 사의 4대 역할',items:['궁의 호위 — 궁 옆 칸 직접 방어.','포의 다리 — 자기 면포의 다리.','차의 차단 — 상대 차 사선 막기.','장군 막기 — 멍군의 마지막 보루.'],board:'sa_bridge'},
    {h:'8.1b 사의 차단 기능',p:['초 차 (5,5) 5열 직선이 한궁을 위협. 한 사 (4,2)→(5,2)로 옮기면 차의 사선을 막아 멍군.','사 한 칸의 이동이 차 한 수의 위협보다 결정적이다.'],board:'sa_block'},
    {h:'8.2 양사 vs 외사 vs 무궁',tbl:[['형태','종반 방어력','비고'],['양사 안궁','★★★★★','차 1개로는 거의 안 뚫림'],['외사','★★★','차+포로 외통 가능'],['무궁','★','차 1개로도 외통 가능']],board:'yangsa',maxim:'사 한 칸 빼는 게 차 한 수보다 결정적.'},
    {h:'8.3 궁의 능동적 사용',items:['빅장 청구 — 진 형세에서 일부러 양궁 정렬.','궁의 옆이동 — 적 차의 사선을 피해 빠진다.','궁이 다리 — 면포의 다리.'],board:'gung_side'},
    {h:'8.4 졸의 5대 활용 — 진군과 옆이동',p:['앞으로 진군 + 다리 만들기 — 적 진영 5행쯤 가면 매우 강해진다.','졸 5형제 — 자기 졸 5마리가 모두 살아 있고 5행에 진군한 모습.'],board:'jol_advance',items:['앞으로 진군 + 다리 만들기 — 적 진영 5행쯤 가면 매우 강해진다.','옆 이동으로 다리 부수기 — 자기 졸이 옆으로 빠지면 적 포 사선이 살아나거나 죽음.','궁성 진입 후 외통 — 한국 장기 졸은 적 궁성 안에서 대각 1칸 가능 → 결정타.','양수걸이의 조연 — 졸이 마와 합쳐 작은 양수걸이.','차의 길 만들기 — 자기 졸이 자기 차길을 막을 때, 졸 옆 이동.']},
    {h:'8.4b 졸의 옆 이동 = 다리 변환',p:['한 졸 (5,2)이 초 포 (5,8)의 다리. 한이 졸을 옆으로 빼면 포 사선 끊김 + 자기 한궁 노출 위험.','반대로 초 차례에서 한 졸 (5,2)을 강제 옆 이동시키면 포 외통 가능.'],board:'jol_side'},
    {h:'8.5 졸의 궁성 외통',p:['초 졸이 한 궁성 (5,2)에 들어가면 한궁 (5,1) 직접 위협.','한국 장기에서 종반에 자기 졸 모두 살아 있어야 하는 이유.'],board:'jol_palace',maxim:'졸은 작은 영웅, 다섯이면 군대.'}
  ]},

  {n:'제3부 — 전술 패턴 카탈로그', s:[]},
  {n:'9장 양수걸이와 양득', s:[
    {h:'9.1 정의',p:['한 수로 두 개 이상의 기물·자리를 동시에 위협. 상대는 한 번에 하나만 막을 수 있어 결국 하나는 잃는다.','실전 묘수 풀이의 절대 다수가 양수걸이/양수장 패턴이다.','아래 보드: 초 차 (3,5)가 한 마 (3,4) 세로 + 한 포 (8,5) 가로 동시 위협. 한이 한 기물을 도망쳐도 다른 기물 잃음.'],board:'fork_basic'},
    {h:'9.2 기물별 양수걸이 능력',tbl:[['기물','양수걸이 능력'],['차','★★★★ 가로·세로 두 줄'],['포','★★★ 다리 활용 두 줄'],['마','★★★★★ 8방향, 가장 흔함'],['상','★★ 멱 제약'],['졸','★ 옆이동으로 두 자리'],['사·궁','없음']]},
    {h:'9.3 차의 양수걸이',p:['패턴 A — 가로·세로 동시. 차가 가로 줄과 세로 줄 각각에 적 기물.','차 (3,5): 세로(3열) → 마 (3,4) 위협. 가로(5행) → 포 (7,5) 위협. 양수걸이.'],board:'cha_fork'},
    {h:'9.4 마의 양수걸이',p:['마는 8방향이라 양수걸이의 왕.','마의 양수장(Royal Fork) — 한궁 + 적 차/포 동시 위협. 한이 우선 장군 받아야 → 다른 기물 잡힘.','이게 가장 가치 큰 양수걸이.'],board:'ma_fork'},
    {h:'9.5 양수걸이 사고법 — 마의 삼중 양수걸이',p:['마는 8방향이라 한 번에 3개 위협도 가능.','마 (5,4)에서 한 마 (3,3) + 한 차 (5,5) + 한 포 (7,3) 동시 위협의 예.'],board:'ma_triple',items:['이미 노출된 적 기물 지도화 — 8방향 위협 가능 자리.','자기 마/차/포 갈 자리 후보 나열.','두 자리 이상에 「가치 있는 적 기물」 동시 위협하는 자리 = 양수걸이 자리.','장군 + 양수걸이 = 양수장 → 가장 강력.']}
  ]},

  {n:'10장 묶기와 꼬치', s:[
    {h:'10.1 묶기 (핀)',p:['같은 줄에 적 기물 A · B 가 있고, 그 줄에 내 차/포가 있어 A를 위협. A 뒤의 B 가 더 가치가 크면, A는 못 움직인다.','「B = 한궁」이면 절대 핀(못 움직임).'],board:'pin',hint:'핀에 묶인 마는 잡혀도 멍군 못 함.'},
    {h:'10.2 꼬치 (스큐어)',p:['핀의 반대. 같은 줄에 A · B, 앞의 A 가 더 가치 큼. A가 위협 받아 옮겨야 → 뒤의 B 잡힘.','한 차 꼬치 — 한궁 앞 + 한 차 뒤. 한 차 옮기면 한궁 직접 위협, 옮기지 않으면 잡힘. 양쪽 다 손해.'],board:'skewer'},
    {h:'10.3 핀 vs 꼬치',tbl:[['구분','핀','꼬치'],['가치','앞 < 뒤','앞 > 뒤'],['효과','앞 못 움직임','앞 옮기면 뒤 잡힘'],['이득','마/상 1개','차/마 1개']]},
    {h:'10.4 발견 핀 / 발견 꼬치',p:['내 기물이 옮기며 뒤에 가려져 있던 차/포가 핀 또는 꼬치를 만든다.','발견 + 핀/꼬치 콤보는 묘수의 단골.','아래 보드: 초 마 (5,5)가 비키면 뒤의 초 차 (5,8)이 한 차 (5,3)와 한궁 (5,1)을 핀 형태로 묶는다.'],board:'pin_discovered',maxim:'묶고서 이기고, 꿰어서 끝낸다.'}
  ]},

  {n:'11장 발견공격과 이중공격', s:[
    {h:'11.1 발견공격',p:['내 기물 A가 옮기며, A 뒤에 가려져 있던 내 기물 B의 사선이 열려 적을 공격.','A 자체도 새 자리에서 공격하면 = 이중공격. A 자체가 장군이면 = 발견장군.'],board:'discovered',warn:'A·B 둘 다 장군이면 양수장 = 거의 멍군 못함.'},
    {h:'11.2 한국 장기 특징 — 포 다리 비우기',p:['「포의 다리 비우기 = 발견공격」 — 자기 마/상이 적 포의 다리였다가, 마/상이 빠지면 적 포 사선이 죽고 자기 차/포 사선이 살 수도.','「포의 다리 채우기 = 발견 차단」 — 자기 마가 갑자기 적 포 다리 자리에 들어가면 다리 2개 → 포 무력.','아래 보드: 초 마 (3,3)이 한 포 (3,5)의 다리. 마가 비키면 한 포 사선 끊김 + 초 자기 포 (5,8) 사선 살아남.'],board:'discovered_pao'},
    {h:'11.3 양수장 (Double Check)',p:['A 비키며 B 가 장군 + A 자신도 장군. 한이 멍군 어렵다 (두 위협 동시 막아야).','단, 도주로 있으면 외통 못 만듬. 도주로 차단 추가 필요.'],board:'double_check'},
    {h:'11.4 발견공격 사고법 — 양수장 + 도주차단 = 외통',p:['양수장이라도 도주로 있으면 외통 못 만듬. 도주로 차단까지 추가해야 비로소 외통.','아래 보드: 코너 한궁 (4,1) + 자기 졸 (4,2) 차단 + 차+마 양수장 = 정확한 외통 패턴.'],board:'double_check_mate',items:['자기 차/포가 가린 사선 위에 무엇이 있나? — 맵핑.','그 가리는 기물이 비키면 누가 죽나? — 발견 대상.','비키는 기물이 동시에 무엇을 위협할까? — 새 자리 위협.','둘 다 가치 있으면 발견공격 즉시 실행.']},
    {h:'11.5 발견공격 방어',items:['가린 기물을 잡는다 — 잡으면 발견 안 됨.','사선 위 자기 기물을 옮긴다 — 발견 위협 사라짐.','자기 궁의 옆 빠지기 — 발견장군이라도 도주.'],board:'discovered_def',maxim:'가린 차가 가장 무섭다.'}
  ]},

  {n:'12장 유인·차단·과부하', s:[
    {h:'12.1 유인 (Decoy)',p:['적의 핵심 수비 기물을 미끼로 좋지 않은 자리로 끌어냄.','수비 기물을 잡거나 옮기지 않고도, 「자기 자리에서 떨어지게」 만들면 같은 효과.'],board:'decoy'},
    {h:'12.2 차단 (Interference)',p:['적의 두 수비 기물 사이에 자기 기물을 넣어 협력 차단.','한 포·차 사이에 들어가 사선을 막으면, 양 수비 기물이 분리됨.'],board:'interfere'},
    {h:'12.3 과부하 (Overloading)',p:['수비 기물 1개가 여러 위협을 동시에 막고 있을 때, 한 위협을 실행하면 다른 위협을 막을 수 없다.','한 사가 두 자리 동시 방어 중일 때 한쪽 위협 실행 = 다른 쪽 외통.','아래 보드: 한 사 (5,2)가 차 위협과 포 위협을 동시 막는 중. 한 위협 실행 = 다른 쪽 무방비.'],board:'overload'},
    {h:'12.4 제거 (Removal of Defender)',p:['핵심 수비수를 직접 잡거나 거래.','초 차가 (6,1) 사 잡기 → 차도 잡힐 수 있지만, 사 잃은 한궁이 다음 수에 외통 위협 받으면 큰 이득.'],board:'removal'},
    {h:'12.5 응용 — 2단 유인',p:['1수: 적 사를 어떤 자리로 강제 이동시킨다 (장군으로).','2수: 그 옮긴 자리가 차의 외통 자리이거나, 다른 위협의 차단 자리.','아래 보드: 수비수 거래의 예. 차+포로 사 강제 거래 → 외사 강제 → 외통.'],board:'trade',maxim:'수비수가 둘이면 둘 다 일하게 만들고, 하나면 하나로 끝낸다.'}
  ]},

  {n:'13장 희생수의 기술', s:[
    {h:'13.1 희생의 종류',items:['위치 희생 — 기물을 잃되 위치 우세 확보.','외통 희생 — 외통 강제 수순의 일환.','시간 희생 — 한 수 양보로 큰 이득.'],board:'pao_sac'},
    {h:'13.2 차 희생',p:['차는 13점이지만, 차를 버려 한궁을 잡으면 무한한 이득. 한국 장기 묘수의 결정타는 종종 차 희생이다.','차 희생 → 다리 만들기 → 포 외통의 전형: 차가 (5,2)에 들어가며 차 자체가 새 다리. 한이 사로 차 잡으면 포 사선 살아 외통.'],board:'cha_sac'},
    {h:'13.3 사 희생 (양보)',p:['자기 사를 일부러 빠지게 하여 차의 직선 사선을 만든다.','때로는 사 1개와 차 1개를 거래해 외사 강제 → 종반 결정.','아래 보드: 차가 사 잡으며 (5,2) 들어가는 자살수. 사가 차 잡으면 (5,2)에서 다리 → 포 외통.'],board:'sa_sac'},
    {h:'13.4 포·마·상 희생',p:['포 — 다리 없이 잡혀도 사선이 살아 있는 동안 다른 위협으로 보상.','마·상 — 작은 기물 희생은 매우 흔하다. 보통 외통 강제 수순의 일부.','아래 보드: 마+차+포 셋업. 마가 사 잡으며 발견장군 + 차포 외통 강제.'],board:'ma_sac'},
    {h:'13.5 희생수 사고법',items:['외통 자리 그림 그리기 — 외통이 가능한 가상 자리 발견.','방해되는 적 기물 식별 — 어떤 사·차가 막고 있나.','이걸 강제로 옮길 방법은? — 잡거나, 위협하거나, 장군 거기.','이를 위해 내 기물 하나 버릴 가치 있는가? — 외통이면 무조건 OK.'],maxim:'버린 기물이 살린 한 수다.'}
  ]},

];

    {h:'15.2 패턴 카탈로그 25제',items:['패턴 6–10 — 차 희생 외통 변형.','패턴 11–15 — 발견장군 외통 (마·상·졸 옆이동 발견).','패턴 16–20 — 양수걸이 양득 (마·차·포).','패턴 21–25 — 사 유인 → 외통.'],p:['검증된 5제는 정확. 패턴 25제는 변형 셋업 검증을 직접 보드에서 풀어 학습.']},
    {h:'15.3 종반 묘수 5선',items:['차마 외통 (양사 vs 차+마).','차포 외통 (양사 vs 차+포 + 다리 만들기).','양차 외통 (외사 vs 양차).','양포 외통 (원앙포).','졸 5형제 행진 외통.'],maxim:'검증 풀이 = 진짜 한국 장기 실력.'}

  {n:'16장 고급 묘수 30제 (5수+)', s:[

    {h:'',puzzle:'p16'},
    {h:'',puzzle:'p17'},
    {h:'',puzzle:'p18'},
    {h:'',puzzle:'p19'},
    {h:'16.2 패턴 카탈로그 28제',items:['패턴 1–7 — 차 희생 5수 외통.','패턴 8–14 — 양수장 콤보 (마/포 비키며 발견장군 + 자체 장군).','패턴 15–21 — 사다리 외통 (양차 단계적 압박).','패턴 22–28 — 정밀 13수 외통 (고전 묘수책의 패턴).']},
    {h:'16.3 학습 권장',p:['본 책의 정확 검증 19제는 한국 장기 묘수의 핵심 패턴을 모두 포함한다.','이 19제를 완벽히 마스터하면 실전에서 외통 인식·강제 능력은 충분.','5수+ 묘수는 고전 묘수책 + 컴퓨터 엔진 분석으로 학습.'],maxim:'19개 정확한 묘수가, 30개 부정확한 묘수보다 낫다.'}

  {n:'제5부 — 종반 외통 패턴', s:[]},
  {n:'17장 종반 외통의 13가지 기본형', s:[
    {h:'17.1 안궁 형태 분류',tbl:[['형태','사','졸/병','평가'],['양사 안궁','2','5','최강'],['외사','1','4~5','강'],['양사 + 양상','2+2상','—','매우 강'],['외사 + 외상','1+1상','—','보통'],['무궁','0','—','약'],['민궁 + 졸 0','0','0','거의 즉사']]},
    {h:'17.2 13가지 외통 기본형 — 상',items:['형 1 — 차 1개 외통 (vs 무궁) — 도주로 차단된 상태.','형 2 — 차 + 졸 외통 (vs 무궁/외사).','형 3 — 차포 외통 (vs 양사) — 차+포는 양사 안궁의 천적.','형 4 — 차마 외통 — 마가 (4,3)/(6,3) 자리 침투.','형 5 — 차상 외통 — 코너 외통.','형 6 — 양차 외통 — 양차 사다리.','형 7 — 양포 외통 — 원앙포 형태.'],board:'mate_form1'},
    {h:'17.3 13가지 외통 기본형 — 하',items:['형 8 — 양마 외통 — 양 마가 코너 한궁 양쪽 협공.','형 9 — 마포 외통 — 마는 다리, 포는 사선.','형 10 — 차포마 외통 — 3기물 콤보, 거의 모든 안궁 뚫음.','형 11 — 발견장군 외통 — 가린 차/포 살리며 외통.','형 12 — 양수장 외통 — 양수장 + 도주로 차단.','형 13 — 졸 침투 외통 — 초 졸 (5,2) 등 한 궁성 진입.'],board:'mate_form13'},
    {h:'17.4 외통 거리 (Mate-in-N)',p:['양사 안궁은 보통 5~9수.','외사는 3~5수.','무궁은 1~3수.'],board:'mungung_mate',hint:'무궁 + 도주 차단 5자리 = 차 1개로 즉사.'},
    {h:'17.5 종반 학습 우선순위',items:['형 1, 2, 3 (단순 외통) — 종반의 80%.','형 4, 6 (차마, 양차) — 자주 나옴.','형 11, 12 (발견, 양수장) — 묘수의 정수.','나머지 — 패턴 인식.'],board:'mate_form11'},
    {h:'17.5b 형 11 — 발견장군 외통',p:['초 마 (5,4)가 비키면 초 차 (5,6)이 한궁 (5,1) 직접 사선 → 발견장군. 마가 새 자리에서도 위협 = 양수장.'],board:'mate_form11'},
    {h:'17.5c 형 12 — 양수장 외통',p:['양수장은 두 위협 동시 = 멍군 매우 어려움. 도주로까지 차단되면 즉시 외통.'],board:'mate_form12'},
    {h:'17.5d 형 2 — 차 + 졸 외통',p:['초 졸이 한 궁성 안 (5,2) 진입 + 차 (5,5) 보호. 한궁 졸 잡으려 해도 차 위협 자살수.'],board:'mate_form2'},
    {h:'17.5e 형 7 — 양포 원앙포 외통',p:['원앙포 형태: 5열에 양 포 + 사이에 졸 1개 다리. 두 포 모두 사선 통제.'],board:'mate_form7'},
    {h:'17.5f 형 9·10 — 마포·차포마',p:['마포 콤보: 마가 다리, 포가 사선.','차포마는 3기물 콤보로 거의 모든 안궁을 뚫는다.'],board:'mate_form10'},
    {h:'17.6 형 3 핵심 그림 — 차포 vs 양사',p:['차포는 5열 통제. 한 졸 (5,2)이 포 다리. 포 사선 → 한궁 직접.','한이 사 (5,2) 위로 옮길 수 없음 (사 4,1·6,1).','차 침투로 마무리.'],board:'mate_form3'},
    {h:'17.7 형 4 — 차마 vs 양사',p:['마 (6,3) 한궁 측면 위협. 차 5열 직선. 한 사 (4,1)·(6,1) 어디로 가도 외통.','마 (6,3) → (5,1) 가능: 일자 (6,2) → 대각 (5,1). 멱 (6,2) 비었음.'],board:'mate_form4'},
    {h:'17.8 형 6 — 양차 사다리',p:['양 차가 다른 줄을 통제하며 단계적으로 한궁을 좁힌다.','차 (4,3)·(6,4) 라면 4열·6열 양쪽 도주 차단.'],board:'mate_form6'},
    {h:'17.9 형 8 — 양마 코너 외통',p:['한궁이 (4,1) 코너에 갇히면 양 마 협공으로 외통 가능.','마 (3,3)이 (4,1) 위협 + 다른 마가 도주 차단.'],board:'mate_form8'}
  ]},

  {n:'18장 차포·양차 외통', s:[
    {h:'18.1 차포 외통의 본질',p:['차포가 함께 있으면 양사 안궁도 거의 다 뚫는다.','이유: ① 포 사선 + 차 직선 = 두 줄 동시 통제. ② 다리만 만들면 포가 한궁 직접 위협. ③ 차가 사 잡으며 외통 자리 진입.']},
    {h:'18.2 차포 외통 패턴 6선',items:['패턴 1 — 동축 차포 (5열 합공).','패턴 2 — 차 위 / 포 아래.','패턴 3 — 차가 다리 만들고 포 사선 살리기 (정수).','패턴 4 — 발견장군 차포.','패턴 5 — 차 측면 + 포 정면.','패턴 6 — 두 번 사 잡기.'],board:'cp_pat1'},
    {h:'18.2b 패턴 2 — 차 위 / 포 아래',p:['포가 5열 멀리 (5,10)에 자리. 다리 1개 (한 졸 (5,2))로 한궁 사선. 차는 5열 위로 진입.','한 사로 차 못 잡게 셋업해야 외통 강제 가능.'],board:'cp_pat2'},
    {h:'18.3 차포 외통의 정수',p:['차가 한 졸(다리 후보)을 잡으며 자기가 새 다리 → 포 사선 살아 외통.','「차55×54#」 — 차포 양수걸이 외통. 차포의 동축 합공.'],board:'mate_form3',hint:'한 사로 차 못 잡게 셋업해야 외통 강제 가능.'},
    {h:'18.4 양차 외통',p:['양차 = 차 두 개. 각자 다른 줄 통제. 사다리 형태로 한궁을 좁힘.','양차로 양사 안궁 외통은 3수~5수. 차 1개 사 1개 거래 후 차 + 잔존 차 외통.'],board:'mate_form6',warn:'양차도 한 차+포 일반 진영보다 약할 수 있다 (사선 없음).'},
    {h:'18.5 차포 vs 양차',tbl:[['','차포','양차'],['양사 안궁 외통','3~5수 (강력)','5~7수 (느림)'],['외사 외통','1~3수','3수'],['무궁 외통','1수','1~2수'],['도주로 차단','사선 + 직선','직선 + 직선'],['약점','다리 부수면 무력','사 잡으며 1차 손실']],maxim:'차포는 한 줄에서 같이 죽고, 양차는 다른 줄에서 협력한다.'}
  ]},

  {n:'19장 차마·양포·잡병 외통', s:[
    {h:'19.1 차마 외통',p:['차+마 콤보. 마가 한궁 측면 침투해 도주로 차단 + 차가 직접 위협.','마 (6,3)이 한궁 (5,1) 위협 → Δ=(1,-2) 일자 (5,3)→대각 (5,1)? 정확히는 마 (6,3) → (4,2)/(5,1)/(7,1)/(8,2)/(4,4)/(5,5)/(7,5)/(8,4).'],board:'mate_form4',hint:'양사 위치에 따라 차마 외통 성패 갈림. 사가 1행 (4,1)(6,1)이면 마 침투에 약하다.'},
    {h:'19.2 양포 외통',p:['양 포 두 개로 한궁 사선 압박. 원앙포 형태가 강력.','양사 분리 외통 — 한 사씩 잡으며 외사·무궁으로 압박.','「포48→41×+」 — 한 사 잡기. 다음 수 한이 다른 사 잡으러 못 감 → 외사 강제.'],board:'yangpo_mate'},
    {h:'19.3 졸 침투 외통',p:['초 졸이 한 진영 (5,2) 등에 진입하면 사실상 차 1개 가치.','졸이 한 궁성 안에서 대각 1칸 가능 → (5,2) → (4,1) 또는 (6,1) → 사 자리 잡으며 외통.'],board:'jol_palace',maxim:'졸의 옆 한 칸이 천 냥.'},
    {h:'19.4 잡병 외통 (소 기물 콤보)',p:['마+상+졸 등의 작은 기물 협공으로 외통. 차 없이도 외통 가능 — 단 매우 까다로움.','마상 외통 (vs 외사) — 마가 (4,1) 사 잡으며. 매우 정밀.'],board:'masang_mate'},
    {h:'19.5 무궁 외통 (1~3수)',p:['무궁은 차 1개로도 외통. 차 + 옆 도주 차단.','자기 졸로 (4,1)(6,1)(4,2)(6,2) 도주 차단 후 차 5열 진입.'],board:'mungung_mate'},
    {h:'19.6 외통 패턴 사고법',items:['한궁이 어디 있나? — 코너? 중앙?','사 몇 개 살아 있나? — 양사? 외사? 무궁?','내 잔존 기물? — 차포? 양차? 차마? 양포?','외통 자리 후보 — 한궁 도주로 모두 차단되는 자리.','그 자리 도달 강제 수순 — 보통 3~7수.'],maxim:'양사 안궁은 차포가 뚫고, 외사는 차 1개가 뚫고, 무궁은 졸 1개가 뚫는다.'}
  ]},

  {n:'제6부 — 포진과 안궁', s:[]},
  {n:'20장 4대 정석 포진', s:[
    {h:'20.1 시작 자유',p:['한국 장기는 시작 시 마와 상의 좌·우 위치를 바꿀 수 있다.','양 진영이 각자 4가지 시작 진형 → 총 16가지 조합. 그러나 자주 나오는 「4대 정석 포진」이 있다.']},
    {h:'20.2 양귀마진',p:['양쪽 다 마가 귀(코너)에 가깝고 상이 안쪽. 가장 표준적.','마의 진출이 빠르고 상은 측면 방어. 균형. 공격·수비 모두 무난. 초보자 추천.'],board:'init'},
    {h:'20.3 양면상진',p:['상이 코너에, 마가 안쪽. 상의 사선이 측면을 통과 → 측면 공격 강하나, 마의 진출이 느림.','특징: 측면 압박, 상 활용도 높음, 마 전술 약화.'],board:'myeonsang'},
    {h:'20.4 왼귀마/오른귀마',p:['왼귀마: 왼쪽(1열 측)은 마 코너, 오른쪽(9열 측)은 상 코너. 비대칭.','오른귀마: 왼귀마의 거울.','한쪽은 마 빠른 진출, 다른 쪽은 상 측면 통제. 공격 쪽과 수비 쪽 분리.'],board:'left_gwima'},
    {h:'20.5 포진 표준 시작 5수',items:['한: 포22→52 (오른포를 면포 자리로).','초: 포82→52 등 비슷.','한: 차11→14 (왼차 진출).','초: 비슷.','한·초: 졸 진출 — 마의 진출로 만들기.'],p:['이 5수 안에 면포 만들기 + 차 진출 + 졸 옆 이동이 핵심.','아래 보드: 한이 면포를 만들고 졸 옆 이동까지 끝낸 5수 후의 모양.'],board:'poji_5'},
    {h:'20.5b 오른귀마 진형',p:['왼귀마의 거울. 왼쪽 면상, 오른쪽 귀마.','오른쪽 마 진출이 빠르고 왼쪽은 상의 사선이 측면을 통제.'],board:'right_gwima'},
    {h:'20.6 포진 5대 원칙',items:['궁을 먼저 안전하게 (안궁).','포를 우선 위치에 (면포 또는 귀포).','차길 열기 — 졸 옆 이동.','마·상 진출 균형 — 양쪽 균등.','상대 진영 압박은 천천히 — 안궁 후에.']},
    {h:'20.7 포진 실수 톱 5',items:['포를 먼저 안 만든다 — 면포 없이 진군 → 사 빼면 즉사.','차를 너무 빨리 진출 — 차가 잡힘.','졸 옆 이동 안 함 — 차 갇힘.','마·상 한 쪽만 진출 — 다른 쪽 약화.','궁을 옮기지 않음 — 한국 장기 안궁은 궁의 적극적 이동도 필요.']}
  ]},

  {n:'21장 면포·귀포·원앙포', s:[
    {h:'21.1 면포',p:['자기 궁의 정면 1칸 앞. 다리는 한궁.','장점: 궁의 수비, 반격의 시작, 안궁의 핵심.','단점: 한궁이 옆으로 빠지면 다리 사라짐 → 면포 무력. 차로 잡힘. 포 자체가 사실상 갇힘.'],board:'init'},
    {h:'21.2 귀포',p:['양 귀포 — 차의 시작 자리 옆 (1열·9열 방향) 측면 통제.','장점: 측면 압박, 차의 진출 후 다리 역할, 중앙 포로 변환 가능.','단점: 수비력 약함, 다리 만들 자기 기물 옆에 없으면 거의 무용.'],board:'gwipo'},
    {h:'21.3 원앙포',p:['같은 5열에 포 두 개 + 사이에 다리 1개 (졸).','장점: 양 포 한 줄 통제. 다리 졸이 살아 있으면 매우 강력. 한 포 잡혀도 다른 포로 보상.','단점: 다리(졸)가 잡히면 두 포 모두 약화. 두 포 같은 줄이라 사선이 한정적. 적 포가 5열에 들어오면 처리 까다로움.'],board:'yuanang'},
    {h:'21.4 평포',p:['기본 시작 자리. 양 포 좌우 대칭.','장점: 자유도 최대. 어디든 움직임 가능.','단점: 수비력 약함. 적이 5열로 진군하면 막을 도구 없음.'],board:'pyeongpo'},
    {h:'21.5 포의 변환',p:['대국 중 포는 자주 위치를 바꾼다. 「평포 → 면포 → 원앙포 → 귀포」 같이 변환.','평포에서 면포 만들려면 마/상 같은 다리 필요. 보통 졸 옆 이동 후 졸이 다리.','평포 → 면포는 보통 2수. 가로 한 번 + 세로 한 번.','아래 보드: 평포에서 면포로 변환 중간 단계. 마 (3,3)이 다리.'],board:'pao_change',maxim:'면포는 집을 지키고, 귀포는 길을 열고, 원앙포는 적을 압박한다.'}
  ]},

  {n:'22장 안궁의 기술', s:[
    {h:'22.1 안궁의 3단계',items:['1단계: 양사 안궁 + 면포 — 가장 단단. 차+포 합공 받아도 1~2수 견딘다.','2단계: 외사 + 면포 — 여전히 단단. 차 1개로는 안 뚫린다.','3단계: 민궁 — 사 모두 죽음. 면포라도 있으면 사선 통제, 없으면 차 1개로 외통.'],board:'anggung'},
    {h:'22.2 안궁 위치 3종 — 평궁/측궁/코너',items:['평궁 (5열 정중앙) — 표준 자리. 가장 균형.','측궁 (4 또는 6 열) — 적 차의 5열 직선 압박 피함. 측면 노출 위험.','코너궁 (4,1 또는 6,1) — 가장 위험한 자리. 차 1개로도 외통 가능. 안궁 X.'],board:'pyeong'},
    {h:'22.2b 측궁 형태',p:['궁이 4열 또는 6열에 위치한 안궁. 적 차의 5열 직선 압박은 피하지만, 측면 노출의 위험.','측궁은 한정된 경우에만 유리. 평궁이 보편적으로 더 안정적.'],board:'cheukgung2'},

const PAGES=[];
function buildPages(){
  let chapterIdx=0;
  for(const part of PARTS){
    // part-divider pages for empty sections (제N부 헤더)
    if(part.s.length===0){
      PAGES.push({kind:'part',title:part.n,chapter:part.n});
      continue;
    }
    chapterIdx++;
    let sectionPages=[];
    let currentBatch=[];
    for(const sec of part.s){
      currentBatch.push(sec);
      // each section becomes its own page (we have many small sections)
      sectionPages.push({kind:'section',chapter:part.n,sec:[sec]});
      currentBatch=[];
    }
    PAGES.push(...sectionPages);
  }
}
buildPages();

const TOTAL=PAGES.length;

function escHtml(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}

function renderTable(rows){
  if(!rows||!rows.length)return'';
  let h='<table>';
  const [head,...body]=rows;
  h+='<thead><tr>'+head.map(c=>'<th>'+escHtml(c)+'</th>').join('')+'</tr></thead>';
  h+='<tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+escHtml(c)+'</td>').join('')+'</tr>').join('')+'</tbody>';
  return h+'</table>';
}

  return h;
