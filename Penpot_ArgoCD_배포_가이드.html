<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- deck-bookmark: 덱 엔진이 replaceState로 주소를 바꾸기 전에 진입 해시를 잡아둔다 -->
<script>window.__deckInitHash=location.hash;</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Penpot × ArgoCD 사내 배포 가이드 — 처음부터 따라 하는 GitOps (인터랙티브 슬라이드)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0a1020; --bg1:#0e1730; --bg2:#122040;
  --mint:#3fe0c5; --org:#ef7b4d; --blu:#59a9ff; --yel:#f5c243; --red:#ef5350; --vio:#9b7ede;
  --ink:#eef3fb; --ink-soft:#b8c5dd; --ink-dim:#7c89a8;
  --panel:rgba(255,255,255,.055); --panel-bd:rgba(63,224,197,.30);
  --code-bg:#070d1a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Noto Sans KR',sans-serif;color:var(--ink);overflow:hidden;
  background:
    radial-gradient(1100px 560px at 85% -10%, rgba(63,224,197,.10), transparent 60%),
    radial-gradient(900px 520px at 8% 112%, rgba(239,123,77,.10), transparent 60%),
    linear-gradient(160deg,var(--bg0) 0%,var(--bg1) 55%,var(--bg2) 100%);
}
#app{height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#bar{height:5px;background:rgba(255,255,255,.08);flex:0 0 auto;}
#barFill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--blu),var(--org));transition:width .25s;}
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:9px clamp(12px,2.5vw,28px);border-bottom:1px solid rgba(255,255,255,.07);}
header .logo{font-family:'Black Han Sans',sans-serif;font-size:clamp(14px,1.6vw,19px);color:var(--mint);
  white-space:nowrap;letter-spacing:.5px;}
header .logo .x{color:var(--org);}
header .chap{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink-soft);font-size:clamp(12px,1.3vw,15px);text-align:center;}
header .cnt{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:var(--ink-dim);
  font-size:clamp(12px,1.3vw,15px);white-space:nowrap;}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;justify-content:center;
  padding:clamp(10px,2vh,22px) clamp(10px,3vw,36px);}
.slide{width:min(1180px,100%);display:flex;flex-direction:column;min-height:0;animation:enter .32s ease both;}
.slide.back{animation:enterBack .32s ease both;}
@keyframes enter{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
@keyframes enterBack{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:none;}}
.kick{color:var(--mint);font-weight:700;font-size:clamp(11.5px,1.5vw,14.5px);letter-spacing:2.5px;margin-bottom:6px;}
h1.st{font-family:'Black Han Sans',sans-serif;font-weight:400;line-height:1.25;
  font-size:clamp(21px,3.3vw,38px);margin-bottom:clamp(10px,1.8vh,18px);letter-spacing:.3px;}
h1.st .em{color:var(--mint);}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding-right:6px;scrollbar-width:thin;scrollbar-color:rgba(63,224,197,.4) transparent;
  font-size:clamp(14.5px,1.7vw,18.5px);line-height:1.75;color:var(--ink-soft);}
.body::-webkit-scrollbar{width:6px;}
.body::-webkit-scrollbar-thumb{background:rgba(63,224,197,.35);border-radius:3px;}
.body b,.body strong{color:var(--ink);}
.body em{color:var(--mint);font-style:normal;font-weight:700;}
.body p{margin:0 0 12px;}
.body ul.b{list-style:none;margin:4px 0 14px;}
.body ul.b>li{padding:6px 0 6px 26px;position:relative;}
.body ul.b>li::before{content:'▸';position:absolute;left:4px;color:var(--mint);top:6px;}
.body ol{margin:4px 0 14px 24px;}
.body ol>li{padding:4px 0;}
.note{background:var(--panel);border:1px solid var(--panel-bd);border-left:4px solid var(--mint);
  border-radius:10px;padding:12px 16px;margin:12px 0;font-size:.94em;}
.note.blue{border-left-color:var(--blu);border-color:rgba(89,169,255,.35);}
.note.red{border-left-color:var(--red);border-color:rgba(239,83,80,.35);}
.note.org{border-left-color:var(--org);border-color:rgba(239,123,77,.4);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0;}
@media (max-width:720px){.grid2{grid-template-columns:1fr;}}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 15px;}
.card h3{font-size:1em;color:var(--mint);margin-bottom:6px;}
.card p{font-size:.9em;margin-bottom:0;}
table.tbl{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:.88em;}
table.tbl th{background:rgba(63,224,197,.13);color:var(--ink);padding:7px 10px;text-align:left;
  border:1px solid rgba(255,255,255,.12);white-space:nowrap;}
table.tbl td{padding:6px 10px;border:1px solid rgba(255,255,255,.10);}
table.tbl tr:nth-child(even) td{background:rgba(255,255,255,.03);}
.tblWrap{overflow-x:auto;}
pre.code{position:relative;background:var(--code-bg);border:1px solid rgba(255,255,255,.12);border-radius:10px;
  padding:13px 46px 13px 16px;margin:10px 0 14px;overflow-x:auto;font-family:'JetBrains Mono',monospace;
  font-size:clamp(11.5px,1.35vw,14px);line-height:1.6;color:#dce4f5;white-space:pre;}
pre.code .c{color:#6f9c7a;} pre.code .k{color:#7ec4ef;} pre.code .n{color:#f5c243;} pre.code .s{color:#e0946f;}
pre.code button.cpy{position:absolute;top:7px;right:7px;font-family:'Noto Sans KR',sans-serif;
  font-size:11.5px;color:var(--ink-soft);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.25);
  border-radius:7px;padding:3px 9px;cursor:pointer;}
pre.code button.cpy.ok{color:#8ff0d8;border-color:var(--mint);background:rgba(63,224,197,.18);}
.codeLabel{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;
  background:rgba(89,169,255,.16);border:1px solid rgba(89,169,255,.4);color:#9cc7f0;
  border-radius:6px 6px 0 0;padding:2px 10px;margin-bottom:-11px;position:relative;z-index:1;margin-left:8px;}
.reg{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.85em;background:rgba(155,126,222,.16);
  border:1px solid rgba(155,126,222,.45);color:#cbb8f5;border-radius:6px;padding:1px 8px;margin:0 2px;white-space:nowrap;}
kbd{font-family:'JetBrains Mono',monospace;font-size:.82em;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.25);border-bottom-width:2.5px;border-radius:6px;padding:1px 7px;}
.tag{display:inline-block;background:rgba(63,224,197,.10);border:1px solid rgba(63,224,197,.4);border-radius:999px;
  padding:2px 12px;font-size:12.5px;color:var(--mint);margin:2px 4px 2px 0;font-family:'JetBrains Mono',monospace;}
.big{text-align:center;font-size:clamp(17px,2.6vw,26px);line-height:1.7;margin:clamp(16px,6vh,60px) auto;max-width:860px;}
.big .hero{font-family:'Black Han Sans',sans-serif;font-size:clamp(26px,4.5vw,52px);display:block;margin:14px 0;color:var(--mint);}
/* 이미지 */
figure.ph{margin:12px 0;background:var(--panel);border:1px solid rgba(255,255,255,.10);
  border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;}
figure.ph .imgbox{border-radius:10px;overflow:hidden;background:#0a0f1c;display:flex;justify-content:center;}
figure.ph .imgbox.light{background:#f4f6fa;padding:10px;}
figure.ph img{max-width:100%;max-height:52dvh;object-fit:contain;display:block;}
figure.ph figcaption{font-size:.78em;color:var(--ink-dim);line-height:1.55;padding:0 4px;}
figure.ph figcaption a{color:var(--blu);text-decoration:none;}
figure.ph figcaption a:hover{text-decoration:underline;}
.imgfail{padding:22px;text-align:center;color:var(--ink-dim);font-size:.85em;width:100%;}
.imgfail a{color:var(--blu);}
.phduo{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.phduo figure.ph{margin:0;}
.phduo figure.ph img{max-height:38dvh;}
@media (max-width:720px){.phduo{grid-template-columns:1fr;}}
/* 다이어그램(인라인 SVG) */
.diag{background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.13);border-radius:14px;
  padding:12px;margin:12px 0;overflow-x:auto;}
.diag svg{display:block;margin:0 auto;max-width:100%;height:auto;}
/* 링크 칩 */
.links{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;}
a.lk{display:inline-flex;align-items:center;gap:8px;background:rgba(89,169,255,.10);
  border:1px solid rgba(89,169,255,.35);color:var(--blu);border-radius:999px;
  padding:8px 16px;font-size:clamp(12.5px,1.4vw,15px);font-weight:500;text-decoration:none;max-width:100%;}
a.lk:hover{background:rgba(89,169,255,.22);}
a.lk .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 단계 배지 */
.step{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid rgba(255,255,255,.10);
  border-radius:12px;padding:11px 14px;margin:8px 0;}
.step .no{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:rgba(63,224,197,.16);
  border:1px solid var(--mint);color:var(--mint);display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;}
.step .tx{flex:1;font-size:.95em;}
.step .tx b{display:block;color:var(--ink);}
/* 체크리스트 */
ul.ck{list-style:none;margin:8px 0;}
ul.ck li{padding:4px 0;}
ul.ck label{display:flex;gap:12px;align-items:flex-start;background:var(--panel);
  border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:11px 14px;cursor:pointer;}
ul.ck input{width:20px;height:20px;accent-color:var(--mint);flex:0 0 auto;margin-top:2px;}
ul.ck input:checked~span{color:var(--ink-dim);text-decoration:line-through;}
/* 챕터 표지 */
.cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;}
.cover .icon{font-size:clamp(44px,9vw,90px);margin-bottom:14px;}
.cover .chNo{font-family:'JetBrains Mono',monospace;color:var(--ink-dim);letter-spacing:4px;font-size:clamp(12px,1.6vw,16px);}
.cover h1{font-family:'Black Han Sans',sans-serif;font-size:clamp(28px,5.4vw,58px);line-height:1.25;margin:10px 0 16px;}
.cover h1 .em{color:var(--mint);}
.cover .desc{color:var(--ink-soft);max-width:720px;font-size:clamp(14px,1.9vw,19px);line-height:1.8;}
.cover .mini{margin-top:22px;color:var(--ink-dim);font-size:13px;font-family:'JetBrains Mono',monospace;}
footer{flex:0 0 auto;display:flex;gap:10px;align-items:center;
  padding:10px clamp(12px,2.5vw,28px) calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.07);}
footer button{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:clamp(12.5px,1.4vw,15px);
  color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);
  border-radius:10px;padding:9px 16px;cursor:pointer;white-space:nowrap;}
footer button:hover{background:rgba(63,224,197,.18);}
#dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
#dots .d{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.16);cursor:pointer;border:none;padding:0;}
#dots .d.on{background:var(--mint);}
#toc{position:fixed;inset:0;background:rgba(6,10,22,.93);backdrop-filter:blur(8px);z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
#toc[hidden]{display:none;}
#toc h2{font-family:'Black Han Sans',sans-serif;color:var(--mint);margin-bottom:18px;font-size:clamp(20px,3vw,30px);}
#toc .list{display:grid;gap:10px;width:min(680px,100%);max-height:70vh;overflow-y:auto;}
#toc .item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid rgba(255,255,255,.14);
  border-radius:12px;padding:12px 18px;color:var(--ink);cursor:pointer;text-align:left;font-size:clamp(13.5px,1.7vw,17px);}
#toc .item:hover{border-color:var(--mint);}
#toc .item .no{font-family:'JetBrains Mono',monospace;color:var(--ink-dim);font-size:.85em;white-space:nowrap;}
#toc .close{margin-top:18px;background:none;border:1px solid rgba(255,255,255,.3);color:var(--ink-soft);
  border-radius:999px;padding:8px 22px;cursor:pointer;}
/* ── 반응형: 폴드7 커버(세로 초슬림)·펼침(정방형)·모바일 ── */
@media (max-width:920px), (orientation:portrait){
  .body{font-size:15px;}
  figure.ph img{max-height:46dvh;}
}
@media (max-aspect-ratio:3/4){ figure.ph img{max-height:42dvh;} }
@media (max-width:480px){
  footer button.txt{padding:9px 11px;font-size:12px;}
  #dots .d{width:8px;height:8px;}
  header .logo{font-size:13px;}
  pre.code{font-size:11px;}
  .step{gap:9px;}
}
/* 폴드 펼침(거의 정사각 대화면): 무대 폭 넉넉히, 글자 과대 방지 */
@media (min-width:1500px) and (max-aspect-ratio:13/10){
  .slide{width:min(1280px,100%);}
  .body{font-size:19px;}
}
</style>
</head>
<body>
<div id="app">
  <div id="bar"><div id="barFill"></div></div>
  <header>
    <div class="logo">PENPOT <span class="x">×</span> ARGO CD</div>
    <div class="chap" id="chapLabel"></div>
    <div class="cnt" id="cnt"></div>
  </header>
  <main id="stage"></main>
  <footer>
    <button id="btnPrev" class="txt">◀ 이전</button>
    <button id="btnToc" class="txt">☰ 목차</button>
    <div id="dots"></div>
    <button id="btnNext" class="txt">다음 ▶</button>
  </footer>
</div>
<div id="toc" hidden>
  <h2>목차</h2>
  <div class="list" id="tocList"></div>
  <button class="close" id="tocClose">닫기 ✕</button>
</div>
<script>
'use strict';
const CHAPTERS=[];
function CH(o){CHAPTERS.push(o);}
/* 검증된 외부 이미지 (로딩 실패 시 원본 링크 표시) */
function IMG(url,cap,page,light){
  const p=page||url;
  return '<figure class="ph"><div class="imgbox'+(light?' light':'')+'"><img src="'+url+'" alt="'+cap.replace(/<[^>]+>/g,'')+'" loading="lazy" '
   +'onerror="this.parentNode.innerHTML=\'<div class=imgfail>이미지 로딩 실패(사내망 차단 가능) — <a href=&quot;'+p+'&quot; target=_blank rel=noopener>원본 링크로 보기 ↗</a></div>\'"></div>'
   +'<figcaption>'+cap+' · <a href="'+p+'" target="_blank" rel="noopener">원본 ↗</a></figcaption></figure>';
}
const A='https://raw.githubusercontent.com/argoproj/argo-cd/master/docs/assets/';
const AP='https://github.com/argoproj/argo-cd/blob/master/docs/assets/';
</script>
<script>
/* ───────────── CH 1. 시작하기 전에 ───────────── */
CH({
icon:'🎨', title:'Penpot을 <span class="em">ArgoCD</span>로 배포하기',
desc:'쿠버네티스도 ArgoCD도 처음인 분을 위한 따라 하기 가이드입니다. 오픈소스 디자인 툴 Penpot을 사내 Git(github.chobocho.com)에 배포 코드를 올리고, 사내 ArgoCD가 그것을 읽어 쿠버네티스에 자동 배포하게 만듭니다. 개념 → 준비 → 저장소 작성 → ArgoCD 연결 → 운영까지 한 번에.',
slides:[
{t:'이 슬라이드 사용법',k:'HOW TO USE',h:`
<ul class="b">
<li><kbd>→</kbd> <kbd>Space</kbd> 다음 장, <kbd>←</kbd> 이전 장, <kbd>Home</kbd>/<kbd>End</kbd> 처음/끝. 모바일에선 <em>좌우 스와이프</em>.</li>
<li>하단 <b>☰ 목차</b>로 8개 챕터를 바로 이동할 수 있습니다. 갤럭시 폴드7 커버·펼침 화면 모두 지원.</li>
<li>모든 명령어·설정 파일 오른쪽 위의 <b>복사</b> 버튼을 누르면 클립보드로 복사됩니다. <em>그대로 붙여 넣으며 따라 하세요.</em></li>
<li>스크린샷은 공식 문서의 검증된 이미지입니다. 사내망에서 로딩이 막히면 자동으로 <b>원본 링크</b>가 표시됩니다.</li>
</ul>
<div class="note">이 가이드의 예시 값 — 사내 Git: <span class="reg">github.chobocho.com</span>, 서비스 주소: <span class="reg">penpot.chobocho.com</span>, 네임스페이스: <span class="reg">penpot</span>. 여러분 환경에 맞는 값으로 바꿔 읽으세요. 바꿔야 하는 곳마다 다시 알려 드립니다.</div>`},
{t:'완성하면 이런 그림이 됩니다',k:'BIG PICTURE',h:`
<p>이 가이드가 끝나면 아래 파이프라인이 완성됩니다. <em>서버에 직접 들어가서 뭔가를 설치하는 일은 없습니다.</em> 여러분이 하는 일은 Git에 파일을 올리는 것뿐입니다.</p>
<div class="diag"><svg viewBox="0 0 880 250" font-family="Noto Sans KR,sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c89a8"/></marker></defs>
<rect x="10" y="80" width="150" height="90" rx="14" fill="rgba(89,169,255,.12)" stroke="#59a9ff"/>
<text x="85" y="118" fill="#eef3fb" font-size="17" text-anchor="middle" font-weight="700">내 PC</text>
<text x="85" y="145" fill="#b8c5dd" font-size="13" text-anchor="middle">배포 설정 파일 작성</text>
<rect x="240" y="80" width="180" height="90" rx="14" fill="rgba(245,194,67,.10)" stroke="#f5c243"/>
<text x="330" y="112" fill="#eef3fb" font-size="17" text-anchor="middle" font-weight="700">사내 Git</text>
<text x="330" y="137" fill="#b8c5dd" font-size="12.5" text-anchor="middle">github.chobocho.com</text>
<text x="330" y="157" fill="#7c89a8" font-size="12" text-anchor="middle">penpot-deploy 저장소</text>
<rect x="500" y="80" width="160" height="90" rx="14" fill="rgba(239,123,77,.12)" stroke="#ef7b4d"/>
<text x="580" y="112" fill="#eef3fb" font-size="17" text-anchor="middle" font-weight="700">ArgoCD</text>
<text x="580" y="137" fill="#b8c5dd" font-size="12.5" text-anchor="middle">Git을 계속 감시하고</text>
<text x="580" y="156" fill="#b8c5dd" font-size="12.5" text-anchor="middle">차이가 생기면 반영</text>

{t:'Penpot이 뭔가요?',k:'WHAT IS PENPOT',h:`
<p><b>Penpot</b>은 Figma와 비슷한 <em>오픈소스 디자인·프로토타이핑 툴</em>입니다. 웹 브라우저에서 팀이 함께 UI를 디자인하고, 디자인 시스템을 만들고, 개발자는 SVG·CSS 코드를 바로 뽑아 갈 수 있습니다.</p>
${IMG('https://github.com/user-attachments/assets/da17b160-f289-436f-b140-972083a08602','Penpot 작업 화면 — 공식 README의 소개 이미지','https://github.com/penpot/penpot')}
<p>가장 큰 매력은 <em>셀프호스팅</em> — 우리 서버에 직접 설치할 수 있어서 디자인 자산이 회사 밖으로 나가지 않습니다. 사내망 보안 요구사항이 있는 조직에 딱 맞죠.</p>`},
{t:'Penpot으로 할 수 있는 것',k:'FEATURES',h:`
<div class="phduo">
${IMG('https://github.com/user-attachments/assets/cce75ad6-f783-473f-8803-da9eb8255fef','디자인 시스템 — 컴포넌트·토큰 관리','https://github.com/penpot/penpot')}
${IMG('https://github.com/user-attachments/assets/0abc02f0-625c-45ab-ad81-4927bec7a055','Penpot Hub — 템플릿·리소스 공유','https://github.com/penpot/penpot')}
</div>
<ul class="b">
<li><b>실시간 공동 편집</b> — 여러 명이 같은 파일에서 동시에 작업</li>
<li><b>디자인 토큰·컴포넌트</b> — 디자인 시스템 구축</li>
<li><b>코드 검사(Inspect)</b> — 개발자가 SVG/CSS/HTML을 바로 복사</li>
<li><b>표준 포맷</b> — SVG 기반이라 벤더 종속이 없음</li>
</ul>`},
{t:'왜 ArgoCD로 배포하나요?',k:'WHY GITOPS',h:`
<p>쿠버네티스에 앱을 올리는 가장 원시적인 방법은 내 PC에서 <span class="reg">kubectl apply</span> 명령을 치는 겁니다. 되긴 하는데, 곧 문제가 생깁니다.</p>
<div class="grid2">
<div class="card"><h3>😰 수동 배포의 문제</h3><p>"지금 서버에 어떤 버전이 떠 있지?" 아무도 모릅니다. 누가 언제 뭘 바꿨는지 기록이 없고, 실수로 잘못 적용해도 되돌릴 방법이 막막합니다.</p></div>
<div class="card"><h3>😌 GitOps (ArgoCD)</h3><p>배포 설정이 전부 Git에 있으니 <b>이력·리뷰·되돌리기</b>가 공짜. 서버 상태가 Git과 다르면 ArgoCD가 표시해 주고, 자동으로 맞춰 줄 수도 있습니다.</p></div>
</div>
<div class="note blue">우리 회사처럼 <b>ArgoCD가 이미 사내에 구축돼 있는</b> 경우, 여러분은 클러스터 관리 지식 없이도 "저장소 하나 + 클릭 몇 번"으로 배포를 완성할 수 있습니다. 이게 이 가이드의 전략입니다.</div>`},
{t:'전체 로드맵 — 딱 6단계',k:'ROADMAP',h:`
<div class="step"><div class="no">1</div><div class="tx"><b>개념 익히기 (CH2~3)</b>쿠버네티스·Helm·ArgoCD에서 딱 필요한 만큼만. 30분이면 충분합니다.</div></div>
<div class="step"><div class="no">2</div><div class="tx"><b>준비 작업 (CH4)</b>kubectl·helm 설치, 클러스터 접속 확인, 사내 Git 저장소 만들기.</div></div>
<div class="step"><div class="no">3</div><div class="tx"><b>배포 저장소 작성 (CH5)</b>Penpot 공식 Helm 차트를 감싸는 파일 5개를 만들어 github.chobocho.com에 push.</div></div>
<div class="step"><div class="no">4</div><div class="tx"><b>ArgoCD 연결 (CH6)</b>ArgoCD에 저장소를 등록하고 Application을 만들어 첫 배포(Sync).</div></div>
<div class="step"><div class="no">5</div><div class="tx"><b>확인 (CH7 전반)</b>초록불 확인 → 브라우저로 접속 → 계정 생성.</div></div>
<div class="step"><div class="no">6</div><div class="tx"><b>운영 (CH7 후반)</b>업그레이드 = git push, 장애 = 여기 나온 순서대로 확인.</div></div>`},
{t:'준비물 체크',k:'PREREQUISITES',h:`
<p>시작 전에 아래가 준비돼 있어야 합니다. 없는 항목은 <em>사내 인프라팀/클러스터 관리자에게 요청</em>하세요.</p>
<ul class="ck">
<li><label><input type="checkbox"><span><b>쿠버네티스 클러스터 접속 권한</b> — kubeconfig 파일 또는 발급 절차 안내. "penpot 네임스페이스 사용 권한"이라고 요청하면 됩니다.</span></label></li>
<li><label><input type="checkbox"><span><b>사내 ArgoCD 접속 계정</b> — ArgoCD 웹 UI 주소 + 로그인 계정 (Application 생성 권한 포함).</span></label></li>
<li><label><input type="checkbox"><span><b>github.chobocho.com 계정</b> — 저장소를 만들 수 있으면 OK.</span></label></li>
<li><label><input type="checkbox"><span><b>서비스용 도메인</b> — 예: penpot.chobocho.com. 사내 DNS 신청 절차를 따르세요 (클러스터 Ingress 주소로 연결).</span></label></li>
<li><label><input type="checkbox"><span><b>작업용 PC</b> — 터미널 사용 가능. 차트 다운로드를 위해 외부망(helm.penpot.app) 접근이 한 번 필요합니다.</span></label></li>
</ul>
<div class="note org">권한 요청이 며칠 걸릴 수 있으니 <b>지금 바로 신청부터</b> 걸어 두고, 기다리는 동안 CH2~3 개념을 읽으면 효율적입니다.</div>`},
]});

icon:'📦', title:'쿠버네티스, <span class="em">딱 필요한 만큼</span>만',
desc:'쿠버네티스 전문가가 될 필요는 없습니다. Penpot 배포에 등장하는 7개 개념 — Pod, Deployment, Service, Ingress, PVC, Namespace, Secret — 만 이해하면 ArgoCD 화면이 읽히기 시작합니다.',
slides:[
{t:'쿠버네티스 = 컨테이너 자동 관리자',k:'KUBERNETES',h:`
<p><b>컨테이너</b>는 "앱 + 실행 환경"을 통째로 포장한 상자입니다(Docker로 만든 이미지를 실행한 것). <b>쿠버네티스(k8s)</b>는 이 컨테이너 수백 개를 여러 서버에 <em>자동으로 배치하고, 죽으면 다시 살리고, 트래픽을 나눠 주는</em> 관리자입니다.</p>
${IMG('https://kubernetes.io/images/docs/components-of-kubernetes.svg','쿠버네티스 클러스터 구성 — 관제탑(Control Plane)과 일꾼 서버(Node)들','https://kubernetes.io/ko/docs/concepts/overview/components/',true)}
<p>다행히 우리는 이 그림의 내부를 몰라도 됩니다. 사내 클러스터는 이미 관리되고 있으니, 우리는 <em>"무엇을 띄울지"를 파일로 선언</em>하기만 하면 됩니다.</p>`},
{t:'선언형: 원하는 상태를 적으면 알아서',k:'DECLARATIVE',h:`
<p>쿠버네티스의 핵심 철학 한 줄: <em>"명령하지 말고 선언하라"</em>.</p>
<div class="grid2">
<div class="card"><h3>명령형 (전통 방식)</h3><p>"서버 3번에 접속해서, 컨테이너를 실행하고, 죽으면 다시 실행해라" — 사람이 절차를 수행.</p></div>
<div class="card"><h3>선언형 (쿠버네티스)</h3><p>"penpot-backend 컨테이너가 <b>항상 1개 떠 있는 상태</b>를 원한다"라고 YAML 파일에 적으면, 쿠버네티스가 그 상태를 알아서 유지.</p></div>
</div>
<p>선언은 <b>YAML</b>이라는 텍스트 형식으로 적습니다. 그리고 눈치채셨겠지만 — <em>"원하는 상태를 파일로 적는다"는 점에서 Git과 찰떡궁합</em>입니다. 파일이니까 Git에 넣을 수 있고, Git에 있으니까 ArgoCD가 읽을 수 있습니다.</p>`},
{t:'Pod — 실행 중인 컨테이너 한 묶음',k:'POD',h:`
<p><b>Pod(파드)</b>는 쿠버네티스에서 실행되는 가장 작은 단위 — 대개 <em>컨테이너 1개</em>라고 생각하면 됩니다. Penpot을 배포하면 이런 Pod들이 생깁니다.</p>
<pre class="code">$ kubectl get pods -n penpot
NAME                               READY   STATUS    RESTARTS
penpot-frontend-7d9c5b8f4d-x2k8p   1/1     Running   0
penpot-backend-6f8b9c7d5e-m4n2q    1/1     Running   0
penpot-exporter-5c7d8e9f6a-p9r3s   1/1     Running   0
penpot-postgres-0                  1/1     Running   0
penpot-redis-59fb7c9d84-hq7wt      1/1     Running   0</pre>
<ul class="b">
<li><b>READY 1/1</b> + <b>STATUS Running</b> = 정상. 이 두 칸만 보면 됩니다.</li>
<li>Pod는 <em>언제든 죽고 다시 태어날 수 있는 소모품</em>입니다. 이름 뒤의 난수가 그 증거 — 재시작될 때마다 바뀝니다.</li>
</ul>`},
{t:'Deployment — Pod를 유지해 주는 감독',k:'DEPLOYMENT',h:`
<p>Pod가 소모품이면, 누가 다시 만들어 줄까요? <b>Deployment</b>입니다. "이 이미지로 Pod N개를 유지하라"는 선언이죠.</p>
<span class="codeLabel">YAML 훑어보기 (직접 쓸 일은 거의 없음)</span>
<pre class="code">apiVersion: apps/v1
kind: Deployment            # 종류: Deployment
metadata:
  name: penpot-frontend     # 이름
spec:
  replicas: 1               # Pod를 1개 유지하라
  template:
    spec:
      containers:
        - name: frontend
          image: penpotapp/frontend:2.16.2   # 이 이미지로</pre>
<ul class="b">
<li>Pod가 죽으면 → Deployment가 즉시 새로 만듦 (자가 치유)</li>
<li>이미지 버전을 바꾸면 → 새 Pod를 만들고 옛 Pod를 제거 (무중단 교체)</li>
<li>비슷한 친구 <b>StatefulSet</b>: 데이터베이스처럼 <em>저장 데이터와 순서가 중요한</em> 앱용. Penpot의 PostgreSQL이 이걸 씁니다.</li>
</ul>`},
{t:'Service — 클러스터 안의 전화번호부',k:'SERVICE',h:`
<p>Pod는 죽고 다시 태어날 때마다 IP가 바뀝니다. 그래서 Pod끼리 직접 IP로 통신하면 금방 끊어지죠. <b>Service</b>는 <em>변하지 않는 고정 이름</em>을 제공합니다.</p>
<div class="diag"><svg viewBox="0 0 800 190" font-family="Noto Sans KR,sans-serif">
<defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c89a8"/></marker></defs>

<text x="420" y="90" fill="#eef3fb" font-size="15" text-anchor="middle" font-weight="700">Service</text>

<text x="400" y="165" fill="#7c89a8" font-size="13" text-anchor="middle">이름은 고정, 뒤의 Pod가 바뀌어도 Service가 알아서 연결해 줌</text>
</svg></div>
<p>뒤에서 Penpot 설정에 <span class="reg">host: penpot-postgres</span>라고 적는데, 그게 바로 이 Service 이름입니다. <em>IP 대신 이름으로 연결한다</em> — 이것만 기억하세요.</p>`},
{t:'Ingress — 외부에서 들어오는 정문',k:'INGRESS',h:`
<p>Service는 클러스터 <em>안</em>의 전화번호부입니다. 그럼 사용자가 사무실 PC 브라우저에서 접속하려면? <b>Ingress</b>가 "어떤 도메인으로 온 요청을 어떤 Service로 보낼지" 정하는 정문 역할을 합니다.</p>
${IMG('https://kubernetes.io/docs/images/ingress.svg','Ingress가 외부 요청을 받아 내부 Service로 라우팅하는 구조 (공식 문서 다이어그램)','https://kubernetes.io/ko/docs/concepts/services-networking/ingress/',true)}
<p>우리의 규칙은 하나뿐입니다: <span class="reg">penpot.chobocho.com</span>으로 온 요청 → <span class="reg">penpot-frontend</span> Service로. 이 규칙은 Helm 차트가 자동으로 만들어 주므로, 우리는 도메인 이름만 설정 파일에 적으면 됩니다.</p>`},
{t:'PVC — 지워지지 않는 디스크',k:'STORAGE',h:`
<p>Pod가 소모품이라면 그 안의 파일도 Pod와 함께 사라집니다. 디자인 파일과 DB 데이터가 날아가면 곤란하죠. 그래서 <b>PVC(PersistentVolumeClaim)</b>로 <em>Pod 밖에 있는 영구 디스크</em>를 요청해서 붙입니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>Penpot에서</th><th>PVC</th><th>내용</th></tr>
<tr><td>업로드 자산</td><td>penpot (assets)</td><td>이미지·폰트 등 업로드 파일, 20Gi</td></tr>
<tr><td>PostgreSQL</td><td>data-penpot-postgres-0</td><td>모든 디자인 데이터의 본체, 10Gi</td></tr>
</table></div>
<div class="note blue"><b>StorageClass</b>는 "어떤 종류의 디스크를 줄지"의 등급표입니다. 사내 클러스터에 기본값이 있으면 아무것도 안 적어도 됩니다. CH4에서 확인 명령을 알려 드립니다.</div>`},
{t:'Namespace · Secret — 정리함과 금고',k:'NS & SECRET',h:`
<div class="grid2">
<div class="card"><h3>📁 Namespace</h3><p>클러스터 안의 <b>폴더</b>. 우리 리소스는 전부 <span class="reg">penpot</span> 네임스페이스에 넣어서 다른 팀 것과 섞이지 않게 합니다. 명령마다 <span class="reg">-n penpot</span>을 붙이는 이유.</p></div>
<div class="card"><h3>🔐 Secret</h3><p>비밀번호·토큰을 담는 <b>금고</b>. 이 가이드는 입문용으로 비밀번호를 설정 파일에 직접 적는데, 사내 보안 규정에 따라 나중에 Secret 분리(CH8 참고)로 업그레이드하세요.</p></div>
</div>
<p>여기까지가 등장인물 전부입니다. 정리하면 —</p>
<ul class="b">
<li><b>Deployment/StatefulSet</b>이 <b>Pod</b>(컨테이너)를 유지하고</li>
<li><b>Service</b>가 안쪽 통신, <b>Ingress</b>가 바깥 접속을 연결하고</li>
<li><b>PVC</b>가 데이터를 지키고, 전부 <b>penpot 네임스페이스</b>에 담긴다</li>
</ul>`},
{t:'Penpot 한 세트 = 이 조각들',k:'PENPOT MAP',h:`
<p>Penpot은 컨테이너 하나가 아니라 <em>5개 조각의 세트</em>입니다. 위에서 배운 개념과 연결해 보면:</p>
<div class="tblWrap"><table class="tbl">
<tr><th>조각</th><th>역할</th><th>쿠버네티스 오브젝트</th></tr>
<tr><td><b>frontend</b></td><td>브라우저에 보이는 화면(정적 파일 서버)</td><td>Deployment + Service + Ingress</td></tr>
<tr><td><b>backend</b></td><td>API 서버 — 실시간 편집, 저장, 인증</td><td>Deployment + Service</td></tr>
<tr><td><b>exporter</b></td><td>PNG/PDF 내보내기 담당</td><td>Deployment + Service</td></tr>
<tr><td><b>PostgreSQL</b></td><td>데이터베이스 — 모든 디자인 데이터</td><td>StatefulSet + Service + PVC</td></tr>
<tr><td><b>Redis</b></td><td>실시간 협업 메시지 중계</td><td>Deployment + Service</td></tr>
</table></div>
<p>"5개나 만들어야 해?" 걱정할 필요 없습니다. 다음 챕터의 <em>Helm 차트</em>가 이걸 전부 자동 생성해 줍니다. 우리는 설정값만 적으면 됩니다.</p>`},
]});

/* ───────────── CH 3. Helm과 ArgoCD ───────────── */
CH({
icon:'🐙', title:'<span class="em">Helm</span>과 <span class="em">ArgoCD</span> — 두 개의 도구',
desc:'YAML 수십 장을 손으로 쓰는 대신 Helm 차트라는 "설치 패키지"를 쓰고, kubectl 명령 대신 ArgoCD라는 "Git 감시 배포자"를 씁니다. 두 도구가 뭘 해 주는지 감을 잡습니다.',
slides:[
{t:'Helm = 쿠버네티스의 앱스토어 패키지',k:'HELM',h:`
<p>Penpot 한 세트를 YAML로 직접 쓰면 수백 줄입니다. <b>Helm</b>은 이걸 <em>차트(Chart)</em>라는 패키지로 묶어 배포하는 도구입니다. 스마트폰 앱 설치와 비슷해요.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>스마트폰</th><th>Helm</th></tr>
<tr><td>앱스토어</td><td>차트 저장소 (예: helm.penpot.app)</td></tr>
<tr><td>앱 설치 파일</td><td>차트 — YAML 템플릿 묶음</td></tr>
<tr><td>앱 설정 화면</td><td><b>values.yaml</b> — 도메인·비밀번호 등 내 설정값</td></tr>
</table></div>
<p>핵심은 <em>values.yaml</em>입니다. 차트가 "빈칸 있는 서식"이라면 values.yaml이 "빈칸에 채울 내 값"이죠. <b>우리가 이 가이드에서 작성하는 파일의 90%가 바로 이것</b>입니다.</p>
<div class="note">Penpot 개발사가 공식 Helm 차트를 관리합니다: <span class="reg">penpot 1.5.0</span> (Penpot 2.16.2 포함, 2026-07 기준 최신). frontend·backend·exporter·Ingress·PVC를 전부 만들어 줍니다.</div>`},
{t:'ArgoCD = Git을 감시하는 배포 로봇',k:'ARGO CD',h:`
<p><b>ArgoCD</b>는 쿠버네티스 안에 상주하면서 <em>Git 저장소와 클러스터 상태를 3분마다 비교</em>하는 로봇입니다. 다르면 알려 주고(OutOfSync), 버튼 하나 또는 자동으로 Git 쪽 내용을 클러스터에 반영(Sync)합니다.</p>
${IMG(A+'argocd-ui.gif','ArgoCD 웹 UI — 애플리케이션 상태를 실시간으로 보여 준다 (공식 문서)','https://argo-cd.readthedocs.io/en/stable/')}
<p>웹 UI가 훌륭해서 <em>kubectl 없이도</em> Pod 상태·로그·이벤트를 다 볼 수 있습니다. 입문자에게 최고의 대시보드이기도 합니다.</p>`},
{t:'ArgoCD가 일하는 방식',k:'HOW IT WORKS',h:`
${IMG(A+'argocd_architecture.png','ArgoCD 아키텍처 — Git 저장소를 읽어 쿠버네티스에 반영한다 (공식 문서)','https://argo-cd.readthedocs.io/en/stable/operator-manual/architecture/')}
<p>내부 구조를 외울 필요는 없습니다. 딱 세 가지 흐름만:</p>
<ol>
<li><b>Repo 서버</b>가 Git을 클론해 "정답 YAML"(Helm 차트면 렌더링까지)을 만든다</li>
<li><b>Application Controller</b>가 정답과 클러스터 현실을 비교한다</li>
<li>다르면 → UI에 <span class="reg">OutOfSync</span> 표시 → Sync 실행 시 정답대로 반영</li>
</ol>
<div class="note blue">ArgoCD 자체는 사내 인프라팀이 이미 설치·운영 중입니다. 우리는 <b>사용자</b>로서 웹 UI에 로그인해 쓰기만 하면 됩니다.</div>`},
{t:'Application — ArgoCD의 배포 단위',k:'APPLICATION',h:`
<p>ArgoCD에서 배포 하나를 <b>Application</b>이라고 부릅니다. Application은 본질적으로 <em>세 가지 정보의 묶음</em>입니다.</p>
<div class="step"><div class="no">1</div><div class="tx"><b>Source — 어디서 가져올까</b>Git 저장소 주소 + 브랜치 + 폴더 경로. 우리 경우: github.chobocho.com의 penpot-deploy 저장소, main 브랜치, 루트(.)</div></div>
<div class="step"><div class="no">2</div><div class="tx"><b>Destination — 어디에 배포할까</b>클러스터 주소 + 네임스페이스. 우리 경우: 사내 클러스터, penpot 네임스페이스</div></div>
<div class="step"><div class="no">3</div><div class="tx"><b>Sync Policy — 언제 반영할까</b>수동(버튼 클릭) 또는 자동(Git 변경 감지 시 즉시). 처음엔 수동으로 시작합니다.</div></div>
<p>CH6에서 이 세 칸을 채우는 화면을 스크린샷과 함께 하나씩 클릭합니다.</p>`},
{t:'상태 신호등 읽는 법',k:'SYNC & HEALTH',h:`
<p>ArgoCD 화면에는 Application마다 두 개의 신호등이 있습니다. 이 표만 알면 화면이 읽힙니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>신호</th><th>값</th><th>뜻</th></tr>
<tr><td rowspan="2"><b>Sync 상태</b><br>(Git과 같은가?)</td><td>🟢 Synced</td><td>클러스터가 Git과 완전히 같음</td></tr>
<tr><td>🟡 OutOfSync</td><td>Git이 바뀌었거나 누가 클러스터를 직접 수정함 → Sync 필요</td></tr>
<tr><td rowspan="3"><b>Health 상태</b><br>(앱이 건강한가?)</td><td>💚 Healthy</td><td>모든 Pod 정상 동작</td></tr>
<tr><td>🔵 Progressing</td><td>배포 진행 중 (이미지 다운로드·시작 대기) — 기다리세요</td></tr>
<tr><td>❤️‍🩹 Degraded</td><td>뭔가 실패함 → CH7 트러블슈팅으로</td></tr>
</table></div>
<p>목표는 항상 <em>Synced + Healthy</em>. 첫 배포 직후엔 Progressing이 몇 분 이어지는 게 정상입니다 (이미지 수백 MB를 받는 시간).</p>`},
{t:'GitOps 루프 — 전체 흐름 한 장',k:'THE LOOP',h:`

<p>운영이 시작되면 여러분의 일은 <em>① 하나뿐</em>입니다. 나머지는 ArgoCD가 돌립니다. 버전 업그레이드도, 설정 변경도, 롤백도 전부 "Git 수정 → push"로 끝납니다.</p>

CH({
icon:'🧰', title:'<span class="em">준비 작업</span> — 도구와 권한',
desc:'kubectl·helm 설치, 클러스터 접속 확인, 사내 Git 저장소 생성까지. 여기가 끝나면 본격적인 배포 저장소 작성에 들어갈 수 있습니다. 소요 시간 약 30분 (권한 발급 대기 제외).',
slides:[
{t:'kubectl 설치',k:'STEP 4-1',h:`
<p><b>kubectl</b>은 쿠버네티스에 명령을 보내는 CLI입니다. ArgoCD가 배포를 대신해 주지만, 상태 확인·디버깅에는 kubectl이 필요합니다.</p>
<span class="codeLabel">macOS</span>
<pre class="code">brew install kubectl</pre>
<span class="codeLabel">Windows (PowerShell)</span>
<pre class="code">winget install Kubernetes.kubectl</pre>
<span class="codeLabel">Linux</span>
<pre class="code">curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
chmod +x kubectl &amp;&amp; sudo mv kubectl /usr/local/bin/</pre>
<div class="note org">사내 개발 PC라면 사내 소프트웨어 센터/사내 미러에 kubectl 패키지가 있을 가능성이 높습니다. 그쪽이 프록시 설정 없이 편합니다.</div>`},
{t:'kubeconfig — 클러스터 열쇠 등록',k:'STEP 4-2',h:`
<p>클러스터 관리자에게 받은 접속 설정(kubeconfig)을 등록합니다. 보통 YAML 파일 하나를 주거나, 사내 포털에서 다운로드합니다.</p>
<pre class="code"># 받은 파일을 기본 위치에 두기 (기존 파일이 있다면 백업 후)
mkdir -p ~/.kube
cp 받은파일.yaml ~/.kube/config

# 접속 테스트 — 노드 목록이 보이면 성공!
kubectl get nodes</pre>
<pre class="code">NAME          STATUS   ROLES    AGE    VERSION
k8s-node-01   Ready    worker   200d   v1.30.4
k8s-node-02   Ready    worker   200d   v1.30.4</pre>
<div class="note red"><b>여기서 막히면</b> 더 진행하지 말고 클러스터 관리자에게 문의하세요. 이후 모든 단계가 이 접속을 전제로 합니다. 사내 VPN/프록시 필요 여부도 함께 확인.</div>`},
{t:'helm 설치',k:'STEP 4-3',h:`
<p><b>helm</b>은 차트를 다루는 CLI입니다. 우리는 서버에 설치하는 용도가 아니라, <em>Penpot 공식 차트를 내려받아 저장소에 넣고, 문법 검증하는 용도</em>로만 씁니다.</p>
<span class="codeLabel">macOS</span>
<pre class="code">brew install helm</pre>
<span class="codeLabel">Windows (PowerShell)</span>
<pre class="code">winget install Helm.Helm</pre>
<span class="codeLabel">Linux</span>
<pre class="code">curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash</pre>
<pre class="code"># 확인
helm version --short
# v3.16.x 이상이면 OK</pre>`},
{t:'StorageClass · Ingress 클래스 확인',k:'STEP 4-4',h:`
<p>사내 클러스터의 두 가지 기본값을 확인해 둡니다. 뒤에서 values.yaml에 적을 값입니다.</p>
<pre class="code"># ① 스토리지 등급 확인 — (default) 표시가 있으면 그대로 두면 됨
kubectl get storageclass
NAME                PROVISIONER        ...
ceph-block (default)  rbd.csi.ceph.com   ...

# ② Ingress 클래스 확인 — 보통 nginx
kubectl get ingressclass
NAME    CONTROLLER             ...
nginx   k8s.io/ingress-nginx   ...</pre>
<ul class="b">
<li><b>(default) 붙은 StorageClass가 있으면</b> → 설정에 아무것도 안 적어도 됩니다.</li>
<li><b>IngressClass 이름</b>(예: nginx)을 메모하세요. values.yaml의 <span class="reg">className</span>에 들어갑니다.</li>
<li>도메인(<span class="reg">penpot.chobocho.com</span>)이 Ingress 주소를 가리키도록 <em>사내 DNS 신청</em>도 지금 걸어 두세요.</li>
</ul>`},
{t:'사내 Git에 저장소 만들기',k:'STEP 4-5',h:`
<p>브라우저에서 <b>github.chobocho.com</b>에 로그인하고 새 저장소를 만듭니다.</p>
<div class="step"><div class="no">1</div><div class="tx"><b>New repository 클릭</b>오른쪽 위 <b>+</b> 버튼 → New repository</div></div>
<div class="step"><div class="no">2</div><div class="tx"><b>이름: penpot-deploy</b>Owner는 개인 계정보다 <em>팀 Organization</em>을 권장 (퇴사·이동에도 안전). 여기선 예시로 design-team 사용.</div></div>
<div class="step"><div class="no">3</div><div class="tx"><b>Private 선택 → Create</b>README 추가 옵션은 켜도 되고 안 켜도 됩니다.</div></div>
<p>저장소 주소가 이렇게 생겼을 겁니다:</p>
<pre class="code">https://github.chobocho.com/design-team/penpot-deploy.git</pre>
<div class="note">이후 슬라이드의 <span class="reg">design-team</span>을 여러분의 Organization/계정명으로 바꿔 읽으세요.</div>`},
{t:'토큰 발급과 clone',k:'STEP 4-6',h:`
<p>ArgoCD와 내 PC가 이 저장소를 읽으려면 <b>Personal Access Token(PAT)</b>이 필요합니다. (GitHub Enterprise는 비밀번호 대신 토큰을 씁니다.)</p>
<div class="step"><div class="no">1</div><div class="tx"><b>토큰 발급</b>github.chobocho.com 오른쪽 위 프로필 → Settings → Developer settings → Personal access tokens → <b>Generate new token</b>. 권한(scope)은 <span class="reg">repo</span>만 체크.</div></div>
<div class="step"><div class="no">2</div><div class="tx"><b>토큰 복사·보관</b>한 번만 보여 주니 안전한 곳에 보관. ArgoCD 등록(CH6)에서 또 씁니다.</div></div>
<div class="step"><div class="no">3</div><div class="tx"><b>내 PC로 clone</b></div></div>
<pre class="code">git clone https://github.chobocho.com/design-team/penpot-deploy.git
cd penpot-deploy
# 인증을 물으면: Username = 사내 계정, Password = 방금 만든 토큰</pre>
<div class="note org">팀 운영이라면 개인 토큰 대신 <b>봇 계정 토큰</b>이나 <b>Deploy Key</b>를 쓰는 것이 정석입니다. 사내 Git 관리 규정을 확인하세요.</div>`},

<p>ArgoCD가 배포하려면 차트가 필요한데, 사내망의 ArgoCD는 외부 차트 저장소(helm.penpot.app)에 <em>접근 못 할 수 있습니다</em>. 그래서 이렇게 갑니다:</p>

<div class="step"><div class="no">3</div><div class="tx"><b>DB는 매니페스트로 동봉</b>공식 차트에 PostgreSQL·Redis가 <em>포함돼 있지 않으므로</em>, 간단한 YAML 2개를 templates/ 폴더에 같이 넣음</div></div>

<pre class="code">penpot-deploy/
├── Chart.yaml               # ① 우리 차트의 신분증 + 공식 차트 의존 선언
├── charts/

{t:'① Chart.yaml',k:'FILE 1/5',h:`
<p>clone한 penpot-deploy 폴더 안에 <b>Chart.yaml</b> 파일을 만들고 아래를 그대로 넣습니다.</p>
<span class="codeLabel">Chart.yaml</span>
<pre class="code">apiVersion: v2
name: penpot-deploy
description: 사내 Penpot 배포용 엄브렐라 차트
type: application
version: 0.1.0          # 우리 저장소의 버전 (수정할 때마다 올리면 좋음)
appVersion: "2.16.2"    # 배포되는 Penpot 버전 (메모용)

dependencies:
  - name: penpot        # 공식 차트를 부품으로 쓴다는 선언
    version: 1.5.0
    repository: https://helm.penpot.app</pre>
<div class="note">이런 구조를 <b>엄브렐라(우산) 차트</b>라고 합니다. 공식 차트를 부품(dependency)으로 품고, 그 위에 우리 설정과 추가 리소스를 얹는 표준 패턴입니다.</div>`},
{t:'② 공식 차트 다운로드',k:'FILE 2/5',h:`
<p>이 단계만 <em>외부망(helm.penpot.app) 접근</em>이 필요합니다. 안 되는 환경이면 외부망 되는 PC에서 하고 파일만 옮기세요.</p>
<pre class="code">cd penpot-deploy

# 공식 차트 저장소 등록
helm repo add penpot https://helm.penpot.app

# Chart.yaml의 dependencies를 읽어 charts/ 폴더에 다운로드
helm dependency build

# 확인 — 이 파일이 생겼으면 성공
ls charts/
# penpot-1.5.0.tgz</pre>
<div class="note red"><b>중요:</b> 많은 프로젝트가 .gitignore에 <span class="reg">charts/*.tgz</span>를 넣어 커밋을 막아 두지만, <b>우리는 반대로 꼭 커밋해야 합니다</b>. 이 파일이 저장소에 있어야 ArgoCD가 외부망 없이 배포할 수 있습니다. .gitignore를 쓰고 있다면 이 경로가 막혀 있지 않은지 확인하세요.</div>`},
{t:'③ values.yaml — 앞부분',k:'FILE 3/5 (A)',h:`
<p>이제 핵심 설정 파일입니다. 먼저 Penpot 본체 설정 — <b>바꿔야 할 곳은 주석으로 표시</b>했습니다.</p>
<span class="codeLabel">values.yaml (앞부분)</span>
<pre class="code">penpot:                    # 공식 차트에 전달되는 값은 전부 penpot: 아래에
  config:
    # ★ 우리 서비스 주소로 변경
    publicUri: "https://penpot.chobocho.com"

    # 기능 스위치: 가입 허용 + 비밀번호 로그인 + 메일 인증 생략
    flags: "enable-registration enable-login-with-password disable-email-verification disable-telemetry"

    # ★ 세션 암호화 키 — 반드시 새로 생성해서 교체! (다음 슬라이드)
    apiSecretKey: "여기에-생성한-키-붙여넣기"

    telemetryEnabled: false   # 외부로 사용 통계 전송 안 함 (사내망 권장)</pre>
<ul class="b">
<li><b>publicUri</b> — 사용자가 접속할 최종 주소. Ingress 도메인과 반드시 일치해야 합니다.</li>
<li><b>flags</b> — <span class="reg">disable-email-verification</span>은 사내에 메일 서버 연동 전이라 넣습니다. 아무나 가입하면 안 되는 환경이면 나중에 <span class="reg">enable-registration</span>을 빼면 됩니다(CH8).</li>
</ul>`},
{t:'비밀 키 생성하기',k:'SECRET KEY',h:`
<p><span class="reg">apiSecretKey</span>는 세션·토큰 암호화에 쓰는 키입니다. <em>절대 예제 값을 그대로 두지 마세요.</em> 터미널에서 하나 만들어 붙여 넣습니다.</p>
<span class="codeLabel">macOS / Linux</span>
<pre class="code">openssl rand -base64 48 | tr -d '\\n' ; echo</pre>
<span class="codeLabel">Windows (PowerShell)</span>
<pre class="code">[Convert]::ToBase64String((1..48 | ForEach-Object { Get-Random -Maximum 256 }))</pre>
<p>출력된 긴 문자열을 복사해서 values.yaml의 <span class="reg">apiSecretKey</span> 값으로 교체하세요.</p>
<div class="note org">이 키와 DB 비밀번호가 Git에 평문으로 들어가는 게 마음에 걸린다면 — 맞습니다, 정석은 쿠버네티스 Secret 분리입니다. 다만 <b>Private 저장소 + 입문 단계</b>에선 이대로 진행하고, 서비스가 자리 잡으면 CH8의 보안 업그레이드를 적용하세요.</div>`},
{t:'③ values.yaml — 뒷부분',k:'FILE 3/5 (B)',h:`
<p>이어서 DB 연결·저장공간·Ingress 설정입니다. 위 내용 바로 아래에 붙입니다 (들여쓰기 주의 — <span class="reg">config:</span>와 같은 깊이).</p>
<span class="codeLabel">values.yaml (뒷부분)</span>
<pre class="code">    # ── config: 아래 계속 ──
    postgresql:
      host: "penpot-postgres"    # ④에서 만들 Service 이름
      port: 5432
      username: "penpot"
      password: "penpot-db-pass" # ★ 원하는 값으로 변경 (④와 동일하게!)
      database: "penpot"
    redis:
      host: "penpot-redis"       # ⑤에서 만들 Service 이름
      port: 6379
      database: "0"

  persistence:
    assets:
      enabled: true
      size: 20Gi                 # 업로드 파일 저장 공간

  ingress:
    enabled: true
    className: "nginx"           # ★ CH4에서 확인한 IngressClass 이름
    hosts:
      - "penpot.chobocho.com"    # ★ 우리 도메인으로 변경</pre>
<div class="note blue">YAML은 <b>들여쓰기(스페이스 2칸)</b>가 문법입니다. 탭 금지! 복사 버튼으로 그대로 붙여 넣는 걸 권장합니다.</div>`},
{t:'④ templates/postgres.yaml',k:'FILE 4/5',h:`
<p>데이터베이스입니다. templates 폴더를 만들고 그 안에 넣으세요. CH2에서 배운 <b>StatefulSet + Service + PVC</b>가 그대로 나옵니다.</p>
<span class="codeLabel">templates/postgres.yaml</span>
<pre class="code">apiVersion: v1
kind: Service                  # 고정 이름 "penpot-postgres" 부여
metadata:
  name: penpot-postgres
spec:
  selector:
    app: penpot-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet              # DB는 데이터가 중요하니 StatefulSet
metadata:
  name: penpot-postgres
spec:
  serviceName: penpot-postgres
  replicas: 1
  selector:
    matchLabels:
      app: penpot-postgres
  template:
    metadata:
      labels:
        app: penpot-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: penpot
            - name: POSTGRES_USER
              value: penpot
            - name: POSTGRES_PASSWORD
              value: penpot-db-pass   # ★ values.yaml과 동일한 값!
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:        # 영구 디스크(PVC) 자동 생성
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi</pre>`},
{t:'⑤ templates/redis.yaml',k:'FILE 5/5',h:`
<p>마지막 파일 — 실시간 협업 메시지를 중계하는 Redis입니다. 데이터를 영구 보관할 필요가 없어 가장 단순합니다.</p>
<span class="codeLabel">templates/redis.yaml</span>
<pre class="code">apiVersion: v1
kind: Service
metadata:
  name: penpot-redis
spec:
  selector:
    app: penpot-redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penpot-redis
  template:
    metadata:
      labels:
        app: penpot-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379</pre>
<p>파일 5개 완성! 이제 문법이 맞는지 로컬에서 검증합니다.</p>`},

]});

<div class="step"><div class="no">2</div><div class="tx"><b>SYNCHRONIZE 클릭</b>ArgoCD가 Git을 읽어 → 차트 렌더링 → 클러스터에 적용 시작</div></div>
<div class="step"><div class="no">3</div><div class="tx"><b>기다리기 (5~10분)</b>이미지 수백 MB를 받느라 Progressing이 한동안 이어집니다. 실패 아니니 조급해하지 마세요 ☕</div></div>`},
{t:'(선택) 클릭 대신 YAML로 — 선언형 등록',k:'DECLARATIVE',h:`
<p>방금 클릭으로 만든 Application은 사실 이 YAML 한 장과 같습니다. 팀 표준화나 재생성 대비로 저장소에 같이 넣어 두면 좋습니다 (예: <span class="reg">argocd/penpot-app.yaml</span> — 배포 대상은 아니므로 별도 폴더에).</p>
<span class="codeLabel">argocd/penpot-app.yaml (참고용)</span>
<pre class="code">apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: penpot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.chobocho.com/design-team/penpot-deploy.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: penpot
  syncPolicy:            # 자동 동기화까지 켠 버전 (CH7 참고)
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true</pre>
<p>적용 권한이 있다면 <span class="reg">kubectl apply -f argocd/penpot-app.yaml</span> 한 줄로 UI 클릭 전 과정을 대체할 수 있습니다.</p>`},

{t:'브라우저 접속 — 첫 로그인',k:'FIRST LOGIN',h:`
<p>모두 초록이면 브라우저에서 <b>https://penpot.chobocho.com</b> 접속!</p>
<div class="step"><div class="no">1</div><div class="tx"><b>Penpot 로그인 화면 확인</b>보라색 Penpot 로그인 페이지가 뜨면 성공입니다 🎉</div></div>
<div class="step"><div class="no">2</div><div class="tx"><b>계정 만들기</b>Create an account → 이름·사내 이메일·비밀번호 입력. <span class="reg">disable-email-verification</span> 플래그 덕에 메일 인증 없이 바로 가입됩니다.</div></div>

{t:'운영 = git push — 업그레이드 해 보기',k:'DAY-2 OPS',h:`
<p>운영의 감을 잡는 가장 좋은 예제: <b>Penpot 버전 업그레이드</b>. 서버에 접속하지 않습니다. 파일만 고칩니다.</p>
<pre class="code"># ① Chart.yaml에서 의존 버전을 올린다 (예: 1.5.0 → 1.6.0이 나왔을 때)
#      version: 1.6.0  으로 수정하고

# ② 새 차트 파일을 받아 갈아끼운다
helm repo update
helm dependency build      # charts/penpot-1.6.0.tgz 생성

# ③ 커밋 & push
git add . &amp;&amp; git commit -m "Penpot 차트 1.6.0으로 업그레이드"
git push origin main</pre>
<p>push하면 ArgoCD가 (최대 3분 안에) <span class="reg">OutOfSync</span>를 표시합니다. <b>SYNC 버튼</b>을 누르면 새 버전으로 교체 배포 — 이게 업그레이드의 전부입니다.</p>
${IMG(A+'sync-apps.png','OutOfSync 상태의 앱 — SYNC를 눌러 반영한다 (공식 문서)','https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/')}`},
{t:'자동 동기화 켜기 — 손도 떼기',k:'AUTO-SYNC',h:`
<p>수동 Sync에 익숙해졌다면, 이제 버튼 클릭마저 없애 봅시다. Application 상세 → 상단 <b>DETAILS → SYNC POLICY</b>에서:</p>
<div class="tblWrap"><table class="tbl">
<tr><th>옵션</th><th>효과</th><th>권장</th></tr>
<tr><td><b>AUTOMATED</b></td><td>Git 변경 감지 시 자동 Sync</td><td>✅ 켜기</td></tr>
<tr><td><b>PRUNE</b></td><td>Git에서 지운 리소스를 클러스터에서도 삭제</td><td>✅ 켜기</td></tr>
<tr><td><b>SELF HEAL</b></td><td>누가 kubectl로 직접 고치면 Git 내용으로 되돌림</td><td>✅ 켜기</td></tr>
</table></div>
<p>세 개를 켜면 <em>"클러스터 상태 = Git 내용"</em>이 항상 강제됩니다. 이때부터 배포 이력은 곧 Git 커밋 로그입니다.</p>
<div class="note blue">뒤집어 말하면 — 이제 <b>kubectl로 직접 고치는 건 금지</b>입니다. 고쳐도 SELF HEAL이 3분 안에 되돌려 버립니다. 모든 변경은 Git으로!</div>`},
{t:'롤백 — 실수해도 괜찮은 이유',k:'ROLLBACK',h:`
<p>새 설정을 배포했더니 뭔가 이상하다? GitOps에선 <em>되돌리기도 Git</em>으로 합니다.</p>
<span class="codeLabel">방법 1 — git revert (정석, 이력이 남음)</span>
<pre class="code">git revert HEAD          # 마지막 커밋을 뒤집는 새 커밋 생성
git push origin main
# 자동 동기화가 켜져 있으면 → 알아서 이전 상태로 복귀</pre>
<span class="codeLabel">방법 2 — ArgoCD UI (긴급 시)</span>
<pre class="code">Application 상세 → HISTORY AND ROLLBACK
→ 정상이었던 배포 시점 선택 → Rollback</pre>
<div class="note org">UI 롤백은 자동 동기화(AUTOMATED)를 잠시 꺼야 실행됩니다 (Git이 여전히 새 버전이라 다시 덮어쓰므로). 급한 불을 UI로 끄고, 바로 git revert로 Git도 맞춰 두는 게 안전한 순서입니다.</div>`},
{t:'빨간불 ① — Pod가 안 뜰 때',k:'TROUBLE 1/3',h:`
<p>Degraded가 떴다면 트리 뷰에서 문제의 Pod를 찾고 STATUS를 봅니다. 가장 흔한 두 가지:</p>
<div class="tblWrap"><table class="tbl">
<tr><th>증상</th><th>원인</th><th>해결</th></tr>
<tr><td><b>ImagePullBackOff</b><br>ErrImagePull</td><td>사내망에서 Docker Hub 접근 차단 — penpotapp/, postgres 이미지를 못 받음</td><td>사내 미러 레지스트리 경유로 이미지 주소 변경 (아래)</td></tr>
<tr><td><b>Pending</b><br>(PVC가 계속 Pending)</td><td>기본 StorageClass가 없어서 디스크를 못 받음</td><td>values.yaml과 postgres.yaml에 storageClass 명시 (아래)</td></tr>
</table></div>
<span class="codeLabel">values.yaml — 사내 미러 사용 예 (인프라팀에 미러 주소 문의)</span>
<pre class="code">penpot:
  backend:
    image:
      repository: mirror.chobocho.com/penpotapp/backend
  frontend:
    image:
      repository: mirror.chobocho.com/penpotapp/frontend
  exporter:
    image:
      repository: mirror.chobocho.com/penpotapp/exporter
  persistence:
    assets:
      storageClass: "ceph-block"   # kubectl get sc에서 본 이름</pre>
<p>postgres.yaml·redis.yaml의 <span class="reg">image:</span>도 같은 방식으로 미러 주소로 바꾸고, PVC에는 <span class="reg">storageClassName: ceph-block</span>을 추가합니다. 고치면? 당연히 <em>git push</em>.</p>`},
{t:'빨간불 ② — 로그 보는 법',k:'TROUBLE 2/3',h:`
<p>Pod는 떴는데 재시작을 반복(<b>CrashLoopBackOff</b>)하면 <em>로그</em>가 답을 알고 있습니다. ArgoCD UI에서 Pod 클릭 → <b>LOGS</b> 탭. 터미널이 편하면:</p>
<pre class="code"># backend 로그 (Penpot 문제의 90%는 여기서 발견됨)
kubectl logs -n penpot deploy/penpot-backend --tail=100

# 상태와 이벤트 자세히 보기
kubectl describe pod -n penpot -l app.kubernetes.io/name=penpot</pre>
<div class="tblWrap"><table class="tbl">
<tr><th>로그에 이런 말이 보이면</th><th>확인할 것</th></tr>
<tr><td>connection refused ... 5432</td><td>postgres Pod가 Running인지, Service 이름·비밀번호가 values.yaml과 일치하는지</td></tr>
<tr><td>authentication failed for user</td><td>values.yaml의 password ↔ postgres.yaml의 POSTGRES_PASSWORD 불일치</td></tr>
<tr><td>Ingress는 정상인데 404/502</td><td>publicUri와 hosts가 같은 도메인인지, frontend Pod가 Healthy인지</td></tr>
</table></div>
${IMG(A+'terminal.png','ArgoCD UI에서는 Pod 터미널도 열 수 있다 — kubectl 없이 컨테이너 내부 확인 (공식 문서)','https://argo-cd.readthedocs.io/en/stable/operator-manual/web_based_terminal/')}`},
{t:'빨간불 ③ — Sync가 이상할 때',k:'TROUBLE 3/3',h:`
<div class="tblWrap"><table class="tbl">
<tr><th>증상</th><th>원인 · 해결</th></tr>
<tr><td>Sync 시 <b>ComparisonError</b></td><td>차트 렌더링 실패 — 내 PC에서 helm template으로 재현해 values.yaml 들여쓰기 수정</td></tr>
<tr><td><b>OutOfSync가 계속 반복</b></td><td>누군가 kubectl로 직접 수정 중이거나, 다른 컨트롤러와 충돌 — SELF HEAL을 켜고 원인 리소스의 DIFF 탭 확인</td></tr>
<tr><td>Sync는 성공, <b>변화가 없음</b></td><td>charts/*.tgz를 커밋 안 했거나 push를 잊음 — git status와 사내 Git 웹에서 파일 확인</td></tr>
<tr><td><b>Unknown</b> 상태</td><td>저장소 연결 끊김 — PAT 만료가 단골. Settings → Repositories에서 재연결</td></tr>
</table></div>
<div class="note blue"><b>디버깅 황금 순서:</b> ① Application의 빨간 리소스 클릭 → ② EVENTS 탭 → ③ LOGS 탭 → ④ 그래도 모르면 에러 문구 그대로 검색 or 인프라팀 문의. 대부분 ②에서 끝납니다.</div>`},
{t:'일상 운영 치트시트',k:'CHEAT SHEET',h:`

</table></div>`},

<script>
/* ═════════ 슬라이드 엔진 ═════════ */
const SLIDES=[];
CHAPTERS.forEach(function(ch,ci){
  SLIDES.push({ch:ci,cover:true});
  ch.slides.forEach(function(s){SLIDES.push({ch:ci,cover:false,t:s.t,k:s.k||'',h:s.h});});
});
const N=SLIDES.length;
let cur=0;
const stage=document.getElementById('stage'),barFill=document.getElementById('barFill'),
      cnt=document.getElementById('cnt'),chapLabel=document.getElementById('chapLabel'),
      dotsEl=document.getElementById('dots');

function strip(s){return s.replace(/<[^>]+>/g,'');}

/* 코드 하이라이터(간이) + 복사 버튼 */
function decorate(root){
  root.querySelectorAll('pre.code').forEach(function(p){
    if(p.dataset.done)return; p.dataset.done='1';
    let t=p.innerHTML, hold=[];
    function keep(m){hold.push(m);return '@@H'+(hold.length-1)+'@@';}
    t=t.replace(/(^|\n)(#[^\n]*)/g,function(_,a,m){return a+keep('<span class="c">'+m+'</span>');});
    t=t.replace(/("[^"\n]*")/g,function(m){return keep('<span class="s">'+m+'</span>');});
    t=t.replace(/\b(\d+(?:\.\d+)*(?:Gi|Mi)?)\b/g,'<span class="n">$1</span>');
    t=t.replace(/\b(apiVersion|kind|metadata|spec|name|image|env|ports|containers|replicas|selector|template|dependencies|version|repository|helm|kubectl|git)\b(?=:|\s)/g,'<span class="k">$1</span>');
    t=t.replace(/@@H(\d+)@@/g,function(_,i){return hold[+i];});
    p.innerHTML=t;
    const txt=p.textContent;
    const b=document.createElement('button');
    b.className='cpy';b.type='button';b.textContent='복사';
    b.onclick=function(){
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){
        b.textContent='복사됨 ✓';b.classList.add('ok');
        setTimeout(function(){b.textContent='복사';b.classList.remove('ok');},1600);
      }).catch(function(){
        const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
        ta.select();try{document.execCommand('copy');b.textContent='복사됨 ✓';}catch(e){}
        document.body.removeChild(ta);
        setTimeout(function(){b.textContent='복사';},1600);
      });
    };
    p.appendChild(b);
  });
}

function render(dir){
  const s=SLIDES[cur],ch=CHAPTERS[s.ch];
  barFill.style.width=((cur+1)/N*100)+'%';
  cnt.textContent=(cur+1)+' / '+N;
  chapLabel.textContent='CH.'+(s.ch+1)+'  '+strip(ch.title);
  const el=document.createElement('div');
  el.className='slide'+(dir<0?' back':'');
  if(s.cover){
    el.innerHTML='<div class="cover"><div class="icon">'+ch.icon+'</div>'
      +'<div class="chNo">CHAPTER '+(s.ch+1)+' / '+CHAPTERS.length+'</div>'
      +'<h1>'+ch.title+'</h1><div class="desc">'+ch.desc+'</div>'
      +'<div class="mini">'+ch.slides.length+' SLIDES ─ → 키 또는 스와이프</div></div>';
  }else{
    el.innerHTML='<div class="kick">'+s.k+'</div><h1 class="st">'+s.t+'</h1>'
      +'<div class="body">'+s.h+'</div>';
  }
  stage.replaceChildren(el);
  decorate(el);
  Array.prototype.forEach.call(dotsEl.children,function(d,i){d.classList.toggle('on',i===s.ch);});
  try{history.replaceState(null,'','#s'+(cur+1));}catch(e){}
}
function go(n,dir){
  n=Math.max(0,Math.min(N-1,n));
  if(n===cur&&stage.children.length)return;
  const d=(dir!==undefined)?dir:(n>=cur?1:-1);
  cur=n; render(d);
}
document.getElementById('btnPrev').onclick=function(){go(cur-1,-1);};
document.getElementById('btnNext').onclick=function(){go(cur+1,1);};

/* 챕터 점 */
CHAPTERS.forEach(function(ch,ci){
  const b=document.createElement('button');b.className='d';b.title=strip(ch.title);
  b.onclick=function(){go(SLIDES.findIndex(function(s){return s.ch===ci;}),1);};
  dotsEl.appendChild(b);
});

/* 목차 */
const toc=document.getElementById('toc'),tocList=document.getElementById('tocList');
CHAPTERS.forEach(function(ch,ci){
  const start=SLIDES.findIndex(function(s){return s.ch===ci;});
  const b=document.createElement('button');b.className='item';
  b.innerHTML='<span>'+ch.icon+'</span><span class="no">'+String(start+1).padStart(2,'0')+'</span><span>'+ch.title+'</span>';
  b.onclick=function(){toc.hidden=true;go(start,1);};
  tocList.appendChild(b);
});
document.getElementById('btnToc').onclick=function(){toc.hidden=false;};
document.getElementById('tocClose').onclick=function(){toc.hidden=true;};
toc.addEventListener('click',function(e){if(e.target===toc)toc.hidden=true;});

/* 키보드 */
window.addEventListener('keydown',function(e){
  if(!toc.hidden){if(e.key==='Escape')toc.hidden=true;return;}
  const tg=e.target.tagName;
  if(tg==='INPUT'||tg==='BUTTON'||tg==='TEXTAREA')return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1,1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1,-1);}
  else if(e.key==='Home'){go(0,-1);}
  else if(e.key==='End'){go(N-1,1);}
});
/* 스와이프 */
let tx0=0,ty0=0;
stage.addEventListener('touchstart',function(e){tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',function(e){
  const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){if(dx<0)go(cur+1,1);else go(cur-1,-1);}
},{passive:true});

/* 시작 */
(function(){
  const m=location.hash.match(/^#s(\d+)$/);
  cur=m?Math.min(N-1,Math.max(0,parseInt(m[1],10)-1)):0;
  render(1);
})();
</script>
<!-- ===== deck-input-shim v1 : 방향키(↑↓ 스크롤 / ←→ 페이지) + 게임패드 ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckInputShim) return;
  window.__deckInputShim = true;

  /* ---------- 지금 보이는 슬라이드의 스크롤 컨테이너 찾기 ---------- */
  function scrollableAt(x, y) {
    if (!document.elementFromPoint) return null;
    var n = document.elementFromPoint(x, y);
    while (n && n !== document.documentElement) {
      var oy = getComputedStyle(n).overflowY;
      if ((oy === 'auto' || oy === 'scroll' || oy === 'overlay') &&
          n.scrollHeight - n.clientHeight > 4) return n;
      n = n.parentElement;
    }
    return null;
  }
  function scroller() {
    var el = scrollableAt(innerWidth / 2, innerHeight / 2) ||
             scrollableAt(innerWidth / 2, innerHeight * 0.35);
    if (el) return el;
    var m = document.querySelector('main');
    if (m && m.scrollHeight - m.clientHeight > 4) return m;
    return document.scrollingElement || document.documentElement;
  }
  function viewH(el) {
    return (el === document.scrollingElement || el === document.documentElement)
      ? innerHeight : el.clientHeight;
  }
  function isPageScroller(el) {
    return el === document.scrollingElement || el === document.documentElement || el === document.body;
  }
  function scrollStep(dir, smooth) {
    var el = scroller();
    el.scrollBy({ top: dir * Math.max(80, viewH(el) * 0.25),
                  left: 0, behavior: smooth ? 'smooth' : 'auto' });
  }

  /* ---------- 페이지 이동 (덱마다 다른 엔진에 공통으로 붙는다) ---------- */
  function pick(ids) {
    for (var i = 0; i < ids.length; i++) {
      var e = document.getElementById(ids[i]);
      if (e && (e.tagName === 'BUTTON' || e.tagName === 'A')) return e;
    }
    return null;
  }
  function synth(key) {
    document.dispatchEvent(new KeyboardEvent('keydown',
      { key: key, code: key, bubbles: true, cancelable: true }));
  }
  function page(dir) {
    var b = dir > 0 ? pick(['nextBtn', 'btnNext', 'next'])
                    : pick(['prevBtn', 'btnPrev', 'prev']);
    if (b) { if (!b.disabled) b.click(); }
    else synth(dir > 0 ? 'ArrowRight' : 'ArrowLeft');
  }
  function toggleToc() {
    var b = pick(['tocBtn', 'btnToc', 'toc-btn', 'tocOpen']);
    if (b) b.click(); else synth('t');
  }

  /* ---------- 키보드: ↑↓ = 스크롤 (←→ 페이지는 각 덱 엔진이 처리) ---------- */
  function interactive(el) {
    if (!el) return false;
    var t = (el.tagName || '').toUpperCase();
    return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' ||
           t === 'CANVAS' || el.isContentEditable === true;
  }
  addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    if (e.defaultPrevented || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
    if (interactive(e.target) || interactive(document.activeElement)) return;
    var dir = e.key === 'ArrowDown' ? 1 : -1, repeat = e.repeat;
    // 이벤트 전파가 끝난 뒤에 판단한다 — 슬라이드 안의 데모(테트리스 등)가
    // 이 키를 가져갔으면(preventDefault) 스크롤하지 않는다.
    setTimeout(function () {
      if (e.defaultPrevented) return;
      // 문서 자체가 스크롤되는 덱은 브라우저 기본 동작에 맡긴다(이중 스크롤 방지).
      if (isPageScroller(scroller())) return;
      scrollStep(dir, !repeat);
    }, 0);
  });

  /* ---------- 게임패드 (조이패드) ----------
     좌스틱/D-pad 상하 = 스크롤, 좌우 = 이전/다음 페이지
     A·RB·RT = 다음, B·LB·LT = 이전, X·Start = 목차, Back = 첫 장     */
  var DEAD = 0.4, REPEAT = 320, held = {}, lastTurn = 0, lastDir = 0, raf = 0;

  function pads() {
    if (!navigator.getGamepads) return [];
    var out = [], g = navigator.getGamepads();
    for (var i = 0; i < g.length; i++) if (g[i]) out.push(g[i]);
    return out;
  }
  function down(g, i) { var b = g.buttons[i]; return !!b && (b.pressed || b.value > 0.5); }
  function edge(name, isDown, fn) {
    if (isDown) { if (!held[name]) { held[name] = 1; fn(); } }
    else held[name] = 0;
  }

  function poll(now) {
    var list = pads();
    if (!list.length) { raf = 0; return; }
    raf = requestAnimationFrame(poll);

    var ax = 0, ay = 0, bNext = false, bPrev = false, bToc = false, bHome = false;
    for (var k = 0; k < list.length; k++) {
      var g = list[k];
      ax += g.axes[0] || 0;
      ay += g.axes[1] || 0;
      if (down(g, 15)) ax += 1;
      if (down(g, 14)) ax -= 1;
      if (down(g, 13)) ay += 1;
      if (down(g, 12)) ay -= 1;
      bNext = bNext || down(g, 0) || down(g, 5) || down(g, 7);
      bPrev = bPrev || down(g, 1) || down(g, 4) || down(g, 6);
      bToc  = bToc  || down(g, 2) || down(g, 9);
      bHome = bHome || down(g, 8);
    }

    if (Math.abs(ay) > DEAD) {                       // 세로: 부드러운 연속 스크롤
      var mag = Math.min(1, (Math.abs(ay) - DEAD) / (1 - DEAD));
      scroller().scrollBy(0, (ay > 0 ? 1 : -1) * (6 + mag * 22));
    }
    var dir = Math.abs(ax) > DEAD ? (ax > 0 ? 1 : -1) : 0;
    if (dir) {                                       // 가로: 페이지 넘김(리핏 간격)
      if (dir !== lastDir || now - lastTurn > REPEAT) {
        lastDir = dir; lastTurn = now; page(dir);
      }
    } else { lastDir = 0; lastTurn = 0; }

    edge('next', bNext, function () { page(1); });
    edge('prev', bPrev, function () { page(-1); });
    edge('toc',  bToc,  toggleToc);
    edge('home', bHome, function () { synth('Home'); });
  }

  function start() { if (!raf) raf = requestAnimationFrame(poll); }
  addEventListener('gamepadconnected', start);
  addEventListener('focus', function () { if (pads().length) start(); });
  if (pads().length) start();
})();
</script>
<!-- ===== deck-bookmark-shim v2 : IndexedDB 책갈피(읽던 위치 자동 저장 + 이어보기) ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckBookmarkShim) return;
  window.__deckBookmarkShim = true;
  if (!window.indexedDB) return;

  var DB_NAME = 'treasure-house', DB_VER = 1, STORE = 'bookmarks';

  var FILE = location.pathname.split('/').pop() || '';
  try { FILE = decodeURIComponent(FILE); } catch (e) {}
  if (!FILE || /^index\.html?$/i.test(FILE)) return;   // 포털(index.html)은 저장하지 않는다

  /* ---------- IndexedDB 래퍼 ----------
     · 실패한 연결은 캐시하지 않는다 — blocked처럼 일시적인 실패 뒤에 다시 시도한다
     · 버전 변경·저장공간 회수·사이트 데이터 삭제로 연결이 끊기면 버리고 다시 연다
     · 계속 막히는 환경(file://·시크릿·사이트 데이터 차단)이면 3번 만에 단념하고,
       첫 실패 한 번만 콘솔에 남긴다 — 화면에는 아무것도 띄우지 않는다              */
  var dbp = null, conn = null, fails = 0, warned = false, deadp = null;

  function warn(e) {
    if (warned) return;
    warned = true;
    try { console.warn('[bookmark] 책갈피를 건너뜁니다 — IndexedDB 사용 불가:', e); } catch (x) {}
  }
  function drop(c) { if (conn === c) { dbp = null; conn = null; } }
  function dead() {
    if (!deadp) {
      deadp = Promise.reject(new Error('bookmark: IndexedDB unavailable'));
      deadp.catch(function () {});             // 미처리 거부 경고 방지
    }
    return deadp;
  }
  function db() {
    if (fails >= 3) return dead();
    if (dbp) return dbp;
    var p = dbp = new Promise(function (res, rej) {
      var req;
      try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { rej(e); return; }
      req.onupgradeneeded = function () {
        var d = req.result;
        if (!d.objectStoreNames.contains(STORE))
          d.createObjectStore(STORE, { keyPath: 'id' }).createIndex('updated', 'updated');
      };
      req.onsuccess = function () {
        var d = req.result;
        conn = d; fails = 0;
        d.onversionchange = function () { drop(d); try { d.close(); } catch (x) {} };
        d.onclose         = function () { drop(d); };
        res(d);
      };
      req.onerror   = function () { rej(req.error || new Error('open error')); };
      req.onblocked = function () { rej(new Error('open blocked')); };
    });
    p.catch(function (e) {
      fails++;
      if (dbp === p) { dbp = null; conn = null; }
      warn(e);
    });
    return p;
  }
  function tx(mode, fn) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var t, r;
        // 닫힌 연결이면 여기서 InvalidStateError가 난다 — 버리고 다음 호출에서 다시 연다
        try { t = d.transaction(STORE, mode); r = fn(t.objectStore(STORE)); }
        catch (e) { drop(d); rej(e); return; }
        t.oncomplete = function () { res(r ? r.result : undefined); };
        t.onerror    = function () { rej(t.error || new Error('tx ' + mode + ' error')); };
        t.onabort    = function () { rej(t.error || new Error('tx ' + mode + ' aborted')); };
      });
    }).catch(function (e) { warn(e); throw e; });
  }
  function save(rec) { return tx('readwrite', function (os) { return os.put(rec); }); }
  function load(id)  { return tx('readonly',  function (os) { return os.get(id); }); }

  /* ---------- 지금 읽고 있는 위치 ---------- */
  var ACTIVE = ['on', 'active', 'current', 'shown', 'is-active'];

  function slides() {                          // 슬라이드 덱이면 슬라이드 목록, 아니면 null
    var sel = ['main > article', '.slide'];
    for (var i = 0; i < sel.length; i++) {
      var n = document.querySelectorAll(sel[i]);
      if (n.length > 1) return n;
    }
    return null;
  }
  function activeIndex(list) {                 // 활성 클래스 → URL 해시 순으로 판별
    for (var i = 0; i < list.length; i++) {
      var c = list[i].classList;
      for (var j = 0; j < ACTIVE.length; j++) if (c.contains(ACTIVE[j])) return i;
    }
    var id = location.hash.slice(1);
    try { id = decodeURIComponent(id); } catch (e) {}
    if (id) for (var k = 0; k < list.length; k++) if (list[k].id === id) return k;
    return -1;
  }
  function visibleIndex(list) {                // 전 슬라이드가 이어서 흐르는 덱용 보조 판별
    var best = -1, near = Infinity, h = window.innerHeight || 800;
    for (var i = 0; i < list.length; i++) {
      var r = list[i].getBoundingClientRect();
      if (r.bottom <= 0 || r.top >= h) continue;
      var d = Math.abs(r.top);
      if (d < near) { near = d; best = i; }
    }
    return best;
  }
  function heading() {                         // 긴 문서용 — 화면 상단을 지난 마지막 제목
    var hs = document.querySelectorAll('h1[id],h2[id],h3[id]'), out = '';
    for (var i = 0; i < hs.length; i++) {
      if (hs[i].getBoundingClientRect().top <= 90) out = '#' + hs[i].id; else break;
    }
    return out;
  }
  function snap() {
    var list = slides();
    if (list) {
      var i = activeIndex(list);
      if (i < 0) i = visibleIndex(list);
      if (i < 0) i = 0;
      var el = list[i];
      return { kind: 'slide', page: i + 1, total: list.length, scrollY: 0,
               hash: el.id ? '#' + el.id : '', ratio: (i + 1) / list.length };
    }
    var se = document.scrollingElement || document.documentElement;
    var max = Math.max(0, se.scrollHeight - se.clientHeight);
    var y = Math.round(se.scrollTop || window.pageYOffset || 0);
    return { kind: 'scroll', page: 0, total: 0, scrollY: y,
             hash: heading(), ratio: max ? Math.min(1, y / max) : 0 };
  }

  /* ---------- 자동 저장 ----------
     처음 상태는 기준선으로만 잡고 저장하지 않는다 — 첫 장으로 열자마자
     지난번 책갈피를 1쪽으로 덮어쓰지 않기 위해서다.                        */
  function sig(s) {
    return s.kind + ':' + s.page + ':' + (s.kind === 'scroll' ? Math.round(s.scrollY / 40) : 0);
  }
  var last = sig(snap());
  function tick(force) {
    if (document.hidden && !force) return;
    var s = snap(), cur = sig(s);
    if (cur === last) return;
    last = cur;
    s.id = FILE;
    s.title = (document.title || FILE).trim();
    s.updated = Date.now();
    // 저장이 실패하면 기준선을 풀어 다음 tick에서 다시 시도한다 — 연결이 끊겼다
    // 다시 붙는 동안 그 한 번의 위치가 통째로 사라지지 않도록.
    save(s).catch(function () { if (last === cur) last = ''; });
  }
  setInterval(tick, 1200);
  addEventListener('hashchange', function () { tick(); });
  addEventListener('visibilitychange', function () { if (document.hidden) tick(true); });
  addEventListener('pagehide', function () { tick(true); });

  /* ---------- 이어보기 ----------
     덱 엔진마다 이동 방식이 달라서 세 단계로 시도한다.
       ① 해시 지정 — hashchange를 듣는 엔진
       ② 다음/이전 버튼 클릭 또는 ←→ 키 — 해시를 안 듣는 한 장씩 엔진
       ③ scrollIntoView — 전 장이 이어서 흐르는 덱                        */
  function navBtn(dir) {
    var ids = dir > 0 ? ['nextBtn', 'btnNext', 'next'] : ['prevBtn', 'btnPrev', 'prev'];
    for (var i = 0; i < ids.length; i++) {
      var e = document.getElementById(ids[i]);
      if (e && (e.tagName === 'BUTTON' || e.tagName === 'A')) return e;
    }
    return null;
  }
  function turn(dir) {
    var b = navBtn(dir);
    if (b) { if (!b.disabled) b.click(); return; }
    var k = dir > 0 ? 'ArrowRight' : 'ArrowLeft';
    document.dispatchEvent(new KeyboardEvent('keydown',
      { key: k, code: k, bubbles: true, cancelable: true }));
  }
  function step(target) {                      // 목표 쪽까지 한 장씩 넘긴다
    var guard = 400;
    (function next() {
      var l = slides();
      if (!l || --guard <= 0) return;
      var i = activeIndex(l);
      if (i < 0 || i === target) return;
      turn(i < target ? 1 : -1);
      setTimeout(function () {
        var l2 = slides();
        if (!l2) return;
        if (activeIndex(l2) === i) return;     // 안 움직이는 엔진이면 포기
        next();
      }, 30);
    })();
  }
  function jump(rec) {
    if (rec.kind !== 'slide') {
      var se = document.scrollingElement || document.documentElement;
      var max = Math.max(0, se.scrollHeight - se.clientHeight);
      var y = rec.scrollY <= max ? rec.scrollY : Math.round(rec.ratio * max);
      window.scrollTo({ top: y, behavior: 'smooth' });
      return;
    }
    var list = slides();
    if (!list) return;
    var target = Math.min(list.length, Math.max(1, rec.page)) - 1;
    var el = (rec.hash && document.getElementById(rec.hash.slice(1))) || list[target];
    if (!el) return;
    var k = Array.prototype.indexOf.call(list, el);
    if (k >= 0) target = k;
    if (el.id && location.hash.slice(1) !== el.id) location.hash = '#' + el.id;
    setTimeout(function () {
      var l2 = slides();
      if (!l2) return;
      var i = activeIndex(l2);
      if (i === target) return;                // ① 해시로 이동 성공
      if (i >= 0) step(target);                // ② 한 장씩 넘기는 엔진
      else el.scrollIntoView({ block: 'start' });   // ③ 이어서 흐르는 덱
    }, 120);
  }
  function ago(t) {
    var d = Date.now() - t;
    if (d < 6e4)  return '방금 전';
    if (d < 36e5) return Math.floor(d / 6e4) + '분 전';
    if (d < 864e5) return Math.floor(d / 36e5) + '시간 전';
    if (d < 6048e5) return Math.floor(d / 864e5) + '일 전';
    return new Date(t).toLocaleDateString('ko-KR');
  }
  function bottomInset() {              // 화면 아래 고정 내비(◀ 1/67 ▶) 위로 띄우기
    var h = window.innerHeight || 800, gap = 14;
    if (!document.body) return gap;
    var list = [], c;
    for (c = document.body.firstElementChild; c; c = c.nextElementSibling) list.push(c);
    var extra = document.querySelectorAll('nav, footer');
    for (var i = 0; i < extra.length; i++) list.push(extra[i]);
    for (var j = 0; j < list.length; j++) {
      var n = list[j], t = n.tagName;
      if (t === 'SCRIPT' || t === 'STYLE' || t === 'LINK') continue;
      var cs = getComputedStyle(n);
      if (cs.position !== 'fixed' && cs.position !== 'sticky') continue;
      if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) === 0) continue;
      var r = n.getBoundingClientRect();
      if (!r.height || r.height > h * 0.5 || r.bottom < h - 4 || r.top > h) continue;
      gap = Math.max(gap, Math.round(h - r.top) + 10);
    }
    return gap;
  }
  function toast(rec) {
    var gap = bottomInset();
    var host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483000;pointer-events:none';
    var root = host.attachShadow ? host.attachShadow({ mode: 'open' }) : host;
    var where = rec.kind === 'slide'
      ? rec.page + ' / ' + rec.total + ' 쪽'
      : Math.round(rec.ratio * 100) + '% 지점';
    root.innerHTML =
      '<style>' +
      '.w{pointer-events:auto;display:flex;align-items:center;gap:10px;' +
      'margin:0 auto calc(' + gap + 'px + env(safe-area-inset-bottom,0px));' +
      'padding:10px 12px 10px 14px;max-width:min(94vw,460px);border-radius:14px;' +
      'background:rgba(18,28,40,.94);color:#eaf3fb;font:500 14px/1.4 -apple-system,BlinkMacSystemFont,' +
      '"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35);' +
      'animation:up .22s ease-out}' +
      '@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}' +
      '@media (prefers-reduced-motion:reduce){.w{animation:none}}' +
      '.t{flex:1;min-width:0}.t b{display:block;font-weight:700}' +
      '.t s{display:block;text-decoration:none;opacity:.72;font-size:12px;margin-top:2px}' +
      'button{font:inherit;border:0;border-radius:9px;padding:8px 12px;cursor:pointer}' +
      '.go{background:#4fc3f7;color:#06263a;font-weight:700}' +
      '.no{background:transparent;color:#9fb6c9;padding:8px 6px}' +
      '</style>' +
      '<div class="w"><span aria-hidden="true">🔖</span>' +
      '<div class="t"><b>지난번 ' + where + '까지 읽었어요</b><s>' + ago(rec.updated) + ' 저장됨</s></div>' +
      '<button class="go" type="button">이어보기</button>' +
      '<button class="no" type="button" aria-label="닫기">✕</button></div>';
    function close() { if (host.parentNode) host.parentNode.removeChild(host); }
    root.querySelector('.go').onclick = function () { close(); jump(rec); };
    root.querySelector('.no').onclick = close;
    document.body.appendChild(host);
    setTimeout(close, 15000);
  }

  /* 딥링크로 열었으면 안내하지 않는다.
     이때 location.hash는 못 쓴다 — 덱 엔진 대부분이 첫 장을 그리면서
     history.replaceState('#top')로 주소를 먼저 바꿔 놓기 때문에, 이 셸이
     도는 시점에는 늘 해시가 있는 것처럼 보인다(v1이 안내를 못 띄우던 원인).
     그래서 <head>에서 미리 잡아둔 진입 해시를 쓰고, 없으면 내비게이션
     타이밍의 원래 주소를 본다. */
  function openedWithHash() {
    if (typeof window.__deckInitHash === 'string') return window.__deckInitHash.length > 1;
    try {
      var e = performance.getEntriesByType('navigation')[0];
      if (e && e.name) return new URL(e.name).hash.length > 1;
    } catch (x) {}
    return !!location.hash;
  }

  if (!openedWithHash()) {
    load(FILE).then(function (rec) {
      if (!rec) return;
      var worth = rec.kind === 'slide' ? rec.page > 1 : rec.scrollY > 200;
      if (worth) toast(rec);
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
