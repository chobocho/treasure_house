<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>수부타이 — 대장장이의 아들, 제국의 전략을 설계하다 (인터랙티브 슬라이드)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#131017; --bg1:#1c1722; --bg2:#26202e;
  --gold:#e8935a; --gold-soft:#f4c9a4; --red:#d9534f; --sky:#7ec4ef;
  --ink:#f4efe9; --ink-soft:#cfc4bb; --ink-dim:#93887f;
  --panel:rgba(255,255,255,.055); --panel-bd:rgba(232,147,90,.28);
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Noto Sans KR',sans-serif;color:var(--ink);overflow:hidden;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(232,147,90,.12), transparent 60%),
    radial-gradient(900px 500px at 10% 110%, rgba(126,196,239,.07), transparent 60%),
    linear-gradient(160deg,var(--bg0) 0%,var(--bg1) 55%,var(--bg2) 100%);
}
#app{height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}

/* ── 상단바 ─────────────────────────── */
#bar{height:5px;background:rgba(255,255,255,.08);flex:0 0 auto;}
#barFill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .25s;}
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:10px clamp(12px,2.5vw,28px);border-bottom:1px solid rgba(255,255,255,.07);}
header .logo{font-family:'Black Han Sans',sans-serif;font-size:clamp(15px,1.6vw,20px);color:var(--gold);
  white-space:nowrap;letter-spacing:.5px;}
header .chap{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink-soft);font-size:clamp(12px,1.3vw,15px);text-align:center;}
header .cnt{font-variant-numeric:tabular-nums;color:var(--ink-dim);font-size:clamp(12px,1.3vw,15px);white-space:nowrap;}

/* ── 슬라이드 무대 ───────────────────── */
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;justify-content:center;
  padding:clamp(10px,2vh,22px) clamp(10px,3vw,36px);}
.slide{width:min(1180px,100%);display:flex;flex-direction:column;min-height:0;
  animation:enter .34s ease both;}
.slide.back{animation:enterBack .34s ease both;}
@keyframes enter{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
@keyframes enterBack{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:none;}}
.kick{color:var(--gold);font-weight:700;font-size:clamp(12px,1.5vw,15px);letter-spacing:2.5px;margin-bottom:6px;}
h1.st{font-family:'Noto Serif KR',serif;font-weight:900;line-height:1.22;
  font-size:clamp(21px,3.4vw,40px);margin-bottom:clamp(10px,1.8vh,20px);}
h1.st .em{color:var(--gold);}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding-right:6px;scrollbar-width:thin;scrollbar-color:rgba(232,147,90,.4) transparent;
  font-size:clamp(15px,1.75vw,19.5px);line-height:1.78;color:var(--ink-soft);}
.body::-webkit-scrollbar{width:6px;}
.body::-webkit-scrollbar-thumb{background:rgba(232,147,90,.35);border-radius:3px;}
.body b,.body strong{color:var(--ink);}
.body em{color:var(--gold-soft);font-style:normal;font-weight:700;}
.body p{margin:0 0 12px;}
.body ul.b{list-style:none;margin:4px 0 14px;}
.body ul.b>li{padding:7px 0 7px 26px;position:relative;}
.body ul.b>li::before{content:'❖';position:absolute;left:2px;color:var(--gold);font-size:.8em;top:11px;}
.body ol{margin:4px 0 14px 24px;}
.body ol>li{padding:6px 0;}
.big{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(19px,2.6vw,30px);
  line-height:1.55;color:var(--ink);margin:1.2em 0;}
blockquote.q{border-left:4px solid var(--gold);background:var(--panel);border-radius:0 14px 14px 0;
  padding:16px 20px;margin:14px 0;font-family:'Noto Serif KR',serif;font-weight:600;
  font-size:clamp(15.5px,1.9vw,21px);line-height:1.7;color:var(--ink);}
blockquote.q .who{display:block;margin-top:10px;font-family:'Noto Sans KR',sans-serif;
  font-size:.72em;font-weight:500;color:var(--ink-dim);}
.note{font-size:.8em;color:var(--ink-dim);margin-top:10px;line-height:1.6;}
.note a{color:var(--sky);}

/* 카드 그리드 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px;margin:12px 0;}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:14px 16px;}
.card h3{color:var(--gold);font-size:clamp(14px,1.6vw,17px);margin-bottom:6px;}
.card .num{font-family:'Black Han Sans',sans-serif;font-size:clamp(22px,3vw,34px);color:var(--ink);display:block;}
.card p{font-size:.86em;line-height:1.6;margin:0;}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0;}
.duo .card h3{font-size:clamp(15px,1.7vw,18px);}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:12px 0;}
.vs .mid{align-self:center;font-family:'Black Han Sans',sans-serif;color:var(--red);font-size:clamp(16px,2vw,22px);}

/* 타임라인 */
.tl{margin:10px 0;}
.tl .row{display:grid;grid-template-columns:minmax(74px,auto) 1fr;gap:14px;padding:8px 0;
  border-bottom:1px dashed rgba(255,255,255,.10);}
.tl .yr{font-family:'Black Han Sans',sans-serif;color:var(--gold);white-space:nowrap;font-size:1.02em;}
.tl .tx{line-height:1.65;}

/* 표 */
.tbwrap{overflow-x:auto;margin:12px 0;border-radius:12px;border:1px solid rgba(255,255,255,.12);}
table.tb{border-collapse:collapse;width:100%;min-width:560px;font-size:.88em;}
table.tb th{background:rgba(232,147,90,.14);color:var(--gold-soft);padding:10px 12px;text-align:left;white-space:nowrap;}
table.tb td{padding:10px 12px;border-top:1px solid rgba(255,255,255,.08);vertical-align:top;line-height:1.6;}
table.tb tr td:first-child{color:var(--ink);font-weight:700;white-space:nowrap;}

/* 이미지 */
figure.ph{margin:12px 0;background:var(--panel);border:1px solid rgba(255,255,255,.10);
  border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;}
figure.ph .imgbox{border-radius:10px;overflow:hidden;background:#0d0a10;display:flex;justify-content:center;}
figure.ph img{max-width:100%;max-height:52dvh;object-fit:contain;display:block;}
figure.ph figcaption{font-size:.78em;color:var(--ink-dim);line-height:1.55;padding:0 4px;}
figure.ph figcaption a{color:var(--sky);text-decoration:none;}
figure.ph figcaption a:hover{text-decoration:underline;}
.imgfail{padding:22px;text-align:center;color:var(--ink-dim);font-size:.85em;width:100%;}
.imgfail a{color:var(--sky);}
.phduo{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.phduo figure.ph{margin:0;}
.phduo figure.ph img{max-height:40dvh;}

/* 링크 칩 */
.links{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;}
a.lk{display:inline-flex;align-items:center;gap:8px;background:rgba(126,196,239,.10);
  border:1px solid rgba(126,196,239,.35);color:var(--sky);border-radius:999px;
  padding:8px 16px;font-size:clamp(12.5px,1.4vw,15px);font-weight:500;text-decoration:none;
  transition:background .15s;max-width:100%;}
a.lk:hover{background:rgba(126,196,239,.22);}
a.lk .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.linklist{list-style:none;margin:8px 0;}
.linklist li{padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.10);line-height:1.6;}
.linklist a{color:var(--sky);font-weight:700;text-decoration:none;}
.linklist a:hover{text-decoration:underline;}
.linklist .d{display:block;font-size:.82em;color:var(--ink-dim);}

/* 챕터 표지 */
.cover{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;min-height:0;overflow-y:auto;}
.cover .icon{font-size:clamp(44px,8vw,84px);margin-bottom:14px;}
.cover .chnum{color:var(--gold);letter-spacing:5px;font-weight:700;font-size:clamp(13px,1.6vw,17px);margin-bottom:10px;}
.cover h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(26px,5vw,56px);line-height:1.3;}
.cover .sub{margin-top:16px;color:var(--ink-soft);font-size:clamp(14px,1.8vw,19px);line-height:1.8;max-width:760px;align-self:center;}

/* 퀴즈 */
.quiz{background:var(--panel);border:1px solid var(--panel-bd);border-radius:16px;padding:18px;margin:12px 0;}
.quiz .qq{font-weight:700;color:var(--ink);margin-bottom:12px;font-size:1.02em;}
.quiz .opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.06);color:var(--ink-soft);
  border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:11px 14px;margin:7px 0;
  font:inherit;font-size:.95em;cursor:pointer;transition:.15s;}
.quiz .opt:hover{border-color:var(--gold);}
.quiz .opt.ok{background:rgba(90,180,110,.22);border-color:#5ab46e;color:#d7f5df;}
.quiz .opt.no{background:rgba(217,83,79,.18);border-color:var(--red);color:#ffd9cc;}
.quiz .exp{display:none;margin-top:10px;font-size:.88em;color:var(--gold-soft);line-height:1.65;}
.quiz.done .exp{display:block;}

/* ── 하단바 ─────────────────────────── */
footer{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:10px clamp(12px,2.5vw,28px) 14px;border-top:1px solid rgba(255,255,255,.07);}
footer .hint{flex:1;color:var(--ink-dim);font-size:clamp(10.5px,1.2vw,13px);}
button.nv{font:inherit;cursor:pointer;border-radius:12px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.07);color:var(--ink);padding:10px 18px;
  font-size:clamp(13px,1.5vw,16px);font-weight:700;transition:.15s;min-width:52px;}
button.nv:hover{background:rgba(232,147,90,.18);border-color:var(--gold);}
button.nv.main{background:linear-gradient(135deg,var(--gold),#c26f35);color:#241203;border:none;padding:10px 26px;}
button.nv:disabled{opacity:.3;cursor:default;}

/* ── 목차 오버레이 ───────────────────── */
#toc{position:fixed;inset:0;background:rgba(14,11,17,.93);backdrop-filter:blur(8px);
  z-index:50;display:none;flex-direction:column;padding:4vh 5vw;}
#toc.on{display:flex;}
#toc h2{font-family:'Black Han Sans',sans-serif;color:var(--gold);font-size:clamp(20px,3vw,30px);margin-bottom:6px;}
#toc .close{position:absolute;top:18px;right:22px;background:none;border:none;color:var(--ink);
  font-size:30px;cursor:pointer;}
#tocList{flex:1;overflow-y:auto;margin-top:14px;display:grid;gap:10px;
  grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));align-content:start;}
.tocCh{background:var(--panel);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:14px 16px;
  cursor:pointer;transition:.15s;}
.tocCh:hover{border-color:var(--gold);}
.tocCh .n{color:var(--gold);font-size:12.5px;font-weight:700;letter-spacing:1px;}
.tocCh h3{font-size:16.5px;margin:4px 0 2px;color:var(--ink);}
.tocCh .c{font-size:12.5px;color:var(--ink-dim);}
.tocCh.cur{border-color:var(--gold);background:rgba(232,147,90,.10);}

/* ── 반응형: 폴드7 커버(세로 초슬림)·펼침(정방형)·모바일 ── */
@media (max-width:920px), (orientation:portrait){
  .duo,.vs,.phduo{grid-template-columns:1fr;}
  .vs .mid{justify-self:center;padding:2px 0;}
  footer .hint{display:none;}
}
@media (max-aspect-ratio:3/4){ figure.ph img{max-height:44dvh;} }
@media (max-width:480px){
  header .logo{font-size:13px;}
  button.nv{padding:9px 13px;}
  .body{font-size:14.5px;}
}
/* 폴드 펼침(거의 정사각 대화면): 무대 폭 넉넉히, 글자 과대 방지 */
@media (min-width:1500px) and (max-aspect-ratio:13/10){
  .slide{width:min(1280px,100%);}
}
</style>
</head>
<body>
<div id="app">
  <div id="bar"><div id="barFill"></div></div>
  <header>
    <div class="logo">⚔️ 수부타이 — 무쇠의 전략가</div>
    <div class="chap" id="hChap"></div>
    <div class="cnt" id="hCnt"></div>
  </header>
  <main id="stage"></main>
  <footer>
    <button class="nv" id="btnToc">☰ 목차</button>
    <div class="hint">← → 방향키 · 스페이스 · 화면 스와이프로 이동 | Home/End 처음·끝 | M 목차</div>
    <button class="nv" id="btnPrev">◀</button>
    <button class="nv main" id="btnNext">다음 ▶</button>
  </footer>
</div>

<div id="toc">
  <button class="close" id="btnTocClose">✕</button>
  <h2 id="tocTitle">목차</h2>
  <div id="tocList"></div>
</div>

<script>
'use strict';
/* ── 검증된 위키미디어 커먼즈 이미지 (2026-07-05 링크 40종 HTTP 200 확인) ── */

 battle1211:[W+'c/c0/Bataille_entre_mongols_%26_chinois_%281211%29.jpeg','Bataille entre mongols & chinois (1211).jpeg','1211년 몽골군과 금나라군의 전투 — 라시드 앗딘 「집사」 삽화 (14세기)'],

 expansion:[W+'thumb/d/df/Expansion_of_the_Mongol_Empire.svg/1920px-Expansion_of_the_Mongol_Empire.svg.png','Expansion of the Mongol Empire.svg','몽골 제국의 단계별 팽창 지도'],
 soldiers:[W+'5/54/Mongol_soldiers_by_Rashid_al-Din_1305.JPG','Mongol soldiers by Rashid al-Din 1305.JPG','몽골 병사들 — 라시드 앗딘 「집사」 삽화 (1305년경)'],

 paiza:[W+'c/c0/Paiza_Golden_Horde.jpg','Paiza Golden Horde.jpg','파이자(牌子) — 몽골 제국의 역참 통행증 (킵차크 한국 유물)'],

function fig(key,extra){
  const [url,file,cap]=IMG[key];
  const page=(C+encodeURIComponent(file.replace(/ /g,'_'))).replace(/'/g,'%27');
  return `<figure class="ph"><div class="imgbox"><img src="${url}" alt="${cap}" loading="lazy"
    onerror="this.parentNode.innerHTML='<div class=imgfail>이미지 로딩 실패 — <a href=&quot;${page}&quot; target=_blank rel=noopener>원본 페이지에서 보기 ↗</a></div>'"></div>
    <figcaption>🖼️ ${cap}${extra?' — '+extra:''} · <a href="${page}" target="_blank" rel="noopener">출처: Wikimedia Commons ↗</a></figcaption></figure>`;
}
function fig2(k1,k2){const a=fig(k1),b=fig(k2);return `<div class="phduo">${a}${b}</div>`;}
function lk(href,label){return `<a class="lk" href="${href}" target="_blank" rel="noopener"><span>🔗</span><span class="t">${label}</span></a>`;}
const wk=t=>'https://ko.wikipedia.org/wiki/'+encodeURIComponent(t);
const we=t=>'https://en.wikipedia.org/wiki/'+encodeURIComponent(t);
function quiz(q,opts,okIdx,exp){
  const bs=opts.map((o,i)=>`<button class="opt" data-ok="${i===okIdx?1:0}" onclick="answer(this)">${'①②③④'[i]} ${o}</button>`).join('');
  return `<div class="quiz"><div class="qq">Q. ${q}</div>${bs}<div class="exp">💡 ${exp}</div></div>`;
}
function answer(btn){
  const box=btn.closest('.quiz'); if(box.classList.contains('done'))return;
  box.classList.add('done');
  box.querySelectorAll('.opt').forEach(b=>{ if(b.dataset.ok==='1')b.classList.add('ok'); });
  if(btn.dataset.ok!=='1')btn.classList.add('no');
}

<p class="note">환경설의 대표 연구: Büntgen &amp; Di Cosmo (2016), 나이테 기후 분석. ${lk('https://www.nature.com/articles/srep25606','Nature Scientific Reports 논문 ↗')}</p>`},

const SLIDES=[];
CHAPTERS.forEach((ch,ci)=>{
  SLIDES.push({ch:ci,cover:true,t:ch.title,h:''});
  ch.slides.forEach(s=>SLIDES.push({ch:ci,cover:false,t:s.t,k:s.k||'',h:s.h}));
});
const N=SLIDES.length;
let cur=0,dir=1;
const stage=document.getElementById('stage'),hChap=document.getElementById('hChap'),
      hCnt=document.getElementById('hCnt'),barFill=document.getElementById('barFill');

function render(){
  const s=SLIDES[cur],ch=CHAPTERS[s.ch];
  let html;
  if(s.cover){
    const cnt=ch.slides.length;
    html=`<div class="slide${dir<0?' back':''}"><div class="cover">
      <div class="icon">${ch.icon}</div>
      <div class="chnum">CHAPTER ${String(s.ch).padStart(2,'0')} · ${cnt}장</div>
      <h1>${ch.title}</h1>
      <div class="sub">${ch.sub||''}</div></div></div>`;
  }else{
    html=`<div class="slide${dir<0?' back':''}">
      ${s.k?`<div class="kick">${s.k}</div>`:''}
      <h1 class="st">${s.t}</h1>
      <div class="body">${s.h}</div></div>`;
  }
  stage.innerHTML=html;
  hChap.textContent=`${s.ch}. ${ch.title}`;
  hCnt.textContent=`${cur+1} / ${N}`;
  barFill.style.width=((cur+1)/N*100)+'%';
  document.getElementById('btnPrev').disabled=cur===0;
  document.getElementById('btnNext').disabled=cur===N-1;
  if(location.hash!=='#'+(cur+1))history.replaceState(null,'','#'+(cur+1));
  // 다음 슬라이드 이미지 프리로드
  const nx=SLIDES[cur+1];
  if(nx){const m=nx.h&&nx.h.match(/img src="([^"]+)"/g);
    if(m)m.slice(0,2).forEach(x=>{const u=x.slice(9,-1);const im=new Image();im.src=u;});}
}
function go(i,d){ if(i<0||i>=N)return; dir=d||(i>cur?1:-1); cur=i; render(); }
function next(){go(cur+1,1);} function prev(){go(cur-1,-1);}

document.getElementById('btnNext').onclick=next;
document.getElementById('btnPrev').onclick=prev;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(N-1);}
  else if(e.key==='m'||e.key==='M'){toggleToc();}
  else if(e.key==='Escape'){document.getElementById('toc').classList.remove('on');}
});
let tx=null,ty=null;
stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){dx<0?next():prev();}
  tx=ty=null;
},{passive:true});

/* 목차 */
const toc=document.getElementById('toc'),tocList=document.getElementById('tocList');
function buildToc(){
  document.getElementById('tocTitle').textContent=`목차 — ${CHAPTERS.length}개 장 · 전체 ${N}장`;
  tocList.innerHTML=CHAPTERS.map((ch,ci)=>{
    const start=SLIDES.findIndex(s=>s.ch===ci);
    return `<div class="tocCh" data-i="${start}"><div class="n">CHAPTER ${String(ci).padStart(2,'0')}</div>
      <h3>${ch.icon} ${ch.title}</h3><div class="c">${ch.slides.length+1}장 · ${start+1}p부터</div></div>`;
  }).join('');
  tocList.querySelectorAll('.tocCh').forEach(el=>el.onclick=()=>{
    toc.classList.remove('on'); go(+el.dataset.i);
  });
}
function toggleToc(){
  toc.classList.toggle('on');
  const curCh=SLIDES[cur].ch;
  tocList.querySelectorAll('.tocCh').forEach((el,i)=>el.classList.toggle('cur',i===curCh));
}
document.getElementById('btnToc').onclick=toggleToc;
document.getElementById('btnTocClose').onclick=toggleToc;

buildToc();
const h=parseInt(location.hash.slice(1),10);
if(h>=1&&h<=N)cur=h-1;
render();
</script>
<!-- ===== deck-input-shim v1 : 방향키(↑↓ 스크롤 / ←→ 페이지) + 게임패드 ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckInputShim) return;
  window.__deckInputShim = true;

  /* ---------- 지금 보이는 슬라이드의 스크롤 컨테이너 찾기 ---------- */
  function scrollableAt(x, y) {
    if (!document.elementFromPoint) return null;
    var n = document.elementFromPoint(x, y);
    while (n && n !== document.documentElement) {
      var oy = getComputedStyle(n).overflowY;
      if ((oy === 'auto' || oy === 'scroll' || oy === 'overlay') &&
          n.scrollHeight - n.clientHeight > 4) return n;
      n = n.parentElement;
    }
    return null;
  }
  function scroller() {
    var el = scrollableAt(innerWidth / 2, innerHeight / 2) ||
             scrollableAt(innerWidth / 2, innerHeight * 0.35);
    if (el) return el;
    var m = document.querySelector('main');
    if (m && m.scrollHeight - m.clientHeight > 4) return m;
    return document.scrollingElement || document.documentElement;
  }
  function viewH(el) {
    return (el === document.scrollingElement || el === document.documentElement)
      ? innerHeight : el.clientHeight;
  }
  function isPageScroller(el) {
    return el === document.scrollingElement || el === document.documentElement || el === document.body;
  }
  function scrollStep(dir, smooth) {
    var el = scroller();
    el.scrollBy({ top: dir * Math.max(80, viewH(el) * 0.25),
                  left: 0, behavior: smooth ? 'smooth' : 'auto' });
  }

  /* ---------- 페이지 이동 (덱마다 다른 엔진에 공통으로 붙는다) ---------- */
  function pick(ids) {
    for (var i = 0; i < ids.length; i++) {
      var e = document.getElementById(ids[i]);
      if (e && (e.tagName === 'BUTTON' || e.tagName === 'A')) return e;
    }
    return null;
  }
  function synth(key) {
    document.dispatchEvent(new KeyboardEvent('keydown',
      { key: key, code: key, bubbles: true, cancelable: true }));
  }
  function page(dir) {
    var b = dir > 0 ? pick(['nextBtn', 'btnNext', 'next'])
                    : pick(['prevBtn', 'btnPrev', 'prev']);
    if (b) { if (!b.disabled) b.click(); }
    else synth(dir > 0 ? 'ArrowRight' : 'ArrowLeft');
  }
  function toggleToc() {
    var b = pick(['tocBtn', 'btnToc', 'toc-btn', 'tocOpen']);
    if (b) b.click(); else synth('t');
  }

  /* ---------- 키보드: ↑↓ = 스크롤 (←→ 페이지는 각 덱 엔진이 처리) ---------- */
  function interactive(el) {
    if (!el) return false;
    var t = (el.tagName || '').toUpperCase();
    return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' ||
           t === 'CANVAS' || el.isContentEditable === true;
  }
  addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    if (e.defaultPrevented || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
    if (interactive(e.target) || interactive(document.activeElement)) return;
    var dir = e.key === 'ArrowDown' ? 1 : -1, repeat = e.repeat;
    // 이벤트 전파가 끝난 뒤에 판단한다 — 슬라이드 안의 데모(테트리스 등)가
    // 이 키를 가져갔으면(preventDefault) 스크롤하지 않는다.
    setTimeout(function () {
      if (e.defaultPrevented) return;
      // 문서 자체가 스크롤되는 덱은 브라우저 기본 동작에 맡긴다(이중 스크롤 방지).
      if (isPageScroller(scroller())) return;
      scrollStep(dir, !repeat);
    }, 0);
  });

  /* ---------- 게임패드 (조이패드) ----------
     좌스틱/D-pad 상하 = 스크롤, 좌우 = 이전/다음 페이지
     A·RB·RT = 다음, B·LB·LT = 이전, X·Start = 목차, Back = 첫 장     */
  var DEAD = 0.4, REPEAT = 320, held = {}, lastTurn = 0, lastDir = 0, raf = 0;

  function pads() {
    if (!navigator.getGamepads) return [];
    var out = [], g = navigator.getGamepads();
    for (var i = 0; i < g.length; i++) if (g[i]) out.push(g[i]);
    return out;
  }
  function down(g, i) { var b = g.buttons[i]; return !!b && (b.pressed || b.value > 0.5); }
  function edge(name, isDown, fn) {
    if (isDown) { if (!held[name]) { held[name] = 1; fn(); } }
    else held[name] = 0;
  }

  function poll(now) {
    var list = pads();
    if (!list.length) { raf = 0; return; }
    raf = requestAnimationFrame(poll);

    var ax = 0, ay = 0, bNext = false, bPrev = false, bToc = false, bHome = false;
    for (var k = 0; k < list.length; k++) {
      var g = list[k];
      ax += g.axes[0] || 0;
      ay += g.axes[1] || 0;
      if (down(g, 15)) ax += 1;
      if (down(g, 14)) ax -= 1;
      if (down(g, 13)) ay += 1;
      if (down(g, 12)) ay -= 1;
      bNext = bNext || down(g, 0) || down(g, 5) || down(g, 7);
      bPrev = bPrev || down(g, 1) || down(g, 4) || down(g, 6);
      bToc  = bToc  || down(g, 2) || down(g, 9);
      bHome = bHome || down(g, 8);
    }

    if (Math.abs(ay) > DEAD) {                       // 세로: 부드러운 연속 스크롤
      var mag = Math.min(1, (Math.abs(ay) - DEAD) / (1 - DEAD));
      scroller().scrollBy(0, (ay > 0 ? 1 : -1) * (6 + mag * 22));
    }
    var dir = Math.abs(ax) > DEAD ? (ax > 0 ? 1 : -1) : 0;
    if (dir) {                                       // 가로: 페이지 넘김(리핏 간격)
      if (dir !== lastDir || now - lastTurn > REPEAT) {
        lastDir = dir; lastTurn = now; page(dir);
      }
    } else { lastDir = 0; lastTurn = 0; }

    edge('next', bNext, function () { page(1); });
    edge('prev', bPrev, function () { page(-1); });
    edge('toc',  bToc,  toggleToc);
    edge('home', bHome, function () { synth('Home'); });
  }

  function start() { if (!raf) raf = requestAnimationFrame(poll); }
  addEventListener('gamepadconnected', start);
  addEventListener('focus', function () { if (pads().length) start(); });
  if (pads().length) start();
})();
</script>
<!-- ===== deck-bookmark-shim v1 : IndexedDB 책갈피(읽던 위치 자동 저장 + 이어보기) ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckBookmarkShim) return;
  window.__deckBookmarkShim = true;
  if (!window.indexedDB) return;

  var DB_NAME = 'treasure-house', DB_VER = 1, STORE = 'bookmarks';

  var FILE = location.pathname.split('/').pop() || '';
  try { FILE = decodeURIComponent(FILE); } catch (e) {}
  if (!FILE || /^index\.html?$/i.test(FILE)) return;   // 포털(index.html)은 저장하지 않는다

  /* ---------- IndexedDB 래퍼 ---------- */
  var dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {
      var req;
      try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { rej(e); return; }
      req.onupgradeneeded = function () {
        var d = req.result;
        if (!d.objectStoreNames.contains(STORE))
          d.createObjectStore(STORE, { keyPath: 'id' }).createIndex('updated', 'updated');
      };
      req.onsuccess = function () { res(req.result); };
      req.onerror   = function () { rej(req.error); };
      req.onblocked = function () { rej(new Error('blocked')); };
    });
    dbp.catch(function () {});                 // 미처리 거부 경고 방지
    return dbp;
  }
  function tx(mode, fn) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction(STORE, mode), r = fn(t.objectStore(STORE));
        t.oncomplete = function () { res(r ? r.result : undefined); };
        t.onerror    = function () { rej(t.error); };
        t.onabort    = function () { rej(t.error); };
      });
    });
  }
  function save(rec) { return tx('readwrite', function (os) { return os.put(rec); }); }
  function load(id)  { return tx('readonly',  function (os) { return os.get(id); }); }

  /* ---------- 지금 읽고 있는 위치 ---------- */
  var ACTIVE = ['on', 'active', 'current', 'shown', 'is-active'];

  function slides() {                          // 슬라이드 덱이면 슬라이드 목록, 아니면 null
    var sel = ['main > article', '.slide'];
    for (var i = 0; i < sel.length; i++) {
      var n = document.querySelectorAll(sel[i]);
      if (n.length > 1) return n;
    }
    return null;
  }
  function activeIndex(list) {                 // 활성 클래스 → URL 해시 순으로 판별
    for (var i = 0; i < list.length; i++) {
      var c = list[i].classList;
      for (var j = 0; j < ACTIVE.length; j++) if (c.contains(ACTIVE[j])) return i;
    }
    var id = location.hash.slice(1);
    try { id = decodeURIComponent(id); } catch (e) {}
    if (id) for (var k = 0; k < list.length; k++) if (list[k].id === id) return k;
    return -1;
  }
  function visibleIndex(list) {                // 전 슬라이드가 이어서 흐르는 덱용 보조 판별
    var best = -1, near = Infinity, h = window.innerHeight || 800;
    for (var i = 0; i < list.length; i++) {
      var r = list[i].getBoundingClientRect();
      if (r.bottom <= 0 || r.top >= h) continue;
      var d = Math.abs(r.top);
      if (d < near) { near = d; best = i; }
    }
    return best;
  }
  function heading() {                         // 긴 문서용 — 화면 상단을 지난 마지막 제목
    var hs = document.querySelectorAll('h1[id],h2[id],h3[id]'), out = '';
    for (var i = 0; i < hs.length; i++) {
      if (hs[i].getBoundingClientRect().top <= 90) out = '#' + hs[i].id; else break;
    }
    return out;
  }
  function snap() {
    var list = slides();
    if (list) {
      var i = activeIndex(list);
      if (i < 0) i = visibleIndex(list);
      if (i < 0) i = 0;
      var el = list[i];
      return { kind: 'slide', page: i + 1, total: list.length, scrollY: 0,
               hash: el.id ? '#' + el.id : '', ratio: (i + 1) / list.length };
    }
    var se = document.scrollingElement || document.documentElement;
    var max = Math.max(0, se.scrollHeight - se.clientHeight);
    var y = Math.round(se.scrollTop || window.pageYOffset || 0);
    return { kind: 'scroll', page: 0, total: 0, scrollY: y,
             hash: heading(), ratio: max ? Math.min(1, y / max) : 0 };
  }

  /* ---------- 자동 저장 ----------
     처음 상태는 기준선으로만 잡고 저장하지 않는다 — 첫 장으로 열자마자
     지난번 책갈피를 1쪽으로 덮어쓰지 않기 위해서다.                        */
  function sig(s) {
    return s.kind + ':' + s.page + ':' + (s.kind === 'scroll' ? Math.round(s.scrollY / 40) : 0);
  }
  var last = sig(snap());
  function tick(force) {
    if (document.hidden && !force) return;
    var s = snap(), cur = sig(s);
    if (cur === last) return;
    last = cur;
    s.id = FILE;
    s.title = (document.title || FILE).trim();
    s.updated = Date.now();
    save(s).catch(function () {});
  }
  setInterval(tick, 1200);
  addEventListener('hashchange', function () { tick(); });
  addEventListener('visibilitychange', function () { if (document.hidden) tick(true); });
  addEventListener('pagehide', function () { tick(true); });

  /* ---------- 이어보기 ---------- */
  function jump(rec) {
    if (rec.kind === 'slide') {
      var el = rec.hash ? document.getElementById(rec.hash.slice(1)) : null;
      var list = slides();
      if (!el && list && list[rec.page - 1]) el = list[rec.page - 1];
      if (!el) return;
      if (el.id && location.hash.slice(1) !== el.id) location.hash = '#' + el.id;
      setTimeout(function () {                 // 해시로 안 움직이는 엔진 대비
        var l2 = slides();
        if (!l2 || activeIndex(l2) !== rec.page - 1) el.scrollIntoView({ block: 'start' });
      }, 80);
    } else {
      var se = document.scrollingElement || document.documentElement;
      var max = Math.max(0, se.scrollHeight - se.clientHeight);
      var y = rec.scrollY <= max ? rec.scrollY : Math.round(rec.ratio * max);
      window.scrollTo({ top: y, behavior: 'smooth' });
    }
  }
  function ago(t) {
    var d = Date.now() - t;
    if (d < 6e4)  return '방금 전';
    if (d < 36e5) return Math.floor(d / 6e4) + '분 전';
    if (d < 864e5) return Math.floor(d / 36e5) + '시간 전';
    if (d < 6048e5) return Math.floor(d / 864e5) + '일 전';
    return new Date(t).toLocaleDateString('ko-KR');
  }
  function bottomInset() {              // 화면 아래 고정 내비(◀ 1/67 ▶) 위로 띄우기
    var h = window.innerHeight || 800, gap = 14;
    if (!document.body) return gap;
    var list = [], c;
    for (c = document.body.firstElementChild; c; c = c.nextElementSibling) list.push(c);
    var extra = document.querySelectorAll('nav, footer');
    for (var i = 0; i < extra.length; i++) list.push(extra[i]);
    for (var j = 0; j < list.length; j++) {
      var n = list[j], t = n.tagName;
      if (t === 'SCRIPT' || t === 'STYLE' || t === 'LINK') continue;
      var cs = getComputedStyle(n);
      if (cs.position !== 'fixed' && cs.position !== 'sticky') continue;
      if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) === 0) continue;
      var r = n.getBoundingClientRect();
      if (!r.height || r.height > h * 0.5 || r.bottom < h - 4 || r.top > h) continue;
      gap = Math.max(gap, Math.round(h - r.top) + 10);
    }
    return gap;
  }
  function toast(rec) {
    var gap = bottomInset();
    var host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483000;pointer-events:none';
    var root = host.attachShadow ? host.attachShadow({ mode: 'open' }) : host;
    var where = rec.kind === 'slide'
      ? rec.page + ' / ' + rec.total + ' 쪽'
      : Math.round(rec.ratio * 100) + '% 지점';
    root.innerHTML =
      '<style>' +
      '.w{pointer-events:auto;display:flex;align-items:center;gap:10px;' +
      'margin:0 auto calc(' + gap + 'px + env(safe-area-inset-bottom,0px));' +
      'padding:10px 12px 10px 14px;max-width:min(94vw,460px);border-radius:14px;' +
      'background:rgba(18,28,40,.94);color:#eaf3fb;font:500 14px/1.4 -apple-system,BlinkMacSystemFont,' +
      '"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35);' +
      'animation:up .22s ease-out}' +
      '@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}' +
      '@media (prefers-reduced-motion:reduce){.w{animation:none}}' +
      '.t{flex:1;min-width:0}.t b{display:block;font-weight:700}' +
      '.t s{display:block;text-decoration:none;opacity:.72;font-size:12px;margin-top:2px}' +
      'button{font:inherit;border:0;border-radius:9px;padding:8px 12px;cursor:pointer}' +
      '.go{background:#4fc3f7;color:#06263a;font-weight:700}' +
      '.no{background:transparent;color:#9fb6c9;padding:8px 6px}' +
      '</style>' +
      '<div class="w"><span aria-hidden="true">🔖</span>' +
      '<div class="t"><b>지난번 ' + where + '까지 읽었어요</b><s>' + ago(rec.updated) + ' 저장됨</s></div>' +
      '<button class="go" type="button">이어보기</button>' +
      '<button class="no" type="button" aria-label="닫기">✕</button></div>';
    function close() { if (host.parentNode) host.parentNode.removeChild(host); }
    root.querySelector('.go').onclick = function () { close(); jump(rec); };
    root.querySelector('.no').onclick = close;
    document.body.appendChild(host);
    setTimeout(close, 15000);
  }

  if (!location.hash) {
    load(FILE).then(function (rec) {
      if (!rec) return;
      var worth = rec.kind === 'slide' ? rec.page > 1 : rec.scrollY > 200;
      if (worth) toast(rec);
    }).catch(function () {});
  }
})();
</script>
