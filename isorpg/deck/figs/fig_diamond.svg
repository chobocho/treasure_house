<svg class="diag" viewBox="0 0 500 270" role="img" aria-label="마름모는 L1 단위공이다">
<title>마름모는 L1 단위공이다</title>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b04a2a"/></marker></defs>
<rect x="106.0" y="28.0" width="288.0" height="144.0" fill="none" stroke="#c9bda4" stroke-width="1"/>
<polygon class="tl on" points="250.00,28.00 394.00,100.00 250.00,172.00 106.00,100.00"/>
<path class="gd" d="M 106.00 100.00 L 394.00 100.00"/>
<path class="gd" d="M 250.00 28.00 L 250.00 172.00"/>
<text x="250.0" y="20.0" text-anchor="middle">v = -8</text>
<text x="250.0" y="188.0" text-anchor="middle">v = +8</text>
<text x="80.0" y="104.0" text-anchor="middle">u = -16</text>
<text x="420.0" y="104.0" text-anchor="middle">u = +16</text>
<text x="250.0" y="105.0" text-anchor="middle">|u| + 2|v| ≤ 16</text>
<text x="250.0" y="250.0" text-anchor="middle">마름모 = L1 단위공을 u축으로 두 배 늘인 것.  넓이 = 32×16/2 = 256픽셀</text>
</svg>
