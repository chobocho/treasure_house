<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>테트리스 8인 온라인 대전</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #020617; color: #e2e8f0;
         font: 15px/1.5 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  #field { width: 100vw; height: 100dvh; outline: none; }
  #lobby { position: fixed; inset: 0; overflow: auto; background: rgba(2,6,23,.94);
           padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  label { font-size: 12px; color: #94a3b8; display: block; }
  input, select, button { font: inherit; background: #0f172a; color: #e2e8f0;
           border: 1px solid #334155; border-radius: 8px; padding: 7px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: #64748b; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  .row > div { flex: 1 1 120px; min-width: 96px; }
  #seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .seat { text-align: left; padding: 8px; line-height: 1.35; }
  .seat b { display: block; color: #64748b; font-size: 11px; }
  .seat small { display: block; color: #94a3b8; font-size: 11px; }
  .seat.mine { border-color: #38bdf8; background: #082f49; }
  .seat.taken { border-color: #475569; opacity: .8; }
  #msg { color: #fbbf24; font-size: 13px; min-height: 20px; }
  #hint { color: #94a3b8; font-size: 12px; }
  @media (max-width: 400px) { .row > div { flex-basis: 100%; } }
</style>

<div id="field" tabindex="0"></div>

<div id="lobby">
  <h1>🧱 테트리스 8인 온라인 대전 <small style="color:#64748b">프로토콜 v3</small></h1>
  <div class="row">
    <div><label for="url">서버</label><input id="url" style="width:100%"></div>
    <div><label for="name">이름</label><input id="name" value="플레이어" style="width:100%"></div>
    <div><label for="code">방 코드</label><input id="code" placeholder="ABCDEF" style="width:100%"></div>
  </div>
  <div class="row">
    <div><label for="cfgMax">좌석</label>
      <select id="cfgMax" style="width:100%"><option>2</option><option>4</option><option selected>8</option></select></div>
    <div><label for="cfgTarget">타겟팅</label>
      <select id="cfgTarget" style="width:100%">
        <option value="random">무작위</option><option value="even">분산</option>
        <option value="attackers">반격</option><option value="ko">막타</option></select></div>
    <div><label for="cfgDelay">가비지 유예(ms)</label><input id="cfgDelay" value="900" style="width:100%"></div>
  </div>
  <div class="row">
    <button id="btnCreate">방 만들기</button>
    <button id="btnJoin">코드로 참가</button>
    <button id="btnSolo">1인용 (서버 없이)</button>
  </div>
  <hr style="border:0;border-top:1px solid #1e293b;margin:2px 0">
  <div class="row">
    <div><label for="kind">앉힐 것</label>
      <select id="kind" style="width:100%"><option value="human">🧑 사람</option><option value="ai">🤖 AI</option></select></div>
    <div><label for="lv">AI 난이도</label>
      <select id="lv" style="width:100%">
        <option value="easy">초보</option><option value="normal">보통</option>
        <option value="hard" selected>고수</option><option value="max">최강</option></select></div>
  </div>
  <div id="seats"></div>
  <div id="hint"></div>
  <div class="row"><button id="btnReady">준비</button><button id="btnStart">시작</button></div>
  <div id="msg"></div>
  <p style="color:#64748b;font-size:12px;margin:0">
    1P 방향키·Space(하드드롭)·C(홀드)&nbsp;&nbsp;|&nbsp;&nbsp;2P A·D·S·W·Q·F(하드드롭)·E(홀드)&nbsp;&nbsp;|&nbsp;&nbsp;게임패드 2개 지원
  </p>
</div>

<script src="room.js"></script>
<script src="netcore_browser.js"></script>
<script src="net_client.js"></script>
<script src="seats.js"></script>
<script src="arena.js"></script>
<script src="match.js"></script>
<script src="app.js"></script>
