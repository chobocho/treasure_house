<title>Termux 대백과사전 — 안드로이드 위의 리눅스, 그 모든 것 · 역사 · 원리 · 한계 · 활용</title>
<meta name="description" content="Termux 를 처음부터 끝까지 — 설치처 고르기와 첫 실행, 2015년부터의 역사, 안드로이드 앱 샌드박스 위에서 리눅스 유저랜드가 도는 원리(bionic·$PREFIX·termux-exec·셔뱅), apt/dpkg 패키지 시스템과 termux-packages 빌드, Termux:API 와 플러그인, 팬텀 프로세스·루트 없음 같은 한계와 우회, proot 와 리눅스 배포판, 개발 환경·자동화·서버·GUI 활용, 보안과 문제 해결 사전. 모든 캡처는 이 덱을 만든 실기기 Termux 에서 떴고, 모든 원리는 핀 고정한 upstream 소스의 줄을 가리킨다. 단일 HTML, 외부 의존성 0.">
<style>
/* ============================================================
   1. 테마 — 색을 바꾸려면 이 블록만 고치면 된다
   ============================================================ */
:root {
  /* ── 배색은 "AMOLED 위의 터미널" 이다(PLAN.md §5 1단계에서 한 번 정했다).
     색은 기억이 아니라 termux-app 소스에서 잰 값이다(@084d709):
       · 바탕 #000 — art/ic_launcher.svg 의 화면색이자 기본 배색의 black
       · 테두리 #BFCBCD — 같은 아이콘의 베젤(stroke)
       · 글자·강조·부품 색 — terminal-emulator 의
         TerminalColorScheme.java DEFAULT_COLORSCHEME 첫 16색
     계획서는 "아이콘의 초록" 을 재라 했지만 아이콘에는 초록이 없다
     (검정·흰색·회색뿐). 그래서 강조색은 기본 배색의 dim green 이다. ── */
  --bg1: #000000;          /* 배경 그라디언트 시작 (아이콘의 화면) */
  --bg2: #05080b;          /* 배경 그라디언트 중간 */
  --bg3: #0b0f14;          /* 배경 그라디언트 끝 */
  --accent: #00cd00;       /* 주 강조색 (버튼·테두리·번호) — dim green */
  --accent2: #ffffff;      /* 제목 — bright white */
  --text: #e5e5e5;         /* 본문 — dim white */
  --muted: #9e9e9e;        /* 흐린 글자 — #7f7f7f 는 판 위에서 너무 어둡다 */
  --border: rgba(191, 203, 205, 0.26);   /* 아이콘 베젤 #BFCBCD */
  --panel: rgba(11, 15, 20, 0.96);
  --panel2: #11161c;       /* 판 안의 판 (입력칸·비교 상자) */
  --code-bg: #000000;
  --code-border: rgba(191, 203, 205, 0.20);
  --ok: #00ff00;           /* 좋은 예 / 성공 — bright green */
  --warn: #cdcd00;         /* 주의 — dim yellow */
  --bad: #ff5f5f;          /* 나쁜 예 / 오류 — 256색 큐브 (검정 위 #cd0000 은 읽기 어렵다) */
  --special: #6495ed;      /* 핵심 강조 — 이 덱에서는 '이 기기에서 뜬 캡처' (dim blue) */

  /* ── 이 덱의 등장인물은 층(層)이다. 여섯 색을 못 박아 두고
     그림(SVG)·표·본문 배지가 끝까지 같은 색을 쓴다. 이름(--g1…--g6)은
     svgkit.py 가 읽는 그대로 두고 뜻만 바꿨다. ── */
  --g1: #cdcd00;           /* 안드로이드 OS·커널 (dim yellow) */
  --g2: #00cd00;           /* Termux 앱·유저랜드 (dim green) */
  --g3: #00cdcd;           /* 패키지·apt·저장소 (dim cyan) */
  --g4: #cd00cd;           /* proot·리눅스 배포판 (dim magenta) */
  --g5: #ff5f5f;           /* 한계·거부·위험 (red) */
  --g6: #bfcbcd;           /* 기기·하드웨어·바깥(PC) (아이콘 베젤) */
  --net: #7f7f7f;          /* 오가는 화살표 (medium grey) */
}

/* ============================================================
   2. 기본 골격
   ============================================================ */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; height: 100%; }
/* ⚠ 슬라이드 모드 body 높이는 100vh/100dvh 금지 — 삼성 인터넷이 하단 툴바를
   제외하지 않고 계산해 내비가 본문을 가린다. %(레이아웃 뷰포트) + min-height:0 을 쓴다. */
body {
  margin: 0;
  height: 100%; min-height: 0; overflow: hidden;
  display: flex; flex-direction: column;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
               "Malgun Gothic", "Noto Sans KR", sans-serif;
  color: var(--text);
  background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 60%, var(--bg3) 100%);
  background-attachment: scroll;
  line-height: 1.7;
  word-break: keep-all;          /* 한국어 어절 단위 줄바꿈 */
}

/* 진행 막대 */
#bar {
  flex: none; height: 3px; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--g3));
  transition: width .25s;
}

/* 상단 바 */
header.deck {
  flex: none; position: relative; z-index: 10;
  display: flex; align-items: center; gap: 8px;
  background: rgba(0,0,0,.86); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border);
  padding: 8px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
}
header.deck .home { text-decoration: none; font-size: 1.05em; flex: none; }
header.deck .brand {
  font-weight: 700; color: var(--accent2); white-space: nowrap;
  font-size: .95em; overflow: hidden; text-overflow: ellipsis;
}
header.deck select {
  flex: 1; min-width: 0; background: var(--panel2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 7px 8px;
  font-size: .9em; max-width: 420px; margin-left: auto;
}
#tocBtn {
  flex: none; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; font-size: .85em; padding: 7px 10px; cursor: pointer;
}

/* ============================================================
   3. 슬라이드 무대 — main > article 하나가 슬라이드 한 장
   ============================================================ */
main.prose {
  flex: 1; width: 100%; margin: 0; min-width: 0;
  overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 14px clamp(10px, 3vw, 24px) 18px;
}
main.prose > article { display: none; }
main.prose > article.card {
  position: relative; max-width: 900px; margin: 14px auto;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 16px; padding: clamp(16px, 3.5vw, 34px);
  box-shadow: 0 4px 18px rgba(0,0,0,.6);
  backdrop-filter: blur(6px);
}
main.prose > article.on { display: block; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
/* 부(部) 표지 */
main.prose article.section {
  background: linear-gradient(145deg, #0a1f0a, #000);
  border-color: rgba(0,205,0,.45); padding-top: 30px; padding-bottom: 30px;
}

/* 제목 — .pno(페이지 번호)가 절대 배치라 오른쪽 여백 64px 필수 */
main.prose h1, main.prose h2, main.prose h3, main.prose h4 { line-height: 1.35; }
main.prose article > h1, main.prose article > h2, main.prose article > h3 {
  padding-right: 64px; overflow-wrap: break-word;
}
main.prose article h4 { padding-right: 8px; }
main.prose h1 {
  font-size: clamp(1.6rem, 4vw, 2.3rem); margin: .1em 0 .5em;
  background: linear-gradient(90deg, var(--accent), var(--g3), var(--accent2));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
main.prose h2 { font-size: clamp(1.3rem, 3vw, 1.7rem); margin: .2em 0 .5em; color: var(--accent2); }
main.prose h3 { font-size: 1.2rem; margin: .1em 0 .5em; color: var(--accent2); }
main.prose h4 { font-size: 1.02rem; margin: 1.1em 0 .3em; }
main.prose p { margin: .7em 0; }
main.prose ul, main.prose ol { padding-left: 1.4em; }
main.prose li { margin: .3em 0; }
main.prose a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--border); }
main.prose hr { border: none; border-top: 2px dashed var(--border); margin: 1.6em 0; }
main.prose blockquote {
  margin: 1em 0; padding: 10px 18px; border-left: 4px solid var(--accent);
  background: rgba(0,205,0,.07); border-radius: 0 10px 10px 0; color: var(--muted);
}
.lead { font-size: 1.05em; }
.pno {
  position: absolute; top: 10px; right: 14px; font-size: 11px;
  color: var(--muted); font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace;
}
.chnum { color: var(--accent2); font-weight: bold; letter-spacing: .12em; font-size: .85em; margin: 0 0 4px; }
.chnum + h1, .chnum + h2 { margin-top: 0; }
.chsub { color: var(--muted); margin: 8px 0 0; }
.cap { color: var(--muted); font-size: .9em; margin: 8px 0 4px; }
.cap a, .chsub a { color: var(--accent); text-decoration: none; font-weight: 600; }

/* 표지 */
article.cover h1 { font-size: clamp(1.7rem, 5.2vw, 2.7rem); }
.cover .sub { color: var(--muted); font-size: 1.02em; margin-top: 6px; }
.cover .cq {
  display: inline-flex; align-items: center; justify-content: center;
  width: 84px; height: 84px; border-radius: 50%; background: var(--accent2); color: #000;
  font-weight: 800; font-size: 1.5rem; font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace; letter-spacing: -.02em;
  box-shadow: 0 6px 18px rgba(0,205,0,.25), inset 0 0 0 6px rgba(0,0,0,.18); margin-bottom: 6px;
}

/* ============================================================
   4. 코드
   ============================================================ */
main.prose :not(pre) > code {
  background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 6px;
  padding: 1px 6px; font-size: .9em; color: var(--g3);
  font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace;
  overflow-wrap: break-word;   /* ⚠ anywhere 금지: 짧은 식별자가 낱말 중간에서 갈라진다 */
}
code.nb { white-space: nowrap; }  /* 짧은(≈18자 이하) 인라인 코드에 붙여 분리 방지 */
main.prose pre {
  background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 12px;
  padding: 16px 18px; overflow-x: auto; -webkit-overflow-scrolling: touch;
  font-size: .88rem; line-height: 1.55;
  box-shadow: none;
}
main.prose pre code {
  font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace;
  background: none; border: none; padding: 0; color: var(--text);
}
main.prose pre, main.prose code, .term, .cerr, .demo .out, .pkgtree, .sig {
  tab-size: 4; -moz-tab-size: 4;
}
/* 하이라이터가 붙이는 토큰 클래스 */
code .cm { color: #7f7f7f; font-style: italic; }   /* 주석 */
code .st { color: #00cd00; }                       /* 문자열 */
code .kw { color: #6495ed; font-weight: 600; }     /* 키워드 */
code .fn { color: #cdcd00; }                       /* 함수 호출 */
code .nu { color: #d75fd7; }                       /* 숫자 */
code .hd { color: #cdcd00; font-weight: 700; }     /* HTTP 헤더 */
/* 코드 블록 파일명 라벨 */
.fname {
  display: inline-block; font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace; font-size: .78rem;
  color: var(--muted); background: rgba(0,205,0,.08); border: 1px solid var(--code-border);
  border-bottom: none; border-radius: 8px 8px 0 0; padding: 2px 10px; margin: 10px 0 0;
}
.fname + pre { border-radius: 0 10px 10px 10px; margin-top: 0; }

/* ============================================================
   5. 콜아웃 · 표 · 목록
   ============================================================ */
.note, .tip, .warn, .key {
  border-radius: 10px; padding: 10px 14px; margin: 12px 0;
  border-left: 4px solid var(--accent); background: rgba(0,205,0,.08);
  font-size: .95em; overflow-wrap: break-word;
}
.tip  { border-left-color: var(--ok);      background: rgba(0,255,0,.09); }
.warn { border-left-color: var(--warn);    background: rgba(205,205,0,.10); }
.key  { border-left-color: var(--special); background: rgba(100,149,237,.09); }
.note b { color: var(--accent2); }
.tip b  { color: var(--ok); }
.warn b { color: var(--warn); }
.key b  { color: var(--special); }

/* 표는 반드시 .tblwrap 으로 감쌀 것 — 좁은 화면에서 카드 밖으로 잘리는 것을 막는다 */
.tblwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 1.2em 0; }
.tblwrap table { margin: 0; }
.kv { width: 100%; border-collapse: collapse; font-size: .9rem; margin: 10px 0; }
.kv th, .kv td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
.kv th { background: rgba(0,205,0,.10); }
/* ⚠ th 에 white-space:nowrap 을 주지 말 것 — 이름 여러 개가 든 칸이 한 줄을 통째로 차지해
   다른 열을 화면 밖으로 밀어낸다. 이름마다 <code> 칩을 따로 주는 편이 낫다. */

/* 번호 매겨진 단계 목록 */
.steps { counter-reset: st; list-style: none; padding-left: 0; margin: 12px 0; }
.steps > li { counter-increment: st; position: relative; padding-left: 34px; margin: 8px 0; }
.steps > li::before {
  content: counter(st); position: absolute; left: 0; top: 1px;
  width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #000;
  font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}

/* 배지 */
.badge {
  display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .74rem;
  font-weight: 700; background: rgba(0,205,0,.14); color: var(--accent2);
  margin-right: 6px; vertical-align: middle;
}
.badge.ok  { background: rgba(0,255,0,.16); color: var(--ok); }
.badge.err { background: rgba(255,95,95,.14); color: var(--bad); }
.badge.new { background: rgba(100,149,237,.14); color: var(--special); }

/* 인라인 값 칩 */
.chip {
  display: inline-block; font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace; font-size: .8rem;
  border: 1px solid var(--code-border); background: var(--code-bg); border-radius: 5px;
  padding: 0 6px; margin: 0 2px;
}

/* ============================================================
   6. 레이아웃 컴포넌트 (그리드·비교 카드)
   ============================================================ */
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin: 12px 0; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin: 12px 0; }
.g2 > div, .g3 > div { min-width: 0; }
.g2 pre, .g3 pre { margin: 0; }

.cmp { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--panel2); }
.cmp > h5 {
  margin: 0; padding: 6px 12px; font-size: .85rem; letter-spacing: .02em;
  background: rgba(0,205,0,.12); color: var(--accent2); border-bottom: 1px solid var(--border);
}
.cmp.bad > h5  { background: rgba(255,95,95,.12); color: var(--bad); }
.cmp.good > h5 { background: rgba(0,255,0,.14); color: var(--ok); }
.cmp pre { border: none; border-radius: 0; background: var(--code-bg); }
.cmp p { margin: 8px 12px; font-size: .92em; color: var(--muted); }
.cmp .kv { margin: 0; font-size: .86rem; }

/* ============================================================
   7. 도식 — 박스 문자(┌─│)는 폴드7에서 깨지므로 CSS 도식으로 그린다
   ============================================================ */
.flow, .pipe { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0; }
.flow .box, .pipe .st {
  border: 1px solid var(--border); background: var(--panel2); border-radius: 10px;
  padding: 6px 12px; font-size: .88rem; font-weight: 600; color: var(--accent2);
}
.flow .box.dim { color: var(--muted); font-weight: 500; }
.flow .arr, .pipe .arr { color: var(--muted); font-weight: 700; }
.pipe .ext2 { font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace; color: var(--muted); font-size: .78rem; }

/* 셀 배열 (배열·바이트·큐 그리기) */
.arr { display: flex; flex-wrap: wrap; gap: 2px; margin: 8px 0; }
.arr .c {
  min-width: 34px; text-align: center; padding: 5px 6px; font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace;
  font-size: .8rem; border: 1px solid var(--code-border); background: var(--code-bg); border-radius: 5px;
}
.arr .c.in { border-color: var(--accent); background: rgba(0,205,0,.14); font-weight: 700; color: var(--accent2); }
.arr .c.dead { opacity: .4; text-decoration: line-through; }
.arr .idx { font-size: .68rem; color: var(--muted); display: block; line-height: 1.1; }

/* 스택 (아래에서 위로 쌓임) */
.stack { display: flex; flex-direction: column-reverse; gap: 3px; margin: 10px 0; max-width: 260px; }
.stack .cell {
  border: 1px solid var(--code-border); background: var(--code-bg); border-radius: 6px;
  padding: 4px 10px; font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace; font-size: .82rem; text-align: center;
}
.stack .cell.top { border-color: var(--accent); background: rgba(0,205,0,.12); font-weight: 700; }
.stack .lbl { font-size: .74rem; color: var(--muted); text-align: center; }

/* 트리 / 들여쓴 구조 (공백으로 계층을 표현) */
.pkgtree {
  margin: 12px 0; padding: 10px 14px; border-radius: 10px; background: var(--code-bg);
  border: 1px solid var(--code-border); font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace; font-size: .82rem;
  line-height: 1.75; overflow-x: auto; white-space: pre;
}
.pkgtree b { color: var(--accent2); }
.pkgtree i { color: var(--muted); font-style: normal; }

/* 시그니처 해부 — 밑줄 + 라벨 */
.sig {
  margin: 12px 0; padding: 10px 12px; border-radius: 10px; background: var(--code-bg);
  border: 1px solid var(--code-border); font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace; font-size: .88rem;
  overflow-x: auto; white-space: pre; line-height: 2.1;
}
.sig u { text-decoration: none; border-bottom: 2px solid var(--accent); padding-bottom: 1px; }
.sig .lbl {
  display: inline-block; font-size: .66rem; font-family: system-ui, sans-serif;
  background: var(--accent); color: #000; border-radius: 4px; padding: 0 5px; margin-left: 4px;
  vertical-align: middle; font-weight: 700;
}

/* 좌·우 대응 도식 */
.satisfy { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 8px; align-items: center; margin: 12px 0; }
.satisfy .bx {
  border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; background: var(--panel2);
  font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace; font-size: .8rem; line-height: 1.6; min-width: 0; overflow-x: auto;
}
.satisfy .bx h6 { margin: 0 0 5px; font-family: system-ui, sans-serif; font-size: .74rem; color: var(--muted); }
.satisfy .mid { font-size: 1.1rem; color: var(--accent); font-weight: 700; }

/* ============================================================
   8. 터미널 · 오류 박스
   ============================================================ */
/* ⚠ .term · .cerr 는 <pre> 에 붙는다. `main.prose pre`(0,1,2)가 클래스 하나(0,1,0)보다
   우선순위가 높아 배경이 밝은 코드 배경으로 덮이면 글자가 안 보인다. 선택자를 반드시 더 길게 쓸 것. */
main.prose pre.term, .term {
  margin: 10px 0; padding: 12px 14px; border-radius: 10px;
  background: #000; color: #e5e5e5; border: 1px solid rgba(191,203,205,.35);
  font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace; font-size: .84rem;
  line-height: 1.55; overflow-x: auto; white-space: pre; -webkit-overflow-scrolling: touch;
  box-shadow: none;   /* main.prose pre 의 흰색 inset 하이라이트가 어두운 배경에 줄로 남는다 */
}
.term .p { color: #00cd00; }   /* 프롬프트 */
.term .c { color: #7f7f7f; }   /* 주석 */
.term .r { color: #ff5f5f; }   /* 오류 */
.term .g { color: #cdcd00; }   /* 강조 */
main.prose pre.cerr, .cerr {
  margin: 10px 0; padding: 10px 12px; border-radius: 10px;
  background: rgba(255,95,95,.08); border: 1px solid rgba(255,95,95,.4); color: #ffafaf;
  font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace; font-size: .84rem;
  line-height: 1.5; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere;
}
.cerr b { color: var(--bad); }

/* ============================================================
   9. 인터랙티브 데모 · 퀴즈
   ============================================================ */
.demo {
  margin: 12px 0; border: 1px solid var(--border); border-radius: 12px;
  background: rgba(0,0,0,.5); padding: 12px;
}
.demo > h5 { margin: 0 0 8px; font-size: .88rem; color: var(--accent2); }
.demo .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.demo button {
  border: 1px solid var(--border); background: var(--accent); color: #000;
  border-radius: 9px; padding: 7px 13px; font-size: .87rem; font-weight: 600;
  cursor: pointer; min-height: 36px;
}
.demo button.sec { background: var(--panel2); color: var(--accent2); }
.demo button:active { transform: translateY(1px); }
.demo input[type=text], .demo input[type=number], .demo select {
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px;
  font-size: .87rem; background: var(--panel2); color: var(--text); min-width: 0; max-width: 190px;
  font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace;
}
.demo .out {
  margin-top: 8px; padding: 10px 12px; border-radius: 9px; background: #000; color: #e5e5e5; border: 1px solid rgba(191,203,205,.35);
  font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace; font-size: .82rem; line-height: 1.55;
  white-space: pre-wrap; overflow-wrap: anywhere; min-height: 2.6em;
}
.demo .out .ok  { color: #00ff00; }
.demo .out .bad { color: #ff5f5f; }
.demo .out .dim { color: #7f7f7f; }

.quiz .q { font-weight: 700; color: var(--accent2); margin-bottom: 6px; }
.quiz .a {
  display: none; margin-top: 10px; padding: 10px 12px; border-radius: 10px;
  background: rgba(0,255,0,.09); border-left: 4px solid var(--ok); font-size: .95em;
}
.quiz.open .a { display: block; }

/* ============================================================
   10. 하단 내비 · 목차 오버레이
   ============================================================ */
nav#deckNav {
  /* 본문 흐름 안의 바닥 바 — 오버레이가 아니라서 본문 텍스트를 가리지 않는다.
     sticky 는 책갈피 셸의 bottomInset() 감지 조건이므로 유지할 것. */
  flex: none; position: sticky; bottom: 0; z-index: 20;
  display: flex; gap: 10px; justify-content: center; align-items: center;
  padding: 8px max(12px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  background: rgba(0,0,0,.90); backdrop-filter: blur(6px);
  border-top: 1px solid var(--border);
}
nav#deckNav button {
  min-width: 52px; min-height: 40px; border-radius: 10px; border: 1px solid var(--border);
  background: rgba(17,22,28,.94); color: var(--text); font-size: 15px; font-weight: 700;
  cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.6);
}
nav#deckNav button:disabled { opacity: .35; }
#counter {
  font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
  min-width: 5.5em; text-align: center;
}
#deckToc {
  position: fixed; inset: 0; z-index: 40; display: none; overflow-y: auto;
  background: rgba(5,8,11,.97);
  padding: 16px max(16px, env(safe-area-inset-right)) 76px max(16px, env(safe-area-inset-left));
}
#deckToc.on { display: block; }
#deckToc h3 { margin: 4px 0 12px; color: var(--accent2); }
.tocsec { margin-bottom: 14px; }
.tocsec h4 {
  margin: 4px 0 6px; font-size: 13px; color: var(--accent2);
  position: sticky; top: -16px; background: rgba(5,8,11,.97); padding: 4px 0;
}
.tocsec a {
  display: block; color: var(--text); text-decoration: none; font-size: 13.5px;
  padding: 4px 8px; border-radius: 8px;
}
.tocsec a:hover, .tocsec a:focus { background: rgba(0,205,0,.12); }
.tocsec a b {
  color: var(--muted); font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace; font-weight: 600;
  display: inline-block; min-width: 3.2em;
}
#tocClose {
  position: fixed; right: max(16px, env(safe-area-inset-right));
  bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 41;
  background: var(--accent); color: #000; border: none; border-radius: 10px;
  padding: 10px 16px; font-size: 14px; cursor: pointer;
}

/* ============================================================
   11. 반응형 — 폴더블(갤럭시 폴드7) · 좁은 화면 · 인쇄
   ============================================================ */
/* 힌지로 화면이 둘로 갈릴 때는 다단 레이아웃을 전부 1단으로 */
@media (horizontal-viewport-segments: 2), (spanning: single-fold-vertical) {
  main.prose > article.card { max-width: 96%; }
  .g2, .g3, .satisfy { grid-template-columns: minmax(0,1fr); }
  .satisfy .mid { display: block; transform: rotate(-90deg); }
  .sig { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 2.4; }
}
@media (max-width: 620px) {
  .g2, .g3, .satisfy { grid-template-columns: minmax(0,1fr); }
  .satisfy .mid { display: block; transform: rotate(-90deg); }
  .sig { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 2.4; }
}
@media (max-width: 420px) {
  header.deck .brand { font-size: .8em; }
  main.prose { padding-left: 8px; padding-right: 8px; }
  main.prose > article.card { padding: 14px 12px; }
  main.prose pre { font-size: .8rem; padding: 12px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  main.prose > article.on { animation: none; }
  html { scroll-behavior: auto; }
  #bar { transition: none; }
}
@media print {
  body { height: auto; overflow: visible; display: block; }
  main.prose { overflow: visible; padding: 0; }
  main.prose > article { display: block !important; page-break-after: always; }
  #bar, header.deck, nav#deckNav, #deckToc { display: none !important; }
}

/* ============================================================
   이 덱에만 있는 것 — 템플릿에는 없는 조각들
   ============================================================ */

/* 소스 파일 라벨 — 파일명 + 줄 번호 범위 + 한 줄 설명.
   덱의 모든 코드 블록 위에 붙는다. "이건 진짜 파일의 진짜 줄" 이라는 표시다. */
.src {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline;
  font-size: .82em; margin: 10px 0 -6px;
}
/* ⚠ flex 항목은 기본이 min-width:auto 라 내용보다 좁아지지 않는다.
   경로 하나가 52칸(CN=lunch-admins,OU=Groups,DC=ad,DC=campus,DC=example)인
   라벨이 있어서, 그대로 두면 폴더블 접힘(374px)에서 카드 밖으로 나간다.
   min-width:0 을 줘야 break-word 가 실제로 걸린다. */
.src b, .src span { min-width: 0; overflow-wrap: break-word; }
.src b { color: var(--accent2); font-family: "DeckMono", ui-monospace, "DejaVu Sans Mono", monospace; }
.src span { color: var(--muted); }
.src .ln {
  font-family: "DeckMono", ui-monospace, "DejaVu Sans Mono", monospace;
  background: var(--code-bg); border: 1px solid var(--code-border);
  border-radius: 5px; padding: 0 6px;
}

/* 근거 등급 배지 — 이 화면의 내용이 어디서 왔는가 (PLAN.md §6).
   A 이 기기에서 뜬 캡처 · S upstream 소스 발췌 · B 공식 문서·이슈 ·
   C 역사·뉴스 자료 · 설명용 그림. 자세한 뜻은 0부 '증거 등급' 장. */
.tier {
  display: inline-block; font-size: .72em; font-weight: 700; letter-spacing: .02em;
  border-radius: 999px; padding: 1px 9px; margin-left: 6px; vertical-align: 2px;
  border: 1px solid currentColor; white-space: nowrap;
}
.tier.a { color: var(--ok); }
.tier.s { color: var(--g3); }
.tier.b { color: var(--warn); }
.tier.c { color: var(--muted); }
/* 파일에서 잘라 온 것이 아니라, 설명하려고 그린 조각. 돌아가는 코드가 아니다. */
.tier.ill { color: var(--accent); }
.tier.demo { color: var(--bad); }      /* 예제용 가짜 값(비밀번호·인증서)이 화면에 있다 */

/* 인라인 SVG 도해 — 전체 그림이 부마다 한 칸씩 켜진다.
   viewBox + width:100% 라 폴더블 접힘(374px)에서도 잘리지 않는다. */
svg.diag { display: block; width: 100%; height: auto; margin: 10px 0; }
svg.diag text {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
               "Malgun Gothic", "Noto Sans KR", sans-serif;
  font-size: 12px; fill: var(--text);
}
svg.diag .lbl { font-size: 11px; fill: var(--muted); }
svg.diag .box { fill: var(--panel); stroke: var(--border); stroke-width: 1.4; rx: 8px; }
svg.diag .box.g1 { stroke: var(--g1); fill: rgba(205,205,0,.10); }
svg.diag .box.g2 { stroke: var(--g2); fill: rgba(0,205,0,.10); }
svg.diag .box.g3 { stroke: var(--g3); fill: rgba(0,205,205,.10); }
svg.diag .box.g4 { stroke: var(--g4); fill: rgba(205,0,205,.10); }
svg.diag .box.g5 { stroke: var(--g5); fill: rgba(255,95,95,.10); }
svg.diag .box.g6 { stroke: var(--g6); fill: rgba(191,203,205,.10); }
/* 아직 등장하지 않은 상자 — 흐리게 두고, 그 부에서 켠다 */
svg.diag .box.off { fill: none; stroke: var(--border); stroke-dasharray: 4 3; }
svg.diag .off text, svg.diag text.off { fill: var(--muted); }
svg.diag .arw { stroke: var(--net); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
svg.diag .arw.hot { stroke: var(--special); stroke-width: 2.2; }
svg.diag #ah path, svg.diag marker path { fill: var(--net); stroke: none; }

/* 표 안의 숫자 열은 오른쪽 정렬 — 자릿수를 눈으로 비교하게 */
table.kv td.num, table.kv th.num { text-align: right; font-variant-numeric: tabular-nums; }
/* ============================================================
   7. 수식 키트 — 외부 수식 라이브러리(MathJax·KaTeX) 없이 순수 CSS로
      분수·큰 연산자·행렬·경우나눔·근호를 조판한다.
      원칙: 변수는 <i>, 함수·연산자 이름은 <b class="fn">, 숫자는 그대로.
      좁은 화면 대응: 모든 블록 수식은 스스로 가로 스크롤을 만든다.
   ============================================================ */
.eq, .eqn {
  display: block; margin: 14px 0; padding: 12px 16px;
  background: var(--panel2); border: 1px solid var(--code-border); border-left: 3px solid var(--accent);
  border-radius: 10px; overflow-x: auto; overflow-y: hidden;
  font-family: "Cambria Math", "STIX Two Math", Cambria, "Times New Roman", Georgia, serif;
  font-size: clamp(15px, 2.4vw, 19px); line-height: 2.1; text-align: center;
  -webkit-overflow-scrolling: touch;
}
.eq.left, .eqn.left { text-align: left; }
/* 번호식 — 오른쪽에 (3.1) 을 붙인다. 좁으면 아래로 내려간다. */
.eqn { display: flex; align-items: center; gap: 12px; text-align: left; }
.eqn > .body { flex: 1; min-width: 0; overflow-x: auto; text-align: center; }
.eqn > .tag { flex: none; color: var(--muted); font-size: .8em; font-family: inherit; }

/* 인라인 수식 — 문장 속에서 쓴다 */
.mi { font-family: "Cambria Math", "STIX Two Math", Cambria, "Times New Roman", Georgia, serif;
      white-space: nowrap; }
.eq i, .eqn i, .mi i { font-style: italic; }
.eq b.fn, .eqn b.fn, .mi b.fn { font-weight: 400; font-style: normal; }
/* 굵은 벡터·행렬 표기 */
.eq .vec, .eqn .vec, .mi .vec { font-weight: 700; font-style: italic; }

/* 분수 */
.frac { display: inline-grid; vertical-align: -0.62em; text-align: center; line-height: 1.25;
        margin: 0 .18em; }
.frac > .num { padding: 0 .34em; border-bottom: 1px solid currentColor; }
.frac > .den { padding: 0 .34em; }
.frac.sm { font-size: .84em; vertical-align: -0.55em; }

/* 큰 연산자(∑ ∏ ∫ ⋃)의 위·아래 첨자 */
.oplim { display: inline-grid; vertical-align: -0.5em; text-align: center; line-height: 1.05;
         margin: 0 .16em; }
.oplim > .up { font-size: .6em; }
.oplim > .dn { font-size: .6em; }
.oplim > .op { font-size: 1.5em; font-style: normal; }
/* argmin/argmax 아래 첨자 */
.uset { display: inline-grid; vertical-align: -0.5em; text-align: center; line-height: 1.1;
        margin: 0 .12em; }
.uset > .dn { font-size: .62em; }

/* 근호 — √ 뒤 내용에 윗줄을 그어 덮개를 만든다 */
.sqrt { white-space: nowrap; }
.sqrt > .rad { border-top: 1px solid currentColor; padding: 0 .18em 0 .1em; margin-left: -.06em; }

/* 행렬·벡터 — 대괄호는 문자가 아니라 테두리로 그린다(글꼴 폭 문제 회피) */
.mat { display: inline-flex; align-items: stretch; vertical-align: middle; margin: 0 .2em; }
.mat > .brk { width: .34em; border: 1.6px solid currentColor; }
.mat > .brk.l { border-right: 0; border-radius: 3px 0 0 3px; }
.mat > .brk.r { border-left: 0; border-radius: 0 3px 3px 0; }
.mat > .brk.pl { border-radius: 60% 0 0 60% / 50%; }
.mat > .brk.pr { border-radius: 0 60% 60% 0 / 50%; }
.mat table { border-collapse: collapse; margin: 0; }
.mat td { padding: .12em .42em; text-align: center; border: 0; line-height: 1.35; font-size: .95em; }

/* 경우 나눔 — 왼쪽 중괄호를 세로 테두리로 대신한다 */
.cases { display: inline-flex; align-items: stretch; vertical-align: middle; text-align: left; }
.cases > .brk { width: .4em; border: 1.6px solid currentColor; border-right: 0;
                border-radius: 6px 0 0 6px; }
.cases table { border-collapse: collapse; margin: 0; }
.cases td { padding: .1em .5em; text-align: left; line-height: 1.5; font-size: .95em; }

/* 밑줄 친 설명(수식 아래 라벨) */
.ubrace { display: inline-grid; vertical-align: top; text-align: center; }
.ubrace > .lbl { font-size: .58em; color: var(--muted); font-style: normal;
                 border-top: 1px solid var(--border); padding-top: 1px; }

/* ---- 정리 · 증명 상자 ---- */
.thm, .lem, .cor, .defn, .prop, .proof, .rem {
  margin: 14px 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--panel);
}
.thm  { border-left: 4px solid var(--special); background: rgba(100,149,237, .06); }
.prop { border-left: 4px solid var(--special); background: rgba(100,149,237, .05); }
.lem  { border-left: 4px solid var(--accent);  background: rgba(0,205,0, .06); }
.cor  { border-left: 4px solid var(--accent);  background: rgba(0,205,0, .05); }
.defn { border-left: 4px solid var(--ok);      background: rgba(0,255,0, .07); }
.rem  { border-left: 4px solid var(--warn);    background: rgba(205,205,0, .07); }
.proof{ border-left: 4px solid var(--muted);   background: rgba(127,127,127, .05); }
.thm > .h, .lem > .h, .cor > .h, .defn > .h, .prop > .h, .proof > .h, .rem > .h {
  display: block; font-weight: 700; margin-bottom: 6px; font-size: .95em;
}
.thm > .h  { color: var(--special); }
.prop > .h { color: var(--special); }
.lem > .h, .cor > .h { color: var(--accent2); }
.defn > .h { color: var(--ok); }
.rem > .h  { color: var(--warn); }
.proof > .h { color: var(--muted); font-style: italic; }
/* 증명 끝 기호 — 마지막 줄 끝에 ∎ 를 자동으로 붙인다 */
.proof > :last-child::after { content: " ∎"; font-weight: 700; color: var(--muted); }
.proof.cont > :last-child::after { content: ""; }
.thm .eq, .lem .eq, .proof .eq, .defn .eq, .cor .eq, .prop .eq { background: rgba(0,0,0,.5); }

/* 증명 단계 목록 — 번호가 아니라 근거를 보여 준다 */
ol.pf { margin: 8px 0 0 0; padding-left: 1.3em; }
ol.pf > li { margin: 5px 0; }
ol.pf > li > .why { display: block; color: var(--muted); font-size: .86em; }

/* 알고리즘 의사코드 블록 — 실행 코드가 아니라 수식 수준의 서술일 때만 */
.algo { margin: 12px 0; padding: 12px 14px; background: var(--code-bg);
        border: 1px solid var(--code-border); border-radius: 10px; overflow-x: auto; }
.algo .an { display: block; font-weight: 700; color: var(--accent2); margin-bottom: 6px; }
.algo ol { margin: 0; padding-left: 1.5em; }
.algo li { margin: 3px 0; line-height: 1.6; }
.algo .kw { color: var(--special); font-weight: 700; }

/* 수렴 속도·복잡도 요약 표에서 쓰는 작은 배지 */
.rate { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: .82em;
        border: 1px solid var(--border); background: var(--panel2); white-space: nowrap; }
/* 파일명 라벨 옆의 인용 줄 범위 — 빌더가 붙인다 */
.fname .ln { color: var(--muted); font-weight: 400; font-size: .88em; }
/* 실행 출력 블록이 길 때 높이를 묶어 둔다 */
.term.tall { max-height: 62vh; overflow: auto; }

/* ============================================================
   8. 이 덱만의 조각 — 소스 배지 · 스냅샷 도장 · 생성 표 · 미확인 표시 · 층 배지
      전부 조립기(deck/build_deck.py)가 만들어 넣는다. 손으로 쓰지 말 것.
   ============================================================ */

/* ---- 소스 배지 : <!--SRC repo=… path=… sha=… lines=A-B--> 가 만든다 ----
   "이 설명은 기억이 아니라 저 저장소의 저 커밋의 저 줄이다" 를 화면에
   박아 둔다. 저장소가 data/repos.tsv 에 없거나 SHA 가 핀과 다르면 조립이
   실패하고, 그 줄이 그 커밋에 없으면 make claims-check 가 실패한다. */
.srcb {
  display: inline-block; margin: 2px 4px 2px 0; padding: 1px 8px;
  border-radius: 999px; border: 1px solid var(--g3);
  background: rgba(0,205,205, .07); color: var(--g3);
  font-size: .82em; font-weight: 700;
  font-family: "DeckMono","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Sarasa Mono K","SF Mono",ui-monospace,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace;
  /* upstream 경로는 80칸을 넘기도 한다(termux-exec 의 lib/…/ExecIntercept.c).
     접힌 화면(374px)에서 카드 밖으로 나가지 않게 아무 데서나 끊는다. */
  max-width: 100%; overflow-wrap: anywhere;
}
.srcb .sl { font-weight: 400; color: var(--muted); }

/* ---- 스냅샷 도장 : out/manifest.json 이 snapshot 이라 한 캡처에 붙는다 ----
   배터리·시간·디스크처럼 다시 뜨면 달라지는 값이다. 날짜를 숨기면
   독자는 그 숫자를 "Termux 의 성질" 로 읽는다. */
.stamp {
  display: inline-block; margin: 0 0 4px; padding: 0 8px; border-radius: 6px;
  border: 1px dashed var(--special); color: var(--special);
  font-size: .78em; font-weight: 700;
}
/* 캡처가 어느 쪽에서 떴는가 — Termux($) 인가 proot(#) 인가 */
.side { font-size: .78em; font-weight: 700; margin-left: 6px; }
.side.termux { color: var(--g2); }
.side.proot { color: var(--g4); }
.side.native { color: var(--special); }

/* 근거를 못 찾은 문장. 지우지 않고 표시해 둔다 — 숨기면 다음 사람이 믿는다. */
.unv {
  border-bottom: 2px dotted var(--bad); color: var(--bad);
  font-size: .9em; font-weight: 700;
}

/* ---- 생성 표 : <!--TABLE file=out/xxx.html cap=...--> 가 만든다 ----
   손으로 적은 숫자 표는 이 덱에 없다. 전부 data/*.tsv 나 out/ 에서 온다. */
.gtbl { margin: 12px 0; }
.gtbl .cap { margin-top: 6px; font-size: .86em; color: var(--muted); }
.gtbl table { width: 100%; border-collapse: collapse; font-size: .9em; }
.gtbl th, .gtbl td {
  border: 1px solid var(--border); padding: 5px 7px; text-align: left;
  vertical-align: top;
}
.gtbl th { background: rgba(0, 205, 0, .10); color: var(--accent2); }
.gtbl td.num, .gtbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
/* 표가 좁은 화면을 넘으면 표만 가로로 민다 — 화면 전체가 밀리면 안 된다 */
.gtbl { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* 층 색 배지 — 표와 그림이 같은 색을 쓴다 (OS·Termux·패키지·proot·한계·기기) */
.blk { display: inline-block; padding: 0 7px; border-radius: 999px;
       font-size: .82em; font-weight: 700; color: #000; white-space: nowrap; }
.blk.g1 { background: var(--g1); } .blk.g2 { background: var(--g2); }
.blk.g3 { background: var(--g3); } .blk.g4 { background: var(--g4); }
.blk.g5 { background: var(--g5); } .blk.g6 { background: var(--g6); }


/* ---- 그림(deck/gen_figs.py 가 만든 SVG)의 공통 옷 ----
   색을 그림마다 박지 않고 여기 한 곳에 둔다. 배색을 바꾸면 그림이
   따라온다. 곡선 색 cv1~cv6 은 부품 색과 같은 여섯 가지다. */
svg.diag { width: 100%; height: auto; display: block; margin: 12px 0; }
svg.diag .frame { fill: none; stroke: var(--border); stroke-width: 1; }
svg.diag .ax { stroke: var(--muted); stroke-width: 1; fill: none; }
svg.diag .grid { stroke: var(--border); stroke-width: .6;
                 stroke-dasharray: 2 3; }
svg.diag .tick { font-size: 8px; fill: var(--muted); }
svg.diag .axname { font-size: 9px; fill: var(--accent2);
                   font-weight: 700; }
svg.diag .cv { fill: none; stroke: var(--accent); stroke-width: 1.6; }
svg.diag .cv1 { fill: none; stroke: var(--g1); stroke-width: 1.6; }
svg.diag .cv2 { fill: none; stroke: var(--g2); stroke-width: 1.6; }
svg.diag .cv3 { fill: none; stroke: var(--g3); stroke-width: 1.6; }
svg.diag .cv4 { fill: none; stroke: var(--g4); stroke-width: 1.6; }
svg.diag .cv5 { fill: none; stroke: var(--g5); stroke-width: 1.6; }
svg.diag .cv6 { fill: none; stroke: var(--g6); stroke-width: 1.6; }
svg.diag .cvd { fill: none; stroke: var(--muted); stroke-width: 1.2;
                stroke-dasharray: 4 3; }
svg.diag .dot { fill: var(--accent); stroke: none; }
svg.diag .dot2 { fill: var(--special); stroke: none; }
svg.diag .dotn { fill: var(--muted); opacity: .35; stroke: none; }
svg.diag .fill { fill: var(--accent); opacity: .12; stroke: none; }
svg.diag .hi { fill: none; stroke: var(--special); stroke-width: 2; }
svg.diag .cell { fill: var(--panel); stroke: var(--border);
                 stroke-width: 1; }
svg.diag .cell.a { fill: rgba(0,205,0,.16); }
svg.diag .cell.b { fill: rgba(255,95,95,.14); }
svg.diag .cell.c { fill: rgba(0,255,0,.14); }
svg.diag .cell.d { fill: rgba(205,205,0,.16); }
svg.diag .cell.e { fill: rgba(100,149,237,.14); }
svg.diag .cell.f { fill: rgba(127,127,127,.12); }
svg.diag .cell.off { fill: none; stroke-dasharray: 3 2; }
svg.diag .tie { stroke: var(--net); stroke-width: 1; fill: none; }
svg.diag .tie.hot { stroke: var(--special); stroke-width: 1.6; }
svg.diag .cap { font-size: 8.5px; fill: var(--muted); }
svg.diag .key { font-size: 9px; fill: var(--accent2);
                font-weight: 700; }
</style>
</head>
