<svg class="diag" viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="#!/bin/sh 는 어디로 가나">
<style>
.diag text{font-family:-apple-system,"Noto Sans KR",sans-serif}
.frame{fill:none;stroke:var(--border,#3a4043);stroke-width:1}
.ax{stroke:var(--muted,#9e9e9e);stroke-width:1;fill:none}
.grid{stroke:var(--border,#2a3033);stroke-width:.6;
 stroke-dasharray:2 3;fill:none}
.tick{font-size:8px;fill:var(--muted,#9e9e9e)}
.axname{font-size:9px;fill:var(--accent2,#ffffff);font-weight:700}
.key{font-size:9px;fill:var(--accent2,#ffffff);font-weight:700}
.cap{font-size:8.5px;fill:var(--muted,#9e9e9e)}
.cv{fill:none;stroke:var(--accent,#00cd00);stroke-width:1.6}
.cv1{fill:none;stroke:var(--g1,#cdcd00);stroke-width:1.6}
.cv2{fill:none;stroke:var(--g2,#00cd00);stroke-width:1.6}
.cv3{fill:none;stroke:var(--g3,#00cdcd);stroke-width:1.6}
.cv4{fill:none;stroke:var(--g4,#cd00cd);stroke-width:1.6}
.cv5{fill:none;stroke:var(--g5,#ff5f5f);stroke-width:1.6}
.cv6{fill:none;stroke:var(--g6,#bfcbcd);stroke-width:1.6}
.cvd{fill:none;stroke:var(--muted,#9e9e9e);stroke-width:1.2;
 stroke-dasharray:4 3}
.dot{fill:var(--accent,#00cd00);stroke:none}
.dot2{fill:var(--special,#6495ed);stroke:none}
.dot5{fill:var(--g5,#ff5f5f);stroke:none}
.dotn{fill:var(--muted,#9e9e9e);opacity:.35;stroke:none}
.cell{fill:var(--panel,#0b0f14);stroke:var(--border,#3a4043);
 stroke-width:1}
.cell.a{fill:rgba(0,205,0,.16)}
.cell.b{fill:rgba(255,95,95,.14)}
.cell.c{fill:rgba(0,255,0,.14)}
.cell.d{fill:rgba(205,205,0,.16)}
.cell.e{fill:rgba(100,149,237,.14)}
.cell.f{fill:rgba(127,127,127,.12)}
.box{fill:var(--panel,#0b0f14);stroke:var(--border,#3a4043);
 stroke-width:1.2}
.box.g1{stroke:var(--g1,#cdcd00);fill:rgba(205,205,0,.12)}
.box.g2{stroke:var(--g2,#00cd00);fill:rgba(0,205,0,.12)}
.box.g3{stroke:var(--g3,#00cdcd);fill:rgba(0,205,205,.12)}
.box.g4{stroke:var(--g4,#cd00cd);fill:rgba(205,0,205,.12)}
.box.g5{stroke:var(--g5,#ff5f5f);fill:rgba(255,95,95,.12)}
.box.g6{stroke:var(--g6,#bfcbcd);fill:rgba(191,203,205,.12)}
.box.off{fill:none;stroke-dasharray:3 2}
.arw{stroke:var(--net,#7f7f7f);stroke-width:1.4;fill:none}
.arw.hot{stroke:var(--special,#6495ed);stroke-width:2.2}
.lbl{font-size:11px;fill:var(--muted,#9e9e9e)}
.diag text{fill:var(--text,#e5e5e5)}
.tie{stroke:var(--net,#7f7f7f);stroke-width:1;fill:none}
.tie.hot{stroke:var(--special,#6495ed);stroke-width:1.6}
</style>
<text x="85.00" y="14.00" class="key" text-anchor="middle">termux-exec 없이</text>
<text x="255.00" y="14.00" class="key" text-anchor="middle">termux-exec 를 LD_PRELOAD 로</text>
<rect x="10.00" y="24.00" width="150.00" height="34.00" class="box g2"/>
<text x="85.00" y="39.00" class="key" text-anchor="middle">execve("./a.sh")</text>
<text x="85.00" y="51.00" class="cap" text-anchor="middle">셔뱅 #!/bin/sh</text>
<line x1="85.00" y1="58.00" x2="85.00" y2="76.00" class="arw"/>
<polygon points="85.00,76.00 82.00,71.00 88.00,71.00" class="dotn" style="opacity:1"/>
<rect x="180.00" y="24.00" width="150.00" height="34.00" class="box g2"/>
<text x="255.00" y="39.00" class="key" text-anchor="middle">execve("./a.sh")</text>
<text x="255.00" y="51.00" class="cap" text-anchor="middle">셔뱅 #!/bin/sh</text>
<line x1="255.00" y1="58.00" x2="255.00" y2="76.00" class="arw hot"/>
<polygon points="255.00,76.00 252.00,71.00 258.00,71.00" class="dot2" style="opacity:1"/>
<rect x="10.00" y="78.00" width="150.00" height="40.00" class="box g1"/>
<text x="85.00" y="96.00" class="key" text-anchor="middle">커널이 /bin/sh 를 연다</text>
<text x="85.00" y="108.00" class="cap" text-anchor="middle">안드로이드에는 없다</text>
<rect x="10.00" y="132.00" width="150.00" height="34.00" class="box g5"/>
<text x="85.00" y="147.00" class="key" text-anchor="middle">ENOENT</text>
<text x="85.00" y="159.00" class="cap" text-anchor="middle">No such file</text>
<line x1="85.00" y1="118.00" x2="85.00" y2="130.00" class="arw"/>
<polygon points="85.00,130.00 82.00,125.00 88.00,125.00" class="dotn" style="opacity:1"/>
<rect x="180.00" y="78.00" width="150.00" height="40.00" class="box g2"/>
<text x="255.00" y="96.00" class="key" text-anchor="middle">가로채서 고쳐 쓴다</text>
<text x="255.00" y="108.00" class="cap" text-anchor="middle">/bin/sh → $PREFIX/bin/sh</text>
<rect x="180.00" y="132.00" width="150.00" height="34.00" class="box g2"/>
<text x="255.00" y="147.00" class="key" text-anchor="middle">실행된다</text>
<text x="255.00" y="159.00" class="cap" text-anchor="middle">$PREFIX/bin/sh a.sh</text>
<line x1="255.00" y1="118.00" x2="255.00" y2="130.00" class="arw hot"/>
<polygon points="255.00,130.00 252.00,125.00 258.00,125.00" class="dot2" style="opacity:1"/>
<text x="170.00" y="190.00" class="cap" text-anchor="middle">그림은 설명용 — 실제 동작은 5부의 캡처와 소스</text>
</svg>
