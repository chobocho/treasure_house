<svg class="diag" viewBox="0 0 340 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="소스에서 $PREFIX 까지">
<style>
.diag text{font-family:-apple-system,"Noto Sans KR",sans-serif}
.frame{fill:none;stroke:var(--border,#3a4043);stroke-width:1}
.ax{stroke:var(--muted,#9e9e9e);stroke-width:1;fill:none}
.grid{stroke:var(--border,#2a3033);stroke-width:.6;
 stroke-dasharray:2 3;fill:none}
.tick{font-size:8px;fill:var(--muted,#9e9e9e)}
.axname{font-size:9px;fill:var(--accent2,#ffffff);font-weight:700}
.key{font-size:9px;fill:var(--accent2,#ffffff);font-weight:700}
.cap{font-size:8.5px;fill:var(--muted,#9e9e9e)}
.cv{fill:none;stroke:var(--accent,#00cd00);stroke-width:1.6}
.cv1{fill:none;stroke:var(--g1,#cdcd00);stroke-width:1.6}
.cv2{fill:none;stroke:var(--g2,#00cd00);stroke-width:1.6}
.cv3{fill:none;stroke:var(--g3,#00cdcd);stroke-width:1.6}
.cv4{fill:none;stroke:var(--g4,#cd00cd);stroke-width:1.6}
.cv5{fill:none;stroke:var(--g5,#ff5f5f);stroke-width:1.6}
.cv6{fill:none;stroke:var(--g6,#bfcbcd);stroke-width:1.6}
.cvd{fill:none;stroke:var(--muted,#9e9e9e);stroke-width:1.2;
 stroke-dasharray:4 3}
.dot{fill:var(--accent,#00cd00);stroke:none}
.dot2{fill:var(--special,#6495ed);stroke:none}
.dot5{fill:var(--g5,#ff5f5f);stroke:none}
.dotn{fill:var(--muted,#9e9e9e);opacity:.35;stroke:none}
.cell{fill:var(--panel,#0b0f14);stroke:var(--border,#3a4043);
 stroke-width:1}
.cell.a{fill:rgba(0,205,0,.16)}
.cell.b{fill:rgba(255,95,95,.14)}
.cell.c{fill:rgba(0,255,0,.14)}
.cell.d{fill:rgba(205,205,0,.16)}
.cell.e{fill:rgba(100,149,237,.14)}
.cell.f{fill:rgba(127,127,127,.12)}
.box{fill:var(--panel,#0b0f14);stroke:var(--border,#3a4043);
 stroke-width:1.2}
.box.g1{stroke:var(--g1,#cdcd00);fill:rgba(205,205,0,.12)}
.box.g2{stroke:var(--g2,#00cd00);fill:rgba(0,205,0,.12)}
.box.g3{stroke:var(--g3,#00cdcd);fill:rgba(0,205,205,.12)}
.box.g4{stroke:var(--g4,#cd00cd);fill:rgba(205,0,205,.12)}
.box.g5{stroke:var(--g5,#ff5f5f);fill:rgba(255,95,95,.12)}
.box.g6{stroke:var(--g6,#bfcbcd);fill:rgba(191,203,205,.12)}
.box.off{fill:none;stroke-dasharray:3 2}
.arw{stroke:var(--net,#7f7f7f);stroke-width:1.4;fill:none}
.arw.hot{stroke:var(--special,#6495ed);stroke-width:2.2}
.lbl{font-size:11px;fill:var(--muted,#9e9e9e)}
.diag text{fill:var(--text,#e5e5e5)}
.tie{stroke:var(--net,#7f7f7f);stroke-width:1;fill:none}
.tie.hot{stroke:var(--special,#6495ed);stroke-width:1.6}
</style>
<rect x="40.00" y="4.00" width="260.00" height="34.00" class="box g3"/>
<text x="170.00" y="19.00" class="key" text-anchor="middle">termux/termux-packages</text>
<text x="170.00" y="31.00" class="cap" text-anchor="middle">packages/&lt;이름&gt;/build.sh</text>
<line x1="170.00" y1="38.00" x2="170.00" y2="49.00" class="arw"/>
<polygon points="170.00,49.00 167.00,44.00 173.00,44.00" class="dotn" style="opacity:1"/>
<rect x="40.00" y="49.00" width="260.00" height="34.00" class="box g3"/>
<text x="170.00" y="64.00" class="key" text-anchor="middle">build-package.sh + NDK</text>
<text x="170.00" y="76.00" class="cap" text-anchor="middle">x86-64 에서 교차 컴파일</text>
<line x1="170.00" y1="83.00" x2="170.00" y2="94.00" class="arw"/>
<polygon points="170.00,94.00 167.00,89.00 173.00,89.00" class="dotn" style="opacity:1"/>
<rect x="40.00" y="94.00" width="260.00" height="34.00" class="box g3"/>
<text x="170.00" y="109.00" class="key" text-anchor="middle">.deb 파일</text>
<text x="170.00" y="121.00" class="cap" text-anchor="middle">경로는 /data/data/com.termux/…</text>
<line x1="170.00" y1="128.00" x2="170.00" y2="139.00" class="arw"/>
<polygon points="170.00,139.00 167.00,134.00 173.00,134.00" class="dotn" style="opacity:1"/>
<rect x="40.00" y="139.00" width="260.00" height="34.00" class="box g3"/>
<text x="170.00" y="154.00" class="key" text-anchor="middle">packages.termux.dev</text>
<text x="170.00" y="166.00" class="cap" text-anchor="middle">기본 저장소 — 미러가 따라 복제</text>
<line x1="170.00" y1="173.00" x2="170.00" y2="184.00" class="arw"/>
<polygon points="170.00,184.00 167.00,179.00 173.00,179.00" class="dotn" style="opacity:1"/>
<rect x="40.00" y="184.00" width="260.00" height="34.00" class="box g2"/>
<text x="170.00" y="199.00" class="key" text-anchor="middle">pkg → apt → dpkg</text>
<text x="170.00" y="211.00" class="cap" text-anchor="middle">이 폰에서</text>
<line x1="170.00" y1="218.00" x2="170.00" y2="229.00" class="arw"/>
<polygon points="170.00,229.00 167.00,224.00 173.00,224.00" class="dotn" style="opacity:1"/>
<rect x="40.00" y="229.00" width="260.00" height="34.00" class="box g2"/>
<text x="170.00" y="244.00" class="key" text-anchor="middle">$PREFIX</text>
<text x="170.00" y="256.00" class="cap" text-anchor="middle">/data/data/com.termux/files/usr</text>
</svg>
