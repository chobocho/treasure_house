<svg class="diag" viewBox="0 0 340 184" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="설치 크기로 나눈 패키지 수">
<style>
.diag text{font-family:-apple-system,"Noto Sans KR",sans-serif}
.frame{fill:none;stroke:var(--border,#3a4043);stroke-width:1}
.ax{stroke:var(--muted,#9e9e9e);stroke-width:1;fill:none}
.grid{stroke:var(--border,#2a3033);stroke-width:.6;
 stroke-dasharray:2 3;fill:none}
.tick{font-size:8px;fill:var(--muted,#9e9e9e)}
.axname{font-size:9px;fill:var(--accent2,#ffffff);font-weight:700}
.key{font-size:9px;fill:var(--accent2,#ffffff);font-weight:700}
.cap{font-size:8.5px;fill:var(--muted,#9e9e9e)}
.cv{fill:none;stroke:var(--accent,#00cd00);stroke-width:1.6}
.cv1{fill:none;stroke:var(--g1,#cdcd00);stroke-width:1.6}
.cv2{fill:none;stroke:var(--g2,#00cd00);stroke-width:1.6}
.cv3{fill:none;stroke:var(--g3,#00cdcd);stroke-width:1.6}
.cv4{fill:none;stroke:var(--g4,#cd00cd);stroke-width:1.6}
.cv5{fill:none;stroke:var(--g5,#ff5f5f);stroke-width:1.6}
.cv6{fill:none;stroke:var(--g6,#bfcbcd);stroke-width:1.6}
.cvd{fill:none;stroke:var(--muted,#9e9e9e);stroke-width:1.2;
 stroke-dasharray:4 3}
.dot{fill:var(--accent,#00cd00);stroke:none}
.dot2{fill:var(--special,#6495ed);stroke:none}
.dot5{fill:var(--g5,#ff5f5f);stroke:none}
.dotn{fill:var(--muted,#9e9e9e);opacity:.35;stroke:none}
.cell{fill:var(--panel,#0b0f14);stroke:var(--border,#3a4043);
 stroke-width:1}
.cell.a{fill:rgba(0,205,0,.16)}
.cell.b{fill:rgba(255,95,95,.14)}
.cell.c{fill:rgba(0,255,0,.14)}
.cell.d{fill:rgba(205,205,0,.16)}
.cell.e{fill:rgba(100,149,237,.14)}
.cell.f{fill:rgba(127,127,127,.12)}
.box{fill:var(--panel,#0b0f14);stroke:var(--border,#3a4043);
 stroke-width:1.2}
.box.g1{stroke:var(--g1,#cdcd00);fill:rgba(205,205,0,.12)}
.box.g2{stroke:var(--g2,#00cd00);fill:rgba(0,205,0,.12)}
.box.g3{stroke:var(--g3,#00cdcd);fill:rgba(0,205,205,.12)}
.box.g4{stroke:var(--g4,#cd00cd);fill:rgba(205,0,205,.12)}
.box.g5{stroke:var(--g5,#ff5f5f);fill:rgba(255,95,95,.12)}
.box.g6{stroke:var(--g6,#bfcbcd);fill:rgba(191,203,205,.12)}
.box.off{fill:none;stroke-dasharray:3 2}
.arw{stroke:var(--net,#7f7f7f);stroke-width:1.4;fill:none}
.arw.hot{stroke:var(--special,#6495ed);stroke-width:2.2}
.lbl{font-size:11px;fill:var(--muted,#9e9e9e)}
.diag text{fill:var(--text,#e5e5e5)}
.tie{stroke:var(--net,#7f7f7f);stroke-width:1;fill:none}
.tie.hot{stroke:var(--special,#6495ed);stroke-width:1.6}
</style>
<text x="92.00" y="23.00" class="tick" text-anchor="end">100 KiB 미만</text>
<rect x="98.00" y="12.00" width="49.32" height="16.00" class="box g3"/>
<text x="151.32" y="24.00" class="tick" text-anchor="start">18</text>
<text x="92.00" y="53.00" class="tick" text-anchor="end">100 KiB–1 MiB</text>
<rect x="98.00" y="42.00" width="200.00" height="16.00" class="box g3"/>
<text x="302.00" y="54.00" class="tick" text-anchor="start">73</text>
<text x="92.00" y="83.00" class="tick" text-anchor="end">1–10 MiB</text>
<rect x="98.00" y="72.00" width="145.21" height="16.00" class="box g3"/>
<text x="247.21" y="84.00" class="tick" text-anchor="start">53</text>
<text x="92.00" y="113.00" class="tick" text-anchor="end">10–100 MiB</text>
<rect x="98.00" y="102.00" width="54.79" height="16.00" class="box g3"/>
<text x="156.79" y="114.00" class="tick" text-anchor="start">20</text>
<text x="92.00" y="143.00" class="tick" text-anchor="end">100 MiB 이상</text>
<rect x="98.00" y="132.00" width="16.44" height="16.00" class="box g3"/>
<text x="118.44" y="144.00" class="tick" text-anchor="start">6</text>
<text x="170.00" y="170.00" class="cap" text-anchor="middle">out/dpkg_stats.txt — 이 기기, proot 에서 읽음</text>
</svg>
