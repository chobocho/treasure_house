<text x="280.00" y="115.00" class="tick" text-anchor="middle">250 Hz</text>
<line x1="224.00" y1="133.00" x2="210.00" y2="133.00" class="edge"/>
<polygon points="210.00,133.00 216.00,130.00 216.00,136.00" class="ah"/>
<rect x="122.00" y="120.00" width="88.00" height="26.00" class="box g5"/>
<text x="166.00" y="136.50" class="lbl" text-anchor="middle">믹서 M⁻¹</text>
<line x1="122.00" y1="133.00" x2="108.00" y2="133.00" class="edge"/>
<polygon points="108.00,133.00 114.00,130.00 114.00,136.00" class="ah"/>
<rect x="20.00" y="120.00" width="88.00" height="26.00" class="box g6"/>
<text x="64.00" y="136.50" class="lbl" text-anchor="middle">모터 4개</text>
<rect x="20.00" y="172.00" width="300.00" height="22.00" class="box g2"/>
<text x="170.00" y="186.50" class="lbl" text-anchor="middle">상태 추정(자이로·가속도계·GNSS·기압계)</text>
<line x1="64.00" y1="172.00" x2="64.00" y2="148.00" class="edge dim"/>
<polygon points="64.00,148.00 67.00,154.00 61.00,154.00" class="ah"/>
<line x1="166.00" y1="172.00" x2="166.00" y2="148.00" class="edge dim"/>
<polygon points="166.00,148.00 169.00,154.00 163.00,154.00" class="ah"/>
<line x1="268.00" y1="172.00" x2="268.00" y2="148.00" class="edge dim"/>
<polygon points="268.00,148.00 271.00,154.00 265.00,154.00" class="ah"/>
<text x="170.00" y="24.00" class="cap" text-anchor="middle">바깥 고리 = 느리게(50 Hz), 안쪽 고리 = 빠르게(250 Hz)</text>
<text x="170.00" y="212.00" class="cap" text-anchor="middle">안쪽 고리가 바깥보다 몇 배 빨라야 한다(T17) · 구조는 PX4 와 같다</text>
</svg>
