<text x="268.00" y="56.50" class="lbl" text-anchor="middle">자세 P(사원수)</text>
<text x="268.00" y="35.00" class="tick" text-anchor="middle">250 Hz</text>
<line x1="240.00" y1="66.00" x2="240.00" y2="120.00" class="edge"/>
<polygon points="240.00,120.00 237.00,114.00 243.00,114.00" class="ah"/>
