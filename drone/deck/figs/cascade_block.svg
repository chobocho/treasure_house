<svg class="diag" viewBox="0 0 340 228" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="캐스케이드 제어기 블록도(개념도)">
<style>
.diag text{font-family:-apple-system,"Noto Sans KR",sans-serif}
.frame{fill:none;stroke:var(--border,#c9d2da);stroke-width:1}
.ax{stroke:var(--muted,#5b6b7a);stroke-width:1;fill:none}
.grid{stroke:var(--border,#e1e7ec);stroke-width:.6;
 stroke-dasharray:2 3;fill:none}
svg.diag text.tick{font-size:8px;fill:var(--muted,#5b6b7a)}
svg.diag text.axname{font-size:9px;fill:var(--accent2,#1e293b);font-weight:700}
svg.diag text.key{font-size:9px;fill:var(--accent2,#1e293b);font-weight:700}
svg.diag text.cap{font-size:8.5px;fill:var(--muted,#5b6b7a)}
.cv{fill:none;stroke:var(--accent-ink,#0e7490);stroke-width:1.6}
.cv1{fill:none;stroke:var(--g1,#5c6b73);stroke-width:1.6}
.cv2{fill:none;stroke:var(--g2,#2f7a52);stroke-width:1.6}
.cv3{fill:none;stroke:var(--g3,#1d6fb8);stroke-width:1.6}
.cv4{fill:none;stroke:var(--g4,#7a4a8c);stroke-width:1.6}
.cv5{fill:none;stroke:var(--g5,#b5561b);stroke-width:1.6}
.cv6{fill:none;stroke:var(--g6,#a86b00);stroke-width:1.6}
.cv7{fill:none;stroke:var(--g7,#be185d);stroke-width:1.6}
.cv8{fill:none;stroke:var(--g8,#334155);stroke-width:1.6}
.dotg1{fill:var(--g1,#5c6b73)}.dotg2{fill:var(--g2,#2f7a52)}
.dotg3{fill:var(--g3,#1d6fb8)}.dotg4{fill:var(--g4,#7a4a8c)}
.dotg5{fill:var(--g5,#b5561b)}.dotg6{fill:var(--g6,#a86b00)}
.dotg7{fill:var(--g7,#be185d)}.dotg8{fill:var(--g8,#334155)}
.ring{fill:none;stroke:var(--accent-ink,#0e7490);stroke-width:1.2}
.cvd{fill:none;stroke:var(--muted,#5b6b7a);stroke-width:1.2;
 stroke-dasharray:4 3}
.dot{fill:var(--accent-ink,#0e7490);stroke:none}
.dot2{fill:var(--special-ink,#a16207);stroke:none}
.dot5{fill:var(--g5,#b5561b);stroke:none}
.dotn{fill:var(--muted,#5b6b7a);opacity:.35;stroke:none}
.cell{fill:var(--panel,#fff);stroke:var(--border,#c9d2da);
