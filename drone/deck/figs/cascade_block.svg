<rect x="122.00" y="40.00" width="88.00" height="26.00" class="box g1"/>
<text x="166.00" y="56.50" class="lbl" text-anchor="middle">속도 PID</text>
<text x="166.00" y="35.00" class="tick" text-anchor="middle">50 Hz</text>
<line x1="210.00" y1="53.00" x2="220.00" y2="53.00" class="edge"/>
<polygon points="220.00,53.00 214.00,56.00 214.00,50.00" class="ah"/>
