<text x="64.00" y="56.50" class="lbl" text-anchor="middle">위치 P</text>
<text x="64.00" y="35.00" class="tick" text-anchor="middle">50 Hz</text>
<line x1="108.00" y1="53.00" x2="118.00" y2="53.00" class="edge"/>
