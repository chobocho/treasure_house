<svg class="diag" viewBox="0 0 340 224" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="드론쇼 현장의 구성(개념도)">
<style>
.diag text{font-family:-apple-system,"Noto Sans KR",sans-serif}
