<svg class="diag" viewBox="0 0 340 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="쿼드로터의 자유물체도(옆에서 본 개념도)">
<style>
.diag text{font-family:-apple-system,"Noto Sans KR",sans-serif}
.frame{fill:none;stroke:var(--border,#c9d2da);stroke-width:1}
.ax{stroke:var(--muted,#5b6b7a);stroke-width:1;fill:none}
.grid{stroke:var(--border,#e1e7ec);stroke-width:.6;
 stroke-dasharray:2 3;fill:none}
svg.diag text.tick{font-size:8px;fill:var(--muted,#5b6b7a)}
svg.diag text.axname{font-size:9px;fill:var(--accent2,#1e293b);font-weight:700}
svg.diag text.key{font-size:9px;fill:var(--accent2,#1e293b);font-weight:700}
svg.diag text.cap{font-size:8.5px;fill:var(--muted,#5b6b7a)}
.cv{fill:none;stroke:var(--accent-ink,#0e7490);stroke-width:1.6}
.cv1{fill:none;stroke:var(--g1,#5c6b73);stroke-width:1.6}
.cv2{fill:none;stroke:var(--g2,#2f7a52);stroke-width:1.6}
.cv3{fill:none;stroke:var(--g3,#1d6fb8);stroke-width:1.6}
.cv4{fill:none;stroke:var(--g4,#7a4a8c);stroke-width:1.6}
.cv5{fill:none;stroke:var(--g5,#b5561b);stroke-width:1.6}
.cv6{fill:none;stroke:var(--g6,#a86b00);stroke-width:1.6}
.cv7{fill:none;stroke:var(--g7,#be185d);stroke-width:1.6}
.cv8{fill:none;stroke:var(--g8,#334155);stroke-width:1.6}
.dotg1{fill:var(--g1,#5c6b73)}.dotg2{fill:var(--g2,#2f7a52)}
.dotg3{fill:var(--g3,#1d6fb8)}.dotg4{fill:var(--g4,#7a4a8c)}
.dotg5{fill:var(--g5,#b5561b)}.dotg6{fill:var(--g6,#a86b00)}
.dotg7{fill:var(--g7,#be185d)}.dotg8{fill:var(--g8,#334155)}
.ring{fill:none;stroke:var(--accent-ink,#0e7490);stroke-width:1.2}
.cvd{fill:none;stroke:var(--muted,#5b6b7a);stroke-width:1.2;
 stroke-dasharray:4 3}
.dot{fill:var(--accent-ink,#0e7490);stroke:none}
.dot2{fill:var(--special-ink,#a16207);stroke:none}
.dot5{fill:var(--g5,#b5561b);stroke:none}
.dotn{fill:var(--muted,#5b6b7a);opacity:.35;stroke:none}
.cell{fill:var(--panel,#fff);stroke:var(--border,#c9d2da);
 stroke-width:1}
.cell.a{fill:rgba(34,211,238,.18)}
.cell.b{fill:rgba(184,50,42,.14)}
.cell.c{fill:rgba(46,158,91,.14)}
.cell.d{fill:rgba(217,119,6,.16)}
.cell.e{fill:rgba(245,158,11,.16)}
.cell.f{fill:rgba(91,107,122,.12)}
.cell.on{fill:var(--accent-ink,#0e7490);fill-opacity:.7}
.box{fill:var(--panel,#fafbfc);stroke:var(--border,#c9d2da);
 stroke-width:1.2}
.box.g1{stroke:var(--g1,#5c6b73);fill:rgba(92,107,115,.12)}
.box.g2{stroke:var(--g2,#2f7a52);fill:rgba(47,122,82,.12)}
.box.g3{stroke:var(--g3,#1d6fb8);fill:rgba(29,111,184,.12)}
.box.g4{stroke:var(--g4,#7a4a8c);fill:rgba(122,74,140,.12)}
.box.g5{stroke:var(--g5,#b5561b);fill:rgba(181,86,27,.12)}
.box.g6{stroke:var(--g6,#a86b00);fill:rgba(168,107,0,.12)}
.box.g7{stroke:var(--g7,#be185d);fill:rgba(190,24,93,.10)}
.box.g8{stroke:var(--g8,#334155);fill:rgba(51,65,85,.10)}
.box.off{fill:none;stroke-dasharray:3 2}
.arw{stroke:var(--net,#7d8a96);stroke-width:1.4;fill:none}
.arw.hot{stroke:var(--special-ink,#a16207);stroke-width:2.2}
svg.diag text.lbl{font-size:11px;fill:var(--muted,#5b6b7a)}
.diag text{fill:var(--text,#1c2530)}
.tie{stroke:var(--net,#7d8a96);stroke-width:1;fill:none}
.tie.hot{stroke:var(--special-ink,#a16207);stroke-width:1.6}
.edge{stroke:var(--net,#7d8a96);stroke-width:1.3;fill:none}
.edge.hot{stroke:var(--special-ink,#a16207);stroke-width:1.8}
.edge.dim{stroke-dasharray:3 2;opacity:.6}
.ah{fill:var(--net,#7d8a96);stroke:none}
.ah.hot{fill:var(--special-ink,#a16207)}
.bar{fill:var(--g2,#2f7a52);opacity:.8;stroke:none}
.bar.a{fill:var(--accent-ink,#0e7490)}
svg.diag text.mono{font-family:"DeckMono","D2Coding",ui-monospace,
 monospace;font-size:8.5px}
svg.diag text.hot{fill:var(--special-ink,#a16207);font-weight:700;
 font-size:9.5px}
</style>
<line x1="80.00" y1="110.00" x2="260.00" y2="110.00" class="edge"/>
<rect x="156.00" y="102.00" width="28.00" height="16.00" class="box g3"/>
<rect x="72.00" y="106.00" width="36.00" height="3.00" class="box g5"/>
<line x1="90.00" y1="104.00" x2="90.00" y2="54.00" class="edge hot"/>
<polygon points="90.00,54.00 93.00,60.00 87.00,60.00" class="ah hot"/>
<text x="90.00" y="48.00" class="tick" text-anchor="middle">T₂ = kT·Ω₂²</text>
<rect x="232.00" y="106.00" width="36.00" height="3.00" class="box g5"/>
<line x1="250.00" y1="104.00" x2="250.00" y2="54.00" class="edge hot"/>
<polygon points="250.00,54.00 253.00,60.00 247.00,60.00" class="ah hot"/>
<text x="250.00" y="48.00" class="tick" text-anchor="middle">T₁ = kT·Ω₁²</text>
<line x1="170.00" y1="120.00" x2="170.00" y2="172.00" class="edge"/>
<polygon points="170.00,172.00 167.00,166.00 173.00,166.00" class="ah"/>
<text x="176.00" y="168.00" class="tick" text-anchor="start">mg (무게)</text>
<line x1="170.00" y1="110.00" x2="204.00" y2="110.00" class="edge dim"/>
<polygon points="204.00,110.00 198.00,113.00 198.00,107.00" class="ah"/>
<text x="206.00" y="121.00" class="tick" text-anchor="start">x_B</text>
<line x1="170.00" y1="110.00" x2="170.00" y2="76.00" class="edge dim"/>
<polygon points="170.00,76.00 173.00,82.00 167.00,82.00" class="ah"/>
<text x="175.00" y="82.00" class="tick" text-anchor="start">z_B</text>
<text x="170.00" y="22.00" class="cap" text-anchor="middle">추력은 모두 z_B 방향 — 옆으로 가려면 몸을 기울인다</text>
<text x="170.00" y="190.00" class="cap" text-anchor="middle">토크: 좌우 추력 차 × 팔 길이 = 굴림·키놀이, 반토크 kQ·Ω² 의 합 = 요</text>
<text x="170.00" y="202.00" class="cap" text-anchor="middle">8부 T8(뉴턴-오일러)·T9(믹서)의 그림</text>
</svg>
