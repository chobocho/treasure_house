<svg class="diag" viewBox="0 0 660 250" role="img">
<title>5장으로 8방향 — 좌우 반전</title>
<rect class="tl on" x="180" y="36" width="40" height="40"/>
<text class="lbl" x="200" y="54" text-anchor="middle">N</text>
<text class="lbl" x="200" y="68" text-anchor="middle">그림 0</text>
<rect class="tl on" x="254" y="36" width="40" height="40"/>
<text class="lbl" x="274" y="54" text-anchor="middle">NE</text>
<text class="lbl" x="274" y="68" text-anchor="middle">그림 1</text>
<rect class="tl on" x="254" y="110" width="40" height="40"/>
<text class="lbl" x="274" y="128" text-anchor="middle">E</text>
<text class="lbl" x="274" y="142" text-anchor="middle">그림 2</text>
<rect class="tl on" x="254" y="184" width="40" height="40"/>
<text class="lbl" x="274" y="202" text-anchor="middle">SE</text>
<text class="lbl" x="274" y="216" text-anchor="middle">그림 3</text>
<rect class="tl on" x="180" y="184" width="40" height="40"/>
<text class="lbl" x="200" y="202" text-anchor="middle">S</text>
<text class="lbl" x="200" y="216" text-anchor="middle">그림 4</text>
<rect class="tl cool" x="106" y="184" width="40" height="40"/>
<text class="lbl" x="126" y="202" text-anchor="middle">SW</text>
<text class="lbl" x="126" y="216" text-anchor="middle">그림 3</text>
<rect class="tl cool" x="106" y="110" width="40" height="40"/>
<text class="lbl" x="126" y="128" text-anchor="middle">W</text>
<text class="lbl" x="126" y="142" text-anchor="middle">그림 2</text>
<rect class="tl cool" x="106" y="36" width="40" height="40"/>
<text class="lbl" x="126" y="54" text-anchor="middle">NW</text>
<text class="lbl" x="126" y="68" text-anchor="middle">그림 1</text>
<circle class="tl hot" cx="200" cy="130" r="14"/>
<text class="lbl" x="200" y="134" text-anchor="middle">유닛</text>
<text class="lbl" x="360" y="44" text-anchor="start">노랑 = 실제로 그린 다섯 장 (N NE E SE S)</text>
<text class="lbl" x="360" y="62" text-anchor="start">파랑 = 반전으로 얻는 세 장 (SW W NW)</text>
<text class="lbl" x="360" y="90" text-anchor="start">메모리와 아티스트 시간을 동시에 아끼는</text>
<text class="lbl" x="360" y="106" text-anchor="start">도스 시절의 표준 요령이다.</text>
<text class="lbl" x="360" y="134" text-anchor="start">반전은 블릿 안에서 런의 순서와</text>
<text class="lbl" x="360" y="150" text-anchor="start">런 안의 픽셀 순서를 뒤집어 처리한다 —</text>
<text class="lbl" x="360" y="166" text-anchor="start">별도의 스프라이트를 만들지 않는다.</text>
<text class="lbl" x="360" y="194" text-anchor="start">상자 안에서 뒤집으므로 기준점이 1px 옮겨진다.</text>
<text class="lbl" x="360" y="210" text-anchor="start">세 언어가 같은 자리에 그리는 것이 그보다 중요하다.</text>
</svg>
