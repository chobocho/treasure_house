<svg class="diag" viewBox="0 0 660 250" role="img">
<title>타일 예약 불변식 R — 두 칸을 쥐는 구간</title>
<text class="lbl" x="78" y="34" text-anchor="middle">걸음 전</text>
<rect class="tl on" x="24" y="60" width="54" height="54"/>
<text class="lbl" x="51" y="91" text-anchor="middle">a</text>
<rect class="tl" x="84" y="60" width="54" height="54"/>
<text class="lbl" x="111" y="91" text-anchor="middle">b</text>
<circle class="tl hot" cx="51" cy="140" r="9"/>
<text class="lbl" x="78" y="170" text-anchor="middle">resv[a]=나</text>
<text class="lbl" x="236" y="34" text-anchor="middle">걸음 시작</text>
<rect class="tl on" x="182" y="60" width="54" height="54"/>
<text class="lbl" x="209" y="91" text-anchor="middle">a</text>
<rect class="tl hot" x="242" y="60" width="54" height="54"/>
<text class="lbl" x="269" y="91" text-anchor="middle">b</text>
<circle class="tl hot" cx="218" cy="140" r="9"/>
<text class="lbl" x="236" y="170" text-anchor="middle">resv[b]=나 (두 칸)</text>
<text class="lbl" x="394" y="34" text-anchor="middle">진행 중</text>
<rect class="tl on" x="340" y="60" width="54" height="54"/>
<text class="lbl" x="367" y="91" text-anchor="middle">a</text>
<rect class="tl on" x="400" y="60" width="54" height="54"/>
<text class="lbl" x="427" y="91" text-anchor="middle">b</text>
<circle class="tl hot" cx="409" cy="140" r="9"/>
<text class="lbl" x="394" y="170" text-anchor="middle">prog &lt; 1</text>
<text class="lbl" x="552" y="34" text-anchor="middle">도착</text>
<rect class="tl" x="498" y="60" width="54" height="54"/>
<text class="lbl" x="525" y="91" text-anchor="middle">a</text>
<rect class="tl on" x="558" y="60" width="54" height="54"/>
<text class="lbl" x="585" y="91" text-anchor="middle">b</text>
<circle class="tl hot" cx="585" cy="140" r="9"/>
<text class="lbl" x="552" y="170" text-anchor="middle">resv[a]=0</text>
<text x="24" y="20" text-anchor="start">한 칸만 쥐면 두 유닛이 서로의 칸으로 동시에 들어가 겹친다</text>
<text class="lbl" x="24" y="232" text-anchor="start">주황 칸이 이번 걸음에 새로 쥔 칸 · 아래 원이 유닛의 실제 위치</text>
</svg>
