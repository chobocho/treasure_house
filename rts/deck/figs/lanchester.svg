<text class="lbl" x="546" y="120" text-anchor="start">√(αA₀²−βB₀²)/α = 30.0</text>
<text x="60" y="24" text-anchor="start">굵은 선 A(50기) · 가는 선 B(40기) · α = β · 가로는 틱</text>
<text class="lbl" x="60" y="256" text-anchor="start">이산 시뮬은 54틱에 B 를 0 으로 만들었고 폐형해는 54.9틱을 준다 — 부대가 작을수록 이산성이 지배한다</text>
<text class="lbl" x="60" y="274" text-anchor="start">α·A² − β·B² 는 불변이다(정리 15.3). 그래서 수가 2배면 전투력이 4배다.</text>
