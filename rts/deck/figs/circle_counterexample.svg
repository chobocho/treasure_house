<text class="lbl" x="236" y="46" text-anchor="start">칸 안의 숫자는 i² + j²</text>
<text class="lbl" x="236" y="66" text-anchor="start">r² = 4 이므로 5 는 원 밖이다</text>
<text class="lbl" x="236" y="86" text-anchor="start">그런데 외곽선 알고리즘은 (2,1) 을 찍는다</text>
<text class="lbl" x="236" y="106" text-anchor="start">시야 마스크로 쓰면 칸 수가</text>
<text class="lbl" x="236" y="122" text-anchor="start">가우스 원 문제의 값과 어긋난다</text>
<text class="lbl" x="236" y="146" text-anchor="start">그래서 이 엔진은 행 span 을 쓴다 (§6.2)</text>
