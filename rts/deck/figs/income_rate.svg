<text x="60" y="24" text-anchor="start">가로: 왕복 타일 · 세로: 크레딧/틱 (채집기 속도 1.2 px/틱)</text>
<text class="lbl" x="60" y="268" text-anchor="start">rate = 적재 / (2·d/v + 적재/채굴속도 + 반납틱) — 분모의 세 항이 왕복·채굴·반납이다</text>
<text class="lbl" x="60" y="286" text-anchor="start">d = 0 이어도 100/(20+12) = 3.125 를 넘지 못한다. 정제소를 광맥에 붙여도 상한이 있다.</text>
<text class="lbl" x="60" y="304" text-anchor="start">1200틱 시나리오의 실측은 3333/10000 — 차이는 채집기끼리의 길막이다.</text>
