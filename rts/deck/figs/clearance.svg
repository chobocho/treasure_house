<text class="lbl" x="396" y="44" text-anchor="start">clear[x][y] = 그 칸을 좌상단으로 하는</text>
<text class="lbl" x="396" y="60" text-anchor="start">모두 통행 가능한 정사각형의 최대 변</text>
<text class="lbl" x="396" y="84" text-anchor="start">= 1 + min(오른쪽, 아래, 오른쪽아래)</text>
<text class="lbl" x="396" y="108" text-anchor="start">오른쪽 아래에서 한 번 훑으면 끝 — O(맵)</text>
<text class="lbl" x="396" y="132" text-anchor="start">크기 s 유닛은 clear &gt;= s 인 칸만 지난다</text>
