<svg class="diag" viewBox="0 0 680 260" role="img">
<title>다이얼 양동이 큐 — 원형 15칸</title>
<rect class="tl" x="187" y="35" width="26" height="22"/>
<text class="lbl" x="200" y="50" text-anchor="middle">0</text>
<rect class="tl" x="221.166" y="42.2622" width="26" height="22"/>
<text class="lbl" x="234.166" y="57.2622" text-anchor="middle">1</text>
<rect class="tl" x="249.424" y="62.793" width="26" height="22"/>
<text class="lbl" x="262.424" y="77.793" text-anchor="middle">2</text>
<rect class="tl on" x="266.889" y="93.0426" width="26" height="22"/>
<text class="lbl" x="279.889" y="108.043" text-anchor="middle">3</text>
<rect class="tl hot" x="270.54" y="127.78" width="26" height="22"/>
<text class="lbl" x="283.54" y="142.78" text-anchor="middle">4</text>
<rect class="tl" x="259.746" y="161" width="26" height="22"/>
<text class="lbl" x="272.746" y="176" text-anchor="middle">5</text>
<rect class="tl" x="236.374" y="186.957" width="26" height="22"/>
<text class="lbl" x="249.374" y="201.957" text-anchor="middle">6</text>
<rect class="tl" x="204.465" y="201.164" width="26" height="22"/>
<text class="lbl" x="217.465" y="216.164" text-anchor="middle">7</text>
<rect class="tl" x="169.535" y="201.164" width="26" height="22"/>
<text class="lbl" x="182.535" y="216.164" text-anchor="middle">8</text>
<rect class="tl" x="137.626" y="186.957" width="26" height="22"/>
<text class="lbl" x="150.626" y="201.957" text-anchor="middle">9</text>
<rect class="tl" x="114.254" y="161" width="26" height="22"/>
<text class="lbl" x="127.254" y="176" text-anchor="middle">10</text>
<rect class="tl" x="103.46" y="127.78" width="26" height="22"/>
<text class="lbl" x="116.46" y="142.78" text-anchor="middle">11</text>
<rect class="tl" x="107.111" y="93.0426" width="26" height="22"/>
<text class="lbl" x="120.111" y="108.043" text-anchor="middle">12</text>
<rect class="tl" x="124.576" y="62.793" width="26" height="22"/>
<text class="lbl" x="137.576" y="77.793" text-anchor="middle">13</text>
<rect class="tl on" x="152.834" y="42.2622" width="26" height="22"/>
<text class="lbl" x="165.834" y="57.2622" text-anchor="middle">14</text>
<circle class="tl hot" cx="200" cy="130" r="16"/>
<text class="lbl" x="200" y="134" text-anchor="middle">cur</text>
<text class="lbl" x="320" y="44" text-anchor="start">지금 처리 중인 거리 cur 의 양동이(주황)에서</text>
<text class="lbl" x="320" y="60" text-anchor="start">칸을 꺼낸다. 새로 갱신되는 거리 nd 는</text>
<text class="lbl" x="320" y="76" text-anchor="start">cur + 10 이나 cur + 14 다.</text>
<text class="lbl" x="320" y="102" text-anchor="start">정리 8.3.  cur ≤ nd &lt; cur + 15</text>
<text class="lbl" x="320" y="126" text-anchor="start">따라서 nd mod 15 는 cur mod 15 와</text>
<text class="lbl" x="320" y="142" text-anchor="start">절대 겹치지 않는다 — 원형 15칸이면</text>
<text class="lbl" x="320" y="158" text-anchor="start">덮어쓰기가 일어나지 않는다.</text>
<text class="lbl" x="320" y="184" text-anchor="start">힙이 필요 없다. push/pop 이 O(1) 이고</text>
<text class="lbl" x="320" y="200" text-anchor="start">언어별 정렬 구현에 의존하지도 않는다.</text>
<text class="lbl" x="24" y="240" text-anchor="start">간선 비용이 두 종류(직선 10 · 대각 14)뿐이라 가능한 최적화다.</text>
</svg>
