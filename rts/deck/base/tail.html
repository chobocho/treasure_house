</main>

<!-- ============================================================
     코드 하이라이터 — <pre><code data-lang="xx"> 를 런타임에 토크나이징한다.
     손으로 <span class="kw"> 를 붙이지 말 것. 언어를 추가하려면 KW/CFG 에 한 줄.
     ============================================================ -->
<script>
(function () {
  'use strict';
  var KW = {
    js: 'const|let|var|function|return|if|else|for|while|try|catch|finally|throw|new|class|extends|super|this|async|await|import|export|from|default|typeof|instanceof|delete|in|of|do|switch|case|break|continue|yield|static|get|set|null|undefined|true|false|void',
    ts: 'const|let|var|function|return|if|else|for|while|try|catch|finally|throw|new|class|extends|implements|interface|type|enum|super|this|async|await|import|export|from|default|typeof|instanceof|delete|in|of|do|switch|case|break|continue|yield|static|readonly|public|private|protected|declare|as|is|keyof|infer|satisfies|null|undefined|true|false|void|never|unknown|any|string|number|boolean|Promise|Record|Set|Map|Array',
    py: 'def|class|return|if|elif|else|for|while|try|except|finally|raise|with|as|import|from|lambda|yield|async|await|pass|break|continue|global|nonlocal|assert|del|in|is|not|and|or|None|True|False|self|match|case',
    c: 'auto|break|case|char|const|continue|default|do|double|else|enum|extern|float|for|goto|if|inline|int|long|register|restrict|return|short|signed|sizeof|static|struct|switch|typedef|union|unsigned|void|volatile|while|_Bool|size_t|NULL|true|false',
    cpp: 'auto|bool|break|case|catch|char|class|const|constexpr|continue|default|delete|do|double|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|nullptr|operator|private|protected|public|return|short|signed|sizeof|static|struct|switch|template|this|throw|true|try|typedef|typename|union|unsigned|using|virtual|void|volatile|while',
    go: 'package|import|func|return|if|else|for|range|switch|case|default|break|continue|go|defer|select|chan|map|struct|interface|type|var|const|make|new|len|cap|append|copy|delete|panic|recover|nil|true|false|string|int|int64|uint32|uint8|byte|rune|bool|error|any',
    rust: 'fn|let|mut|const|static|if|else|match|loop|while|for|in|break|continue|return|struct|enum|impl|trait|type|use|mod|pub|crate|self|Self|where|as|ref|move|dyn|async|await|unsafe|true|false|Some|None|Ok|Err|Option|Result|String|Vec|Box',
    java: 'package|import|public|private|protected|static|final|abstract|class|interface|enum|record|extends|implements|return|if|else|for|while|do|switch|case|default|break|continue|try|catch|finally|throw|throws|new|this|super|void|int|long|double|boolean|char|byte|String|var|null|true|false|instanceof',
    lua: 'and|break|do|else|elseif|end|false|for|function|goto|if|in|local|nil|not|or|repeat|return|then|true|until|while|self|require|pairs|ipairs|type|setmetatable|getmetatable|tostring|tonumber|table|string|math|io|os',
    rb: 'def|end|class|module|if|elsif|else|unless|case|when|while|until|for|in|do|begin|rescue|ensure|raise|return|yield|self|nil|true|false|require|attr_accessor|puts|lambda|proc|then',
    sh: 'if|then|else|elif|fi|for|in|do|done|while|case|esac|function|return|export|local|source|echo|cd|ls|cat|grep|sed|awk|curl|make|gcc|git|sudo|apt|npm|python3|pip|go|docker|kubectl|systemctl',
    sql: 'SELECT|FROM|WHERE|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|INDEX|ALTER|DROP|PRIMARY|KEY|FOREIGN|REFERENCES|NOT|NULL|DEFAULT|UNIQUE|ON|USING|WITH|JOIN|LEFT|INNER|GROUP|ORDER|BY|LIMIT|AND|OR|IN|AS|BEGIN|COMMIT|TEXT|INTEGER|BOOLEAN|TIMESTAMP',
    lisp: 'define|lambda|let|let\\*|letrec|if|cond|else|case|when|unless|begin|set!|quote|quasiquote|unquote|and|or|not|car|cdr|cons|list|append|map|for-each|apply|null\\?|eq\\?|equal\\?|display|newline|define-syntax|syntax-rules|do|delay|force',
    css: 'important|media|import|keyframes|supports|font-face|root|hover|focus|before|after|not|nth-child',
    json: 'true|false|null',
    yaml: 'true|false|null|yes|no|on|off',
    http: 'GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|HTTP',
    bas: 'PRINT|INPUT|LET|IF|THEN|ELSE|GOTO|GOSUB|RETURN|FOR|TO|STEP|NEXT|WHILE|WEND|DIM|END|STOP|REM|DATA|READ|RESTORE|DEF|FN|ON|CLS|RUN|LIST|LOAD|SAVE|NEW|AND|OR|NOT|MOD'
  };
  //  lc = 줄 주석 접두사들 · bc = /* */ 블록 주석 · bt = 백틱 문자열
  //  tq = 파이썬 삼중 따옴표 · tag = HTML/XML 태그 · header = HTTP 헤더 이름
  var CFG = {
    js:   { lc: ['//'], bc: 1, bt: 1, kw: KW.js },
    ts:   { lc: ['//'], bc: 1, bt: 1, kw: KW.ts },
    py:   { lc: ['#'], tq: 1, kw: KW.py },
    c:    { lc: ['//'], bc: 1, kw: KW.c, pp: 1 },
    cpp:  { lc: ['//'], bc: 1, kw: KW.cpp, pp: 1 },
    go:   { lc: ['//'], bc: 1, bt: 1, kw: KW.go },
    rust: { lc: ['//'], bc: 1, kw: KW.rust },
    java: { lc: ['//'], bc: 1, kw: KW.java },
    lua:  { lc: ['--'], kw: KW.lua },
    rb:   { lc: ['#'], kw: KW.rb },
    sh:   { lc: ['#'], kw: KW.sh },
    sql:  { lc: ['--'], bc: 1, kw: KW.sql },
    lisp: { lc: [';'], kw: KW.lisp },
    html: { tag: 1, kw: '' },
    xml:  { tag: 1, kw: '' },
    css:  { bc: 1, kw: KW.css },
    json: { lc: ['//'], kw: KW.json },
    yaml: { lc: ['#'], kw: KW.yaml },
    http: { lc: ['#'], kw: KW.http, header: 1 },
    bas:  { lc: ["'"], kw: KW.bas },
    make: { lc: ['#'], kw: KW.sh },
    text: { kw: '' }
  };
  var ALIAS = {
    javascript: 'js', typescript: 'ts', python: 'py', shell: 'sh', bash: 'sh', zsh: 'sh',
    'c++': 'cpp', cc: 'cpp', h: 'c', golang: 'go', ruby: 'rb', scheme: 'lisp', racket: 'lisp',
    clojure: 'lisp', el: 'lisp', basic: 'bas', htm: 'html', yml: 'yaml', makefile: 'make',
    gomod: 'text', diff: 'text', ini: 'yaml', toml: 'yaml'
  };

  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  var cache = {};
  function reFor(lang) {
    if (cache[lang]) return cache[lang];
    var c = CFG[lang] || CFG.text, p = [];
    if (c.tag) p.push('<' + '!--[\\s\\S]*?--' + '>');
    if (c.bc) p.push('/\\*[\\s\\S]*?\\*/');
    (c.lc || []).forEach(function (x) { p.push(escRe(x) + '[^\\n]*'); });
    if (c.tq) { p.push('"""[\\s\\S]*?"""'); p.push("'''[\\s\\S]*?'''"); }
    if (c.pp) p.push('^\\s*#\\s*[a-z]+');
    if (c.header) p.push('^[A-Za-z][A-Za-z0-9-]*(?=:)');
    if (c.tag) p.push('</?[A-Za-z][A-Za-z0-9-]*');
    p.push('"(?:\\\\.|[^"\\\\\\n])*"');
    p.push("'(?:\\\\.|[^'\\\\\\n])*'");
    if (c.bt) p.push('`(?:\\\\.|[^`\\\\])*`');
    p.push('\\b\\d[\\dA-Fa-fx_]*(?:\\.\\d+)?\\b');
    if (c.kw) p.push('\\b(?:' + c.kw + ')\\b');
    if (!c.tag) p.push('[A-Za-z_$][\\w$]*(?=\\s*\\()');
    cache[lang] = { re: new RegExp(p.join('|'), 'gm'), cfg: c };
    return cache[lang];
  }

  function classify(tok, c) {
    var ch = tok[0];
    if (tok.indexOf('/*') === 0 || tok.indexOf('<!--') === 0) return 'cm';
    for (var i = 0; i < (c.lc || []).length; i++) if (tok.indexOf(c.lc[i]) === 0) return 'cm';
    if (ch === '<') return 'kw';
    if (ch === '"' || ch === "'" || ch === '`') return 'st';
    if (ch >= '0' && ch <= '9') return 'nu';
    if (tok.charAt(0) === '#' || /^\s*#/.test(tok)) return 'kw';
    if (c.kw && new RegExp('^(?:' + c.kw + ')$').test(tok)) return 'kw';
    if (c.header && /^[A-Za-z][A-Za-z0-9-]*$/.test(tok)) return 'hd';
    return 'fn';
  }

  function hl(el) {
    if (el.dataset.hl) return;
    el.dataset.hl = '1';
    var lang = (el.dataset.lang || 'text').toLowerCase();
    lang = ALIAS[lang] || lang;
    var info = reFor(lang), src = el.textContent, out = '', last = 0, m;
    info.re.lastIndex = 0;
    while ((m = info.re.exec(src)) !== null) {
      if (m.index > last) out += esc(src.slice(last, m.index));
      out += '<span class="' + classify(m[0], info.cfg) + '">' + esc(m[0]) + '</span>';
      last = m.index + m[0].length;
      if (m[0].length === 0) info.re.lastIndex++;
    }
    el.innerHTML = out + esc(src.slice(last));
  }

  window.__highlight = function (root) {
    (root || document).querySelectorAll('pre > code[data-lang]').forEach(hl);
  };
})();
</script>

<!-- ============================================================
     데모 프레임워크 — __demo(id, fn) 로 등록하면 해당 슬라이드가
     처음 열릴 때 한 번 배선된다. 퀴즈(.quiz[data-quiz])도 여기서 처리.
     ============================================================ -->
<script>
(function () {
  'use strict';
  var REG = Object.create(null);
  window.__demo = function (id, fn) { REG[id] = fn; };

  function out(host) { return host.querySelector('.out'); }
  function w(host, html, cls) {
    var o = out(host); if (!o) return;
    o.innerHTML = cls ? '<span class="' + cls + '">' + html + '</span>' : html;
  }
  function add(host, html, cls) {
    var o = out(host); if (!o) return;
    o.innerHTML += (o.innerHTML ? '\n' : '') + (cls ? '<span class="' + cls + '">' + html + '</span>' : html);
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function num(n) {
    if (typeof n !== 'number') return String(n);
    if (!isFinite(n)) return n > 0 ? 'inf' : (n < 0 ? '-inf' : 'nan');
    if (Number.isInteger(n) && Math.abs(n) < 1e15) return String(n);
    return String(Number(n.toPrecision(6)));
  }
  function show(v) {
    if (v === null || v === undefined) return 'null';
    if (typeof v === 'string') return v;
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    if (typeof v === 'number') return num(v);
    if (Array.isArray(v)) return '[' + v.map(show).join(', ') + ']';
    return String(v);
  }
  var api = { w: w, add: add, esc: esc, show: show, num: num, out: out };
  window.__api = api;

  window.__initDemos = function (root) {
    var scope = root || document;
    // 루트 자신이 대상일 수도 있다 (예: <article class="card quiz" data-quiz>)
    function all(sel) {
      var list = [].slice.call(scope.querySelectorAll(sel));
      if (scope.matches && scope.matches(sel)) list.unshift(scope);
      return list;
    }
    all('.demo[data-demo]').forEach(function (host) {
      if (host.dataset.wired) return;
      host.dataset.wired = '1';
      var fn = REG[host.getAttribute('data-demo')];
      if (!fn) return;
      try { fn(host, api); } catch (e) { w(host, '데모 오류: ' + esc(e.message), 'bad'); }
    });
    all('.quiz[data-quiz]').forEach(function (q) {
      if (q.dataset.wired) return;
      q.dataset.wired = '1';
      var b = q.querySelector('button');
      if (!b) return;
      b.addEventListener('click', function () {
        q.classList.toggle('open');
        b.textContent = q.classList.contains('open') ? '답 숨기기' : '답 보기';
      });
    });
  };
})();
</script>

<!-- ===== 덱마다 다른 부분: 데모 함수들 (예시 하나) ===== -->
<script>
(function () {
  'use strict';
  __demo('sample', function (host, api) {
    var inp = host.querySelector('[data-n]');

    host.querySelector('[data-run]').addEventListener('click', run);
    host.querySelector('[data-reset]').addEventListener('click', function () {

      api.w(host, '초기화했습니다.', 'dim');
    });
    api.w(host, '숫자를 넣고 계산을 눌러 보세요.', 'dim');
  });
})();
</script>

<!-- ===== 하단 내비 · 목차 오버레이 (id 는 입력 셸이 찾는 이름이므로 바꾸지 말 것) ===== -->
<nav id="deckNav">
  <button id="prevBtn" aria-label="이전 슬라이드">◀</button>
  <span id="counter">1 / 1</span>
  <button id="nextBtn" aria-label="다음 슬라이드">▶</button>
</nav>
<div id="deckToc">
  <h3>📑 전체 목차</h3>
  <div id="tocBody"></div>
  <button id="tocClose">닫기</button>
</div>

<!-- ============================================================
     슬라이드 엔진 — 페이지 번호 자동 부여, 목차 생성, 해시 내비게이션,
     진행 막대, 키보드·스와이프. 덱을 만들 때 고칠 일이 없다.
     ============================================================ -->
<script>
(function () {
  var slides = [].slice.call(document.querySelectorAll('main > article'));
  if (!slides.length) return;
  var TOTAL = slides.length;
  var stage = document.querySelector('main');
  var bar = document.getElementById('bar');
  var counter = document.getElementById('counter');
  var toc = document.getElementById('deckToc');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var sel = document.getElementById('nav');
  var cur = 0;

  // ---- 페이지 번호 자동 부여 (하드코딩 금지의 이유) ----
  slides.forEach(function (s, i) {
    var p = document.createElement('span');
    p.className = 'pno'; p.textContent = i + 1; s.prepend(p);
  });

  var idx = new Map();
  slides.forEach(function (s, i) { idx.set(s.id, i); });
  // 슬라이드 안쪽 요소의 id 도 해당 슬라이드로 매핑 — 상호참조 링크 대응
  var sub = new Map();
  slides.forEach(function (s, i) {
    s.querySelectorAll('[id]').forEach(function (el) {
      if (!idx.has(el.id) && !sub.has(el.id)) sub.set(el.id, i);
    });
  });

  // ---- 챕터 그룹: .section 슬라이드가 새 그룹을 연다 ----
  var secOf = [], secTitle = '표지';
  slides.forEach(function (s, i) {
    if (s.classList.contains('section') && !s.classList.contains('cover')) {
      var h = s.querySelector('h1, h2');
      secTitle = h ? h.textContent.replace(/\s+/g, ' ').trim() : '';
    }
    secOf[i] = secTitle;
  });

  // ---- 목차 오버레이 생성 ----
  var tocBody = document.getElementById('tocBody');
  var curSec = null, secDiv = null;
  slides.forEach(function (s, i) {
    if (secOf[i] !== curSec) {
      curSec = secOf[i];
      secDiv = document.createElement('div');
      secDiv.className = 'tocsec';
      var h4 = document.createElement('h4');
      h4.textContent = curSec;
      secDiv.appendChild(h4);
      tocBody.appendChild(secDiv);
    }
    var a = document.createElement('a');
    a.href = '#' + s.id;
    a.dataset.go = i;
    var b = document.createElement('b');
    b.textContent = i + 1;
    a.appendChild(b);
    var h = s.querySelector('h1, h2, h3');
    a.append(h ? h.textContent.replace(/\s+/g, ' ').trim() : '(제목 없음)');
    secDiv.appendChild(a);
  });

  // ---- 슬라이드 전환 ----
  function show(i, push) {
    i = Math.max(0, Math.min(TOTAL - 1, i));
    if (i === cur && push !== 'force') { sync(); return; }
    slides[cur].classList.remove('on');
    cur = i;
    slides[cur].classList.add('on');
    stage.scrollTop = 0;
    sync();
    if (push !== false) history.replaceState(null, '', '#' + slides[cur].id);
  }
  function jump(id, push) {
    if (idx.has(id)) { show(idx.get(id), push); return true; }
    if (sub.has(id)) {
      show(sub.get(id), push);
      var el = document.getElementById(id);
      if (el) requestAnimationFrame(function () { el.scrollIntoView({ block: 'start' }); });
      return true;
    }
    return false;
  }
  function sync() {
    bar.style.width = ((cur + 1) / TOTAL * 100) + '%';
    counter.textContent = (cur + 1) + ' / ' + TOTAL;
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === TOTAL - 1;
    // 지금 보이는 슬라이드만 하이라이팅·데모 배선 (첫 진입에서 한 번)
    if (window.__highlight) window.__highlight(slides[cur]);
    if (window.__initDemos) window.__initDemos(slides[cur]);
  }

  // ---- 입력 ----
  prevBtn.onclick = function () { show(cur - 1); };
  nextBtn.onclick = function () { show(cur + 1); };
  document.getElementById('tocBtn').onclick = function () { toc.classList.add('on'); };
  document.getElementById('tocClose').onclick = function () { toc.classList.remove('on'); };
  toc.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-go]');
    if (!a) return;
    e.preventDefault();
    toc.classList.remove('on');
    show(+a.dataset.go);
  });
  if (sel) sel.addEventListener('change', function (e) {
    if (idx.has(e.target.value)) show(idx.get(e.target.value));
    e.target.selectedIndex = 0;
  });

  // 본문 안 앵커 클릭도 슬라이드 점프로
  stage.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = decodeURIComponent(a.getAttribute('href').slice(1));
    if (jump(id)) e.preventDefault();
  });

  addEventListener('keydown', function (e) {
    if (toc.classList.contains('on')) {
      if (e.key === 'Escape') toc.classList.remove('on');
      return;
    }
    if (e.target === sel) return;
    // 데모가 이미 이 키를 가져갔으면(preventDefault) 슬라이드를 넘기지 않는다.
    // ↑↓ 핸들러는 처음부터 이 검사를 했는데 ←→ 쪽에만 빠져 있었다.
    if (e.defaultPrevented || e.ctrlKey || e.altKey || e.metaKey) return;
    // 입력 컨트롤 안에서는 ←→ 가 값을 바꾸는 키다. 캔버스는 빼 둔다 —
    // 키를 안 쓰는 데모 위에서도 페이지를 못 넘기면 곤란하기 때문이고,
    // 키를 쓰는 데모는 위의 defaultPrevented 로 이미 걸러진다.
    var tt = ((e.target && e.target.tagName) || '').toUpperCase();
    if (tt === 'INPUT' || tt === 'TEXTAREA' || tt === 'SELECT' ||
        (e.target && e.target.isContentEditable === true)) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { show(cur + 1); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { show(cur - 1); e.preventDefault(); }
    else if (k === 'Home') { show(0); e.preventDefault(); }
    else if (k === 'End') { show(TOTAL - 1); e.preventDefault(); }
    else if (k === 't' || k === 'T') { toc.classList.toggle('on'); }
  });

  // 스와이프 — 코드·표·데모의 가로 스크롤과 충돌하지 않게 걸러낸다
  var tx = 0, ty = 0, tt = 0, guard = false;
  stage.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { guard = true; return; }
    var t = e.touches[0];
    guard = !!e.target.closest('pre, .tblwrap, .demo, .term, .sig, .pkgtree');
    tx = t.clientX; ty = t.clientY; tt = Date.now();
  }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (guard) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - tx, dy = t.clientY - ty;
    if (Date.now() - tt < 600 && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.8)
      show(cur + (dx < 0 ? 1 : -1));
  }, { passive: true });

  // ---- 시작 슬라이드: URL 해시 우선 ----
  var h0 = decodeURIComponent(location.hash.slice(1));
  cur = idx.has(h0) ? idx.get(h0) : (sub.has(h0) ? sub.get(h0) : 0);
  slides[cur].classList.add('on');
  sync();
  addEventListener('hashchange', function () {
    jump(decodeURIComponent(location.hash.slice(1)), false);
  });
})();
</script>
<!-- ===== deck-input-shim v1 : 방향키(↑↓ 스크롤 / ←→ 페이지) + 게임패드 ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckInputShim) return;
  window.__deckInputShim = true;

  /* ---------- 지금 보이는 슬라이드의 스크롤 컨테이너 찾기 ---------- */
  function scrollableAt(x, y) {
    if (!document.elementFromPoint) return null;
    var n = document.elementFromPoint(x, y);
    while (n && n !== document.documentElement) {
      var oy = getComputedStyle(n).overflowY;
      if ((oy === 'auto' || oy === 'scroll' || oy === 'overlay') &&
          n.scrollHeight - n.clientHeight > 4) return n;
      n = n.parentElement;
    }
    return null;
  }
  function scroller() {
    var el = scrollableAt(innerWidth / 2, innerHeight / 2) ||
             scrollableAt(innerWidth / 2, innerHeight * 0.35);
    if (el) return el;
    var m = document.querySelector('main');
    if (m && m.scrollHeight - m.clientHeight > 4) return m;
    return document.scrollingElement || document.documentElement;
  }
  function viewH(el) {
    return (el === document.scrollingElement || el === document.documentElement)
      ? innerHeight : el.clientHeight;
  }
  function isPageScroller(el) {
    return el === document.scrollingElement || el === document.documentElement || el === document.body;
  }
  function scrollStep(dir, smooth) {
    var el = scroller();
    el.scrollBy({ top: dir * Math.max(80, viewH(el) * 0.25),
                  left: 0, behavior: smooth ? 'smooth' : 'auto' });
  }

  /* ---------- 페이지 이동 (덱마다 다른 엔진에 공통으로 붙는다) ---------- */
  function pick(ids) {
    for (var i = 0; i < ids.length; i++) {
      var e = document.getElementById(ids[i]);
      if (e && (e.tagName === 'BUTTON' || e.tagName === 'A')) return e;
    }
    return null;
  }
  function synth(key) {
    document.dispatchEvent(new KeyboardEvent('keydown',
      { key: key, code: key, bubbles: true, cancelable: true }));
  }
  function page(dir) {
    var b = dir > 0 ? pick(['nextBtn', 'btnNext', 'next'])
                    : pick(['prevBtn', 'btnPrev', 'prev']);
    if (b) { if (!b.disabled) b.click(); }
    else synth(dir > 0 ? 'ArrowRight' : 'ArrowLeft');
  }
  function toggleToc() {
    var b = pick(['tocBtn', 'btnToc', 'toc-btn', 'tocOpen']);
    if (b) b.click(); else synth('t');
  }

  /* ---------- 키보드: ↑↓ = 스크롤 (←→ 페이지는 각 덱 엔진이 처리) ---------- */
  function interactive(el) {
    if (!el) return false;
    var t = (el.tagName || '').toUpperCase();
    return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' ||
           t === 'CANVAS' || el.isContentEditable === true;
  }
  addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    if (e.defaultPrevented || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
    if (interactive(e.target) || interactive(document.activeElement)) return;
    var dir = e.key === 'ArrowDown' ? 1 : -1, repeat = e.repeat;
    // 이벤트 전파가 끝난 뒤에 판단한다 — 슬라이드 안의 데모(테트리스 등)가
    // 이 키를 가져갔으면(preventDefault) 스크롤하지 않는다.
    setTimeout(function () {
      if (e.defaultPrevented) return;
      // 문서 자체가 스크롤되는 덱은 브라우저 기본 동작에 맡긴다(이중 스크롤 방지).
      if (isPageScroller(scroller())) return;
      scrollStep(dir, !repeat);
    }, 0);
  });

  /* ---------- 게임패드 (조이패드) ----------
     좌스틱/D-pad 상하 = 스크롤, 좌우 = 이전/다음 페이지
     A·RB·RT = 다음, B·LB·LT = 이전, X·Start = 목차, Back = 첫 장     */
  var DEAD = 0.4, REPEAT = 320, held = {}, lastTurn = 0, lastDir = 0, raf = 0;

  function pads() {
    if (!navigator.getGamepads) return [];
    var out = [], g = navigator.getGamepads();
    for (var i = 0; i < g.length; i++) if (g[i]) out.push(g[i]);
    return out;
  }
  function down(g, i) { var b = g.buttons[i]; return !!b && (b.pressed || b.value > 0.5); }
  function edge(name, isDown, fn) {
    if (isDown) { if (!held[name]) { held[name] = 1; fn(); } }
    else held[name] = 0;
  }

  function poll(now) {
    var list = pads();
    if (!list.length) { raf = 0; return; }
    raf = requestAnimationFrame(poll);

    var ax = 0, ay = 0, bNext = false, bPrev = false, bToc = false, bHome = false;
    for (var k = 0; k < list.length; k++) {
      var g = list[k];
      ax += g.axes[0] || 0;
      ay += g.axes[1] || 0;
      if (down(g, 15)) ax += 1;
      if (down(g, 14)) ax -= 1;
      if (down(g, 13)) ay += 1;
      if (down(g, 12)) ay -= 1;
      bNext = bNext || down(g, 0) || down(g, 5) || down(g, 7);
      bPrev = bPrev || down(g, 1) || down(g, 4) || down(g, 6);
      bToc  = bToc  || down(g, 2) || down(g, 9);
      bHome = bHome || down(g, 8);
    }

    if (Math.abs(ay) > DEAD) {                       // 세로: 부드러운 연속 스크롤
      var mag = Math.min(1, (Math.abs(ay) - DEAD) / (1 - DEAD));
      scroller().scrollBy(0, (ay > 0 ? 1 : -1) * (6 + mag * 22));
    }
    var dir = Math.abs(ax) > DEAD ? (ax > 0 ? 1 : -1) : 0;
    if (dir) {                                       // 가로: 페이지 넘김(리핏 간격)
      if (dir !== lastDir || now - lastTurn > REPEAT) {
        lastDir = dir; lastTurn = now; page(dir);
      }
    } else { lastDir = 0; lastTurn = 0; }

    edge('next', bNext, function () { page(1); });
    edge('prev', bPrev, function () { page(-1); });
    edge('toc',  bToc,  toggleToc);
    edge('home', bHome, function () { synth('Home'); });
  }

  function start() { if (!raf) raf = requestAnimationFrame(poll); }
  addEventListener('gamepadconnected', start);
  addEventListener('focus', function () { if (pads().length) start(); });
  if (pads().length) start();
})();
</script>

<script>
(function () {
  'use strict';
  if (window.__deckBookmarkShim) return;
  window.__deckBookmarkShim = true;
  if (!window.indexedDB) return;

  var DB_NAME = 'treasure-house', DB_VER = 1, STORE = 'bookmarks';

  var FILE = location.pathname.split('/').pop() || '';
  try { FILE = decodeURIComponent(FILE); } catch (e) {}
  if (!FILE || /^index\.html?$/i.test(FILE)) return;   // 포털(index.html)은 저장하지 않는다

  /* ---------- IndexedDB 래퍼 ----------
     · 실패한 연결은 캐시하지 않는다 — blocked처럼 일시적인 실패 뒤에 다시 시도한다
     · 버전 변경·저장공간 회수·사이트 데이터 삭제로 연결이 끊기면 버리고 다시 연다
     · 계속 막히는 환경(file://·시크릿·사이트 데이터 차단)이면 3번 만에 단념하고,
       첫 실패 한 번만 콘솔에 남긴다 — 화면에는 아무것도 띄우지 않는다              */
  var dbp = null, conn = null, fails = 0, warned = false, deadp = null;

  function warn(e) {
    if (warned) return;
    warned = true;
    try { console.warn('[bookmark] 책갈피를 건너뜁니다 — IndexedDB 사용 불가:', e); } catch (x) {}
  }
  function drop(c) { if (conn === c) { dbp = null; conn = null; } }
  function dead() {
    if (!deadp) {
      deadp = Promise.reject(new Error('bookmark: IndexedDB unavailable'));
      deadp.catch(function () {});             // 미처리 거부 경고 방지
    }
    return deadp;
  }
  function db() {
    if (fails >= 3) return dead();
    if (dbp) return dbp;
    var p = dbp = new Promise(function (res, rej) {
      var req;
      try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { rej(e); return; }
      req.onupgradeneeded = function () {
        var d = req.result;
        if (!d.objectStoreNames.contains(STORE))
          d.createObjectStore(STORE, { keyPath: 'id' }).createIndex('updated', 'updated');
      };
      req.onsuccess = function () {
        var d = req.result;
        conn = d; fails = 0;
        d.onversionchange = function () { drop(d); try { d.close(); } catch (x) {} };
        d.onclose         = function () { drop(d); };
        res(d);

      req.onblocked = function () { rej(new Error('open blocked')); };
    });
    p.catch(function (e) {
      fails++;
      if (dbp === p) { dbp = null; conn = null; }
      warn(e);
    });

  }
  function tx(mode, fn) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var t, r;
        // 닫힌 연결이면 여기서 InvalidStateError가 난다 — 버리고 다음 호출에서 다시 연다
        try { t = d.transaction(STORE, mode); r = fn(t.objectStore(STORE)); }
        catch (e) { drop(d); rej(e); return; }
        t.oncomplete = function () { res(r ? r.result : undefined); };
        t.onerror    = function () { rej(t.error || new Error('tx ' + mode + ' error')); };
        t.onabort    = function () { rej(t.error || new Error('tx ' + mode + ' aborted')); };
      });
    }).catch(function (e) { warn(e); throw e; });
  }
  function save(rec) { return tx('readwrite', function (os) { return os.put(rec); }); }
  function load(id)  { return tx('readonly',  function (os) { return os.get(id); }); }

  var ACTIVE = ['on', 'active', 'current', 'shown', 'is-active'];

  function slides() {                          // 슬라이드 덱이면 슬라이드 목록, 아니면 null
    var sel = ['main > article', '.slide'];
    for (var i = 0; i < sel.length; i++) {
      var n = document.querySelectorAll(sel[i]);
      if (n.length > 1) return n;

    return null;
  }
  function activeIndex(list) {                 // 활성 클래스 → URL 해시 순으로 판별

     늘 하나뿐이라 slides()가 null이다 — v2가 이런 덱 13종을 그냥 '긴 문서'로
     보고 scrollY 0만 저장해 책갈피가 아예 남지 않았다. 대신 화면의 쪽 표시

  function counter() {
    if (cntEl && cntEl.isConnected && CNT.test(cntEl.textContent || '')) return cntEl;
    cntEl = null;
    var n = document.querySelectorAll('span, div, b, small, em, strong');
    for (var i = 0, lim = Math.min(n.length, 4000); i < lim; i++) {
      if (n[i].children.length) continue;
      var t = n[i].textContent || '';
      if (t.length > 16) continue;
      var m = CNT.exec(t);
      if (m && +m[2] > 1 && +m[1] >= 1 && +m[1] <= +m[2]) { cntEl = n[i]; break; }
    }
    return cntEl;
  }
  function vpage() {                           // 쪽 표시가 있으면 {page,total}, 없으면 null
    var e = counter();
    if (!e) return null;
    var m = CNT.exec(e.textContent || '');
    return m ? { page: +m[1], total: +m[2] } : null;
  }
  function heading() {                         // 긴 문서용 — 화면 상단을 지난 마지막 제목
    var hs = document.querySelectorAll('h1[id],h2[id],h3[id]'), out = '';
    for (var i = 0; i < hs.length; i++) {
      if (hs[i].getBoundingClientRect().top <= 90) out = '#' + hs[i].id; else break;
    }
    return out;
  }
  function snap() {
    var list = slides();
    if (list) {
      var i = activeIndex(list);
      if (i < 0) i = visibleIndex(list);
      if (i < 0) i = 0;
      var el = list[i];
      return { kind: 'slide', page: i + 1, total: list.length, scrollY: 0,
               hash: el.id ? '#' + el.id : '', ratio: (i + 1) / list.length };
    }
    var v = vpage();                           // 한 장씩 그려내는 덱
    if (v) {
      return { kind: 'slide', page: v.page, total: v.total, scrollY: 0,
               hash: location.hash.length > 1 ? location.hash : '',
               ratio: v.page / v.total };
    }

    var max = Math.max(0, se.scrollHeight - se.clientHeight);
    var y = Math.round(se.scrollTop || window.pageYOffset || 0);

  /* ---------- 자동 저장 ----------
     처음 상태는 기준선으로만 잡고 저장하지 않는다 — 첫 장으로 열자마자
     지난번 책갈피를 1쪽으로 덮어쓰지 않기 위해서다.                        */
  function sig(s) {
    return s.kind + ':' + s.page + ':' + (s.kind === 'scroll' ? Math.round(s.scrollY / 40) : 0);
  }

  function tick(force) {

  addEventListener('pagehide', function () { tick(true); });

       ① 해시 지정 — hashchange를 듣는 엔진
       ② 다음/이전 버튼 클릭 또는 ←→ 키 — 해시를 안 듣는 한 장씩 엔진

  function navBtn(dir) {

    for (var i = 0; i < ids.length; i++) {

    var el = (rec.hash && document.getElementById(rec.hash.slice(1))) || list[target];
    if (!el) return;
    var k = Array.prototype.indexOf.call(list, el);
    if (k >= 0) target = k;
    if (el.id && location.hash.slice(1) !== el.id) location.hash = '#' + el.id;

    if (d < 36e5) return Math.floor(d / 6e4) + '분 전';
    if (d < 864e5) return Math.floor(d / 36e5) + '시간 전';
    if (d < 6048e5) return Math.floor(d / 864e5) + '일 전';

  }
  function bottomInset() {              // 화면 아래 고정 내비(◀ 1/67 ▶) 위로 띄우기

    root.innerHTML =
      '<style>' +
      '.w{pointer-events:auto;display:flex;align-items:center;gap:10px;' +
      'margin:0 auto calc(' + gap + 'px + env(safe-area-inset-bottom,0px));' +
      'padding:10px 12px 10px 14px;max-width:min(94vw,460px);border-radius:14px;' +
      'background:rgba(18,28,40,.94);color:#eaf3fb;font:500 14px/1.4 -apple-system,BlinkMacSystemFont,' +
      '"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35);' +
      'animation:up .22s ease-out}' +
      '@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}' +
      '@media (prefers-reduced-motion:reduce){.w{animation:none}}' +
      '.t{flex:1;min-width:0}.t b{display:block;font-weight:700}' +
      '.t s{display:block;text-decoration:none;opacity:.72;font-size:12px;margin-top:2px}' +
      'button{font:inherit;border:0;border-radius:9px;padding:8px 12px;cursor:pointer}' +
      '.go{background:#4fc3f7;color:#06263a;font-weight:700}' +
      '.no{background:transparent;color:#9fb6c9;padding:8px 6px}' +
      '</style>' +
      '<div class="w"><span aria-hidden="true">🔖</span>' +
      '<div class="t"><b>지난번 ' + where + '까지 읽었어요</b><s>' + ago(rec.updated) + ' 저장됨</s></div>' +
      '<button class="go" type="button">이어보기</button>' +
      '<button class="no" type="button" aria-label="닫기">✕</button></div>';
    function close() { if (host.parentNode) host.parentNode.removeChild(host); }
    root.querySelector('.go').onclick = function () { close(); jump(rec); };
    root.querySelector('.no').onclick = close;
    document.body.appendChild(host);
    setTimeout(close, 15000);
  }

  /* 딥링크로 열었으면 안내하지 않는다.
     이때 location.hash는 못 쓴다 — 덱 엔진 대부분이 첫 장을 그리면서
     history.replaceState('#top')로 주소를 먼저 바꿔 놓기 때문에, 이 셸이
     도는 시점에는 늘 해시가 있는 것처럼 보인다(v1이 안내를 못 띄우던 원인).
     그래서 <head>에서 미리 잡아둔 진입 해시를 쓰고, 없으면 내비게이션
     타이밍의 원래 주소를 본다. */
  function openedWithHash() {
    if (typeof window.__deckInitHash === 'string') return window.__deckInitHash.length > 1;
    try {
      var e = performance.getEntriesByType('navigation')[0];
      if (e && e.name) return new URL(e.name).hash.length > 1;
    } catch (x) {}
    return !!location.hash;
  }
  function initHash() {
    if (typeof window.__deckInitHash === 'string' && window.__deckInitHash) return window.__deckInitHash;
    try {
      var e = performance.getEntriesByType('navigation')[0];
      if (e && e.name) return new URL(e.name).hash;
    } catch (x) {}
    return location.hash;
  }

  if (!openedWithHash()) {
    load(FILE).then(function (rec) {
      if (!rec) return;
      var worth = rec.kind === 'slide' ? rec.page > 1 : rec.scrollY > 200;
      if (!worth) return;
      // 덱이 스스로 지난 쪽을 복원해 이미 그 자리라면(주판 암산 교재 등) 굳이 묻지 않는다
      var now = snap();
      if (now.kind === rec.kind && rec.kind === 'slide' && now.page === rec.page) return;
      toast(rec);
    }).catch(function () {});
  } else {
    /* 포털의 🔖 링크처럼 '#s42'로 들어왔는데 엔진이 해시를 안 듣는 덱(한 장씩
       그려내는 6종)은 1쪽에 머문다 — 안내도 안 뜨니 그 쪽으로 옮겨준다. */
    var m = /^#s?(\d+)$/.exec(initHash() || '');
    if (m) setTimeout(function () {
      var v = slides() ? null : vpage();
      if (v && +m[1] >= 1 && +m[1] <= v.total && v.page !== +m[1])
        vjump({ page: +m[1], hash: initHash() });
    }, 250);
  }
})();
</script>
</body>
</html>
