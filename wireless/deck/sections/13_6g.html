<p class="chnum">13부</p>
<h2>6G</h2>
<p class="chsub">아직 규격이 아닌 것을 규격처럼 적지 않기</p>
<p class="cap">이 부의 목표 장수는 100장이다 (PLAN.md §6).</p>
<hr>
<h3>13부에서 다룰 것</h3>
<ul>
<li>IMT-2030 프레임워크 — ITU-R 이 그린 여섯 가지 사용 시나리오</li>
<li>3GPP 의 6G 연구와 규격 일정</li>
<li>후보 기술 — sub-THz · ISAC · RIS · AI 네이티브 · NTN 통합</li>
<li>WRC 의 후보 대역 논의</li>
<li>백서들 — 무엇이 주장이고 무엇이 합의인가</li>
</ul>
<p class="cap">아직 없습니다 — 뼈대만 세워 둔 자리다.</p>
</article>
