<p class="chnum">1부</p>
<h2>무선의 여명</h2>
<p class="chsub">전자기파의 발견에서 정보이론의 탄생까지</p>
<p class="cap">이 부의 목표 장수는 90장이다 (PLAN.md §6).</p>
<hr>
<h3>1부에서 다룰 것</h3>
<ul>
<li>맥스웰의 예언과 헤르츠의 실험 — 전파는 어떻게 "있다" 가 되었나</li>
<li>마르코니의 대서양 횡단, 페센든의 음성 전송, 암스트롱의 FM</li>
<li>섀넌의 정보이론 — 이 책 전체의 상한선이 여기서 정해진다</li>
<li>주파수 도약의 특허와 확산대역의 씨앗</li>
<li>벨 연구소의 셀룰러 착상, 그리고 MTS·IMTS 의 한계</li>
</ul>
<p class="cap">아직 없습니다 — 뼈대만 세워 둔 자리다.</p>
</article>
