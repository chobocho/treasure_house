<svg class="diag" viewBox="0 0 340 215" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NR 뉴머롤로지 — 같은 1 ms 를 어떻게 쪼개나">
<style>
.diag text{font-family:-apple-system,"Noto Sans KR",sans-serif}
.frame{fill:none;stroke:var(--border,#b9ccd6);stroke-width:1}
.ax{stroke:var(--muted,#4e7183);stroke-width:1;fill:none}
.grid{stroke:var(--border,#d4e0e6);stroke-width:.6;
 stroke-dasharray:2 3;fill:none}
.tick{font-size:8px;fill:var(--muted,#4e7183)}
.axname{font-size:9px;fill:var(--accent2,#123f52);font-weight:700}
.key{font-size:9px;fill:var(--accent2,#123f52);font-weight:700}
.cap{font-size:8.5px;fill:var(--muted,#4e7183)}
.cv{fill:none;stroke:var(--accent,#1f6f8b);stroke-width:1.6}
.cv1{fill:none;stroke:var(--g1,#9c6b3f);stroke-width:1.6}
.cv2{fill:none;stroke:var(--g2,#1f7a6f);stroke-width:1.6}
.cv3{fill:none;stroke:var(--g3,#2f6fb8);stroke-width:1.6}
.cv4{fill:none;stroke:var(--g4,#7c3aed);stroke-width:1.6}
.cv5{fill:none;stroke:var(--g5,#c2185b);stroke-width:1.6}
.cv6{fill:none;stroke:var(--g6,#5b7a3a);stroke-width:1.6}
.cvd{fill:none;stroke:var(--muted,#4e7183);stroke-width:1.2;
 stroke-dasharray:4 3}
.dot{fill:var(--accent,#1f6f8b);stroke:none}
.dot2{fill:var(--special,#7c3aed);stroke:none}
.dotn{fill:var(--muted,#4e7183);opacity:.35;stroke:none}
.cell{fill:var(--panel,#fff);stroke:var(--border,#b9ccd6);
 stroke-width:1}
.cell.a{fill:rgba(31,111,139,.16)}
.cell.b{fill:rgba(194,24,91,.14)}
.cell.c{fill:rgba(46,158,91,.14)}
.cell.d{fill:rgba(217,119,6,.16)}
.cell.e{fill:rgba(124,58,237,.14)}
.cell.f{fill:rgba(85,112,143,.12)}
.tie{stroke:var(--net,#7b8794);stroke-width:1;fill:none}
.tie.hot{stroke:var(--special,#7c3aed);stroke-width:1.6}
</style>
<text x="16.00" y="22.00" class="key" text-anchor="start">서브프레임 1 ms 는 μ 와 무관하게 고정이다</text>
<text x="34.00" y="48.00" class="key" text-anchor="end">μ=0</text>
<rect x="40.00" y="34.00" width="238.80" height="22.00" class="cell a"/>
<text x="282.00" y="48.00" class="tick" text-anchor="start">15 kHz</text>
<text x="34.00" y="86.00" class="key" text-anchor="end">μ=1</text>
<rect x="40.00" y="72.00" width="118.80" height="22.00" class="cell a"/>
<rect x="160.00" y="72.00" width="118.80" height="22.00" class="cell c"/>
<text x="282.00" y="86.00" class="tick" text-anchor="start">30 kHz</text>
<text x="34.00" y="124.00" class="key" text-anchor="end">μ=2</text>
<rect x="40.00" y="110.00" width="58.80" height="22.00" class="cell a"/>
<rect x="100.00" y="110.00" width="58.80" height="22.00" class="cell c"/>
<rect x="160.00" y="110.00" width="58.80" height="22.00" class="cell a"/>
<rect x="220.00" y="110.00" width="58.80" height="22.00" class="cell c"/>
<text x="282.00" y="124.00" class="tick" text-anchor="start">60 kHz</text>
<text x="34.00" y="162.00" class="key" text-anchor="end">μ=3</text>
<rect x="40.00" y="148.00" width="28.80" height="22.00" class="cell a"/>
<rect x="70.00" y="148.00" width="28.80" height="22.00" class="cell c"/>
<rect x="100.00" y="148.00" width="28.80" height="22.00" class="cell a"/>
<rect x="130.00" y="148.00" width="28.80" height="22.00" class="cell c"/>
<rect x="160.00" y="148.00" width="28.80" height="22.00" class="cell a"/>
<rect x="190.00" y="148.00" width="28.80" height="22.00" class="cell c"/>
<rect x="220.00" y="148.00" width="28.80" height="22.00" class="cell a"/>
<rect x="250.00" y="148.00" width="28.80" height="22.00" class="cell c"/>
<text x="282.00" y="162.00" class="tick" text-anchor="start">120 kHz</text>
<text x="16.00" y="196.00" class="cap" text-anchor="start">부반송파 간격이 두 배가 되면 슬롯이 반이 된다</text>
<text x="16.00" y="208.00" class="cap" text-anchor="start">(15·2^μ kHz ↔ 1/2^μ ms) — 지연과 부담의 맞바꿈이다</text>
</svg>
