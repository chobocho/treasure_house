<svg class="diag" viewBox="0 0 340 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="궤도 고도와 편도 지연">
<style>
.diag text{font-family:-apple-system,"Noto Sans KR",sans-serif}
.frame{fill:none;stroke:var(--border,#b9ccd6);stroke-width:1}
.ax{stroke:var(--muted,#4e7183);stroke-width:1;fill:none}
.grid{stroke:var(--border,#d4e0e6);stroke-width:.6;
 stroke-dasharray:2 3;fill:none}
.tick{font-size:8px;fill:var(--muted,#4e7183)}
.axname{font-size:9px;fill:var(--accent2,#123f52);font-weight:700}
.key{font-size:9px;fill:var(--accent2,#123f52);font-weight:700}
.cap{font-size:8.5px;fill:var(--muted,#4e7183)}
.cv{fill:none;stroke:var(--accent,#1f6f8b);stroke-width:1.6}
.cv1{fill:none;stroke:var(--g1,#9c6b3f);stroke-width:1.6}
.cv2{fill:none;stroke:var(--g2,#1f7a6f);stroke-width:1.6}
.cv3{fill:none;stroke:var(--g3,#2f6fb8);stroke-width:1.6}
.cv4{fill:none;stroke:var(--g4,#7c3aed);stroke-width:1.6}
.cv5{fill:none;stroke:var(--g5,#c2185b);stroke-width:1.6}
.cv6{fill:none;stroke:var(--g6,#5b7a3a);stroke-width:1.6}
.cvd{fill:none;stroke:var(--muted,#4e7183);stroke-width:1.2;
 stroke-dasharray:4 3}
.dot{fill:var(--accent,#1f6f8b);stroke:none}
.dot2{fill:var(--special,#7c3aed);stroke:none}
.dotn{fill:var(--muted,#4e7183);opacity:.35;stroke:none}
.cell{fill:var(--panel,#fff);stroke:var(--border,#b9ccd6);
 stroke-width:1}
.cell.a{fill:rgba(31,111,139,.16)}
.cell.b{fill:rgba(194,24,91,.14)}
.cell.c{fill:rgba(46,158,91,.14)}
.cell.d{fill:rgba(217,119,6,.16)}
.cell.e{fill:rgba(124,58,237,.14)}
.cell.f{fill:rgba(85,112,143,.12)}
.tie{stroke:var(--net,#7b8794);stroke-width:1;fill:none}
.tie.hot{stroke:var(--special,#7c3aed);stroke-width:1.6}
</style>
<circle cx="80.00" cy="130.00" r="34.00" class="cell a"/>
<text x="80.00" y="134.00" class="tick" text-anchor="middle">지구</text>
<circle cx="80.00" cy="130.00" r="46.00" class="cv2"/>
<text x="160.00" y="44.00" class="tick" text-anchor="start">저궤도 550 km — 천정 편도 1.83 ms</text>
<line x1="150.00" y1="40.00" x2="156.00" y2="40.00" class="cv2"/>
<circle cx="80.00" cy="130.00" r="62.00" class="cv3"/>
<text x="160.00" y="66.00" class="tick" text-anchor="start">저궤도 1200 km — 천정 편도 4.00 ms</text>
<line x1="150.00" y1="62.00" x2="156.00" y2="62.00" class="cv3"/>
<circle cx="80.00" cy="130.00" r="78.00" class="cv4"/>
<text x="160.00" y="88.00" class="tick" text-anchor="start">MEO 20,200 km — 천정 편도 67.38 ms</text>
<line x1="150.00" y1="84.00" x2="156.00" y2="84.00" class="cv4"/>
<circle cx="80.00" cy="130.00" r="94.00" class="cv5"/>
<text x="160.00" y="110.00" class="tick" text-anchor="start">GEO 35,786 km — 천정 편도 119.37 ms</text>
<line x1="150.00" y1="106.00" x2="156.00" y2="106.00" class="cv5"/>
<text x="170.00" y="200.00" class="cap" text-anchor="middle">고도가 곧 지연이다. 정지궤도는 왕복 238 ms 라</text>
<text x="170.00" y="212.00" class="cap" text-anchor="middle">HARQ 타이머와 RTT 를 그대로 쓸 수 없다.</text>
<text x="170.00" y="228.00" class="cap" text-anchor="middle">저궤도는 편도 2~4 ms 로 지상망과 비슷해진다.</text>
</svg>
