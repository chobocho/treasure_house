<svg class="diag" viewBox="0 0 340 178" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="작업 트리 · 인덱스 · HEAD 와 그 사이를 옮기는 명령">
<style>
.diag text{font-family:-apple-system,"Noto Sans KR",sans-serif}
