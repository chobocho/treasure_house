<svg class="diag" viewBox="0 0 340 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="1 MiB 파일의 판 넷 — 팩이 원래 크기의 몇 %인가">
<style>
.diag text{font-family:-apple-system,"Noto Sans KR",sans-serif}
.frame{fill:none;stroke:var(--border,#c9d2da);stroke-width:1}
.ax{stroke:var(--muted,#5b6b7a);stroke-width:1;fill:none}
.grid{stroke:var(--border,#e1e7ec);stroke-width:.6;
 stroke-dasharray:2 3;fill:none}
svg.diag text.tick{font-size:8px;fill:var(--muted,#5b6b7a)}
svg.diag text.axname{font-size:9px;fill:var(--accent2,#1e2b37);font-weight:700}
svg.diag text.key{font-size:9px;fill:var(--accent2,#1e2b37);font-weight:700}
svg.diag text.cap{font-size:8.5px;fill:var(--muted,#5b6b7a)}
.cv{fill:none;stroke:var(--accent,#c4411f);stroke-width:1.6}
.cv1{fill:none;stroke:var(--g1,#2f7a52);stroke-width:1.6}
.cv2{fill:none;stroke:var(--g2,#25507f);stroke-width:1.6}
.cv3{fill:none;stroke:var(--g3,#c4411f);stroke-width:1.6}
.cv4{fill:none;stroke:var(--g4,#7a4a8c);stroke-width:1.6}
.cv5{fill:none;stroke:var(--g5,#a86b00);stroke-width:1.6}
.cv6{fill:none;stroke:var(--g6,#5c6b73);stroke-width:1.6}
.cvd{fill:none;stroke:var(--muted,#5b6b7a);stroke-width:1.2;
 stroke-dasharray:4 3}
.dot{fill:var(--accent,#c4411f);stroke:none}
.dot2{fill:var(--special,#25507f);stroke:none}
.dot5{fill:var(--g5,#a86b00);stroke:none}
.dotn{fill:var(--muted,#5b6b7a);opacity:.35;stroke:none}
.cell{fill:var(--panel,#fff);stroke:var(--border,#c9d2da);
 stroke-width:1}
.cell.a{fill:rgba(196,65,31,.16)}
.cell.b{fill:rgba(184,50,42,.14)}
.cell.c{fill:rgba(46,158,91,.14)}
.cell.d{fill:rgba(217,119,6,.16)}
.cell.e{fill:rgba(37,80,127,.14)}
.cell.f{fill:rgba(91,107,122,.12)}
.box{fill:var(--panel,#fafbfc);stroke:var(--border,#c9d2da);
 stroke-width:1.2}
.box.g1{stroke:var(--g1,#2f7a52);fill:rgba(47,122,82,.12)}
.box.g2{stroke:var(--g2,#25507f);fill:rgba(37,80,127,.12)}
.box.g3{stroke:var(--g3,#c4411f);fill:rgba(196,65,31,.12)}
.box.g4{stroke:var(--g4,#7a4a8c);fill:rgba(122,74,140,.12)}
.box.g5{stroke:var(--g5,#a86b00);fill:rgba(168,107,0,.12)}
.box.g6{stroke:var(--g6,#5c6b73);fill:rgba(92,107,115,.12)}
.box.off{fill:none;stroke-dasharray:3 2}
.arw{stroke:var(--net,#7d8a96);stroke-width:1.4;fill:none}
.arw.hot{stroke:var(--special,#25507f);stroke-width:2.2}
svg.diag text.lbl{font-size:11px;fill:var(--muted,#5b6b7a)}
.diag text{fill:var(--text,#1c2530)}
.tie{stroke:var(--net,#7d8a96);stroke-width:1;fill:none}
.tie.hot{stroke:var(--special,#25507f);stroke-width:1.6}
.edge{stroke:var(--net,#7d8a96);stroke-width:1.3;fill:none}
.edge.hot{stroke:var(--special,#25507f);stroke-width:1.8}
.edge.dim{stroke-dasharray:3 2;opacity:.6}
.ah{fill:var(--net,#7d8a96);stroke:none}
.ah.hot{fill:var(--special,#25507f)}
.bar{fill:var(--g2,#25507f);opacity:.8;stroke:none}
.bar.a{fill:var(--accent,#c4411f)}
svg.diag text.mono{font-family:"DeckMono","D2Coding",ui-monospace,
 monospace;font-size:8.5px}
svg.diag text.hot{fill:var(--special,#25507f);font-weight:700;
 font-size:9.5px}
</style>
<text x="115.00" y="26.00" class="tick" text-anchor="end">글(줄 1 % 수정)</text>
<rect x="120.00" y="16.00" width="22.90" height="12.00" class="bar"/>
<text x="146.90" y="26.00" class="tick" text-anchor="start">0.43 MiB / 3.9 MiB = 11%</text>
<text x="115.00" y="50.00" class="tick" text-anchor="end">무작위 바이너리(1 % 수정)</text>
<rect x="120.00" y="40.00" width="65.50" height="12.00" class="bar"/>
<text x="189.50" y="50.00" class="tick" text-anchor="start">1.23 MiB / 4.0 MiB = 31%</text>
<text x="115.00" y="74.00" class="tick" text-anchor="end">압축된 글(줄 1 % 수정)</text>
<rect x="120.00" y="64.00" width="90.00" height="12.00" class="bar"/>
<text x="214.00" y="74.00" class="tick" text-anchor="start">1.69 MiB / 1.7 MiB = 100%</text>
<text x="170.00" y="100.00" class="cap" text-anchor="middle">판마다 1 % 수정 · gc --aggressive 뒤</text>
</svg>
