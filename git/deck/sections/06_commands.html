<article class="card section" id="p6">
<p class="chnum">6부</p>
<h2>명령 해부</h2>
<p class="chsub">명령 하나가 세 영역을 어떻게 움직이는가</p>
<p class="cap">이 부의 목표 장수는 140장입니다 (PLAN.md §6).</p>
<hr>
<h3>6부에서 다룰 것</h3>
<ul>
<li>add · commit · status — 전후 상태를 캡처로</li>
<li>log · show — 역사를 읽는 두 창</li>
<li>rm · mv — 이름을 바꾸는 일의 실체</li>
<li>restore · reset · checkout — 무엇을 어디로 되돌리나</li>
<li>명령마다 "전 → 후" 캡처 한 쌍</li>
</ul>
<p class="cap">아직 없습니다 — 뼈대만 세워 둔 자리입니다.</p>
</article>
