<p class="chnum">15부</p>
<h2>활용 가이드 I — 일상</h2>
<p class="chsub">좋은 커밋을 만드는 손버릇</p>
<p class="cap">이 부의 목표 장수는 120장입니다 (PLAN.md §6).</p>
<hr>
<h3>15부에서 다룰 것</h3>
<ul>
<li>좋은 커밋 만들기</li>
<li>부분 스테이징(add -p)</li>
<li>stash</li>
<li>작업 정리 — fixup 과 autosquash</li>
<li>로그 탐색 레시피</li>
<li>alias 모음, 셸 프롬프트와 자동완성</li>
</ul>
<p class="cap">아직 없습니다 — 뼈대만 세워 둔 자리입니다.</p>
