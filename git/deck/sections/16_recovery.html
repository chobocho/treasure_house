<p class="chnum">16부</p>
<h2>활용 가이드 II — 사고 복구</h2>
<p class="chsub">사고 → 진단 → 복구, 40 장면</p>
<p class="cap">이 부의 목표 장수는 150장입니다 (PLAN.md §6).</p>
<hr>
<h3>16부에서 다룰 것</h3>
<ul>
<li>잘못 커밋했다 · 잘못 푸시했다</li>
<li>비밀이 새었다</li>
<li>detached HEAD 에서 길을 잃었다</li>
<li>브랜치를 지웠다</li>
<li>리베이스를 망쳤다 · 충돌 중에 멈췄다</li>
<li>작성자가 틀렸다 · 큰 파일을 올렸다</li>
<li>장면마다 사고와 복구를 진짜 캡처 한 쌍으로</li>
</ul>
<p class="cap">아직 없습니다 — 뼈대만 세워 둔 자리입니다.</p>
