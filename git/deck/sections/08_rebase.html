<h2>리베이스와 역사 재작성</h2>
<p class="chsub">체리픽의 반복이라는 실체</p>
<p class="cap">이 부의 목표 장수는 130장입니다 (PLAN.md §6).</p>
<hr>
<h3>8부에서 다룰 것</h3>
<ul>
<li>리베이스는 체리픽을 되풀이하는 일이다</li>
<li>rebase -i 와 autosquash</li>
<li>--onto 와 --update-refs</li>
<li>cherry-pick · revert, 머지 커밋의 revert 와 -m</li>
<li>commit --amend 와 filter-repo</li>
<li>재작성한 뒤 reflog 로 되돌리기</li>
</ul>
<p class="cap">아직 없습니다 — 뼈대만 세워 둔 자리입니다.</p>
</article>
