{t:'미닫이 문 — 진짜 울펜슈타인식',k:'SLIDING DOOR',h:`
<p>울펜슈타인 3D의 문은 누르면 <em>옆으로 스르륵 미끄러져</em> 열립니다. 원리는 문마다 <b>열림 오프셋</b> 0~1을 하나 두는 것입니다. 0이면 완전히 닫힘, 1이면 벽 속으로 완전히 들어가 열림.</p>
<pre class="code" data-lang="js">// 의사코드 — 울펜슈타인식 미닫이 문
door.offset += dt;                  // 1초에 걸쳐 0 → 1로 증가
// DDA가 문 칸에 맞았을 때:
//   1) 광선을 칸 안쪽으로 반 칸 더 전진 (문짝은 칸 중앙에 있으므로)
//   2) 그 지점의 벽면 x좌표 wallX를 계산
//   3) wallX가 (1 - door.offset)보다 작으면 → 남은 문짝에 명중
//      크면 → 열린 틈이므로 통과, DDA 계속</pre>
<p>포인트가 두 가지입니다. 첫째, 문짝을 벽면이 아니라 <em>칸 두께의 절반 지점</em>에 두기 때문에 광선을 반 칸 더 밀어 넣어야 합니다(그래서 문이 살짝 안쪽으로 들어가 보이는 특유의 모습이 나옵니다). 둘째, 명중 판정이 "칸 단위"가 아니라 <em>칸 안의 x좌표와 오프셋의 비교</em>가 됩니다.</p>
<div class="note blue"><b>확장 과제</b>: 우리 코드의 castRay에서 tile === 4일 때 위 1~3단계를 넣어 보세요. 텍스처 좌표도 wallX + door.offset으로 밀어 주면 문짝이 실제로 미끄러져 보입니다.</div>`},

{t:'애니메이션 문의 난점',k:'WHY INSTANT',h:`
<p>그럴듯해 보이는 미닫이 문을 우리가 채택하지 않은 이유를 정직하게 적어 둡니다. <em>DDA는 "칸 전체가 벽이거나 빈칸"이라는 가정 위에 서 있기 때문입니다.</em></p>
<div class="tblWrap"><table class="tbl">
<tr><th>깨지는 가정</th><th>무슨 일이 생기나</th></tr>
<tr><td>칸 = 전부 벽 or 전부 빈칸</td><td>반쯤 열린 문은 칸의 일부만 막음 → DDA 명중 판정에 예외 분기 필요</td></tr>
<tr><td>벽면은 칸 경계에 있음</td><td>문짝은 칸 중앙 → 광선 반 칸 추가 전진 + perpDist 보정 필요</td></tr>
<tr><td>충돌 = cell() 하나로 판정</td><td>tryMove도 "열린 정도"를 알아야 함 → 문 상태를 물리에도 배선</td></tr>
<tr><td>world 배열이 유일한 상태</td><td>문마다 offset·타이머 객체가 따로 생김 → 저장/리셋 코드 증가</td></tr>
</table></div>
<p>즉시 열림은 약 5줄, 미닫이 문은 렌더러·물리·상태 관리에 걸쳐 수십 줄입니다. 우리 목표는 <em>레이캐스팅의 뼈대를 이해하는 것</em>이므로, 뼈대를 흐리는 비용은 과감히 잘랐습니다.</p>
<div class="note red">흔한 실수: 미닫이 문을 넣으면서 perpDist 보정을 잊으면 <b>문만 어안 왜곡</b>이 되살아나 문짝이 휘어 보입니다. 부분 벽은 반드시 6장의 수직거리(perpDist) 보정까지 함께 손봐야 합니다.</div>`},

{t:'아이템 줍기 — 거리 검사',k:'PICKUP',h:`
<p>구급상자는 문보다도 쉽습니다. 조준도 버튼도 필요 없이, <em>매 프레임 플레이어와의 거리만 재면</em> 됩니다. 0.5칸 안으로 들어오면 자동으로 줍습니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">if (s.kind === 'medkit') {
  if (d &lt; 0.5 &amp;&amp; player.hp &lt; 100) {
    player.hp = Math.min(100, player.hp + 25);
    s.alive = false; msg = '구급상자 +25'; msgT = 1.2;
  }
  return;
}</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">if s.kind == 'medkit':
    if math.hypot(s.x - pl.x, s.y - pl.y) &lt; 0.5 and pl.hp &lt; 100:
        pl.hp = min(100, pl.hp + 25)
        s.alive = False
        hurt = '구급상자 +25'
    continue</pre>
<p>조건이 두 개인 이유를 보세요. <span class="reg">d &lt; 0.5</span>는 접촉 판정이고, <span class="reg">hp &lt; 100</span>은 <em>체력이 꽉 찼을 때 아깝게 소모되는 것을 막는</em> 배려입니다. 만피로 밟고 지나가도 상자는 남아 있다가, 다쳐서 돌아오면 그때 주워집니다. 원조 Doom도 같은 규칙입니다.</p>`},

{t:'아이템도 스프라이트다',k:'SPRITE REUSE',h:`
<p>구급상자를 그리는 코드는 이번 장에서 <em>한 줄도 새로 쓰지 않았습니다</em>. 9장에서 만든 스프라이트 파이프라인 — 거리순 정렬, 시야각 검사, tan 투영, z버퍼 클리핑 — 이 그대로 일을 합니다. 적과 아이템의 차이는 <span class="reg">kind</span> 문자열과 행동 코드뿐입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">sprites = [
  { x: 9.5,  y: 1.5,  kind: 'imp', hp: 3, alive: true, cool: 0 },
  // ... 임프 4마리 더 ...
  { x: 4.5,  y: 9.5,  kind: 'medkit', hp: 0, alive: true, cool: 0 },
  { x: 14.5, y: 2.5,  kind: 'medkit', hp: 0, alive: true, cool: 0 }
];</pre>
<p>줍는 순간 하는 일은 <span class="reg">s.alive = false</span> 하나입니다. 렌더러 첫 줄이 <span class="reg">sprites.filter(...)</span>로 살아 있는 것만 걸러 그리므로, 플래그 하나 끄면 다음 프레임부터 화면에서 사라집니다. 배열에서 지우는 것보다 안전하고(순회 중 삭제 버그가 없음), 재시작할 때 되살리기도 쉽습니다.</p>
<div class="note">새 아이템(탄약, 열쇠, 갑옷...)을 추가하는 비용 = <b>그림 한 장 + kind 분기 한 개</b>. 렌더링은 공짜입니다. 좋은 파이프라인은 이렇게 재사용으로 보답합니다.</div>`},

{t:'상태 메시지 시스템',k:'MESSAGE',h:`
<p>"문이 열렸다", "구급상자 +25" 같은 문구가 잠깐 떴다 사라지는 시스템은 변수 두 개면 됩니다. <span class="reg">msg</span>(내용)와 <span class="reg">msgT</span>(남은 시간). 흩어진 세 줄이 전부입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">msg = '문이 열렸다'; msgT = 1.2;      // 1) 이벤트 발생 시: 등록
msgT = Math.max(0, msgT - dt);        // 2) 매 프레임: 타이머 감소
if (msgT &gt; 0) ctx.fillText(msg, W / 2, 40);   // 3) 남은 동안만 표시</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">msg, msg_t = m, 1.2                   # 1) 등록
msg_t = max(0.0, msg_t - dt)          # 2) 감소
render_hud(buf, font, pl, msg if msg_t &gt; 0 else '', gun_kick)  # 3) 표시</pre>
<p>새 메시지가 오면 그냥 덮어씁니다 — 큐도, 페이드 아웃도 없습니다. <span class="reg">dt</span>로 줄이므로 프레임레이트와 무관하게 <em>정확히 1.2초</em> 유지되는 점이 유일한 정교함입니다.</p>
<div class="note grn">이런 "타이머 변수 하나" 패턴은 이 게임에 세 번 나옵니다: msgT(메시지), gunKick(반동), 그리고 12장의 공격 쿨타임(cool). 모두 <b>등록은 아무 데서나, 감소는 메인 루프 한 곳에서</b> 합니다. 감소 코드를 여러 곳에 두면 두 배 속도로 줄어드는 버그가 생깁니다.</div>`},

{t:'비밀벽 아이디어',k:'SECRET WALL',h:`
<p>Doom을 Doom답게 만드는 또 하나의 장치는 <b>비밀 공간</b>입니다. 레벨 끝 통계 화면의 "SECRETS: 66%"가 플레이어를 다시 불러들이죠. 울펜슈타인 3D는 밀면 뒤로 물러나는 <b>푸시월</b>이 원조였습니다.</p>
<p>우리 구조에서는 이미 만든 openDoor를 몇 줄만 고치면 됩니다. 특정 벽 타일을 <em>문처럼 취급하되, 사라지는 대신 한 칸 뒤로 밀리게</em> 하는 것입니다.</p>
<pre class="code" data-lang="py"># 의사코드 — 밀리는 비밀벽 (6 = 비밀벽 타일이라고 하자)
if cell(tx, ty) == 6:
    world[ty][tx] = 0                # 지금 칸을 비우고
    world[ty + dy][tx + dx] = 6      # 시선 방향(dx,dy)으로 한 칸 밀기
    return '비밀 통로 발견!'</pre>
<p>겉보기에는 평범한 벽 텍스처(예: 돌벽 2번과 같은 그림의 6번 타일)를 쓰는 것이 핵심입니다. <em>보이는 정보로는 구분할 수 없고</em>, 지도의 어색한 빈 공간이나 벽의 미세한 색 차이 같은 힌트로만 짐작하게 만드는 것이 레벨 디자인의 재미 포인트입니다.</p>
<div class="note blue"><b>확장 과제</b>: 발견한 비밀 개수를 세는 secrets 카운터를 추가하고, 탈출 성공 문구에 "비밀 1/3"처럼 표시해 보세요. 수집 통계는 코드 다섯 줄로 게임의 재플레이 가치를 크게 올립니다.</div>`},

{t:'열쇠와 잠긴 문 설계',k:'KEY &amp; LOCK',h:`
<p>Doom의 파랑·노랑·빨강 열쇠 카드는 레벨에 <em>순서</em>를 부여하는 장치입니다. 잠긴 문을 먼저 보여주고, 열쇠를 찾아 되돌아오게 만들죠. 우리 구조에서 이걸 만드는 데 필요한 인벤토리는 <b>불리언 변수 하나</b>입니다.</p>
<pre class="code" data-lang="py"># 의사코드 — 열쇠와 잠긴 문
has_key = False                      # 인벤토리 = 불리언 하나로 시작

# 줍기: 구급상자와 똑같은 거리 검사 (kind만 'key')
if s.kind == 'key' and d &lt; 0.5:
    has_key = True
    s.alive = False

# open_door 안에: (7 = 잠긴 문 타일이라고 하자)
if cell(tx, ty) == 7:
    if has_key:
        world[ty][tx] = 0
        return '잠긴 문이 열렸다'
    return '파란 열쇠가 필요하다!'</pre>
<p>이번 장에서 배운 세 부품의 조립품임을 확인하세요. 줍기는 슬라이드 9의 <em>거리 검사</em>, 문은 슬라이드 4의 <em>타일 검사</em>, 거절 문구는 슬라이드 11의 <em>메시지 시스템</em>입니다. 열쇠가 여러 개면 불리언을 셋으로 늘리거나 집합(set)으로 바꾸면 됩니다.</p>
<div class="note blue"><b>확장 과제</b>: 문 텍스처의 노란 손잡이 띠 색을 열쇠 색과 맞춰 그려 보세요(파란 문 = 파란 띠). 텍스트 없이 색만으로 규칙이 전달되는, 고전 FPS의 시각 언어입니다.</div>`},

{t:'11장 정리',k:'RECAP',h:`
<div class="big">
문도, 아이템도, 출구도, 열쇠도 —
<span class="hero">상호작용 = 내 앞 칸 + 조건 + 세계 수정</span>
시선 방향 1.2칸 앞을 int로 내림하면 대상 칸이 나오고,<br>
world 배열의 숫자 하나를 고치면 렌더링·충돌·미니맵이 함께 바뀝니다.
</div>
<ul class="b">
<li><b>문</b>: cell(tx,ty)==4 → world[ty][tx]=0. 즉시 열림은 5줄, 미닫이는 수십 줄.</li>
<li><b>출구</b>: cell==5 → over 문자열 세팅. 빈 문자열 = 진행 중이라는 상태 트릭.</li>
<li><b>아이템</b>: 매 프레임 d&lt;0.5 검사 + alive=false. 그리기는 9장 파이프라인이 공짜로.</li>
<li><b>메시지</b>: msg/msgT 두 변수. 등록은 아무 데서나, 감소는 한 곳에서.</li>
</ul>
<p>다음 장에서는 이 세계에 마침내 <em>맞서 싸울 상대</em>를 넣습니다. 그리고 놀랍게도, 적의 눈과 우리의 총알은 이미 만들어 둔 castRay 하나로 모두 해결됩니다.</p>`},

]});
</script>
<script>
/* ───────────── CH 12. 적 AI와 전투 ───────────── */
CH({
icon:'🤖', title:'적 AI와 <span class="em">전투</span>',
desc:'임프에게 눈과 다리와 발톱을 달아 줍니다. 시선 판정도, 히트스캔 사격도 알고 보면 전부 5장의 castRay 하나의 재사용입니다. 마지막에는 임프 5마리를 상대로 실전을 치릅니다.',
slides:[

{t:'적에게 필요한 것',k:'ENEMY STATE',h:`
<p>9장에서 임프는 <em>서 있는 그림</em>이었습니다. 그림을 괴물로 바꾸려면 상태가 세 가지 더 필요합니다: 얼마나 버티는지(<b>hp</b>), 아직 살아 있는지(<b>alive</b>), 다음 공격까지 얼마나 남았는지(<b>cool</b>). 위치(x, y)와 종류(kind)는 스프라이트 시절부터 있던 그대로입니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">class Sprite:
    def __init__(self, x, y, kind):
        self.x, self.y, self.kind = x, y, kind   # kind: 'imp' | 'medkit'
        self.hp = 3 if kind == 'imp' else 0
        self.alive = True
        self.cool = 0.0                          # 공격 쿨타임</pre>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">{ x: 9.5,  y: 1.5,  kind: 'imp', hp: 3, alive: true, cool: 0 },</pre>
<p>같은 Sprite 클래스가 임프와 구급상자를 겸하는 점에 주목하세요. 구급상자는 hp 0, cool 미사용 — 필드 몇 개가 놀아도 <em>클래스 하나로 통일하는 쪽이 렌더링·순회 코드를 단순하게</em> 만듭니다. 임프의 hp가 3이라는 것은 권총 3발이면 잡힌다는 뜻입니다.</p>`},

{t:'임프의 3가지 행동',k:'FSM',h:`
<p>거창한 AI가 아닙니다. 임프의 두뇌는 <em>플레이어까지의 거리 d 하나로 갈라지는 세 갈래</em>입니다. 매 프레임 d를 재고, 구간에 맞는 행동 하나만 합니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>거리 조건</th><th>상태</th><th>하는 일</th></tr>
<tr><td>d &gt; 8</td><td><b>대기</b></td><td>아무것도 안 함 (너무 멀다 — 어그로 밖)</td></tr>
<tr><td>1 &lt; d ≤ 8</td><td><b>추적</b></td><td>플레이어 방향으로 초속 1.3칸 이동</td></tr>
<tr><td>d ≤ 1</td><td><b>공격</b></td><td>쿨타임마다 발톱 공격, 8 데미지</td></tr>
</table></div>
<p>상태를 변수에 저장하지 않는 점이 포인트입니다. 흔히 배우는 유한 상태 기계(FSM)는 state 변수와 전이 규칙을 두지만, 우리 임프는 <em>매 프레임 거리에서 상태를 다시 계산</em>합니다. 저장이 없으니 전이 버그도 없습니다.</p>
<div class="note">여기에 단 하나의 관문이 추가됩니다: 추적·공격은 <b>플레이어가 보일 때만</b>. 벽 너머의 임프는 d가 3이어도 대기 상태입니다. 이 "보인다" 판정이 다음 슬라이드의 주인공입니다.</div>`},

{t:'시선 판정 — 벽 너머는 못 본다',k:'LINE OF SIGHT',h:`
<p>임프가 벽 뒤의 플레이어를 쫓아 벽에 머리를 박고 있으면 곤란합니다. "보이는가?"를 판정하는 방법: <em>임프의 눈에서 플레이어 방향으로 광선을 하나 쏘고</em>, 그 광선이 벽에 닿은 거리(wall_d)와 플레이어까지의 거리(d)를 비교합니다. 벽이 더 멀면 시야가 트인 것입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var ang = Math.atan2(player.y - s.y, player.x - s.x);
if (castRay(s.x, s.y, ang)[1] &lt; d) return;        // 벽에 가려 안 보임</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py"># 시야가 트여 있을 때만 추적
ang = math.atan2(pl.y - s.y, pl.x - s.x)
_, wall_d, _, _ = cast_ray(s.x, s.y, ang)
if wall_d &lt; d:
    continue</pre>
<p>이때의 castRay는 시점이 플레이어가 아니라 <em>임프</em>입니다. 5장에서 castRay를 만들 때 시작점(px, py)을 매개변수로 받게 한 덕분에, 누구의 눈에서든 쏠 수 있습니다.</p>
<div class="note red">부등호 방향을 헷갈리기 쉽습니다. <b>wall_d &lt; d 면 "벽이 먼저" = 안 보임</b>입니다. 반대로 쓰면 임프가 벽 너머만 보는 초능력자가 됩니다.</div>`},

{t:'레이캐스팅의 재활용',k:'CODE REUSE',h:`
<p>잠깐 멈춰서 방금 일어난 일을 음미해 봅시다. 5장에서 castRay를 만들 때 우리는 <em>화면을 그리는 함수</em>를 만든다고 생각했습니다. 그런데 지금 그 함수가 <em>임프의 눈</em>이 되었습니다.</p>
<div class="grid2">
<div class="card"><h3>렌더러로서</h3><p>매 프레임 640개의 광선을 쏘아 벽까지의 거리를 재고, 그 거리로 벽 기둥의 높이를 정합니다.</p></div>
<div class="card"><h3>AI 감각기관으로서</h3><p>매 프레임 임프당 1개의 광선을 쏘아 "벽까지의 거리 vs 목표까지의 거리"를 비교합니다.</p></div>
</div>
<p>두 용도 모두 본질은 같은 질문입니다 — <em>"이 방향으로 곧게 나아가면 무엇에 먼저 닿는가?"</em> 렌더링은 이 질문을 640번 던져 그림을 만들고, AI는 1번 던져 판단을 내립니다. 다음 슬라이드들에서 플레이어의 총알도 같은 질문 하나로 구현되는 것을 보게 됩니다.</p>
<div class="note">좋은 추상화의 징표: <b>만들 때 상상하지 못한 용도로 쓰인다</b>. castRay가 "기둥 높이 계산기"가 아니라 "광선 질문 함수"로 설계되었기에 가능한 일입니다. 렌더링 함수가 AI 함수가 되는 이 우아함이 레이캐스팅 엔진의 숨은 보상입니다.</div>`},

{t:'추적 — 플레이어를 향해',k:'CHASE',h:`
<p>보이는 것이 확인되면 걷습니다. 방향은 <span class="reg">atan2(플레이어 - 임프)</span>로 구하고, 이동은 10장의 플레이어 이동과 똑같이 <em>x축과 y축을 따로</em> 검사합니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">if (d &gt; 1.0) {                                    // 추적
  var spd = 1.3 * dt;
  var nx = s.x + Math.cos(ang) * spd, ny = s.y + Math.sin(ang) * spd;
  if (cell(nx | 0, s.y | 0) === 0) s.x = nx;
  if (cell(s.x | 0, ny | 0) === 0) s.y = ny;
}</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">if d &gt; 1.0:                              # 추적
    spd = 1.3 * dt
    nx, ny = s.x + math.cos(ang) * spd, s.y + math.sin(ang) * spd
    if cell(int(nx), int(s.y)) == 0:
        s.x = nx
    if cell(int(s.x), int(ny)) == 0:
        s.y = ny</pre>
<p>축분리 덕분에 임프도 벽에 비스듬히 부딪히면 <em>벽을 따라 미끄러집니다</em>. 경로 탐색(A* 같은)이 전혀 없는데도 열린 문을 통과해 따라오는 것처럼 보이는 이유입니다 — 직진 + 미끄러짐만으로 웬만한 방 구조는 뚫고 옵니다. 속도 1.3은 플레이어(3.2)의 절반이 안 되어, 뒷걸음치며 쏘면 거리를 유지할 수 있습니다.</p>`},

{t:'공격 — 쿨타임',k:'ATTACK COOLDOWN',h:`
<p>거리 1칸 안으로 붙으면 발톱이 나갑니다. 매 프레임 8씩 깎으면 1초에 480 데미지가 되니, <em>쿨타임 타이머</em>로 공격 빈도를 초당 1회로 제한합니다. 11장의 msgT와 완전히 같은 패턴입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">} else {                                          // 공격
  s.cool -= dt;
  if (s.cool &lt;= 0) {
    player.hp -= 8; s.cool = 1; msg = '피격! -8'; msgT = 1.2;
    if (player.hp &lt;= 0) { player.hp = 0; over = '전사... R로 재시작'; }
  }
}</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">else:                                    # 공격
    s.cool -= dt
    if s.cool &lt;= 0:
        pl.hp -= 8
        s.cool = 1.0
        hurt = '피격! -8'</pre>
<p>순서에 주목하세요. <em>먼저 깎고(cool -= dt), 0 이하가 되면 공격하고 1.0으로 되감기</em>. 처음 붙는 순간에는 cool이 0이므로 즉시 한 대 들어옵니다 — 접근을 허용한 대가가 바로 청구되는 셈입니다. 임프가 5마리이므로 셋에게 둘러싸이면 초당 24씩 녹습니다.</p>`},

{t:'사거리와 어그로 범위',k:'TUNING',h:`
<p>update_enemies에 박혀 있는 숫자들은 전부 <em>게임의 손맛을 정하는 다이얼</em>입니다. 코드 한 줄 안 바꾸고 숫자만 돌려도 완전히 다른 게임이 됩니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>수치</th><th>값</th><th>의미</th><th>키우면 / 줄이면</th></tr>
<tr><td>어그로 범위</td><td>d &gt; 8 무시</td><td>이 밖의 임프는 잠들어 있음</td><td>맵 전체가 몰려옴 / 코앞까지 태평</td></tr>
<tr><td>공격 사거리</td><td>d ≤ 1</td><td>발톱이 닿는 거리</td><td>원거리 괴물화 / 살에 닿아야 공격</td></tr>
<tr><td>이동 속도</td><td>1.3 칸/초</td><td>플레이어 3.2의 약 40%</td><td>도망 불가능 / 산책하는 표적</td></tr>
<tr><td>공격 주기</td><td>cool 1.0초</td><td>데미지 8과 한 세트</td><td>DPS 폭증 / 솜방망이</td></tr>
<tr><td>임프 체력</td><td>hp 3</td><td>3발 = 처치</td><td>총알 스펀지 / 원킬</td></tr>
</table></div>
<p>지금 값들의 설계 의도: <em>한 마리는 걸어서도 이기고, 세 마리부터는 지형(문, 통로)을 써야 이긴다</em>. 탄약 40발에 임프 5마리 × 3발 = 최소 15발이므로, 명중률 40%만 넘기면 탄이 남습니다.</p>
<div class="note grn">밸런싱 팁: 다이얼은 <b>한 번에 하나만</b> 돌리고 꼭 플레이해 보세요. 속도와 데미지를 동시에 올리면 무엇이 게임을 망쳤는지 알 수 없게 됩니다.</div>`},

{t:'플레이어의 반격 — 히트스캔',k:'HITSCAN',h:`
<p>이제 우리 차례입니다. 총알을 어떻게 구현할까요? 날아가는 총알 오브젝트를 만들고, 매 프레임 이동시키고, 충돌을 검사하고... 가 아닙니다. 고전 FPS의 총 대부분은 <b>히트스캔(hitscan)</b>입니다 — 방아쇠를 당기는 <em>그 프레임에 명중 여부를 즉시 판정</em>하고, 총알은 아예 존재하지 않습니다.</p>
<div class="grid2">
<div class="card"><h3>히트스캔</h3><p>발사 즉시 시선 방향으로 판정. 총알 오브젝트 없음. Doom의 권총·샷건·체인건이 이 방식입니다.</p></div>
<div class="card"><h3>투사체</h3><p>총알이 실제로 날아가는 오브젝트. Doom의 로켓, 임프의 화염구가 이 방식 — 피할 수 있습니다.</p></div>
</div>
<p>히트스캔 판정에 필요한 질문은 두 개뿐입니다.</p>
<ol>
<li>시선 방향에 <em>적이 있는가?</em> (조준 판정 — 다음 슬라이드)</li>
<li>그 적 앞을 <em>벽이 가로막지 않는가?</em> (또 castRay!)</li>
</ol>
<div class="note">총알이 없으니 탄속도, 탄도 계산도, 총알-벽 충돌도 없습니다. <b>"총알 없는 총"</b>은 게으름이 아니라 30년간 검증된 설계입니다. 우리 권총도 히트스캔입니다.</div>`},

{t:'조준 판정 — 7도의 관용',k:'AIM CHECK',h:`
<p>"시선 방향에 적이 있는가?"를 판정합니다. 적 방향각(<span class="reg">atan2</span>)과 내 시선각(<span class="reg">ang</span>)의 차이 <span class="reg">rel</span>이 충분히 작으면 명중으로 칩니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">d = math.hypot(s.x - pl.x, s.y - pl.y)
rel = math.atan2(s.y - pl.y, s.x - pl.x) - pl.ang
rel = (rel + math.pi) % (2 * math.pi) - math.pi
if abs(rel) &lt; 0.12 and d &lt; best_d:</pre>
<p>둘째 줄의 정규화는 9장에서 본 그 공식입니다 — 각도차를 항상 -π~+π 범위로 접어 넣어, 359° - 1° 같은 경우가 "358° 차이"로 오판되는 것을 막습니다.</p>
<p>문턱값 <b>0.12 라디안 ≈ 7°</b>는 조준 관용도입니다. 십자선이 없어도 대충 겨누면 맞는 너그러운 값이죠. 재미있는 성질 하나: 각도 기준이므로 <em>먼 적일수록 실질 판정 폭이 넓어집니다</em>. 거리 8칸에서 7°면 좌우 약 1칸까지 명중 — 원거리 저격이 오히려 쉬운 총입니다.</p>
<div class="note red">정규화 줄을 빼먹으면 특정 방향(각도가 2π를 넘어간 뒤)을 볼 때만 총이 안 맞는, <b>재현이 지독하게 어려운 버그</b>가 됩니다. atan2와 각도 뺄셈이 만나는 곳엔 반드시 정규화를 두세요.</div>`},

{t:'벽 뒤는 못 맞춘다',k:'WALL CHECK',h:`
<p>각도만 검사하면 <em>벽 너머의 적</em>도 맞아 버립니다. 조준 판정을 통과한 적에 대해, 마지막 관문으로 광선을 쏩니다 — 슬라이드 3에서 임프가 하던 시선 판정과 완전히 같은 비교, 방향만 반대입니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py"># 벽이 가로막고 있으면 못 맞춘다
_, wall_d, _, _ = cast_ray(pl.x, pl.y, math.atan2(s.y - pl.y, s.x - pl.x))
if wall_d &gt; d:
    best, best_d = s, d</pre>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">if (castRay(player.x, player.y, a)[1] &gt; d) { best = s; bestD = d; }</pre>
<p>이번엔 부등호가 반대인 것을 확인하세요. <b>wall_d &gt; d = 벽이 적보다 멀다 = 명중 가능</b>. castRay의 세 번째 등장입니다:</p>
<ul class="b">
<li>6장 — 플레이어의 <b>눈</b> (벽 기둥 렌더링, 640발/프레임)</li>
<li>이번 장 슬라이드 3 — 임프의 <b>눈</b> (시선 판정, 마리당 1발)</li>
<li>지금 — 플레이어의 <b>총알</b> (명중 전 벽 검사, 발사당 최대 5발)</li>
</ul>`},

{t:'가장 가까운 적 선택',k:'TARGET SELECT',h:`
<p>조준 원뿔(±7°) 안에 적이 <em>둘 이상</em> 겹쳐 있으면? 총알은 하나이니 한 명만 맞아야 하고, 상식적으로 <em>제일 앞의 적</em>이어야 합니다. 최솟값 찾기의 정석 패턴 — <span class="reg">best</span>/<span class="reg">bestD</span>로 해결합니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">function fire() {
  if (player.ammo &lt;= 0) { msg = '탄약이 없다!'; msgT = 1.2; return; }
  player.ammo--; gunKick = 1;
  var best = null, bestD = 1e9;
  sprites.forEach(function (s) {
    if (!s.alive || s.kind !== 'imp') return;
    var d = Math.hypot(s.x - player.x, s.y - player.y);
    var a = Math.atan2(s.y - player.y, s.x - player.x);
    // ... rel 계산(앞 슬라이드의 각도 정규화) ...
    if (Math.abs(rel) &lt; 0.12 &amp;&amp; d &lt; bestD) {
      if (castRay(player.x, player.y, a)[1] &gt; d) { best = s; bestD = d; }
    }
  });
  if (best) {
    best.hp--;
    if (best.hp &lt;= 0) { best.alive = false; msg = '악마 처치!'; msgT = 1.2; }
  }
}</pre>
<p>세부를 짚어 봅니다. 탄약은 <em>맞든 빗나가든</em> 먼저 소모됩니다(첫 줄). 후보 조건은 3중 필터 — 살아 있는 임프, 각도 통과, 벽 통과 — 이고 그중 <span class="reg">d &lt; bestD</span>인 것만 살아남으니, 루프가 끝나면 best에는 <em>모든 조건을 만족하는 가장 가까운 적</em>이 남습니다.</p>`},

{t:'무기 연출 — 반동과 총구 화염',k:'GUN FEEDBACK',h:`
<p>판정은 완성됐지만 지금 상태로는 <em>쏘는 느낌</em>이 없습니다. 화면 아래에 총을 그리고, 발사 순간 총이 튀어 오르며 화염이 번쩍하게 만듭니다. 여기서도 타이머 변수 하나 — <span class="reg">gunKick</span>입니다. fire()에서 1로 세팅하고 매 프레임 <span class="reg">dt * 4</span>씩 줄입니다(0.25초 연출).</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">ctx.putImageData(image, 0, 0);      // 픽셀 버퍼를 화면에 복사한 뒤
var gx = W / 2 - 22, gy = H - 62 + gunKick * 18;    // 그 위에 총/글자를 그린다
ctx.fillStyle = '#373c46';
ctx.beginPath();
ctx.moveTo(gx, H); ctx.lineTo(gx + 16, gy); ctx.lineTo(gx + 30, gy);
ctx.lineTo(gx + 44, H); ctx.fill();
ctx.fillStyle = '#23262e'; ctx.fillRect(gx + 17, gy - 14, 12, 20);
if (gunKick &gt; 0.55) {                               // 총구 화염
  ctx.fillStyle = '#ffdc5a';
  ctx.beginPath(); ctx.arc(gx + 23, gy - 20, 10, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff781e';
  ctx.beginPath(); ctx.arc(gx + 23, gy - 20, 5, 0, 7); ctx.fill();
}</pre>
<p>총은 텍스처가 아니라 <em>사다리꼴 폴리곤 + 사각형</em>입니다(원조 Doom은 손 그림 스프라이트였죠). 연출의 핵심 두 가지:</p>
<ul class="b">
<li><b>반동</b>: gy에 <span class="reg">gunKick * 18</span>을 더해 총이 최대 18픽셀 <em>내려갔다가</em> 부드럽게 제자리로. 값 하나가 위치를 직접 구동합니다.</li>
<li><b>총구 화염</b>: <span class="reg">gunKick &gt; 0.55</span> 조건으로 반동의 <em>앞부분 약 0.1초 동안만</em> 노랑·주황 원 두 개를 겹쳐 그립니다. 번쩍하고 사라지는 타이밍이 이 한 줄로 결정됩니다.</li>
</ul>`},

{t:'HUD — 체력, 탄약, 메시지',k:'HUD',h:`
<p>전투가 생기면 플레이어에게 <em>숫자를 보여줄 의무</em>가 생깁니다. 화면 아래 24픽셀 띠에 HP와 AMMO를 씁니다. 3D 세계와 달리 HUD는 원근도 z버퍼도 없이 <em>제일 마지막에 그냥 덮어 그리는</em> 2D입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">ctx.fillStyle = '#101016'; ctx.fillRect(0, H - 24, W, 24);
ctx.font = 'bold 14px monospace';
ctx.fillStyle = player.hp &gt; 30 ? '#5adc5a' : '#e64632';
ctx.fillText('HP ' + player.hp, 10, H - 8);
ctx.fillStyle = '#f0c850';
ctx.fillText('AMMO ' + player.ammo, 110, H - 8);</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">hp_col = (90, 220, 90) if pl.hp &gt; 30 else (230, 70, 50)
buf.blit(font.render('HP %3d' % pl.hp, False, hp_col), (10, H - 20))
buf.blit(font.render('AMMO %2d' % pl.ammo, False, (240, 200, 80)), (110, H - 20))</pre>
<p>디테일 하나: HP가 <b>30 이하로 떨어지면 글자가 빨간색</b>이 됩니다. 임프 공격 4번이면 30이 무너지는 수치이므로, "빨강 = 다음 교전에서 죽을 수 있음"이라는 경고가 됩니다. 원조 Doom이 피 흘리는 얼굴로 전하던 정보를 우리는 색 하나로 전합니다.</p>
<div class="note grn">그리는 순서가 곧 레이어입니다: 벽 → 스프라이트 → 미니맵 → 총 → HUD. HUD가 마지막이라 무엇에도 가려지지 않습니다.</div>`},

{t:'죽음과 재시작',k:'GAME OVER',h:`
<p>HP가 0에 닿으면 게임이 끝나야 합니다. 11장의 출구에서 만든 <span class="reg">over</span> 문자열 상태를 그대로 씁니다 — 이번엔 승리가 아니라 패배 문구를 담을 뿐입니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">if pl.hp &lt;= 0:
    pl.hp = 0
    over = '전사... R로 재시작'</pre>
<p><span class="reg">pl.hp = 0</span>으로 고정하는 이유: 8 데미지씩 깎이므로 마지막 일격에 -4 같은 음수가 되는데, HUD에 "HP -4"가 찍히면 볼썽사납기 때문입니다. over가 차면 이동·AI·발사가 모두 잠기고, <kbd>R</kbd>만 열려 있습니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">if e.key == pygame.K_r and over:
    pl, sprites = reset_world()
    over = ''</pre>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">if (e.code === 'KeyR' &amp;&amp; over) resetWorld();</pre>
<p>재시작이 한 줄인 것은 설계의 승리입니다. 게임의 모든 가변 상태 — 맵(열린 문 포함!), 플레이어, 임프, 아이템 — 가 <span class="reg">reset_world()</span> 한 함수에서 생성되도록 처음부터 모아 두었기 때문에, <em>그 함수를 다시 부르는 것만으로 세계가 새것이 됩니다</em>.</p>
<div class="note red">흔한 버그: 리셋 함수가 world 배열을 빼먹으면, 재시작해도 <b>지난 판에 열어 둔 문이 열린 채</b>로 시작합니다. 가변 상태는 반드시 한 곳에서 태어나게 하세요.</div>`},

{t:'실습 — 임프 5마리 사냥',k:'LIVE DEMO',h:`
<p>배운 것을 전부 걸고 실전입니다. 맵에는 <b>임프 5마리</b>와 <b>구급상자 2개</b>가 있습니다. 전부 처치하거나, 오른쪽 아래 출구로 탈출해 보세요. 탄약은 40발입니다.</p>

<li><b>지형 활용</b>: 좁은 통로나 문에서 싸우면 한 번에 한 마리씩만 옵니다. 여럿에게 포위당하는 것이 최악입니다(초당 8 × 마릿수).</li>

<li>조준은 ±7°로 너그럽습니다. 임프가 화면 중앙 근처에만 오면 FIRE.</li>

{t:'12장 정리',k:'RECAP',h:`

slides:[

{t:'실행 방법 — 저장하고 더블클릭',k:'RUN IT',h:`
<p>실행 절차는 놀랄 만큼 짧습니다.</p>

{t:'전체 코드 1/14 — HTML 뼈대와 터치 패드',k:'FULL CODE 1/14',h:`
<p>게임을 담는 그릇입니다. 640×400 캔버스 하나, 모바일용 터치 버튼 여섯 개, 그리고 조작법 안내가 전부입니다. 스타일의 <b>image-rendering:pixelated</b>는 캔버스를 확대할 때 픽셀을 뭉개지 않고 각지게 유지해 레트로 느낌을 살립니다.</p>
<pre class="code" data-lang="js">&lt;!DOCTYPE html&gt;
&lt;html lang="ko"&gt;
&lt;head&gt;
&lt;meta charset="UTF-8"&gt;
&lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;
&lt;title&gt;JSDoom — 레이캐스팅 Doom 클론 (바닐라 JS + Canvas)&lt;/title&gt;
&lt;style&gt;
  body{margin:0;background:#111;display:flex;flex-direction:column;
       align-items:center;font-family:monospace;color:#ddd;}
  h1{font-size:16px;margin:10px 0 6px;}
  canvas{width:min(96vw,960px);image-rendering:pixelated;background:#000;}
  #pad{display:flex;gap:8px;margin:10px;flex-wrap:wrap;justify-content:center;}
  #pad button{font-size:18px;padding:12px 18px;background:#222;color:#eee;
       border:1px solid #555;border-radius:10px;touch-action:none;user-select:none;}
  p{font-size:12px;color:#888;}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;h1&gt;JSDoom — Raycasting Clone&lt;/h1&gt;
&lt;canvas id="screen" width="640" height="400"&gt;&lt;/canvas&gt;
&lt;div id="pad"&gt;
  &lt;button data-k="KeyA"&gt;&amp;#8634;&lt;/button&gt;&lt;button data-k="KeyW"&gt;&amp;#9650;&lt;/button&gt;
  &lt;button data-k="KeyD"&gt;&amp;#8635;&lt;/button&gt;&lt;button data-k="KeyS"&gt;&amp;#9660;&lt;/button&gt;
  &lt;button data-k="Space"&gt;FIRE&lt;/button&gt;&lt;button data-k="KeyF"&gt;OPEN&lt;/button&gt;
&lt;/div&gt;
&lt;p&gt;W/S 이동 · A/D 회전 · Q/E 옆걸음 · Space 발사 · F 문 열기 · Tab 미니맵 · R 재시작&lt;/p&gt;
&lt;script&gt;
  ... (아래 파트 2부터의 자바스크립트가 여기 들어간다) ...
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;</pre>
<div class="note">script 안의 "... 자리 표시" 주석 위치에 다음 파트 2부터 14까지의 자바스크립트가 순서대로 들어갑니다.</div>`},

{t:'전체 코드 2/14 — 상수',k:'FULL CODE 2/14',h:`
<p>게임 전체가 참조하는 상수들입니다. 내부 해상도 640×400, 시야각 FOV는 60°(π/3), 텍스처 한 변 TEX는 64픽셀 — 앞 장들에서 계속 써 온 바로 그 값들입니다.</p>
<pre class="code" data-lang="js">'use strict';
// =============================================================
//  JSDoom — 레이캐스팅 Doom 클론 (바닐라 JS 단일 파일 완성본)
// =============================================================

// ---------- 1. 상수 ----------
var W = 640, H = 400, HALF_H = H &gt;&gt; 1;
var FOV = Math.PI / 3;            // 시야각 60도
var MAX_DEPTH = 24;
var TEX = 64;                     // 텍스처 한 변
var MOVE_SPD = 3.2, ROT_SPD = 2.6;</pre>
<div class="note">HALF_H = H &gt;&gt; 1 처럼 2로 나누기를 비트 시프트로 쓰는 것은 이 코드의 습관입니다. 지평선(화면 세로 중앙)은 이후 투영과 바닥 그리기의 기준선이 됩니다.</div>`},

{t:'전체 코드 3/14 — 맵과 cell 함수',k:'FULL CODE 3/14',h:`
<p>16×14 문자열 맵입니다. 0 빈칸, 1 벽돌, 2 돌, 3 금속, 4 문, 5 출구. 문자열이라 눈으로 지형이 그대로 보이고, 고치기도 쉽습니다.</p>
<pre class="code" data-lang="js">// ---------- 2. 맵 ----------
// 0 빈칸 / 1 벽돌 / 2 돌 / 3 금속 / 4 문 / 5 출구
var MAP_STR = [
  '1111111111111111',
  '1000000110000001',
  '1020000110000201',
  '1000000000000001',
  '1000111141110001',
  '1000100000010001',
  '1300100000010031',
  '1000100000010001',
  '1000111411110001',
  '1000000000000001',
  '1020000330000201',
  '1000000330000001',
  '1000000000000051',
  '1111111111111111'
];
var MAP_W = MAP_STR[0].length, MAP_H = MAP_STR.length;
var world = [];
function cell(x, y) {
  if (x &lt; 0 || y &lt; 0 || x &gt;= MAP_W || y &gt;= MAP_H) return 1;
  return world[y][x];
}</pre>
<div class="note">cell()은 맵 밖 좌표를 물으면 무조건 1(벽)을 돌려줍니다. 경계 검사를 이 한 곳에 모아 두면, 광선이나 플레이어가 맵 밖으로 새는 버그를 원천 차단할 수 있습니다.</div>`},

{t:'전체 코드 4/14 — 절차적 텍스처',k:'FULL CODE 4/14',h:`
<p>이미지 파일 대신 <em>수식</em>으로 벽 무늬 다섯 종을 만듭니다. 벽돌은 줄눈 격자, 돌은 유사 난수 얼룩, 금속은 패널 홈과 리벳, 문과 출구는 체크무늬입니다.</p>
<pre class="code" data-lang="js">// ---------- 3. 절차적 텍스처 ----------
// 텍스처는 Uint32Array (ABGR 리틀엔디언) 로 저장한다.
function rgb(r, g, b) { return (0xff000000 | (b &lt;&lt; 16) | (g &lt;&lt; 8) | r) &gt;&gt;&gt; 0; }

function makeTexture(id) {
  var t = new Uint32Array(TEX * TEX), x, y, c, row, off, mortar, n, g;
  for (y = 0; y &lt; TEX; y++) for (x = 0; x &lt; TEX; x++) {
    if (id === 1) {                       // 벽돌
      row = (y &gt;&gt; 4); off = (row &amp; 1) ? 16 : 0;
      mortar = (y % 16 &lt; 2) || ((x + off) % 32 &lt; 2);
      c = mortar ? rgb(60, 24, 20) : rgb(150, 60, 44);
      if (!mortar &amp;&amp; (x * 7 + y * 13) % 31 === 0) c = rgb(120, 46, 36);
    } else if (id === 2) {                // 돌
      n = (x * x * 3 + y * y * 7 + x * y) % 97;
      g = 90 + (n % 40); c = rgb(g, g, g + 8);
      if ((x + y * 3) % 23 === 0) c = rgb(70, 70, 78);
    } else if (id === 3) {                // 금속판
      g = 70 + (y % 16) * 3; c = rgb(g - 20, g, g + 14);
      if (x % 16 &lt; 2 || y % 16 &lt; 2) c = rgb(40, 46, 56);
      if ((x % 16 === 4 || x % 16 === 12) &amp;&amp; (y % 16 === 4 || y % 16 === 12))
        c = rgb(180, 190, 205);
    } else if (id === 4) {                // 문
      c = (((x &gt;&gt; 3) + (y &gt;&gt; 3)) &amp; 1) ? rgb(40, 90, 60) : rgb(30, 70, 46);
      if (x &gt;= 28 &amp;&amp; x &lt; 36) c = rgb(200, 170, 60);
    } else {                              // 출구
      c = (((x &gt;&gt; 3) + (y &gt;&gt; 3)) &amp; 1) ? rgb(160, 30, 30) : rgb(240, 220, 210);
    }
    t[y * TEX + x] = c;
  }
  return t;
}
var TEXS = { 1: makeTexture(1), 2: makeTexture(2), 3: makeTexture(3),
             4: makeTexture(4), 5: makeTexture(5) };</pre>
<div class="note">rgb()가 만드는 값은 캔버스 픽셀 버퍼가 리틀엔디언 메모리에서 기대하는 <b>ABGR 32비트 정수</b>입니다. 마지막 &gt;&gt;&gt; 0 은 부호 없는 정수로 고정하는 관용구입니다.</div>`},

{t:'전체 코드 5/14 — 스프라이트 그림',k:'FULL CODE 5/14',h:`
<p>적(임프)과 구급상자도 파일 없이 만듭니다. 화면 밖의 임시 캔버스에 도형으로 그린 뒤 getImageData로 픽셀 배열을 뽑아 오는 방식입니다. 그리지 않은 부분은 알파 0으로 남아 자연스럽게 <b>투명 배경</b>이 됩니다.</p>
<pre class="code" data-lang="js">// ---------- 4. 스프라이트 그림 ----------
// 작은 오프스크린 캔버스에 도형으로 그린 뒤 픽셀 배열로 뽑아 온다.
function drawToArray(draw) {
  var cv = document.createElement('canvas');
  cv.width = TEX; cv.height = TEX;
  var c = cv.getContext('2d');
  draw(c);
  return new Uint32Array(c.getImageData(0, 0, TEX, TEX).data.buffer);
}
var IMG_IMP = drawToArray(function (c) {
  var x, y, dx, dy;
  c.fillStyle = '#8c4628';
  for (y = 0; y &lt; TEX; y++) for (x = 0; x &lt; TEX; x++) {
    dx = x - 32; dy = y - 34;

  }
  c.beginPath(); c.arc(32, 16, 11, 0, 7); c.fill();               // 머리
  c.fillStyle = '#c8b4a0';                                        // 뿔
  c.beginPath(); c.moveTo(22, 8); c.lineTo(18, 0); c.lineTo(26, 6); c.fill();
  c.beginPath(); c.moveTo(42, 8); c.lineTo(46, 0); c.lineTo(38, 6); c.fill();
  c.fillStyle = '#8c4628';
  c.fillRect(14, 30, 8, 20); c.fillRect(42, 30, 8, 20);           // 팔
  c.fillStyle = '#6e3220';
  c.fillRect(24, 52, 7, 12); c.fillRect(33, 52, 7, 12);           // 다리
  c.fillStyle = '#fff050';                                        // 눈
  c.fillRect(25, 12, 4, 4); c.fillRect(35, 12, 4, 4);
  c.fillStyle = '#000';
  c.fillRect(26, 13, 2, 2); c.fillRect(36, 13, 2, 2);
});
var IMG_MEDKIT = drawToArray(function (c) {
  c.fillStyle = '#ebebeb'; c.fillRect(16, 34, 32, 22);
  c.fillStyle = '#c82828'; c.fillRect(28, 38, 8, 14); c.fillRect(25, 41, 14, 8);

{t:'전체 코드 7/14 — DDA 레이캐스팅',k:'FULL CODE 7/14',h:`
<p>엔진의 심장입니다. 5장에서 유도한 DDA 그대로 — ddx·ddy(칸 하나를 건너는 데 드는 광선 길이)와 sideX·sideY(다음 세로선·가로선까지의 거리)를 비교하며 한 칸씩 전진합니다.</p>
<pre class="code" data-lang="js">// ---------- 6. DDA 레이캐스팅 ----------
// 반환: [맞은 칸 값, 거리, 벽면 위 x좌표(0~1), 남북면 여부]
function castRay(px, py, ang) {
  var sin = Math.sin(ang), cos = Math.cos(ang);
  var mapX = px | 0, mapY = py | 0;
  var ddx = cos === 0 ? 1e30 : Math.abs(1 / cos);
  var ddy = sin === 0 ? 1e30 : Math.abs(1 / sin);
  var stepX, stepY, sideX, sideY, side = 0, i, tile, dist, hit;
  if (cos &lt; 0) { stepX = -1; sideX = (px - mapX) * ddx; }
  else         { stepX = 1;  sideX = (mapX + 1 - px) * ddx; }
  if (sin &lt; 0) { stepY = -1; sideY = (py - mapY) * ddy; }
  else         { stepY = 1;  sideY = (mapY + 1 - py) * ddy; }
  for (i = 0; i &lt; 64; i++) {
    if (sideX &lt; sideY) { sideX += ddx; mapX += stepX; side = 0; }
    else               { sideY += ddy; mapY += stepY; side = 1; }
    tile = cell(mapX, mapY);
    if (tile &gt; 0) {
      dist = side === 0 ? sideX - ddx : sideY - ddy;
      if (dist &lt; 1e-4) dist = 1e-4;
      hit = side === 0 ? py + dist * sin : px + dist * cos;
      return [tile, dist, hit - Math.floor(hit), side];
    }
  }
  return [1, MAX_DEPTH, 0, 0];
}</pre>
<div class="note">반환값 네 개가 렌더러에 필요한 전부입니다: 맞은 칸 값(어느 텍스처), 거리(기둥 높이), 벽면 위 x좌표 0~1(텍스처 세로줄 선택), 남북면 여부(음영). dist &lt; 1e-4 방어는 0으로 나누기를 막습니다.</div>`},

{t:'전체 코드 8/14 — 렌더링 ① 픽셀 버퍼와 벽',k:'FULL CODE 8/14',h:`
<p>렌더링 준비물(픽셀 버퍼 pix, 열별 깊이 zbuf, 음영 함수 shade)과 벽 그리기입니다. 열마다 광선 각도를 탄젠트 기반으로 뽑고, depth = dist × cos(각도차)로 어안을 보정한 뒤, 텍스처 세로줄을 안개와 함께 찍습니다.</p>
<pre class="code" data-lang="js">// ---------- 7. 렌더링 ----------
var canvas = document.getElementById('screen');
var ctx = canvas.getContext('2d');
var image = ctx.createImageData(W, H);
var pix = new Uint32Array(image.data.buffer);   // 화면 전체 픽셀 버퍼
var zbuf = new Float64Array(W);

var C_CEIL = rgb(30, 34, 44), C_FLOOR = rgb(52, 46, 40);

function shade(c, f) {           // 색 c 를 f(0~1) 배율로 어둡게
  var r = (c &amp; 255) * f, g = ((c &gt;&gt; 8) &amp; 255) * f, b = ((c &gt;&gt; 16) &amp; 255) * f;
  return rgb(r | 0, g | 0, b | 0);
}

function renderWalls() {
  var col, cam, rayAng, hitData, tile, dist, wallX, side, depth;
  var lineH, y0, y1, texX, step, texPos, y, tex, c, fog;
  for (col = 0; col &lt; W; col++) {
    // 화면 x좌표 → 광선 각도 (탄젠트 기반: 균등 간격 투영면)
    cam = 2 * col / W - 1;
    rayAng = player.ang + Math.atan(cam * Math.tan(FOV / 2));
    hitData = castRay(player.x, player.y, rayAng);
    tile = hitData[0]; dist = hitData[1]; wallX = hitData[2]; side = hitData[3];
    depth = dist * Math.cos(rayAng - player.ang);      // 어안 보정
    zbuf[col] = depth;
    lineH = (H / depth) | 0;
    y0 = HALF_H - (lineH &gt;&gt; 1); y1 = y0 + lineH;
    if (y0 &lt; 0) y0 = 0;
    if (y1 &gt; H) y1 = H;
    tex = TEXS[tile];
    texX = (wallX * TEX) | 0;
    step = TEX / lineH;
    texPos = (y0 - HALF_H + lineH / 2) * step;
    fog = 1 - Math.min(1, depth / 14);                 // 거리 안개
    if (side === 1) fog *= 0.62;                       // 남북 벽면은 그늘
    for (y = y0; y &lt; y1; y++) {
      c = tex[((texPos | 0) &amp; (TEX - 1)) * TEX + texX];
      texPos += step;
      pix[y * W + col] = shade(c, fog);
    }
    // 천장/바닥 (단색 + 거리 그라데이션)
    for (y = 0; y &lt; y0; y++)
      pix[y * W + col] = shade(C_CEIL, 1 - y / H * 0.7);
    for (y = y1; y &lt; H; y++)
      pix[y * W + col] = shade(C_FLOOR, (y - HALF_H) / HALF_H * 0.9 + 0.1);
  }</pre>
<div class="note">이 파트는 renderWalls의 여는 쪽까지입니다 — 함수를 닫는 중괄호가 다음 파트 첫 줄에 있습니다. 천장·바닥은 단색이지만 세로 위치에 따라 밝기를 바꿔 공짜로 원근감을 얻습니다.</div>`},

{t:'전체 코드 9/14 — 렌더링 ② 스프라이트와 z버퍼',k:'FULL CODE 9/14',h:`
<p>첫 줄의 중괄호가 앞 파트 renderWalls를 닫습니다. 이어서 스프라이트: 먼 것부터 정렬해 그리는 화가 알고리즘에, 열마다 depth ≥ zbuf[col] 검사를 더해 <em>벽 뒤에 숨은 부분만</em> 정확히 잘라냅니다. 끝에서는 renderMinimap이 시작되어 맵 칸을 픽셀로 찍습니다.</p>
<pre class="code" data-lang="js">}

function renderSprites() {
  var order = sprites.filter(function (s) { return s.alive; });
  order.sort(function (a, b) {
    var da = (a.x - player.x) * (a.x - player.x) + (a.y - player.y) * (a.y - player.y);
    var db = (b.x - player.x) * (b.x - player.x) + (b.y - player.y) * (b.y - player.y);
    return db - da;                                   // 먼 것부터 그린다
  });
  order.forEach(function (s) {
    var dx = s.x - player.x, dy = s.y - player.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist &lt; 0.4 || dist &gt; MAX_DEPTH) return;
    var rel = Math.atan2(dy, dx) - player.ang;
    rel = ((rel + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
    if (Math.abs(rel) &gt; FOV / 2 + 0.4) return;
    var depth = dist * Math.cos(rel);
    var size = (H / depth) | 0;
    if (size &lt;= 1) return;
    var sx = (((0.5 + Math.tan(rel) / (2 * Math.tan(FOV / 2))) * W) - size / 2) | 0;
    var sy = HALF_H - (size &gt;&gt; 1);
    var img = s.kind === 'imp' ? IMG_IMP : IMG_MEDKIT;
    var i, y, col, tx, ty, c, fog = 1 - Math.min(1, depth / 14);
    for (i = 0; i &lt; size; i++) {
      col = sx + i;
      if (col &lt; 0 || col &gt;= W || depth &gt;= zbuf[col]) continue;   // z버퍼 검사
      tx = (i / size * TEX) | 0;
      for (y = 0; y &lt; size; y++) {
        var sy2 = sy + y;
        if (sy2 &lt; 0 || sy2 &gt;= H) continue;
        ty = (y / size * TEX) | 0;
        c = img[ty * TEX + tx];
        if ((c &gt;&gt;&gt; 24) &lt; 128) continue;               // 투명 픽셀 건너뜀
        pix[sy2 * W + col] = shade(c, fog);
      }
    }
  });
}

function renderMinimap() {
  var mm = 6, x, y, i, s;
  for (y = 0; y &lt; MAP_H * mm; y++) for (x = 0; x &lt; MAP_W * mm; x++) {
    var t = world[(y / mm) | 0][(x / mm) | 0];
    pix[y * W + x] = t === 0 ? rgb(10, 10, 14) :
                     t === 4 ? rgb(60, 160, 90) : rgb(90, 90, 110);
  }</pre>
<div class="note red">rel 각도를 -π~π 범위로 접는 이중 나머지 연산을 빼먹으면, 플레이어가 한 바퀴 돌 때마다 스프라이트가 시야에서 사라지는 고전적인 버그가 납니다.</div>`},

{t:'전체 코드 10/14 — 렌더링 ③ 미니맵 마커와 HUD',k:'FULL CODE 10/14',h:`
<p>미니맵 마무리(적은 빨강, 플레이어는 초록 점과 시선 방향 점선)와 HUD입니다. putImageData로 픽셀 버퍼를 화면에 복사한 <em>다음</em>, 그 위에 캔버스 2D API로 총·총구 화염·HP·탄약·메시지를 겹쳐 그립니다. 픽셀 엔진과 벡터 API의 역할 분담입니다.</p>
<pre class="code" data-lang="js">  for (i = 0; i &lt; sprites.length; i++) {
    s = sprites[i];
    if (s.alive &amp;&amp; s.kind === 'imp')
      fillRectPix((s.x * mm - 1) | 0, (s.y * mm - 1) | 0, 3, 3, rgb(220, 60, 40));

function renderHud() {
  ctx.putImageData(image, 0, 0);      // 픽셀 버퍼를 화면에 복사한 뒤

  ctx.fillStyle = '#373c46';
  ctx.beginPath();
  ctx.moveTo(gx, H); ctx.lineTo(gx + 16, gy); ctx.lineTo(gx + 30, gy);
  ctx.lineTo(gx + 44, H); ctx.fill();
  ctx.fillStyle = '#23262e'; ctx.fillRect(gx + 17, gy - 14, 12, 20);
  if (gunKick &gt; 0.55) {                               // 총구 화염

    ctx.beginPath(); ctx.arc(gx + 23, gy - 20, 10, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff781e';
    ctx.beginPath(); ctx.arc(gx + 23, gy - 20, 5, 0, 7); ctx.fill();
  }

  if (msgT &gt; 0) ctx.fillText(msg, W / 2, 40);

{t:'전체 코드 11/14 — 게임 로직 ① 이동·발사·추격',k:'FULL CODE 11/14',h:`
<p>게임 규칙이 시작됩니다. tryMove는 x·y축을 따로 검사해 벽에 부딪히면 <em>미끄러지게</em> 하고, fire()는 조준각 0.12rad 안의 가장 가까운 적을 찾되 castRay로 <b>벽이 가리는지</b>까지 확인하는 히트스캔입니다. updateEnemies의 추격 분기까지 이어집니다.</p>
<pre class="code" data-lang="js">// ---------- 8. 게임 로직 ----------
function tryMove(nx, ny) {           // 벽에 부딪히면 축별로 미끄러진다
  var r = 0.25;
  if (cell((nx + (nx &gt; player.x ? r : -r)) | 0, player.y | 0) === 0) player.x = nx;
  if (cell(player.x | 0, (ny + (ny &gt; player.y ? r : -r)) | 0) === 0) player.y = ny;
}

function fire() {
  if (player.ammo &lt;= 0) { msg = '탄약이 없다!'; msgT = 1.2; return; }
  player.ammo--; gunKick = 1;

  sprites.forEach(function (s) {
    if (!s.alive || s.kind !== 'imp') return;
    var d = Math.hypot(s.x - player.x, s.y - player.y);
    var a = Math.atan2(s.y - player.y, s.x - player.x);
    var rel = ((a - player.ang + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
    if (Math.abs(rel) &lt; 0.12 &amp;&amp; d &lt; bestD) {
      if (castRay(player.x, player.y, a)[1] &gt; d) { best = s; bestD = d; }
    }
  });
  if (best) {
    best.hp--;
    if (best.hp &lt;= 0) { best.alive = false; msg = '악마 처치!'; msgT = 1.2; }
  }
}

      if (cell(s.x | 0, ny | 0) === 0) s.y = ny;
    } else {                                          // 공격</pre>
<div class="note">적의 시야 판정과 총알 판정이 같은 castRay를 재사용합니다 — 레이캐스팅은 렌더링 전용 기술이 아니라 이 게임의 만능 자입니다.</div>`},

{t:'전체 코드 12/14 — 게임 로직 ② 적의 공격과 문·출구',k:'FULL CODE 12/14',h:`
<p>앞 파트에서 열린 공격 분기의 몸통입니다. 1초 쿨다운으로 8씩 피해를 주고, HP가 0이 되면 게임 오버. openDoor()는 시선 방향 1.2칸 앞을 보고 문(4)이면 맵을 0으로 바꿔 열고, 출구(5)면 탈출 성공을 선언합니다.</p>
<pre class="code" data-lang="js">      s.cool -= dt;
      if (s.cool &lt;= 0) {
        player.hp -= 8; s.cool = 1; msg = '피격! -8'; msgT = 1.2;
        if (player.hp &lt;= 0) { player.hp = 0; over = '전사... R로 재시작'; }
      }
    }
  });
}

function openDoor() {
  var tx = (player.x + Math.cos(player.ang) * 1.2) | 0;
  var ty = (player.y + Math.sin(player.ang) * 1.2) | 0;
  if (cell(tx, ty) === 4) { world[ty][tx] = 0; msg = '문이 열렸다'; msgT = 1.2; }
  else if (cell(tx, ty) === 5) over = '탈출 성공! R로 재시작';
}</pre>
<div class="note">문 열기가 world[ty][tx] = 0 한 줄인 이유: 맵이 곧 충돌 판정이고 곧 렌더링 대상이기 때문입니다. 데이터 하나를 고치면 보이는 것과 부딪히는 것이 동시에 바뀝니다.</div>`},

{t:'전체 코드 13/14 — 입력 처리',k:'FULL CODE 13/14',h:`
<p>keys 객체에 눌린 키를 기록해 두고 메인 루프가 매 프레임 읽어 가는 <b>폴링 방식</b>입니다. 발사·문 열기처럼 "누르는 순간 한 번"인 동작만 이벤트에서 직접 처리합니다. 터치 버튼은 pointerdown/up으로 같은 keys를 조작해 코드 중복이 없습니다.</p>
<pre class="code" data-lang="js">// ---------- 9. 입력 ----------
var keys = {};
window.addEventListener('keydown', function (e) {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); if (!over) fire(); }
  if (e.code === 'KeyF' &amp;&amp; !over) openDoor();
  if (e.code === 'Tab') { e.preventDefault(); showMap = !showMap; }
  if (e.code === 'KeyR' &amp;&amp; over) resetWorld();
});
window.addEventListener('keyup', function (e) { keys[e.code] = false; });
// 터치 버튼 (모바일/폴더블)
document.querySelectorAll('#pad button').forEach(function (b) {
  var k = b.dataset.k;
  function down(e) {
    e.preventDefault(); keys[k] = true;
    if (k === 'Space' &amp;&amp; !over) fire();
    if (k === 'KeyF' &amp;&amp; !over) openDoor();
  }
  function up(e) { e.preventDefault(); keys[k] = false; }
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointerleave', up);
});</pre>
<div class="note">pointerleave에서도 버튼을 떼는 처리를 해야 합니다 — 손가락이 버튼 밖으로 미끄러져 나가면 pointerup이 안 올 수 있어, 캐릭터가 혼자 계속 걷는 버그가 됩니다.</div>`},

{t:'전체 코드 14/14 — 메인 루프',k:'FULL CODE 14/14',h:`
<p>마지막 조각, 심장 박동입니다. dt를 초 단위로 재서 이동·회전·AI에 곱하니 어떤 기기에서든 <em>같은 속도</em>로 움직입니다. 갱신과 그리기의 순서도 한눈에 보입니다: 입력 → 이동 → AI → 벽 → 스프라이트 → 미니맵 → HUD.</p>
<pre class="code" data-lang="js">// ---------- 10. 메인 루프 ----------
var last = 0;
function frame(ts) {
  var dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (!over) {
    if (keys.KeyA) player.ang -= ROT_SPD * dt;
    if (keys.KeyD) player.ang += ROT_SPD * dt;
    var dx = Math.cos(player.ang) * MOVE_SPD * dt;
    var dy = Math.sin(player.ang) * MOVE_SPD * dt;
    if (keys.KeyW) tryMove(player.x + dx, player.y + dy);
    if (keys.KeyS) tryMove(player.x - dx, player.y - dy);
    if (keys.KeyQ) tryMove(player.x + dy, player.y - dx);
    if (keys.KeyE) tryMove(player.x - dy, player.y + dx);
    updateEnemies(dt);
  }
  gunKick = Math.max(0, gunKick - dt * 4);
  msgT = Math.max(0, msgT - dt);
  renderWalls();
  renderSprites();
  if (showMap) renderMinimap();
  renderHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);</pre>
<div class="note">Math.min(0.05, ...) 는 탭 전환 등으로 프레임이 오래 멈췄다 돌아왔을 때 dt가 수 초로 폭주해 벽을 뚫는 사고를 막는 안전벨트입니다. 이 줄까지 붙여 넣고 저장하면 — 완성입니다.</div>`},

{t:'pygame 30초 소개',k:'PYGAME 101',h:`
<p><b>pygame</b>은 C로 작성된 멀티미디어 라이브러리 <b>SDL</b>(Simple DirectMedia Layer)을
파이썬에서 쓸 수 있게 감싼 래퍼입니다. 1997년 말 공개된 Doom 소스의
수많은 포팅판도, 수많은 인디 게임도 SDL 위에서 돌아갑니다.</p>
<div class="tagrow">
<span class="tag">SDL 래퍼</span>
<span class="tag">Surface = 픽셀 사각형</span>
<span class="tag">blit = Surface 복사</span>
<span class="tag">이벤트 루프</span>
<span class="tag">Clock = 프레임 제어</span>
<span class="tag">mixer = 사운드</span>
</div>
<ul class="b">
<li><b>Surface</b> — pygame의 모든 그림은 Surface입니다. 화면도 Surface,
텍스처도 Surface, 스프라이트도 Surface입니다. Canvas와 ImageData를 합친 개념입니다.</li>
<li><b>blit</b> — 한 Surface를 다른 Surface 위에 복사하는 연산.
C로 구현되어 있어 <em>파이썬 루프보다 압도적으로 빠릅니다.</em></li>
<li><b>이벤트 루프</b> — 브라우저가 대신 돌려 주던 이벤트 루프를
pygame에서는 <b>우리가 직접</b> while 문으로 돌립니다.</li>
</ul>`},

{t:'설치와 실행',k:'SETUP',h:`
<p>필요한 것은 Python 3.8 이상과 pygame 하나뿐입니다.
이 문서의 코드는 <b>pygame 2.6</b> 기준으로 작성·테스트했습니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py"># 1) 설치
pip install pygame

# 2) doom.py 한 파일로 저장한 뒤 실행
python doom.py</pre>
<p>실행하면 <b>1280×800</b> 창이 열리고, 미니맵이 켜진 상태로
맵의 왼쪽 위 구석(1.5, 1.5)에서 시작합니다.
외부 이미지·사운드 파일은 하나도 필요 없습니다 —
텍스처와 스프라이트를 전부 코드로 생성하기 때문입니다.</p>
<div class="note">프로젝트마다 라이브러리 버전이 얽히는 것을 막으려면
<b>가상환경</b>을 권합니다: <span class="reg">python -m venv venv</span> →
<span class="reg">source venv/bin/activate</span> (Windows는
<span class="reg">venv\\Scripts\\activate</span>) → 그 안에서 pip install pygame.</div>`},

{t:'JS → Python 번역 사전',k:'TRANSLATION',h:`
<p>13장의 JS 코드를 옆에 두고 읽으면, 아래 대응표 하나로
거의 기계적으로 번역됩니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>JavaScript (13장)</th><th>Python / pygame (이번 장)</th><th>비고</th></tr>
<tr><td>requestAnimationFrame(frame)</td><td>while True: + clock.tick(FPS)</td><td>60fps 상한 제어</td></tr>
<tr><td>canvas + ctx</td><td>pygame.Surface</td><td>내부 버퍼 buf</td></tr>
<tr><td>ImageData 픽셀 배열</td><td>subsurface + transform.scale</td><td>열 단위 blit</td></tr>
<tr><td>keydown/keyup으로 키 상태 추적</td><td>pygame.key.get_pressed()</td><td>매 프레임 스냅샷</td></tr>
<tr><td>addEventListener('keydown')</td><td>pygame.event.get() 의 KEYDOWN</td><td>단발 입력(발사 등)</td></tr>
<tr><td>rAF 타임스탬프 차이로 dt</td><td>clock.tick() 반환값 / 1000</td><td>초 단위 dt</td></tr>
<tr><td>ctx.putImageData(image, 0, 0)</td><td>Surface.blit(...) + transform.scale</td><td>버퍼를 화면으로</td></tr>
<tr><td>Math.hypot / Math.atan2</td><td>math.hypot / math.atan2</td><td>이름까지 같음</td></tr>
<tr><td>camelCase (tryMove)</td><td>snake_case (try_move)</td><td>표기 관례만 차이</td></tr>
</table></div>
<div class="note blue">가장 큰 개념 차이는 <em>이벤트 루프의 소유권</em>입니다.
브라우저는 루프를 자기가 돌리며 우리 콜백을 불러 주지만,
pygame에서는 우리가 while 루프를 돌리며 이벤트를 <b>가져와야</b>(polling) 합니다.</div>`},

{t:'구조 개관 — 9개 섹션',k:'STRUCTURE',h:`
<p>doom.py는 주석 <span class="reg"># ---------- n. 제목 ----------</span> 으로
구분된 <em>9개 섹션</em>으로 이루어져 있고, JS 버전과 순서까지 나란합니다.</p>

{t:'결정적 차이 1 — 픽셀 루프를 피하라',k:'NO PIXEL LOOP',h:`
<p>JS 버전은 매 프레임 <b>640×400 = 256,000개</b> 픽셀을
ImageData 배열에 하나씩 써넣었습니다. JIT 컴파일러가 있는 JS에서는
이것이 충분히 빠르지만, <em>순수 파이썬 for 루프는 대략 수십~수백 배 느립니다.</em>
매 프레임 25만 번의 set_at 호출은 1fps도 못 건집니다.</p>
<div class="grid2">
<div class="card"><h3>JS의 전략 (13장)</h3>
<p>픽셀 단위 내부 루프를 JS로 직접 돌립니다.
JIT가 기계어로 컴파일해 주므로 충분히 빠릅니다.</p></div>
<div class="card"><h3>Python의 전략 (이번 장)</h3>
<p>픽셀 루프를 <b>C에게 위임</b>합니다. 화면 세로줄 하나(1×TEX)를
subsurface로 잘라 transform.scale로 늘린 뒤 blit —
프레임당 파이썬 루프는 <em>640회</em>로 끝납니다.</p></div>
</div>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py"># 열(column) 하나를 그리는 핵심 3줄 — 픽셀 루프가 없다!
column = tex.subsurface(tex_x, 0, 1, TEX)          # 1픽셀 폭 세로줄
column = pygame.transform.scale(column, (1, line_h))  # 늘리기 (C가 수행)
buf.blit(column, (col, y0))                        # 붙이기 (C가 수행)</pre>
<div class="note grn">성능 원칙: <em>파이썬에서는 반복 횟수가 많은 안쪽 루프를
라이브러리(C)에 넘겨라.</em> 우리는 픽셀 25만 번 대신 열 640번만 돌립니다.</div>`},

{t:'결정적 차이 2 — 텍스처는 Surface',k:'SURFACE TEXTURE',h:`
<p>JS 버전에서 텍스처는 Uint32Array였지만, pygame에서는
<b>Surface</b>로 만들어야 subsurface·scale·blit 파이프라인에 태울 수 있습니다.</p>
<ul class="b">
<li><b>생성은 시작할 때 한 번만</b> — make_textures()의 set_at 이중 루프는
느리지만(64×64×5 = 20,480회) <em>게임 시작 시 딱 한 번</em> 돌기 때문에
전혀 문제가 되지 않습니다. 매 프레임 도는 루프와 구분하는 감각이 중요합니다.</li>
<li><b>어두운 버전을 미리 생성</b> — JS 버전은 남북 벽면을 그릴 때
픽셀마다 색을 0.62배로 줄였지만, 파이썬에서 매 프레임 그러면 느립니다.
대신 <span class="reg">BLEND_MULT</span>로 50% 어두운 사본을
시작할 때 만들어 <b>texs[tid + 100]</b> 키에 저장해 둡니다.</li>
</ul>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">texs[tid] = surf                    # 밝은 면(동서 벽)용
dark = surf.copy()
dark.fill((128, 128, 128), special_flags=pygame.BLEND_MULT)
texs[tid + 100] = dark              # 그늘진 면(남북 벽)용

# 렌더링에서는 side에 따라 골라 쓰기만 한다
tex = texs[tile + (100 if side == 1 else 0)]</pre>
<div class="note">런타임 계산을 <em>시작 시점의 사전 계산</em>으로 바꾸는 것은
게임 프로그래밍의 고전적 기법입니다. 메모리 몇 KB로 매 프레임의 곱셈 수만 번을 삽니다.</div>`},

{t:'헤더와 임포트',k:'FULL CODE 1/13',h:`
<p>여기서부터 13조각에 걸쳐 <em>doom.py 전체를 한 줄도 빠짐없이</em> 싣습니다.
그대로 이어 붙이면 실행되는 완성본입니다. 첫 조각은 파일 머리의 안내 주석과
임포트 세 줄입니다.</p>
<pre class="code" data-lang="py"># -*- coding: utf-8 -*-
# =============================================================
#  PyDoom — 레이캐스팅 Doom 클론 (pygame 단일 파일 완성본)
#  실행: pip install pygame  →  python doom.py
#  조작: W/S 전진·후진, A/D 좌우 회전, Q/E 옆걸음(스트레이프)
#        Space 발사, F 문 열기, Tab 미니맵, Esc 종료
# =============================================================
import math
import sys
import pygame</pre>
<div class="note">주석에 실행법과 조작법을 적어 두면 몇 달 뒤의 자신에게 좋은 선물이 됩니다.
표준 라이브러리 math·sys 외의 의존성은 pygame 하나뿐입니다.</div>`},

{t:'1. 상수',k:'FULL CODE 2/13',h:`
<p>13장의 JS 버전과 <em>완전히 같은 값들</em>입니다.
내부 해상도 640×400, FOV 60°(π/3), 텍스처 64px, 이동 3.2칸/초, 회전 2.6rad/초.</p>
<pre class="code" data-lang="py"># ---------- 1. 상수 ----------
W, H       = 640, 400          # 내부 렌더 해상도 (낮을수록 빠름)
SCALE      = 2                 # 화면 확대 배율 → 실제 창 1280x800
HALF_H     = H // 2
FOV        = math.pi / 3       # 시야각 60도
NUM_RAYS   = W                 # 화면 세로줄 하나당 광선 하나
MAX_DEPTH  = 24.0              # 광선 최대 사거리
TEX        = 64                # 텍스처 한 변 크기
MOVE_SPD   = 3.2               # 초당 이동 칸수
ROT_SPD    = 2.6               # 초당 회전 라디안
FPS        = 60</pre>
<div class="note grn">느린 컴퓨터라면 W, H를 320, 200으로 줄이고 SCALE을 4로 올리세요.
광선 수가 절반이 되어 프레임이 크게 오릅니다 — 해상도와 속도는 정직한 교환 관계입니다.</div>`},

{t:'2. 맵',k:'FULL CODE 3/13',h:`
<p>1장부터 함께한 그 <b>16×14 맵</b>입니다. 문자열 리스트를 정수 2차원 리스트로 바꾸고,
범위 밖을 벽(1)으로 간주하는 안전망 <b>cell()</b>을 둡니다.</p>
<pre class="code" data-lang="py"># ---------- 2. 맵 ----------
# 0 빈칸 / 1 벽돌 / 2 돌 / 3 금속 / 4 문(닫힘) / 5 출구
MAP_STR = [
    "1111111111111111",
    "1000000110000001",
    "1020000110000201",
    "1000000000000001",
    "1000111141110001",
    "1000100000010001",
    "1300100000010031",
    "1000100000010001",
    "1000111411110001",
    "1000000000000001",
    "1020000330000201",
    "1000000330000001",
    "1000000000000051",
    "1111111111111111",
]
MAP_W, MAP_H = len(MAP_STR[0]), len(MAP_STR)
world = [[int(c) for c in row] for row in MAP_STR]

def cell(x, y):
    if 0 &lt;= x &lt; MAP_W and 0 &lt;= y &lt; MAP_H:
        return world[y][x]
    return 1</pre>
<div class="note">cell()이 범위 밖을 벽으로 답해 주기 때문에
DDA 루프와 이동 판정에서 인덱스 검사를 따로 할 필요가 없습니다.
JS 버전의 cell() 함수와 정확히 같은 역할입니다.</div>`},

{t:'3. 절차적 텍스처',k:'FULL CODE 4/13',h:`
<p>7장에서 유도한 <em>다섯 가지 텍스처 수식</em>을 그대로 Surface에 기록합니다.
벽돌·돌·금속판·문·출구 — 이미지 파일 없이 산수만으로 만듭니다.
마지막 네 줄이 슬라이드 7에서 설명한 <b>어두운 사본 사전 생성</b>입니다.</p>
<pre class="code" data-lang="py"># ---------- 3. 절차적 텍스처 ----------
def make_textures():
    """이미지 파일 없이 코드로 64x64 텍스처 5장을 만든다."""
    texs = {}
    for tid in (1, 2, 3, 4, 5):
        surf = pygame.Surface((TEX, TEX))
        for y in range(TEX):
            for x in range(TEX):
                if tid == 1:                       # 벽돌
                    row = y // 16
                    off = 16 if row % 2 else 0
                    mortar = (y % 16 &lt; 2) or ((x + off) % 32 &lt; 2)
                    c = (60, 24, 20) if mortar else (150, 60, 44)
                    if not mortar and (x * 7 + y * 13) % 31 == 0:
                        c = (120, 46, 36)
                elif tid == 2:                     # 돌
                    n = (x * x * 3 + y * y * 7 + x * y) % 97
                    g = 90 + (n % 40)
                    c = (g, g, g + 8)
                    if (x + y * 3) % 23 == 0:
                        c = (70, 70, 78)
                elif tid == 3:                     # 금속판
                    g = 70 + (y % 16) * 3
                    c = (g - 20, g, g + 14)
                    if x % 16 in (0, 1) or y % 16 in (0, 1):
                        c = (40, 46, 56)
                    if (x % 16, y % 16) in ((4, 4), (12, 4), (4, 12), (12, 12)):
                        c = (180, 190, 205)
                elif tid == 4:                     # 문
                    c = (40, 90, 60) if (x // 8 + y // 8) % 2 else (30, 70, 46)
                    if 28 &lt;= x &lt; 36:
                        c = (200, 170, 60)
                else:                              # 출구
                    c = (160, 30, 30) if (x // 8 + y // 8) % 2 else (240, 220, 210)
                surf.set_at((x, y), c)
        texs[tid] = surf
        # 어두운 버전(그늘진 남북 벽면용)을 미리 만들어 둔다
        dark = surf.copy()
        dark.fill((128, 128, 128), special_flags=pygame.BLEND_MULT)
        texs[tid + 100] = dark
    return texs</pre>`},

{t:'4. 스프라이트 — 적과 아이템',k:'FULL CODE 5/13',h:`
<p>악마(imp)와 구급상자를 <b>pygame.draw</b>의 원·사각형·다각형으로 그립니다.
JS 버전과 같은 도형 구성이며, <span class="reg">SRCALPHA</span> Surface라서
몸 바깥은 투명하게 남습니다. Sprite 클래스는 위치·종류·HP만 담는 단순한 상태 주머니입니다.</p>
<pre class="code" data-lang="py"># ---------- 4. 스프라이트(적/아이템) ----------
def make_imp():
    """간단한 픽셀 아트 악마 스프라이트를 코드로 그린다."""
    s = pygame.Surface((TEX, TEX), pygame.SRCALPHA)
    body = (140, 70, 40)
    for y in range(TEX):
        for x in range(TEX):
            dx, dy = x - 32, y - 34
            if dx * dx // 2 + dy * dy &lt; 500:            # 몸통
                s.set_at((x, y), body)
    pygame.draw.circle(s, (120, 55, 30), (32, 16), 11)  # 머리
    pygame.draw.circle(s, (255, 240, 80), (27, 14), 3)  # 눈
    pygame.draw.circle(s, (255, 240, 80), (37, 14), 3)
    pygame.draw.circle(s, (0, 0, 0), (27, 14), 1)
    pygame.draw.circle(s, (0, 0, 0), (37, 14), 1)
    pygame.draw.polygon(s, (200, 180, 160), [(22, 8), (18, 0), (26, 6)])   # 뿔
    pygame.draw.polygon(s, (200, 180, 160), [(42, 8), (46, 0), (38, 6)])
    pygame.draw.rect(s, body, (14, 30, 8, 20))          # 팔
    pygame.draw.rect(s, body, (42, 30, 8, 20))
    pygame.draw.rect(s, (110, 50, 28), (24, 52, 7, 12)) # 다리
    pygame.draw.rect(s, (110, 50, 28), (33, 52, 7, 12))
    return s

def make_medkit():
    s = pygame.Surface((TEX, TEX), pygame.SRCALPHA)
    pygame.draw.rect(s, (235, 235, 235), (16, 34, 32, 22), border_radius=3)
    pygame.draw.rect(s, (200, 40, 40), (28, 38, 8, 14))
    pygame.draw.rect(s, (200, 40, 40), (25, 41, 14, 8))
    return s

class Sprite:
    def __init__(self, x, y, kind):
        self.x, self.y, self.kind = x, y, kind   # kind: 'imp' | 'medkit'
        self.hp = 3 if kind == 'imp' else 0
        self.alive = True
        self.cool = 0.0                          # 공격 쿨타임</pre>`},

{t:'5. 게임 상태',k:'FULL CODE 6/13',h:`
<p>플레이어는 (1.5, 1.5)에서 시각 0.3rad로 시작 — JS 버전과 같습니다.
<b>reset_world()</b>는 맵을 원본 문자열에서 다시 만들고(열린 문 복구)
악마 5마리·구급상자 2개를 같은 자리에 배치합니다.</p>
<pre class="code" data-lang="py"># ---------- 5. 게임 상태 ----------
class Player:
    def __init__(self):
        self.x, self.y = 1.5, 1.5
        self.ang = 0.3
        self.hp = 100
        self.ammo = 40

def reset_world():
    global world
    world = [[int(c) for c in row] for row in MAP_STR]
    sprites = [
        Sprite(9.5, 1.5, 'imp'), Sprite(12.5, 6.5, 'imp'),
        Sprite(6.5, 11.5, 'imp'), Sprite(10.5, 10.5, 'imp'),
        Sprite(2.5, 12.2, 'imp'),
        Sprite(4.5, 9.5, 'medkit'), Sprite(14.5, 2.5, 'medkit'),
    ]
    return Player(), sprites</pre>
<div class="note">world를 <b>global</b>로 다시 만드는 이유: 문을 열면 world가 바뀌므로,
재시작 시 원본 MAP_STR에서 새로 만들어야 닫힌 문이 되살아납니다.</div>`},

{t:'6. DDA 레이캐스팅',k:'FULL CODE 7/13',h:`
<p>이 게임의 심장입니다. 5장의 <b>castRay</b>를 한 줄씩 그대로 옮겼습니다 —
ddx/ddy(한 칸 이동에 필요한 광선 길이), side_x/side_y(다음 격자선까지 거리),
그리고 더 가까운 격자선 쪽으로 한 칸씩 전진하는 루프.</p>
<pre class="code" data-lang="py"># ---------- 6. DDA 레이캐스팅 ----------
def cast_ray(px, py, ang):
    """(맞은 칸 값, 거리, 벽면 x좌표 0~1, 남북면 여부)를 돌려준다."""
    sin_a, cos_a = math.sin(ang), math.cos(ang)
    map_x, map_y = int(px), int(py)
    # 한 칸 이동에 필요한 광선 길이
    ddx = abs(1 / cos_a) if cos_a else 1e30
    ddy = abs(1 / sin_a) if sin_a else 1e30
    if cos_a &lt; 0:
        step_x, side_x = -1, (px - map_x) * ddx
    else:
        step_x, side_x = 1, (map_x + 1 - px) * ddx
    if sin_a &lt; 0:
        step_y, side_y = -1, (py - map_y) * ddy
    else:
        step_y, side_y = 1, (map_y + 1 - py) * ddy
    side = 0
    for _ in range(64):
        if side_x &lt; side_y:                 # 다음 세로 격자선이 더 가깝다
            side_x += ddx
            map_x += step_x
            side = 0
        else:                               # 다음 가로 격자선이 더 가깝다
            side_y += ddy
            map_y += step_y
            side = 1
        tile = cell(map_x, map_y)
        if tile &gt; 0:
            dist = (side_x - ddx) if side == 0 else (side_y - ddy)
            hit = (py + dist * sin_a) if side == 0 else (px + dist * cos_a)
            return tile, max(dist, 1e-4), hit - int(hit), side
    return 1, MAX_DEPTH, 0.0, 0</pre>
<div class="note blue">반환값 4개도 JS와 동일합니다: (맞은 타일, 거리, 벽면 좌표 0~1, 남북면 여부).
거리를 max(dist, 1e-4)로 막아 0나눗셈을 예방하는 것까지 같습니다.</div>`},

{t:'7. 렌더링 ① — 벽 그리기',k:'FULL CODE 8/13',h:`
<p><b>render_walls()</b>가 640개 열 각각에 대해: 탄젠트 기반으로 광선 각도를 정하고,
cast_ray로 벽을 찾고, 어안 보정 후 열 하나를 blit합니다. 슬라이드 6의
<em>열 단위 blit 전략</em>이 그대로 들어 있고, 거리 안개는 반투명 검정 Surface로 덮습니다.
render_sprites()의 앞부분(거리·각도 컬링)도 여기서 시작됩니다.</p>
<pre class="code" data-lang="py"># ---------- 7. 렌더링 ----------
def render_walls(buf, texs, pl):
    zbuf = [MAX_DEPTH] * NUM_RAYS
    for col in range(NUM_RAYS):
        # 화면 x좌표 → 광선 각도 (탄젠트 기반: 어안 왜곡 없음)
        cam = 2 * col / NUM_RAYS - 1            # -1 .. +1
        ray_ang = pl.ang + math.atan(cam * math.tan(FOV / 2))
        tile, dist, wall_x, side = cast_ray(pl.x, pl.y, ray_ang)
        depth = dist * math.cos(ray_ang - pl.ang)   # 어안 보정
        zbuf[col] = depth
        line_h = int(H / depth)
        tex = texs[tile + (100 if side == 1 else 0)]
        tex_x = int(wall_x * TEX) % TEX
        # 텍스처 한 줄(1xTEX)을 잘라 세로로 늘려 붙인다
        column = tex.subsurface(tex_x, 0, 1, TEX)
        y0 = HALF_H - line_h // 2
        if line_h &lt; H * 3:
            column = pygame.transform.scale(column, (1, line_h))
            buf.blit(column, (col, y0))
        else:                                    # 벽이 화면보다 훨씬 클 때
            vis = pygame.Rect(0, int((0 - y0) / line_h * TEX), 1,
                              max(1, int(H / line_h * TEX)))
            vis = vis.clip(column.get_rect())
            column = pygame.transform.scale(column.subsurface(vis), (1, H))
            buf.blit(column, (col, 0))
        # 거리 안개(멀수록 어둡게)
        fog = min(1.0, depth / 12.0)
        if fog &gt; 0.05:
            shade = pygame.Surface((1, min(line_h, H)))
            shade.set_alpha(int(fog * 180))
            buf.blit(shade, (col, max(y0, 0)))
    return zbuf

def render_sprites(buf, images, pl, sprites, zbuf):
    order = sorted((s for s in sprites if s.alive),
                   key=lambda s: -((s.x - pl.x) ** 2 + (s.y - pl.y) ** 2))
    for s in order:
        dx, dy = s.x - pl.x, s.y - pl.y
        dist = math.hypot(dx, dy)
        if dist &lt; 0.4 or dist &gt; MAX_DEPTH:
            continue
        # 플레이어 시선 기준 상대 각도
        rel = math.atan2(dy, dx) - pl.ang
        rel = (rel + math.pi) % (2 * math.pi) - math.pi
        if abs(rel) &gt; FOV / 2 + 0.4:
            continue</pre>
<div class="note red">벽에 바짝 붙으면 line_h가 수만 픽셀이 될 수 있습니다.
그대로 scale하면 거대한 Surface를 만들다 멈칫하므로, H의 3배를 넘으면
<em>보이는 부분만 잘라서</em> 늘립니다 (else 분기).</div>`},

{t:'7. 렌더링 ② — 스프라이트·미니맵·HUD',k:'FULL CODE 9/13',h:`
<p>스프라이트 그리기의 마무리: 세로줄 단위로 <b>zbuf와 깊이를 비교</b>해
벽 뒤에 가려진 부분은 건너뜁니다(9장의 z버퍼 그대로).
이어서 미니맵과 HUD — 총·총구 화염·HP/AMMO 표시줄·중앙 메시지입니다.</p>
<pre class="code" data-lang="py">        depth = dist * math.cos(rel)
        size = int(H / depth)
        if size &lt;= 1:
            continue
        # 화면 x좌표: tan 비율로 투영
        sx = int((0.5 + math.tan(rel) / (2 * math.tan(FOV / 2))) * W - size / 2)
        sy = HALF_H - size // 2
        img = pygame.transform.scale(images[s.kind], (size, size))
        # 세로줄 단위로 z버퍼와 비교해 벽 뒤 부분은 그리지 않는다
        for i in range(max(0, -sx), min(size, W - sx)):
            col = sx + i
            if depth &lt; zbuf[col]:
                buf.blit(img, (col, sy), pygame.Rect(i, 0, 1, size))

def render_minimap(buf, pl, sprites):
    mm = 6
    pygame.draw.rect(buf, (10, 10, 14), (0, 0, MAP_W * mm, MAP_H * mm))
    for y in range(MAP_H):
        for x in range(MAP_W):
            if world[y][x]:
                col = (90, 90, 110) if world[y][x] != 4 else (60, 160, 90)
                pygame.draw.rect(buf, col, (x * mm, y * mm, mm - 1, mm - 1))
    for s in sprites:
        if s.alive and s.kind == 'imp':
            pygame.draw.circle(buf, (220, 60, 40), (int(s.x * mm), int(s.y * mm)), 2)
    pygame.draw.circle(buf, (80, 220, 120), (int(pl.x * mm), int(pl.y * mm)), 2)
    ex = pl.x + math.cos(pl.ang) * 1.2
    ey = pl.y + math.sin(pl.ang) * 1.2
    pygame.draw.line(buf, (80, 220, 120),
                     (pl.x * mm, pl.y * mm), (ex * mm, ey * mm))

def render_hud(buf, font, pl, msg, gun_kick):
    # 총 (화면 하단 중앙의 간단한 스프라이트)
    gx, gy = W // 2 - 22, H - 62 + int(gun_kick * 18)
    pygame.draw.polygon(buf, (55, 60, 70),
                        [(gx, H), (gx + 16, gy), (gx + 30, gy), (gx + 44, H)])
    pygame.draw.rect(buf, (35, 38, 46), (gx + 17, gy - 14, 12, 20))
    if gun_kick &gt; 0.55:                          # 총구 화염
        pygame.draw.circle(buf, (255, 220, 90), (gx + 23, gy - 20), 10)
        pygame.draw.circle(buf, (255, 120, 30), (gx + 23, gy - 20), 5)
    # 상태 표시줄
    pygame.draw.rect(buf, (16, 16, 22), (0, H - 24, W, 24))
    hp_col = (90, 220, 90) if pl.hp &gt; 30 else (230, 70, 50)
    buf.blit(font.render('HP %3d' % pl.hp, False, hp_col), (10, H - 20))
    buf.blit(font.render('AMMO %2d' % pl.ammo, False, (240, 200, 80)), (110, H - 20))
    if msg:</pre>
<pre class="code" data-lang="py">        t = font.render(msg, False, (255, 255, 255))
        buf.blit(t, (W // 2 - t.get_width() // 2, 30))</pre>
<div class="note">blit의 세 번째 인자 pygame.Rect(i, 0, 1, size)가 핵심입니다.
스프라이트 이미지에서 <em>세로줄 i 하나만</em> 잘라 붙이므로
열마다 z버퍼 판정을 따로 할 수 있습니다.</div>`},

{t:'8. 게임 로직 ① — 이동과 발사',k:'FULL CODE 10/13',h:`
<p><b>try_move</b>는 x·y축을 따로 검사해 벽에 비스듬히 부딪히면 미끄러지게 하고(10장),
<b>fire</b>는 시선 ±0.12rad 안에서 가장 가까운 악마를 찾은 뒤
cast_ray로 <em>벽이 가로막지 않는지</em>까지 확인하는 히트스캔입니다.
update_enemies의 앞부분(구급상자 획득)도 여기서 시작됩니다.</p>
<pre class="code" data-lang="py"># ---------- 8. 게임 로직 ----------
def try_move(pl, nx, ny):
    """벽에 부딪히면 축별로 나눠 미끄러지게 한다."""
    r = 0.25
    if cell(int(nx + math.copysign(r, nx - pl.x)), int(pl.y)) == 0:
        pl.x = nx
    if cell(int(pl.x), int(ny + math.copysign(r, ny - pl.y))) == 0:
        pl.y = ny

def fire(pl, sprites):
    if pl.ammo &lt;= 0:
        return '탄약이 없다!'
    pl.ammo -= 1
    # 시선과 가장 가까운(각도차가 작은) 살아있는 적을 찾는다
    best, best_d = None, 1e9
    for s in sprites:
        if not s.alive or s.kind != 'imp':
            continue
        d = math.hypot(s.x - pl.x, s.y - pl.y)
        rel = math.atan2(s.y - pl.y, s.x - pl.x) - pl.ang
        rel = (rel + math.pi) % (2 * math.pi) - math.pi
        if abs(rel) &lt; 0.12 and d &lt; best_d:
            # 벽이 가로막고 있으면 못 맞춘다
            _, wall_d, _, _ = cast_ray(pl.x, pl.y, math.atan2(s.y - pl.y, s.x - pl.x))
            if wall_d &gt; d:
                best, best_d = s, d
    if best:
        best.hp -= 1
        if best.hp &lt;= 0:
            best.alive = False
            return '악마 처치!'
        return ''
    return ''

def update_enemies(pl, sprites, dt):
    hurt = ''
    for s in sprites:
        if not s.alive:
            continue
        if s.kind == 'medkit':
            if math.hypot(s.x - pl.x, s.y - pl.y) &lt; 0.5 and pl.hp &lt; 100:
                pl.hp = min(100, pl.hp + 25)
                s.alive = False
                hurt = '구급상자 +25'
            continue
        d = math.hypot(s.x - pl.x, s.y - pl.y)</pre>`},

{t:'8. 게임 로직 ② — 적 AI와 문',k:'FULL CODE 11/13',h:`
<p>적 AI의 본체: 8칸 이내 + <b>시야가 트여 있을 때만</b>(cast_ray로 판정) 추적하고,
1칸 안에 들어오면 1초 쿨타임으로 8씩 물어뜯습니다.
<b>open_door</b>는 바라보는 방향 1.2칸 앞이 문(4)이면 열고, 출구(5)면 승리를 알립니다.</p>
<pre class="code" data-lang="py">        if d &gt; 8 or d &lt; 0.001:
            continue
        # 시야가 트여 있을 때만 추적
        ang = math.atan2(pl.y - s.y, pl.x - s.x)
        _, wall_d, _, _ = cast_ray(s.x, s.y, ang)
        if wall_d &lt; d:
            continue
        if d &gt; 1.0:                              # 추적
            spd = 1.3 * dt
            nx, ny = s.x + math.cos(ang) * spd, s.y + math.sin(ang) * spd
            if cell(int(nx), int(s.y)) == 0:
                s.x = nx
            if cell(int(s.x), int(ny)) == 0:
                s.y = ny
        else:                                    # 공격
            s.cool -= dt
            if s.cool &lt;= 0:
                pl.hp -= 8
                s.cool = 1.0
                hurt = '피격! -8'
    return hurt

def open_door(pl):
    tx = int(pl.x + math.cos(pl.ang) * 1.2)
    ty = int(pl.y + math.sin(pl.ang) * 1.2)
    if cell(tx, ty) == 4:
        world[ty][tx] = 0
        return '문이 열렸다'
    if cell(tx, ty) == 5:
        return 'EXIT'
    return ''</pre>
<div class="note blue">적도 플레이어와 같은 cast_ray를 씁니다.
렌더링용으로 만든 함수가 AI의 시야 판정에 재활용되는 것 —
레이캐스팅이 <em>범용 공간 질의 도구</em>임을 보여 주는 장면입니다.</div>`},

{t:'9. 메인 루프 ① — 초기화와 이벤트',k:'FULL CODE 12/13',h:`
<p>초기화(창·버퍼·폰트·텍스처)를 마친 뒤 무한 루프에 들어갑니다.
<b>clock.tick(FPS)</b>가 60fps 제한과 dt 측정을 동시에 해 주고,
단발 입력(발사·문·재시작)은 KEYDOWN 이벤트로, 연속 입력(이동)은
get_pressed()로 처리합니다 — 슬라이드 4의 번역 사전 그대로입니다.</p>
<pre class="code" data-lang="py"># ---------- 9. 메인 루프 ----------
def main():
    pygame.init()
    screen = pygame.display.set_mode((W * SCALE, H * SCALE))
    pygame.display.set_caption('PyDoom — Raycasting Clone')
    clock = pygame.time.Clock()
    buf = pygame.Surface((W, H))
    font = pygame.font.SysFont('monospace', 14, bold=True)
    texs = make_textures()
    images = {'imp': make_imp(), 'medkit': make_medkit()}
    pl, sprites = reset_world()
    show_map, msg, msg_t, gun_kick, over = True, '', 0.0, 0.0, ''

    while True:
        dt = clock.tick(FPS) / 1000.0
        for e in pygame.event.get():
            if e.type == pygame.QUIT:
                pygame.quit(); sys.exit()
            if e.type == pygame.KEYDOWN:
                if e.key == pygame.K_ESCAPE:
                    pygame.quit(); sys.exit()
                if e.key == pygame.K_TAB:
                    show_map = not show_map
                if e.key == pygame.K_SPACE and not over:
                    m = fire(pl, sprites)
                    gun_kick = 1.0
                    if m: msg, msg_t = m, 1.2
                if e.key == pygame.K_f and not over:
                    m = open_door(pl)
                    if m == 'EXIT':
                        over = '탈출 성공! R로 재시작'
                    elif m:
                        msg, msg_t = m, 1.2
                if e.key == pygame.K_r and over:
                    pl, sprites = reset_world()
                    over = ''

        keys = pygame.key.get_pressed()
        if not over:
            if keys[pygame.K_a]: pl.ang -= ROT_SPD * dt
            if keys[pygame.K_d]: pl.ang += ROT_SPD * dt
            dx = math.cos(pl.ang) * MOVE_SPD * dt
            dy = math.sin(pl.ang) * MOVE_SPD * dt
            if keys[pygame.K_w]: try_move(pl, pl.x + dx, pl.y + dy)
            if keys[pygame.K_s]: try_move(pl, pl.x - dx, pl.y - dy)
            if keys[pygame.K_q]: try_move(pl, pl.x + dy, pl.y - dx)</pre>`},

{t:'9. 메인 루프 ② — 갱신과 그리기',k:'FULL CODE 13/13',h:`
<p>마지막 조각입니다. 적 갱신 → 사망 판정 → 그리기 순서로,
천장·바닥을 fill로 칠하고 벽 → 스프라이트 → HUD → 미니맵을 쌓아 올린 뒤
buf를 창 크기로 확대해 flip합니다. 이 27줄로 게임이 완성됩니다.</p>
<pre class="code" data-lang="py">            if keys[pygame.K_e]: try_move(pl, pl.x - dy, pl.y + dx)

            m = update_enemies(pl, sprites, dt)
            if m: msg, msg_t = m, 1.2
            if pl.hp &lt;= 0:
                pl.hp = 0
                over = '전사... R로 재시작'

        gun_kick = max(0.0, gun_kick - dt * 4)
        msg_t = max(0.0, msg_t - dt)

        # ---- 그리기 ----
        buf.fill((30, 34, 44), (0, 0, W, HALF_H))            # 천장
        buf.fill((52, 46, 40), (0, HALF_H, W, HALF_H))       # 바닥
        zbuf = render_walls(buf, texs, pl)
        render_sprites(buf, images, pl, sprites, zbuf)
        render_hud(buf, font, pl, msg if msg_t &gt; 0 else '', gun_kick)
        if show_map:
            render_minimap(buf, pl, sprites)
        if over:
            t = font.render(over, False, (255, 80, 60))
            buf.blit(t, (W // 2 - t.get_width() // 2, HALF_H - 8))
        pygame.transform.scale(buf, screen.get_size(), screen)
        pygame.display.flip()

if __name__ == '__main__':
    main()</pre>
<div class="note">그리기 순서가 곧 <em>화면의 층 순서</em>입니다:
배경(천장/바닥) → 벽 → 스프라이트(z버퍼) → HUD → 미니맵.
JS 버전의 draw 순서와 완전히 같습니다.</div>`},

{t:'실행 화면 읽기',k:'SCREEN',h:`
<p>python doom.py를 실행하면 <b>1280×800 창</b>이 열립니다.
그런데 코드의 해상도는 640×400이었죠 — 비밀은 <b>SCALE = 2</b>입니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">screen = pygame.display.set_mode((W * SCALE, H * SCALE))  # 1280x800 창
buf    = pygame.Surface((W, H))                           # 640x400 내부 버퍼
# ... buf에 모든 것을 그린 뒤, 마지막에 한 번만 확대 ...
pygame.transform.scale(buf, screen.get_size(), screen)
pygame.display.flip()</pre>
<ul class="b">
<li><b>내부 640×400</b> — 레이캐스팅·스프라이트·HUD는 전부 이 버퍼에 그립니다.
광선은 640개면 충분합니다.</li>
<li><b>2배 확대</b> — transform.scale이 C 속도로 한 번에 늘립니다.
픽셀이 큼직해져 오히려 <em>레트로 게임다운 질감</em>이 살아납니다.</li>
<li>왼쪽 위 미니맵(Tab 토글), 아래쪽 HP/AMMO 표시줄, 중앙 하단의 총이 보이면 정상입니다.</li>
</ul>
<div class="note grn">JS 버전이 640×400 캔버스를 CSS로 확대한 것과 같은 발상입니다.
<em>내부 해상도와 표시 해상도의 분리</em>는 두 구현 공통의 성능 비결입니다.</div>`},

{t:'조작 정리',k:'CONTROLS',h:`
<p>전체 조작을 한 표로 정리합니다. 파일 머리의 주석과 같은 내용입니다.</p>

{t:'두 구현 성능 비교',k:'PERFORMANCE',h:`
<p>같은 알고리즘인데 왜 만듦새가 달라야 했을까요?
두 언어가 <em>코드를 실행하는 방식</em>이 다르기 때문입니다.</p>
<div class="grid2">
<div class="card"><h3>JavaScript — JIT 컴파일</h3>
<p>V8 같은 엔진이 자주 도는 루프를 <b>기계어로 컴파일</b>합니다.
픽셀 25만 개를 직접 도는 루프도 네이티브에 가까운 속도가 나므로,
ImageData에 픽셀을 하나씩 쓰는 정공법이 통합니다.</p></div>
<div class="card"><h3>Python — 인터프리터 + C 위임</h3>
<p>CPython은 바이트코드를 한 줄씩 해석하므로 순수 루프가 느립니다.
대신 subsurface/scale/blit 같은 <b>C 구현 함수에 일을 위임</b>하면
루프 횟수를 640회로 줄여 60fps를 지킬 수 있습니다.</p></div>
</div>

{t:'우리 게임의 비용 지도',k:'COST MAP',h:`
<p>최적화의 첫걸음은 코드를 고치는 것이 아니라 <em>어디가 비싼지 아는 것</em>입니다. 우리 게임이 한 프레임(1/60초)에 하는 일을 세어 봅시다.</p>
<div class="tblWrap"><table class="tbl">

<tr><td>DDA 스텝</td><td>광선 640 × 평균 ~10스텝 ≈ 6,400회</td><td>정수 비교·덧셈뿐 — 저렴</td></tr>
<tr><td>벽·천장·바닥 픽셀</td><td>640 × 400 = <b>256,000회</b> 쓰기</td><td>shade() 곱셈 포함 — 가장 비쌈</td></tr>
<tr><td>스프라이트 픽셀</td><td>0 ~ 수만 회 (거리·수에 따라)</td><td>z버퍼로 일부는 건너뜀</td></tr>
<tr><td>적 AI·이동</td><td>스프라이트 7개 갱신</td><td>무시해도 되는 수준</td></tr>
<tr><td>putImageData + HUD</td><td>1회</td><td>브라우저가 C++로 처리</td></tr>
</table></div>
<p>결론은 명확합니다. DDA(6천 회)가 아니라 <em>픽셀 쓰기(25만 회)</em>가 지배합니다. 60fps라면 초당 1,536만 픽셀 — 최적화는 여기서부터 시작해야 합니다.</p>`},

{t:'측정부터 — performance.now()',k:'MEASURE',h:`
<p>감이 아니라 숫자로 말합시다. 브라우저의 <b>performance.now()</b>는 밀리초 단위의 고해상도 시계입니다. 의심 가는 함수를 감싸기만 하면 됩니다.</p>
<pre class="code" data-lang="js">var t0 = performance.now();
renderWalls();
var t1 = performance.now();
console.log('walls: ' + (t1 - t0).toFixed(2) + ' ms');</pre>
<p>이 네 줄을 메인 루프에 넣으면 프레임마다 벽 렌더링 비용이 콘솔에 찍힙니다. 목표는 단순합니다: 한 프레임의 전부를 합쳐 <em>16.6ms 안</em>에 끝내는 것.</p>
<div class="note">매 프레임 console.log를 부르면 로그 출력 자체가 병목이 됩니다. 프레임 카운터를 두고 60프레임에 한 번만 출력하거나, 여러 프레임의 평균을 내서 보세요.</div>`},

{t:'무기 1 — 내부 해상도 낮추기',k:'RESOLUTION',h:`
<p>픽셀 쓰기가 지배한다면 가장 강력한 무기는 뻔합니다: <em>픽셀 수 자체를 줄이는 것</em>. 열을 640에서 160으로 줄이면 광선도 픽셀도 1/4이 됩니다. 아래에서 직접 확인해 보세요.</p>
<div class="demoWrap"><div class="dTitle">RESOLUTION — 열 개수 조절</div>
<canvas class="demo" data-demo="columns" width="512" height="240"></canvas>
<div class="ctl"><label>열 <input type="range" data-p="cols" min="8" max="320" value="160"><span class="val" data-v="cols"></span></label></div>
</div>
<p>160열도 충분히 게임답습니다 — 원조 Doom의 저사양 모드도 같은 발상이었습니다. 줄어든 해상도는 CSS로 다시 늘립니다: 캔버스 속성은 작게, CSS width는 크게. 이 확대는 GPU가 하므로 <b>사실상 공짜</b>이고, image-rendering:pixelated가 레트로 감성까지 덤으로 줍니다.</p>
<div class="note grn">canonical 구현이 이미 이 무기를 씁니다. JS판은 640×400 캔버스를 CSS로 960px까지, pygame판은 W=640에 SCALE=2로 1280×800 창을 만듭니다.</div>`},

{t:'무기 2 — Uint32Array 픽셀 쓰기',k:'PIXEL BUFFER',h:`
<p>같은 픽셀을 찍어도 방법에 따라 비용이 하늘과 땅입니다.</p>
<pre class="code" data-lang="js">// 느림: 픽셀마다 캔버스 API 호출
ctx.fillStyle = '#96503c';
ctx.fillRect(x, y, 1, 1);

// 빠름: 메모리에 32비트 정수 하나 쓰기
pix[y * W + col] = shade(c, fog);</pre>
<div class="grid2">
<div class="card"><h3>fillRect가 느린 이유</h3><p>호출마다 색 문자열 파싱, 상태 확인, 클리핑, 경로 처리를 거칩니다. 픽셀 하나에 <em>함수 호출 오버헤드</em> 전부를 지불하는 셈입니다.</p></div>
<div class="card"><h3>Uint32Array가 빠른 이유</h3><p>ImageData의 버퍼를 32비트 정수 배열로 보면, 픽셀 하나 = 배열 대입 하나. JIT이 기계어 메모리 쓰기 한 줄로 컴파일합니다.</p></div>
</div>
<p>그래서 우리 렌더러는 25만 픽셀을 전부 pix 배열에 쓰고, 프레임 끝에 <b>putImageData 한 번</b>으로 화면에 복사합니다. API 호출 25만 번이 1번이 되는 구조입니다.</p>`},

{t:'무기 3 — 불변식은 루프 밖으로',k:'HOIST',h:`
<p>루프 안에서 값이 변하지 않는 계산(불변식)은 밖으로 끌어올리고, 반복되는 나눗셈은 곱셈·덧셈으로 바꿉니다. 예를 들어 tan(FOV/2)는 프레임 내내 같은 값이니 열 루프 밖에서 한 번만 계산하면 됩니다.</p>
<pre class="code" data-lang="js">var halfTan = Math.tan(FOV / 2);          // 한 번만
for (col = 0; col &lt; W; col++) {
  rayAng = player.ang + Math.atan((2 * col / W - 1) * halfTan);
  ...
}</pre>
<p>canonical 코드가 이미 쓰고 있는 같은 계열의 수법들:</p>
<ul class="b">
<li>ddx·ddy는 <em>광선당 한 번</em>만 나눗셈 — DDA 루프 안은 덧셈과 비교뿐입니다.</li>
<li>텍스처 세로줄에서 step = TEX / lineH를 한 번 나눈 뒤, 픽셀마다는 <b>texPos += step</b> 덧셈만 합니다. 최대 수십만 번의 픽셀당 나눗셈이 덧셈으로 바뀝니다.</li>
<li>fog(안개 계수)도 열당 한 번 계산해 세로줄 전체에 재사용합니다.</li>
</ul>
<div class="note">컴파일러가 알아서 해 주지 않냐고요? JIT이 잡아 주는 경우도 있지만 Math 호출은 부수효과 가능성 때문에 못 끌어올릴 때가 많습니다. 가장 안쪽 루프만큼은 사람이 챙기는 편이 확실합니다.</div>`},

{t:'무기 4 — 객체 생성 제로',k:'ZERO ALLOC',h:`
<p>자바스크립트의 new와 배열 리터럴은 공짜처럼 보이지만, 쌓이면 가비지 컬렉터(GC)가 청소하러 옵니다. 렌더 루프의 철칙은 <em>프레임 안에서는 아무것도 새로 만들지 않는 것</em>입니다.</p>
<ul class="b">
<li>canonical은 image·pix·zbuf 버퍼를 <b>시작할 때 한 번</b> 만들고 매 프레임 재사용합니다. 프레임마다 createImageData를 부르면 그 자체로 수 ms를 잃습니다.</li>
<li>텍스처·스프라이트 픽셀 배열도 전부 로딩 시점에 생성 — 루프 안은 읽기만 합니다.</li>
<li>개선 여지도 있습니다: castRay가 매번 배열 [tile, dist, ...]를 반환하는데, 초당 약 38,400개의 작은 배열입니다. 재사용하는 결과 객체에 담으면 GC 부담이 더 줄어듭니다.</li>
</ul>
<div class="note red">루프 안 할당의 진짜 무서움은 평균이 아니라 <b>스파이크</b>입니다. GC가 도는 프레임만 30ms가 걸려 게임이 순간적으로 "털컥" 멈춥니다. 평균 fps는 좋은데 체감이 나쁘다면 십중팔구 GC 스파이크입니다.</div>`},

{t:'pygame이 느린 진짜 이유',k:'WHY SLOW',h:`
<p>같은 알고리즘을 파이썬으로 옮기면 왜 느릴까요? 파이썬 인터프리터는 한 줄 한 줄을 실행할 때마다 타입 확인·객체 참조·바이트코드 해석을 거칩니다. 픽셀 하나에 수백 ns — <em>25만 픽셀 루프를 파이썬으로 직접 돌리면 그것만으로 프레임 예산이 바닥납니다</em>.</p>
<p>그래서 canonical pygame판은 픽셀 루프를 파이썬에서 돌리지 않습니다. C로 짜인 pygame 함수에 <b>통째로 위임</b>합니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">column = tex.subsurface(tex_x, 0, 1, TEX)          # 텍스처 세로줄 1픽셀 폭
column = pygame.transform.scale(column, (1, line_h)) # C가 늘리고
buf.blit(column, (col, y0))                          # C가 복사한다</pre>
<p>파이썬이 하는 일은 열당 <em>함수 호출 세 번</em>뿐이고, 실제 픽셀 400개의 이동은 전부 C 코드가 처리합니다. "파이썬은 지휘만, 노동은 C가" — pygame 성능의 제1원칙입니다.</p>`},

{t:'pygame 가속 옵션',k:'PYGAME SPEED',h:`
<p>그래도 더 빠르게 만들고 싶다면, 효과와 난이도를 저울에 올려 고릅니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>옵션</th><th>난이도</th><th>효과</th><th>비고</th></tr>
<tr><td>내부 해상도 ↓ + transform.scale</td><td>★</td><td>큼</td><td>canonical이 이미 적용 (W=640, SCALE=2)</td></tr>
<tr><td>광선 수 줄여 기둥 폭 2px</td><td>★</td><td>중간</td><td>NUM_RAYS = W // 2, 화질 저하 감수</td></tr>
<tr><td>convert()로 서피스 포맷 통일</td><td>★</td><td>중간</td><td>blit마다의 포맷 변환 제거</td></tr>
<tr><td>surfarray + numpy 벡터화</td><td>★★★</td><td>매우 큼</td><td>픽셀 버퍼를 배열 연산으로 — JS의 pix와 같은 발상</td></tr>
<tr><td>PyPy / Cython</td><td>★★★</td><td>큼</td><td>인터프리터 자체를 교체·컴파일</td></tr>
</table></div>
<div class="note grn">surfarray.pixels3d()로 서피스를 numpy 배열로 열면, 파이썬 루프 없이 numpy의 C 루프가 픽셀을 밀어냅니다. "인터프리터 루프를 없앤다"는 점에서 무기 2(Uint32Array)의 파이썬판입니다.</div>`},

{t:'바닥 캐스팅 최적화 — 행 단위로',k:'FLOOR ROWS',h:`
<p>바닥 캐스팅을 열 단위로 짜면 픽셀마다 rowDist를 다시 계산합니다. 하지만 rowDist = HALF_H / (y - HALF_H)는 <em>화면 행 y에만 의존</em>합니다 — 그렇다면 루프를 뒤집어 행 단위로 돌리면 됩니다.</p>
<pre class="code" data-lang="js">for (y = HALF_H + 1; y &lt; H; y++) {
  rowDist = HALF_H / (y - HALF_H);   // 행 전체에서 상수!
  // 행의 왼쪽 끝 월드 좌표와 픽셀당 증가량을 계산해 두고
  // 안쪽 x 루프는 좌표 덧셈 + 텍스처 조회만 한다
}</pre>
<p>행 하나당 나눗셈 한 번, 안쪽 루프는 덧셈 두 번과 배열 조회뿐 — 무기 3(불변식 끌어올리기)의 교과서적 적용입니다.</p>
<div class="demoWrap"><div class="dTitle">FLOOR CASTING — ROW METHOD</div>
<canvas class="demo" data-demo="floorcast" width="320" height="200"></canvas>
<div class="ctl"><button data-p="ftex">바닥 캐스팅 ON</button></div>
</div>
<div class="note blue">이 행 단위 방식이 lodev 튜토리얼의 유명한 floor casting 구현입니다. 열 단위(광선마다 바닥까지 계산)보다 수학이 간결하고 캐시 접근도 순차적이라 훨씬 빠릅니다.</div>`},

{t:'시야 밖 스프라이트 조기 탈락',k:'EARLY OUT',h:`
<p>가장 빠른 계산은 하지 않는 계산입니다. canonical의 renderSprites는 비싼 픽셀 루프에 들어가기 <em>전에</em> 네 겹의 관문에서 스프라이트를 걸러냅니다.</p>
<pre class="code" data-lang="js">if (dist &lt; 0.4 || dist &gt; MAX_DEPTH) return;   // 너무 가깝거나 멀다
if (Math.abs(rel) &gt; FOV / 2 + 0.4) return;    // 시야각 밖이다
if (size &lt;= 1) return;                        // 그려도 1픽셀 미만
// ... 열 루프 안에서도:
if (col &lt; 0 || col &gt;= W || depth &gt;= zbuf[col]) continue; // 벽 뒤다</pre>
<p>|rel| 검사 하나가 등 뒤의 스프라이트 전부를 <b>비교 두 번</b> 값에 탈락시킵니다. 여유분 +0.4는 스프라이트의 폭 때문에 중심이 시야 밖이어도 가장자리가 걸칠 수 있어서입니다.</p>
<div class="note">이 <em>early-out 철학</em>은 어디에나 적용됩니다: 싼 검사를 앞에, 비싼 작업을 뒤에. 거대한 상용 엔진의 프러스텀 컬링·오클루전 컬링도 규모만 다를 뿐 같은 문장입니다.</div>`},

{t:'브라우저 도구로 프로파일링',k:'PROFILER',h:`
<p>performance.now()가 줄자라면, 개발자 도구의 <b>Performance 탭</b>은 CT 촬영입니다. 어느 함수가 몇 ms를 먹는지 프레임 단위로 해부해 보여 줍니다. 병목을 찾는 3단계:</p>
<ol>
<li><kbd>F12</kbd> → Performance 탭 → <em>녹화(●)</em>를 누르고 게임을 5초쯤 플레이한 뒤 정지합니다.</li>
<li>위쪽 타임라인에서 <em>유난히 긴 프레임 막대</em>를 찾아 클릭합니다. 초록(그리기)·노랑(스크립트)의 비율이 첫 힌트입니다.</li>
<li>아래 <b>Bottom-Up</b> 표를 Self Time으로 정렬합니다. 맨 위에 오는 함수 — 그게 병목입니다. 우리 게임이라면 renderWalls가 1위인 것이 정상입니다.</li>
</ol>
<div class="note grn">renderWalls보다 GC(Minor GC / Major GC 항목)나 putImageData가 위에 있다면, 코드 계산이 아니라 할당(무기 4)이나 캔버스 크기(무기 1)를 의심하세요. 프로파일은 "무엇을 고칠지"까지 알려 줍니다.</div>`},

{t:'60fps 예산표',k:'FRAME BUDGET',h:`
<p>60fps는 곧 <em>프레임당 16.6ms의 예산</em>입니다. 돈처럼 항목별로 배정하고, 초과하는 항목을 잡아냅니다. 보급형 노트북에서 우리 게임의 예산표 예시:</p>
<div class="tblWrap"><table class="tbl">
<tr><th>항목</th><th>배정</th><th>비고</th></tr>
<tr><td>renderWalls (벽+천장+바닥)</td><td>~6 ms</td><td>최대 지출처 — 무기 1·2·3의 표적</td></tr>
<tr><td>renderSprites</td><td>~2 ms</td><td>적이 가까울수록 증가</td></tr>
<tr><td>미니맵 + HUD + putImageData</td><td>~2 ms</td><td>거의 고정비</td></tr>
<tr><td>게임 로직·AI·입력</td><td>~0.5 ms</td><td>사실상 공짜</td></tr>
<tr><td>브라우저 합성·기타 여유</td><td>~6 ms</td><td>비워 둬야 하는 안전 마진</td></tr>
</table></div>
<p>핵심은 숫자 자체가 아니라 <b>사고방식</b>입니다: 기능을 추가할 때마다 "이건 몇 ms짜리인가, 어느 항목에서 빼 오나"를 묻는 것. 예산이 없으면 적자는 프레임 드랍으로 청구됩니다.</p>`},

{t:'최적화의 함정',k:'PITFALLS',h:`
<p>마지막으로, 최적화가 오히려 프로젝트를 망치는 두 가지 경로를 기억하세요.</p>
<div class="note red"><b>측정 없는 최적화</b> — "이게 느릴 것 같아서 고쳤다"는 대부분 틀립니다. DDA를 밤새 갈고닦아도 픽셀 쓰기가 병목이면 0.1ms도 못 법니다. 고치기 전과 후를 <em>같은 조건에서 측정한 숫자</em>가 없다면, 그것은 최적화가 아니라 코드 섞기입니다.</div>
<div class="note red"><b>가독성 훼손</b> — 비트 트릭과 펼쳐 쓴 루프로 뒤덮인 코드는 다음 주의 자신도 못 읽습니다. 이 책의 코드가 H &gt;&gt; 1 정도의 온건한 트릭만 쓰는 이유입니다. 최적화는 병목으로 <em>증명된 5%</em>에만 적용하고, 나머지 95%는 읽기 좋게 두세요.</div>
<p>순서는 언제나 같습니다: <em>먼저 돌아가게, 그다음 올바르게, 마지막에 빠르게.</em> 우리도 13장에서 완성한 뒤에야 이 장을 시작했습니다.</p>`},

{t:'정리',k:'WRAP UP',h:`
<div class="big">
측정하라, 그리고 큰 것부터 잘라라.
해상도를 줄이고, 버퍼에 직접 쓰고, 불변식을 끌어올리고, 아무것도 할당하지 마라.
그러나 이 모든 무기보다 강한 원칙이 하나 있으니 —
<span class="hero">가장 빠른 픽셀은<br>그리지 않은 픽셀이다</span>
시야 밖을 버리고, 벽 뒤를 건너뛰고, 필요 없는 열을 긋지 않는 것.
레이캐스팅 자체가 바로 그 원칙의 발명품이었습니다.
</div>`},
