slides:[

{t:'우리가 만든 것과 Doom의 거리',k:'HONEST GAP',h:`
<p>축하보다 먼저, <em>솔직한 비교</em>부터 합시다. 우리가 만든 것은 정확히 말하면
울펜슈타인 3D(1992)급 <b>레이캐스터</b>입니다. Doom(1993)은 그보다 한 세대 앞선
엔진입니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>항목</th><th>우리 엔진</th><th>Doom 엔진</th></tr>
<tr><td>벽</td><td>격자에 정렬된 90° 벽만</td><td><b>임의 각도</b>의 벽 (라인데프)</td></tr>
<tr><td>바닥/천장</td><td>모두 같은 높이</td><td>섹터마다 다름 — <b>계단·승강기·제단</b></td></tr>
<tr><td>가시성 판정</td><td>매 프레임 광선 640개 (DDA)</td><td><b>BSP 트리</b>를 맵 컴파일 때 미리 계산</td></tr>
<tr><td>조명</td><td>거리 안개 하나</td><td>섹터별 밝기 + 깜빡이는 조명</td></tr>
<tr><td>시선</td><td>수평 고정</td><td>수평 고정 (같은 한계!)</td></tr>
<tr><td>바닥 텍스처</td><td>13장에서 옵션으로 구현</td><td>visplane으로 상시 렌더링</td></tr>
</table></div>
<div class="note">그러나 핵심 골격 — <em>세로줄 단위 렌더링, 원근 = 1/거리, 스프라이트 깊이 판정</em> —
은 놀랍도록 같습니다. 이번 장에서 그 연결 고리를 하나씩 확인합니다.</div>`},

{t:'Doom 엔진의 심장 — BSP 트리',k:'BSP TREE',h:`
<p>Doom이 임의 각도의 벽을 그리면서도 486에서 빨랐던 비결은
<b>BSP(Binary Space Partitioning) 트리</b>입니다. 아이디어는 이렇습니다.</p>
<ol>
<li>맵 전체를 <b>직선 하나로 두 조각</b>으로 나눕니다.</li>
<li>각 조각을 또 직선으로 둘로 나눕니다 — 더 나눌 수 없을 때까지 재귀.</li>
<li>결과는 이진 트리: 잎 노드 하나가 <em>볼록한 작은 방 조각(서브섹터)</em>입니다.</li>
</ol>
<p>렌더링할 때는 트리를 타고 내려가며 <em>플레이어가 있는 쪽 절반을 먼저</em> 방문합니다.
그러면 벽들이 자동으로 <b>가까운 것부터 먼 순서</b>로 나옵니다 —
정렬도, 광선 행진도 없이 순서가 공짜로 얻어집니다.</p>
<div class="note blue">우리의 DDA는 매 프레임 광선 640개를 <em>실시간으로</em> 행진시키지만,
Doom은 이 순서 계산을 <b>맵을 만들 때 한 번</b>(노드 빌더)으로 옮겼습니다.
"런타임 계산을 사전 계산으로" — 14장에서 어두운 텍스처를 미리 만든 것과 같은 철학의
끝판왕입니다.</div>`},

{t:'섹터와 라인데프 — Doom 맵의 실제 구조',k:'SECTORS',h:`
<p>우리 맵은 숫자 격자였지만, Doom 맵은 <b>벡터 도형</b>입니다.
구성 요소는 크게 세 가지입니다.</p>
<ul class="b">
<li><b>버텍스(vertex)</b> — 평면 위의 점.</li>
<li><b>라인데프(linedef)</b> — 두 버텍스를 잇는 벽 선분. 한쪽 면만 있으면 벽,
양쪽 면이 있으면 두 방 사이의 경계입니다.</li>
<li><b>섹터(sector)</b> — 라인데프로 둘러싸인 다각형 영역.
<em>바닥 높이, 천장 높이, 밝기, 바닥/천장 텍스처</em>를 제각기 가집니다.</li>
</ul>
<p>계단은 바닥 높이가 조금씩 다른 섹터의 나열이고, 승강기는 바닥 높이가
<em>실시간으로 변하는</em> 섹터입니다. 문조차 특별한 물체가 아니라
"천장이 바닥까지 내려와 있는 섹터"가 위로 열리는 것입니다.</p>
<div class="note">그래서 Doom에는 "방 위의 방"이 없습니다.
섹터는 바닥·천장 높이를 <em>하나씩만</em> 가지므로 2.5D인 것입니다 —
지도를 위에서 내려다보면 여전히 평면 도형입니다. 우리 격자 맵과 같은 차원입니다.</div>`},

{t:'Doom도 결국 세로줄을 그린다',k:'COLUMNS',h:`
<p>놀라운 사실: BSP로 벽 순서를 구한 다음, Doom이 벽을 그리는 방식은
우리와 똑같이 <em>화면 세로줄(컬럼) 단위</em>입니다.</p>
<ul class="b">
<li>벽 선분을 화면에 투영해 <b>세로줄 구간</b>을 얻고, 컬럼마다
텍스처 한 줄을 원근에 맞춰 세로로 늘려 찍습니다 — 우리의 8장과 동일합니다.</li>
<li>각 컬럼에서 이미 그려진 구간을 기록해 두고, 뒤에 오는(더 먼) 벽은
빈 구간에만 그립니다 — z버퍼 대신 <b>구간 클리핑</b>을 쓴 것입니다.</li>
<li>바닥과 천장은 <b>visplane</b>이라는 구조로 모읍니다: 같은 높이·같은 텍스처·같은 밝기의
바닥 조각들을 화면 영역으로 묶은 뒤, 이번엔 <em>가로줄 단위</em>로 채웁니다 —
13장의 바닥 캐스팅과 같은 수학입니다.</li>
</ul>
<div class="note">벽은 세로줄, 바닥은 가로줄 — 우리가 8장과 13장에서 각각 발견한
두 가지 그리기 방향을 Doom도 정확히 같은 이유(텍스처 원근이 그 방향으로 일정)로
사용합니다. 우리는 이미 <em>Doom 렌더러의 친척</em>을 만든 셈입니다.</div>`},

{t:'왜 Doom에선 위아래를 볼 수 없었나',k:'Y-SHEARING',h:`
<p>Doom도 우리 엔진처럼 <em>시선이 수평으로 고정</em>되어 있었습니다.
세로줄 렌더링은 "벽이 화면에서 수직"이라는 전제 위에 서 있는데,
카메라를 위아래로 기울이면 벽이 <b>기울어진 사다리꼴</b>이 되어 전제가 무너지기 때문입니다.</p>
<p>후기 엔진들(Heretic, Duke Nukem 3D)은 <b>y-셰어링(수직 전단)</b>이라는 눈속임을 썼습니다:
카메라를 기울이는 대신 <em>지평선(화면 중앙)을 위아래로 밀어 올리는</em> 것입니다.
왜곡이 있지만 빠르고, 우리 엔진에도 몇 줄이면 들어갑니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py"># doom.py 개조: horizon(픽셀 오프셋)을 게임 상태에 추가
# render_walls()에서 벽 세로 위치에 더한다
y0 = HALF_H - line_h // 2 + horizon      # 원래는 HALF_H - line_h // 2
# 천장/바닥 fill 경계도 HALF_H + horizon으로 옮기고,
# 마우스 상하 이동이나 R/F 키로 horizon을 ±120 범위에서 조절해 보자</pre>
<div class="note grn">진짜 상하 시선(롤 없는 pitch 회전)은 세로줄 전제를 포기해야 해서
Quake(1996)의 진짜 3D 폴리곤 렌더러에 와서야 해결됩니다.</div>`},

{t:'높이가 다른 벽 만들기',k:'VARIABLE HEIGHT',h:`
<p>우리 격자 엔진을 Doom 쪽으로 한 걸음 밀어붙이는 가장 좋은 확장은
<b>셀마다 벽 높이를 다르게</b> 하는 것입니다. 카맥이 Doom 직전에 만든
ShadowCaster(1993)의 엔진이 울펜슈타인을 이 방향으로 확장한 대표작입니다.</p>
<ol>
<li>맵에 높이 배열을 추가합니다: <span class="reg">height[y][x]</span> = 0.5, 1.0, 2.0...</li>
<li>DDA 루프에서 벽을 만나도 <em>멈추지 않고</em>, 지금까지의 최대 높이보다
높은 벽을 만날 때마다 그 구간만 그리고 계속 행진합니다 (낮은 벽 너머가 보여야 하므로).</li>
<li>세로줄 높이는 <span class="reg">line_h = int(H / depth * height)</span> 로,
벽의 <b>위쪽 끝만</b> 높이에 따라 움직이고 바닥선은 고정합니다.</li>
</ol>
<div class="note red">함정: 낮은 벽 뒤가 보이므로 "광선은 첫 벽에서 멈춘다"는
5장의 가정이 깨집니다. 한 컬럼에 <em>여러 벽 구간</em>을 먼 것부터 그려야 하고,
이미 가려진 구간은 건너뛰어야 합니다 — Doom의 구간 클리핑이 왜 필요한지
몸으로 이해하게 되는 확장입니다.</div>`},

{t:'텍스처가 있는 진짜 문과 비밀벽',k:'SLIDING DOORS',h:`
<p>우리 문은 F를 누르면 타일이 0으로 바뀌며 <em>순간 소멸</em>합니다.
울펜슈타인 3D의 문은 <b>옆으로 스르륵 밀려 들어가는</b> 미닫이였죠.
11장 과제의 심화판으로, 원리는 이렇습니다.</p>
<ol>
<li>문마다 <b>열림 정도</b> <span class="reg">open ∈ 0.0 ~ 1.0</span> 을 상태로 둡니다.
F를 누르면 매 프레임 dt만큼 open을 증가시킵니다.</li>
<li>DDA가 문 타일을 만나면, 벽면 좌표 wall_x(0~1)를 열림 정도와 비교합니다:
<span class="reg">wall_x &lt; open</span> 이면 뚫린 부분이므로 <em>광선을 통과</em>시키고,
아니면 텍스처 x좌표를 <span class="reg">wall_x - open</span> 으로 밀어서 그립니다.</li>
<li>이동 판정은 open이 0.9를 넘을 때만 통과 허용.</li>
</ol>
<p><b>비밀벽</b>(밀리는 벽)도 같은 뼈대입니다 — 열림 정도 대신
벽이 <em>광선 방향으로 반 칸씩 물러난 위치</em>를 저장하고,
DDA에서 그 셀만 교차 판정을 보정하면 됩니다.</p>
<div class="note">공통 패턴: <em>맵 타일에 연속적인 상태(0~1)를 붙이고,
DDA의 교차 판정에서 그 상태를 읽는다.</em> 이 패턴 하나로 문, 비밀벽,
얇은 창살, 반투명 커튼까지 만들 수 있습니다.</div>`},

{t:'사운드 넣기 — 총소리 10줄',k:'SOUND',h:`
<p>Doom의 공포는 절반이 소리였습니다. 파일 없이 <em>코드로 파형을 만들어</em>
총소리를 넣어 봅시다. 두 언어 모두 10줄 안팎입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">const AC = new AudioContext();            // 최초 클릭 후 생성 권장
function shootSound(){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'square'; o.frequency.value = 90;         // 낮은 사각파
  g.gain.setValueAtTime(0.5, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.25);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + 0.25);          // 0.25초 감쇠
}</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">import numpy
pygame.mixer.quit()                       # pygame.init()의 기본 설정(44100Hz·스테레오)을 닫고
pygame.mixer.init(22050, -16, 1)          # 22.05kHz·16비트·모노로 다시 연다
n = 22050 // 4                            # 0.25초 분량 샘플
t = numpy.arange(n)
wave = numpy.sign(numpy.sin(2 * numpy.pi * 90 * t / 22050))  # 90Hz 사각파
wave = (wave * numpy.linspace(3000, 0, n)).astype(numpy.int16)  # 감쇠
gun_snd = pygame.sndarray.make_sound(wave)
# fire()가 성공했을 때: gun_snd.play()</pre>
<div class="note">두 코드 모두 발상이 같습니다: <em>사각파 × 줄어드는 볼륨 = 총성.</em>
주파수를 60Hz로 낮추면 대포, 400Hz로 올리고 0.05초로 줄이면 레이저가 됩니다.</div>`},

{t:'네트워크 대전이라는 산',k:'DEATHMATCH',h:`
<p>Doom은 <b>데스매치</b>라는 말을 만든 게임입니다. 그 멀티플레이는
지금 봐도 우아한 방식이었습니다 — 그리고 그대로 흉내 내기엔 만만치 않은 산입니다.</p>
<ul class="b">
<li><b>락스텝(lockstep) 동기화</b> — Doom은 좌표를 주고받지 않습니다.
각 컴퓨터가 <em>키 입력(tic 커맨드)만</em> 교환하고, 모두가 같은 시뮬레이션을
똑같이 돌립니다. 4명이어도 초당 몇 백 바이트면 충분했습니다.</li>
<li><b>결정론이 생명</b> — 같은 입력이면 모든 기계에서 <em>비트 단위로 같은 결과</em>가
나와야 합니다. 부동소수점 반올림 차이 하나로 두 세계가 영영 갈라집니다
(Doom이 고정소수점 정수 연산을 쓴 이유 중 하나).</li>
<li><b>우리 엔진이라면</b> — random 호출을 시드 고정 난수로 바꾸고, dt를 가변이 아닌
고정 틱(1/35초)으로 바꾸는 것이 첫걸음입니다. 그것만으로도 리플레이 저장이 공짜로 생깁니다.</li>
</ul>
<div class="note blue">고정 틱 + 입력 기록 = <b>데모 녹화</b>. Doom의 유명한 스피드런 문화는
이 아키텍처의 부산물입니다. 네트워크 전에 리플레이부터 만들어 보세요 —
같은 근육을 안전하게 단련할 수 있습니다.</div>`},

{t:'소스 포트의 세계',k:'SOURCE PORTS',h:`
<p>1997년 id Software가 Doom 소스를 공개한 뒤, 커뮤니티가 유지·발전시켜 온
<b>소스 포트</b>들이 있습니다. 진짜 엔진 코드를 읽는 가장 좋은 입구입니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>포트</th><th>성격</th><th>이런 사람에게</th></tr>
<tr><td><b>Chocolate Doom</b></td><td>1993년 동작을 버그까지 보존한 충실 이식</td><td>원본 코드 구조를
그대로 배우고 싶은 사람 — <em>코드 읽기 입문에 최적</em></td></tr>
<tr><td><b>GZDoom</b></td><td>OpenGL 렌더러, 스크립트, 모드의 사실상 표준</td><td>모드 제작,
현대적 확장이 목적인 사람</td></tr>
<tr><td><b>dsda-doom</b></td><td>스피드런/데모 재생 특화, 정확성 중시</td><td>데모 호환성과
결정론 구현이 궁금한 사람</td></tr>
</table></div>
<p>읽기 순서 추천: Chocolate Doom에서 <span class="reg">r_main.c</span> →
<span class="reg">r_bsp.c</span> → <span class="reg">r_segs.c</span> →
<span class="reg">r_plane.c</span>. 이번 장에서 본 BSP 순회 → 벽 컬럼 → visplane이
파일 이름 그대로 늘어서 있습니다.</p>
<div class="note grn">우리 엔진을 완주한 지금의 여러분은 r_segs.c의 컬럼 루프를 보고
"아, 이거 render_walls네"라고 말할 수 있습니다. 그게 이 문서가 준비한 선물입니다.</div>`},

{t:'마지막 플레이 — 배운 눈으로 다시 보기',k:'FINAL PLAY',h:`
<p>1장에서 처음 만났던 게임입니다. 그때는 마법이었지만,
지금 여러분은 <em>이 화면의 모든 픽셀을 설명할 수 있습니다.</em></p>
<div class="demoWrap"><div class="dTitle">FINAL PLAY</div>
<canvas class="demo wide" data-demo="game" width="320" height="200"></canvas>
<div class="padBtns"><button data-k="L">⟲</button><button data-k="U">▲</button><button data-k="D">▼</button><button data-k="R">⟳</button>
<button data-p="fire">FIRE</button><button data-p="open">OPEN</button><button data-p="resetG">RESET</button></div>
</div>
<ul class="b">
<li>벽의 세로줄 하나하나 — <b>DDA 광선</b>과 <b>1/depth 투영</b> (5, 7장).</li>
<li>벽면의 무늬 — <b>wall_x로 고른 텍스처 열</b> (8장), 남북면이 어두운 것은 side 판정 (6장).</li>
<li>먼 곳이 어두워지는 것 — <b>거리 안개</b> (6장).</li>
<li>악마가 벽 뒤에 가려지는 것 — <b>z버퍼</b> (9장). 악마가 쫓아오는 것 — 시야 판정 AI (12장).</li>
<li>비스듬한 벽에서 미끄러지는 이동 — <b>축 분리 try_move</b> (10장).</li>
</ul>
<div class="note">플레이하면서 각 픽셀에 챕터 번호를 붙일 수 있다면,
이 문서는 임무를 다한 것입니다.</div>`},

{t:'당신의 다음 프로젝트',k:'ROADMAP',h:`
<p>이 문서가 끝나는 곳에서 여러분의 프로젝트가 시작됩니다.
쉬운 것부터 하나씩 — 각 단계가 앞 단계 위에 쌓이도록 배열했습니다.</p>
<ol>
<li><b>총소리와 피격음</b> — 슬라이드 8의 10줄. 가장 싼 값으로 가장 크게 체감이 변합니다.</li>
<li><b>무기 2종</b> — 권총(단발·정확)과 샷건(광각·근거리). fire()에
각도 허용치와 데미지 파라미터를 추가하고 숫자키로 전환합니다.</li>
<li><b>미닫이 문</b> — 슬라이드 7의 열림 정도 0~1 패턴. DDA 교차 판정을 처음으로 확장해 봅니다.</li>
<li><b>y-셰어링</b> — 슬라이드 5의 horizon 변수. 마우스로 위아래를 둘러보게 합니다.</li>
<li><b>높이 맵</b> — 슬라이드 6의 셀별 높이. 한 컬럼에 여러 벽 구간을 그리는
구간 클리핑을 익힙니다 — Doom으로 가는 관문입니다.</li>
<li><b>미로 자동 생성</b> — 재귀 백트래킹으로 MAP_STR을 만들어내면
매번 다른 맵이 나옵니다. 렌더러는 한 줄도 고칠 필요가 없습니다.</li>
<li><b>고정 틱 + 리플레이</b> — 슬라이드 9의 결정론. 네트워크 대전의 기초 체력입니다.</li>
</ol>
<div class="note grn">순서의 원칙: <em>렌더러를 건드리지 않는 확장(1, 2, 6)과
렌더러를 확장하는 것(3, 4, 5)을 번갈아</em> 하면 지치지 않습니다.</div>`},

{t:'끝 — 1993년의 마법',k:'THE END',h:`
<div class="big">
<span class="hero">1993년의 마법은 수학 다섯 개였다.<br>이제 당신의 것이다.</span>
닮은꼴 삼각형(원근), DDA(광선 행진), 코사인 보정(어안),
아크탄젠트(스프라이트 투영), 그리고 z버퍼(가림).
이 다섯이 벽이 되고, 악마가 되고, 공포가 되고, 한 시대가 되었습니다.
<br><br>
여러분은 그것을 두 언어로 두 번 만들었습니다.
다음 화면 세로줄 640개는, 여러분의 게임에서 빛나기를.
</div>`},

]});
</script>

<script>
/* ═════════ 슬라이드 엔진 ═════════ */
const SLIDES=[];
CHAPTERS.forEach(function(ch,ci){
  SLIDES.push({ch:ci,cover:true});
  ch.slides.forEach(function(s){SLIDES.push({ch:ci,cover:false,t:s.t,k:s.k||'',h:s.h});});
});
const N=SLIDES.length;
let cur=0;
const stage=document.getElementById('stage'),barFill=document.getElementById('barFill'),
      cnt=document.getElementById('cnt'),chapLabel=document.getElementById('chapLabel'),
      dotsEl=document.getElementById('dots');

function strip(s){return s.replace(/<[^>]+>/g,'');}

/* 코드 하이라이터 */
const JS_KW=/\b(const|let|var|for|if|else|function|return|new|of|in|while|break|continue|void|true|false|null|typeof|class|this)\b/g;
const PY_KW=/\b(def|class|import|from|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|global|break|continue|pass|lambda|with|as|try|except|raise|assert|yield|print)\b/g;
function hl(root){
  root.querySelectorAll('pre.code').forEach(function(p){
    if(p.dataset.hlDone)return; p.dataset.hlDone='1';
    let t=p.innerHTML, lang=p.dataset.lang||'js', hold=[];
    function keep(m){hold.push(m);return '@@H'+(hold.length-1)+'@@';}
    if(lang==='py'){t=t.replace(/#[^\n]*/g,function(m){return keep('<span class="c">'+m+'</span>');});}
    else{t=t.replace(/\/\/[^\n]*/g,function(m){return keep('<span class="c">'+m+'</span>');});
         t=t.replace(/\/\*[\s\S]*?\*\//g,function(m){return keep('<span class="c">'+m+'</span>');});}
    t=t.replace(/('[^'\n]*'|"[^"\n]*")/g,function(m){return keep('<span class="s">'+m+'</span>');});
    t=t.replace(/\b(\d+(?:\.\d+)?(?:e-?\d+)?)\b/g,function(m){return keep('<span class="n">'+m+'</span>');});
    t=t.replace(lang==='py'?PY_KW:JS_KW,'<span class="k">$&</span>');
    t=t.replace(/@@H(\d+)@@/g,function(_,i){return hold[+i];});
    p.innerHTML=t;
  });
}

function render(dir){
  stopDemos();
  const s=SLIDES[cur],ch=CHAPTERS[s.ch];
  barFill.style.width=((cur+1)/N*100)+'%';
  cnt.textContent=(cur+1)+' / '+N;
  chapLabel.textContent='CH.'+(s.ch+1)+'  '+strip(ch.title);
  const el=document.createElement('div');
  el.className='slide'+(dir<0?' back':'');
  if(s.cover){
    el.innerHTML='<div class="cover"><div class="icon">'+ch.icon+'</div>'
      +'<div class="chNo">CHAPTER '+(s.ch+1)+' / '+CHAPTERS.length+'</div>'
      +'<h1>'+ch.title+'</h1><div class="desc">'+ch.desc+'</div>'
      +'<div class="mini">'+ch.slides.length+' SLIDES ─ → 키 또는 스와이프</div></div>';
  }else{
    el.innerHTML='<div class="kick">'+s.k+'</div><h1 class="st">'+s.t+'</h1>'
      +'<div class="body">'+s.h+'</div>';
  }
  stage.replaceChildren(el);
  hl(el); initDemos(el);
  Array.prototype.forEach.call(dotsEl.children,function(d,i){d.classList.toggle('on',i===s.ch);});
  try{history.replaceState(null,'','#s'+(cur+1));}catch(e){}
}
function go(n,dir){
  n=Math.max(0,Math.min(N-1,n));
  if(n===cur&&stage.children.length)return;
  const d=(dir!==undefined)?dir:(n>=cur?1:-1);
  cur=n; render(d);
}
document.getElementById('btnPrev').onclick=function(){go(cur-1,-1);};
document.getElementById('btnNext').onclick=function(){go(cur+1,1);};

CHAPTERS.forEach(function(ch,ci){
  const b=document.createElement('button');b.className='d';b.title=strip(ch.title);
  b.onclick=function(){go(SLIDES.findIndex(function(s){return s.ch===ci;}),1);};
  dotsEl.appendChild(b);
});

const toc=document.getElementById('toc'),tocList=document.getElementById('tocList');
CHAPTERS.forEach(function(ch,ci){
  const start=SLIDES.findIndex(function(s){return s.ch===ci;});
  const b=document.createElement('button');b.className='item';
  b.innerHTML='<span>'+ch.icon+'</span><span class="no">'+String(start+1).padStart(3,'0')+'</span><span>'+ch.title+'</span>';
  b.onclick=function(){toc.hidden=true;go(start,1);};
  tocList.appendChild(b);
});
document.getElementById('btnToc').onclick=function(){toc.hidden=false;};
document.getElementById('tocClose').onclick=function(){toc.hidden=true;};
toc.addEventListener('click',function(e){if(e.target===toc)toc.hidden=true;});

window.addEventListener('keydown',function(e){
  if(!toc.hidden){if(e.key==='Escape')toc.hidden=true;return;}
  const tg=e.target.tagName;
  if(tg==='INPUT'||tg==='TEXTAREA')return;
  if(tg==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  const gameOn=!!document.querySelector('canvas[data-demo="game"]');
  if(e.key==='ArrowRight'||(e.key===' '&&!gameOn)||e.key==='PageDown'){e.preventDefault();go(cur+1,1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1,-1);}
  else if(e.key==='Home'){go(0,-1);}
  else if(e.key==='End'){go(N-1,1);}
});
let tx0=0,ty0=0;
stage.addEventListener('touchstart',function(e){tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',function(e){
  if(e.target.closest('.demoWrap'))return;

<script>
/* ═════════ 데모 프레임워크 ═════════ */
const DEMOS={};
let demoStops=[];
function stopDemos(){demoStops.forEach(function(f){try{f();}catch(e){}});demoStops=[];}
function initDemos(root){
  root.querySelectorAll('canvas[data-demo]').forEach(function(cv){
    const f=DEMOS[cv.dataset.demo];
    if(f){try{const stop=f(cv,cv.closest('.demoWrap'));if(stop)demoStops.push(stop);}catch(e){console.error(e);}}
  });
}
function loopDemo(fn){
  let run=true,id=0,t0=null;
  function tick(ts){if(!run)return;if(t0===null)t0=ts;fn((ts-t0)/1000);id=requestAnimationFrame(tick);}
  id=requestAnimationFrame(tick);
  return function(){run=false;cancelAnimationFrame(id);};
}
function P(w,n){return w?w.querySelector('[data-p="'+n+'"]'):null;}
function ctx2d(cv){const c=cv.getContext('2d');c.imageSmoothingEnabled=false;return c;}
function rgb(r,g,b){return (0xff000000|(b<<16)|(g<<8)|r)>>>0;}
function shadeC(c,f){return rgb(((c&255)*f)|0,(((c>>8)&255)*f)|0,(((c>>16)&255)*f)|0);}
function lerp(a,b,f){return a+(b-a)*f;}

/* ── 공용 맵 (본문 예제 코드와 동일) ── */
const DMAP=[
'1111111111111111',
'1000000110000001',
'1020000110000201',
'1000000000000001',
'1000111141110001',
'1000100000010001',
'1300100000010031',
'1000100000010001',
'1000111411110001',
'1000000000000001',
'1020000330000201',
'1000000330000001',
'1000000000000051',
'1111111111111111'];
const DW=16,DH=14;
function dCell(w,x,y){if(x<0||y<0||x>=DW||y>=DH)return 1;return w[y][x];}
function dWorld(){return DMAP.map(function(r){return r.split('').map(Number);});}

/* ── 공용 DDA 레이캐스팅 (본문 코드와 동일 알고리즘) ── */
function dCast(w,px,py,ang){
  const sin=Math.sin(ang),cos=Math.cos(ang);
  let mapX=px|0,mapY=py|0;
  const ddx=cos===0?1e30:Math.abs(1/cos),ddy=sin===0?1e30:Math.abs(1/sin);
  let stepX,stepY,sideX,sideY,side=0;
  if(cos<0){stepX=-1;sideX=(px-mapX)*ddx;}else{stepX=1;sideX=(mapX+1-px)*ddx;}
  if(sin<0){stepY=-1;sideY=(py-mapY)*ddy;}else{stepY=1;sideY=(mapY+1-py)*ddy;}
  for(let i=0;i<64;i++){
    if(sideX<sideY){sideX+=ddx;mapX+=stepX;side=0;}
    else{sideY+=ddy;mapY+=stepY;side=1;}
    const tile=dCell(w,mapX,mapY);
    if(tile>0){
      let dist=side===0?sideX-ddx:sideY-ddy;
      if(dist<1e-4)dist=1e-4;
      const hit=side===0?py+dist*sin:px+dist*cos;
      return {tile:tile,dist:dist,wallX:hit-Math.floor(hit),side:side,mx:mapX,my:mapY};
    }
  }
  return {tile:1,dist:24,wallX:0,side:0,mx:0,my:0};
}

/* ── 공용 절차적 텍스처 (본문 코드와 동일 공식) ── */
const _dtex={};
function dTex(id){
  if(_dtex[id])return _dtex[id];
  const T=64,t=new Uint32Array(T*T);
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    let c;
    if(id===1){const off=((y>>4)&1)?16:0,m=(y%16<2)||((x+off)%32<2);
      c=m?rgb(60,24,20):rgb(150,60,44);
      if(!m&&(x*7+y*13)%31===0)c=rgb(120,46,36);}
    else if(id===2){const n=(x*x*3+y*y*7+x*y)%97,g=90+(n%40);
      c=rgb(g,g,g+8);if((x+y*3)%23===0)c=rgb(70,70,78);}
    else if(id===3){const g=70+(y%16)*3;c=rgb(g-20,g,g+14);
      if(x%16<2||y%16<2)c=rgb(40,46,56);
      if((x%16===4||x%16===12)&&(y%16===4||y%16===12))c=rgb(180,190,205);}
    else if(id===4){c=(((x>>3)+(y>>3))&1)?rgb(40,90,60):rgb(30,70,46);
      if(x>=28&&x<36)c=rgb(200,170,60);}
    else if(id===6){const n=(x*13+y*29+((x*y)>>2))%64;c=rgb(90+n,80+(n>>1),60);}
    else{c=(((x>>3)+(y>>3))&1)?rgb(160,30,30):rgb(240,220,210);}
    t[y*T+x]=c;
  }
  _dtex[id]=t;return t;
}
const WALLCOL={1:rgb(150,60,44),2:rgb(120,120,128),3:rgb(70,90,104),4:rgb(40,90,60),5:rgb(160,30,30)};

/* ── 공용 스프라이트 그림 ── */
let _dimp=null,_dmed=null;
function dImp(){
  if(_dimp)return _dimp;
  const cv=document.createElement('canvas');cv.width=cv.height=64;
  const c=cv.getContext('2d');
  c.fillStyle='#8c4628';
  for(let y=0;y<64;y++)for(let x=0;x<64;x++){
    const dx=x-32,dy=y-34;
    if((dx*dx>>1)+dy*dy<500)c.fillRect(x,y,1,1);
  }
  c.beginPath();c.arc(32,16,11,0,7);c.fill();
  c.fillStyle='#c8b4a0';
  c.beginPath();c.moveTo(22,8);c.lineTo(18,0);c.lineTo(26,6);c.fill();
  c.beginPath();c.moveTo(42,8);c.lineTo(46,0);c.lineTo(38,6);c.fill();
  c.fillStyle='#8c4628';c.fillRect(14,30,8,20);c.fillRect(42,30,8,20);
  c.fillStyle='#6e3220';c.fillRect(24,52,7,12);c.fillRect(33,52,7,12);
  c.fillStyle='#fff050';c.fillRect(25,12,4,4);c.fillRect(35,12,4,4);
  c.fillStyle='#000';c.fillRect(26,13,2,2);c.fillRect(36,13,2,2);
  _dimp=new Uint32Array(c.getImageData(0,0,64,64).data.buffer);
  return _dimp;
}
function dMed(){
  if(_dmed)return _dmed;
  const cv=document.createElement('canvas');cv.width=cv.height=64;
  const c=cv.getContext('2d');
  c.fillStyle='#ebebeb';c.fillRect(16,34,32,22);
  c.fillStyle='#c82828';c.fillRect(28,38,8,14);c.fillRect(25,41,14,8);
  _dmed=new Uint32Array(c.getImageData(0,0,64,64).data.buffer);
  return _dmed;
}

/* ── 공용 3D 렌더러 (옵션에 따라 단계별 기능 on/off) ── */
/* opt: fix(어안보정) tex(텍스처) shade(그늘/안개) floorTex(바닥캐스팅) horizon */
function renderScene(pix,W,H,world,pl,opt,zbuf){
  const HALF=H>>1,fov=opt.fov||Math.PI/3,tanF=Math.tan(fov/2);
  const C_CEIL=rgb(30,34,44),C_FLOOR=rgb(52,46,40);
  const ftex=dTex(6),ctex=dTex(2);
  for(let col=0;col<W;col++){
    const cam=2*col/W-1;
    const rayAng=pl.ang+Math.atan(cam*tanF);
    const r=dCast(world,pl.x,pl.y,rayAng);
    const depth=opt.fix===false?r.dist:r.dist*Math.cos(rayAng-pl.ang);
    if(zbuf)zbuf[col]=depth;
    let lineH=(H/depth)|0;
    let y0=HALF-(lineH>>1),y1=y0+lineH;
    const cy0=Math.max(0,y0),cy1=Math.min(H,y1);
    let fog=opt.shade===false?1:1-Math.min(1,depth/14);
    if(opt.shade!==false&&r.side===1)fog*=0.62;
    if(opt.tex===false){
      const c=shadeC(WALLCOL[r.tile]||WALLCOL[1],fog);
      for(let y=cy0;y<cy1;y++)pix[y*W+col]=c;
    }else{
      const tex=dTex(r.tile);
      const texX=(r.wallX*64)|0,step=64/lineH;
      let texPos=(cy0-HALF+lineH/2)*step;
      for(let y=cy0;y<cy1;y++){
        const c=tex[((texPos|0)&63)*64+texX];
        texPos+=step;
        pix[y*W+col]=shadeC(c,fog);
      }
    }
    if(opt.floorTex){
      /* 바닥·천장 캐스팅: 화면 행 → 월드 좌표 역산 */
      const cosR=Math.cos(rayAng),sinR=Math.sin(rayAng),corr=Math.cos(rayAng-pl.ang);
      for(let y=cy1;y<H;y++){
        const rowDist=(H/2)/(y-HALF)/corr;
        const fx=pl.x+cosR*rowDist,fy=pl.y+sinR*rowDist;
        const tx=((fx-Math.floor(fx))*64)|0,ty=((fy-Math.floor(fy))*64)|0;
        const f2=opt.shade===false?1:1-Math.min(1,rowDist/14);
        pix[y*W+col]=shadeC(ftex[ty*64+tx],f2);
      }
      for(let y=0;y<cy0;y++){
        const rowDist=(H/2)/(HALF-y)/corr;
        const fx=pl.x+cosR*rowDist,fy=pl.y+sinR*rowDist;
        const tx=((fx-Math.floor(fx))*64)|0,ty=((fy-Math.floor(fy))*64)|0;
        const f2=opt.shade===false?1:1-Math.min(1,rowDist/14);
        pix[y*W+col]=shadeC(ctex[ty*64+tx],f2*0.6);
      }
    }else{
      for(let y=0;y<cy0;y++)pix[y*W+col]=shadeC(C_CEIL,1-y/H*0.7);
      for(let y=cy1;y<H;y++)pix[y*W+col]=shadeC(C_FLOOR,(y-HALF)/HALF*0.9+0.1);
    }
  }
}
/* 스프라이트 렌더 (z버퍼 옵션) */
function renderSpr(pix,W,H,pl,sprs,zbuf,useZ,fov){
  const HALF=H>>1,tanF=Math.tan((fov||Math.PI/3)/2);
  const order=sprs.filter(function(s){return s.alive!==false;});
  order.sort(function(a,b){
    return ((b.x-pl.x)*(b.x-pl.x)+(b.y-pl.y)*(b.y-pl.y))-((a.x-pl.x)*(a.x-pl.x)+(a.y-pl.y)*(a.y-pl.y));
  });
  order.forEach(function(s){
    const dx=s.x-pl.x,dy=s.y-pl.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<0.4||dist>24)return;
    let rel=Math.atan2(dy,dx)-pl.ang;
    rel=((rel+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
    if(Math.abs(rel)>1.1)return;
    const depth=dist*Math.cos(rel),size=(H/depth)|0;
    if(size<=1)return;
    const sx=(((0.5+Math.tan(rel)/(2*tanF))*W)-size/2)|0,sy=HALF-(size>>1);
    const img=s.kind==='medkit'?dMed():dImp();
    const fog=1-Math.min(1,depth/14);
    for(let i=0;i<size;i++){
      const col=sx+i;
      if(col<0||col>=W)continue;
      if(useZ!==false&&depth>=zbuf[col])continue;
      const tx=(i/size*64)|0;
      for(let y=0;y<size;y++){
        const sy2=sy+y;
        if(sy2<0||sy2>=H)continue;
        const c=img[((y/size*64)|0)*64+tx];
        if((c>>>24)<128)continue;
        pix[sy2*W+col]=shadeC(c,fog);
      }
    }
  });
}
/* 톱다운 지도 그리기 */
function drawMap(c,world,sc,opts){
  opts=opts||{};
  c.fillStyle='#0c0c12';c.fillRect(0,0,DW*sc,DH*sc);
  for(let y=0;y<DH;y++)for(let x=0;x<DW;x++){
    const t=world[y][x];
    if(t){
      c.fillStyle=t===4?'#3c9c5a':t===5?'#c03030':t===2?'#6a6a74':t===3?'#48606e':'#8a4632';
      c.fillRect(x*sc,y*sc,sc-1,sc-1);
    }else{
      c.fillStyle='#16161e';c.fillRect(x*sc,y*sc,sc-1,sc-1);
    }
  }
  if(opts.grid!==false){
    c.strokeStyle='rgba(255,255,255,.07)';c.lineWidth=1;
    for(let x=0;x<=DW;x++){c.beginPath();c.moveTo(x*sc,0);c.lineTo(x*sc,DH*sc);c.stroke();}
    for(let y=0;y<=DH;y++){c.beginPath();c.moveTo(0,y*sc);c.lineTo(DW*sc,y*sc);c.stroke();}
  }
}
function drawPlayer(c,pl,sc,len){
  c.fillStyle='#3ddc84';
  c.beginPath();c.arc(pl.x*sc,pl.y*sc,sc*0.22,0,7);c.fill();
  c.strokeStyle='#3ddc84';c.lineWidth=2;
  c.beginPath();c.moveTo(pl.x*sc,pl.y*sc);
  c.lineTo((pl.x+Math.cos(pl.ang)*(len||1.1))*sc,(pl.y+Math.sin(pl.ang)*(len||1.1))*sc);c.stroke();
}
/* 슬라이더 값 표시 헬퍼 */
function bindVal(w,name,fmt){
  const inp=P(w,name),vs=w?w.querySelector('[data-v="'+name+'"]'):null;
  function upd(){if(vs)vs.textContent=fmt?fmt(+inp.value):inp.value;}
  if(inp){inp.addEventListener('input',upd);upd();}
  return inp;
}
/* 이동 패드 공용: data-k 버튼들을 keys 객체에 바인딩 */
function bindPad(w,keys){
  const fns=[];
  if(!w)return function(){};
  w.querySelectorAll('button[data-k]').forEach(function(b){
    const k=b.dataset.k;
    function dn(e){e.preventDefault();keys[k]=true;b.classList.add('on');}
    function up(e){e.preventDefault();keys[k]=false;b.classList.remove('on');}
    b.addEventListener('pointerdown',dn);
    b.addEventListener('pointerup',up);
    b.addEventListener('pointerleave',up);
    b.addEventListener('pointercancel',up);
    fns.push(function(){b.removeEventListener('pointerdown',dn);b.removeEventListener('pointerup',up);
      b.removeEventListener('pointerleave',up);b.removeEventListener('pointercancel',up);});
  });
  return function(){fns.forEach(function(f){f();});};
}
/* 키보드 공용 (데모용 — 슬라이드 넘김과 충돌하는 키만 잡는다) */
function bindKeys(keys,codes){
  function kd(e){if(codes.indexOf(e.code)>=0){keys[e.code]=true;e.preventDefault();}}
  function ku(e){if(codes.indexOf(e.code)>=0){keys[e.code]=false;}}
  window.addEventListener('keydown',kd);
  window.addEventListener('keyup',ku);
  return function(){window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);};
}

/* ══ DEMO: 단위원과 sin/cos ══ */
DEMOS.unitcircle=function(cv,w){
  const c=ctx2d(cv),W=cv.width,H=cv.height;
  const angIn=bindVal(w,'ang',function(v){return v+'°';});
  return loopDemo(function(){
    const deg=angIn?+angIn.value:40,a=-deg*Math.PI/180;
    const cx=H*0.5,cy=H*0.5,R=H*0.36;
    c.fillStyle='#0c0c14';c.fillRect(0,0,W,H);
    c.strokeStyle='rgba(255,255,255,.15)';c.lineWidth=1;
    c.beginPath();c.moveTo(cx-R-20,cy);c.lineTo(cx+R+20,cy);c.stroke();
    c.beginPath();c.moveTo(cx,cy-R-20);c.lineTo(cx,cy+R+20);c.stroke();
    c.strokeStyle='#53a8ff';c.lineWidth=2;
    c.beginPath();c.arc(cx,cy,R,0,7);c.stroke();
    const px=cx+Math.cos(a)*R,py=cy+Math.sin(a)*R;
    c.strokeStyle='rgba(255,181,46,.8)';c.lineWidth=2;
    c.beginPath();c.moveTo(px,py);c.lineTo(px,cy);c.stroke();
    c.strokeStyle='rgba(61,220,132,.8)';
    c.beginPath();c.moveTo(px,cy);c.lineTo(cx,cy);c.stroke();
    c.strokeStyle='#ff5a36';c.lineWidth=3;
    c.beginPath();c.moveTo(cx,cy);c.lineTo(px,py);c.stroke();
    c.fillStyle='#ff5a36';c.beginPath();c.arc(px,py,5,0,7);c.fill();
    c.font='bold 15px monospace';
    c.fillStyle='#3ddc84';c.fillText('cos '+Math.cos(a).toFixed(2),cx+R+30,cy+40);
    c.fillStyle='#ffb52e';c.fillText('sin '+(-Math.sin(a)).toFixed(2),cx+R+30,cy+62);
    c.fillStyle='#eee';c.fillText('angle '+deg+'°',cx+R+30,cy+18);
    c.fillStyle='#888';c.font='12px monospace';
    c.fillText('x = cos(a), y = sin(a)',cx+R+30,cy+90);
  });
};

/* ══ DEMO: 톱다운 맵 + 방향 벡터 ══ */
DEMOS.topdown=function(cv,w){
  const c=ctx2d(cv),sc=cv.width/DW;
  const world=dWorld();
  const pl={x:3.5,y:3.5,ang:0.5};
  const angIn=bindVal(w,'ang',function(v){return v+'°';});
  function drag(e){
    const r=cv.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*DW,y=(e.clientY-r.top)/r.height*DH;
    if(dCell(world,x|0,y|0)===0){pl.x=x;pl.y=y;}
  }
  let down=false;
  function pd(e){down=true;drag(e);e.preventDefault();}
  function pm(e){if(down)drag(e);}
  function pu(){down=false;}
  cv.addEventListener('pointerdown',pd);cv.addEventListener('pointermove',pm);
  window.addEventListener('pointerup',pu);
  const stopL=loopDemo(function(){
    pl.ang=(angIn?+angIn.value:30)*Math.PI/180;
    drawMap(c,world,sc);
    drawPlayer(c,pl,sc,1.6);
    c.font='bold 13px monospace';c.fillStyle='#3ddc84';
    c.fillText('P('+pl.x.toFixed(1)+', '+pl.y.toFixed(1)+')  dir('+Math.cos(pl.ang).toFixed(2)+', '+Math.sin(pl.ang).toFixed(2)+')',8,DH*sc-8);
  });
  return function(){stopL();cv.removeEventListener('pointerdown',pd);
    cv.removeEventListener('pointermove',pm);window.removeEventListener('pointerup',pu);};
};

/* ══ DEMO: 광선 하나 쏘기 (고정 스텝 행진) ══ */
DEMOS.rayone=function(cv,w){
  const c=ctx2d(cv),sc=cv.width/DW;
  const world=dWorld();
  const pl={x:3.5,y:3.5,ang:0};
  const angIn=bindVal(w,'ang',function(v){return v+'°';});
  const stepIn=bindVal(w,'step',function(v){return (v/100).toFixed(2);});
  return loopDemo(function(t){
    pl.ang=(angIn?+angIn.value:20)*Math.PI/180;
    const stepLen=stepIn?+stepIn.value/100:0.3;
    drawMap(c,world,sc);
    const r=dCast(world,pl.x,pl.y,pl.ang);
    c.fillStyle='rgba(255,90,54,.25)';
    c.fillRect(r.mx*sc,r.my*sc,sc-1,sc-1);
    /* 고정 스텝 행진 점 — 애니메이션 */
    const maxN=Math.ceil(r.dist/stepLen);
    const shown=Math.min(maxN,1+((t*6)%(maxN+6))|0);
    for(let i=1;i<=shown;i++){
      const d=i*stepLen;if(d>r.dist)break;
      const x=pl.x+Math.cos(pl.ang)*d,y=pl.y+Math.sin(pl.ang)*d;
      c.fillStyle='#ffb52e';c.beginPath();c.arc(x*sc,y*sc,3,0,7);c.fill();
    }
    c.strokeStyle='rgba(255,90,54,.9)';c.lineWidth=2;
    c.beginPath();c.moveTo(pl.x*sc,pl.y*sc);
    c.lineTo((pl.x+Math.cos(pl.ang)*r.dist)*sc,(pl.y+Math.sin(pl.ang)*r.dist)*sc);c.stroke();
    drawPlayer(c,pl,sc,0.9);
    c.fillStyle='#ff5a36';
    const hx=pl.x+Math.cos(pl.ang)*r.dist,hy=pl.y+Math.sin(pl.ang)*r.dist;
    c.beginPath();c.arc(hx*sc,hy*sc,5,0,7);c.fill();
    c.font='bold 13px monospace';c.fillStyle='#eee';
    c.fillText('dist = '+r.dist.toFixed(3)+'   스텝 '+stepLen.toFixed(2)+' → 최대 '+maxN+'번 검사',8,DH*sc-8);
  });
};

/* ══ DEMO: FOV 부채살 + 거리 스트립 ══ */
DEMOS.fovfan=function(cv,w){
  const c=ctx2d(cv),sc=(cv.height-80)/DH;
  const world=dWorld();
  const pl={x:3.5,y:3.5,ang:0.4};
  const fovIn=bindVal(w,'fov',function(v){return v+'°';});
  const nIn=bindVal(w,'rays');
  return loopDemo(function(t){
    pl.ang=0.4+Math.sin(t*0.4)*0.5;
    const fov=(fovIn?+fovIn.value:60)*Math.PI/180;
    const n=nIn?+nIn.value:40;
    c.fillStyle='#0c0c14';c.fillRect(0,0,cv.width,cv.height);
    c.save();c.translate((cv.width-DW*sc)/2,0);
    drawMap(c,world,sc);
    const stripY=DH*sc+10,stripH=60;
    for(let i=0;i<n;i++){
      const cam=n===1?0:2*i/(n-1)-1;
      const a=pl.ang+Math.atan(cam*Math.tan(fov/2));
      const r=dCast(world,pl.x,pl.y,a);
      c.strokeStyle='rgba(255,181,46,.30)';c.lineWidth=1;
      c.beginPath();c.moveTo(pl.x*sc,pl.y*sc);
      c.lineTo((pl.x+Math.cos(a)*r.dist)*sc,(pl.y+Math.sin(a)*r.dist)*sc);c.stroke();
      /* 아래 스트립: 열마다 거리→밝기 */
      const depth=r.dist*Math.cos(a-pl.ang);
      const bw=DW*sc/n;
      const bright=Math.max(0,1-depth/12);
      c.fillStyle='rgb('+((150*bright)|0)+','+((60*bright)|0)+','+((44*bright)|0)+')';
      const hgt=Math.min(stripH,stripH/depth*3);
      c.fillRect(i*bw,stripY+(stripH-hgt)/2,Math.ceil(bw),hgt);
    }
    drawPlayer(c,pl,sc,0.9);
    c.fillStyle='#888';c.font='12px monospace';
    c.fillText('↑ 톱다운   ↓ 각 광선의 거리를 벽 높이로 바꾸면 — 벌써 3D',4,stripY-2);
    c.restore();
  });
};

/* ══ DEMO: DDA 한 걸음씩 ══ */
DEMOS.dda=function(cv,w){
  const c=ctx2d(cv);
  const world=dWorld();
  const px=1.35,py=1.6;
  const angIn=bindVal(w,'ang',function(v){return v+'°';});
  const btnStep=P(w,'step'),btnAuto=P(w,'auto'),btnReset=P(w,'reset');
  let steps=0,auto=false,accum=0;
  function reset(){steps=0;}
  if(btnStep)btnStep.onclick=function(){steps++;};
  if(btnReset)btnReset.onclick=reset;
  if(btnAuto)btnAuto.onclick=function(){auto=!auto;btnAuto.classList.toggle('on',auto);};
  if(angIn)angIn.addEventListener('input',reset);
  const VW=8,VH=6,sc=cv.width/VW;
  return loopDemo(function(){
    if(auto){accum++;if(accum>40){accum=0;steps++;}}
    const ang=(angIn?+angIn.value:33)*Math.PI/180;
    const sin=Math.sin(ang),cos=Math.cos(ang);
    c.fillStyle='#0c0c14';c.fillRect(0,0,cv.width,cv.height);
    /* 확대된 부분 지도 */
    for(let y=0;y<VH;y++)for(let x=0;x<VW;x++){
      const t=dCell(world,x,y);
      c.fillStyle=t?'#8a4632':'#16161e';
      c.fillRect(x*sc,y*sc,sc-2,sc-2);
    }
    /* DDA 재현 */
    let mapX=px|0,mapY=py|0;
    const ddx=Math.abs(1/cos),ddy=Math.abs(1/sin);
    let stepX,stepY,sideX,sideY;
    if(cos<0){stepX=-1;sideX=(px-mapX)*ddx;}else{stepX=1;sideX=(mapX+1-px)*ddx;}
    if(sin<0){stepY=-1;sideY=(py-mapY)*ddy;}else{stepY=1;sideY=(mapY+1-py)*ddy;}
    let hit=false,side=0,dist=0,k=0;
    const trail=[];
    for(k=0;k<steps&&!hit;k++){
      if(sideX<sideY){dist=sideX;sideX+=ddx;mapX+=stepX;side=0;}
      else{dist=sideY;sideY+=ddy;mapY+=stepY;side=1;}
      trail.push({x:mapX,y:mapY,d:dist,s:side});
      if(dCell(world,mapX,mapY)>0)hit=true;
    }
    trail.forEach(function(s,i){
      c.fillStyle=(i===trail.length-1&&hit)?'rgba(255,90,54,.55)':'rgba(83,168,255,.28)';
      c.fillRect(s.x*sc,s.y*sc,sc-2,sc-2);
    });
    /* 광선 */
    const far=hit?dist:(steps?dist:0)+12;
    c.strokeStyle='#ff5a36';c.lineWidth=2.5;
    c.beginPath();c.moveTo(px*sc,py*sc);
    c.lineTo((px+cos*far)*sc,(py+sin*far)*sc);c.stroke();
    /* 격자 교차점들 */
    trail.forEach(function(s){
      const x=px+cos*s.d,y=py+sin*s.d;
      c.fillStyle=s.s===0?'#53a8ff':'#ffb52e';
      c.beginPath();c.arc(x*sc,y*sc,6,0,7);c.fill();
    });
    /* 다음 후보 두 개 */
    if(!hit){
      c.globalAlpha=0.55;
      const nx=px+cos*sideX,ny=py+sin*sideX;
      c.strokeStyle='#53a8ff';c.lineWidth=2;
      c.beginPath();c.arc(nx*sc,ny*sc,8,0,7);c.stroke();
      const nx2=px+cos*sideY,ny2=py+sin*sideY;
      c.strokeStyle='#ffb52e';
      c.beginPath();c.arc(nx2*sc,ny2*sc,8,0,7);c.stroke();
      c.globalAlpha=1;
    }
    c.fillStyle='#3ddc84';c.beginPath();c.arc(px*sc,py*sc,7,0,7);c.fill();
    c.font='bold 14px monospace';
    c.fillStyle='#53a8ff';c.fillText('sideDistX '+sideX.toFixed(2),10,cv.height-46);
    c.fillStyle='#ffb52e';c.fillText('sideDistY '+sideY.toFixed(2),10,cv.height-26);
    c.fillStyle=hit?'#ff5a36':'#eee';
    c.fillText(hit?('HIT! ('+mapX+','+mapY+') dist='+dist.toFixed(3)+' side='+side):('step '+steps),10,cv.height-6);
  });
};

/* ══ DEMO: 완성된 미니 Doom (본문 완성 코드의 축소판) ══ */
DEMOS.game=function(cv,w){
  const W=cv.width,H=cv.height,HALF=H>>1;
  const c=ctx2d(cv),img=c.createImageData(W,H),pix=new Uint32Array(img.data.buffer);
  const zbuf=new Float64Array(W);
  const world=dWorld();
  let pl={x:1.5,y:1.5,ang:0.3,hp:100,ammo:40};
  let sprs=[
    {x:9.5,y:1.5,kind:'imp',hp:3,alive:true,cool:0},
    {x:12.5,y:6.5,kind:'imp',hp:3,alive:true,cool:0},
    {x:6.5,y:11.5,kind:'imp',hp:3,alive:true,cool:0},
    {x:10.5,y:10.5,kind:'imp',hp:3,alive:true,cool:0},
    {x:2.5,y:12.2,kind:'imp',hp:3,alive:true,cool:0},
    {x:4.5,y:9.5,kind:'medkit',alive:true,cool:0},
    {x:14.5,y:2.5,kind:'medkit',alive:true,cool:0}];
  let over='',msg='',msgT=0,gunKick=0;
  function resetG(){
    for(let y=0;y<DH;y++)world[y]=DMAP[y].split('').map(Number);
    pl={x:1.5,y:1.5,ang:0.3,hp:100,ammo:40};
    sprs.forEach(function(s){s.alive=true;if(s.kind==='imp')s.hp=3;});
    sprs[0].x=9.5;sprs[0].y=1.5;sprs[1].x=12.5;sprs[1].y=6.5;
    sprs[2].x=6.5;sprs[2].y=11.5;sprs[3].x=10.5;sprs[3].y=10.5;sprs[4].x=2.5;sprs[4].y=12.2;
    over='';msg='';msgT=0;
  }
  function tryMove(nx,ny){
    const r=0.25;
    if(dCell(world,(nx+(nx>pl.x?r:-r))|0,pl.y|0)===0)pl.x=nx;
    if(dCell(world,pl.x|0,(ny+(ny>pl.y?r:-r))|0)===0)pl.y=ny;
  }
  function fire(){
    if(over)return;
    if(pl.ammo<=0){msg='탄약이 없다!';msgT=1.2;return;}
    pl.ammo--;gunKick=1;
    let best=null,bestD=1e9;
    sprs.forEach(function(s){
      if(!s.alive||s.kind!=='imp')return;
      const d=Math.hypot(s.x-pl.x,s.y-pl.y);
      const a=Math.atan2(s.y-pl.y,s.x-pl.x);
      let rel=((a-pl.ang+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
      if(Math.abs(rel)<0.12&&d<bestD&&dCast(world,pl.x,pl.y,a).dist>d){best=s;bestD=d;}
    });
    if(best){best.hp--;if(best.hp<=0){best.alive=false;msg='악마 처치!';msgT=1.2;}}
  }
  function openDoor(){
    if(over)return;
    const tx=(pl.x+Math.cos(pl.ang)*1.2)|0,ty=(pl.y+Math.sin(pl.ang)*1.2)|0;
    const t=dCell(world,tx,ty);
    if(t===4){world[ty][tx]=0;msg='문이 열렸다';msgT=1.2;}
    else if(t===5)over='탈출 성공! RESET으로 재시작';
  }
  const keys={};
  const unPad=bindPad(w,keys);
  const unKeys=bindKeys(keys,['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE']);
  const bFire=P(w,'fire'),bOpen=P(w,'open'),bReset=P(w,'resetG');
  function fh(e){e.preventDefault();fire();}
  function oh(e){e.preventDefault();openDoor();}
  function rh(){resetG();}
  if(bFire)bFire.addEventListener('pointerdown',fh);
  if(bOpen)bOpen.addEventListener('pointerdown',oh);
  if(bReset)bReset.addEventListener('click',rh);
  function kd(e){
    if(e.code==='Space'){e.preventDefault();fire();}
    if(e.code==='KeyF')openDoor();
    if(e.code==='KeyR'&&over)resetG();
  }
  window.addEventListener('keydown',kd);
  let last=0;
  const stopL=loopDemo(function(t){
    const dt=Math.min(0.05,t-last);last=t;
    if(!over){
      if(keys.KeyA||keys.L)pl.ang-=2.6*dt;
      if(keys.KeyD||keys.R)pl.ang+=2.6*dt;
      const dx=Math.cos(pl.ang)*3.2*dt,dy=Math.sin(pl.ang)*3.2*dt;
      if(keys.KeyW||keys.U)tryMove(pl.x+dx,pl.y+dy);
      if(keys.KeyS||keys.D)tryMove(pl.x-dx,pl.y-dy);
      if(keys.KeyQ)tryMove(pl.x+dy,pl.y-dx);
      if(keys.KeyE)tryMove(pl.x-dy,pl.y+dx);
      /* 적 갱신 */
      sprs.forEach(function(s){
        if(!s.alive)return;
        const d=Math.hypot(s.x-pl.x,s.y-pl.y);
        if(s.kind==='medkit'){
          if(d<0.5&&pl.hp<100){pl.hp=Math.min(100,pl.hp+25);s.alive=false;msg='구급상자 +25';msgT=1.2;}
          return;
        }
        if(d>8||d<0.001)return;
        const ang=Math.atan2(pl.y-s.y,pl.x-s.x);
        if(dCast(world,s.x,s.y,ang).dist<d)return;
        if(d>1.0){
          const spd=1.3*dt;
          const nx=s.x+Math.cos(ang)*spd,ny=s.y+Math.sin(ang)*spd;
          if(dCell(world,nx|0,s.y|0)===0)s.x=nx;
          if(dCell(world,s.x|0,ny|0)===0)s.y=ny;
        }else{
          s.cool-=dt;
          if(s.cool<=0){pl.hp-=8;s.cool=1;msg='피격! -8';msgT=1.2;
            if(pl.hp<=0){pl.hp=0;over='전사... RESET으로 재시작';}}
        }
      });
    }
    gunKick=Math.max(0,gunKick-dt*4);msgT=Math.max(0,msgT-dt);
    renderScene(pix,W,H,world,pl,{},zbuf);
    renderSpr(pix,W,H,pl,sprs,zbuf,true);
    /* 미니맵 */
    const mm=3;
    for(let y=0;y<DH*mm;y++)for(let x=0;x<DW*mm;x++){
      const tt=world[(y/mm)|0][(x/mm)|0];
      pix[y*W+x]=tt===0?rgb(10,10,14):tt===4?rgb(60,160,90):rgb(90,90,110);
    }
    sprs.forEach(function(s){
      if(s.alive&&s.kind==='imp')pix[((s.y*mm)|0)*W+((s.x*mm)|0)]=rgb(255,60,40);
    });
    pix[((pl.y*mm)|0)*W+((pl.x*mm)|0)]=rgb(80,255,120);
    c.putImageData(img,0,0);
    /* 총 + HUD (2D 오버레이) */
    const gx=W/2-14,gy=H-38+gunKick*12;
    c.fillStyle='#373c46';
    c.beginPath();c.moveTo(gx,H);c.lineTo(gx+10,gy);c.lineTo(gx+18,gy);c.lineTo(gx+28,H);c.fill();
    c.fillStyle='#23262e';c.fillRect(gx+10,gy-9,8,13);
    if(gunKick>0.55){
      c.fillStyle='#ffdc5a';c.beginPath();c.arc(gx+14,gy-13,6,0,7);c.fill();
      c.fillStyle='#ff781e';c.beginPath();c.arc(gx+14,gy-13,3,0,7);c.fill();
    }
    c.fillStyle='rgba(16,16,22,.9)';c.fillRect(0,H-14,W,14);
    c.font='bold 9px monospace';
    c.fillStyle=pl.hp>30?'#5adc5a':'#e64632';c.fillText('HP '+pl.hp,5,H-4);
    c.fillStyle='#f0c850';c.fillText('AMMO '+pl.ammo,55,H-4);
    c.fillStyle='#fff';c.textAlign='center';
    if(msgT>0)c.fillText(msg,W/2,24);
    if(over){c.fillStyle='#ff5040';c.font='bold 13px monospace';c.fillText(over,W/2,HALF);}
    c.textAlign='left';
  });
  return function(){stopL();unPad();unKeys();window.removeEventListener('keydown',kd);
    if(bFire)bFire.removeEventListener('pointerdown',fh);
    if(bOpen)bOpen.removeEventListener('pointerdown',oh);
    if(bReset)bReset.removeEventListener('click',rh);};
};

</script>
<!-- ===== deck-input-shim v1 : 방향키(↑↓ 스크롤 / ←→ 페이지) + 게임패드 ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckInputShim) return;
  window.__deckInputShim = true;

  /* ---------- 지금 보이는 슬라이드의 스크롤 컨테이너 찾기 ---------- */
  function scrollableAt(x, y) {
    if (!document.elementFromPoint) return null;
    var n = document.elementFromPoint(x, y);
    while (n && n !== document.documentElement) {
      var oy = getComputedStyle(n).overflowY;
      if ((oy === 'auto' || oy === 'scroll' || oy === 'overlay') &&
          n.scrollHeight - n.clientHeight > 4) return n;
      n = n.parentElement;
    }
    return null;
  }
  function scroller() {
    var el = scrollableAt(innerWidth / 2, innerHeight / 2) ||
             scrollableAt(innerWidth / 2, innerHeight * 0.35);
    if (el) return el;
    var m = document.querySelector('main');
    if (m && m.scrollHeight - m.clientHeight > 4) return m;
    return document.scrollingElement || document.documentElement;
  }
  function viewH(el) {
    return (el === document.scrollingElement || el === document.documentElement)
      ? innerHeight : el.clientHeight;
  }
  function isPageScroller(el) {
    return el === document.scrollingElement || el === document.documentElement || el === document.body;
  }
  function scrollStep(dir, smooth) {
    var el = scroller();
    el.scrollBy({ top: dir * Math.max(80, viewH(el) * 0.25),
                  left: 0, behavior: smooth ? 'smooth' : 'auto' });
  }

  /* ---------- 페이지 이동 (덱마다 다른 엔진에 공통으로 붙는다) ---------- */
  function pick(ids) {
    for (var i = 0; i < ids.length; i++) {
      var e = document.getElementById(ids[i]);
      if (e && (e.tagName === 'BUTTON' || e.tagName === 'A')) return e;
    }
    return null;
  }
  function synth(key) {
    document.dispatchEvent(new KeyboardEvent('keydown',
      { key: key, code: key, bubbles: true, cancelable: true }));
  }
  function page(dir) {
    var b = dir > 0 ? pick(['nextBtn', 'btnNext', 'next'])
                    : pick(['prevBtn', 'btnPrev', 'prev']);
    if (b) { if (!b.disabled) b.click(); }
    else synth(dir > 0 ? 'ArrowRight' : 'ArrowLeft');
  }
  function toggleToc() {
    var b = pick(['tocBtn', 'btnToc', 'toc-btn', 'tocOpen']);
    if (b) b.click(); else synth('t');
  }

  /* ---------- 키보드: ↑↓ = 스크롤 (←→ 페이지는 각 덱 엔진이 처리) ---------- */
  function interactive(el) {
    if (!el) return false;
    var t = (el.tagName || '').toUpperCase();
    return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' ||
           t === 'CANVAS' || el.isContentEditable === true;
  }
  addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    if (e.defaultPrevented || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
    if (interactive(e.target) || interactive(document.activeElement)) return;
    var dir = e.key === 'ArrowDown' ? 1 : -1, repeat = e.repeat;
    // 이벤트 전파가 끝난 뒤에 판단한다 — 슬라이드 안의 데모(테트리스 등)가
    // 이 키를 가져갔으면(preventDefault) 스크롤하지 않는다.
    setTimeout(function () {
      if (e.defaultPrevented) return;
      // 문서 자체가 스크롤되는 덱은 브라우저 기본 동작에 맡긴다(이중 스크롤 방지).
      if (isPageScroller(scroller())) return;
      scrollStep(dir, !repeat);
    }, 0);
  });

  /* ---------- 게임패드 (조이패드) ----------
     좌스틱/D-pad 상하 = 스크롤, 좌우 = 이전/다음 페이지
     A·RB·RT = 다음, B·LB·LT = 이전, X·Start = 목차, Back = 첫 장     */
  var DEAD = 0.4, REPEAT = 320, held = {}, lastTurn = 0, lastDir = 0, raf = 0;

  function pads() {
    if (!navigator.getGamepads) return [];
    var out = [], g = navigator.getGamepads();
    for (var i = 0; i < g.length; i++) if (g[i]) out.push(g[i]);
    return out;
  }
  function down(g, i) { var b = g.buttons[i]; return !!b && (b.pressed || b.value > 0.5); }
  function edge(name, isDown, fn) {
    if (isDown) { if (!held[name]) { held[name] = 1; fn(); } }
    else held[name] = 0;
  }

  function poll(now) {
    var list = pads();
    if (!list.length) { raf = 0; return; }
    raf = requestAnimationFrame(poll);

    var ax = 0, ay = 0, bNext = false, bPrev = false, bToc = false, bHome = false;
    for (var k = 0; k < list.length; k++) {
      var g = list[k];
      ax += g.axes[0] || 0;
      ay += g.axes[1] || 0;
      if (down(g, 15)) ax += 1;
      if (down(g, 14)) ax -= 1;
      if (down(g, 13)) ay += 1;
      if (down(g, 12)) ay -= 1;
      bNext = bNext || down(g, 0) || down(g, 5) || down(g, 7);
      bPrev = bPrev || down(g, 1) || down(g, 4) || down(g, 6);
      bToc  = bToc  || down(g, 2) || down(g, 9);
      bHome = bHome || down(g, 8);
    }

    if (Math.abs(ay) > DEAD) {                       // 세로: 부드러운 연속 스크롤
      var mag = Math.min(1, (Math.abs(ay) - DEAD) / (1 - DEAD));
      scroller().scrollBy(0, (ay > 0 ? 1 : -1) * (6 + mag * 22));
    }
    var dir = Math.abs(ax) > DEAD ? (ax > 0 ? 1 : -1) : 0;
    if (dir) {                                       // 가로: 페이지 넘김(리핏 간격)
      if (dir !== lastDir || now - lastTurn > REPEAT) {
        lastDir = dir; lastTurn = now; page(dir);
      }
    } else { lastDir = 0; lastTurn = 0; }

    edge('next', bNext, function () { page(1); });
    edge('prev', bPrev, function () { page(-1); });
    edge('toc',  bToc,  toggleToc);
    edge('home', bHome, function () { synth('Home'); });
  }

  function start() { if (!raf) raf = requestAnimationFrame(poll); }
  addEventListener('gamepadconnected', start);
  addEventListener('focus', function () { if (pads().length) start(); });
  if (pads().length) start();
})();
</script>
<!-- ===== deck-bookmark-shim v1 : IndexedDB 책갈피(읽던 위치 자동 저장 + 이어보기) ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckBookmarkShim) return;
  window.__deckBookmarkShim = true;
  if (!window.indexedDB) return;

  var DB_NAME = 'treasure-house', DB_VER = 1, STORE = 'bookmarks';

  var FILE = location.pathname.split('/').pop() || '';
  try { FILE = decodeURIComponent(FILE); } catch (e) {}
  if (!FILE || /^index\.html?$/i.test(FILE)) return;   // 포털(index.html)은 저장하지 않는다

  /* ---------- IndexedDB 래퍼 ---------- */
  var dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {
      var req;
      try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { rej(e); return; }
      req.onupgradeneeded = function () {
        var d = req.result;
        if (!d.objectStoreNames.contains(STORE))
          d.createObjectStore(STORE, { keyPath: 'id' }).createIndex('updated', 'updated');
      };
      req.onsuccess = function () { res(req.result); };
      req.onerror   = function () { rej(req.error); };
      req.onblocked = function () { rej(new Error('blocked')); };
    });
    dbp.catch(function () {});                 // 미처리 거부 경고 방지
    return dbp;
  }
  function tx(mode, fn) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction(STORE, mode), r = fn(t.objectStore(STORE));
        t.oncomplete = function () { res(r ? r.result : undefined); };
        t.onerror    = function () { rej(t.error); };
        t.onabort    = function () { rej(t.error); };
      });
    });
  }
  function save(rec) { return tx('readwrite', function (os) { return os.put(rec); }); }
  function load(id)  { return tx('readonly',  function (os) { return os.get(id); }); }

  /* ---------- 지금 읽고 있는 위치 ---------- */
  var ACTIVE = ['on', 'active', 'current', 'shown', 'is-active'];

  function slides() {                          // 슬라이드 덱이면 슬라이드 목록, 아니면 null
    var sel = ['main > article', '.slide'];
    for (var i = 0; i < sel.length; i++) {
      var n = document.querySelectorAll(sel[i]);
      if (n.length > 1) return n;
    }
    return null;
  }
  function activeIndex(list) {                 // 활성 클래스 → URL 해시 순으로 판별
    for (var i = 0; i < list.length; i++) {
      var c = list[i].classList;
      for (var j = 0; j < ACTIVE.length; j++) if (c.contains(ACTIVE[j])) return i;
    }
    var id = location.hash.slice(1);
    try { id = decodeURIComponent(id); } catch (e) {}
    if (id) for (var k = 0; k < list.length; k++) if (list[k].id === id) return k;
    return -1;
  }
  function visibleIndex(list) {                // 전 슬라이드가 이어서 흐르는 덱용 보조 판별
    var best = -1, near = Infinity, h = window.innerHeight || 800;
    for (var i = 0; i < list.length; i++) {
      var r = list[i].getBoundingClientRect();
      if (r.bottom <= 0 || r.top >= h) continue;
      var d = Math.abs(r.top);
      if (d < near) { near = d; best = i; }
    }
    return best;
  }
  function heading() {                         // 긴 문서용 — 화면 상단을 지난 마지막 제목
    var hs = document.querySelectorAll('h1[id],h2[id],h3[id]'), out = '';
    for (var i = 0; i < hs.length; i++) {
      if (hs[i].getBoundingClientRect().top <= 90) out = '#' + hs[i].id; else break;
    }
    return out;
  }
  function snap() {
    var list = slides();
    if (list) {
      var i = activeIndex(list);
      if (i < 0) i = visibleIndex(list);
      if (i < 0) i = 0;
      var el = list[i];
      return { kind: 'slide', page: i + 1, total: list.length, scrollY: 0,
               hash: el.id ? '#' + el.id : '', ratio: (i + 1) / list.length };
    }
    var se = document.scrollingElement || document.documentElement;
    var max = Math.max(0, se.scrollHeight - se.clientHeight);
    var y = Math.round(se.scrollTop || window.pageYOffset || 0);
    return { kind: 'scroll', page: 0, total: 0, scrollY: y,
             hash: heading(), ratio: max ? Math.min(1, y / max) : 0 };
  }

  /* ---------- 자동 저장 ----------
     처음 상태는 기준선으로만 잡고 저장하지 않는다 — 첫 장으로 열자마자
     지난번 책갈피를 1쪽으로 덮어쓰지 않기 위해서다.                        */
  function sig(s) {
    return s.kind + ':' + s.page + ':' + (s.kind === 'scroll' ? Math.round(s.scrollY / 40) : 0);
  }
  var last = sig(snap());
  function tick(force) {
    if (document.hidden && !force) return;
    var s = snap(), cur = sig(s);
    if (cur === last) return;
    last = cur;
    s.id = FILE;
    s.title = (document.title || FILE).trim();
    s.updated = Date.now();
    save(s).catch(function () {});
  }
  setInterval(tick, 1200);
  addEventListener('hashchange', function () { tick(); });
  addEventListener('visibilitychange', function () { if (document.hidden) tick(true); });
  addEventListener('pagehide', function () { tick(true); });

  /* ---------- 이어보기 ---------- */
  function jump(rec) {
    if (rec.kind === 'slide') {
      var el = rec.hash ? document.getElementById(rec.hash.slice(1)) : null;
      var list = slides();
      if (!el && list && list[rec.page - 1]) el = list[rec.page - 1];
      if (!el) return;
      if (el.id && location.hash.slice(1) !== el.id) location.hash = '#' + el.id;
      setTimeout(function () {                 // 해시로 안 움직이는 엔진 대비
        var l2 = slides();
        if (!l2 || activeIndex(l2) !== rec.page - 1) el.scrollIntoView({ block: 'start' });
      }, 80);
    } else {
      var se = document.scrollingElement || document.documentElement;
      var max = Math.max(0, se.scrollHeight - se.clientHeight);
      var y = rec.scrollY <= max ? rec.scrollY : Math.round(rec.ratio * max);
      window.scrollTo({ top: y, behavior: 'smooth' });
    }
  }
  function ago(t) {
    var d = Date.now() - t;
    if (d < 6e4)  return '방금 전';
    if (d < 36e5) return Math.floor(d / 6e4) + '분 전';
    if (d < 864e5) return Math.floor(d / 36e5) + '시간 전';
    if (d < 6048e5) return Math.floor(d / 864e5) + '일 전';
    return new Date(t).toLocaleDateString('ko-KR');
  }
  function bottomInset() {              // 화면 아래 고정 내비(◀ 1/67 ▶) 위로 띄우기
    var h = window.innerHeight || 800, gap = 14;
    if (!document.body) return gap;
    var list = [], c;
    for (c = document.body.firstElementChild; c; c = c.nextElementSibling) list.push(c);
    var extra = document.querySelectorAll('nav, footer');
    for (var i = 0; i < extra.length; i++) list.push(extra[i]);
    for (var j = 0; j < list.length; j++) {
      var n = list[j], t = n.tagName;
      if (t === 'SCRIPT' || t === 'STYLE' || t === 'LINK') continue;
      var cs = getComputedStyle(n);
      if (cs.position !== 'fixed' && cs.position !== 'sticky') continue;
      if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) === 0) continue;
      var r = n.getBoundingClientRect();
      if (!r.height || r.height > h * 0.5 || r.bottom < h - 4 || r.top > h) continue;
      gap = Math.max(gap, Math.round(h - r.top) + 10);
    }
    return gap;
  }
  function toast(rec) {
    var gap = bottomInset();
    var host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483000;pointer-events:none';
    var root = host.attachShadow ? host.attachShadow({ mode: 'open' }) : host;
    var where = rec.kind === 'slide'
      ? rec.page + ' / ' + rec.total + ' 쪽'
      : Math.round(rec.ratio * 100) + '% 지점';
    root.innerHTML =
      '<style>' +
      '.w{pointer-events:auto;display:flex;align-items:center;gap:10px;' +
      'margin:0 auto calc(' + gap + 'px + env(safe-area-inset-bottom,0px));' +
      'padding:10px 12px 10px 14px;max-width:min(94vw,460px);border-radius:14px;' +
      'background:rgba(18,28,40,.94);color:#eaf3fb;font:500 14px/1.4 -apple-system,BlinkMacSystemFont,' +
      '"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35);' +
      'animation:up .22s ease-out}' +
      '@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}' +
      '@media (prefers-reduced-motion:reduce){.w{animation:none}}' +
      '.t{flex:1;min-width:0}.t b{display:block;font-weight:700}' +
      '.t s{display:block;text-decoration:none;opacity:.72;font-size:12px;margin-top:2px}' +
      'button{font:inherit;border:0;border-radius:9px;padding:8px 12px;cursor:pointer}' +
      '.go{background:#4fc3f7;color:#06263a;font-weight:700}' +
      '.no{background:transparent;color:#9fb6c9;padding:8px 6px}' +
      '</style>' +
      '<div class="w"><span aria-hidden="true">🔖</span>' +
      '<div class="t"><b>지난번 ' + where + '까지 읽었어요</b><s>' + ago(rec.updated) + ' 저장됨</s></div>' +
      '<button class="go" type="button">이어보기</button>' +
      '<button class="no" type="button" aria-label="닫기">✕</button></div>';
    function close() { if (host.parentNode) host.parentNode.removeChild(host); }
    root.querySelector('.go').onclick = function () { close(); jump(rec); };
    root.querySelector('.no').onclick = close;
    document.body.appendChild(host);
    setTimeout(close, 15000);
  }

  if (!location.hash) {
    load(FILE).then(function (rec) {
      if (!rec) return;
      var worth = rec.kind === 'slide' ? rec.page > 1 : rec.scrollY > 200;
      if (worth) toast(rec);
    }).catch(function () {});
  }
})();
</script>
