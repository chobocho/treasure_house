<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>레이캐스팅으로 만드는 Doom 클론 — 인터랙티브 슬라이드 306장 (JS + Pygame)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#120c0c; --bg1:#1c1210; --bg2:#241611;
  --red:#ff5a36; --org:#ffb52e; --grn:#3ddc84; --blu:#53a8ff; --vio:#b48cff;
  --ink:#f5eee8; --ink-soft:#d3c4b8; --ink-dim:#94827a;
  --panel:rgba(255,255,255,.055); --panel-bd:rgba(255,90,54,.32);
  --code-bg:#140d0b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Noto Sans KR',sans-serif;color:var(--ink);overflow:hidden;
  background:
    radial-gradient(1100px 560px at 85% -10%, rgba(255,90,54,.12), transparent 60%),
    radial-gradient(900px 520px at 8% 112%, rgba(255,181,46,.08), transparent 60%),
    linear-gradient(160deg,var(--bg0) 0%,var(--bg1) 55%,var(--bg2) 100%);
}
#app{height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#bar{height:5px;background:rgba(255,255,255,.08);flex:0 0 auto;}
#barFill{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--org),var(--grn),var(--blu));transition:width .25s;}
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:9px clamp(12px,2.5vw,28px);border-bottom:1px solid rgba(255,255,255,.07);}
header .logo{font-family:'Black Han Sans',sans-serif;font-size:clamp(14px,1.6vw,19px);color:var(--red);
  white-space:nowrap;letter-spacing:.5px;}
header .logo .sub{color:var(--org);}
header .chap{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink-soft);font-size:clamp(12px,1.3vw,15px);text-align:center;}
header .cnt{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:var(--ink-dim);
  font-size:clamp(12px,1.3vw,15px);white-space:nowrap;}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;justify-content:center;
  padding:clamp(10px,2vh,22px) clamp(10px,3vw,36px);}
.slide{width:min(1180px,100%);display:flex;flex-direction:column;min-height:0;animation:enter .32s ease both;}
.slide.back{animation:enterBack .32s ease both;}
@keyframes enter{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
@keyframes enterBack{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:none;}}
.kick{color:var(--org);font-weight:700;font-size:clamp(11.5px,1.5vw,14.5px);letter-spacing:2.5px;margin-bottom:6px;}
h1.st{font-family:'Black Han Sans',sans-serif;font-weight:400;line-height:1.25;
  font-size:clamp(21px,3.3vw,38px);margin-bottom:clamp(10px,1.8vh,18px);letter-spacing:.3px;}
h1.st .em{color:var(--red);}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding-right:6px;scrollbar-width:thin;scrollbar-color:rgba(255,90,54,.4) transparent;
  font-size:clamp(14.5px,1.7vw,18.5px);line-height:1.75;color:var(--ink-soft);}
.body::-webkit-scrollbar{width:6px;}
.body::-webkit-scrollbar-thumb{background:rgba(255,90,54,.35);border-radius:3px;}
.body b,.body strong{color:var(--ink);}
.body em{color:var(--org);font-style:normal;font-weight:700;}
.body p{margin:0 0 12px;}
.body ul.b{list-style:none;margin:4px 0 14px;}
.body ul.b>li{padding:6px 0 6px 26px;position:relative;}
.body ul.b>li::before{content:'▸';position:absolute;left:4px;color:var(--org);top:6px;}
.body ol{margin:4px 0 14px 24px;}
.body ol>li{padding:4px 0;}
.note{background:var(--panel);border:1px solid var(--panel-bd);border-left:4px solid var(--org);
  border-radius:10px;padding:12px 16px;margin:12px 0;font-size:.94em;}
.note.blue{border-left-color:var(--blu);border-color:rgba(83,168,255,.35);}
.note.red{border-left-color:var(--red);border-color:rgba(255,90,54,.4);}
.note.grn{border-left-color:var(--grn);border-color:rgba(61,220,132,.35);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0;}
@media (max-width:720px){.grid2{grid-template-columns:1fr;}}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 15px;}
.card h3{font-size:1em;color:var(--org);margin-bottom:6px;}
.card p{font-size:.9em;margin-bottom:0;}
table.tbl{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:.88em;}
table.tbl th{background:rgba(255,90,54,.14);color:var(--ink);padding:7px 10px;text-align:left;
  border:1px solid rgba(255,255,255,.12);white-space:nowrap;}
table.tbl td{padding:6px 10px;border:1px solid rgba(255,255,255,.10);}
table.tbl tr:nth-child(even) td{background:rgba(255,255,255,.03);}
.tblWrap{overflow-x:auto;}
pre.code{background:var(--code-bg);border:1px solid rgba(255,255,255,.12);border-radius:10px;
  padding:13px 16px;margin:10px 0 14px;overflow-x:auto;font-family:'JetBrains Mono',monospace;
  font-size:clamp(11.5px,1.35vw,14px);line-height:1.6;color:#ecdfd2;white-space:pre;}
pre.code .c{color:#7d9c6f;} pre.code .k{color:#6fc0f0;} pre.code .n{color:#ffb52e;} pre.code .s{color:#e88a63;}
.codeLabel{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;
  background:rgba(83,168,255,.18);border:1px solid rgba(83,168,255,.4);color:#9cc7f0;
  border-radius:6px 6px 0 0;padding:2px 10px;margin-bottom:-11px;position:relative;z-index:1;margin-left:8px;}
.codeLabel.py{background:rgba(61,220,132,.15);border-color:rgba(61,220,132,.4);color:#8fe8b8;}
.reg{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.85em;background:rgba(180,140,255,.16);
  border:1px solid rgba(180,140,255,.45);color:#d4bfff;border-radius:6px;padding:1px 8px;margin:0 2px;white-space:nowrap;}
kbd{font-family:'JetBrains Mono',monospace;font-size:.82em;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.25);border-bottom-width:2.5px;border-radius:6px;padding:1px 7px;}
.tagrow{margin:8px 0;}
.tag{display:inline-block;background:rgba(255,181,46,.12);border:1px solid rgba(255,181,46,.4);border-radius:999px;
  padding:2px 12px;font-size:12.5px;color:var(--org);margin:2px 4px 2px 0;font-family:'JetBrains Mono',monospace;}
.demoWrap{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);border-radius:14px;
  padding:14px;margin:12px 0;}
.demoWrap .dTitle{font-size:12.5px;letter-spacing:1.5px;color:var(--grn);font-family:'JetBrains Mono',monospace;
  margin-bottom:10px;}
.demoWrap .dTitle::before{content:'▶ LIVE DEMO  ';color:var(--red);}
canvas.demo{width:100%;max-width:680px;display:block;margin:0 auto;image-rendering:pixelated;
  border-radius:8px;background:#000;border:1px solid rgba(255,255,255,.18);touch-action:none;}
canvas.demo.wide{max-width:820px;}
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;margin-top:12px;
  font-size:13.5px;color:var(--ink-soft);}
.ctl label{display:flex;align-items:center;gap:8px;white-space:nowrap;}
.ctl input[type=range]{width:clamp(90px,18vw,170px);accent-color:var(--org);}
.ctl .val{font-family:'JetBrains Mono',monospace;color:var(--org);min-width:52px;display:inline-block;}
.ctl button{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:13px;color:var(--ink);
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.25);border-radius:8px;
  padding:6px 14px;cursor:pointer;}
.ctl button.on{background:rgba(61,220,132,.3);border-color:var(--grn);color:#a9f0cd;}
.padBtns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.padBtns button{font-size:17px;padding:10px 20px;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.3);border-radius:12px;color:var(--ink);cursor:pointer;touch-action:none;user-select:none;
  font-family:'JetBrains Mono',monospace;}
.padBtns button:active{background:rgba(255,90,54,.35);}
.big{text-align:center;font-size:clamp(17px,2.6vw,26px);line-height:1.7;margin:clamp(16px,6vh,60px) auto;max-width:820px;}
.big .hero{font-family:'Black Han Sans',sans-serif;font-size:clamp(26px,4.5vw,52px);display:block;margin:14px 0;color:var(--red);}
.cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;}
.cover .icon{font-size:clamp(44px,9vw,90px);margin-bottom:14px;}
.cover .chNo{font-family:'JetBrains Mono',monospace;color:var(--ink-dim);letter-spacing:4px;font-size:clamp(12px,1.6vw,16px);}
.cover h1{font-family:'Black Han Sans',sans-serif;font-size:clamp(28px,5.4vw,58px);line-height:1.25;margin:10px 0 16px;}
.cover h1 .em{color:var(--red);}
.cover .desc{color:var(--ink-soft);max-width:720px;font-size:clamp(14px,1.9vw,19px);line-height:1.8;}
.cover .mini{margin-top:22px;color:var(--ink-dim);font-size:13px;font-family:'JetBrains Mono',monospace;}
footer{flex:0 0 auto;display:flex;gap:10px;align-items:center;
  padding:10px clamp(12px,2.5vw,28px) calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.07);}
footer button{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:clamp(12.5px,1.4vw,15px);
  color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);
  border-radius:10px;padding:9px 16px;cursor:pointer;white-space:nowrap;}
footer button:hover{background:rgba(255,90,54,.2);}
#dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
#dots .d{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.16);cursor:pointer;border:none;padding:0;}
#dots .d.on{background:var(--red);}
#toc{position:fixed;inset:0;background:rgba(14,8,8,.93);backdrop-filter:blur(8px);z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
#toc[hidden]{display:none;}
#toc h2{font-family:'Black Han Sans',sans-serif;color:var(--red);margin-bottom:18px;font-size:clamp(20px,3vw,30px);}
#toc .list{display:grid;gap:10px;width:min(680px,100%);max-height:70vh;overflow-y:auto;}
#toc .item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid rgba(255,255,255,.14);
  border-radius:12px;padding:12px 18px;color:var(--ink);cursor:pointer;text-align:left;font-size:clamp(13.5px,1.7vw,17px);}
#toc .item:hover{border-color:var(--red);}
#toc .item .no{font-family:'JetBrains Mono',monospace;color:var(--ink-dim);font-size:.85em;white-space:nowrap;}
#toc .close{margin-top:18px;background:none;border:1px solid rgba(255,255,255,.3);color:var(--ink-soft);
  border-radius:999px;padding:8px 22px;cursor:pointer;}
@media (max-width:560px){
  footer button.txt{padding:9px 12px;}
  .body{font-size:14.5px;}
}
</style>
</head>
<body>
<div id="app">
  <div id="bar"><div id="barFill"></div></div>
  <header>
    <div class="logo">RAYCAST<span class="sub">·DOOM</span></div>
    <div class="chap" id="chapLabel"></div>
    <div class="cnt" id="cnt"></div>
  </header>
  <main id="stage"></main>
  <footer>
    <button id="btnPrev" class="txt">◀ 이전</button>
    <button id="btnToc" class="txt">☰ 목차</button>
    <div id="dots"></div>
    <button id="btnNext" class="txt">다음 ▶</button>
  </footer>
</div>
<div id="toc" hidden>
  <h2>목차</h2>
  <div class="list" id="tocList"></div>
  <button class="close" id="tocClose">닫기 ✕</button>
</div>
<script>
'use strict';
const CHAPTERS=[];
function CH(o){CHAPTERS.push(o);}
</script>
<script>
/* ───────────── CH 1. 인트로 — Doom과 레이캐스팅 ───────────── */
CH({
icon:'👹', title:'인트로 — <span class="em">Doom</span>과 레이캐스팅',
desc:'1993년 세상을 뒤흔든 Doom. 그 심장부에 있는 레이캐스팅 기법을 이해하고, 바닐라 JavaScript와 Python/pygame 두 가지 언어로 직접 Doom 클론을 완성하는 여정을 시작합니다.',
slides:[

{t:'이 슬라이드 사용법',k:'HOW TO USE',h:`
<p>본격적으로 시작하기 전에, 이 문서를 <em>조작하는 방법</em>부터 익혀 둡시다.</p>
<ul class="b">
<li><b>다음/이전 슬라이드</b> — <kbd>→</kbd> <kbd>←</kbd> 방향키, <kbd>Space</kbd>,
화면 하단의 버튼, 또는 좌우 <b>스와이프</b>(모바일)로 이동합니다.</li>
<li><b>목차</b> — 하단의 <kbd>☰ 목차</kbd> 버튼을 누르면 16개 챕터로
바로 점프할 수 있습니다. 하단의 점들은 챕터 표식입니다.</li>
<li><b>LIVE DEMO 박스</b> — 빨간 <b>▶ LIVE DEMO</b> 라벨이 붙은 검은 박스는
그림이 아니라 <em>지금 이 순간 실행 중인 진짜 코드</em>입니다.
슬라이더와 버튼을 마음껏 만져 보세요.</li>
</ul>
<p>코드 블록에는 두 가지 라벨이 붙습니다.
<span class="codeLabel">JavaScript</span> 라벨(파란색)은 브라우저용 바닐라 JS 코드,
<span class="codeLabel py">Python</span> 라벨(초록색)은 pygame용 Python 코드입니다.
같은 알고리즘을 두 언어로 나란히 보여 드립니다.</p>
<div class="note">데모가 있는 슬라이드에서는 <kbd>Space</kbd>가 게임 조작(발사)에
쓰일 수 있으니, 페이지 이동은 <kbd>→</kbd> 키를 기본으로 쓰는 것을 권합니다.</div>`},

{t:'1993년 12월 10일 — Doom의 등장',k:'HISTORY',h:`
<p>1993년 12월 10일 자정, 위스콘신 대학교의 FTP 서버에
<b>id Software</b>의 신작 <b>Doom</b>이 업로드됐습니다.
접속이 폭주해 서버가 마비될 정도였고, 이후 몇 년간
<em>Doom은 Windows보다 더 많은 PC에 설치되어 있다</em>는
농담이 진담처럼 돌았습니다.</p>
<ul class="b">
<li><b>셰어웨어 유통</b> — 첫 에피소드를 통째로 무료 배포하고,
나머지를 우편 주문으로 파는 파격적인 모델이었습니다.
플로피 디스크가 손에서 손으로 복사되며 퍼져 나갔습니다.</li>
<li><b>기술적 충격</b> — 386/486 PC에서 부드럽게 돌아가는 실시간 3D 시점,
높낮이가 다른 방, 명암 조명, 네트워크 대전(데스매치라는 말 자체가 여기서 탄생).</li>
<li><b>문화적 충격</b> — FPS(1인칭 슈터)라는 장르가 사실상 이 게임에서
"Doom 클론"이라는 이름으로 시작되었습니다.</li>
</ul>
<div class="note">이 문서의 목표는 바로 그 경험의 핵심 —
<em>격자 맵 위를 걸어 다니며 벽과 악마를 만나는 1인칭 시점</em> —
을 밑바닥부터 직접 만들어 보는 것입니다.</div>`},

{t:'최종 목표 미리보기 — 지금 바로 플레이',k:'FINAL GOAL',h:`
<p>16개 챕터를 마치면 여러분이 완성하게 될 게임입니다.
<em>지금 바로 플레이해 보세요.</em> 이것은 동영상이 아니라
이 페이지 안에서 실행 중인 JavaScript 코드입니다.</p>
<div class="demoWrap"><div class="dTitle">MINI DOOM — PLAYABLE</div>
<canvas class="demo wide" data-demo="game" width="320" height="200"></canvas>
<div class="padBtns"><button data-k="L">⟲</button><button data-k="U">▲</button><button data-k="D">▼</button><button data-k="R">⟳</button>
<button data-p="fire">FIRE</button><button data-p="open">OPEN</button><button data-p="resetG">RESET</button></div>
</div>
<ul class="b">
<li><b>키보드</b> — <kbd>W</kbd>/<kbd>S</kbd> 전진·후진, <kbd>A</kbd>/<kbd>D</kbd> 좌우 회전,
<kbd>Space</kbd> 발사, <kbd>F</kbd> 문 열기 (캔버스를 먼저 클릭하세요).</li>
<li><b>터치</b> — 캔버스 아래의 <b>⟲ ▲ ▼ ⟳</b> 버튼으로 이동,
<b>FIRE</b>로 발사, <b>OPEN</b>으로 초록 문을 열 수 있습니다.</li>
<li>악마에게 너무 다가가면 물립니다. 빨간 <b>EXIT</b> 타일을 찾아 탈출하세요.</li>
</ul>`},

{t:'이 문서에서 만드는 것',k:'FEATURES',h:`
<p>방금 플레이한 게임에 들어 있는 기능 전부를, 외부 라이브러리나
이미지 파일 <em>하나 없이</em> 순수 코드로 만들어 갑니다.</p>
<div class="tagrow">
<span class="tag">텍스처 입힌 벽 5종</span>
<span class="tag">거리 안개(fog)</span>
<span class="tag">스프라이트 적 (악마)</span>
<span class="tag">추적 AI + 시야 판정</span>
<span class="tag">히트스캔 전투</span>
<span class="tag">열리는 문</span>
<span class="tag">구급상자 아이템</span>
<span class="tag">HP / AMMO HUD</span>
<span class="tag">미니맵</span>
<span class="tag">출구 탈출 목표</span>
</div>
<ul class="b">
<li>맵은 <b>16×14 격자</b> 하나 — 숫자 0은 빈칸, 1 벽돌, 2 돌, 3 금속,
4 문, 5 출구입니다. 이 맵 데이터는 마지막 장까지 쭉 함께 갑니다.</li>
<li>화면은 <b>640×400</b> 내부 해상도로 렌더링합니다.
90년대 게임의 도트 느낌이 그대로 살아납니다.</li>
<li>텍스처와 악마 그림까지 <em>코드로 절차 생성</em>하므로,
완성본은 파일 단 하나입니다.</li>
</ul>`},

{t:'두 가지 언어, 하나의 알고리즘',k:'JS + PYTHON',h:`
<p>이 문서의 특징은 <em>완전히 동작하는 구현을 두 벌</em> 제공한다는 점입니다.
알고리즘·변수 이름·맵·상수가 전부 같아서, 한쪽을 이해하면
다른 쪽은 저절로 읽힙니다.</p>
<div class="grid2">
<div class="card"><h3>JSDoom — 바닐라 JS + Canvas</h3>
<p>브라우저만 있으면 실행되는 <b>단일 .html 파일</b>.
픽셀 버퍼(Uint32Array)에 직접 색을 찍는 로우레벨 방식이라
"화면에 픽셀을 그린다"는 감각을 가장 생생하게 배울 수 있습니다.
13장에서 전체 코드를 완성합니다.</p></div>
<div class="card"><h3>PyDoom — Python + pygame</h3>
<p><b>pip install pygame</b> 한 줄이면 준비 끝인 <b>단일 .py 파일</b>.
Surface 블리팅으로 세로줄을 그리는 방식이라 코드가 더 짧고 읽기 쉽습니다.
14장에서 전체 코드를 완성합니다.</p></div>
</div>
<div class="note">두 구현 모두 같은 이름을 씁니다 —
<b>castRay / cast_ray</b>, <b>tryMove / try_move</b>,
<b>FOV = π/3</b>, <b>MOVE_SPD = 3.2</b>, <b>TEX = 64</b>.
언어만 다를 뿐 <em>한 프로그램의 두 표기</em>라고 생각하세요.</div>`},

{t:'3D 그래픽의 두 갈래 — 폴리곤 vs 레이캐스팅',k:'TWO ROADS TO 3D',h:`
<p>화면에 3D 공간을 그리는 접근은 크게 두 갈래입니다.</p>
<div class="grid2">
<div class="card"><h3>폴리곤 렌더링 (요즘 방식)</h3>
<p>세상을 수많은 <b>삼각형</b>으로 조각내고, 각 꼭짓점을
행렬 곱으로 화면에 투영한 뒤 삼각형을 채웁니다.
자유로운 형태를 그릴 수 있지만 연산량이 많아
GPU라는 전용 하드웨어가 필요합니다.</p></div>
<div class="card"><h3>레이캐스팅 (우리의 방식)</h3>
<p>물체가 아니라 <b>시선</b>에서 출발합니다.
화면의 세로줄 하나마다 광선을 한 발 쏘아
<em>벽에 닿을 때까지의 거리</em>를 재고,
가까우면 길게, 멀면 짧게 세로줄을 긋습니다.</p></div>
</div>
<p>레이캐스팅은 폴리곤 방식이 감당 못 하던 90년대 초 CPU에서
<em>실시간 1인칭 시점</em>을 가능하게 만든 우회로였습니다.
제약은 많지만, 그 대가로 얻은 속도가 한 시대를 열었습니다.</p>
<div class="note blue">이름이 비슷한 <b>레이트레이싱</b>은 픽셀마다
광선을 쏘고 반사·굴절까지 추적하는 훨씬 무거운 기법입니다.
레이캐스팅은 세로줄마다 한 발, 벽에 닿으면 끝 — 완전히 다른 체급입니다.</div>`},

{t:'1992년 울펜슈타인 3D — 레이캐스팅의 원조',k:'WOLFENSTEIN 3D',h:`
<p>Doom보다 1년 반 앞선 1992년 5월(개발은 1991년부터),
id Software는 <b>울펜슈타인 3D</b>를 내놓았습니다.
프로그래머 <b>존 카맥(John Carmack)</b>이 구현한 엔진이
바로 우리가 이 문서에서 배울 <em>격자 기반 레이캐스팅</em>입니다.</p>
<ul class="b">
<li>맵은 균일한 정사각 격자, 벽은 모두 같은 높이 —
연산을 극단적으로 단순화한 설계였습니다.</li>
<li>286/386 PC에서 초당 수십 프레임의 1인칭 시점을 뽑아내
당시 개발자들에게 "이게 PC에서 된다고?"라는 충격을 줬습니다.</li>
<li>상업적 대성공으로 id Software는 다음 프로젝트,
즉 Doom을 만들 자금과 명성을 얻었습니다.</li>
</ul>
<div class="note">울펜슈타인의 격자 레이캐스팅은 지금도
<em>3D 렌더링 입문의 최고 교재</em>로 꼽힙니다.
중학교 수준의 삼각법만으로 완전한 1인칭 엔진이 만들어지기 때문입니다.
우리가 만들 클론도 정확히 이 계보 위에 있습니다.</div>`},

{t:'진짜 Doom은 레이캐스팅이 아니다?',k:'BSP SPOILER',h:`
<p>고백할 것이 하나 있습니다. 1993년의 진짜 Doom 엔진은
격자 레이캐스팅이 <em>아닙니다</em>. 카맥은 Doom에서
<b>BSP(Binary Space Partitioning) 트리</b>라는 한층 정교한 구조로 갈아탔습니다.</p>
<ul class="b">
<li>덕분에 진짜 Doom은 <b>비스듬한 벽</b>, <b>높이가 다른 바닥과 천장</b>,
<b>어두운 방과 밝은 방</b>을 그릴 수 있었습니다.</li>
<li>반면 울펜슈타인식 레이캐스팅은 직각 격자 세계에 갇힙니다.</li>
</ul>
<p>그런데도 레이캐스팅부터 배우는 이유는 분명합니다.</p>
<ol>
<li>두 기법의 <em>핵심 발상은 같습니다</em> — 화면 세로줄 단위로 벽을 긋고,
거리로 높이를 정한다는 것.</li>
<li>레이캐스팅은 코드 수백 줄로 완성되어, 전 과정을 손으로 따라갈 수 있습니다.</li>
<li>레이캐스팅을 이해한 눈으로 보면 BSP가 "무엇을 개선한 것인지"가 보입니다.</li>
</ol>
<div class="note blue">진짜 Doom의 BSP 렌더러가 어떻게 다른지는
마지막 <b>16장</b>에서 제대로 다룹니다. 지금은 레이캐스팅에 집중합시다.</div>`},

{t:'레이캐스팅 핵심 아이디어 — 한 장 요약',k:'CORE IDEA',h:`
<div class="big">앞으로 15개 챕터 동안 할 일의 전부입니다.
<span class="hero">세로줄마다 광선 하나,<br>거리가 벽의 높이를 정한다</span>
화면 폭이 640픽셀이면 광선도 640발.
광선이 벽에 닿은 <em>거리가 가까울수록 그 세로줄을 길게</em>,
멀수록 짧게 그으면 — 그게 3D처럼 보입니다.</div>
<ul class="b">
<li>① 플레이어 위치에서, 시야각(FOV 60°) 안의 방향으로 광선을 쏩니다.</li>
<li>② 광선이 격자 맵의 벽 칸에 닿을 때까지 전진시켜 <b>거리</b>를 잽니다.</li>
<li>③ 세로줄 높이 = <b>화면 높이 ÷ 거리</b>. 그 줄을 벽 색으로 칠합니다.</li>
<li>④ 640개 열에 대해 반복하면 한 프레임 완성. 초당 60번 반복하면 게임이 됩니다.</li>
</ul>`},

{t:'왜 레이캐스팅은 빠른가',k:'WHY SO FAST',h:`
<p>레이캐스팅의 속도 비결은 <em>3D 문제를 2D 문제 640개로 쪼갠 것</em>입니다.</p>
<ul class="b">
<li>화면에는 640×400 = <b>256,000개</b>의 픽셀이 있지만,
비싼 기하 연산(광선 추적)은 <b>열 수만큼 = 640번</b>만 합니다.</li>
<li>각 열의 나머지 픽셀은 "위에서 아래로 색 채우기"라는
아주 값싼 반복문으로 끝납니다.</li>
<li>광선 추적 자체도 격자 맵 덕분에 한 발에 수십 번의
덧셈·비교만으로 끝납니다(5장의 DDA 알고리즘).</li>
</ul>
<p>90년대 초의 CPU는 부동소수점 연산 하나도 아까운 물건이었습니다.
"픽셀 25만 개를 3D로 계산"은 불가능했지만
"광선 640발 + 색 채우기"는 <em>충분히 가능</em>했습니다.
바로 그 차이가 울펜슈타인과 Doom을 낳았습니다.</p>
<div class="note grn">현대 컴퓨터에선 이 부담이 워낙 가벼워서,
우리는 자바스크립트로도 60fps를 여유 있게 달성합니다.
그래도 15장에서 90년대식 최적화 기법을 함께 살펴봅니다.</div>`},

{t:'광선 수를 직접 줄여 보기',k:'LIVE: COLUMNS',h:`
<p>"세로줄마다 광선 하나"라는 말을 몸으로 느껴 봅시다.
아래 데모의 슬라이더는 <em>광선(=세로 열)의 개수</em>를 바꿉니다.</p>
<div class="demoWrap"><div class="dTitle">RESOLUTION = RAY COUNT</div>
<canvas class="demo" data-demo="columns" width="512" height="240"></canvas>
<div class="ctl"><label>열 <input type="range" data-p="cols" min="8" max="320" value="40"><span class="val" data-v="cols"></span></label></div>
</div>
<ul class="b">
<li>슬라이더를 왼쪽 끝 <b>8</b>까지 내려 보세요. 광선이 8발뿐이라
세상이 거대한 색 막대 8개로 보입니다. 그래도 <em>가까운 벽은 크고
먼 벽은 작다</em>는 3D의 본질은 살아 있습니다.</li>
<li>오른쪽 끝 <b>320</b>으로 올리면 막대가 촘촘해져 매끈한 벽이 됩니다.</li>
<li>즉 <b>해상도 = 광선 수</b>입니다. 광선을 늘리면 화질이 좋아지고,
줄이면 빨라집니다. 90년대 게임의 "화면 크기 줄이기" 옵션이
정확히 이 슬라이더였습니다.</li>
</ul>`},

{t:'레이캐스팅의 제약 — 그래서 2.5D',k:'LIMITATIONS',h:`
<p>속도를 얻는 대신 격자 레이캐스팅은 다음 규칙에 묶입니다.</p>
<ul class="b">
<li><b>모든 벽은 같은 높이</b> — 세로줄 높이가 거리만으로 결정되기 때문입니다.
2층 구조나 계단은 표현할 수 없습니다.</li>
<li><b>벽은 격자에 붙은 수직 벽뿐</b> — 비스듬한 벽, 곡면 벽은 없습니다.</li>
<li><b>위아래를 볼 수 없음</b> — 시선이 언제나 수평이라는 가정 위에
투영 공식이 세워져 있습니다. 고개를 들면 공식이 무너집니다.</li>
<li><b>점프도 앉기도 없음</b> — 눈높이는 항상 벽의 정중앙입니다.</li>
</ul>
<p>사실상 <em>2D 격자 맵을 걸어 다니며 3D처럼 보여 주는 것</em>이라서
이런 엔진을 <b>2.5D</b>라고 부릅니다. 플레이어의 상태는
x, y 좌표와 시선 각도 ang — 딱 <b>숫자 3개</b>뿐입니다.</p>
<div class="note">제약은 학습자에게 축복입니다. 상태가 (x, y, ang) 셋뿐이라
버그를 추적하기 쉽고, 모든 수식을 종이 위에 그려 검증할 수 있습니다.</div>`},

{t:'제약이 만든 스타일',k:'AESTHETICS',h:`
<p>기술적 한계는 종종 미학이 됩니다. 레이캐스팅과 그 형제 엔진들의 제약은
<em>90년대 슈터 특유의 문법</em>을 만들었습니다.</p>
<ul class="b">
<li><b>미로 같은 평면 맵</b> — 높이 표현이 안 되니 설계의 재미를
열쇠 찾기, 비밀 문, 미로 구조에서 찾았습니다.</li>
<li><b>스프라이트 적</b> — 적과 아이템은 3D 모델이 아니라
항상 나를 바라보는 <b>납작한 그림(빌보드)</b>입니다.
멀면 작게, 가까우면 크게 그릴 뿐입니다(9장).</li>
<li><b>거대한 도트 픽셀</b> — 낮은 해상도가 만드는 거친 질감이
오히려 공포감과 속도감을 살렸습니다.</li>
</ul>
<p>이 스타일은 죽지 않았습니다. 2010년대 후반부터
<b>부머 슈터(boomer shooter)</b>라는 이름으로 부활해,
일부러 레이캐스팅풍 렌더링을 쓰는 신작이 꾸준히 나오고 있습니다.
여러분이 이 문서에서 만드는 것은 골동품이 아니라
<em>지금도 살아 있는 장르의 원형</em>입니다.</p>`},

{t:'필요한 사전 지식 점검',k:'PREREQUISITES',h:`
<p>겁먹을 필요 없습니다. 필요한 것은 놀랄 만큼 적습니다.</p>
<div class="grid2">
<div class="card"><h3>수학 — 중학교 수준이면 충분</h3>
<p>피타고라스 정리, sin·cos·tan의 뜻, 비례식.
이게 전부입니다. 그마저도 바로 다음 <b>2장</b>에서
게임에 쓰이는 형태로 처음부터 다시 정리합니다.
행렬도, 미적분도 등장하지 않습니다.</p></div>
<div class="card"><h3>프로그래밍 — 기초 문법이면 충분</h3>
<p>변수, if, for 반복문, 함수를 읽고 쓸 수 있으면 됩니다.
JavaScript 또는 Python <em>한쪽만</em> 알아도 충분합니다 —
모든 핵심 코드를 두 언어로 나란히 보여 드리기 때문입니다.</p></div>
</div>
<ul class="b">
<li>그래픽 프로그래밍 경험 — <b>불필요</b>. "픽셀에 색 찍기"부터 시작합니다.</li>
<li>게임 엔진 경험 — <b>불필요</b>. 엔진 없이 만드는 것이 이 문서의 목적입니다.</li>
<li>수학 공식 암기 — <b>불필요</b>. 매 공식마다 그림과 라이브 데모가 붙습니다.</li>
</ul>
<div class="note">단 하나 필요한 것: <em>슬라이더를 움직이며 스스로 확인하려는
호기심</em>입니다. 데모를 그냥 지나치지 마세요.</div>`},

{t:'개발 환경 준비 — JavaScript',k:'SETUP: JS',h:`
<p>JS 버전의 준비물은 딱 두 가지, <b>브라우저</b>와 <b>텍스트 에디터</b>입니다.
메모장이어도 됩니다. 설치할 것이 하나도 없습니다.</p>
<ol>
<li>빈 파일을 만들고 아래 뼈대를 입력한 뒤 <b>doom.html</b>로 저장합니다.</li>
<li>파일을 더블클릭해 브라우저로 엽니다. 끝입니다.</li>
</ol>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">&lt;!DOCTYPE html&gt;
&lt;canvas id="screen" width="640" height="400"&gt;&lt;/canvas&gt;
&lt;script&gt;
var canvas = document.getElementById('screen');
var ctx = canvas.getContext('2d');       // 2D 그리기 도구
ctx.fillStyle = '#f00';
ctx.fillRect(300, 180, 40, 40);          // 빨간 사각형 = 동작 확인!
// 이 자리에 앞으로 레이캐스터가 자라납니다
&lt;/script&gt;</pre>
<p>브라우저에 검은 캔버스와 빨간 사각형이 보이면 성공입니다.
완성본 JSDoom도 이 뼈대 그대로, script 안만 자라난 것입니다.</p>
<div class="note grn">서버도 빌드 도구도 필요 없습니다. 파일 저장 →
브라우저 새로고침 <kbd>F5</kbd>, 이 두 동작이 개발 사이클의 전부입니다.</div>`},

{t:'개발 환경 준비 — Python',k:'SETUP: PYTHON',h:`
<p>Python 버전은 <b>pygame</b> 라이브러리 하나만 설치하면 됩니다.
터미널(명령 프롬프트)에서 한 줄이면 끝납니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py"># 1) 설치 (한 번만)
#    pip install pygame
# 2) 실행
#    python doom.py

import pygame                      # 동작 확인용 최소 코드
pygame.init()
screen = pygame.display.set_mode((1280, 800))

<p>행렬도, 벡터 내적도, 미적분도 쓰지 않습니다.

{t:'각도의 두 단위 — 도와 라디안',k:'DEG VS RAD',h:`
<p>일상에서는 <b>도(degree)</b>를 쓰지만, 프로그래밍 언어의 수학 함수는
<b>라디안(radian)</b>을 씁니다. 한 바퀴가 360°이자 2π 라디안입니다.</p>
<pre class="code" data-lang="js">// 변환 공식
rad = deg * Math.PI / 180;      // 도 → 라디안
deg = rad * 180 / Math.PI;      // 라디안 → 도</pre>
<div class="tblWrap"><table class="tbl">
<tr><th>도</th><th>라디안</th><th>기억법</th></tr>
<tr><td>360°</td><td>2π ≈ 6.283</td><td>한 바퀴 = 원둘레/반지름</td></tr>
<tr><td>180°</td><td>π ≈ 3.142</td><td>반 바퀴</td></tr>
<tr><td>90°</td><td>π/2 ≈ 1.571</td><td>직각</td></tr>
<tr><td><b>60°</b></td><td><b>π/3 ≈ 1.047</b></td><td><em>우리 게임의 시야각!</em></td></tr>
<tr><td>1°</td><td>≈ 0.01745</td><td>π/180</td></tr>
</table></div>
<p>완성본 코드의 첫머리에 이미 라디안이 등장합니다.
시야각(FOV) 60°를 π/3으로 적어 둔 것입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var FOV = Math.PI / 3;            // 시야각 60도</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">FOV = math.pi / 3       # 시야각 60도</pre>`},

{t:'라디안이 기본인 이유',k:'WHY RADIANS',h:`
<p>왜 컴퓨터는 굳이 낯선 라디안을 고집할까요?
<em>라디안은 각도의 "자연 단위"</em>이기 때문입니다.</p>
<ul class="b">
<li><b>정의가 기하 그 자체</b> — 반지름 1인 원에서 각도가 θ 라디안이면
<em>호의 길이도 정확히 θ</em>입니다. 360이라는 임의의 숫자가 필요 없습니다.</li>
<li><b>수학 공식이 깨끗해짐</b> — 미분, 급수 전개, 작은 각 근사
(sin θ ≈ θ) 같은 성질이 라디안에서만 성립합니다.
언어의 수학 라이브러리는 이 성질 위에 구현되어 있습니다.</li>
<li><b>그래서 모든 언어가 라디안</b> — <b>Math.sin</b>(JS), <b>math.sin</b>(Python),
C의 sinf까지 전부 라디안을 받습니다.</li>
</ul>
<div class="note red">가장 흔한 초보 버그:
<b>Math.sin(60)</b>은 "60도의 sin"이 아니라 <em>60라디안(약 9.5바퀴!)</em>의
sin입니다. 각도를 도 단위로 다루고 싶다면 반드시
<b>deg * Math.PI / 180</b>으로 변환한 뒤 넘겨야 합니다.</div>
<p>우리 코드는 처음부터 끝까지 <em>모든 각도를 라디안으로 저장</em>합니다.
플레이어의 시선 <b>player.ang</b>도, 회전 속도 <b>ROT_SPD = 2.6</b>
(초당 2.6라디안 ≈ 149°)도 모두 라디안입니다.</p>`},

{t:'단위원 — 각도를 좌표로',k:'LIVE: UNIT CIRCLE',h:`
<p>삼각함수의 심장은 <b>단위원</b>(반지름 1인 원)입니다.
각도 a만큼 돈 지점의 <em>x좌표가 cos a, y좌표가 sin a</em> — 이게 정의의 전부입니다.</p>
<div class="demoWrap"><div class="dTitle">UNIT CIRCLE — cos &amp; sin</div>
<canvas class="demo" data-demo="unitcircle" width="480" height="300"></canvas>
<div class="ctl"><label>각도 <input type="range" data-p="ang" min="0" max="360" value="40"><span class="val" data-v="ang"></span></label></div>
</div>
<ul class="b">
<li>슬라이더를 천천히 돌리며 <b>cos(가로 성분)</b>과 <b>sin(세로 성분)</b>이
어떻게 변하는지 보세요.</li>
<li><b>0°</b>에서 cos=1, sin=0. <b>90°</b>에서 cos=0, sin=1.
<b>180°</b>에서 cos=-1, sin=0 — 부호가 뒤집힙니다.</li>
<li>어떤 각도에서도 두 값은 <em>-1과 +1 사이</em>를 벗어나지 않습니다.
반지름 1인 원 위의 좌표이기 때문입니다.</li>
</ul>
<div class="note">이 데모 하나가 앞으로 나올 모든 수식의 뿌리입니다.
"각도 하나를 넣으면 방향을 나타내는 좌표 한 쌍이 나온다" —
이 감각을 손에 익혀 두세요.</div>`},

{t:'cos = x, sin = y — 방향 벡터',k:'DIRECTION VECTOR',h:`
<p>단위원의 정의를 게임 언어로 번역하면 이렇게 됩니다.</p>
<pre class="code" data-lang="js">// 각도 a를 바라보는 "방향 벡터" (길이 1)
dir = ( Math.cos(a), Math.sin(a) )   // 개념 표기</pre>
<ul class="b">
<li>플레이어의 시선 각도가 <b>a</b>라면, 시선 방향으로 <em>1만큼</em> 갔을 때
x가 cos(a), y가 sin(a)만큼 변합니다.</li>
<li>거리 d만큼 가고 싶으면 각 성분에 d를 곱하면 됩니다:
<b>(cos(a)·d, sin(a)·d)</b>. 길이 1짜리 방향에 스칼라를 곱하는 것입니다.</li>
</ul>
<p>완성본 코드에서 이 조합은 수없이 반복됩니다.
미니맵의 시선 표시선도, 문을 열 때 "내 앞 1.2칸"을 찾는 코드도 똑같습니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">// openDoor(): 시선 방향으로 1.2칸 앞의 타일 좌표
var tx = (player.x + Math.cos(player.ang) * 1.2) | 0;
var ty = (player.y + Math.sin(player.ang) * 1.2) | 0;</pre>
<div class="note">앞으로 <b>cos이 보이면 "가로 성분", sin이 보이면 "세로 성분"</b>
이라고 자동으로 읽으세요. 레이캐스팅 코드의 절반이 이 패턴입니다.</div>`},

{t:'화면 좌표계는 y가 아래로',k:'SCREEN COORDS',h:`
<p>수학 시간의 좌표평면은 y가 <em>위로</em> 증가하지만,
컴퓨터 화면과 우리의 맵 배열은 <b>y가 아래로</b> 증가합니다.
원점 (0,0)은 왼쪽 <em>위</em> 구석입니다.</p>
<div class="grid2">
<div class="card"><h3>수학 좌표계</h3>
<p>y ↑ 위로. 각도는 반시계방향으로 증가.
sin(30°) &gt; 0 은 "위쪽" 성분.</p></div>
<div class="card"><h3>화면/맵 좌표계 (우리 코드)</h3>
<p>y ↓ 아래로. 배열 인덱스 world[y][x]와 순서가 같아 편리.
각도를 키우면 <em>시계방향</em>으로 회전.</p></div>
</div>
<p>공식은 하나도 바꿀 필요가 없습니다. x = cos, y = sin 그대로 쓰면
단지 <em>회전 방향의 해석만 뒤집힐 뿐</em>입니다.
각도가 커지면 시선이 시계방향(오른쪽)으로 돕니다.
그래서 완성본에서 <kbd>D</kbd>(우회전)가 <b>ang을 증가</b>시킵니다.</p>
<pre class="code" data-lang="js">if (keys.KeyA) player.ang -= ROT_SPD * dt;   // 좌회전 = 감소
if (keys.KeyD) player.ang += ROT_SPD * dt;   // 우회전 = 증가</pre>
<div class="note red">다른 자료의 그림과 회전 방향이 반대라고 당황하지 마세요.
y축이 뒤집힌 좌표계에서는 <em>"각도 증가 = 시계방향"</em>이 정상입니다.
이걸 잊고 부호를 "고치면" 좌우가 반대로 도는 버그가 태어납니다.</div>`},

{t:'각도로 전진하기',k:'MOVE BY ANGLE',h:`
<p>방향 벡터에 <b>속도 × 시간</b>을 곱하면 이동이 됩니다.
완성본의 이동 코드를 그대로 발췌했습니다 — 이 장의 수학이
실전에서 정확히 이 모습으로 쓰입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var dx = Math.cos(player.ang) * MOVE_SPD * dt;
var dy = Math.sin(player.ang) * MOVE_SPD * dt;
if (keys.KeyW) tryMove(player.x + dx, player.y + dy);  // 전진
if (keys.KeyS) tryMove(player.x - dx, player.y - dy);  // 후진</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">dx = math.cos(pl.ang) * MOVE_SPD * dt
dy = math.sin(pl.ang) * MOVE_SPD * dt
if keys[pygame.K_w]: try_move(pl, pl.x + dx, pl.y + dy)
if keys[pygame.K_s]: try_move(pl, pl.x - dx, pl.y - dy)</pre>
<ul class="b">
<li><b>MOVE_SPD = 3.2</b>는 "초당 3.2칸". <b>dt</b>는 지난 프레임 이후 흐른
시간(초)입니다. 곱하면 <em>이번 프레임에 갈 거리</em>가 됩니다.</li>
<li>후진은 그저 부호만 뒤집습니다. 옆걸음(Q/E)은 (dy, -dx) —
방향 벡터를 90° 돌린 것인데, 10장에서 자세히 봅니다.</li>
<li>tryMove/try_move는 벽 충돌 검사입니다(역시 10장).
지금은 "좌표를 갱신한다" 정도로 읽으면 충분합니다.</li>
</ul>`},

{t:'삼각형으로 보는 sin/cos',k:'TRIANGLE VIEW',h:`
<p>단위원 그림을 삼각형으로 다시 보면 교과서의 정의와 연결됩니다.
원 위의 점에서 x축으로 수선을 내리면 <b>직각삼각형</b>이 생깁니다.</p>
<pre class="code" data-lang="js">//            /|
//   빗변 1  / |  높이 = sin(a)
//          /  |
//         /a__|
//       밑변 = cos(a)</pre>
<ul class="b">
<li><b>빗변(반지름) = 1</b>, <b>밑변 = cos(a)</b>, <b>높이 = sin(a)</b>.</li>
<li>교과서 정의 "sin = 대변/빗변"에서 빗변이 1이니
<em>sin이 곧 대변의 길이</em>가 된 것뿐입니다.</li>
<li>빗변이 1이 아니라 d라면? 전부 d배 —
밑변 <b>d·cos(a)</b>, 높이 <b>d·sin(a)</b>. 이게 바로 앞 슬라이드의 이동 공식입니다.</li>
</ul>
<p>피타고라스 정리를 이 삼각형에 적용하면 유명한 항등식이 나옵니다:
<b>cos²a + sin²a = 1</b>. 방향 벡터 (cos a, sin a)의 길이가
언제나 정확히 1인 이유이기도 합니다.</p>
<div class="note">원으로 보든(각도→좌표) 삼각형으로 보든(변의 비율)
같은 함수입니다. 레이캐스팅에서는 두 관점을 수시로 오가며 씁니다.</div>`},

{t:'tan — 기울기이자 비율',k:'TANGENT',h:`
<p>세 번째 도구 <b>tan(탄젠트)</b>는 독립된 새 함수가 아니라
<em>sin과 cos의 비율</em>입니다.</p>
<pre class="code" data-lang="js">tan(a) = sin(a) / cos(a)   // = 높이/밑변 = 직선의 기울기</pre>
<ul class="b">
<li>기하학적 의미: 각도 a로 뻗은 직선이 <b>가로 1칸당 세로로 몇 칸</b>
올라가는가 — 즉 <em>기울기</em>입니다.</li>
<li>tan(0°) = 0 (수평), tan(45°) = 1, tan(60°) ≈ 1.73,
그리고 90°에 가까워지면 무한대로 치솟습니다(cos이 0에 가까워지므로).</li>
</ul>
<p>레이캐스팅에서 tan이 맡는 일은 <b>투영(projection)</b>입니다.
"시야각의 절반 30°만큼 벌어진 광선은, 눈앞 1만큼 떨어진 화면 위에서
<em>tan(30°) ≈ 0.577만큼 옆</em>에 찍힌다" — 이런 계산에 쓰입니다.</p>
<pre class="code" data-lang="js">// 6장에서 만날 핵심 수량: 화면(투영면)의 절반 폭
Math.tan(FOV / 2)     // = tan(30°) ≈ 0.577</pre>
<div class="note blue">"거리가 1일 때 옆으로 벌어진 정도"라는 tan의 감각은
6장(벽 투영)과 9장(스프라이트 화면 위치)에서 계속 재등장합니다.
tan = 비율, 이 한마디만 기억해 두세요.</div>`},

{t:'역함수 atan — 비율에서 각도로',k:'ARCTANGENT',h:`
<p>tan이 "각도 → 비율"이라면, <b>atan(아크탄젠트)</b>은 그 반대인
"비율 → 각도"입니다. tan(30°) ≈ 0.577이므로 atan(0.577) ≈ 30°입니다.</p>
<p>이 함수가 완성본의 <em>가장 중요한 한 줄</em>에 들어 있습니다.
화면의 각 세로줄(col)마다 광선 각도를 정하는 코드입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">cam = 2 * col / W - 1;    // 화면 위치를 -1..+1로 정규화
rayAng = player.ang + Math.atan(cam * Math.tan(FOV / 2));</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">cam = 2 * col / NUM_RAYS - 1            # -1 .. +1
ray_ang = pl.ang + math.atan(cam * math.tan(FOV / 2))</pre>
<ul class="b">
<li><b>cam · tan(FOV/2)</b> — 화면 위 그 지점의 "옆으로 벌어진 비율".
가운데 열이면 0, 오른쪽 끝이면 tan(30°)입니다.</li>
<li><b>atan(...)</b> — 그 비율을 다시 <em>각도</em>로 되돌립니다.
결과는 -30° ~ +30° 사이의 시선 대비 편차각입니다.</li>
<li>여기에 player.ang을 더하면 그 열이 쏠 광선의 절대 각도 완성.</li>
</ul>
<div class="note">왜 각도를 640등분하지 않고 이렇게 돌아가는지는
6장에서 어안(fisheye) 왜곡과 함께 밝혀집니다. 지금은
<em>tan으로 갔다가 atan으로 돌아온다</em>는 왕복 관계만 챙기세요.</div>`},

{t:'atan2 — 사분면을 아는 atan',k:'ATAN2',h:`
<p>"적이 나에게서 <b>어느 방향</b>에 있나?"를 알려면 dx, dy에서 각도를
구해야 합니다. atan(dy/dx)는 함정이 있습니다 —
dx=-1, dy=-1(뒤쪽)과 dx=1, dy=1(앞쪽)이 <em>같은 비율 1</em>이 되어
방향을 구분하지 못합니다.</p>
<p>그래서 모든 언어에 <b>atan2(dy, dx)</b>가 있습니다.
두 부호를 각각 보고 <em>사분면까지 정확한 각도(-π~π)</em>를 돌려줍니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">// fire(): 발사가 적에게 명중했는지 판정하는 코드에서
var d = Math.hypot(s.x - player.x, s.y - player.y);
var a = Math.atan2(s.y - player.y, s.x - player.x);
// a = 나→적 방향의 절대 각도. player.ang과 비교해
// 각도차가 0.12rad 미만이면 조준선 안에 있는 것</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">rel = math.atan2(s.y - pl.y, s.x - pl.x) - pl.ang</pre>
<div class="note red">인자 순서에 주의하세요 — <b>atan2(dy, dx)</b>,
즉 <em>y가 먼저</em>입니다. JS와 Python 모두 같습니다.
순서를 바꾸면 x축·y축이 뒤바뀐 엉뚱한 각도가 나옵니다.</div>
<p>적 AI(12장)도 똑같이 atan2로 "플레이어 쪽 각도"를 구해 추적합니다.
<em>두 점 사이의 방향이 필요하면 무조건 atan2</em> — 이렇게 외워 두세요.</p>`},

{t:'피타고라스 — 거리 재기',k:'PYTHAGORAS',h:`
<p>다섯 번째 도구는 가장 오래된 정리입니다.
가로로 dx, 세로로 dy 떨어진 두 점 사이의 직선 거리는:</p>
<pre class="code" data-lang="js">dist = Math.sqrt(dx * dx + dy * dy)   // √(dx² + dy²)</pre>
<p>이 패턴이 워낙 흔해서 두 언어 모두 전용 함수 <b>hypot</b>
(hypotenuse, 빗변)를 제공합니다. 완성본은 전부 hypot를 씁니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var d = Math.hypot(s.x - player.x, s.y - player.y);
// 적과의 거리: 8칸 넘으면 AI가 쉰다, 1칸 안이면 물어뜯는다</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">if math.hypot(s.x - pl.x, s.y - pl.y) &lt; 0.5 and pl.hp &lt; 100:
    pl.hp = min(100, pl.hp + 25)      # 구급상자 획득!</pre>
<div class="note grn">성능 팁: "누가 더 가까운가"만 비교할 때는
제곱근을 생략하고 <b>dx² + dy²</b>끼리 비교해도 순서가 같습니다.
완성본의 스프라이트 정렬(9장)이 정확히 이 트릭으로 sqrt를 아낍니다.</div>
<p>정리하면 — <b>방향은 atan2, 거리는 hypot</b>.
두 점만 있으면 이 한 쌍으로 상대의 위치를 완전히 파악할 수 있습니다.</p>`},

{t:'벡터 기초 — 위치와 방향',k:'VECTORS',h:`
<p>지금까지의 조각을 <b>벡터</b>라는 이름으로 한 번에 정리합시다.
거창한 이론은 필요 없고, 숫자 쌍 (x, y)를 두 가지로 읽을 줄만 알면 됩니다.</p>
<div class="grid2">
<div class="card"><h3>위치 (point)</h3>
<p>"맵의 어디"를 나타내는 점.
플레이어 <b>P = (player.x, player.y)</b>는 (1.5, 1.5)에서 시작 —
격자 (1,1)칸의 정중앙입니다. 적, 아이템, 광선의 현재 위치도 전부 점입니다.</p></div>
<div class="card"><h3>방향 (direction)</h3>
<p>"어느 쪽으로"를 나타내는 화살표.
시선 방향 <b>dir = (cos ang, sin ang)</b>은 길이가 1이라
순수한 방향만 담습니다. 위치와 달리 "어디에 있는지"는 없습니다.</p></div>
</div>
<p>둘을 조합하는 규칙은 딱 하나입니다 —
<em>위치 + 방향 × 거리(스칼라 곱) = 새 위치</em>.</p>
<pre class="code" data-lang="js">// "P에서 시선 방향으로 t만큼 간 지점" — 광선 위의 점!
x = player.x + Math.cos(ang) * t;
y = player.y + Math.sin(ang) * t;</pre>
<div class="note">t를 0에서 점점 키우면 점이 광선을 따라 미끄러집니다.
4장의 광선 행진이 정확히 이 식이고, t를 <em>영리하게 골라 격자선에만
멈추는 것</em>이 5장의 DDA입니다. 이 한 줄이 엔진의 척추입니다.</div>`},

{t:'각도 정규화 — -π~π로 접기',k:'ANGLE WRAP',h:`
<p>플레이어가 제자리에서 왼쪽으로 세 바퀴 돌면 ang은 -18.8쯤 됩니다.
그 상태로 "적과의 각도차"를 빼면 350°짜리 차이 같은
쓸모없는 값이 나옵니다. 각도차는 항상 <b>-π~π 범위로 접어야</b> 합니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">rel = (rel + math.pi) % (2 * math.pi) - math.pi</pre>
<p>π를 더해 범위를 0~2π로 밀고, 나머지 연산으로 한 바퀴 안에 접은 뒤,
π를 도로 빼서 -π~π로 돌려놓는 <em>세 단계 트릭</em>입니다.</p>
<div class="note red">JS의 <b>%</b>는 피연산자가 음수면 <em>음수를 반환</em>합니다
(-1 % 5 → -1, Python은 4). 그래서 JS에서는 위 한 줄이 그대로 통하지 않고,
2π를 한 번 더 더하고 다시 %를 취하는 방어가 필요합니다.</div>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">// 완성본 renderSprites()의 실제 코드
rel = ((rel + Math.PI) % (2 * Math.PI) + 2 * Math.PI)
      % (2 * Math.PI) - Math.PI;</pre>
<ul class="b">
<li>스프라이트가 시야에 있는지(9장), 총알이 명중했는지(12장) —
각도차를 쓰는 모든 곳에서 이 정규화가 선행됩니다.</li>
<li>이걸 빼먹으면 "몇 바퀴 돌고 나면 적이 안 보이는" 유령 버그가 생깁니다.</li>
</ul>`},

{t:'선형 보간과 매핑',k:'RANGE MAPPING',h:`
<p>"범위 A의 값을 범위 B로 옮기기"는 게임 수학의 만능 접착제입니다.
비율을 구해 새 범위에 다시 펴는 것뿐입니다.</p>
<pre class="code" data-lang="js">// 0..1 사이 비율 t를 a..b 사이로 펴기 (lerp)
value = a + (b - a) * t;</pre>
<p>완성본에서 가장 중요한 매핑은 <b>화면 열 → 카메라 좌표</b>입니다.
열 번호 0..639를 -1..+1로 옮깁니다.</p>
<pre class="code" data-lang="js">cam = 2 * col / W - 1;
// col=0   → cam=-1  (화면 왼쪽 끝)
// col=320 → cam= 0  (화면 정중앙)
// col=639 → cam≈+1  (화면 오른쪽 끝)</pre>
<ul class="b">
<li>col/W로 0..1 비율을 만들고, 2를 곱해 0..2로 늘린 뒤, 1을 빼서
-1..+1로 밀었습니다. 위 lerp에서 a=-1, b=+1인 경우입니다.</li>
<li>이 cam 값이 10번 슬라이드의 <b>atan(cam · tan(FOV/2))</b>로 들어가
각 열의 광선 각도가 됩니다.</li>
<li>7장 텍스처에서도 같은 기술이 나옵니다 — 벽에 맞은 위치 0..1을
텍스처 픽셀 0..63으로 매핑합니다.</li>
</ul>
<div class="note">공식을 외우기보다 <em>"비율을 만들고 → 새 범위로 편다"</em>는
두 단계로 기억하세요. 그러면 어떤 범위 변환이든 즉석에서 만들 수 있습니다.</div>`},

{t:'나머지 연산으로 반복 무늬',k:'MODULO PATTERNS',h:`
<p>나머지 연산 <b>%</b>는 "일정 주기로 되돌아오는 값"을 만듭니다.
텍스처와 무늬의 핵심 도구입니다.</p>
<pre class="code" data-lang="js">x % 64   // x가 아무리 커져도 결과는 0..63을 맴돈다
// 0,1,...,63, 다시 0,1,...  ← 64픽셀 주기의 반복!</pre>
<ul class="b">
<li>우리 텍스처는 <b>TEX = 64</b>픽셀 정사각형 한 장뿐입니다.
긴 벽에 좌표를 % 64로 접어 넣으면 무늬가 <em>끝없이 타일처럼 반복</em>됩니다.</li>
<li>완성본 Python이 정확히 이렇게 텍스처 x좌표를 접습니다:
<b>tex_x = int(wall_x * TEX) % TEX</b>.</li>
<li>텍스처를 만들 때도 %가 무늬를 그립니다 —
벽돌 텍스처의 모르타르 줄은 <b>y % 16 &lt; 2</b> (16픽셀마다 가로줄).</li>
</ul>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">// 2의 거듭제곱 크기라면 비트 AND가 같은 일을 더 빠르게 한다
(texPos | 0) &amp; (TEX - 1)   // == texPos % 64 (양수에서)</pre>
<div class="note blue">63은 이진수로 111111. <b>&amp; 63</b>은 하위 6비트만 남기므로
64로 나눈 나머지와 같습니다. 90년대에 텍스처 크기가 죄다
2의 거듭제곱이었던 이유가 이 트릭입니다. 자세한 활용은 7장에서.</div>`},

{t:'정수 변환 — |0, int(), floor',k:'TO INTEGER',h:`
<p>"플레이어가 지금 <em>몇 번째 칸</em>에 있나?"
연속 좌표 (5.7, 3.2)를 격자 칸 (5, 3)으로 바꾸려면 소수부를 버려야 합니다.
언어마다 도구가 다르고, <em>음수에서 결과가 갈립니다</em>.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>도구</th><th>5.7</th><th>-1.5</th><th>동작</th></tr>
<tr><td>JS <b>x | 0</b></td><td>5</td><td><b>-1</b></td><td>소수부 버림 (0 쪽으로)</td></tr>
<tr><td>JS <b>Math.floor(x)</b></td><td>5</td><td><b>-2</b></td><td>내림 (아래쪽으로)</td></tr>
<tr><td>Python <b>int(x)</b></td><td>5</td><td><b>-1</b></td><td>소수부 버림 (0 쪽으로)</td></tr>
<tr><td>Python <b>math.floor(x)</b></td><td>5</td><td><b>-2</b></td><td>내림 (아래쪽으로)</td></tr>
</table></div>
<pre class="code" data-lang="js">var mapX = px | 0, mapY = py | 0;   // JS: 좌표 → 격자 칸</pre>
<pre class="code" data-lang="py">map_x, map_y = int(px), int(py)     # Python: 같은 일</pre>
<div class="note red">양수에서는 넷 다 같지만 <em>음수에서 |0과 floor는
다른 답</em>을 냅니다(-1.5 → -1 vs -2). 우리 맵은 테두리가 전부 벽이라
좌표가 음수가 될 일이 없어 빠른 |0 / int()를 안심하고 씁니다.
맵 밖 좌표를 다루는 엔진이라면 floor를 써야 격자가 어긋나지 않습니다.</div>
<p>덤: JS의 <b>| 0</b>은 32비트 정수 변환이라 아주 빠르고,
완성본에서 픽셀 좌표 계산에 수만 번씩 쓰입니다.</p>`},

{t:'수학 치트시트',k:'CHEAT SHEET',h:`
<p>이 장의 전부를 표 한 장에 담았습니다. 이후 어느 장에서든
수식이 막히면 이 슬라이드로 돌아오세요.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>공식</th><th>JS / Python</th><th>뜻</th></tr>
<tr><td>도→라디안</td><td>deg * Math.PI / 180</td><td>60° = π/3 = FOV</td></tr>
<tr><td>방향 벡터</td><td>Math.cos(a), Math.sin(a)</td><td>각도 a의 (x, y) 성분</td></tr>
<tr><td>전진</td><td>x += cos(a)·spd·dt</td><td>y도 sin으로 동일</td></tr>
<tr><td>기울기/비율</td><td>Math.tan(a)</td><td>= sin/cos, 투영에 사용</td></tr>
<tr><td>비율→각도</td><td>Math.atan(r)</td><td>열→광선각: atan(cam·tan(FOV/2))</td></tr>
<tr><td>방향각</td><td>Math.atan2(dy, dx)</td><td>y 먼저! 사분면 정확</td></tr>
<tr><td>거리</td><td>Math.hypot(dx, dy)</td><td>√(dx²+dy²)</td></tr>
<tr><td>각도 접기</td><td>(rel+π) % 2π - π</td><td>JS는 +2π 후 % 한 번 더</td></tr>
<tr><td>범위 매핑</td><td>2*col/W - 1</td><td>0..W → -1..+1</td></tr>
<tr><td>반복 무늬</td><td>x % 64 또는 x &amp; 63</td><td>텍스처 타일링</td></tr>
<tr><td>격자 칸 번호</td><td>x | 0 / int(x)</td><td>음수 주의 (floor와 다름)</td></tr>
</table></div>
<div class="note">항등식 <b>cos²a + sin²a = 1</b>과
<b>tan = sin/cos</b>까지 더하면 이 문서의 수학은 정말로 끝입니다.
다음 장에서는 이 도구로 세계 — <em>16×14 격자 맵</em> — 를 만듭니다.</div>`},

]});
</script>
<script>
/* ───────────── CH 3. 격자 맵과 플레이어 ───────────── */
CH({
icon:'🗺️', title:'격자 맵과 <span class="em">플레이어</span>',
desc:'3D처럼 보이는 세계도 데이터로는 고작 문자열 14줄입니다. 이 장에서는 격자 맵과 두 가지 좌표계를 정의하고, 플레이어를 숫자 세 개(x, y, ang)로 표현합니다. 마지막에는 미니맵을 그려 세계를 위에서 내려다봅니다.',
slides:[

{t:'세계는 모눈종이다',k:'GRID WORLD',h:`
<p>Doom 클론의 세계는 화려해 보이지만, 데이터 구조는 놀랄 만큼 단순합니다. <em>세계 전체가 모눈종이 한 장</em>입니다. 종이의 칸 하나하나가 <b>셀(cell)</b>이고, 각 셀은 <b>벽이거나 빈칸</b> 둘 중 하나입니다.</p>
<ul class="b">
<li>벽은 항상 셀 전체를 꽉 채웁니다 — 반쯤 걸친 벽, 비스듬한 벽은 없습니다.</li>
<li>벽의 높이는 모두 같습니다 — 천장도 바닥도 평평합니다.</li>
<li>플레이어는 빈칸 위를 자유롭게(소수점 좌표로) 걸어 다닙니다.</li>
</ul>
<p>이것이 1992년 <b>울펜슈타인 3D</b>가 택한 방식입니다. 세계를 이렇게 제한하면 "광선이 벽에 닿는 지점"을 아주 빠르게 계산할 수 있어서, 당시의 느린 PC에서도 3D 화면이 가능했습니다.</p>
<div class="note">제약은 약점이 아니라 <em>전략</em>입니다. 세계를 격자로 제한한 대가로, 우리는 4장~5장에서 벽 충돌 계산을 곱셈 몇 번으로 끝내게 됩니다.</div>`},

{t:'숫자로 그린 지도',k:'MAP DATA',h:`
<p>우리 게임의 세계 전체입니다. <b>가로 16칸 × 세로 14칸</b>, 문자 하나가 셀 하나입니다.</p>
<pre class="code" data-lang="js">// 0 빈칸 / 1 벽돌 / 2 돌 / 3 금속 / 4 문 / 5 출구
var MAP_STR = [
  '1111111111111111',
  '1000000110000001',
  '1020000110000201',
  '1000000000000001',
  '1000111141110001',
  '1000100000010001',
  '1300100000010031',
  '1000100000010001',
  '1000111411110001',
  '1000000000000001',
  '1020000330000201',
  '1000000330000001',
  '1000000000000051',
  '1111111111111111'
];</pre>
<div class="tblWrap"><table class="tbl">
<tr><th>숫자</th><th>의미</th><th>성질</th></tr>
<tr><td>0</td><td>빈칸</td><td>지나갈 수 있음</td></tr>
<tr><td>1</td><td>벽돌 벽</td><td>막힘</td></tr>
<tr><td>2</td><td>돌 기둥</td><td>막힘</td></tr>
<tr><td>3</td><td>금속 벽</td><td>막힘</td></tr>
<tr><td>4</td><td>문(닫힘)</td><td>막힘 — <kbd>F</kbd>로 열면 0이 됨</td></tr>
<tr><td>5</td><td>출구</td><td>막힘 — 앞에서 <kbd>F</kbd>를 누르면 탈출</td></tr>
</table></div>`},

{t:'문자열 배열이 좋은 이유',k:'PARSING',h:`
<p>맵을 처음부터 숫자 배열로 쓰지 않고 <em>문자열 배열</em>로 쓴 데에는 이유가 있습니다. 문자열은 <b>글자 폭이 일정</b>해서, 코드 에디터에서 맵이 그대로 지도처럼 보입니다. 벽을 옮기고 싶으면 그냥 글자를 고치면 됩니다.</p>
<p>대신 계산할 때는 숫자가 필요하니, 시작할 때 한 번만 숫자 배열로 변환합니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">world = [];
for (y = 0; y &lt; MAP_H; y++)
  world.push(MAP_STR[y].split('').map(Number));</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">world = [[int(c) for c in row] for row in MAP_STR]</pre>
<p>JS는 <b>split('')</b>으로 문자열을 글자 배열로 쪼갠 뒤 <b>Number</b>로 바꾸고, 파이썬은 문자열이 원래 글자의 나열이므로 <b>int(c)</b>만 씌우면 됩니다. 두 언어 모두 결과는 같은 2차원 숫자 배열 <span class="reg">world</span>입니다.</p>`},

{t:'cell(x, y) — 안전한 조회 함수',k:'SAFE LOOKUP',h:`
<p>이제 "셀 (x, y)에 뭐가 있지?"라는 질문에 답하는 함수를 만듭니다. 앞으로 광선 검사, 충돌 판정, 적 이동 등 <em>모든 코드가 이 함수 하나를 통해</em> 맵을 읽습니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">function cell(x, y) {
  if (x &lt; 0 || y &lt; 0 || x &gt;= MAP_W || y &gt;= MAP_H) return 1;
  return world[y][x];
}</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">def cell(x, y):
    if 0 &lt;= x &lt; MAP_W and 0 &lt;= y &lt; MAP_H:
        return world[y][x]
    return 1</pre>
<p>핵심은 마지막 줄입니다. 맵 범위를 벗어난 좌표를 물어보면 에러를 내는 대신 <em>1(벽돌 벽)을 돌려줍니다</em>. 즉 우리 세계는 보이지 않는 무한한 벽으로 둘러싸여 있는 셈입니다.</p>`},

{t:'왜 경계 밖은 벽인가',k:'BOUNDARY GUARD',h:`
<p>"범위 밖 = 벽" 트릭은 단순한 에러 방지가 아닙니다. 이 한 줄이 앞으로 만들 <em>모든 루프의 안전망</em>이 됩니다.</p>
<div class="note red"><b>이 처리가 없다면:</b> 4장에서 광선은 "벽을 만날 때까지" 전진합니다. 맵 데이터에 실수로 구멍이 있거나 광선이 경계를 빠져나가면, 벽을 영영 못 만나고 <em>광선이 영원히 달립니다</em> — 무한 루프로 게임이 멈추거나, 배열 범위 밖을 읽어 프로그램이 죽습니다.</div>
<ul class="b">
<li><b>광선</b>: 아무리 멀리 가도 결국 "벽"을 만나 반드시 멈춥니다.</li>
<li><b>플레이어</b>: 경계 밖은 벽이므로 충돌 판정에 막혀 맵을 못 벗어납니다.</li>
<li><b>적</b>: 같은 이유로 맵 밖으로 걸어 나가지 못합니다.</li>
</ul>
<p>물론 우리 맵은 테두리를 이미 1로 둘렀지만, 방어는 이중으로 하는 것이 좋습니다. 맵 데이터를 마음껏 고쳐도 게임이 죽지 않는 것은 이 함수 덕분입니다.</p>`},

{t:'좌표의 두 세계 — 셀 좌표와 연속 좌표',k:'COORDINATES',h:`
<p>우리 코드에는 좌표계가 <em>두 개</em> 공존합니다. 이 구분이 3~5장 전체를 관통하는 열쇠입니다.</p>
<div class="grid2">
<div class="card"><h3>셀 좌표 (정수)</h3><p>맵의 몇 번째 칸인지. <span class="reg">world[y][x]</span>를 읽을 때 사용합니다. 예: 셀 (9, 3).</p></div>
<div class="card"><h3>연속 좌표 (실수)</h3><p>세계 안의 정확한 위치. 플레이어·적·광선이 사용합니다. 셀 한 변의 길이가 1.0입니다. 예: (9.7, 3.2).</p></div>
</div>
<p>변환은 한 방향으로만 필요합니다 — <em>소수점을 버리면</em> 연속 좌표가 셀 좌표가 됩니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var mapX = px | 0;   // 9.7 → 9  (|0 은 빠른 정수 변환)</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">map_x = int(px)      # 9.7 → 9</pre>
<p>버려진 소수부 0.7은 <b>셀 안에서의 위치</b>(왼쪽 벽에서 70% 지점)를 뜻합니다. 이 소수부는 5장의 DDA와 7장의 텍스처 좌표 계산에서 주인공이 됩니다.</p>`},

{t:'지도 위를 걸어 보기',k:'LIVE DEMO',h:`
<p>지금까지 만든 것을 눈으로 확인해 봅시다. 아래는 우리 맵을 위에서 내려다본 모습입니다. <em>초록 점이 플레이어</em>, 뻗어 나가는 선이 시선 방향입니다.</p>
<div class="demoWrap"><div class="dTitle">TOP-DOWN MAP — 드래그로 이동</div>
<canvas class="demo" data-demo="topdown" width="512" height="448"></canvas>
<div class="ctl"><label>각도 <input type="range" data-p="ang" min="0" max="360" value="30"><span class="val" data-v="ang"></span></label></div>
</div>
<ul class="b">
<li>플레이어를 <b>드래그</b>해서 방 안 곳곳으로 옮겨 보세요. 벽 셀 안으로는 들어가지지 않습니다.</li>
<li><b>각도 슬라이더</b>를 돌려 시선 방향을 바꿔 보세요. 0°는 오른쪽(+x), 90°는 아래(+y)입니다.</li>
<li>2번 슬라이드의 문자열과 화면의 벽 배치가 정확히 일치하는지 비교해 보세요.</li>
</ul>`},

{t:'플레이어는 3개의 숫자다',k:'PLAYER STATE',h:`
<p>이 격자 세계에서 플레이어의 존재는 딱 <em>숫자 세 개</em>로 요약됩니다 — 위치 <b>x</b>, <b>y</b>(연속 좌표)와 바라보는 방향 <b>ang</b>(라디안). 나머지 hp와 ammo는 게임 규칙용일 뿐, 렌더링과는 무관합니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">player = { x: 1.5, y: 1.5, ang: 0.3, hp: 100, ammo: 40 };</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">class Player:
    def __init__(self):
        self.x, self.y = 1.5, 1.5
        self.ang = 0.3
        self.hp = 100
        self.ammo = 40</pre>
<p>매 프레임 화면에 그려지는 모든 것 — 벽의 원근, 스프라이트의 위치, 미니맵의 시선 화살표 — 은 전부 이 세 숫자에서 계산되어 나옵니다. <em>게임의 카메라가 곧 이 세 숫자</em>입니다.</p>`},

{t:'시작 위치 (1.5, 1.5) — 왜 .5인가',k:'SPAWN POINT',h:`
<p>시작 좌표가 (1, 1)이 아니라 <em>(1.5, 1.5)</em>인 것은 우연이 아닙니다. 셀 (1, 1)은 연속 좌표로 1.0 ≤ x &lt; 2.0, 1.0 ≤ y &lt; 2.0인 정사각형입니다. 따라서 (1.5, 1.5)는 정확히 <b>셀의 중앙</b>입니다.</p>
<div class="note red"><b>흔한 버그 — 벽 안 스폰:</b> 정수 좌표 (1, 1)은 셀 (1, 1)의 <em>왼쪽 위 모서리</em>입니다. 이 모서리는 벽 셀 (0, 0), (1, 0), (0, 1)과 맞닿아 있어서, 시작하자마자 충돌 판정에 끼이거나, 회전만 해도 벽 속에 파묻힌 화면이 나올 수 있습니다. 스폰 좌표에는 항상 <b>.5</b>를 붙여 셀 중앙에서 시작하세요.</div>
<p>같은 이유로 적과 구급상자도 전부 (9.5, 1.5), (12.5, 6.5)처럼 <b>.5 좌표</b>에 배치되어 있습니다. 사방 벽면까지의 여유가 0.5로 똑같아, 어느 방향으로 움직여도 안전합니다.</p>`},

{t:'방향은 각도 하나로 충분한가',k:'ANGLE VS VECTOR',h:`
<p>플레이어의 방향을 표현하는 방식은 크게 두 갈래가 있습니다.</p>
<div class="grid2">
<div class="card"><h3>각도 방식 (이 문서)</h3><p>방향 = <span class="reg">ang</span> 하나. 시선 벡터는 필요할 때 (cos ang, sin ang)으로 계산. 회전은 ang += 회전량 한 줄.</p></div>
<div class="card"><h3>벡터 + 카메라 평면 방식</h3><p>시선 벡터 (dirX, dirY)와 화면 방향 벡터 (planeX, planeY)를 직접 유지. 회전할 때 두 벡터에 회전 행렬을 곱함.</p></div>
</div>
<div class="note blue"><b>lodev 튜토리얼과의 차이:</b> 유명한 lodev.org 레이캐스팅 튜토리얼은 벡터+카메라평면 방식을 씁니다. 우리는 <em>각도 + atan 보정</em> 방식을 씁니다: 각 화면 열의 광선 각도를 <span class="reg">ang + atan(cam·tan(FOV/2))</span>로 구합니다(4장). 두 방식은 수학적으로 같은 그림을 만들며, 각도 방식이 삼각함수는 조금 더 쓰는 대신 상태가 단순하고 직관적입니다.</div>
<p>어느 쪽이든 본질은 같습니다 — <em>"플레이어가 어디서, 어느 쪽을 보고 있는가"</em>를 수치로 유지하는 것입니다.</p>`},

{t:'타일 종류 설계',k:'TILE DESIGN',h:`
<p>타일 숫자 1~5는 아무렇게나 붙인 것이 아닙니다. <em>타일 값 = 텍스처 번호</em>가 되도록 설계했습니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>타일</th><th>외형</th><th>역할</th></tr>
<tr><td>1</td><td>벽돌</td><td>기본 벽, 외곽 테두리</td></tr>
<tr><td>2</td><td>돌</td><td>장식 기둥</td></tr>
<tr><td>3</td><td>금속판</td><td>포인트 벽</td></tr>
<tr><td>4</td><td>문</td><td>열리면 world 값이 0으로 바뀜</td></tr>
<tr><td>5</td><td>출구</td><td>레벨 클리어 지점</td></tr>
</table></div>
<p>덕분에 7장에서 벽을 그릴 때, 맞은 타일 값으로 텍스처를 <em>바로 꺼내 쓸 수 있습니다</em>.</p>
<pre class="code" data-lang="js">tex = TEXS[tile];   // 타일 1 → 벽돌 텍스처, 4 → 문 텍스처...</pre>
<p>0을 빈칸으로 둔 것도 같은 맥락입니다 — <b>0은 거짓(falsy)</b>이므로 "벽인가?"를 <span class="reg">if (tile &gt; 0)</span> 또는 <span class="reg">if world[y][x]</span>처럼 간결하게 물을 수 있습니다.</p>`},

{t:'맵을 2차원 배열로 — world[y][x]',k:'ROW MAJOR',h:`
<p>변환된 <span class="reg">world</span>는 2차원 배열입니다. 여기서 초보자를 가장 많이 넘어뜨리는 것이 <em>인덱스 순서</em>입니다 — <b>world[y][x]</b>, y가 먼저입니다.</p>
<p>이유는 데이터의 생김새에 있습니다. MAP_STR은 <b>행(가로줄)의 목록</b>이고, 문자열 한 줄이 행 하나입니다. 그러니 world의 첫 인덱스는 "몇 번째 줄(y)", 둘째 인덱스는 "그 줄의 몇 번째 글자(x)"가 됩니다.</p>
<pre class="code" data-lang="js">world[2][13]   // y=2행, x=13열 → 2 (돌 기둥)
world[13][2]   // y=13행, x=2열 → 1 (아래쪽 테두리 벽!)</pre>
<div class="note red">순서를 뒤집어 <span class="reg">world[x][y]</span>로 쓰면, 우리 맵은 16×14라 가로세로가 달라 곧바로 범위 에러가 나거나, 대각선 대칭으로 뒤집힌 유령 맵을 헤매게 됩니다. <em>배열은 [y][x], 함수 인자는 cell(x, y)</em> — 이 대응만 기억하세요. 그래서 cell() 내부가 정확히 <span class="reg">return world[y][x]</span>입니다.</div>`},

{t:'미니맵 그리기 — 셀 순회',k:'MINIMAP',h:`
<p>격자 맵의 첫 번째 보상은 <em>미니맵이 공짜</em>라는 것입니다. 셀 하나를 화면의 6×6픽셀 사각형(<span class="reg">mm = 6</span>)으로 그리면 끝입니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">def render_minimap(buf, pl, sprites):
    mm = 6
    pygame.draw.rect(buf, (10, 10, 14), (0, 0, MAP_W * mm, MAP_H * mm))
    for y in range(MAP_H):
        for x in range(MAP_W):
            if world[y][x]:
                col = (90, 90, 110) if world[y][x] != 4 else (60, 160, 90)
                pygame.draw.rect(buf, col, (x * mm, y * mm, mm - 1, mm - 1))</pre>
<p>모든 셀을 이중 루프로 돌며, 벽이면 회색, 문(4)이면 초록으로 칠합니다. <span class="reg">mm - 1</span>로 1픽셀 틈을 줘서 격자선이 보이게 했습니다. JS 버전 <span class="reg">renderMinimap</span>은 픽셀 버퍼에 직접 쓰기 때문에 반대로 <em>픽셀을 순회하며</em> <span class="reg">world[(y/mm)|0][(x/mm)|0]</span>로 소속 셀을 역산합니다 — 결과 그림은 같습니다.</p>`},

{t:'미니맵에 플레이어와 시선 표시',k:'PLAYER MARKER',h:`
<p>맵만 있으면 반쪽입니다. <em>내가 어디서 어느 쪽을 보는지</em>를 얹어야 진짜 미니맵입니다. 위치는 점으로, 시선은 <b>cos/sin으로 만든 짧은 선</b>으로 그립니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">pygame.draw.circle(buf, (80, 220, 120),
                   (int(pl.x * mm), int(pl.y * mm)), 2)
ex = pl.x + math.cos(pl.ang) * 1.2      # 시선 방향으로 1.2칸 앞
ey = pl.y + math.sin(pl.ang) * 1.2
pygame.draw.line(buf, (80, 220, 120),
                 (pl.x * mm, pl.y * mm), (ex * mm, ey * mm))</pre>
<p>연속 좌표에 <span class="reg">mm</span>만 곱하면 미니맵 픽셀 좌표가 됩니다. 각도 하나에서 방향 벡터 (cos ang, sin ang)를 뽑아내는 이 패턴은 2장에서 본 그대로이며, 4장의 광선, 8장의 이동 코드에서도 똑같이 반복됩니다.</p>
<div class="note grn">JS 버전은 선 대신 시선 방향으로 점 8개를 0.15칸 간격으로 찍습니다. 픽셀 버퍼에는 "선 그리기" 함수가 없기 때문인데, 점을 이어 찍는 것이 곧 선입니다.</div>`},

{t:'우리 맵 투어',k:'MAP TOUR',h:`
<p>2번 슬라이드의 문자열을 지도로 읽어 봅시다. 이 작은 맵에도 나름의 동선 설계가 있습니다.</p>
<ul class="b">
<li><b>스폰 지점 (1.5, 1.5)</b> — 왼쪽 위 구석. 눈앞의 넓은 홀에서 게임이 시작됩니다.</li>
<li><b>중앙 방</b> — x=4~11, y=4~8을 두르는 벽돌 방. 출입구는 <em>문 두 짝</em>뿐입니다: 북쪽 문 (8, 4)과 남쪽 문 (7, 8). <kbd>F</kbd>로 열고 들어갑니다.</li>
<li><b>돌 기둥 4개</b> — (2, 2), (13, 2), (2, 10), (13, 10). 네 모퉁이의 랜드마크이자 총알을 피하는 엄폐물입니다.</li>
<li><b>금속 블록</b> — (7~8, 10~11)의 2×2 덩어리와 동서 벽의 금속 장식 (1, 6), (14, 6).</li>
<li><b>출구 (14, 12)</b> — 스폰의 대각선 반대편, 오른쪽 아래 구석. 맵을 가로질러야 도달합니다.</li>
</ul>
<p>즉 이 맵의 목표 동선은 "왼쪽 위에서 출발 → 적을 뚫고 → 오른쪽 아래 출구"입니다. 미니맵을 켜 두고(<kbd>Tab</kbd>) 위 목록과 대조해 보세요.</p>`},

{t:'나만의 맵 만들기',k:'CUSTOM MAP',h:`
<p>격자 맵 + 문자열 설계의 최대 장점: <em>레벨 에디터가 필요 없습니다</em>. MAP_STR의 글자만 바꾸면 그게 곧 새 레벨입니다. 다만 규칙 몇 가지는 지켜야 합니다.</p>
<ol>
<li><b>테두리는 전부 벽</b> — 첫 줄, 끝 줄, 각 줄의 양 끝은 1~3 중 하나로. (cell()이 밖을 벽 취급하긴 하지만, 눈에 보이는 외벽이 있어야 자연스럽습니다.)</li>
<li><b>모든 줄의 길이를 같게</b> — 한 글자라도 짧으면 그 줄 오른쪽에 구멍이 뚫립니다.</li>
<li><b>스폰 지점 (1.5, 1.5)의 셀 (1, 1)은 반드시 0</b> — 아니면 벽 속에서 태어납니다. 적/아이템 좌표의 셀도 마찬가지입니다.</li>
<li><b>출구 5를 하나 이상</b> — 없으면 클리어가 불가능한 방탈출이 됩니다.</li>
<li><b>문 4는 벽 사이에</b> — 뚫린 공간 한복판의 문은 옆으로 그냥 지나갈 수 있어 의미가 없습니다.</li>
</ol>
<div class="note">맵 크기를 바꿔도 코드는 그대로 동작합니다. MAP_W와 MAP_H를 문자열에서 자동으로 계산하기 때문입니다. 20×20, 32×24 — 원하는 크기로 실험해 보세요.</div>`},

{t:'더 큰 세계로',k:'BIGGER WORLDS',h:`
<p>16×14는 교육용으로 고른 크기일 뿐, 방식 자체는 훨씬 큰 세계도 감당합니다. 셀 하나가 숫자 하나이므로 <b>128×128 맵도 16KB</b>에 불과하고, 5장에서 만들 DDA는 맵이 커져도 광선당 검사 횟수가 거의 늘지 않습니다.</p>
<ul class="b">
<li><b>여러 맵 로딩</b> — MAP_STR을 배열로 여러 개 두고, 출구에 닿으면 다음 문자열 세트로 world를 다시 파싱하면 "스테이지"가 됩니다.</li>
<li><b>파일에서 읽기</b> — 맵을 텍스트 파일로 빼면 게임 코드를 건드리지 않고 레벨을 추가할 수 있습니다.</li>
</ul>
<div class="note blue"><b>진짜 Doom의 방식 — WAD 파일:</b> 1993년 Doom은 한발 더 나가, 맵·텍스처·사운드 등 모든 데이터를 <em>WAD("Where's All the Data")</em>라는 파일에 담아 실행 파일과 완전히 분리했습니다. 게다가 Doom의 맵은 격자가 아니라 <em>임의 각도의 선분과 섹터</em>로 되어 있어 비스듬한 벽과 높낮이가 다른 바닥이 가능했습니다. 데이터와 코드의 분리 — 이것이 수많은 모드(MOD) 문화를 낳은 설계입니다.</div>
<p>우리의 문자열 맵은 그 아이디어의 가장 작은 축소판인 셈입니다.</p>`},

{t:'정리 — 세계 표현 3종 세트',k:'RECAP',h:`
<p>이 장에서 만든 세 가지가 앞으로 모든 장의 토대가 됩니다.</p>

<p>그리고 플레이어는 숫자 세 개 — <b>x, y</b>(연속 좌표)와 <b>ang</b>(시선 각도) — 로 정의했습니다. 셀 중앙 (1.5, 1.5)에서 출발합니다.</p>

slides:[

{t:'우리가 풀 문제 한 문장',k:'THE QUESTION',h:`
<p>3D 렌더링이라고 하면 거창하게 들리지만, 레이캐스팅이 푸는 문제는 딱 한 문장입니다.</p>
<div class="big"><span class="hero">"이 픽셀 열에는<br>무엇이 보이는가?"</span></div>
<p>화면의 세로줄(열) 하나를 골랐을 때 — 거기 보이는 벽은 <b>어느 벽</b>이고, <b>얼마나 멀리</b> 있는가? 이 질문에 답할 수만 있으면, 화면의 모든 열에 대해 같은 질문을 반복해서 한 프레임을 완성할 수 있습니다.</p>
<p>답을 구하는 도구가 바로 <em>광선(ray)</em>입니다. 플레이어의 눈에서 그 열이 담당하는 방향으로 광선을 쏘고, 광선이 처음 부딪히는 벽까지의 거리를 재면 됩니다. 이 장에서는 "어느 방향으로 쏘는가"와 "어떻게 부딪힘을 찾는가"를 차례로 해결합니다.</p>`},

{t:'눈에서 광선이 나간다',k:'REVERSE LIGHT',h:`
<p>현실의 빛은 반대로 움직입니다. 램프에서 나온 광자가 벽에 부딪혀 튕기고, 그중 극히 일부가 우연히 눈에 들어와 상이 맺힙니다. 이걸 그대로 시뮬레이션하면 어떨까요? 광자의 99.999…%는 눈에 안 들어오므로, 거의 전부가 <em>버려지는 계산</em>이 됩니다.</p>
<p>그래서 렌더링은 발상을 뒤집습니다 — <em>눈에서 거꾸로 추적</em>하는 것입니다. "눈에 들어온 빛"만 골라서, 그 빛이 어디서 왔는지를 역방향으로 따라가면 필요한 계산만 남습니다.</p>
<div class="grid2">
<div class="card"><h3>레이트레이싱</h3><p>픽셀마다 광선을 쏘고 반사·굴절까지 추적합니다. 아름답지만 비쌉니다. (요즘 GPU가 하드웨어로 하는 그것)</p></div>
<div class="card"><h3>레이캐스팅 (우리)</h3><p>세로줄마다 광선 <em>하나</em>만 쏘고, 첫 벽에 닿으면 끝. 반사도 굴절도 없습니다. 1992년 CPU로도 실시간이 됩니다.</p></div>
</div>
<div class="note">레이캐스팅은 레이트레이싱의 "가장 싼 특수판"입니다. 세계가 격자(3장)라는 제약 덕분에 이 싼 방법으로도 그럴듯한 3D가 나옵니다.</div>`},

{t:'화면은 세로줄의 모음',k:'SCREEN COLUMNS',h:`
<p>왜 하필 "픽셀"이 아니라 "열" 단위로 질문할 수 있을까요? 우리 세계의 제약 덕분입니다. 벽은 모두 <b>수직</b>이고 바닥과 천장은 평평하므로, 화면의 한 세로줄에는 <em>항상 벽 기둥 하나</em>가 통째로 그려집니다 — 위는 천장, 가운데는 벽, 아래는 바닥.</p>
<p>우리 내부 해상도는 <b>640×400</b>입니다. 즉 화면은 <b>세로줄 640개</b>의 모음이고, 한 프레임을 그리는 데 필요한 광선도 정확히 640개입니다.</p>
<pre class="code" data-lang="py">NUM_RAYS = W        # 화면 세로줄 하나당 광선 하나 (= 640)</pre>
<p>픽셀 단위로 따지면 640×400 = 256,000번 물어야 할 것을, 열 단위로는 <em>640번</em>이면 됩니다. 질문 수가 400분의 1로 줄어드는 것 — 이것이 레이캐스팅을 "2.5D"라 부르는 이유이자, 위아래를 올려다볼 수 없는 이유이기도 합니다.</p>`},

{t:'광선 8개로도 3D처럼 보인다',k:'LIVE DEMO',h:`
<p>정말 "열 = 광선"만으로 입체감이 날까요? 열 개수를 극단적으로 줄여서 확인해 봅시다.</p>
<div class="demoWrap"><div class="dTitle">COLUMNS — 열 개수를 바꿔 보세요</div>
<canvas class="demo" data-demo="columns" width="512" height="240"></canvas>
<div class="ctl"><label>열 <input type="range" data-p="cols" min="8" max="320" value="8"><span class="val" data-v="cols"></span></label></div>
</div>
<ul class="b">
<li><b>8개</b>부터 시작해 보세요. 굵은 막대 8개뿐인데도 벌써 "가까운 벽은 크고 먼 벽은 작다"가 보입니다.</li>
<li>슬라이더를 올려 <b>40 → 160 → 320</b>으로 늘리면 막대가 가늘어지며 매끈한 벽이 됩니다.</li>
<li>열 하나 = 광선 하나 = 거리 하나 = 막대 높이 하나. <em>3D처럼 보이는 것의 정체는 높이가 다른 세로 막대들</em>입니다.</li>
</ul>`},

{t:'광선의 수학적 표현',k:'RAY MATH',h:`
<p>광선을 코드로 다루려면 수식이 필요합니다. 광선은 <b>시작점</b>과 <b>방향</b>만 있으면 완전히 정해집니다.</p>
<div class="note">광선 위의 점 = <b>P + d × t</b><br>
P = 시작점 (px, py) — 플레이어의 위치<br>
d = 방향 벡터 (cos ang, sin ang) — 길이 1<br>
t = 시작점에서 나아간 <em>거리</em> (t ≥ 0)</div>
<pre class="code" data-lang="js">// 광선을 t만큼 따라간 지점
x = px + Math.cos(ang) * t;
y = py + Math.sin(ang) * t;</pre>
<p>방향 벡터의 길이가 1이므로 <em>t가 곧 실제 거리</em>입니다(단위: 맵 칸). t = 0이면 플레이어 위치, t = 3이면 시선 방향으로 3칸 앞의 지점입니다.</p>
<p>이제 "벽까지의 거리"라는 말을 정확히 번역할 수 있습니다 — <em>cell()이 처음으로 0이 아닌 값을 돌려주는 가장 작은 t</em>. 이 장의 나머지는 전부 이 t를 찾는 이야기입니다.</p>`},

{t:'광선 하나 쏘아 보기',k:'LIVE DEMO',h:`
<p>광선 하나가 벽을 찾아가는 과정을 위에서 내려다봅시다. 광선이 일정 간격으로 점을 찍으며 전진하다가, 벽 셀에 들어가는 순간 멈춥니다.</p>
<div class="demoWrap"><div class="dTitle">SINGLE RAY MARCH</div>
<canvas class="demo" data-demo="rayone" width="512" height="448"></canvas>
<div class="ctl"><label>각도 <input type="range" data-p="ang" min="0" max="360" value="20"><span class="val" data-v="ang"></span></label>
<label>스텝 <input type="range" data-p="step" min="5" max="80" value="30"><span class="val" data-v="step"></span></label></div>
</div>
<ul class="b">
<li><b>각도</b>를 돌리면 광선이 다른 벽에 부딪히고, 표시되는 거리 t가 변합니다.</li>
<li>플레이어를 <b>드래그</b>해 위치를 바꿔 보세요. 같은 각도라도 거리가 달라집니다.</li>
<li>점들의 간격(<b>스텝</b>)은 잠시 후 13~14번 슬라이드의 주인공이 됩니다. 일단 기본값으로 두세요.</li>
</ul>`},

{t:'시야각 FOV',k:'FIELD OF VIEW',h:`
<p>광선 640개를 쏘려면 먼저 <em>어느 각도 범위에</em> 흩뿌릴지 정해야 합니다. 이 범위가 <b>시야각(FOV, Field of View)</b>입니다.</p>
<pre class="code" data-lang="py">FOV = math.pi / 3       # 시야각 60도</pre>
<div class="tblWrap"><table class="tbl">
<tr><th>대상</th><th>시야각</th><th>비고</th></tr>
<tr><td>사람의 두 눈</td><td>~180°</td><td>주변부는 흐릿한 감지만 가능</td></tr>
<tr><td>콘솔 FPS</td><td>60~75°</td><td>소파에서 멀리 보는 TV 기준</td></tr>
<tr><td>PC FPS</td><td>90~110°</td><td>모니터가 가까워 넓게 잡음</td></tr>
<tr><td><b>우리 (그리고 울펜슈타인)</b></td><td><b>60°</b></td><td>π/3 라디안</td></tr>
</table></div>
<p>FOV를 키우면 한 화면에 더 넓은 세계가 들어오는 대신, 같은 640열에 더 넓은 범위를 욱여넣으므로 가장자리가 늘어져 보입니다. 60°는 왜곡이 적고 계산이 깔끔한 고전적인 선택입니다.</p>`},

{t:'부채살 — FOV와 광선 수',k:'LIVE DEMO',h:`
<p>시선 방향을 중심으로 FOV만큼 벌어진 <em>광선 부채</em>를 위에서 내려다봅시다. 이 부채가 곧 "화면에 담기는 영역"입니다.</p>
<div class="demoWrap"><div class="dTitle">FOV FAN</div>
<canvas class="demo" data-demo="fovfan" width="512" height="528"></canvas>
<div class="ctl"><label>FOV <input type="range" data-p="fov" min="30" max="120" value="60"><span class="val" data-v="fov"></span></label>
<label>광선 수 <input type="range" data-p="rays" min="3" max="160" value="40"><span class="val" data-v="rays"></span></label></div>
</div>
<ul class="b">
<li><b>FOV</b>를 30° ↔ 120°로 바꿔 보세요. 부채가 좁아지면 망원경, 넓어지면 광각 렌즈입니다.</li>
<li><b>광선 수</b>를 3개까지 줄이면 부채 사이에 "못 보는 틈"이 생깁니다. 실전에서는 640개라 틈이 없습니다.</li>
<li>부채의 <em>양 끝 광선</em>이 화면의 왼쪽 끝 열과 오른쪽 끝 열을 담당합니다.</li>
</ul>`},

{t:'열→각도 변환, 순진한 방법',k:'NAIVE MAPPING',h:`
<p>이제 핵심 질문입니다. <em>화면의 col번째 열은 어느 각도의 광선을 담당하는가?</em> 가장 먼저 떠오르는 답은 "각도를 균등하게 나누자"입니다.</p>
<pre class="code" data-lang="js">// 순진한 방법: FOV를 640등분해 균등한 각도로
rayAng = player.ang - FOV / 2 + (col / W) * FOV;</pre>
<p>확인해 보면 그럴듯합니다. FOV 60°, W = 640일 때:</p>
<ul class="b">
<li>col = 0 → 시선보다 <b>-30°</b> (왼쪽 끝)</li>
<li>col = 320 → <b>+0°</b> (정면)</li>
<li>col = 639 → <b>+29.9°</b> (오른쪽 끝)</li>
<li>이웃한 열끼리는 정확히 60/640 = <b>0.09375°</b>씩 차이</li>
</ul>
<p>많은 입문 튜토리얼이 실제로 이 식을 씁니다. 광선이 고르게 퍼지니 완벽해 보이지만… 이 식으로 벽을 그려 보면 <em>미묘하게 이상한 그림</em>이 나옵니다. 무엇이 문제일까요?</p>`},

{t:'균등 각도의 문제',k:'DISTORTION',h:`
<p>문제는 우리가 보는 <b>화면이 평면</b>이라는 데 있습니다. 균등 각도 광선은 <em>둥근 호(원호)</em> 위의 점들을 균등하게 찍는 방식입니다. 그런데 그 결과를 <em>평평한 화면</em>에 균등 간격 열로 붙여 버리면, 호를 억지로 펴서 붙이는 셈이 됩니다.</p>
<p>구체적으로: 평면 스크린에서 같은 폭의 열이라도, 화면 <b>가장자리</b>일수록 눈에서 보는 각도 폭은 <b>좁아집니다</b>. 올바른 배분은 정면 부근 1열 ≈ 0.103°, 가장자리 1열 ≈ 0.078° — 균등 각도는 이를 무시하고 어디서나 0.094°를 배정합니다.</p>
<div class="note red"><b>증상:</b> 벽 정면에 서면 곧은 벽의 가장자리가 <em>바깥쪽으로 살짝 부풀어</em> 보이고, 회전할 때 벽이 고무처럼 <em>출렁</em>입니다. FOV가 60°면 미묘하지만, 90° 이상이면 확연합니다. 6장에서 다룰 어안(fisheye) 현상과 형제 관계인 왜곡으로, 거리 보정만으로는 완전히 사라지지 않습니다.</div>
<p>원인이 "호와 평면의 불일치"이므로, 해법은 처음부터 <em>평면 위에서 균등하게</em> 나누는 것입니다.</p>`},

{t:'올바른 변환 — 투영면과 tan',k:'PROJECTION PLANE',h:`
<p>발상을 뒤집습니다. 각도를 균등하게 나누는 대신, <em>가상의 평면 스크린 위에 점을 균등하게 찍고</em>, 각 점을 향해 광선을 쏩니다. 이것이 우리 두 구현이 실제로 쓰는 식입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">// 화면 x좌표 → 광선 각도 (탄젠트 기반: 균등 간격 투영면)
cam = 2 * col / W - 1;
rayAng = player.ang + Math.atan(cam * Math.tan(FOV / 2));</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">cam = 2 * col / NUM_RAYS - 1            # -1 .. +1
ray_ang = pl.ang + math.atan(cam * math.tan(FOV / 2))</pre>
<p>두 단계로 읽습니다.</p>
<ol>
<li><b>cam</b>: 열 번호 0~639를 <b>-1 ~ +1</b>로 정규화합니다. -1은 화면 왼쪽 끝, 0은 중앙, +1은 오른쪽 끝.</li>
<li><b>atan(cam · tan(FOV/2))</b>: 스크린 위 그 지점을 향한 <em>실제 각도</em>를 구합니다.</li>
</ol>
<p>검산: col = 0이면 cam = -1, 각도는 atan(-tan 30°) = <b>-30°</b>. col = 320이면 <b>0°</b>. 양 끝은 균등 각도와 같지만, <em>중간 열들의 배분</em>이 다릅니다.</p>`},

{t:'투영면 그림으로 이해하기',k:'PROJECTION',h:`
<p>앞의 식을 그림으로 그려 봅시다. 플레이어 눈앞, 시선 방향으로 <b>거리 1</b>인 곳에 시선과 수직인 <em>가상 스크린(투영면)</em>이 서 있다고 상상합니다.</p>
<ul class="b">
<li>스크린의 절반 폭은 <b>tan(FOV/2)</b> = tan 30° ≈ <b>0.577</b>입니다. (거리 1, 반각 30°인 직각삼각형)</li>
<li>이 스크린 위에 640개의 점을 <em>균등 간격</em>으로 찍습니다. col번째 점의 가로 위치가 바로 <b>cam × 0.577</b>입니다.</li>
<li>눈에서 각 점을 지나는 광선의 각도는 밑변 1, 높이 cam·tan(FOV/2)인 직각삼각형에서 <b>atan(cam · tan(FOV/2))</b>.</li>
</ul>
<p>숫자로 확인해 봅시다. 화면 1/4 지점(col = 160, cam = -0.5)의 광선은 atan(-0.5 × 0.577) = <b>-16.1°</b>입니다. 균등 각도라면 -15°였을 것입니다 — 중앙부의 열들이 각도를 조금씩 더 가져가고, 가장자리 열은 덜 가져갑니다. 평면 스크린에는 이쪽이 정확한 배분입니다.</p>
<div class="note blue">3장에서 말한 lodev의 벡터+카메라평면 방식은 이 "스크린 위 점"을 dir + cam·plane이라는 벡터 덧셈으로 직접 만듭니다. 우리는 같은 점을 각도 하나로 요약한 것뿐 — <em>거리 1의 평면 스크린</em>이라는 그림은 완전히 동일합니다.</div>`},

{t:'벽 찾기 후보 1 — 고정 스텝 행진',k:'RAY MARCH',h:`
<p>각도는 정해졌습니다. 남은 일은 그 방향으로 나아가며 <em>처음 만나는 벽의 t</em>를 찾는 것. 가장 단순한 방법부터 시도해 봅시다 — <b>일정 간격으로 한 발씩 전진하며 검사</b>하는 겁니다.</p>
<pre class="code" data-lang="js">// 순진한 방법: 0.1칸씩 전진하며 벽 검사 (의사코드)
var t = 0;
while (t &lt; MAX_DEPTH) {
  t += 0.1;
  var x = px + Math.cos(ang) * t;
  var y = py + Math.sin(ang) * t;
  if (cell(x | 0, y | 0) &gt; 0) break;   // 벽이다!
}</pre>
<p>5번 슬라이드의 공식 P + d×t를 그대로 반복문에 넣었습니다. 매 걸음마다 연속 좌표를 셀 좌표로 내림(<span class="reg">| 0</span>)해서 3장의 <span class="reg">cell()</span>에 물어보고, 벽이면 멈춥니다. 경계 밖은 벽이므로(3장) 이 루프는 반드시 끝납니다.</p>
<p>단순하고, 이해하기 쉽고, 실제로 동작합니다. 6번 슬라이드의 데모에서 광선 위에 찍히던 점들이 바로 이 t = 0.1, 0.2, 0.3, …의 발자국입니다. 그런데 이 방법에는 두 가지 함정이 있습니다.</p>`},

{t:'고정 스텝의 두 가지 실패',k:'STEP FAILURE',h:`
<p>같은 데모를 다시 불러와, 이번에는 <b>스텝 슬라이더</b>를 움직여 보세요.</p>
<div class="demoWrap"><div class="dTitle">SINGLE RAY MARCH — 스텝 크기 실험</div>
<canvas class="demo" data-demo="rayone" width="512" height="448"></canvas>
<div class="ctl"><label>각도 <input type="range" data-p="ang" min="0" max="360" value="20"><span class="val" data-v="ang"></span></label>
<label>스텝 <input type="range" data-p="step" min="5" max="80" value="8"><span class="val" data-v="step"></span></label></div>
</div>
<div class="grid2">
<div class="card"><h3>실패 1 — 느리다</h3><p>스텝을 잘게 하면 점이 촘촘해지는 만큼 cell() 호출이 폭증합니다. 걸음 대부분은 빈칸 한가운데를 헛짚는 낭비입니다.</p></div>
<div class="card"><h3>실패 2 — 벽을 건너뛴다</h3><p>스텝을 크게 하고 각도를 돌려 보세요. 발자국이 얇은 벽 모서리를 <em>타 넘어</em> 뒤편에 멈추는 순간이 옵니다. 화면에서는 벽에 구멍이 뚫린 듯 뒤가 비쳐 보입니다.</p></div>
</div>
<p>게다가 멈춘 지점도 "마지막 발자국"일 뿐 정확한 벽면이 아니어서, 거리 t에 최대 스텝 크기만큼의 오차가 남습니다. 이 오차는 벽 높이의 계단 현상으로 그대로 드러납니다.</p>`},

{t:'스텝을 줄이면 해결될까',k:'TRADEOFF',h:`
<p>"그럼 스텝을 아주 잘게 하면 되잖아?" — 맞습니다, 정확도는 올라갑니다. 대신 비용을 계산해 봅시다. 광선의 최대 사거리는 <span class="reg">MAX_DEPTH = 24</span>칸입니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>스텝</th><th>광선당 최대 걸음</th><th>640열 × 60fps</th><th>비고</th></tr>
<tr><td>0.1칸</td><td>240걸음</td><td>초당 <b>922만</b> 회 검사</td><td>여전히 벽을 스칠 수 있음</td></tr>
<tr><td>0.01칸</td><td>2,400걸음</td><td>초당 <b>9,200만</b> 회</td><td>JS/파이썬에선 이미 무리</td></tr>
<tr><td>0.001칸</td><td>24,000걸음</td><td>초당 <b>9.2억</b> 회</td><td>그래도 이론상 오차는 남음</td></tr>
</table></div>
<p>정확도를 10배 올릴 때마다 비용도 10배 — 전형적인 <em>나쁜 트레이드오프</em>입니다. 아무리 줄여도 "확실히 안 놓친다"는 보장은 끝내 얻지 못합니다.</p>
<div class="note grn">성능 감각: 인터프리터 언어에서 초당 수백만 회의 함수 호출은 그것만으로 프레임 예산을 다 태웁니다. 우리가 원하는 것은 걸음을 "줄이는" 게 아니라, 걸음 수 자체가 <em>수십 번 수준에서 딱 끝나는</em> 방법입니다.</div>`},

{t:'관찰 — 벽은 격자선 위에만 있다',k:'KEY INSIGHT',h:`
<p>여기서 3장의 제약이 보답을 시작합니다. 우리 세계에서 벽은 셀 전체를 채우므로, 광선이 빈칸에서 벽으로 바뀌는 사건은 <em>셀의 경계를 넘는 순간</em>에만 일어날 수 있습니다.</p>
<p>셀의 경계란 무엇인가요? x = 1, 2, 3, …인 <b>세로 격자선</b>과 y = 1, 2, 3, …인 <b>가로 격자선</b>뿐입니다.</p>
<div class="note"><b>통찰:</b> 광선 위에서 검사할 가치가 있는 지점은 <em>광선이 격자선과 만나는 교차점뿐</em>입니다. 그 사이의 무수한 점들은 검사해 봤자 답이 바뀌지 않습니다 — 셀이 안 바뀌었으니까요.</div>
<p>광선 하나가 사거리 24칸 안에서 만나는 격자선은 많아야 수십 개입니다. 0.01칸 스텝의 2,400걸음과 비교하면, 검사 지점의 <em>99% 이상이 원래부터 불필요</em>했던 셈입니다. 게다가 격자 교차점에서 딱딱 검사하면 벽을 건너뛰는 일도 원천적으로 불가능합니다 — 모든 경계 통과를 빠짐없이 세니까요.</p>`},

{t:'격자 교차점만 뛰어다니기',k:'DDA PREVIEW',h:`
<p>그렇다면 알고리즘은 이렇게 다시 씁니다. 잰걸음 행진 대신, <em>다음 격자 교차점으로 곧장 점프</em>하는 겁니다.</p>
<ol>
<li>현재 위치에서 <b>다음 세로 격자선</b>까지의 광선 거리와, <b>다음 가로 격자선</b>까지의 광선 거리를 구합니다.</li>
<li>둘 중 <em>가까운 쪽</em> 교차점으로 점프하고, 그 격자선 너머의 새 셀을 검사합니다.</li>
<li>벽이면 끝. 빈칸이면 1로 돌아갑니다.</li>
</ol>
<p>이 방법의 이름이 <b>DDA(Digital Differential Analyzer)</b>입니다. 한 번 격자선을 넘을 때마다 "다음 세로선까지의 거리"는 항상 같은 양(<span class="reg">ddx</span>)씩, "다음 가로선까지"는 <span class="reg">ddy</span>씩 늘어난다는 규칙성 덕분에, 루프 한 바퀴가 <em>덧셈 한 번 + 비교 한 번</em>으로 끝납니다. 삼각함수도, 곱셈도 루프 안에 없습니다.</p>
<div class="note blue">다음 5장 전체가 이 알고리즘입니다. 캐노니컬 코드의 <span class="reg">castRay / cast_ray</span> 함수를 한 줄씩 해부하고, 한 걸음씩 실행해 보는 데모로 확인합니다. 위 3단계만 머리에 넣고 넘어가면 충분합니다.</div>`},

{t:'거리에서 벽 높이로',k:'WALL HEIGHT',h:`
<p>광선이 거리를 알아냈다고 합시다. 그 거리는 어떻게 "그림"이 될까요? 미리 보기로 공식 하나만 맛봅니다.</p>
<pre class="code" data-lang="js">lineH = (H / depth) | 0;   // 벽 기둥의 화면 높이(픽셀)</pre>
<pre class="code" data-lang="py">line_h = int(H / depth)    # 같은 식의 파이썬판</pre>
<p><b>높이는 거리에 반비례</b> — 원근법의 수학적 정체가 이 나눗셈 하나입니다. H = 400이므로:</p>
<ul class="b">
<li>거리 1칸 → 400픽셀 (화면을 꽉 채우는 벽)</li>
<li>거리 2칸 → 200픽셀 (절반)</li>
<li>거리 8칸 → 50픽셀 (저 멀리 나지막이)</li>
</ul>
<p>4번 슬라이드 데모에서 본 "높이가 다른 막대들"이 바로 이 식의 출력입니다. 다만 여기서 쓰는 depth는 잰 거리 그대로가 아니라 <em>어안 보정을 거친 수직 거리</em>여야 하는데(<span class="reg">depth = dist × cos(rayAng - ang)</span>), 그 이유와 유도는 6장에서 다룹니다.</p>`},

{t:'레이캐스팅 전체 파이프라인',k:'PIPELINE',h:`
<p>이 장에서 모은 조각을 순서대로 이어 붙이면, 렌더러의 전체 뼈대가 완성됩니다. 벽 그리기의 매 프레임은 정확히 이 순서입니다.</p>
<ol>
<li><b>열 루프</b> — col = 0부터 639까지 반복합니다.</li>
<li><b>각도</b> — cam = 2·col/W - 1, rayAng = ang + atan(cam·tan(FOV/2)). <span class="reg">(11번)</span></li>
<li><b>광선 발사</b> — castRay로 격자를 뛰어다니며 첫 벽을 찾습니다. <span class="reg">(5장)</span></li>
<li><b>거리 보정</b> — depth = dist × cos(rayAng - ang)로 어안을 없앱니다. <span class="reg">(6장)</span></li>
<li><b>높이</b> — lineH = H / depth. <span class="reg">(18번)</span></li>
<li><b>그리기</b> — 화면 col열의 중앙에 높이 lineH의 세로줄을 칠합니다. 위는 천장, 아래는 바닥. <span class="reg">(6~7장)</span></li>
</ol>
<p>캐노니컬 코드의 <span class="reg">renderWalls / render_walls</span>가 글자 그대로 이 6단계입니다. 앞으로 두 장에 걸쳐 3번(5장)과 4~6번(6장)을 완성하면, 처음으로 화면에 <em>걸어 다닐 수 있는 3D 복도</em>가 나타납니다.</p>`},

{t:'DDA — 격자 교차점만 밟는 사다리',k:'GRID LADDER',h:`

{t:'두 종류의 교차 — 세로선과 가로선',k:'SIDE 0 / SIDE 1',h:`
<p>격자선은 두 방향뿐입니다. 광선이 어느 쪽을 넘었는지를 코드에서는

<div class="grid2">
<div class="card"><h3>세로선 교차 — side = 0</h3>
<p>x = 1, 2, 3, … 처럼 <b>x가 정수</b>인 선을 넘는 순간입니다.

<div class="card"><h3>가로선 교차 — side = 1</h3>
<p>y = 1, 2, 3, … 처럼 <b>y가 정수</b>인 선을 넘는 순간입니다.
mapY가 한 칸 변하고, 광선은 벽의 <b>남쪽 또는 북쪽 면</b>에 닿게 됩니다.</p></div>
</div>
<p>비스듬한 광선은 이 두 종류의 교차를 <em>섞어 가며</em> 전진합니다.
어떤 순서로 섞일지는 각도에 따라 다릅니다 — 그 순서를 정확히 결정하는 것이

<div class="note blue">side는 나중에 두 번 더 쓰입니다. 6장에서는 남북면을 어둡게 칠해

{t:'핵심 질문 — 다음 교차까지 광선 길이는?',k:'KEY QUESTION',h:`
<p>현재 위치에서 광선을 따라가면, 다음 세로선 교차와 다음 가로선 교차가
각각 어딘가에서 기다리고 있습니다. DDA는 두 개의 숫자를 계속 들고 다닙니다.</p>
<ul class="b">
<li><b>sideDistX</b> — 출발점부터 <em>다음 세로선 교차까지</em>, 광선을 따라 잰 길이</li>
<li><b>sideDistY</b> — 출발점부터 <em>다음 가로선 교차까지</em>, 광선을 따라 잰 길이</li>
</ul>
<p>매 걸음마다 규칙은 하나뿐입니다. <em>둘 중 짧은 쪽의 교차점이 먼저 온다 —
그쪽으로 전진한다.</em> 전진한 쪽의 sideDist에는 "다음 같은 종류 교차까지의
보폭"을 더해 두면, 두 숫자는 언제나 미래의 교차점 두 개를 가리킵니다.</p>
<div class="note">주의: 두 값은 x거리·y거리가 아니라 모두 <em>광선을 따라 잰 빗변
길이</em>입니다. 같은 단위이기 때문에 서로 비교할 수 있습니다.</div>
<p>참고로 정식 이름은 sideDistX·deltaDistX지만, 우리 코드에서는
<b>sideX</b>·<b>ddx</b>로 줄여 씁니다(Python은 side_x·ddx).</p>`},

{t:'deltaDistX 유도 — x가 1 늘 때 광선은?',k:'DELTA DIST X',h:`
<p>먼저 "보폭"부터 구합니다. <b>deltaDistX(ddx)</b>는 광선이
<em>x방향으로 1칸 진행하는 동안 광선 자체는 얼마나 길어지는가</em>입니다.
각도 θ의 광선 위 한 점은 x(t) = px + t·cosθ (t는 광선 길이). x가 1 늘려면
t는 <b>1/|cosθ|</b> 늘어야 합니다.</p>
<p>그림으로 보면 직각삼각형입니다. <b>밑변</b>(x방향)이 1, <b>빗변</b>(광선)이
ddx — 빗변은 밑변을 cosθ로 나눈 것이니 ddx = |1/cosθ|. 수직에 가까운
광선일수록 세로선 하나를 넘는 데 훨씬 긴 광선이 필요합니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>θ</th><th>cosθ</th><th>ddx = |1/cosθ|</th><th>의미</th></tr>
<tr><td>0°</td><td>1.000</td><td>1.000</td><td>정동쪽 — 최단 보폭</td></tr>
<tr><td>33°</td><td>0.8387</td><td>1.1924</td><td>이 장의 예제 각도</td></tr>
<tr><td>60°</td><td>0.500</td><td>2.000</td><td>세로선 하나에 광선 2칸</td></tr>
<tr><td>89°</td><td>0.0175</td><td>57.30</td><td>거의 수직 — 보폭 폭발</td></tr>
</table></div>
<pre class="code" data-lang="js">var ddx = cos === 0 ? 1e30 : Math.abs(1 / cos);</pre>`},

{t:'deltaDistY와 0으로 나누기',k:'DELTA DIST Y',h:`
<p>y방향도 완전히 대칭입니다. y가 1 늘 때 광선은 <b>ddy = |1/sinθ|</b>만큼
길어집니다. 33°라면 ddy = 1/0.5446 = <b>1.8361</b> — 이 각도에서는 세로선
교차(1.19)가 가로선 교차(1.84)보다 자주 온다는 뜻입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var ddy = sin === 0 ? 1e30 : Math.abs(1 / sin);</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">ddy = abs(1 / sin_a) if sin_a else 1e30</pre>
<div class="note red">θ = 0°(정동)나 180°(정서)면 sin = 0 — <b>0으로 나누기</b>입니다.
Python은 그대로 두면 ZeroDivisionError로 죽고, JS는 Infinity가 되는데
출발점이 정확히 격자선 위면 초기화식 (py - mapY) × Infinity가
0 × ∞ = NaN 폭탄이 되어 모든 비교가 무너집니다.
그래서 두 구현 모두 <em>1e30</em>이라는 "사실상 무한대" 값을 넣습니다.
1e30은 어떤 비교에서도 절대 선택되지 않을 만큼 크면서, 여전히 평범한
유한수라 안전합니다.</div>`},

{t:'최초 sideDist — 셀 안 어디서 출발하나',k:'FIRST CROSSING',h:`
<p>보폭(ddx·ddy)은 각도만으로 정해지지만, <em>첫걸음</em>은 셀 안 어디서
출발하느냐에 달렸습니다. P(1.35, 1.6)이라면 mapX = 1, 그리고
<b>px − mapX = 0.35</b>가 셀 안에서의 소수부(왼쪽 벽에서 잰 위치)입니다.</p>
<ul class="b">
<li>오른쪽(cos&gt;0)으로 가면 다음 세로선은 x = 2 — 가로로 <b>mapX+1−px = 0.65</b> 남음</li>
<li>왼쪽(cos&lt;0)으로 가면 다음 세로선은 x = 1 — 가로로 <b>px−mapX = 0.35</b> 남음</li>
</ul>
<p>이 <em>가로 거리</em>를 광선 길이로 바꾸려면 ddx를 곱하면 됩니다
(ddx가 바로 "가로 1당 광선 길이"이므로). 네 가지 부호 경우를 정리하면:</p>
<div class="tblWrap"><table class="tbl">
<tr><th>방향</th><th>초기 sideDist</th><th>P(1.35, 1.6), 33°의 값</th></tr>
<tr><td>cos &gt; 0 (동)</td><td>(mapX + 1 − px) × ddx</td><td>0.65 × 1.1924 = <b>0.7750</b></td></tr>
<tr><td>cos &lt; 0 (서)</td><td>(px − mapX) × ddx</td><td>0.35 × 1.1924 = 0.4173</td></tr>
<tr><td>sin &gt; 0 (남)</td><td>(mapY + 1 − py) × ddy</td><td>0.40 × 1.8361 = <b>0.7344</b></td></tr>
<tr><td>sin &lt; 0 (북)</td><td>(py − mapY) × ddy</td><td>0.60 × 1.8361 = 1.1017</td></tr>
</table></div>
<p>33° 광선은 동남쪽으로 가므로 굵게 표시한 두 값이 실제 초기값입니다.</p>`},

{t:'step — 어느 쪽으로 걸을까',k:'STEP SIGN',h:`
<p>교차선을 넘을 때 mapX·mapY를 +1 할지 −1 할지도 미리 정해 둡니다.
방향은 순전히 cos·sin의 <em>부호</em>가 결정합니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>조건</th><th>step</th><th>의미</th></tr>
<tr><td>cos &lt; 0</td><td>stepX = −1</td><td>서쪽으로 — 세로선을 넘을 때마다 mapX 감소</td></tr>
<tr><td>cos ≥ 0</td><td>stepX = +1</td><td>동쪽으로 — mapX 증가</td></tr>
<tr><td>sin &lt; 0</td><td>stepY = −1</td><td>북쪽으로 — mapY 감소</td></tr>
<tr><td>sin ≥ 0</td><td>stepY = +1</td><td>남쪽으로 — mapY 증가</td></tr>
</table></div>
<p>기억하세요 — 우리 맵은 <em>y가 아래로 증가</em>합니다.
그래서 sin&gt;0이면 화면 아래쪽, 즉 맵의 남쪽으로 걷습니다.</p>
<div class="note">초기 sideDist의 네 경우(앞 슬라이드)와 step의 네 경우는 같은
if문에서 한꺼번에 정해집니다. 다음 슬라이드에서 코드로 합칩니다.</div>`},

{t:'초기화 코드 전체',k:'INIT CODE',h:`
<p>지금까지의 준비물 — sin·cos, 시작 칸, 보폭 ddx·ddy, 그리고 방향과
첫 sideDist — 를 전부 코드로 옮기면 castRay의 앞부분이 완성됩니다.
canonical 구현 그대로입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var sin = Math.sin(ang), cos = Math.cos(ang);
var mapX = px | 0, mapY = py | 0;
var ddx = cos === 0 ? 1e30 : Math.abs(1 / cos);
var ddy = sin === 0 ? 1e30 : Math.abs(1 / sin);
var stepX, stepY, sideX, sideY, side = 0, i, tile, dist, hit;
if (cos &lt; 0) { stepX = -1; sideX = (px - mapX) * ddx; }
else         { stepX = 1;  sideX = (mapX + 1 - px) * ddx; }
if (sin &lt; 0) { stepY = -1; sideY = (py - mapY) * ddy; }
else         { stepY = 1;  sideY = (mapY + 1 - py) * ddy; }</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">sin_a, cos_a = math.sin(ang), math.cos(ang)
map_x, map_y = int(px), int(py)
ddx = abs(1 / cos_a) if cos_a else 1e30
ddy = abs(1 / sin_a) if sin_a else 1e30
if cos_a &lt; 0:
    step_x, side_x = -1, (px - map_x) * ddx
else:
    step_x, side_x = 1, (map_x + 1 - px) * ddx
if sin_a &lt; 0:
    step_y, side_y = -1, (py - map_y) * ddy
else:
    step_y, side_y = 1, (map_y + 1 - py) * ddy</pre>
<p>JS의 <b>px | 0</b>은 Python의 int(px)와 같은 정수 내림입니다(양수 기준).</p>`},

{t:'라이브 데모 — 한 걸음씩 눌러보기',k:'LIVE DEMO',h:`
<p>이제 눈으로 확인할 시간입니다. <b>한 걸음</b> 버튼을 누를 때마다 DDA가
정확히 한 번 전진합니다.</p>
<div class="demoWrap"><div class="dTitle">DDA STEP BY STEP</div>
<canvas class="demo" data-demo="dda" width="512" height="384"></canvas>
<div class="ctl"><button data-p="step">한 걸음</button><button data-p="auto">자동</button><button data-p="reset">처음부터</button>
<label>각도 <input type="range" data-p="ang" min="5" max="85" value="33"><span class="val" data-v="ang"></span></label></div>
</div>
<ul class="b">
<li><b>파란 점</b> = 이미 밟은 세로선 교차(side=0), <b>노란 점</b> = 가로선 교차(side=1)</li>
<li>반투명 <b>파란 원</b> = 다음 세로 교차 후보(sideDistX 위치),
<b>노란 원</b> = 다음 가로 교차 후보(sideDistY 위치)</li>
<li>왼쪽 아래 숫자가 현재 sideDistX·sideDistY — <em>항상 작은 쪽 원이 먼저
밟히는지</em> 지켜보세요.</li>
</ul>
<p>기본 각도 33°에서는 단 두 걸음 만에 돌벽(2,2)에 명중합니다. 슬라이더로
각도를 바꾸면 처음부터 다시 시작합니다 — 75° 근처의 긴 여행도 꼭 해 보세요.</p>`},

{t:'루프 본체 — 4줄의 마법',k:'DDA LOOP',h:`
<p>초기화가 끝나면 루프는 놀랄 만큼 짧습니다. canonical castRay의 루프
본체 — 실질적인 일은 <em>단 4줄</em>이 다 합니다.</p>
<pre class="code" data-lang="js">for (i = 0; i &lt; 64; i++) {
  if (sideX &lt; sideY) { sideX += ddx; mapX += stepX; side = 0; }
  else               { sideY += ddy; mapY += stepY; side = 1; }
  tile = cell(mapX, mapY);
  if (tile &gt; 0) {
    // 명중! — 거리 계산은 13번째 슬라이드에서
  }
}</pre>
<ul class="b">
<li><b>sideX &lt; sideY</b> — 다음 세로 교차가 더 가깝다는 뜻이니 세로선을 넘습니다.
sideX에 보폭 ddx를 더해 "그다음 세로 교차"를 가리키게 하고, mapX를 한 칸 옮기고,
side=0을 기록합니다.</li>
<li>아니면 가로선을 넘습니다 — 완전히 대칭입니다.</li>
<li>새로 들어간 칸을 <b>cell()</b>로 확인합니다 — 0이 아니면 벽입니다.</li>
</ul>

울펜슈타인 3D의 심장이었습니다.</div>`},

{t:'손으로 따라가기 1 — 33° 광선의 두 걸음',k:'TRACE 1',h:`
<p>데모와 똑같은 조건을 손으로 계산해 봅니다. <b>P(1.35, 1.6)</b>, θ = 33°.
준비물: sin = 0.5446, cos = 0.8387, <b>ddx = 1.1924</b>, <b>ddy = 1.8361</b>,

<div class="tblWrap"><table class="tbl">
<tr><th>단계</th><th>sideX &lt; sideY ?</th><th>행동</th><th>sideX</th><th>sideY</th><th>(mapX,mapY)</th></tr>

<tr><td>걸음 2</td><td>0.7750 &lt; 2.5705? <b>예</b></td><td>세로선 넘음, side=0</td><td>1.9674</td><td>2.5705</td><td>(2, 2)</td></tr>

{t:'손으로 따라가기 2 — HIT 판정',k:'TRACE 2',h:`

  dist = side === 0 ? sideX - ddx : sideY - ddy;
  ...</pre>

광선을 막습니다. 종류는 그대로 반환해 어떤 텍스처를 칠할지 알려 줍니다.</li>
<li>마지막 걸음이 side = 0(세로선)이었으므로 거리는 sideX 쪽에서 꺼냅니다:

<div class="note">왜 sideX에서 ddx를 도로 빼는 걸까요? 다음 슬라이드에서

{t:'명중 거리 — 이미 더한 한 걸음 빼기',k:'HIT DISTANCE',h:`
<p>루프의 순서를 다시 보세요. 전진할 때 우리는 <em>sideX += ddx를 먼저</em>

넘은 교차점까지의 거리 — 한 보폭을 도로 빼면 됩니다.</p>
<pre class="code" data-lang="js">dist = side === 0 ? sideX - ddx : sideY - ddy;
if (dist &lt; 1e-4) dist = 1e-4;</pre>
<p>예제로 확인: 걸음 2 직후 sideX = 1.9674. 여기서 ddx = 1.1924를 빼면
<b>0.7750</b> — 걸음 2를 내딛기 <em>직전의</em> sideX와 정확히 같습니다.

전부입니다.</p>
<div class="note">두 번째 줄의 1e-4 하한은 6장을 위한 보험입니다. 벽에 코를 박고
서 있으면 dist가 0에 수렴하는데, 6장에서 화면 높이를 H/거리로 계산하므로
0이면 무한대 벽이 됩니다. 최소 거리를 강제해 폭주를 막습니다.</div>`},

{t:'벽면 어디를 맞췄나 — wallX',k:'WALL X',h:`
<p>거리만으로는 부족합니다. 7장에서 텍스처를 입히려면 <em>벽면의 어느

x = px + dist·cos, y = py + dist·sin.</p>
<pre class="code" data-lang="js">hit = side === 0 ? py + dist * sin : px + dist * cos;
return [tile, dist, hit - Math.floor(hit), side];</pre>
<p>예제 광선: x = 1.35 + 0.7750 × 0.8387 = <b>2.0000</b> —
정확히 세로 격자선 위입니다(우리가 세로선을 넘어 명중했으니 당연합니다).
y = 1.6 + 0.7750 × 0.5446 = <b>2.0221</b>. 정수 x는 아무 정보가 없으므로
<em>변하는 쪽 좌표의 소수부</em>만 취합니다:
wallX = 2.0221 − 2 = <b>0.0221</b> — 벽면을 0~1로 봤을 때 2.2% 지점.</p>
<ul class="b">
<li>side = 0(세로면 명중) → y좌표 py + dist·sin의 소수부</li>
<li>side = 1(가로면 명중) → x좌표 px + dist·cos의 소수부</li>
</ul>
<div class="note blue">7장 예고: texX = (wallX × 64) | 0 — 이 0.0221이 64픽셀
텍스처의 1번 세로줄을 고릅니다. 벽면 위 위치가 곧 텍스처 좌표입니다.</div>`},

{t:'side가 알려주는 것',k:'SIDE INFO',h:`
<p>castRay가 반환하는 네 값 중 마지막 side(0/1)는 작지만 두 가지 큰 일을 합니다.</p>
<div class="grid2">
<div class="card"><h3>① 그늘 효과 — 공짜 입체감</h3>
<p>side = 1(남북면)을 62% 밝기로 어둡게 칠하면, 벽 모서리에서 두 면의 밝기가
갈라지며 3D 입체감이 살아납니다. 광원 계산 없이 얻는 고전 울펜슈타인의
트릭 — 6장에서 fog *= 0.62 한 줄로 구현합니다.</p></div>
<div class="card"><h3>② wallX의 축 선택</h3>
<p>세로선 명중(side=0)이면 x는 정수라 정보가 없으니 <b>y좌표</b>의 소수부를,
가로선 명중(side=1)이면 <b>x좌표</b>의 소수부를 wallX로 씁니다.
앞 슬라이드의 삼항 연산자가 바로 이 선택입니다.</p></div>
</div>
<p>정리하면 castRay의 반환값은 <b>[tile, dist, wallX, side]</b> —
"무엇을(재질), 얼마나 멀리서(거리), 어느 지점에(텍스처 좌표), 어느 면으로(명암)"
맞았는지의 완전한 답안지입니다.</p>`},

{t:'완성된 castRay — JavaScript 전문',k:'FULL CODE JS',h:`
<p>부품이 모두 모였습니다. 초기화(8번째 슬라이드) + 루프(10번째) + 명중
처리(12~14번째)를 이어 붙인 canonical <b>castRay</b> 전문입니다.
25줄 — 이 함수가 매 프레임 640번(열마다 한 번) 호출됩니다.</p>
<pre class="code" data-lang="js">// ---------- 6. DDA 레이캐스팅 ----------
// 반환: [맞은 칸 값, 거리, 벽면 위 x좌표(0~1), 남북면 여부]
function castRay(px, py, ang) {
  var sin = Math.sin(ang), cos = Math.cos(ang);
  var mapX = px | 0, mapY = py | 0;
  var ddx = cos === 0 ? 1e30 : Math.abs(1 / cos);
  var ddy = sin === 0 ? 1e30 : Math.abs(1 / sin);
  var stepX, stepY, sideX, sideY, side = 0, i, tile, dist, hit;
  if (cos &lt; 0) { stepX = -1; sideX = (px - mapX) * ddx; }
  else         { stepX = 1;  sideX = (mapX + 1 - px) * ddx; }
  if (sin &lt; 0) { stepY = -1; sideY = (py - mapY) * ddy; }
  else         { stepY = 1;  sideY = (mapY + 1 - py) * ddy; }
  for (i = 0; i &lt; 64; i++) {
    if (sideX &lt; sideY) { sideX += ddx; mapX += stepX; side = 0; }
    else               { sideY += ddy; mapY += stepY; side = 1; }
    tile = cell(mapX, mapY);
    if (tile &gt; 0) {
      dist = side === 0 ? sideX - ddx : sideY - ddy;
      if (dist &lt; 1e-4) dist = 1e-4;
      hit = side === 0 ? py + dist * sin : px + dist * cos;
      return [tile, dist, hit - Math.floor(hit), side];
    }
  }
  return [1, MAX_DEPTH, 0, 0];
}</pre>`},

{t:'완성된 cast_ray — Python 전문',k:'FULL CODE PY',h:`
<p>같은 알고리즘의 pygame 판입니다. 로직은 한 줄도 다르지 않고,
표현만 파이썬답게 바뀌었습니다.</p>
<pre class="code" data-lang="py"># ---------- 6. DDA 레이캐스팅 ----------
def cast_ray(px, py, ang):
    """(맞은 칸 값, 거리, 벽면 x좌표 0~1, 남북면 여부)를 돌려준다."""
    sin_a, cos_a = math.sin(ang), math.cos(ang)
    map_x, map_y = int(px), int(py)
    # 한 칸 이동에 필요한 광선 길이
    ddx = abs(1 / cos_a) if cos_a else 1e30
    ddy = abs(1 / sin_a) if sin_a else 1e30
    if cos_a &lt; 0:
        step_x, side_x = -1, (px - map_x) * ddx
    else:
        step_x, side_x = 1, (map_x + 1 - px) * ddx
    if sin_a &lt; 0:
        step_y, side_y = -1, (py - map_y) * ddy
    else:
        step_y, side_y = 1, (map_y + 1 - py) * ddy
    side = 0
    for _ in range(64):
        if side_x &lt; side_y:                 # 다음 세로 격자선이 더 가깝다
            side_x += ddx
            map_x += step_x
            side = 0
        else:                               # 다음 가로 격자선이 더 가깝다
            side_y += ddy
            map_y += step_y
            side = 1
        tile = cell(map_x, map_y)
        if tile &gt; 0:
            dist = (side_x - ddx) if side == 0 else (side_y - ddy)
            hit = (py + dist * sin_a) if side == 0 else (px + dist * cos_a)
            return tile, max(dist, 1e-4), hit - int(hit), side
    return 1, MAX_DEPTH, 0.0, 0</pre>
<ul class="b">
<li>배열 대신 <b>튜플</b>로 반환 — tile, dist, wall_x, side = cast_ray(...)로 받습니다.</li>
<li>if (dist &lt; 1e-4) 대신 <b>max(dist, 1e-4)</b> — 같은 하한 처리의 파이썬식 표현.</li>
<li>0 나누기 가드는 삼항식 <b>if cos_a else 1e30</b>으로 — cos_a가 0.0이면 거짓입니다.</li>
</ul>`},

{t:'최대 반복 64회 — 왜 안전한가',k:'LOOP BOUND',h:`
<p>루프가 for i in 64회로 잘려 있는데, 벽을 못 만나고 64번이 끝나 버리면
어쩌죠? 걱정은 산수로 지웁니다.</p>
<ul class="b">
<li>맵은 <b>16 × 14</b>칸. 맵을 완전히 가로지르는 광선이라도 세로선은 최대
16개, 가로선은 최대 14개 — 아무리 후하게 세어도 <b>30걸음</b>이면 맵 끝입니다.</li>
<li>게다가 맵 테두리는 전부 벽(1)이고, cell()은 <em>맵 밖 좌표에 무조건 1을
반환</em>합니다. 광선이 어디로 가든 늦어도 테두리에서 반드시 멈춥니다.</li>
</ul>
<pre class="code" data-lang="js">function cell(x, y) {
  if (x &lt; 0 || y &lt; 0 || x &gt;= MAP_W || y &gt;= MAP_H) return 1;
  return world[y][x];
}</pre>
<p>즉 64는 이론상 최대치(≈30)의 두 배가 넘는 <em>안전 마진</em>입니다.
그래도 만에 하나를 위해 탈출 시 <b>[1, MAX_DEPTH, 0, 0]</b> —
"아주 먼 벽돌벽" — 을 반환해 호출자가 절대 빈손이 되지 않게 합니다.</p>
<div class="note grn">맵을 64×64로 키운다면 상한도 함께 키워야 합니다(예: 128).
상한 루프는 무한 루프 버그를 프레임 멈춤 대신 "이상한 벽 하나"로 바꿔 주는
값싼 보험입니다.</div>`},
