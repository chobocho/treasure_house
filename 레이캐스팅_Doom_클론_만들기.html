<div class="note">화면 640열 × 각 열마다 세로 막대 하나 = 3D 화면.
레이캐스터는 결국 <em>막대그래프를 그리는 프로그램</em>입니다.</div>`},

{t:'투영 공식 유도 — 닮은 삼각형',k:'PROJECTION',h:`
<p>"멀수록 작게"를 정확한 숫자로 만들어 봅시다. 눈에서 거리 d만큼 떨어진 곳에
실제 높이 <b>1</b>(칸 단위)짜리 벽이 서 있습니다. 눈앞 거리 D에 유리판(투영면
= 화면)을 세우면, 벽 꼭대기에서 눈으로 오는 빛이 유리판을 지나는 자리가
화면상의 벽 높이 h입니다.</p>
<p>벽 꼭대기–눈–바닥이 만드는 큰 삼각형과, 유리판이 잘라낸 작은 삼각형은
<em>닮은꼴</em>입니다. 닮음비는 거리비 그대로:</p>
<div class="note"><b>h / D = 1 / d</b>&nbsp;&nbsp;→&nbsp;&nbsp;<b>h = D / d</b>
— 화면 높이는 거리에 정확히 반비례합니다.</div>
<p>D는 우리가 정하는 값입니다. <em>거리 1에서 벽이 화면을 꽉 채우도록</em>
D = H(화면 높이 400px)로 잡으면 공식은 이렇게 단순해집니다:</p>
<div class="note"><b>lineH = H / d</b> — 거리 1이면 400px, 거리 2면 200px,
거리 4면 100px…</div>
<p>상수 하나 없는 나눗셈 한 번. 이 한 줄이 원근법의 전부입니다.</p>`},

{t:'lineH = H / depth — 단 한 줄',k:'ONE LINE',h:`
<p>canonical 코드에서 원근법은 정말로 한 줄입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">lineH = (H / depth) | 0;</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">line_h = int(H / depth)</pre>
<p>(depth는 잠시 후 9번째 슬라이드에서 보정을 거친 거리입니다. 지금은
"광선이 잰 거리"로 읽어 두세요.) 640×400 해상도에서 실제 값을 뽑아 보면:</p>
<div class="tblWrap"><table class="tbl">
<tr><th>depth (칸)</th><th>lineH = 400 / depth</th><th>화면에서의 모습</th></tr>
<tr><td>0.5</td><td>800px</td><td>화면보다 큼 — 클리핑 필요 (5번째 슬라이드)</td></tr>
<tr><td>1</td><td>400px</td><td>화면을 정확히 꽉 채움</td></tr>
<tr><td>2</td><td>200px</td><td>화면의 절반</td></tr>
<tr><td>4</td><td>100px</td><td>화면의 1/4</td></tr>
<tr><td>8</td><td>50px</td><td>가느다란 띠</td></tr>
<tr><td>16</td><td>25px</td><td>복도 저 끝</td></tr>
</table></div>
<p>JS의 <b>| 0</b>은 소수부를 버리는 정수화입니다 — 픽셀 개수는 정수여야
하니까요. 5장에서 dist에 1e-4 하한을 둔 이유도 여기서 드러납니다:
depth가 0이면 이 나눗셈이 무한대로 폭발합니다.</p>`},

{t:'화면 세로 중앙 정렬 — 천장·벽·바닥',k:'CENTERING',h:`
<p>키 lineH짜리 막대를 화면 어디에 세울까요? 눈높이가 벽의 정중앙이므로
막대도 <em>화면 세로 중앙</em>(HALF_H = 200)에 맞춰 세웁니다.
위 절반과 아래 절반이 똑같이 나뉘도록:</p>
<pre class="code" data-lang="js">y0 = HALF_H - (lineH &gt;&gt; 1); y1 = y0 + lineH;</pre>
<p>(<b>&gt;&gt; 1</b>은 2로 나누는 비트 시프트입니다.) depth = 2인 열이라면
lineH = 200, y0 = 200 − 100 = <b>100</b>, y1 = <b>300</b>. 이 열의 400픽셀은
세 구간으로 나뉩니다:</p>
<div class="tblWrap"><table class="tbl">
<tr><th>구간</th><th>픽셀 y</th><th>내용</th></tr>
<tr><td>위</td><td>0 ~ y0 (0~99)</td><td>천장</td></tr>
<tr><td>가운데</td><td>y0 ~ y1 (100~299)</td><td><b>벽</b> — lineH픽셀</td></tr>
<tr><td>아래</td><td>y1 ~ 400 (300~399)</td><td>바닥</td></tr>
</table></div>
<p>모든 열이 이 3분할 구조를 갖고, 열마다 y0·y1만 달라집니다. 가까운 벽일수록
가운데 구간이 커져 천장·바닥을 밀어냅니다 — 그것이 우리가 "다가간다"고
느끼는 이유입니다.</p>`},

{t:'클리핑 — 벽이 화면보다 클 때',k:'CLIPPING',h:`
<p>depth = 0.5면 lineH = 800, y0 = 200 − 400 = <b>−200</b>, y1 = 600.
화면은 0~399뿐인데 말이죠. 존재하지 않는 픽셀에 쓰지 않도록 범위를 화면
안으로 잘라냅니다 — canonical renderWalls의 두 줄:</p>
<pre class="code" data-lang="js">if (y0 &lt; 0) y0 = 0;
if (y1 &gt; H) y1 = H;</pre>
<p>이 장의 데모 렌더러는 원본 y0·y1을 보존하려고 잘라낸 값을
<b>cy0·cy1</b>이라는 별도 변수에 담습니다 — 이름만 다를 뿐 같은 클리핑입니다.
원본 lineH를 기억해 두는 이유는 7장에서 드러납니다: 화면 밖으로 잘려 나간
부분만큼 <em>텍스처도 건너뛰고</em> 읽어야 하기 때문입니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">else:                                    # 벽이 화면보다 훨씬 클 때
    vis = pygame.Rect(0, int((0 - y0) / line_h * TEX), 1,
                      max(1, int(H / line_h * TEX)))
    vis = vis.clip(column.get_rect())
    column = pygame.transform.scale(column.subsurface(vis), (1, H))
    buf.blit(column, (col, 0))</pre>
<p>pygame판은 한 걸음 더 나갑니다. 벽에 코를 박으면 line_h가 수천 픽셀이
되는데, 그 거대한 이미지를 만들었다 버리는 대신 <em>보이는 조각(vis)만 잘라</em>
확대합니다 — 같은 클리핑을 성능을 위해 텍스처 쪽에서 하는 것입니다.</p>`},

{t:'첫 3D 화면 — 단색 벽 걷기',k:'LIVE DEMO',h:`
<p>lineH와 3분할만으로 이미 3D가 됩니다. 걸어 보세요 — 데모 아래
방향 버튼으로 회전·전진할 수 있습니다.</p>
<div class="demoWrap"><div class="dTitle">FLAT WALLS — 첫 3D 화면</div>
<canvas class="demo" data-demo="untex" width="320" height="200"></canvas>
<div class="padBtns"><button data-k="L">⟲</button><button data-k="U">▲</button><button data-k="D">▼</button><button data-k="R">⟳</button></div>
</div>
<ul class="b">
<li>벽 색은 타일 종류별 단색입니다 — 벽돌은 붉게, 돌은 회색, 금속은 푸르게.
텍스처는 7장에서 입힙니다.</li>
<li>다가가면 막대가 커지고 물러서면 작아지는 것, 그것뿐인데 완전한 공간감이
생깁니다.</li>
<li>이 장 뒷부분에서 배울 명암 처리(그늘·거리 안개)가 미리 켜져 있어 면과
깊이가 구분됩니다.</li>
</ul>
<div class="note">지금 보고 있는 것이 1992년 울펜슈타인 3D의 화면 구성
그대로입니다 — 640개의 세로 막대, 프레임마다 다시 계산.</div>`},

{t:'그런데 벽이 불룩하다',k:'FISHEYE',h:`
<p>그런데 방금 데모에는 사실 보정 하나가 미리 켜져 있었습니다. 그걸 끄면
평평해야 할 벽이 화면 가운데에서 <em>볼록하게 부풀어</em>
보입니다. 아래 데모는 카메라가 벽을 정면으로 보며
좌우로 천천히 흔들리는 장면입니다 — <b>아직 버튼을 누르지 말고</b> 원래
상태(보정 OFF)를 관찰하세요.</p>
<div class="demoWrap"><div class="dTitle">FISHEYE — 보정 OFF 관찰</div>
<canvas class="demo" data-demo="fisheye" width="512" height="240"></canvas>
<div class="ctl"><button data-p="fix">보정 OFF (원래 거리)</button></div>
</div>
<ul class="b">
<li>벽 윗선과 아랫선이 직선이 아니라 <b>곡선</b>으로 휩니다.</li>
<li>고개를 돌리면 곡면이 따라 움직여 물속을 걷는 듯한 어지러움이 생깁니다.</li>
</ul>
<p>이것이 초기 레이캐스터 제작자들이 전부 한 번씩 밟은 함정,
<b>어안(fisheye) 왜곡</b>입니다. 코드는 틀린 곳이 없습니다 — 틀린 것은
우리가 쓴 <em>거리의 정의</em>입니다. 다음 슬라이드에서 범인을 잡습니다.</p>`},

{t:'어안의 원인 — 유클리드 거리',k:'WHY FISHEYE',h:`
<p>3칸 앞에 벽이 정면으로 서 있다고 합시다. 화면 중앙의 광선은 벽까지
<b>3.000</b>칸을 날아갑니다. 그런데 FOV 60°의 가장자리 광선은 시선에서 30°
기울어져 있어서, <em>같은 벽</em>인데도 비스듬히 더 멀리 날아갑니다:
3 / cos30° = <b>3.464</b>칸.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>광선</th><th>시선과의 각도</th><th>광선 길이(유클리드)</th><th>lineH = 400/거리</th></tr>
<tr><td>화면 중앙</td><td>0°</td><td>3.000</td><td><b>133px</b></td></tr>
<tr><td>중간</td><td>15°</td><td>3.106</td><td>128px</td></tr>
<tr><td>화면 가장자리</td><td>30°</td><td>3.464</td><td><b>115px</b></td></tr>
</table></div>
<p>같은 벽인데 중앙은 133px, 가장자리는 115px — 가운데가 부풀 수밖에 없습니다.
광선이 실제로 날아간 길이(유클리드 거리)는 <em>정확한 값</em>이지만,
원근법이 원하는 값이 아니었던 것입니다. 우리 눈이 "벽이 평평하다"고 느끼는
기준은 광선 길이가 아니라 <b>벽이 나에게서 얼마나 떨어져 있는가</b> —
시선 방향으로 잰 거리입니다.</p>
<div class="note red">고전적 실수: dist를 그대로 H/dist에 넣는 것.
거리가 틀린 게 아니라 <em>어떤 거리를 쓰느냐</em>가 문제입니다.</div>`},

{t:'해결 — 수직 거리 perpDist',k:'PERP DIST',h:`
<p>해결책은 광선 길이를 시선 방향 성분으로 <em>투영</em>하는 것입니다.
광선이 시선과 이루는 각을 β = rayAng − player.ang라 하면, 시선 방향 성분은
cos β를 곱해 얻습니다. 이 값을 <b>수직 거리(perpendicular distance)</b>,
코드에서는 <b>depth</b>라 부릅니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">depth = dist * Math.cos(rayAng - player.ang);      // 어안 보정
zbuf[col] = depth;</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">depth = dist * math.cos(ray_ang - pl.ang)   # 어안 보정</pre>
<p>앞 슬라이드의 가장자리 광선으로 검산: 3.464 × cos 30° = <b>3.000</b>.
중앙 광선은 3.000 × cos 0° = 3.000. 정면 벽 위의 <em>모든</em> 광선이
같은 depth를 갖게 되어, lineH가 모두 133px — 벽이 평평해집니다.</p>
<div class="note">이후의 모든 계산 — 벽 높이, 안개, 스프라이트 가림 판정용
zbuf — 은 dist가 아니라 <b>depth</b>를 씁니다. 원시 dist를 그대로 쓰는 곳은
이제 없습니다.</div>`},

{t:'보정 ON — 직접 비교해 보세요',k:'LIVE DEMO',h:`
<p>같은 데모를 다시 불러왔습니다. 이번에는 <b>버튼을 눌러</b> 보정을 켜고
꺼 보세요 — cos 한 번의 효과를 눈으로 비교할 수 있습니다.</p>
<div class="demoWrap"><div class="dTitle">FISHEYE — 보정 ON/OFF 비교</div>
<canvas class="demo" data-demo="fisheye" width="512" height="240"></canvas>
<div class="ctl"><button data-p="fix">보정 OFF (원래 거리)</button></div>
</div>
<ul class="b">
<li><b>보정 OFF</b> — 그냥 dist 사용: 벽 가운데가 불룩하고, 카메라가 흔들릴
때마다 곡면이 출렁입니다.</li>
<li><b>보정 ON</b> — perpDist = dist × cos(θ−φ): 벽의 윗선·아랫선이 자로 그은
듯한 직선이 되고, 흔들려도 평평함이 유지됩니다.</li>
</ul>
<p>바뀐 것은 코드 한 줄, 곱셈 한 번입니다. 화면 위 캡션에도 현재 어떤 거리를
쓰는지 표시됩니다. 여러 번 토글하며 벽의 윤곽선에 집중해 보세요 —
한 번 보이기 시작하면 어안 왜곡은 절대 못 지나칩니다.</p>`},

{t:'cos 보정의 기하학적 의미',k:'GEOMETRY',h:`
<p>dist × cos β는 단순한 요령이 아니라 분명한 기하학입니다. 광선 벡터를
시선 방향에 <em>정사영</em>한 길이 — 즉 명중점에서 <b>카메라 평면</b>(플레이어를
지나며 시선에 수직인 직선)에 수선을 내렸을 때의 거리입니다.</p>
<ul class="b">
<li>정면 벽은 카메라 평면과 평행합니다. 벽 위의 모든 점은 카메라 평면에서
<em>같은 수직 거리</em>에 있습니다 → 모든 열의 lineH가 같음 → 평평.</li>
<li>비스듬한 벽은 열마다 수직 거리가 선형으로 변합니다 → 높이가 매끈하게
변하는 직선 원근 — 우리가 기대하는 바로 그 모습.</li>
</ul>
<p>"눈(한 점)에서의 거리"가 아니라 "평면에서의 거리"를 쓰는 것 —
투영면이 평면이니 거리 기준도 평면이어야 한다는, 대칭의 문제였습니다.</p>
<div class="note blue">깊이 파기: 유명한 Lodev 튜토리얼은 광선을 각도가 아니라
<em>방향 벡터 + 카메라 평면 벡터</em>(rayDir = dir + plane·cam)로 만듭니다.
그 방식의 DDA가 반환하는 sideDist는 처음부터 카메라 평면 기준이라
<b>보정이 자동</b>입니다 — cos을 곱할 필요가 없습니다. 우리는 각도 기반이라
cos 한 줄이 명시적으로 필요하고, 결과는 수학적으로 동일합니다.</div>`},

{t:'벽면 명암 — side로 입체감',k:'SIDE SHADE',h:`
<p>높이가 정확해도 모든 벽이 같은 밝기면 종이 상자처럼 밋밋합니다.
5장의 <b>side</b>가 여기서 빛납니다 — 남북면(side=1)을 동서면보다 어둡게
칠하면, 벽 모서리마다 두 면의 밝기가 갈라지며 입체감이 살아납니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">if (side === 1) fog *= 0.62;                       // 남북 벽면은 그늘</pre>
<p>62%라는 값은 취향입니다 — 너무 어두우면 부자연스럽고, 90%면 티가 안
납니다. pygame판은 픽셀 곱셈이 느리므로 <em>어두운 텍스처를 미리 만들어</em>
두고 side에 따라 골라 씁니다:</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py"># 어두운 버전(그늘진 남북 벽면용)을 미리 만들어 둔다
dark = surf.copy()
dark.fill((128, 128, 128), special_flags=pygame.BLEND_MULT)
texs[tid + 100] = dark</pre>
<pre class="code" data-lang="py">tex = texs[tile + (100 if side == 1 else 0)]</pre>
<div class="note">광원도 법선 벡터도 없이 if문 하나로 얻는 조명 효과 —
울펜슈타인 3D부터 내려오는 30년 된 트릭입니다. 해는 항상 동쪽(또는 서쪽)에
떠 있는 셈입니다.</div>`},

{t:'거리 안개 — 멀수록 어둡게',k:'DISTANCE FOG',h:`
<p>두 번째 명암은 <b>거리 안개</b>입니다. 멀리 있는 벽일수록 어둡게 칠하면
복도 끝이 어둠 속으로 사라지며 깊이감이 극적으로 살아납니다 — Doom 특유의
음침한 라이트 감쇠를 흉내 내는 가장 값싼 방법입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">fog = 1 - Math.min(1, depth / 14);                 // 거리 안개</pre>
<p>fog는 "밝기 배율"입니다: depth 0이면 1.0(원래 밝기), 7이면 0.5,
<b>14칸 이상이면 0 — 완전한 어둠</b>입니다. 이 값에 앞 슬라이드의 그늘
(× 0.62)이 곱으로 겹쳐집니다. pygame판은 방향이 반대입니다 — 밝기를 줄이는
대신 <em>검은 막의 불투명도를 올립니다</em>:</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py"># 거리 안개(멀수록 어둡게)
fog = min(1.0, depth / 12.0)
if fog &gt; 0.05:
    shade = pygame.Surface((1, min(line_h, H)))
    shade.set_alpha(int(fog * 180))
    buf.blit(shade, (col, max(y0, 0)))</pre>
<p>검은 1픽셀 세로줄을 반투명(최대 알파 180)으로 덮는 방식 — 픽셀 루프 없이
같은 효과를 냅니다. 여기서도 depth를 씁니다. dist로 안개를 계산하면 고개를
돌릴 때마다 화면 가장자리가 어두워지는 "안개 어안"이 생깁니다.</p>`},

{t:'색을 어둡게 하는 법 — shade 함수',k:'SHADE',h:`
<p>fog 배율을 실제 색에 적용하는 일꾼이 <b>shade</b> 함수입니다. 32비트로
포장된 색을 R·G·B 채널로 분해해 각각 f배 하고 도로 포장합니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">function shade(c, f) {           // 색 c 를 f(0~1) 배율로 어둡게
  var r = (c &amp; 255) * f, g = ((c &gt;&gt; 8) &amp; 255) * f, b = ((c &gt;&gt; 16) &amp; 255) * f;
  return rgb(r | 0, g | 0, b | 0);
}</pre>
<ul class="b">
<li><b>c &amp; 255</b> — 최하위 8비트(R 채널)만 남기는 마스크.</li>
<li><b>(c &gt;&gt; 8) &amp; 255</b> — 8비트 밀어낸 뒤 마스크: G 채널. B는 16비트.</li>
<li>곱한 결과는 소수가 되므로 <b>| 0</b>으로 정수화해 재포장합니다.</li>
</ul>
<p>"어둡게"만 있고 "밝게"가 없는 점에 주목하세요 — f는 항상 0~1이라
곱해도 255를 넘칠 일이 없고, 덕분에 클램프 검사도 필요 없습니다.
이 장의 라이브 데모들이 쓰는 shadeC도 공식이 완전히 같은 함수입니다.
pygame판은 이 일을 BLEND_MULT(12번째 슬라이드)와 알파 오버레이(13번째)가
대신합니다.</p>
<div class="note grn">shade는 프레임당 수십만 번 불리는 최심부 함수입니다.
비트 연산만으로 구성된 이유 — 함수 호출보다 비싼 것을 안에 넣지 않기.</div>`},

{t:'픽셀을 직접 찍기 — ImageData와 Uint32Array',k:'PIXEL BUFFER',h:`
<p>fillRect를 픽셀마다 부르면 JS 캔버스는 수십만 번의 API 호출에 질식합니다.
canonical JS판은 <em>메모리에 픽셀을 직접 쓰는</em> 파이프라인을 씁니다.</p>
<pre class="code" data-lang="js">var canvas = document.getElementById('screen');
var ctx = canvas.getContext('2d');
var image = ctx.createImageData(W, H);
var pix = new Uint32Array(image.data.buffer);   // 화면 전체 픽셀 버퍼
var zbuf = new Float64Array(W);</pre>
<ul class="b">
<li><b>createImageData(W, H)</b> — 640×400 = 256,000픽셀짜리 바이트 배열
(RGBA 4바이트씩)을 만듭니다.</li>
<li><b>Uint32Array(image.data.buffer)</b> — 같은 메모리를 <em>32비트 정수의
창</em>으로 다시 봅니다. 픽셀 하나 = 원소 하나: pix[y * W + col] = 색.</li>
<li>프레임 마지막에 딱 한 번 <b>ctx.putImageData(image, 0, 0)</b> — 버퍼
전체를 화면에 복사합니다.</li>
</ul>
<pre class="code" data-lang="js">ctx.putImageData(image, 0, 0);      // 픽셀 버퍼를 화면에 복사한 뒤</pre>
<p>그리기 API 호출은 프레임당 <em>한 번</em>, 나머지는 순수한 배열 대입 —
자바스크립트가 소프트웨어 렌더러 노릇을 할 수 있는 비결입니다.
zbuf(열마다 depth 기록)는 9장의 스프라이트 가림 판정에 쓰입니다.</p>`},

{t:'리틀엔디언 ABGR의 함정',k:'ABGR',h:`
<p>Uint32로 픽셀을 쓸 때 반드시 알아야 할 함정이 있습니다. canonical의
색 포장 함수를 보세요 — R이 최하위, B가 &lt;&lt;16, 알파가 최상위입니다:</p>
<pre class="code" data-lang="js">function rgb(r, g, b) { return (0xff000000 | (b &lt;&lt; 16) | (g &lt;&lt; 8) | r) &gt;&gt;&gt; 0; }</pre>
<div class="note red">"RGB니까 r &lt;&lt; 16이겠지"라고 쓰면 <b>빨강과 파랑이
뒤바뀐</b> 세상이 됩니다 — 벽돌이 파랗게 나오는 고전 버그. ImageData의
바이트 순서는 메모리상 R, G, B, A인데, x86·ARM은 <em>리틀엔디언</em>이라
32비트 정수의 최하위 바이트가 첫 바이트(R)에 대응합니다. 그래서 정수로 보면
0xAABBGGRR — 이른바 <b>ABGR</b> 포장입니다.</div>
<ul class="b">
<li>0xff000000 — 알파 255(불투명). 이걸 빼먹으면 화면이 투명해집니다.</li>
<li><b>&gt;&gt;&gt; 0</b> — JS의 비트 연산은 부호 있는 32비트라 0xff000000이
음수가 되는데, 부호 없는 시프트로 양의 정수로 되돌립니다.</li>
</ul>
<p>이 rgb()로 만든 값만 pix에 쓰면 채널 순서는 완벽히 일관됩니다 —
텍스처(3장에서 생성)도 shade도 전부 이 함수를 거칩니다.</p>`},

{t:'pygame은 서브서페이스 확대',k:'PYGAME SCALE',h:`
<p>같은 벽 한 열을 pygame은 전혀 다르게 그립니다. 픽셀 루프 대신
<em>텍스처의 1픽셀 세로줄을 잘라(subsurface) 원하는 높이로 확대(scale)해
붙입니다(blit)</em>:</p>
<pre class="code" data-lang="py">tex = texs[tile + (100 if side == 1 else 0)]
tex_x = int(wall_x * TEX) % TEX
# 텍스처 한 줄(1xTEX)을 잘라 세로로 늘려 붙인다
column = tex.subsurface(tex_x, 0, 1, TEX)
y0 = HALF_H - line_h // 2
if line_h &lt; H * 3:
    column = pygame.transform.scale(column, (1, line_h))
    buf.blit(column, (col, y0))</pre>
<p>subsurface는 복사가 아니라 원본을 들여다보는 <em>창</em>이라 공짜이고,
scale과 blit은 pygame 내부의 C 코드가 처리합니다. 파이썬 쪽 일은 열당
함수 호출 몇 번이 전부입니다.</p>
<div class="note grn">왜 JS처럼 픽셀 루프를 안 돌까요? 640×400 = 초당
1,500만 픽셀(60fps)인데, 순수 파이썬의 픽셀당 처리는 인터프리터 오버헤드
때문에 JS보다 수십~수백 배 느립니다. <em>"파이썬에서는 루프를 C에게
넘겨라"</em> — set_at으로 한 픽셀씩 찍는 대신 subsurface/scale/blit을 쓰는
이유이자, 텍스처를 시작 시 한 번만 만들어 두는(3장) 이유입니다.</div>`},

{t:'열 하나 그리기 — 전체 코드',k:'ONE COLUMN',h:`
<p>이 장의 모든 조각을 조립합니다. canonical renderWalls에서 <em>열 하나</em>를
처리하는 부분 전체입니다 — for (col = 0; col &lt; W; col++) 루프의 몸통:</p>
<pre class="code" data-lang="js">// 화면 x좌표 → 광선 각도 (탄젠트 기반: 균등 간격 투영면)
cam = 2 * col / W - 1;
rayAng = player.ang + Math.atan(cam * Math.tan(FOV / 2));
hitData = castRay(player.x, player.y, rayAng);
tile = hitData[0]; dist = hitData[1]; wallX = hitData[2]; side = hitData[3];
depth = dist * Math.cos(rayAng - player.ang);      // 어안 보정
zbuf[col] = depth;
lineH = (H / depth) | 0;
y0 = HALF_H - (lineH &gt;&gt; 1); y1 = y0 + lineH;
if (y0 &lt; 0) y0 = 0;
if (y1 &gt; H) y1 = H;
tex = TEXS[tile];
texX = (wallX * TEX) | 0;
step = TEX / lineH;
texPos = (y0 - HALF_H + lineH / 2) * step;
fog = 1 - Math.min(1, depth / 14);                 // 거리 안개
if (side === 1) fog *= 0.62;                       // 남북 벽면은 그늘
for (y = y0; y &lt; y1; y++) {
  c = tex[((texPos | 0) &amp; (TEX - 1)) * TEX + texX];
  texPos += step;
  pix[y * W + col] = shade(c, fog);
}</pre>
<p>읽는 순서: 각도(4장) → castRay(5장) → depth 보정 → lineH·y0·y1·클리핑 →
명암 → 픽셀 쓰기. 가운데의 tex·texX·step·texPos 네 줄만 아직 설명하지
않았습니다 — 텍스처 좌표 계산은 7장의 주인공입니다. 지금은 "벽면의 알맞은
색을 골라 온다"로 읽어 두세요.</p>`},

{t:'천장과 바닥 채우기',k:'CEIL & FLOOR',h:`
<p>열의 남은 두 구간 — 벽 위(0~y0)와 벽 아래(y1~H)를 채웁니다. canonical은
단색에 <em>세로 그라데이션</em>을 얹습니다:</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">// 천장/바닥 (단색 + 거리 그라데이션)
for (y = 0; y &lt; y0; y++)
  pix[y * W + col] = shade(C_CEIL, 1 - y / H * 0.7);
for (y = y1; y &lt; H; y++)
  pix[y * W + col] = shade(C_FLOOR, (y - HALF_H) / HALF_H * 0.9 + 0.1);</pre>
<ul class="b">
<li><b>천장</b>: 화면 맨 위(y=0, 머리 바로 위 = 가까움)가 배율 1.0으로 가장
밝고, 수평선에 다가갈수록 0.65까지 어두워집니다.</li>
<li><b>바닥</b>: 수평선 바로 아래(멀리)가 배율 0.1로 캄캄하고, 화면 맨 아래
(발밑)로 오며 1.0까지 밝아집니다.</li>
</ul>
<p>둘 다 규칙은 하나 — <em>수평선에 가까울수록(멀수록) 어둡게</em>. 벽의 거리
안개와 같은 논리라서 벽·바닥·천장의 어둠이 수평선에서 자연스럽게 만납니다.
pygame판은 더 단순하게, 프레임 시작 때 위·아래 절반을 단색으로 밀어 둡니다:</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">buf.fill((30, 34, 44), (0, 0, W, HALF_H))            # 천장
buf.fill((52, 46, 40), (0, HALF_H, W, HALF_H))       # 바닥</pre>
<div class="note blue">바닥에도 텍스처를 입히는 <b>바닥 캐스팅</b>(화면 행마다
월드 좌표를 역산)은 8장에서 다룹니다.</div>`},

{t:'정리 — 나누기 하나로 3D',k:'RECAP',h:`
<div class="big">
<p>광선 거리를 cos으로 바로잡아 <b>depth</b>를 만들고, 화면 높이를 그것으로
나눠 막대를 세웠습니다. 그늘(× 0.62)과 안개(1 − depth/14)를 곱하고,
픽셀 버퍼에 직접 썼습니다.</p>
<span class="hero">거리 나누기 하나로 3D가 됐다<br>lineH = H / depth</span>
<p>벽은 섰지만 아직 밋밋한 민무늬입니다. 7장에서 wallX가 텍스처의
세로줄을 고르는 순간 — 벽돌이 벽돌처럼 보이기 시작합니다.</p>
</div>`},

]});
</script>
<script>
/* ───────────── CH 7. 텍스처 매핑 ───────────── */
CH({
icon:'🖼️', title:'텍스처 <span class="em">매핑</span>',
desc:'단색 벽에 벽돌 무늬를 입힙니다. 이미지 파일 없이 코드만으로 64×64 텍스처를 만들고, wallX 하나로 가로를, step 하나로 세로를 맵핑하는 두 개의 좌표 변환을 완성합니다.',
slides:[

{t:'단색 벽에서 벽돌 벽으로',k:'TEXTURE MAPPING',h:`
<p>6장까지 우리의 벽은 <b>거리에 따라 밝기만 달라지는 단색 기둥</b>이었습니다. 3D 공간감은 이미 완성됐지만, 화면은 아직 추상 미술에 가깝습니다. 진짜 Doom의 느낌은 벽에 <em>벽돌·돌·금속의 무늬</em>가 붙는 순간 시작됩니다.</p>
<div class="grid2">
<div class="card"><h3>지금까지 — 단색 벽</h3><p>열 하나 = 색 하나. 광선이 알려 준 정보는 "거리"뿐이었습니다.</p></div>
<div class="card"><h3>이번 장 — 텍스처 벽</h3><p>열 하나 = 텍스처의 세로줄 하나. "벽의 어느 지점에 맞았나"까지 사용합니다.</p></div>
</div>
<div class="note"><b>텍스처 매핑</b>의 정체는 단순합니다. <em>화면 픽셀 → 텍스처 픽셀</em>의 좌표 변환, 그것이 전부입니다. 이번 장에서 이 변환을 가로 한 번, 세로 한 번, 딱 두 번 만듭니다.</div>`},

{t:'텍스처 = 64×64 픽셀 배열',k:'TEX = 64',h:`
<p>우리 텍스처는 모두 <b>한 변이 64픽셀인 정사각형</b>입니다. 상수 <b>TEX</b>로 약속해 둡니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var TEX = 64;                     // 텍스처 한 변</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">TEX        = 64                # 텍스처 한 변 크기</pre>
<p>왜 하필 64일까요? 64는 <em>2의 거듭제곱</em>(2<sup>6</sup>)이기 때문입니다. 크기가 2의 거듭제곱이면 나머지 연산 <b>% 64</b>를 비트 연산 <b>&amp; 63</b>으로 바꿀 수 있습니다 — 픽셀마다 수십만 번 실행되는 안쪽 루프에서 이 차이가 쌓입니다. 이 트릭은 이 장 후반에서 실제로 씁니다.</p>
<p>메모리도 가볍습니다. 64×64 = 4,096픽셀 × 4바이트 = 텍스처 한 장에 <b>16KB</b>. 다섯 장을 다 합쳐도 80KB입니다.</p>`},

{t:'이미지 파일 없이 — 절차적 텍스처',k:'PROCEDURAL',h:`
<p>보통은 PNG 파일을 읽어 텍스처로 쓰지만, 우리는 <em>코드가 직접 그림을 그리는</em> <b>절차적(procedural) 텍스처</b>를 씁니다. 픽셀 좌표 (x, y)를 받아 수식으로 색을 결정하는 것입니다.</p>
<ul class="b">
<li><b>파일 배포 불필요</b> — JS 한 파일, py 한 파일이면 게임이 통째로 돌아갑니다.</li>
<li><b>로딩 시간 0</b> — 시작할 때 한 번 계산해 배열에 담아 두면 끝입니다.</li>
<li><b>수정이 쉬움</b> — 벽돌 크기, 색, 줄눈 두께가 전부 숫자 하나입니다.</li>
</ul>
<p>JS에서는 텍스처를 <b>Uint32Array</b>에 담습니다. 픽셀 하나가 32비트 정수 하나입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">// 텍스처는 Uint32Array (ABGR 리틀엔디언) 로 저장한다.
function rgb(r, g, b) { return (0xff000000 | (b &lt;&lt; 16) | (g &lt;&lt; 8) | r) &gt;&gt;&gt; 0; }</pre>
<p>리틀엔디언 메모리에서는 바이트가 R, G, B, A 순서로 놓이므로, 32비트 정수 안에서는 거꾸로 <b>A-B-G-R</b>로 조립합니다. rgb(150, 60, 44)처럼 부르면 완성된 픽셀 값이 나옵니다.</p>`},

{t:'우리 텍스처 6종 구경하기',k:'LIVE DEMO',h:`
<p>아래는 지금부터 만들 텍스처들의 <em>실제 렌더링</em>입니다. 벽 타일 1~5번(벽돌·돌·금속·문·출구)과, 8장에서 쓸 바닥 텍스처까지 여섯 장입니다. 슬라이더로 확대해 픽셀을 뜯어 보세요.</p>
<div class="demoWrap"><div class="dTitle">PROCEDURAL TEXTURES — 코드가 그린 6장</div>
<canvas class="demo" data-demo="texmap" width="640" height="150"></canvas>
<div class="ctl"><label>확대 <input type="range" data-p="zoom" min="1" max="4" value="2"><span class="val" data-v="zoom"></span></label></div>
</div>
<p>전부 <b>if 몇 줄과 % 연산</b>으로 만든 그림입니다. 다음 슬라이드부터 한 장씩 코드를 해부합니다.</p>`},

{t:'벽돌 텍스처 코드 해부',k:'BRICK',h:`
<p>타일 1번, 벽돌입니다. 세 가지 아이디어가 겹쳐 있습니다: <b>가로 줄무늬</b>(벽돌 단), <b>줄눈(모르타르)</b>, <b>어긋난 배치</b>.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">function makeTexture(id) {
  var t = new Uint32Array(TEX * TEX), x, y, c, row, off, mortar, n, g;
  for (y = 0; y &lt; TEX; y++) for (x = 0; x &lt; TEX; x++) {
    if (id === 1) {                       // 벽돌
      row = (y &gt;&gt; 4); off = (row &amp; 1) ? 16 : 0;
      mortar = (y % 16 &lt; 2) || ((x + off) % 32 &lt; 2);
      c = mortar ? rgb(60, 24, 20) : rgb(150, 60, 44);
      if (!mortar &amp;&amp; (x * 7 + y * 13) % 31 === 0) c = rgb(120, 46, 36);
    }</pre>
<ul class="b">
<li><b>row = y &gt;&gt; 4</b> — 16픽셀마다 벽돌 한 단. 64픽셀이니 4단이 나옵니다.</li>
<li><b>off</b> — 홀수 단은 16픽셀 밀어서 <em>벽돌이 어긋나게</em> 쌓입니다.</li>
<li><b>mortar</b> — y % 16이 2 미만(가로 줄눈)이거나 (x+off) % 32가 2 미만(세로 줄눈)이면 어두운 줄눈 색.</li>
<li>마지막 줄은 (x·7 + y·13) % 31 === 0인 픽셀만 살짝 어둡게 — 균일함을 깨는 <em>얼룩</em>입니다.</li>
</ul>`},

{t:'돌·금속 텍스처 — 의사 난수 트릭',k:'STONE &amp; METAL',h:`
<p>돌은 <em>노이즈</em>가 생명입니다. 그런데 Math.random()을 쓰면 JS와 py의 결과가 달라집니다. 대신 좌표만으로 만드는 <b>의사 난수</b>를 씁니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">} else if (id === 2) {                // 돌
  n = (x * x * 3 + y * y * 7 + x * y) % 97;
  g = 90 + (n % 40); c = rgb(g, g, g + 8);
  if ((x + y * 3) % 23 === 0) c = rgb(70, 70, 78);
} else if (id === 3) {                // 금속판
  g = 70 + (y % 16) * 3; c = rgb(g - 20, g, g + 14);
  if (x % 16 &lt; 2 || y % 16 &lt; 2) c = rgb(40, 46, 56);
  if ((x % 16 === 4 || x % 16 === 12) &amp;&amp; (y % 16 === 4 || y % 16 === 12))
    c = rgb(180, 190, 205);
}</pre>
<p><b>(x²·3 + y²·7 + xy) % 97</b> — 제곱항 덕분에 이웃 픽셀끼리 값이 크게 튀고, 97은 소수라 주기적 무늬가 잘 안 생깁니다. 결과 n으로 회색 밝기를 90~129 사이에서 흔들면 <em>돌의 거친 표면</em>이 됩니다. 금속판은 반대로 규칙적입니다: 16픽셀 격자 홈에, (4, 4)·(12, 4)·(4, 12)·(12, 12) 네 위치마다 밝은 <b>리벳</b>을 박았습니다.</p>`},

{t:'문·출구 텍스처 — 체커보드',k:'DOOR &amp; EXIT',h:`
<p>문(타일 4)과 출구(타일 5)는 눈에 확 띄어야 하므로 <b>체커보드</b> 패턴을 씁니다. 이번엔 파이썬 쪽 코드로 봅니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">elif tid == 4:                     # 문
    c = (40, 90, 60) if (x // 8 + y // 8) % 2 else (30, 70, 46)
    if 28 &lt;= x &lt; 36:
        c = (200, 170, 60)
else:                              # 출구
    c = (160, 30, 30) if (x // 8 + y // 8) % 2 else (240, 220, 210)</pre>
<p><b>(x // 8 + y // 8) % 2</b> — 좌표를 8로 나눠 8×8 블록 번호를 만들고, 블록 번호 합의 홀짝으로 두 색을 번갈아 칠합니다. 체커보드의 표준 공식입니다.</p>
<p>문에는 x가 28~35인 세로 띠를 금색으로 덧칠해 <em>손잡이</em>를 만들었습니다. 출구는 빨강×흰색 체커 — 멀리서도 "저기가 골인이다"가 보입니다.</p>`},

{t:'텍스처의 어느 열을 쓸까 — wallX 복습',k:'WALLX',h:`
<p>이제 텍스처를 벽에 붙일 차례입니다. 첫 질문: 이 화면 열에는 텍스처의 <em>몇 번째 세로줄</em>을 그려야 할까요? 답은 5장에서 이미 만들어 뒀습니다. castRay가 돌려주는 <b>wallX</b>입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">hit = side === 0 ? py + dist * sin : px + dist * cos;
return [tile, dist, hit - Math.floor(hit), side];</pre>
<p>광선이 벽에 닿은 지점의 좌표에서 <b>정수부를 버린 소수부</b>가 wallX입니다. 세로 벽면(side 0)에 맞았다면 닿은 점의 y좌표가, 가로 벽면(side 1)이라면 x좌표가 벽면을 따라 변하는 값이니, 그 소수부는 <em>벽 한 칸의 왼쪽 끝에서 얼마나 떨어진 지점인가</em>(0~1)를 뜻합니다.</p>
<div class="note">wallX = 0.0이면 벽 칸의 시작 모서리, 0.5면 한가운데, 0.999…면 반대쪽 모서리. 벽 위의 <b>가로 위치를 0~1로 정규화한 값</b>입니다.</div>`},

{t:'가로 맵핑 — texX = int(wallX × 64)',k:'TEXX',h:`
<p>wallX는 0~1, 텍스처 열 번호는 0~63. 변환은 곱셈 한 번입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">tex = TEXS[tile];
texX = (wallX * TEX) | 0;</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">tex_x = int(wall_x * TEX) % TEX</pre>
<p>wallX = 0.5라면 texX = 32 — 벽 한가운데를 보는 열은 텍스처의 32번째 세로줄을 그립니다. <em>벽면 1칸 = 텍스처 1장</em>이 정확히 대응하므로, 옆으로 걸으면 벽돌 무늬가 자연스럽게 흘러갑니다.</p>
<div class="note">파이썬 쪽의 <b>% TEX</b>는 부동소수점 오차로 wall_x가 아주 드물게 1.0에 닿아 tex_x가 64가 되는 경우를 막는 안전벨트입니다.</div>`},

{t:'세로 맵핑 — 화면 열을 텍스처 열에',k:'VERTICAL MAP',h:`
<p>가로는 끝났고, 이제 세로입니다. 화면에서 벽 기둥의 높이는 <b>lineH</b>픽셀인데, 텍스처 세로줄은 항상 <b>64텍셀</b>입니다. 화면 픽셀을 한 칸 내려갈 때 텍스처에서는 몇 텍셀 내려가야 할까요?</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">step = TEX / lineH;</pre>
<ul class="b">
<li>lineH = 400 (가까운 벽): step = 0.16 — 화면 픽셀 6개가 텍셀 하나를 나눠 씁니다. <em>확대</em>입니다.</li>
<li>lineH = 64: step = 1 — 1:1 맵핑.</li>
<li>lineH = 32 (먼 벽): step = 2 — 텍셀을 하나 걸러 하나씩 건너뜁니다. <em>축소</em>입니다.</li>
</ul>
<p>결국 step은 <b>화면 1픽셀당 텍스처 이동량</b>입니다. 누적 변수 texPos에 step을 계속 더해 가며 텍스처를 읽으면 세로 맵핑이 됩니다.</p>`},

{t:'texPos의 시작값 — 클리핑을 잊지 마라',k:'TEXPOS',h:`
<p>texPos를 어디서 시작할지가 미묘합니다. 벽이 화면보다 크면 6장에서 y0을 0으로 잘랐죠(클리핑). 그러면 화면 첫 줄은 텍스처의 꼭대기가 아니라 <em>중간 어딘가</em>여야 합니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">texPos = (y0 - HALF_H + lineH / 2) * step;</pre>
<p>괄호 안은 "클리핑된 y0이 <b>벽의 원래 꼭대기</b>(HALF_H − lineH/2)에서 몇 픽셀 아래인가"입니다. 거기에 step을 곱하면 텍스처에서 건너뛸 텍셀 수가 나옵니다.</p>
<p>확인: 벽이 다 보이면 y0 = HALF_H − lineH/2이므로 texPos = 0 — 꼭대기부터. H = 400, lineH = 800으로 클리핑됐다면 y0 = 0이고 texPos = (0 − 200 + 400) × 0.08 = <b>16</b> — 텍스처의 위 16텍셀은 화면 밖이므로 건너뜁니다.</p>
<div class="note red"><b>흔한 버그</b>: 클리핑 여부와 무관하게 texPos = 0으로 시작하면, 벽에 다가갈 때 무늬가 벽에 붙어 있지 않고 <em>화면에 들러붙어 미끄러집니다</em>. 텍스처가 이상하게 늘어난다면 십중팔구 이 줄입니다.</div>`},

{t:'열 그리기 루프 완성',k:'COLUMN LOOP',h:`
<p>재료가 다 모였습니다. renderWalls의 텍스처 부분 전체입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">tex = TEXS[tile];
texX = (wallX * TEX) | 0;
step = TEX / lineH;
texPos = (y0 - HALF_H + lineH / 2) * step;
fog = 1 - Math.min(1, depth / 14);                 // 거리 안개
if (side === 1) fog *= 0.62;                       // 남북 벽면은 그늘
for (y = y0; y &lt; y1; y++) {
  c = tex[((texPos | 0) &amp; (TEX - 1)) * TEX + texX];
  texPos += step;
  pix[y * W + col] = shade(c, fog);
}</pre>
<p>안쪽 루프는 세 줄뿐입니다. <b>texPos | 0</b>으로 정수 행 번호를 만들고, 텍스처는 행 우선(row-major) 1차원 배열이므로 <b>행 × TEX + texX</b>로 픽셀을 읽습니다. 마지막으로 안개·그늘 배율 fog를 곱해 화면 버퍼 pix에 씁니다. 이 세 줄이 640열 × 수백 픽셀, <em>매 프레임 수만 번</em> 돕니다.</p>`},

{t:'&amp; 63 vs % 64 — 2의 거듭제곱의 힘',k:'BITWISE',h:`
<p>방금 루프의 <b>(texPos | 0) &amp; (TEX − 1)</b>을 자세히 봅시다. TEX − 1 = 63 = 이진수 <b>111111</b>. 어떤 정수든 63과 AND하면 <em>아래 6비트만 남으므로</em> 결과는 항상 0~63 — % 64와 같은 효과입니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>연산</th><th>예: 130</th><th>예: 64</th><th>비고</th></tr>
<tr><td>130 % 64</td><td>2</td><td>0</td><td>나눗셈 기반</td></tr>
<tr><td>130 &amp; 63</td><td>2</td><td>0</td><td>비트 마스크 1회</td></tr>
</table></div>
<div class="note grn"><b>성능 팁</b>: 이 마스크는 반올림 오차로 texPos가 64.0을 살짝 넘어도 배열 밖을 읽지 않게 막아 주는 <em>공짜 안전장치</em>이기도 합니다. 텍스처·맵 크기를 2의 거듭제곱으로 잡는 이유가 바로 이 &amp; 트릭 — 고전 게임 프로그래밍의 오랜 전통입니다.</div>`},

{t:'텍스처 벽 사이 걷기',k:'LIVE DEMO',h:`
<p>지금까지의 코드가 전부 합쳐진 결과입니다. 아래 버튼으로 벽돌 복도를 직접 걸어 보세요.</p>
<div class="demoWrap"><div class="dTitle">TEXTURED WALLS — 가로·세로 맵핑 완성</div>
<canvas class="demo" data-demo="textured" width="320" height="200"></canvas>
<div class="padBtns"><button data-k="L">⟲</button><button data-k="U">▲</button><button data-k="D">▼</button><button data-k="R">⟳</button></div>
</div>
<ul class="b">
<li>벽에 <em>바짝 붙어</em> 보세요 — 텍스처가 확대돼도 무늬가 벽에 고정돼 있습니다(texPos 시작값 덕분).</li>
<li>옆걸음치듯 돌면서 <em>벽돌 줄눈이 벽면을 따라 흐르는지</em> 보세요(wallX 덕분).</li>
<li>모서리에서 남북면과 동서면의 <em>밝기 차이</em>도 확인해 보세요.</li>
</ul>`},

{t:'pygame의 다른 접근 — subsurface + scale',k:'PYGAME WAY',h:`
<p>파이썬에서 픽셀 하나하나를 루프로 읽고 쓰면 너무 느립니다. 그래서 pygame 버전은 발상을 바꿉니다: <em>텍스처의 세로줄 하나를 통째로 잘라, 확대해서, 붙인다.</em></p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">tex = texs[tile + (100 if side == 1 else 0)]
tex_x = int(wall_x * TEX) % TEX
# 텍스처 한 줄(1xTEX)을 잘라 세로로 늘려 붙인다
column = tex.subsurface(tex_x, 0, 1, TEX)
y0 = HALF_H - line_h // 2
if line_h &lt; H * 3:
    column = pygame.transform.scale(column, (1, line_h))
    buf.blit(column, (col, y0))</pre>
<p><b>subsurface</b>는 복사가 아니라 원본을 참조하는 <em>뷰</em>라서 공짜에 가깝고, <b>transform.scale</b>과 <b>blit</b>은 pygame이 C로 처리합니다. 파이썬 루프는 열당 한 바퀴(640번)만 돌고, 픽셀 단위 일은 전부 C에게 넘기는 구조입니다. JS의 픽셀 루프와 결과는 같지만 <em>일을 시키는 방법</em>이 다릅니다.</p>`},

{t:'pygame 거대 벽 처리 — 보이는 만큼만',k:'GIANT WALLS',h:`
<p>방금 코드의 <b>if line_h &lt; H * 3</b>이 걸립니다. 벽에 바짝 붙으면 depth가 0.05 같은 값이 되고 line_h = 400 / 0.05 = <b>8,000픽셀</b>. 화면은 400픽셀인데 8,000픽셀짜리 이미지를 640열마다 매 프레임 만들면 메모리와 시간이 낭비됩니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">else:                                    # 벽이 화면보다 훨씬 클 때
    vis = pygame.Rect(0, int((0 - y0) / line_h * TEX), 1,
                      max(1, int(H / line_h * TEX)))
    vis = vis.clip(column.get_rect())
    column = pygame.transform.scale(column.subsurface(vis), (1, H))
    buf.blit(column, (col, 0))</pre>
<p>순서를 뒤집는 겁니다: 먼저 텍스처에서 <em>화면에 보일 텍셀 구간</em>(vis)만 잘라 내고, 그 조각만 화면 높이 H로 확대합니다. (0 − y0) / line_h가 "벽의 위 몇 %가 화면 밖인가"이고, 거기에 TEX를 곱하면 건너뛸 텍셀 수 — JS의 texPos 시작값 계산과 <em>정확히 같은 수학</em>입니다.</p>`},

{t:'어두운 면 처리 — 두 구현의 두 방식',k:'SHADING',h:`
<p>남북 벽면(side 1)을 어둡게 하는 일도 두 구현이 다르게 풉니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">function shade(c, f) {           // 색 c 를 f(0~1) 배율로 어둡게
  var r = (c &amp; 255) * f, g = ((c &gt;&gt; 8) &amp; 255) * f, b = ((c &gt;&gt; 16) &amp; 255) * f;
  return rgb(r | 0, g | 0, b | 0);
}</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py"># 어두운 버전(그늘진 남북 벽면용)을 미리 만들어 둔다
dark = surf.copy()
dark.fill((128, 128, 128), special_flags=pygame.BLEND_MULT)
texs[tid + 100] = dark</pre>
<div class="grid2">
<div class="card"><h3>JS — 그릴 때 곱한다</h3><p>픽셀을 쓰는 순간마다 shade(c, fog)를 곱합니다. 안개와 그늘을 한 번에 처리할 수 있어 유연하지만, 픽셀마다 곱셈 3번이 듭니다.</p></div>

</div>`},

{t:'타일 값 ↔ 텍스처 번호 — 설계 정리',k:'TILE TO TEX',h:`
<p>맵의 숫자가 곧 텍스처 번호가 되도록 설계해 두면 변환 테이블이 필요 없습니다. cell()이 돌려준 tile로 바로 텍스처를 고릅니다: JS는 <b>TEXS[tile]</b>, py는 <b>texs[tile + (100 if side == 1 else 0)]</b>.</p>

{t:'진짜 Doom의 텍스처는 어땠나',k:'REAL DOOM',h:`
<p>1993년의 Doom은 물론 절차적 텍스처를 쓰지 않았습니다. 모든 그림은 <b>WAD 파일</b>("Where's All the Data")에 들어 있었습니다.</p>

<li>팔레트는 256색 고정, 어두운 면은 <b>COLORMAP</b>이라는 미리 계산된 밝기 표로 처리 — 우리 py 버전의 "미리 만든 dark 텍스처"와 같은 발상입니다.</li>
</ul>
<div class="note blue"><b>깊이 보기</b>: 우리가 절차적 텍스처를 고른 건 교육용 단일 파일이라는 목표 때문이지만, 방금 본 것처럼 <em>세로줄 저장</em>과 <em>미리 계산한 어두운 버전</em>이라는 핵심 아이디어는 30년 전 원작과 정확히 같습니다.</div>`},

{t:'정리 — 텍스처는 두 개의 맵핑이다',k:'RECAP',h:`

텍스처 매핑의 전부는 좌표 변환 두 개입니다.<br>
<b>가로</b>: 광선이 벽 어디에 맞았나(wallX) → texX = wallX × 64.<br>
<b>세로</b>: 화면 한 픽셀 = 텍스처 몇 텍셀?(step = 64 / lineH) → texPos 누적.<br>
클리핑된 벽은 texPos 시작값으로 보정하고, &amp; 63으로 안전하게 감쌉니다.
</div>
<p style="text-align:center">다음 장에서는 시선을 아래로 내립니다 — <em>벽 아래의 바닥과 머리 위의 천장</em>입니다.</p>`},

]});

desc:'벽 아래와 위를 채우는 두 가지 방법을 배웁니다. 빠른 단색 그라데이션, 그리고 화면 픽셀에서 월드 좌표를 역산하는 바닥 캐스팅 — 벽과 정반대 방향의 수학입니다.',
slides:[

{t:'벽 아래는 무엇인가',k:'BELOW THE WALL',h:`
<p>벽 기둥을 그리고 나면 화면에는 두 개의 빈 영역이 남습니다. 벽 위쪽(천장)과 아래쪽(바닥)입니다. 7장까지는 여기를 단색으로 대충 칠했지만, 이제 제대로 결정할 시간입니다. 선택지는 두 가지입니다.</p>
<div class="grid2">
<div class="card"><h3>방법 1 — 단색 + 그라데이션</h3><p>색 하나를 거리감이 나도록 위아래로 어둡게/밝게 칠합니다. 계산이 거의 공짜라서 빠르고, 의외로 분위기가 좋습니다.</p></div>
<div class="card"><h3>방법 2 — 바닥 캐스팅</h3><p>바닥의 모든 픽셀에 대해 "이 픽셀은 월드의 어느 지점인가"를 역산해 진짜 텍스처를 입힙니다. 아름답지만 비쌉니다.</p></div>
</div>
<p>이 장에서 둘 다 만들어 보고, 마지막에 우리 게임이 무엇을 왜 골랐는지 정리합니다.</p>`},

{t:'방법 1 — 단색 + 거리 그라데이션',k:'GRADIENT',h:`
<p>우리 최종 게임의 선택입니다. renderWalls에서 벽 기둥을 그린 직후, 같은 열의 남은 픽셀을 이렇게 채웁니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">// 천장/바닥 (단색 + 거리 그라데이션)
for (y = 0; y &lt; y0; y++)
  pix[y * W + col] = shade(C_CEIL, 1 - y / H * 0.7);
for (y = y1; y &lt; H; y++)
  pix[y * W + col] = shade(C_FLOOR, (y - HALF_H) / HALF_H * 0.9 + 0.1);</pre>
<p>pygame 버전은 한술 더 떠서, 매 프레임 시작에 사각형 <b>두 번의 fill</b>로 끝냅니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">buf.fill((30, 34, 44), (0, 0, W, HALF_H))            # 천장
buf.fill((52, 46, 40), (0, HALF_H, W, HALF_H))       # 바닥</pre>
<p>텍스처도, 광선도, 삼각함수도 없습니다. 그런데 화면을 보면 <em>충분히 바닥처럼 보입니다</em>. 왜 그런지 다음 슬라이드에서 한 줄을 뜯어 봅니다.</p>`},

{t:'그라데이션의 트릭 — 한 줄 분석',k:'ONE LINE',h:`
<p>바닥을 칠하는 배율 한 줄이 원근감의 전부입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">(y - HALF_H) / HALF_H * 0.9 + 0.1</pre>
<p>H = 400, HALF_H = 200으로 값을 넣어 봅시다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>화면 행 y</th><th>위치</th><th>배율</th><th>의미</th></tr>
<tr><td>201</td><td>지평선 바로 아래</td><td>0.10</td><td>거의 검정 — <b>먼 바닥</b></td></tr>
<tr><td>300</td><td>화면 3/4 지점</td><td>0.55</td><td>중간 밝기</td></tr>
<tr><td>399</td><td>화면 맨 아래</td><td>1.00</td><td>제 색 — <b>발밑 바닥</b></td></tr>
</table></div>
<p>핵심 관찰: <em>화면에서 아래쪽 행일수록 실제로는 가까운 바닥</em>입니다. 그러니 "y가 클수록 밝게"만 해도 눈은 원근으로 읽습니다. 천장의 <b>1 − y / H × 0.7</b>도 같은 논리를 뒤집은 것입니다(위쪽 행 = 가까운 천장 = 밝게).</p>`},

{t:'방법 2 — 픽셀마다 월드 좌표 역산',k:'FLOOR CASTING',h:`
<p>이제 진짜 텍스처를 깔아 봅시다. 벽과는 문제의 방향이 반대입니다.</p>
<ul class="b">
<li><b>벽</b>: 광선을 쏘고 → 어디에 맞는지 찾고 → 거리로 화면 위치를 정했습니다. <em>월드 → 화면</em>.</li>
<li><b>바닥</b>: 화면 픽셀 (col, y)에서 출발해 → 이 픽셀에 비치는 바닥 지점의 <em>월드 좌표를 역산</em>합니다. <em>화면 → 월드</em>.</li>
</ul>
<p>월드 좌표 (fx, fy)만 알면 나머지는 7장과 같습니다: 소수부를 떼어 64를 곱하면 텍스처 좌표가 나오고, 픽셀을 읽어 칠하면 끝입니다.</p>
<div class="note">이 기법을 <b>바닥 캐스팅(floor casting)</b>이라 부릅니다. 광선을 새로 쏘는 게 아니라, 이미 아는 광선 각도와 화면 행 번호만으로 <em>거리를 수식으로 푸는</em> 것이 포인트입니다.</div>`},

{t:'핵심 수학 — 화면 행에서 거리로',k:'ROW DISTANCE',h:`
<p>화면 행 y에 비치는 바닥은 얼마나 먼 곳일까요? 6장의 투영 공식을 거꾸로 돌리면 됩니다.</p>
<p>거리 d의 벽은 높이 lineH = H / d로 그려지고, 그 <b>밑변</b>은 y = HALF + H / (2d)에 놓입니다. 그런데 벽의 밑변은 곧 <em>거리 d 지점의 바닥</em>이기도 합니다. 그러니 이 식을 d에 대해 풀면:</p>
<pre class="code" data-lang="js">rowDist = (H / 2) / (y - HALF)</pre>
<p>H = 400, HALF = 200에서 숫자를 넣어 봅시다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>화면 행 y</th><th>y − HALF</th><th>rowDist</th></tr>
<tr><td>400 (맨 아래)</td><td>200</td><td>1.0칸 — 바로 발 앞</td></tr>
<tr><td>240</td><td>40</td><td>5.0칸</td></tr>
<tr><td>210</td><td>10</td><td>20칸 — 저 멀리</td></tr>
<tr><td>200 (지평선)</td><td>0</td><td>∞ — 무한히 먼 곳</td></tr>
</table></div>
<p>지평선에 가까울수록 rowDist가 폭발하는 것, 닮은꼴 삼각형이 만드는 <em>원근의 본질</em>입니다.</p>`},

{t:'여기도 어안 보정이 필요하다',k:'FISHEYE AGAIN',h:`
<p>rowDist는 <b>시선에 수직인 평면까지의 거리</b>(수직 거리)입니다. 그런데 바닥 지점을 찾으려면 <em>광선 방향을 따라</em> 걸어가야 하고, 화면 가장자리 열의 광선은 시선과 각도가 벌어져 있습니다.</p>
<pre class="code" data-lang="js">rowDist = (H / 2) / (y - HALF) / corr   // corr = cos(rayAng - pl.ang)</pre>
<p>6장에서 벽을 그릴 때는 광선 거리에 cos을 <b>곱해서</b> 수직 거리를 얻었습니다. 지금은 수직 거리에서 출발해 광선 거리가 필요하니 cos으로 <b>나눕니다</b>. 같은 삼각형을 반대로 읽는 것뿐입니다.</p>
<div class="note red"><b>흔한 버그</b>: 이 나눗셈을 빼먹으면 바닥 타일이 화면 중앙에서는 맞는데 가장자리로 갈수록 <em>안쪽으로 휘어진 원호</em>를 그립니다. 벽의 어안 왜곡과 정확히 같은 병, 같은 처방입니다.</div>`},

{t:'월드 좌표 계산 — 소수부가 텍스처 좌표',k:'WORLD COORDS',h:`
<p>거리를 알았으니 플레이어 위치에서 광선 방향으로 rowDist만큼 가면 바닥 지점입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">const fx=pl.x+cosR*rowDist,fy=pl.y+sinR*rowDist;
const tx=((fx-Math.floor(fx))*64)|0,ty=((fy-Math.floor(fy))*64)|0;</pre>
<p>(fx, fy)는 맵 좌표계의 실수 좌표입니다. 예를 들어 fx = 3.72라면 "3번 칸 안의 72% 지점" — 7장의 wallX와 똑같이 <em>소수부 × 64</em>가 텍스처 좌표가 됩니다.</p>
<ul class="b">
<li>바닥 한 칸(1×1)마다 텍스처 한 장이 반복해서 깔립니다.</li>
<li>플레이어가 움직이면 fx, fy가 함께 움직여 <em>바닥이 발밑에 고정된 것처럼</em> 흐릅니다.</li>
<li>cosR, sinR은 열마다 한 번만 계산해 두면 됩니다 — 안쪽 루프에는 곱셈과 소수부 계산만 남습니다.</li>
</ul>`},

{t:'두 방식을 눈으로 비교하기',k:'LIVE DEMO',h:`
<p>버튼으로 <b>바닥 캐스팅</b>과 <b>단색 그라데이션</b>(우리 최종 게임 방식)을 오가며 비교해 보세요. 시점은 자동으로 회전합니다.</p>
<div class="demoWrap"><div class="dTitle">FLOOR CASTING — 토글로 비교</div>
<canvas class="demo" data-demo="floorcast" width="320" height="200"></canvas>
<div class="ctl"><button data-p="ftex">바닥 캐스팅 ON</button></div>
</div>
<ul class="b">
<li>캐스팅 ON: 바닥 타일이 <em>월드에 고정</em>되어 회전을 따라 흘러갑니다. 천장에도 돌 텍스처가 깔립니다.</li>
<li>캐스팅 OFF: 무늬는 없지만 그라데이션만으로도 <em>깊이감은 살아 있는</em> 것을 확인하세요.</li>
<li>지평선 근처에서 타일이 급격히 작아지는 것 — rowDist가 ∞로 가는 그 수식입니다.</li>
</ul>`},

{t:'바닥 캐스팅 전체 코드',k:'FULL CODE',h:`
<p>방금 데모가 실행한 renderScene의 바닥·천장 부분 전체입니다. cy1은 벽 기둥의 (클리핑된) 아래 끝 — 즉 벽이 끝나는 곳부터 화면 바닥까지 돕니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">/* 바닥·천장 캐스팅: 화면 행 → 월드 좌표 역산 */
const cosR=Math.cos(rayAng),sinR=Math.sin(rayAng),corr=Math.cos(rayAng-pl.ang);
for(let y=cy1;y&lt;H;y++){
  const rowDist=(H/2)/(y-HALF)/corr;
  const fx=pl.x+cosR*rowDist,fy=pl.y+sinR*rowDist;
  const tx=((fx-Math.floor(fx))*64)|0,ty=((fy-Math.floor(fy))*64)|0;
  const f2=opt.shade===false?1:1-Math.min(1,rowDist/14);
  pix[y*W+col]=shadeC(ftex[ty*64+tx],f2);
  pix[(H-1-y)*W+col]=shadeC(ctex[ty*64+tx],f2*0.6);
}</pre>
<p>루프 한 바퀴가 하는 일: 행 → 거리(rowDist) → 월드 좌표(fx, fy) → 텍스처 좌표(tx, ty) → 안개 배율(f2) → 픽셀 두 개(바닥 + 천장). 이 다섯 단계가 이 장 전체의 요약입니다.</p>`},

{t:'천장은 공짜다',k:'CEILING',h:`
<p>방금 코드의 마지막 줄을 다시 보세요.</p>
<pre class="code" data-lang="js">pix[(H-1-y)*W+col]=shadeC(ctex[ty*64+tx],f2*0.6);</pre>
<p>천장을 위한 새 계산이 <em>하나도 없습니다</em>. 이유는 대칭입니다: 천장 높이와 바닥 깊이가 같다면(둘 다 벽 높이의 절반), 지평선에서 아래로 k번째 행의 바닥과 <b>위로 k번째 행의 천장</b>은 정확히 같은 거리, 같은 (fx, fy)에 있습니다.</p>
<ul class="b">
<li>바닥 행 y의 거울상은 <b>H − 1 − y</b> — 같은 rowDist, 같은 텍스처 좌표를 재활용합니다.</li>
<li>천장 텍스처(ctex)만 다른 것으로 바꾸고, 0.6을 곱해 조금 더 어둡게 — 분위기 차이만 줍니다.</li>
<li>바닥 루프 한 번으로 화면 위아래가 <em>동시에</em> 채워집니다.</li>
</ul>
<div class="note">눈높이가 칸 중앙(0.5)이라는 우리 세계의 가정이 여기서 또 이득을 줍니다. 눈높이가 비대칭이면 천장용 rowDist를 따로 계산해야 합니다.</div>`},

{t:'비용 계산 — 바닥은 왜 무거운가',k:'COST',h:`
<p>벽과 바닥의 일량을 세어 봅시다. 내부 해상도 640×400 기준입니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>대상</th><th>픽셀 수 (프레임당)</th><th>픽셀당 계산</th></tr>
<tr><td>벽</td><td>640열 × 평균 수십~수백 = 수만</td><td>배열 읽기 + 곱 (texPos 누적뿐)</td></tr>
<tr><td>바닥+천장</td><td>640 × 200 = <b>128,000회 역산 루프 (회마다 픽셀 2개)</b></td><td>나눗셈 + floor 2번 + 배열 읽기 2번</td></tr>
</table></div>
<p>바닥 캐스팅은 <em>화면 절반을 채우는 12만여 번의 역산</em>을 매 프레임 반복합니다. 60fps라면 초당 약 770만 번 — 게다가 회마다 나눗셈이 들어갑니다. 벽은 가까울 때나 무거워지지만 바닥은 <b>항상 최대 비용</b>입니다.</p>
<div class="note grn"><b>성능 팁</b>: JS의 Uint32Array에서는 이게 감당이 되지만, 순수 파이썬 루프로는 프레임당 12만 번의 역산이 절망적입니다. pygame 버전이 fill 두 줄을 고른 진짜 이유입니다.</div>`},

{t:'열 기준 vs 행 기준',k:'ROW VS COLUMN',h:`
<p>우리는 벽을 그리던 열(column) 루프 안에서 바닥도 세로로 처리했습니다. 그런데 유명한 lodev 튜토리얼은 바닥을 <b>수평 행(row) 단위</b>로 그립니다. 어느 쪽이 빠를까요?</p>
<div class="grid2">
<div class="card"><h3>열 기준 (우리 데모)</h3><p>벽 코드에 자연스럽게 끼어들고, 벽 아래부터만 돌면 되니 구현이 단순합니다. 대신 rowDist 나눗셈이 <em>픽셀마다</em> 실행됩니다.</p></div>
<div class="card"><h3>행 기준 (lodev)</h3><p>한 행 안에서 rowDist는 <em>상수</em>입니다. 행의 왼쪽 끝 월드 좌표와 픽셀당 증가량을 한 번만 구하면, 안쪽 루프는 <b>덧셈 두 번</b>이 전부입니다.</p></div>
</div>
<div class="note blue"><b>깊이 보기</b>: 행 기준이 빠른 이유는 수학이 아니라 <em>불변량의 재배치</em>입니다. 같은 y의 픽셀들은 같은 거리를 공유하므로, 나눗셈과 cos 보정을 행당 1회로 끌어올릴 수 있습니다. "루프 안의 계산을 밖으로"라는 최적화의 교과서적 사례입니다.</div>`},

{t:'하늘 텍스처라는 선택지',k:'SKYBOX',h:`
<p>실외 씬이라면 천장 캐스팅 대신 <b>하늘</b>을 그리는 방법도 있습니다. 하늘은 무한히 멀기 때문에 걸어도 가까워지지 않고, <em>고개를 돌릴 때만</em> 흘러야 합니다.</p>
<ul class="b">
<li>구현: 천장 영역의 텍스처 x좌표를 rowDist가 아니라 <b>광선 각도에 비례</b>시킵니다. 각도 → 하늘 그림의 가로 위치, 화면 행 → 세로 위치.</li>
<li>위치(pl.x, pl.y)가 식에 <em>등장하지 않는 것</em>이 핵심 — 그래서 아무리 걸어도 하늘은 제자리입니다.</li>
</ul>
<div class="tblWrap"><table class="tbl">
<tr><th>게임</th><th>바닥</th><th>천장</th></tr>
<tr><td>울펜슈타인 3D (1992)</td><td>단색</td><td>단색</td></tr>
<tr><td>Doom (1993)</td><td>텍스처(flat)</td><td>텍스처 또는 <b>하늘(F_SKY1)</b></td></tr>
<tr><td>우리 게임</td><td>단색 그라데이션</td><td>단색 그라데이션</td></tr>
</table></div>
<p>Doom이 울펜슈타인보다 "야외 같다"고 느껴진 데는 이 하늘 처리가 큰 몫을 했습니다.</p>`},

{t:'안개와 결합 — 통일된 공기',k:'FOG',h:`
<p>바닥 캐스팅 코드에 이미 들어 있던 한 줄을 조명해 봅시다.</p>
<pre class="code" data-lang="js">const f2=opt.shade===false?1:1-Math.min(1,rowDist/14);</pre>
<p>벽을 그릴 때 쓴 안개 공식 <b>1 − min(1, depth / 14)</b>와 <em>완전히 같은 식, 같은 상수 14</em>입니다. rowDist가 곧 그 픽셀의 깊이이기 때문입니다.</p>
<ul class="b">
<li>벽과 바닥이 같은 거리에서 같은 만큼 어두워지므로, 벽 밑변과 바닥이 만나는 경계가 <em>이음새 없이</em> 붙습니다.</li>
<li>지평선 근처는 rowDist ≥ 14라 완전히 검게 — 먼 곳의 타일 디테일이 뭉개지는 것을 안개가 <b>공짜로 가려 줍니다</b>.</li>
<li>단색 그라데이션도 사실 이 안개의 사촌입니다. 거리 대신 화면 행으로 근사했을 뿐입니다.</li>
</ul>
<div class="note">렌더링의 통일감은 대개 이런 데서 나옵니다 — 효과 하나하나보다, <em>같은 규칙이 화면 전체에 적용되는가</em>가 중요합니다.</div>`},

{t:'우리 게임의 최종 선택과 이유',k:'OUR CHOICE',h:`
<p>정리하면, 최종 게임(JS·py 모두)은 <b>단색 + 그라데이션</b>을, 바닥 캐스팅은 <b>이 덱의 JS 데모</b>로 체험하는 구성을 골랐습니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th></th><th>단색 그라데이션</th><th>바닥 캐스팅</th></tr>
<tr><td>속도</td><td><b>거의 공짜</b> (py는 fill 2번)</td><td>화면 절반 전 픽셀 계산</td></tr>
<tr><td>분위기</td><td>어둡고 미니멀 — 우리 미학</td><td>디테일 풍부, 대신 어수선</td></tr>
<tr><td>코드</td><td>2~4줄</td><td>루프 + 역산 수학 10여 줄</td></tr>
<tr><td>채택</td><td>doom.py / jsdoom.html</td><td>덱 데모 (floorcast)</td></tr>
</table></div>
<div class="grid2">
<div class="card"><h3>pygame — 성능이 결정</h3><p>순수 파이썬으로 픽셀 12만 개를 매 프레임 만질 수는 없습니다. fill 두 줄이면 60fps가 안전하게 남습니다.</p></div>
<div class="card"><h3>JS — 미학이 결정</h3><p>성능은 충분하지만, 단색 바닥이 텍스처 벽을 오히려 돋보이게 합니다. 두 구현의 화면 통일도 덤입니다.</p></div>
</div>`},

{t:'정리 — 방향이 반대인 같은 수학',k:'RECAP',h:`
<div class="big">
<span class="hero">벽은 광선을 쏘고,<br>바닥은 광선을 거꾸로 푼다</span>
벽: 월드를 뒤져 거리를 찾고, 거리로 화면 위치를 정했습니다.<br>
바닥: 화면 행에서 거리를 <b>rowDist = (H/2) / (y − HALF)</b>로 풀고,<br>
광선을 따라 걸어가 월드 좌표를 얻었습니다.<br>
어안 보정(cos), 소수부 × 64, 안개 — 도구는 전부 재활용이었습니다.
</div>
<p style="text-align:center">다음 장에서는 이 세계에 <em>움직이는 것들</em> — 스프라이트를 세웁니다.</p>`},

]});
</script>
<script>
/* ───────────── CH 9. 스프라이트 ───────────── */
CH({
icon:'👾', title:'<span class="em">스프라이트</span> — 벽이 아닌 것들',
desc:'적과 아이템은 벽처럼 레이캐스팅하지 않습니다. 항상 카메라를 바라보는 2D 그림, 즉 빌보드 스프라이트를 올바른 위치와 크기로 화면에 얹고, z버퍼로 벽 뒤를 정확히 가리는 법을 배웁니다.',
slides:[
{t:'벽이 아닌 것들',k:'BILLBOARD',h:`
<p>지금까지 우리는 <b>벽</b>만 그렸습니다. 하지만 Doom에는 임프가 어슬렁거리고, 바닥에는 구급상자가 놓여 있습니다. 이런 것들은 격자에 붙어 있지 않고 <em>맵 위의 임의 좌표</em>에 떠 있어서, 광선을 쏘아 맞히는 방식으로는 그리기 어렵습니다.</p>
<p>그래서 완전히 다른 접근을 씁니다. 적과 아이템은 <b>스프라이트(sprite)</b> — 3D 공간의 한 점에 붙어 있는 <em>2D 그림</em>입니다. 그림은 항상 카메라(나)를 정면으로 바라보도록 그려집니다. 이런 기법을 광고판에 빗대어 <b>빌보드(billboard)</b>라고 부릅니다.</p>
<div class="grid2">
<div class="card"><h3>벽</h3><p>격자 정렬 · 광선(DDA)으로 발견 · 열 단위로 세로줄을 그림 · 6~8장에서 완성</p></div>
<div class="card"><h3>스프라이트</h3><p>자유 좌표 (x, y) · 위치·거리·각도를 직접 계산 · 하나의 2D 그림을 통째로 얹음 · 이번 장</p></div>
</div>
<div class="note">스프라이트를 그리는 데 광선은 하나도 쏘지 않습니다. 대신 <em>벽을 그릴 때 광선이 남긴 기록(z버퍼)</em>을 재활용합니다. 이것이 이번 장의 핵심 장치입니다.</div>`},

{t:'Doom의 8방향 스프라이트',k:'8 ROTATIONS',h:`
<p>원조 Doom의 적은 어느 쪽에서 봐도 그럴듯합니다. 뒤에서 몰래 다가가면 임프의 <em>등</em>이 보입니다. 비밀은 간단합니다. 적 하나마다 <b>8개 방향</b>에서 본 그림을 미리 만들어 두고, 플레이어와 적이 이루는 각도에 따라 그중 하나를 골라 빌보드로 붙이는 것입니다.</p>
<p>그림 자체는 여전히 2D이고 항상 카메라를 향합니다. <em>어떤 그림을 고르느냐</em>만 3D적인 계산입니다.</p>
<div class="note blue">우리 클론은 <b>1방향</b>으로 단순화합니다. 임프는 어느 쪽에서 봐도 정면 얼굴입니다. 그림을 8장 만들 필요가 없어 코드가 짧아지고, 이 장에서 배울 수학(위치·크기·가림)은 8방향이든 1방향이든 완전히 동일합니다. 방향 그림 고르기는 각도 계산 한 줄만 더하면 되는 확장입니다.</div>`},

{t:'스프라이트도 코드로 그린다',k:'PROCEDURAL SPRITE',h:`
<p>7장의 벽 텍스처처럼, 임프도 이미지 파일 없이 <em>64×64 픽셀을 코드로</em> 만듭니다. 몸통은 눌린 타원(원의 방정식 변형), 머리는 원, 뿔은 삼각형, 팔다리는 사각형 — 도형 몇 개의 조합입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var IMG_IMP = drawToArray(function (c) {
  var x, y, dx, dy;
  c.fillStyle = '#8c4628';
  for (y = 0; y &lt; TEX; y++) for (x = 0; x &lt; TEX; x++) {
    dx = x - 32; dy = y - 34;
    if ((dx * dx &gt;&gt; 1) + dy * dy &lt; 500) c.fillRect(x, y, 1, 1);   // 몸통
  }
  c.beginPath(); c.arc(32, 16, 11, 0, 7); c.fill();               // 머리
  // ...(뿔·팔·다리·눈도 같은 방식 — 전체 코드 참고)
});</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">def make_imp():
    s = pygame.Surface((TEX, TEX), pygame.SRCALPHA)
    body = (140, 70, 40)
    for y in range(TEX):
        for x in range(TEX):
            dx, dy = x - 32, y - 34
            if dx * dx // 2 + dy * dy &lt; 500:            # 몸통
                s.set_at((x, y), body)
    pygame.draw.circle(s, (120, 55, 30), (32, 16), 11)  # 머리
    # ...(눈·뿔·팔·다리 생략)
    return s</pre>
<p><b>dx*dx/2 + dy*dy &lt; 500</b> — x쪽 제곱을 반으로 줄이면 원이 <em>가로로 퍼진 타원</em>이 됩니다. 수식 하나로 몸통 실루엣이 나옵니다.</p>`},

{t:'알파 채널 — 투명 픽셀',k:'ALPHA CHANNEL',h:`
<p>임프는 64×64 정사각형이지만 화면에는 <em>몸통 실루엣만</em> 보여야 합니다. 도형 바깥의 빈 부분은 <b>투명</b>이어야 합니다. 두 구현은 서로 다른 방식으로 같은 일을 합니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">s = pygame.Surface((TEX, TEX), pygame.SRCALPHA)</pre>
<p><b>SRCALPHA</b> 플래그를 준 Surface는 픽셀마다 알파(불투명도)를 기억하고, <b>blit</b>이 알아서 투명 부분을 건너뜁니다. pygame이 다 해 줍니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">c = img[ty * TEX + tx];
if ((c &gt;&gt;&gt; 24) &lt; 128) continue;               // 투명 픽셀 건너뜀</pre>
<p>JS 버전은 픽셀을 직접 찍으므로 투명 처리도 직접 합니다. 32비트 픽셀 값의 <em>최상위 8비트가 알파</em>입니다. <b>c &gt;&gt;&gt; 24</b>로 알파 바이트만 꺼내서, 128 미만(반투명 이하)이면 그 픽셀을 찍지 않고 넘어갑니다. 뒤에 이미 그려진 벽이 그대로 비칩니다.</p>
<div class="note">그린 적 없는 픽셀의 알파는 0입니다. 캔버스에 도형을 그린 부분만 알파 255가 되므로, 별도 마스크 작업 없이 실루엣이 공짜로 생깁니다.</div>`},

{t:'1단계 — 상대 위치',k:'RELATIVE POSITION',h:`
<p>스프라이트를 화면에 얹으려면 세 가지를 알아야 합니다. <b>화면의 어느 x좌표</b>에, <b>얼마나 크게</b>, <b>벽에 가리는지</b>. 전부 <em>나에게서 스프라이트가 어디 있는가</em>에서 출발합니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var dx = s.x - player.x, dy = s.y - player.y;
var dist = Math.sqrt(dx * dx + dy * dy);
if (dist &lt; 0.4 || dist &gt; MAX_DEPTH) return;</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">dx, dy = s.x - pl.x, s.y - pl.y
dist = math.hypot(dx, dy)
if dist &lt; 0.4 or dist &gt; MAX_DEPTH:
    continue</pre>
<p>(dx, dy)는 나를 원점으로 한 상대 벡터, dist는 피타고라스 거리입니다. Python의 <b>math.hypot(dx, dy)</b>는 √(dx²+dy²)와 같습니다. 예: 내가 (1.5, 1.5), 임프가 (9.5, 1.5)이면 dx=8, dy=0, dist=8칸입니다.</p>
<div class="note">너무 가까우면(0.4칸 미만) 화면을 꽉 채우다 못해 뒤집히므로 버리고, 너무 멀면(MAX_DEPTH=24칸 초과) 어차피 1픽셀도 안 되므로 버립니다.</div>`},

{t:'2단계 — 상대 각도',k:'RELATIVE ANGLE',h:`
<p>다음은 <em>내 시선 기준으로 몇 도 옆에 있는가</em>입니다. atan2(dy, dx)가 스프라이트의 절대 방위각을 주고, 거기서 내 시선각을 빼면 상대 각도 <b>rel</b>이 됩니다. rel=0이면 정면, 양수면 오른쪽, 음수면 왼쪽입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var rel = Math.atan2(dy, dx) - player.ang;
rel = ((rel + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">rel = math.atan2(dy, dx) - pl.ang
rel = (rel + math.pi) % (2 * math.pi) - math.pi</pre>
<p>둘째 줄은 <b>각도 정규화</b>입니다. ang는 회전을 거듭할수록 한없이 커지거나 작아지므로 뺄셈 결과는 ±π를 훌쩍 벗어날 수 있는데, 이를 항상 <em>-π~+π 범위</em>로 감아 줍니다. 359° 차이는 사실 -1° 차이라는 뜻입니다.</p>
<div class="note blue">Python은 한 번의 %로 끝나지만 JS는 <b>% 2π를 두 번</b> 합니다. Python의 %는 결과가 항상 0 이상이지만, <em>JS의 %는 피연산자의 부호를 따라 음수가 나올 수 있기 때문</em>입니다. 음수 보정용 +2π와 % 한 번이 더 붙은 것뿐, 수학적으로는 같은 식입니다.</div>`},

{t:'시야 밖이면 버리기',k:'FOV CULLING',h:`
<p>상대 각도를 얻었으니 화면에 보일 가능성이 없는 스프라이트는 일찍 걸러냅니다. FOV가 60°이므로 시선에서 ±30° 바깥은 화면 밖입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">if (Math.abs(rel) &gt; FOV / 2 + 0.4) return;</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">if abs(rel) &gt; FOV / 2 + 0.4:
    continue</pre>
<p>그런데 FOV/2가 아니라 <em>FOV/2 + 0.4라디안(약 23°)</em>입니다. 왜 여유를 둘까요?</p>
<div class="note red">rel은 스프라이트의 <b>중심</b> 각도입니다. 중심이 시야를 살짝 벗어났어도, 가까이 있는 큰 스프라이트는 <em>몸의 절반이 아직 화면 가장자리에 걸쳐</em> 있을 수 있습니다. 여유 없이 FOV/2에서 자르면 화면 끝에서 임프가 <b>몸통째 뿅 하고 사라지는</b> 버그가 됩니다. 0.4라디안이면 한두 칸 밖 스프라이트의 반폭(atan(0.5/거리))을 감싸고도 남는 실용적인 절충값입니다.</div>`},

{t:'3단계 — 화면 x좌표',k:'SCREEN X',h:`
<p>이제 rel을 화면 가로 위치로 바꿉니다. 4장에서 화면 x → 광선 각도를 <b>탄젠트 기반 투영면</b>으로 계산했습니다. 스프라이트는 그 <em>역방향</em>입니다: 각도 → 화면 x.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py"># 화면 x좌표: tan 비율로 투영
sx = int((0.5 + math.tan(rel) / (2 * math.tan(FOV / 2))) * W - size / 2)</pre>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var sx = (((0.5 + Math.tan(rel) / (2 * Math.tan(FOV / 2))) * W) - size / 2) | 0;</pre>
<p>투영면 위에서 rel 방향의 가로 오프셋은 tan(rel)에 비례합니다. 그것을 투영면 전체 폭 2·tan(FOV/2)로 나누면 -0.5~+0.5의 비율이 되고, 0.5를 더해 0~1로 만든 뒤 W를 곱합니다.</p>
<ul class="b">
<li>rel = 0(정면) → 0.5 × 640 = <b>화면 중앙 320</b></li>
<li>rel = +15° → 0.5 + 0.268/1.155 = 0.732 → <b>약 469</b></li>
<li>rel = +30°(시야 끝) → 0.5 + 0.577/1.155 = 1.0 → <b>640, 오른쪽 끝</b></li>
</ul>
<p>마지막의 <b>- size/2</b>는 계산된 점이 스프라이트의 <em>중심</em>이므로, 그리기 시작할 <em>왼쪽 끝</em>으로 옮기는 보정입니다. size는 다음 슬라이드에서 구합니다.</p>`},

{t:'4단계 — 크기',k:'SPRITE SIZE',h:`
<p>크기는 놀랄 만큼 쉽습니다. <em>벽과 완전히 같은 공식</em>이기 때문입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var depth = dist * Math.cos(rel);
var size = (H / depth) | 0;
if (size &lt;= 1) return;</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">depth = dist * math.cos(rel)
size = int(H / depth)
if size &lt;= 1:
    continue</pre>
<p>6장에서 벽 세로줄 높이를 lineH = H/depth로 구했습니다. 스프라이트도 벽과 같은 1칸 높이의 물체라고 보고 <b>size = H/depth</b>. depth가 4칸이면 400/4 = <b>100픽셀</b>입니다. 정사각형 그림이므로 가로도 size, 세로 시작점은 sy = HALF_H - size/2로 화면 세로 중앙에 맞춥니다.</p>
<div class="note">dist가 아니라 <b>depth = dist·cos(rel)</b>을 쓰는 것도 벽과 같은 이유 — 6장의 <em>어안 보정</em>입니다. 시선에 수직인 평면까지의 거리를 써야 화면 가장자리의 스프라이트가 부풀지 않고, 뒤에서 배울 z버퍼의 벽 거리와 <em>같은 자로 잰 값</em>이 되어 비교할 수 있습니다.</div>`},

{t:'5단계 — 먼 것부터 그리기',k:'PAINTER SORT',h:`
<p>스프라이트가 여러 개면 순서가 문제입니다. 가까운 임프가 먼 임프를 가려야 합니다. 답은 유화를 그리는 화가처럼 <b>먼 배경부터 칠하고 가까운 것을 덧칠</b>하는 것 — <em>화가 알고리즘(painter's algorithm)</em>입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var order = sprites.filter(function (s) { return s.alive; });
order.sort(function (a, b) {
  var da = (a.x - player.x) * (a.x - player.x) + (a.y - player.y) * (a.y - player.y);
  var db = (b.x - player.x) * (b.x - player.x) + (b.y - player.y) * (b.y - player.y);
  return db - da;                                   // 먼 것부터 그린다
});</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">order = sorted((s for s in sprites if s.alive),
               key=lambda s: -((s.x - pl.x) ** 2 + (s.y - pl.y) ** 2))</pre>
<p>죽은 스프라이트를 거른 뒤, 거리 <em>내림차순</em>으로 정렬해 순서대로 그립니다. 가까운 것이 마지막에 그려져 자연히 위에 덮입니다.</p>
<div class="note grn">정렬 기준이 √를 씌운 거리가 아니라 <b>거리의 제곱</b>입니다. 크기 비교만 할 때는 제곱끼리 비교해도 순서가 같으므로, 스프라이트 수만큼의 sqrt 호출을 아낄 수 있습니다.</div>`},

{t:'문제 — 벽 뒤 스프라이트가 보인다',k:'LIVE DEMO',h:`
<p>여기까지 구현하고 실행하면 곧바로 이상한 장면을 만납니다. <em>벽 너머에 있어야 할 임프가 벽 위에 유령처럼 떠 보입니다.</em></p>
<div class="demoWrap"><div class="dTitle">SPRITES + ZBUFFER</div>
<canvas class="demo" data-demo="sprites" width="320" height="200"></canvas>
<div class="ctl"><button data-p="zb">z버퍼 ON</button></div>
</div>
<p>버튼이 <b>꺼진 상태</b>가 지금 우리 코드입니다. 벽 뒤의 임프가 그대로 비쳐 보입니다. 아직 버튼은 누르지 말고 왜 이런 일이 생기는지부터 생각해 봅시다.</p>
<div class="note red">원인: 화가 알고리즘은 <b>스프라이트끼리의</b> 앞뒤만 해결합니다. 스프라이트는 벽을 전부 그린 <em>다음에</em> 덧그리므로, 벽보다 멀리 있어도 무조건 벽 위에 찍혀 버립니다. 스프라이트와 <b>벽 사이의</b> 가림 판정이 통째로 빠져 있는 것입니다.</div>`},

{t:'z버퍼 — 열마다 벽 거리 기록',k:'Z-BUFFER',h:`
<p>해결책은 벽을 그릴 때 단서를 남기는 것입니다. 6장의 renderWalls는 640개 열마다 광선을 쏘고 벽까지의 depth를 이미 알고 있습니다. 이 값을 <em>열별 배열에 기록</em>해 둡니다. 이것이 <b>z버퍼(z-buffer)</b>입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var zbuf = new Float64Array(W);
// renderWalls 안, 열마다:
depth = dist * Math.cos(rayAng - player.ang);      // 어안 보정
zbuf[col] = depth;</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">def render_walls(buf, texs, pl):
    zbuf = [MAX_DEPTH] * NUM_RAYS
    for col in range(NUM_RAYS):
        # ...cast_ray, 어안 보정...
        zbuf[col] = depth
    # ...벽 그리기...
    return zbuf</pre>
<p>뜻은 단순합니다: <em>"화면 x열 col에서, 벽은 depth만큼 떨어져 있다."</em> Python 버전은 이 배열을 return해서 render_sprites에 넘겨줍니다.</p>
<div class="note blue">진짜 3D 엔진의 z버퍼는 <b>픽셀마다</b> 깊이를 기록합니다(640×400 = 256,000개). 레이캐스터의 벽은 한 열 안에서 깊이가 전부 같으므로 <b>열마다 하나</b>, 즉 숫자 640개면 충분합니다. 공짜나 다름없는 비용입니다.</div>`},

{t:'열 단위 가림 판정',k:'OCCLUSION TEST',h:`
<p>이제 스프라이트를 그릴 때, 세로줄 하나를 찍기 전에 z버퍼와 거리를 비교합니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">col = sx + i;
if (col &lt; 0 || col &gt;= W || depth &gt;= zbuf[col]) continue;   // z버퍼 검사</pre>
<p>규칙은 한 줄입니다: <em>스프라이트의 depth가 그 열의 벽 depth보다 크거나 같으면(더 멀면), 그 열은 벽 뒤다 — 건너뛴다.</em> 화면 밖 열(col&lt;0, col≥W)도 같은 조건문에서 함께 걸러냅니다.</p>
<p>이 판정이 <b>열 단위</b>라는 점이 재미있습니다. 스프라이트의 왼쪽 절반은 벽 모서리에 가리고 오른쪽 절반만 삐죽 보이는 장면 — 열마다 따로 판정하니 <em>자동으로</em> 됩니다.</p>
<div class="note">스프라이트끼리는 화가 정렬(먼 것부터 덧칠), 스프라이트 대 벽은 z버퍼. 두 장치가 <em>서로 다른 문제</em>를 하나씩 맡아 해결합니다.</div>`},

{t:'z버퍼 확인',k:'LIVE DEMO',h:`
<p>이제 버튼을 눌러 z버퍼 검사를 켜 보세요.</p>
<div class="demoWrap"><div class="dTitle">SPRITES + ZBUFFER</div>
<canvas class="demo" data-demo="sprites" width="320" height="200"></canvas>
<div class="ctl"><button data-p="zb">z버퍼 ON</button></div>
</div>
<ul class="b">
<li>벽 뒤의 임프가 <em>완전히 사라집니다</em>. 유령 현상 해결.</li>
<li>벽 모서리에 반쯤 걸친 임프는 <em>보이는 절반만</em> 그려집니다. 열 단위 판정 덕분입니다.</li>
<li>버튼을 껐다 켰다 하며 비교해 보세요. 바뀐 코드는 조건문 하나뿐입니다.</li>
</ul>
<div class="note grn">z버퍼 검사는 가려진 열의 픽셀 루프를 통째로 건너뛰므로, 올바른 그림을 만들면서 <em>동시에 렌더링을 더 빠르게</em> 만듭니다. 정확성과 성능을 한 번에 얻는 드문 경우입니다.</div>`},

{t:'스프라이트 픽셀 루프',k:'PIXEL LOOP',h:`
<p>모든 조각을 합친 JS 버전의 그리기 루프 전체입니다. 바깥 루프가 세로줄(열), 안쪽 루프가 그 줄의 픽셀입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var i, y, col, tx, ty, c, fog = 1 - Math.min(1, depth / 14);
for (i = 0; i &lt; size; i++) {
  col = sx + i;
  if (col &lt; 0 || col &gt;= W || depth &gt;= zbuf[col]) continue;   // z버퍼 검사
  tx = (i / size * TEX) | 0;
  for (y = 0; y &lt; size; y++) {
    var sy2 = sy + y;
    if (sy2 &lt; 0 || sy2 &gt;= H) continue;
    ty = (y / size * TEX) | 0;
    c = img[ty * TEX + tx];
    if ((c &gt;&gt;&gt; 24) &lt; 128) continue;               // 투명 픽셀 건너뜀
    pix[sy2 * W + col] = shade(c, fog);
  }
}</pre>
<p>핵심은 텍스처 좌표 변환입니다. 화면에서 i번째 열은 64픽셀 원본의 <b>tx = i/size×64</b> 열에 대응합니다. size가 128이면 원본 한 열이 화면 두 열로 늘어나고, size가 32면 한 열씩 건너뛰며 줄어듭니다. 7장에서 벽 텍스처를 늘일 때 쓴 것과 같은 <em>비율 매핑</em>입니다.</p>`},

{t:'pygame 버전 — scale과 1픽셀 열 blit',k:'PYGAME BLIT',h:`
<p>Python에서 픽셀을 하나씩 set_at으로 찍으면 너무 느립니다. 대신 pygame의 장기인 <b>Surface 연산</b>으로 같은 결과를 만듭니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">img = pygame.transform.scale(images[s.kind], (size, size))
# 세로줄 단위로 z버퍼와 비교해 벽 뒤 부분은 그리지 않는다
for i in range(max(0, -sx), min(size, W - sx)):
    col = sx + i
    if depth &lt; zbuf[col]:
        buf.blit(img, (col, sy), pygame.Rect(i, 0, 1, size))</pre>
<ul class="b">
<li><b>transform.scale</b>이 64×64 원본을 size×size로 한 번에 확대합니다. 픽셀 루프의 tx, ty 계산을 통째로 대신하는 셈입니다.</li>
<li>그다음 <b>폭 1픽셀짜리 Rect</b>로 열을 한 줄씩 잘라 blit합니다. 열 단위로 잘라야 열마다 z버퍼 판정을 끼워 넣을 수 있기 때문입니다.</li>
<li>range의 max(0, -sx)와 min(size, W - sx)가 화면 밖 열을 미리 잘라내고, SRCALPHA 덕분에 투명 픽셀은 blit이 알아서 건너뜁니다.</li>
</ul>
<div class="note">JS는 depth ≥ zbuf면 <b>건너뛰고</b>, Python은 depth &lt; zbuf면 <b>그립니다</b>. 부등호 방향만 뒤집힌 같은 판정입니다.</div>`},

{t:'스프라이트에도 안개',k:'FOG',h:`
<p>6장에서 벽에 거리 안개를 깔았습니다. 스프라이트만 말짱하면 어두운 복도 끝에서 임프 혼자 형광등처럼 빛나는 어색한 그림이 됩니다. 그래서 JS 버전은 <em>벽과 똑같은 안개 공식</em>을 스프라이트에도 적용합니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">// renderWalls — 벽:
fog = 1 - Math.min(1, depth / 14);                 // 거리 안개
// renderSprites — 스프라이트도 같은 식:
var i, y, col, tx, ty, c, fog = 1 - Math.min(1, depth / 14);
// ...
pix[sy2 * W + col] = shade(c, fog);</pre>
<p>depth 14칸에서 완전히 어두워지는 같은 직선 감쇠입니다. 같은 거리의 벽과 임프가 <em>같은 밝기</em>가 되어 장면에 자연스럽게 녹아듭니다.</p>
<div class="note blue">pygame 버전(doom.py)의 render_sprites는 안개를 생략했습니다. 픽셀 단위 JS는 shade 한 번이 공짜지만, blit 기반에서는 스프라이트마다 반투명 Surface를 덧대는 추가 비용이 들기 때문입니다. 넣고 싶다면 확대된 img에 어두운 색을 BLEND_MULT로 fill하는 한 줄이면 됩니다.</div>`},

{t:'정리',k:'RECAP',h:`
<div class="big">
<span class="hero">"스프라이트는 3D가 아니다"</span>
위치만 3D로 계산한, 항상 나를 바라보는 <em>2D 그림</em>입니다.<br>
상대 위치 → 상대 각도 → 화면 x → 크기(H/depth) → 먼 것부터,<br>
그리고 벽이 남긴 <b>z버퍼</b>가 열마다 앞뒤를 판정합니다.
</div>
<div class="tagrow">
<span class="tag">billboard</span><span class="tag">atan2 + 정규화</span><span class="tag">size = H/depth</span><span class="tag">painter sort</span><span class="tag">zbuf[col]</span><span class="tag">alpha skip</span>
</div>
<p>다음 장에서는 이 세계 안에서 <em>움직이는 법</em> — 게임 루프, 입력, 그리고 벽에 부딪혀도 미끄러지는 충돌을 만듭니다.</p>`},
]});
</script>
<script>
/* ───────────── CH 10. 이동과 충돌 ───────────── */
CH({
icon:'🕹️', title:'<span class="em">이동과 충돌</span> — 손맛 만들기',
desc:'dt 기반의 프레임 독립 이동, 키보드와 터치를 하나로 합치는 입력 상태 관리, 그리고 벽에 부딪혀도 매끄럽게 미끄러지는 축 분리 충돌까지 — Doom 특유의 경쾌한 조작감을 코드로 완성합니다.',
slides:[
{t:'게임 루프와 시간',k:'GAME LOOP',h:`
<p>게임은 <b>루프</b>입니다. 입력을 읽고, 상태를 갱신하고, 화면을 그리고 — 이것을 1초에 60번 반복합니다. 두 구현의 루프 골격을 봅시다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var last = 0;
function frame(ts) {
  var dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  // ...입력 처리, 이동, 렌더링...
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">clock = pygame.time.Clock()
while True:
    dt = clock.tick(FPS) / 1000.0
    # ...입력 처리, 이동, 렌더링...</pre>
<p>JS의 <b>requestAnimationFrame</b>은 "다음 화면 갱신 직전에 이 함수를 불러 달라"는 브라우저 예약입니다. ts는 밀리초 타임스탬프. pygame의 <b>clock.tick(60)</b>은 60fps를 넘지 않도록 기다렸다가 지난 프레임 이후 흐른 밀리초를 돌려줍니다.</p>
<div class="note">두 코드 모두 계산하는 것은 단 하나, <b>dt</b> — <em>지난 프레임에서 이번 프레임까지 흐른 시간(초)</em>입니다. 60fps라면 dt ≈ 0.0167초. 이 숫자 하나가 이번 장 전체를 관통합니다.</div>`},

{t:'dt 곱하기 — 프레임 독립 이동',k:'DELTA TIME',h:`
<p>초보 시절 흔한 실수는 "한 프레임에 0.05칸씩" 같은 <em>프레임당 고정 이동</em>입니다. 이러면 144Hz 모니터에서는 2.4배 빨리 달리고, 낡은 폰에서는 슬로모션이 됩니다. 답은 속도를 <b>초당</b>으로 정의하고 매번 dt를 곱하는 것입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var dx = Math.cos(player.ang) * MOVE_SPD * dt;
var dy = Math.sin(player.ang) * MOVE_SPD * dt;
if (keys.KeyW) tryMove(player.x + dx, player.y + dy);
if (keys.KeyS) tryMove(player.x - dx, player.y - dy);</pre>
<div class="tblWrap"><table class="tbl">
<tr><th>화면 주사율</th><th>dt</th><th>한 프레임 이동량</th><th>1초 후 총 이동</th></tr>
<tr><td>60 fps</td><td>0.0167초</td><td>3.2 × 0.0167 = 0.053칸</td><td><b>3.2칸</b></td></tr>
<tr><td>30 fps</td><td>0.0333초</td><td>3.2 × 0.0333 = 0.107칸</td><td><b>3.2칸</b></td></tr>
<tr><td>144 fps</td><td>0.0069초</td><td>3.2 × 0.0069 = 0.022칸</td><td><b>3.2칸</b></td></tr>
</table></div>
<p>MOVE_SPD = 3.2는 <em>초당 3.2칸</em>이라는 뜻입니다. 프레임이 잘게 쪼개지든 굵게 쪼개지든, 1초 뒤 도착 지점은 같습니다. 이것이 <b>프레임 독립(frame-independent) 이동</b>입니다.</p>`},

{t:'dt 폭주 방지',k:'DT CLAMP',h:`
<p>JS 루프의 dt 계산에 숨어 있던 장치를 다시 보세요.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var dt = Math.min(0.05, (ts - last) / 1000); last = ts;</pre>
<div class="note red">브라우저는 <b>탭이 백그라운드로 가면 requestAnimationFrame을 멈춥니다</b>. 10초 뒤 탭에 돌아오면 ts - last = 10000ms, 즉 dt = 10초짜리 <em>거대 프레임</em>이 하나 도착합니다. 클램프가 없다면 그 한 프레임에 3.2 × 10 = 32칸을 이동 — 맵 끝까지 순간이동하고, 충돌 검사도 벽을 통째로 건너뛰어 <b>벽 안에 갇히는</b> 참사가 납니다.</div>
<p><b>Math.min(0.05, ...)</b>은 dt를 최대 0.05초(20fps 한 프레임)로 자릅니다. 오래 멈췄다 돌아와도 "긴 시간이 흘렀다"가 아니라 "짧은 프레임 하나"로 취급되어 게임이 살짝 느려질 뿐 망가지지 않습니다.</p>
<p>pygame 쪽은 <b>clock.tick(FPS)</b>이 프레임 사이에서 직접 기다려 주므로 평소엔 안전하지만, 창 드래그 등으로 루프가 오래 멈추는 상황은 같습니다. 같은 클램프를 넣어 두면 더 견고해집니다.</p>`},

{t:'키 입력 상태 관리',k:'INPUT STATE',h:`
<p>키보드는 "눌렀다"와 "뗐다"라는 <b>이벤트</b>만 알려 줍니다. 하지만 이동 코드가 알고 싶은 것은 "지금 W가 <em>눌려 있는가</em>"라는 <b>상태</b>입니다. JS에서는 이벤트를 받아 상태 객체를 직접 만듭니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var keys = {};
window.addEventListener('keydown', function (e) {
  keys[e.code] = true;
  // ...발사, 문 열기 등 단발 동작은 여기서 처리...
});
window.addEventListener('keyup', function (e) { keys[e.code] = false; });</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">keys = pygame.key.get_pressed()
if keys[pygame.K_w]: try_move(pl, pl.x + dx, pl.y + dy)</pre>
<p>pygame은 <b>key.get_pressed()</b>가 전체 키의 현재 상태 배열을 그냥 주므로 만들 것이 없습니다.</p>
<div class="grid2">
<div class="card"><h3>이벤트로 처리</h3><p>한 번 누를 때 한 번 일어나는 일 — 발사(Space), 문 열기(F), 미니맵 토글(Tab)</p></div>
<div class="card"><h3>상태로 처리</h3><p>누르고 있는 동안 계속되는 일 — 전진·후진(W/S), 회전(A/D), 옆걸음(Q/E)</p></div>
</div>`},

{t:'회전',k:'ROTATION',h:`
<p>가장 단순한 이동은 제자리 회전입니다. 시선각에 회전 속도 × dt를 더하거나 뺍니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">if (keys.KeyA) player.ang -= ROT_SPD * dt;
if (keys.KeyD) player.ang += ROT_SPD * dt;</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">if keys[pygame.K_a]: pl.ang -= ROT_SPD * dt
if keys[pygame.K_d]: pl.ang += ROT_SPD * dt</pre>
<p><b>ROT_SPD = 2.6</b>은 초당 2.6라디안 ≈ 149°/초. D를 꾹 누르면 약 2.4초에 한 바퀴를 돕니다. 너무 크면 화면이 홱홱 돌아 멀미가 나고, 너무 작으면 뒤에서 공격당할 때 답답합니다 — 게임 손맛은 이런 상수 튜닝에서 나옵니다.</p>
<div class="note blue">우리 맵은 y가 <em>아래로</em> 커지는 좌표계(2장)라서, ang이 커지는 방향은 화면에서 <b>시계 방향</b>입니다. 그래서 D(+)가 오른쪽 회전이 됩니다. 수학 교과서의 반시계 양수 규약과 반대라는 점, 헷갈릴 때마다 떠올리세요.</div>`},

{t:'전진 벡터',k:'FORWARD VECTOR',h:`
<p>전진은 2장의 복습입니다. 시선각 ang의 <b>단위 방향 벡터는 (cos ang, sin ang)</b>. 여기에 속도와 dt를 곱하면 이번 프레임의 이동 벡터가 됩니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">dx = math.cos(pl.ang) * MOVE_SPD * dt
dy = math.sin(pl.ang) * MOVE_SPD * dt
if keys[pygame.K_w]: try_move(pl, pl.x + dx, pl.y + dy)
if keys[pygame.K_s]: try_move(pl, pl.x - dx, pl.y - dy)</pre>
<p>후진(S)은 새 각도 계산 없이 <em>같은 벡터를 빼기만</em> 하면 됩니다. 아래 데모에서 각도를 돌려 보세요. 초록 점(플레이어)에서 뻗는 방향선이 곧 (cos, sin) 벡터입니다.</p>
<div class="demoWrap"><div class="dTitle">TOP-DOWN MAP</div>
<canvas class="demo" data-demo="topdown" width="512" height="448"></canvas>
<div class="ctl"><label>각도 <input type="range" data-p="ang" min="0" max="360" value="30"><span class="val" data-v="ang"></span></label></div>
</div>`},

{t:'옆걸음 — 스트레이프',k:'STRAFE',h:`
<p>Doom 조작의 백미는 <b>스트레이프(strafe)</b> — 시선은 적에게 고정한 채 옆으로 슬쩍 비켜서는 이동입니다. 전진 벡터에 <em>수직인</em> 벡터가 필요한데, 놀랍게도 새 삼각함수 호출이 필요 없습니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">if (keys.KeyQ) tryMove(player.x + dy, player.y - dx);
if (keys.KeyE) tryMove(player.x - dy, player.y + dx);</pre>
<p>전진 벡터 (dx, dy)의 성분을 <b>맞바꾸고 한쪽 부호만 뒤집은 (dy, -dx)</b>가 정확히 90° 회전한 수직 벡터입니다. 회전 공식에 -90°를 넣어 보면: cos(θ-90°) = sin θ, sin(θ-90°) = -cos θ, 즉 (sinθ, -cosθ) ∝ (dy, -dx). 길이도 원래 벡터와 같아서 옆걸음 속도가 저절로 전진 속도와 같아집니다.</p>
<div class="note blue">왜 (dy, -dx)가 <b>왼쪽</b>일까요? 수학 좌표라면 -90° 회전은 시계 방향이지만, 우리 세계는 y축이 뒤집혀 있어(5번 슬라이드) 화면에서는 <em>반시계 = 시선 기준 왼쪽</em>이 됩니다. 그래서 Q가 왼쪽, 부호를 반대로 한 E의 (-dy, dx)가 오른쪽 옆걸음입니다.</div>`},

{t:'충돌이 없다면',k:'WHY COLLISION',h:`
<p>이동 코드만 넣고 벽을 향해 걸어가 보면 무슨 일이 벌어질까요? 아무 일도 <em>벌어지지 않습니다</em>. 그게 문제입니다. 좌표는 벽 칸 안으로 그냥 들어가고, 카메라가 벽 내부에 들어간 순간 —</p>
<ul class="b">
<li>광선이 출발하자마자 벽에 맞아 <b>dist ≈ 0</b>, lineH = H/depth가 폭발하며 화면이 한 가지 색으로 번쩍입니다.</li>
<li>벽을 통과해 맵 밖으로 나가면 cell()이 전부 1을 돌려주는 <b>무한 벽 세계</b>를 떠돌게 됩니다.</li>
<li>무엇보다, 벽을 뚫고 다니는 세계에는 <em>미로도, 문도, 탈출구도 의미가 없습니다</em>.</li>
</ul>
<p>레이캐스팅 렌더러는 "벽이 저기 보인다"까지만 책임집니다. <em>"벽은 통과할 수 없다"는 규칙은 렌더링과 완전히 별개의 코드</em> — 충돌 검사(collision detection)로 우리가 직접 만들어야 합니다.</p>
<div class="note">다행히 우리 맵은 격자입니다. 임의 다각형과의 충돌 같은 어려운 기하가 아니라, <em>"이 좌표가 속한 칸이 0인가?"</em>라는 배열 조회 한 번이면 됩니다.</div>`},

{t:'가장 단순한 충돌 — 목적지 셀 검사',k:'CELL CHECK',h:`
<p>첫 번째 시도: 이동하기 <em>전에</em> 목적지가 빈칸인지 확인하고, 벽이면 이동을 통째로 취소합니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py"># 단순 버전 — 목적지 칸이 비어 있을 때만 이동
nx, ny = pl.x + dx, pl.y + dy
if cell(int(nx), int(ny)) == 0:
    pl.x, pl.y = nx, ny</pre>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">// 단순 버전
if (cell(nx | 0, ny | 0) === 0) { player.x = nx; player.y = ny; }</pre>
<p>3장에서 만든 <b>cell(x, y)</b>를 그대로 씁니다. int()(JS에서는 | 0)로 소수 좌표를 칸 번호로 내림하면, 좌표 (3.7, 2.1)은 칸 (3, 2)입니다. 그 칸이 0(빈칸)일 때만 좌표를 갱신합니다.</p>
<p>이 네 줄로 벽 뚫기는 사라집니다. 하지만 실제로 플레이해 보면 두 가지가 영 불편합니다. 다음 두 슬라이드에서 하나씩 고칩니다.</p>`},

{t:'문제 1 — 벽에 딱 붙으면 뚫려 보인다',k:'RADIUS 0.25',h:`
<p>플레이어를 <em>점</em>으로 취급하면, 좌표가 벽 칸에 들어가기 직전(예: x = 3.999)까지 접근할 수 있습니다. 카메라가 벽 표면에 코를 박은 셈이라, 살짝만 돌아도 벽 너머가 <b>슬쩍 비쳐 보이는</b> 기분 나쁜 순간이 생깁니다.</p>
<p>해결: 플레이어에게 <b>반지름 r = 0.25칸</b>의 몸집을 줍니다. 목적지 좌표가 아니라 <em>이동 방향으로 r만큼 앞선 지점</em>이 속한 칸을 검사하면, 벽과 항상 0.25칸의 거리가 유지됩니다.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">r = 0.25
if cell(int(nx + math.copysign(r, nx - pl.x)), int(pl.y)) == 0:
    pl.x = nx</pre>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var r = 0.25;
if (cell((nx + (nx &gt; player.x ? r : -r)) | 0, player.y | 0) === 0) player.x = nx;</pre>
<p>Python의 <b>math.copysign(r, nx - pl.x)</b>은 "r에 이동 방향의 부호를 붙여라" — 오른쪽으로 가면 +0.25, 왼쪽이면 -0.25입니다. JS에는 copysign이 없어 삼항 연산자 <b>nx &gt; player.x ? r : -r</b>로 같은 일을 합니다.</p>`},

{t:'문제 2 — 벽에 닿으면 멈춰버림',k:'STICKY WALLS',h:`
<p>목적지 검사 방식의 더 큰 문제는 <b>조작감</b>입니다. 벽을 향해 비스듬히(예: 시선 30°) 걸으면 이동 벡터에는 벽과 <em>평행한 성분</em>과 <em>수직인 성분</em>이 함께 들어 있습니다. 목적지가 벽이라는 이유로 이동 전체를 취소하면, 평행 성분까지 버려져 플레이어가 그 자리에 <b>딱 붙어 멈춥니다</b>.</p>
<ul class="b">
<li>복도를 달리다 어깨가 벽을 스치면 → <em>급정지</em>. 다시 움직이려면 시선을 정확히 복도 방향으로 되돌려야 합니다.</li>
<li>임프에게 쫓기며 코너를 도는 급박한 순간에 벽 모서리에 <em>철썩 붙어버리는</em> 느낌 — 고전 게임에서 흔히 "벽이 끈적하다(sticky walls)"고 부르는 증상입니다.</li>
</ul>
<div class="note">플레이어가 기대하는 동작은 명확합니다. 벽에 비스듬히 부딪히면 <b>막힌 방향만 포기하고, 벽을 따라 미끄러지는 것</b>. Doom, Wolfenstein 3D 등 모든 FPS가 이렇게 동작합니다. 그리고 격자 맵에서는 이것이 놀랄 만큼 쉽게 구현됩니다.</div>`},

{t:'슬라이딩 충돌 — 축 분리',k:'AXIS SEPARATION',h:`
<p>비결은 이동을 <b>x축과 y축으로 쪼개서 따로 검사</b>하는 것입니다. x 이동이 막히면 x만 포기하고, y 이동이 가능하면 y는 진행합니다. 완성된 함수 전체를 봅시다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">function tryMove(nx, ny) {           // 벽에 부딪히면 축별로 미끄러진다
  var r = 0.25;
  if (cell((nx + (nx &gt; player.x ? r : -r)) | 0, player.y | 0) === 0) player.x = nx;
  if (cell(player.x | 0, (ny + (ny &gt; player.y ? r : -r)) | 0) === 0) player.y = ny;
}</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">def try_move(pl, nx, ny):
    """벽에 부딪히면 축별로 나눠 미끄러지게 한다."""
    r = 0.25
    if cell(int(nx + math.copysign(r, nx - pl.x)), int(pl.y)) == 0:
        pl.x = nx
    if cell(int(pl.x), int(ny + math.copysign(r, ny - pl.y))) == 0:
        pl.y = ny</pre>
<p>첫 if는 "x만 nx로 옮겨도 되는가?"를 <em>현재 y</em>에서 검사하고, 둘째 if는 "y만 ny로 옮겨도 되는가?"를 <em>방금 갱신됐을 수도 있는 x</em>에서 검사합니다. 남쪽 벽에 비스듬히 부딪히면 y 이동만 취소되고 x 이동은 살아남아 — 벽을 따라 <b>스르륵 미끄러집니다</b>. 단 여섯 줄입니다.</p>`},

{t:'벽 따라 미끄러지기 체험',k:'LIVE DEMO',h:`

<li>⟲/⟳로 시선을 벽과 <em>비스듬하게</em>(30~60°) 맞추고 ▲를 꾹 누르세요. 멈추지 않고 벽을 따라 흐르듯 이동합니다.</li>
<li>벽에 <em>정면으로</em>(90°) 부딪히면 x·y 둘 다 막혀 제자리에 섭니다 — 올바른 동작입니다.</li>
<li>벽에 최대한 붙어 보세요. r = 0.25 덕분에 텍스처가 화면을 가득 채우기 직전에서 더는 다가가지지 않습니다.</li>

<div class="note grn">축 분리 충돌은 프레임당 cell() 조회 딱 2번 — 사실상 공짜입니다. 물리 엔진 없이도 FPS의 조작감이 나오는 이유입니다.</div>`},

{t:'터치 입력 — 폴더블과 모바일',k:'TOUCH INPUT',h:`
<p>폰이나 폴더블에는 키보드가 없습니다. 화면 버튼이 필요한데, 이동 로직을 하나도 고치지 않고 붙이는 요령이 있습니다. <em>터치 버튼이 keys 객체에 키보드인 척 값을 써넣는 것</em>입니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">// 터치 버튼 (모바일/폴더블)
document.querySelectorAll('#pad button').forEach(function (b) {
  var k = b.dataset.k;
  function down(e) {
    e.preventDefault(); keys[k] = true;
    if (k === 'Space' &amp;&amp; !over) fire();
    if (k === 'KeyF' &amp;&amp; !over) openDoor();
  }
  function up(e) { e.preventDefault(); keys[k] = false; }
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointerleave', up);
});</pre>
<p>각 버튼은 data-k 속성에 자기가 흉내 낼 키 코드(KeyW 등)를 갖고 있습니다. <b>pointerdown</b>이 keys[k] = true, <b>pointerup</b>이 false — keydown/keyup과 완전히 같은 효과라서, 메인 루프의 이동 코드는 입력이 손가락인지 키보드인지 <em>알지도 못합니다</em>.</p>
<div class="note red"><b>pointerleave</b>에도 up을 걸어 둔 것이 실전 포인트입니다. 손가락을 누른 채 버튼 밖으로 미끄러져 나가면 pointerup이 그 버튼에 오지 않아 <em>키가 눌린 채 고정</em>됩니다. 앞으로 영원히 걷는 유령 입력 — pointerleave가 이를 막아 줍니다.</div>`},

{t:'적 이동도 같은 원리',k:'ENEMY MOVE',h:`

if (cell(nx | 0, s.y | 0) === 0) s.x = nx;
if (cell(s.x | 0, ny | 0) === 0) s.y = ny;</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">spd = 1.3 * dt
nx, ny = s.x + math.cos(ang) * spd, s.y + math.sin(ang) * spd
if cell(int(nx), int(s.y)) == 0:
    s.x = nx
if cell(int(s.x), int(ny)) == 0:
    s.y = ny</pre>
<p>구조가 try_move와 판박이입니다. 초당 1.3칸(플레이어 3.2칸보다 느리게 — 도망갈 수 있어야 게임이 되니까), dt 곱하기, x 따로 y 따로. 덕분에 임프도 벽에 끼지 않고 모서리를 <em>미끄러지듯 돌아서</em> 쫓아옵니다.</p>

slides:[

{t:'세계와 상호작용하기',k:'INTERACTION',h:`
<p>지금까지 우리 세계는 <b>구경만 할 수 있는 미술관</b>이었습니다. 벽은 늘 그 자리에 있고, 플레이어가 할 수 있는 일은 걷기와 돌기뿐이었죠. 게임을 게임답게 만드는 것은 <em>세계가 내 행동에 반응하는 순간</em>입니다.</p>

{t:'가장 단순한 문 — 타일 교체',k:'TILE SWAP',h:`
<p>원조 Doom의 문은 천장이 스르륵 올라가는 애니메이션이고, 울펜슈타인 3D의 문은 옆으로 미끄러집니다. 우리는 그보다 훨씬 단순한 방식을 씁니다. <em>문 타일(4)을 빈칸(0)으로 바꿔치기</em> — 그게 전부입니다.</p>
<pre class="code" data-lang="js">world[ty][tx] = 0;   // 문(4)이 있던 칸을 빈칸(0)으로</pre>
<p>왜 이 한 줄로 충분할까요? 5장의 DDA는 <em>매 프레임 <span class="reg">world</span> 배열을 새로 읽으며</em> 광선을 쏩니다. 배열의 숫자 하나가 바뀌면 다음 프레임부터 광선이 그 칸을 그냥 통과하고, 충돌 검사(<span class="reg">tryMove</span>)도 같은 배열을 보므로 몸도 지나갈 수 있게 됩니다.</p>
<div class="grid2">
<div class="card"><h3>렌더러 관점</h3><p>cell(tx,ty)가 0을 돌려주니 광선이 멈추지 않습니다. 문이 "사라져" 보입니다.</p></div>
<div class="card"><h3>물리 관점</h3><p>tryMove의 cell(...) === 0 검사를 통과하니 걸어서 지나갈 수 있습니다.</p></div>
</div>
<div class="note grn">렌더링·충돌·미니맵이 전부 <b>world 배열 하나</b>를 단일 진실 공급원으로 쓰기 때문에, 배열만 고치면 세 시스템이 공짜로 동기화됩니다. 별도의 갱신 코드가 0줄입니다.</div>`},

{t:'내 앞의 칸 찾기',k:'TARGET CELL',h:`
<p>문을 열려면 먼저 <em>"내가 지금 바라보고 있는 칸"</em>이 어디인지 알아야 합니다. 2장의 단위원이 다시 등장합니다. 내 위치에서 시선 방향(<span class="reg">cos(ang), sin(ang)</span>)으로 <b>1.2칸</b> 나아간 지점의 좌표를 구하고, 정수로 내림하면 그 칸의 격자 좌표가 나옵니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">var tx = (player.x + Math.cos(player.ang) * 1.2) | 0;
var ty = (player.y + Math.sin(player.ang) * 1.2) | 0;</pre>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">tx = int(pl.x + math.cos(pl.ang) * 1.2)
ty = int(pl.y + math.sin(pl.ang) * 1.2)</pre>
<p>왜 하필 <b>1.2</b>일까요? 충돌 반지름 0.25 때문에 플레이어는 문 표면에서 최소 0.25칸 떨어져 멈춥니다. 칸 중앙에 서 있어도(경계까지 0.5) 1.2를 더하면 <em>확실히 옆 칸 안쪽</em>(0.7 지점)에 떨어집니다. 반대로 2.0처럼 너무 크면 벽 너머 두 칸 앞의 문이 열리는 유령 손이 됩니다.</p>
<div class="note">1.2는 <b>"한 칸은 확실히 넘고, 두 칸은 절대 못 넘는"</b> 사거리입니다. 0.5(내 칸을 못 벗어날 수 있음) &lt; 1.2 &lt; 2.0(두 칸 앞까지 닿음) 사이에서 고른 값입니다.</div>`},

{t:'문 열기 코드 전문',k:'OPEN DOOR',h:`
<p>대상 칸을 찾았으면 나머지는 조건 검사 두 개입니다. 함수 전체가 열 줄이 안 됩니다.</p>
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">function openDoor() {

<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">def open_door(pl):

{t:'출구 타일 — 승리 조건',k:'EXIT TILE',h:`
<p>맵 오른쪽 아래 구석에는 타일 <span class="reg">5</span>, 빨간 체커무늬 <b>출구</b>가 있습니다. 출구는 문과 똑같이 openDoor 경로로 처리하지만, 칸을 바꾸는 대신 <em>게임 상태를 "종료"로 바꿉니다</em>.</p>
<span class="codeLabel py">Python</span>
<pre class="code" data-lang="py">if e.key == pygame.K_f and not over:

    if m == 'EXIT':

<p><span class="reg">over</span>는 평소엔 빈 문자열이고, 값이 들어가는 순간 게임 오버 화면 문구가 됩니다. 메인 루프의 이동·AI 갱신이 전부 <span class="reg">if not over:</span> 아래에 있어서, over가 차면 <em>세계가 그대로 얼어붙습니다</em> — 렌더링은 계속 돌므로 마지막 장면 위에 문구만 떠 있게 됩니다.</p>
