<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>📊 스프레드시트 대백과 — 비지칼크부터 클라우드까지, 세상을 계산한 격자 (200+ 슬라이드)</title>
<meta name="description" content="1979년 비지칼크(VisiCalc)가 개인용 컴퓨터를 '장난감'에서 '도구'로 바꾼 킬러앱이 된 이야기부터, 로터스 1-2-3·엑셀·구글 시트로 이어진 스프레드시트 소프트웨어의 역사, 그리고 그 격자가 현대 기업의 재무·경영·운영을 어떻게 재편했는지까지 담은 동적 HTML 슬라이드 대백과.">
<style>
  :root{
    --bg1:#0a1310; --bg2:#0d1b16; --panel:#122019; --panel2:#0c1611;
    --ink:#e9f3ec; --mut:#9fbcaf; --acc:#34d399; --acc2:#5eead4;
    --line:rgba(120,200,160,.28); --line2:rgba(120,200,160,.14);
    --good:#7ce38b; --warn:#ffb454; --pink:#ff7a90; --purple:#e394ff;
    --mint:#94f5d0; --gold:#ffd166; --sky:#7dd3fc; --grid:#1c3329;
  }
  *{box-sizing:border-box}
  html{
    font-size:clamp(14px, 0.55vw + 0.55vh + 8px, 21px);
    -webkit-text-size-adjust:100%;
  }
  body{
    margin:0; height:100dvh; overflow:hidden;
    color:var(--ink);
    background:radial-gradient(1200px 800px at 78% -10%, #17352a 0%, transparent 60%),
               radial-gradient(900px 700px at -10% 110%, #123024 0%, transparent 55%),
               linear-gradient(160deg, var(--bg1), var(--bg2));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    line-height:1.62; word-break:keep-all;
  }
  #deck{display:flex; flex-direction:column; height:100dvh}
  #bar{height:4px; background:linear-gradient(90deg,var(--acc),var(--acc2)); width:0%; transition:width .25s; flex:none}

  header#top{
    flex:none; display:flex; align-items:center; gap:.7em;
    padding:.45em clamp(.8em,2.5vw,1.6em); border-bottom:1px solid var(--line2);
    background:rgba(10,19,16,.6); backdrop-filter:blur(8px);
  }
  header#top .brand{font-weight:800; letter-spacing:.02em; white-space:nowrap}
  header#top .brand small{color:var(--mut); font-weight:400}
  #secbadge{
    margin-left:auto; font-size:.78em; font-weight:700; padding:.15em .8em;
    border-radius:999px; border:1px solid var(--line); white-space:nowrap;
  }

  #stage{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    padding:clamp(.9em,2vh,1.6em) clamp(.9em,4vw,3em) 5.5em}
  .slide{max-width:1180px; margin:0 auto; animation:fadein .22s ease}
  @keyframes fadein{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

  .slide h1{font-size:clamp(1.35em,1.2em + 1.2vw,2.05em); line-height:1.25; margin:.1em 0 .55em}
  .slide h1 .no{color:var(--mut); font-size:.55em; font-weight:600; vertical-align:.35em; margin-right:.5em}
  .slide h2{font-size:1.18em; margin:1.1em 0 .45em; color:var(--sky)}
  .slide h3{font-size:1.02em; margin:.9em 0 .35em; color:var(--mint)}
  .slide p{margin:.45em 0}
  .slide ul,.slide ol{margin:.4em 0 .7em; padding-left:1.35em}
  .slide li{margin:.3em 0}
  .slide li>ul{margin:.15em 0}
  .slide strong{color:#fff}
  .slide em{color:var(--gold); font-style:normal}
  .slide a{color:var(--acc); text-decoration:none; border-bottom:1px dotted rgba(52,211,153,.5)}
  .slide a:hover{color:#8ff0cf}
  .mut{color:var(--mut)} .small{font-size:.85em}
  code{font-family:"SF Mono",Consolas,"D2Coding",monospace; background:rgba(80,200,150,.16);
       padding:.08em .38em; border-radius:6px; font-size:.9em}
  pre.code{
    background:#081210; border:1px solid var(--line2); border-radius:12px;
    padding:.9em 1.1em; overflow-x:auto; font-size:.82em; line-height:1.55;
    font-family:"SF Mono",Consolas,"D2Coding",monospace;
  }
  pre.code code{background:none; padding:0; font-size:1em}
  .cm{color:#6f9384} .kw{color:#5eead4} .st{color:#a5e3a1} .nb{color:#ffd166} .fn{color:#7dd3fc}

  .fx{
    background:linear-gradient(120deg, rgba(52,211,153,.12), rgba(94,234,212,.08));
    border-left:4px solid var(--acc); border-radius:10px;
    padding:.7em 1em; margin:.7em 0; font-size:1.04em; overflow-x:auto;
  }
  .fx .big{font-size:1.25em}
  /* 본문 인라인 강조 — 블록 .fx와 달리 줄바꿈에 안전한 형태로 덮어쓰기 */
  span.fx, b.fx{
    display:inline; border-left:none; margin:0; font-size:inherit; overflow:visible;
    padding:.05em .32em; border-radius:6px;
    background:linear-gradient(120deg, rgba(52,211,153,.20), rgba(94,234,212,.13));
    color:var(--mint); font-weight:600;
    -webkit-box-decoration-break:clone; box-decoration-break:clone;
  }
  b.fx{font-weight:700}
  span.fx.big{font-size:1.12em}
  span.warnbox{
    display:inline; border-left:none; margin:0; font-size:inherit;
    padding:.05em .32em; border-radius:6px;
    background:rgba(255,93,115,.16); color:var(--pink); font-weight:600;
    -webkit-box-decoration-break:clone; box-decoration-break:clone;
  }
  .note{
    background:rgba(255,180,84,.08); border-left:4px solid var(--warn);
    border-radius:10px; padding:.6em 1em; margin:.7em 0; font-size:.93em;
  }
  .tip{
    background:rgba(124,227,139,.08); border-left:4px solid var(--good);
    border-radius:10px; padding:.6em 1em; margin:.7em 0; font-size:.93em;
  }
  .warnbox{
    background:rgba(255,93,115,.09); border-left:4px solid var(--pink);
    border-radius:10px; padding:.6em 1em; margin:.7em 0; font-size:.93em;
  }
  .quote{
    border-left:4px solid var(--purple); background:rgba(227,148,255,.07);
    border-radius:0 10px 10px 0; padding:.6em 1.1em; margin:.8em 0; font-style:italic;
  }
  .quote .by{display:block; font-style:normal; color:var(--mut); font-size:.85em; margin-top:.4em; text-align:right}

  .cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr)); gap:1.1em; align-items:start}
  .cols3{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr)); gap:.9em; align-items:start}

  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr)); gap:.8em; margin:.7em 0}
  .slide ul.cards{list-style:none; padding-left:0}
  .card{background:var(--panel); border:1px solid var(--line2); border-radius:14px; padding:.85em 1em}
  .card .ic{font-size:1.5em; line-height:1}
  .card h4{margin:.3em 0 .25em; font-size:1em; color:var(--acc2)}
  .card p{margin:.2em 0; font-size:.9em; color:var(--mut)}

  .stat{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr)); gap:.8em; margin:.8em 0}
  .stat .s{background:var(--panel); border:1px solid var(--line2); border-radius:14px; padding:.8em 1em; text-align:center}
  .stat .s .n{font-size:1.8em; font-weight:900; color:var(--acc); line-height:1.1; font-variant-numeric:tabular-nums}
  .stat .s .l{font-size:.8em; color:var(--mut); margin-top:.2em}

  .tw{overflow-x:auto; margin:.6em 0}
  table.tbl{border-collapse:collapse; width:100%; font-size:.9em; min-width:480px}
  table.tbl th,table.tbl td{border:1px solid var(--line2); padding:.42em .7em; text-align:left; vertical-align:top}
  table.tbl th{background:rgba(52,211,153,.12); white-space:nowrap}
  table.tbl tr:nth-child(even) td{background:rgba(120,200,160,.05)}
  table.tbl td.c,table.tbl th.c{text-align:center}

  figure.ph{margin:.8em auto; text-align:center; max-width:660px}
  figure.ph img{
    max-width:100%; max-height:46vh; border-radius:12px;
    border:1px solid var(--line); background:#e7efe9; object-fit:contain;
  }
  figure.ph figcaption{font-size:.8em; color:var(--mut); margin-top:.45em; line-height:1.45}
  figure.ph .src{opacity:.75}
  figure.broken img{display:none}
  figure.broken::before{
    content:"🖼️ 이미지를 불러오지 못했습니다 — 오프라인이거나 원본이 이동됨. 캡션 링크로 확인하세요.";
    display:block; padding:1.2em 1em; border:1.5px dashed var(--line);
    border-radius:12px; color:var(--mut); font-size:.85em;
  }
  .figrow{display:flex; flex-wrap:wrap; gap:1em; justify-content:center; margin:.8em 0}
  .figrow figure{flex:1 1 250px; max-width:460px}

  /* 인라인 SVG 시각자료 */
  .svgwrap{margin:.9em auto; text-align:center; max-width:900px}
  .svgwrap svg{max-width:100%; height:auto; border-radius:12px; border:1px solid var(--line2);
    background:rgba(8,18,15,.55)}
  .svgwrap figcaption{font-size:.8em; color:var(--mut); margin-top:.4em}
  svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}

  .timeline{list-style:none; padding-left:0}
  .timeline li{
    margin:.34em 0; padding:.4em .8em .4em 1em; border-left:3px solid var(--acc2);
    background:rgba(94,234,212,.06); border-radius:0 10px 10px 0;
  }
  .timeline .yr{display:inline-block; min-width:4.4em; font-weight:800; color:var(--gold); font-family:Consolas,monospace}

  .links{list-style:none; padding-left:0}
  .links li{margin:.45em 0; padding:.5em .9em; background:var(--panel2);
    border:1px solid var(--line2); border-radius:10px}
  .links li .k{display:inline-block; font-size:.72em; font-weight:700; padding:0 .6em;
    border-radius:6px; margin-right:.6em; vertical-align:.1em}
  .k.doc{background:rgba(52,211,153,.18); color:var(--acc)}
  .k.paper{background:rgba(227,148,255,.18); color:var(--purple)}
  .k.video{background:rgba(255,122,144,.18); color:var(--pink)}
  .k.src{background:rgba(124,227,139,.18); color:var(--good)}
  .k.wiki{background:rgba(255,209,102,.18); color:var(--gold)}
  .k.book{background:rgba(125,211,252,.18); color:var(--sky)}

  .tg{display:inline-block; font-size:.72em; font-weight:700; padding:.05em .5em; border-radius:6px; margin-right:.35em}
  .tg.a{background:rgba(52,211,153,.18); color:var(--acc)}
  .tg.b{background:rgba(227,148,255,.18); color:var(--purple)}
  .tg.c{background:rgba(255,180,84,.18); color:var(--warn)}
  .kbd{display:inline-block; background:#14261e; border:1px solid var(--line); border-bottom-width:2px;
    border-radius:6px; padding:0 .45em; font-family:Consolas,monospace; font-size:.85em}

  /* ===== 인터랙티브 데모 ===== */
  .demo{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:1em 1.1em; margin:.9em 0}
  .demo .dh{font-size:.82em; color:var(--acc2); font-weight:700; margin-bottom:.6em; letter-spacing:.02em}
  .demo .ctl{display:flex; flex-wrap:wrap; gap:.6em .9em; align-items:center; margin:.6em 0}
  .demo button, .demo select, .demo input[type=number], .demo input[type=text]{
    background:#16281f; color:var(--ink); border:1px solid var(--line);
    border-radius:9px; padding:.42em .8em; font-size:.92em; cursor:pointer; font-family:inherit;
  }
  .demo input[type=text],.demo input[type=number]{cursor:text}
  .demo button:hover{background:#1e3428}
  .demo button.on{background:var(--acc); color:#04231a; font-weight:700}
  .demo input[type=range]{width:min(280px,60vw); accent-color:var(--acc)}
  .demo .out{font-family:Consolas,"D2Coding",monospace; font-size:.9em; color:var(--mint); margin-top:.5em; min-height:1.2em}

  /* 스프레드시트 그리드 데모 */
  table.ss{border-collapse:collapse; font-family:Consolas,"D2Coding",monospace; font-size:.86em; margin:.3em 0; background:#0a1512}
  table.ss th,table.ss td{border:1px solid var(--grid); padding:.2em .1em; text-align:center; min-width:3.6em; height:1.9em}
  table.ss th{background:#132821; color:var(--mut); font-weight:600; min-width:2em; width:2em}
  table.ss td{color:var(--ink)}
  table.ss td.num{color:var(--acc2); text-align:right; padding-right:.5em}
  table.ss td.sel{outline:2px solid var(--acc); outline-offset:-2px}
  table.ss td.hl{background:rgba(255,209,102,.14)}
  table.ss input{width:100%; box-sizing:border-box; background:#04120d; color:var(--gold); border:none;
    font-family:inherit; font-size:1em; text-align:right; padding:.1em .3em}
  .ssbar{font-family:Consolas,monospace; font-size:.82em; color:var(--mut); margin:.2em 0 .5em;
    background:#04120d; border:1px solid var(--grid); border-radius:6px; padding:.25em .6em}
  .ssbar b{color:var(--gold)}

  /* 막대 차트 데모 */
  .barchart{display:flex; align-items:flex-end; gap:.5em; height:150px; margin:.6em 0; padding-top:1em}
  .barchart .bar{flex:1; background:linear-gradient(180deg,var(--acc),var(--acc2)); border-radius:6px 6px 0 0;
    position:relative; min-height:2px; transition:height .8s cubic-bezier(.2,.8,.2,1)}
  .barchart .bar span{position:absolute; top:-1.3em; left:0; right:0; text-align:center; font-size:.72em; color:var(--acc2)}
  .barchart .bar em{position:absolute; bottom:-1.5em; left:0; right:0; text-align:center; font-size:.7em; color:var(--mut); font-style:normal}

  /* 표지 */
  .cover{text-align:center; padding-top:4vh}
  .cover .mega{
    font-size:clamp(2.3em, 2em + 3vw, 4.2em); font-weight:900; line-height:1.15; margin:.2em 0;
    background:linear-gradient(90deg,var(--acc),#b9f5df,var(--acc2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .cover .sub{font-size:1.15em; color:var(--mut); max-width:40em; margin:0 auto 1.4em}
  .cover .chips{display:flex; flex-wrap:wrap; gap:.6em; justify-content:center; margin:1.2em 0}
  .cover .chips span{border:1px solid var(--line); border-radius:999px; padding:.3em 1em; font-size:.88em; background:rgba(18,32,25,.7)}

  /* 섹션 표지 */
  .secintro{text-align:center; padding-top:8vh}
  .secintro .kick{font-family:Consolas,monospace; color:var(--acc); letter-spacing:.3em; font-size:.9em}
  .secintro h1{font-size:clamp(1.8em,1.5em+2vw,3em); margin:.3em 0; border:none}
  .secintro p{max-width:34em; margin:.5em auto; color:var(--mut)}

  /* 하단 내비 */
  nav#ctl{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; align-items:center; justify-content:center; gap:.55em;
    padding:.5em max(.8em, env(safe-area-inset-left)) calc(.5em + env(safe-area-inset-bottom));
    background:rgba(8,14,11,.82); backdrop-filter:blur(10px); border-top:1px solid var(--line2);
  }
  nav#ctl button{
    background:#16281f; color:var(--ink); border:1px solid var(--line);
    border-radius:11px; min-width:2.9em; min-height:2.55em; font-size:1em; cursor:pointer;
  }
  nav#ctl button:hover{background:#1e3428}
  nav#ctl button.wide{padding:0 1.05em}
  #cnt{font-family:Consolas,monospace; font-size:.95em; color:var(--mut); min-width:6.2em; text-align:center}

  /* 목차 오버레이 */
  #toc{
    position:fixed; inset:0; z-index:40; display:none; overflow-y:auto;
    background:rgba(6,12,9,.96); backdrop-filter:blur(10px);
    padding:1.2em clamp(1em,4vw,3em) 3em;
  }
  #toc.open{display:block}
  #toc .tochead{display:flex; align-items:center; gap:1em; flex-wrap:wrap; margin-bottom:1em}
  #toc h2{margin:.2em 0; font-size:1.4em}
  #toc .close{margin-left:auto; font-size:1.1em; background:#16281f; color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:.45em 1.1em; cursor:pointer}
  #toc .jump{display:flex; gap:.5em; align-items:center; font-size:.9em; color:var(--mut)}
  #toc .jump input{width:5.5em; background:#0e1c16; border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:.4em .6em; font-size:1em}
  #toc h3{margin:1.1em 0 .4em; font-size:1.02em}
  #toc .tgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr)); gap:.45em}
  #toc .tgrid button{
    text-align:left; background:var(--panel2); color:var(--ink); border:1px solid var(--line2);
    border-radius:9px; padding:.42em .7em; font-size:.83em; cursor:pointer; line-height:1.4;
    font-family:inherit;
  }
  #toc .tgrid button:hover{border-color:var(--acc); background:#122a20}
  #toc .tgrid button .n{color:var(--mut); font-family:Consolas,monospace; margin-right:.5em; font-size:.85em}
  #toc .tgrid button.cur{border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset}

  @media (max-width:640px){
    #stage{padding:1em .85em 5.6em}
    nav#ctl button.wide{padding:0 .7em}
    #cnt{min-width:5em; font-size:.85em}
    table.tbl{font-size:.82em}
    .stat .s .n{font-size:1.5em}
  }
  @media (min-aspect-ratio:4/5) and (max-aspect-ratio:5/4) and (min-width:700px){
    .slide{max-width:min(1180px, 94vw)}
    figure.ph img{max-height:40vh}
  }
  @media (hover:none){ nav#ctl button:hover{background:#16281f} }
</style>
</head>
<body>
<div id="deck">
  <div id="bar"></div>
  <header id="top">
    <span class="brand">📊 스프레드시트 대백과 <small>— VisiCalc → Cloud</small></span>
    <span id="secbadge"></span>
  </header>
  <main id="stage" aria-live="polite"></main>
  <nav id="ctl">
    <button id="bFirst" title="처음 (Home)">⏮</button>
    <button id="bPrev" class="wide" title="이전 (←)">◀ 이전</button>
    <span id="cnt">- / -</span>
    <button id="bNext" class="wide" title="다음 (→ / Space)">다음 ▶</button>
    <button id="bLast" title="끝 (End)">⏭</button>
    <button id="bToc" class="wide" title="목차 (T)">📑 목차</button>
  </nav>
</div>

<div id="toc">
  <div class="tochead">
    <h2>📑 전체 목차</h2>
    <div class="jump">
      <label for="jumpN">번호 이동:</label>
      <input id="jumpN" type="number" min="1" inputmode="numeric">
      <button class="close" id="jumpGo" style="margin-left:0;padding:.4em .8em">이동</button>
    </div>
    <button class="close" id="tocClose">✕ 닫기 (Esc)</button>
  </div>
  <div id="tocBody"></div>
</div>

<script>
'use strict';
/* ============================================================
 * 스프레드시트 대백과 — 동적 슬라이드 덱
 * 슬라이드는 아래 S 배열(sl 호출)로 구성.
 * ============================================================ */

/* ---------- 섹션 정의(배지 색) ---------- */
var SECS = {
  '표지':'#34d399', '개요':'#7ce38b', '선사':'#ffb454', '비지칼크':'#ffd166',
  '킬러앱':'#ff7a90', '경쟁':'#8aa2ff', '로터스':'#e394ff', '엑셀':'#94f5d0',
  '현대':'#7dd3fc', '개념':'#5eead4', '경영':'#ffd166', '운영':'#ff9e64',
  '리스크':'#ff5d73', '유산':'#94f5d0', '미래':'#6ee7b7', '마무리':'#34d399'
};

/* ---------- 이미지·링크 헬퍼 ---------- */
var FP = 'https://commons.wikimedia.org/wiki/Special:FilePath/';
var FILE = 'https://commons.wikimedia.org/wiki/File:';
function fig(name, cap, wpx){
  var u = FP + encodeURIComponent(name) + '?width=' + (wpx || 800);
  var p = FILE + encodeURIComponent(name);
  return '<figure class="ph"><a href="' + p + '" target="_blank" rel="noopener">' +
    '<img loading="lazy" src="' + u + '" alt="' + cap.replace(/"/g,'&quot;') + '"' +
    ' onerror="this.closest(\'figure\').classList.add(\'broken\')"></a>' +
    '<figcaption>' + cap + ' <span class="src">— <a href="' + p + '" target="_blank" rel="noopener">Wikimedia Commons</a></span></figcaption></figure>';
}

sl('경쟁', 'Multiplan', `

ight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#34d399"/></marker></defs><text x="405" y="230" fill="#ffd166" font-size="12" text-anchor="middle">셀 주소 = 열문자 + 행번호</text><text x="405" y="248" fill="#e394ff" font-size="13" text-anchor="middle">B1, C4, AA10 …</text></svg>', '통합문서 → 시트 → 행·열 → 셀의 4계층 구조와 A1 표기법') + `

sl('개념', '값 vs 수식 vs 서식', `

  <div class="card"><div class="ic">🔢</div><h4>값 (value)</h4><p>수식을 재계산해 얻은 결과. 셀 격자에 표시되는 실제 데이터로, 다른 수식이 참조하는 대상입니다.</p></div>
  <div class="card"><div class="ic">🎨</div><h4>서식 (format)</h4><p>값을 어떻게 <i>보여줄지</i>. 통화·백분율·날짜·소수 자릿수·색. 저장된 값 자체는 바꾸지 않습니다.</p></div>
</div>

<p class="mut small">부동소수점 함정: 0.1+0.2가 0.30000000000000004로 저장되어도 기본 서식이 반올림해 0.3으로 보입니다. 표시값과 저장값이 다를 수 있음을 늘 기억하세요.</p>`);

sl('개념', '재계산 엔진과 의존성 그래프', `
<h1><span class="no">9.3</span>재계산 엔진 — 의존성 그래프와 자연순서</h1>
<p>수식 하나를 바꾸면 그것에 의존하는 모든 셀이 <b>올바른 순서로</b> 다시 계산되어야 합니다. 엔진은 셀 간 참조를 <b>방향 그래프</b>로 보고, <b>위상정렬(topological sort)</b>로 계산 순서를 정합니다. 이것이 LANPAR(1969)가 처음 구현한 <b>자연순서 재계산(natural-order recalculation)</b>입니다.</p>

sl('개념', '순환참조와 반복계산', `
<h1><span class="no">9.4</span>순환참조 — 그래프에 생긴 고리</h1>
<p>의존성 그래프에 <b>사이클(cycle)</b>이 생기면 위상정렬이 불가능합니다. A1이 B1을 참조하고 B1이 다시 A1을 참조하면, 어느 것을 먼저 계산해야 할지 정할 수 없습니다.</p>

sl('개념', '상대·절대·혼합 참조', `

sl('개념', '필수 함수 지도', `

<p>수백 개의 내장 함수는 대략 여섯 갈래로 나뉩니다. 이 골격만 익히면 대부분의 실무를 감당할 수 있습니다.</p>

sl('개념', '조회 함수 심화 비교', `

sl('개념', '피벗테이블 — 집계의 혁명', `

  <div>
    <p><b>손익분기점(BEP)</b>은 고정비를 단위당 공헌이익으로 나눈 값입니다. 스프레드시트는 이 계산을 표준화했습니다.</p>
    <pre class="code"><code><span class="cm">// 공헌이익 = 단가 - 변동원가</span>
공헌이익 = 8000 - 4500 = <span class="nb">3500</span>
<span class="cm">// 손익분기 수량 = 고정비 / 공헌이익</span>
BEP = 3000000 / 3500 ≈ <span class="nb">857</span> 개</code></pre>
  </div>
  <div>

</div>`);

sl('운영', '데이터 수집·정리·클렌징의 만능 도구', `
<h1><span class="no">11.6</span>데이터를 다루는 첫 번째 손</h1>
<p>운영 데이터는 대개 스프레드시트에서 처음 만난다. 여러 시스템의 CSV를 붙여 넣고, 중복을 제거하고, 형식을 통일하고, 결측치를 채우는 — 이른바 데이터 클렌징의 90%가 여기서 벌어진다. 데이터 분석의 "0번째 단계"다.</p>
<div class="cards">
<div class="card"><div class="ic">🧹</div><h4>정제</h4><p>TRIM·CLEAN으로 공백 제거, PROPER로 대소문자 통일, 중복 제거로 정규화.</p></div>
<div class="card"><div class="ic">🔗</div><h4>결합</h4><p>VLOOKUP·INDEX/MATCH·XLOOKUP으로 여러 표를 키 기준으로 조인.</p></div>
<div class="card"><div class="ic">🔀</div><h4>변환</h4><p>텍스트 나누기, 날짜 파싱, 파워쿼리로 반복 변환 파이프라인 저장.</p></div>
<div class="card"><div class="ic">✅</div><h4>검증</h4><p>데이터 유효성·조건부서식으로 이상치와 오타를 시각적으로 색출.</p></div>
</div>
<pre class="code"><code><span class="cm">// 흔한 클렌징 수식 예</span>
=<span class="fn">TRIM</span>(<span class="fn">PROPER</span>(A2))              <span class="cm">// 공백 제거 + 첫 글자 대문자</span>
=<span class="fn">IFERROR</span>(<span class="fn">VLOOKUP</span>(A2,코드표,2,0),<span class="st">"미매칭"</span>)  <span class="cm">// 조인 + 예외 처리</span>
=<span class="fn">IF</span>(B2=<span class="st">""</span>,<span class="fn">AVERAGE</span>(B:B),B2)     <span class="cm">// 결측치를 평균으로 대체</span></code></pre>
<div class="note">"조용한 ETL 도구" — 데이터 웨어하우스 파이프라인에 들어가기 전, 수많은 데이터가 사람 손을 거쳐 스프레드시트에서 정돈된다.</div>`);

sl('운영', '부서 간 공용어·양식 표준화', `

sl('운영', 'ERP·BI가 있어도 사라지지 않는 이유', `

function initDemos(root){
  root.querySelectorAll('[data-demo]').forEach(function(box){
    var k = box.getAttribute('data-demo');
    try{
      if (k === 'sheet') initSheet(box);
      else if (k === 'whatif') initWhatIf(box);
      else if (k === 'bars') initBars(box);
      else if (k === 'count') initCount(box);
    }catch(e){ /* 데모 실패는 슬라이드를 막지 않음 */ }
  });
}

/* --- 1) 미니 스프레드시트: 셀 참조·산술·SUM 지원 --- */
function initSheet(box){
  var cols = ['A','B','C','D'], rows = 6;
  var seed = {};
  try{ seed = JSON.parse(box.getAttribute('data-seed') || '{}'); }catch(e){ seed = {}; }
  var data = {};
  cols.forEach(function(c){ for (var r=1;r<=rows;r++){ data[c+r] = (seed[c+r]!==undefined? String(seed[c+r]) : ''); } });
  var sel = box.getAttribute('data-sel') || 'A1';

  var barEl = document.createElement('div'); barEl.className='ssbar';
  var tbl = document.createElement('table'); tbl.className='ss';
  box.appendChild(barEl); box.appendChild(tbl);

  function colIdx(c){ return cols.indexOf(c); }
  function evalCell(ref, seen){
    seen = seen || {};
    if (seen[ref]) return NaN; seen[ref]=true;
    var raw = (data[ref]||'').trim();
    if (raw === '') return 0;
    if (raw[0] !== '=') { var n = parseFloat(raw); return isNaN(n)? NaN : n; }
    return evalFormula(raw.slice(1), seen);
  }
  function evalFormula(expr, seen){
    expr = expr.toUpperCase().replace(/\s+/g,'');
    // SUM(A1:A5)
    expr = expr.replace(/SUM\(([A-D])(\d+):([A-D])(\d+)\)/g, function(_, c1, r1, c2, r2){
      var a=colIdx(c1), b=colIdx(c2), lo=Math.min(+r1,+r2), hi=Math.max(+r1,+r2), s=0;
      for (var ci=Math.min(a,b); ci<=Math.max(a,b); ci++)
        for (var ri=lo; ri<=hi; ri++){ var v=evalCell(cols[ci]+ri, Object.assign({},seen)); if(!isNaN(v)) s+=v; }
      return '(' + s + ')';
    });
    // 셀 참조 치환
    expr = expr.replace(/([A-D]\d+)/g, function(m){ var v=evalCell(m, Object.assign({},seen)); return '(' + (isNaN(v)?'0':v) + ')'; });
    if (!/^[-+*/().0-9]+$/.test(expr)) return NaN;
    try{ /* eslint-disable no-new-func */ var f=new Function('return ('+expr+')'); var out=f(); return (typeof out==='number' && isFinite(out))? out : NaN; }
    catch(e){ return NaN; }
  }
  function disp(ref){
    var raw=(data[ref]||'').trim();
    if (raw==='' ) return {t:'', num:false};
    if (raw[0]==='='){ var v=evalFormula(raw.slice(1),{}); return {t:(isNaN(v)?'#ERR':(Math.round(v*100)/100)), num:true}; }
    var n=parseFloat(raw); return {t:raw, num:(!isNaN(n)&&/^-?[\d.]+$/.test(raw))};
  }
  function refsIn(ref){
    var raw=(data[ref]||''); if(raw[0]!=='=') return [];
    var set={}; var out=[];
    raw.toUpperCase().replace(/SUM\(([A-D])(\d+):([A-D])(\d+)\)/g,function(_,c1,r1,c2,r2){
      var a=colIdx(c1),b=colIdx(c2),lo=Math.min(+r1,+r2),hi=Math.max(+r1,+r2);
      for(var ci=Math.min(a,b);ci<=Math.max(a,b);ci++)for(var ri=lo;ri<=hi;ri++){var k=cols[ci]+ri; if(!set[k]){set[k]=1;out.push(k);}}
      return '';
    }).replace(/([A-D]\d+)/g,function(m){ if(!set[m]){set[m]=1;out.push(m);} return ''; });
    return out;
  }
  function render(){
    var html='<tr><th></th>'; cols.forEach(function(c){ html+='<th>'+c+'</th>'; }); html+='</tr>';
    var hl = refsIn(sel);
    for (var r=1;r<=rows;r++){
      html+='<tr><th>'+r+'</th>';
      cols.forEach(function(c){
        var ref=c+r, d=disp(ref), cls=[];
        if (d.num) cls.push('num');
        if (ref===sel) cls.push('sel');
        if (hl.indexOf(ref)>=0) cls.push('hl');
        html+='<td class="'+cls.join(' ')+'" data-ref="'+ref+'">'+(d.t===''?'&nbsp;':d.t)+'</td>';
      });
      html+='</tr>';
    }
    tbl.innerHTML=html;
    var raw=data[sel]||'';
    barEl.innerHTML='<b>'+sel+'</b> &nbsp;'+(raw? raw.replace(/</g,'&lt;') : '<span class="mut">(빈 셀)</span>')+
      (raw[0]==='=' ? ' &nbsp;→ <b>'+disp(sel).t+'</b>' : '');
    tbl.querySelectorAll('td[data-ref]').forEach(function(td){
      td.onmousedown=function(e){
        if(td.querySelector('input')) return;
        var open=tbl.querySelector('input');
        if(open) open.blur();
        e.preventDefault();
        sel=td.getAttribute('data-ref'); edit();
      };
    });
  }
  function edit(){
    render();
    var td=tbl.querySelector('td[data-ref="'+sel+'"]'); if(!td) return;
    var inp=document.createElement('input'); inp.value=data[sel]||''; td.textContent=''; td.appendChild(inp); inp.focus(); inp.select();
    var ref=sel, done=false;
    function commit(){ if(done) return; done=true; data[ref]=inp.value; render(); }
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ commit(); var r=parseInt(sel.slice(1),10); if(r<rows){ sel=sel[0]+(r+1); edit(); } e.preventDefault(); }
      else if(e.key==='Tab'){ commit(); var ci=colIdx(sel[0]); if(ci<cols.length-1){ sel=cols[ci+1]+sel.slice(1); edit(); } e.preventDefault(); }
      else if(e.key==='Escape'){ done=true; render(); }
    });
  }
  render();
}

/* --- 2) What-if 재무 모델: 가정 슬라이더 → 결과 실시간 재계산 --- */
function initWhatIf(box){
  var price=box.querySelector('[data-w="price"]');
  var units=box.querySelector('[data-w="units"]');
  var cost=box.querySelector('[data-w="cost"]');
  var fixed=box.querySelector('[data-w="fixed"]');
  var out=box.querySelector('[data-w="out"]');
  function fmt(n){ return '₩' + Math.round(n).toLocaleString('ko-KR'); }
  function upd(){
    var p=+price.value, u=+units.value, c=+cost.value, f=+fixed.value;
    var rev=p*u, cogs=c*u, gross=rev-cogs, op=gross-f;
    var margin=rev? (op/rev*100):0;
    box.querySelectorAll('[data-lb]').forEach(function(el){
      var k=el.getAttribute('data-lb');
      if(k==='price') el.textContent=fmt(p);
      if(k==='units') el.textContent=u.toLocaleString('ko-KR')+'개';
      if(k==='cost') el.textContent=fmt(c);
      if(k==='fixed') el.textContent=fmt(f);
    });
    out.innerHTML='매출 <b>'+fmt(rev)+'</b> · 매출원가 '+fmt(cogs)+' · 매출총이익 <b>'+fmt(gross)+'</b><br>'+
      '고정비 '+fmt(f)+' → 영업이익 <b style="color:'+(op>=0?'var(--good)':'var(--pink)')+'">'+fmt(op)+'</b> (영업이익률 '+margin.toFixed(1)+'%)';
  }
  [price,units,cost,fixed].forEach(function(el){ if(el){ el.addEventListener('input',upd); } });
  upd();
}

/* --- 3) 막대 차트: 화면 진입 시 애니메이션 --- */
function initBars(box){
  var data=[]; try{ data=JSON.parse(box.getAttribute('data-vals')||'[]'); }catch(e){ data=[]; }
  var max=Math.max.apply(null, data.map(function(d){return d.v;}).concat([1]));
  var wrap=document.createElement('div'); wrap.className='barchart';
  data.forEach(function(d){
    var b=document.createElement('div'); b.className='bar'; b.style.height='2px';
    b.innerHTML='<span>'+d.t+'</span><em>'+d.l+'</em>'; wrap.appendChild(b);
  });
  box.appendChild(wrap);
  var t=setTimeout(function(){
    wrap.querySelectorAll('.bar').forEach(function(b,i){ b.style.height=Math.max(2,(data[i].v/max*130))+'px'; });
  }, 60);
  _timers.push(t);
}

/* --- 4) 카운트업 통계 --- */
function initCount(box){
  box.querySelectorAll('[data-to]').forEach(function(el){
    var to=parseFloat(el.getAttribute('data-to')), dec=+(el.getAttribute('data-dec')||0);
    var suf=el.getAttribute('data-suf')||'', pre=el.getAttribute('data-pre')||'';
    var start=null, dur=1100;
    function step(ts){
      if(!start) start=ts; var p=Math.min(1,(ts-start)/dur); var e=1-Math.pow(1-p,3);
      el.textContent=pre+(to*e).toLocaleString('ko-KR',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;
      if(p<1 && el.isConnected){ requestAnimationFrame(step); }
    }
    requestAnimationFrame(step);
  });
}

/* ============================================================
 *  덱 엔진
 * ============================================================ */
var cur = 0, total = S.length;
var stage = document.getElementById('stage');
var bar = document.getElementById('bar');
var cnt = document.getElementById('cnt');
var badge = document.getElementById('secbadge');
var toc = document.getElementById('toc');

function render(i, pushHash){
  cur = Math.max(0, Math.min(total - 1, i));
  clearAnims();
  var sd = S[cur];
  stage.innerHTML = '<div class="slide">' + sd.h + '</div>';
  stage.scrollTop = 0;
  var col = SECS[sd.s] || '#34d399';
  badge.textContent = sd.s + ' · ' + (cur + 1);
  badge.style.color = col;
  badge.style.borderColor = col;
  cnt.textContent = (cur + 1) + ' / ' + total;
  bar.style.width = ((cur + 1) / total * 100) + '%';
  document.title = '📊 스프레드시트 대백과 — ' + sd.t;
  if (pushHash !== false){ try { history.replaceState(null, '', '#s' + (cur + 1)); } catch(e){} }
  initDemos(stage);
}
function step(d){ render(cur + d); }

document.getElementById('bFirst').onclick = function(){ render(0); };
document.getElementById('bLast').onclick = function(){ render(total - 1); };
document.getElementById('bPrev').onclick = function(){ step(-1); };
document.getElementById('bNext').onclick = function(){ step(1); };
document.getElementById('bToc').onclick = function(){ openToc(); };

document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (toc.classList.contains('open')){ if (e.key === 'Escape'){ closeToc(); e.preventDefault(); } return; }
  switch (e.key){
    case 'ArrowRight': case ' ': case 'PageDown': step(1); e.preventDefault(); break;
    case 'ArrowLeft': case 'PageUp': step(-1); e.preventDefault(); break;
    case 'Home': render(0); e.preventDefault(); break;
    case 'End': render(total - 1); e.preventDefault(); break;
    case 't': case 'T': openToc(); e.preventDefault(); break;
  }
});

(function(){
  var sx = 0, sy = 0, ok = false;
  stage.addEventListener('touchstart', function(e){
    ok = !e.target.closest('.demo, a, button, select, input, textarea, canvas, table.ss');
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY;
  }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (!ok) return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 64 && Math.abs(dy) < Math.abs(dx) * 0.6) step(dx < 0 ? 1 : -1);
  }, {passive:true});
})();

function buildToc(){
  var body = document.getElementById('tocBody'), html = '', lastSec = null;
  for (var i = 0; i < total; i++){
    var sd = S[i];
    if (sd.s !== lastSec){
      if (lastSec !== null) html += '</div>';
      var col = SECS[sd.s] || '#34d399';
      html += '<h3 style="color:' + col + '">' + sd.s + '</h3><div class="tgrid">';
      lastSec = sd.s;
    }
    html += '<button data-go="' + i + '"><span class="n">' + (i+1) + '</span>' + sd.t + '</button>';
  }
  html += '</div>';
  body.innerHTML = html;
  body.addEventListener('click', function(e){
    var b = e.target.closest('button[data-go]');
    if (b){ closeToc(); render(+b.dataset.go); }
  });
}
function openToc(){
  toc.classList.add('open');
  toc.querySelectorAll('.tgrid button').forEach(function(b){ b.classList.toggle('cur', +b.dataset.go === cur); });
}
function closeToc(){ toc.classList.remove('open'); }
document.getElementById('tocClose').onclick = closeToc;
document.getElementById('jumpGo').onclick = function(){
  var v = +document.getElementById('jumpN').value;
  if (v >= 1 && v <= total){ closeToc(); render(v - 1); }
};
document.getElementById('jumpN').addEventListener('keydown', function(e){
  if (e.key === 'Enter') document.getElementById('jumpGo').onclick();
});

function fromHash(){ var m = location.hash.match(/^#s(\d+)$/); return m ? Math.max(0, Math.min(total - 1, +m[1] - 1)) : 0; }
window.addEventListener('hashchange', function(){ render(fromHash(), false); });

buildToc();
render(fromHash(), false);

</script>
<!-- ===== deck-input-shim v1 : 방향키(↑↓ 스크롤 / ←→ 페이지) + 게임패드 ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckInputShim) return;
  window.__deckInputShim = true;

  /* ---------- 지금 보이는 슬라이드의 스크롤 컨테이너 찾기 ---------- */
  function scrollableAt(x, y) {
    if (!document.elementFromPoint) return null;
    var n = document.elementFromPoint(x, y);
    while (n && n !== document.documentElement) {
      var oy = getComputedStyle(n).overflowY;
      if ((oy === 'auto' || oy === 'scroll' || oy === 'overlay') &&
          n.scrollHeight - n.clientHeight > 4) return n;
      n = n.parentElement;
    }
    return null;
  }
  function scroller() {
    var el = scrollableAt(innerWidth / 2, innerHeight / 2) ||
             scrollableAt(innerWidth / 2, innerHeight * 0.35);
    if (el) return el;
    var m = document.querySelector('main');
    if (m && m.scrollHeight - m.clientHeight > 4) return m;
    return document.scrollingElement || document.documentElement;
  }
  function viewH(el) {
    return (el === document.scrollingElement || el === document.documentElement)
      ? innerHeight : el.clientHeight;
  }
  function isPageScroller(el) {
    return el === document.scrollingElement || el === document.documentElement || el === document.body;
  }
  function scrollStep(dir, smooth) {
    var el = scroller();
    el.scrollBy({ top: dir * Math.max(80, viewH(el) * 0.25),
                  left: 0, behavior: smooth ? 'smooth' : 'auto' });
  }

  /* ---------- 페이지 이동 (덱마다 다른 엔진에 공통으로 붙는다) ---------- */
  function pick(ids) {
    for (var i = 0; i < ids.length; i++) {
      var e = document.getElementById(ids[i]);
      if (e && (e.tagName === 'BUTTON' || e.tagName === 'A')) return e;
    }
    return null;
  }
  function synth(key) {
    document.dispatchEvent(new KeyboardEvent('keydown',
      { key: key, code: key, bubbles: true, cancelable: true }));
  }
  function page(dir) {
    var b = dir > 0 ? pick(['nextBtn', 'btnNext', 'next'])
                    : pick(['prevBtn', 'btnPrev', 'prev']);
    if (b) { if (!b.disabled) b.click(); }
    else synth(dir > 0 ? 'ArrowRight' : 'ArrowLeft');
  }
  function toggleToc() {
    var b = pick(['tocBtn', 'btnToc', 'toc-btn', 'tocOpen']);
    if (b) b.click(); else synth('t');
  }

  /* ---------- 키보드: ↑↓ = 스크롤 (←→ 페이지는 각 덱 엔진이 처리) ---------- */
  function interactive(el) {
    if (!el) return false;
    var t = (el.tagName || '').toUpperCase();
    return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' ||
           t === 'CANVAS' || el.isContentEditable === true;
  }
  addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    if (e.defaultPrevented || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
    if (interactive(e.target) || interactive(document.activeElement)) return;
    var dir = e.key === 'ArrowDown' ? 1 : -1, repeat = e.repeat;
    // 이벤트 전파가 끝난 뒤에 판단한다 — 슬라이드 안의 데모(테트리스 등)가
    // 이 키를 가져갔으면(preventDefault) 스크롤하지 않는다.
    setTimeout(function () {
      if (e.defaultPrevented) return;
      // 문서 자체가 스크롤되는 덱은 브라우저 기본 동작에 맡긴다(이중 스크롤 방지).
      if (isPageScroller(scroller())) return;
      scrollStep(dir, !repeat);
    }, 0);
  });

  /* ---------- 게임패드 (조이패드) ----------
     좌스틱/D-pad 상하 = 스크롤, 좌우 = 이전/다음 페이지
     A·RB·RT = 다음, B·LB·LT = 이전, X·Start = 목차, Back = 첫 장     */
  var DEAD = 0.4, REPEAT = 320, held = {}, lastTurn = 0, lastDir = 0, raf = 0;

  function pads() {
    if (!navigator.getGamepads) return [];
    var out = [], g = navigator.getGamepads();
    for (var i = 0; i < g.length; i++) if (g[i]) out.push(g[i]);
    return out;
  }
  function down(g, i) { var b = g.buttons[i]; return !!b && (b.pressed || b.value > 0.5); }
  function edge(name, isDown, fn) {
    if (isDown) { if (!held[name]) { held[name] = 1; fn(); } }
    else held[name] = 0;
  }

  function poll(now) {
    var list = pads();
    if (!list.length) { raf = 0; return; }
    raf = requestAnimationFrame(poll);

    var ax = 0, ay = 0, bNext = false, bPrev = false, bToc = false, bHome = false;
    for (var k = 0; k < list.length; k++) {
      var g = list[k];
      ax += g.axes[0] || 0;
      ay += g.axes[1] || 0;
      if (down(g, 15)) ax += 1;
      if (down(g, 14)) ax -= 1;
      if (down(g, 13)) ay += 1;
      if (down(g, 12)) ay -= 1;
      bNext = bNext || down(g, 0) || down(g, 5) || down(g, 7);
      bPrev = bPrev || down(g, 1) || down(g, 4) || down(g, 6);
      bToc  = bToc  || down(g, 2) || down(g, 9);
      bHome = bHome || down(g, 8);
    }

    if (Math.abs(ay) > DEAD) {                       // 세로: 부드러운 연속 스크롤
      var mag = Math.min(1, (Math.abs(ay) - DEAD) / (1 - DEAD));
      scroller().scrollBy(0, (ay > 0 ? 1 : -1) * (6 + mag * 22));
    }
    var dir = Math.abs(ax) > DEAD ? (ax > 0 ? 1 : -1) : 0;
    if (dir) {                                       // 가로: 페이지 넘김(리핏 간격)
      if (dir !== lastDir || now - lastTurn > REPEAT) {
        lastDir = dir; lastTurn = now; page(dir);
      }
    } else { lastDir = 0; lastTurn = 0; }

    edge('next', bNext, function () { page(1); });
    edge('prev', bPrev, function () { page(-1); });
    edge('toc',  bToc,  toggleToc);
    edge('home', bHome, function () { synth('Home'); });
  }

  function start() { if (!raf) raf = requestAnimationFrame(poll); }
  addEventListener('gamepadconnected', start);
  addEventListener('focus', function () { if (pads().length) start(); });
  if (pads().length) start();
})();
</script>
