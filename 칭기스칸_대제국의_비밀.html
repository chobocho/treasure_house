<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- deck-bookmark: 덱 엔진이 replaceState로 주소를 바꾸기 전에 진입 해시를 잡아둔다 -->
<script>window.__deckInitHash=location.hash;</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>칭기스칸 — 문맹의 정복자, 대제국의 비밀 (인터랙티브 슬라이드)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0c1626; --bg1:#12233c; --bg2:#16304f;
  --gold:#e8b64c; --gold-soft:#f3d491; --red:#e0653f; --sky:#7ec4ef;
  --ink:#eef4fb; --ink-soft:#b8c9dd; --ink-dim:#7e93ac;
  --panel:rgba(255,255,255,.055); --panel-bd:rgba(232,182,76,.28);
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Noto Sans KR',sans-serif;color:var(--ink);overflow:hidden;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(232,182,76,.10), transparent 60%),
    radial-gradient(900px 500px at 10% 110%, rgba(126,196,239,.08), transparent 60%),
    linear-gradient(160deg,var(--bg0) 0%,var(--bg1) 55%,var(--bg2) 100%);
}
#app{height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}

/* ── 상단바 ─────────────────────────── */
#bar{height:5px;background:rgba(255,255,255,.08);flex:0 0 auto;}
#barFill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .25s;}
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:10px clamp(12px,2.5vw,28px);border-bottom:1px solid rgba(255,255,255,.07);}
header .logo{font-family:'Black Han Sans',sans-serif;font-size:clamp(15px,1.6vw,20px);color:var(--gold);
  white-space:nowrap;letter-spacing:.5px;}
header .chap{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink-soft);font-size:clamp(12px,1.3vw,15px);text-align:center;}
header .cnt{font-variant-numeric:tabular-nums;color:var(--ink-dim);font-size:clamp(12px,1.3vw,15px);white-space:nowrap;}

/* ── 슬라이드 무대 ───────────────────── */
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;justify-content:center;
  padding:clamp(10px,2vh,22px) clamp(10px,3vw,36px);}
.slide{width:min(1180px,100%);display:flex;flex-direction:column;min-height:0;
  animation:enter .34s ease both;}
.slide.back{animation:enterBack .34s ease both;}
@keyframes enter{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
@keyframes enterBack{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:none;}}
.kick{color:var(--gold);font-weight:700;font-size:clamp(12px,1.5vw,15px);letter-spacing:2.5px;margin-bottom:6px;}
h1.st{font-family:'Noto Serif KR',serif;font-weight:900;line-height:1.22;
  font-size:clamp(21px,3.4vw,40px);margin-bottom:clamp(10px,1.8vh,20px);}
h1.st .em{color:var(--gold);}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding-right:6px;scrollbar-width:thin;scrollbar-color:rgba(232,182,76,.4) transparent;
  font-size:clamp(15px,1.75vw,19.5px);line-height:1.78;color:var(--ink-soft);}
.body::-webkit-scrollbar{width:6px;}
.body::-webkit-scrollbar-thumb{background:rgba(232,182,76,.35);border-radius:3px;}
.body b,.body strong{color:var(--ink);}
.body em{color:var(--gold-soft);font-style:normal;font-weight:700;}
.body p{margin:0 0 12px;}
.body ul.b{list-style:none;margin:4px 0 14px;}
.body ul.b>li{padding:7px 0 7px 26px;position:relative;}
.body ul.b>li::before{content:'❖';position:absolute;left:2px;color:var(--gold);font-size:.8em;top:11px;}
.body ol{margin:4px 0 14px 24px;}
.body ol>li{padding:6px 0;}
.big{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(19px,2.6vw,30px);
  line-height:1.55;color:var(--ink);margin:1.2em 0;}
blockquote.q{border-left:4px solid var(--gold);background:var(--panel);border-radius:0 14px 14px 0;
  padding:16px 20px;margin:14px 0;font-family:'Noto Serif KR',serif;font-weight:600;
  font-size:clamp(15.5px,1.9vw,21px);line-height:1.7;color:var(--ink);}
blockquote.q .who{display:block;margin-top:10px;font-family:'Noto Sans KR',sans-serif;
  font-size:.72em;font-weight:500;color:var(--ink-dim);}
.note{font-size:.8em;color:var(--ink-dim);margin-top:10px;line-height:1.6;}
.note a{color:var(--sky);}

/* 카드 그리드 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px;margin:12px 0;}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:14px 16px;}
.card h3{color:var(--gold);font-size:clamp(14px,1.6vw,17px);margin-bottom:6px;}
.card .num{font-family:'Black Han Sans',sans-serif;font-size:clamp(22px,3vw,34px);color:var(--ink);display:block;}
.card p{font-size:.86em;line-height:1.6;margin:0;}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0;}
.duo .card h3{font-size:clamp(15px,1.7vw,18px);}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:12px 0;}
.vs .mid{align-self:center;font-family:'Black Han Sans',sans-serif;color:var(--red);font-size:clamp(16px,2vw,22px);}

/* 타임라인 */
.tl{margin:10px 0;}
.tl .row{display:grid;grid-template-columns:minmax(74px,auto) 1fr;gap:14px;padding:8px 0;
  border-bottom:1px dashed rgba(255,255,255,.10);}
.tl .yr{font-family:'Black Han Sans',sans-serif;color:var(--gold);white-space:nowrap;font-size:1.02em;}
.tl .tx{line-height:1.65;}

/* 표 */
.tbwrap{overflow-x:auto;margin:12px 0;border-radius:12px;border:1px solid rgba(255,255,255,.12);}
table.tb{border-collapse:collapse;width:100%;min-width:560px;font-size:.88em;}
table.tb th{background:rgba(232,182,76,.14);color:var(--gold-soft);padding:10px 12px;text-align:left;white-space:nowrap;}
table.tb td{padding:10px 12px;border-top:1px solid rgba(255,255,255,.08);vertical-align:top;line-height:1.6;}
table.tb tr td:first-child{color:var(--ink);font-weight:700;white-space:nowrap;}

/* 이미지 */
figure.ph{margin:12px 0;background:var(--panel);border:1px solid rgba(255,255,255,.10);
  border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;}
figure.ph .imgbox{border-radius:10px;overflow:hidden;background:#0a121f;display:flex;justify-content:center;}
figure.ph img{max-width:100%;max-height:52dvh;object-fit:contain;display:block;}
figure.ph figcaption{font-size:.78em;color:var(--ink-dim);line-height:1.55;padding:0 4px;}
figure.ph figcaption a{color:var(--sky);text-decoration:none;}
figure.ph figcaption a:hover{text-decoration:underline;}
.imgfail{padding:22px;text-align:center;color:var(--ink-dim);font-size:.85em;width:100%;}
.imgfail a{color:var(--sky);}
.phduo{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.phduo figure.ph{margin:0;}
.phduo figure.ph img{max-height:40dvh;}

/* 링크 칩 */
.links{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;}
a.lk{display:inline-flex;align-items:center;gap:8px;background:rgba(126,196,239,.10);
  border:1px solid rgba(126,196,239,.35);color:var(--sky);border-radius:999px;
  padding:8px 16px;font-size:clamp(12.5px,1.4vw,15px);font-weight:500;text-decoration:none;
  transition:background .15s;max-width:100%;}
a.lk:hover{background:rgba(126,196,239,.22);}
a.lk .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.linklist{list-style:none;margin:8px 0;}
.linklist li{padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.10);line-height:1.6;}
.linklist a{color:var(--sky);font-weight:700;text-decoration:none;}
.linklist a:hover{text-decoration:underline;}
.linklist .d{display:block;font-size:.82em;color:var(--ink-dim);}

/* 챕터 표지 */
.cover{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;min-height:0;overflow-y:auto;}
.cover .icon{font-size:clamp(44px,8vw,84px);margin-bottom:14px;}
.cover .chnum{color:var(--gold);letter-spacing:5px;font-weight:700;font-size:clamp(13px,1.6vw,17px);margin-bottom:10px;}
.cover h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(26px,5vw,56px);line-height:1.3;}
.cover .sub{margin-top:16px;color:var(--ink-soft);font-size:clamp(14px,1.8vw,19px);line-height:1.8;max-width:760px;align-self:center;}

/* 퀴즈 */
.quiz{background:var(--panel);border:1px solid var(--panel-bd);border-radius:16px;padding:18px;margin:12px 0;}
.quiz .qq{font-weight:700;color:var(--ink);margin-bottom:12px;font-size:1.02em;}
.quiz .opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.06);color:var(--ink-soft);
  border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:11px 14px;margin:7px 0;
  font:inherit;font-size:.95em;cursor:pointer;transition:.15s;}
.quiz .opt:hover{border-color:var(--gold);}
.quiz .opt.ok{background:rgba(90,180,110,.22);border-color:#5ab46e;color:#d7f5df;}
.quiz .opt.no{background:rgba(224,101,63,.18);border-color:var(--red);color:#ffd9cc;}
.quiz .exp{display:none;margin-top:10px;font-size:.88em;color:var(--gold-soft);line-height:1.65;}
.quiz.done .exp{display:block;}

/* ── 하단바 ─────────────────────────── */
footer{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:10px clamp(12px,2.5vw,28px) 14px;border-top:1px solid rgba(255,255,255,.07);}
footer .hint{flex:1;color:var(--ink-dim);font-size:clamp(10.5px,1.2vw,13px);}
button.nv{font:inherit;cursor:pointer;border-radius:12px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.07);color:var(--ink);padding:10px 18px;
  font-size:clamp(13px,1.5vw,16px);font-weight:700;transition:.15s;min-width:52px;}
button.nv:hover{background:rgba(232,182,76,.18);border-color:var(--gold);}
button.nv.main{background:linear-gradient(135deg,var(--gold),#d29a2e);color:#231a08;border:none;padding:10px 26px;}
button.nv:disabled{opacity:.3;cursor:default;}

/* ── 목차 오버레이 ───────────────────── */
#toc{position:fixed;inset:0;background:rgba(8,14,24,.92);backdrop-filter:blur(8px);
  z-index:50;display:none;flex-direction:column;padding:4vh 5vw;}
#toc.on{display:flex;}
#toc h2{font-family:'Black Han Sans',sans-serif;color:var(--gold);font-size:clamp(20px,3vw,30px);margin-bottom:6px;}
#toc .close{position:absolute;top:18px;right:22px;background:none;border:none;color:var(--ink);
  font-size:30px;cursor:pointer;}
#tocList{flex:1;overflow-y:auto;margin-top:14px;display:grid;gap:10px;
  grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));align-content:start;}
.tocCh{background:var(--panel);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:14px 16px;
  cursor:pointer;transition:.15s;}
.tocCh:hover{border-color:var(--gold);}
.tocCh .n{color:var(--gold);font-size:12.5px;font-weight:700;letter-spacing:1px;}
.tocCh h3{font-size:16.5px;margin:4px 0 2px;color:var(--ink);}
.tocCh .c{font-size:12.5px;color:var(--ink-dim);}
.tocCh.cur{border-color:var(--gold);background:rgba(232,182,76,.10);}

/* ── 반응형: 폴드7 커버(세로 초슬림)·펼침(정방형)·모바일 ── */
@media (max-width:920px), (orientation:portrait){
  .duo,.vs,.phduo{grid-template-columns:1fr;}
  .vs .mid{justify-self:center;padding:2px 0;}
  footer .hint{display:none;}
}
@media (max-aspect-ratio:3/4){ figure.ph img{max-height:44dvh;} }
@media (max-width:480px){
  header .logo{font-size:13px;}
  button.nv{padding:9px 13px;}
  .body{font-size:14.5px;}
}
/* 폴드 펼침(거의 정사각 대화면): 무대 폭 넉넉히, 글자 과대 방지 */
@media (min-width:1500px) and (max-aspect-ratio:13/10){
  .slide{width:min(1280px,100%);}
}
</style>
</head>
<body>
<div id="app">
  <div id="bar"><div id="barFill"></div></div>
  <header>
    <div class="logo">🏹 칭기스칸 — 대제국의 비밀</div>
    <div class="chap" id="hChap"></div>
    <div class="cnt" id="hCnt"></div>
  </header>
  <main id="stage"></main>
  <footer>
    <button class="nv" id="btnToc">☰ 목차</button>
    <div class="hint">← → 방향키 · 스페이스 · 화면 스와이프로 이동 | Home/End 처음·끝 | M 목차</div>
    <button class="nv" id="btnPrev">◀</button>
    <button class="nv main" id="btnNext">다음 ▶</button>
  </footer>
</div>

<div id="toc">
  <button class="close" id="btnTocClose">✕</button>
  <h2 id="tocTitle">목차</h2>
  <div id="tocList"></div>
</div>

<script>
'use strict';

 ogedei:[W+'9/9e/YuanEmperorAlbumOgedeiPortrait.jpg','YuanEmperorAlbumOgedeiPortrait.jpg','오고타이(우구데이) 칸 초상 (원나라 궁정화첩)'],

 battle1211:[W+'c/c0/Bataille_entre_mongols_%26_chinois_%281211%29.jpeg','Bataille entre mongols & chinois (1211).jpeg','1211년 몽골군과 금나라군의 전투 — 라시드 앗딘 「집사」 삽화 (14세기)'],

function fig(key,extra){

    <figcaption>🖼️ ${cap}${extra?' — '+extra:''} · <a href="${page}" target="_blank" rel="noopener">출처: Wikimedia Commons ↗</a></figcaption></figure>`;
}

function quiz(q,opts,okIdx,exp){
  const bs=opts.map((o,i)=>`<button class="opt" data-ok="${i===okIdx?1:0}" onclick="answer(this)">${'①②③④'[i]} ${o}</button>`).join('');
  return `<div class="quiz"><div class="qq">Q. ${q}</div>${bs}<div class="exp">💡 ${exp}</div></div>`;
}
function answer(btn){
  const box=btn.closest('.quiz'); if(box.classList.contains('done'))return;
  box.classList.add('done');
  box.querySelectorAll('.opt').forEach(b=>{ if(b.dataset.ok==='1')b.classList.add('ok'); });
  if(btn.dataset.ok!=='1')btn.classList.add('no');
}

<tr><td>메르키트</td><td>북부 (셀렝게 강)</td><td>호전적 삼림·초원 세력. 보르테 납치범들</td></tr>
<tr><td>몽골부</td><td>동북 (오논·케룰렌)</td><td>한때 강성했으나 분열해 <em>최약체로 전락</em></td></tr>
<tr><td>옹구트·오이라트 등</td><td>남부·서북</td><td>중소 세력, 정세 따라 이합집산</td></tr>
</table></div>
<p>주인공 테무진은 이 판에서 <b>가장 약한 세력의, 그나마도 버림받은 집안</b>에서 출발합니다.</p>`},
{t:'초원 위의 그림자: 금나라',k:'CH01 · 세력',h:`
<ul class="b">
<li>만리장성 남쪽엔 여진족의 <b>금(金)나라</b> — 인구 4,000만 이상, 당대 세계 최강국 중 하나.</li>
<li>금의 초원 정책은 <em>"이이제이(以夷制夷)"</em> — 유목민끼리 싸움 붙여 어느 쪽도 크지 못하게 관리.</li>
<li>타타르를 대리인으로 삼아 몽골부를 치게 했고, 3년마다 "감정(減丁)" — 초원 남자 솎아내기 원정을 벌였다는 기록도 있습니다.</li>
</ul>
<p class="big">초원이 통일되지 못한 건 우연이 아니라 <em>설계된 분열</em>이었습니다.</p>
<div class="links">${lk(wk('금나라'),'금나라')}${lk(we('Jin_dynasty_(1115%E2%80%931234)'),'Jin dynasty (영문)')}</div>`},
{t:'사회 구조: 뼈의 질서',k:'CH01 · 사회',h:`
<ul class="b">
<li>초원 사회는 <b>혈통(뼈, yasun)</b>으로 계급이 정해졌습니다. "흰 뼈(귀족)"와 "검은 뼈(평민)".</li>
<li>씨족(오복) → 부족 → 부족연합의 피라미드. <em>충성의 대상은 혈연 집단</em>이지 개인이 아니었죠.</li>
<li>귀족만이 칸이 될 수 있고, 전리품 분배도 귀족 우선. 평민과 노예는 전쟁에서 이겨도 얻는 게 적었습니다.</li>
</ul>
<p>칭기스칸의 혁명은 바로 <em>이 "뼈의 질서"를 부수는 것</em>이었습니다. 기억해 두세요.</p>`},
{t:'초원의 관계 기술 ①: 안다(義兄弟)',k:'CH01 · 사회',h:`
<blockquote class="q">"안다가 된 두 사람은 하나의 목숨이니, 서로를 버리지 않고 목숨의 방패가 되어준다."
<span class="who">— 「몽골비사」의 안다 서약 관념</span></blockquote>
<ul class="b">
<li><b>안다(anda)</b>: 피 또는 선물을 나눠 맺는 의형제. 혈연이 아닌 <em>선택된 혈연</em>.</li>
<li>테무진과 자무카는 소년 시절 두 번, 청년 시절 한 번 — 세 번 안다를 맺은 사이입니다.</li>
<li>혈연 사회에서 안다는 계급과 부족을 넘는 거의 유일한 통로였고, 테무진은 이 제도의 달인이 됩니다.</li>
</ul>`},
{t:'초원의 관계 기술 ②: 쿠다(사돈)와 인질',k:'CH01 · 사회',h:`
<ul class="b">
<li><b>쿠다(quda)</b>: 혼인 동맹. 딸을 주고받는 것이 곧 부족 간 조약이었습니다.</li>
<li>몽골부와 옹기라트부의 대대로 이어진 혼인 관계가 테무진에게 아내 보르테를 줍니다.</li>
<li><b>납치혼</b>도 만연 — 테무진의 어머니 호엘룬 자신이 메르키트에게 시집가던 중 납치된 여인이었죠. 이 원한이 훗날 대사건의 씨앗이 됩니다.</li>
</ul>`},
{t:'초원의 종교: 텡그리 신앙',k:'CH01 · 사회',h:`
<ul class="b">
<li>유목민의 신앙은 <b>영원한 푸른 하늘, 텡그리(Tengri)</b> 숭배 + 샤머니즘.</li>
<li>산과 강에 정령이 깃든다고 믿었고, <b>부르칸 칼둔 산</b>은 몽골부의 성산이었습니다.</li>
<li>중요한 점: 텡그리 신앙은 <em>교리도 경전도 사제 조직도 없는</em> 열린 신앙 → 훗날 몽골의 종교 관용 정책의 문화적 뿌리가 됩니다.</li>
</ul>
<div class="links">${lk(we('Tengrism'),'텡그리즘 (영문)')}${lk(wk('부르한산'),'부르칸 칼둔')}</div>`},
{t:'부르칸 칼둔 — 성산을 보다',k:'CH01 · 사회',h:`
${fig('burkhan')}
<p>훗날 테무진이 메르키트의 추격을 피해 목숨을 건진 뒤 이렇게 맹세했다고 「몽골비사」는 전합니다.</p>
<blockquote class="q">"부르칸 칼둔이 벼룩 같은 내 목숨을 살렸다. 나는 아침마다 이 산에 제사하고
자자손손 기억하게 하리라." <span class="who">— 「몽골비사」 103절 (요지)</span></blockquote>
<p class="note">2015년 유네스코 세계유산 등재. 지금도 일반인 접근이 제한되는 성역입니다.
${lk('https://whc.unesco.org/en/list/1440/','유네스코: Great Burkhan Khaldun Mountain ↗')}</p>`},
{t:'전쟁의 일상화: 복수의 무한 루프',k:'CH01 · 전쟁',h:`
<ol>
<li>겨울 재해(조드)로 가축 몰살 → 살기 위해 이웃 부족 약탈</li>
<li>약탈당한 쪽은 <b>피의 복수(blood feud)</b> 의무 발생 — 세대를 넘어 상속됨</li>
<li>복수가 복수를 부르고, 금나라가 옆에서 부채질</li>
<li>어느 부족도 안전하지 않으므로 <b>모두가 항상 전시 상태</b></li>
</ol>
<p class="big">초원의 진짜 적은 이웃 부족이 아니라 <em>이 루프 자체</em>였습니다.<br>
이걸 끊는 자가 초원을 얻습니다.</p>`},
{t:'몽골부의 짧았던 영광',k:'CH01 · 계보',h:`
<div class="tl">
<div class="row"><div class="yr">~1130s</div><div class="tx"><b>카불 칸</b>, 여러 씨족을 묶어 "몽골 울루스(카마그 몽골)"의 첫 칸으로 추대됨. 금나라 사신 앞에서 황제 수염을 잡아당겼다는 호걸담의 주인공.</div></div>
<div class="row"><div class="yr">~1150s</div><div class="tx">2대 <b>암바가이 칸</b>, 타타르에게 속아 붙잡혀 금나라로 압송, "나무 당나귀"에 못 박혀 처형됨. 유언: "내 복수를 하라, 다섯 손가락의 손톱이 다 닳도록."</div></div>
<div class="row"><div class="yr">~1160s</div><div class="tx">3대 <b>쿠툴라 칸</b>의 대(對)타타르 복수전 실패. 연합은 와해되고 몽골부는 씨족들로 산산조각.</div></div>
</div>
<p>테무진이 태어난 시점의 몽골부는 <em>"한때 칸을 냈던 몰락한 집안들의 느슨한 모임"</em>이었습니다.</p>`},
{t:'카불 칸도 실패했다 — 첫 번째 실패 사례',k:'CH01 · 계보',h:`
<ul class="b">
<li>카불 칸은 용맹했고 씨족들을 묶는 데 성공했지만, 그 연합은 <b>그의 개인적 위신에만 의존</b>했습니다.</li>
<li>죽자마자 칸위는 아들이 아닌 사촌(암바가이)에게 — 명확한 승계 규칙이 없어 <em>매번 권력투쟁</em>.</li>
<li>행정도, 상비군도, 법도 없는 "인물 연합"은 인물과 함께 사라졌습니다.</li>
</ul>
<p class="big">교훈 #1: <em>제도 없는 카리스마는 1대(代)를 못 넘긴다.</em><br>
칭기스칸은 증조부의 실패에서 이걸 배웁니다.</p>`},
{t:'그 시각, 초원 밖의 세계',k:'CH01 · 맥락',h:`
<div class="tbwrap"><table class="tb">
<tr><th>지역</th><th>12세기 후반의 상황</th></tr>
<tr><td>중국</td><td>금(북)·남송(남)으로 분열. 세계 GDP의 중심이지만 서로 견제하느라 초원에 소홀</td></tr>
<tr><td>중앙아시아</td><td>호라즘 제국이 급팽창 중 — 신흥 강국이지만 내부는 모래성 (뒤에서 자세히)</td></tr>
<tr><td>중동</td><td>십자군 전쟁 한복판. 살라딘의 시대</td></tr>
<tr><td>유럽</td><td>봉건 분열. 몽골이 온다는 것 자체를 모름</td></tr>
<tr><td>고려</td><td>무신정권 수립(1170). 격동의 시대</td></tr>
</table></div>
<p>즉, 유라시아 전체가 <em>분열되어 서로를 견제하던 시대</em> — 통일된 초원 세력에게는 최적의 사냥터였습니다.</p>`},
{t:'기후라는 숨은 변수',k:'CH01 · 맥락',h:`
<ul class="b">
<li>나이테 연구(Pederson et al., 2014, PNAS)에 따르면 <b>1211~1225년 몽골 초원은 1,100년 만에 가장 따뜻하고 습한 시기</b>였습니다.</li>
<li>풀이 잘 자라면 → 말이 늘고 → 더 많은 병력과 보급이 가능해집니다.</li>
<li>반대로 테무진의 성장기(1180년대)는 극심한 가뭄기 — <em>혼란이 기존 질서를 흔들어 신흥 세력에게 기회</em>가 됐다는 해석.</li>
</ul>
<p class="note">📄 논문: Pederson et al., "Pluvials, droughts, the Mongol Empire, and modern Mongolia", PNAS 111(12), 2014.
${lk('https://www.pnas.org/doi/10.1073/pnas.1318677111','PNAS 원문 보기 ↗')}</p>`},
{t:'초원 사회의 여성',k:'CH01 · 사회',h:`
<ul class="b">
<li>유목 사회에서 여성은 정주 농경 사회보다 <b>실질 권한이 컸습니다</b> — 남자들이 원정 간 사이 가축·재산·야영지를 총괄.</li>
<li>과부가 된 여인이 가문을 이끄는 일도 흔했고, 테무진의 어머니 <b>호엘룬</b>이 그 극단적 사례.</li>
<li>훗날 몽골 제국에서도 황후(카툰)들이 섭정으로 제국을 통치합니다 — 퇴레게네, 소르칵타니 등.</li>
</ul>
<div class="links">${lk(we('Sorghaghtani_Beki'),'소르칵타니 베키 (영문)')}</div>`},
{t:'정보는 어떻게 흘렀나',k:'CH01 · 사회',h:`
<ul class="b">
<li>문자가 없어도 초원엔 <b>고밀도 정보망</b>이 있었습니다 — 계절 이동 경로가 겹치며 만나는 시장, 혼인 잔치, 대상(카라반).</li>
<li>무슬림 상인들이 실크로드를 오가며 각국 사정을 실어 날랐고, 유목민은 이들을 극진히 대접했습니다.</li>
<li>테무진은 훗날 이 상인 네트워크를 <em>국가 정보기관처럼</em> 활용합니다.</li>
</ul>`},
{t:'1장 요약: 무대 정리',k:'CH01 · 요약',h:`
<div class="cards">
<div class="card"><h3>구조</h3><p>혈통 계급 사회 + 복수의 무한 루프 + 금나라의 분열 공작 = <b>아무도 못 이기는 판</b></p></div>
<div class="card"><h3>자원</h3><p>전 국민이 기마 궁사, 이동식 사회, 구술 정보망 — <b>잠재력은 세계 최강</b></p></div>
<div class="card"><h3>결핍</h3><p>문자·법·행정·승계 규칙 없음. 통합의 <b>소프트웨어 부재</b></p></div>
<div class="card"><h3>기회</h3><p>주변 제국들의 분열 + 유리해지는 기후. <b>통합만 하면 폭발하는 화약고</b></p></div>
</div>
<p class="big">하드웨어는 있고 소프트웨어가 없는 초원 — <em>여기에 테무진이 태어납니다.</em></p>`},
{t:'다음 장 예고',k:'CH01',h:`
${fig('onon')}
<p class="big">1162년(추정), 오논 강가.<br>
오른손에 <em>양의 복사뼈만 한 핏덩이</em>를 쥐고 한 아이가 태어납니다.</p>
<p>점술사들은 그것을 정복의 징조라 했지만, 현실의 소년을 기다린 것은
아버지의 독살, 부족의 배신, 그리고 초원 밑바닥의 삶이었습니다.</p>`}
]});

/* ══════════ CH 02. 테무진 — 시련의 유년기 ══════════ */
CHAPTERS.push({icon:'🐺',title:'테무진, 시련이 만든 아이',
sub:'"고아, 노예, 도망자" — 대칸의 이력서 첫 줄.<br>버림받은 소년이 초원의 룰을 온몸으로 배우는 시간.',
slides:[
{t:'탄생: 핏덩이를 쥔 아이',k:'CH02 · 1162?',h:`
<ul class="b">
<li>출생 연도는 1162년설(몽골 공식)과 1155년·1167년설이 병존합니다. 장소는 <b>오논 강 상류 델리운 볼닥</b>.</li>
<li>아버지 <b>예수게이</b>는 몽골 보르지긴 씨족의 유력자(칸은 아님), 어머니 <b>호엘룬</b>은 그가 메르키트족에게서 납치해 온 여인.</li>
<li>마침 예수게이가 타타르족 전사 <b>테무진 우게</b>를 사로잡아 돌아온 참이라, 아이 이름을 <b>테무진</b>이라 지었습니다 — "대장장이(temür, 철)"와 어원이 닿는 이름.</li>
</ul>
<div class="links">${lk(wk('예수게이'),'예수게이')}${lk(wk('호엘룬'),'호엘룬')}</div>`},
{t:'9세: 약혼, 그리고 아버지의 죽음',k:'CH02 · 1171?',h:`
<div class="tl">
<div class="row"><div class="yr">봄</div><div class="tx">예수게이가 9세 테무진을 데리고 처가 쪽 옹기라트부로 가서 <b>보르테</b>(10세)와 약혼시킴. 관습대로 테무진은 처가에 데릴사위로 남음.</div></div>
<div class="row"><div class="yr">귀로</div><div class="tx">돌아오던 예수게이, 초원의 환대 관습을 믿고 <b>타타르인들의 잔치</b>에 들름. 그를 알아본 타타르인들이 <em>술에 독을 탐</em>.</div></div>
<div class="row"><div class="yr">사흘 뒤</div><div class="tx">집에 도착해 사망. "내 속이 타들어간다… 테무진을 데려오라"는 유언.</div></div>
</div>
<p class="big">가장(家長)의 죽음 = 초원에서 가족의 <em>사회적 사망 선고</em>였습니다.</p>`},
{t:'버림받다: 타이치우드의 배신',k:'CH02 · 몰락',h:`
<blockquote class="q">"깊은 물은 말라버렸고, 빛나는 돌은 부서졌다. (그 아이들이 우리를 어찌 다스리랴)"
<span class="who">— 타이치우드가 떠나며 남긴 말, 「몽골비사」</span></blockquote>
<ul class="b">
<li>예수게이 휘하의 씨족(타이치우드 등)은 <b>과부와 아이 7명을 초원에 버리고</b> 가축과 함께 떠납니다.</li>
<li>말리려던 충직한 노인 차라카는 창에 찔림 — 항의한 유일한 어른이었습니다.</li>
<li>졸지에 몰락 귀족에서 <em>초원의 최하층</em>으로: 가축 없이 버려진 가족은 걸어 다니는 시체 취급이었죠.</li>
</ul>`},
{t:'호엘룬의 생존 투쟁',k:'CH02 · 몰락',h:`
<ul class="b">
<li>호엘룬은 모자를 눌러쓰고 치마를 걷어붙인 채 <b>오논 강가에서 풀뿌리·야생 파·마늘을 캐며</b> 일곱 아이를 먹였습니다.</li>
<li>아이들은 물고기를 잡고 들쥐(마못)를 사냥 — 유목민 기준 "가장 비천한 음식"으로 연명.</li>
<li>「몽골비사」는 이 시기를 숨기지 않고 상세히 기록합니다. <em>영웅 신화가 아니라 생존 기록.</em></li>
</ul>
<p class="big">훗날 칭기스칸이 보여줄 <em>"버림받은 자, 과부, 고아에 대한 집착적 보호"</em>는
바로 이 시절의 각인입니다.</p>`},
{t:'첫 살인: 이복형 벡테르',k:'CH02 · 그림자',h:`
<ul class="b">
<li>13~14세경, 테무진은 잡은 물고기와 새를 상습적으로 빼앗던 <b>이복형 벡테르</b>를 동생 카사르와 함께 활로 쏘아 죽입니다.</li>
<li>단순한 먹거리 다툼이 아니라 <b>가장 자리를 둘러싼 권력 문제</b>였다는 해석이 유력 — 벡테르가 장남 행세를 하며 호엘룬을 취할 수도 있는 위치였기 때문.</li>
<li>호엘룬의 격노: <em>"제 그림자밖에 친구가 없는 처지에 제 형제를 죽이다니!"</em></li>
</ul>
<p>「몽골비사」가 시조의 이런 치부까지 기록했다는 점이 이 사료의 값어치입니다.
동시에 — 목적 앞에서 냉혹해질 수 있는 성정이 일찍부터 드러난 사건이기도 합니다.</p>`},
{t:'노예가 된 소년',k:'CH02 · 시련',h:`
<ul class="b">
<li>세력을 회복할 조짐이 보이자 타이치우드가 급습, 테무진을 붙잡아 <b>목에 칼(칸가, 나무 형틀)을 채워 노예로</b> 부립니다.</li>
<li>씨족을 순회하며 조리돌림당하는 신세 — 여기서 그는 <em>초원 밑바닥 사람들의 세계</em>를 보게 됩니다.</li>
<li>어느 보름달 잔칫날 밤, 감시가 느슨해진 틈에 형틀로 감시자를 때려눕히고 탈출.</li>
</ul>`},
{t:'소르칸 시라의 도박',k:'CH02 · 시련',h:`
<ul class="b">
<li>도주한 테무진은 강물 속에 숨었다가 <b>평민 소르칸 시라</b>에게 발각됩니다. 그런데 —</li>
<li>그는 신고 대신 테무진을 <b>양털 수레에 숨겨주고</b>, 말과 활을 주어 탈출시킵니다. 발각되면 일가족이 몰살당할 도박.</li>
<li>이유는 단순했습니다: <em>"네 눈에 불이 있고 얼굴에 빛이 있다."</em> — 소년의 비범함에 건 베팅.</li>
</ul>
<p class="big">훗날 칭기스칸은 소르칸 시라 가족에게 최고의 영예를 내립니다.<br>
<em>은혜와 배신을 평생 단위로 결제하는 것</em> — 그의 통치 원리가 여기서 싹틉니다.</p>`},
{t:'첫 추종자들: 보오르추와 젤메',k:'CH02 · 동료',h:`
<ul class="b">
<li>도둑맞은 말 8마리를 혼자 쫓던 테무진에게, 생면부지의 청년 <b>보오르추</b>가 합류합니다. "친구여, 같이 가자. 사내의 고난은 같은 것이다."</li>
<li>말을 되찾은 뒤 몫을 주려 하자 보오르추는 거절 — <em>대가가 아니라 우정으로 왔다는 것.</em></li>
<li>대장장이의 아들 <b>젤메</b>도 아버지의 손에 이끌려 와 평생의 심복이 됩니다.</li>
</ul>
<p>주목할 점: 최초의 핵심 인맥이 전부 <b>혈연·계급과 무관한 자발적 합류자</b>라는 것.
"뼈의 질서" 밖에서 시작된 조직이었습니다.</p>`},
{t:'결혼, 그리고 검은담비 외투',k:'CH02 · 재기',h:`
<ul class="b">
<li>16세경, 약혼을 지켜준 옹기라트의 <b>데이 세첸</b>을 찾아가 <b>보르테와 결혼</b>합니다. 몰락한 집안과의 약속을 지킨 장인도 대단한 인물.</li>
<li>혼수로 받은 <b>검은담비 외투</b> — 초원에서 최고급 사치품 — 를 테무진은 입지 않고 <em>전략 자산으로 씁니다</em>.</li>
<li>그 외투를 들고 찾아간 곳: 아버지의 옛 안다, 케레이트의 왕 <b>토그릴(옹 칸)</b>.</li>
</ul>`},
{t:'외투 한 벌로 산 후원자',k:'CH02 · 재기',h:`
<blockquote class="q">"검은담비 외투의 답례로, 흩어진 너의 울루스(백성)를 모아 주겠다."
<span class="who">— 토그릴(옹 칸), 「몽골비사」</span></blockquote>
<ul class="b">
<li>토그릴은 아버지 예수게이 덕에 왕위를 되찾은 적이 있는 <b>채무자</b>였습니다. 테무진은 그 채권을 정확히 회수한 것.</li>
<li>이로써 무일푼 청년이 초원 2강(케레이트)의 <b>공식 피후견인</b>이 됩니다.</li>
<li>외투 → 후원 → 병력 → 세력. <em>자산을 지위로, 지위를 힘으로 바꾸는 환전 감각</em>이 번뜩이는 장면.</li>
</ul>
<div class="links">${lk(wk('옹 칸'),'옹 칸 (토그릴)')}</div>`},
{t:'시련: 보르테 납치',k:'CH02 · 1180?',h:`
<ul class="b">
<li>신혼의 어느 새벽, <b>메르키트족 300기</b>가 야영지를 급습합니다. 18년 전 예수게이가 호엘룬을 빼앗아 온 것에 대한 <em>세대를 건넌 복수</em>.</li>
<li>말이 모자라 테무진은 가족 남자들과 부르칸 칼둔 산으로 도피 — <b>보르테는 남겨져 납치됩니다</b>.</li>
<li>냉정하게 보면 "아내를 버리고 도망친" 사건. 「몽골비사」조차 이를 감추지 않습니다.</li>
</ul>
<p>이 치욕의 순간이 그의 인생 첫 <b>대규모 군사행동</b>의 방아쇠가 됩니다.</p>`},
{t:'첫 전쟁: 메르키트 원정',k:'CH02 · 반격',h:`
<ul class="b">
<li>테무진은 옹 칸에게 달려가고, 옹 칸은 <b>2만 병력</b>을 약속하며 안다 <b>자무카</b>(역시 2만)와의 연합을 주선합니다.</li>
<li>연합군은 셀렝게 강 유역의 메르키트를 궤멸시키고 <b>보르테를 구출</b> — 테무진 생애 첫 승전.</li>
<li>보르테는 임신 상태로 돌아왔고, 장남 <b>조치("손님"이라는 뜻)</b>의 친부 논란은 평생 제국의 화약고로 남습니다.</li>
</ul>
<p class="note">이 원정은 남의 병력으로 치른 전쟁이지만, 초원 전체에 "예수게이의 아들이 돌아왔다"는 신호탄이 됐습니다.</p>`},
{t:'자무카와의 밀월, 그리고 균열',k:'CH02 · 갈림길',h:`
<ul class="b">
<li>원정 후 테무진과 자무카는 1년 반을 <b>한 캠프에서 유목</b>하며 세 번째 안다 서약을 맺습니다.</li>
<li>어느 이동일, 자무카가 수수께끼 같은 말을 던집니다: <em>"산 곁에 치면 말치기가 얻고, 강 곁에 치면 양치기가 얻는다."</em></li>
<li>해석은 분분하지만 — 귀족(말) 중심의 자무카와, 평민(양)까지 품는 테무진의 <b>노선 차이</b>를 암시한다는 독법이 유력합니다.</li>
<li>그날 밤 테무진은 멈추지 않고 밤새 이동해 <b>자무카와 갈라섭니다</b>. 놀랍게도 자무카 진영의 수많은 사람들이 테무진 쪽으로 따라옵니다.</li>
</ul>`},
{t:'왜 사람들은 테무진에게 왔는가',k:'CH02 · 갈림길',h:`
<div class="duo">
<div class="card"><h3>자무카 캠프</h3><p>명문 자다란 씨족. 전통 질서 수호 — 전리품과 발언권은 <b>귀족 우선</b>. 평민에겐 예측 가능한 착취.</p></div>
<div class="card"><h3>테무진 캠프</h3><p>몰락 가문. 잃을 기득권이 없음 — <b>공을 세우면 출신 불문 보상</b>. 평민·하층민에게 유일한 사다리.</p></div>
</div>
<blockquote class="q">"테무진은 자기가 입던 옷을 벗어 입히고, 자기가 타던 말을 내려 태워준다."
<span class="who">— 당대인들의 평, 「몽골비사」</span></blockquote>
<p>초원 민심의 <em>용어 자체가 바뀌기 시작한 순간</em>입니다.</p>`},
{t:'1189년경: 첫 번째 칸 추대',k:'CH02 · 즉위',h:`
<ul class="b">
<li>몽골 귀족들(알탄, 쿠차르 등 왕가 후손 포함)이 테무진을 <b>몽골부의 칸</b>으로 추대합니다.</li>
<li>추대사가 노골적입니다: <em>"전쟁에서 얻은 미녀와 준마를 그대에게 바치겠다. 사냥에서 앞장서겠다."</em> — 즉 전리품 관리인 정도로 기대한 것.</li>
<li>귀족들의 속내: 카리스마 있는 젊은이를 <b>얼굴마담</b>으로 세우고 실속은 자기들이 챙기겠다는 계산.</li>
</ul>
<p class="big">그들은 몰랐습니다. 자신들이 뽑은 것이 <em>구질서의 파괴자</em>라는 걸.</p>`},
{t:'신임 칸의 첫 인사(人事)',k:'CH02 · 즉위',h:`
<ul class="b">
<li>테무진의 첫 조치는 <b>가신단(케식의 원형) 조직</b> — 화살통 담당, 요리 담당, 말 담당, 양 담당, 수레 담당, 집안 담당…</li>
<li>겉보기엔 시시한 집안일 분장이지만, 실은 <b>혈통 아닌 직무 기반 조직표</b>의 탄생입니다.</li>
<li>보오르추·젤메 같은 평민 출신 심복이 요직을 차지했고, 귀족들은 의전용 자리로 밀려납니다.</li>
</ul>
<p class="note">이 "부엌 내각"이 훗날 세계 제국의 중앙정부로 자라납니다. 조직의 씨앗을 기억해 두세요.</p>`},
{t:'달란 발주트: 패배에서 얻은 승리',k:'CH02 · 1190?',h:`
<ul class="b">
<li>세력 확장에 위기감을 느낀 자무카가 3만 병력으로 공격 — <b>달란 발주트 전투</b>. 테무진은 패배해 협곡으로 후퇴합니다.</li>
<li>그런데 승자 자무카가 일을 저지릅니다: 포로가 된 치노스 씨족 사람들을 <b>가마솥 70개에 삶아 죽였다</b>는 기록 (「몽골비사」).</li>
<li>충격받은 초원 민심이 요동칩니다. 명장 <b>우루우트·망구트 씨족</b> 등이 통째로 자무카를 떠나 <em>패자인 테무진에게</em> 합류.</li>
</ul>
<p class="big">전투에서 지고 <em>민심 시장에서 이긴</em> 전쟁.<br>초원의 권력이 "공포"에서 "신뢰"로 리프라이싱되는 순간입니다.</p>`},
{t:'유년기가 만든 운영체제',k:'CH02 · 정리',h:`
<div class="tbwrap"><table class="tb">
<tr><th>경험</th><th>각인된 원칙</th><th>훗날의 제도화</th></tr>
<tr><td>부족의 배신</td><td>혈연은 믿을 수 없다</td><td>부족 해체, 개인 충성 기반 천호제</td></tr>
<tr><td>노예 생활</td><td>밑바닥 사람들의 힘</td><td>출신 불문 능력주의 인사</td></tr>
<tr><td>소르칸 시라의 은혜</td><td>은혜·배신은 반드시 결제된다</td><td>공신 종신 보상, 배신자 처단 원칙</td></tr>
<tr><td>보르테 납치</td><td>힘없는 정의는 무의미</td><td>압도적 무력 우선주의</td></tr>
<tr><td>아버지의 독살</td><td>환대 관습도 시스템은 아니다</td><td>법(야사)에 의한 안전 보장</td></tr>
</table></div>`},
{t:'2장 요약',k:'CH02 · 요약',h:`
<ul class="b">
<li>테무진의 자본은 돈도 병력도 아닌 <b>"신뢰의 평판"</b>이었습니다 — 은혜를 갚고, 몫을 나누고, 약속을 지킨다는 소문.</li>
<li>구질서에서 버림받은 경험이 그를 <em>구질서를 부술 수 있는 유일한 귀족</em>으로 만들었습니다.</li>
<li>1190년대 초, 그는 아직 초원 5~6개 세력 중 하나의 신흥 주자일 뿐입니다.</li>
</ul>
<p class="big">이제 카메라를 돌려, <em>그와 경쟁했던 "더 유리했던 자들"</em>을 하나씩 봅니다.<br>
왜 그들이 아니라 테무진이었는지 — 이 문서의 핵심 장입니다.</p>`}
]});

{t:'출발선 비교: 테무진은 꼴찌였다',k:'CH03 · 개요',h:`
<div class="tbwrap"><table class="tb">
<tr><th>후보</th><th>혈통</th><th>병력</th><th>부(富)</th><th>외교</th><th>문자/행정</th></tr>
<tr><td>타양 칸 (나이만)</td><td>왕가</td><td>최강</td><td>최고</td><td>서방 교역</td><td><em>있음(위구르)</em></td></tr>
<tr><td>옹 칸 (케레이트)</td><td>왕가</td><td>2위</td><td>상위</td><td>금나라 책봉</td><td>일부</td></tr>
<tr><td>자무카 (자다란)</td><td>명문</td><td>중상</td><td>중간</td><td>초원 내 넓음</td><td>없음</td></tr>
<tr><td>메르키트 3부족</td><td>유력</td><td>중간</td><td>중간</td><td>고립적</td><td>없음</td></tr>
<tr><td><b>테무진</b></td><td>몰락 방계</td><td><b>최약</b></td><td><b>없음</b></td><td>옹 칸 의존</td><td>없음</td></tr>
</table></div>
<p class="big">스펙만 보면 테무진의 우승 확률은 <em>배당률 최하위</em>.<br>그런데 20년 뒤, 표의 위 네 줄이 전부 지워집니다.</p>`},
{t:'경쟁자 ① 옹 칸 — 초원의 대부',k:'CH03 · 케레이트',h:`
<ul class="b">
<li>케레이트의 왕 <b>토그릴</b>. 금나라에게서 "왕(王)" 칭호를 받아 <b>옹 칸</b>이라 불림 — 초원에서 유일하게 <em>국제 공인</em>을 받은 군주.</li>
<li>네스토리우스파 기독교를 받아들인 세련된 궁정, 오르콘 강의 비옥한 목초지, 실크로드 길목의 부.</li>
<li>테무진의 아버지와 안다였고, 테무진의 <b>의부(義父)이자 후원자</b>가 됩니다.</li>
</ul>
<p>20년간 초원 정치의 <em>최종 심판자</em> 역할을 한, 명실상부한 1인자였습니다.</p>
<div class="links">${lk(wk('옹 칸'),'옹 칸')}${lk(we('Toghrul'),'Toghrul (영문)')}</div>`},
{t:'옹 칸의 결함 ①: 왕좌를 지키는 것이 목표',k:'CH03 · 케레이트',h:`
<ul class="b">
<li>옹 칸의 이력 자체가 불안의 기록입니다 — 동생들을 죽이고 즉위, 숙부에게 쫓겨나고, 예수게이 덕에 복위, 또 쫓겨나 서요(西遼)까지 유랑, 테무진 덕에 재복위.</li>
<li>그의 인생 목표는 확장이 아니라 <b>"내 왕좌의 보존"</b>이었습니다.</li>
<li>위협이 될 만한 인재는 <em>키우는 대신 견제</em>했고, 심지어 친아들 셍굼과 의붓아들 테무진을 서로 견제시키는 것으로 균형을 잡았죠.</li>
</ul>
<p class="big">현상 유지가 목표인 조직은 <em>확장이 목표인 조직</em>을 이길 수 없습니다.</p>`},
{t:'옹 칸의 결함 ②: 신뢰 결제 불이행',k:'CH03 · 케레이트',h:`
<ul class="b">
<li>1202년 무렵 공동 작전 중, 옹 칸은 테무진과 약속한 합류 지점에 <b>불도 안 피우고 밤중에 철수</b>해 테무진 부대를 나이만 앞에 노출시킨 적이 있습니다.</li>
<li>전리품 분배에서도 케레이트 귀족 우선 — 동맹 세력의 몫을 상습적으로 깎았습니다.</li>
<li>결정타: 테무진이 아들 조치와 옹 칸의 딸 혼인(쿠다)을 제안하자 <b>모욕적으로 거절</b> — "몰락 가문 주제에".</li>
</ul>
<p>초원의 화폐는 신뢰인데, 옹 칸은 <em>상습 채무불이행자</em>였습니다. 파산은 시간문제였죠.</p>`},
{t:'경쟁자 ② 자무카 — 가장 닮았던 적',k:'CH03 · 자다란',h:`
<ul class="b">
<li>명문 자다란 씨족의 수장. 테무진과 동년배, 세 번 안다를 맺은 <b>죽마고우</b>.</li>
<li>군사적 재능은 테무진과 대등하거나 이상 — 달란 발주트에서 테무진을 꺾은 유일한 초원 지휘관.</li>
<li>언변·정치 감각도 뛰어나 1201년엔 반(反)테무진 연합에 의해 <b>구르 칸("만인의 칸")</b>으로 추대됩니다.</li>
</ul>
<p class="big">같은 세대, 같은 재능, 같은 야망 — <em>딱 하나, 바라보는 방향이 달랐습니다.</em></p>
<div class="links">${lk(wk('자무카'),'자무카')}${lk(we('Jamukha'),'Jamukha (영문)')}</div>`},
{t:'자무카의 결함 ①: 구질서의 챔피언',k:'CH03 · 자다란',h:`
<div class="vs">
<div class="card"><h3>자무카의 비전</h3><p>귀족 연합의 회복. 씨족 서열 유지, 전리품은 수장들에게 — <b>"초원을 옛날처럼"</b></p></div>
<div class="mid">VS</div>
<div class="card"><h3>테무진의 비전</h3><p>씨족 해체, 공적 기반 분배, 평민에게 사다리 — <b>"초원을 새롭게"</b></p></div>
</div>
<ul class="b">
<li>자무카의 권력 기반은 귀족들의 지지 → 귀족 우대를 <em>멈출 수 없는 구조</em>.</li>
<li>포로 70명 솥 삶기, 적장 목을 말꼬리에 매달기 같은 <b>공포 통치 퍼포먼스</b>는 구질서식 위엄 과시였지만, 민심 시장에선 악재였습니다.</li>
</ul>`},
{t:'자무카의 결함 ②: 조직을 만들지 않았다',k:'CH03 · 자다란',h:`
<ul class="b">
<li>자무카의 연합은 <b>회원제 클럽</b>이었습니다 — 씨족장들이 각자 병력을 이끌고 참여, 언제든 탈퇴 가능.</li>
<li>구르 칸 추대(1201)도 열두 세력의 <em>선거 연합</em>일 뿐, 통합 지휘권·상비군·법이 없었습니다.</li>
<li>패배가 시작되자 연합은 모래처럼 흩어졌고, 자무카는 마지막에 부하들에게 배신당해 포박됩니다.</li>
</ul>
<p class="big">테무진이 <em>군대</em>를 만드는 동안, 자무카는 <em>동창회</em>를 만들었습니다.</p>`},
{t:'경쟁자 ③ 타양 칸 — 문자를 가진 최강국',k:'CH03 · 나이만',h:`
<ul class="b">
<li>서부의 <b>나이만</b>은 당대 초원 최강·최부국. 위구르와 접해 <b>문자·인장·행정 문서</b>까지 갖춘 유일한 유목 국가였습니다.</li>
<li>즉, "문맹이라 불리한" 조건으로 치면 <em>나이만이 우승했어야</em> 합니다.</li>
<li>군주 <b>타양 칸</b>은 그러나… 사냥과 매 사냥을 즐기는 온실 속 2세였습니다. 아버지(이난치 빌게 칸)가 물려준 최강국을 운용할 그릇이 아니었죠.</li>
</ul>
<div class="links">${lk(wk('나이만'),'나이만')}${lk(we('Tayang_Khan'),'Tayang Khan (영문)')}</div>`},
{t:'타양 칸의 결함: 결정을 못 하는 지배자',k:'CH03 · 나이만',h:`
<ul class="b">
<li>1204년 결전 전, 노장 코리 수베치 등이 <b>선제 기습</b>을 건의하지만 타양 칸은 후퇴 후 유인전을 주장하며 머뭇거립니다.</li>
<li>그러자 아들 쿠출루크가 아버지를 <b>"겁 많은 여인네"라고 공개 조롱</b> — 지휘부가 전투 전에 이미 분열.</li>
<li>몽골군의 위장 전술(병사마다 모닥불 5개 피우기)에 속아 "테무진 군이 별처럼 많다"고 겁먹고, 우왕좌왕하다 나쿠 산기슭에서 궤멸당합니다.</li>
</ul>
<p class="big">문자·부·병력을 다 가져도, <em>결단 없는 정점(頂點)은 시스템 전체를 마비시킵니다.</em><br>
빠르고 명확한 의사결정 — 문맹 테무진이 가진 진짜 "문해력"이었습니다.</p>`},
{t:'경쟁자 ④ 메르키트와 타타르',k:'CH03 · 기타',h:`
<div class="duo">
<div class="card"><h3>메르키트 (북방)</h3><p>사납고 강한 전사 집단이지만 <b>3개 분파가 따로 노는</b> 구조. 약탈로 흥하고 복수로 망하는 전형적 구질서 세력. 통합 비전 자체가 없었음.</p></div>
<div class="card"><h3>타타르 (동방)</h3><p>금나라의 하청 용병으로 <b>초원의 미움을 독점</b>. 금이 지원을 끊자(1196) 순식간에 고립 — 남의 힘에 얹힌 세력의 말로.</p></div>
</div>
<p>이 둘은 "강한 부족"이었지 "국가의 후보"였던 적이 없습니다.
초원 통일 레이스의 실질 결승은 <b>옹 칸 · 자무카 · 타양 칸 · 테무진</b>의 4파전이었습니다.</p>`},
{t:'번외 경쟁자: 금나라라는 시스템',k:'CH03 · 기타',h:`
<ul class="b">
<li>사실 초원의 진짜 지배자는 <b>금나라의 분열 공작 시스템</b>이었습니다 — 누가 크면 다른 부족을 지원해 꺾는 자동 균형 장치.</li>
<li>그런데 1190년대 금은 남송·서하 방면과 내정에 몰두하며 <b>초원 관리를 외주화·축소</b>합니다.</li>
<li>심지어 1196년엔 타타르 응징에 테무진·옹 칸을 <em>하청으로 고용</em> — 자기 손으로 미래의 파괴자에게 관작(차우트 쿠리)과 정당성을 줍니다.</li>
</ul>
<p class="big">균형 장치가 꺼진 10여 년 — 그 틈에 초원 통일이 일어났습니다. <em>타이밍도 실력의 일부.</em></p>`},
{t:'네 경쟁자의 공통 결함',k:'CH03 · 분석',h:`
<div class="cards">
<div class="card"><h3>① 과거 지향</h3><p>모두 "옛 영광의 회복"이 목표. 새 질서의 설계도가 없었다.</p></div>
<div class="card"><h3>② 혈통 조직</h3><p>충성의 단위가 씨족. 패배 한 번에 연합이 증발하는 구조.</p></div>
<div class="card"><h3>③ 분배 실패</h3><p>전리품이 위로만 흘렀다. 병사가 목숨 걸 이유가 없는 조직.</p></div>
<div class="card"><h3>④ 승계 부재</h3><p>왕좌를 둘러싼 부자·형제 갈등이 상수. 조직의 수명 = 개인의 수명.</p></div>
</div>
<p class="big">즉 그들은 <em>테무진보다 못나서가 아니라, 구질서의 우등생이어서</em> 졌습니다.<br>
게임의 룰이 바뀌는 순간, 옛 룰의 챔피언이 가장 먼저 쓰러집니다.</p>`},
{t:'전환점 1196년: 타타르 응징전',k:'CH03 · 부상',h:`
<ul class="b">
<li>금나라가 통제를 벗어난 타타르를 치며 옹 칸·테무진에게 협공을 요청합니다.</li>
<li>테무진에겐 <b>아버지의 원수 + 금의 공인 + 전리품</b>이라는 3중 잭팟. 압승 후 금에게서 관작을 받습니다.</li>
<li>같은 전공으로 옹 칸은 "왕" 칭호를 갱신 — 그러나 실속(민심과 병력 흡수)은 테무진이 챙깁니다.</li>
</ul>
<p class="note">이 무렵부터 「몽골비사」의 기록에서 테무진의 병력 단위가 눈에 띄게 커집니다.</p>`},
{t:'1202년: 타타르 최종 해결과 분배 혁명',k:'CH03 · 부상',h:`
<ul class="b">
<li>테무진은 타타르를 최종 격파하기 전, 전군에 <b>새 규칙</b>을 선포합니다:</li>
</ul>
<blockquote class="q">"적을 이겨도 전리품 곁에 멈추지 말라. 승리가 끝나면 전리품은 <em>모두의 것</em>이니, 공정하게 나눌 것이다.
전사자의 몫은 그 <em>과부와 고아에게</em> 돌아간다." <span class="who">— 1202년 군령, 「몽골비사」 요지</span></blockquote>
<ul class="b">
<li>약탈 우선권(먼저 잡는 놈이 임자)을 폐지하고 <b>성과 기반 중앙 분배</b>로 전환 — 초원 역사상 최초.</li>
<li>이를 어긴 <b>귀족 3인(알탄·쿠차르·다리타이)</b>의 전리품을 몰수 — 왕족이라도 예외 없음을 시연.</li>
<li>모욕당한 귀족들은 옹 칸 쪽으로 이탈합니다. 테무진은 <em>귀족을 잃고 군대를 얻는</em> 거래를 택한 겁니다.</li>
</ul>`},
{t:'분배 혁명이 만든 나비효과',k:'CH03 · 분석',h:`
<ol>
<li>병사: "공만 세우면 내 몫이 보장된다" → <b>전투 동기 폭증</b></li>
<li>과부·고아 보장 → <b>전사(戰死)의 공포 완화</b> → 더 과감한 돌격</li>
<li>전리품을 노린 무질서한 약탈 중단 → <b>추격전 완주</b> → 적 섬멸률 상승</li>
<li>중앙 분배 → 칸에게 자원 통제권 집중 → <b>재정 국가의 맹아</b></li>
</ol>
<p class="big">같은 병사, 같은 말, 같은 활 — 그런데 <em>인센티브 설계 하나로 전투력이 달라졌습니다.</em><br>
경쟁자들은 끝까지 이걸 복제하지 못합니다. 자기 지지 기반(귀족)을 부숴야 했으니까요.</p>`},
{t:'1203년: 옹 칸의 배신',k:'CH03 · 결전',h:`
<div class="tl">
<div class="row"><div class="yr">봄</div><div class="tx">혼담 거절로 긴장 고조. 자무카와 셍굼(옹 칸의 아들), 이탈 귀족들이 옹 칸을 부추김 — "테무진이 나이만과 내통한다."</div></div>
<div class="row"><div class="yr">음모</div><div class="tx">옹 칸 측, <b>혼담 수락을 미끼로 약혼 잔치에 테무진을 유인해 암살</b>하려는 계획 수립.</div></div>
<div class="row"><div class="yr">누설</div><div class="tx">말치기(목동) <b>바다이와 키실리크</b>가 음모를 엿듣고 테무진에게 밀고 — 평민이 칸의 목숨을 구함.</div></div>
<div class="row"><div class="yr">카라 칼지트</div><div class="tx">기습을 받아 대패. 테무진 곁에 남은 병력, <b>2,600기 → 이후 19명</b>까지 감소하는 최악의 위기.</div></div>
</div>`},

<p class="big">경쟁자들이 복제할 수 없었던 이유: 복제하려면 <em>자기 지지 기반(귀족의 몫)을 몰수</em>해야 했기 때문.<br>기득권 연합의 수장은 구조적으로 이 개혁이 불가능합니다.</p>`},
{t:'답 ④ 시스템 > 카리스마 — 제도화의 힘',k:'CH10 · 분석',h:`
<ul class="b">
<li>카불 칸의 연합은 그의 죽음과 함께 증발했습니다. 아틸라의 훈 제국도, 돌궐도 창업자 사후 분열이 공식.</li>
<li>칭기스칸은 승리를 <b>제도로 저장</b>했습니다: 천호제(조직) + 야사(법) + 케식(인재 양성) + 역참(통신) + 문자(기록).</li>
<li>검증 데이터: 그의 사후 제국은 <b>붕괴는커녕 2배 이상 더 팽창</b>합니다 (유럽·중동·남송 정복은 전부 사후 사업).</li>
</ul>
<p class="big">"위대한 정복자"는 역사에 여럿 있지만,<br><em>자기가 없어도 돌아가는 정복 기계</em>를 만든 사람은 드뭅니다.<br>이것이 알렉산드로스와의 결정적 차이입니다 — 그의 제국은 장례식장에서 쪼개졌죠.</p>`},
{t:'답 ⑤ 학습 기계 — 흡수율이라는 초능력',k:'CH10 · 분석',h:`
<ul class="b">
<li>몽골의 성장 곡선은 <b>"정복할 때마다 강해지는"</b> 희귀한 형태입니다:</li>
</ul>
<div class="tl">
<div class="row"><div class="yr">1204</div><div class="tx">나이만 정복 → <b>문자·행정</b> 획득</div></div>
<div class="row"><div class="yr">1215</div><div class="tx">금 중도 함락 → <b>공성 기술·관료(야율초재)</b> 획득</div></div>
<div class="row"><div class="yr">1221</div><div class="tx">호라즘 정복 → <b>이슬람권 행정·상업망·회회포 기술</b> 획득</div></div>
</div>
<ul class="b">
<li>전제 조건이 "질문하는 정복자" — 포로를 죽이기 전에 <b>"너는 무엇을 할 줄 아느냐"</b>를 묻는 문화였습니다.</li>
<li>대부분의 정복자는 정복할수록 통치 부담이 늘어 느려집니다. 몽골은 정복할수록 <em>기능이 추가되어</em> 빨라졌습니다.</li>
</ul>`},
{t:'답 ⑥ 신뢰라는 복리 자산',k:'CH10 · 분석',h:`
<ul class="b">
<li>그의 평판 원장(ledger)은 수십 년간 오차가 없었습니다: 은혜(소르칸 시라, 보오르추)는 수십 년 뒤에도 상환, 배신(주군을 판 자무카의 부하들)은 자기에게 유리해도 처형.</li>
<li>결과: <b>"테무진의 약속은 이행된다"</b>가 초원의 상식이 됨 → 항복·투항·동맹의 거래 비용 급락.</li>
<li>적장까지 계산에 넣었습니다 — 끝까지 옛 주군을 지킨 적병은 포상하고 등용 (제베, 그리고 옹 칸을 위해 싸운 카다크 등).</li>
</ul>
<blockquote class="q">"자기 주인을 배신한 자를 어찌 믿고 쓰겠는가. 끝까지 주인을 지킨 자야말로 내 사람이 될 자다."
<span class="who">— 칭기스칸의 인사 원칙, 여러 사료 종합</span></blockquote>
<p class="note">공포로 유명한 정복자의 실제 코어 자산이 "신뢰"였다는 것 — 이 문서의 가장 중요한 반전입니다.</p>`},
{t:'답 ⑦ 타이밍 — 준비된 자에게 열린 창',k:'CH10 · 분석',h:`
<ul class="b">
<li><b>지정학의 창</b>: 금·남송·서하·호라즘·아바스가 전부 서로 견제 중 — 유라시아에 "몽골 대응 연합"이 형성될 수 없는 배치.</li>
<li><b>기후의 창</b>: 1211~1225년 이례적 온난습윤기(나이테 데이터) — 말과 병력의 생산 능력 급증.</li>
<li><b>기술의 창</b>: 등자·복합궁이 완성 단계인데 화약 무기는 아직 미성숙 — <em>기병의 마지막 황금기.</em></li>
<li>단, 같은 창은 옹 칸에게도 자무카에게도 열려 있었습니다 — 타이밍은 필요조건이지 충분조건이 아니었다는 것.</li>
</ul>
<p class="big">운은 분명 있었다. 그러나 <em>같은 운을 받은 자가 여럿이었고, 시스템을 가진 자만 그 운을 현금화했다.</em></p>`},

<tr><td>③</td><td>인센티브 역류</td><td>귀족의 몫을 몰수할 수 없는 구조</td></tr>
<tr><td>④</td><td>제도화</td><td>"내 대(代)의 영광"이 목표 지평</td></tr>
<tr><td>⑤</td><td>학습·흡수</td><td>정복지를 전리품으로만 소비</td></tr>

<tr><td>⑦</td><td>타이밍 포착</td><td>창이 열렸을 때 결단 불능 (타양 칸)</td></tr>
</table></div>`},
{t:'역대 초원 제국과의 비교 — 천장을 뚫은 이유',k:'CH10 · 심화',h:`

<tr><td>돌궐 (6~8c)</td><td>동서 초원 석권</td><td>혈연 분봉 → 동서 분열, 형제 상잔</td></tr>
<tr><td>위구르 (8~9c)</td><td>문자·도시 보유</td><td>당나라 용병 경제에 기생 — 자립 시스템 부재</td></tr>

</table></div>
<p>이전 제국들은 초원을 통일해도 <b>부족 연합체</b>였고, 정주 문명을 <b>약탈 대상</b>으로만 봤습니다.

<li><b>맥락</b>: 십자군의 예루살렘 학살(1099), 남송·금의 상호 학살 등 — 당대 전쟁 일반의 잔혹성 속에서 봐야 하되, <em>규모의 특별함</em>은 부정할 수 없습니다.</li>

<p class="big">이 문서의 입장: 경영의 천재성과 폭력의 실재를 <em>둘 다</em> 직시할 때만<br>이 인물에게서 진짜 교훈을 꺼낼 수 있습니다.</p>`},
{t:'현대 조직론의 언어로 번역하면',k:'CH10 · 응용',h:`
<div class="cards">
<div class="card"><h3>채용</h3><p>학벌(혈통) 블라인드 + 검증된 실력 채용 + 배신 이력 원아웃</p></div>

<div class="card"><h3>위임</h3><p>목표만 주고 방법은 전권 위임 (무칼리·수부타이 모델)</p></div>
</div>
<p class="note">잭 웨더포드, 김종래 『CEO 칭기스칸』 등이 이런 독법의 대표작 — 물론 800년 전 정복 군주를 경영서로 읽는 것의 한계도 함께 기억해야겠죠.</p>`},
{t:'10장 요약: 질문 ②의 답',k:'CH10 · 요약',h:`

<p class="big" style="color:var(--gold)">A. 경쟁자들은 <em>구질서 안에서 이기려 했고</em>, 그는 <em>질서 자체를 갈아치웠기 때문.</em></p>

</ul>
<p>남은 이야기: 이 시스템의 설계자가 죽으면 어떻게 되는가 — 마지막 검증입니다.</p>`}

      ${s.k?`<div class="kick">${s.k}</div>`:''}
      <h1 class="st">${s.t}</h1>
      <div class="body">${s.h}</div></div>`;
  }
  stage.innerHTML=html;
  hChap.textContent=`${s.ch}. ${ch.title}`;
  hCnt.textContent=`${cur+1} / ${N}`;
  barFill.style.width=((cur+1)/N*100)+'%';
  document.getElementById('btnPrev').disabled=cur===0;
  document.getElementById('btnNext').disabled=cur===N-1;
  if(location.hash!=='#'+(cur+1))history.replaceState(null,'','#'+(cur+1));
  // 다음 슬라이드 이미지 프리로드
  const nx=SLIDES[cur+1];
  if(nx){const m=nx.h&&nx.h.match(/img src="([^"]+)"/g);
    if(m)m.slice(0,2).forEach(x=>{const u=x.slice(9,-1);const im=new Image();im.src=u;});}
}
function go(i,d){ if(i<0||i>=N)return; dir=d||(i>cur?1:-1); cur=i; render(); }
function next(){go(cur+1,1);} function prev(){go(cur-1,-1);}

document.getElementById('btnNext').onclick=next;
document.getElementById('btnPrev').onclick=prev;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(N-1);}
  else if(e.key==='m'||e.key==='M'){toggleToc();}
  else if(e.key==='Escape'){document.getElementById('toc').classList.remove('on');}
});
let tx=null,ty=null;
stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){dx<0?next():prev();}
  tx=ty=null;
},{passive:true});

/* 목차 */
const toc=document.getElementById('toc'),tocList=document.getElementById('tocList');
function buildToc(){
  document.getElementById('tocTitle').textContent=`목차 — ${CHAPTERS.length}개 장 · 전체 ${N}장`;
  tocList.innerHTML=CHAPTERS.map((ch,ci)=>{
    const start=SLIDES.findIndex(s=>s.ch===ci);
    return `<div class="tocCh" data-i="${start}"><div class="n">CHAPTER ${String(ci).padStart(2,'0')}</div>
      <h3>${ch.icon} ${ch.title}</h3><div class="c">${ch.slides.length+1}장 · ${start+1}p부터</div></div>`;
  }).join('');
  tocList.querySelectorAll('.tocCh').forEach(el=>el.onclick=()=>{
    toc.classList.remove('on'); go(+el.dataset.i);
  });
}
function toggleToc(){
  toc.classList.toggle('on');
  const curCh=SLIDES[cur].ch;
  tocList.querySelectorAll('.tocCh').forEach((el,i)=>el.classList.toggle('cur',i===curCh));
}
document.getElementById('btnToc').onclick=toggleToc;
document.getElementById('btnTocClose').onclick=toggleToc;

buildToc();
const h=parseInt(location.hash.slice(1),10);
if(h>=1&&h<=N)cur=h-1;
render();
</script>
<!-- ===== deck-input-shim v1 : 방향키(↑↓ 스크롤 / ←→ 페이지) + 게임패드 ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckInputShim) return;
  window.__deckInputShim = true;

  /* ---------- 지금 보이는 슬라이드의 스크롤 컨테이너 찾기 ---------- */
  function scrollableAt(x, y) {
    if (!document.elementFromPoint) return null;
    var n = document.elementFromPoint(x, y);
    while (n && n !== document.documentElement) {
      var oy = getComputedStyle(n).overflowY;
      if ((oy === 'auto' || oy === 'scroll' || oy === 'overlay') &&
          n.scrollHeight - n.clientHeight > 4) return n;
      n = n.parentElement;
    }
    return null;
  }
  function scroller() {
    var el = scrollableAt(innerWidth / 2, innerHeight / 2) ||
             scrollableAt(innerWidth / 2, innerHeight * 0.35);
    if (el) return el;
    var m = document.querySelector('main');
    if (m && m.scrollHeight - m.clientHeight > 4) return m;
    return document.scrollingElement || document.documentElement;
  }
  function viewH(el) {
    return (el === document.scrollingElement || el === document.documentElement)
      ? innerHeight : el.clientHeight;
  }
  function isPageScroller(el) {
    return el === document.scrollingElement || el === document.documentElement || el === document.body;
  }
  function scrollStep(dir, smooth) {
    var el = scroller();
    el.scrollBy({ top: dir * Math.max(80, viewH(el) * 0.25),
                  left: 0, behavior: smooth ? 'smooth' : 'auto' });
  }

  /* ---------- 페이지 이동 (덱마다 다른 엔진에 공통으로 붙는다) ---------- */
  function pick(ids) {
    for (var i = 0; i < ids.length; i++) {
      var e = document.getElementById(ids[i]);
      if (e && (e.tagName === 'BUTTON' || e.tagName === 'A')) return e;
    }
    return null;
  }
  function synth(key) {
    document.dispatchEvent(new KeyboardEvent('keydown',
      { key: key, code: key, bubbles: true, cancelable: true }));
  }
  function page(dir) {
    var b = dir > 0 ? pick(['nextBtn', 'btnNext', 'next'])
                    : pick(['prevBtn', 'btnPrev', 'prev']);
    if (b) { if (!b.disabled) b.click(); }
    else synth(dir > 0 ? 'ArrowRight' : 'ArrowLeft');
  }
  function toggleToc() {
    var b = pick(['tocBtn', 'btnToc', 'toc-btn', 'tocOpen']);
    if (b) b.click(); else synth('t');
  }

  /* ---------- 키보드: ↑↓ = 스크롤 (←→ 페이지는 각 덱 엔진이 처리) ---------- */
  function interactive(el) {
    if (!el) return false;
    var t = (el.tagName || '').toUpperCase();
    return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' ||
           t === 'CANVAS' || el.isContentEditable === true;
  }
  addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    if (e.defaultPrevented || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
    if (interactive(e.target) || interactive(document.activeElement)) return;
    var dir = e.key === 'ArrowDown' ? 1 : -1, repeat = e.repeat;
    // 이벤트 전파가 끝난 뒤에 판단한다 — 슬라이드 안의 데모(테트리스 등)가
    // 이 키를 가져갔으면(preventDefault) 스크롤하지 않는다.
    setTimeout(function () {
      if (e.defaultPrevented) return;
      // 문서 자체가 스크롤되는 덱은 브라우저 기본 동작에 맡긴다(이중 스크롤 방지).
      if (isPageScroller(scroller())) return;
      scrollStep(dir, !repeat);
    }, 0);
  });

  /* ---------- 게임패드 (조이패드) ----------
     좌스틱/D-pad 상하 = 스크롤, 좌우 = 이전/다음 페이지
     A·RB·RT = 다음, B·LB·LT = 이전, X·Start = 목차, Back = 첫 장     */
  var DEAD = 0.4, REPEAT = 320, held = {}, lastTurn = 0, lastDir = 0, raf = 0;

  function pads() {
    if (!navigator.getGamepads) return [];
    var out = [], g = navigator.getGamepads();
    for (var i = 0; i < g.length; i++) if (g[i]) out.push(g[i]);
    return out;
  }
  function down(g, i) { var b = g.buttons[i]; return !!b && (b.pressed || b.value > 0.5); }
  function edge(name, isDown, fn) {
    if (isDown) { if (!held[name]) { held[name] = 1; fn(); } }
    else held[name] = 0;
  }

  function poll(now) {
    var list = pads();
    if (!list.length) { raf = 0; return; }
    raf = requestAnimationFrame(poll);

    var ax = 0, ay = 0, bNext = false, bPrev = false, bToc = false, bHome = false;
    for (var k = 0; k < list.length; k++) {
      var g = list[k];
      ax += g.axes[0] || 0;
      ay += g.axes[1] || 0;
      if (down(g, 15)) ax += 1;
      if (down(g, 14)) ax -= 1;
      if (down(g, 13)) ay += 1;
      if (down(g, 12)) ay -= 1;
      bNext = bNext || down(g, 0) || down(g, 5) || down(g, 7);
      bPrev = bPrev || down(g, 1) || down(g, 4) || down(g, 6);
      bToc  = bToc  || down(g, 2) || down(g, 9);
      bHome = bHome || down(g, 8);
    }

    if (Math.abs(ay) > DEAD) {                       // 세로: 부드러운 연속 스크롤
      var mag = Math.min(1, (Math.abs(ay) - DEAD) / (1 - DEAD));
      scroller().scrollBy(0, (ay > 0 ? 1 : -1) * (6 + mag * 22));
    }
    var dir = Math.abs(ax) > DEAD ? (ax > 0 ? 1 : -1) : 0;
    if (dir) {                                       // 가로: 페이지 넘김(리핏 간격)
      if (dir !== lastDir || now - lastTurn > REPEAT) {
        lastDir = dir; lastTurn = now; page(dir);
      }
    } else { lastDir = 0; lastTurn = 0; }

    edge('next', bNext, function () { page(1); });
    edge('prev', bPrev, function () { page(-1); });
    edge('toc',  bToc,  toggleToc);
    edge('home', bHome, function () { synth('Home'); });
  }

  function start() { if (!raf) raf = requestAnimationFrame(poll); }
  addEventListener('gamepadconnected', start);
  addEventListener('focus', function () { if (pads().length) start(); });
  if (pads().length) start();
})();
</script>
<!-- ===== deck-bookmark-shim v2 : IndexedDB 책갈피(읽던 위치 자동 저장 + 이어보기) ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckBookmarkShim) return;
  window.__deckBookmarkShim = true;
  if (!window.indexedDB) return;

  var DB_NAME = 'treasure-house', DB_VER = 1, STORE = 'bookmarks';

  var FILE = location.pathname.split('/').pop() || '';
  try { FILE = decodeURIComponent(FILE); } catch (e) {}
  if (!FILE || /^index\.html?$/i.test(FILE)) return;   // 포털(index.html)은 저장하지 않는다

  /* ---------- IndexedDB 래퍼 ----------
     · 실패한 연결은 캐시하지 않는다 — blocked처럼 일시적인 실패 뒤에 다시 시도한다
     · 버전 변경·저장공간 회수·사이트 데이터 삭제로 연결이 끊기면 버리고 다시 연다
     · 계속 막히는 환경(file://·시크릿·사이트 데이터 차단)이면 3번 만에 단념하고,
       첫 실패 한 번만 콘솔에 남긴다 — 화면에는 아무것도 띄우지 않는다              */
  var dbp = null, conn = null, fails = 0, warned = false, deadp = null;

  function warn(e) {
    if (warned) return;
    warned = true;
    try { console.warn('[bookmark] 책갈피를 건너뜁니다 — IndexedDB 사용 불가:', e); } catch (x) {}
  }
  function drop(c) { if (conn === c) { dbp = null; conn = null; } }
  function dead() {
    if (!deadp) {
      deadp = Promise.reject(new Error('bookmark: IndexedDB unavailable'));
      deadp.catch(function () {});             // 미처리 거부 경고 방지
    }
    return deadp;
  }
  function db() {
    if (fails >= 3) return dead();
    if (dbp) return dbp;
    var p = dbp = new Promise(function (res, rej) {
      var req;
      try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { rej(e); return; }
      req.onupgradeneeded = function () {
        var d = req.result;
        if (!d.objectStoreNames.contains(STORE))
          d.createObjectStore(STORE, { keyPath: 'id' }).createIndex('updated', 'updated');
      };
      req.onsuccess = function () {
        var d = req.result;
        conn = d; fails = 0;
        d.onversionchange = function () { drop(d); try { d.close(); } catch (x) {} };
        d.onclose         = function () { drop(d); };
        res(d);
      };
      req.onerror   = function () { rej(req.error || new Error('open error')); };
      req.onblocked = function () { rej(new Error('open blocked')); };
    });
    p.catch(function (e) {
      fails++;
      if (dbp === p) { dbp = null; conn = null; }
      warn(e);
    });
    return p;
  }
  function tx(mode, fn) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var t, r;
        // 닫힌 연결이면 여기서 InvalidStateError가 난다 — 버리고 다음 호출에서 다시 연다
        try { t = d.transaction(STORE, mode); r = fn(t.objectStore(STORE)); }
        catch (e) { drop(d); rej(e); return; }
        t.oncomplete = function () { res(r ? r.result : undefined); };
        t.onerror    = function () { rej(t.error || new Error('tx ' + mode + ' error')); };
        t.onabort    = function () { rej(t.error || new Error('tx ' + mode + ' aborted')); };
      });
    }).catch(function (e) { warn(e); throw e; });
  }
  function save(rec) { return tx('readwrite', function (os) { return os.put(rec); }); }
  function load(id)  { return tx('readonly',  function (os) { return os.get(id); }); }

  /* ---------- 지금 읽고 있는 위치 ---------- */
  var ACTIVE = ['on', 'active', 'current', 'shown', 'is-active'];

  function slides() {                          // 슬라이드 덱이면 슬라이드 목록, 아니면 null
    var sel = ['main > article', '.slide'];
    for (var i = 0; i < sel.length; i++) {
      var n = document.querySelectorAll(sel[i]);
      if (n.length > 1) return n;
    }
    return null;
  }
  function activeIndex(list) {                 // 활성 클래스 → URL 해시 순으로 판별
    for (var i = 0; i < list.length; i++) {
      var c = list[i].classList;
      for (var j = 0; j < ACTIVE.length; j++) if (c.contains(ACTIVE[j])) return i;
    }
    var id = location.hash.slice(1);
    try { id = decodeURIComponent(id); } catch (e) {}
    if (id) for (var k = 0; k < list.length; k++) if (list[k].id === id) return k;
    return -1;
  }
  function visibleIndex(list) {                // 전 슬라이드가 이어서 흐르는 덱용 보조 판별
    var best = -1, near = Infinity, h = window.innerHeight || 800;
    for (var i = 0; i < list.length; i++) {
      var r = list[i].getBoundingClientRect();
      if (r.bottom <= 0 || r.top >= h) continue;
      var d = Math.abs(r.top);
      if (d < near) { near = d; best = i; }
    }
    return best;
  }
  function heading() {                         // 긴 문서용 — 화면 상단을 지난 마지막 제목
    var hs = document.querySelectorAll('h1[id],h2[id],h3[id]'), out = '';
    for (var i = 0; i < hs.length; i++) {
      if (hs[i].getBoundingClientRect().top <= 90) out = '#' + hs[i].id; else break;
    }
    return out;
  }
  function snap() {
    var list = slides();
    if (list) {
      var i = activeIndex(list);
      if (i < 0) i = visibleIndex(list);
      if (i < 0) i = 0;
      var el = list[i];
      return { kind: 'slide', page: i + 1, total: list.length, scrollY: 0,
               hash: el.id ? '#' + el.id : '', ratio: (i + 1) / list.length };
    }
    var se = document.scrollingElement || document.documentElement;
    var max = Math.max(0, se.scrollHeight - se.clientHeight);
    var y = Math.round(se.scrollTop || window.pageYOffset || 0);
    return { kind: 'scroll', page: 0, total: 0, scrollY: y,
             hash: heading(), ratio: max ? Math.min(1, y / max) : 0 };
  }

  /* ---------- 자동 저장 ----------
     처음 상태는 기준선으로만 잡고 저장하지 않는다 — 첫 장으로 열자마자
     지난번 책갈피를 1쪽으로 덮어쓰지 않기 위해서다.                        */
  function sig(s) {
    return s.kind + ':' + s.page + ':' + (s.kind === 'scroll' ? Math.round(s.scrollY / 40) : 0);
  }
  var last = sig(snap());
  function tick(force) {
    if (document.hidden && !force) return;
    var s = snap(), cur = sig(s);
    if (cur === last) return;
    last = cur;
    s.id = FILE;
    s.title = (document.title || FILE).trim();
    s.updated = Date.now();
    // 저장이 실패하면 기준선을 풀어 다음 tick에서 다시 시도한다 — 연결이 끊겼다
    // 다시 붙는 동안 그 한 번의 위치가 통째로 사라지지 않도록.
    save(s).catch(function () { if (last === cur) last = ''; });
  }
  setInterval(tick, 1200);
  addEventListener('hashchange', function () { tick(); });
  addEventListener('visibilitychange', function () { if (document.hidden) tick(true); });
  addEventListener('pagehide', function () { tick(true); });

  /* ---------- 이어보기 ----------
     덱 엔진마다 이동 방식이 달라서 세 단계로 시도한다.
       ① 해시 지정 — hashchange를 듣는 엔진
       ② 다음/이전 버튼 클릭 또는 ←→ 키 — 해시를 안 듣는 한 장씩 엔진
       ③ scrollIntoView — 전 장이 이어서 흐르는 덱                        */
  function navBtn(dir) {
    var ids = dir > 0 ? ['nextBtn', 'btnNext', 'next'] : ['prevBtn', 'btnPrev', 'prev'];
    for (var i = 0; i < ids.length; i++) {
      var e = document.getElementById(ids[i]);
      if (e && (e.tagName === 'BUTTON' || e.tagName === 'A')) return e;
    }
    return null;
  }
  function turn(dir) {
    var b = navBtn(dir);
    if (b) { if (!b.disabled) b.click(); return; }
    var k = dir > 0 ? 'ArrowRight' : 'ArrowLeft';
    document.dispatchEvent(new KeyboardEvent('keydown',
      { key: k, code: k, bubbles: true, cancelable: true }));
  }
  function step(target) {                      // 목표 쪽까지 한 장씩 넘긴다
    var guard = 400;
    (function next() {
      var l = slides();
      if (!l || --guard <= 0) return;
      var i = activeIndex(l);
      if (i < 0 || i === target) return;
      turn(i < target ? 1 : -1);
      setTimeout(function () {
        var l2 = slides();
        if (!l2) return;
        if (activeIndex(l2) === i) return;     // 안 움직이는 엔진이면 포기
        next();
      }, 30);
    })();
  }
  function jump(rec) {
    if (rec.kind !== 'slide') {
      var se = document.scrollingElement || document.documentElement;
      var max = Math.max(0, se.scrollHeight - se.clientHeight);
      var y = rec.scrollY <= max ? rec.scrollY : Math.round(rec.ratio * max);
      window.scrollTo({ top: y, behavior: 'smooth' });
      return;
    }
    var list = slides();
    if (!list) return;
    var target = Math.min(list.length, Math.max(1, rec.page)) - 1;
    var el = (rec.hash && document.getElementById(rec.hash.slice(1))) || list[target];
    if (!el) return;
    var k = Array.prototype.indexOf.call(list, el);
    if (k >= 0) target = k;
    if (el.id && location.hash.slice(1) !== el.id) location.hash = '#' + el.id;
    setTimeout(function () {
      var l2 = slides();
      if (!l2) return;
      var i = activeIndex(l2);
      if (i === target) return;                // ① 해시로 이동 성공
      if (i >= 0) step(target);                // ② 한 장씩 넘기는 엔진
      else el.scrollIntoView({ block: 'start' });   // ③ 이어서 흐르는 덱
    }, 120);
  }
  function ago(t) {
    var d = Date.now() - t;
    if (d < 6e4)  return '방금 전';
    if (d < 36e5) return Math.floor(d / 6e4) + '분 전';
    if (d < 864e5) return Math.floor(d / 36e5) + '시간 전';
    if (d < 6048e5) return Math.floor(d / 864e5) + '일 전';
    return new Date(t).toLocaleDateString('ko-KR');
  }
  function bottomInset() {              // 화면 아래 고정 내비(◀ 1/67 ▶) 위로 띄우기
    var h = window.innerHeight || 800, gap = 14;
    if (!document.body) return gap;
    var list = [], c;
    for (c = document.body.firstElementChild; c; c = c.nextElementSibling) list.push(c);
    var extra = document.querySelectorAll('nav, footer');
    for (var i = 0; i < extra.length; i++) list.push(extra[i]);
    for (var j = 0; j < list.length; j++) {
      var n = list[j], t = n.tagName;
      if (t === 'SCRIPT' || t === 'STYLE' || t === 'LINK') continue;
      var cs = getComputedStyle(n);
      if (cs.position !== 'fixed' && cs.position !== 'sticky') continue;
      if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) === 0) continue;
      var r = n.getBoundingClientRect();
      if (!r.height || r.height > h * 0.5 || r.bottom < h - 4 || r.top > h) continue;
      gap = Math.max(gap, Math.round(h - r.top) + 10);
    }
    return gap;
  }
  function toast(rec) {
    var gap = bottomInset();
    var host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483000;pointer-events:none';
    var root = host.attachShadow ? host.attachShadow({ mode: 'open' }) : host;
    var where = rec.kind === 'slide'
      ? rec.page + ' / ' + rec.total + ' 쪽'
      : Math.round(rec.ratio * 100) + '% 지점';
    root.innerHTML =
      '<style>' +
      '.w{pointer-events:auto;display:flex;align-items:center;gap:10px;' +
      'margin:0 auto calc(' + gap + 'px + env(safe-area-inset-bottom,0px));' +
      'padding:10px 12px 10px 14px;max-width:min(94vw,460px);border-radius:14px;' +
      'background:rgba(18,28,40,.94);color:#eaf3fb;font:500 14px/1.4 -apple-system,BlinkMacSystemFont,' +
      '"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35);' +
      'animation:up .22s ease-out}' +
      '@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}' +
      '@media (prefers-reduced-motion:reduce){.w{animation:none}}' +
      '.t{flex:1;min-width:0}.t b{display:block;font-weight:700}' +
      '.t s{display:block;text-decoration:none;opacity:.72;font-size:12px;margin-top:2px}' +
      'button{font:inherit;border:0;border-radius:9px;padding:8px 12px;cursor:pointer}' +
      '.go{background:#4fc3f7;color:#06263a;font-weight:700}' +
      '.no{background:transparent;color:#9fb6c9;padding:8px 6px}' +
      '</style>' +
      '<div class="w"><span aria-hidden="true">🔖</span>' +
      '<div class="t"><b>지난번 ' + where + '까지 읽었어요</b><s>' + ago(rec.updated) + ' 저장됨</s></div>' +
      '<button class="go" type="button">이어보기</button>' +
      '<button class="no" type="button" aria-label="닫기">✕</button></div>';
    function close() { if (host.parentNode) host.parentNode.removeChild(host); }
    root.querySelector('.go').onclick = function () { close(); jump(rec); };
    root.querySelector('.no').onclick = close;
    document.body.appendChild(host);
    setTimeout(close, 15000);
  }

  /* 딥링크로 열었으면 안내하지 않는다.
     이때 location.hash는 못 쓴다 — 덱 엔진 대부분이 첫 장을 그리면서
     history.replaceState('#top')로 주소를 먼저 바꿔 놓기 때문에, 이 셸이
     도는 시점에는 늘 해시가 있는 것처럼 보인다(v1이 안내를 못 띄우던 원인).
     그래서 <head>에서 미리 잡아둔 진입 해시를 쓰고, 없으면 내비게이션
     타이밍의 원래 주소를 본다. */
  function openedWithHash() {
    if (typeof window.__deckInitHash === 'string') return window.__deckInitHash.length > 1;
    try {
      var e = performance.getEntriesByType('navigation')[0];
      if (e && e.name) return new URL(e.name).hash.length > 1;
    } catch (x) {}
    return !!location.hash;
  }

  if (!openedWithHash()) {
    load(FILE).then(function (rec) {
      if (!rec) return;
      var worth = rec.kind === 'slide' ? rec.page > 1 : rec.scrollY > 200;
      if (worth) toast(rec);
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
