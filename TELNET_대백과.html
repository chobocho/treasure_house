sl('프로토콜','프로토콜 내부 지도', `
<h1><span class="no">3.1</span>프로토콜 내부 지도</h1>
<p>TELNET은 겉보기엔 "TCP 위의 평문 스트림"이지만, 그 안에는 <strong>세 개의 층</strong>이 겹쳐 흐릅니다. 이 장에서는 바이트 단위로 그 셋을 분해합니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>층</th><th>정체</th><th>구분자</th></tr></thead>
<tbody>
<tr><td><span class="tg data">DATA</span> NVT 데이터</td><td>7비트 US-ASCII 문자 + NVT 제어코드(CR·LF·BEL…)</td><td>없음(그냥 바이트)</td></tr>
<tr><td><span class="tg cmd">CMD</span> TELNET 명령</td><td><code>IAC</code>(0xFF) + 명령코드(240–254)</td><td><code>IAC</code>로 시작</td></tr>
<tr><td><span class="tg sb">SB</span> 서브협상</td><td><code>IAC SB &lt;opt&gt; … IAC SE</code></td><td><code>IAC SB</code>…<code>IAC SE</code></td></tr>
</tbody></table></div>
<div class="fx">핵심: 제어와 데이터는 <em>같은 스트림</em>(in-band)을 흐르며, 오직 <code>IAC</code>=0xFF 한 바이트가 둘을 가른다.</div>
<p class="mut small">근거 RFC: <a href="https://www.rfc-editor.org/rfc/rfc854" target="_blank" rel="noopener">RFC 854</a>(프로토콜) · <a href="https://www.rfc-editor.org/rfc/rfc855" target="_blank" rel="noopener">RFC 855</a>(옵션 규격).</p>`);

sl('프로토콜','NVT — 프린터와 키보드 모델', `
<h1><span class="no">3.2</span>NVT: 프린터와 키보드 모델</h1>
<p>TELNET의 심장은 <em>Network Virtual Terminal</em>(NVT)입니다. 실제 단말이 CRT든 텔레타이프든 종이 프린터든, 양쪽 끝은 서로를 <strong>가상의 표준 단말</strong>로 취급합니다. 그 덕에 어떤 호스트든 상대 단말의 구체적 사양을 몰라도 통신할 수 있습니다.</p>
<div class="cols">
<div>
<h3>프린터 (출력)</h3>
<ul>
<li>수신한 바이트를 화면/종이에 <em>순차 인쇄</em></li>
<li>US-ASCII 95개 인쇄문자 + 정의된 제어코드만 해석</li>
<li>"논리적으로 무한한 폭·길이"를 가정(실제 폭은 NAWS로 전달)</li>
</ul>
</div>
<div>
<h3>키보드 (입력)</h3>
<ul>
<li>사용자 입력을 상대에게 전송</li>
<li>브레이크·인터럽트 같은 특수기능은 <code>IP</code>·<code>BRK</code> 등 명령으로 대응</li>
<li>기본은 <strong>에코 없음</strong> — 로컬/원격 에코는 협상으로 결정</li>
</ul>
</div>
</div>
<div class="tip">NVT는 "최소 공통분모" 단말이다. 더 나은 기능(윈도우 크기·터미널 타입·바이너리)은 전부 <strong>옵션 협상</strong>으로 얹는다.</div>`);

sl('프로토콜','US-ASCII 7비트와 여덟 번째 비트', `
<h1><span class="no">3.3</span>US-ASCII 7비트와 8번째 비트</h1>
<p>NVT의 기본 문자 집합은 <strong>7비트 US-ASCII</strong>입니다. 코드 0–127만 의미를 가지며, 전송 시 각 문자는 8비트 옥텟에 담기되 <em>최상위 비트(MSB)는 0</em>입니다.</p>
<div class="fx big">NVT ASCII = 7비트 값(0–127)을 상위비트 0인 8비트 옥텟으로 전송</div>
<div class="cols">
<div>
<h3>코드 0–127의 배치</h3>
<ul>
<li><code>0x00–0x1F</code> : 제어문자(C0)</li>
<li><code>0x20</code> : 스페이스, <code>0x21–0x7E</code> : 인쇄문자 95개</li>
<li><code>0x7F</code> : DEL</li>
</ul>
</div>
<div>
<h3>8번째 비트는?</h3>
<ul>
<li>NVT ASCII 모드에서는 반드시 <strong>0</strong></li>
<li>8비트를 온전히 쓰려면 <code>BINARY</code>(옵션 0)를 <em>양방향</em> 협상해야 함(→ 3.27)</li>
<li>UTF-8·Latin-1 등은 BINARY 하에서만 안전</li>
</ul>
</div>
</div>
<div class="note">주의: 상위비트가 1인 바이트를 BINARY 협상 없이 흘리면, 그 값이 <code>0xFF</code>일 경우 <code>IAC</code>로 오인되어 프로토콜이 깨진다.</div>`);

sl('프로토콜','NVT 제어코드 표', `
<h1><span class="no">3.4</span>NVT ASCII 제어코드</h1>
<p>RFC 854는 NVT 프린터가 <strong>반드시 해석해야 하는</strong> 제어코드와 나머지(무시 가능)를 규정합니다. 아래가 그 필수 목록입니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>이름</th><th>10진</th><th>16진</th><th>\\x</th><th>프린터 동작</th></tr></thead>
<tbody>
<tr><td><code>NUL</code></td><td>0</td><td>0x00</td><td>\\0</td><td>동작 없음(no-op) — CR 뒤 채움용</td></tr>
<tr><td><code>BEL</code></td><td>7</td><td>0x07</td><td>\\a</td><td>가청/가시 경보</td></tr>
<tr><td><code>BS</code></td><td>8</td><td>0x08</td><td>\\b</td><td>인쇄 위치 한 칸 왼쪽</td></tr>
<tr><td><code>HT</code></td><td>9</td><td>0x09</td><td>\\t</td><td>다음 수평 탭 정지점으로</td></tr>
<tr><td><code>LF</code></td><td>10</td><td>0x0A</td><td>\\n</td><td>다음 행으로(같은 열 유지)</td></tr>
<tr><td><code>VT</code></td><td>11</td><td>0x0B</td><td>\\v</td><td>다음 수직 탭 정지점으로</td></tr>
<tr><td><code>FF</code></td><td>12</td><td>0x0C</td><td>\\f</td><td>다음 페이지 선두로</td></tr>
<tr><td><code>CR</code></td><td>13</td><td>0x0D</td><td>\\r</td><td>인쇄 위치를 같은 행 <em>맨 왼쪽</em>으로</td></tr>
</tbody></table></div>
<div class="tip">주의: <code>LF</code>는 "행 아래로"만, <code>CR</code>은 "왼쪽 끝으로"만 이동한다. "새 줄"은 이 둘의 조합 <strong>CRLF</strong>다(→ 3.5).</div>`);

sl('프로토콜','CR 처리 규칙과 CRLF', `
<h1><span class="no">3.5</span>CR 처리 규칙: CR 뒤엔 LF 또는 NUL</h1>
<p>NVT에서 <code>CR</code>(0x0D)은 <em>커서를 왼쪽 끝으로만</em> 옮깁니다. 그래서 RFC 854는 엄격한 규칙을 둡니다.</p>
<div class="fx big">데이터 스트림의 모든 <code>CR</code>(0x0D) 뒤에는 반드시 <code>LF</code>(0x0A) 또는 <code>NUL</code>(0x00)이 와야 한다.</div>
<div class="cols">
<div>
<h3>두 조합의 의미</h3>
<div class="tw"><table class="tbl">
<thead><tr><th>바이트열</th><th>의미</th></tr></thead>
<tbody>
<tr><td><code>0x0D 0x0A</code> (CR LF)</td><td><strong>새 줄</strong> — 다음 행의 맨 왼쪽</td></tr>
<tr><td><code>0x0D 0x00</code> (CR NUL)</td><td>순수 <strong>캐리지 리턴</strong> — 같은 행 왼쪽 끝(덮어쓰기·밑줄용)</td></tr>
</tbody></table></div>
</div>
<div>
<h3>왜 이렇게?</h3>
<ul>
<li>단독 <code>CR</code>은 "LF 없는 리턴"인지 "새 줄 의도"인지 <em>모호</em>하다</li>
<li><code>NUL</code>을 채워 넣어 "이건 순수 CR"임을 명시</li>
<li>덕분에 종이 프린터에서 덮어쓰기/굵게(겹쳐찍기)가 가능</li>
</ul>
</div>
</div>
<div class="note">실무: 텍스트 프로토콜(HTTP·SMTP·IRC)이 줄 끝을 <strong>CRLF</strong>로 못박은 뿌리가 바로 이 NVT 규약이다. <code>\\r\\n</code>을 습관처럼 쓰는 이유.</div>`);

sl('프로토콜','IAC — 0xFF 이스케이프', `
<h1><span class="no">3.6</span>IAC(0xFF): 제어를 데이터에서 가르는 한 바이트</h1>
<p>제어 명령을 데이터와 같은 스트림에 실으려면 "지금부터 명령"임을 알리는 표식이 필요합니다. 그것이 <span class="tg cmd">IAC</span> = <em>Interpret As Command</em> = <code>0xFF</code>입니다.</p>
<div class="fx">스트림에서 <code>0xFF</code>를 만나면: 다음 바이트는 <strong>데이터가 아니라 명령</strong>이다.</div>
<h3>그럼 데이터에 진짜 0xFF가 있으면?</h3>
<p>8비트/바이너리 데이터에는 값 0xFF가 얼마든지 나올 수 있습니다. 이를 데이터로 전달하려면 <strong>두 번 반복</strong>합니다.</p>
<pre class="code"><code><span class="cm"># 데이터 옥텟 0xFF 를 보내려면 → IAC IAC 로 이스케이프</span>
보내려는 데이터:  ... 41 FF 42 ...        <span class="cm"># "A" 0xFF "B"</span>
실제 전선 위:     ... 41 <span class="kw">FF FF</span> 42 ...     <span class="cm"># 0xFF → FF FF (IAC IAC)</span>

<span class="cm"># 수신측 규칙</span>
IAC 다음이 IAC  →  데이터 옥텟 0xFF 하나로 복원
IAC 다음이 240–254  →  TELNET 명령</code></pre>
<div class="tip">이 규칙은 SB(서브협상) 안의 데이터에도 그대로 적용된다. TERMINAL-TYPE 이름이나 NAWS 크기 값에 0xFF가 나오면 반드시 두 배로(→ 3.20).</div>`);

sl('프로토콜','명령 구조: IAC command option', `
<h1><span class="no">3.7</span>명령 구조: <code>IAC &lt;command&gt; [option]</code></h1>
<p>모든 TELNET 명령은 <code>IAC</code>로 시작하고, 뒤따르는 바이트 수는 명령 종류로 결정됩니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>형태</th><th>길이</th><th>예</th></tr></thead>
<tbody>
<tr><td><code>IAC &lt;cmd&gt;</code></td><td>2바이트</td><td><code>IAC NOP</code> = <code>FF F1</code></td></tr>
<tr><td><code>IAC &lt;WILL/WONT/DO/DONT&gt; &lt;opt&gt;</code></td><td>3바이트</td><td><code>IAC DO SGA</code> = <code>FF FD 03</code></td></tr>
<tr><td><code>IAC SB &lt;opt&gt; … IAC SE</code></td><td>가변</td><td><code>FF FA 1F 00 50 00 18 FF F0</code></td></tr>
</tbody></table></div>
<h3>파싱 관점</h3>
<pre class="code"><code>바이트 = 0xFF ?
 ├─ 아니오 → 데이터 옥텟 (프린터로)
 └─ 예(IAC) → 다음 바이트 c 를 읽어
      c == 0xFF        → 데이터 0xFF 하나
      c in {NOP,DM,BRK,IP,AO,AYT,EC,EL,GA}  → 2바이트 명령 완료
      c in {WILL,WONT,DO,DONT}              → +옵션 1바이트 더
      c == SB(250)     → 서브협상: IAC SE(FF F0) 만날 때까지 수집</code></pre>
<p class="mut small">완전한 파서 구현은 3.30–3.31에서 코드로 다룹니다.</p>`);

sl('프로토콜','명령 코드 표 240–255', `
<h1><span class="no">3.8</span>명령 코드 전체표 (240–255)</h1>
<p>IAC 뒤에 올 수 있는 명령 코드의 완전한 목록입니다. 모두 <a href="https://www.rfc-editor.org/rfc/rfc854" target="_blank" rel="noopener">RFC 854</a> 정의.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>이름</th><th>10진</th><th>16진</th><th>의미</th></tr></thead>
<tbody>
<tr><td><code>SE</code></td><td>240</td><td>0xF0</td><td>서브협상 끝(Subnegotiation End)</td></tr>
<tr><td><code>NOP</code></td><td>241</td><td>0xF1</td><td>무동작(No Operation) — 킵얼라이브용</td></tr>
<tr><td><code>DM</code></td><td>242</td><td>0xF2</td><td>Data Mark — Synch의 동기점</td></tr>
<tr><td><code>BRK</code></td><td>243</td><td>0xF3</td><td>Break — 단말 BREAK 키</td></tr>
<tr><td><code>IP</code></td><td>244</td><td>0xF4</td><td>Interrupt Process — 프로세스 중단(Ctrl+C 격)</td></tr>
<tr><td><code>AO</code></td><td>245</td><td>0xF5</td><td>Abort Output — 출력 버리기(계산은 계속)</td></tr>
<tr><td><code>AYT</code></td><td>246</td><td>0xF6</td><td>Are You There — 생존 확인</td></tr>
<tr><td><code>EC</code></td><td>247</td><td>0xF7</td><td>Erase Character — 직전 문자 지움</td></tr>
<tr><td><code>EL</code></td><td>248</td><td>0xF8</td><td>Erase Line — 현재 줄 지움</td></tr>
<tr><td><code>GA</code></td><td>249</td><td>0xF9</td><td>Go Ahead — 반이중에서 송신권 넘김</td></tr>
<tr><td><code>SB</code></td><td>250</td><td>0xFA</td><td>Subnegotiation Begin — 옵션 파라미터 시작</td></tr>
<tr><td><code>WILL</code></td><td>251</td><td>0xFB</td><td>옵션을 켜겠다/켰다(송신자 관점)</td></tr>
<tr><td><code>WONT</code></td><td>252</td><td>0xFC</td><td>옵션을 끄겠다/거부</td></tr>
<tr><td><code>DO</code></td><td>253</td><td>0xFD</td><td>상대가 옵션을 켜길 요청/허가</td></tr>
<tr><td><code>DONT</code></td><td>254</td><td>0xFE</td><td>상대가 옵션을 끄길 요청/거부</td></tr>
<tr><td><code>IAC</code></td><td>255</td><td>0xFF</td><td>Interpret As Command(이스케이프 자신)</td></tr>
</tbody></table></div>`);

sl('프로토콜','Go Ahead와 반이중 단말', `
<h1><span class="no">3.9</span>Go Ahead(GA)와 반이중 단말</h1>
<p>1969년의 많은 단말은 <strong>반이중(half-duplex)</strong>이었습니다 — 한 번에 한쪽만 송신 가능한 회선. 대표적으로 IBM 2741 같은 기계는 "지금 네 차례"라는 명시적 신호가 필요했습니다.</p>
<div class="cols">
<div>
<h3>GA의 역할</h3>
<ul>
<li>송신을 마친 쪽이 <code>IAC GA</code>(<code>FF F9</code>)를 보냄</li>
<li>= "회선을 넘긴다, 이제 네가 쳐라"</li>
<li>반이중 하드웨어가 입력 방향으로 전환하는 트리거</li>
</ul>
</div>
<div>
<h3>전이중(full-duplex)에서는?</h3>
<ul>
<li>양방향 동시 송신 가능 → 송신권 개념 자체가 불필요</li>
<li>GA는 <em>순수한 오버헤드</em>가 됨</li>
<li>그래서 거의 모든 현대 세션은 GA를 <strong>억제</strong>(SGA, → 3.10)</li>
</ul>
</div>
</div>
<div class="note">기본 NVT는 "GA를 쓴다"가 전제다. 즉 <strong>SGA를 협상하지 않으면</strong> 프롬프트마다 GA가 나올 수 있다. 대화형 셸에서는 이를 반드시 꺼야 문자 단위 응답이 매끄럽다.</div>`);

sl('프로토콜','SGA — Go Ahead 억제', `
<h1><span class="no">3.10</span>SGA: Suppress Go Ahead (옵션 3)</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc858" target="_blank" rel="noopener">RFC 858</a>의 <code>SUPPRESS-GO-AHEAD</code>(옵션 3)는 "이 방향에서 더 이상 <code>GA</code>를 보내지 않겠다"를 선언합니다.</p>
<pre class="code"><code><span class="cm"># 서버가 GA 억제를 자기 방향에 적용하려면</span>
서버 → 클라이언트 : <span class="kw">FF FB 03</span>    <span class="cm"># IAC WILL SGA</span>
클라이언트 → 서버 : <span class="kw">FF FD 03</span>    <span class="cm"># IAC DO SGA  (수락)</span>

<span class="cm"># 대개 대칭으로 양방향 모두 억제</span>
클라이언트 → 서버 : <span class="kw">FF FB 03</span>    <span class="cm"># IAC WILL SGA</span>
서버 → 클라이언트 : <span class="kw">FF FD 03</span>    <span class="cm"># IAC DO SGA</span></code></pre>
<div class="fx">문자-단위(character-at-a-time) 대화형 모드의 두 기둥: <strong>서버의 WILL ECHO</strong> + <strong>양측 SGA</strong>. (→ 3.22)</div>
<div class="tip">SGA는 GA를 없애 회선을 전이중처럼 취급하게 한다. ECHO(→ 3.22)와 짝지어야 한 글자 칠 때마다 서버가 즉시 에코를 돌려주는 매끄러운 셸이 된다.</div>`);

sl('프로토콜','Synch 메커니즘 — TCP Urgent와 DM', `
<h1><span class="no">3.11</span>Synch: TCP Urgent + Data Mark</h1>
<p>사용자가 폭주하는 출력을 멈추려 <span class="kbd">Ctrl+C</span>를 눌렀다 합시다. 그런데 그 신호는 이미 서버가 보낸 <em>수 KB의 출력 뒤</em>에 줄 서 있습니다. 정상 데이터 흐름으로는 늦습니다. TELNET은 이를 <strong>Synch</strong>로 앞질러 갑니다.</p>
<div class="cols">
<div>
<h3>두 요소</h3>
<ul>
<li><strong>TCP Urgent</strong>: URG 플래그 + urgent pointer로 "긴급 데이터 있음"을 앞세워 알림</li>
<li><strong>Data Mark</strong> <code>DM</code>(<code>FF F2</code>): 데이터 스트림 안의 <em>동기점</em> 표식</li>
</ul>
</div>
<div>
<h3>동작</h3>
<ol>
<li>송신측: <code>IAC DM</code>을 보내고, TCP URG로 그 위치를 가리킴</li>
<li>수신측: URG 신호를 받으면 <strong>DM에 이를 때까지 데이터를 스캔·폐기</strong>(TELNET 명령은 계속 해석)</li>
<li>DM 도달 → 정상 처리 재개</li>
</ol>
</div>
</div>
<div class="note">Synch는 "밀린 출력을 버리고 즉시 명령을 처리"하기 위한 우회로다. 방화벽·NAT가 TCP URG를 뭉개는 현대 환경에서는 신뢰도가 낮아, 실무에선 IP/AO의 효과가 제한적일 수 있다.</div>`);

sl('프로토콜','IP · AO · AYT와 Synch', `
<h1><span class="no">3.12</span>IP · AO · AYT가 Synch를 쓰는 법</h1>
<p>사용자 인터럽트 3형제는 대개 <strong>Synch를 동반</strong>해 밀린 데이터를 건너뜁니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>명령</th><th>바이트</th><th>의미</th><th>Synch 동반</th></tr></thead>
<tbody>
<tr><td><code>IP</code> Interrupt Process</td><td><code>FF F4</code></td><td>프로세스 중단(유닉스 SIGINT/Ctrl+C 대응)</td><td>보통 뒤에 <code>IAC DM</code>+URG</td></tr>
<tr><td><code>AO</code> Abort Output</td><td><code>FF F5</code></td><td>지금까지 밀린 출력 폐기(계산은 계속)</td><td>보통 뒤에 <code>IAC DM</code>+URG</td></tr>
<tr><td><code>AYT</code> Are You There</td><td><code>FF F6</code></td><td>"살아있니?" 가시적 응답 요청</td><td>선택적</td></tr>
</tbody></table></div>
<pre class="code"><code><span class="cm"># 전형적 Ctrl+C 시퀀스 (클라이언트 → 서버)</span>
FF F4        <span class="cm"># IAC IP   프로세스 인터럽트</span>
FF F5        <span class="cm"># IAC AO   (선택) 밀린 출력 버려라</span>
FF F2        <span class="cm"># IAC DM   Data Mark  ← 이 옥텟에 TCP URG 포인터를 맞춤</span></code></pre>
<div class="tip"><code>AYT</code>에 서버는 흔히 <code>\\r\\n[yes]\\r\\n</code> 같은 가시 문자열로 답한다. 무응답이면 네트워크/프로세스가 멈춘 것.</div>`);

sl('프로토콜','옵션 협상 4동사 (2×2)', `
<h1><span class="no">3.13</span>협상 모델: WILL / WONT / DO / DONT</h1>
<p>모든 옵션 협상은 네 동사로 이뤄집니다. 핵심은 "누가 그 옵션을 <em>수행</em>하는가"의 관점입니다: <code>WILL/WONT</code>는 <strong>내 쪽</strong>, <code>DO/DONT</code>는 <strong>상대 쪽</strong>을 말합니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th></th><th>켜기(enable)</th><th>끄기(disable)</th></tr></thead>
<tbody>
<tr><td><strong>내가 수행</strong></td><td><code>WILL x</code> "내가 x를 켜겠다"</td><td><code>WONT x</code> "내가 x를 안 켠다/끈다"</td></tr>
<tr><td><strong>상대가 수행</strong></td><td><code>DO x</code> "네가 x를 켜라"</td><td><code>DONT x</code> "네가 x를 꺼라"</td></tr>
</tbody></table></div>
<h3>요청·응답의 짝</h3>
<div class="tw"><table class="tbl">
<thead><tr><th>보낸 쪽</th><th>수락 응답</th><th>거부 응답</th></tr></thead>
<tbody>
<tr><td><code>WILL x</code> (내가 켤게)</td><td>상대: <code>DO x</code></td><td>상대: <code>DONT x</code></td></tr>
<tr><td><code>DO x</code> (너 켜라)</td><td>상대: <code>WILL x</code></td><td>상대: <code>WONT x</code></td></tr>
</tbody></table></div>
<div class="fx">암기: <strong>WILL↔DO</strong>가 "켜자" 합의, <strong>WONT↔DONT</strong>가 "끄자" 합의. 대각선끼리 짝을 이룬다.</div>`);

sl('프로토콜','대칭성 · 거부 자유 · 기본값 off', `
<h1><span class="no">3.14</span>협상의 세 원칙</h1>
<div class="cols">
<div>
<h3>1. 대칭(symmetric)</h3>
<p>협상은 방향별로 독립적이다. 서버가 ECHO를 켜도 클라이언트 방향의 ECHO는 별개다. 두 끝은 완전히 대등한 위치에서 서로에게 <code>WILL/DO</code>를 던진다.</p>
<h3>2. 거부는 항상 가능</h3>
<p>어떤 <code>WILL</code>에도 상대는 <code>DONT</code>로, 어떤 <code>DO</code>에도 <code>WONT</code>로 거부할 수 있다. <em>거부를 거부할 수는 없다.</em> 옵션을 몰라도 안전하게 거절 가능 → 하위호환 보장.</p>
</div>
<div>
<h3>3. 기본값은 off</h3>
<p>협상되지 않은 모든 옵션의 기본 상태는 <strong>비활성(NVT 기본 동작)</strong>이다. 즉 아무것도 협상 안 하면 순수 NVT: 7비트 ASCII, GA 사용, 에코 없음.</p>
<div class="fx">협상은 "기본 NVT에서 무엇을 <em>추가</em>로 켤까"의 대화다.</div>
</div>
</div>
<div class="note">중요 규칙(RFC 855): 이미 켜진 옵션을 다시 켜자거나, 이미 꺼진 걸 또 끄자는 <strong>중복 요청은 응답하지 않는다</strong>. 이 규칙이 없으면 무한 루프가 생긴다(→ 3.15).</div>
<p class="mut small">근거: <a href="https://www.rfc-editor.org/rfc/rfc855" target="_blank" rel="noopener">RFC 855</a> — Telnet Option Specifications.</p>`);

sl('프로토콜','협상 루프 문제', `
<h1><span class="no">3.15</span>왜 순진한 협상은 무한 루프에 빠지나</h1>
<p>"요청이 오면 항상 확인응답을 보낸다"는 순진한 구현은 <strong>에코 폭풍</strong>을 만듭니다.</p>
<pre class="code"><code><span class="cm"># 나쁜 구현: 상태를 안 보고 무조건 응답</span>
A → B :  IAC WILL ECHO      <span class="cm"># A: 내가 에코할게</span>
B → A :  IAC DO   ECHO      <span class="cm"># B: 좋아 (그리고 스스로도 켬)</span>
<span class="cm"># 여기서 B가 "확인"의 뜻으로 다시 요청을 보내면…</span>
B → A :  IAC WILL ECHO      <span class="cm"># B도 에코하겠다? (원치 않던 신규 요청으로 오인)</span>
A → B :  IAC DO   ECHO
A → B :  IAC WILL ECHO      <span class="cm"># … 서로 상대의 응답을 새 요청으로 착각 → 루프</span></code></pre>
<h3>두 가지 방어</h3>
<ul>
<li><strong>중복 억제(RFC 855)</strong>: "이미 그 상태면 응답하지 마라". 대부분의 루프를 막지만, <em>동시 교차 요청</em>은 여전히 애매하다.</li>
<li><strong>Q-메서드(RFC 1143)</strong>: 옵션마다 명시적 상태기계를 두어 요청과 확인을 확실히 구분한다(→ 3.16).</li>
</ul>
<div class="tip">교차(cross) 시나리오: A가 <code>DO x</code>를 보내는 동시에 B가 <code>WILL x</code>를 보내면, 각자 이건 "내 요청의 응답"인지 "상대의 새 요청"인지 헷갈린다. Q-메서드가 이걸 상태로 푼다.</div>`);

sl('프로토콜','RFC 1143 Q-메서드 상태표', `
<h1><span class="no">3.16</span>RFC 1143 Q-메서드: 상태기계</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc1143" target="_blank" rel="noopener">RFC 1143</a>은 각 옵션의 <em>각 방향</em>마다 4개 상태 + 큐 비트를 둡니다. 이것이 협상 루프의 결정적 해법입니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>상태</th><th>의미</th></tr></thead>
<tbody>
<tr><td><code>NO</code></td><td>비활성(기본). 아무 협상 없음</td></tr>
<tr><td><code>YES</code></td><td>활성. 협상 완료·확정</td></tr>
<tr><td><code>WANTNO</code></td><td>끄기를 요청하고 상대 확인 대기 중</td></tr>
<tr><td><code>WANTYES</code></td><td>켜기를 요청하고 상대 확인 대기 중</td></tr>
</tbody></table></div>
<h3>큐 비트(queue bit): EMPTY / OPPOSITE</h3>
<p><code>WANTNO</code>·<code>WANTYES</code> 각각에 "응답 대기 중 <em>반대 요청이 큐에 쌓였는가</em>"를 나타내는 비트가 붙어, 총 6개 상황을 구분합니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>상태 + 큐</th><th>뜻</th></tr></thead>
<tbody>
<tr><td><code>WANTYES, EMPTY</code></td><td>켜기 요청함. 확인 오면 → YES</td></tr>
<tr><td><code>WANTYES, OPPOSITE</code></td><td>켜기 요청 후 마음 바뀜(끄고 싶음). 확인 오면 즉시 다시 끄기 요청</td></tr>
<tr><td><code>WANTNO, EMPTY</code></td><td>끄기 요청함. 확인 오면 → NO</td></tr>
<tr><td><code>WANTNO, OPPOSITE</code></td><td>끄기 요청 후 마음 바뀜(켜고 싶음). 확인 오면 즉시 다시 켜기 요청</td></tr>
</tbody></table></div>`);

sl('프로토콜','Q-메서드 전이 로직 (코드)', `
<h1><span class="no">3.17</span>Q-메서드 전이: DO 수신 처리 예</h1>
<p>내 쪽(us) 옵션에 대해 상대의 <code>DO</code>를 받았을 때의 정식 전이입니다(RFC 1143 알고리즘 요약).</p>
<pre class="code"><code><span class="kw">def</span> <span class="kw">recv_DO</span>(opt):
    <span class="cm"># us[opt] = 내 방향 상태, usq[opt] = 큐 비트</span>
    <span class="kw">if</span> us[opt] == NO:
        <span class="kw">if</span> we_agree_to_enable(opt):
            us[opt] = YES;  send(WILL, opt)     <span class="cm"># 켜고 확인</span>
        <span class="kw">else</span>:
            send(WONT, opt)                      <span class="cm"># 거부</span>
    <span class="kw">elif</span> us[opt] == YES:
        <span class="kw">pass</span>                                     <span class="cm"># 이미 켜짐 → 무응답(중복 억제)</span>
    <span class="kw">elif</span> us[opt] == WANTNO:
        <span class="kw">if</span> usq[opt] == EMPTY:
            us[opt] = NO                          <span class="cm"># 오류상황: 상대가 DO로 답 → 그냥 NO 확정</span>
        <span class="kw">else</span>:  <span class="cm"># OPPOSITE</span>
            us[opt] = YES;  usq[opt] = EMPTY      <span class="cm"># 마음 바뀐 대로 켜짐 확정</span>
    <span class="kw">elif</span> us[opt] == WANTYES:
        <span class="kw">if</span> usq[opt] == EMPTY:
            us[opt] = YES                          <span class="cm"># 내 WILL의 확인 도착 → 켜짐 확정</span>
        <span class="kw">else</span>:  <span class="cm"># OPPOSITE</span>
            us[opt] = WANTNO; usq[opt] = EMPTY
            send(WONT, opt)                        <span class="cm"># 다시 끄기 요청</span></code></pre>
<div class="fx">핵심 불변식: <strong>YES/NO는 확정</strong>, <strong>WANT*는 대기</strong>, 큐 비트는 "대기 중 뒤집힌 의사"를 한 칸 기억한다. 이 6-상태로 교차 요청까지 모두 결정론적으로 수렴한다.</div>`);

sl('프로토콜','서브협상 구조 IAC SB … IAC SE', `
<h1><span class="no">3.18</span>서브협상: <code>IAC SB &lt;opt&gt; … IAC SE</code></h1>
<p><code>WILL/DO</code>로 옵션을 <em>켜기</em>로 합의한 뒤, 그 옵션의 <strong>세부 파라미터</strong>(터미널 타입 문자열, 창 크기 숫자 등)를 실어 나르는 통로가 서브협상(SB)입니다.</p>
<pre class="code"><code>FF FA  &lt;opt&gt;  &lt;파라미터 바이트들…&gt;  FF F0
│  │    │                          │
IAC SB  옵션코드                IAC SE</code></pre>
<div class="cols">
<div>
<h3>규칙</h3>
<ul>
<li>반드시 <code>IAC SB</code>로 열고 <code>IAC SE</code>로 닫는다</li>
<li>옵션은 미리 <code>WILL/DO</code>로 켜진 상태여야 함</li>
<li><code>SE</code> 없이 새 <code>IAC SB</code>가 오면 프로토콜 오류</li>
</ul>
</div>
<div>
<h3>내부 0xFF 이스케이프</h3>
<p>파라미터 바이트 중 값 <code>0xFF</code>는 <span class="tg cmd">IAC</span> <span class="tg cmd">IAC</span>로 두 배 처리해야 한다(→ 3.6 규칙 동일). 안 그러면 수신측이 그 위치를 <code>IAC SE</code>의 IAC로 오인할 수 있다.</p>
</div>
</div>
<div class="note">파서 팁: SB 수집 루프는 "<code>IAC</code>를 만나면 다음 바이트를 본다 — <code>IAC</code>면 데이터 0xFF, <code>SE</code>면 종료"로 짜야 안전하다.</div>`);

sl('프로토콜','TERMINAL-TYPE 서브협상 바이트 추적', `
<h1><span class="no">3.19</span>TERMINAL-TYPE(24) 바이트별 추적</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc1091" target="_blank" rel="noopener">RFC 1091</a>. 옵션 <code>TERMINAL-TYPE</code>=24(0x18), 서브코드 <code>IS</code>=0, <code>SEND</code>=1. 서버가 단말 종류를 물으면 클라이언트가 이름 문자열로 답합니다.</p>
<pre class="code"><code><span class="cm"># 0) 사전 협상 (터미널 타입 쓰겠다 합의)</span>
서버 → CLI : FF FD 18            <span class="cm"># IAC DO   TERMINAL-TYPE</span>
CLI → 서버 : FF FB 18            <span class="cm"># IAC WILL TERMINAL-TYPE</span>

<span class="cm"># 1) 서버: "타입 이름 보내라" (SEND=1)</span>
서버 → CLI : <span class="kw">FF FA</span> 18 <span class="nb">01</span> <span class="kw">FF F0</span>
             │  │  │  │  │  └ SE   서브협상 끝
             │  │  │  │  └ IAC
             │  │  │  └ 01 = SEND
             │  │  └ 18 = 옵션 24 (TERMINAL-TYPE)
             │  └ FA = SB
             └ FF = IAC

<span class="cm"># 2) 클라이언트: IS="XTERM" (IS=0, 이름은 ASCII 대문자)</span>
CLI → 서버 : <span class="kw">FF FA</span> 18 <span class="nb">00</span> 58 54 45 52 4D <span class="kw">FF F0</span>
                         │  │  └───────────┘
                         │  IS=0   "XTERM" = 58('X') 54('T') 45('E') 52('R') 4D('M')</code></pre>
<div class="tip">서버가 <code>SEND</code>를 반복하면 클라이언트는 <em>선호 목록</em>을 순환 제시한다(XTERM → VT100 → …). 같은 이름이 두 번 나오면 목록 끝.</div>`);

sl('프로토콜','NAWS 서브협상 바이트 레이아웃', `
<h1><span class="no">3.20</span>NAWS(31): 창 크기 바이트 레이아웃</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc1073" target="_blank" rel="noopener">RFC 1073</a>. <code>NAWS</code>=31(0x1F). 폭·높이를 각각 <strong>16비트 빅엔디언</strong>으로 보냅니다. 창 크기가 바뀔 때마다 재전송.</p>
<pre class="code"><code><span class="cm"># 협상: CLI가 NAWS를 하겠다고 제안</span>
CLI → 서버 : FF FB 1F            <span class="cm"># IAC WILL NAWS</span>
서버 → CLI : FF FD 1F            <span class="cm"># IAC DO   NAWS</span>

<span class="cm"># 80열 × 24행 전송</span>
CLI → 서버 : <span class="kw">FF FA</span> 1F <span class="nb">00 50</span> <span class="nb">00 18</span> <span class="kw">FF F0</span>
                   │  └──┬──┘ └──┬──┘
                   │   width=  height=
                   │   0x0050    0x0018
                   │   = 80      = 24
                   옵션 31 (NAWS)</code></pre>
<div class="note">0xFF 두 배 규칙: 폭/높이 바이트 중 하나가 <code>0xFF</code>(255)이면 반드시 <code>FF FF</code>로 이스케이프. 예로 폭 255열은 <code>00 FF</code>가 아니라 <code>00 <strong>FF FF</strong></code>로 나가야 한다 — 안 그러면 그 <code>FF</code>가 IAC로 오인된다.</div>
<div class="tip">파서는 SB 데이터를 <em>먼저 언이스케이프</em>(FF FF→FF)한 뒤 4바이트를 <code>&gt;HH</code>(빅엔디언 unsigned short 2개)로 읽어야 정확하다.</div>`);

sl('프로토콜','NEW-ENVIRON 서브협상', `
<h1><span class="no">3.21</span>NEW-ENVIRON(39): 환경변수 전달</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc1572" target="_blank" rel="noopener">RFC 1572</a>. <code>NEW-ENVIRON</code>=39(0x27). 클라이언트가 <code>USER</code>·<code>DISPLAY</code> 등 환경변수를 서버에 전달합니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>코드</th><th>값</th><th>의미</th></tr></thead>
<tbody>
<tr><td><code>IS</code></td><td>0</td><td>"값을 담아 보낸다"(응답)</td></tr>
<tr><td><code>SEND</code></td><td>1</td><td>"변수 보내라"(요청)</td></tr>
<tr><td><code>INFO</code></td><td>2</td><td>비요청 갱신 통보</td></tr>
<tr><td><code>VAR</code></td><td>0</td><td>표준 변수 이름 시작</td></tr>
<tr><td><code>VALUE</code></td><td>1</td><td>변수 값 시작</td></tr>
<tr><td><code>ESC</code></td><td>2</td><td>다음 바이트를 문자 그대로(리터럴)</td></tr>
<tr><td><code>USERVAR</code></td><td>3</td><td>사용자 정의 변수 이름 시작</td></tr>
</tbody></table></div>
<pre class="code"><code><span class="cm"># 서버: "환경변수 전부 보내라"</span>
서버 → CLI : FF FA 27 <span class="nb">01</span> FF F0          <span class="cm"># IAC SB NEW-ENVIRON SEND IAC SE</span>

<span class="cm"># 클라이언트: IS  VAR "USER" VALUE "cho"</span>
CLI → 서버 : FF FA 27 <span class="nb">00</span> <span class="nb">00</span> 55 53 45 52 <span class="nb">01</span> 63 68 6F FF F0
                     │   │  └───┬───┘  │  └──┬──┘
                     IS  VAR "USER"   VALUE "cho"</code></pre>
<div class="note">이름/값 안에 코드값 0·1·2·3(VAR/VALUE/ESC/USERVAR)이 문자로 필요하면 앞에 <code>ESC</code>(2)를 붙여 리터럴로 표시한다. 물론 0xFF는 별개로 IAC 두 배 규칙도 적용.</div>`);

sl('프로토콜','문자 단위 모드 (ECHO + SGA)', `
<h1><span class="no">3.22</span>문자 단위 모드: 서버 WILL ECHO + WILL SGA</h1>
<p>대화형 유닉스 셸의 기본 감각 — 한 글자 칠 때마다 즉시 반응 — 은 서버가 <strong>에코와 편집을 전담</strong>하는 <em>character-at-a-time</em> 모드에서 나옵니다.</p>
<pre class="code"><code><span class="cm"># 서버가 주도하는 표준 진입 협상</span>
서버 → CLI : FF FB 01     <span class="cm"># IAC WILL ECHO   내가 에코할게</span>
CLI → 서버 : FF FD 01     <span class="cm"># IAC DO   ECHO   좋아(로컬 에코 끔)</span>
서버 → CLI : FF FB 03     <span class="cm"># IAC WILL SGA    GA 억제</span>
CLI → 서버 : FF FD 03     <span class="cm"># IAC DO   SGA</span></code></pre>
<div class="fx big">키 입력 1바이트 → 서버로 전송 → 서버가 처리·에코 → 화면 표시. 편집·완성·시그널을 서버가 담당.</div>
<div class="cols">
<div><h3>장점</h3><ul><li>탭 완성·화살표 히스토리·Ctrl-R 등 셸 기능 완전 동작</li><li>서버가 커서·편집 완전 제어</li></ul></div>
<div><h3>대가</h3><ul><li>키마다 왕복(RTT) 발생 → 고지연 회선에서 답답</li><li>패킷·오버헤드 증가</li></ul></div>
</div>
<p class="mut small">근거: <a href="https://www.rfc-editor.org/rfc/rfc857" target="_blank" rel="noopener">RFC 857</a>(ECHO).</p>`);

sl('프로토콜','줄 단위 모드와 kluge line mode', `
<h1><span class="no">3.23</span>줄 단위 모드 vs kluge line mode</h1>
<div class="cols">
<div>
<h3>줄 단위(line-at-a-time)</h3>
<ul>
<li>클라이언트가 <strong>로컬에서 한 줄을 편집</strong>(백스페이스 등)한 뒤, <code>Enter</code> 시 줄 전체를 전송</li>
<li>왕복이 줄당 1회 → 고지연에 유리</li>
<li>서버 측 실시간 문자 기능(탭 완성 등)은 불가</li>
</ul>
</div>
<div>
<h3>kluge line mode</h3>
<ul>
<li>정식 옵션이 아닌 <em>관행적</em> 조합으로 만든 줄 모드</li>
<li>서버가 <code>WONT ECHO</code>(클라 로컬 에코) + <code>WONT SGA</code> 상태로 두면, 클라가 로컬에서 줄을 모아 보냄</li>
<li>"kluge"(임시변통)라 불리는 이유: 명세된 상태기계가 아니라 에코/SGA 조합의 부작용에 기댐</li>
</ul>
</div>
</div>
<div class="tw"><table class="tbl">
<thead><tr><th>모드</th><th>에코 주체</th><th>줄 편집 위치</th><th>왕복</th></tr></thead>
<tbody>
<tr><td>문자 단위</td><td>서버(WILL ECHO)</td><td>서버</td><td>키마다</td></tr>
<tr><td>kluge 줄 모드</td><td>클라이언트(로컬)</td><td>클라 로컬</td><td>줄마다</td></tr>
<tr><td>LINEMODE(→3.24)</td><td>협상으로 명시</td><td>클라(EDIT 비트)</td><td>줄마다</td></tr>
</tbody></table></div>
<div class="note">kluge 모드는 이식성이 나쁘다. 이 혼란을 정리하려고 나온 정식 해법이 <strong>LINEMODE 옵션</strong>이다.</div>`);

sl('프로토콜','LINEMODE 옵션 (34)', `
<h1><span class="no">3.24</span>LINEMODE(34): 정식 줄 모드</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc1184" target="_blank" rel="noopener">RFC 1184</a>. <code>LINEMODE</code>=34(0x22). kluge 모드의 애매함을 없앤 <strong>명시적</strong> 줄 편집 프로토콜. 클라이언트가 로컬 편집·시그널·특수문자를 담당하는 방식을 협상으로 확정합니다.</p>
<pre class="code"><code><span class="cm"># 진입: 서버가 클라에게 LINEMODE를 켜라고 요청</span>
서버 → CLI : FF FD 22          <span class="cm"># IAC DO   LINEMODE</span>
CLI → 서버 : FF FB 22          <span class="cm"># IAC WILL LINEMODE</span>

<span class="cm"># 이어서 MODE 서브협상으로 편집 방식 지정 (→ 3.25)</span>
서버 → CLI : FF FA 22 <span class="nb">01</span> <span class="nb">03</span> FF F0
                     │   │  │  └ SE
                     │   │  └ MODE 마스크 = 0x03 = EDIT|TRAPSIG
                     │   └ MODE 서브옵션 = 1
                     LINEMODE 옵션 = 34</code></pre>
<div class="cols">
<div><h3>LINEMODE 서브옵션</h3><ul><li><code>MODE</code>=1 — 편집 모드 비트마스크</li><li><code>FORWARDMASK</code>=2 — 즉시 전송할 문자 마스크</li><li><code>SLC</code>=3 — 특수 로컬 문자 매핑(→3.26)</li></ul></div>
<div><h3>왜 좋은가</h3><ul><li>줄 편집을 클라 로컬에서(저지연) + 시그널·완성은 협상으로 조율</li><li>모드 변경이 명시적 <code>MODE_ACK</code>로 확인됨</li></ul></div>
</div>`);

sl('프로토콜','LINEMODE MODE 비트', `
<h1><span class="no">3.25</span>LINEMODE MODE 비트마스크</h1>
<p><code>IAC SB LINEMODE MODE &lt;mask&gt; IAC SE</code>의 <code>&lt;mask&gt;</code> 한 바이트가 편집 동작을 결정합니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>비트</th><th>값</th><th>이름</th><th>의미</th></tr></thead>
<tbody>
<tr><td>0</td><td>0x01</td><td><code>EDIT</code></td><td>켜짐: 클라이언트가 <em>로컬</em>에서 줄 편집·조립 후 전송. 꺼짐: 문자 단위 전달</td></tr>
<tr><td>1</td><td>0x02</td><td><code>TRAPSIG</code></td><td>IP·BRK·AYT 등을 로컬에서 잡아 TELNET 명령으로 변환</td></tr>
<tr><td>2</td><td>0x04</td><td><code>MODE_ACK</code></td><td>이 MODE 메시지가 상대 요청에 대한 <em>확인응답</em>임을 표시</td></tr>
<tr><td>3</td><td>0x08</td><td><code>SOFT_TAB</code></td><td>탭을 클라이언트가 스페이스로 확장</td></tr>
<tr><td>4</td><td>0x10</td><td><code>LIT_ECHO</code></td><td>제어문자를 문자 그대로 에코(^C 표기 대신)</td></tr>
</tbody></table></div>
<pre class="code"><code><span class="cm"># 협상 예: 서버가 EDIT|TRAPSIG 요청 → 클라가 ACK 붙여 확인</span>
서버 → CLI : FF FA 22 01 <span class="nb">03</span>       FF F0   <span class="cm"># MODE 0x03 = EDIT|TRAPSIG</span>
CLI → 서버 : FF FA 22 01 <span class="nb">07</span>       FF F0   <span class="cm"># 0x07 = EDIT|TRAPSIG|MODE_ACK</span></code></pre>
<div class="tip"><code>MODE_ACK</code>가 없으면 두 끝이 서로의 MODE 요청을 무한 반복할 수 있다. ACK 비트가 "이건 응답"임을 못박아 수렴시킨다.</div>`);

sl('프로토콜','SLC — Set Local Characters', `
<h1><span class="no">3.26</span>SLC: 특수 로컬 문자 매핑</h1>
<p>LINEMODE에서 클라이언트가 로컬 처리할 특수문자(인터럽트·EOF·서스펜드 등)를 어떤 키에 매핑할지 협상합니다. 구조는 <strong>3바이트 삼중조</strong>의 반복입니다.</p>
<pre class="code"><code>IAC SB LINEMODE SLC  &lt;func&gt; &lt;flags&gt; &lt;keyval&gt;  [&lt;func&gt; &lt;flags&gt; &lt;keyval&gt;]…  IAC SE
                     └──────── 3바이트 삼중조 반복 ────────┘</code></pre>
<div class="cols">
<div>
<h3>대표 func 코드</h3>
<div class="tw"><table class="tbl">
<thead><tr><th>func</th><th>값</th><th>키</th></tr></thead>
<tbody>
<tr><td><code>SLC_IP</code></td><td>3</td><td>인터럽트(Ctrl-C=0x03)</td></tr>
<tr><td><code>SLC_AO</code></td><td>4</td><td>출력 중단</td></tr>
<tr><td><code>SLC_AYT</code></td><td>5</td><td>Are You There</td></tr>
<tr><td><code>SLC_EC</code></td><td>8</td><td>문자 삭제(Backspace)</td></tr>
<tr><td><code>SLC_EL</code></td><td>9</td><td>줄 삭제</td></tr>
<tr><td><code>SLC_EOF</code></td><td>236</td><td>EOF(Ctrl-D=0x04)</td></tr>
</tbody></table></div>
</div>
<div>
<h3>flags 바이트</h3>
<ul>
<li><strong>레벨(하위 2비트)</strong>: <code>NOSUPPORT</code>=0, <code>CANTCHANGE</code>=1, <code>VALUE</code>=2, <code>DEFAULT</code>=3</li>
<li><code>SLC_ACK</code>=0x80 — 확인응답</li>
<li><code>SLC_FLUSHIN</code>=0x40 — 이 문자 시 입력 플러시</li>
<li><code>SLC_FLUSHOUT</code>=0x20 — 출력 플러시</li>
</ul>
</div>
</div>
<div class="note">삼중조의 <code>keyval</code>이 <code>0xFF</code>이면 역시 <code>FF FF</code>로 이스케이프해야 한다(SB 내부 규칙).</div>`);

sl('프로토콜','BINARY 모드 (옵션 0)', `
<h1><span class="no">3.27</span>BINARY 모드: 8비트 투명 채널</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc856" target="_blank" rel="noopener">RFC 856</a>. <code>BINARY</code>=0(0x00). NVT의 7비트·CR규칙 제약을 풀고 <strong>임의의 8비트 옥텟</strong>을 전송합니다(단, <code>0xFF</code>은 여전히 IAC로 이스케이프).</p>
<div class="fx">BINARY는 <strong>방향별</strong>이다. 진정한 양방향 8비트 채널을 원하면 <em>양쪽 모두</em> 협상해야 한다.</div>
<pre class="code"><code><span class="cm"># 양방향 바이너리 (예: UTF-8 셸)</span>
CLI → 서버 : FF FB 00     <span class="cm"># IAC WILL BINARY   내 방향 8비트</span>
서버 → CLI : FF FD 00     <span class="cm"># IAC DO   BINARY   허가</span>
서버 → CLI : FF FB 00     <span class="cm"># IAC WILL BINARY   서버 방향 8비트</span>
CLI → 서버 : FF FD 00     <span class="cm"># IAC DO   BINARY</span></code></pre>
<div class="cols">
<div><h3>BINARY에서 바뀌는 것</h3><ul><li>상위비트 1 옥텟 통과(Latin-1·UTF-8 등)</li><li>"CR 뒤 LF/NUL" 강제 완화 — CR을 리터럴로 취급</li></ul></div>
<div><h3>변하지 않는 것</h3><ul><li><code>0xFF</code>는 무조건 <code>FF FF</code>로 이스케이프</li><li>TELNET 명령(IAC …)은 여전히 유효</li></ul></div>
</div>
<div class="note">한글·이모지가 깨진다면 십중팔구 BINARY 미협상이다. UTF-8은 8비트 시퀀스라 NVT 7비트 채널을 통과하지 못한다.</div>`);

sl('프로토콜','완전한 세션 헥스덤프', `
<h1><span class="no">3.28</span>접속→로그인 프롬프트: 주석 헥스덤프</h1>
<p>실제 telnetd 접속 직후의 전형적 바이트 교환입니다(방향 표기: <em>S</em>=서버, <em>C</em>=클라이언트).</p>
<pre class="code"><code>S→C  FF FD 18                 <span class="cm"># IAC DO   TERMINAL-TYPE(24)</span>
S→C  FF FD 20                 <span class="cm"># IAC DO   TERMINAL-SPEED(32)</span>
S→C  FF FD 27                 <span class="cm"># IAC DO   NEW-ENVIRON(39)</span>
S→C  FF FB 03                 <span class="cm"># IAC WILL SGA(3)</span>
S→C  FF FB 01                 <span class="cm"># IAC WILL ECHO(1)</span>

C→S  FF FB 18                 <span class="cm"># IAC WILL TERMINAL-TYPE   (수락)</span>
C→S  FF FC 20                 <span class="cm"># IAC WONT TERMINAL-SPEED  (거부)</span>
C→S  FF FB 27                 <span class="cm"># IAC WILL NEW-ENVIRON     (수락)</span>
C→S  FF FD 03                 <span class="cm"># IAC DO   SGA             (수락)</span>
C→S  FF FD 01                 <span class="cm"># IAC DO   ECHO            (수락 → 서버 에코)</span>

S→C  FF FA 18 01 FF F0        <span class="cm"># IAC SB TT SEND IAC SE   "타입 뭐냐"</span>
C→S  FF FA 18 00 58 54 45 52 4D FF F0   <span class="cm"># IS "XTERM"</span>

S→C  FF FA 27 01 FF F0        <span class="cm"># IAC SB NEW-ENVIRON SEND IAC SE</span>
C→S  FF FA 27 00 00 55 53 45 52 01 63 68 6F FF F0  <span class="cm"># VAR USER = "cho"</span>

S→C  0D 0A 6C 6F 67 69 6E 3A 20    <span class="cm"># "\\r\\nlogin: "  ← 첫 프롬프트!</span></code></pre>
<div class="tip">마지막 줄 <code>6C 6F 67 69 6E 3A 20</code> = "login: ". 협상이 끝나야 비로소 애플리케이션 데이터(프롬프트)가 흐른다.</div>`);

sl('프로토콜','타이밍 · AYT · NOP 킵얼라이브', `
<h1><span class="no">3.29</span>생존 확인과 킵얼라이브</h1>
<div class="cols">
<div>
<h3>AYT — 사용자용 생존 확인</h3>
<ul>
<li><code>FF F6</code>(IAC AYT)를 보내면 서버가 <em>가시적</em> 응답</li>
<li>서버가 바쁠 때도 "살아있음"을 사람이 확인</li>
<li>보통 <code>\\r\\n[yes]\\r\\n</code> 같은 문자열로 답</li>
</ul>
</div>
<div>
<h3>NOP — 무동작 킵얼라이브</h3>
<ul>
<li><code>FF F1</code>(IAC NOP)는 아무 부작용 없는 2바이트</li>
<li>유휴 연결에 주기적으로 흘려 <strong>NAT/방화벽 타임아웃 방지</strong></li>
<li>TCP keepalive와 별개인 앱 레벨 하트비트</li>
</ul>
</div>
</div>
<pre class="code"><code><span class="cm"># TIMING-MARK(옵션 6, RFC 860)로 왕복·동기 측정</span>
CLI → 서버 : FF FB 06     <span class="cm"># IAC WILL TIMING-MARK</span>
서버 → CLI : FF FD 06     <span class="cm"># IAC DO   TIMING-MARK  ← 이 시점까지의 처리 완료를 의미</span>

<span class="cm"># 유휴 킵얼라이브 (30초마다)</span>
CLI → 서버 : FF F1        <span class="cm"># IAC NOP</span></code></pre>
<div class="note"><code>NOP</code>은 데이터를 만들지 않으므로 셸 세션을 오염시키지 않는다. 반면 잘못된 문자를 보내면 프롬프트에 쓰레기가 남는다.</div>`);

sl('프로토콜','IAC 파서 상태기계 (의사코드)', `
<h1><span class="no">3.30</span>IAC 파서: 상태기계 의사코드</h1>
<p>수신 스트림을 데이터/명령/서브협상으로 가르는 파서의 뼈대입니다. 상태 5개면 충분합니다.</p>
<pre class="code"><code>상태 = { DATA, IAC, CMD_WAIT_OPT, SB, SB_IAC }
버퍼:  sb_opt, sb_data[]

각 수신 바이트 b 에 대해:
  ┌ DATA:
  │   b == 0xFF ?  → 상태=IAC
  │   그 외        → emit_data(b)
  ├ IAC:
  │   b == 0xFF          → emit_data(0xFF); 상태=DATA   <span class="cm"># IAC IAC = 데이터 0xFF</span>
  │   b in {WILL,WONT,DO,DONT} → 동사=b; 상태=CMD_WAIT_OPT
  │   b == SB(0xFA)      → 상태=SB; sb_data=[]
  │   b in {NOP,DM,BRK,IP,AO,AYT,EC,EL,GA,SE} → handle_cmd(b); 상태=DATA
  ├ CMD_WAIT_OPT:
  │   handle_negotiation(동사, b); 상태=DATA          <span class="cm"># 3바이트 명령 완료</span>
  ├ SB:
  │   b == 0xFF ?  → 상태=SB_IAC
  │   그 외        → sb_data.append(b)
  └ SB_IAC:
      b == 0xFF ?  → sb_data.append(0xFF); 상태=SB    <span class="cm"># 이스케이프된 데이터</span>
      b == SE(0xF0) → handle_subneg(sb_data); 상태=DATA
      그 외         → 프로토콜 오류(관대하면 무시)</code></pre>
<div class="fx">불변식: <code>SB</code> 안의 <code>IAC</code>는 항상 짝(<code>IAC IAC</code>=데이터 0xFF, <code>IAC SE</code>=종료)으로만 의미를 가진다.</div>`);

sl('프로토콜','IAC 파서 구현 (Python)', `
<h1><span class="no">3.31</span>IAC 파서: Python 구현</h1>
<p>3.30의 상태기계를 그대로 옮긴, 바이트 스트림을 먹여 넣는 실전 파서입니다.</p>
<pre class="code"><code>IAC,SE,SB = 255,240,250
WILL,WONT,DO,DONT = 251,252,253,254

<span class="kw">class</span> <span class="kw">TelnetParser</span>:
    <span class="kw">def</span> __init__(self):
        self.state = <span class="st">"DATA"</span>
        self.verb = <span class="kw">None</span>
        self.sb = bytearray()

    <span class="kw">def</span> feed(self, chunk: bytes):
        out = bytearray()                 <span class="cm"># 순수 데이터만 모음</span>
        <span class="kw">for</span> b <span class="kw">in</span> chunk:
            s = self.state
            <span class="kw">if</span> s == <span class="st">"DATA"</span>:
                self.state = <span class="st">"IAC"</span> <span class="kw">if</span> b == IAC <span class="kw">else</span> s
                <span class="kw">if</span> b != IAC: out.append(b)
            <span class="kw">elif</span> s == <span class="st">"IAC"</span>:
                <span class="kw">if</span> b == IAC:           out.append(IAC); self.state=<span class="st">"DATA"</span>
                <span class="kw">elif</span> b <span class="kw">in</span> (WILL,WONT,DO,DONT): self.verb=b; self.state=<span class="st">"OPT"</span>
                <span class="kw">elif</span> b == SB:          self.sb=bytearray(); self.state=<span class="st">"SB"</span>
                <span class="kw">else</span>:                  self.on_cmd(b); self.state=<span class="st">"DATA"</span>
            <span class="kw">elif</span> s == <span class="st">"OPT"</span>:
                self.on_negotiate(self.verb, b); self.state=<span class="st">"DATA"</span>
            <span class="kw">elif</span> s == <span class="st">"SB"</span>:
                self.state = <span class="st">"SB_IAC"</span> <span class="kw">if</span> b==IAC <span class="kw">else</span> s
                <span class="kw">if</span> b != IAC: self.sb.append(b)
            <span class="kw">elif</span> s == <span class="st">"SB_IAC"</span>:
                <span class="kw">if</span> b == IAC:   self.sb.append(IAC); self.state=<span class="st">"SB"</span>
                <span class="kw">elif</span> b == SE: self.on_subneg(bytes(self.sb)); self.state=<span class="st">"DATA"</span>
        <span class="kw">return</span> bytes(out)

    <span class="kw">def</span> on_cmd(self,c): ...          <span class="cm"># NOP/DM/IP/AO/AYT/GA…</span>
    <span class="kw">def</span> on_negotiate(self,verb,opt): ...  <span class="cm"># Q-method 상태전이(→3.17)</span>
    <span class="kw">def</span> on_subneg(self,data): ...    <span class="cm"># data[0]=opt, 나머지 파라미터</span></code></pre>`);

sl('프로토콜','협상 교환 치트시트', `
<h1><span class="no">3.32</span>자주 쓰는 협상 교환 치트시트</h1>
<p>실무에서 반복되는 협상을 바이트째 외워두면 tcpdump/와이어샤크 판독이 빨라집니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>목적</th><th>보내는 쪽</th><th>바이트</th><th>기대 응답</th></tr></thead>
<tbody>
<tr><td>서버 에코 켜기</td><td>S</td><td><code>FF FB 01</code> (WILL ECHO)</td><td><code>FF FD 01</code> (DO ECHO)</td></tr>
<tr><td>GA 억제</td><td>S/C</td><td><code>FF FB 03</code> (WILL SGA)</td><td><code>FF FD 03</code> (DO SGA)</td></tr>
<tr><td>단말 타입 요구</td><td>S</td><td><code>FF FD 18</code> (DO TT)</td><td><code>FF FB 18</code> (WILL TT)</td></tr>
<tr><td>창 크기 제공</td><td>C</td><td><code>FF FB 1F</code> (WILL NAWS)</td><td><code>FF FD 1F</code> (DO NAWS)</td></tr>
<tr><td>환경변수 제공</td><td>C</td><td><code>FF FB 27</code> (WILL NEW-ENVIRON)</td><td><code>FF FD 27</code> (DO)</td></tr>
<tr><td>바이너리(내 방향)</td><td>C</td><td><code>FF FB 00</code> (WILL BINARY)</td><td><code>FF FD 00</code> (DO BINARY)</td></tr>
<tr><td>줄 모드</td><td>S</td><td><code>FF FD 22</code> (DO LINEMODE)</td><td><code>FF FB 22</code> (WILL LINEMODE)</td></tr>
<tr><td>거부(예)</td><td>임의</td><td><code>FF FC 20</code> (WONT T-SPEED)</td><td>—(추가 응답 없음)</td></tr>
</tbody></table></div>
<div class="tip">니모닉 암기: <code>FB</code>=WILL, <code>FC</code>=WONT, <code>FD</code>=DO, <code>FE</code>=DONT. 251→254 순서대로 "켤게/안켜/켜라/꺼라".</div>`);

sl('프로토콜','모드 비교 총정리', `

sl('프로토콜','프로토콜 장 정리 · 근거 RFC', `
<h1><span class="no">3.34</span>이 장의 요약과 근거 RFC</h1>
<div class="cols">
<div>
<h3>꼭 기억할 것</h3>
<ul>
<li><code>IAC</code>=0xFF 하나가 데이터와 명령을 가른다. 데이터 0xFF는 <code>FF FF</code>.</li>
<li>명령은 <code>IAC &lt;cmd&gt; [opt]</code>; 협상은 <code>WILL/WONT/DO/DONT</code> 4동사(대각선 짝).</li>
<li>루프 방지의 정답은 <strong>RFC 1143 Q-메서드</strong>(6-상태).</li>
<li>세부값은 <code>IAC SB … IAC SE</code> 서브협상; 내부 0xFF도 두 배.</li>
<li>대화형 감각은 <strong>ECHO+SGA</strong>(문자 단위)에서 나온다.</li>
</ul>
</div>
<div>
<div class="fx">한 문장: TELNET = 순수 NVT 위에, <code>IAC</code> 협상으로 필요한 기능만 켜는 <strong>합의 기반 바이트 스트림</strong>.</div>
</div>
</div>

<li><span class="k doc">DOC</span> <a href="https://www.rfc-editor.org/rfc/rfc855" target="_blank" rel="noopener">RFC 855</a> <span class="mut small">— Option Specifications</span></li>
<li><span class="k doc">DOC</span> <a href="https://www.rfc-editor.org/rfc/rfc1143" target="_blank" rel="noopener">RFC 1143</a> <span class="mut small">— Q-Method 협상 상태기계</span></li>
<li><span class="k doc">DOC</span> <a href="https://www.rfc-editor.org/rfc/rfc1184" target="_blank" rel="noopener">RFC 1184</a> <span class="mut small">— LINEMODE</span></li>

<li><span class="k doc">DOC</span> <a href="https://www.rfc-editor.org/rfc/rfc1572" target="_blank" rel="noopener">RFC 1572</a> <span class="mut small">— NEW-ENVIRON</span></li>

sl('예제','예제 섹션 사용법 — 표기 규약', `
<h1><span class="no">6.1</span>손으로 프로토콜을 말하기</h1>
<p>이 섹션은 이 책의 <strong>심장부</strong>입니다. <code>telnet host port</code> 로 접속해서 텍스트 프로토콜을
<em>한 글자씩 직접 쳐 보는</em> 실전 세션 모음입니다. 복사해서 그대로 따라 칠 수 있게 구성했습니다.</p>
<div class="fx big">telnet = "TCP 소켓에 내가 친 줄을 CRLF로 흘려보내는 도구". HTTP·SMTP·POP3·IMAP·IRC·Redis 등 <strong>모든 텍스트 프로토콜</strong>을 손으로 실습할 수 있다.</div>
<div class="cols">
<div>
<h3>표기 규약</h3>
<ul>
<li><b>굵은 줄</b> = 당신이 <em>직접 타이핑</em>하고 Enter를 누른 줄</li>
<li>평범한 줄 = <strong>서버가 응답</strong>한 바이트</li>
<li><code>&lt;CRLF&gt;</code> = Enter 키 = <code>\\r\\n</code> = <code>0x0D 0x0A</code></li>
<li><code>↵</code> 표시가 있으면 그 자리에서 Enter</li>
</ul>
</div>
<div>
<div class="tip"><strong>준비물</strong>
<ul>
<li>클라이언트: <code>telnet</code> 또는 <code>nc</code>(netcat) / <code>ncat</code></li>
<li>Windows: <code>기능 켜기 → Telnet Client</code> 설치</li>
<li>TLS 포트(443 등)엔 <code>openssl s_client</code> 사용(뒤에서 설명)</li>
</ul>
</div>
</div>
</div>
<div class="note">여기 예제의 서버 응답은 <strong>대표적인 실제 응답</strong>을 재현한 것입니다. 버전·헤더 값은 서버마다 다릅니다. 남의 서버(특히 메일·인증 서버)를 두드릴 땐 <em>허가받은 대상</em>에만, 정중하게.</div>`);

sl('예제','HTTP GET / — 가장 유용한 예제', `
<h1><span class="no">6.2</span>HTTP GET / 완전 해부</h1>
<p>가장 자주 쓰는 실전 활용. <code>example.com</code> 80번에 접속해 최소 HTTP/1.1 요청을 손으로 칩니다.
<b>굵은 4줄</b>을 치고, 마지막에 <em>빈 줄</em>(Enter만)을 하나 더 눌러야 요청이 전송됩니다.</p>
<pre class="code"><code>$ <b>telnet example.com 80</b>
Trying 93.184.216.34...
Connected to example.com.
Escape character is '^]'.
<b>GET / HTTP/1.1</b>
<b>Host: example.com</b>
<b>Connection: close</b>
<b>↵</b>            <span class="cm"># 빈 줄 = 헤더 끝 = 요청 전송</span>

HTTP/1.1 200 OK
Content-Type: text/html; charset=UTF-8
Content-Length: 1256
Date: Wed, 22 Jul 2026 09:14:02 GMT
Server: ECS (dcb/7EA3)
Connection: close

&lt;!doctype html&gt;
&lt;html&gt;
&lt;head&gt;&lt;title&gt;Example Domain&lt;/title&gt; ...
Connection closed by foreign host.</code></pre>
<div class="fx">요청 = <strong>요청줄</strong> + <strong>헤더들</strong> + <strong>빈 줄(CRLF)</strong> + (본문). 빈 줄이 없으면 서버는 계속 헤더를 기다립니다.</div>`);

sl('예제','HTTP 응답 뜯어보기', `
<h1><span class="no">6.3</span>응답의 각 줄 읽는 법</h1>
<p>위에서 받은 응답을 한 줄씩 해석합니다. 이 감각이 있으면 <code>curl -v</code> 없이도 서버 동작을 즉시 파악할 수 있습니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>줄</th><th>의미</th></tr></thead>
<tbody>
<tr><td><code>HTTP/1.1 200 OK</code></td><td>상태줄: 버전 · 상태코드 · 이유구절. 200=성공</td></tr>
<tr><td><code>Content-Type</code></td><td>본문 MIME 타입과 인코딩. 브라우저 렌더링 결정</td></tr>
<tr><td><code>Content-Length: 1256</code></td><td>본문 바이트 수. 이 길이만큼 읽으면 끝(→ 손으로 셀 수 있음)</td></tr>
<tr><td><code>Date</code></td><td>서버 시각(GMT). 시계 동기 확인에도 유용</td></tr>
<tr><td><code>Server</code></td><td>서버 소프트웨어 힌트 → 핑거프린팅에 활용(6.11)</td></tr>
<tr><td><code>Connection: close</code></td><td>응답 후 연결 종료. 우리가 요청 헤더로 부탁한 것</td></tr>
<tr><td>빈 줄</td><td>헤더 끝. 이후 바이트는 모두 본문</td></tr>
</tbody></table></div>
<div class="tip">본문 길이 파악 두 가지: <strong>Content-Length</strong>(고정 길이) 또는 <strong>Transfer-Encoding: chunked</strong>(청크 단위, 6.8). 둘 다 없으면 "연결 끊길 때까지가 본문"(HTTP/1.0 방식).</div>
<p><a href="https://www.rfc-editor.org/rfc/rfc9110" target="_blank" rel="noopener">RFC 9110</a> (HTTP Semantics) 참고.</p>`);

sl('예제','HTTP HEAD — 본문 없이 헤더만', `
<h1><span class="no">6.4</span>HEAD 메서드</h1>
<p><code>HEAD</code>는 <code>GET</code>과 똑같지만 서버가 <strong>본문을 보내지 않고 헤더만</strong> 응답합니다.
파일 크기·수정시각·서버 종류만 알고 싶을 때, 큰 파일을 받지 않고 확인할 때 이상적입니다.</p>
<pre class="code"><code>$ <b>telnet example.com 80</b>
Connected to example.com.
<b>HEAD / HTTP/1.1</b>
<b>Host: example.com</b>
<b>Connection: close</b>
<b>↵</b>

HTTP/1.1 200 OK
Content-Type: text/html; charset=UTF-8
Content-Length: 1256      <span class="cm"># 크기는 알려주지만…</span>
Last-Modified: Thu, 17 Oct 2024 07:18:26 GMT
ETag: "3147526947"
Server: ECS (dcb/7EA3)
Connection: close
                          <span class="cm"># ← 본문 없음! 빈 줄 뒤 바로 연결 종료</span>
Connection closed by foreign host.</code></pre>
<div class="fx">HEAD 응답의 <code>Content-Length</code>는 "GET이었다면 이만큼"이라는 뜻. 실제 본문 바이트는 오지 않는다.</div>
<div class="tip">활용: 링크 유효성 검사, 파일 크기 조회, <code>Last-Modified</code>/<code>ETag</code> 캐시 검증값 수집(→ 조건부 GET 6.10).</div>`);

sl('예제','HTTP/1.0 vs 1.1 — Host 헤더의 결정적 차이', `
<h1><span class="no">6.5</span>1.0 과 1.1, 무엇이 다른가</h1>
<div class="cols">
<div>
<h3>HTTP/1.0 — Host 불필요</h3>
<pre class="code"><code>$ <b>telnet example.com 80</b>
<b>GET / HTTP/1.0</b>
<b>↵</b>

HTTP/1.0 200 OK
Content-Type: text/html
...본문...
Connection closed by foreign host.</code></pre>
<p class="mut small">1.0은 요청줄 한 줄 + 빈 줄이면 끝. 응답 후 <strong>자동으로 연결 종료</strong>.</p>
</div>
<div>
<h3>HTTP/1.1 — Host 필수</h3>
<pre class="code"><code>$ <b>telnet example.com 80</b>
<b>GET / HTTP/1.1</b>
<b>↵</b>

HTTP/1.1 400 Bad Request
Content-Type: text/html
Connection: close

&lt;h1&gt;400 Bad Request&lt;/h1&gt;
&lt;p&gt;Host header required.&lt;/p&gt;</code></pre>
<p class="mut small">Host를 빠뜨리면 <em>400</em>. 1.1은 한 IP에 여러 사이트(가상 호스트)가 얹혀 있어 <strong>어느 사이트인지</strong> Host로 알려줘야 함.</p>
</div>
</div>
<div class="note">HTTP/1.1은 기본이 <strong>keep-alive</strong>(연결 유지)입니다. 손으로 칠 땐 응답 후 프롬프트가 안 돌아와 답답하니 <code>Connection: close</code>를 넣어 서버가 끊게 하세요.</div>`);

sl('예제','HTTP 가상 호스트 — 같은 IP, 다른 사이트', `
<h1><span class="no">6.6</span>Host 헤더만 바꿔 사이트 전환</h1>
<p>같은 IP(예: 한 CDN·한 리버스 프록시)에 수백 개 사이트가 얹혀 있을 때, <strong>Host 헤더</strong>가
서버에게 "어느 사이트를 달라"고 지정합니다. IP는 그대로, Host만 바꿔 두 번 요청해 봅니다.</p>
<pre class="code"><code>$ <b>telnet 203.0.113.10 80</b>       <span class="cm"># IP로 직접 접속</span>
Connected to 203.0.113.10.
<b>GET / HTTP/1.1</b>
<b>Host: blog.example.com</b>
<b>Connection: close</b>
<b>↵</b>

HTTP/1.1 200 OK
Content-Type: text/html
X-Served-Site: blog          <span class="cm"># ← 블로그가 응답</span>
...

$ <b>telnet 203.0.113.10 80</b>       <span class="cm"># 같은 IP 다시</span>
<b>GET / HTTP/1.1</b>
<b>Host: shop.example.com</b>       <span class="cm"># Host만 교체</span>
<b>Connection: close</b>
<b>↵</b>

HTTP/1.1 200 OK
X-Served-Site: shop          <span class="cm"># ← 이번엔 쇼핑몰!</span></code></pre>
<div class="fx">이름 기반 가상 호스팅의 핵심: <strong>1 IP → N 사이트</strong>를 가르는 유일한 단서가 Host 헤더다. DNS 우회·오리진 직접 테스트에 자주 쓰인다.</div>`);

sl('예제','HTTP POST — 본문과 Content-Length', `
<h1><span class="no">6.7</span>POST 요청을 손으로</h1>
<p>POST는 본문(body)을 보냅니다. 핵심은 <strong>Content-Length</strong>: 본문 바이트 수를
<em>정확히</em> 세어 적어야 서버가 "여기까지가 본문"임을 압니다. 폼 데이터 예제(<code>name=alice&amp;age=30</code>, 17바이트).</p>
<pre class="code"><code>$ <b>telnet httpbin.org 80</b>
Connected to httpbin.org.
<b>POST /post HTTP/1.1</b>
<b>Host: httpbin.org</b>
<b>Content-Type: application/x-www-form-urlencoded</b>
<b>Content-Length: 17</b>
<b>Connection: close</b>
<b>↵</b>                          <span class="cm"># 빈 줄 = 헤더 끝, 이제 본문</span>
<b>name=alice&amp;age=30</b>            <span class="cm"># 정확히 17바이트</span>

HTTP/1.1 200 OK

{
  "form": { "age": "30", "name": "alice" },
  ...
}</code></pre>
<div class="note">바이트 수를 <strong>1이라도 틀리면</strong> 서버가 멈춥니다: 너무 짧으면 나머지를 계속 기다리고(hang), 너무 길면 다음 요청이 깨집니다. 손으로 셀 땐 멀티바이트(한글=UTF-8 3바이트)와 CRLF 유무에 주의.</div>`);

sl('예제','HTTP chunked 응답 읽는 법', `
<h1><span class="no">6.8</span>Transfer-Encoding: chunked</h1>
<p>서버가 본문 길이를 미리 모를 때(스트리밍·동적 생성) <strong>청크 인코딩</strong>을 씁니다.
각 청크는 <em>16진수 길이</em> 줄 + CRLF + 데이터 + CRLF. 길이 <code>0</code> 청크가 끝 신호입니다.</p>
<pre class="code"><code>$ <b>telnet example.com 80</b>
<b>GET /stream HTTP/1.1</b>
<b>Host: example.com</b>
<b>Connection: close</b>
<b>↵</b>

HTTP/1.1 200 OK
Content-Type: text/plain
Transfer-Encoding: chunked

1a                 <span class="cm"># 0x1a = 26바이트 청크가 이어짐</span>
Mozilla Developer Network!
9                  <span class="cm"># 0x9 = 9바이트</span>
Hello Bob
0                  <span class="cm"># 길이 0 = 본문 끝</span>
                   <span class="cm"># 마지막 CRLF</span>
Connection closed by foreign host.</code></pre>
<div class="fx">읽기 알고리즘: <strong>①</strong> 한 줄 읽어 16진 길이 N 파싱 → <strong>②</strong> N바이트 읽기 → <strong>③</strong> CRLF 버림 → N=0이면 종료, 아니면 반복.</div>
<div class="tip">손으로 볼 땐 각 데이터 줄 뒤에 보이지 않는 CRLF가 포함돼 길이에 세어짐을 기억하세요. <code>MDN!</code> 뒤 CRLF까지 26바이트.</div>`);

sl('예제','HTTP 리다이렉트 301/302 추적', `
<h1><span class="no">6.9</span>3xx 리다이렉트를 손으로 따라가기</h1>
<p>브라우저·curl은 리다이렉트를 자동 추적하지만, telnet은 <strong>서버가 시키는 대로만</strong> 보여줍니다.
<code>Location</code> 헤더의 새 주소로 <em>직접 다시</em> 접속해 한 홉씩 따라갑니다. (http → https 강제 흔한 사례)</p>
<pre class="code"><code>$ <b>telnet example.com 80</b>
<b>GET / HTTP/1.1</b>
<b>Host: example.com</b>
<b>Connection: close</b>
<b>↵</b>

HTTP/1.1 301 Moved Permanently
Location: https://example.com/       <span class="cm"># ← 여기로 가라</span>
Content-Length: 0
Connection: close</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>코드</th><th>뜻</th><th>메서드 유지?</th></tr></thead>
<tbody>
<tr><td><code>301</code></td><td>영구 이동(캐시·북마크 갱신)</td><td>보통 GET으로 바뀜</td></tr>
<tr><td><code>302</code></td><td>임시 이동</td><td>보통 GET으로 바뀜</td></tr>
<tr><td><code>307</code></td><td>임시(메서드 보존)</td><td>POST → POST 유지</td></tr>
<tr><td><code>308</code></td><td>영구(메서드 보존)</td><td>POST → POST 유지</td></tr>
</tbody></table></div>
<div class="note">위 Location이 <code>https://</code>라면 다음 홉은 telnet으로 불가(TLS). <code>openssl s_client</code>로 갈아타야 합니다 → 6.12.</div>`);

sl('예제','HTTP 조건부 GET — 캐시와 304', `
<h1><span class="no">6.10</span>If-Modified-Since / ETag</h1>
<p>먼저 <code>HEAD</code>로 <strong>Last-Modified</strong>·<strong>ETag</strong>를 받은 뒤,
그 값으로 조건부 요청을 보냅니다. 안 바뀌었으면 서버는 본문 없이 <code>304 Not Modified</code>만 돌려줍니다(대역폭 절약의 핵심).</p>
<pre class="code"><code>$ <b>telnet example.com 80</b>
<b>GET /style.css HTTP/1.1</b>
<b>Host: example.com</b>
<b>If-Modified-Since: Thu, 17 Oct 2024 07:18:26 GMT</b>
<b>Connection: close</b>
<b>↵</b>

HTTP/1.1 304 Not Modified          <span class="cm"># 바뀐 것 없음 → 본문 생략</span>
ETag: "3147526947"
Cache-Control: max-age=3600
Connection: close</code></pre>
<div class="cols">
<div><h3>ETag 기반</h3>
<pre class="code"><code><b>GET /style.css HTTP/1.1</b>
<b>Host: example.com</b>
<b>If-None-Match: "3147526947"</b>
<b>Connection: close</b>
<b>↵</b>

HTTP/1.1 304 Not Modified</code></pre></div>
<div><h3>캐싱 헤더</h3>
<ul>
<li><code>Cache-Control: max-age=N</code> — N초 신선</li>
<li><code>ETag</code> — 콘텐츠 지문(변경 감지)</li>
<li><code>Last-Modified</code> — 최종 수정시각</li>
<li><code>Vary</code> — 캐시 키 분기 헤더</li>
</ul></div>
</div>`);

sl('예제','HTTP 서버 핑거프린팅 — 헤더로 정보 수집', `
<h1><span class="no">6.11</span>헤더만 보고 서버 식별</h1>
<p>응답 헤더는 <strong>서버 소프트웨어의 신분증</strong>입니다. <code>HEAD</code> 한 방으로 웹서버 종류·버전·프록시·프레임워크를 추정합니다(보안 점검·핑거프린팅의 기본).</p>
<pre class="code"><code>$ <b>telnet target.example 80</b>
<b>HEAD / HTTP/1.1</b>
<b>Host: target.example</b>
<b>Connection: close</b>
<b>↵</b>

HTTP/1.1 200 OK
Server: nginx/1.24.0                  <span class="cm"># 웹서버 + 버전</span>
X-Powered-By: PHP/8.2.7               <span class="cm"># 백엔드 언어</span>
X-Aspnet-Version: 4.0.30319           <span class="cm"># (있다면) .NET</span>
Via: 1.1 varnish                      <span class="cm"># 앞단 캐시/프록시</span>
Set-Cookie: PHPSESSID=...; path=/     <span class="cm"># 세션 관리 힌트</span>
Strict-Transport-Security: max-age=63072000</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>헤더</th><th>알 수 있는 것</th></tr></thead>
<tbody>
<tr><td><code>Server</code></td><td>nginx/Apache/IIS/ECS… + 버전</td></tr>
<tr><td><code>X-Powered-By</code></td><td>PHP/Express/ASP.NET 등 런타임</td></tr>
<tr><td><code>Via</code> / <code>X-Cache</code></td><td>Varnish/CDN/프록시 존재</td></tr>
<tr><td><code>Set-Cookie</code> 이름</td><td>프레임워크(JSESSIONID=Java, PHPSESSID=PHP)</td></tr>
</tbody></table></div>
<div class="note">방어 측은 이런 헤더를 숨기거나(<code>server_tokens off;</code>) 위장합니다. 수집한 정보는 <em>허가된 점검</em>에만 사용하세요.</div>`);

sl('예제','HTTPS 주의 — telnet은 TLS를 못 한다', `
<h1><span class="no">6.12</span>443 포트엔 openssl s_client</h1>
<p><code>telnet host 443</code>으로 접속은 되지만, HTTPS는 <strong>TLS 암호화</strong>가 먼저입니다.
평문으로 <code>GET</code>을 치면 서버는 이해 못 하고 끊습니다. TLS 핸드셰이크를 대신 해줄 <code>openssl s_client</code>를 씁니다.</p>
<pre class="code"><code>$ <b>openssl s_client -connect example.com:443 -servername example.com -quiet</b>
depth=2 C = US, O = ... verify return:1
...핸드셰이크·인증서 정보...

<b>GET / HTTP/1.1</b>                 <span class="cm"># TLS 터널 위에서 평범한 HTTP</span>
<b>Host: example.com</b>
<b>Connection: close</b>
<b>↵</b>

HTTP/1.1 200 OK
Content-Type: text/html
...</code></pre>
<div class="fx"><code>-servername</code>(SNI)은 HTTP의 Host처럼 <strong>TLS 단계의 가상호스트 선택자</strong>. 최신 서버는 SNI가 없으면 다른(혹은 기본) 인증서를 줍니다.</div>
<div class="tip">인증서만 확인: <code>openssl s_client -connect host:443 &lt;/dev/null 2&gt;/dev/null | openssl x509 -noout -dates -subject</code> — 만료일·CN을 즉시 출력.</div>`);

sl('예제','SMTP 세션 — 메일을 손으로 보내기', `
<h1><span class="no">6.13</span>telnet mail 25 : 완전한 발송</h1>
<p>SMTP는 <strong>사람이 읽을 수 있는</strong> 명령/응답 프로토콜의 교과서입니다. 3자리 응답코드(2xx 성공, 3xx 계속, 4xx/5xx 실패)를 보며 대화합니다.</p>
<pre class="code"><code>$ <b>telnet mail.example.com 25</b>
Connected to mail.example.com.
220 mail.example.com ESMTP Postfix        <span class="cm"># 서버 인사(banner)</span>
<b>EHLO client.example.org</b>
250-mail.example.com Hello client.example.org
250-PIPELINING
250-SIZE 10485760
250-STARTTLS
250 8BITMIME
<b>MAIL FROM:&lt;alice@example.org&gt;</b>
250 2.1.0 Ok
<b>RCPT TO:&lt;bob@example.com&gt;</b>
250 2.1.5 Ok
<b>DATA</b>
354 End data with &lt;CR&gt;&lt;LF&gt;.&lt;CR&gt;&lt;LF&gt;    <span class="cm"># 이제 헤더+본문, 끝은 한 줄에 점 하나</span>
<b>Subject: 손으로 보낸 메일</b>
<b>From: alice@example.org</b>
<b>To: bob@example.com</b>
<b>↵</b>
<b>telnet으로 직접 작성한 메시지입니다.</b>
<b>.</b>                                    <span class="cm"># 단독 점 = 본문 끝</span>
250 2.0.0 Ok: queued as 4B2c3D
<b>QUIT</b>
221 2.0.0 Bye</code></pre>
<div class="fx">흐름: <strong>EHLO → MAIL FROM → RCPT TO → DATA → (본문) → "." → QUIT</strong>. 본문 종료는 <code>&lt;CRLF&gt;.&lt;CRLF&gt;</code> (dot-stuffing 규칙, RFC 5321).</div>`);

sl('예제','SMTP 진단 — EHLO 능력과 오픈릴레이 점검', `
<h1><span class="no">6.14</span>메일 서버 테스트, 책임 있게</h1>
<div class="cols">
<div>
<h3>EHLO로 능력 조회</h3>
<pre class="code"><code>$ <b>telnet mail.example.com 25</b>
220 mail ESMTP
<b>EHLO test.example</b>
250-mail Hello
250-STARTTLS        <span class="cm"># TLS 승급 지원</span>
250-AUTH LOGIN PLAIN <span class="cm"># 인증 방식</span>
250-SIZE 52428800   <span class="cm"># 최대 메일 크기</span>
250 8BITMIME
<b>QUIT</b>
221 Bye</code></pre>
<p class="mut small">각 <code>250-</code>은 서버가 지원하는 확장. 마지막만 <code>250 </code>(하이픈 없음).</p>
</div>
<div>
<h3>오픈릴레이 여부(정상=거부)</h3>
<pre class="code"><code><b>MAIL FROM:&lt;a@외부.com&gt;</b>
250 Ok
<b>RCPT TO:&lt;b@또다른외부.com&gt;</b>
554 5.7.1 Relay access denied   <span class="cm"># ← 올바름!</span></code></pre>
<p class="mut small">외부→외부 중계를 <strong>거부</strong>하면 건강한 서버. 250으로 받아주면 스팸 악용 위험(오픈릴레이).</p>
</div>
</div>
<div class="note">타인의 메일 서버로 실제 발송·릴레이 테스트를 하는 것은 <strong>남용·불법</strong>이 될 수 있습니다. 반드시 <em>본인 소유/허가된</em> 서버에서, 연결·EHLO 수준의 점검만 하세요. 발신 주소 위조(스푸핑)로 실제 메일을 쏘지 마세요.</div>`);

sl('예제','POP3 세션 — 메일 받아오기', `
<h1><span class="no">6.15</span>telnet mail 110 : POP3</h1>
<p>POP3는 응답이 <code>+OK</code>(성공)/<code>-ERR</code>(실패)로 단순합니다. 사서함을 열어 목록을 보고 한 통을 통째로 받아옵니다.</p>
<pre class="code"><code>$ <b>telnet mail.example.com 110</b>
+OK Dovecot ready.
<b>USER alice</b>
+OK
<b>PASS s3cr3t</b>                <span class="cm"># 평문 전송! (실서비스는 POP3S 995)</span>
+OK Logged in.
<b>STAT</b>
+OK 2 3120               <span class="cm"># 메일 2통, 총 3120바이트</span>
<b>LIST</b>
+OK 2 messages:
1 1508
2 1612
.
<b>RETR 1</b>
+OK 1508 octets
From: bob@example.com
Subject: 안녕하세요
...메시지 전문...
.                        <span class="cm"># 단독 점 = 메시지 끝</span>
<b>DELE 1</b>
+OK Marked to be deleted.
<b>QUIT</b>
+OK Logging out.         <span class="cm"># QUIT 시점에 DELE 실제 반영</span></code></pre>
<div class="tip">명령 요약: <code>STAT</code>(요약) · <code>LIST</code>(목록) · <code>RETR n</code>(전문) · <code>TOP n k</code>(헤더+k줄) · <code>DELE n</code>(삭제표시) · <code>RSET</code>(삭제취소) · <code>QUIT</code>(반영·종료).</div>`);

sl('예제','IMAP 세션 — 태그드 명령', `
<h1><span class="no">6.16</span>telnet mail 143 : IMAP</h1>
<p>IMAP은 각 명령에 <strong>태그</strong>(예 <code>a1</code>, <code>a2</code>…)를 붙이고, 서버는 같은 태그로 완료를 알립니다.
서버 응답 중 <code>*</code>로 시작하는 줄은 <em>비요청 데이터</em>, 태그로 시작하면 <em>그 명령의 최종 결과</em>입니다.</p>
<pre class="code"><code>$ <b>telnet mail.example.com 143</b>
* OK [CAPABILITY IMAP4rev1 STARTTLS AUTH=PLAIN] Dovecot ready.
<b>a1 LOGIN alice s3cr3t</b>
a1 OK [CAPABILITY IMAP4rev1 ...] Logged in
<b>a2 SELECT INBOX</b>
* 2 EXISTS                 <span class="cm"># 메일 2통</span>
* 0 RECENT
* OK [UIDVALIDITY 1687] UIDs valid
a2 OK [READ-WRITE] Select completed
<b>a3 FETCH 1 (FLAGS BODY[HEADER.FIELDS (SUBJECT FROM)])</b>
* 1 FETCH (FLAGS (\\Seen) BODY[HEADER.FIELDS (SUBJECT FROM)] {48}
Subject: 안녕하세요
From: bob@example.com
)
a3 OK Fetch completed
<b>a4 LOGOUT</b>
* BYE Logging out
a4 OK Logout completed</code></pre>
<div class="fx"><code>{48}</code>는 뒤따르는 <strong>리터럴 48바이트</strong>를 뜻함. <code>\\Seen</code> 같은 플래그로 읽음/답장/삭제 상태를 표현(RFC 3501).</div>`);

sl('예제','NNTP 세션 — 뉴스그룹 읽기', `
<h1><span class="no">6.17</span>telnet news 119 : NNTP</h1>
<p>유즈넷 뉴스 프로토콜. 그룹을 선택(<code>GROUP</code>)하고 기사를 번호나 메시지ID로 가져옵니다(<code>ARTICLE</code>). 응답은 3자리 코드로 시작.</p>
<pre class="code"><code>$ <b>telnet news.example.com 119</b>
200 news.example.com NNRP ready (posting ok)
<b>GROUP comp.lang.python</b>
211 4521 100123 104643 comp.lang.python
   <span class="cm"># 211 &lt;개수&gt; &lt;최저번호&gt; &lt;최고번호&gt; &lt;그룹명&gt;</span>
<b>ARTICLE 104643</b>
220 104643 &lt;abc123@example.com&gt; article
Path: news.example.com!...
From: dev@example.org
Newsgroups: comp.lang.python
Subject: Re: telnetlib removal in 3.13
Message-ID: &lt;abc123@example.com&gt;

기사 본문 ...
.                          <span class="cm"># 단독 점 = 기사 끝</span>
<b>QUIT</b>
205 Bye</code></pre>
<div class="tip"><code>HEAD n</code>(헤더만) · <code>BODY n</code>(본문만) · <code>NEXT</code>/<code>LAST</code>(현재 기사 이동) · <code>LIST</code>(그룹 목록). SMTP·POP처럼 <em>단독 점</em>으로 다중행 응답을 끝냅니다(RFC 3977).</div>`);

sl('예제','IRC 세션 — 채팅 프로토콜 raw', `
<h1><span class="no">6.18</span>telnet irc 6667 : IRC</h1>
<p>IRC는 접속 즉시 <code>NICK</code>·<code>USER</code>로 등록하고, 서버의 <strong>PING</strong>에 <strong>PONG</strong>으로 답해야 연결이 유지됩니다. 그 뒤 채널에 들어가 메시지를 보냅니다.</p>
<pre class="code"><code>$ <b>telnet irc.libera.chat 6667</b>
:server NOTICE * :*** Looking up your hostname...
<b>NICK mynick</b>
<b>USER myuser 0 * :My Real Name</b>
:server 001 mynick :Welcome to the IRC Network mynick!
:server 375 mynick :- Message of the Day -
...
PING :server.name          <span class="cm"># 서버가 살아있냐고 물음</span>
<b>PONG :server.name</b>            <span class="cm"># 반드시 되받아쳐야 함</span>
<b>JOIN #test</b>
:mynick!myuser@host JOIN :#test
:server 353 mynick = #test :mynick alice bob
<b>PRIVMSG #test :안녕하세요 telnet에서 인사드려요</b>
<b>QUIT :bye</b>
ERROR :Closing Link: mynick (Client Quit)</code></pre>
<div class="note">한 줄 = 한 명령, 끝은 CRLF. <code>PRIVMSG &lt;대상&gt; :&lt;메시지&gt;</code>에서 콜론 뒤는 공백 포함 자유 텍스트입니다(RFC 1459 / 2812).</div>`);

sl('예제','Redis — RESP 프로토콜을 손으로 ①', `
<h1><span class="no">6.19</span>telnet redis 6379 : inline 명령</h1>
<p>Redis는 두 가지 입력을 받습니다: <strong>인라인 명령</strong>(사람이 치기 쉬움)과 <strong>RESP 배열</strong>(클라이언트가 쓰는 정식). telnet에선 인라인이 편합니다.</p>
<pre class="code"><code>$ <b>telnet 127.0.0.1 6379</b>
Connected to 127.0.0.1.
<b>PING</b>
+PONG                    <span class="cm"># + = 단순 문자열(성공)</span>
<b>SET greeting hello</b>
+OK
<b>GET greeting</b>
$5                       <span class="cm"># $ = 벌크 문자열, 길이 5</span>
hello
<b>INCR counter</b>
:1                       <span class="cm"># : = 정수 응답</span>
<b>INCR counter</b>
:2
<b>GET missing</b>
$-1                      <span class="cm"># $-1 = nil(키 없음)</span>
<b>DEL greeting</b>
:1
<b>QUIT</b>
+OK</code></pre>
<div class="fx">RESP 응답 첫 바이트로 타입 판별: <code>+</code>단순문자열 · <code>-</code>에러 · <code>:</code>정수 · <code>$</code>벌크 · <code>*</code>배열.</div>`);

sl('예제','Redis — RESP 프로토콜을 손으로 ②', `
<h1><span class="no">6.20</span>정식 RESP 배열과 에러</h1>
<p>클라이언트 라이브러리가 실제로 보내는 형식은 <strong>RESP 배열</strong>입니다. <code>SET foo bar</code>는
"3개 원소 배열, 각 원소는 벌크 문자열"로 인코딩됩니다. telnet에서 <code>\\r\\n</code>은 Enter로 대신 칩니다.</p>
<pre class="code"><code><span class="cm"># 개념: SET foo bar 의 RESP 바이트</span>
*3\\r\\n$3\\r\\nSET\\r\\n$3\\r\\nfoo\\r\\n$3\\r\\nbar\\r\\n

<span class="cm"># telnet에서 한 토큰씩 Enter로 끊어 입력:</span>
<b>*3</b>
<b>$3</b>
<b>SET</b>
<b>$3</b>
<b>foo</b>
<b>$3</b>
<b>bar</b>
+OK                      <span class="cm"># 서버 응답</span>

<span class="cm"># 에러 응답 예</span>
<b>GET</b>                       <span class="cm"># 인자 부족</span>
-ERR wrong number of arguments for 'get' command
<b>INCR greeting</b>              <span class="cm"># 문자열에 INCR</span>
-ERR value is not an integer or out of range</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>접두</th><th>타입</th><th>예</th></tr></thead>
<tbody>
<tr><td><code>+</code></td><td>Simple String</td><td><code>+OK</code></td></tr>
<tr><td><code>-</code></td><td>Error</td><td><code>-ERR ...</code></td></tr>
<tr><td><code>:</code></td><td>Integer</td><td><code>:1000</code></td></tr>
<tr><td><code>$</code></td><td>Bulk String</td><td><code>$5\\r\\nhello</code></td></tr>
<tr><td><code>*</code></td><td>Array</td><td><code>*2\\r\\n...</code></td></tr>
</tbody></table></div>`);

sl('예제','Memcached — set/get/stats', `
<h1><span class="no">6.21</span>telnet memcached 11211</h1>
<p>Memcached의 텍스트 프로토콜. <code>set</code>은 <strong>명령 줄 + 데이터 줄</strong> 두 줄로 이뤄지며,
명령 줄의 마지막 숫자가 <em>바이트 길이</em>입니다(HTTP Content-Length와 같은 감각).</p>
<pre class="code"><code>$ <b>telnet 127.0.0.1 11211</b>
Connected to 127.0.0.1.
<b>set greeting 0 900 5</b>       <span class="cm"># key flags exptime bytes(=5)</span>
<b>hello</b>                     <span class="cm"># 정확히 5바이트 데이터 줄</span>
STORED
<b>get greeting</b>
VALUE greeting 0 5
hello
END
<b>add greeting 0 0 3</b>        <span class="cm"># 이미 있으면 실패</span>
<b>new</b>
NOT_STORED
<b>incr counter 1</b>
NOT_FOUND
<b>stats</b>
STAT pid 1234
STAT uptime 84213
STAT curr_items 42
STAT get_hits 1500
STAT get_misses 87
...
END
<b>quit</b>
Connection closed by foreign host.</code></pre>
<div class="tip"><code>flags</code>=클라이언트용 메타(0 무방), <code>exptime</code>=만료초(0=무기한), <code>bytes</code>=데이터 길이. <code>set</code>(무조건) vs <code>add</code>(없을 때만) vs <code>replace</code>(있을 때만).</div>`);

sl('예제','Gopher — 셀렉터 요청', `
<h1><span class="no">6.22</span>telnet gopher 70 : Gopher</h1>
<p>웹 이전의 문서 프로토콜. 접속 후 <strong>셀렉터</strong>(경로) 한 줄 + CRLF를 보내면 서버가 항목 목록을 돌려줍니다.
빈 셀렉터(그냥 Enter)는 루트 메뉴를 요청합니다. 각 줄은 <em>탭</em>으로 필드가 나뉩니다.</p>
<pre class="code"><code>$ <b>telnet gopher.floodgap.com 70</b>
Connected to gopher.floodgap.com.
<b>↵</b>                          <span class="cm"># 빈 셀렉터 = 루트 메뉴 요청</span>
iWelcome to Floodgap Systems' gopher   fake  (null)  0
1Floodgap Home  /home  gopher.floodgap.com  70
0About this server  /about.txt  gopher.floodgap.com  70
1Fun and Games  /fun  gopher.floodgap.com  70
.                          <span class="cm"># 단독 점 = 메뉴 끝</span>

$ <b>telnet gopher.floodgap.com 70</b>
<b>/about.txt</b>                 <span class="cm"># 특정 항목 셀렉터를 직접 요청</span>
This is the about text file ...
.</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>첫 글자(타입)</th><th>의미</th></tr></thead>
<tbody>
<tr><td><code>0</code></td><td>텍스트 파일</td></tr>
<tr><td><code>1</code></td><td>디렉터리(하위 메뉴)</td></tr>
<tr><td><code>i</code></td><td>정보 줄(표시용, 선택 불가)</td></tr>
<tr><td><code>7</code></td><td>검색 서버</td></tr>
</tbody></table></div>
<p class="mut small">필드 순서: <code>타입+표시명 &lt;TAB&gt; 셀렉터 &lt;TAB&gt; 호스트 &lt;TAB&gt; 포트</code> (RFC 1436).</p>`);

sl('예제','Finger — 사용자 정보 조회', `
<h1><span class="no">6.23</span>telnet host 79 : Finger</h1>
<p>고전 유닉스 서비스. 접속 후 <strong>사용자명 한 줄</strong>(빈 줄이면 전체 로그인 사용자)을 보내면 정보를 돌려줍니다.
역사적으로 정보 노출 때문에 대부분 꺼져 있지만, 프로토콜 학습엔 훌륭한 예제입니다.</p>
<pre class="code"><code>$ <b>telnet finger.example.com 79</b>
Connected to finger.example.com.
<b>alice</b>                      <span class="cm"># 조회할 사용자명 + Enter</span>
Login: alice           Name: Alice Kim
Directory: /home/alice Shell: /bin/bash
On since Wed Jul 22 08:03 (KST) on pts/0
No mail.
Plan:
  telnet 대백과 집필 중 📖
Connection closed by foreign host.</code></pre>

sl('예제','Whois — 도메인 등록 정보', `

   Updated Date: 2024-08-14T07:01:44Z

sl('예제','Daytime & Time — 시간 서비스', `
<h1><span class="no">6.25</span>포트 13(Daytime) / 37(Time)</h1>
<div class="cols">
<div>
<h3>Daytime (13) — 사람용</h3>
<pre class="code"><code>$ <b>telnet time.nist.gov 13</b>
Connected to time.nist.gov.
60883 25-07-22 09:14:07 00 0 0 517.6 UTC(NIST) *
Connection closed by foreign host.</code></pre>
<p class="mut small">접속만 하면 <strong>입력 없이</strong> 서버가 사람이 읽을 시각 한 줄을 보내고 끊습니다(RFC 867).</p>
</div>
<div>
<h3>Time (37) — 기계용</h3>
<pre class="code"><code>$ <b>telnet time.nist.gov 37</b>
Connected to time.nist.gov.
??/L?              <span class="cm"># 4바이트 이진값 → 깨져 보임</span>
Connection closed by foreign host.</code></pre>
<p class="mut small">37번은 <strong>32비트 이진 정수</strong>(1900-01-01부터의 초)를 보냅니다. telnet엔 <em>쓰레기처럼</em> 보이는 게 정상(RFC 868).</p>
</div>
</div>
<div class="fx">교훈: 텍스트 프로토콜(Daytime)은 telnet에 잘 맞지만, <strong>이진 프로토콜</strong>(Time·DNS·NTP)은 사람이 읽을 수 없어 telnet 부적합. 이진은 <code>nc</code>+<code>xxd</code>나 전용 도구로.</div>`);

sl('예제','Echo & Chargen — 진단용 서비스', `

<div>

sl('예제','QOTD — 오늘의 명언', `

sl('예제','배너 그래빙 — 서비스 핑거프린팅 ①', `
<h1><span class="no">6.28</span>SSH·FTP 배너 수집</h1>
<p>많은 서비스는 접속하자마자 <strong>버전 배너</strong>를 스스로 뱉습니다. telnet으로 포트에 붙기만 해도
소프트웨어·버전을 알 수 있어, 취약점 점검·자산 파악의 첫 단계로 쓰입니다.</p>
<div class="cols">
<div>
<h3>SSH (22)</h3>
<pre class="code"><code>$ <b>telnet host 22</b>
Connected to host.
SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6
   <span class="cm"># 프로토콜2.0 · OpenSSH 8.9 · 우분투 패키지</span>
Protocol mismatch.        <span class="cm"># 우리가 SSH가 아니라서 끊음</span></code></pre>
</div>
<div>
<h3>FTP (21)</h3>
<pre class="code"><code>$ <b>telnet host 21</b>
Connected to host.
220 (vsFTPd 3.0.5)        <span class="cm"># FTP 데몬 + 버전</span>
<b>USER anonymous</b>
331 Please specify the password.
<b>QUIT</b>
221 Goodbye.</code></pre>
</div>
</div>
<div class="fx">배너 = 서비스의 자기소개. <code>SSH-2.0-OpenSSH_8.9p1</code> 같은 문자열로 <strong>제품·버전</strong>을 특정하면 알려진 CVE 대조가 가능.</div>
<div class="note">스캔·핑거프린팅은 <strong>허가된 대상</strong>에만. 무단 대량 스캔은 법·정책 위반이 될 수 있습니다.</div>`);

sl('예제','배너 그래빙 — 서비스 핑거프린팅 ②', `

<div class="tw"><table class="tbl">
<thead><tr><th>포트</th><th>서비스</th><th>접속 시 나오는 대표 배너</th></tr></thead>
<tbody>
<tr><td>25</td><td>SMTP</td><td><code>220 mail.ex.com ESMTP Postfix (Ubuntu)</code></td></tr>
<tr><td>110</td><td>POP3</td><td><code>+OK Dovecot ready.</code></td></tr>
<tr><td>143</td><td>IMAP</td><td><code>* OK [CAPABILITY ...] Dovecot ready.</code></td></tr>
<tr><td>80</td><td>HTTP</td><td><code>Server: nginx/1.24.0</code> (HEAD 응답 헤더)</td></tr>
<tr><td>3306</td><td>MySQL</td><td><code>...5.7.42-log</code> (이진 handshake에 버전 문자열)</td></tr>
<tr><td>6379</td><td>Redis</td><td>배너 없음 → <code>INFO server</code>로 버전 조회</td></tr>
</tbody></table></div>

...</code></pre>

sl('예제','REST API를 손으로 디버깅 — JSON POST', `
<h1><span class="no">6.30</span>내 API에 JSON을 직접 던지기</h1>
<p>프레임워크·클라이언트 없이 <strong>정확한 바이트</strong>로 API를 때려 봅니다. JSON 본문은
<code>Content-Type: application/json</code> + 정확한 <code>Content-Length</code>가 생명입니다.</p>
<pre class="code"><code>$ <b>telnet api.local 8080</b>
Connected to api.local.
<b>POST /v1/users HTTP/1.1</b>
<b>Host: api.local</b>
<b>Content-Type: application/json</b>
<b>Authorization: Bearer eyJhbGci...토큰...</b>
<b>Content-Length: 36</b>
<b>Connection: close</b>
<b>↵</b>
<b>{"name":"alice","role":"admin"}</b>   <span class="cm"># 정확히 36바이트</span>

HTTP/1.1 201 Created
Content-Type: application/json
Location: /v1/users/42

{"id":42,"name":"alice","role":"admin"}</code></pre>
<div class="fx">바이트 세는 법: JSON 문자열의 <strong>따옴표·중괄호·콜론까지 전부</strong> 1바이트. 마지막 <code>}</code> 뒤에는 CRLF를 넣지 말 것(넣으면 길이+2).</div>
<div class="tip">401이 나오면 <code>Authorization</code> 확인, 400이면 본문 길이/JSON 문법, 415면 <code>Content-Type</code>. telnet은 <em>어떤 헤더를 정확히 보냈는지</em> 100% 통제하므로 미묘한 버그를 잡기 좋습니다.</div>`);

sl('예제','포트 열림 확인 — 연결성 테스트와 한계', `
<h1><span class="no">6.31</span>telnet host port : 살아있나?</h1>
<p>telnet의 가장 흔한 실무 용도: <strong>"이 포트가 열려 있나?"</strong> 빠른 확인.
TCP 3-way 핸드셰이크가 성공하면 <code>Connected</code>, 아니면 거부·타임아웃이 뜹니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>결과</th><th>의미</th></tr></thead>
<tbody>
<tr><td><code>Connected to host.</code></td><td><strong>열림</strong> — 무언가 listen 중, TCP 성립</td></tr>
<tr><td><code>Connection refused</code></td><td>포트에 아무도 없음(RST 즉시 반환) — 호스트는 살아있음</td></tr>
<tr><td>오래 멈춤 → <code>timed out</code></td><td>방화벽이 조용히 <em>DROP</em> 하거나 호스트 다운</td></tr>
<tr><td><code>No route to host</code></td><td>네트워크 경로 문제</td></tr>
</tbody></table></div>
<pre class="code"><code>$ <b>telnet db.internal 5432</b>
Trying 10.0.0.5...
Connected to db.internal.       <span class="cm"># ✅ Postgres 포트 열림</span>
Escape character is '^]'.
<span class="kbd">Ctrl+]</span> 후 <b>quit</b> 로 빠져나옴

$ <b>telnet db.internal 5433</b>
Trying 10.0.0.5...
telnet: connect to address 10.0.0.5: Connection refused</code></pre>
<div class="note">한계: telnet은 <strong>TCP만</strong> 봅니다. ①UDP 포트(DNS 53·NTP 123)는 확인 불가 → <code>nc -u</code>. ②"연결됨"은 TCP 성립일 뿐, 애플리케이션 정상 동작 보장은 아님. ③스크립트엔 타임아웃 있는 <code>nc -z -w3 host port</code>가 더 적합.</div>`);

sl('예제','로컬 개발 서버 — 앱이 보내는 진짜 바이트', `

Connected to localhost.
<b>GET /api/health HTTP/1.1</b>
<b>Host: localhost:3000</b>
<b>Connection: close</b>
<b>↵</b>

HTTP/1.1 200 OK
X-Powered-By: Express          <span class="cm"># 프레임워크가 자동 추가한 헤더</span>

Connection: close

{"status":"ok","db":"up"}</code></pre>
<div class="fx">디버깅 체크리스트: <strong>①</strong>상태코드가 기대와 같은가 <strong>②</strong>Content-Type이 정확한가 <strong>③</strong>불필요한 헤더(<code>X-Powered-By</code>)를 흘리는가 <strong>④</strong>Content-Length가 실제 본문과 맞는가 <strong>⑤</strong>CORS·캐시 헤더가 붙었는가.</div>
<div class="tip">CRLF 문제를 잡을 때 특히 유용: 응답 줄 끝이 <code>\\n</code>만이고 <code>\\r\\n</code>이 아니면 일부 클라이언트가 깨집니다. telnet raw로 보면 즉시 드러납니다.</div>`);

sl('예제','telnet의 한계와 nc·openssl로 넘어가기', `

<tr><td>스크립트 자동화</td><td>인터랙티브</td><td><code>curl</code> · <code>nc -w</code></td></tr>
</tbody></table></div>

<div class="tip">배운 감각은 그대로 이전됩니다: telnet에서 익힌 "요청줄 → 헤더 → 빈 줄" 구조를 <code>printf | nc</code>로 옮기면 <strong>재현 가능한 스크립트</strong>가 됩니다.</div>`);

sl('예제','예제 치트시트 — 한 줄 명령 모음', `

sl('예제','WebSocket 핸드셰이크를 telnet으로', `
<h1><span class="no">6.35</span>WebSocket 업그레이드 핸드셰이크 관찰</h1>
<p>WebSocket은 <strong>HTTP/1.1 Upgrade</strong>로 시작합니다. 핸드셰이크(101 응답)까지는 텍스트라 손으로 칠 수 있습니다.
그 이후 프레임은 <em>바이너리 마스킹</em>이라 telnet으로는 무리 — 핸드셰이크 검증까지가 실전 용도입니다.</p>
<pre class="code"><code>$ telnet echo.websocket.events 80
<b>GET / HTTP/1.1</b>
<b>Host: echo.websocket.events</b>
<b>Upgrade: websocket</b>
<b>Connection: Upgrade</b>
<b>Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==</b>
<b>Sec-WebSocket-Version: 13</b>
<b></b>
HTTP/1.1 101 Switching Protocols
Upgrade: websocket
Connection: Upgrade
Sec-WebSocket-Accept: s3pPLMBiTxaQ9kYGzzhZRbK+xOo=</code></pre>
<div class="tip"><code>Sec-WebSocket-Accept</code>는 <code>키 + 258EAFA5-E914-47DA-95CA-C5AB0DC85B11</code>의 SHA-1을 base64한 값입니다. RFC 6455 §4.2.2.</div>
<div class="note">101을 받은 뒤부터는 FIN/opcode/mask 비트가 있는 바이너리 프레임 — 실제 메시지 송수신은 라이브러리로.</div>`);

sl('예제','SMTP STARTTLS 흐름 확인 (587)', `
<h1><span class="no">6.36</span>SMTP STARTTLS 협상 관찰 (submission 587)</h1>
<p>메일 제출 포트 587은 평문으로 시작해 <code>STARTTLS</code>로 암호화로 전환합니다. telnet으로는 <em>협상 가능 여부</em>까지 확인하고, 실제 인증은 openssl로 넘어갑니다.</p>
<pre class="code"><code>$ telnet smtp.example.com 587
220 smtp.example.com ESMTP ready
<b>EHLO test.local</b>
250-smtp.example.com
250-PIPELINING
250-STARTTLS          <span class="cm"># ← 이 줄이 있으면 TLS 전환 가능</span>
250 AUTH LOGIN PLAIN
<b>STARTTLS</b>
220 2.0.0 Ready to start TLS
<span class="cm"># 여기서부터 평문 불가 → 연결을 openssl로 다시</span></code></pre>
<pre class="code"><code>$ openssl s_client -starttls smtp -connect smtp.example.com:587 -crlf
<span class="cm"># TLS 수립 후 EHLO/AUTH를 이어서 진행</span></code></pre>
<div class="note">평문 587에서 <code>AUTH</code>로 로그인하지 마세요 — 자격증명이 노출됩니다. 반드시 STARTTLS 후.</div>`);

sl('예제','HTTP CONNECT 프록시 터널', `
<h1><span class="no">6.37</span>HTTP 프록시로 터널 뚫기 — CONNECT 메서드</h1>
<p>포워드 프록시에게 <code>CONNECT host:port</code>를 보내면 임의 TCP 터널을 열어줍니다(HTTPS가 프록시를 통과하는 원리). telnet으로 프록시에 접속해 관찰할 수 있습니다.</p>
<pre class="code"><code>$ telnet proxy.example.com 8080
<b>CONNECT example.com:443 HTTP/1.1</b>
<b>Host: example.com:443</b>
<b></b>
HTTP/1.1 200 Connection established
<span class="cm"># 이제 이 소켓은 example.com:443으로 가는 raw 터널.
# 다음 바이트부터는 TLS ClientHello여야 하므로 telnet으론 여기까지.</span></code></pre>
<div class="tip">200을 받으면 프록시가 대상까지 TCP를 이어준 것. 실제로는 이 위에 TLS를 얹어 HTTPS를 씁니다(<code>openssl s_client -proxy ...</code>).</div>
<div class="note">권한 있는 프록시에서만 테스트하세요. 오픈 CONNECT 프록시는 남용 대상이 됩니다.</div>`);

sl('예제','HTTP/1.1 파이프라이닝 관찰', `
<h1><span class="no">6.38</span>HTTP/1.1 파이프라이닝을 눈으로</h1>
<p>HTTP/1.1은 응답을 기다리지 않고 여러 요청을 연달아 보낼 수 있습니다(파이프라이닝). telnet에 두 요청을 빠르게 붙여 넣으면 <strong>순서대로</strong> 두 응답이 돌아오는 것을 볼 수 있습니다.</p>
<pre class="code"><code>$ telnet example.com 80
<b>GET / HTTP/1.1</b>
<b>Host: example.com</b>
<b></b>
<b>GET /404-test HTTP/1.1</b>
<b>Host: example.com</b>
<b>Connection: close</b>
<b></b>
HTTP/1.1 200 OK
...첫 응답 본문...
HTTP/1.1 404 Not Found      <span class="cm"># 두 번째 응답이 이어서</span>
...</code></pre>
<div class="note">파이프라이닝은 HoL 블로킹 때문에 현대 브라우저에서 사실상 폐기됐고 HTTP/2 멀티플렉싱으로 대체됐습니다. 하지만 프로토콜 <em>이해</em>에는 좋은 실습입니다. 응답 경계는 <code>Content-Length</code>/청크로 구분됩니다.</div>`);

sl('예제','왜 HTTP/2·HTTP/3는 telnet 불가?', `
<h1><span class="no">6.39</span>손으로 못 치는 프로토콜 — HTTP/2·HTTP/3</h1>
<div class="cols">
<div>
<h3>HTTP/2</h3>
<ul>
<li><strong>바이너리 프레이밍</strong> — 텍스트가 아니라 길이 접두 프레임(HEADERS/DATA/SETTINGS…)</li>
<li>연결 프리페이스: <code>PRI * HTTP/2.0\\r\\n\\r\\nSM\\r\\n\\r\\n</code> 이후 SETTINGS 프레임 필수</li>
<li>헤더는 <strong>HPACK</strong>으로 압축 — 손으로 인코딩 불가</li>
<li>보통 ALPN(<code>h2</code>)로 TLS 위에서만 협상</li>
</ul>
</div>
<div>
<h3>HTTP/3</h3>
<ul>
<li><strong>QUIC(UDP)</strong> 기반 — telnet은 TCP 전용이라 시작조차 불가</li>
<li>TLS 1.3이 전송에 내장, QPACK 헤더 압축</li>
</ul>
<div class="fx">경계선: <strong>텍스트·TCP</strong>면 telnet으로 실습 가능, <strong>바이너리·압축·UDP</strong>면 도구(nghttp, curl --http2/--http3)가 필요.</div>
</div>
</div>
<pre class="code"><code>$ curl -v --http2 https://example.com     <span class="cm"># h2 협상 관찰</span>
$ nghttp -v https://example.com           <span class="cm"># 프레임 단위 디버깅</span></code></pre>`);

sl('예제','curl로 "telnet 수작업" 재현·자동화', `
<h1><span class="no">6.40</span>telnet 감각을 curl로 옮기기</h1>
<p>손으로 치던 것을 반복·자동화하려면 curl이 낫습니다. telnet에서 배운 요청 구조가 그대로 옵션에 대응됩니다.</p>
