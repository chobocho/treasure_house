sl('TypeScript','타입 붙은 옵션 상태 맵 (RFC 1143)', `
<h1><span class="no">7.18</span>옵션 상태 맵 — RFC 1143 Q-method</h1>
<p>협상 루프를 피하려면 각 옵션의 상태를 양방향(우리/상대)으로 추적해야 합니다.
RFC 1143은 6-상태 <strong>Q-method</strong>를 정의합니다. TS로 <code>Record</code>에 담습니다.</p>
<pre class="code"><code>const enum Q {
  No,               // 꺼짐
  Yes,              // 켜짐
  WantNo,           // 끄는 중
  WantNoOpposite,   // 끄는 중인데 다시 켜고 싶어짐
  WantYes,          // 켜는 중
  WantYesOpposite,  // 켜는 중인데 다시 끄고 싶어짐
}

interface OptionState {
  us:  Q;  // 우리 쪽 이 옵션 상태
  him: Q;  // 상대 쪽 이 옵션 상태
}

// 옵션 코드(0..255) → 상태
type OptionMap = Record&lt;number, OptionState&gt;;

const state: OptionMap = {};
function get(opt: number): OptionState {
  return (state[opt] ??= { us: Q.No, him: Q.No });
}</code></pre>
<div class="fx">Q-method의 핵심: <strong>이미 원하는 상태면 응답하지 않는다.</strong> 이 규칙이 무한 ACK 루프를 끊는다.</div>`);

sl('TypeScript','RFC 1143 수신 로직 — DO 처리', `
<h1><span class="no">7.19</span>RFC 1143 — 수신 DO 처리</h1>
<p>상대가 <code>DO opt</code>(우리에게 켜달라)를 보냈을 때의 상태 전이. <code>enabled(opt)</code>는
우리가 그 옵션을 지원하는지 판단하는 정책 함수입니다.</p>
<pre class="code"><code>function recvDo(opt: number, write: (b: Buffer) =&gt; void): void {
  const s = get(opt);
  switch (s.us) {
    case Q.No:
      if (weSupport(opt)) { s.us = Q.Yes; write(cmd(Cmd.WILL, opt)); }
      else write(cmd(Cmd.WONT, opt));
      break;
    case Q.Yes:
      break; // 이미 켜짐 → 무응답 (루프 방지)
    case Q.WantNo:
      s.us = Q.No; break;               // 에러였지만 상태만 정정
    case Q.WantNoOpposite:
      s.us = Q.Yes; break;
    case Q.WantYes:
      s.us = Q.Yes; break;              // 우리가 원하던 응답
    case Q.WantYesOpposite:
      s.us = Q.WantNo; write(cmd(Cmd.WONT, opt)); break;
  }
}

function cmd(verb: Cmd, opt: number): Buffer {
  return Buffer.from([Cmd.IAC, verb, opt]);
}</code></pre>
<div class="note"><code>recvWont</code>/<code>recvWill</code>/<code>recvDont</code>도 대칭으로 구현하면 완전한 상태기계가 됩니다. 전체 표는 RFC 1143 §7 참조.</div>`);

sl('TypeScript','EventEmitter 기반 API 설계', `
<h1><span class="no">7.20</span>EventEmitter 기반 클라이언트 API</h1>
<p>공개 API는 타입 안전한 이벤트가 핵심입니다. 이벤트 이름→핸들러 시그니처를
<strong>인터페이스</strong>로 선언하고, <code>on</code>/<code>emit</code>을 제네릭으로 오버라이드합니다.</p>
<pre class="code"><code>import { EventEmitter } from "node:events";

export interface TelnetEvents {
  data:      (text: string) =&gt; void;
  negotiate: (verb: Cmd, opt: number) =&gt; void;
  subneg:    (opt: number, payload: Buffer) =&gt; void;
  ready:     () =&gt; void;
  close:     () =&gt; void;
}

// 선언 병합으로 on/emit 에 타입을 붙인다
export interface TelnetClient {
  on&lt;E extends keyof TelnetEvents&gt;(e: E, l: TelnetEvents[E]): this;
  emit&lt;E extends keyof TelnetEvents&gt;(
    e: E, ...args: Parameters&lt;TelnetEvents[E]&gt;
  ): boolean;
}

export class TelnetClient extends EventEmitter {
  connect(host: string, port = 23): void { /* ... */ }
}

// 사용처는 완전 타입 검사됨
const c = new TelnetClient();
c.on("data", (text) =&gt; console.log(text));      // text: string ✔
c.on("negotiate", (verb, opt) =&gt; { /* ... */ }); // 튜플 타입 ✔</code></pre>`);

sl('TypeScript','Transform 스트림으로 IAC 벗기기', `
<h1><span class="no">7.21</span>Transform 스트림 — IAC 제거</h1>
<p>협상을 신경 쓸 필요 없이 <em>순수 데이터</em>만 원한다면, <code>Transform</code> 스트림으로
파이프라인에 끼워 IAC 시퀀스를 벗겨냅니다. 상태를 인스턴스에 들고 청크 경계를 넘깁니다.</p>
<pre class="code"><code>import { Transform, TransformCallback } from "node:stream";

export class StripIac extends Transform {
  private st: St = St.Data;

  override _transform(
    chunk: Buffer, _enc: BufferEncoding, cb: TransformCallback,
  ): void {
    const out: number[] = [];
    for (const b of chunk) {
      switch (this.st) {
        case St.Data:
          if (b === Cmd.IAC) this.st = St.Iac; else out.push(b);
          break;
        case St.Iac:
          if (b === Cmd.IAC) { out.push(0xff); this.st = St.Data; }      // 리터럴 FF
          else if (b === Cmd.SB) this.st = St.SbData;                    // SB..SE 통째 버림
          else if (b &gt;= Cmd.WILL &amp;&amp; b &lt;= Cmd.DONT) this.st = St.Verb;    // 옵션 1바이트 삼킴
          else this.st = St.Data;
          break;
        case St.Verb: this.st = St.Data; break;
        case St.SbData: if (b === Cmd.IAC) this.st = St.SbIac; break;
        case St.SbIac: this.st = (b === Cmd.SE) ? St.Data : St.SbData; break;
        default: this.st = St.Data;
      }
    }
    cb(null, Buffer.from(out));
  }
}

// 결선: 소켓 → IAC 제거 → 표준출력
sock.pipe(new StripIac()).pipe(process.stdout);</code></pre>`);

sl('TypeScript','Buffer 다루기의 함정', `
<h1><span class="no">7.22</span>Buffer 함정 — 청크 경계와 concat</h1>
<p>바이트 파싱에서 가장 흔한 버그는 <strong>시퀀스가 청크에 걸쳐 쪼개지는</strong> 경우입니다.
청크 단위로 <code>indexOf(0xFF)</code>만 보면 반쪽 IAC를 놓칩니다.</p>
<div class="cols"><div>
<h3>안티패턴</h3>
<pre class="code"><code>// ❌ 청크마다 독립 처리 — 경계에서 깨짐
sock.on("data", (c: Buffer) =&gt; {
  const i = c.indexOf(0xff);
  // IAC 가 이전 청크 끝, opt 가 이번 청크 첫 바이트면?
});</code></pre>
</div><div>
<h3>안전 패턴</h3>
<pre class="code"><code>// ✔ 상태기계(7.7) 또는 leftover 이어붙이기
let leftover = Buffer.alloc(0);
sock.on("data", (c: Buffer) =&gt; {
  const buf = Buffer.concat([leftover, c]);
  const { consumed, rest } = parse(buf);
  leftover = rest;  // 미완성 시퀀스를 다음으로
});</code></pre>
</div></div>
<div class="note">주의사항: <code>Buffer.concat</code>은 <strong>복사</strong>이므로 매 청크마다 큰 버퍼를 이어붙이면 O(n²)가 됩니다. 바이트 단위 상태기계(7.7)가 메모리·성능 모두 유리합니다. 또 <code>buf[i]</code>는 <code>number</code>지 <code>Buffer</code>가 아님을 기억하세요.</div>`);

sl('TypeScript','정리와 참고자료', `

<ul>
<li><code>node:net</code>이 원시 TCP를 주고, <code>Buffer</code>가 바이트를 준다 — TELNET엔 <code>latin1</code>/Buffer</li>

sl('혼합','로제타 ② IAC 전부 거절 협상', `
<h1><span class="no">M2</span>로제타 ② IAC 협상 전부 거절 (파서 스타일 비교)</h1>
<p>서버 협상을 모두 거절하는 최소 파서. <code>DO→WONT</code>, <code>WILL→DONT</code>로 되받아 데이터만 남깁니다. 세 언어의 <em>바이트 순회·분기</em> 스타일 차이를 보세요.</p>
<div class="cols">
<div><h3>🐍 Python</h3>
<pre class="code"><code>IAC, DO, DONT, WILL, WONT = <span class="nb">255</span>, <span class="nb">253</span>, <span class="nb">254</span>, <span class="nb">251</span>, <span class="nb">252</span>

<span class="kw">def</span> refuse_all(buf, sock):
    out, i = bytearray(), <span class="nb">0</span>
    <span class="kw">while</span> i &lt; len(buf):
        <span class="kw">if</span> buf[i] == IAC <span class="kw">and</span> i + <span class="nb">2</span> &lt; len(buf) + <span class="nb">1</span>:
            cmd, opt = buf[i+<span class="nb">1</span>], buf[i+<span class="nb">2</span>]
            <span class="kw">if</span> cmd == DO:   sock.sendall(<span class="kw">bytes</span>((IAC, WONT, opt)))
            <span class="kw">elif</span> cmd == WILL: sock.sendall(<span class="kw">bytes</span>((IAC, DONT, opt)))
            i += <span class="nb">3</span>
        <span class="kw">else</span>:
            out.append(buf[i]); i += <span class="nb">1</span>
    <span class="kw">return</span> <span class="kw">bytes</span>(out)</code></pre></div>
<div><h3>🐹 Go — <code>switch</code></h3>
<pre class="code"><code><span class="kw">for</span> i := <span class="nb">0</span>; i &lt; len(buf); {
    <span class="kw">if</span> buf[i] == IAC &amp;&amp; i+<span class="nb">2</span> &lt; len(buf) {
        cmd, opt := buf[i+<span class="nb">1</span>], buf[i+<span class="nb">2</span>]
        <span class="kw">switch</span> cmd {
        <span class="kw">case</span> DO:
            conn.Write([]<span class="kw">byte</span>{IAC, WONT, opt})
        <span class="kw">case</span> WILL:
            conn.Write([]<span class="kw">byte</span>{IAC, DONT, opt})
        }
        i += <span class="nb">3</span>
    } <span class="kw">else</span> {
        data = append(data, buf[i]); i++
    }
}</code></pre></div>
<div><h3>🟦 TypeScript</h3>
<pre class="code"><code><span class="kw">const</span> [IAC, DO, DONT, WILL, WONT] = [<span class="nb">255</span>,<span class="nb">253</span>,<span class="nb">254</span>,<span class="nb">251</span>,<span class="nb">252</span>];

<span class="kw">function</span> refuseAll(buf: Buffer, sock: net.Socket): Buffer {
  <span class="kw">const</span> out: <span class="kw">number</span>[] = [];
  <span class="kw">for</span> (<span class="kw">let</span> i = <span class="nb">0</span>; i &lt; buf.length; ) {
    <span class="kw">if</span> (buf[i] === IAC &amp;&amp; i + <span class="nb">2</span> &lt; buf.length) {
      <span class="kw">const</span> cmd = buf[i+<span class="nb">1</span>], opt = buf[i+<span class="nb">2</span>];
      <span class="kw">if</span> (cmd === DO)   sock.write(Buffer.from([IAC, WONT, opt]));
      <span class="kw">if</span> (cmd === WILL) sock.write(Buffer.from([IAC, DONT, opt]));
      i += <span class="nb">3</span>;
    } <span class="kw">else</span> { out.push(buf[i]); i++; }
  }
  <span class="kw">return</span> Buffer.from(out);
}</code></pre></div>
</div>
<div class="note">실전에서는 <code>SB … SE</code>(서브 협상)와 경계에 걸친 <code>IAC</code>(버퍼가 명령 중간에서 끊김)를 상태기계로 처리해야 합니다. 위는 개념 골격입니다 → RFC 1143 Q-method 권장.</div>`);

sl('혼합','로제타 ③ NAWS 16비트 패킹', `
<h1><span class="no">M3</span>로제타 ③ NAWS 창 크기 16비트 패킹</h1>
<p>NAWS(RFC 1073)는 <code>IAC SB 31 width(16bit) height(16bit) IAC SE</code>로 단말 크기를 <strong>빅엔디안 2바이트</strong>씩 전송합니다.
바이트 조립 API가 언어마다 다릅니다: <code>struct.pack</code> vs <code>encoding/binary</code> vs <code>Buffer.writeUInt16BE</code>.</p>
<div class="cols">
<div><h3>🐍 <code>struct.pack</code></h3>
<pre class="code"><code><span class="kw">import</span> struct
cols, rows = <span class="nb">80</span>, <span class="nb">24</span>
<span class="cm"># !=빅엔디안, H=uint16</span>
sb = struct.pack(<span class="st">"!BBBHHBB"</span>,
    <span class="nb">255</span>, <span class="nb">250</span>, <span class="nb">31</span>,   <span class="cm"># IAC SB NAWS</span>
    cols, rows,       <span class="cm"># 16b 폭·높이</span>
    <span class="nb">255</span>, <span class="nb">240</span>)       <span class="cm"># IAC SE</span>
<span class="cm"># b'\\xff\\xfa\\x1f\\x00P\\x00\\x18\\xff\\xf0'</span></code></pre></div>
<div><h3>🐹 <code>encoding/binary</code></h3>
<pre class="code"><code><span class="kw">import</span> (<span class="st">"bytes"</span>; <span class="st">"encoding/binary"</span>)

buf := <span class="kw">new</span>(bytes.Buffer)
buf.Write([]<span class="kw">byte</span>{<span class="nb">255</span>, <span class="nb">250</span>, <span class="nb">31</span>})
binary.Write(buf, binary.BigEndian, <span class="kw">uint16</span>(cols))
binary.Write(buf, binary.BigEndian, <span class="kw">uint16</span>(rows))
buf.Write([]<span class="kw">byte</span>{<span class="nb">255</span>, <span class="nb">240</span>})
sb := buf.Bytes()</code></pre></div>
<div><h3>🟦 <code>Buffer.writeUInt16BE</code></h3>
<pre class="code"><code><span class="kw">const</span> b = Buffer.alloc(<span class="nb">9</span>);
b[<span class="nb">0</span>]=<span class="nb">255</span>; b[<span class="nb">1</span>]=<span class="nb">250</span>; b[<span class="nb">2</span>]=<span class="nb">31</span>;   <span class="cm">// IAC SB NAWS</span>
b.writeUInt16BE(cols, <span class="nb">3</span>);          <span class="cm">// 폭 → offset 3</span>
b.writeUInt16BE(rows, <span class="nb">5</span>);          <span class="cm">// 높이 → offset 5</span>
b[<span class="nb">7</span>]=<span class="nb">255</span>; b[<span class="nb">8</span>]=<span class="nb">240</span>;          <span class="cm">// IAC SE</span></code></pre></div>
</div>
<div class="note"><strong>함정</strong>: 폭·높이 바이트 중 <code>0xFF</code>(255)가 나오면 데이터 안의 IAC와 헷갈리므로 <code>0xFF 0xFF</code>로 <em>이스케이프</em>해야 합니다(예: 폭 255·511). 위 세 스니펫은 이 처리를 생략한 최소형입니다.</div>`);

<span class="kw">print</span>(info[<span class="st">"banner"</span>], info[<span class="st">"opts"</span>])</code></pre>
<p class="mut small">Go는 협상을 빠르게 처리하고 결과를 JSON 한 줄로 stdout에 출력.</p></div>

  (err, stdout) =&gt; {
    <span class="kw">if</span> (err) <span class="kw">throw</span> err;
    <span class="kw">const</span> info = JSON.parse(stdout);
    console.log(info.model, info.uptime);
  });</code></pre>
<p class="mut small">웹 백엔드(Node)가 파이썬 자동화 자산을 그대로 재활용.</p></div>

sl('혼합','공유 와이어 포맷 — 상수 테이블', `

sl('혼합','raw TELNET을 넘어설 때 — gRPC / FFI', `

<p>세 언어를 계속 붙이다 보면 <em>손으로 짠 바이트 파서</em>가 부담이 됩니다. 구조화된 RPC나 공유 라이브러리로 승격할 시점의 신호와 선택지.</p>

<span class="kw">service</span> TelnetGate {
  <span class="cm">// 양방향 스트림으로 세션 프록시</span>

      <span class="kw">returns</span> (<span class="kw">stream</span> ServerMsg);
}
<span class="kw">message</span> ClientMsg { <span class="kw">bytes</span> data = <span class="nb">1</span>; }
<span class="kw">message</span> ServerMsg {

</div>

sl('혼합','성능 노트 — 고루틴 vs asyncio vs 이벤트 루프', `
<h1><span class="no">M10</span>다수 커넥션 성능: 세 동시성 모델</h1>
<p>수천 개의 유휴에 가까운 TELNET 세션을 다룰 때의 <em>대략적</em> 특성. 정확한 수치는 워크로드·커널·하드웨어에 따라 다르니 <strong>반드시 직접 벤치</strong>하세요.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>모델</th><th>동시성 단위</th><th>블로킹 IO</th><th>멀티코어</th><th>대략 감각</th></tr></thead>
<tbody>
<tr><td>🐹 Go 고루틴</td><td>고루틴(~2KB 스택)</td><td>스케줄러가 자동 흡수(그냥 블로킹 코드처럼 작성)</td><td>기본 병렬(<code>GOMAXPROCS</code>)</td><td>수만 커넥션 무난, 코드 단순</td></tr>
<tr><td>🐍 Python asyncio</td><td>코루틴(<code>await</code>)</td><td><em>반드시</em> async 라이브러리 사용(<code>telnetlib3</code>)</td><td>단일 코어(GIL) → 프로세스로 확장</td><td>IO 바운드 OK, CPU는 약점</td></tr>
<tr><td>🟦 Node 이벤트 루프</td><td>콜백/Promise</td><td>libuv 논블로킹, CPU 작업은 루프 블록</td><td>단일 스레드 → <code>cluster</code>/워커로 확장</td><td>IO 바운드 강함, CPU는 오프로드</td></tr>
</tbody></table></div>
<div class="cols">
<div><div class="tip"><strong>공통 진실</strong>: TELNET 세션 대부분은 <em>IO 바운드</em>(대기 위주)라, 세 모델 다 커넥션당 스레드보다 훨씬 잘 확장됩니다.</div></div>

</div>
<p class="mut small">규모가 진짜 크면(수십만+) epoll/kqueue 튜닝, 파일 디스크립터 한도(<code>ulimit -n</code>), 백프레셔가 언어 선택보다 더 중요해집니다.</p>`);

sl('혼합','언어 교차 통합 테스트', `

<p>강력한 검증 패턴: <strong>한 언어의 서버</strong>를 띄우고 <strong>다른 언어의 클라이언트</strong>로 두드립니다. 구현 편향을 걸러내는 진짜 상호운용 테스트죠.</p>

<pre class="code"><code><span class="kw">import</span> socket, os

<span class="kw">def</span> test_refuses_echo():

    s = socket.create_connection((host, <span class="kw">int</span>(port)))
    s.sendall(<span class="st">b"\\xff\\xfb\\x01"</span>)   <span class="cm"># WILL ECHO</span>

sl('혼합','언어마다 다른 얼굴의 흔한 버그', `
<h1><span class="no">M12</span>같은 버그, 다른 얼굴</h1>
<p>동일한 프로토콜 실수가 언어별로 <em>다른 증상·다른 API</em>로 나타납니다. 혼합 팀이 특히 자주 밟는 지뢰.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>버그</th><th>🐍 Python</th><th>🐹 Go</th><th>🟦 TypeScript</th></tr></thead>
<tbody>
<tr><td>CRLF 누락</td><td><code>\\n</code>만 보냄 → 서버 무응답. NVT는 <code>\\r\\n</code> 필수</td><td><code>Fprintln</code>이 <code>\\n</code>만 붙임</td><td>템플릿에 <code>\\n</code> 습관 → 명시적 <code>\\r\\n</code></td></tr>
<tr><td>bytes vs str</td><td><code>str</code>↔<code>bytes</code> 혼동, <code>TypeError</code>·인코딩 예외</td><td><code>string</code>/<code>[]byte</code>는 명시적, 실수 적음</td><td><code>string</code>과 <code>Buffer</code> 혼용, 자동 UTF-8 변환 함정</td></tr>
<tr><td>부분 읽기(partial)</td><td><code>recv(n)</code>이 n보다 적게 반환</td><td><code>Read</code>가 짧게 반환 → <code>io.ReadFull</code> 필요</td><td><code>data</code> 이벤트가 <strong>조각나 도착</strong> → 재조립 버퍼 필수</td></tr>
<tr><td>블로킹 IO</td><td>동기 <code>recv</code>가 이벤트루프 밖에선 OK, async 안에선 금지</td><td>고루틴이면 그냥 블로킹해도 됨</td><td>동기 블로킹 자체가 없음(전부 콜백)</td></tr>
<tr><td>IAC 0xFF 미이스케이프</td><td>데이터 <code>b'\\xff'</code>를 그대로 전송 → 명령 오인</td><td><code>bytes.ReplaceAll</code> 누락</td><td><code>Buffer</code> 내 <code>0xFF</code> 방치</td></tr>
</tbody></table></div>
<div class="note"><strong>부분 읽기</strong>가 최다 버그: TCP는 메시지 경계를 보존하지 않습니다. 세 언어 모두 "<code>IAC SB … IAC SE</code>가 한 번에 온다"고 가정하면 언젠가 깨집니다. 항상 <em>누적 버퍼 + 상태기계</em>로 파싱하세요.</div>`);

sl('보안','왜 TELNET은 안전하지 않은가', `
<h1><span class="no">8.1</span>왜 TELNET은 안전하지 않은가</h1>
<div class="fx big">TELNET은 <strong>평문</strong>이다. 로그인 아이디·비밀번호·명령·출력 모두가 회선 위를 <em>암호화 없이</em> 흐른다.</div>
<p>1969년 설계 당시의 위협 모델은 "신뢰된 학술망"이었다. 오늘날의 인터넷에는 이 가정이 전혀 성립하지 않는다. TELNET에는 현대 보안 프로토콜이 갖춘 세 가지가 근본적으로 빠져 있다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>보안 속성</th><th>TELNET</th><th>영향</th></tr></thead>
<tbody>
<tr><td>기밀성(Confidentiality)</td><td class="bad">없음 — 평문</td><td>비밀번호·데이터가 스니핑에 그대로 노출</td></tr>
<tr><td>무결성(Integrity)</td><td class="bad">없음 — MAC 미보호</td><td>중간자가 바이트를 삽입·변조 가능</td></tr>
<tr><td>서버 인증(Server auth)</td><td class="bad">없음</td><td>접속 대상이 진짜 서버인지 검증 불가 → 위장 서버</td></tr>
</tbody></table></div>
<div class="note"><strong>핵심</strong>: TELNET의 취약성은 구현 버그가 아니라 <em>프로토콜 설계 자체</em>에서 온다. 패치로 고칠 수 없고, 대체(SSH)만이 답이다.</div>
<p class="mut small">이 장은 방어·교육 목적이다. 공격 실습이 아니라 <strong>왜 위험한지</strong>와 <strong>어떻게 막는지</strong>를 다룬다.</p>`);

sl('보안','수동적 스니핑: 비밀번호가 그대로 보인다', `
<h1><span class="no">8.2</span>수동적 스니핑 — 비밀번호가 회선에 그대로</h1>
<p>TELNET 세션은 문자 단위(character-at-a-time)로 각 키 입력을 평문 바이트로 전송한다. 같은 브로드캐스트 도메인·스위치 미러 포트·경유 라우터 어디서든 트래픽을 관찰하면 자격증명이 그대로 재구성된다. 아래는 <em>자신이 소유·관리하는 네트워크</em>를 진단할 때 쓰는 캡처 필터 예시다.</p>
<pre class="code"><code><span class="cm"># 23번 포트 트래픽만 캡처 (읽기 전용 관찰)</span>
sudo tcpdump -i eth0 -A <span class="st">'tcp port 23'</span>

<span class="cm"># Wireshark 표시 필터: TELNET 데이터만</span>
telnet

<span class="cm"># Wireshark: Follow &gt; TCP Stream 으로 세션 전체를 텍스트로 재조립</span></code></pre>
<div class="note"><strong>관찰 vs 공격</strong>: 위는 <em>필터</em>일 뿐이며 어떤 세션도 가로채지 않는다. 타인의 트래픽을 캡처하는 행위는 권한이 있는 시스템에서만 합법이다(→ 8.13 책임 있는 사용).</div>
<div class="tip">교훈: 스위치 환경이라도 ARP·포트 미러·탭·업스트림 장비 등 관찰 지점은 많다. "스위치니까 안전"은 거짓이다.</div>`);

sl('보안','중간자 공격과 세션 하이재킹 위험', `
<h1><span class="no">8.3</span>MITM · 세션 하이재킹 — 인밴드 제어의 대가</h1>
<p>TELNET은 제어(IAC 협상)와 데이터를 <strong>같은 TCP 스트림</strong>에 섞는 인밴드(in-band) 구조다. 무결성 보호가 없으므로, 경로상의 능동적 중간자는 이론적으로 다음을 할 수 있다.</p>
<div class="cols">
<div>
<h3>기밀성 파괴</h3>
<ul>
<li>평문이므로 별도 복호화 없이 전 세션 열람</li>
<li>비밀번호·토큰·명령·출력 전부</li>
</ul>
<h3>무결성 파괴</h3>
<ul>
<li>TCP 시퀀스 번호를 알면 <em>세그먼트 삽입</em> 개념적으로 가능</li>
<li>사용자 명령 뒤에 추가 명령 바이트 주입</li>
</ul>
</div>
<div>
<div class="note"><strong>TCP 인젝션 개념</strong>: 공격자가 진행 중 연결의 시퀀스 번호를 예측/관찰하면, 위조된 세그먼트로 데이터를 밀어넣을 수 있다. SSH·TLS는 <em>MAC/AEAD</em>로 이런 변조를 탐지·거부한다. TELNET에는 그 방어선이 없다.</div>
<div class="fx">방어: 링크 자체를 암호화(SSH/VPN/TLS)하여 관찰·주입 모두를 무력화한다. TELNET 단독으로는 하이재킹을 막을 수단이 프로토콜에 존재하지 않는다.</div>
</div>
</div>
<p class="mut small">여기서는 어떤 공격 도구·절차도 제공하지 않는다. 요점은 <strong>인밴드+무결성 부재 = 구조적 위험</strong>이라는 설계 교훈이다.</p>`);

sl('보안','옵션 채널이라는 공격 표면 — ENVIRON 주입', `
<h1><span class="no">8.4</span>NVT 옵션 채널 — 환경변수 주입 표면</h1>
<p>TELNET 옵션 협상은 강력하지만 <em>신뢰 경계</em>를 넓힌다. 대표 사례가 <code>NEW-ENVIRON</code>(39, RFC 1572) / 구 <code>ENVIRON</code>(36)이다. 클라이언트가 서버로 임의의 환경변수를 전달할 수 있는데, 서버가 이를 무비판적으로 로그인 셸 환경에 적용하면 위험하다.</p>
<pre class="code"><code><span class="cm"># NEW-ENVIRON 서브협상 형태 (개념)</span>
IAC SB NEW-ENVIRON IS VAR "..." VALUE "..." IAC SE
<span class="cm">  옵션=39  IS=0  VAR=0  VALUE=1</span></code></pre>
<div class="note"><strong>역사적 교훈 — LD_PRELOAD류 주입</strong>: 과거 일부 <code>telnetd</code>/<code>login</code> 조합은 클라이언트가 보낸 <code>LD_PRELOAD</code>, <code>LD_LIBRARY_PATH</code>, <code>IFS</code> 같은 변수를 필터링 없이 넘겨, 인증 전 임의 라이브러리 로드로 이어질 수 있었다. 그래서 현대 <code>login(1)</code>은 <em>안전하지 않은 환경변수 화이트리스트/블랙리스트</em>를 강제한다.</div>
<div class="tip">방어 원칙: 서버는 클라이언트가 주는 옵션 데이터를 <strong>신뢰 입력이 아닌 공격자 입력</strong>으로 다뤄야 한다 — 화이트리스트, 길이·문자 검증, 인증 전 환경 적용 금지.</div>`);

sl('보안','역사적 telnetd 취약점 (CVE 개요)', `
<h1><span class="no">8.5</span>역사적 telnetd 취약점 — 고수준 개요</h1>
<p>구현체(<code>telnetd</code>)에도 심각한 메모리 취약점이 반복되었다. 아래는 <em>고수준 참고용</em> 목록이며, 익스플로잇 세부는 다루지 않는다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>CVE</th><th>연도</th><th>구성요소</th><th>유형(고수준)</th></tr></thead>
<tbody>
<tr><td><code>CVE-2011-4862</code></td><td>2011</td><td>BSD/Linux telnetd encrypt</td><td>encrypt <em>keyid</em> 처리 버퍼 오버플로 → 원격 코드실행 위험</td></tr>
<tr><td><code>CVE-2020-10188</code></td><td>2020</td><td>utelnetd/inetutils telnetd</td><td>netclear/입력 버퍼 오버플로</td></tr>
<tr><td><code>CVE-2005-0468</code></td><td>2005</td><td>BSD telnet client</td><td>slc/env 처리 클라이언트 측 오버플로</td></tr>
<tr><td><code>CVE-2007-0956</code></td><td>2007</td><td>MIT Kerberos telnetd</td><td>인증 우회</td></tr>
</tbody></table></div>
<div class="note"><strong>패턴</strong>: 대부분 <em>인증 이전</em> 코드 경로(암호화 협상·옵션 파싱)에서 발생했다 — 즉 자격증명이 없어도 트리거 가능. 인터넷에 열린 <code>telnetd</code>는 이런 pre-auth 표면을 그대로 노출한다.</div>
<div class="tip">교훈: 서비스를 끄는 것이 가장 확실한 완화다. 쓰지 않는 데몬은 패치보다 <strong>제거</strong>가 우선.</div>`);

sl('보안','Mirai 봇넷(2016) — 기본 텔넷 자격증명의 재앙', `
<h1><span class="no">8.6</span>Mirai 봇넷(2016) — IoT 기본 텔넷 자격증명</h1>
<p>2016년 <strong>Mirai</strong> 봇넷은 수십만 대의 IoT 기기(IP 카메라·DVR·라우터)를 감염시켜 사상 최대급 DDoS(예: KrebsOnSecurity, OVH, Dyn)를 일으켰다. 공격 벡터는 정교하지 않았다 — <em>인터넷에 열린 23/2323 포트 + 공장 기본 텔넷 계정</em>.</p>
<div class="cols">
<div>
<h3>무엇이 문제였나</h3>
<ul>
<li>기기들이 텔넷을 켠 채로 출시</li>
<li><code>root/xc3511</code>, <code>admin/admin</code> 등 하드코딩·기본 비밀번호</li>
<li>사용자가 변경할 수 없거나 변경을 안 함</li>
<li>포트 23이 방화벽 없이 공개</li>
</ul>
</div>
<div>
<h3>배운 교훈</h3>
<ul>
<li>기본 자격증명 = 공개 자격증명</li>
<li>관리 인터페이스는 <strong>기본 차단</strong>이어야</li>
<li>텔넷은 IoT에서 완전히 퇴출 대상</li>
<li>제조사 책임: 안전한 출고 기본값</li>
</ul>
</div>
</div>
<div class="note"><strong>여파</strong>: Mirai 소스가 공개되며 수많은 변종이 파생됐다. 오늘날에도 스캐너는 열린 텔넷+약한 자격증명을 끊임없이 노린다. IoT를 배치하면 <em>수 분 내</em> 스캔·로그인 시도가 온다고 가정하라.</div>`);

sl('보안','포트 23은 왜 방화벽으로 막아야 하는가', `
<h1><span class="no">8.7</span>포트 23을 막아라 — 스캐닝의 현실</h1>
<p>인터넷 전수 스캔은 일상이다. <strong>Shodan</strong>·<strong>Censys</strong> 같은 서비스는 열린 포트와 배너를 상시 색인한다. 텔넷 배너는 기기 종류·펌웨어·심지어 로그인 프롬프트까지 그대로 드러낸다 — 공격자에게 무료 정찰 정보다.</p>
<div class="fx big">공개 인터넷에 노출된 포트 23은 <strong>"언제 뚫리나"의 문제</strong>이지 "뚫리나"의 문제가 아니다.</div>
<h3>최소 방어 자세</h3>
<ul>
<li><strong>기본 차단(deny-by-default)</strong>: 인바운드 23/2323을 방화벽에서 드롭</li>
<li>관리 접근은 SSH + 특정 관리 서브넷 ACL로 한정</li>
<li>불가피하면 VPN/배스천 <em>안쪽</em>에서만 도달 가능하게</li>
<li>주기적으로 자기 IP 범위를 스캔해 <em>실수로 열린</em> 텔넷을 찾아 닫기</li>
</ul>
<pre class="code"><code><span class="cm"># 예: 인바운드 텔넷 드롭 (nftables 개념 예시, 관리 네트워크에서)</span>
nft add rule inet filter input tcp dport { 23, 2323 } drop</code></pre>
<div class="note">스캔은 <em>자신이 소유·관리하는</em> 자산에 한해 수행하라. 제3자 스캐닝은 정책·법률 문제가 될 수 있다.</div>`);

sl('보안','올바른 대체재: SSH — 기능 비교표', `
<h1><span class="no">8.8</span>올바른 대체재 — SSH vs TELNET</h1>
<p>대화형 원격 로그인의 표준 답은 <strong>SSH</strong>(Secure Shell, RFC 4251~4254)다. 텔넷이 주던 편의(대화형 셸·포워딩)를 <em>기밀성·무결성·서버 인증</em>과 함께 제공한다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>속성</th><th>TELNET</th><th>SSH</th></tr></thead>
<tbody>
<tr><td>암호화</td><td class="bad">없음(평문)</td><td class="good">AEAD(예: chacha20-poly1305, aes-gcm)</td></tr>
<tr><td>무결성(MAC)</td><td class="bad">없음</td><td class="good">있음 — 변조 탐지</td></tr>
<tr><td>서버 인증</td><td class="bad">없음</td><td class="good">호스트키(known_hosts)로 검증</td></tr>
<tr><td>사용자 인증</td><td>평문 비밀번호</td><td class="good">공개키·비밀번호·MFA·GSSAPI</td></tr>
<tr><td>포트 포워딩</td><td class="bad">없음</td><td class="good"><code>-L</code>/<code>-R</code>/<code>-D</code> 터널</td></tr>
<tr><td>파일 전송</td><td class="bad">별도 프로토콜</td><td class="good">scp/sftp 내장</td></tr>
<tr><td>기본 포트</td><td>23</td><td>22</td></tr>
</tbody></table></div>
<div class="tip">이전은 대개 무통증이다: <code>telnet host</code> → <code>ssh user@host</code>. 대부분의 스크립트·자동화는 SSH 키 인증으로 더 견고해진다.</div>`);

sl('보안','꼭 telnet을 써야 한다면 — 안전한 터널로 감싸라', `
<h1><span class="no">8.9</span>불가피하다면 — 암호화 터널로 감싸기</h1>
<p>레거시 장비 등으로 텔넷 자체를 없앨 수 없을 때는, <strong>텔넷 평문을 절대 노출망에 흘리지 말고</strong> 암호화 계층 안으로 넣는다. 세 가지 정석 접근:</p>
<div class="tw"><table class="tbl">
<thead><tr><th>방법</th><th>동작</th><th>비고</th></tr></thead>
<tbody>
<tr><td>VPN / IPsec</td><td>네트워크 계층 전체를 암호화</td><td>여러 서비스 일괄 보호, 배치 규모에 적합</td></tr>
<tr><td>SSH 로컬 포워딩</td><td><code>ssh -L</code>로 텔넷 포트를 터널링</td><td>임시·개별 접속에 간편</td></tr>
<tr><td>stunnel / TLS 래퍼</td><td>텔넷을 TLS 소켓으로 감쌈</td><td>양단에 stunnel 필요</td></tr>
</tbody></table></div>
<pre class="code"><code><span class="cm"># SSH 로컬 포워딩: 로컬 2323 → (SSH 암호화) → 배스천 → 레거시:23</span>
ssh -N -L 2323:legacy-device.internal:23 user@bastion.example.com

<span class="cm"># 그 다음 로컬 터널 끝점으로 접속 (평문은 loopback 안에서만)</span>
telnet 127.0.0.1 2323</code></pre>
<div class="note"><strong>주의</strong>: 터널은 <em>전송 구간</em>만 보호한다. 배스천~레거시 사이 최종 홉이 평문이면 그 구간은 관리 서브넷으로 격리하라. 최종 홉까지 평문이 한 뼘도 노출망을 지나지 않게 하는 것이 목표.</div>`);

sl('보안','Telnet-over-TLS와 인증·암호화 옵션 (RFC 2941/2946)', `
<h1><span class="no">8.10</span>Telnet 인증·암호화 옵션 — RFC 2941/2946</h1>
<p>TELNET에도 <em>협상 기반</em> 보안 확장이 표준화되어 있었다. 하지만 실전 배치는 극히 드물고 상호운용성·구현 취약점 문제로 사실상 SSH에 밀렸다.</p>
<ul class="links">
<li><span class="k doc">RFC</span> <a href="https://www.rfc-editor.org/rfc/rfc2941" target="_blank" rel="noopener">RFC 2941 — Telnet Authentication Option</a> <span class="mut small">— AUTHENTICATION(37) 옵션 프레임워크</span></li>
<li><span class="k doc">RFC</span> <a href="https://www.rfc-editor.org/rfc/rfc2946" target="_blank" rel="noopener">RFC 2946 — Telnet Data Encryption Option</a> <span class="mut small">— ENCRYPT(38) 옵션</span></li>
<li><span class="k doc">RFC</span> <a href="https://www.rfc-editor.org/rfc/rfc2942" target="_blank" rel="noopener">RFC 2942 — Telnet Kerberos 5 Authentication</a></li>
</ul>
<div class="tw"><table class="tbl">
<thead><tr><th>옵션</th><th>코드</th><th>역할</th></tr></thead>
<tbody>
<tr><td>AUTHENTICATION</td><td>37</td><td>Kerberos/SRP 등으로 상호 인증</td></tr>
<tr><td>ENCRYPT</td><td>38</td><td>세션 데이터 암호화(DES/CAST 등, 현대 기준 취약)</td></tr>
</tbody></table></div>

sl('보안','네트워크에서 텔넷 사용 탐지 — IDS·NetFlow', `

sl('도구','도구 지형도: 무엇을 언제 쓰나', `
<h1><span class="no">T1</span>파워유저 도구 지형도</h1>
<p><code>telnet</code>은 시작일 뿐입니다. 원시 TCP를 두드리고, TLS를 씌우고, 세션을 자동화·기록·분석하는 현대 도구 상자를 한눈에 봅니다.</p>

<tr><td>TLS 텔넷</td><td><code>openssl s_client</code>·<code>ncat --ssl</code>·<code>socat OPENSSL</code></td><td>HTTPS·SMTPS를 손으로 말하기</td></tr>
<tr><td>자동화</td><td><code>expect</code>·bash 스크립트</td><td>장비 설정·백업 자동화</td></tr>
<tr><td>관찰</td><td><code>tcpdump</code>·Wireshark/<code>tshark</code></td><td>바이트·협상 캡처 분석</td></tr>
<tr><td>세션 관리</td><td><code>tmux</code>/<code>screen</code>·<code>script</code>·<code>rlwrap</code></td><td>유지·로깅·편집</td></tr>
<tr><td>후예</td><td>MUD 클라 <code>tintin++</code>·<code>mudlet</code>·BBS 클라</td><td>텔넷 위 게임·게시판</td></tr>

sl('도구','telnet 클라이언트 플래그 총정리', `
<h1><span class="no">T2</span>telnet 클라이언트 플래그 레퍼런스</h1>
<p>BSD/inetutils <code>telnet</code>의 실전 플래그. 대괄호는 선택 인자입니다.</p>
<pre class="code"><code>telnet [-8ELdr] [-e escapechar] [-l user] [-a] [-b addr] [host [port]]

  <span class="kw">-e</span> c    이스케이프 문자를 c로 지정 (기본 ^], 끄려면 -e '')
  <span class="kw">-l</span> user 원격 로그인 사용자명 전달 (NEW-ENVIRON USER 변수)
  <span class="kw">-a</span>      자동 로그인: USER 환경변수를 서버로 전송
  <span class="kw">-E</span>      이스케이프 문자 기능 완전 비활성 (Ctrl+] 무력화)
  <span class="kw">-8</span>      8비트 경로 요청 (BINARY 옵션 협상, 국제 문자용)
  <span class="kw">-b</span> addr 로컬 바인드 주소 지정 (멀티홈 호스트)
  <span class="kw">-r</span>      rlogin 유사 인터페이스
  <span class="kw">-d</span>      소켓 SO_DEBUG 활성</code></pre>
<pre class="code"><code><span class="cm"># 실전 예</span>
telnet -e '^X' -l admin 192.0.2.10 23      <span class="cm"># 이스케이프를 Ctrl+X로</span>
telnet -8 bbs.example.net                   <span class="cm"># 8비트 BBS</span>
telnet -E route-server.example.net          <span class="cm"># BGP 라우트서버, 탈출키 무력화</span></code></pre>
<div class="note"><code>-E</code>는 서버에 <code>^]</code> 같은 바이트를 <em>그대로</em> 흘려보내야 할 때 필수. 대신 <span class="kbd">Ctrl+]</span> 명령 모드를 못 쓰니 <span class="kbd">Ctrl+D</span>나 서버 측 로그아웃으로 종료합니다.</div>`);

sl('도구','send 서브커맨드: 제어 시퀀스 직접 발사', `

<p>명령 모드에서 <code>send</code>로 IAC 제어 바이트를 직접 전송합니다. 괄호는 실제 바이트값.</p>

telnet&gt; send el       IAC EL  (248) — Erase Line
telnet&gt; send ga       IAC GA  (249) — Go Ahead
telnet&gt; send nop      IAC NOP (241) — No-op (keepalive)
telnet&gt; send synch    Synch — IP + Data Mark(TCP urgent)
telnet&gt; send escape   이스케이프 문자 자체를 전송

telnet&gt; send dont 1   IAC DONT ECHO(1)
telnet&gt; send will 24  IAC WILL TERMINAL-TYPE(24) — 옵션 제안
telnet&gt; send wont 34  IAC WONT LINEMODE(34)</code></pre>
<div class="note"><code>send ayt</code>는 hung 세션 진단에 유용: 서버가 살아있으면 <code>[Yes]</code> 같은 응답을 되돌립니다(RFC 854).</div>`);

</tbody></table></div>
<div class="tip">Linux에서 <code>telnet</code>이 없으면 대개 <code>inetutils-telnet</code> 또는 <code>telnet-ssl</code> 패키지. 삭제된 배포에서는 <code>nc</code>/<code>socat</code>이 사실상 대체재입니다.</div>`);

sl('도구','netcat(nc): 더 나은 원시 클라이언트', `
<h1><span class="no">T7</span>netcat — TCP/IP의 맥가이버칼</h1>
<p><code>nc</code>는 옵션 협상·이스케이프가 없어 <em>순수 바이트</em>를 그대로 주고받습니다. 텍스트 프로토콜 디버깅엔 telnet보다 깔끔합니다.</p>
<pre class="code"><code><span class="cm"># 원시 TCP 클라이언트</span>
nc example.com 80
nc -v example.com 25          <span class="cm"># -v 연결 진단 출력</span>
nc -w 3 example.com 22        <span class="cm"># -w 3: 연결/유휴 타임아웃 3초</span>
printf 'GET / HTTP/1.0\\r\\n\\r\\n' | nc example.com 80</code></pre>
<pre class="code"><code><span class="cm"># 자주 쓰는 플래그</span>
  -v  verbose          -l  listen(서버) 모드
  -p  로컬 포트         -k  연결 끊겨도 계속 listen (ncat/일부 nc)
  -u  UDP              -n  DNS 조회 생략
  -w  N초 타임아웃      -z  스캔(데이터 없이 연결만)</code></pre>
<div class="note"><code>nc</code>는 3계열(traditional·OpenBSD·ncat)으로 플래그가 미묘하게 다릅니다. OpenBSD판은 <code>nc -l 8080</code>(포트만), traditional판은 <code>nc -l -p 8080</code>이 필요합니다.</div>`);

sl('도구','nc 서버·HTTP·파일 전송', `
<h1><span class="no">T8</span>nc로 서버 세우기</h1>
<pre class="code"><code><span class="cm"># 간이 수신 서버 — 다른 터미널에서 접속해 채팅/전송</span>
nc -l -p 9000          <span class="cm"># traditional (-p 필요)</span>
nc -l 9000             <span class="cm"># OpenBSD/ncat (포트만)</span>
nc -lk 9000            <span class="cm"># -k: 끊겨도 계속 대기(ncat)</span></code></pre>
<pre class="code"><code><span class="cm"># 파일 전송 (수신측 → 송신측 순서로 실행)</span>
nc -l 9000 &gt; recv.bin       <span class="cm"># 수신</span>
nc host 9000 &lt; send.bin      <span class="cm"># 송신</span>

<span class="cm"># 한 줄 고정응답 HTTP 서버</span>
while true; do printf 'HTTP/1.1 200 OK\\r\\nContent-Length: 2\\r\\n\\r\\nhi' | nc -l 8080; done</code></pre>
<div class="tip"><code>nc -zv host 20-25</code>로 포트 범위 열림 여부를 빠르게 점검. HTTP 헤더만 훔쳐보려면 <code>printf 'HEAD / HTTP/1.0\\r\\n\\r\\n' | nc host 80</code>.</div>`);

sl('도구','socat: 양방향 만능 릴레이', `
<h1><span class="no">T9</span>socat — 두 스트림을 잇는다</h1>
<p><code>socat</code>은 두 개의 주소(파일·소켓·프로세스·TLS)를 양방향으로 연결합니다. nc의 상위 호환.</p>
<pre class="code"><code><span class="cm"># readline(히스토리·라인 편집) 붙은 TCP 클라이언트</span>
socat READLINE,history=/root/.socat_hist TCP:example.com:23

<span class="cm"># TCP 프록시/브리지: 로컬 8080 → 원격 80</span>
socat TCP-LISTEN:8080,reuseaddr,fork TCP:example.com:80

<span class="cm"># 표준입출력 ↔ TCP (CRLF 변환 포함, telnet 대용)</span>
socat -,crnl TCP:example.com:80

<span class="cm"># UNIX 도메인 소켓 ↔ TCP 노출</span>
socat UNIX-CONNECT:/run/app.sock TCP-LISTEN:7000,fork</code></pre>
<div class="fx"><code>crnl</code>(또는 <code>crlf</code>) 옵션은 로컬 개행을 CRLF로 바꿔 HTTP/SMTP가 요구하는 <code>\\r\\n</code> 줄끝을 자동 처리합니다.</div>`);

sl('도구','socat: TLS와 시리얼 콘솔', `
<h1><span class="no">T10</span>socat — TLS·시리얼</h1>
<pre class="code"><code><span class="cm"># TLS 클라이언트로 HTTPS를 손으로 말하기</span>
socat -,crnl OPENSSL:example.com:443,verify=1

<span class="cm"># TLS 서버(자체 인증서)</span>
socat OPENSSL-LISTEN:4433,cert=server.pem,verify=0,fork EXEC:/bin/cat</code></pre>
<pre class="code"><code><span class="cm"># 시리얼 콘솔(라우터/임베디드) — 115200 8N1</span>
socat -,raw,echo=0,escape=0x1d /dev/ttyUSB0,b115200,raw,echo=0
<span class="cm">#   escape=0x1d → Ctrl+] 로 socat 종료</span>

<span class="cm"># 시리얼 ↔ TCP: 원격에서 telnet 으로 시리얼 접근(리버스 텔넷 대용)</span>
socat TCP-LISTEN:2323,reuseaddr,fork /dev/ttyS0,b9600,raw,echo=0</code></pre>
<div class="note">시리얼은 <code>raw,echo=0</code>이 중요: 로컬 터미널이 문자를 가공/에코하지 않도록 해야 장비 콘솔이 깨지지 않습니다.</div>`);

sl('도구','ncat(nmap): TLS·telnet 모드 내장', `
<h1><span class="no">T11</span>ncat — 현대적 netcat</h1>
<p>nmap 프로젝트의 <code>ncat</code>은 TLS·프록시·접근제어·연결 브로커링을 기본 탑재합니다.</p>
<pre class="code"><code>ncat --ssl example.com 443            <span class="cm"># TLS로 감싼 연결(HTTPS 수동)</span>
ncat --telnet 192.0.2.10 23          <span class="cm"># 텔넷 옵션 협상에 자동 응답(DONT/WONT)</span>
ncat -C example.com 25               <span class="cm"># -C: 개행을 CRLF로(SMTP/HTTP)</span>
ncat -lk --ssl-cert s.pem --ssl-key s.key 4433   <span class="cm"># TLS 리슨 서버</span>
ncat --proxy 10.0.0.1:8080 --proxy-type http example.com 80</code></pre>
<div class="tip"><code>--telnet</code> 모드는 서버가 보내는 IAC 협상을 ncat이 대신 거절/무시해 화면에 <code>0xff 0xfd 0x18</code> 같은 쓰레기 바이트가 안 뜨게 해줍니다. 순수 nc로 텔넷 서버에 붙을 때 겪는 문제를 해결합니다.</div>`);

sl('도구','openssl s_client: TLS 위의 telnet', `
<h1><span class="no">T12</span>openssl s_client — 암호화 채널을 손으로</h1>
<p>HTTPS·SMTPS·IMAPS를 <em>telnet 하듯</em> 직접 말하려면 이것이 표준 도구입니다.</p>
<pre class="code"><code>openssl s_client -connect example.com:443 -servername example.com -crlf -quiet

  -connect host:port  대상 지정
  -servername NAME    SNI 전송 (가상호스팅 사이트에 필수)
  -crlf               입력 개행을 CRLF로 (HTTP/SMTP 필수)
  -quiet              핸드셰이크 잡음 억제, 세션만 표시
  -starttls smtp      STARTTLS로 평문→TLS 업그레이드</code></pre>
<pre class="code"><code><span class="cm"># STARTTLS 메일 서버</span>
openssl s_client -starttls smtp -connect mail.example.com:587 -crlf

<span class="cm"># 연결되면 그대로 입력:</span>
GET / HTTP/1.1
Host: example.com
Connection: close
</code></pre>
<div class="note"><code>-servername</code>을 빼면 SNI가 없어 기본 가상호스트로 붙거나 인증서 불일치가 납니다. 인증서 체인만 확인하려면 <code>openssl s_client -connect host:443 &lt; /dev/null</code>.</div>`);

sl('도구','PuTTY와 Windows 텔넷 클라이언트', `
<h1><span class="no">T13</span>Windows: PuTTY·telnet 기능</h1>
<p>Windows는 telnet 클라이언트가 기본 <em>비활성</em>. 켜거나 PuTTY를 씁니다.</p>
<pre class="code"><code><span class="cm">:: 텔넷 클라이언트 기능 켜기 (관리자 권한)</span>
dism /online /Enable-Feature /FeatureName:TelnetClient
Enable-WindowsOptionalFeature -Online -FeatureName TelnetClient   :: PowerShell</code></pre>
<pre class="code"><code><span class="cm">:: PuTTY를 커맨드라인에서 raw/telnet 모드로</span>
putty -telnet example.com 23
putty -raw   example.com 80        :: raw = 협상 없는 순수 TCP(nc 상당)
plink -telnet example.com 23       :: plink = PuTTY 콘솔판(스크립트용)</code></pre>
<div class="tip">PuTTY의 <strong>Raw</strong> 접속 유형은 옵션 협상 없이 바이트를 그대로 흘려보내, HTTP·SMTP를 GUI에서 손으로 칠 때 유용합니다. <strong>Telnet</strong> 유형은 IAC 협상을 처리합니다.</div>`);

sl('도구','expect로 텔넷 장비 설정 자동화', `
<h1><span class="no">T14</span>expect — 대화형 세션 스크립팅</h1>
<p>라우터·스위치처럼 telnet만 열린 레거시 장비의 설정 백업을 자동화합니다.</p>
<pre class="code"><code>#!/usr/bin/expect -f
<span class="cm"># 시스코 스위치 running-config 백업</span>
set timeout 20
set host [lindex \$argv 0]
spawn telnet \$host
expect "Username:" ; send "admin\\r"
expect "Password:" ; send "s3cr3t\\r"
expect "&gt;"         ; send "enable\\r"
expect "Password:" ; send "en4ble\\r"
expect "#"         ; send "terminal length 0\\r"
expect "#"         ; send "show running-config\\r"
expect "#"         ; send "exit\\r"
expect eof</code></pre>
<div class="note"><code>send "…\\r"</code>의 <code>\\r</code>(CR)이 엔터입니다. <code>log_file backup.txt</code>를 앞에 추가하면 세션 전체가 파일로 저장됩니다. 실제로는 평문 telnet 대신 SSH+<code>expect</code>를 권장.</div>`);

sl('도구','tcpdump로 텔넷 트래픽 캡처', `
<h1><span class="no">T15</span>tcpdump — 바이트를 잡아본다</h1>
<p>telnet은 평문이라 캡처하면 <strong>비밀번호까지 그대로</strong> 보입니다(보안 경고이자 학습 도구).</p>
<pre class="code"><code>sudo tcpdump -i any -n 'tcp port 23'          <span class="cm"># 23번 트래픽 요약</span>

  -A  페이로드를 ASCII로 출력 (텍스트 프로토콜에 최적)
  -X  hex + ASCII 병렬 덤프 (IAC 0xff 바이트까지 보임)
  -w  pcap 파일로 저장      -r  파일 다시 읽기
  -n  이름 해석 생략        -s0 전체 패킷 캡처</code></pre>
<pre class="code"><code>sudo tcpdump -i eth0 -A 'tcp port 23 and host 192.0.2.10'
sudo tcpdump -X 'tcp port 23' -w telnet.pcap
tcpdump -A -r telnet.pcap                      <span class="cm"># 오프라인 분석</span></code></pre>
<div class="fx"><code>-X</code> 덤프에서 <code>ff fd 18</code>(IAC DO TERMINAL-TYPE), <code>ff fb 03</code>(IAC WILL SGA) 같은 협상 바이트를 육안으로 식별할 수 있습니다.</div>`);

sl('도구','Wireshark / tshark로 세션 재조립', `
<h1><span class="no">T16</span>Wireshark — Follow TCP Stream</h1>
<p>GUI에서 패킷 우클릭 → <em>Follow → TCP Stream</em>이면 흩어진 세그먼트가 하나의 대화로 재조립됩니다. 입력/출력이 색으로 구분됩니다.</p>
<pre class="code"><code><span class="cm"># CLI 판(tshark)로 동일 작업</span>
tshark -i eth0 -f "tcp port 23" -Y telnet         <span class="cm"># 캡처+텔넷 필터</span>
tshark -r telnet.pcap -q -z follow,tcp,ascii,0    <span class="cm"># 스트림 0 통째 추출</span>

<span class="cm"># telnet dissector로 협상 명령만 뽑기</span>
tshark -r telnet.pcap -Y telnet \\
       -T fields -e telnet.cmd -e telnet.opt</code></pre>
<div class="tip">Wireshark의 <strong>telnet</strong> 디섹터는 <code>Do Terminal Type</code>, <code>Suboption Begin</code>, <code>Will Suppress Go Ahead</code>처럼 IAC 시퀀스를 사람이 읽는 라벨로 풀어줍니다. 표시 필터: <code>telnet.cmd == 0xfd</code>(DO).</div>`);

sl('도구','세션 유지와 로깅: tmux·screen·script', `
<h1><span class="no">T17</span>세션을 살려두고 기록하기</h1>
<pre class="code"><code><span class="cm"># tmux 안에서 telnet — detach 해도 세션 유지</span>
tmux new -s con 'telnet console.example.net 2001'
<span class="cm">#   Ctrl-b d 로 detach,  tmux attach -t con 으로 복귀</span>

<span class="cm"># screen으로 시리얼 콘솔 + 자동 로그</span>
screen -L -Logfile serial.log /dev/ttyUSB0 115200</code></pre>
<pre class="code"><code><span class="cm"># 타이핑까지 전 세션 기록: script(1)</span>
script -a session.log          <span class="cm"># 종료는 exit / Ctrl-D</span>

<span class="cm"># 파이프로 로그 남기며 실시간 보기</span>
telnet host 80 | tee session.log</code></pre>
<div class="note">네트워크 장비 콘솔 작업은 <strong>tmux/screen + 로그</strong>가 사실상 필수입니다. 연결이 끊겨도 세션이 살아있고, 무엇을 쳤는지 증적이 남습니다. <code>screen</code>의 시리얼 종료는 <span class="kbd">Ctrl+a</span> <span class="kbd">k</span>.</div>`);

sl('도구','현대적 대안 curl과 콘솔 서버', `
<h1><span class="no">T18</span>curl · 리버스 텔넷</h1>
<p>HTTP 디버깅은 이제 telnet 대신 <code>curl -v</code>가 정석입니다. 텔넷 습관을 그대로 옮겨오세요.</p>
<pre class="code"><code>curl -v http://example.com/                       <span class="cm"># 요청/응답 헤더 표시</span>
curl -v --http1.1 -H 'Connection: close' http://example.com/
curl -sv https://example.com/ -o /dev/null        <span class="cm"># 헤더만(-s 진행바 끔)</span>
curl -v telnet://example.com:23                    <span class="cm"># curl도 telnet 스킴 지원</span></code></pre>
<pre class="code"><code><span class="cm"># 콘솔 서버(리버스 텔넷): TCP 포트 = 물리 회선. Cisco 관례</span>
telnet ts.example.net 2001     <span class="cm"># async line 1  (2000 + line#)</span>
telnet ts.example.net 2033     <span class="cm"># async line 33</span>
<span class="cm">#   hung 세션 정리: enable → clear line 1</span></code></pre>
<div class="tip">콘솔 서버 한 대에 telnet으로 여러 장비의 시리얼 콘솔을 원격 접근하는 것이 <em>리버스 텔넷</em>입니다. 데이터센터 out-of-band 관리의 고전.</div>`);

sl('도구','스크립팅 정수: /dev/tcp·rlwrap·stty', `
<h1><span class="no">T19</span>도구 없이 bash만으로 + 편의 도구</h1>
<pre class="code"><code><span class="cm"># telnet/nc 없이 순수 bash로 HTTP (bash 내장 /dev/tcp)</span>
exec 3&lt;&gt;/dev/tcp/example.com/80
printf 'GET / HTTP/1.0\\r\\n\\r\\n' &gt;&amp;3
cat &lt;&amp;3
exec 3&gt;&amp;-                        <span class="cm"># fd 3 닫기</span></code></pre>
<pre class="code"><code><span class="cm"># nc/telnet에 화살표·히스토리 붙이기</span>
rlwrap nc example.com 23
rlwrap -a telnet example.com 23   <span class="cm"># -a: 비밀번호 프롬프트도 처리</span>

<span class="cm"># 터미널 모드 손보기(raw, 로컬 에코 끔) — 바이너리 세션에 유용</span>
stty -echo raw ; nc host 9000 ; stty sane</code></pre>
<div class="fx"><code>/dev/tcp/host/port</code>는 <em>bash 내장 가상 파일</em>입니다(파일시스템에 실재하지 않음). <code>sh</code>·<code>dash</code>에는 없으니 반드시 <code>bash</code>에서 실행하세요.</div>`);

sl('도구','디버깅 흐름도 & 재사용 치트시트', `
<h1><span class="no">T20</span>도구 선택 흐름 & 치트시트</h1>
<h3>무엇이 문제인가 → 어떤 도구</h3>
<div class="tw"><table class="tbl">
<thead><tr><th>증상 / 질문</th><th>확인 방법</th><th>다음 도구</th></tr></thead>
<tbody>
<tr><td>TCP가 열리긴 하나?</td><td><code>nc -zv host port</code></td><td>안 열리면 방화벽/포트 점검</td></tr>
<tr><td>연결은 되는데 무응답?</td><td><code>nc -v host port</code>로 raw 확인</td><td>프로토콜/CRLF 프레이밍 의심</td></tr>
<tr><td>줄끝이 문제(CRLF)?</td><td><code>printf '...\\r\\n'</code> 명시</td><td><code>socat crnl</code>·<code>ncat -C</code></td></tr>
<tr><td>협상 쓰레기(0xff…)?</td><td>화면에 이상 바이트</td><td><code>ncat --telnet</code>·<code>nc</code></td></tr>
<tr><td>TLS가 필요?</td><td>포트 443/993/465/587</td><td><code>openssl s_client -crlf</code></td></tr>
<tr><td>바이트 레벨 확증?</td><td><code>tcpdump -X port N</code></td><td>Wireshark Follow Stream</td></tr>
</tbody></table></div>
<h3>가장 자주 재사용하는 명령</h3>
<div class="tw"><table class="tbl">
<thead><tr><th>목적</th><th>명령</th></tr></thead>
<tbody>
<tr><td>HTTP 헤더 보기</td><td><code>curl -v http://host/</code></td></tr>
<tr><td>수동 HTTP</td><td><code>printf 'GET / HTTP/1.0\\r\\n\\r\\n' | nc host 80</code></td></tr>
<tr><td>수동 HTTPS</td><td><code>openssl s_client -connect host:443 -servername host -crlf -quiet</code></td></tr>
<tr><td>포트 열림 점검</td><td><code>nc -zv host 20-25</code></td></tr>
<tr><td>텔넷 협상 추적</td><td><code>telnet</code> → <code>Ctrl+]</code> → <code>toggle options</code></td></tr>
<tr><td>생존 확인</td><td><code>Ctrl+]</code> → <code>send ayt</code></td></tr>
<tr><td>세션 기록</td><td><code>script -a s.log</code> / <code>… | tee s.log</code></td></tr>
<tr><td>bash만으로 TCP</td><td><code>exec 3&lt;&gt;/dev/tcp/host/80</code></td></tr>
</tbody></table></div>`);

sl('데모','라이브 데모 ① 바이트 스트림 디코더', `
<h1><span class="no">D1</span>텔넷 바이트 스트림 디코더</h1>
<p>서버가 보낸 바이트를 붙여넣으면 <code>IAC</code> 제어 시퀀스와 데이터를 분리해 해석합니다.
10진·16진(<code>0x</code> 또는 두 자리)·따옴표 없는 텍스트를 섞어 입력할 수 있습니다.</p>
<div class="demo" data-demo="decoder">
  <div class="samples">
    <button data-sample="255 253 24 255 251 3 72 105 13 10">DO TERMINAL-TYPE + WILL SGA + "Hi"</button>
    <button data-sample="255 250 24 0 118 116 49 48 48 255 240">SB TERMINAL-TYPE IS vt100</button>
    <button data-sample="255 254 1 255 252 1">DONT/WONT ECHO</button>
  </div>
  <textarea data-r="in" rows="3" spellcheck="false">255 253 24 255 251 3 72 105 13 10</textarea>
  <div class="out" data-r="out"></div>
</div>
<p class="mut small">255 = <code>IAC</code>, 251–254 = WILL/WONT/DO/DONT, 250/240 = SB/SE. 데이터 안의 0xFF는 <code>IAC IAC</code>로 이스케이프됩니다.</p>`);

sl('자료','핵심 RFC — 프로토콜의 헌법', `
<h1><span class="no">24.1</span>핵심 RFC — 프로토콜의 헌법</h1>
<p>TELNET의 근간을 이루는 8개 문서입니다. <strong>854·855</strong>는 반드시 정독하세요. 나머지는 개별 옵션의 규격서로, 필요할 때 찾아보면 됩니다. 모두 <em>rfc-editor.org</em>의 정본입니다.</p>
<ul class="links">
<li><span class="k doc">RFC 854</span> <a href="https://www.rfc-editor.org/rfc/rfc854" target="_blank" rel="noopener">TELNET Protocol Specification</a> <span class="mut small">— NVT·IAC·명령 코드. 이 프로토콜의 본문</span></li>
<li><span class="k doc">RFC 855</span> <a href="https://www.rfc-editor.org/rfc/rfc855" target="_blank" rel="noopener">TELNET Option Specifications</a> <span class="mut small">— 옵션 협상의 일반 틀(WILL/WONT/DO/DONT)</span></li>
<li><span class="k doc">RFC 856</span> <a href="https://www.rfc-editor.org/rfc/rfc856" target="_blank" rel="noopener">Binary Transmission</a> <span class="mut small">— 옵션 0, 8비트 투명 채널</span></li>
<li><span class="k doc">RFC 857</span> <a href="https://www.rfc-editor.org/rfc/rfc857" target="_blank" rel="noopener">Echo</a> <span class="mut small">— 옵션 1, 원격 에코 협상</span></li>
<li><span class="k doc">RFC 858</span> <a href="https://www.rfc-editor.org/rfc/rfc858" target="_blank" rel="noopener">Suppress Go Ahead</a> <span class="mut small">— 옵션 3, ECHO와 함께 문자 단위 모드의 핵심</span></li>
<li><span class="k doc">RFC 859</span> <a href="https://www.rfc-editor.org/rfc/rfc859" target="_blank" rel="noopener">Status</a> <span class="mut small">— 옵션 5, 양쪽 협상 상태 조회</span></li>
<li><span class="k doc">RFC 860</span> <a href="https://www.rfc-editor.org/rfc/rfc860" target="_blank" rel="noopener">Timing Mark</a> <span class="mut small">— 옵션 6, 스트림 동기화 표식</span></li>
<li><span class="k doc">RFC 861</span> <a href="https://www.rfc-editor.org/rfc/rfc861" target="_blank" rel="noopener">Extended-Options-List</a> <span class="mut small">— 옵션 255, 옵션 코드 공간 확장</span></li>
</ul>
<div class="tip">읽는 순서 추천: <strong>854 → 855 → 1143</strong>(협상 상태기계) → 관심 옵션 순.</div>`);

sl('자료','옵션 RFC — 실전에서 만나는 것들', `
<h1><span class="no">24.2</span>옵션 RFC — 실전에서 만나는 것들</h1>
<p>현대 텔넷 세션(특히 <code>telnetd</code>·MUD·BBS)에서 실제로 오가는 옵션들의 규격서입니다. <strong>1091(단말 종류)</strong>·<strong>1073(창 크기)</strong>·<strong>1143(Q-method)</strong>는 클라이언트를 짤 때 사실상 필수입니다.</p>
<ul class="links">
<li><span class="k doc">RFC 1091</span> <a href="https://www.rfc-editor.org/rfc/rfc1091" target="_blank" rel="noopener">Terminal-Type</a> <span class="mut small">— 옵션 24, SB IS/SEND로 <code>xterm-256color</code> 등 전달</span></li>
<li><span class="k doc">RFC 1073</span> <a href="https://www.rfc-editor.org/rfc/rfc1073" target="_blank" rel="noopener">Window Size (NAWS)</a> <span class="mut small">— 옵션 31, 열×행 2바이트씩 통보</span></li>
<li><span class="k doc">RFC 1079</span> <a href="https://www.rfc-editor.org/rfc/rfc1079" target="_blank" rel="noopener">Terminal Speed</a> <span class="mut small">— 옵션 32</span></li>
<li><span class="k doc">RFC 1184</span> <a href="https://www.rfc-editor.org/rfc/rfc1184" target="_blank" rel="noopener">Linemode</a> <span class="mut small">— 옵션 34, 줄 단위 편집을 클라이언트에 위임</span></li>
<li><span class="k doc">RFC 1143</span> <a href="https://www.rfc-editor.org/rfc/rfc1143" target="_blank" rel="noopener">Q Method of Option Negotiation</a> <span class="mut small">— 협상 루프/에코 폭주를 막는 상태기계. 구현 필독</span></li>
<li><span class="k doc">RFC 1372</span> <a href="https://www.rfc-editor.org/rfc/rfc1372" target="_blank" rel="noopener">Remote Flow Control</a> <span class="mut small">— 옵션 33</span></li>
<li><span class="k doc">RFC 1408</span> <a href="https://www.rfc-editor.org/rfc/rfc1408" target="_blank" rel="noopener">Environment Option</a> <span class="mut small">— 옵션 36 (이후 1572로 대체)</span></li>
<li><span class="k doc">RFC 1572</span> <a href="https://www.rfc-editor.org/rfc/rfc1572" target="_blank" rel="noopener">New Environment Option</a> <span class="mut small">— 옵션 39, <code>USER</code>·<code>DISPLAY</code> 등 환경변수 전달</span></li>
<li><span class="k doc">RFC 2066</span> <a href="https://www.rfc-editor.org/rfc/rfc2066" target="_blank" rel="noopener">CHARSET</a> <span class="mut small">— 옵션 42, 문자셋 협상</span></li>
<li><span class="k doc">RFC 2217</span> <a href="https://www.rfc-editor.org/rfc/rfc2217" target="_blank" rel="noopener">Com Port Control</a> <span class="mut small">— 시리얼 포트를 텔넷 위로(터미널 서버)</span></li>
<li><span class="k doc">RFC 2941</span> <a href="https://www.rfc-editor.org/rfc/rfc2941" target="_blank" rel="noopener">Authentication Option</a> <span class="mut small">— 옵션 37, Kerberos 등</span></li>
<li><span class="k doc">RFC 2946</span> <a href="https://www.rfc-editor.org/rfc/rfc2946" target="_blank" rel="noopener">Encryption Option</a> <span class="mut small">— 옵션 38. 실무에선 SSH/TLS가 대체</span></li>
</ul>`);

sl('자료','IANA 레지스트리 — 코드의 단일 진실', `
<h1><span class="no">24.3</span>IANA 레지스트리 — 코드의 단일 진실</h1>
<p>옵션 번호(0–255)와 명령 코드(240–255)의 <strong>공식 배정표</strong>입니다. 새 옵션 코드나 잘 모르는 번호를 만났을 때 가장 먼저 확인할 곳입니다.</p>
<ul class="links">
<li><span class="k doc">IANA</span> <a href="https://www.iana.org/assignments/telnet-options/telnet-options.xhtml" target="_blank" rel="noopener">TELNET Options 레지스트리</a> <span class="mut small">— 옵션 0–255 전체 배정과 참조 RFC</span></li>
<li><span class="k doc">IANA</span> <a href="https://www.iana.org/protocols" target="_blank" rel="noopener">Protocol Registries 목록</a> <span class="mut small">— 텔넷 외 전 프로토콜 파라미터의 색인</span></li>
<li><span class="k doc">IANA</span> <a href="https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml" target="_blank" rel="noopener">Service Name / Port Number</a> <span class="mut small">— <code>telnet 23/tcp</code> 배정 확인</span></li>
</ul>
<div class="note">명령 코드(<code>IAC</code>=255 … <code>SE</code>=240)는 별도 레지스트리가 아니라 <a href="https://www.rfc-editor.org/rfc/rfc854" target="_blank" rel="noopener">RFC 854</a> 본문에 고정되어 있습니다. IANA 레지스트리는 <em>옵션 번호</em>를 관리합니다.</div>`);

sl('자료','읽을 만한 구현 — 소스로 배우기', `

</ul>

<h3>고수준 언어</h3>

sl('자료','책·표준 해설 — 곁에 둘 레퍼런스', `
<h1><span class="no">24.5</span>책·표준 해설 — 곁에 둘 레퍼런스</h1>

sl('자료','도구 문서 — 실전 무기의 매뉴얼', `
<h1><span class="no">24.6</span>도구 문서 — 실전 무기의 매뉴얼</h1>
<p><code>telnet</code>만으로 부족할 때 쓰는 도구들의 공식 문서입니다. raw 소켓은 <code>ncat</code>/<code>socat</code>, TLS 위 프로토콜은 <code>openssl s_client</code>가 사실상 표준입니다.</p>
<ul class="links">

/* ============================================================
 *  옵션 카탈로그 자동 생성 (IANA Telnet Options 0~255)
 * ============================================================ */
/* ============================================================
 *  라이브 데모
 * ============================================================ */
var CMD = {240:'SE',241:'NOP',242:'DM',243:'BRK',244:'IP',245:'AO',246:'AYT',247:'EC',248:'EL',249:'GA',250:'SB',251:'WILL',252:'WONT',253:'DO',254:'DONT',255:'IAC'};
var CMDESC = {240:'서브협상 끝',241:'무동작',242:'데이터 마크',243:'Break',244:'프로세스 중단(IP)',245:'출력 중단(AO)',246:'거기 있니?(AYT)',247:'문자 삭제(EC)',248:'줄 삭제(EL)',249:'Go Ahead',250:'서브협상 시작',251:'WILL',252:'WONT',253:'DO',254:'DONT',255:'IAC 이스케이프'};

var _timers = [];
function clearAnims(){ _timers.forEach(function(t){ clearInterval(t); clearTimeout(t); }); _timers = []; }

function initDemos(root){
  root.querySelectorAll('[data-demo]').forEach(function(box){
    var kind = box.getAttribute('data-demo');
    if (box._init) return; box._init = true;
    if (kind === 'decoder') initDecoder(box);
    else if (kind === 'negotiate') initNegotiate(box);
    else if (kind === 'httpbuild') initHttpBuild(box);
  });
}

/* ---- 1) 텔넷 바이트 스트림 디코더 ---- */
function initDecoder(box){
  var q = function(id){ return box.querySelector('[data-r="' + id + '"]'); };
  var ta = q('in'), out = q('out');
  function parse(){
    var txt = ta.value.trim();
    var bytes = [];
    txt.split(/[\s,]+/).forEach(function(tok){
      if (!tok) return;
      if (/^0x[0-9a-f]+$/i.test(tok)) bytes.push(parseInt(tok,16) & 255);
      else if (/^\d+$/.test(tok)) bytes.push(parseInt(tok,10) & 255);
      else if (/^[0-9a-f]{2}$/i.test(tok)) bytes.push(parseInt(tok,16) & 255);
      else { for (var i=0;i<tok.length;i++) bytes.push(tok.charCodeAt(i) & 255); }
    });
    var html = '', i = 0, data = '';
    function flush(){ if (data){ html += '<div class="dl"><span class="tg data">DATA</span> "' + data.replace(/</g,'&lt;') + '"</div>'; data=''; } }
    while (i < bytes.length){
      var b = bytes[i];
      if (b === 255 && i+1 < bytes.length){
        flush();
        var c = bytes[i+1];
        if (c === 255){ data += 'ÿ'; i += 2; continue; }
        if (c >= 251 && c <= 254 && i+2 < bytes.length){
          var opt = bytes[i+2], on = TELOPTS[opt] ? TELOPTS[opt][0] : 'opt'+opt;
          html += '<div class="dl"><span class="tg cmd">IAC ' + CMD[c] + '</span> ' + on + ' <span class="mut">(opt ' + opt + ')</span></div>';
          i += 3; continue;
        }
        if (c === 250){ // SB ... IAC SE
          var j = i+2, sub = [];
          while (j+1 < bytes.length && !(bytes[j]===255 && bytes[j+1]===240)){ sub.push(bytes[j]); j++; }
          var so = sub.length ? sub[0] : -1, son = TELOPTS[so] ? TELOPTS[so][0] : 'opt'+so;
          html += '<div class="dl"><span class="tg sb">IAC SB</span> ' + son + ' [' + sub.slice(1).join(' ') + '] <span class="tg cmd">IAC SE</span></div>';
          i = j + 2; continue;
        }
        html += '<div class="dl"><span class="tg cmd">IAC ' + (CMD[c]||c) + '</span> <span class="mut">' + (CMDESC[c]||'') + '</span></div>';
        i += 2; continue;
      }
      var ch = String.fromCharCode(b);
      if (b === 13) data += '\\r'; else if (b === 10) data += '\\n'; else if (b < 32) data += '\\x'+b.toString(16); else data += ch;
      i++;
    }
    flush();
    out.innerHTML = html || '<span class="mut">디코드할 바이트가 없습니다.</span>';
  }
  ta.addEventListener('input', parse);
  box.querySelectorAll('[data-sample]').forEach(function(b){
    b.addEventListener('click', function(){ ta.value = b.getAttribute('data-sample'); parse(); });
  });
  parse();
}

/* ---- 2) 옵션 협상 3바이트 생성기 + Q-method 응답 ---- */
function initNegotiate(box){
  var q = function(id){ return box.querySelector('[data-r="' + id + '"]'); };
  var cmd = q('cmd'), opt = q('opt'), out = q('out'), resp = q('resp');
  function upd(){
    var c = +cmd.value, o = +opt.value;
    var name = TELOPTS[o] ? TELOPTS[o][0] : 'opt'+o;
    out.innerHTML = 'IAC ' + CMD[c] + ' ' + name +
      ' &nbsp;→&nbsp; <code>FF ' + c.toString(16).toUpperCase() + ' ' + (o<16?'0':'') + o.toString(16).toUpperCase() + '</code>';
    // RFC 1143 관점의 전형적 대칭 응답
    var pair = {251:'DO(253) 또는 DONT(254)',252:'DONT(254)',253:'WILL(251) 또는 WONT(252)',254:'WONT(252)'};
    var meaning = {251:'"내가 이 옵션을 켜겠다"',252:'"내가 이 옵션을 끄겠다/못 켠다"',253:'"네가 이 옵션을 켜라"',254:'"네가 이 옵션을 꺼라"'};
    resp.innerHTML = '<div class="tip"><strong>의미</strong>: ' + meaning[c] + '<br>' +
      '<strong>상대의 전형적 응답</strong>(RFC 1143 Q-method): <code>' + pair[c] + '</code><br>' +
      '<span class="mut small">양쪽이 이미 원하는 상태면 재응답하지 않아 무한 루프를 막습니다.</span></div>';
  }
  cmd.addEventListener('change', upd); opt.addEventListener('change', upd); upd();
}

/* ---- 3) HTTP-over-telnet 요청 빌더 ---- */
function initHttpBuild(box){
  var q = function(id){ return box.querySelector('[data-r="' + id + '"]'); };
  var host = q('host'), path = q('path'), ver = q('ver'), meth = q('meth'), out = q('out');
  function upd(){
    var h = host.value || 'example.com', p = path.value || '/', v = ver.value, m = meth.value;
    var lines = [];
    lines.push('$ telnet ' + h + ' 80');
    lines.push('Trying ...  Connected to ' + h + '.');
    lines.push('<span class="mut">— 아래를 그대로 입력 (각 줄 끝 Enter = CRLF) —</span>');
    lines.push('<b>' + m + ' ' + p + ' HTTP/' + v + '</b>');
    if (v === '1.1'){ lines.push('<b>Host: ' + h + '</b>'); lines.push('<b>Connection: close</b>'); }
    if (m === 'POST'){ lines.push('<b>Content-Type: application/x-www-form-urlencoded</b>'); lines.push('<b>Content-Length: 7</b>'); }
    lines.push('<b>&nbsp;</b><span class="mut">← 빈 줄(엔터 한 번 더)이 헤더의 끝</span>');
    if (m === 'POST') lines.push('<b>a=1&b=2</b>');
    out.innerHTML = lines.join('\n');
  }
  [host,path,ver,meth].forEach(function(e){ e.addEventListener('input', upd); e.addEventListener('change', upd); });
  upd();
}

/* ============================================================
 *  덱 엔진
 * ============================================================ */
var cur = 0, total = S.length;
var stage = document.getElementById('stage');
var bar = document.getElementById('bar');
var cnt = document.getElementById('cnt');
var badge = document.getElementById('secbadge');
var toc = document.getElementById('toc');

window.__deckGo=function(i){render(i);};   /* 책갈피 이어보기 */
function render(i, pushHash){
  cur = Math.max(0, Math.min(total - 1, i));
  clearAnims();
  var sd = S[cur];
  stage.innerHTML = '<div class="slide">' + sd.h + '</div>';
  stage.scrollTop = 0;
  var col = SECS[sd.s] || '#4fc3f7';
  badge.textContent = sd.s + ' · ' + (cur + 1);
  badge.style.color = col;
  badge.style.borderColor = col;
  cnt.textContent = (cur + 1) + ' / ' + total;
  bar.style.width = ((cur + 1) / total * 100) + '%';
  document.title = '🖥️ TELNET 대백과 — ' + sd.t;
  if (pushHash !== false){ try { history.replaceState(null, '', '#s' + (cur + 1)); } catch(e){} }
  initDemos(stage);
}
function step(d){ render(cur + d); }

document.getElementById('bFirst').onclick = function(){ render(0); };
document.getElementById('bLast').onclick = function(){ render(total - 1); };
document.getElementById('bPrev').onclick = function(){ step(-1); };
document.getElementById('bNext').onclick = function(){ step(1); };
document.getElementById('bToc').onclick = function(){ openToc(); };

document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (toc.classList.contains('open')){ if (e.key === 'Escape'){ closeToc(); e.preventDefault(); } return; }
  switch (e.key){
    case 'ArrowRight': case ' ': case 'PageDown': step(1); e.preventDefault(); break;
    case 'ArrowLeft': case 'PageUp': step(-1); e.preventDefault(); break;
    case 'Home': render(0); e.preventDefault(); break;
    case 'End': render(total - 1); e.preventDefault(); break;
    case 't': case 'T': openToc(); e.preventDefault(); break;
  }
});

(function(){
  var sx = 0, sy = 0, ok = false;
  stage.addEventListener('touchstart', function(e){
    ok = !e.target.closest('.demo, a, button, select, input, textarea, canvas');
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY;
  }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (!ok) return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 64 && Math.abs(dy) < Math.abs(dx) * 0.6) step(dx < 0 ? 1 : -1);
  }, {passive:true});
})();

function buildToc(){
  var body = document.getElementById('tocBody'), html = '', lastSec = null;
  for (var i = 0; i < total; i++){
    var sd = S[i];
    if (sd.s !== lastSec){
      if (lastSec !== null) html += '</div>';
      var col = SECS[sd.s] || '#4fc3f7';
      html += '<h3 style="color:' + col + '">' + sd.s + '</h3><div class="tgrid">';
      lastSec = sd.s;
    }
    html += '<button data-go="' + i + '"><span class="n">' + (i+1) + '</span>' + sd.t + '</button>';
  }
  html += '</div>';
  body.innerHTML = html;
  body.addEventListener('click', function(e){
    var b = e.target.closest('button[data-go]');
    if (b){ closeToc(); render(+b.dataset.go); }
  });
}
function openToc(){
  toc.classList.add('open');
  toc.querySelectorAll('.tgrid button').forEach(function(b){ b.classList.toggle('cur', +b.dataset.go === cur); });
}
function closeToc(){ toc.classList.remove('open'); }
document.getElementById('tocClose').onclick = closeToc;
document.getElementById('jumpGo').onclick = function(){
  var v = +document.getElementById('jumpN').value;
  if (v >= 1 && v <= total){ closeToc(); render(v - 1); }
};
document.getElementById('jumpN').addEventListener('keydown', function(e){
  if (e.key === 'Enter') document.getElementById('jumpGo').onclick();
});

function fromHash(){ var m = location.hash.match(/^#s(\d+)$/); return m ? Math.max(0, Math.min(total - 1, +m[1] - 1)) : 0; }
window.addEventListener('hashchange', function(){ render(fromHash(), false); });

buildToc();
render(fromHash(), false);

</script>
<!-- ===== deck-input-shim v1 : 방향키(↑↓ 스크롤 / ←→ 페이지) + 게임패드 ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckInputShim) return;
  window.__deckInputShim = true;

  /* ---------- 지금 보이는 슬라이드의 스크롤 컨테이너 찾기 ---------- */
  function scrollableAt(x, y) {
    if (!document.elementFromPoint) return null;
    var n = document.elementFromPoint(x, y);
    while (n && n !== document.documentElement) {
      var oy = getComputedStyle(n).overflowY;
      if ((oy === 'auto' || oy === 'scroll' || oy === 'overlay') &&
          n.scrollHeight - n.clientHeight > 4) return n;
      n = n.parentElement;
    }
    return null;
  }
  function scroller() {
    var el = scrollableAt(innerWidth / 2, innerHeight / 2) ||
             scrollableAt(innerWidth / 2, innerHeight * 0.35);
    if (el) return el;
    var m = document.querySelector('main');
    if (m && m.scrollHeight - m.clientHeight > 4) return m;
    return document.scrollingElement || document.documentElement;
  }
  function viewH(el) {
    return (el === document.scrollingElement || el === document.documentElement)
      ? innerHeight : el.clientHeight;
  }
  function isPageScroller(el) {
    return el === document.scrollingElement || el === document.documentElement || el === document.body;
  }
  function scrollStep(dir, smooth) {
    var el = scroller();
    el.scrollBy({ top: dir * Math.max(80, viewH(el) * 0.25),
                  left: 0, behavior: smooth ? 'smooth' : 'auto' });
  }

  /* ---------- 페이지 이동 (덱마다 다른 엔진에 공통으로 붙는다) ---------- */
  function pick(ids) {
    for (var i = 0; i < ids.length; i++) {
      var e = document.getElementById(ids[i]);
      if (e && (e.tagName === 'BUTTON' || e.tagName === 'A')) return e;
    }
    return null;
  }
  function synth(key) {
    document.dispatchEvent(new KeyboardEvent('keydown',
      { key: key, code: key, bubbles: true, cancelable: true }));
  }
  function page(dir) {
    var b = dir > 0 ? pick(['nextBtn', 'btnNext', 'next'])
                    : pick(['prevBtn', 'btnPrev', 'prev']);
    if (b) { if (!b.disabled) b.click(); }
    else synth(dir > 0 ? 'ArrowRight' : 'ArrowLeft');
  }
  function toggleToc() {
    var b = pick(['tocBtn', 'btnToc', 'toc-btn', 'tocOpen']);
    if (b) b.click(); else synth('t');
  }

  /* ---------- 키보드: ↑↓ = 스크롤 (←→ 페이지는 각 덱 엔진이 처리) ---------- */
  function interactive(el) {
    if (!el) return false;
    var t = (el.tagName || '').toUpperCase();
    return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' ||
           t === 'CANVAS' || el.isContentEditable === true;
  }
  addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    if (e.defaultPrevented || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
    if (interactive(e.target) || interactive(document.activeElement)) return;
    var dir = e.key === 'ArrowDown' ? 1 : -1, repeat = e.repeat;
    // 이벤트 전파가 끝난 뒤에 판단한다 — 슬라이드 안의 데모(테트리스 등)가
    // 이 키를 가져갔으면(preventDefault) 스크롤하지 않는다.
    setTimeout(function () {
      if (e.defaultPrevented) return;
      // 문서 자체가 스크롤되는 덱은 브라우저 기본 동작에 맡긴다(이중 스크롤 방지).
      if (isPageScroller(scroller())) return;
      scrollStep(dir, !repeat);
    }, 0);
  });

  /* ---------- 게임패드 (조이패드) ----------
     좌스틱/D-pad 상하 = 스크롤, 좌우 = 이전/다음 페이지
     A·RB·RT = 다음, B·LB·LT = 이전, X·Start = 목차, Back = 첫 장     */
  var DEAD = 0.4, REPEAT = 320, held = {}, lastTurn = 0, lastDir = 0, raf = 0;

  function pads() {
    if (!navigator.getGamepads) return [];
    var out = [], g = navigator.getGamepads();
    for (var i = 0; i < g.length; i++) if (g[i]) out.push(g[i]);
    return out;
  }
  function down(g, i) { var b = g.buttons[i]; return !!b && (b.pressed || b.value > 0.5); }
  function edge(name, isDown, fn) {
    if (isDown) { if (!held[name]) { held[name] = 1; fn(); } }
    else held[name] = 0;
  }

  function poll(now) {
    var list = pads();
    if (!list.length) { raf = 0; return; }
    raf = requestAnimationFrame(poll);

    var ax = 0, ay = 0, bNext = false, bPrev = false, bToc = false, bHome = false;
    for (var k = 0; k < list.length; k++) {
      var g = list[k];
      ax += g.axes[0] || 0;
      ay += g.axes[1] || 0;
      if (down(g, 15)) ax += 1;
      if (down(g, 14)) ax -= 1;
      if (down(g, 13)) ay += 1;
      if (down(g, 12)) ay -= 1;
      bNext = bNext || down(g, 0) || down(g, 5) || down(g, 7);
      bPrev = bPrev || down(g, 1) || down(g, 4) || down(g, 6);
      bToc  = bToc  || down(g, 2) || down(g, 9);
      bHome = bHome || down(g, 8);
    }

    if (Math.abs(ay) > DEAD) {                       // 세로: 부드러운 연속 스크롤
      var mag = Math.min(1, (Math.abs(ay) - DEAD) / (1 - DEAD));
      scroller().scrollBy(0, (ay > 0 ? 1 : -1) * (6 + mag * 22));
    }
    var dir = Math.abs(ax) > DEAD ? (ax > 0 ? 1 : -1) : 0;
    if (dir) {                                       // 가로: 페이지 넘김(리핏 간격)
      if (dir !== lastDir || now - lastTurn > REPEAT) {
        lastDir = dir; lastTurn = now; page(dir);
      }
    } else { lastDir = 0; lastTurn = 0; }

    edge('next', bNext, function () { page(1); });
    edge('prev', bPrev, function () { page(-1); });
    edge('toc',  bToc,  toggleToc);
    edge('home', bHome, function () { synth('Home'); });
  }

  function start() { if (!raf) raf = requestAnimationFrame(poll); }
  addEventListener('gamepadconnected', start);
  addEventListener('focus', function () { if (pads().length) start(); });
  if (pads().length) start();
})();
</script>
<!-- ===== deck-bookmark-shim v3 : IndexedDB 책갈피(읽던 위치 자동 저장 + 이어보기) ===== -->
<script>
(function () {
  'use strict';
  if (window.__deckBookmarkShim) return;
  window.__deckBookmarkShim = true;
  if (!window.indexedDB) return;

  var DB_NAME = 'treasure-house', DB_VER = 1, STORE = 'bookmarks';

  var FILE = location.pathname.split('/').pop() || '';
  try { FILE = decodeURIComponent(FILE); } catch (e) {}
  if (!FILE || /^index\.html?$/i.test(FILE)) return;   // 포털(index.html)은 저장하지 않는다

  /* ---------- IndexedDB 래퍼 ----------
     · 실패한 연결은 캐시하지 않는다 — blocked처럼 일시적인 실패 뒤에 다시 시도한다
     · 버전 변경·저장공간 회수·사이트 데이터 삭제로 연결이 끊기면 버리고 다시 연다
     · 계속 막히는 환경(file://·시크릿·사이트 데이터 차단)이면 3번 만에 단념하고,
       첫 실패 한 번만 콘솔에 남긴다 — 화면에는 아무것도 띄우지 않는다              */
  var dbp = null, conn = null, fails = 0, warned = false, deadp = null;

  function warn(e) {
    if (warned) return;
    warned = true;
    try { console.warn('[bookmark] 책갈피를 건너뜁니다 — IndexedDB 사용 불가:', e); } catch (x) {}
  }
  function drop(c) { if (conn === c) { dbp = null; conn = null; } }
  function dead() {
    if (!deadp) {
      deadp = Promise.reject(new Error('bookmark: IndexedDB unavailable'));
      deadp.catch(function () {});             // 미처리 거부 경고 방지
    }
    return deadp;
  }
  function db() {
    if (fails >= 3) return dead();
    if (dbp) return dbp;
    var p = dbp = new Promise(function (res, rej) {
      var req;
      try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { rej(e); return; }
      req.onupgradeneeded = function () {
        var d = req.result;
        if (!d.objectStoreNames.contains(STORE))
          d.createObjectStore(STORE, { keyPath: 'id' }).createIndex('updated', 'updated');
      };
      req.onsuccess = function () {
        var d = req.result;
        conn = d; fails = 0;
        d.onversionchange = function () { drop(d); try { d.close(); } catch (x) {} };
        d.onclose         = function () { drop(d); };
        res(d);
      };
      req.onerror   = function () { rej(req.error || new Error('open error')); };
      req.onblocked = function () { rej(new Error('open blocked')); };
    });
    p.catch(function (e) {
      fails++;
      if (dbp === p) { dbp = null; conn = null; }
      warn(e);
    });
    return p;
  }
  function tx(mode, fn) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var t, r;
        // 닫힌 연결이면 여기서 InvalidStateError가 난다 — 버리고 다음 호출에서 다시 연다
        try { t = d.transaction(STORE, mode); r = fn(t.objectStore(STORE)); }
        catch (e) { drop(d); rej(e); return; }
        t.oncomplete = function () { res(r ? r.result : undefined); };
        t.onerror    = function () { rej(t.error || new Error('tx ' + mode + ' error')); };
        t.onabort    = function () { rej(t.error || new Error('tx ' + mode + ' aborted')); };
      });
    }).catch(function (e) { warn(e); throw e; });
  }
  function save(rec) { return tx('readwrite', function (os) { return os.put(rec); }); }
  function load(id)  { return tx('readonly',  function (os) { return os.get(id); }); }

  /* ---------- 지금 읽고 있는 위치 ---------- */
  var ACTIVE = ['on', 'active', 'current', 'shown', 'is-active'];

  function slides() {                          // 슬라이드 덱이면 슬라이드 목록, 아니면 null
    var sel = ['main > article', '.slide'];
    for (var i = 0; i < sel.length; i++) {
      var n = document.querySelectorAll(sel[i]);
      if (n.length > 1) return n;
    }
    return null;
  }
  function activeIndex(list) {                 // 활성 클래스 → URL 해시 순으로 판별
    for (var i = 0; i < list.length; i++) {
      var c = list[i].classList;
      for (var j = 0; j < ACTIVE.length; j++) if (c.contains(ACTIVE[j])) return i;
    }
    var id = location.hash.slice(1);
    try { id = decodeURIComponent(id); } catch (e) {}
    if (id) for (var k = 0; k < list.length; k++) if (list[k].id === id) return k;
    return -1;
  }
  function visibleIndex(list) {                // 전 슬라이드가 이어서 흐르는 덱용 보조 판별
    var best = -1, near = Infinity, h = window.innerHeight || 800;
    for (var i = 0; i < list.length; i++) {
      var r = list[i].getBoundingClientRect();
      if (r.bottom <= 0 || r.top >= h) continue;
      var d = Math.abs(r.top);
      if (d < near) { near = d; best = i; }
    }
    return best;
  }
  /* 한 장씩 그려내는 덱(stage.innerHTML = 슬라이드 하나)은 DOM에 슬라이드가
     늘 하나뿐이라 slides()가 null이다 — v2가 이런 덱 13종을 그냥 '긴 문서'로
     보고 scrollY 0만 저장해 책갈피가 아예 남지 않았다. 대신 화면의 쪽 표시
     ('7 / 503')를 읽어 몇 쪽인지 알아낸다.                                  */
  var cntEl = null;
  var CNT = /^\s*(\d+)\s*\/\s*(\d+)\s*$/;
  function counter() {
    if (cntEl && cntEl.isConnected && CNT.test(cntEl.textContent || '')) return cntEl;
    cntEl = null;
    var n = document.querySelectorAll('span, div, b, small, em, strong');
    for (var i = 0, lim = Math.min(n.length, 4000); i < lim; i++) {
      if (n[i].children.length) continue;
      var t = n[i].textContent || '';
      if (t.length > 16) continue;
      var m = CNT.exec(t);
      if (m && +m[2] > 1 && +m[1] >= 1 && +m[1] <= +m[2]) { cntEl = n[i]; break; }
    }
    return cntEl;
  }
  function vpage() {                           // 쪽 표시가 있으면 {page,total}, 없으면 null
    var e = counter();
    if (!e) return null;
    var m = CNT.exec(e.textContent || '');
    return m ? { page: +m[1], total: +m[2] } : null;
  }
  function heading() {                         // 긴 문서용 — 화면 상단을 지난 마지막 제목
    var hs = document.querySelectorAll('h1[id],h2[id],h3[id]'), out = '';
    for (var i = 0; i < hs.length; i++) {
      if (hs[i].getBoundingClientRect().top <= 90) out = '#' + hs[i].id; else break;
    }
    return out;
  }
  function snap() {
    var list = slides();
    if (list) {
      var i = activeIndex(list);
      if (i < 0) i = visibleIndex(list);
      if (i < 0) i = 0;
      var el = list[i];
      return { kind: 'slide', page: i + 1, total: list.length, scrollY: 0,
               hash: el.id ? '#' + el.id : '', ratio: (i + 1) / list.length };
    }
    var v = vpage();                           // 한 장씩 그려내는 덱
    if (v) {
      return { kind: 'slide', page: v.page, total: v.total, scrollY: 0,
               hash: location.hash.length > 1 ? location.hash : '',
               ratio: v.page / v.total };
    }
    var se = document.scrollingElement || document.documentElement;
    var max = Math.max(0, se.scrollHeight - se.clientHeight);
    var y = Math.round(se.scrollTop || window.pageYOffset || 0);
    return { kind: 'scroll', page: 0, total: 0, scrollY: y,
             hash: heading(), ratio: max ? Math.min(1, y / max) : 0 };
  }

  /* ---------- 자동 저장 ----------
     처음 상태는 기준선으로만 잡고 저장하지 않는다 — 첫 장으로 열자마자
     지난번 책갈피를 1쪽으로 덮어쓰지 않기 위해서다.                        */
  function sig(s) {
    return s.kind + ':' + s.page + ':' + (s.kind === 'scroll' ? Math.round(s.scrollY / 40) : 0);
  }
  var last = sig(snap());
  function tick(force) {
    if (document.hidden && !force) return;
    var s = snap(), cur = sig(s);
    if (cur === last) return;
    last = cur;
    s.id = FILE;
    s.title = (document.title || FILE).trim();
    s.updated = Date.now();
    // 저장이 실패하면 기준선을 풀어 다음 tick에서 다시 시도한다 — 연결이 끊겼다
    // 다시 붙는 동안 그 한 번의 위치가 통째로 사라지지 않도록.
    save(s).catch(function () { if (last === cur) last = ''; });
  }
  setInterval(tick, 1200);
  addEventListener('hashchange', function () { tick(); });
  addEventListener('visibilitychange', function () { if (document.hidden) tick(true); });
  addEventListener('pagehide', function () { tick(true); });

  /* ---------- 이어보기 ----------
     덱 엔진마다 이동 방식이 달라서 세 단계로 시도한다.
       ① 해시 지정 — hashchange를 듣는 엔진
       ② 다음/이전 버튼 클릭 또는 ←→ 키 — 해시를 안 듣는 한 장씩 엔진
       ③ scrollIntoView — 전 장이 이어서 흐르는 덱                        */
  function navBtn(dir) {
    var ids = dir > 0 ? ['nextBtn', 'btnNext', 'bNext', 'next', 'nextSlide']
                      : ['prevBtn', 'btnPrev', 'bPrev', 'prev', 'prevSlide'];
    for (var i = 0; i < ids.length; i++) {
      var e = document.getElementById(ids[i]);
      if (e && (e.tagName === 'BUTTON' || e.tagName === 'A')) return e;
    }
    return null;
  }
  function turn(dir) {
    var b = navBtn(dir);
    if (b) { if (!b.disabled) b.click(); return; }
    var k = dir > 0 ? 'ArrowRight' : 'ArrowLeft';
    document.dispatchEvent(new KeyboardEvent('keydown',
      { key: k, code: k, bubbles: true, cancelable: true }));
  }
  function step(target) {                      // 목표 쪽까지 한 장씩 넘긴다
    var guard = 400;
    (function next() {
      var l = slides();
      if (!l || --guard <= 0) return;
      var i = activeIndex(l);
      if (i < 0 || i === target) return;
      turn(i < target ? 1 : -1);
      setTimeout(function () {
        var l2 = slides();
        if (!l2) return;
        if (activeIndex(l2) === i) return;     // 안 움직이는 엔진이면 포기
        next();
      }, 30);
    })();
  }
  /* 한 장씩 그려내는 덱으로 돌아가기 —
       ① 엔진이 내놓은 window.__deckGo(0-기반 쪽 번호)  ② 해시  ③ 목차의 번호 입력칸
       ④ 다음/이전 버튼을 한 장씩(안 움직이면 즉시 포기)                       */
  function vjump(rec) {
    var target = rec.page;
    function at() { var v = vpage(); return v ? v.page : -1; }
    if (at() === target) return;
    if (typeof window.__deckGo === 'function') {
      try { window.__deckGo(target - 1); } catch (e) {}
      if (at() === target) return;
    }
    if (rec.hash && location.hash !== rec.hash) location.hash = rec.hash;
    setTimeout(function () {
      if (at() === target) return;
      var n = document.getElementById('jumpN'), g = document.getElementById('jumpGo');
      if (n && g) {
        n.value = String(target);
        try { g.click(); } catch (e) {}
        if (at() === target) return;
      }
      var guard = 1200;
      (function nextPage() {
        var from = at();
        if (from < 0 || from === target || --guard <= 0) return;
        turn(from < target ? 1 : -1);
        requestAnimationFrame(function () {
          if (at() === from) return;           // 안 움직이는 엔진이면 포기
          nextPage();
        });
      })();
    }, 150);
  }
  function jump(rec) {
    if (rec.kind !== 'slide') {
      var se = document.scrollingElement || document.documentElement;
      var max = Math.max(0, se.scrollHeight - se.clientHeight);
      var y = rec.scrollY <= max ? rec.scrollY : Math.round(rec.ratio * max);
      window.scrollTo({ top: y, behavior: 'smooth' });
      return;
    }
    var list = slides();
    if (!list) { vjump(rec); return; }
    var target = Math.min(list.length, Math.max(1, rec.page)) - 1;
    var el = (rec.hash && document.getElementById(rec.hash.slice(1))) || list[target];
    if (!el) return;
    var k = Array.prototype.indexOf.call(list, el);
    if (k >= 0) target = k;
    if (el.id && location.hash.slice(1) !== el.id) location.hash = '#' + el.id;
    setTimeout(function () {
      var l2 = slides();
      if (!l2) return;
      var i = activeIndex(l2);
      if (i === target) return;                // ① 해시로 이동 성공
      if (i >= 0) step(target);                // ② 한 장씩 넘기는 엔진
      else el.scrollIntoView({ block: 'start' });   // ③ 이어서 흐르는 덱
    }, 120);
  }
  function ago(t) {
    var d = Date.now() - t;
    if (d < 6e4)  return '방금 전';
    if (d < 36e5) return Math.floor(d / 6e4) + '분 전';
    if (d < 864e5) return Math.floor(d / 36e5) + '시간 전';
    if (d < 6048e5) return Math.floor(d / 864e5) + '일 전';
    return new Date(t).toLocaleDateString('ko-KR');
  }
  function bottomInset() {              // 화면 아래 고정 내비(◀ 1/67 ▶) 위로 띄우기
    var h = window.innerHeight || 800, gap = 14;
    if (!document.body) return gap;
    var list = [], c;
    for (c = document.body.firstElementChild; c; c = c.nextElementSibling) list.push(c);
    var extra = document.querySelectorAll('nav, footer');
    for (var i = 0; i < extra.length; i++) list.push(extra[i]);
    for (var j = 0; j < list.length; j++) {
      var n = list[j], t = n.tagName;
      if (t === 'SCRIPT' || t === 'STYLE' || t === 'LINK') continue;
      var cs = getComputedStyle(n);
      if (cs.position !== 'fixed' && cs.position !== 'sticky') continue;
      if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) === 0) continue;
      var r = n.getBoundingClientRect();
      if (!r.height || r.height > h * 0.5 || r.bottom < h - 4 || r.top > h) continue;
      gap = Math.max(gap, Math.round(h - r.top) + 10);
    }
    return gap;
  }
  function toast(rec) {
    var gap = bottomInset();
    var host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483000;pointer-events:none';
    var root = host.attachShadow ? host.attachShadow({ mode: 'open' }) : host;
    var where = rec.kind === 'slide'
      ? rec.page + ' / ' + rec.total + ' 쪽'
      : Math.round(rec.ratio * 100) + '% 지점';
    root.innerHTML =
      '<style>' +
      '.w{pointer-events:auto;display:flex;align-items:center;gap:10px;' +
      'margin:0 auto calc(' + gap + 'px + env(safe-area-inset-bottom,0px));' +
      'padding:10px 12px 10px 14px;max-width:min(94vw,460px);border-radius:14px;' +
      'background:rgba(18,28,40,.94);color:#eaf3fb;font:500 14px/1.4 -apple-system,BlinkMacSystemFont,' +
      '"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35);' +
      'animation:up .22s ease-out}' +
      '@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}' +
      '@media (prefers-reduced-motion:reduce){.w{animation:none}}' +
      '.t{flex:1;min-width:0}.t b{display:block;font-weight:700}' +
      '.t s{display:block;text-decoration:none;opacity:.72;font-size:12px;margin-top:2px}' +
      'button{font:inherit;border:0;border-radius:9px;padding:8px 12px;cursor:pointer}' +
      '.go{background:#4fc3f7;color:#06263a;font-weight:700}' +
      '.no{background:transparent;color:#9fb6c9;padding:8px 6px}' +
      '</style>' +
      '<div class="w"><span aria-hidden="true">🔖</span>' +
      '<div class="t"><b>지난번 ' + where + '까지 읽었어요</b><s>' + ago(rec.updated) + ' 저장됨</s></div>' +
      '<button class="go" type="button">이어보기</button>' +
      '<button class="no" type="button" aria-label="닫기">✕</button></div>';
    function close() { if (host.parentNode) host.parentNode.removeChild(host); }
    root.querySelector('.go').onclick = function () { close(); jump(rec); };
    root.querySelector('.no').onclick = close;
    document.body.appendChild(host);
    setTimeout(close, 15000);
  }

  /* 딥링크로 열었으면 안내하지 않는다.
     이때 location.hash는 못 쓴다 — 덱 엔진 대부분이 첫 장을 그리면서
     history.replaceState('#top')로 주소를 먼저 바꿔 놓기 때문에, 이 셸이
     도는 시점에는 늘 해시가 있는 것처럼 보인다(v1이 안내를 못 띄우던 원인).
     그래서 <head>에서 미리 잡아둔 진입 해시를 쓰고, 없으면 내비게이션
     타이밍의 원래 주소를 본다. */
  function openedWithHash() {
    if (typeof window.__deckInitHash === 'string') return window.__deckInitHash.length > 1;
    try {
      var e = performance.getEntriesByType('navigation')[0];
      if (e && e.name) return new URL(e.name).hash.length > 1;
    } catch (x) {}
    return !!location.hash;
  }
  function initHash() {
    if (typeof window.__deckInitHash === 'string' && window.__deckInitHash) return window.__deckInitHash;
    try {
      var e = performance.getEntriesByType('navigation')[0];
      if (e && e.name) return new URL(e.name).hash;
    } catch (x) {}
    return location.hash;
  }

  if (!openedWithHash()) {
    load(FILE).then(function (rec) {
      if (!rec) return;
      var worth = rec.kind === 'slide' ? rec.page > 1 : rec.scrollY > 200;
      if (!worth) return;
      // 덱이 스스로 지난 쪽을 복원해 이미 그 자리라면(주판 암산 교재 등) 굳이 묻지 않는다
      var now = snap();
      if (now.kind === rec.kind && rec.kind === 'slide' && now.page === rec.page) return;
      toast(rec);
    }).catch(function () {});
  } else {
    /* 포털의 🔖 링크처럼 '#s42'로 들어왔는데 엔진이 해시를 안 듣는 덱(한 장씩
       그려내는 6종)은 1쪽에 머문다 — 안내도 안 뜨니 그 쪽으로 옮겨준다. */
    var m = /^#s?(\d+)$/.exec(initHash() || '');
    if (m) setTimeout(function () {
      var v = slides() ? null : vpage();
      if (v && +m[1] >= 1 && +m[1] <= v.total && v.page !== +m[1])
        vjump({ page: +m[1], hash: initHash() });
    }, 250);
  }
})();
</script>
</body>
</html>
