<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- deck-bookmark: 덱 엔진이 replaceState로 주소를 바꾸기 전에 진입 해시를 잡아둔다 -->
<script>window.__deckInitHash=location.hash;</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🖥️ TELNET 대백과 — NVT·옵션 협상·실전 예제 파워유저 가이드북 (300+ 슬라이드)</title>
<meta name="description" content="TELNET 프로토콜의 역사(RFC 15→854)부터 NVT·IAC·옵션 협상, HTTP/SMTP/POP3 등 실전 raw 예제, Python·Go·TypeScript 구현과 혼합 사용, 보안, 라이브 데모까지 담은 동적 HTML 슬라이드 파워유저 가이드북">
<style>
  :root{
    --bg1:#0a1020; --bg2:#101a33; --panel:#131e38; --panel2:#0d1526;
    --ink:#e9eefb; --mut:#9fb2d6; --acc:#4fc3f7; --acc2:#8aa2ff;
    --line:rgba(140,170,225,.28); --line2:rgba(140,170,225,.14);
    --good:#7ce38b; --warn:#ffb454; --pink:#ff7a90; --purple:#e394ff;
    --mint:#94f5d0; --gold:#ffd166; --sky:#7dd3fc;
  }
  *{box-sizing:border-box}
  html{
    font-size:clamp(14px, 0.55vw + 0.55vh + 8px, 21px);
    -webkit-text-size-adjust:100%;
  }
  html{height:100%}
  body{
    margin:0; height:100%; overflow:hidden;
    color:var(--ink);
    background:radial-gradient(1200px 800px at 75% -10%, #1b2c55 0%, transparent 60%),
               radial-gradient(900px 700px at -10% 110%, #14264a 0%, transparent 55%),
               linear-gradient(160deg, var(--bg1), var(--bg2));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    line-height:1.62; word-break:keep-all;
  }
  #deck{display:flex; flex-direction:column; height:100%}
  #bar{height:4px; background:linear-gradient(90deg,var(--acc),var(--acc2)); width:0%; transition:width .25s; flex:none}

  header#top{
    flex:none; display:flex; align-items:center; gap:.7em;
    padding:.45em clamp(.8em,2.5vw,1.6em); border-bottom:1px solid var(--line2);
    background:rgba(10,16,32,.6); backdrop-filter:blur(8px);
  }
  header#top .brand{font-weight:800; letter-spacing:.02em; white-space:nowrap}
  header#top .brand small{color:var(--mut); font-weight:400}
  #secbadge{
    margin-left:auto; font-size:.78em; font-weight:700; padding:.15em .8em;
    border-radius:999px; border:1px solid var(--line); white-space:nowrap;
    min-width:0; overflow:hidden; text-overflow:ellipsis;
  }

  #stage{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    padding:clamp(.9em,2vh,1.6em) clamp(.9em,4vw,3em) 5.5em}
  .slide{max-width:1180px; margin:0 auto; animation:fadein .22s ease}
  @keyframes fadein{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

  .slide h1{font-size:clamp(1.35em,1.2em + 1.2vw,2.05em); line-height:1.25; margin:.1em 0 .55em}
  .slide h1 .no{color:var(--mut); font-size:.55em; font-weight:600; vertical-align:.35em; margin-right:.5em}
  .slide h2{font-size:1.18em; margin:1.1em 0 .45em; color:var(--sky)}
  .slide h3{font-size:1.02em; margin:.9em 0 .35em; color:var(--mint)}
  .slide p{margin:.45em 0}
  .slide ul,.slide ol{margin:.4em 0 .7em; padding-left:1.35em}
  .slide li{margin:.3em 0}
  .slide li>ul{margin:.15em 0}
  .slide strong{color:#fff}
  .slide em{color:var(--gold); font-style:normal}
  .slide a{color:var(--acc); text-decoration:none; border-bottom:1px dotted rgba(79,195,247,.5)}
  .slide a:hover{color:#9fe3ff}
  .mut{color:var(--mut)} .small{font-size:.85em}
  code{font-family:"SF Mono",Consolas,"D2Coding",monospace; background:rgba(80,120,200,.16);
       padding:.08em .38em; border-radius:6px; font-size:.9em}
  pre.code{
    background:#0a0f1e; border:1px solid var(--line2); border-radius:12px;
    padding:.9em 1.1em; overflow-x:auto; font-size:.82em; line-height:1.55;
    font-family:"SF Mono",Consolas,"D2Coding",monospace;
  }
  pre.code code{background:none; padding:0; font-size:1em}
  .cm{color:#6d82ab} .kw{color:#7dd3fc} .st{color:#a5e3a1} .nb{color:#ffd166}

  .fx{
    background:linear-gradient(120deg, rgba(79,195,247,.10), rgba(138,162,255,.08));
    border-left:4px solid var(--acc); border-radius:10px;
    padding:.7em 1em; margin:.7em 0; font-size:1.04em; overflow-x:auto;
  }
  .fx .big{font-size:1.25em}
  .note{
    background:rgba(255,180,84,.08); border-left:4px solid var(--warn);
    border-radius:10px; padding:.6em 1em; margin:.7em 0; font-size:.93em;
  }
  .tip{
    background:rgba(124,227,139,.08); border-left:4px solid var(--good);
    border-radius:10px; padding:.6em 1em; margin:.7em 0; font-size:.93em;
  }

  .cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr)); gap:1.1em; align-items:start}

  .tw{overflow-x:auto; margin:.6em 0}
  table.tbl{border-collapse:collapse; width:100%; font-size:.9em; min-width:480px}
  table.tbl th,table.tbl td{border:1px solid var(--line2); padding:.42em .7em; text-align:left; vertical-align:top}
  table.tbl th{background:rgba(79,195,247,.12); white-space:nowrap}
  table.tbl tr:nth-child(even) td{background:rgba(140,170,225,.05)}
  table.tt{min-width:0; text-align:center; font-family:Consolas,monospace}
  table.tt th,table.tt td{text-align:center; padding:.25em .7em}
  table.tt td.r1{color:var(--good); font-weight:700}
  table.tt td.r0{color:var(--mut)}

  .figrow{display:flex; flex-wrap:wrap; gap:1em; justify-content:center; margin:.8em 0}
  .figrow figure{flex:1 1 250px; max-width:460px}
  figure.ph{margin:.8em auto; text-align:center; max-width:640px}
  figure.ph img{
    max-width:100%; max-height:46vh; border-radius:12px;
    border:1px solid var(--line); background:#dfe6f2; object-fit:contain;
  }
  figure.ph figcaption{font-size:.8em; color:var(--mut); margin-top:.45em; line-height:1.45}
  figure.ph .src{opacity:.75}
  figure.broken img{display:none}
  figure.broken::before{
    content:"🖼️ 이미지를 불러오지 못했습니다 — 오프라인이거나 원본이 이동됨. 캡션 링크로 확인하세요.";
    display:block; padding:1.2em 1em; border:1.5px dashed var(--line);
    border-radius:12px; color:var(--mut); font-size:.85em;
  }

  .timeline{list-style:none; padding-left:0}
  .timeline li{
    margin:.34em 0; padding:.4em .8em .4em 1em; border-left:3px solid var(--acc2);
    background:rgba(138,162,255,.06); border-radius:0 10px 10px 0;
  }
  .timeline .yr{display:inline-block; min-width:4.4em; font-weight:800; color:var(--gold); font-family:Consolas,monospace}

  .links{list-style:none; padding-left:0}
  .links li{margin:.45em 0; padding:.5em .9em; background:var(--panel2);
    border:1px solid var(--line2); border-radius:10px}
  .links li .k{display:inline-block; font-size:.72em; font-weight:700; padding:0 .6em;
    border-radius:6px; margin-right:.6em; vertical-align:.1em}
  .k.doc{background:rgba(79,195,247,.18); color:var(--acc)}
  .k.paper{background:rgba(227,148,255,.18); color:var(--purple)}
  .k.video{background:rgba(255,122,144,.18); color:var(--pink)}
  .k.src{background:rgba(124,227,139,.18); color:var(--good)}
  .k.wiki{background:rgba(255,209,102,.18); color:var(--gold)}

  .demo{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:1em 1.1em; margin:.8em 0}
  .demo .row{display:flex; flex-wrap:wrap; gap:1em; align-items:flex-end; justify-content:center}
  .demo .cell{text-align:center}
  .demo .cell .lb{font-size:.78em; color:var(--mut); margin-top:.3em; font-family:Consolas,monospace}
  .demo canvas{image-rendering:pixelated; border-radius:8px; border:1px solid var(--line); background:#fff; max-width:100%; height:auto; touch-action:pan-y}
  .demo .ctl{display:flex; flex-wrap:wrap; gap:.6em .9em; align-items:center; justify-content:center; margin:.7em 0 .2em}
  .demo .op{font-size:1.4em; color:var(--gold); align-self:center}
  .demo button, .demo select, .demo input[type=number]{
    background:#1b2a4d; color:var(--ink); border:1px solid var(--line);
    border-radius:9px; padding:.42em .95em; font-size:.92em; cursor:pointer; font-family:inherit;
  }
  .demo button:hover{background:#253762}
  .demo button.on{background:var(--acc); color:#04223a; font-weight:700}
  .demo input[type=range]{width:min(280px,60vw); accent-color:var(--acc)}
  .demo .stat{font-family:Consolas,monospace; font-size:.9em; color:var(--mint); text-align:center; margin-top:.4em; min-height:1.3em}

  /* 표지 */
  .cover{text-align:center; padding-top:5vh}
  .cover .mega{
    font-size:clamp(2.3em, 2em + 3vw, 4.2em); font-weight:900; line-height:1.15; margin:.2em 0;
    background:linear-gradient(90deg,var(--acc),#b3e5ff,var(--acc2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .cover .sub{font-size:1.15em; color:var(--mut); max-width:38em; margin:0 auto 1.4em}
  .cover .chips{display:flex; flex-wrap:wrap; gap:.6em; justify-content:center; margin:1.2em 0}
  .cover .chips span{border:1px solid var(--line); border-radius:999px; padding:.3em 1em; font-size:.88em; background:rgba(19,30,56,.7)}

  /* 하단 내비 */
  nav#ctl{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; align-items:center; justify-content:center; gap:.55em;
    padding:.5em max(.8em, env(safe-area-inset-left)) calc(.5em + env(safe-area-inset-bottom));
    background:rgba(9,14,28,.82); backdrop-filter:blur(10px); border-top:1px solid var(--line2);
  }
  nav#ctl button{
    background:#182849; color:var(--ink); border:1px solid var(--line);
    border-radius:11px; min-width:2.9em; min-height:2.55em; font-size:1em; cursor:pointer;
  }
  nav#ctl button:hover{background:#22345e}
  nav#ctl button.wide{padding:0 1.05em}
  #cnt{font-family:Consolas,monospace; font-size:.95em; color:var(--mut); min-width:6.2em; text-align:center}

  /* 목차 오버레이 */
  #toc{
    position:fixed; inset:0; z-index:40; display:none; overflow-y:auto;
    background:rgba(7,11,23,.96); backdrop-filter:blur(10px);
    padding:1.2em clamp(1em,4vw,3em) 3em;
  }
  #toc.open{display:block}
  #toc .tochead{display:flex; align-items:center; gap:1em; flex-wrap:wrap; margin-bottom:1em}
  #toc h2{margin:.2em 0; font-size:1.4em}
  #toc .close{margin-left:auto; font-size:1.1em; background:#182849; color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:.45em 1.1em; cursor:pointer}
  #toc .jump{display:flex; gap:.5em; align-items:center; font-size:.9em; color:var(--mut)}
  #toc .jump input{width:5.5em; background:#101b36; border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:.4em .6em; font-size:1em}
  #toc h3{margin:1.1em 0 .4em; font-size:1.02em}
  #toc .tgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr)); gap:.45em}
  #toc .tgrid button{
    text-align:left; background:var(--panel2); color:var(--ink); border:1px solid var(--line2);
    border-radius:9px; padding:.42em .7em; font-size:.83em; cursor:pointer; line-height:1.4;
    font-family:inherit;
  }
  #toc .tgrid button:hover{border-color:var(--acc); background:#152442}
  #toc .tgrid button .n{color:var(--mut); font-family:Consolas,monospace; margin-right:.5em; font-size:.85em}
  #toc .tgrid button.cur{border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset}

  /* 좁은 화면(폴드 커버·폰) */
  @media (max-width:640px){
    #stage{padding:1em .85em 5.6em}
    nav#ctl button.wide{padding:0 .7em}
    #cnt{min-width:5em; font-size:.85em}
    table.tbl{font-size:.82em}
  }
  /* 정사각형에 가까운 화면(갤럭시 폴드 펼침 등): 좌우 여백을 살짝 늘려 줄길이 확보 */
  @media (min-aspect-ratio:4/5) and (max-aspect-ratio:5/4) and (min-width:700px){
    .slide{max-width:min(1180px, 94vw)}
    figure.ph img{max-height:40vh}
  }
  @media (hover:none){ nav#ctl button:hover{background:#182849} }

  /* 텔넷 데모 */
  .demo textarea, .demo input[type=text]{
    width:100%; background:#0a0f1e; color:var(--ink); border:1px solid var(--line);
    border-radius:9px; padding:.55em .7em; font-family:"SF Mono",Consolas,"D2Coding",monospace;
    font-size:.9em; resize:vertical;
  }
  .demo .field{display:flex; flex-wrap:wrap; gap:.5em .9em; align-items:center; margin:.5em 0}
  .demo .field label{font-size:.85em; color:var(--mut); min-width:3.4em}
  .demo .samples{display:flex; flex-wrap:wrap; gap:.5em; margin:.55em 0}
  .demo .out{background:#0a0f1e; border:1px solid var(--line2); border-radius:10px;
    padding:.7em .9em; margin-top:.6em; font-family:"SF Mono",Consolas,"D2Coding",monospace;
    font-size:.85em; line-height:1.7; white-space:pre-wrap; word-break:break-all; overflow-x:auto}
  .demo .out b{color:#9fe3ff; font-weight:600}
  .dl{padding:.12em 0; border-bottom:1px dashed var(--line2)}
  .dl:last-child{border-bottom:none}
  .tg{display:inline-block; font-size:.72em; font-weight:700; padding:.05em .5em; border-radius:6px; margin-right:.5em}
  .tg.data{background:rgba(124,227,139,.18); color:var(--good)}
  .tg.cmd{background:rgba(79,195,247,.18); color:var(--acc)}
  .tg.sb{background:rgba(227,148,255,.18); color:var(--purple)}
  .kbd{display:inline-block; background:#1b2a4d; border:1px solid var(--line); border-bottom-width:2px;
    border-radius:6px; padding:0 .45em; font-family:Consolas,monospace; font-size:.85em}
</style>
</head>
<body>
<div id="deck">
  <div id="bar"></div>
  <header id="top">
    <span class="brand">🖥️ TELNET 대백과 <small>— NVT · Options · Power User Guide</small></span>
    <span id="secbadge"></span>
  </header>
  <main id="stage" aria-live="polite"></main>
  <nav id="ctl">
    <button id="bFirst" title="처음 (Home)">⏮</button>
    <button id="bPrev" class="wide" title="이전 (←)">◀ 이전</button>
    <span id="cnt">- / -</span>
    <button id="bNext" class="wide" title="다음 (→ / Space)">다음 ▶</button>
    <button id="bLast" title="끝 (End)">⏭</button>
    <button id="bToc" class="wide" title="목차 (T)">📑 목차</button>
  </nav>
</div>

<div id="toc">
  <div class="tochead">
    <h2>📑 전체 목차</h2>
    <div class="jump">
      <label for="jumpN">번호 이동:</label>
      <input id="jumpN" type="number" min="1" inputmode="numeric">
      <button class="close" id="jumpGo" style="margin-left:0;padding:.4em .8em">이동</button>
    </div>
    <button class="close" id="tocClose">✕ 닫기 (Esc)</button>
  </div>
  <div id="tocBody"></div>
</div>

<script>
'use strict';
/* ============================================================
 * TELNET 대백과 — 동적 슬라이드 덱
 * 슬라이드는 아래 S 배열 + 자동 생성 옵션 카탈로그(0~255)로 구성.
 * ============================================================ */

/* ---------- 섹션 정의(배지 색) ---------- */
var SECS = {
  '표지':'#4fc3f7', '개요':'#7ce38b', '역사':'#ffb454', 'RFC':'#e394ff',
  '프로토콜':'#ff7a90', '옵션':'#8aa2ff', '예제':'#ffd166', 'Python':'#7dd3fc',
  'Go':'#94f5d0', 'TypeScript':'#b3e5ff', '혼합':'#ff9e64', '보안':'#ff5d73',
  '데모':'#ffd166', '도구':'#7ce38b', '자료':'#94f5d0', '마무리':'#4fc3f7'
};

/* ---------- 헬퍼 ---------- */
var FP = 'https://commons.wikimedia.org/wiki/Special:FilePath/';
var FILE = 'https://commons.wikimedia.org/wiki/File:';
function fig(name, cap, wpx){
  var u = FP + encodeURIComponent(name) + '?width=' + (wpx || 800);
  var p = FILE + encodeURIComponent(name);
  return '<figure class="ph"><a href="' + p + '" target="_blank" rel="noopener">' +
    '<img loading="lazy" src="' + u + '" alt="' + cap.replace(/"/g,'&quot;') + '"' +
    ' onerror="this.closest(\'figure\').classList.add(\'broken\')"></a>' +
    '<figcaption>' + cap + ' <span class="src">— <a href="' + p + '" target="_blank" rel="noopener">Wikimedia Commons</a></span></figcaption></figure>';
}
function figrow(){ return '<div class="figrow">' + Array.prototype.join.call(arguments,'') + '</div>'; }
function lk(u, t){ return '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>'; }
function li(kind, u, t, d){
  return '<li><span class="k ' + kind + '">' + kind.toUpperCase() + '</span>' +
         lk(u, t) + (d ? ' <span class="mut small">— ' + d + '</span>' : '') + '</li>';
}

/* ---------- 슬라이드 데이터 ---------- */
var S = [];
function sl(sec, title, html){ S.push({s:sec, t:title, h:html}); }

var TELOPTS = {
  0:['BINARY','8비트 바이너리 전송','856'], 1:['ECHO','에코','857'],
  2:['RCP','재접속(Reconnection)',''], 3:['SUPPRESS-GO-AHEAD','GA 억제','858'],
  4:['APPROX-MSG-SIZE','대략적 메시지 크기 협상',''], 5:['STATUS','옵션 상태','859'],
  6:['TIMING-MARK','타이밍 마크','860'], 7:['RCTE','원격 제어 송신·에코','726'],
  8:['NAOL','출력 라인 폭',''], 9:['NAOP','출력 페이지 크기',''],
  10:['NAOCRD','CR 처리','652'], 11:['NAOHTS','수평 탭 위치','653'],
  12:['NAOHTD','수평 탭 처리','654'], 13:['NAOFFD','폼피드 처리','655'],
  14:['NAOVTS','수직 탭 위치','656'], 15:['NAOVTD','수직 탭 처리','657'],
  16:['NAOLFD','라인피드 처리','658'], 17:['EXTEND-ASCII','확장 ASCII','698'],
  18:['LOGOUT','강제 로그아웃','727'], 19:['BM','바이트 매크로','735'],
  20:['DET','데이터 입력 단말','1043'], 21:['SUPDUP','SUPDUP 프로토콜','736'],
  22:['SUPDUP-OUTPUT','SUPDUP 출력','749'], 23:['SEND-LOCATION','위치 전송','779'],
  24:['TERMINAL-TYPE','단말 종류','1091'], 25:['END-OF-RECORD','레코드 종료','885'],
  26:['TUID','TACACS 사용자 ID','927'], 27:['OUTMRK','출력 마킹','933'],
  28:['TTYLOC','단말 위치 번호','946'], 29:['3270-REGIME','3270 레짐','1041'],
  30:['X.3-PAD','X.3 PAD','1053'], 31:['NAWS','창 크기 협상','1073'],
  32:['TERMINAL-SPEED','단말 속도','1079'], 33:['TOGGLE-FLOW-CONTROL','흐름 제어 토글','1372'],
  34:['LINEMODE','라인 모드','1184'], 35:['X-DISPLAY-LOCATION','X 디스플레이 위치','1096'],
  36:['ENVIRON','환경 변수(구)','1408'], 37:['AUTHENTICATION','인증','2941'],
  38:['ENCRYPTION','암호화','2946'], 39:['NEW-ENVIRON','환경 변수(신)','1572'],
  40:['TN3270E','TN3270 확장','2355'], 41:['XAUTH','X 인증',''],
  42:['CHARSET','문자 집합 협상','2066'], 43:['RSP','원격 시리얼 포트',''],
  44:['COM-PORT-OPTION','COM 포트 제어','2217'], 45:['SUPPRESS-LOCAL-ECHO','로컬 에코 억제',''],
  46:['START-TLS','TLS 시작',''], 47:['KERMIT','Kermit','2840'],
  48:['SEND-URL','URL 전송',''], 49:['FORWARD_X','X11 포워딩',''],
  138:['PRAGMA-LOGON','Pragma 로그온',''], 139:['SSPI-LOGON','SSPI 로그온',''],
  140:['PRAGMA-HEARTBEAT','Pragma 하트비트',''],
  255:['EXTENDED-OPTIONS-LIST','확장 옵션 목록','861']
};
function buildOptCatalog(){
  var per = 16, groups = 256 / per;
  for (var g = 0; g < groups; g++){
    var lo = g * per, hi = lo + per - 1;
    var rows = '';
    for (var c = lo; c <= hi; c++){
      var o = TELOPTS[c];
      if (o){
        var rfc = o[2] ? '<a href="https://www.rfc-editor.org/rfc/rfc' + o[2] + '" target="_blank" rel="noopener">RFC ' + o[2] + '</a>' : '<span class="mut">—</span>';
        rows += '<tr><td class="r1">' + c + '</td><td><code>0x' + (c<16?'0':'') + c.toString(16).toUpperCase() +
          '</code></td><td><strong>' + o[0] + '</strong></td><td>' + o[1] + '</td><td>' + rfc + '</td></tr>';
      } else {
        rows += '<tr><td class="r0">' + c + '</td><td><code>0x' + (c<16?'0':'') + c.toString(16).toUpperCase() +
          '</code></td><td class="mut" colspan="3">미할당(Unassigned)</td></tr>';
      }
    }
    sl('옵션', '옵션 카탈로그 ' + lo + '–' + hi, '<h1><span class="no">OPT</span>텔넷 옵션 코드 ' + lo + '–' + hi + '</h1>' +
      '<p class="mut small">IANA <em>Telnet Options</em> 레지스트리 기준. <code>IAC WILL/WONT/DO/DONT &lt;code&gt;</code> 로 협상.</p>' +
      '<div class="tw"><table class="tbl"><thead><tr><th>10진</th><th>16진</th><th>이름</th><th>의미</th><th>정의</th></tr></thead><tbody>' +
      rows + '</tbody></table></div>');
  }
}

sl('개요','클라이언트/서버 모델과 대칭성', `
<h1><span class="no">1.4</span>클라이언트·서버 모델과 대칭성</h1>

<div class="cols">
<div>
<div class="tip">raw 텍스트 용도(HTTP 등)에서는 <strong>[2] 옵션 협상을 서버가 안 보내고</strong> 곧장 [3]으로 갑니다. 그래서 telnet이 만능 소켓처럼 쓰입니다.</div>
</div>
<div>
<div class="note">진짜 TELNET 서버에 붙으면 접속 직후 화면에 <code>IAC</code> 바이트(0xFF…)들이 지나가는데, telnet 클라이언트가 이를 <em>가로채 협상</em>하고 사용자에겐 안 보여줍니다.</div>
</div>
</div>`);

sl('개요','문자 단위 vs 줄 단위 모드', `
<h1><span class="no">1.6</span>문자 단위 vs 줄 단위 모드</h1>
<p>키를 누를 때 <strong>언제 상대에게 전송하느냐</strong>가 두 모드를 가릅니다. (상세 협상은 <em>프로토콜 장</em>에서 다룹니다 — 여기선 개념만.)</p>
<div class="tw"><table class="tbl">
<thead><tr><th></th><th>줄 단위(line-at-a-time)</th><th>문자 단위(character-at-a-time)</th></tr></thead>
<tbody>
<tr><td>전송 시점</td><td>엔터를 칠 때 <strong>한 줄씩</strong></td><td>키 하나 누를 때마다 <strong>즉시</strong></td></tr>
<tr><td>에코(화면 표시)</td><td>로컬(내 telnet)이 처리</td><td>원격 서버가 <code>ECHO</code>로 되돌려줌</td></tr>
<tr><td>필요 옵션</td><td>기본 상태</td><td><code>ECHO</code>(1) + <code>SGA</code>(3) 협상</td></tr>
<tr><td>쓰임새</td><td>단순 명령 입력, 대역폭 절약</td><td>vi·탭완성·화살표 등 <em>대화형</em> 셸</td></tr>
</tbody></table></div>
<div class="fx">문자 단위 모드는 서버가 <span class="tg cmd">IAC WILL ECHO</span> + <span class="tg cmd">IAC WILL SGA</span>를 성사시켰을 때 켜집니다.</div>
<p class="mut small">바이트 수준의 협상 시퀀스와 상태 전이는 §옵션 협상 장에서 상세히 해부합니다.</p>`);

sl('개요','telnet 명령 기본 사용법', `
<h1><span class="no">1.7</span>telnet 명령 기본 사용법</h1>
<p>문법은 단순합니다: <code>telnet <em>host</em> [<em>port</em>]</code>. 포트를 생략하면 <code>23</code>입니다.</p>
<pre class="code"><code><span class="cm"># 접속 (포트 생략 = 23)</span>
$ telnet towel.blinkenlights.nl

<span class="cm"># 임의 포트 지정: SMTP 서버 두드리기</span>
$ telnet smtp.example.com 25
Trying 203.0.113.9...
Connected to smtp.example.com.
Escape character is '^]'.
220 mail.example.com ESMTP Postfix
<b>HELO test.local</b>
250 mail.example.com
<b>QUIT</b>
221 2.0.0 Bye
Connection closed by foreign host.</code></pre>
<div class="cols">
<div>
<h3>탈출·제어</h3>
<ul>
<li><span class="kbd">Ctrl+]</span> — <strong>escape 문자</strong>. telnet 명령 프롬프트(<code>telnet&gt;</code>)로 빠져나옴</li>
<li><code>telnet&gt;</code>에서 <code>quit</code> (또는 <code>q</code>) — 세션 종료</li>
<li><code>telnet&gt;</code>에서 <code>close</code> — 연결만 끊기</li>
</ul>
</div>
<div>
<div class="note">데이터가 <span class="kbd">Ctrl+]</span> 바이트(0x1D)를 포함하면 협상이 꼬일 수 있습니다. 바이너리 전송엔 telnet 대신 <code>nc</code>가 안전합니다.</div>
</div>
</div>`);

sl('개요','telnet vs netcat vs SSH', `
<h1><span class="no">1.8</span>telnet vs netcat(nc) vs SSH</h1>
<div class="tw"><table class="tbl">
<thead><tr><th>기준</th><th>telnet</th><th>netcat (nc)</th><th>SSH</th></tr></thead>
<tbody>
<tr><td>주 용도</td><td>원격 로그인 / 텍스트 프로토콜 대화</td><td>범용 TCP·UDP 파이프</td><td>보안 원격 셸·터널</td></tr>
<tr><td>암호화</td><td><strong>없음(평문)</strong></td><td>없음</td><td><strong>있음</strong></td></tr>
<tr><td>옵션 협상(IAC)</td><td>해석·응답함</td><td>안 함(바이트 그대로)</td><td>해당 없음</td></tr>
<tr><td>바이너리 안전</td><td>△ (0xFF 등 특수 처리)</td><td><strong>○ 완전 투명</strong></td><td>○</td></tr>
<tr><td>기본 포트</td><td>23</td><td>지정 필수</td><td>22</td></tr>
<tr><td>추천 쓰임</td><td>진짜 TELNET 서버, 학습</td><td>스크립트·raw 소켓·전송</td><td>실서비스 로그인</td></tr>
</tbody></table></div>
<div class="tip">텍스트 프로토콜 디버깅에는 <code>nc host port</code>가 telnet보다 <strong>협상 잡음이 없어</strong> 더 깔끔한 경우가 많습니다. 단, 대화형 라인 편집·에코는 telnet이 편합니다.</div>`);

sl('개요','언제 쓰고 언제 쓰면 안 되는가', `
<h1><span class="no">1.9</span>언제 쓰고, 언제 쓰면 안 되는가</h1>
<div class="cols">
<div>
<h2 style="color:#7fe">써도 좋은 경우</h2>
<ul>
<li>텍스트 프로토콜(HTTP/SMTP/POP3/IRC…) <strong>수동 디버깅</strong></li>
<li>포트 개방·연결성 <strong>빠른 확인</strong></li>
<li>격리망의 레거시 장비(라우터·스위치·BBS) 콘솔</li>
<li>프로토콜 <strong>학습·실습</strong></li>
</ul>
</div>
<div>
<h2 style="color:#f88">쓰면 안 되는 경우</h2>
<ul>
<li><strong>인터넷 너머 로그인</strong> — 아이디·비밀번호가 <em>평문</em>으로 흐름</li>
<li>운영 서버 원격 관리 → 반드시 <strong>SSH</strong></li>
<li>공용 Wi-Fi·신뢰 못 할 네트워크에서의 인증</li>
</ul>
</div>
</div>
<div class="note"><strong>보안 경고</strong>: TELNET에는 암호화도, 무결성 검증도 없습니다. 같은 네트워크의 누구나 패킷을 스니핑해 자격증명을 그대로 읽을 수 있습니다. 원격 <em>로그인</em> 목적의 TELNET은 사실상 폐기되었으며, 대체재는 <strong>SSH(포트 22)</strong>입니다.</div>
<div class="fx">기억법: <strong>telnet은 "말"을 배우는 도구, "로그인"은 SSH로.</strong></div>`);

sl('개요','인밴드 시그널링 맛보기', `
<h1><span class="no">1.10</span>인밴드 시그널링 맛보기 — IAC</h1>
<p>TELNET은 <strong>제어 신호와 실제 데이터를 같은 스트림</strong>에 섞어 보냅니다(in-band signaling). 이 둘을 가르는 마법의 바이트가 <span class="tg cmd">IAC</span>입니다.</p>
<div class="fx big"><code>IAC</code> = <strong>Interpret As Command</strong> = <code>255</code> = <code>0xFF</code></div>
<pre class="code"><code><span class="cm"># 데이터 흐름에서 0xFF를 만나면 "다음은 명령"</span>
... 데이터 ... <span class="kw">FF</span> <span class="kw">FB</span> <span class="nb">01</span> ... 데이터 ...
                └IAC └WILL └ECHO(옵션 1)

<span class="cm"># 데이터로 진짜 0xFF 바이트를 보내려면 두 번 겹쳐 이스케이프</span>
데이터의 0xFF  ==&gt;  전송 시  FF FF</code></pre>
<div class="cols">
<div>
<h3>명령 동사(맛보기)</h3>
<ul>
<li><span class="tg cmd">WILL</span> 251 · <span class="tg cmd">WONT</span> 252</li>
<li><span class="tg cmd">DO</span> 253 · <span class="tg cmd">DONT</span> 254</li>
<li><span class="tg sb">SB</span> 250 … <span class="tg sb">SE</span> 240 (하위협상)</li>
</ul>
</div>
<div>
<div class="tip">이 "인밴드 + 이스케이프" 설계는 §프로토콜 장에서 바이트 단위로 완전 해부합니다. 지금은 <strong>0xFF가 특별하다</strong>는 것만 기억하세요.</div>
</div>
</div>`);

sl('개요','이 프로토콜이 낳은 후손들', `
<h1><span class="no">1.11</span>이 프로토콜이 낳은 후손들</h1>
<p>TELNET이 정립한 <strong>"TCP 위에서 CRLF로 끝나는 ASCII 라인을 주고받는다"</strong>는 패턴은 이후 수많은 프로토콜의 <em>공통 문법</em>이 됐습니다.</p>
<ul class="timeline">
<li><span class="yr">1971</span> <strong>TELNET / FTP</strong> — FTP 제어 채널은 사실상 TELNET NVT 위에서 명령을 주고받음</li>
<li><span class="yr">1982</span> <strong>SMTP</strong> — <code>HELO/MAIL/RCPT/DATA</code>, 3자리 응답코드, CRLF 라인</li>
<li><span class="yr">1984</span> <strong>POP</strong> · 이후 <strong>IMAP</strong> — 라인 기반 메일 수신</li>
<li><span class="yr">1988</span> <strong>IRC</strong> — 텍스트 라인 명령으로 실시간 채팅</li>
<li><span class="yr">1991</span> <strong>HTTP</strong> — 요청줄 + 헤더 + 빈 줄, 모두 CRLF (0.9/1.0/1.1)</li>
</ul>
<div class="fx">한 줄 = 한 명령, <code>CRLF</code>가 구분자, 응답은 <strong>사람이 읽을 수 있는 상태코드</strong> — 이 DNA가 전부 TELNET NVT에서 왔습니다.</div>
<p class="mut small">그래서 telnet 하나만 익혀두면 이 후손들을 모두 손으로 말해볼 수 있습니다(§예제 장).</p>`);

sl('개요','용어 사전 미니 표', `
<h1><span class="no">1.12</span>용어 사전 미니 표</h1>
<p>개요에서 스친 약어들을 한자리에. 각 항목은 뒷장에서 정식으로 다룹니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>약어</th><th>전체 이름</th><th>한 줄 뜻</th></tr></thead>
<tbody>
<tr><td><code>NVT</code></td><td>Network Virtual Terminal</td><td>양끝이 공유하는 가상 단말 규격(ASCII)</td></tr>
<tr><td><code>IAC</code></td><td>Interpret As Command</td><td>제어 시작 바이트, 0xFF(255)</td></tr>
<tr><td>option</td><td>Telnet Option</td><td><code>ECHO</code>·<code>SGA</code>·<code>NAWS</code> 등 기능 스위치(코드 0–255)</td></tr>
<tr><td>subnegotiation</td><td>Sub-negotiation</td><td>옵션의 세부 파라미터 교환: <code>IAC SB … IAC SE</code></td></tr>
<tr><td><code>GA</code></td><td>Go Ahead</td><td>반이중 회선에서 "당신 차례" 신호(249)</td></tr>
<tr><td><code>SGA</code></td><td>Suppress Go Ahead</td><td>GA 생략 — 사실상 전이중 대화(옵션 3)</td></tr>
<tr><td><code>DM</code></td><td>Data Mark</td><td>Synch 신호와 함께 오는 표식 바이트(242)</td></tr>
<tr><td><code>WILL/WONT/DO/DONT</code></td><td>협상 4동사</td><td>옵션을 켤지/끌지 양방향으로 합의(251–254)</td></tr>
</tbody></table></div>
<p class="mut small">전체 명령/옵션 코드표는 §옵션 카탈로그 장에 있습니다.</p>`);

sl('개요','개요 요약과 다음 장 예고', `
<h1><span class="no">1.13</span>개요 요약 · 다음 장 예고</h1>
<div class="fx big">TELNET = <strong>TCP 23</strong> 위의 <strong>대칭적 텍스트 스트림</strong> + <strong>IAC 옵션 협상</strong>. 로그인은 SSH에 넘겼지만, <em>텍스트 프로토콜의 조상이자 만능 디버깅 소켓</em>으로 살아 있다.</div>
<div class="cols">
<div>
<h3>이 장에서 챙길 것</h3>
<ul>
<li>telnet의 <strong>두 얼굴</strong>(로그인 프로토콜 / raw 텍스트 클라이언트)</li>
<li>접속 4단계: <strong>3-way → 협상 → 데이터 → 종료</strong></li>
<li><code>telnet host [port]</code>, 탈출은 <span class="kbd">Ctrl+]</span> → <code>quit</code></li>
<li><strong>보안</strong>: 평문 — 실로그인 금지, SSH 사용</li>
<li><code>IAC</code>(0xFF)로 제어/데이터를 구분하는 인밴드 시그널링</li>
</ul>
</div>
<div>
<h3>다음 장 예고</h3>
<ul>
<li><strong>§역사</strong> — RFC 15에서 854까지 반세기 표준사</li>
<li><strong>§프로토콜</strong> — NVT·IAC·CRLF의 실제 바이트</li>
<li><strong>§옵션 협상</strong> — <code>WILL/DO</code> 상태기계(RFC 1143)</li>
<li><strong>§예제</strong> — HTTP·SMTP raw 세션 실습</li>
</ul>
</div>
</div>
<div class="tip">이제 "무엇"과 "왜"를 알았으니, 다음 장부터 "어떻게"를 <strong>바이트 단위</strong>로 파고듭니다.</div>`);

sl('역사','ARPANET과 원격 로그인의 필요', `
<h1><span class="no">2.1</span>1969: ARPANET, 그리고 "남의 컴퓨터에 앉기"</h1>
<p>1969년 가을, 미 국방부 ARPA의 자금으로 <strong>ARPANET</strong>의 첫 4개 노드(UCLA·SRI·UCSB·Utah)가 연결됐다. 당시 컴퓨터는 <em>희소하고 비쌌으며</em>, 각각 성격이 완전히 달랐다. UCLA의 사용자가 SRI의 값비싼 시분할(time-sharing) 호스트를 쓰려면 <strong>네트워크 너머의 단말처럼</strong> 로그인할 방법이 있어야 했다.</p>
<div class="fx big">TELNET의 최초 존재 이유 = <strong>원격 시분할 호스트에 대한 가상 단말 접속</strong></div>
<div class="cols">
<div>
<h3>당시 풀어야 할 문제</h3>
<ul>
<li>호스트마다 <em>다른 문자셋·다른 단말 규약</em></li>
<li>물리 단말(Teletype Model 33 등)의 종류가 제각각</li>
<li>회선·속도·에코 정책이 사이트마다 상이</li>
</ul>
</div>
<div>
<div class="tip"><strong>이름의 유래</strong><br><code>TELNET</code>은 "<em>TEL</em>etype <em>NET</em>work" 혹은 "<em>tel</em>ecommunication <em>net</em>work"에서 온 조어로, ARPANET 초기 문서에서 원격 단말 접속 프로토콜을 가리키는 말로 굳었다.</div>
</div>
</div>
<p class="mut small">TELNET은 ARPANET 최초의 애플리케이션 계층 프로토콜 중 하나로, FTP·SMTP·HTTP 등 이후 모든 텍스트 프로토콜의 <strong>공통 조상</strong>이 된다.</p>`);

sl('역사','초기 ad-hoc telnet과 RFC 15', `
<h1><span class="no">2.2</span>1969–1971: 임시변통 telnet과 RFC 15</h1>
<p>표준이 서기 전, 각 사이트는 <strong>ad-hoc</strong>으로 원격 로그인을 붙였다. 1969년 9월 발표된 <em>RFC 15 — "Network Subsystem for Time Sharing Hosts"</em>(C. S. Carr)는 원격 호스트의 시분할 시스템에 접속하는 초기 발상을 담은 <strong>가장 이른 TELNET 관련 문서</strong> 중 하나였다.</p>
<ul class="timeline">
<li><span class="yr">1969.04</span> RFC 1 발행 — ARPANET 문서 문화(RFC) 시작</li>
<li><span class="yr">1969.09</span> <strong>RFC 15</strong> — 시분할 호스트용 네트워크 서브시스템 구상</li>
<li><span class="yr">1969.10.29</span> 최초 ARPANET 메시지 전송(UCLA→SRI), "lo"에서 크래시</li>
<li><span class="yr">1970</span> NCP(Network Control Program) 등장으로 호스트 간 연결 안정화</li>
<li><span class="yr">1971</span> 사이트별 임시 telnet 구현이 난립 → 표준화 압력 증가</li>
</ul>
<div class="note">초기 telnet은 <em>연결마다 동작이 달랐다</em>. "내 단말이 상대 호스트에서 어떻게 보일지"를 표준화하지 못한 것이 가장 큰 혼란이었고, 이는 곧 <strong>NVT</strong> 개념으로 이어진다.</div>`);

sl('역사','RFC 137/139과 New Telnet 논쟁', `
<h1><span class="no">2.3</span>1971: RFC 137/139 — 첫 공식 명세</h1>
<p>1971년, TELNET은 처음으로 <strong>공식 프로토콜 명세</strong>를 얻는다. <em>RFC 137</em>(1971.04.30, T. O'Sullivan)이 초기 TELNET 프로토콜을, <em>RFC 139</em>가 관련 논의를 정리했다. 이 초기 명세는 이후 "<strong>Old Telnet</strong>"으로 불린다.</p>
<ul class="timeline">
<li><span class="yr">1971.04.30</span> <strong>RFC 137</strong> — 첫 TELNET 프로토콜 명세(Old Telnet)</li>
<li><span class="yr">1971.05</span> <strong>RFC 139</strong> — TELNET 프로토콜 논의</li>
<li><span class="yr">1971~1972</span> "New Telnet" 논쟁 — 옵션 협상·대칭성 재설계 요구</li>
<li><span class="yr">1972</span> RFC 318 — TELNET 명세 정리, 협상 프레임워크 태동</li>
</ul>
<div class="cols">
<div>
<div class="note"><strong>Old Telnet의 한계</strong>
<ul>
<li>제어 신호가 뒤섞여 파싱이 취약</li>
<li>단말 능력 차이를 협상할 방법 부재</li>
<li>비대칭(서버/클라 역할 고정) 설계</li>
</ul></div>
</div>
<div>
<div class="tip"><strong>New Telnet의 방향</strong>
<ul>
<li><strong>NVT</strong>를 중심에 둔 대칭 프로토콜</li>
<li><code>IAC</code>(0xFF) 이스케이프로 제어/데이터 분리</li>
<li><em>옵션 협상</em>으로 능력을 동적으로 합의</li>
</ul></div>
</div>
</div>`);

sl('역사','NVT — 네트워크 가상 단말의 탄생', `
<h1><span class="no">2.4</span>왜 NVT(Network Virtual Terminal)였나</h1>
<p>단말 종류가 수십 가지인데 호스트마다 그것을 다 알 수는 없었다. 해법은 <strong>가상의 표준 단말을 하나 정의</strong>하고, 양쪽 모두 그 가상 단말과만 대화하게 하는 것. 이것이 <strong>NVT(Network Virtual Terminal)</strong>다.</p>
<div class="fx big">각 끝단은 자신의 실제 단말 ↔ <strong>NVT</strong> 로만 번역하면 된다 → N×N 문제를 N×1 로 축소</div>
<div class="tw"><table class="tbl">
<thead><tr><th>NVT 규약</th><th>내용</th></tr></thead>
<tbody>
<tr><td>문자셋</td><td>7비트 US-ASCII를 8비트 옥텟에 실어 전송</td></tr>
<tr><td>줄바꿈</td><td><code>CR</code> 뒤엔 반드시 <code>LF</code> 또는 <code>NUL</code> (<code>0x0D 0x0A</code> / <code>0x0D 0x00</code>)</td></tr>
<tr><td>프린터+키보드</td><td>양방향 대칭, 논리적 "가상 단말" 모델</td></tr>
<tr><td>제어</td><td>기본 능력은 최소로, 나머지는 <em>옵션 협상</em>으로 확장</td></tr>
</tbody></table></div>
<div class="note">NVT의 "<code>CR</code>은 <code>LF</code>나 <code>NUL</code>을 동반한다"는 규칙은 오늘날 HTTP·SMTP가 줄 끝에 <code>\\r\\n</code>을 쓰는 관습의 <strong>직접적 뿌리</strong>다.</div>`);

sl('역사','옵션 협상 메커니즘의 도입', `
<h1><span class="no">2.5</span>1973: 옵션 협상은 왜 필요했나</h1>
<p>NVT를 "최소 공통분모"로 두되, 양쪽이 원하면 능력을 <em>추가</em>할 수 있어야 했다(에코 위치, 바이너리 전송, 단말 종류 등). 그래서 <strong>WILL/WON'T/DO/DON'T</strong> 4동사 협상이 도입됐다. RFC 495(1973)는 이 무렵 TELNET 명세 개정을 색인하며 협상 중심 설계로의 이행을 보여준다.</p>
<pre class="code"><code><span class="cm"># 4개 동사 × 옵션 코드 — 능력의 대칭 합의</span>
IAC WILL  &lt;opt&gt;   <span class="cm"># 내가 opt를 켜겠다(제안/수락)</span>
IAC WON'T &lt;opt&gt;   <span class="cm"># 내가 opt를 끄겠다/못한다</span>
IAC DO    &lt;opt&gt;   <span class="cm"># 네가 opt를 켜라(요청/허가)</span>
IAC DON'T &lt;opt&gt;   <span class="cm"># 네가 opt를 꺼라</span>

<span class="cm"># 예: 서버가 에코를 담당하겠다고 제안</span>
Server -&gt; Client:  <span class="nb">FF FB 01</span>   <span class="cm"># IAC WILL ECHO</span>
Client -&gt; Server:  <span class="nb">FF FD 01</span>   <span class="cm"># IAC DO   ECHO</span></code></pre>
<ul class="timeline">
<li><span class="yr">1973</span> <strong>RFC 495</strong> — TELNET 프로토콜 명세 개정 색인</li>
<li><span class="yr">1973</span> 협상은 "요청→응답" 대칭 구조로 정착, 옵션별 SB 하위협상 등장</li>
</ul>
<div class="tip">핵심 통찰: <strong>프로토콜 본문은 얇게, 능력은 협상으로</strong>. 확장을 코어 개정 없이 옵션 RFC로 무한히 추가할 수 있게 한 설계다.</div>`);

sl('역사','1983: RFC 854/855 표준 확립', `
<h1><span class="no">2.6</span>1983.05: RFC 854 / 855 — 오늘의 표준</h1>
<p>1983년 5월, <strong>Jon Postel</strong>과 <strong>Joyce Reynolds</strong>가 작성한 <em>RFC 854 "Telnet Protocol Specification"</em>과 <em>RFC 855 "Telnet Option Specifications"</em>가 발행된다. 이것이 <strong>지금까지도 유효한 표준(STD 8)</strong>이다. 이전 명세들을 대체하며 NVT·IAC·협상을 확정했다.</p>
<ul class="timeline">
<li><span class="yr">1983.01.01</span> ARPANET, NCP→<strong>TCP/IP</strong> 전면 전환("flag day")</li>
<li><span class="yr">1983.05</span> <strong>RFC 854</strong> — TELNET 프로토콜(현행 표준, STD 8)</li>
<li><span class="yr">1983.05</span> <strong>RFC 855</strong> — 옵션 명세 프레임워크</li>
</ul>
<div class="tw"><table class="tbl">
<thead><tr><th>확정된 상수(불변)</th><th>값</th></tr></thead>
<tbody>
<tr><td><code>IAC</code></td><td>255 (0xFF)</td></tr>
<tr><td><code>WILL / WON'T / DO / DON'T</code></td><td>251 / 252 / 253 / 254</td></tr>
<tr><td><code>SB / SE</code></td><td>250 / 240</td></tr>
<tr><td>기본 포트</td><td>23</td></tr>
</tbody></table></div>
<div class="fx">RFC 854는 <strong>40여 년째 개정 없이</strong> 살아있는, 인터넷에서 가장 오래된 현역 표준 중 하나다.</div>`);

sl('역사','옵션 RFC들의 물결', `
<h1><span class="no">2.7</span>856–861 그리고 그 후: 옵션의 홍수</h1>
<p>854/855가 뼈대를 세우자, 능력들이 각자의 RFC로 쏟아졌다. 코어를 건드리지 않고 <em>옵션 번호</em>만 할당하면 되는 설계 덕분이었다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>RFC</th><th>옵션</th><th>코드</th><th>연도</th></tr></thead>
<tbody>
<tr><td>856</td><td>BINARY TRANSMISSION</td><td>0</td><td>1983</td></tr>
<tr><td>857</td><td>ECHO</td><td>1</td><td>1983</td></tr>
<tr><td>858</td><td>SUPPRESS GO AHEAD (SGA)</td><td>3</td><td>1983</td></tr>
<tr><td>859</td><td>STATUS</td><td>5</td><td>1983</td></tr>
<tr><td>860</td><td>TIMING MARK</td><td>6</td><td>1983</td></tr>
<tr><td>861</td><td>EXTENDED-OPTIONS-LIST</td><td>255</td><td>1983</td></tr>
<tr><td>1073</td><td>NAWS (창 크기)</td><td>31</td><td>1988</td></tr>
<tr><td>1091</td><td>TERMINAL-TYPE</td><td>24</td><td>1989</td></tr>
<tr><td>1143</td><td>Q-Method 협상 상태기계</td><td>—</td><td>1990</td></tr>
<tr><td>1184</td><td>LINEMODE</td><td>34</td><td>1990</td></tr>
<tr><td>1572</td><td>NEW-ENVIRON</td><td>39</td><td>1994</td></tr>
</tbody></table></div>
<div class="tip"><strong>RFC 1143</strong>(Q-Method)은 협상이 무한 루프(에코 핑퐁)에 빠지지 않도록 각 옵션의 상태를 6가지로 관리하는 <em>사실상의 구현 표준</em>이 됐다.</div>`);

sl('역사','1980년대: BBS·MUD·유닉스 전성기', `
<h1><span class="no">2.8</span>1980년대: telnet의 황금기</h1>
<p>TCP/IP가 대학·연구소·초기 기업으로 퍼지면서 telnet은 <strong>인터넷 원격 접속의 기본 도구</strong>가 됐다. 유닉스 <code>telnetd</code>가 표준 탑재됐고, 대화형 텍스트 세계가 telnet 위에서 꽃폈다.</p>
<div class="cols">
<div>
<h3>telnet이 연 세계</h3>
<ul>
<li><strong>유닉스 원격 로그인</strong> — <code>telnet host</code> 한 줄이면 지구 반대편 셸</li>
<li><strong>BBS</strong> — 게시판·채팅·파일교환 커뮤니티</li>
<li><strong>MUD</strong>(Multi-User Dungeon) — 텍스트 기반 멀티플레이 게임의 원조</li>
<li><strong>토크/채팅</strong> — 실시간 텍스트 대화</li>
</ul>
</div>
<div>
<div class="tip"><strong>MUD와 telnet</strong><br>MUD1(1978, Roy Trubshaw &amp; Richard Bartle)에서 시작된 텍스트 게임 문화는 telnet 포트에 접속해 노는 형태로 1980–90년대 폭발했다. 오늘날 일부 MUD가 여전히 telnet(및 옵션 MCCP/MXP)으로 서비스된다.</div>
</div>
</div>
<ul class="timeline">
<li><span class="yr">1978</span> MUD1 — 텍스트 멀티유저 게임의 효시</li>
<li><span class="yr">1983</span> BSD 유닉스에 <code>telnet</code>/<code>telnetd</code> 널리 보급</li>
<li><span class="yr">1980s</span> 대학 계정=telnet 접속, 인터넷 초기 문화의 관문</li>
</ul>`);

sl('역사','1990년대: BSD telnetd와 암호화 시도', `
<h1><span class="no">2.9</span>1990년대: 라이브러리화와 Kerberos telnet</h1>
<p>telnet 구현이 성숙하면서 <strong>BSD <code>telnetd</code></strong>가 사실상의 참조 구현이 됐다. 동시에 "평문"이라는 근본 약점을 메우려는 시도가 나온다 — 가장 대표적인 것이 <strong>Kerberos telnet</strong>(인증·암호화 옵션)이다.</p>
<ul class="timeline">
<li><span class="yr">1990</span> RFC 1143 Q-Method — 협상 구현 안정화</li>
<li><span class="yr">1991~1993</span> <strong>Kerberos</strong>(MIT) 연동 telnet — 인증·세션 암호화 옵션(AUTHENTICATION/ENCRYPT)</li>
<li><span class="yr">1993</span> RFC 1416 — Telnet Authentication Option 프레임</li>
<li><span class="yr">1994</span> RFC 1572 — NEW-ENVIRON(환경변수 전달)</li>
<li><span class="yr">1990s</span> encrypt/authenticate 옵션(RFC 2941/2946 등, 1998~2000) 정비</li>
</ul>
<div class="note"><strong>암호화 옵션의 한계</strong>: TELNET ENCRYPT 옵션은 존재는 했으나 배포·상호운용이 저조했고, 협상 이전 단계 노출·다운그레이드 취약점을 안고 있었다. 결국 "telnet에 암호화를 덧대기"보다 "<strong>처음부터 암호화된 프로토콜</strong>(SSH)"이 이긴다.</div>`);

sl('역사','인터넷 확산과 telnet 기반 서비스', `
<h1><span class="no">2.10</span>telnet이 관문이던 시절의 인터넷 서비스</h1>
<p>웹 이전, 그리고 웹 초기까지 수많은 정보 서비스가 <strong>telnet 접속</strong>으로 제공됐다. "특정 호스트의 특정 포트에 telnet하라"가 곧 서비스 사용법이었다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>서비스</th><th>내용</th><th>비고</th></tr></thead>
<tbody>
<tr><td>도서관 <strong>OPAC</strong></td><td>온라인 도서목록 검색을 telnet으로 개방</td><td>대학·공공도서관 표준</td></tr>
<tr><td><strong>whois</strong></td><td>도메인/네트워크 등록정보 조회(포트 43)</td><td>지금도 라인기반 텍스트</td></tr>
<tr><td><strong>gopher</strong> 관문</td><td>메뉴형 정보시스템의 텍스트 관문</td><td>웹에 밀려 소멸</td></tr>
<tr><td><strong>날씨/증시/게시판</strong></td><td>공개 telnet 서비스로 정보 제공</td><td>1990년대 흔한 형태</td></tr>
<tr><td>라우터/스위치 <strong>CLI</strong></td><td>네트워크 장비 관리 콘솔</td><td>이후 SSH로 대체</td></tr>
</tbody></table></div>
<div class="tip">telnet의 진짜 힘은 "<strong>아무 라인기반 TCP 서비스에나 손으로 말을 걸 수 있다</strong>"는 점이었다. 이 관습은 오늘날 <code>telnet host 80</code>으로 HTTP를 직접 두드리는 디버깅 기법으로 남아 있다.</div>`);

sl('역사','1995: SSH의 등장과 telnet의 몰락', `
<h1><span class="no">2.11</span>1995: Tatu Ylönen의 SSH, 판을 뒤집다</h1>
<p>1995년, 핀란드 헬싱키 공대의 <strong>Tatu Ylönen</strong>은 자신의 대학 네트워크에서 <em>평문 패스워드 스니핑 공격</em>을 겪은 뒤 <strong>SSH(Secure Shell)</strong>를 만들어 공개했다. 목표는 명확했다 — telnet·rlogin·rsh를 <strong>암호화된 등가물</strong>로 대체하는 것.</p>
<ul class="timeline">
<li><span class="yr">1995.07</span> <strong>SSH-1</strong> 최초 공개(Tatu Ylönen) — 폭발적 채택</li>
<li><span class="yr">1996</span> SSH-2 설계 시작(프로토콜·보안 개선)</li>
<li><span class="yr">1999</span> <strong>OpenSSH</strong> 등장(OpenBSD) — 무료·오픈소스로 확산 가속</li>
<li><span class="yr">2006</span> IETF, SSH-2를 표준화(RFC 4251~4254)</li>
</ul>
<div class="fx big">SSH는 telnet이 하던 일을 그대로 하되 <strong>기밀성·무결성·강한 인증</strong>을 기본 제공했다 → 대화형 로그인 시장에서 telnet은 급속히 퇴장</div>
<div class="note">기술적 대체가 이토록 빠르고 완전했던 사례는 드물다. 2000년대 초에는 "원격 셸=telnet"이 "원격 셸=SSH"로 사실상 완전히 뒤집힌다.</div>`);

sl('역사','보안 사건: 평문 스니핑과 telnetd 취약점', `
<h1><span class="no">2.12</span>telnet을 끝장낸 보안 문제들</h1>
<p>telnet의 치명적 결함은 <strong>모든 것이 평문</strong>이라는 점이다. 아이디·패스워드·명령·출력이 회선에 그대로 흐른다. 공유 매체(허브·무선)에서는 <code>tcpdump</code> 한 줄로 자격증명이 새어나갔다.</p>
<div class="cols">
<div>
<h3>근본 취약점</h3>
<ul>
<li><strong>평문 스니핑</strong> — 패스워드가 그대로 노출</li>
<li><strong>세션 하이재킹</strong> — TCP 세션 탈취·주입</li>
<li><strong>인증 부재</strong> — 서버 신원 검증 없음(MITM 용이)</li>
</ul>
</div>
<div>
<h3>대표 telnetd 취약점(CVE)</h3>
<ul>
<li><strong>CVE-2011-4862</strong> — BSD-derived <code>telnetd</code> encrypt 옵션 힙 오버플로, 원격 코드 실행</li>
<li><strong>CVE-2020-10188</strong> — Inetutils <code>telnetd</code> netclear() 버퍼 오버플로(RCE)</li>
<li>다수 벤더 <code>in.telnetd</code> 포맷스트링·오버플로 이력</li>
</ul>
</div>
</div>
<div class="note"><strong>CVE-2011-4862</strong>는 "암호화하려던 옵션 코드 자체"가 RCE 취약점이 된 아이러니한 사례로, telnet에 보안을 덧대는 접근의 위험성을 상징한다.</div>`);

sl('역사','2000년대: 포트 23 차단이 표준이 되다', `
<h1><span class="no">2.13</span>2000년대: 기본 비활성화·23번 차단</h1>
<p>보안 인식이 성숙하면서 운영체제와 조직은 telnet을 <strong>끄는 것을 기본값</strong>으로 삼기 시작했다. 설치는 되어 있어도 서비스는 비활성, 경계 방화벽은 <strong>포트 23을 기본 차단</strong>.</p>
<ul class="timeline">
<li><span class="yr">2000년대 초</span> 리눅스/유닉스 배포판, <code>telnetd</code> 기본 미설치·비활성으로 전환</li>
<li><span class="yr">2004</span> RFC 4066 등 시대적으로 SSH 우선 권고 정착</li>
<li><span class="yr">2000s</span> 기업 보안정책: 인바운드/아웃바운드 <strong>TCP 23 차단</strong>이 상식</li>
<li><span class="yr">2007</span> Windows, 클라이언트/서버 telnet을 선택적 기능으로 격하(기본 미설치)</li>
</ul>
<div class="tip"><strong>남은 정당한 용도</strong>: 그럼에도 telnet 클라이언트는 <em>진단 도구</em>로 살아남았다 — <code>telnet host 25</code>로 SMTP를, <code>telnet host 80</code>으로 HTTP를 손으로 말해보는 <strong>프로토콜 디버깅</strong> 용도. 오늘날은 <code>nc</code>(netcat)가 이 역할을 나눠 맡는다.</div>`);

sl('역사','2016: IoT 잔존과 Mirai 봇넷', `
<h1><span class="no">2.14</span>죽지 않은 telnet: IoT와 Mirai</h1>
<p>대화형 로그인에서는 사라졌지만, telnet은 <strong>저사양 임베디드·IoT 장비</strong> 속에 대량으로 살아남았다. 값싼 라우터·IP카메라·DVR이 <strong>공장 기본 계정으로 telnet 23번을 열어둔 채</strong> 출하됐다.</p>
<div class="fx big">2016 <strong>Mirai</strong> 봇넷 = 인터넷을 훑어 <strong>telnet 23/2323</strong>에 <em>기본 아이디·패스워드 사전</em>을 대입 → 감염 IoT로 초대형 DDoS</div>
<ul class="timeline">
<li><span class="yr">2016.09</span> Mirai, KrebsOnSecurity에 ~620 Gbps DDoS</li>
<li><span class="yr">2016.10.21</span> <strong>Dyn</strong> DNS 공격 — Twitter·Netflix·GitHub 등 대규모 접속 장애</li>
<li><span class="yr">2016.10</span> Mirai 소스코드 공개 → 변종 폭증</li>
</ul>
<pre class="code"><code><span class="cm"># Mirai가 시도한 기본 자격증명(발췌)</span>
root:xc3511    root:vizxv     root:admin
admin:admin    root:888888    root:default
root:root      admin:password guest:guest</code></pre>
<div class="note">교훈: 프로토콜의 취약점이라기보다 <strong>평문 telnet + 변경 안 된 기본 암호</strong>의 결합이 재앙이었다. 이후 IoT 보안 규제(기본 암호 금지 등)의 직접적 계기가 됐다.</div>`);

sl('역사','2022: Python telnetlib의 종말', `
<h1><span class="no">2.15</span>2022: PEP 594 — telnetlib 퇴출</h1>
<p>언어 표준 라이브러리에서도 telnet은 정리 대상이 됐다. <strong>PEP 594 "Removing dead batteries from the standard library"</strong>는 오래되고 안전하지 않은 모듈들을 지목했고, <code>telnetlib</code>도 그 목록에 올랐다.</p>
<ul class="timeline">
<li><span class="yr">2019</span> PEP 594 초안 — 표준 라이브러리 "죽은 배터리" 제거 제안</li>
<li><span class="yr">2022</span> PEP 594 채택, <code>telnetlib</code> <strong>deprecated</strong>(Python 3.11)</li>
<li><span class="yr">2024</span> Python <strong>3.13</strong>에서 <code>telnetlib</code> <strong>완전 제거</strong></li>
</ul>
<pre class="code"><code><span class="cm"># 과거: 표준 telnetlib (3.13에서 제거됨)</span>
<span class="kw">import</span> telnetlib          <span class="cm"># ModuleNotFoundError on 3.13</span>

<span class="cm"># 대안 1: telnetlib3 (asyncio 기반 서드파티)</span>
<span class="kw">import</span> telnetlib3

<span class="cm"># 대안 2: 순수 socket으로 직접 (권장, 학습용)</span>
<span class="kw">import</span> socket
s = socket.create_connection((<span class="st">"example.com"</span>, <span class="nb">23</span>))</code></pre>
<div class="tip">현대적 대체: 비동기가 필요하면 <strong>telnetlib3</strong>, 프로토콜을 직접 다루고 싶으면 raw <strong>socket</strong>. 실제 원격 셸은 당연히 <strong>SSH(paramiko/asyncssh)</strong>를 쓴다.</div>`);

sl('역사','telnet의 유산: 라인기반 텍스트 프로토콜의 원형', `
<h1><span class="no">2.16</span>유산: 모든 텍스트 프로토콜의 조상</h1>
<p>telnet 자체는 물러났지만 그 <strong>설계 DNA</strong>는 인터넷 도처에 남았다. "TCP 위에서 <em>사람이 읽을 수 있는 라인</em>을 주고받는다"는 패턴은 telnet/NVT에서 정립됐다.</p>
<div class="cols">
<div>
<h3>NVT가 남긴 관습</h3>
<ul>
<li>줄 끝 <code>\\r\\n</code>(CRLF) — HTTP·SMTP·POP3·IMAP·IRC·FTP 제어채널</li>
<li>US-ASCII 라인기반 요청/응답 구조</li>
<li>대화형으로 손으로 두드려 디버깅 가능한 개방성</li>
</ul>
</div>
<div>
<div class="tip"><strong>지금도 살아있는 실습</strong>
<pre class="code"><code>$ telnet example.com 80
GET / HTTP/1.1
Host: example.com
<span class="cm">(빈 줄)</span></code></pre>
텍스트 프로토콜을 "손으로 말하는" 이 습관 자체가 telnet의 가장 오래가는 유산이다.</div>
</div>
</div>
<div class="fx">FTP·SMTP·HTTP·IRC·POP3·NNTP … 모두 <strong>telnet의 라인기반·CRLF·ASCII 전통</strong>을 물려받았다.</div>`);

sl('역사','역사에서 배우는 설계 교훈', `
<h1><span class="no">2.20</span>정리: telnet의 역사가 주는 교훈</h1>
<div class="cols">
<div>
<h3>잘한 설계</h3>
<ul>
<li><strong>얇은 코어 + 옵션 협상</strong> — 코어 개정 없이 반세기 확장</li>
<li><strong>NVT 추상화</strong> — N×N 단말 문제를 N×1로</li>
<li><strong>대칭·in-band 제어</strong>(IAC) — 단순하고 이식성 높음</li>
<li><strong>사람이 읽는 텍스트</strong> — 디버깅·교육 친화적</li>
</ul>
</div>
<div>
<h3>치명적 실패</h3>
<ul>
<li><strong>보안 무설계</strong> — 평문 전제, 인증·기밀성 없음</li>
<li>암호화를 <em>나중에 옵션으로</em> 덧대려다 실패(다운그레이드·취약점)</li>
<li>기본 암호 IoT와 결합해 <strong>Mirai</strong>로 대재앙</li>
</ul>
</div>
</div>
<div class="fx big">교훈: <strong>보안은 나중에 옵션으로 끼워 넣을 수 없다.</strong> SSH가 telnet을 이긴 이유이자, 오늘날 "secure by default" 설계 원칙의 산 증거다.</div>
<div class="tip">그럼에도 telnet은 죽지 않았다 — <code>telnet host 80</code>으로 프로토콜을 손으로 두드리는 순간, 우리는 1971년의 그 원형을 여전히 쓰고 있는 것이다.</div>`);

sl('RFC','RFC를 읽는 법 — BCP 14와 관계 체인', `
<h1><span class="no">3.1</span>RFC를 읽는 법 — 규범 언어·updates·obsoletes</h1>
<p>TELNET 표준을 정확히 구현하려면 RFC의 <em>규범(normative)</em> 언어와 문서 관계를 먼저 익혀야 합니다. 핵심은 <strong>BCP 14</strong>(RFC 2119 + RFC 8174)의 요구 수준 키워드입니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>키워드</th><th>의미</th><th>위반 시</th></tr></thead>
<tbody>
<tr><td><code>MUST</code> / <code>SHALL</code> / <code>REQUIRED</code></td><td>절대 요구사항</td><td>비준수 = 표준 위반</td></tr>
<tr><td><code>MUST NOT</code> / <code>SHALL NOT</code></td><td>절대 금지</td><td>비준수 = 표준 위반</td></tr>
<tr><td><code>SHOULD</code> / <code>RECOMMENDED</code></td><td>정당한 이유 없으면 지켜야 함</td><td>상호운용성 위험</td></tr>
<tr><td><code>MAY</code> / <code>OPTIONAL</code></td><td>진정한 선택 사항</td><td>구현·미구현 모두 정상</td></tr>
</tbody></table></div>
<pre class="code"><code>Request for Comments: 854      STD: 8      Obsoletes: NIC 18639
관계 키워드:
  Updates N    → N을 보완(대체 아님)
  Obsoletes N  → N을 완전 대체 (구 문서 폐기)</code></pre>
<div class="tip">RFC 8174 이후 <strong>대문자</strong>일 때만 규범적 의미입니다. 소문자 "must"는 평범한 영어. 구현 근거는 항상 <em>최신 obsolete 문서</em>를 따르세요(예: 930→1091, 1116→1184).</div>`);

sl('RFC','STD 8과 STD vs RFC의 차이', `
<h1><span class="no">3.2</span>STD 8 — "STD"와 "RFC"는 무엇이 다른가</h1>
<div class="fx big"><strong>RFC</strong>는 개별 문서 번호(불변), <strong>STD</strong>는 "현재 이 주제의 인터넷 표준"을 가리키는 <em>안정적 별칭</em></div>
<p>TELNET 코어 프로토콜은 <strong>STD 8</strong>로 지정되며, 이 STD 8은 <em>두 개</em>의 RFC로 구성됩니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>STD</th><th>포함 RFC</th><th>제목</th></tr></thead>
<tbody>
<tr><td rowspan="2"><strong>STD 8</strong></td><td><code>RFC 854</code></td><td>Telnet Protocol Specification</td></tr>
<tr><td><code>RFC 855</code></td><td>Telnet Option Specifications</td></tr>
<tr><td>STD 27</td><td><code>RFC 856</code></td><td>Telnet Binary Transmission</td></tr>
<tr><td>STD 28</td><td><code>RFC 857</code></td><td>Telnet Echo Option</td></tr>
<tr><td>STD 29</td><td><code>RFC 858</code></td><td>Telnet Suppress Go Ahead Option</td></tr>
</tbody></table></div>
<p class="mut small">STD 번호는 개정돼도 유지됩니다. "STD 8을 구현했다"는 곧 현재 유효한 RFC 854+855를 따랐다는 뜻입니다.</p>`);

sl('RFC','RFC 854 ① NVT — 네트워크 가상 단말', `
<h1><span class="no">3.4</span>RFC 854 ① NVT — Network Virtual Terminal</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc854" target="_blank" rel="noopener">RFC 854</a>의 첫 축은 <strong>NVT</strong>입니다. 양쪽 호스트가 실제 단말/OS와 무관하게 합의하는 "가상의 표준 단말"로, 협상 전 기본값이 곧 NVT입니다.</p>
<div class="cols">
<div>
<h3>NVT 규칙</h3>
<ul>
<li><strong>7비트 US-ASCII</strong>를 8비트 옥텟에 담아 전송(상위 비트 0)</li>
<li>양방향 대칭 — 클라이언트/서버 구분 없이 동일 규칙</li>
<li>프린터 + 키보드 모델, 완결된 <em>줄</em>까지 버퍼링 가능</li>
</ul>
<h3>NVT 필수 제어 문자</h3>
<ul>
<li><code>NUL</code>(0) no-op · <code>BEL</code>(7) 벨 · <code>BS</code>(8) 백스페이스</li>
<li><code>HT</code>(9) 탭 · <code>LF</code>(10) 개행 · <code>CR</code>(13) 복귀</li>
</ul>
</div>
<div>
<h3>줄바꿈 규범 (중요)</h3>
<div class="fx"><code>CR</code>은 반드시 <code>LF</code> 또는 <code>NUL</code>이 뒤따라야 한다</div>
<ul>
<li><code>CR LF</code> = 새 줄 이동 (<code>0x0D 0x0A</code>)</li>
<li><code>CR NUL</code> = <em>순수 CR</em>만 (<code>0x0D 0x00</code>)</li>
<li>단독 <code>CR</code>은 금지 (모호함 방지)</li>
</ul>
<div class="note">이 "고독한 CR 금지" 규칙 때문에 HTTP·SMTP 등 후계 프로토콜이 모두 <code>CRLF</code>를 줄 종결자로 채택했습니다.</div>
</div>
</div>`);

sl('RFC','RFC 854 ② IAC와 인밴드 제어', `
<h1><span class="no">3.5</span>RFC 854 ② IAC — Interpret As Command</h1>
<p>TELNET의 둘째 축은 <strong>인밴드 시그널링</strong>입니다. 데이터와 명령을 <em>같은</em> 바이트 스트림에 실으면서 구분하기 위해 이스케이프 바이트 <code>IAC = 255 (0xFF)</code>를 도입합니다.</p>
<div class="fx big">데이터 안에 실제 바이트 <code>0xFF</code>를 보내려면 <code>IAC IAC</code>(<code>255 255</code>)로 두 번 씁니다.</div>
<pre class="code"><code>데이터:  H  i  &lt;0xFF&gt;  !          ← 보내려는 원본
전송:    72 105 255 255 33       ← 0xFF 를 IAC IAC 로 이스케이프
             ^^^^^^^
        수신측: IAC 뒤 IAC → 데이터 0xFF 한 개로 복원</code></pre>
<p>수신기 상태기계: 일반 데이터 흐름 중 <code>IAC</code>를 만나면 다음 바이트를 <strong>명령</strong>으로 해석합니다. 명령이 <code>WILL/WONT/DO/DONT</code>면 옵션 코드 1바이트가, <code>SB</code>면 <code>IAC SE</code>까지가 뒤따릅니다.</p>
<div class="tip"><span class="tg cmd">IAC</span> 뒤 바이트 하나로 갈래가 갈립니다: 240~249 단독 명령, 250 SB, 251~254 옵션 협상 3바이트, 255 이스케이프된 데이터.</div>`);

sl('RFC','RFC 854 ③ 명령 코드 표 (240–255)', `
<h1><span class="no">3.6</span>RFC 854 ③ TELNET 명령 코드 표</h1>
<p>모든 명령은 <code>IAC</code>(255) 뒤에 오는 단일 바이트로 식별됩니다. 아래가 RFC 854가 정의한 명령 전체입니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>명령</th><th>10진</th><th>16진</th><th>의미</th></tr></thead>
<tbody>
<tr><td><code>SE</code></td><td>240</td><td>0xF0</td><td>서브협상 종료(End of subnegotiation)</td></tr>
<tr><td><code>NOP</code></td><td>241</td><td>0xF1</td><td>동작 없음</td></tr>
<tr><td><code>DM</code></td><td>242</td><td>0xF2</td><td>Data Mark — Sync 기준점(TCP Urgent와 함께)</td></tr>
<tr><td><code>BRK</code></td><td>243</td><td>0xF3</td><td>Break 키 / Attention</td></tr>
<tr><td><code>IP</code></td><td>244</td><td>0xF4</td><td>Interrupt Process — 실행 중단</td></tr>
<tr><td><code>AO</code></td><td>245</td><td>0xF5</td><td>Abort Output — 출력 버림</td></tr>
<tr><td><code>AYT</code></td><td>246</td><td>0xF6</td><td>Are You There — 생존 확인</td></tr>
<tr><td><code>EC</code></td><td>247</td><td>0xF7</td><td>Erase Character — 직전 문자 삭제</td></tr>
<tr><td><code>EL</code></td><td>248</td><td>0xF8</td><td>Erase Line — 현재 줄 삭제</td></tr>
<tr><td><code>GA</code></td><td>249</td><td>0xF9</td><td>Go Ahead — 전송권 넘김(반이중용)</td></tr>
<tr><td><code>SB</code></td><td>250</td><td>0xFA</td><td>Subnegotiation Begin</td></tr>
<tr><td><code>WILL</code></td><td>251</td><td>0xFB</td><td>옵션 활성화 의사</td></tr>
<tr><td><code>WONT</code></td><td>252</td><td>0xFC</td><td>옵션 비활성화 의사</td></tr>
<tr><td><code>DO</code></td><td>253</td><td>0xFD</td><td>상대에게 활성화 요청</td></tr>
<tr><td><code>DONT</code></td><td>254</td><td>0xFE</td><td>상대에게 비활성화 요청</td></tr>
<tr><td><code>IAC</code></td><td>255</td><td>0xFF</td><td>Interpret As Command(이스케이프)</td></tr>
</tbody></table></div>`);

sl('RFC','RFC 854 ④ Go Ahead와 반이중 모델', `
<h1><span class="no">3.7</span>RFC 854 ④ Go Ahead(GA)와 전송권</h1>
<p><code>GA</code>(249)는 1970년대 <em>반이중(half-duplex)</em> 단말을 위한 신호입니다. 한쪽이 다 쳤음을 알리고 상대에게 "이제 당신 차례"라며 전송권을 넘깁니다.</p>
<div class="cols">
<div>
<h3>왜 지금은 거의 안 쓰나</h3>
<ul>
<li>현대 TCP 연결은 <strong>전이중</strong> — 양쪽 동시 전송 가능</li>
<li>대부분 세션은 <code>SUPPRESS-GO-AHEAD</code>(RFC 858)로 GA를 끄고 시작</li>
<li>ECHO + SGA 조합 = 문자 단위 대화형(character-at-a-time)</li>
</ul>
</div>
<div>
<div class="fx">기본 NVT: GA 사용(줄 단위)<br>실전 대화형: <code>DO SGA</code> + <code>DO ECHO</code> → GA 억제</div>
<p class="mut small">그래서 "telnet 접속 직후 서버가 <code>IAC WILL SGA</code> / <code>IAC WILL ECHO</code>를 먼저 던지는" 것이 전형적 패턴입니다.</p>
</div>
</div>
<div class="note">GA는 삭제된 게 아니라 <em>협상으로 억제</em>될 뿐입니다. 순수 NVT 모드로 남으면 여전히 유효합니다.</div>`);

sl('RFC','RFC 854 ⑤ Synch 메커니즘', `
<h1><span class="no">3.8</span>RFC 854 ⑤ Synch — 대역외 신호</h1>
<p>사용자가 <code>IP</code>(Interrupt Process)를 눌렀는데 서버 앞단에 이미 대량 출력이 쌓여 있다면? TELNET은 <strong>TCP Urgent</strong> 포인터를 빌려 "Synch"라는 대역외 우선 신호를 만듭니다.</p>
<pre class="code"><code>클라이언트 → 서버:
   IAC IP          (인터럽트)
   IAC DM          ← Data Mark, 이 바이트에 TCP URG 플래그를 건다
   ^^^^^^
  서버는 URG 포인터를 보고 "긴급 데이터 스캔 모드"로 진입,
  DM(242) 이전의 일반 데이터는 버리되 TELNET 명령(IAC ...)만 골라 처리</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>요소</th><th>역할</th></tr></thead>
<tbody>
<tr><td><code>DM</code> (242)</td><td>Synch의 <em>끝</em>을 표시하는 기준 바이트</td></tr>
<tr><td>TCP URG</td><td>DM 지점까지 "긴급"임을 전달, 앞선 버퍼를 건너뛰게 함</td></tr>
<tr><td>스캔 모드</td><td>데이터는 폐기, 명령(IAC)은 실행 — DM 도달 시 정상 복귀</td></tr>
</tbody></table></div>
<p class="mut small">Synch는 IP/AO/AYT 같은 <em>주의(attention)</em> 신호가 버퍼에 파묻히지 않게 하는 안전장치입니다.</p>`);

sl('RFC','RFC 854 ⑥ WILL/WONT/DO/DONT 진리표', `
<h1><span class="no">3.9</span>RFC 854 ⑥ 협상 동사 진리표</h1>
<p>옵션 협상은 <strong>4개 동사</strong>로 이뤄집니다. 각 동사는 방향과 응답 규칙이 정해져 있어, 아래 진리표가 곧 상호운용의 계약입니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>보낸 쪽 의사</th><th>동사</th><th>상대의 유효 응답</th><th>협상 결과</th></tr></thead>
<tbody>
<tr><td>"내가 이 옵션을 켜겠다"</td><td><code>WILL X</code></td><td><code>DO X</code> 또는 <code>DONT X</code></td><td>DO면 활성, DONT면 거부</td></tr>
<tr><td>"내가 이 옵션을 끄겠다"</td><td><code>WONT X</code></td><td><code>DONT X</code> (강제)</td><td>항상 비활성 — 거부 불가</td></tr>
<tr><td>"네가 이 옵션을 켜라"</td><td><code>DO X</code></td><td><code>WILL X</code> 또는 <code>WONT X</code></td><td>WILL이면 활성, WONT면 거부</td></tr>
<tr><td>"네가 이 옵션을 꺼라"</td><td><code>DONT X</code></td><td><code>WONT X</code> (강제)</td><td>항상 비활성 — 거부 불가</td></tr>
</tbody></table></div>
<div class="fx big">황금률 ①: 끄는 요청(<code>WONT</code>/<code>DONT</code>)은 <strong>절대 거부할 수 없다</strong>. 항상 대칭 응답으로 승인.</div>
<div class="note">황금률 ②: <em>상태를 실제로 바꾸는</em> 경우에만 협상을 보내야 한다. 이미 켜진 옵션에 또 <code>DO</code>를 보내면 무한 루프(협상 폭풍) 발생 — RFC 1143이 이를 정식 해결합니다.</div>`);

sl('RFC','RFC 855 옵션 명세의 문법', `
<h1><span class="no">3.10</span>RFC 855 — 옵션은 어떻게 정의되는가</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc855" target="_blank" rel="noopener">RFC 855</a>는 개별 옵션이 아니라 "옵션을 <em>정의하는 방법</em>"의 메타 규격입니다. 또한 옵션은 <strong>방향별로 독립</strong>임을 못박습니다.</p>
<div class="cols">
<div>
<h3>옵션 명세 필수 항목</h3>
<ul>
<li>옵션 <strong>이름과 코드</strong>(0–255)</li>
<li>양쪽이 <code>WILL</code>/<code>DO</code>했을 때 각각 무슨 일이 일어나는가</li>
<li>서브협상(<code>SB</code>) 구문이 있다면 그 바이트 포맷</li>
<li>기본값(협상 전) — 항상 "옵션 꺼짐 = NVT"</li>
</ul>
</div>
<div>
<h3>서브협상 골격</h3>
<pre class="code"><code>IAC SB &lt;option&gt; &lt;params...&gt; IAC SE
 │   │     │         │        │  │
255 250  코드     옵션 데이터 255 240</code></pre>
<p class="mut small">파라미터 안 <code>0xFF</code>는 <code>IAC IAC</code>로 이스케이프.</p>
</div>
</div>
<div class="tw"><table class="tbl">
<thead><tr><th>관점</th><th>내가 켜는 방향</th><th>상대가 켜는 방향</th></tr></thead>
<tbody>
<tr><td>동사</td><td><code>WILL X</code> → 상대 <code>DO</code>/<code>DONT</code></td><td><code>DO X</code> → 상대 <code>WILL</code>/<code>WONT</code></td></tr>
<tr><td>주체</td><td>내가 X 기능 수행</td><td>상대가 X 기능 수행</td></tr>
<tr><td>예: ECHO</td><td>내가 상대 입력을 에코</td><td>상대가 내 입력을 에코</td></tr>
</tbody></table></div>
<div class="note">양방향을 헷갈리면 "이중 에코"(글자 두 번) 또는 "무에코"(안 보임) 버그가 납니다. 방향과 주체를 분리해 생각하세요.</div>`);

sl('RFC','RFC 856 Binary Transmission', `
<h1><span class="no">3.11</span>RFC 856 — 8비트 바이너리 전송</h1>
<p>기본 NVT는 7비트 ASCII만 보장합니다. <a href="https://www.rfc-editor.org/rfc/rfc856" target="_blank" rel="noopener">RFC 856</a>의 <code>BINARY</code>(옵션 0)를 켜면 채널이 <strong>순수 8비트 옥텟</strong> 통로가 됩니다.</p>
<pre class="code"><code>C→S:  IAC DO   BINARY   (255 253 0)   "너, 8비트로 보내라"
S→C:  IAC WILL BINARY   (255 251 0)   "그러겠다"
# 진정한 양방향 8비트를 원하면 반대 방향도 협상:
S→C:  IAC DO   BINARY
C→S:  IAC WILL BINARY</code></pre>
<div class="cols">
<div>
<h3>바이너리 모드에서도 남는 규칙</h3>
<ul>
<li><code>IAC</code>(0xFF)는 <em>여전히</em> 이스케이프(<code>IAC IAC</code>) 필요</li>
<li>즉 완전 투명 채널은 아님 — 0xFF만 특별</li>
<li><code>CR</code> 뒤 <code>LF</code>/<code>NUL</code> 규칙은 완화됨</li>
</ul>
</div>
<div>
<div class="fx">BINARY는 방향별. 양방향 8비트를 원하면 <strong>양쪽 다</strong> WILL/DO 성립시켜야 함.</div>
<p class="mut small">UTF-8 등 멀티바이트 텍스트를 안전히 나르려면 BINARY + CHARSET(RFC 2066) 조합이 필요합니다.</p>
</div>
</div>`);

sl('RFC','RFC 857 Echo — 대화형의 핵심', `
<h1><span class="no">3.12</span>RFC 857 — Echo(옵션 1)</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc857" target="_blank" rel="noopener">RFC 857</a>은 "누가 화면에 글자를 되돌려줄 것인가"를 협상합니다. 대화형 로그인 경험의 뼈대입니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>모드</th><th>에코 주체</th><th>협상</th><th>체감</th></tr></thead>
<tbody>
<tr><td>로컬 에코(기본)</td><td>클라이언트 자신</td><td>양쪽 WONT/DONT ECHO</td><td>줄 단위 편집 후 전송</td></tr>
<tr><td>원격 에코</td><td>서버</td><td>서버 <code>WILL ECHO</code> + 클라 <code>DO ECHO</code></td><td>문자 단위·즉시 반응</td></tr>
</tbody></table></div>
<div class="fx big">원격 에코(<code>WILL ECHO</code>) + <code>SGA</code> = <strong>character-at-a-time</strong> 모드. 비밀번호 입력 시 서버가 에코를 <em>끄면</em> 화면에 안 보임.</div>
<pre class="code"><code>S→C:  IAC WILL ECHO   (255 251 1)   서버가 에코 담당 선언
C→S:  IAC DO   ECHO   (255 253 1)   승인 → 클라는 로컬 에코 중지
# 비밀번호 입력 시 서버가 WONT/WILL ECHO 로 마스킹 토글</code></pre>
<div class="note">RFC 857은 "ECHO와 SUPPRESS-GO-AHEAD를 <em>둘 다</em> 협상해 문자 단위 모드를 만든다"고 명시합니다. 하나만으로는 불완전합니다.</div>`);

sl('RFC','RFC 858 Suppress Go Ahead', `
<h1><span class="no">3.13</span>RFC 858 — Suppress Go Ahead(옵션 3)</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc858" target="_blank" rel="noopener">RFC 858</a>의 <code>SGA</code>는 반이중 잔재인 <code>GA</code> 신호를 <strong>보내지 않겠다</strong>는 약속입니다. 전이중 대화형의 전제 조건입니다.</p>
<pre class="code"><code>S→C:  IAC WILL SGA   (255 251 3)   "나는 GA를 안 보내겠다"
C→S:  IAC DO   SGA   (255 253 3)   "좋다"
# 양방향으로 GA를 없애려면 반대 방향도:
C→S:  IAC WILL SGA
S→C:  IAC DO   SGA</code></pre>
<div class="cols">
<div>
<h3>왜 필요한가</h3>
<ul>
<li>GA를 기다리면 문자 단위 즉시 응답이 불가능</li>
<li>SGA로 GA를 없애야 양쪽이 자유롭게 전송</li>
<li>ECHO(857)와 짝을 이뤄 대화형 완성</li>
</ul>
</div>
<div>
<div class="fx">전형적 대화형 세팅<br>서버측 <code>WILL ECHO</code> + <code>WILL SGA</code></div>
<p class="mut small">거의 모든 실전 telnet 서버가 접속 직후 이 두 옵션을 제안합니다.</p>
</div>
</div>`);

sl('RFC','RFC 859 Status — 상태 질의', `
<h1><span class="no">3.14</span>RFC 859 — Status(옵션 5)</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc859" target="_blank" rel="noopener">RFC 859</a>는 "지금 네가 인식하는 옵션 상태를 알려달라"는 디버깅·동기화 도구입니다. 협상이 꼬였을 때 진실을 확인합니다.</p>
<pre class="code"><code># 상태 요청 (SEND=1)
A→B:  IAC SB STATUS SEND IAC SE          (255 250 5 1 255 240)

# 응답 (IS=0): 자신이 활성이라 믿는 옵션 나열
B→A:  IAC SB STATUS IS
        WILL ECHO   WILL SGA   DO NAWS
      IAC SE
      (255 250 5 0  251 1  251 3  253 31  255 240)</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>서브명령</th><th>값</th><th>의미</th></tr></thead>
<tbody>
<tr><td><code>IS</code></td><td>0</td><td>"내 상태는 다음과 같다"(응답)</td></tr>
<tr><td><code>SEND</code></td><td>1</td><td>"네 상태를 보내라"(요청)</td></tr>
</tbody></table></div>
<p class="mut small">응답 안의 WILL/DO는 <em>발신자 관점</em>임에 주의 — 상대가 보내온 상태이므로 방향을 뒤집어 해석해야 합니다.</p>`);

sl('RFC','RFC 860 Timing Mark · RFC 861 Extended-Options', `
<h1><span class="no">3.15</span>RFC 860 Timing Mark · RFC 861 Extended-Options-List</h1>
<div class="cols">
<div>
<h3><a href="https://www.rfc-editor.org/rfc/rfc860" target="_blank" rel="noopener">RFC 860</a> — Timing Mark(6)</h3>
<p>스트림에 표식을 심고 "이 지점까지 처리했는지" 왕복 확인하는 동기화 도구.</p>
<pre class="code"><code>A→B:  IAC DO   TIMING-MARK  (255 253 6)
# 앞선 데이터 소비 후:
B→A:  IAC WILL TIMING-MARK  (255 251 6)  완료
B→A:  IAC WONT TIMING-MARK  (255 252 6)  아직/거부</code></pre>
<p class="mut small">AO(출력 폐기) 경계 확인·RTT 측정에 응용. 상태를 켜 두기보다 매번 표식을 요청·응답하는 <em>일회성 핸드셰이크</em>에 가깝습니다.</p>
</div>
<div>
<h3><a href="https://www.rfc-editor.org/rfc/rfc861" target="_blank" rel="noopener">RFC 861</a> — Extended-Options-List(255)</h3>
<p>옵션 코드는 1바이트라 <strong>256개</strong>가 한계. 코드 <code>255</code>(EXOPL)를 예약해 확장 통로를 마련합니다.</p>
<pre class="code"><code>A→B:  IAC DO   EXOPL  (255 253 255)
B→A:  IAC WILL EXOPL  (255 251 255)</code></pre>
<div class="note">256 슬롯이 아직 소진되지 않아 EXOPL은 거의 안 쓰이는 예비 장치. 하지만 "왜 옵션 255가 비어 있나"의 답이 이 RFC입니다.</div>
</div>
</div>`);

sl('RFC','RFC 1091 Terminal-Type', `
<h1><span class="no">3.16</span>RFC 1091 — Terminal-Type(옵션 24)</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc1091" target="_blank" rel="noopener">RFC 1091</a>(RFC 930 폐기)은 클라이언트 단말 종류(<code>vt100</code>, <code>xterm-256color</code> 등)를 서버에 알립니다. <code>SEND</code>/<code>IS</code> 서브협상으로 이름을 주고받습니다.</p>
<pre class="code"><code># 1) 옵션 협상
S→C:  IAC DO   TERMINAL-TYPE   (255 253 24)
C→S:  IAC WILL TERMINAL-TYPE   (255 251 24)

# 2) 서브협상: 서버가 SEND, 클라가 IS 로 이름 회신
S→C:  IAC SB TERMINAL-TYPE SEND IAC SE   (255 250 24 1 255 240)
C→S:  IAC SB TERMINAL-TYPE IS "XTERM" IAC SE
      (255 250 24 0  88 84 69 82 77  255 240)</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>토큰</th><th>값</th><th>방향</th></tr></thead>
<tbody>
<tr><td><code>IS</code></td><td>0</td><td>클라 → 서버 (단말 이름 제출)</td></tr>
<tr><td><code>SEND</code></td><td>1</td><td>서버 → 클라 (이름 요청)</td></tr>
</tbody></table></div>
<div class="tip"><code>SEND</code>를 반복하면 클라이언트가 <em>목록을 순회</em>합니다(vt100 → vt220 → …). 같은 이름이 두 번 나오면 목록의 끝이라는 관례. 이름은 대문자 US-ASCII 권장.</div>`);

sl('RFC','RFC 1073 NAWS · RFC 1079 Terminal Speed', `
<h1><span class="no">3.17</span>RFC 1073 NAWS(31) · RFC 1079 Terminal Speed(32)</h1>
<p>둘 다 클라이언트의 단말 <em>물리 속성</em>을 서버에 전달하는 서브협상 옵션입니다.</p>
<div class="cols">
<div>
<h3><a href="https://www.rfc-editor.org/rfc/rfc1073" target="_blank" rel="noopener">RFC 1073</a> — NAWS(창 크기)</h3>
<pre class="code"><code>C→S:  IAC WILL NAWS  (255 251 31)
S→C:  IAC DO   NAWS  (255 253 31)
# width, height 각각 16비트 빅엔디언 (예 80x24)
C→S:  IAC SB NAWS  0 80  0 24  IAC SE
      255 250 31  0 80 0 24  255 240</code></pre>
<p class="mut small">폭·높이는 <strong>문자 단위</strong>(픽셀 아님). 값 바이트가 <code>255</code>면 <code>IAC IAC</code> 이스케이프. 창 리사이즈 시 클라가 먼저 재전송.</p>
</div>
<div>
<h3><a href="https://www.rfc-editor.org/rfc/rfc1079" target="_blank" rel="noopener">RFC 1079</a> — Terminal Speed</h3>
<pre class="code"><code>S→C:  IAC SB TERMINAL-SPEED SEND IAC SE
# IS 로 "송신,수신" 보드레이트 ASCII 회신
C→S:  IAC SB TERMINAL-SPEED IS
        "38400,38400" IAC SE</code></pre>
<p class="mut small">TERMINAL-TYPE과 같은 <code>SEND</code>/<code>IS</code> 패턴. 형식은 <code>transmit,receive</code> 두 정수를 쉼표로 구분한 ASCII 문자열.</p>
</div>
</div>`);

sl('RFC','RFC 1184 Linemode ① MODE·EDIT·TRAPSIG', `
<h1><span class="no">3.18</span>RFC 1184 — Linemode(옵션 34) ①</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc1184" target="_blank" rel="noopener">RFC 1184</a>(RFC 1116 폐기)는 <em>줄 편집을 클라이언트가 로컬 처리</em>하게 해 지연·부하를 줄입니다. 핵심은 <code>MODE</code> 서브협상의 비트 플래그입니다.</p>
<pre class="code"><code>C→S:  IAC WILL LINEMODE   (255 251 34)
S→C:  IAC DO   LINEMODE   (255 253 34)

# MODE 설정: SB LINEMODE MODE &lt;mask&gt; IAC SE
S→C:  IAC SB LINEMODE MODE (EDIT|TRAPSIG) IAC SE
      255 250 34  1  3  255 240      (mask=0x03)</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>MODE 비트</th><th>값</th><th>의미</th></tr></thead>
<tbody>
<tr><td><code>EDIT</code></td><td>0x01</td><td>클라이언트가 줄 편집·조립을 로컬 수행</td></tr>
<tr><td><code>TRAPSIG</code></td><td>0x02</td><td>인터럽트/시그널 문자를 텔넷 명령으로 변환 전송</td></tr>
<tr><td><code>MODE_ACK</code></td><td>0x04</td><td>수신한 MODE에 대한 확인 응답(에코백)</td></tr>
<tr><td><code>SOFT_TAB</code></td><td>0x08</td><td>탭을 공백으로 로컬 확장</td></tr>
<tr><td><code>LIT_ECHO</code></td><td>0x10</td><td>제어문자를 문자 그대로 에코</td></tr>
</tbody></table></div>
<div class="note">MODE는 <code>MODE_ACK</code> 비트로 핸드셰이크합니다: 한쪽이 MODE를 보내면 상대가 같은 값에 ACK를 켜서 되돌려 확정합니다.</div>`);

sl('RFC','RFC 1184 Linemode ② SLC — 특수문자 협상', `
<h1><span class="no">3.19</span>RFC 1184 — Linemode(옵션 34) ② SLC</h1>
<p><strong>SLC</strong>(Set Local Characters)는 인터럽트·삭제 등 특수 기능키를 어떤 바이트에 매핑할지 협상합니다. 삼중항 <code>(기능, 레벨플래그, 값)</code>의 반복입니다.</p>
<pre class="code"><code>IAC SB LINEMODE SLC
   &lt;func&gt; &lt;flags&gt; &lt;value&gt;      ← 3바이트 삼중항이 여러 개 반복
   ...
IAC SE

# 예: IP(인터럽트)=Ctrl-C(3)
   SLC_IP  (SLC_DEFAULT|SLC_VARIABLE)  3</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>SLC 기능</th><th>코드</th><th>전형 값</th></tr></thead>
<tbody>
<tr><td><code>SLC_SYNCH</code></td><td>1</td><td>—</td></tr>
<tr><td><code>SLC_IP</code></td><td>3</td><td>Ctrl-C (0x03)</td></tr>
<tr><td><code>SLC_AO</code></td><td>4</td><td>Ctrl-O (0x0F)</td></tr>
<tr><td><code>SLC_EC</code> (지우기)</td><td>6</td><td>DEL (0x7F)</td></tr>
<tr><td><code>SLC_EL</code> (줄삭제)</td><td>7</td><td>Ctrl-U (0x15)</td></tr>
<tr><td><code>SLC_EOF</code></td><td>238</td><td>Ctrl-D (0x04)</td></tr>
</tbody></table></div>
<p class="mut small">flags 하위 2비트가 레벨(<code>NOSUPPORT</code>=0, <code>CANTCHANGE</code>=1, <code>VALUE</code>=2, <code>DEFAULT</code>=3), 상위 비트는 <code>SLC_ACK</code>/<code>FLUSHIN</code>/<code>FLUSHOUT</code>. 값 바이트가 <code>255</code>면 <code>IAC IAC</code> 이스케이프.</p>`);

sl('RFC','RFC 1372 Remote Flow Control', `
<h1><span class="no">3.20</span>RFC 1372 — Remote Flow Control(옵션 33)</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc1372" target="_blank" rel="noopener">RFC 1372</a>(RFC 1080 폐기)는 <code>Ctrl-S</code>/<code>Ctrl-Q</code>(XON/XOFF) 흐름 제어를 클라이언트가 <em>로컬로</em> 처리할지 협상합니다.</p>
<pre class="code"><code>S→C:  IAC DO   TOGGLE-FLOW-CONTROL   (255 253 33)
C→S:  IAC WILL TOGGLE-FLOW-CONTROL   (255 251 33)

# 서브협상: 흐름 제어 on/off 지정
S→C:  IAC SB TOGGLE-FLOW-CONTROL OFF IAC SE   (... 33 0 ...)
S→C:  IAC SB TOGGLE-FLOW-CONTROL ON  IAC SE   (... 33 1 ...)</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>서브명령</th><th>값</th><th>의미</th></tr></thead>
<tbody>
<tr><td><code>OFF</code></td><td>0</td><td>클라이언트 로컬 흐름 제어 비활성</td></tr>
<tr><td><code>ON</code></td><td>1</td><td>로컬 흐름 제어 활성</td></tr>
<tr><td><code>RESTART-ANY</code></td><td>2</td><td>아무 문자나 재개(XON) 트리거</td></tr>
<tr><td><code>RESTART-XON</code></td><td>3</td><td>XON 문자만 재개 트리거</td></tr>
</tbody></table></div>
<p class="mut small">이 옵션 덕에 Ctrl-S로 화면을 멈춰도 그 바이트가 서버로 새지 않고 클라이언트에서 소비됩니다.</p>`);

sl('RFC','RFC 1408/1572 Environment / New-Environ', `
<h1><span class="no">3.21</span>RFC 1408·1572 — 환경변수 전달(옵션 36·39)</h1>
<p>환경변수를 세션에 넘기는 옵션입니다. 구버전 <a href="https://www.rfc-editor.org/rfc/rfc1408" target="_blank" rel="noopener">RFC 1408</a>(옵션 36, Historic)의 코드 충돌 문제를 <a href="https://www.rfc-editor.org/rfc/rfc1572" target="_blank" rel="noopener">RFC 1572</a>(NEW-ENVIRON, 옵션 39)가 재배치해 해결했습니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>토큰</th><th>NEW-ENVIRON 값</th><th>의미</th></tr></thead>
<tbody>
<tr><td><code>VAR</code></td><td>0</td><td>잘 알려진 변수 이름 시작(USER, DISPLAY 등)</td></tr>
<tr><td><code>VALUE</code></td><td>1</td><td>바로 앞 변수의 값 시작</td></tr>
<tr><td><code>ESC</code></td><td>2</td><td>다음 바이트를 리터럴로(구분자 이스케이프)</td></tr>
<tr><td><code>USERVAR</code></td><td>3</td><td>사용자 정의 변수 이름 시작</td></tr>
<tr><td colspan="2"><code>IS</code>=0 / <code>SEND</code>=1 / <code>INFO</code>=2</td><td>제출 / 요청 / 비요청 갱신</td></tr>
</tbody></table></div>
<pre class="code"><code>S→C:  IAC SB NEW-ENVIRON SEND IAC SE       (255 250 39 1 255 240)
C→S:  IAC SB NEW-ENVIRON IS
        VAR "USER" VALUE "cho"
        USERVAR "LANG" VALUE "ko_KR.UTF-8"
      IAC SE</code></pre>
<div class="note"><strong>보안 주의</strong>: 환경변수를 무분별하게 신뢰하면 서버측 권한 상승·인젝션 위험. RFC 1572는 서버가 어떤 변수를 받을지 신중히 고르라고 경고합니다.</div>`);

sl('RFC','RFC 1143 Q-Method ① 상태 정의', `
<h1><span class="no">3.22</span>RFC 1143 — Q-Method ① 협상 상태기계</h1>
<p>순진한 협상은 <em>무한 루프</em>(협상 폭풍)에 빠집니다. <a href="https://www.rfc-editor.org/rfc/rfc1143" target="_blank" rel="noopener">RFC 1143</a>은 각 옵션·각 방향을 6-상태 기계로 모델링해 이를 근절합니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>상태</th><th>의미</th></tr></thead>
<tbody>
<tr><td><code>NO</code></td><td>비활성, 요청 없음(안정)</td></tr>
<tr><td><code>YES</code></td><td>활성(안정)</td></tr>
<tr><td><code>WANTNO</code></td><td>끄기를 요청하고 응답 대기</td></tr>
<tr><td><code>WANTYES</code></td><td>켜기를 요청하고 응답 대기</td></tr>
<tr><td><code>WANTNO+opp</code></td><td>끄는 중인데 반대 요청이 큐에 걸림</td></tr>
<tr><td><code>WANTYES+opp</code></td><td>켜는 중인데 반대 요청이 큐에 걸림</td></tr>
</tbody></table></div>
<p>상태는 <strong>us</strong>(내 방향, WILL/WONT 관할)와 <strong>him</strong>(상대 방향, DO/DONT 관할) 두 벌을 옵션마다 유지합니다. 대기 중(<code>WANT*</code>) 상태에는 <em>중복 요청을 보내지 않는</em> 것이 루프 방지의 핵심입니다.</p>`);

sl('RFC','RFC 1143 Q-Method ② 루프 방지 알고리즘', `
<h1><span class="no">3.23</span>RFC 1143 — Q-Method ② 수신 처리 규칙</h1>
<p>수신한 <code>WILL</code>/<code>WONT</code>를 <code>him</code> 상태에 따라 처리하는 규범 알고리즘. <code>DO</code>/<code>DONT</code>는 <code>us</code> 상태에 대칭 적용합니다.</p>
<pre class="code"><code>Upon receiving WILL:
  case him of
    NO:          if 옵션 원함 → him=YES, send DO
                 else               send DONT           # 명확히 거부
    YES:         # 이미 켜짐 — 아무 것도 안 보냄(루프 차단)
    WANTNO:      error "DONT answered by WILL"; him=NO
    WANTNO+opp:  error; him=YES
    WANTYES:     him=YES                                # 우리 DO 에 대한 응답
    WANTYES+opp: him=WANTNO; send DONT

Upon receiving WONT:
  case him of
    NO:          # 이미 꺼짐 — 무응답
    YES:         him=NO; send DONT                      # 끄기 승인
    WANTNO:      him=NO
    WANTNO+opp:  him=WANTYES; send DO
    WANTYES:     him=NO                                 # 우리 DO 를 거부당함
    WANTYES+opp: him=NO</code></pre>
<div class="fx big">핵심 3계명: ① 이미 원하는 상태면 <strong>재요청 금지</strong> ② 끄기 요청은 <strong>항상 승인</strong> ③ 대기 중 반대 요청은 <code>+opp</code> 큐에 하나만 보관.</div>
<div class="tip">이 표를 그대로 코드화하면 어떤 상대 구현과도 협상이 <em>유한 스텝</em>에 수렴합니다. libtelnet·telnetlib3 등 견실한 구현이 이 기계를 따릅니다.</div>`);

sl('RFC','RFC 2217 Com Port Control — 시리얼 over telnet', `
<h1><span class="no">3.24</span>RFC 2217 — Com Port Control(옵션 44)</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc2217" target="_blank" rel="noopener">RFC 2217</a>은 telnet 위로 <strong>원격 시리얼 포트</strong>를 제어합니다. 네트워크 시리얼 서버(터미널 서버)가 보드레이트·패리티·모뎀 신호선을 원격 조정하도록 합니다.</p>
<pre class="code"><code>C→S:  IAC WILL COM-PORT-OPTION   (255 251 44)
S→C:  IAC DO   COM-PORT-OPTION   (255 253 44)

# 보드레이트 115200 설정 (SET-BAUDRATE=1, 4바이트 빅엔디언)
C→S:  IAC SB COM-PORT SET-BAUDRATE 0 1 194 0 IAC SE
      255 250 44 1  0 1 194 0  255 240        (0x0001C200 = 115200)</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>서브명령(클라)</th><th>코드</th><th>기능</th></tr></thead>
<tbody>
<tr><td><code>SET-BAUDRATE</code></td><td>1</td><td>보드레이트(4바이트)</td></tr>
<tr><td><code>SET-DATASIZE</code></td><td>2</td><td>데이터 비트(5–8)</td></tr>
<tr><td><code>SET-PARITY</code></td><td>3</td><td>패리티(none/odd/even…)</td></tr>
<tr><td><code>SET-STOPSIZE</code></td><td>4</td><td>정지 비트</td></tr>
<tr><td><code>SET-CONTROL</code></td><td>5</td><td>흐름 제어·모뎀선(DTR/RTS)</td></tr>
</tbody></table></div>
<p class="mut small">서버측 응답은 각 클라 명령 코드에 <code>+100</code>을 더한 값으로 회신합니다(예: 서버의 보드레이트 통지 = 101).</p>`);

sl('RFC','RFC 2941/2942/2946 인증과 암호화', `
<h1><span class="no">3.25</span>RFC 2941·2942·2946 — 인증 & 암호화</h1>
<p>평문 telnet의 근본 취약점을 옵션으로 보강하려는 시도. 그러나 실무에서는 대부분 <strong>SSH로 대체</strong>되었습니다(역사·상호운용 지식으로 기억).</p>
<div class="tw"><table class="tbl">
<thead><tr><th>RFC</th><th>옵션</th><th>내용</th></tr></thead>
<tbody>
<tr><td><a href="https://www.rfc-editor.org/rfc/rfc2941" target="_blank" rel="noopener">2941</a></td><td>AUTHENTICATION (37)</td><td>인증 프레임워크(RFC 1416 폐기). 방식·양방향 협상 골격</td></tr>
<tr><td><a href="https://www.rfc-editor.org/rfc/rfc2942" target="_blank" rel="noopener">2942</a></td><td>—</td><td>Kerberos V5 인증 방식 정의</td></tr>
<tr><td><a href="https://www.rfc-editor.org/rfc/rfc2946" target="_blank" rel="noopener">2946</a></td><td>ENCRYPT (38)</td><td>데이터 암호화 옵션(DES-CFB 등 대칭 암호)</td></tr>
</tbody></table></div>
<pre class="code"><code>S→C:  IAC DO   AUTHENTICATION   (255 253 37)
C→S:  IAC WILL AUTHENTICATION   (255 251 37)
C→S:  IAC SB AUTHENTICATION SEND &lt;type-pairs...&gt; IAC SE   # 지원 방식 목록
# 암호화는 인증 성립 후 키 협상 → IAC SB ENCRYPT START ...</code></pre>
<div class="note"><strong>보안 현실</strong>: encrypt 옵션은 취약한 암호와 구현 결함으로 신뢰받지 못했습니다. 기밀성이 필요하면 <em>예외 없이</em> SSH(또는 TLS 터널)를 쓰세요. 이 옵션들은 레거시 장비 상대에서만 마주칩니다.</div>`);

sl('RFC','RFC 2066 CHARSET — 문자셋 협상', `
<h1><span class="no">3.26</span>RFC 2066 — CHARSET(옵션 42)</h1>
<p><a href="https://www.rfc-editor.org/rfc/rfc2066" target="_blank" rel="noopener">RFC 2066</a>은 세션의 <strong>문자 인코딩</strong>(UTF-8, ISO-8859-1 등)을 협상합니다. BINARY(8비트 채널)와 짝지어 비ASCII 텍스트를 안전히 나릅니다.</p>
<pre class="code"><code>S→C:  IAC WILL CHARSET   (255 251 42)
C→S:  IAC DO   CHARSET   (255 253 42)

# REQUEST: 구분자(첫 바이트) + 후보 목록
S→C:  IAC SB CHARSET REQUEST ";UTF-8;ISO-8859-1" IAC SE
# ACCEPTED / REJECTED 로 회신
C→S:  IAC SB CHARSET ACCEPTED "UTF-8" IAC SE</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>서브명령</th><th>값</th><th>의미</th></tr></thead>
<tbody>
<tr><td><code>REQUEST</code></td><td>1</td><td>구분자 뒤 후보 문자셋 목록 제시</td></tr>
<tr><td><code>ACCEPTED</code></td><td>2</td><td>하나 선택해 수락</td></tr>
<tr><td><code>REJECTED</code></td><td>3</td><td>모두 거부</td></tr>
<tr><td><code>TTABLE-*</code></td><td>4–6</td><td>변환 테이블 협상(드물게 사용)</td></tr>
</tbody></table></div>
<div class="tip">REQUEST의 첫 바이트가 <em>구분자</em>입니다(위 예에서 <code>;</code>). 목록은 IANA 문자셋 등록명을 씁니다.</div>`);
