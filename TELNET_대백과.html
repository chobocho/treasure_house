sl('Python','Python으로 TELNET을 다루는 3가지 길', `
<h1><span class="no">P1</span>Python으로 TELNET을 다루는 3가지 길</h1>
<p>Python 생태계에서 TELNET을 만지는 방법은 크게 셋입니다. 결론부터: <strong>표준 <code>telnetlib</code>는 죽었습니다</strong>(3.13에서 제거). 새 코드는 <em>raw socket</em> 또는 <em>telnetlib3</em>를 쓰세요.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>방법</th><th>패러다임</th><th>상태</th><th>언제</th></tr></thead>
<tbody>
<tr><td><code>telnetlib</code></td><td>동기(blocking)</td><td><strong>제거됨</strong> (PEP 594, 3.13~)</td><td>레거시 유지보수만</td></tr>
<tr><td><code>socket</code> raw</td><td>동기/저수준</td><td>영원히 표준</td><td>바이트를 완전 통제, 학습·디버깅</td></tr>
<tr><td><code>telnetlib3</code></td><td>asyncio</td><td>서드파티(pip)</td><td>실전 비동기 클라이언트/서버</td></tr>
</tbody></table></div>
<div class="fx big">IAC 협상은 어느 방법을 쓰든 <strong>당신이 직접</strong> 이해해야 합니다. 라이브러리는 편의일 뿐, 바이트는 그대로입니다.</div>`);

sl('Python','telnetlib — 클래식 사용법', `
<h1><span class="no">P2</span>telnetlib — 클래식 사용법 (그래도 알아두기)</h1>
<p>수십 년간 표준이었던 <code>telnetlib.Telnet</code>. 핵심 4메서드: <code>read_until</code>, <code>write</code>, <code>expect</code>, <code>read_all</code>. 로그인 시퀀스를 프롬프트 대기로 몰아갑니다.</p>
<pre class="code"><code><span class="kw">import</span> telnetlib   <span class="cm"># ⚠ Python 3.13에서 제거됨</span>

tn = telnetlib.Telnet(<span class="st">"towel.blinkenlights.nl"</span>, 23, timeout=10)
tn.read_until(b<span class="st">"login: "</span>, timeout=5)     <span class="cm"># 프롬프트까지 소비</span>
tn.write(b<span class="st">"guest\\r\\n"</span>)                    <span class="cm"># NVT 줄끝 = CR LF</span>
tn.read_until(b<span class="st">"Password: "</span>)
tn.write(b<span class="st">"secret\\r\\n"</span>)
data = tn.read_all()                        <span class="cm"># EOF까지 전부</span>
<span class="kw">print</span>(data.decode(<span class="st">"ascii"</span>, <span class="st">"replace"</span>))
tn.close()</code></pre>
<div class="note"><code>read_until</code>는 지정한 바이트열이 나올 때까지 <em>블로킹</em>합니다. 안 나오면 <code>timeout</code>에 걸려 그때까지 받은 것만 반환(예외 아님) — 반환값 길이를 반드시 확인하세요.</div>`);

sl('Python','telnetlib.expect() — 정규식 자동화', `
<h1><span class="no">P3</span>telnetlib.expect() — 정규식 자동화</h1>
<p>여러 프롬프트 중 <em>먼저 오는 것</em>에 반응할 때. <code>expect()</code>는 <code>(index, match, data)</code>를 돌려주며, 매치 실패 시 <code>index = -1</code>.</p>
<pre class="code"><code>patterns = [rb<span class="st">"login:"</span>, rb<span class="st">"Username:"</span>, rb<span class="st">"Connection refused"</span>]
idx, match, data = tn.expect(patterns, timeout=5)

<span class="kw">if</span> idx == -1:
    <span class="kw">raise</span> TimeoutError(<span class="st">"프롬프트를 못 봄, 받은 바이트: "</span> + repr(data))
<span class="kw">elif</span> idx == 2:
    <span class="kw">raise</span> ConnectionError(<span class="st">"서버 거부"</span>)
<span class="kw">else</span>:
    tn.write(b<span class="st">"admin\\r\\n"</span>)                 <span class="cm"># idx 0 또는 1</span></code></pre>
<p>패턴은 <code>bytes</code> 정규식(<code>rb"..."</code>)이어야 합니다. <code>str</code> 패턴을 주면 <code>TypeError</code>.</p>
<div class="tip">자동화 스크립트의 정석 루프: <em>보낸다 → 기대 프롬프트를 <code>expect</code> → 다음을 보낸다</em>. 이 패턴은 <code>pexpect</code>·Go의 expect 라이브러리로 그대로 이어집니다.</div>`);

sl('Python','telnetlib DEPRECATION — PEP 594', `
<h1><span class="no">P4</span>telnetlib은 왜, 언제 사라졌나 (PEP 594)</h1>
<p><strong>PEP 594 "Removing dead batteries"</strong>가 표준 라이브러리의 노후 모듈을 정리했습니다. <code>telnetlib</code>는 그 대상.</p>
<ul class="timeline">
<li><span class="yr">2019</span> PEP 594 제안 — <code>telnetlib</code> 폐기 대상 지정</li>
<li><span class="yr">3.11</span> <code>import telnetlib</code> 시 <code>DeprecationWarning</code> 발생</li>
<li><span class="yr">3.13</span> 모듈 <strong>완전 제거</strong> — <code>ModuleNotFoundError</code></li>
</ul>
<pre class="code"><code><span class="cm"># Python 3.13+ 에서:</span>
&gt;&gt;&gt; <span class="kw">import</span> telnetlib
Traceback (most recent call last):
ModuleNotFoundError: No module named <span class="st">'telnetlib'</span></code></pre>
<div class="note">폐기 사유: <strong>보안</strong>(평문 프로토콜을 표준이 축복하는 모양새) + <strong>유지보수 부담</strong>(협상 로직이 불완전·버그 잔존) + <strong>대체재 존재</strong>(socket, telnetlib3). 표준에서 빠졌을 뿐 프로토콜이 죽은 건 아닙니다.</div>
<ul class="links"><li><span class="k doc">DOC</span> <a href="https://peps.python.org/pep-0594/" target="_blank" rel="noopener">PEP 594 — Removing dead batteries from the standard library</a></li></ul>`);

sl('Python','telnetlib 탈출 — 이주 선택지', `
<h1><span class="no">P5</span>telnetlib 탈출 — 이주 매핑표</h1>
<p>기존 <code>telnetlib</code> 호출을 무엇으로 바꿀지. 협상이 거의 없는 텍스트 프로토콜(HTTP·SMTP)은 <strong>raw socket</strong>이면 충분합니다.</p>
<div class="tw"><table class="tbl">
<thead><tr><th>telnetlib</th><th>raw socket</th><th>telnetlib3 (async)</th></tr></thead>
<tbody>
<tr><td><code>Telnet(h, p)</code></td><td><code>socket.create_connection((h,p))</code></td><td><code>await telnetlib3.open_connection(h,p)</code></td></tr>
<tr><td><code>tn.write(b)</code></td><td><code>sock.sendall(b)</code></td><td><code>writer.write(s); await writer.drain()</code></td></tr>
<tr><td><code>tn.read_until(x)</code></td><td>직접 루프 + 버퍼</td><td><code>await reader.readuntil(x)</code></td></tr>
<tr><td><code>tn.read_all()</code></td><td><code>recv</code> 루프 until b<span class="st">""</span></td><td><code>await reader.read()</code></td></tr>
<tr><td>IAC 자동 처리</td><td><strong>직접 구현</strong></td><td>라이브러리가 협상 처리</td></tr>
</tbody></table></div>
<div class="tip">가장 흔한 실전 용도(웹/메일 서버 손으로 두드리기)에는 IAC 협상이 필요 없습니다. 이 경우 <code>socket</code> 6줄이면 끝 — 다음 슬라이드.</div>`);

sl('Python','raw socket TELNET 클라이언트', `
<h1><span class="no">P6</span>raw socket — 밑바닥부터 접속·송신·수신</h1>
<p>표준 <code>socket</code>만으로. <code>create_connection</code>은 DNS 해석·다중 주소 폴백·타임아웃까지 처리해 주는 고수준 헬퍼입니다.</p>
<pre class="code"><code><span class="kw">import</span> socket

<span class="kw">def</span> telnet_open(host, port=23, timeout=10):
    s = socket.create_connection((host, port), timeout=timeout)
    s.settimeout(timeout)          <span class="cm"># 이후 recv/send에도 타임아웃 적용</span>
    <span class="kw">return</span> s

sock = telnet_open(<span class="st">"example.com"</span>, 80)
sock.sendall(b<span class="st">"GET / HTTP/1.0\\r\\n\\r\\n"</span>)   <span class="cm"># sendall = 전량 전송 보장</span>

buf = bytearray()
<span class="kw">while</span> <span class="kw">True</span>:
    chunk = sock.recv(4096)        <span class="cm"># recv는 '최대' n바이트, 더 적게 올 수 있음</span>
    <span class="kw">if</span> <span class="kw">not</span> chunk:              <span class="cm"># b'' = 상대가 연결 종료(EOF)</span>
        <span class="kw">break</span>
    buf += chunk
sock.close()
<span class="kw">print</span>(bytes(buf).decode(<span class="st">"latin-1"</span>))</code></pre>
<div class="note"><code>send()</code>와 <code>sendall()</code>은 다릅니다. <code>send()</code>는 일부만 보내고 보낸 바이트 수를 반환 — 직접 루프 돌려야 합니다. <strong>거의 항상 <code>sendall()</code>을 쓰세요.</strong></div>`);

sl('Python','IAC 상수 정의', `
<h1><span class="no">P7</span>먼저 상수부터 — IAC 명령·옵션 코드</h1>
<p>협상을 손으로 다루려면 니모닉 상수를 두는 게 가독성에 결정적입니다. 이 모듈을 <code>tnconst.py</code>로 두고 import하세요.</p>
<pre class="code"><code><span class="cm"># --- 명령 (RFC 854) ---</span>
IAC  = 255   <span class="cm"># 0xFF Interpret As Command</span>
DONT = 254; DO = 253; WONT = 252; WILL = 251
SB   = 250   <span class="cm"># 서브협상 시작</span>
SE   = 240   <span class="cm"># 서브협상 끝</span>
GA   = 249; AYT = 246; IP = 244; NOP = 241

<span class="cm"># --- 옵션 코드 ---</span>
BINARY = 0        <span class="cm"># RFC 856</span>
ECHO   = 1        <span class="cm"># RFC 857</span>
SGA    = 3        <span class="cm"># Suppress Go-Ahead, RFC 858</span>
TTYPE  = 24       <span class="cm"># Terminal-Type, RFC 1091</span>
NAWS   = 31       <span class="cm"># Window Size, RFC 1073</span>
LINEMODE = 34     <span class="cm"># RFC 1184</span>

<span class="cm"># 서브협상 부명령</span>
IS, SEND = 0, 1   <span class="cm"># TTYPE: IAC SB TTYPE IS/SEND ...</span></code></pre>
<p>협상 3바이트는 언제나 <code>bytes([IAC, verb, option])</code> 형태 — 예: <code>DO SGA</code> = <code>bytes([IAC, DO, SGA])</code> = <code>b"\\xff\\xfd\\x03"</code>.</p>`);

sl('Python','IAC 파서 — 바이트 상태기계', `
<h1><span class="no">P8</span>IAC 파서 — 순수 함수 상태기계</h1>
<p>수신 버퍼에서 <em>제어 시퀀스</em>와 <em>순수 데이터</em>를 분리하는 핵심 함수. 협상을 다루는 모든 코드의 심장입니다.</p>
<pre class="code"><code><span class="kw">def</span> iac_split(buf: bytes):
    <span class="st">"""(clean_data, commands) — 버퍼에서 IAC 시퀀스를 뽑아낸다."""</span>
    out, cmds = bytearray(), []
    i, n = 0, len(buf)
    <span class="kw">while</span> i &lt; n:
        <span class="kw">if</span> buf[i] != IAC:
            out.append(buf[i]); i += 1; <span class="kw">continue</span>
        <span class="kw">if</span> i + 1 &gt;= n:
            <span class="kw">break</span>                              <span class="cm"># 끝에 걸친 IAC: 미완성</span>
        c = buf[i + 1]
        <span class="kw">if</span> c == IAC:                        <span class="cm"># 0xFF 0xFF -&gt; 데이터 0xFF 하나</span>
            out.append(IAC); i += 2
        <span class="kw">elif</span> c <span class="kw">in</span> (DO, DONT, WILL, WONT):
            cmds.append((c, buf[i + 2])); i += 3
        <span class="kw">elif</span> c == SB:                       <span class="cm"># IAC SB ... IAC SE</span>
            end = buf.index(bytes([IAC, SE]), i)
            cmds.append((SB, bytes(buf[i + 2:end]))); i = end + 2
        <span class="kw">else</span>:                               <span class="cm"># NOP/GA/AYT ... 2바이트 명령</span>
            cmds.append((c, <span class="kw">None</span>)); i += 2
    <span class="kw">return</span> bytes(out), cmds</code></pre>
<div class="note">실전에서는 SB의 <code>IAC SE</code>가 이번 <code>recv</code>에 다 안 담길 수 있습니다. 견고한 구현은 미완성 조각을 <em>남겨두고</em> 다음 수신과 이어붙입니다(스트리밍 파서). 위는 한 버퍼 완결 가정.</div>`);

sl('Python','협상 응답 — refuse-all 기준선', `
<h1><span class="no">P9</span>refuse-all — 아무것도 협상 안 하는 안전 기준</h1>
<p>협상의 가장 안전한 출발점: <strong>모든 제안을 거절</strong>. 서버가 <code>DO x</code>(당신이 x 하라)면 <code>WONT x</code>, <code>WILL x</code>(내가 x 하겠다)면 <code>DONT x</code>로 답합니다. 무한 루프 방지가 핵심(RFC 854).</p>
<pre class="code"><code><span class="kw">def</span> refuse_all(sock, cmds):
    <span class="st">"""iac_split이 준 명령 목록에 '전부 거절'로 응답."""</span>
    reply = bytearray()
    <span class="kw">for</span> cmd, opt <span class="kw">in</span> cmds:
        <span class="kw">if</span> cmd == DO:                 <span class="cm"># "네가 해라" -&gt; 안 함</span>
            reply += bytes([IAC, WONT, opt])
        <span class="kw">elif</span> cmd == WILL:             <span class="cm"># "내가 하겠다" -&gt; 하지 마라</span>
            reply += bytes([IAC, DONT, opt])
        <span class="cm"># DONT/WONT 는 이미 '꺼짐' 상태이므로 응답 불필요(재확인 금지)</span>
    <span class="kw">if</span> reply:
        sock.sendall(bytes(reply))</code></pre>
<div class="fx">핵심 규칙: <strong>상태가 바뀔 때만 응답</strong>한다. 이미 원하는 상태면 침묵 — 안 그러면 WILL↔DONT가 끝없이 오가는 <em>협상 루프</em>에 빠집니다(RFC 1143 Q-method이 이를 정식으로 해결).</div>`);

sl('Python','TERMINAL-TYPE 서브협상', `
<h1><span class="no">P10</span>TERMINAL-TYPE — 서브협상 인코딩/디코딩</h1>
<p>서버가 단말 종류를 물으면(<code>IAC SB TTYPE SEND IAC SE</code>) 우리가 <code>IS</code>로 응답합니다. <code>vt100</code>, <code>xterm-256color</code> 같은 이름을 실어 보냅니다(RFC 1091).</p>
<pre class="code"><code><span class="kw">def</span> make_ttype_is(term=b<span class="st">"xterm-256color"</span>) -&gt; bytes:
    <span class="cm"># IAC SB TTYPE IS &lt;term&gt; IAC SE</span>
    <span class="kw">return</span> bytes([IAC, SB, TTYPE, IS]) + term + bytes([IAC, SE])

<span class="kw">def</span> handle_sb(payload: bytes, sock):
    opt = payload[0]
    <span class="kw">if</span> opt == TTYPE <span class="kw">and</span> payload[1:2] == bytes([SEND]):
        sock.sendall(make_ttype_is())        <span class="cm"># 서버가 SEND -&gt; 우리가 IS</span>

<span class="cm"># 실제 바이트 확인</span>
<span class="kw">print</span>(make_ttype_is(b<span class="st">"vt100"</span>).hex(<span class="st">" "</span>))
<span class="cm"># ff fa 18 00 76 74 31 30 30 ff f0</span>
<span class="cm">#   IAC SB TT IS  v  t  1  0  0 IAC SE</span></code></pre>
<p>서버는 여러 번 <code>SEND</code>를 보내 <em>선호 목록</em>을 순회할 수 있습니다. 같은 이름을 두 번 보내면 "더 없음"의 관례 신호입니다.</p>`);

sl('Python','NAWS — struct로 16비트 창 크기', `
<h1><span class="no">P11</span>NAWS — struct로 16비트 창 크기 패킹</h1>
<p>Negotiate About Window Size: 폭·높이를 각각 <strong>부호 없는 16비트 big-endian</strong>으로. 페이로드 안의 <code>0xFF</code>는 IAC로 오인되지 않게 <code>0xFF 0xFF</code>로 이스케이프(RFC 1073).</p>
<pre class="code"><code><span class="kw">import</span> struct

<span class="kw">def</span> make_naws(cols: int, rows: int) -&gt; bytes:
    body = struct.pack(<span class="st">"!HH"</span>, cols, rows)      <span class="cm"># ! = network(big-endian), H = uint16</span>
    body = body.replace(b<span class="st">"\\xff"</span>, b<span class="st">"\\xff\\xff"</span>)   <span class="cm"># SB 내부 IAC 이스케이프</span>
    <span class="kw">return</span> bytes([IAC, SB, NAWS]) + body + bytes([IAC, SE])

<span class="kw">print</span>(make_naws(80, 24).hex(<span class="st">" "</span>))
<span class="cm"># ff fa 1f 00 50 00 18 ff f0</span>
<span class="cm">#  IAC SB NAWS |80 | 24| IAC SE   (0x0050=80, 0x0018=24)</span>

<span class="cm"># 디코딩</span>
cols, rows = struct.unpack(<span class="st">"!HH"</span>, b<span class="st">"\\x00\\x50\\x00\\x18"</span>)
<span class="kw">assert</span> (cols, rows) == (80, 24)</code></pre>
<div class="tip"><code>struct.pack("!HH", ...)</code>가 곧 "big-endian 16비트 둘". <code>!</code>=네트워크 바이트 순서, <code>H</code>=<code>unsigned short</code>. NAWS는 SB 페이로드가 정확히 4바이트라 파싱이 단순합니다(이스케이프 전 기준).</div>`);

sl('Python','HTTP GET over raw socket', `
<h1><span class="no">P12</span>HTTP GET을 소켓으로 — "Python 속 telnet"</h1>
<p>가장 실용적인 관용구: <code>telnet host 80</code>을 코드로 옮긴 것. HTTP/1.1은 <code>Host</code> 헤더가 필수, 빈 줄(<code>\\r\\n</code>만 있는 줄)이 헤더의 끝입니다.</p>
<pre class="code"><code><span class="kw">import</span> socket

<span class="kw">def</span> http_get(host, path=<span class="st">"/"</span>, port=80):
    req = (
        f<span class="st">"GET {path} HTTP/1.1\\r\\n"</span>
        f<span class="st">"Host: {host}\\r\\n"</span>
        <span class="st">"User-Agent: raw-socket/1.0\\r\\n"</span>
        <span class="st">"Connection: close\\r\\n"</span>          <span class="cm"># 응답 후 서버가 끊게</span>
        <span class="st">"\\r\\n"</span>                             <span class="cm"># 헤더 종료(빈 줄)</span>
    ).encode(<span class="st">"ascii"</span>)

    <span class="kw">with</span> socket.create_connection((host, port), timeout=10) <span class="kw">as</span> s:
        s.sendall(req)
        chunks = []
        <span class="kw">while</span> (b := s.recv(65536)):        <span class="cm"># Connection: close 라 EOF까지</span>
            chunks.append(b)
    <span class="kw">return</span> b<span class="st">""</span>.join(chunks)

raw = http_get(<span class="st">"example.com"</span>)
head, _, body = raw.partition(b<span class="st">"\\r\\n\\r\\n"</span>)   <span class="cm"># 헤더/바디 분리</span>
<span class="kw">print</span>(head.decode(<span class="st">"latin-1"</span>))</code></pre>
<div class="note">HTTP/1.1 + <code>Connection: close</code>가 아니면 서버가 연결을 열어둬 <code>recv</code>가 영원히 막힐 수 있습니다. keep-alive를 쓰려면 <code>Content-Length</code>나 청크 인코딩을 직접 파싱해 프레이밍해야 합니다.</div>`);

sl('Python','손수 짠 HTTP vs http.client', `
<h1><span class="no">P13</span>손수 짠 HTTP vs 표준 http.client</h1>
<p>학습·디버깅엔 raw socket, 실전엔 표준 <code>http.client</code>(또는 <code>requests</code>). 같은 GET을 표준으로 하면 프레이밍·상태줄 파싱이 공짜입니다.</p>
<div class="cols">
<div>
<h3>raw socket</h3>
<pre class="code"><code>s = socket.create_connection(
        (<span class="st">"example.com"</span>, 80))
s.sendall(

<span class="cm"># 상태줄·헤더·바디를</span>
<span class="cm"># 전부 직접 파싱해야 함</span>

</div>

<span class="kw">print</span>(r.status, r.reason)   <span class="cm"># 200 OK</span>

sl('Python','SMTP를 소켓으로 손수', `
<h1><span class="no">P14</span>SMTP를 소켓으로 손수 (telnet mail 25)</h1>
<p>SMTP는 줄 단위 텍스트 프로토콜이라 손으로 말하기 좋습니다. 각 명령 뒤 서버의 <strong>3자리 응답 코드</strong>를 읽어야 합니다(220 인사, 250 OK, 354 데이터 대기).</p>
<pre class="code"><code><span class="kw">import</span> socket

<span class="kw">def</span> readline(s) -&gt; str:
    line = b<span class="st">""</span>
    <span class="kw">while</span> <span class="kw">not</span> line.endswith(b<span class="st">"\\r\\n"</span>):
        c = s.recv(1)
        <span class="kw">if</span> <span class="kw">not</span> c: <span class="kw">break</span>
        line += c
    <span class="kw">return</span> line.decode(<span class="st">"ascii"</span>, <span class="st">"replace"</span>).rstrip()

<span class="kw">with</span> socket.create_connection((<span class="st">"mail.example.com"</span>, 25), timeout=15) <span class="kw">as</span> s:
    <span class="kw">print</span>(readline(s))                                <span class="cm"># 220 mx 인사</span>
    s.sendall(b<span class="st">"EHLO client.example\\r\\n"</span>); <span class="kw">print</span>(readline(s))
    s.sendall(b<span class="st">"MAIL FROM:&lt;me@example.com&gt;\\r\\n"</span>); <span class="kw">print</span>(readline(s))
    s.sendall(b<span class="st">"RCPT TO:&lt;you@example.com&gt;\\r\\n"</span>); <span class="kw">print</span>(readline(s))
    s.sendall(b<span class="st">"DATA\\r\\n"</span>); <span class="kw">print</span>(readline(s))          <span class="cm"># 354 데이터 입력</span>
    s.sendall(b<span class="st">"Subject: hi\\r\\n\\r\\nHello.\\r\\n.\\r\\n"</span>)         <span class="cm"># 단독 '.' 줄 = 끝</span>
    <span class="kw">print</span>(readline(s))                                <span class="cm"># 250 큐잉됨</span>
    s.sendall(b<span class="st">"QUIT\\r\\n"</span>); <span class="kw">print</span>(readline(s))</code></pre>

sl('Python','smtplib 대조 — 표준으로', `

<pre class="code"><code><span class="kw">async def</span> read_clean(reader, writer):
    <span class="st">"""IAC 협상을 소비(전부 거절)하고 데이터 바이트만 흘려보낸다."""</span>

        <span class="kw">if</span> b[0] != IAC:

            <span class="kw">yield</span> b<span class="st">"\\xff"</span>                            <span class="cm"># 이스케이프된 데이터 0xFF</span>

sl('Python','서버에 SGA/ECHO 협상 추가', `
<h1><span class="no">P22</span>서버에 SGA/ECHO 협상 붙이기</h1>
<p>서버가 <code>WILL ECHO</code>·<code>WILL SGA</code>를 먼저 제안하면 클라이언트가 char-at-a-time로 전환하고, 서버가 입력을 에코합니다(대화형 셸의 기본 세팅).</p>

            <span class="kw">if</span> <span class="kw">not</span> data:

            clean, cmds = iac_split(data)       <span class="cm"># P8 파서 재사용</span>

                <span class="kw">if</span> cmd == DO <span class="kw">and</span> opt <span class="kw">in</span> (ECHO, SGA):
                    <span class="kw">pass</span>                        <span class="cm"># 이미 WILL 했음, 재확인 금지</span>
                <span class="kw">elif</span> cmd == DONT:
                    r.sendall(bytes([IAC, WONT, opt]))

sl('Python','CRLF/NVT 올바르게 다루기', `
<h1><span class="no">P23</span>CRLF / NVT를 올바르게 다루기</h1>
<p>NVT의 핵심 규칙(RFC 854): <strong>줄끝은 CR LF</strong>. 그리고 <em>데이터로서의 CR</em>은 반드시 <code>CR NUL</code>이어야 합니다(맨 CR 금지). 파이썬 <code>"\\n"</code>을 그대로 보내면 서버가 못 알아들을 수 있습니다.</p>
<pre class="code"><code><span class="cm"># 줄끝 = CR LF (0x0D 0x0A)</span>
wire = <span class="st">"hello"</span>.encode(<span class="st">"ascii"</span>) + b<span class="st">"\\r\\n"</span>

<span class="cm"># 데이터로서의 단독 CR 은 CR NUL 로:</span>
cr_as_data = b<span class="st">"\\r\\x00"</span>

<span class="kw">def</span> to_nvt(text: str) -&gt; bytes:
    <span class="st">"""OS별 줄끝(\\n, \\r\\n, \\r)을 NVT CR LF 로 정규화."""</span>
    normalized = text.replace(<span class="st">"\\r\\n"</span>, <span class="st">"\\n"</span>).replace(<span class="st">"\\r"</span>, <span class="st">"\\n"</span>)
    <span class="kw">return</span> normalized.replace(<span class="st">"\\n"</span>, <span class="st">"\\r\\n"</span>).encode(<span class="st">"latin-1"</span>)

<span class="kw">assert</span> to_nvt(<span class="st">"a\\nb"</span>) == b<span class="st">"a\\r\\nb"</span>
<span class="kw">assert</span> to_nvt(<span class="st">"a\\r\\nb"</span>) == b<span class="st">"a\\r\\nb"</span>   <span class="cm"># 이중 변환 방지</span></code></pre>
<div class="note">흔한 버그: <code>b"cmd\\n"</code>만 보내기. 많은 텔넷/라인 프로토콜 서버가 <code>\\r</code> 없는 줄을 무시하거나 명령 끝으로 안 봅니다. <strong>항상 <code>\\r\\n</code></strong>. HTTP·SMTP·POP3·IRC 전부 동일.</div>`);

sl('Python','타임아웃과 부분 수신', `
<h1><span class="no">P24</span>타임아웃과 부분 수신 — recv는 거짓말한다</h1>
<p><code>recv(n)</code>은 "최대 n바이트"일 뿐, 요청보다 적게 올 수 있습니다. 정확히 n바이트가 필요하면 루프가 필수. 타임아웃은 <code>socket.timeout</code> 예외로 옵니다.</p>
<pre class="code"><code><span class="kw">import</span> socket

<span class="kw">def</span> recv_exact(sock, n: int, timeout=10) -&gt; bytes:
    sock.settimeout(timeout)
    buf = bytearray()
    <span class="kw">while</span> len(buf) &lt; n:
        <span class="kw">try</span>:
            chunk = sock.recv(n - len(buf))    <span class="cm"># 남은 만큼만 요청</span>
        <span class="kw">except</span> socket.timeout:
            <span class="kw">raise</span> TimeoutError(f<span class="st">"got {len(buf)}/{n} bytes"</span>)
        <span class="kw">if</span> <span class="kw">not</span> chunk:
            <span class="kw">raise</span> ConnectionError(<span class="st">"peer closed early"</span>)
        buf.extend(chunk)
    <span class="kw">return</span> bytes(buf)</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>모드</th><th>설정</th><th>recv 동작</th></tr></thead>
<tbody>
<tr><td>블로킹(기본)</td><td><code>settimeout(None)</code></td><td>데이터 올 때까지 무한 대기</td></tr>
<tr><td>타임아웃</td><td><code>settimeout(10)</code></td><td>10초 내 없으면 <code>socket.timeout</code></td></tr>
<tr><td>논블로킹</td><td><code>settimeout(0)</code></td><td>즉시 없으면 <code>BlockingIOError</code></td></tr>
</tbody></table></div>`);

sl('Python','줄 프레이밍 — makefile', `

<span class="cm"># 버퍼드 파일: 줄 단위 읽기가 공짜</span>
<span class="kw">with</span> sock.makefile(<span class="st">"rb"</span>) <span class="kw">as</span> f:

    <span class="kw">for</span> line <span class="kw">in</span> f:
        <span class="kw">if</span> line <span class="kw">in</span> (b<span class="st">"\\r\\n"</span>, b<span class="st">"\\n"</span>, b<span class="st">""</span>):
            <span class="kw">break</span>                        <span class="cm"># 빈 줄 = 헤더 끝</span>
        k, _, v = line.partition(b<span class="st">":"</span>)
        headers[k.strip().lower()] = v.strip()
    body = f.read()                      <span class="cm"># 나머지 전부</span>

<span class="kw">print</span>(status, len(body), <span class="st">"bytes"</span>)</code></pre>
<div class="note"><code>makefile</code>은 내부 버퍼를 씁니다. 같은 소켓에 <code>recv</code>와 <code>makefile</code>을 <strong>섞으면</strong> 파일 버퍼에 데이터가 갇혀 데이터를 잃습니다. 하나만 쓰세요.</div>`);

sl('Python','bytes vs str — 인코딩 함정', `
<h1><span class="no">P27</span>bytes vs str — 소켓의 영원한 함정</h1>
<p>소켓은 <strong>오직 bytes</strong>만 다룹니다. <code>str</code>을 그냥 <code>sendall</code>하면 <code>TypeError</code>. 인코딩 선택이 버그를 가릅니다.</p>
<pre class="code"><code>b = b<span class="st">"\\xe9"</span>                   <span class="cm"># 바이트 하나 0xE9</span>
b.decode(<span class="st">"ascii"</span>)             <span class="cm"># UnicodeDecodeError! (0x80 이상)</span>
b.decode(<span class="st">"latin-1"</span>)           <span class="cm"># 'é'  (바이트&lt;-&gt;코드포인트 1:1, 절대 실패 안 함)</span>

<span class="st">"café"</span>.encode(<span class="st">"ascii"</span>)      <span class="cm"># UnicodeEncodeError</span>
<span class="st">"café"</span>.encode(<span class="st">"utf-8"</span>)      <span class="cm"># b'caf\\xc3\\xa9'</span>

<span class="cm"># 라인 프로토콜 실전 규칙:</span>
<span class="cm">#   송신:  text.encode("ascii")    -&gt; 비ASCII면 크게 실패(안전)</span>
<span class="cm">#   수신:  data.decode("latin-1")  -&gt; 무손실, 로깅/디버깅에 최적</span></code></pre>
<div class="fx"><code>latin-1</code>은 0x00–0xFF를 U+0000–U+00FF로 <strong>1:1 왕복</strong>시킵니다. 임의 바이너리를 <em>절대 예외 없이</em> str로 보고 싶을 때(디버그 덤프) 최적의 디코더입니다.</div>`);

sl('Python','테스트 — 로컬 에코 서버', `
<h1><span class="no">P28</span>테스트 — 로컬호스트 에코 서버로 검증</h1>
<p>네트워크 코드는 <em>결정적</em>으로 테스트해야 합니다. 포트 <code>0</code>으로 열면 OS가 빈 포트를 배정, 스레드로 서버를 띄우고 같은 프로세스에서 접속해 왕복을 확인합니다.</p>
<pre class="code"><code><span class="kw">import</span> socket, threading, socketserver

<span class="kw">class</span> Echo(socketserver.BaseRequestHandler):
    <span class="kw">def</span> handle(self):
        <span class="kw">while</span> (d := self.request.recv(1024)):
            self.request.sendall(d)

srv = socketserver.TCPServer((<span class="st">"127.0.0.1"</span>, 0), Echo)   <span class="cm"># 포트 0 = 자동 할당</span>
threading.Thread(target=srv.serve_forever, daemon=<span class="kw">True</span>).start()
host, port = srv.server_address                       <span class="cm"># 실제 배정된 포트</span>

<span class="kw">with</span> socket.create_connection((host, port), timeout=2) <span class="kw">as</span> c:
    c.sendall(b<span class="st">"ping\\r\\n"</span>)
    <span class="kw">assert</span> c.recv(1024) == b<span class="st">"ping\\r\\n"</span>            <span class="cm"># 왕복 검증</span>

<span class="kw">print</span>(<span class="st">"echo OK on port"</span>, port)
srv.shutdown()</code></pre>
<div class="tip">이 패턴(임시 포트 + 데몬 스레드 서버)은 <code>pytest</code> fixture로 그대로 옮길 수 있습니다. 외부 네트워크 의존 없이 클라이언트 로직을 CI에서 검증하세요.</div>`);

sl('Python','NAWS 다시 — struct 심화', `
<h1><span class="no">P29</span>NAWS 심화 — struct로 16비트 왕복 검증</h1>
<p>NAWS·서브협상 페이로드는 결국 이진 패킹입니다. <code>struct</code>가 표준 도구(scapy는 과함). 폭·높이가 255를 넘으면 왜 16비트가 필요한지 분명해집니다.</p>
<pre class="code"><code><span class="kw">import</span> struct

cols, rows = 132, 43                       <span class="cm"># 8비트로는 표현 불가한 값도 대비</span>
payload = struct.pack(<span class="st">"!HH"</span>, cols, rows)   <span class="cm"># b'\\x00\\x84\\x00\\x2b'</span>
<span class="kw">assert</span> struct.unpack(<span class="st">"!HH"</span>, payload) == (132, 43)

<span class="cm"># SB 안의 0xFF 는 IAC로 오인되지 않게 이스케이프</span>
escaped = payload.replace(b<span class="st">"\\xff"</span>, b<span class="st">"\\xff\\xff"</span>)
frame = bytes([IAC, SB, NAWS]) + escaped + bytes([IAC, SE])

<span class="cm"># 수신 측: SB 페이로드 언이스케이프 후 언팩</span>
<span class="kw">def</span> parse_naws(sb_payload: bytes):
    raw = sb_payload.replace(b<span class="st">"\\xff\\xff"</span>, b<span class="st">"\\xff"</span>)
    <span class="kw">if</span> len(raw) != 4:
        <span class="kw">raise</span> ValueError(<span class="st">"NAWS 페이로드는 4바이트여야"</span>)
    <span class="kw">return</span> struct.unpack(<span class="st">"!HH"</span>, raw)          <span class="cm"># (cols, rows)</span></code></pre>
<div class="note">포맷 문자열 <code>"!HH"</code> 분해: <code>!</code>=network(big-endian), <code>H</code>=<code>unsigned short</code>(2바이트). scapy는 패킷 <em>계층</em> 정의엔 좋지만, TELNET SB 같은 단순 이진 필드엔 표준 <code>struct</code>가 더 가볍고 명확합니다.</div>`);

sl('Python','보안 — telnet 대신 SSH', `
<h1><span class="no">P30</span>보안 결론 — 자격증명 하드코딩 금지, SSH를 써라</h1>
<p>TELNET은 <strong>비밀번호를 평문</strong>으로 흘립니다. 학습·디버깅 도구로는 훌륭하지만, 실장비 로그인은 언제나 SSH. Python이면 <code>paramiko</code>(또는 네트워크 장비용 <code>netmiko</code>).</p>
<pre class="code"><code><span class="cm"># TELNET 은 자격증명을 평문 전송. 실장비엔 반드시 SSH.</span>

cli = paramiko.SSHClient()
cli.load_system_host_keys()
cli.set_missing_host_key_policy(paramiko.RejectPolicy())   <span class="cm"># 호스트키 검증!</span>

            password=os.environ[<span class="st">"DEVICE_PW"</span>])            <span class="cm"># 소스가 아닌 환경변수에서</span>

stdin, stdout, stderr = cli.exec_command(<span class="st">"show version"</span>)
<span class="kw">print</span>(stdout.read().decode())
cli.close()</code></pre>
<div class="note"><strong>절대 하지 말 것</strong>: 소스코드·git에 비밀번호 문자열 넣기, <code>AutoAddPolicy()</code>로 호스트키 무검증(MITM에 노출), 평문 TELNET으로 로그인. 자격증명은 환경변수·<code>keyring</code>·시크릿 매니저·SSH 키로.</div>
<div class="fx big">요약: <em>프로토콜을 배우려면</em> telnet/raw socket, <em>실제로 로그인하려면</em> SSH. 이 둘을 혼동하지 마세요.</div>`);

sl('Go','왜 Go인가 · net 패키지 첫 접속', `
<h1><span class="no">G1</span>왜 Go로 TELNET을 짜는가</h1>
<p>Go는 <strong>표준 라이브러리 <code>net</code></strong> 하나로 TCP 소켓을 열고, <em>고루틴</em>으로 읽기·쓰기를 동시에 돌리며, <code>io.Reader</code>/<code>io.Writer</code> 인터페이스로 스트림을 조립한다. TELNET처럼 <em>바이트 스트림 + 인밴드 제어</em>인 프로토콜에 이상적이다.</p>
<div class="cols">
<div>
<h3>Go가 잘 맞는 이유</h3>
<ul>
<li><code>net.Conn</code>이 곧 <code>io.ReadWriteCloser</code> — 파이프처럼 조립</li>
<li>goroutine + channel로 <em>양방향 대화형</em>을 자연스럽게 표현</li>
<li>정적 바이너리·크로스컴파일 — 배포가 단순</li>
<li>외부 의존성 0으로 클라이언트/서버 모두 작성 가능</li>
</ul>
</div>
<div>
<pre class="code"><code><span class="kw">package</span> main

<span class="kw">import</span> (
	<span class="st">"fmt"</span>
	<span class="st">"net"</span>
)

<span class="kw">func</span> main() {
	conn, err := net.Dial(<span class="st">"tcp"</span>, <span class="st">"towel.blinkenlights.nl:23"</span>)
	<span class="kw">if</span> err != <span class="kw">nil</span> {
		fmt.Println(<span class="st">"dial:"</span>, err)
		<span class="kw">return</span>
	}
	<span class="kw">defer</span> conn.Close()
	fmt.Println(<span class="st">"connected to"</span>, conn.RemoteAddr())
}</code></pre>
</div>
</div>
<div class="tip"><code>net.Dial("tcp", host+":23")</code> 한 줄이면 TCP 23번 세션이 열린다. 반환된 <code>conn</code>은 읽고 쓰고 닫을 수 있는 스트림이다.</div>`);

sl('Go','net 패키지 핵심 타입', `
<h1><span class="no">G2</span>net 패키지 핵심 타입</h1>
<p><code>net.Conn</code>은 인터페이스다. TCP·Unix·TLS 소켓이 모두 이 인터페이스를 구현하므로, TELNET 로직을 <em>구체 타입에 묶지 않고</em> 짤 수 있다.</p>
<pre class="code"><code><span class="cm">// net.Conn — 모든 스트림 소켓의 공통 인터페이스</span>
<span class="kw">type</span> Conn <span class="kw">interface</span> {
	Read(b []<span class="kw">byte</span>) (n <span class="kw">int</span>, err <span class="kw">error</span>)
	Write(b []<span class="kw">byte</span>) (n <span class="kw">int</span>, err <span class="kw">error</span>)
	Close() <span class="kw">error</span>
	LocalAddr() Addr
	RemoteAddr() Addr
	SetDeadline(t time.Time) <span class="kw">error</span>
	SetReadDeadline(t time.Time) <span class="kw">error</span>
	SetWriteDeadline(t time.Time) <span class="kw">error</span>
}</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>타입/함수</th><th>역할</th></tr></thead>
<tbody>
<tr><td><code>net.Dial(network, addr)</code></td><td>클라이언트 접속. <code>"tcp"</code>, <code>"tcp4"</code>, <code>"tcp6"</code></td></tr>
<tr><td><code>net.Dialer{Timeout,KeepAlive}</code></td><td>타임아웃·컨텍스트 있는 다이얼</td></tr>
<tr><td><code>net.Listen("tcp", ":23")</code></td><td>서버 리슨 소켓 생성</td></tr>
<tr><td><code>net.JoinHostPort(h, p)</code></td><td>IPv6까지 안전한 <code>host:port</code> 조립</td></tr>
</tbody></table></div>
<pre class="code"><code>d := net.Dialer{Timeout: <span class="nb">5</span> * time.Second, KeepAlive: <span class="nb">30</span> * time.Second}
conn, err := d.Dial(<span class="st">"tcp"</span>, net.JoinHostPort(host, <span class="st">"23"</span>))</code></pre>`);

sl('Go','raw 대화형 클라이언트 · io.Copy', `
<h1><span class="no">G3</span>가장 짧은 대화형 클라이언트</h1>
<p><code>io.Copy(dst, src)</code>는 EOF까지 스트림을 통째로 복사한다. 한쪽은 <em>키보드→소켓</em>, 다른 쪽은 <em>소켓→화면</em>. 두 방향을 고루틴 하나로 나누면 완전한 대화형 텔넷이 된다.</p>
<pre class="code"><code><span class="kw">func</span> main() {
	conn, err := net.Dial(<span class="st">"tcp"</span>, <span class="st">"localhost:23"</span>)
	<span class="kw">if</span> err != <span class="kw">nil</span> {
		log.Fatal(err)
	}
	<span class="kw">defer</span> conn.Close()

	<span class="cm">// server -&gt; 화면 (백그라운드)</span>
	<span class="kw">go</span> io.Copy(os.Stdout, conn)
	<span class="cm">// 키보드 -&gt; server (메인 고루틴이 블록)</span>
	io.Copy(conn, os.Stdin)
}</code></pre>
<div class="note">이 단순 버전은 <code>IAC</code> 협상 바이트(0xFF...)를 <em>그대로 화면에 출력</em>한다. 실전에서는 다음 슬라이드의 파서로 제어 바이트를 걸러내야 한다.</div>
<p class="mut small"><code>io.Copy</code>는 내부적으로 32KB 버퍼를 재사용하므로 바이트당 syscall이 아니다.</p>`);

sl('Go','bufio 버퍼링 IO', `
<h1><span class="no">G4</span>bufio.Reader / bufio.Writer</h1>
<p>소켓을 바이트 단위로 <code>ReadByte</code>/<code>WriteByte</code> 하면 syscall 폭탄이 된다. <code>bufio</code>로 감싸면 커널 왕복이 버퍼 단위로 줄고, 라인 읽기·바이트 되돌리기(<code>UnreadByte</code>) 같은 편의가 붙는다.</p>
<pre class="code"><code>r := bufio.NewReader(conn)
w := bufio.NewWriter(conn)

<span class="cm">// 라인 단위 읽기 — CRLF 텔넷 라인 모드에 유용</span>
line, err := r.ReadString(<span class="st">'\\n'</span>) <span class="cm">// \\n 포함까지 읽음</span>
<span class="kw">if</span> err != <span class="kw">nil</span> {
	<span class="kw">return</span> err
}
line = strings.TrimRight(line, <span class="st">"\\r\\n"</span>)

<span class="cm">// 쓰기는 버퍼에 쌓이므로 반드시 Flush</span>
w.WriteString(<span class="st">"USER guest\\r\\n"</span>)
<span class="kw">if</span> err := w.Flush(); err != <span class="kw">nil</span> { <span class="cm">// 이걸 잊으면 아무것도 안 감</span>
	<span class="kw">return</span> err
}</code></pre>
<div class="fx"><code>bufio.Writer</code>는 <strong>지연 전송</strong>이다 — <code>Flush()</code>를 호출해야 실제로 소켓에 나간다. 협상 응답을 보낼 때 특히 주의.</div>`);

sl('Go','명령 · 옵션 코드 const 블록', `
<h1><span class="no">G5</span>모든 코드를 const로</h1>
<p>매직 넘버 대신 니모닉 상수로. <code>byte</code> 타입을 명시해 <code>[]byte{IAC, WILL, OptSGA}</code>처럼 바로 쓴다.</p>
<pre class="code"><code><span class="kw">package</span> telnet

<span class="cm">// 명령 바이트 (RFC 854)</span>
<span class="kw">const</span> (
	IAC  <span class="kw">byte</span> = <span class="nb">255</span> <span class="cm">// 0xFF Interpret As Command</span>
	DONT <span class="kw">byte</span> = <span class="nb">254</span>
	DO   <span class="kw">byte</span> = <span class="nb">253</span>
	WONT <span class="kw">byte</span> = <span class="nb">252</span>
	WILL <span class="kw">byte</span> = <span class="nb">251</span>
	SB   <span class="kw">byte</span> = <span class="nb">250</span> <span class="cm">// Subnegotiation Begin</span>
	GA   <span class="kw">byte</span> = <span class="nb">249</span>
	EL   <span class="kw">byte</span> = <span class="nb">248</span>
	EC   <span class="kw">byte</span> = <span class="nb">247</span>
	AYT  <span class="kw">byte</span> = <span class="nb">246</span>
	AO   <span class="kw">byte</span> = <span class="nb">245</span>
	IP   <span class="kw">byte</span> = <span class="nb">244</span>
	BRK  <span class="kw">byte</span> = <span class="nb">243</span>
	DM   <span class="kw">byte</span> = <span class="nb">242</span>
	NOP  <span class="kw">byte</span> = <span class="nb">241</span>
	SE   <span class="kw">byte</span> = <span class="nb">240</span> <span class="cm">// Subnegotiation End</span>
)

<span class="cm">// 옵션 코드 (RFC 855·1091·1073·1184 ...)</span>
<span class="kw">const</span> (
	OptBinary     <span class="kw">byte</span> = <span class="nb">0</span>
	OptEcho       <span class="kw">byte</span> = <span class="nb">1</span>
	OptSGA        <span class="kw">byte</span> = <span class="nb">3</span>  <span class="cm">// suppress-go-ahead</span>
	OptStatus     <span class="kw">byte</span> = <span class="nb">5</span>
	OptTimingMark <span class="kw">byte</span> = <span class="nb">6</span>
	OptTermType   <span class="kw">byte</span> = <span class="nb">24</span>
	OptNAWS       <span class="kw">byte</span> = <span class="nb">31</span>
	OptTermSpeed  <span class="kw">byte</span> = <span class="nb">32</span>
	OptLinemode   <span class="kw">byte</span> = <span class="nb">34</span>
	OptNewEnviron <span class="kw">byte</span> = <span class="nb">39</span>
	OptCharset    <span class="kw">byte</span> = <span class="nb">42</span>
)</code></pre>`);

sl('Go','IAC 상태 기계 파서', `
<h1><span class="no">G6</span>IAC 파서 — 완전한 상태 기계</h1>
<p><code>bufio.Reader</code>에서 바이트를 하나씩 읽으며 <span class="tg data">DATA</span> / <span class="tg cmd">IAC</span> / <span class="tg sb">SB</span> 상태를 오간다. 데이터 안의 <code>0xFF</code>는 <code>IAC IAC</code>로 이스케이프되므로 <code>stIAC</code>에서 다시 <code>IAC</code>를 만나면 리터럴 바이트다.</p>
<pre class="code"><code><span class="kw">type</span> state <span class="kw">int</span>

<span class="kw">const</span> (
	stData  state = <span class="kw">iota</span>
	stIAC          <span class="cm">// 방금 0xFF 를 봄</span>
	stOpt          <span class="cm">// WILL/WONT/DO/DONT 뒤 옵션 바이트 대기</span>
	stSB           <span class="cm">// 서브협상 페이로드 수집 중</span>
	stSBIAC        <span class="cm">// 서브협상 중 0xFF 를 봄</span>
)

<span class="kw">func</span> Parse(r *bufio.Reader, out io.Writer, h Handler) <span class="kw">error</span> {
	st := stData
	<span class="kw">var</span> cmd <span class="kw">byte</span>
	<span class="kw">var</span> sb []<span class="kw">byte</span>
	<span class="kw">for</span> {
		b, err := r.ReadByte()
		<span class="kw">if</span> err != <span class="kw">nil</span> {
			<span class="kw">return</span> err <span class="cm">// io.EOF 포함</span>
		}
		<span class="kw">switch</span> st {
		<span class="kw">case</span> stData:
			<span class="kw">if</span> b == IAC {
				st = stIAC
			} <span class="kw">else</span> {
				out.Write([]<span class="kw">byte</span>{b}) <span class="cm">// 순수 데이터</span>
			}
		<span class="kw">case</span> stIAC:
			<span class="kw">switch</span> b {
			<span class="kw">case</span> IAC: <span class="cm">// 이스케이프된 0xFF -&gt; 리터럴 데이터</span>
				out.Write([]<span class="kw">byte</span>{IAC})
				st = stData
			<span class="kw">case</span> WILL, WONT, DO, DONT:
				cmd, st = b, stOpt
			<span class="kw">case</span> SB:
				sb, st = sb[:<span class="nb">0</span>], stSB
			<span class="kw">default</span>: <span class="cm">// NOP, GA, AYT ... 단일 바이트 명령</span>
				h.Command(b)
				st = stData
			}
		<span class="kw">case</span> stOpt:
			h.Negotiate(cmd, b) <span class="cm">// 협상 응답 여기서</span>
			st = stData
		<span class="kw">case</span> stSB:
			<span class="kw">if</span> b == IAC {
				st = stSBIAC
			} <span class="kw">else</span> {
				sb = append(sb, b)
			}
		<span class="kw">case</span> stSBIAC:
			<span class="kw">if</span> b == SE {
				h.Subneg(sb) <span class="cm">// IAC SE 로 종료</span>
				st = stData
			} <span class="kw">else</span> { <span class="cm">// IAC IAC -&gt; 리터럴 0xFF</span>
				sb = append(sb, b)
				st = stSB
			}
		}
	}
}</code></pre>`);

sl('Go','서브협상 수집과 디스패치', `
<h1><span class="no">G7</span>SB 페이로드 처리</h1>
<p>파서가 <code>IAC SB &lt;opt&gt; ... IAC SE</code>를 모아 <code>Handler.Subneg(sb)</code>로 넘긴다. <code>sb[0]</code>가 옵션 코드이므로 그걸로 분기한다.</p>
<pre class="code"><code><span class="kw">type</span> Handler <span class="kw">interface</span> {
	Command(cmd <span class="kw">byte</span>)          <span class="cm">// NOP, AYT, GA ...</span>
	Negotiate(cmd, opt <span class="kw">byte</span>)     <span class="cm">// WILL/WONT/DO/DONT</span>
	Subneg(sb []<span class="kw">byte</span>)            <span class="cm">// SB ... SE 페이로드(옵션코드 포함)</span>
}

<span class="kw">func</span> (c *Client) Subneg(sb []<span class="kw">byte</span>) {
	<span class="kw">if</span> len(sb) == <span class="nb">0</span> {
		<span class="kw">return</span>
	}
	<span class="kw">switch</span> sb[<span class="nb">0</span>] { <span class="cm">// 첫 바이트 = 옵션 코드</span>
	<span class="kw">case</span> OptTermType:
		<span class="cm">// IAC SB TERMINAL-TYPE SEND IAC SE  -&gt;  IS 로 응답</span>
		<span class="kw">if</span> len(sb) &gt;= <span class="nb">2</span> &amp;&amp; sb[<span class="nb">1</span>] == subSEND {
			c.Send(termTypeIS(<span class="st">"xterm-256color"</span>))
		}
	<span class="kw">case</span> OptNAWS:
		<span class="kw">if</span> cols, rows, ok := parseNAWS(sb); ok {
			log.Printf(<span class="st">"peer window %dx%d"</span>, cols, rows)
		}
	<span class="kw">default</span>:
		log.Printf(<span class="st">"unhandled SB opt=%d len=%d"</span>, sb[<span class="nb">0</span>], len(sb))
	}
}</code></pre>`);

sl('Go','협상 응답자 · refuse-all', `
<h1><span class="no">G8</span>모두 거절하는 협상 응답자</h1>
<p>가장 단순하고 안전한 정책: <em>어떤 옵션도 켜지 않는다</em>. RFC 854 규칙 — 상대의 <code>DO</code>엔 <code>WONT</code>, <code>WILL</code>엔 <code>DONT</code>로 답하면 협상 루프 없이 순수 NVT로 수렴한다.</p>
<pre class="code"><code><span class="cm">// refuse-all: 어떤 옵션도 활성화하지 않는다.</span>
<span class="kw">func</span> (c *Client) Negotiate(cmd, opt <span class="kw">byte</span>) <span class="kw">error</span> {
	<span class="kw">var</span> reply <span class="kw">byte</span>
	<span class="kw">switch</span> cmd {
	<span class="kw">case</span> DO: <span class="cm">// "이 옵션 켤래?" -&gt; "안 켤게"</span>
		reply = WONT
	<span class="kw">case</span> WILL: <span class="cm">// "내가 켤게" -&gt; "켜지 마"</span>
		reply = DONT
	<span class="kw">case</span> WONT, DONT: <span class="cm">// 이미 꺼짐 — 재확인 불필요(루프 방지)</span>
		<span class="kw">return</span> <span class="kw">nil</span>
	<span class="kw">default</span>:
		<span class="kw">return</span> <span class="kw">nil</span>
	}
	_, err := c.w.Write([]<span class="kw">byte</span>{IAC, reply, opt})
	<span class="kw">if</span> err != <span class="kw">nil</span> {
		<span class="kw">return</span> err
	}
	<span class="kw">return</span> c.w.Flush()
}</code></pre>
<div class="note">RFC 1143의 Q-method은 <em>이미 거절된 옵션을 또 거절하지 않도록</em> 상태를 추적한다. 위 코드는 <code>WONT/DONT</code>에 무응답으로 그 무한 확인 루프를 끊은 축약 버전이다.</div>`);

sl('Go','bytes.Buffer로 협상 시퀀스 조립', `
<h1><span class="no">G9</span>bytes.Buffer 빌더 패턴</h1>
<p>여러 협상·서브협상을 한 번에 보낼 땐 <code>bytes.Buffer</code>에 쌓아 한 번 <code>Write</code>한다 — 부분 전송·인터리브를 피한다.</p>
<pre class="code"><code><span class="kw">func</span> initialOffer() []<span class="kw">byte</span> {
	<span class="kw">var</span> buf bytes.Buffer
	<span class="cm">// 클라이언트가 먼저 제안하는 전형적 3바이트들</span>
	pairs := [][<span class="nb">2</span>]<span class="kw">byte</span>{
		{DO, OptSGA},       <span class="cm">// 서버가 go-ahead 억제하길</span>
		{WILL, OptTermType},<span class="cm">// 단말 종류 알려줄게</span>
		{WILL, OptNAWS},    <span class="cm">// 창 크기 알려줄게</span>
	}
	<span class="kw">for</span> _, p := <span class="kw">range</span> pairs {
		buf.WriteByte(IAC)
		buf.WriteByte(p[<span class="nb">0</span>]) <span class="cm">// 동사</span>
		buf.WriteByte(p[<span class="nb">1</span>]) <span class="cm">// 옵션</span>
	}
	<span class="kw">return</span> buf.Bytes()
}

<span class="cm">// 사용: conn.Write(initialOffer())</span></code></pre>
<div class="tip"><code>bytes.Buffer</code>는 <code>io.Writer</code>이자 <code>io.Reader</code>다. 테스트에서 소켓 대신 넣어 <em>생성된 바이트를 그대로 검증</em>할 수 있다.</div>`);

sl('Go','TERMINAL-TYPE 서브협상', `
<h1><span class="no">G10</span>TERMINAL-TYPE encode/decode</h1>
<p>서버가 <code>IAC SB 24 SEND IAC SE</code>로 물으면, 클라이언트는 <code>IAC SB 24 IS "xterm" IAC SE</code>로 답한다. <code>IS=0</code>, <code>SEND=1</code> (RFC 1091).</p>
<pre class="code"><code><span class="kw">const</span> (
	subIS   <span class="kw">byte</span> = <span class="nb">0</span>
	subSEND <span class="kw">byte</span> = <span class="nb">1</span>
)

<span class="cm">// IAC SB TERMINAL-TYPE IS &lt;name&gt; IAC SE 를 만든다</span>
<span class="kw">func</span> termTypeIS(name <span class="kw">string</span>) []<span class="kw">byte</span> {
	b := []<span class="kw">byte</span>{IAC, SB, OptTermType, subIS}
	b = append(b, []<span class="kw">byte</span>(name)...)
	b = append(b, IAC, SE)
	<span class="kw">return</span> b
}

<span class="cm">// 파서가 넘긴 sb(옵션코드 포함)를 해석</span>
<span class="kw">func</span> parseTermType(sb []<span class="kw">byte</span>) (isSend <span class="kw">bool</span>, name <span class="kw">string</span>) {
	<span class="kw">if</span> len(sb) &lt; <span class="nb">2</span> || sb[<span class="nb">0</span>] != OptTermType {
		<span class="kw">return</span> <span class="kw">false</span>, <span class="st">""</span>
	}
	<span class="kw">switch</span> sb[<span class="nb">1</span>] {
	<span class="kw">case</span> subSEND:
		<span class="kw">return</span> <span class="kw">true</span>, <span class="st">""</span>
	<span class="kw">case</span> subIS:
		<span class="kw">return</span> <span class="kw">false</span>, string(sb[<span class="nb">2</span>:])
	}
	<span class="kw">return</span> <span class="kw">false</span>, <span class="st">""</span>
}</code></pre>`);

sl('Go','NAWS · encoding/binary', `
<h1><span class="no">G11</span>NAWS 창 크기 인코딩</h1>
<p>NAWS(RFC 1073)는 <code>IAC SB 31 W1 W0 H1 H0 IAC SE</code> — 폭·높이를 각각 <strong>16비트 빅엔디언</strong>으로 보낸다. <code>encoding/binary</code>로 정확히 조립한다. 값 바이트가 <code>0xFF</code>이면 <code>IAC IAC</code>로 이스케이프해야 한다.</p>
<pre class="code"><code><span class="kw">import</span> <span class="st">"encoding/binary"</span>

<span class="kw">func</span> nawsSubneg(cols, rows <span class="kw">uint16</span>) []<span class="kw">byte</span> {
	<span class="kw">var</span> dims [<span class="nb">4</span>]<span class="kw">byte</span>
	binary.BigEndian.PutUint16(dims[<span class="nb">0</span>:<span class="nb">2</span>], cols)
	binary.BigEndian.PutUint16(dims[<span class="nb">2</span>:<span class="nb">4</span>], rows)

	<span class="kw">var</span> buf bytes.Buffer
	buf.Write([]<span class="kw">byte</span>{IAC, SB, OptNAWS})
	<span class="kw">for</span> _, x := <span class="kw">range</span> dims {
		<span class="kw">if</span> x == IAC { <span class="cm">// 0xFF 는 두 번 써서 이스케이프</span>
			buf.WriteByte(IAC)
		}
		buf.WriteByte(x)
	}
	buf.Write([]<span class="kw">byte</span>{IAC, SE})
	<span class="kw">return</span> buf.Bytes()
}

<span class="kw">func</span> parseNAWS(sb []<span class="kw">byte</span>) (cols, rows <span class="kw">uint16</span>, ok <span class="kw">bool</span>) {
	<span class="kw">if</span> len(sb) != <span class="nb">5</span> { <span class="cm">// opt(1) + 4바이트</span>
		<span class="kw">return</span> <span class="nb">0</span>, <span class="nb">0</span>, <span class="kw">false</span>
	}
	cols = binary.BigEndian.Uint16(sb[<span class="nb">1</span>:<span class="nb">3</span>])
	rows = binary.BigEndian.Uint16(sb[<span class="nb">3</span>:<span class="nb">5</span>])
	<span class="kw">return</span> cols, rows, <span class="kw">true</span>
}</code></pre>`);

sl('Go','HTTP GET over raw net.Conn', `
<h1><span class="no">G12</span>Go로 하는 telnet 실전 — 손으로 HTTP</h1>
<p><code>telnet host 80</code>의 Go판: raw <code>net.Conn</code>에 HTTP 요청 문자열을 직접 써넣고, 응답은 표준 <code>net/http</code>의 <code>ReadResponse</code>로 파싱한다.</p>
<pre class="code"><code><span class="kw">func</span> main() {
	conn, err := net.Dial(<span class="st">"tcp"</span>, <span class="st">"example.com:80"</span>)
	<span class="kw">if</span> err != <span class="kw">nil</span> {
		log.Fatal(err)
	}
	<span class="kw">defer</span> conn.Close()

	<span class="cm">// CRLF(\\r\\n)로 줄을 끝내고, 빈 줄로 헤더 종료</span>
	req := <span class="st">"GET / HTTP/1.1\\r\\n"</span> +
		<span class="st">"Host: example.com\\r\\n"</span> +
		<span class="st">"Connection: close\\r\\n"</span> +
		<span class="st">"\\r\\n"</span>
	<span class="kw">if</span> _, err := io.WriteString(conn, req); err != <span class="kw">nil</span> {
		log.Fatal(err)
	}

	<span class="cm">// 표준 파서 재사용 — 상태줄·헤더·바디 해석</span>
	resp, err := http.ReadResponse(bufio.NewReader(conn), <span class="kw">nil</span>)
	<span class="kw">if</span> err != <span class="kw">nil</span> {
		log.Fatal(err)
	}
	<span class="kw">defer</span> resp.Body.Close()
	fmt.Println(resp.Status)
	io.Copy(os.Stdout, resp.Body)
}</code></pre>
<div class="note">Go <em>raw string</em>(백틱)으로 요청을 쓰면 줄바꿈이 <code>\\n</code>(LF)만 들어가 HTTP가 요구하는 <code>\\r\\n</code>이 되지 않는다. 그래서 위처럼 큰따옴표 + 명시적 <code>\\r\\n</code>이 정답이다. (백틱 예: <code>s := \`line\`</code>)</div>`);

sl('Go','net/http와 비교', `
<h1><span class="no">G13</span>raw vs net/http</h1>
<p>실무에선 물론 <code>net/http</code>를 쓴다. raw는 <em>프로토콜을 눈으로 보고</em> 배우거나, 비표준 서버를 두드릴 때다.</p>
<pre class="code"><code><span class="cm">// 고수준 — 커넥션 풀·리다이렉트·타임아웃 자동</span>
resp, err := http.Get(<span class="st">"http://example.com/"</span>)
<span class="kw">if</span> err != <span class="kw">nil</span> {
	log.Fatal(err)
}
<span class="kw">defer</span> resp.Body.Close()
body, _ := io.ReadAll(resp.Body)
fmt.Printf(<span class="st">"%s\\n%d bytes\\n"</span>, resp.Status, len(body))</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th></th><th>raw net.Conn</th><th>net/http</th></tr></thead>
<tbody>
<tr><td>바이트 가시성</td><td>완전 — 내가 다 씀</td><td>추상화됨</td></tr>
<tr><td>keep-alive/풀</td><td>직접 관리</td><td>자동</td></tr>
<tr><td>chunked/gzip</td><td>직접 파싱</td><td>자동</td></tr>
<tr><td>용도</td><td>학습·디버깅·비표준</td><td>프로덕션</td></tr>
</tbody></table></div>`);

sl('Go','동시성 대화형 클라이언트', `
<h1><span class="no">G14</span>고루틴 + 채널 대화형</h1>
<p>읽기·쓰기를 각각 고루틴으로 돌리고, <em>먼저 끝나는 쪽</em>이 세션을 종료하도록 에러 채널로 조인한다.</p>
<pre class="code"><code><span class="kw">func</span> interactive(conn net.Conn) <span class="kw">error</span> {
	errc := make(<span class="kw">chan</span> <span class="kw">error</span>, <span class="nb">2</span>) <span class="cm">// 버퍼 2 — 고루틴 누수 방지</span>

	<span class="kw">go</span> <span class="kw">func</span>() { <span class="cm">// 키보드 -&gt; 소켓</span>
		_, err := io.Copy(conn, os.Stdin)
		conn.Close() <span class="cm">// EOF 시 상대 읽기도 깨움</span>
		errc &lt;- err
	}()
	<span class="kw">go</span> <span class="kw">func</span>() { <span class="cm">// 소켓 -&gt; 화면</span>
		_, err := io.Copy(os.Stdout, conn)
		errc &lt;- err
	}()

	<span class="kw">return</span> &lt;-errc <span class="cm">// 첫 종료/에러로 반환</span>
}</code></pre>
<div class="fx">버퍼 크기 <code>2</code>가 핵심 — 한쪽만 받고 함수가 반환해도, 다른 고루틴의 <code>errc &lt;- err</code>이 블록되지 않아 고루틴이 새지 않는다.</div>`);

sl('Go','select 다중화와 graceful shutdown', `
<h1><span class="no">G15</span>select · done 채널로 우아한 종료</h1>
<p>여러 이벤트(수신 라인, 취소 신호, 종료)를 <code>select</code>로 한곳에서 기다린다. 컨텍스트가 취소되면 소켓을 닫아 블록된 <code>Read</code>를 깨운다.</p>
<pre class="code"><code><span class="kw">func</span> run(ctx context.Context, conn net.Conn) <span class="kw">error</span> {
	lines := make(<span class="kw">chan</span> <span class="kw">string</span>)
	go <span class="kw">func</span>() {
		sc := bufio.NewScanner(conn)
		<span class="kw">for</span> sc.Scan() {
			lines &lt;- sc.Text()
		}
		close(lines) <span class="cm">// EOF 시 채널 닫아 신호</span>
	}()

	<span class="kw">for</span> {
		<span class="kw">select</span> {
		<span class="kw">case</span> &lt;-ctx.Done():
			conn.Close() <span class="cm">// 블록된 Read/Scan 을 깨움</span>
			<span class="kw">return</span> ctx.Err()
		<span class="kw">case</span> line, ok := &lt;-lines:
			<span class="kw">if</span> !ok {
				<span class="kw">return</span> <span class="kw">nil</span> <span class="cm">// 정상 종료</span>
			}
			fmt.Println(line)
		}
	}
}</code></pre>`);

sl('Go','최소 TELNET 서버 ① accept 루프', `
<h1><span class="no">G16</span>net.Listen + accept 루프</h1>
<p>서버의 뼈대: 리슨 소켓을 열고, <code>Accept</code>가 돌려준 각 연결을 <em>연결당 고루틴</em>으로 넘긴다. Accept 에러는 로그만 찍고 계속 — 한 연결 실패가 서버를 죽이면 안 된다.</p>
<pre class="code"><code><span class="kw">func</span> main() {
	ln, err := net.Listen(<span class="st">"tcp"</span>, <span class="st">":2323"</span>)
	<span class="kw">if</span> err != <span class="kw">nil</span> {
		log.Fatal(err)
	}
	<span class="kw">defer</span> ln.Close()
	log.Println(<span class="st">"telnet server on :2323"</span>)

	<span class="kw">for</span> {
		conn, err := ln.Accept()
		<span class="kw">if</span> err != <span class="kw">nil</span> {
			log.Println(<span class="st">"accept:"</span>, err)
			<span class="kw">continue</span>
		}
		<span class="kw">go</span> handle(conn) <span class="cm">// 연결당 고루틴</span>
	}
}</code></pre>
<div class="tip"><code>go run server.go</code> 후 다른 터미널에서 <span class="kbd">telnet localhost 2323</span>으로 접속해 테스트한다.</div>`);

sl('Go','최소 TELNET 서버 ② ECHO/SGA 협상', `
<h1><span class="no">G17</span>연결 핸들러 · 문자 단위 모드</h1>
<p>서버가 <code>WILL ECHO</code> + <code>WILL SGA</code>를 보내고 클라이언트에 <code>DO SGA</code>를 요청하면 <em>문자 단위(character-at-a-time)</em> 모드가 된다 — 서버가 에코를 책임진다(RFC 857·858).</p>
<pre class="code"><code><span class="kw">func</span> handle(conn net.Conn) {
	<span class="kw">defer</span> conn.Close()

	<span class="cm">// 서버가 에코와 go-ahead 억제를 맡겠다고 선언</span>
	conn.Write([]<span class="kw">byte</span>{
		IAC, WILL, OptEcho,
		IAC, WILL, OptSGA,
		IAC, DO, OptSGA,
	})

	fmt.Fprint(conn, <span class="st">"Welcome. type 'quit' to exit\\r\\n"</span>)
	r := bufio.NewReader(conn)
	<span class="kw">for</span> {
		line, err := readLine(r) <span class="cm">// IAC 걸러내는 헬퍼</span>
		<span class="kw">if</span> err != <span class="kw">nil</span> {
			<span class="kw">return</span> <span class="cm">// io.EOF 등</span>
		}
		<span class="kw">if</span> line == <span class="st">"quit"</span> {
			fmt.Fprint(conn, <span class="st">"bye\\r\\n"</span>)
			<span class="kw">return</span>
		}
		fmt.Fprintf(conn, <span class="st">"you said: %s\\r\\n"</span>, line)
	}
}</code></pre>`);

sl('Go','bufio.Scanner + 커스텀 SplitFunc', `
<h1><span class="no">G18</span>IAC-aware 라인 프레이밍</h1>
<p><code>bufio.Scanner</code>에 <code>SplitFunc</code>를 끼우면 스캔 단위를 마음대로 정의할 수 있다. 아래는 CRLF로 자르되 IAC 명령 바이트를 벗겨내는 예다.</p>
<pre class="code"><code><span class="cm">// SplitFunc: (data, atEOF) -&gt; (advance, token, err)</span>
<span class="kw">func</span> telnetSplit(data []<span class="kw">byte</span>, atEOF <span class="kw">bool</span>) (<span class="kw">int</span>, []<span class="kw">byte</span>, <span class="kw">error</span>) {
	<span class="kw">if</span> i := bytes.IndexByte(data, <span class="st">'\\n'</span>); i &gt;= <span class="nb">0</span> {
		line := dropIAC(data[:i])
		line = bytes.TrimRight(line, <span class="st">"\\r"</span>)
		<span class="kw">return</span> i + <span class="nb">1</span>, line, <span class="kw">nil</span> <span class="cm">// \\n 소비</span>
	}
	<span class="kw">if</span> atEOF &amp;&amp; len(data) &gt; <span class="nb">0</span> {
		<span class="kw">return</span> len(data), dropIAC(data), <span class="kw">nil</span>
	}
	<span class="kw">return</span> <span class="nb">0</span>, <span class="kw">nil</span>, <span class="kw">nil</span> <span class="cm">// 더 읽어와라</span>
}

<span class="cm">// 사용</span>
sc := bufio.NewScanner(conn)
sc.Split(telnetSplit)
<span class="kw">for</span> sc.Scan() {
	handleLine(sc.Bytes())
}</code></pre>
<div class="note"><code>dropIAC</code>는 <code>IAC .. </code>시퀀스를 건너뛰어야 한다. 순진한 구현은 서브협상 페이로드 안의 <code>0x0A</code>를 줄바꿈으로 오인할 수 있으므로, 완전 파서(G6)를 앞단에 두고 <em>순수 데이터만</em> Scanner에 흘리는 편이 견고하다.</div>`);

sl('Go','context 타임아웃과 Deadline', `
<h1><span class="no">G19</span>context.Context · SetDeadline</h1>
<p>접속 자체엔 <code>DialContext</code>, 개별 read/write엔 <code>SetReadDeadline</code>/<code>SetWriteDeadline</code>을 쓴다. Go 소켓 타임아웃은 <em>상대 시간이 아니라 절대 시각</em>이다.</p>
<pre class="code"><code>ctx, cancel := context.WithTimeout(context.Background(), <span class="nb">10</span>*time.Second)
<span class="kw">defer</span> cancel()

d := net.Dialer{}
conn, err := d.DialContext(ctx, <span class="st">"tcp"</span>, <span class="st">"host:23"</span>)
<span class="kw">if</span> err != <span class="kw">nil</span> {
	<span class="kw">return</span> err
}
<span class="kw">defer</span> conn.Close()

<span class="cm">// 각 읽기마다 데드라인 갱신(슬라이딩 타임아웃)</span>
<span class="kw">for</span> {
	conn.SetReadDeadline(time.Now().Add(<span class="nb">30</span> * time.Second))
	n, err := conn.Read(buf)
	<span class="kw">if</span> err != <span class="kw">nil</span> {
		<span class="kw">break</span> <span class="cm">// 타임아웃도 여기로 (net.Error.Timeout()==true)</span>
	}
	process(buf[:n])
}</code></pre>
<div class="fx">데드라인은 <strong>한 번 지나면 계속 만료 상태</strong>다. 매 I/O 전에 새 데드라인을 설정해야 슬라이딩 타임아웃이 된다.</div>`);

sl('Go','에러 처리 관용구', `
<h1><span class="no">G20</span>에러 래핑 · io.EOF · net.Error</h1>
<p>Go의 에러는 값이다. <code>%w</code>로 감싸 컨텍스트를 붙이고, <code>errors.Is/As</code>로 원인을 검사한다. 정상 종료 신호인 <code>io.EOF</code>와 일시적 타임아웃을 구분하라.</p>
<pre class="code"><code>n, err := conn.Read(buf)
<span class="kw">if</span> err != <span class="kw">nil</span> {
	<span class="kw">switch</span> {
	<span class="kw">case</span> errors.Is(err, io.EOF):
		<span class="cm">// 상대가 정상적으로 닫음 — 에러 아님</span>
		<span class="kw">return</span> <span class="kw">nil</span>
	<span class="kw">case</span> isTimeout(err):
		<span class="kw">return</span> fmt.Errorf(<span class="st">"read timed out: %w"</span>, err)
	<span class="kw">default</span>:
		<span class="kw">return</span> fmt.Errorf(<span class="st">"telnet read: %w"</span>, err)
	}
}

<span class="kw">func</span> isTimeout(err <span class="kw">error</span>) <span class="kw">bool</span> {
	<span class="kw">var</span> ne net.Error
	<span class="kw">return</span> errors.As(err, &amp;ne) &amp;&amp; ne.Timeout()
}</code></pre>
<div class="tip"><code>io.ReadFull</code>은 짧게 읽히면 <code>io.ErrUnexpectedEOF</code>, 아예 못 읽으면 <code>io.EOF</code>를 준다 — 협상 3바이트를 통째로 읽을 때 유용하다.</div>`);

sl('Go','golang.org/x/term 로 raw 모드', `
<h1><span class="no">G21</span>x/term · 로컬 터미널 raw 모드</h1>
<p>서버가 <code>ECHO+SGA</code>로 문자 단위 모드를 잡으면, 로컬 터미널의 라인 버퍼링·에코를 꺼야 키 입력이 즉시 전송되고 이중 에코가 사라진다. <code>golang.org/x/term</code>이 그 일을 한다.</p>
<pre class="code"><code><span class="kw">import</span> <span class="st">"golang.org/x/term"</span>

<span class="kw">func</span> withRaw(fn <span class="kw">func</span>() <span class="kw">error</span>) <span class="kw">error</span> {
	fd := int(os.Stdin.Fd())
	<span class="kw">if</span> !term.IsTerminal(fd) {
		<span class="kw">return</span> fn() <span class="cm">// 파이프면 그대로</span>
	}
	old, err := term.MakeRaw(fd) <span class="cm">// 에코·라인모드 끔</span>
	<span class="kw">if</span> err != <span class="kw">nil</span> {
		<span class="kw">return</span> err
	}
	<span class="kw">defer</span> term.Restore(fd, old) <span class="cm">// 꼭 복구</span>
	<span class="kw">return</span> fn()
}</code></pre>
<div class="note"><code>defer term.Restore</code>가 없으면 프로그램이 죽은 뒤 터미널이 먹통이 된다. panic 경로에서도 복구되도록 반드시 defer로.</div>`);

sl('Go','net.Pipe / httptest 로 테스트', `
<h1><span class="no">G22</span>소켓 없이 테스트하기</h1>
<p><code>net.Pipe()</code>는 실제 커널 소켓 없이 <em>메모리 상 양방향 net.Conn 쌍</em>을 준다. 협상 로직을 결정적으로 단위 테스트할 수 있다.</p>
<pre class="code"><code><span class="kw">func</span> TestNegotiateRefusesDO(t *testing.T) {
	client, server := net.Pipe()
	<span class="kw">defer</span> client.Close()
	<span class="kw">defer</span> server.Close()

	<span class="cm">// 서버 역할: DO TERMINAL-TYPE 을 보냄</span>
	<span class="kw">go</span> <span class="kw">func</span>() {
		server.Write([]<span class="kw">byte</span>{IAC, DO, OptTermType})
	}()

	c := NewClient(client)
	got := make([]<span class="kw">byte</span>, <span class="nb">3</span>)
	<span class="kw">go</span> c.Loop() <span class="cm">// 파서+refuse-all 응답</span>
	io.ReadFull(server, got) <span class="cm">// 서버가 응답 수신</span>

	want := []<span class="kw">byte</span>{IAC, WONT, OptTermType}
	<span class="kw">if</span> !bytes.Equal(got, want) {
		t.Fatalf(<span class="st">"got %v, want %v"</span>, got, want)
	}
}</code></pre>
<div class="tip">HTTP-over-raw(G12)는 <code>httptest.NewServer</code>로 실제 포트를 띄워 통합 테스트한다 — <code>ts.Listener.Addr()</code>로 <code>host:port</code>를 얻는다.</div>`);

sl('Go','재사용 가능한 telnet 패키지 API', `
<h1><span class="no">G23</span>작은 telnet 패키지 설계</h1>
<p>지금까지 조각을 하나의 타입으로 묶는다. <code>Conn</code>이 <code>io.ReadWriteCloser</code>를 구현하면 — <code>Read</code>는 IAC를 벗겨 앱 데이터만, <code>Write</code>는 <code>0xFF</code>를 이스케이프 — 상위 코드가 텔넷을 몰라도 된다.</p>
<pre class="code"><code><span class="kw">package</span> telnet

<span class="kw">type</span> Conn <span class="kw">struct</span> {
	raw  net.Conn
	r    *bufio.Reader
	w    *bufio.Writer
	opts map[<span class="kw">byte</span>]<span class="kw">bool</span> <span class="cm">// 활성 옵션 상태</span>
}

<span class="kw">func</span> Dial(addr <span class="kw">string</span>) (*Conn, <span class="kw">error</span>)
<span class="kw">func</span> Client(c net.Conn) *Conn

<span class="cm">// io.ReadWriteCloser 구현</span>
<span class="kw">func</span> (c *Conn) Read(p []<span class="kw">byte</span>) (<span class="kw">int</span>, <span class="kw">error</span>)  <span class="cm">// IAC 제거된 데이터</span>
<span class="kw">func</span> (c *Conn) Write(p []<span class="kw">byte</span>) (<span class="kw">int</span>, <span class="kw">error</span>) <span class="cm">// 0xFF -&gt; IAC IAC</span>
<span class="kw">func</span> (c *Conn) Close() <span class="kw">error</span>

<span class="cm">// 텔넷 전용 제어</span>
<span class="kw">func</span> (c *Conn) Send(cmd, opt <span class="kw">byte</span>) <span class="kw">error</span>            <span class="cm">// IAC cmd opt</span>
<span class="kw">func</span> (c *Conn) Subneg(opt <span class="kw">byte</span>, data []<span class="kw">byte</span>) <span class="kw">error</span> <span class="cm">// SB..SE</span>
<span class="kw">func</span> (c *Conn) SetWindowSize(cols, rows <span class="kw">uint16</span>) <span class="kw">error</span>
<span class="kw">func</span> (c *Conn) SetHandler(h Handler)</code></pre>
<div class="fx"><code>Read</code>가 IAC를 소비하므로 상위 코드는 <code>bufio.NewScanner(tconn)</code>처럼 <em>평범한 io</em>로 쓴다 — 텔넷 세부는 패키지 안에 캡슐화된다.</div>`);

sl('Go','성능 · 버퍼링 IO의 중요성', `
<h1><span class="no">G24</span>벤치마크 · 왜 bufio인가</h1>
<p>바이트당 <code>conn.Write</code>는 바이트당 <code>write(2)</code> syscall이다. <code>bufio.Writer</code>로 모아 보내면 처리량이 수십 배 뛴다. Go의 <code>testing.B</code>로 재보자.</p>
<pre class="code"><code><span class="kw">func</span> BenchmarkUnbuffered(b *testing.B) {
	conn := dialLoopback(b)
	b.ResetTimer()
	<span class="kw">for</span> i := <span class="nb">0</span>; i &lt; b.N; i++ {
		conn.Write([]<span class="kw">byte</span>{payload[i%len(payload)]}) <span class="cm">// 바이트당 syscall</span>
	}
}

<span class="kw">func</span> BenchmarkBuffered(b *testing.B) {
	w := bufio.NewWriterSize(dialLoopback(b), <span class="nb">4096</span>)
	b.ResetTimer()
	<span class="kw">for</span> i := <span class="nb">0</span>; i &lt; b.N; i++ {
		w.WriteByte(payload[i%len(payload)])
	}
	w.Flush()
}</code></pre>
<div class="tw"><table class="tbl">
<thead><tr><th>방식</th><th>syscall 수</th><th>상대 처리량</th></tr></thead>
<tbody>
<tr><td>unbuffered</td><td>N (바이트당)</td><td>1x (기준)</td></tr>
<tr><td>bufio 4KB</td><td>~N/4096</td><td>수십 배</td></tr>
</tbody></table></div>
<p class="mut small"><code>go test -bench=. -benchmem</code>으로 실행. 협상 시퀀스도 <code>bytes.Buffer</code>에 모아 한 번에 <code>Write</code>하는 이유가 이것.</p>`);

sl('Go','보안 · crypto/tls', `
<h1><span class="no">G25</span>평문 대신 TLS</h1>
<p>TELNET은 <strong>평문</strong>이다 — 자격증명·세션이 그대로 노출된다. Go에선 <code>net.Dial</code>을 <code>tls.Dial</code>로 바꾸기만 하면 암호화 채널이 된다(반환형도 <code>net.Conn</code>이라 위 로직 재사용).</p>
<pre class="code"><code><span class="kw">import</span> <span class="st">"crypto/tls"</span>

<span class="cm">// telnets 관례 포트 992, 또는 TLS 감싼 임의 서비스</span>
conn, err := tls.Dial(<span class="st">"tcp"</span>, <span class="st">"host:992"</span>, &amp;tls.Config{
	ServerName: <span class="st">"host"</span>,          <span class="cm">// SNI + 인증서 검증 대상</span>
	MinVersion: tls.VersionTLS12, <span class="cm">// 구버전 거부</span>
})
<span class="kw">if</span> err != <span class="kw">nil</span> {
	log.Fatal(err)
}
<span class="kw">defer</span> conn.Close()
<span class="cm">// 이후 파서·협상 코드는 그대로 — conn 이 net.Conn 이므로</span></code></pre>
<div class="note"><code>InsecureSkipVerify: true</code>는 인증서 검증을 끈다 — 실서비스 금지. 대화형 로그인은 애초에 <strong>SSH</strong>가 정답이며, 텔넷은 프로토콜 학습·디버깅 도구로 남겨두라.</div>`);

sl('Go','정리 · 체크리스트 · 레퍼런스', `
<h1><span class="no">G26</span>Go 구현 요약</h1>
<div class="cols">
<div>
<h3>핵심 정리</h3>
<ul>
<li><code>net.Conn</code> = <code>io.ReadWriteCloser</code> — 스트림처럼 조립</li>
<li>제어는 <strong>IAC 상태 기계</strong>(G6)로 분리, 데이터만 상위로</li>
<li>가장 안전한 기본 정책은 <em>refuse-all</em> 협상</li>
<li>대화형은 <strong>고루틴 2개 + 에러 채널</strong>, 종료는 <code>conn.Close()</code>로 깨움</li>
<li><code>bufio</code>로 감싸고 쓰기 뒤 <code>Flush()</code> 잊지 말 것</li>
<li>테스트는 <code>net.Pipe()</code>, 보안은 <code>tls.Dial</code></li>
</ul>
</div>
<div>
<div class="tip"><strong>구현 체크리스트</strong>
<ul>
<li>[ ] 데이터의 <code>0xFF</code>를 <code>IAC IAC</code>로 이스케이프했는가</li>
<li>[ ] <code>WONT/DONT</code> 재확인 루프를 끊었는가(G8)</li>
<li>[ ] SB 페이로드 안 <code>0xFF</code>도 언이스케이프했는가</li>
<li>[ ] 모든 write 후 <code>Flush</code> / 데드라인 갱신했는가</li>
<li>[ ] <code>io.EOF</code>를 에러가 아닌 정상 종료로 처리했는가</li>
</ul>
</div>
</div>
</div>
<ul class="links">

const sock: net.Socket = net.createConnection(

sl('TypeScript','원시 TELNET 클라이언트 클래스', `
<h1><span class="no">7.3</span>원시 TELNET 클라이언트 클래스</h1>
<p>이벤트를 클래스로 감싸면 상태를 담을 곳이 생깁니다. 생성자에서 소켓을 만들고
<code>connect</code>/<code>data</code>/<code>close</code>/<code>error</code> 4개 이벤트를 타입과 함께 연결합니다.</p>
<pre class="code"><code>import { Socket, createConnection } from "node:net";

export class RawTelnet {
  private readonly sock: Socket;

  constructor(host: string, port = 23) {
    this.sock = createConnection({ host, port });
    this.sock.on("connect", (): void =&gt; this.onConnect());
    this.sock.on("data", (c: Buffer): void =&gt; this.onData(c));
    this.sock.on("close", (): void =&gt; console.log("[closed]"));
    this.sock.on("error", (e: Error): void =&gt; console.error(e.message));
  }

  private onConnect(): void { console.log("[connected]"); }

  private onData(chunk: Buffer): void {
    // 여기서 IAC 파서에 청크를 넘길 것 (7.7)
    process.stdout.write(chunk.toString("latin1"));
  }

  send(text: string): void {
    this.sock.write(Buffer.from(text, "latin1"));
  }

  end(): void { this.sock.end(); }
}</code></pre>
<div class="tip"><code>readonly</code> 필드로 소켓 재할당을 막고, <code>private</code> 메서드로 이벤트 핸들러를 캡슐화했습니다. <code>strict</code> 모드에서 모든 파라미터 타입이 강제됩니다.</div>`);

sl('TypeScript','IAC 파서 상태기계 설계', `
<h1><span class="no">7.6</span>IAC 파서 — 상태기계 설계</h1>
<p>TCP는 <strong>스트림</strong>이라 하나의 IAC 시퀀스가 <em>여러 청크에 걸쳐</em> 쪼개져 도착할 수 있습니다.
따라서 파서는 <strong>상태</strong>를 들고 바이트를 <strong>한 개씩</strong> 먹어야 합니다(청크 경계에 의존 금지).</p>
<pre class="code"><code>// 파서가 가질 수 있는 상태
const enum St {
  Data,   // 일반 데이터 수신 중
  Iac,    // 방금 IAC(255)를 봄
  Verb,   // WILL/WONT/DO/DONT 뒤 옵션 바이트 대기
  Sb,     // IAC SB 뒤 옵션 코드 대기
  SbData, // 서브협상 payload 수집 중
  SbIac,  // 서브협상 중 IAC를 봄 (IAC SE? or IAC IAC?)
}

// 파서가 바깥에 알려줄 콜백들
export interface Handlers {
  onData:      (b: number) =&gt; void;                 // 순수 데이터 1바이트
  onNegotiate: (verb: Cmd, opt: number) =&gt; void;    // WILL/WONT/DO/DONT
  onSubneg:    (opt: number, payload: Buffer) =&gt; void; // SB..SE
}</code></pre>
<div class="fx">규칙: 데이터 안의 <code>0xFF</code>는 <code>IAC IAC</code>로 이스케이프된다. 서브협상 payload 안에서도 마찬가지 → <code>SbIac</code> 상태가 이를 구분한다.</div>`);

sl('TypeScript','IAC 파서 구현 (전체)', `
<h1><span class="no">7.7</span>IAC 파서 — 전체 구현</h1>
<p>청크를 <code>push()</code>로 밀어넣으면 상태를 유지하며 데이터·협상·서브협상으로 분해합니다.</p>
<pre class="code"><code>export class TelnetParser {
  private st: St = St.Data;
  private verb: Cmd = Cmd.IAC;
  private sbOpt = 0;
  private sb: number[] = [];

  constructor(private readonly h: Handlers) {}

  push(chunk: Buffer): void {
    for (let i = 0; i &lt; chunk.length; i++) {
      const b: number = chunk[i];
      switch (this.st) {
        case St.Data:
          if (b === Cmd.IAC) this.st = St.Iac;
          else this.h.onData(b);
          break;

        case St.Iac:
          if (b === Cmd.IAC) { this.h.onData(0xff); this.st = St.Data; } // 이스케이프된 0xFF
          else if (b === Cmd.SB) this.st = St.Sb;
          else if (b &gt;= Cmd.WILL &amp;&amp; b &lt;= Cmd.DONT) { this.verb = b; this.st = St.Verb; }
          else { /* NOP/GA/AYT 등 단독 명령 */ this.st = St.Data; }
          break;

        case St.Verb:
          this.h.onNegotiate(this.verb, b);
          this.st = St.Data;
          break;

        case St.Sb:
          this.sbOpt = b; this.sb = []; this.st = St.SbData;
          break;

        case St.SbData:
          if (b === Cmd.IAC) this.st = St.SbIac;
          else this.sb.push(b);
          break;

        case St.SbIac:
          if (b === Cmd.SE) {
            this.h.onSubneg(this.sbOpt, Buffer.from(this.sb));
            this.st = St.Data;
          } else { // IAC IAC → 리터럴 0xFF
            this.sb.push(0xff); this.st = St.SbData;
          }
          break;
      }
    }
  }
}</code></pre>`);

sl('TypeScript','협상 응답기 — 전부 거절', `
<h1><span class="no">7.8</span>협상 응답기 — refuse-all</h1>
<p>가장 단순하고 안전한 정책: <strong>아무 옵션도 켜지 않기</strong>. 상대가
<code>DO/DONT</code>를 보내면 우리는 <code>WONT</code>, <code>WILL/WONT</code>를 보내면 <code>DONT</code>로 답합니다.
이렇게 하면 협상이 <em>루프 없이</em> 종료됩니다(RFC 854 규칙).</p>
<pre class="code"><code>/** 모든 옵션을 거절하는 3바이트 응답을 만든다. */
export function refuseAll(verb: Cmd, opt: number): Buffer {
  const reply: Cmd =
    verb === Cmd.DO || verb === Cmd.DONT ? Cmd.WONT : Cmd.DONT;
  return Buffer.from([Cmd.IAC, reply, opt]);
}

// 파서와 결선: 협상이 올 때마다 거절 응답을 소켓에 씀
const parser = new TelnetParser({
  onData: (b) =&gt; process.stdout.write(Buffer.from([b])),
  onNegotiate: (verb, opt) =&gt; sock.write(refuseAll(verb, opt)),
  onSubneg: (_opt, _payload) =&gt; { /* refuse 정책에선 무시 */ },
});
sock.on("data", (c: Buffer) =&gt; parser.push(c));</code></pre>
<div class="note">거절만 하면 무한 협상 루프를 못 만들지만, 반대로 매 <code>WILL</code>마다 무조건 <code>DO</code>로 답하면 <strong>ACK의 ACK</strong>가 반복되는 루프에 빠집니다. 상태를 봐야 하는 이유(→ 7.18 RFC 1143).</div>`);

sl('TypeScript','TERMINAL-TYPE 서브협상', `
<h1><span class="no">7.9</span>TERMINAL-TYPE 서브협상</h1>
<p>서버가 <code>IAC SB 24 SEND IAC SE</code>로 단말 종류를 물으면,
<code>IAC SB 24 IS "XTERM" IAC SE</code>로 답합니다. <code>IS=0</code>, <code>SEND=1</code>.</p>
<pre class="code"><code>function ttypeReply(name = "XTERM"): Buffer {
  return Buffer.concat([
    Buffer.from([Cmd.IAC, Cmd.SB, Opt.TTYPE, Sub.IS]),
    Buffer.from(name, "ascii"),
    Buffer.from([Cmd.IAC, Cmd.SE]),
  ]);
}

// onSubneg 안에서 분기
function onSubneg(opt: number, payload: Buffer): void {
  if (opt === Opt.TTYPE &amp;&amp; payload[0] === Sub.SEND) {
    sock.write(ttypeReply("XTERM"));
  }
}</code></pre>
<div class="tip">먼저 <code>IAC WILL TTYPE</code>로 우리가 단말 타입을 <em>보낼 수 있다</em>고 알린 뒤, 서버의 <code>DO</code>를 받고 나서야 <code>SB SEND</code>가 옵니다. 서버는 여러 번 <code>SEND</code>를 보내 목록을 순회할 수 있습니다.</div>`);

sl('TypeScript','NAWS — 창 크기 (writeUInt16BE)', `
<h1><span class="no">7.10</span>NAWS — 창 크기 전송</h1>
<p>NAWS(옵션 31, RFC 1073)는 열·행을 각각 <strong>16비트 빅엔디언</strong>으로 보냅니다.
값 안에 <code>0xFF</code>가 나오면 반드시 <code>IAC IAC</code>로 이스케이프해야 합니다(예: 폭 255).</p>
<pre class="code"><code>/** payload 안의 0xFF 바이트를 IAC IAC 로 이스케이프 */
function escapeIac(buf: Buffer): Buffer {
  const out: number[] = [];
  for (const b of buf) {
    out.push(b);
    if (b === 0xff) out.push(0xff);
  }
  return Buffer.from(out);
}

function naws(cols: number, rows: number): Buffer {
  const dims = Buffer.alloc(4);
  dims.writeUInt16BE(cols, 0); // 열: 상위·하위 바이트
  dims.writeUInt16BE(rows, 2); // 행
  return Buffer.concat([
    Buffer.from([Cmd.IAC, Cmd.SB, Opt.NAWS]),
    escapeIac(dims),
    Buffer.from([Cmd.IAC, Cmd.SE]),
  ]);
}

// 80x24 → IAC SB 31 00 50 00 18 IAC SE
sock.write(naws(80, 24));</code></pre>
<div class="note">터미널 크기가 바뀌면(<code>process.stdout.on("resize", ...)</code>) NAWS SB를 <strong>다시</strong> 보내야 서버가 화면을 재배치합니다.</div>`);

sl('TypeScript','HTTP GET을 raw 소켓으로 — "TS의 telnet"', `
<h1><span class="no">7.11</span>HTTP GET을 raw 소켓으로</h1>
<p>TELNET 정신을 그대로 살리면, <code>net.Socket</code>으로 80번 포트에 붙어 HTTP를 <em>손으로</em> 칩니다.
헤더 끝은 빈 줄(<code>\\r\\n\\r\\n</code>), HTTP/1.1은 <code>Host</code> 필수.</p>
<pre class="code"><code>import { createConnection } from "node:net";

const s = createConnection({ host: "example.com", port: 80 }, () =&gt; {
  s.write(
    "GET / HTTP/1.1\\r\\n" +
    "Host: example.com\\r\\n" +
    "Connection: close\\r\\n" +
    "\\r\\n",
  );
});
let body = "";
s.on("data", (c: Buffer) =&gt; { body += c.toString("latin1"); });
s.on("end", () =&gt; console.log(body.length, "bytes"));</code></pre>
<div class="cols"><div>
<h3>고수준 대안</h3>
<pre class="code"><code>// 실제 앱에선 이렇게
const res = await fetch("http://example.com");
const text: string = await res.text();</code></pre>
</div><div>
<div class="tip"><code>fetch</code>/<code>node:http</code>는 청크 인코딩·리다이렉트·keep-alive를 처리합니다. raw 소켓 버전은 <strong>학습·디버깅용</strong>이며, 프로토콜을 바이트 단위로 이해하는 데 최고입니다.</div>
</div></div>`);

sl('TypeScript','인터랙티브 클라이언트 — stdin↔socket', `
<h1><span class="no">7.12</span>인터랙티브 클라이언트 — 파이프 결선</h1>
<p><code>process.stdin</code>과 소켓을 <strong>양방향으로 파이프</strong>하면 진짜 telnet처럼 동작합니다.
스트림이라 <code>.pipe()</code> 한 줄로 배압(backpressure)까지 처리됩니다.</p>
<pre class="code"><code>import { createConnection } from "node:net";

const sock = createConnection({ host: "localhost", port: 2323 });

sock.on("connect", () =&gt; {
  // 서버 → 내 화면
  sock.pipe(process.stdout);
  // 내 키보드 → 서버
  process.stdin.pipe(sock);

  // 문자 단위(char-at-a-time) 모드가 필요하면 raw
  if (process.stdin.isTTY) process.stdin.setRawMode?.(true);
});

sock.on("close", () =&gt; {
  process.stdin.setRawMode?.(false);
  process.exit(0);
});</code></pre>
<div class="note"><code>setRawMode(true)</code>는 줄 버퍼링·에코를 끄고 키를 즉시 보냅니다(서버가 <code>ECHO</code>+<code>SGA</code>를 켠 문자 모드에 대응). <kbd>Ctrl+]</kbd> 같은 탈출키는 직접 감지해야 합니다.</div>`);

sl('TypeScript','async/await — Promise 기반 readUntil', `
<h1><span class="no">7.13</span>async/await — readUntil 래퍼</h1>
<p>이벤트 기반 소켓을 <strong>Promise</strong>로 감싸면 스크립트 형태로 순차 로그인을 짤 수 있습니다.
특정 마커(<code>"login:"</code> 등)가 나올 때까지 읽고, 타임아웃을 겁니다.</p>
<pre class="code"><code>import { Socket } from "node:net";

function readUntil(sock: Socket, marker: string, timeoutMs = 5000): Promise&lt;string&gt; {
  return new Promise&lt;string&gt;((resolve, reject) =&gt; {
    let buf = "";
    const onData = (c: Buffer): void =&gt; {
      buf += c.toString("latin1");
      if (buf.includes(marker)) { cleanup(); resolve(buf); }
    };
    const timer = setTimeout(() =&gt; {
      cleanup(); reject(new Error(\`timeout waiting for \${marker}\`));
    }, timeoutMs);
    const cleanup = (): void =&gt; { sock.off("data", onData); clearTimeout(timer); };
    sock.on("data", onData);
  });
}

// 사용: 순차 로그인
await readUntil(sock, "login: ");
sock.write("guest\\r\\n");
await readUntil(sock, "Password:");
sock.write("guest\\r\\n");
const shell = await readUntil(sock, "$ ");</code></pre>
<div class="tip">더 견고하게 하려면 <code>readUntil</code>이 정규식이나 <code>AbortSignal</code>을 받게 하고, IAC 파서를 거친 <em>순수 데이터</em>에만 매칭하세요(협상 바이트가 마커를 오염시키지 않도록).</div>`);

sl('TypeScript','미니 TELNET 서버 — ECHO/SGA 협상', `
<h1><span class="no">7.14</span>미니 TELNET 서버</h1>
<p><code>net.createServer</code>로 리스너를 열고, 접속 즉시 <code>WILL ECHO</code>+<code>WILL SGA</code>를 보내
<strong>문자 단위(character-at-a-time)</strong> 모드를 요청합니다. 서버가 에코를 책임집니다.</p>
<pre class="code"><code>import { createServer, Socket } from "node:net";

const server = createServer((sock: Socket): void =&gt; {
  // 우리가 에코하겠다 + go-ahead 억제
  sock.write(Buffer.from([
    Cmd.IAC, Cmd.WILL, Opt.ECHO,
    Cmd.IAC, Cmd.WILL, Opt.SGA,
  ]));
  sock.write("Welcome to ts-telnetd\\r\\n$ ");

  const parser = new TelnetParser({
    onData: (b) =&gt; {
      if (b === 0x0d) return;            // CR 무시(다음 LF/NUL 대기)
      sock.write(Buffer.from([b]));      // 에코
      if (b === 0x0a) sock.write("$ ");  // 새 프롬프트
    },
    onNegotiate: (verb, opt) =&gt; {
      if (verb === Cmd.DO &amp;&amp; (opt === Opt.ECHO || opt === Opt.SGA)) return; // 이미 WILL 함
      sock.write(refuseAll(verb, opt));
    },
    onSubneg: () =&gt; {},
  });
  sock.on("data", (c: Buffer) =&gt; parser.push(c));
});

server.listen(2323, () =&gt; console.log("listening on :2323"));</code></pre>`);

sl('TypeScript','브라우저의 현실 — WebSocket↔TCP 브리지', `
<h1><span class="no">7.15</span>브라우저의 현실 — TCP 브리지</h1>
<p>브라우저 JS는 임의의 TCP를 열 수 없습니다(<code>net</code> 없음). 해법은
<strong>WebSocket-to-TCP 프록시</strong>: 브라우저는 WS로 서버에 붙고, 서버가 실제 TELNET TCP를 대신 열어 바이트를 <em>양방향으로 중계</em>합니다.</p>
<div class="fx">브라우저 &lt;— WebSocket —&gt; <strong>브리지(Node)</strong> &lt;— TCP:23 —&gt; TELNET 서버</div>
<pre class="code"><code>// bridge.ts — 아주 작은 ws↔tcp 프록시
import { WebSocketServer, WebSocket } from "ws";
import { connect } from "node:net";

const wss = new WebSocketServer({ port: 8080 });

wss.on("connection", (ws: WebSocket): void =&gt; {
  const tcp = connect({ host: "towel.blinkenlights.nl", port: 23 });

  tcp.on("data", (d: Buffer) =&gt; ws.send(d));              // TCP → WS
  ws.on("message", (m: Buffer) =&gt; tcp.write(m));          // WS → TCP
  ws.on("close", () =&gt; tcp.destroy());
  tcp.on("close", () =&gt; ws.close());
  tcp.on("error", () =&gt; ws.close());
});</code></pre>
<div class="note">브리지는 <strong>보안 경계</strong>입니다. 목적지 호스트/포트를 화이트리스트로 제한하지 않으면 SSRF 프록시가 됩니다. 인증·요율 제한을 반드시 붙이세요.</div>`);

sl('TypeScript','브라우저 클라이언트 — WebSocket + xterm', `
<h1><span class="no">7.16</span>브라우저 클라이언트</h1>
<p>브라우저 쪽은 <code>WebSocket</code>을 <strong>바이너리 모드</strong>로 열고, 받은 <code>ArrayBuffer</code>를
터미널 에뮬레이터(예: xterm.js)에 흘려보냅니다. 키 입력은 반대로 WS에 씁니다.</p>
<pre class="code"><code>const ws = new WebSocket("ws://localhost:8080");
ws.binaryType = "arraybuffer";

ws.onmessage = (ev: MessageEvent): void =&gt; {
  const bytes = new Uint8Array(ev.data as ArrayBuffer);
  term.write(bytes);                 // xterm.js Terminal
};

term.onData((s: string): void =&gt; {
  ws.send(new TextEncoder().encode(s)); // 키 입력 → 서버

</div><div>
