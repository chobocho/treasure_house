<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TypeScript 테트리스 — 8인 온라인</title>
<style>
  :root{ color-scheme:dark; --bg:#070b16; --ink:#e8eefc; --mut:#93a4c4; --acc:#22d3ee }
  *{box-sizing:border-box}
  body{margin:0; padding:1em; background:var(--bg); color:var(--ink);
       font:15px/1.55 system-ui,-apple-system,"Noto Sans KR",sans-serif}
  h1{font-size:1.1em; margin:0 0 .2em}
  p.hint{color:var(--mut); font-size:.85em; margin:.2em 0 1em}
  #app{max-width:760px; margin:0 auto}
  button:active{background:#1e293b}
  code{color:var(--acc)}
</style>
</head>
<body>
  <h1>TypeScript 테트리스 — 8인 온라인</h1>
  <p class="hint">
    방을 만들면 4글자 코드가 나온다. 다른 기기에서 같은 주소로 들어와 <b>코드로 참가</b>를 누르면 같은 방이다.
    한 PC 가 좌석 2석까지 쥘 수 있고, 빈 자리는 <b>AI 좌석 추가</b>로 채운다.
    사람 좌석 조작: <code>←</code> <code>→</code> 이동, <code>↑</code> 회전, <code>↓</code> 소프트드롭,
    <code>Space</code> 하드드롭, <code>C</code> 홀드.
  </p>
  <div id="app"></div>

  <!-- 번들은 make web 이 dist/ 에서 만든다. 순서가 의존 순서다. -->
  <script src="js/core.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ga.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/protocol.js"></script>
  <script src="js/room.js"></script>
  <script src="js/hub.js"></script>
  <script src="js/client.js"></script>
  <script src="js/loopback.js"></script>
  <script src="js/match.js"></script>
  <script src="js/view.js"></script>
  <script src="js/arena_view.js"></script>
  <script src="js/net_view.js"></script>
  <script src="js/weights.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
