# 워크스페이스 — 코어 하나를 세 판(TUI·GUI·WASM)이 나눠 쓴다.
[workspace]
resolver = "3"
members = ["core", "render", "tui", "gui", "wasm"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

# WASM 전용 프로필 — 내려받는 크기가 곧 로딩 시간이라 작게 만든다.
# release 에 panic = "abort" 를 두면 TUI 가 패닉할 때 Drop 이 안 돌아
# 터미널이 raw 모드로 남는다. 그래서 따로 뗐다.
#     빌드 명령은 Makefile 의 wasm 목표를 볼 것
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
