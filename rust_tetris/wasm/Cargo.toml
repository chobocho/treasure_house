[package]
name = "tetris-wasm"
description = "브라우저 테트리스 — C ABI + 손으로 쓴 JS 글루"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
# cdylib 은 .wasm 용, rlib 은 네이티브 `cargo test` 가 링크할 판.
crate-type = ["cdylib", "rlib"]

[dependencies]
tetris-core = { path = "../core" }
tetris-render = { path = "../render" }
