<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- deck-bookmark: 덱 엔진이 replaceState로 주소를 바꾸기 전에 진입 해시를 잡아둔다 -->
<script>window.__deckInitHash=location.hash;</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<title>🧱 C++ → WebAssembly 테트리스 완전정복 — 실제로 도는 코드로 배우는 wasm (152장)</title>
<meta name="description" content="C++로 테트리스 코어를 짜고 clang --target=wasm32 로 컴파일해 브라우저에서 돌리는 전 과정. SRS 월킥·7-bag·락딜레이·T스핀까지 구현하고, 이 문서 안에서 그 wasm이 실제로 실행된다. 폴더블·모바일 대응 동적 HTML 슬라이드.">
<style>
  :root{
    --bg0:#070b14; --bg1:#0a0f1c; --panel:#101827; --panel2:#0c1322;
    --ink:#e8eefc; --mut:#93a4c4; --dim:#64748b;
    --acc:#22d3ee; --acc2:#a855f7; --line:rgba(120,170,255,.22); --line2:rgba(120,170,255,.11);
    --I:#22d3ee; --J:#3b82f6; --L:#f59e0b; --O:#facc15; --S:#22c55e; --T:#a855f7; --Z:#ef4444;
    --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --sky:#7dd3fc;
    --pad: max(.6rem, env(safe-area-inset-left)) ;
  }
  *{box-sizing:border-box}
  html{
    font-size:clamp(13.5px, 0.42vw + 0.42vh + 8.6px, 20px);
    -webkit-text-size-adjust:100%;
  }
  html{height:100%}
  body{
    margin:0; height:100%; overflow:hidden;
    color:var(--ink);
    background:
      radial-gradient(900px 700px at 85% -12%, #16244a 0%, transparent 62%),
      radial-gradient(760px 620px at -12% 108%, #2a1140 0%, transparent 58%),
      linear-gradient(165deg, var(--bg0), var(--bg1));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    line-height:1.62; word-break:keep-all; overflow-wrap:anywhere;
    -webkit-tap-highlight-color:transparent;
  }
  #deck{display:flex; flex-direction:column; height:100%}
  #bar{height:3px; background:linear-gradient(90deg,var(--acc),var(--acc2)); width:0%; transition:width .25s; flex:none}

  header#top{
    flex:none; display:flex; align-items:center; gap:.6em;
    padding:.4em max(.7em, env(safe-area-inset-left)) .4em max(.7em, env(safe-area-inset-right));
    border-bottom:1px solid var(--line2); background:rgba(8,13,24,.72); backdrop-filter:blur(10px);
    min-height:2.4em;
  }
  /* flex 자식은 min-width:auto 가 기본이라 nowrap 이면 줄어들지 않는다.
     min-width:0 을 줘야 ellipsis 가 실제로 동작하고, 좁은 화면에서 ☰ 버튼이 밀려나지 않는다. */
  #top .brand{font-weight:800; font-size:.95em; letter-spacing:-.01em; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1 1 auto}
  #top .brand i{font-style:normal; color:var(--acc)}
  #secbadge{margin-left:auto; font-size:.72em; font-weight:700; padding:.2em .7em; border-radius:999px;
    border:1px solid var(--line); color:var(--mut); white-space:nowrap; max-width:42vw;
    overflow:hidden; text-overflow:ellipsis; min-width:0; flex:0 1 auto}
  #tocBtn{flex:none; background:none; border:1px solid var(--line); color:var(--ink); border-radius:8px;
    font-size:.8em; padding:.25em .6em; cursor:pointer}

  #stage{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    padding:clamp(.7em,1.6vh,1.4em) max(.75em, env(safe-area-inset-right)) 5.2em max(.75em, env(safe-area-inset-left));
    scroll-behavior:smooth; overscroll-behavior:contain}
  .slide{max-width:1120px; margin:0 auto; animation:fade .2s ease}
  @keyframes fade{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}

  .slide h1{font-size:clamp(1.28em,1.1em + 1.25vw,2em); line-height:1.28; margin:.1em 0 .6em; letter-spacing:-.02em}
  .slide h1 .no{color:var(--dim); font-size:.5em; font-weight:700; vertical-align:.4em; margin-right:.45em}
  .slide h2{font-size:1.12em; margin:1.05em 0 .4em; color:var(--sky)}
  .slide h3{font-size:1em; margin:.85em 0 .3em; color:var(--acc)}
  .slide p{margin:.45em 0}
  .slide ul,.slide ol{margin:.4em 0 .7em; padding-left:1.25em}
  .slide li{margin:.28em 0}
  .slide li>ul{margin:.12em 0}
  .slide strong{color:#fff}
  .slide em{color:var(--warn); font-style:normal; font-weight:600}
  .mut{color:var(--mut)} .small{font-size:.86em} .center{text-align:center}
  code{font-family:"SF Mono",ui-monospace,Consolas,"D2Coding",monospace;
    background:rgba(120,180,255,.13); padding:.08em .36em; border-radius:5px; font-size:.88em; color:#bfe4ff}

  /* ---------- 코드 블록 ---------- */
  .codewrap{margin:.6em 0 .9em; border:1px solid var(--line2); border-radius:11px; overflow:hidden;
    background:#070c17}
  .codecap{display:flex; flex-wrap:wrap; gap:.15em .6em; align-items:center; justify-content:space-between;
    padding:.34em .8em; background:rgba(120,170,255,.07); border-bottom:1px solid var(--line2);
    font-size:.74em; color:var(--mut); font-weight:600}
  .codecap span{color:var(--dim); font-weight:500; white-space:nowrap}
  pre.code{margin:0; padding:.75em .9em; overflow-x:auto; max-width:100%;
    font-size:clamp(.66rem,.6rem + .22vw,.8rem); line-height:1.55;
    font-family:"SF Mono",ui-monospace,Consolas,"D2Coding",monospace; tab-size:2}
  pre.code code{background:none; padding:0; font-size:1em; color:#d7e3f7; white-space:pre}
  pre.code i{font-style:normal}
  pre.code .cm{color:#5c7291} .code .kw{color:#7dd3fc} .code .ty{color:#c4b5fd}
  .code .st{color:#86efac} .code .nb{color:#fbbf24} .code .fn{color:#f0abfc} .code .pp{color:#fb7185}

  /* ---------- 레이아웃 조각 ---------- */
  .cols{display:grid; gap:.75em; grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr))}
  .cols>*{min-width:0}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--line2); border-radius:12px; padding:.7em .85em}
  .card h4{margin:0 0 .3em; font-size:.95em; color:var(--acc)}
  .card.a{border-color:rgba(34,211,238,.4)} .card.b{border-color:rgba(168,85,247,.4)}
  .note,.warn,.tip{border-left:3px solid var(--acc); background:rgba(34,211,238,.07);
    padding:.55em .8em; border-radius:0 10px 10px 0; margin:.7em 0}
  .warn{border-color:var(--bad); background:rgba(248,113,113,.08)}
  .tip{border-color:var(--good); background:rgba(74,222,128,.08)}
  .note b,.warn b,.tip b{display:block; margin-bottom:.15em}

  .scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:.6em 0}
  table{border-collapse:collapse; width:100%; font-size:.86em; min-width:min(100%,26rem)}
  th,td{border:1px solid var(--line2); padding:.35em .55em; text-align:left; vertical-align:top}
  th{background:rgba(120,170,255,.09); color:var(--sky); font-weight:700; white-space:nowrap}
  td code{white-space:nowrap}

  .big{font-size:clamp(1.6em,1.2em + 2.4vw,2.8em); font-weight:800; line-height:1.1;
    background:linear-gradient(90deg,var(--acc),var(--acc2)); -webkit-background-clip:text;
    background-clip:text; -webkit-text-fill-color:transparent}
  .kbd{display:inline-block; border:1px solid var(--line); border-bottom-width:2px; border-radius:6px;
    padding:.05em .45em; font-size:.82em; font-family:ui-monospace,monospace; background:rgba(255,255,255,.05)}
  .pills{display:flex; flex-wrap:wrap; gap:.35em; margin:.5em 0}
  .pill{border:1px solid var(--line); border-radius:999px; padding:.15em .7em; font-size:.78em; color:var(--mut)}
  .pill.on{border-color:var(--acc); color:var(--acc)}

  .grid7{display:grid; grid-template-columns:repeat(auto-fit,minmax(4.2rem,1fr)); gap:.5em}
  .mino{border-radius:8px; padding:.4em; text-align:center; font-size:.78em; border:1px solid var(--line2)}
  .mino b{display:block; font-size:1.5em; line-height:1}

  .steps{counter-reset:st; margin:.6em 0; padding:0; list-style:none}
  .steps li{counter-increment:st; position:relative; padding-left:2em; margin:.45em 0}
  .steps li::before{content:counter(st); position:absolute; left:0; top:.05em; width:1.45em; height:1.45em;
    border-radius:50%; background:rgba(34,211,238,.16); color:var(--acc); font-size:.78em; font-weight:800;
    display:grid; place-items:center}

  /* 4x4 비트마스크 그림 */
  .bits{display:inline-grid; grid-template-columns:repeat(4,1.5em); gap:2px; margin:.35em .8em .35em 0;
    vertical-align:top}
  .bits i{width:1.5em; height:1.5em; border-radius:4px; background:rgba(255,255,255,.05);
    border:1px solid var(--line2); font-size:.6em; display:grid; place-items:center; color:var(--dim); font-style:normal}
  .bits i.f{background:var(--acc); border-color:var(--acc); color:#04222a; font-weight:800}
  .bits.J i.f{background:var(--J); border-color:var(--J); color:#fff}
  .bits.T i.f{background:var(--T); border-color:var(--T); color:#fff}
  .bits.S i.f{background:var(--S); border-color:var(--S); color:#052e16}
  .bits.Z i.f{background:var(--Z); border-color:var(--Z); color:#fff}
  .bits.L i.f{background:var(--L); border-color:var(--L); color:#2a1500}
  .bits.O i.f{background:var(--O); border-color:var(--O); color:#2a2200}
  .bitrow{display:flex; flex-wrap:wrap; gap:.9em; align-items:flex-start}
  .bitrow figure{margin:0; text-align:center}
  .bitrow figcaption{font-size:.72em; color:var(--mut); margin-top:.2em; font-family:ui-monospace,monospace}

  /* 보드 도해 */
  .board{display:inline-grid; gap:1px; background:var(--line2); border:1px solid var(--line);
    border-radius:6px; padding:1px; margin:.4em 0; max-width:100%}
  .board i{width:clamp(.75rem,2.4vw,1.15rem); aspect-ratio:1; background:#0a1120; border-radius:2px; font-style:normal}
  .board i.f{background:#3f5170} .board i.p{background:var(--T)} .board i.g{background:rgba(168,85,247,.25)}
  .board i.c{background:var(--I)} .board i.x{background:var(--bad)}

  /* ---------- 데모 ---------- */
  .demoWrap{margin:.5em 0 0}
  .tetris{display:grid; gap:.55em; align-items:start;
    grid-template-columns:auto minmax(0,1fr) auto;
    grid-template-areas:"l m r" "p p p"; justify-content:center}
  .tetris[data-layout="narrow"]{grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-areas:"l r" "m m" "p p"}
  .tetris:focus{outline:none}
  .tetris:focus-visible{outline:2px solid var(--acc); outline-offset:4px; border-radius:12px}
  .t-left{grid-area:l} .t-right{grid-area:r} .t-mid{grid-area:m; position:relative; justify-self:center}
  .t-pad{grid-area:p}
  .t-side{display:flex; flex-direction:column; gap:.45em; min-width:0}
  .t-box{background:rgba(255,255,255,.04); border:1px solid var(--line2); border-radius:10px; padding:.3em .4em}
  .t-cap{font-size:.62em; letter-spacing:.12em; color:var(--dim); font-weight:800; text-align:center}
  .t-board{display:block; border-radius:8px; border:1px solid var(--line); touch-action:none}
  .t-hold,.t-next{display:block; margin:0 auto}
  .t-stats{display:grid; gap:.25em}
  .t-stats>div{background:rgba(255,255,255,.04); border:1px solid var(--line2); border-radius:8px;
    padding:.2em .45em; display:flex; flex-direction:column}
  .t-stats b{font-size:.98em; font-variant-numeric:tabular-nums; line-height:1.2}
  .t-stats span{font-size:.58em; letter-spacing:.1em; color:var(--dim); font-weight:700}
  .t-badges{display:flex; flex-wrap:wrap; gap:.25em; align-content:flex-start}
  .bd{font-size:.6em; font-weight:800; padding:.14em .5em; border-radius:999px; white-space:nowrap}
  .bd.combo{background:rgba(34,211,238,.18); color:var(--acc)}
  .bd.b2b{background:rgba(251,191,36,.18); color:var(--warn)}
  .bd.pc{background:rgba(168,85,247,.2); color:#e9d5ff}
  .t-over{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
  .t-msg{background:rgba(6,10,20,.82); border:1px solid var(--line); border-radius:12px;
    padding:.7em 1.1em; text-align:center; backdrop-filter:blur(3px)}
  .t-msg b{display:block; font-size:1.15em; color:var(--acc)}
  .t-msg span{display:block; font-size:.82em; color:var(--ink)}
  .t-msg em{display:block; font-size:.7em; color:var(--mut); font-style:normal; margin-top:.25em}
  .t-pad{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:.35em; margin-top:.15em}
  .t-pad button{min-height:2.7em; border-radius:10px; border:1px solid var(--line);
    background:rgba(255,255,255,.06); color:var(--ink); font-size:.92em; font-weight:700;
    cursor:pointer; touch-action:manipulation; user-select:none}
  .t-pad button.on{background:rgba(34,211,238,.28); border-color:var(--acc)}
  .t-pad button.wide{grid-column:span 3}
  /* 낮은 화면(폴드 커버 가로 등): 패드를 한 줄로 접어 보드가 잘리지 않게 */
  .tetris[data-h="short"] .t-pad{grid-template-columns:repeat(8,minmax(0,1fr))}
  .tetris[data-h="short"] .t-pad button{min-height:2.3em; font-size:.8em}
  .tetris[data-h="short"] .t-pad button.wide{grid-column:span 1}
  .demohint{font-size:.72em; color:var(--dim); text-align:center; margin-top:.4em}


  /* ---------- 도식: 등폭 폰트에 의존하지 않는 박스 다이어그램 ----------
     박스 문자(─│┌)는 한글 폰트에서 전각, 등폭 라틴 폰트에서 반각으로 그려져
     한글과 섞이면 열이 어긋난다. 그래서 도식은 문자 대신 CSS 로 그린다. */
  .dia{margin:.7em 0}
  .dbox{border:1px solid var(--line); border-radius:12px; padding:.6em .7em;
    background:rgba(255,255,255,.035)}
  .dbox+.dbox{margin-top:.45em}
  .dbox .dh{font-weight:800; font-size:.88em; color:var(--acc); margin:0 0 .3em;
    display:flex; flex-wrap:wrap; gap:.5em; align-items:baseline}
  .dbox .dh small{font-weight:500; color:var(--dim); font-size:.82em}
  .dbox.acc{border-color:rgba(34,211,238,.45); background:rgba(34,211,238,.05)}
  .dbox.pur{border-color:rgba(168,85,247,.45); background:rgba(168,85,247,.06)}
  .dbox.inner{background:rgba(0,0,0,.25)}
  .darrow{display:flex; flex-wrap:wrap; gap:.4em .9em; justify-content:center;
    color:var(--mut); font-size:.78em; padding:.35em 0}
  .darrow b{color:var(--ink); font-weight:700}
  .dmem{display:grid; gap:.28em}
  .dmem>div{display:flex; flex-wrap:wrap; justify-content:space-between; gap:.3em .8em;
    font-size:.82em; border:1px dashed var(--line2); border-radius:8px; padding:.24em .55em}
  .dmem b{font-family:ui-monospace,Consolas,monospace; font-weight:600; color:#bfe4ff}
  .dmem span{color:var(--mut)}
  .dtag{font-size:.74em; color:var(--dim); margin-top:.35em; word-break:break-all}
  .dtag b{color:var(--mut); font-weight:700}

  /* 미니 레이아웃 도식 */
  .lay{display:grid; gap:3px; font-size:.72em; text-align:center; margin:.4em 0}
  .lay>div{border:1px solid var(--line2); border-radius:6px; padding:.4em .2em;
    background:rgba(255,255,255,.05); color:var(--mut)}
  .lay>div.b{background:rgba(34,211,238,.12); color:var(--ink); font-weight:700; padding:1.4em .2em}
  .lay>div.full{grid-column:1/-1}

  /* DAS/ARR 타임라인 */
  .tlbar{display:flex; gap:3px; margin:.5em 0; flex-wrap:wrap}
  .tlbar .seg{padding:.35em .6em; font-size:.78em; border-radius:8px; flex:1 1 8em;
    border:1px solid var(--line2)}
  .tlbar .seg.now{background:rgba(74,222,128,.16); border-color:rgba(74,222,128,.5); flex:0 1 auto}
  .tlbar .seg.das{background:rgba(251,191,36,.14); border-color:rgba(251,191,36,.45)}
  .tlbar .seg.arr{background:rgba(34,211,238,.14); border-color:rgba(34,211,238,.45)}
  .tlbar .seg b{display:block; font-size:.9em; color:var(--ink)}

  /* ---------- 하단 내비 ---------- */
  nav#nav{position:fixed; left:0; right:0; bottom:0; display:flex; gap:.5em; justify-content:center;
    align-items:center; padding:.5em max(.7em,env(safe-area-inset-right)) calc(.5em + env(safe-area-inset-bottom)) max(.7em,env(safe-area-inset-left));
    background:linear-gradient(0deg,rgba(7,11,20,.96),rgba(7,11,20,.6) 70%,transparent);
    pointer-events:none; z-index:20}
  nav#nav>*{pointer-events:auto}
  nav#nav button{min-width:3.2em; min-height:2.4em; border-radius:10px; border:1px solid var(--line);
    background:rgba(16,24,39,.9); color:var(--ink); font-size:.95em; cursor:pointer; font-weight:700}
  nav#nav button:disabled{opacity:.35}
  #counter{font-size:.8em; color:var(--mut); font-variant-numeric:tabular-nums; min-width:5.2em; text-align:center}

  /* ---------- 목차 ---------- */
  #toc{position:fixed; inset:0; background:rgba(5,8,16,.97); z-index:40; display:none;
    overflow-y:auto; padding:1em max(1em,env(safe-area-inset-right)) 4em max(1em,env(safe-area-inset-left))}
  #toc.on{display:block}
  #toc h3{margin:.2em 0 .8em; font-size:1.05em}
  .tocsec{margin-bottom:1em}
  .tocsec h4{margin:.2em 0 .35em; font-size:.82em; color:var(--acc); letter-spacing:.02em;
    position:sticky; top:-1em; background:rgba(5,8,16,.97); padding:.25em 0}
  .tocsec a{display:block; color:var(--ink); text-decoration:none; font-size:.85em; padding:.28em .5em;
    border-radius:8px; border:1px solid transparent}
  .tocsec a:hover,.tocsec a:focus{background:rgba(120,170,255,.1); border-color:var(--line2)}
  .tocsec a b{color:var(--dim); font-variant-numeric:tabular-nums; display:inline-block; min-width:2.6em}
  #tocClose{position:fixed; right:max(1em,env(safe-area-inset-right)); bottom:calc(1em + env(safe-area-inset-bottom));
    z-index:41}

  /* 폴더블: 화면이 두 조각으로 나뉘면 힌지를 피해 한 칸에만 렌더 */
  @media (horizontal-viewport-segments:2), (spanning: single-fold-vertical){
    .cols{grid-template-columns:1fr}
    .tetris{grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      grid-template-areas:"l r" "m m" "p p"}
  }
  @media (max-width:430px){
    #top .brand small{display:none}      /* "테트리스 완전정복" 부제 숨김 */
    #tocBtn .lbl{display:none}           /* "목차" 글자 숨기고 ☰ 아이콘만 */
    #secbadge{max-width:36vw; font-size:.68em; padding:.2em .55em}
    .slide h2{font-size:1.05em}
  }
  @media (prefers-reduced-motion:reduce){
    .slide{animation:none} #stage{scroll-behavior:auto} #bar{transition:none}
  }
  @media print{
    body,#deck{height:auto; overflow:visible}
    #stage{overflow:visible; padding:0}
    nav#nav,header#top,#toc,#bar{display:none}
    .slide{display:block !important; page-break-after:always; max-width:100%}
    pre.code{white-space:pre-wrap}
  }
</style>
</head>
<body>
<div id="deck">
  <div id="bar"></div>
  <header id="top">
    <div class="brand"><i>🧱 C++ → wasm</i> <small class="mut">테트리스 완전정복</small></div>
    <div id="secbadge"></div>
    <button id="tocBtn" aria-label="목차 열기">☰<span class="lbl"> 목차</span></button>
  </header>
  <main id="stage" tabindex="-1">
