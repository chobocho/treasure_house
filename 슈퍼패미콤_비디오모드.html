<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>슈퍼 패미콤 비디오 모드 — 2.5D · 유사 3D의 비밀 (인터랙티브 슬라이드 100장)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0d0d1d; --bg1:#151530; --bg2:#1b1b40;
  --red:#e4413f; --yel:#f5b325; --grn:#15a06a; --blu:#4a90e2; --vio:#9b7ede;
  --ink:#eef2fb; --ink-soft:#b9c4dd; --ink-dim:#7e89a8;
  --panel:rgba(255,255,255,.055); --panel-bd:rgba(245,179,37,.30);
  --code-bg:#0a0a18;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Noto Sans KR',sans-serif;color:var(--ink);overflow:hidden;
  background:
    radial-gradient(1100px 560px at 85% -10%, rgba(155,126,222,.12), transparent 60%),
    radial-gradient(900px 520px at 8% 112%, rgba(74,144,226,.10), transparent 60%),
    linear-gradient(160deg,var(--bg0) 0%,var(--bg1) 55%,var(--bg2) 100%);
}
#app{height:100%;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#bar{height:5px;background:rgba(255,255,255,.08);flex:0 0 auto;}
#barFill{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--yel),var(--grn),var(--blu));transition:width .25s;}
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:9px clamp(12px,2.5vw,28px);border-bottom:1px solid rgba(255,255,255,.07);}
header .logo{font-family:'Black Han Sans',sans-serif;font-size:clamp(14px,1.6vw,19px);color:var(--yel);
  white-space:nowrap;letter-spacing:.5px;}
header .logo .dots span{display:inline-block;width:.55em;height:.55em;border-radius:50%;margin-left:3px;}
header .chap{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink-soft);font-size:clamp(12px,1.3vw,15px);text-align:center;}
header .cnt{font-family:'JetBrains Mono',"D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans Mono","DejaVu Sans Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink-dim);
  font-size:clamp(12px,1.3vw,15px);white-space:nowrap;}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;justify-content:center;
  padding:clamp(10px,2vh,22px) clamp(10px,3vw,36px);}
.slide{width:min(1180px,100%);display:flex;flex-direction:column;min-height:0;animation:enter .32s ease both;}
.slide.back{animation:enterBack .32s ease both;}
@keyframes enter{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
@keyframes enterBack{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:none;}}
.kick{color:var(--yel);font-weight:700;font-size:clamp(11.5px,1.5vw,14.5px);letter-spacing:2.5px;margin-bottom:6px;}
h1.st{font-family:'Black Han Sans',sans-serif;font-weight:400;line-height:1.25;
  font-size:clamp(21px,3.3vw,38px);margin-bottom:clamp(10px,1.8vh,18px);letter-spacing:.3px;}
h1.st .em{color:var(--yel);}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding-right:6px;scrollbar-width:thin;scrollbar-color:rgba(245,179,37,.4) transparent;
  font-size:clamp(14.5px,1.7vw,18.5px);line-height:1.75;color:var(--ink-soft);}
.body::-webkit-scrollbar{width:6px;}
.body::-webkit-scrollbar-thumb{background:rgba(245,179,37,.35);border-radius:3px;}
.body b,.body strong{color:var(--ink);}
.body em{color:var(--yel);font-style:normal;font-weight:700;}
.body p{margin:0 0 12px;}
.body ul.b{list-style:none;margin:4px 0 14px;}
.body ul.b>li{padding:6px 0 6px 26px;position:relative;}
.body ul.b>li::before{content:'▸';position:absolute;left:4px;color:var(--yel);top:6px;}
.body ol{margin:4px 0 14px 24px;}
.body ol>li{padding:4px 0;}
.note{background:var(--panel);border:1px solid var(--panel-bd);border-left:4px solid var(--yel);
  border-radius:10px;padding:12px 16px;margin:12px 0;font-size:.94em;}
.note.blue{border-left-color:var(--blu);border-color:rgba(74,144,226,.35);}
.note.red{border-left-color:var(--red);border-color:rgba(228,65,63,.35);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0;}
@media (max-width:720px){.grid2{grid-template-columns:1fr;}}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 15px;}
.card h3{font-size:1em;color:var(--yel);margin-bottom:6px;}
.card p{font-size:.9em;margin-bottom:0;}
table.tbl{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:.88em;}
table.tbl th{background:rgba(245,179,37,.14);color:var(--ink);padding:7px 10px;text-align:left;
  border:1px solid rgba(255,255,255,.12);white-space:nowrap;}
table.tbl td{padding:6px 10px;border:1px solid rgba(255,255,255,.10);}
table.tbl tr:nth-child(even) td{background:rgba(255,255,255,.03);}
.tblWrap{overflow-x:auto;}
pre.code{background:var(--code-bg);border:1px solid rgba(255,255,255,.12);border-radius:10px;
  padding:13px 16px;margin:10px 0 14px;overflow-x:auto;font-family:'JetBrains Mono',"D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans Mono","DejaVu Sans Mono",monospace;
  font-size:clamp(11.5px,1.35vw,14px);line-height:1.6;color:#dce4f5;white-space:pre;}
pre.code .c{color:#6f9c7a;} pre.code .k{color:#7ec4ef;} pre.code .n{color:#f5b325;} pre.code .s{color:#e0946f;}
.codeLabel{display:inline-block;font-family:'JetBrains Mono',"D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans Mono","DejaVu Sans Mono",monospace;font-size:11.5px;letter-spacing:1px;
  background:rgba(74,144,226,.18);border:1px solid rgba(74,144,226,.4);color:#9cc7f0;
  border-radius:6px 6px 0 0;padding:2px 10px;margin-bottom:-11px;position:relative;z-index:1;margin-left:8px;}
.reg{display:inline-block;font-family:'JetBrains Mono',"D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans Mono","DejaVu Sans Mono",monospace;font-size:.85em;background:rgba(155,126,222,.16);
  border:1px solid rgba(155,126,222,.45);color:#cbb8f5;border-radius:6px;padding:1px 8px;margin:0 2px;white-space:nowrap;}
kbd{font-family:'JetBrains Mono',"D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans Mono","DejaVu Sans Mono",monospace;font-size:.82em;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.25);border-bottom-width:2.5px;border-radius:6px;padding:1px 7px;}
.tagrow{margin:8px 0;}
.tag{display:inline-block;background:rgba(245,179,37,.12);border:1px solid rgba(245,179,37,.4);border-radius:999px;
  padding:2px 12px;font-size:12.5px;color:var(--yel);margin:2px 4px 2px 0;font-family:'JetBrains Mono',"D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans Mono","DejaVu Sans Mono",monospace;}
.demoWrap{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);border-radius:14px;
  padding:14px;margin:12px 0;}
.demoWrap .dTitle{font-size:12.5px;letter-spacing:1.5px;color:var(--grn);font-family:'JetBrains Mono',"D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans Mono","DejaVu Sans Mono",monospace;
  margin-bottom:10px;}
.demoWrap .dTitle::before{content:'▶ LIVE DEMO  ';color:var(--red);}
canvas.demo{width:100%;max-width:680px;display:block;margin:0 auto;image-rendering:pixelated;
  border-radius:8px;background:#000;border:1px solid rgba(255,255,255,.18);}
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;margin-top:12px;
  font-size:13.5px;color:var(--ink-soft);}
.ctl label{display:flex;align-items:center;gap:8px;white-space:nowrap;}
.ctl input[type=range]{width:clamp(90px,18vw,170px);accent-color:var(--yel);}
.ctl .val{font-family:'JetBrains Mono',"D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans Mono","DejaVu Sans Mono",monospace;color:var(--yel);min-width:52px;display:inline-block;}
.ctl button{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:13px;color:var(--ink);
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.25);border-radius:8px;
  padding:6px 14px;cursor:pointer;}
.ctl button.on{background:rgba(21,160,106,.3);border-color:var(--grn);color:#9fe8c9;}
.padBtns{display:flex;gap:8px;justify-content:center;margin-top:10px;}
.padBtns button{font-size:17px;padding:10px 20px;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.3);border-radius:12px;color:var(--ink);cursor:pointer;touch-action:none;user-select:none;}
.padBtns button:active{background:rgba(245,179,37,.35);}
.big{text-align:center;font-size:clamp(17px,2.6vw,26px);line-height:1.7;margin:clamp(16px,6vh,60px) auto;max-width:820px;}
.big .hero{font-family:'Black Han Sans',sans-serif;font-size:clamp(26px,4.5vw,52px);display:block;margin:14px 0;color:var(--yel);}
/* 챕터 표지 */
.cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;}
.cover .icon{font-size:clamp(44px,9vw,90px);margin-bottom:14px;}
.cover .chNo{font-family:'JetBrains Mono',"D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans Mono","DejaVu Sans Mono",monospace;color:var(--ink-dim);letter-spacing:4px;font-size:clamp(12px,1.6vw,16px);}
.cover h1{font-family:'Black Han Sans',sans-serif;font-size:clamp(28px,5.4vw,58px);line-height:1.25;margin:10px 0 16px;}
.cover h1 .em{color:var(--yel);}
.cover .desc{color:var(--ink-soft);max-width:720px;font-size:clamp(14px,1.9vw,19px);line-height:1.8;}
.cover .mini{margin-top:22px;color:var(--ink-dim);font-size:13px;font-family:'JetBrains Mono',"D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans Mono","DejaVu Sans Mono",monospace;}
footer{flex:0 0 auto;display:flex;gap:10px;align-items:center;
  padding:10px clamp(12px,2.5vw,28px) calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.07);}
footer button{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:clamp(12.5px,1.4vw,15px);
  color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);
  border-radius:10px;padding:9px 16px;cursor:pointer;white-space:nowrap;}
footer button:hover{background:rgba(245,179,37,.2);}
#dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
#dots .d{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.16);cursor:pointer;border:none;padding:0;}
#dots .d.on{background:var(--yel);}
#toc{position:fixed;inset:0;background:rgba(8,8,20,.92);backdrop-filter:blur(8px);z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
#toc[hidden]{display:none;}
#toc h2{font-family:'Black Han Sans',sans-serif;color:var(--yel);margin-bottom:18px;font-size:clamp(20px,3vw,30px);}
#toc .list{display:grid;gap:10px;width:min(680px,100%);max-height:70vh;overflow-y:auto;}
#toc .item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid rgba(255,255,255,.14);
  border-radius:12px;padding:12px 18px;color:var(--ink);cursor:pointer;text-align:left;font-size:clamp(13.5px,1.7vw,17px);}
#toc .item:hover{border-color:var(--yel);}
#toc .item .no{font-family:'JetBrains Mono',"D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans Mono","DejaVu Sans Mono",monospace;color:var(--ink-dim);font-size:.85em;white-space:nowrap;}
#toc .close{margin-top:18px;background:none;border:1px solid rgba(255,255,255,.3);color:var(--ink-soft);
  border-radius:999px;padding:8px 22px;cursor:pointer;}
@media (max-width:560px){
  footer button.txt{padding:9px 12px;}
  .body{font-size:14.5px;}
}
</style>
</head>
<body>
<div id="app">
  <div id="bar"><div id="barFill"></div></div>
  <header>
    <div class="logo">SNES MODES <span class="dots"><span style="background:var(--red)"></span><span style="background:var(--yel)"></span><span style="background:var(--grn)"></span><span style="background:var(--blu)"></span></span></div>
    <div class="chap" id="chapLabel"></div>
    <div class="cnt" id="cnt"></div>
  </header>
  <main id="stage"></main>
  <footer>
    <button id="btnPrev" class="txt">◀ 이전</button>
    <button id="btnToc" class="txt">☰ 목차</button>

    <button id="btnNext" class="txt">다음 ▶</button>
  </footer>
</div>
<div id="toc" hidden>
  <h2>목차</h2>
  <div class="list" id="tocList"></div>
  <button class="close" id="tocClose">닫기 ✕</button>
</div>
<script>
'use strict';
const CHAPTERS=[];
function CH(o){CHAPTERS.push(o);}
</script>
<script>
/* ───────────── CH 1. SNES 그래픽 하드웨어 ───────────── */
CH({
icon:'🕹️', title:'슈퍼 패미콤의 <span class="em">화면 모드</span>',
desc:'1990년의 16비트 게임기가 어떻게 폴리곤 없이 3D처럼 보이는 화면을 만들었을까? 8가지 비디오 모드, 특히 Mode 7과 HDMA가 열어 준 2.5D·유사 3D의 세계를 100장의 슬라이드와 동작하는 데모로 배웁니다.',
slides:[
{t:'이 슬라이드 사용법',k:'HOW TO USE',h:`
<ul class="b">
<li><kbd>→</kbd> <kbd>Space</kbd> 다음 장, <kbd>←</kbd> 이전 장, <kbd>Home</kbd>/<kbd>End</kbd> 처음/끝. 모바일에선 <em>좌우 스와이프</em>.</li>
<li>하단 <b>☰ 목차</b>로 7개 챕터를 바로 이동할 수 있습니다. 노란 점은 현재 챕터.</li>
<li><b>▶ LIVE DEMO</b> 박스는 그림이 아니라 <em>지금 이 브라우저에서 실행 중인 Canvas 코드</em>입니다. 슬라이더와 버튼을 직접 만져 보세요.</li>
<li>모든 데모는 SNES 실제 해상도(256×224)에 가까운 저해상도 버퍼에 픽셀 단위로 그린 뒤 확대합니다 — 실기와 같은 원리입니다.</li>
</ul>
<div class="note">코드 예제는 두 종류입니다. <span class="reg">65816 ASM</span>은 실제 SNES에서 레지스터를 조작하는 방법, <span class="reg">JavaScript</span>는 같은 원리를 Canvas로 재현한 이 문서의 데모 코드입니다.</div>`},
{t:'1990년, 슈퍼 패미콤의 등장',k:'BACKGROUND',h:`
<p>1990년 11월 21일, 닌텐도는 <b>슈퍼 패미콤(SFC)</b>을 출시합니다. 서양명 <b>SNES</b>. CPU는 65816 기반 <em>겨우 3.58MHz</em> — 경쟁 기종 메가드라이브(7.6MHz 68000)의 절반도 안 되는 클럭이었죠.</p>
<p>그런데도 SFC가 그래픽으로 한 세대를 지배한 이유는 단 하나, <em>PPU(Picture Processing Unit)</em>라는 강력한 전용 그래픽 칩 때문입니다. CPU가 느려도 화면 합성·회전·확대는 하드웨어가 공짜로 해 줬습니다.</p>
<ul class="b">
<li>동시 발색 256색 (32,768색 팔레트 중)</li>
<li>배경 레이어 최대 4장 + 스프라이트 128개</li>
<li>그리고 이 문서의 주인공 — <em>8가지 비디오 모드</em></li>
</ul>`},
{t:'경쟁의 핵심은 CPU가 아니라 PPU였다',k:'PPU FIRST',h:`
<p>당시 게임 화면의 90%는 "배경을 깔고, 스크롤하고, 스프라이트를 얹는" 일이었습니다. 이 일을 CPU가 소프트웨어로 하면 클럭을 아무리 올려도 모자랍니다.</p>
<p>SFC 설계진은 반대로 갔습니다. <em>CPU는 게임 로직만, 화면은 PPU가 전부</em>. 개발자는 "무엇을 그릴지"를 VRAM과 레지스터에 써 넣기만 하면, 매 프레임 픽셀을 찍는 노동은 PPU가 합니다.</p>
<div class="note blue"><b>이 관점이 곧 '비디오 모드'입니다.</b> 모드란 PPU에게 "이번 화면은 레이어 몇 장, 색 몇 개, 어떤 특수효과로 조립해라"라고 지시하는 <em>하드웨어 조립 설명서</em>입니다. 개발자가 픽셀 루프를 짤 필요가 없다는 것 — 그게 2.5D 게임 개발의 '큰 편의'였습니다.</div>`},
{t:'PPU의 4가지 메모리',k:'ARCHITECTURE',h:`
<p>PPU는 사실 PPU1(화면 합성)·PPU2(색·효과) 두 칩이지만, 개발자에겐 <b>4개의 전용 메모리</b>로 보입니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>메모리</th><th>크기</th><th>담는 것</th></tr>
<tr><td><b>VRAM</b></td><td>64KB</td><td>타일 그림 데이터 + 타일맵(배치도)</td></tr>
<tr><td><b>CGRAM</b></td><td>512B</td><td>팔레트 256색 (색당 15비트 BGR)</td></tr>
<tr><td><b>OAM</b></td><td>544B</td><td>스프라이트 128개의 위치·타일·속성</td></tr>
<tr><td><b>레지스터</b></td><td>$2100~$213F</td><td>모드·스크롤·회전행렬 등 '지시서'</td></tr>
</table></div>
<p>CPU는 이 메모리들을 V-Blank(화면을 안 그리는 짬) 동안 갱신하고, 나머지 시간엔 PPU가 혼자 화면을 만듭니다.</p>`},
{t:'화면은 한 줄씩 그려진다 — 스캔라인',k:'SCANLINE',h:`
<p>브라운관 TV는 전자빔이 <em>왼쪽→오른쪽, 위→아래</em>로 한 줄(스캔라인)씩 화면을 칠합니다. SFC 화면은 256×224픽셀 = 224개의 스캔라인.</p>
<div class="demoWrap"><div class="dTitle">SCANLINE RENDERING</div>
<canvas class="demo" data-demo="scanline" width="512" height="240"></canvas>
<div class="ctl"><label>속도 <input type="range" data-p="spd" min="1" max="8" value="3"></label></div>
</div>

{t:'픽셀이 아니라 타일',k:'TILE',h:`

{t:'타일맵 — 화면의 설계도',k:'TILEMAP',h:`

<p>반전 비트 덕에 좌우대칭 배경은 타일을 절반만 그려도 됩니다. 우선순위 비트는 "이 기둥은 캐릭터보다 앞에" 같은 <em>깊이 연출</em>의 기본 도구고요.</p>`},

{t:'수학 ② 왜 역방향으로 읽는가',k:'INVERSE MAPPING',h:`

<p>게임 코드가 하는 일은 매 프레임 <em>이 여섯 개에 숫자를 쓰는 것뿐</em>. 회전하는 화면을 위해 픽셀 하나 만지지 않습니다. 이것이 "큰 편의"의 정점입니다.</p>`},
{t:'8.8 고정소수점 — 소수점 없는 소수',k:'FIXED POINT',h:`
<p>65816에는 부동소수점이 없습니다. Mode 7 행렬은 <b>8.8 고정소수점</b> — 16비트를 "정수 8비트 + 소수 8비트"로 해석합니다.</p>
<pre class="code" data-lang="asm">; 값 = 원하는 실수 × 256
; 1.0  → $0100     0.5  → $0080
; cos30°=0.866 → 0.866*256 ≈ 222 → $00DE
lda #$DE
sta $211B      ; M7A 하위
lda #$00
sta $211B      ; M7A 상위 (두 번 쓰기)</pre>
<ul class="b">
<li>sin/cos은 <b>미리 계산한 표(테이블)</b>를 ROM에 넣고 각도로 인덱싱</li>
<li>정밀도 1/256 — 화면 크기에선 충분히 매끄러움</li>
</ul>`},
{t:'데모 ① 회전',k:'LIVE: ROTATE',h:`
<div class="demoWrap"><div class="dTitle">MODE 7 ROTATION (A=cosθ B=sinθ C=-sinθ D=cosθ)</div>
<canvas class="demo" data-demo="m7rot" width="256" height="224"></canvas>
<div class="ctl">
<label>각도 θ <input type="range" data-p="ang" min="0" max="360" value="20"> <span class="val" data-p="angV"></span></label>
<button data-p="auto">자동 회전</button>
</div>
</div>
<p>슬라이더가 곧 <span class="reg">M7A~M7D</span>입니다. 각도 하나로 행렬 4개가 정해지고, 화면 전체가 돕니다.</p>`},
{t:'데모 ② 확대·축소',k:'LIVE: SCALE',h:`
<div class="demoWrap"><div class="dTitle">MODE 7 SCALING (A=D=1/s)</div>
<canvas class="demo" data-demo="m7scale" width="256" height="224"></canvas>
<div class="ctl">
<label>배율 s <input type="range" data-p="sc" min="25" max="400" value="100"> <span class="val" data-p="scV"></span></label>
<button data-p="pulse">줌 펄스</button>
</div>
</div>
<p>보스 등장 때 화면이 <em>쿵!</em> 하고 확대되는 그 연출 — 프레임마다 s를 바꾸며 M7A/M7D에 쓰면 끝입니다. RPG 전투 돌입 연출(FF 시리즈의 빙글빙글 줌)도 같은 원리 + 회전.</p>`},
{t:'데모 ③ 회전+확대+이동 종합',k:'LIVE: FULL MATRIX',h:`
<div class="demoWrap"><div class="dTitle">FULL AFFINE: ROTATE + SCALE + TRANSLATE</div>
<canvas class="demo" data-demo="m7full" width="256" height="224"></canvas>
<div class="ctl">
<label>θ <input type="range" data-p="ang" min="0" max="360" value="0"></label>
<label>s <input type="range" data-p="sc" min="25" max="300" value="100"></label>
<label>이동X <input type="range" data-p="tx" min="0" max="1024" value="512"></label>
<label>이동Y <input type="range" data-p="ty" min="0" max="1024" value="512"></label>
<button data-p="fly">비행선 모드</button>
</div>
</div>
<p><b>비행선 모드</b>는 FF6 오프닝처럼 회전·축소·이동을 자동으로 섞습니다. 슬라이더 4개 = 레지스터 6개 = 세계지도 위 비행.</p>`},
{t:'65816 실전 코드 — 프레임 루프',k:'ASM',h:`
<span class="codeLabel">65816 ASM (V-Blank 마다)</span>
<pre class="code" data-lang="asm">UpdateMode7:
  ldx angle        ; 0~255 = 한 바퀴
  lda CosTbl,x     ; ROM의 코사인 표
  sta $211B        ; M7A = cos (하위)
  lda CosTbl+1,x
  sta $211B        ;       (상위)
  lda SinTbl,x
  sta $211C        ; M7B = sin
  lda SinTbl+1,x
  sta $211C
  ; M7C = -sin, M7D = cos 도 동일 요령
  inc angle        ; 다음 프레임 1스텝 회전
  rts</pre>
<p>이게 <em>전부</em>입니다. 프레임당 쓰기 16바이트 남짓 — 3.58MHz CPU로도 여유. 회전 화면의 총비용이 테이블 조회 몇 번입니다.</p>`},
{t:'JS 구현 ① 텍스처 준비',k:'JS CODE',h:`
<span class="codeLabel">JavaScript — 이 문서의 데모가 실제 쓰는 코드</span>
<pre class="code" data-lang="js">// 1024x1024 대신 256x256 텍스처(작은 세계지도)를
// 오프스크린 캔버스에 그리고 픽셀 배열을 뽑는다
function makeTexture(){
  const off=document.createElement('canvas');
  off.width=off.height=256;
  const c=off.getContext('2d');
  drawTrack(c);                    // 잔디·도로·커브연석
  const img=c.getImageData(0,0,256,256);
  return new Uint32Array(img.data.buffer); // 픽셀=32비트 1개
}</pre>
<ul class="b">
<li><b>Uint32Array</b>로 보면 픽셀 하나가 정수 하나 — 복사가 4배 빠릅니다</li>
<li>SNES의 "VRAM에 타일 로드"에 해당하는 준비 단계</li>
</ul>`},
{t:'JS 구현 ② 픽셀 루프 = PPU 흉내',k:'JS CODE',h:`
<span class="codeLabel">JavaScript — 역방향 아핀 샘플링</span>
<pre class="code" data-lang="js">function renderAffine(out, tex, ang, scale, x0, y0){
  const cos=Math.cos(ang)/scale, sin=Math.sin(ang)/scale;
  let i=0;
  for(let sy=0; sy&lt;H; sy++){
    // 행 시작점: 행렬×(0-cx, sy-cy) + 중심
    let u = cos*(0-cx) + sin*(sy-cy) + x0;
    let v = -sin*(0-cx) + cos*(sy-cy) + y0;
    for(let sx=0; sx&lt;W; sx++){
      out[i++] = tex[ ((v&255)&lt;&lt;8) | (u&255) ];
      u += cos;  v += -sin;   // ★ 옆 픽셀은 덧셈만!
    }
  }
}</pre>
<div class="note">★가 핵심 최적화 — 픽셀마다 행렬을 다시 곱하지 않고 <em>증분(DDA)</em>으로 갑니다. 실제 PPU도 같은 방식의 가산기 회로입니다.</div>`},
{t:'하드웨어는 이걸 공짜로 한다',k:'PERFORMANCE',h:`
<p>방금 루프는 256×224 = 57,344픽셀. 초당 60프레임이면 <b>344만 샘플링/초</b>입니다.</p>
<ul class="b">
<li>3.58MHz 65816로 소프트웨어 구현 시: 픽셀당 최소 20사이클 → <em>초당 3프레임</em>도 어림없음</li>
<li>PPU 하드웨어: 픽셀 클럭에 맞춰 <b>실시간</b> — CPU 부담 0%</li>
<li>같은 시기 PC(286/386)는 이걸 CPU로 하느라 화면을 작게 줄였습니다</li>
</ul>
<div class="note blue">"유사 3D 게임 개발에 큰 편의"의 정량적 실체: <em>초당 수백만 번의 곱셈-덧셈을 회로에 떠넘기고, 개발자는 프레임당 숫자 6개만 쓴다.</em></div>`},
{t:'화면 밖은 어떻게? — M7SEL',k:'$211A',h:`
<p>128×128 타일맵(1024×1024px) 바깥을 카메라가 보면? <span class="reg">$211A M7SEL</span>이 정합니다.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>설정</th><th>화면 밖 처리</th><th>쓰임</th></tr>
<tr><td>랩어라운드</td><td>지도가 무한 반복</td><td>끝없는 평원, 레이싱</td></tr>
<tr><td>투명</td><td>배경색만</td><td>우주에 뜬 지도</td></tr>
<tr><td>타일 0 반복</td><td>0번 타일로 채움</td><td>바다로 둘러싼 월드맵</td></tr>
</table></div>
<p>M7SEL엔 화면 전체 좌우/상하 반전 비트도 있습니다 — 거울 세계, 천장에 비친 방 같은 연출이 비트 2개.</p>`},
{t:'EXTBG — 숨은 Mode 7.1',k:'SETINI',h:`
<p><span class="reg">$2133 SETINI</span>의 EXTBG 비트를 켜면 같은 Mode 7 화면이 <b>BG2로 한 번 더</b> 합성됩니다.</p>
<ul class="b">
<li>픽셀의 최상위 비트를 <b>우선순위</b>로 해석 — 색은 128색으로 줄지만</li>
<li>Mode 7 배경의 일부(다리, 아치)를 <em>스프라이트 앞으로</em> 보낼 수 있게 됨</li>
<li>회전하는 바닥 위에 입체 구조물이 서 있는 듯한 연출 가능</li>
</ul>
<div class="note">비공식 통칭 "Mode 7.1". 마리오 카트의 파이프·장애물이 카트를 가리는 장면이 이 기법의 수혜자입니다.</div>`},
{t:'Mode 7의 최대 약점',k:'LIMITATION',h:`
<p>이 마법에도 명확한 한계가 있습니다.</p>
<ul class="b">
<li><b>스프라이트는 회전하지 않는다</b> — 배경만 아핀 변환. 캐릭터 회전은 각도별 그림을 미리 그려야(마리오 카트는 카트를 <em>22.5°씩 미리 렌더</em>)</li>
<li><b>레이어가 하나</b> — 패럴랙스 하늘은 포기하거나 트릭 필요(5장에서 해결)</li>
<li><b>평면 하나뿐</b> — 벽·언덕 같은 높이는 표현 불가(F-Zero 트랙이 평평한 이유)</li>
<li>화면 전체가 <b>같은 행렬</b> — 이대로는 원근감이 없음</li>
</ul>
<p>마지막 항목을 잘 보세요. "화면 전체가 같은 행렬"… 만약 <em>스캔라인마다 행렬을 바꿀 수 있다면</em>? 그게 다음 장, HDMA입니다.</p>`},
{t:'4장 요약',k:'RECAP',h:`
<ul class="b">
<li>Mode 7 = 128×128 타일맵 한 장 + <b>2×2 아핀 행렬</b></li>
<li>화면→텍스처 <b>역방향 샘플링</b>, 증분 덧셈으로 픽셀당 비용 최소화</li>
<li>개발자 API는 사실상 <b>레지스터 6개</b> — 회전·확대·이동이 숫자 쓰기로 끝</li>
<li>8.8 고정소수점 + sin/cos 테이블이 실전 도구</li>
<li>약점: 단일 레이어·스프라이트 비회전·<em>화면 전체 단일 행렬</em></li>
</ul>
<div class="big">평면을 돌리는 법은 배웠다.<span class="hero">이제 평면을 "눕혀서" 3D를 만들 차례.</span></div>`},
]});
</script>
<script>
/* ───────────── CH 5. HDMA와 유사 3D ───────────── */
CH({
icon:'📡', title:'HDMA — <span class="em">스캔라인 마술</span>과 유사 3D의 완성',
desc:'H-Blank마다 레지스터를 자동으로 갈아끼우는 HDMA. 스캔라인마다 다른 Mode 7 행렬을 먹이면, 눕힌 평면 — 원근 3D가 태어납니다. F-Zero의 비밀 전부.',
slides:[
{t:'HDMA — H-Blank의 자동 배달부',k:'WHAT IS HDMA',h:`
<p>2장에서 본 <b>H-Blank</b> — 스캔라인과 스캔라인 사이의 짧은 휴식. <b>HDMA</b>(H-Blank DMA)는 이 틈마다 <em>미리 준비한 표의 값을 지정 레지스터에 자동 전송</em>하는 장치입니다.</p>
<ul class="b">
<li>채널 8개 — 서로 다른 레지스터 8종을 동시에 조종 가능</li>
<li>CPU 개입 없음: 표만 만들어 두면 <b>하드웨어가 224번 배달</b></li>
<li>대상은 아무 PPU 레지스터나 — 배경색, 스크롤, 창 위치, 그리고 <em>Mode 7 행렬</em></li>
</ul>
<div class="note blue">한 문장 요약: <em>"화면의 모든 가로줄이 서로 다른 설정을 가질 수 있다."</em> 이 문장이 유사 3D의 열쇠입니다.</div>`},
{t:'DMA vs HDMA',k:'COMPARISON',h:`
<div class="grid2">
<div class="card"><h3>DMA (범용)</h3><p>큰 데이터를 <b>한 번에 왕창</b> 전송. V-Blank에 타일·팔레트를 VRAM으로 나를 때. "이삿짐 트럭".</p></div>
<div class="card"><h3>HDMA (스캔라인)</h3><p>작은 값을 <b>매 줄 조금씩</b> 전송. 화면을 그리는 중에 설정을 실시간 변경. "정기 배송".</p></div>
</div>
<span class="codeLabel">65816 — HDMA 채널 설정</span>
<pre class="code" data-lang="asm">lda #$02
sta $4300     ; 채널0: 모드2 (레지스터에 2바이트)
lda #$26
sta $4301     ; 대상: $2126 (창 위치 레지스터)
; $4302~04 에 테이블 주소 설정 후
lda #$01
sta $420C     ; HDMA 채널0 가동!</pre>`},
{t:'HDMA 테이블 구조',k:'TABLE FORMAT',h:`
<span class="codeLabel">HDMA 테이블 (개념)</span>
<pre class="code" data-lang="asm">HdmaTable:
  db 16        ; 다음 16 스캔라인 동안
  db $1F       ;   이 값을 배달
  db 8         ; 그 다음 8 스캔라인은
  db $3A       ;   이 값
  db $80|32    ; 비트7 세트 = 32줄 연속으로
  db ...       ;   매 줄 새 값 (연속 모드)
  db 0         ; 끝</pre>
<ul class="b">
<li>"줄 수 + 값" 쌍의 나열 — 게임 로직은 <b>V-Blank에 이 표만 다시 씀</b></li>
<li>연속 모드(비트7)면 224줄 전부 다른 값도 가능</li>
</ul>`},
{t:'첫 HDMA — 그라데이션 하늘',k:'LIVE',h:`
<p>가장 쉬운 HDMA: 배경색 레지스터를 매 줄 바꾸면, 단색밖에 못 내는 배경색이 <b>그라데이션</b>이 됩니다.</p>
<div class="demoWrap"><div class="dTitle">HDMA → COLOR REGISTER PER SCANLINE</div>
<canvas class="demo" data-demo="hdmagrad" width="512" height="240"></canvas>
<div class="ctl"><button data-p="cycleSky" class="on">노을 애니메이션</button></div>
</div>
<p>오른쪽에 지금 배달 중인 "표"가 함께 흐릅니다. 크로노 트리거의 노을, 젤다의 새벽 하늘이 전부 이 기법 — <em>타일 한 장 없이</em> 하늘을 만듭니다.</p>`},
{t:'핵심 아이디어 — 줄마다 다른 축소율',k:'THE BIG IDEA',h:`
<p>이제 두 무기를 합칩니다.</p>
<ul class="b">
<li><b>Mode 7</b>: 화면 전체를 행렬로 확대·축소할 수 있다</li>
<li><b>HDMA</b>: 스캔라인마다 레지스터를 바꿀 수 있다</li>
</ul>
<div class="big">화면 아래쪽 줄일수록 <b>덜 축소</b>하고,<br>위쪽 줄일수록 <b>많이 축소</b>하면?<span class="hero">평면이 "눕는다" — 원근이 생긴다</span></div>
<p>멀리 있는 것(화면 위쪽)은 작게, 가까운 것(아래쪽)은 크게. 원근법의 정의 그대로입니다.</p>`},
{t:'원근의 수학 — 닮은꼴 삼각형',k:'PERSPECTIVE MATH',h:`
<p>눈높이 h에서 바닥을 내려다볼 때, 화면의 y번째 줄에 보이는 바닥까지의 거리는:</p>
<pre class="code" data-lang="js">// horizon: 지평선의 화면 y좌표
// h: 카메라 높이,  f: 초점거리(줌)
distance = h * f / (y - horizon);
// y가 horizon 바로 아래 → 분모↓ → 거리 무한대 (아득히 멀다)
// y가 화면 바닥      → 분모↑ → 거리 최소 (발밑)
scale(y) = distance / f;   // 이 줄의 Mode 7 축소율</pre>
<p>분수 하나입니다. 이 <b>scale(y) 224개</b>를 계산해 HDMA 표에 넣고 M7A·M7D에 배달시키면 PPU가 알아서 "누운 평면"을 그립니다.</p>`},
{t:'scale(y) 곡선 관찰',k:'LIVE: CURVE',h:`
<div class="demoWrap"><div class="dTitle">PER-SCANLINE SCALE CURVE = HDMA TABLE</div>
<canvas class="demo" data-demo="curve" width="560" height="260"></canvas>
<div class="ctl">
<label>카메라 높이 <input type="range" data-p="h" min="8" max="120" value="32"> <span class="val" data-p="hV"></span></label>
<label>지평선 <input type="range" data-p="hor" min="20" max="120" value="60"></label>
</div>
</div>
<p>곡선이 곧 HDMA 테이블의 내용입니다. 카메라를 높이면 곡선이 완만해지고(부감), 낮추면 지평선 근처가 격렬해집니다(노면 시점). 오른쪽 미리보기가 실시간으로 반응합니다.</p>`},
{t:'평면 렌더링 — 달리는 바닥',k:'LIVE: FLAT PLANE',h:`
<div class="demoWrap"><div class="dTitle">SCANLINE-SCALED MODE 7 PLANE</div>
<canvas class="demo" data-demo="persp" width="256" height="176"></canvas>
<div class="ctl">
<label>카메라 높이 <input type="range" data-p="h" min="10" max="90" value="28"></label>
<label>속도 <input type="range" data-p="spd" min="0" max="60" value="24"></label>
</div>
</div>
<p>체커 무늬 평면 + 줄별 축소율, 그리고 매 프레임 카메라 전진. 벌써 "달리는 느낌"이 납니다. 폴리곤 0개, 텍스처 한 장.</p>`},
{t:'조향 추가 — 회전과 원근의 합체',k:'STEERING',h:`
<p>여기에 4장의 회전을 합칩니다. 각 스캔라인에서:</p>
<ol>
<li>거리 d = h·f/(y−horizon) — 이 줄이 보는 <b>깊이</b></li>
<li>카메라 각도 θ로 <b>전방 벡터</b>(sinθ, cosθ)와 <b>우측 벡터</b> 계산</li>
<li>텍스처 시작점 = 카메라 위치 + 전방×d, 가로 진행 = 우측×(d/화면폭)</li>
</ol>
<pre class="code" data-lang="js">const d = h*f/(sy-horizon);
let u = camX + Math.sin(a)*d - Math.cos(a)*d*0.5*k;
let v = camY + Math.cos(a)*d + Math.sin(a)*d*0.5*k;
const du =  Math.cos(a)*d*k/W;   // 한 픽셀 옆 = 우측벡터
const dv = -Math.sin(a)*d*k/W;
for(let sx=0; sx&lt;W; sx++){ put(tex(u,v)); u+=du; v+=dv; }</pre>
<p>실기에서는 이 u·v·du·dv가 곧 HDMA로 배달되는 M7 레지스터 값들입니다.</p>`},
{t:'드라이빙 데모 — 직접 운전하세요',k:'LIVE: DRIVE!',h:`
<div class="demoWrap"><div class="dTitle">PSEUDO 3D DRIVING — ← → 키 또는 버튼</div>
<canvas class="demo" data-demo="driving" width="256" height="176"></canvas>
<div class="padBtns">
<button data-p="L">◀</button><button data-p="A">가속</button><button data-p="R">▶</button>
</div>
</div>
<p>키보드 <kbd>←</kbd><kbd>→</kbd>(조향) <kbd>↑</kbd>(가속)도 됩니다. 지금 화면에서 일어나는 일: <em>매 스캔라인마다 다른 거리의 트랙 텍스처를 한 줄씩 샘플링</em>. 1990년 F-Zero 화면 구성 그대로입니다.</p>`},
{t:'JS 전체 루프 — 60줄의 유사 3D',k:'JS CODE',h:`
<span class="codeLabel">JavaScript — 데모의 실제 핵심부</span>
<pre class="code" data-lang="js">function renderPlane(px, tex, cam){
  let i = horizon*W;                 // 지평선 위는 하늘
  for(let sy=horizon+1; sy&lt;H; sy++){
    const d  = cam.h*FOCAL/(sy-horizon); // ① 이 줄의 거리
    const sn = Math.sin(cam.a), cs = Math.cos(cam.a);
    const du = cs*d*SPAN/W, dv = -sn*d*SPAN/W;
    let u = cam.x + sn*d - du*(W/2);     // ② 줄 왼쪽 끝
    let v = cam.y + cs*d - dv*(W/2);
    const fog = Math.min(1, 3/d*cam.h);  // ③ 원거리 어둡게
    for(let sx=0; sx&lt;W; sx++){
      px[i++] = shade(tex[(v&255)*256|(u&255)], fog);
      u += du; v += dv;                  // ④ 증분 전진
    }
  }
}</pre>
<p>안개(③)는 SNES라면 컬러 수학+HDMA로 내는 효과 — 6장에서 다룹니다.</p>`},
{t:'실기에선 — HDMA가 행렬을 배달',k:'ASM VIEW',h:`
<span class="codeLabel">65816 — 프레임 준비 (V-Blank)</span>
<pre class="code" data-lang="asm">; 게임 로직: 각도/높이 변할 때만 표 재계산
BuildM7Table:
  ldx #0
Loop:
  ; scale = h*f/(y-horizon)  ← 나눗셈은 표로!
  lda RecipTbl,x   ; 1/(y-horizon) 미리 계산됨
  ; × h → M7A값,  회전 성분 곱해 M7B/C/D값
  sta M7ATable,x
  inx
  cpx #224
  bne Loop
  rts
; 이후엔 HDMA 채널이 매 줄 $211B~$211E에 자동 기록</pre>
<p>나눗셈조차 <b>역수 테이블</b>로 대체 — 이 시대 최적화의 정수입니다. CPU는 프레임당 표 하나 채우고 끝. 배달은 하드웨어 몫.</p>`},
{t:'F-Zero (1990) — 론칭 타이틀의 충격',k:'CASE: F-ZERO',h:`
<ul class="b">
<li>본체와 <b>동시 발매</b> — Mode 7 + HDMA 시연 그 자체가 기획</li>
<li>초당 60프레임 유지 — 트랙은 <em>완전한 평면</em>이라 가능했던 속도감</li>
<li>머신 기울임은 <b>스프라이트 교체</b>(좌/우 기울인 그림), 라이벌 머신도 거리별 크기의 스프라이트</li>
<li>트랙 밖 자기장 벽, 대시존 — 전부 128×128 타일맵 위의 <em>타일</em></li>
</ul>
<div class="note">아케이드에서 수백만 엔짜리 기판이 하던 체감 레이싱을 가정용 2만 5천 엔 기기가 해냈습니다. "비디오 모드가 장르를 이식 가능하게 만든" 역사적 순간.</div>`},
{t:'슈퍼 마리오 카트 (1992) — 2인 분할의 묘수',k:'CASE: MARIO KART',h:`
<ul class="b">
<li>화면을 <b>상하 분할</b> — 각 절반마다 별도의 Mode 7 시점! 프레임 중간에 행렬 셋을 통째로 교체</li>
<li>카트는 <b>각도별 사전 렌더 스프라이트</b>(회전 불가 한계의 우회)</li>
<li>카트리지에 <b>DSP-1 보조 칩</b> — 3D 좌표 변환·거리 계산을 위탁</li>
<li>코스 기믹(점프대, 물웅덩이)은 전부 타일 속성 — 지도가 곧 게임 데이터</li>
</ul>
<p>1인 플레이에서도 아래 절반은 백미러/지도 — 하드웨어 관점에선 언제나 "Mode 7 화면 두 개"였습니다.</p>`},
{t:'파일럿윙스 (1990) — 높이의 착시',k:'CASE: PILOTWINGS',h:`
<ul class="b">
<li>평면 지도 위 <b>고도</b>가 게임의 전부인 스카이스포츠 — 평면밖에 없는 Mode 7로?</li>
<li>답: 카메라 높이 h와 지평선을 <b>연속 조작</b> — 급강하 시 h↓·scale 곡선 급변 = 낙하감</li>
<li>DSP-1이 투영 계산 보조, 활주로 접근은 지금 봐도 그럴듯한 <em>가짜 3D 착륙</em></li>
</ul>
<div class="note blue">같은 수학(h·f/(y−horizon))에서 h를 흔들면 비행이, θ를 흔들면 드리프트가 나옵니다. <em>파라미터가 곧 장르</em> — 유사 3D 설계의 재미있는 특징.</div>`},
]});

CH({
icon:'🪄', title:'반투명·창·모자이크 — <span class="em">연출 도구상자</span>',
desc:'모드와 직교하는 PPU의 특수효과들. 컬러 수학, 윈도우 마스킹, 모자이크, 스캔라인 왜곡 — 2.5D 화면에 밀도를 더하는 마무리 도구들입니다.',
slides:[
{t:'컬러 수학 — 하드웨어 반투명',k:'COLOR MATH',h:`
<p>PPU는 화면을 <b>메인 스크린과 서브 스크린</b> 두 벌로 합성한 뒤, 픽셀 단위로 두 결과를 <em>더하거나 뺄</em> 수 있습니다. <span class="reg">$2131 CGADSUB</span>.</p>
<div class="tblWrap"><table class="tbl">
<tr><th>연산</th><th>결과</th><th>대표 연출</th></tr>
<tr><td>가산</td><td>밝아짐</td><td>빛, 폭발 섬광, 유령</td></tr>
<tr><td>가산+½</td><td>평균 = 반투명</td><td>물, 유리, 안개</td></tr>
<tr><td>감산</td><td>어두워짐</td><td>그림자, 어둠, 저주</td></tr>
</table></div>
<p>알파 채널이 없는 시대에 <b>레이어 단위 블렌딩</b>을 하드웨어로 제공한 것. 레이어 조합마다 켜고 끌 수 있습니다.</p>`},
{t:'반투명을 눈으로',k:'LIVE',h:`
<div class="demoWrap"><div class="dTitle">COLOR MATH: MAIN ⊕ SUB SCREEN</div>
<canvas class="demo" data-demo="colormath" width="512" height="240"></canvas>
<div class="ctl">
<button data-p="mAdd" class="on">가산</button>
<button data-p="mAvg">가산 ½ (반투명)</button>
<button data-p="mSub">감산</button>
</div>
</div>
<p>떠다니는 구름층이 서브 스크린, 풍경이 메인 스크린입니다. 연산 하나 바꾸면 유령 구름(가산) ↔ 물안개(평균) ↔ 먹구름 그림자(감산)로 성격이 바뀝니다.</p>`},
{t:'컬러 수학 실전 응용',k:'RECIPES',h:`
<ul class="b">
<li><b>젤다 신들의 트라이포스</b> — 비 오는 오프닝: 화면 전체 감산 + 번개 순간 가산</li>
<li><b>슈퍼 메트로이드</b> — 열기·산성 지대의 공기 왜곡감: 가산층 + 다음에 배울 스캔라인 왜곡</li>
<li><b>FF6</b> — 마법 이펙트 대부분이 가산 스프라이트</li>
<li>동굴의 <b>횃불 광원</b>: 어두운 감산 화면 위에 윈도우로 구멍 — 바로 다음 슬라이드</li>
</ul>`},
{t:'윈도우 — 픽셀 마스크 두 장',k:'WINDOW',h:`
<p>PPU에는 <b>창(Window) 2개</b>가 있습니다. 스캔라인 위의 [왼쪽 끝, 오른쪽 끝] 구간 — 그 안(또는 밖)에서만 레이어를 보이게 하는 마스크입니다.</p>
<ul class="b">
<li>구간은 <span class="reg">$2126~$2129</span>에 좌우 경계로 지정</li>
<li>레이어별로 창 적용 여부·AND/OR/XOR 결합 선택</li>
<li>가로 구간뿐이지만… <b>HDMA로 매 줄 경계를 바꾸면</b> 임의의 도형이 됩니다!</li>
</ul>
<p>줄마다 폭이 다른 구간의 세로 나열 = 원, 하트, 열쇠구멍. HDMA와 만나 <em>모양 없는 하드웨어가 모양을 얻는</em> 순간입니다.</p>`},
{t:'스포트라이트 데모',k:'LIVE',h:`
<div class="demoWrap"><div class="dTitle">WINDOW + HDMA = CIRCLE MASK</div>
<canvas class="demo" data-demo="windowfx" width="512" height="240"></canvas>
<div class="ctl">
<label>반지름 <input type="range" data-p="rad" min="20" max="110" value="60"></label>
<button data-p="inv">안/밖 반전</button>
</div>
</div>
<p>어둠 속 동그란 시야 — 젤다의 어두운 방, 보스 등장 아이리스 인/아웃, 마리오의 스타트 서클. 원의 정체는 <em>224개의 [왼쪽,오른쪽] 쌍</em>입니다.</p>`},
{t:'모자이크 — $2106',k:'MOSAIC',h:`
<p><span class="reg">$2106</span>에 크기를 쓰면 배경이 <b>N×N 블록</b>으로 뭉개집니다. 1(원본)~16단계, 레이어별 선택.</p>
<div class="demoWrap"><div class="dTitle">MOSAIC REGISTER SWEEP</div>
<canvas class="demo" data-demo="mosaic" width="512" height="240"></canvas>
<div class="ctl">
<label>크기 <input type="range" data-p="mz" min="1" max="16" value="1"> <span class="val" data-p="mzV"></span></label>
<button data-p="animMz">장면전환 재생</button>
</div>
</div>
<p>레벨 시작·사망 시 화면이 자글자글 뭉개지며 전환되는 그 효과 — 프레임마다 값을 1→16으로 올리는 <em>레지스터 스윕 한 줄</em>입니다.</p>`},
{t:'스캔라인 왜곡 — 물결과 아지랑이',k:'WAVY',h:`
<p>HDMA를 <b>가로 스크롤 레지스터</b>에 걸고 사인파 표를 배달하면, 줄마다 배경이 좌우로 어긋나며 화면이 <em>일렁</em>입니다.</p>
<div class="demoWrap"><div class="dTitle">HDMA → BG1HOFS PER SCANLINE</div>
<canvas class="demo" data-demo="wavy" width="512" height="240"></canvas>
<div class="ctl">
<label>진폭 <input type="range" data-p="amp" min="0" max="24" value="8"></label>
<label>주파수 <input type="range" data-p="frq" min="1" max="12" value="4"></label>
</div>
</div>
<p>수중 스테이지, 사막 아지랑이, 마법 발동, 회상 진입 — 90년대의 "화면 일렁임"은 거의 전부 이 기법입니다.</p>`},
{t:'왜곡 코드 — 표 하나가 연출 하나',k:'CODE',h:`
<span class="codeLabel">JavaScript</span>
<pre class="code" data-lang="js">// 매 프레임: 줄별 오프셋 표 갱신 (=HDMA 테이블)
for(let y=0; y&lt;H; y++)
  hofs[y] = Math.sin(y/wavelen + t*speed) * amp;
// 그리기: 줄마다 어긋난 위치에서 복사
for(let y=0; y&lt;H; y++)
  ctx.drawImage(scene, 0,y,W,1,  hofs[y],y,W,1);</pre>
<span class="codeLabel">65816 (개념)</span>
<pre class="code" data-lang="asm">; V-Blank: 사인표에서 224개 값 복사 (인덱스만 전진)
; → HDMA 채널이 $210D(BG1HOFS)에 매 줄 기록
; CPU 비용: 복사 루프 하나. 이펙트는 공짜.</pre>
<p>진폭을 시간에 따라 줄이면 "충격파", 특정 y 구간만 적용하면 "수면 아래만 일렁"이 됩니다. 표가 곧 연출입니다.</p>`},
{t:'지진·워프·회상 — 표 요리법',k:'RECIPES',h:`
<div class="tblWrap"><table class="tbl">
<tr><th>연출</th><th>HDMA 대상</th><th>표 내용</th></tr>
<tr><td>지진</td><td>세로 스크롤</td><td>난수 ±2px, 감쇠</td></tr>
<tr><td>수중</td><td>가로 스크롤</td><td>느린 사인파</td></tr>
<tr><td>아지랑이</td><td>가로 스크롤</td><td>빠르고 얕은 사인파 2개 합</td></tr>
<tr><td>워프 돌입</td><td>가로 스크롤+모자이크</td><td>진폭 점증 + 크기 점증</td></tr>
<tr><td>노을</td><td>배경색</td><td>줄별 그라데이션</td></tr>
<tr><td>광선 차단막</td><td>윈도우 경계</td><td>줄별 [L,R] 도형</td></tr>
</table></div>
<p>FF6의 마법 연출들이 이 조합술의 백과사전입니다. 전용 이펙트 엔진이 아니라 <em>표 굽는 요리법</em>의 축적이었죠.</p>`},
{t:'세상을 돌려라 — 악마성 드라큘라 IV',k:'CASE: ROTATION',h:`
<p>4장의 복선 회수. 스프라이트는 회전할 수 없다 — 그럼 주인공이 도는 연출은?</p>
<div class="big"><span class="hero">캐릭터 대신 방을 돌린다</span></div>
<ul class="b">
<li><b>악마성 드라큘라 IV</b>의 회전하는 방: 배경 전체가 Mode 7로 회전, 심벨트(주인공)는 화면 중앙 고정</li>
<li>거대 회전 톱니·흔들리는 샹들리에 스테이지 — 배경을 회전시키고 <em>중력 방향만 로직으로</em> 반전</li>
<li>플레이어의 뇌는 "내가 도는 것"으로 완벽히 속습니다</li>
</ul>
<div class="note">제약(스프라이트 비회전)이 오히려 더 인상적인 연출(세계가 도는 감각)을 낳은 대표 사례.</div>`},
{t:'Axelay — 원통 행성의 정체',k:'CASE: AXELAY',h:`
<p>코나미 <b>Axelay</b>(1992)의 명물 — 발밑에서 <em>원통처럼 말리며</em> 다가오는 행성 표면. Mode 7이 아닙니다!</p>
<ul class="b">

const N=SLIDES.length;
let cur=0;
const stage=document.getElementById('stage'),barFill=document.getElementById('barFill'),
      cnt=document.getElementById('cnt'),chapLabel=document.getElementById('chapLabel'),
      dotsEl=document.getElementById('dots');

function strip(s){return s.replace(/<[^>]+>/g,'');}

/* 코드 하이라이터 */
const ASM_KW=/\b(lda|sta|ldx|stx|ldy|sty|rep|sep|jsr|rts|inx|iny|dex|dey|inc|dec|cpx|cpy|cmp|bne|beq|bra|jmp|pha|pla|php|plp|lsr|asl|rol|ror|db|dw)\b/gi;
const JS_KW=/\b(const|let|var|for|if|else|function|return|new|of|in|while|break|continue|void|float|vec2|main)\b/g;
function hl(root){
  root.querySelectorAll('pre.code').forEach(function(p){
    if(p.dataset.hlDone)return; p.dataset.hlDone='1';
    let t=p.innerHTML, lang=p.dataset.lang||'js', hold=[];
    function keep(m){hold.push(m);return '@@H'+(hold.length-1)+'@@';}
    if(lang==='asm'){t=t.replace(/;[^\n]*/g,function(m){return keep('<span class="c">'+m+'</span>');});}
    else{t=t.replace(/\/\/[^\n]*/g,function(m){return keep('<span class="c">'+m+'</span>');});
         t=t.replace(/\/\*[\s\S]*?\*\//g,function(m){return keep('<span class="c">'+m+'</span>');});}
    t=t.replace(/(\$[0-9A-Fa-f]+|#\$?[0-9A-Fa-f]+|%[01]{4,}|\b\d+(?:\.\d+)?\b)/g,'<span class="n">$1</span>');
    t=t.replace(lang==='asm'?ASM_KW:JS_KW,'<span class="k">$&</span>');
    t=t.replace(/@@H(\d+)@@/g,function(_,i){return hold[+i];});
    p.innerHTML=t;
  });
}

function render(dir){
  stopDemos();
  const s=SLIDES[cur],ch=CHAPTERS[s.ch];
  barFill.style.width=((cur+1)/N*100)+'%';
  cnt.textContent=(cur+1)+' / '+N;
  chapLabel.textContent='CH.'+(s.ch+1)+'  '+strip(ch.title);
  const el=document.createElement('div');

function renderAffine(u32,W,H,tex,ang,scale,x0,y0){

function drivingCore(cv,wrap,opts){
  const c=ctx2d(cv);
  const W=cv.width,H=cv.height;
  const img=c.createImageData(W,H),u32=new Uint32Array(img.data.buffer);
  const tex=trackTexture();
  const horizon=opts.horizon,cam={x:128,y:200,a:0,h:opts.h};
  let speed=opts.speed0,lean=0;
  const st=opts.interactive?wireDrive(wrap):null;
  const stop=loopDemo(function(t){
    let steer=0;
    if(st){
      if(st.L)steer=-1;if(st.R)steer=1;
      if(st.U)speed=Math.min(3.2,speed+0.05);else speed*=0.975;
    }else{
      steer=Math.sin(t*0.6)*0.7;speed=opts.speed0;
    }
    lean+=(steer-lean)*0.15;
    cam.a+=steer*0.05*(0.35+speed/3.2);
    cam.x+=Math.sin(cam.a)*speed;
    cam.y+=Math.cos(cam.a)*speed;
    const mix=opts.sunset?(Math.sin(t*0.3)+1)/2:0.15;
    renderPlane(u32,W,H,tex,cam,horizon,mix);
    c.putImageData(img,0,0);
    if(opts.kart)drawKart(c,W,H,lean*3);
    if(opts.hud){
      c.fillStyle='rgba(8,8,20,.65)';c.fillRect(4,4,86,24);
      c.fillStyle='#fff';c.font='8px monospace';c.textAlign='left';
      c.fillText('SPEED',8,13);
      c.fillStyle='#333';c.fillRect(8,17,72,6);
      c.fillStyle=speed>2.6?'#e4413f':'#f5b325';
      c.fillRect(8,17,speed/3.2*72,6);
    }
  });
  return function(){stop();if(st)st.cleanup();};
}

  const c=ctx2d(cv);
  const off=document.createElement('canvas');off.width=256;off.height=120;
  const oc=ctx2d(off);
  const base=sceneCanvas().getContext('2d').getImageData(0,0,256,120);
  const main=new Uint32Array(base.data.buffer.slice(0));
  const img=oc.createImageData(256,120),u32=new Uint32Array(img.data.buffer);
  const I=new Uint8Array(256*120);
  for(let y=0;y<120;y++)for(let x=0;x<256;x++){
    let v=(Math.sin(x/19)+Math.sin((x+y)/13)+Math.sin(y/9)+Math.sin(x/37+y/17)+4)/8;
    v=Math.pow(v,2.2);
    I[y*256+x]=(v*195)|0;
  }
  let mode='add';
  [['mAdd','add'],['mAvg','avg'],['mSub','sub']].forEach(function(p2){
    const b=P(wrap,p2[0]);if(!b)return;
    b.onclick=function(){
      mode=p2[1];
      ['mAdd','mAvg','mSub'].forEach(function(n){const x=P(wrap,n);if(x)x.classList.toggle('on',n===p2[0]);});
    };
  });
  return loopDemo(function(t){
    const ox=(t*26)|0;
    let i=0;
    for(let y=0;y<120;y++)for(let x=0;x<256;x++){
      const m=main[i],s=I[y*256+((x+ox)&255)];
      let R=m&255,G=(m>>8)&255,B=(m>>16)&255;
      if(mode==='add'){R=Math.min(255,R+s);G=Math.min(255,G+s);B=Math.min(255,B+s);}
      else if(mode==='avg'){R=(R+s)>>1;G=(G+s)>>1;B=(B+s)>>1;}
      else{R=Math.max(0,R-s);G=Math.max(0,G-s);B=Math.max(0,B-s);}
      u32[i++]=(0xff000000|(B<<16)|(G<<8)|R)>>>0;
    }
    oc.putImageData(img,0,0);
    c.drawImage(off,0,0,256,120,0,0,512,240);
  });

  function scrollableAt(x, y) {

      '.t{flex:1;min-width:0}.t b{display:block;font-weight:700}' +
      '.t s{display:block;text-decoration:none;opacity:.72;font-size:12px;margin-top:2px}' +
      'button{font:inherit;border:0;border-radius:9px;padding:8px 12px;cursor:pointer}' +
      '.go{background:#4fc3f7;color:#06263a;font-weight:700}' +
      '.no{background:transparent;color:#9fb6c9;padding:8px 6px}' +
      '</style>' +
      '<div class="w"><span aria-hidden="true">🔖</span>' +
      '<div class="t"><b>지난번 ' + where + '까지 읽었어요</b><s>' + ago(rec.updated) + ' 저장됨</s></div>' +
      '<button class="go" type="button">이어보기</button>' +
      '<button class="no" type="button" aria-label="닫기">✕</button></div>';
    function close() { if (host.parentNode) host.parentNode.removeChild(host); }
    root.querySelector('.go').onclick = function () { close(); jump(rec); };
    root.querySelector('.no').onclick = close;
    document.body.appendChild(host);
    setTimeout(close, 15000);
  }

  /* 딥링크로 열었으면 안내하지 않는다.
     이때 location.hash는 못 쓴다 — 덱 엔진 대부분이 첫 장을 그리면서
     history.replaceState('#top')로 주소를 먼저 바꿔 놓기 때문에, 이 셸이
     도는 시점에는 늘 해시가 있는 것처럼 보인다(v1이 안내를 못 띄우던 원인).
     그래서 <head>에서 미리 잡아둔 진입 해시를 쓰고, 없으면 내비게이션
     타이밍의 원래 주소를 본다. */
  function openedWithHash() {
    if (typeof window.__deckInitHash === 'string') return window.__deckInitHash.length > 1;
    try {
      var e = performance.getEntriesByType('navigation')[0];
      if (e && e.name) return new URL(e.name).hash.length > 1;
    } catch (x) {}
    return !!location.hash;
  }
  function initHash() {
    if (typeof window.__deckInitHash === 'string' && window.__deckInitHash) return window.__deckInitHash;
    try {
      var e = performance.getEntriesByType('navigation')[0];
      if (e && e.name) return new URL(e.name).hash;
    } catch (x) {}
    return location.hash;
  }

  if (!openedWithHash()) {
    load(FILE).then(function (rec) {
      if (!rec) return;
      var worth = rec.kind === 'slide' ? rec.page > 1 : rec.scrollY > 200;
      if (!worth) return;
      // 덱이 스스로 지난 쪽을 복원해 이미 그 자리라면(주판 암산 교재 등) 굳이 묻지 않는다
      var now = snap();
      if (now.kind === rec.kind && rec.kind === 'slide' && now.page === rec.page) return;
      toast(rec);
    }).catch(function () {});
  } else {
    /* 포털의 🔖 링크처럼 '#s42'로 들어왔는데 엔진이 해시를 안 듣는 덱(한 장씩
       그려내는 6종)은 1쪽에 머문다 — 안내도 안 뜨니 그 쪽으로 옮겨준다. */
    var m = /^#s?(\d+)$/.exec(initHash() || '');
    if (m) setTimeout(function () {
      var v = slides() ? null : vpage();
      if (v && +m[1] >= 1 && +m[1] <= v.total && v.page !== +m[1])
        vjump({ page: +m[1], hash: initHash() });
    }, 250);
  }
})();
</script>
</body>
</html>
