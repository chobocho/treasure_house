<svg class="diag" viewBox="0 0 340 150" role="img" aria-label="캐노니컬 부호 배정 표">
<text x="10" y="16" style="font-size:11px;">길이만 보낸다: a2 b2 c2 d3 e3</text>
<text x="20" y="44" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);">a</text>
<text x="44" y="44" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--muted);">2비트</text>
<text x="100" y="44" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;">00</text>
<text x="20" y="66" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);">b</text>
<text x="44" y="66" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--muted);">2비트</text>
<text x="100" y="66" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;">01</text>
<text x="20" y="88" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);">c</text>
<text x="44" y="88" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--muted);">2비트</text>
<text x="100" y="88" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;">10</text>
<text x="20" y="110" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);">d</text>
<text x="44" y="110" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--muted);">3비트</text>
<text x="100" y="110" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;">110</text>
<text x="20" y="132" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);">e</text>
<text x="44" y="132" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--muted);">3비트</text>
<text x="100" y="132" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;">111</text>
<text x="150" y="54" style="font-size:11px;">값을 하나씩 올리다가,</text>
<text x="150" y="70" style="font-size:11px;">길이가 늘면 왼쪽으로</text>
<text x="150" y="86" style="font-size:11px;">한 칸 민다. 그것뿐이다.</text>
<text x="150" y="110" style="font-size:11px;">그래서 부호표를 보낼 때</text>
<text x="150" y="126" style="font-size:11px;fill:var(--special);">길이 목록이면 족하다.</text>
</svg>
