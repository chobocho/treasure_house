<svg class="diag" viewBox="0 0 340 170" role="img" aria-label="rANS 상태 변화">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text x="10" y="16" style="font-size:11px;">빈도 A:3 B:1 (합 4) · x 가 자라는 모습</text>
<text x="16" y="56" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;">x=16</text>
<text x="96" y="56" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;">x=21</text>
<path d="M46,38 L90,38" class="arw"/>
<text x="64" y="32" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);" text-anchor="middle">A</text>
<text x="176" y="56" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;">x=28</text>
<path d="M126,38 L170,38" class="arw"/>
<text x="144" y="32" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);" text-anchor="middle">A</text>
<text x="256" y="56" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;">x=115</text>
<path d="M206,38 L250,38" class="arw"/>
<text x="224" y="32" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);" text-anchor="middle">B</text>
<text x="10" y="88" style="font-size:11px;">드문 기호일수록 x 가 크게 뛴다. 그 뜀이</text>
<text x="10" y="104" style="font-size:11px;">곧 비트를 더 썼다는 뜻이다.</text>
<text x="10" y="128" style="font-size:11px;">푸는 쪽은 거꾸로 간다. 그래서 rANS 는</text>
<text x="10" y="144" style="font-size:11px;fill:var(--special);">넣은 순서의 반대로 읽는다 (SPEC §13.3).</text>
