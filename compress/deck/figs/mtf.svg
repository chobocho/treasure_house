<svg class="diag" viewBox="0 0 340 150" role="img" aria-label="MTF 표가 움직이는 모습">
<text x="10" y="16" style="font-size:11px;">입력 bbaac · 표 시작 abcd</text>
<text x="14" y="42" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);">b</text>
<text x="34" y="42" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;">abcd</text>
<text x="110" y="42" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--text);">→ 1</text>
<text x="14" y="64" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);">b</text>
<text x="34" y="64" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;">bacd</text>
<text x="110" y="64" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--ok);">→ 0</text>
<text x="14" y="86" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);">a</text>
<text x="34" y="86" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;">bacd</text>
<text x="110" y="86" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--text);">→ 1</text>
<text x="14" y="108" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);">a</text>
<text x="34" y="108" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;">abcd</text>
<text x="110" y="108" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--ok);">→ 0</text>
<text x="14" y="130" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);">c</text>
<text x="34" y="130" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;">abcd</text>
<text x="110" y="130" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--text);">→ 2</text>
<text x="160" y="46" style="font-size:11px;">두 번째 b 는 0 이 된다 —</text>
<text x="160" y="62" style="font-size:11px;">방금 앞으로 옮겨졌기 때문이다.</text>
<text x="160" y="86" style="font-size:11px;">값 자체는 안 줄어든다. 줄어드는</text>
<text x="160" y="102" style="font-size:11px;">것은 분포다 — 0 이 몰리면</text>
<text x="160" y="118" style="font-size:11px;">뒤의 엔트로피 부호기가 먹는다.</text>
</svg>
