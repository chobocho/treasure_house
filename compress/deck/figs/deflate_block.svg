<svg class="diag" viewBox="0 0 340 210" role="img" aria-label="DEFLATE 블록 세 종류의 머리">
<text x="10" y="16" style="font-size:11px;">블록 머리 3비트</text>
<rect x="14" y="26" width="40" height="26" class="box"/>
<text x="34" y="43" style="font-family:ui-monospace,DeckMono,monospace;font-size:10px;" text-anchor="middle">FIN</text>
<rect x="58" y="26" width="54" height="26" class="box"/>
<text x="85" y="43" style="font-family:ui-monospace,DeckMono,monospace;font-size:10px;" text-anchor="middle">TYPE</text>
<rect x="116" y="26" width="224" height="26" class="box off"/>
<text x="228" y="43" style="font-family:ui-monospace,DeckMono,monospace;font-size:10px;fill:var(--muted);" text-anchor="middle">블록 내용</text>
<text x="14" y="88" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--muted);">00 저장</text>
<text x="90" y="88" style="font-size:11px;">길이를 경계에 맞춰 그대로</text>
<text x="14" y="118" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--ok);">01 고정</text>
<text x="90" y="118" style="font-size:11px;">표를 안 보낸다 — 규격이 정했다</text>
<text x="14" y="148" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--special);">10 동적</text>
<text x="90" y="148" style="font-size:11px;">표를 먼저 보낸다 (부호길이의 부호)</text>
<text x="10" y="182" style="font-size:11px;">세 번째 종류가 gzip 의 거의 전부다. 표를 보내는</text>
<text x="10" y="198" style="font-size:11px;">값보다 그 표로 아끼는 값이 크기 때문이다.</text>
</svg>
