<svg class="diag" viewBox="0 0 340 130" role="img" aria-label="지그재그 사상 표">
<text x="8" y="30" class="lbl">값</text>
<text x="8" y="60" class="lbl">zig</text>
<text x="60" y="30" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;" text-anchor="middle">0</text>
<text x="60" y="60" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);" text-anchor="middle">0</text>
<line x1="60" y1="36" x2="60" y2="48" stroke="var(--border)" stroke-width="1"/>
<text x="100" y="30" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;" text-anchor="middle">-1</text>
<text x="100" y="60" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);" text-anchor="middle">1</text>
<line x1="100" y1="36" x2="100" y2="48" stroke="var(--border)" stroke-width="1"/>
<text x="140" y="30" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;" text-anchor="middle">1</text>
<text x="140" y="60" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);" text-anchor="middle">2</text>
<line x1="140" y1="36" x2="140" y2="48" stroke="var(--border)" stroke-width="1"/>
<text x="180" y="30" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;" text-anchor="middle">-2</text>
<text x="180" y="60" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);" text-anchor="middle">3</text>
<line x1="180" y1="36" x2="180" y2="48" stroke="var(--border)" stroke-width="1"/>
<text x="220" y="30" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;" text-anchor="middle">2</text>
<text x="220" y="60" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);" text-anchor="middle">4</text>
<line x1="220" y1="36" x2="220" y2="48" stroke="var(--border)" stroke-width="1"/>
<text x="260" y="30" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;" text-anchor="middle">-3</text>
<text x="260" y="60" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);" text-anchor="middle">5</text>
<line x1="260" y1="36" x2="260" y2="48" stroke="var(--border)" stroke-width="1"/>
<text x="300" y="30" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;" text-anchor="middle">3</text>
<text x="300" y="60" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);" text-anchor="middle">6</text>
<line x1="300" y1="36" x2="300" y2="48" stroke="var(--border)" stroke-width="1"/>
<text x="10" y="88" style="font-size:11px;">음수는 홀수, 양수는 짝수로 간다. 0 근처의 수가</text>
<text x="10" y="104" style="font-size:11px;">0 근처에 남으므로 varint 한 바이트로 끝난다.</text>
<text x="10" y="120" style="font-size:11px;fill:var(--bad);">-1 을 그냥 실으면 10바이트다 (SPEC §2.2).</text>
