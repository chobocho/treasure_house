<svg class="diag" viewBox="0 0 340 170" role="img" aria-label="gzip 멤버의 자리">
<rect x="10" y="34" width="31" height="30" class="box"/>
<text x="25.5" y="53" style="font-family:ui-monospace,DeckMono,monospace;font-size:9px;" text-anchor="middle">1f 8b</text>
<text x="25.5" y="78" style="font-family:ui-monospace,DeckMono,monospace;font-size:8px;fill:var(--muted);" text-anchor="middle">magic</text>
<rect x="44" y="34" width="17" height="30" class="box"/>
<text x="52.5" y="53" style="font-family:ui-monospace,DeckMono,monospace;font-size:9px;" text-anchor="middle">08</text>
<text x="52.5" y="78" style="font-family:ui-monospace,DeckMono,monospace;font-size:8px;fill:var(--muted);" text-anchor="middle">CM</text>
<rect x="64" y="34" width="17" height="30" class="box"/>
<text x="72.5" y="53" style="font-family:ui-monospace,DeckMono,monospace;font-size:9px;" text-anchor="middle">00</text>
<text x="72.5" y="78" style="font-family:ui-monospace,DeckMono,monospace;font-size:8px;fill:var(--muted);" text-anchor="middle">FLG</text>
<rect x="84" y="34" width="59" height="30" class="box"/>
<rect x="84" y="34" width="59" height="30" rx="2" fill="var(--bad)" fill-opacity="0.12"/>
<text x="113.5" y="53" style="font-family:ui-monospace,DeckMono,monospace;font-size:9px;fill:var(--bad);" text-anchor="middle">00000000</text>
<text x="113.5" y="78" style="font-family:ui-monospace,DeckMono,monospace;font-size:8px;fill:var(--muted);" text-anchor="middle">MTIME</text>
<rect x="146" y="34" width="17" height="30" class="box"/>
<text x="154.5" y="53" style="font-family:ui-monospace,DeckMono,monospace;font-size:9px;" text-anchor="middle">00</text>
<text x="154.5" y="78" style="font-family:ui-monospace,DeckMono,monospace;font-size:8px;fill:var(--muted);" text-anchor="middle">XFL</text>
<rect x="166" y="34" width="17" height="30" class="box"/>
<text x="174.5" y="53" style="font-family:ui-monospace,DeckMono,monospace;font-size:9px;" text-anchor="middle">03</text>
<text x="174.5" y="78" style="font-family:ui-monospace,DeckMono,monospace;font-size:8px;fill:var(--muted);" text-anchor="middle">OS</text>
<rect x="186" y="34" width="67" height="30" class="box"/>
<text x="219.5" y="53" style="font-family:ui-monospace,DeckMono,monospace;font-size:9px;" text-anchor="middle">deflate…</text>
<text x="219.5" y="78" style="font-family:ui-monospace,DeckMono,monospace;font-size:8px;fill:var(--muted);" text-anchor="middle">본문</text>
<rect x="256" y="34" width="39" height="30" class="box"/>
<text x="275.5" y="53" style="font-family:ui-monospace,DeckMono,monospace;font-size:9px;" text-anchor="middle">CRC32</text>
<rect x="298" y="34" width="39" height="30" class="box"/>
<text x="317.5" y="53" style="font-family:ui-monospace,DeckMono,monospace;font-size:9px;" text-anchor="middle">ISIZE</text>
<text x="10" y="108" style="font-size:11px;">MTIME 을 넣으면 같은 입력이 다른 파일이</text>
<text x="10" y="124" style="font-size:11px;">된다. 그러면 골든 벡터를 만들 수 없다 — 그래서</text>
<text x="10" y="140" style="font-size:11px;fill:var(--special);">이 책의 gzip 은 시각을 0 으로 못 박는다.</text>
<text x="10" y="160" class="lbl">주고받은 기록은 out/interop_deflate.txt</text>
</svg>
