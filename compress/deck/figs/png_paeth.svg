<svg class="diag" viewBox="0 0 340 180" role="img" aria-label="Paeth 예측기의 이웃">
<rect x="96" y="26" width="50" height="36" class="box"/>
<text x="121" y="49" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--muted);" text-anchor="middle">c</text>
<rect x="150" y="26" width="50" height="36" class="box"/>
<text x="175" y="49" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--muted);" text-anchor="middle">b</text>
<rect x="96" y="66" width="50" height="36" class="box"/>
<text x="121" y="89" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--muted);" text-anchor="middle">a</text>
<rect x="150" y="66" width="50" height="36" class="box"/>
<text x="175" y="89" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--special);" text-anchor="middle">x</text>
<text x="220" y="46" style="font-size:11px;">c  왼쪽 위</text>
<text x="220" y="62" style="font-size:11px;">b  위</text>
<text x="220" y="86" style="font-size:11px;">a  왼쪽</text>
<text x="220" y="102" style="font-size:11px;fill:var(--special);">x  지금 칸</text>
<text x="10" y="140" style="font-size:11px;">paeth(a=10, b=20, c=15) = 15</text>
<text x="10" y="156" style="font-size:11px;">p = a+b-c = 15 이고, 가장 가까운 것이 c 다.</text>
<text x="10" y="172" class="lbl">동점 규칙을 안 맞추면 다섯 언어가 갈린다.</text>
</svg>
