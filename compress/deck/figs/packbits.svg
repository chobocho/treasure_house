<svg class="diag" viewBox="0 0 340 170" role="img" aria-label="PackBits 토큰 두 종류">
<rect x="14" y="24" width="150" height="30" class="box"/>
<line x1="60" y1="24" x2="60" y2="54" stroke="var(--border)" stroke-width="1"/>
<text x="37" y="43" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--special);" text-anchor="middle">0xFE</text>
<text x="112" y="43" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;" text-anchor="middle">'A'</text>
<text x="14" y="70" style="font-size:11px;">런: 257 - 3 = 254</text>
<text x="14" y="86" class="lbl">128 보다 크면 런 (되풀이는 최소 3)</text>
<rect x="190" y="24" width="150" height="30" class="box"/>
<line x1="226" y1="24" x2="226" y2="54" stroke="var(--border)" stroke-width="1"/>
<text x="208" y="43" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--accent);" text-anchor="middle">0x02</text>
<text x="283" y="43" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;" text-anchor="middle">'a' 'b' 'c'</text>
<text x="190" y="70" style="font-size:11px;">리터럴: 3 - 1 = 2</text>
<text x="190" y="86" class="lbl">128 보다 작으면 그대로 싣기</text>
<text x="14" y="116" style="font-size:11px;">머리 하나로 두 가지를 가르는 것이 요점이다.</text>
<text x="14" y="132" style="font-size:11px;">따로 깃발 비트를 두면 리터럴마다 붙어</text>
<text x="14" y="148" style="font-size:11px;">늘어나는 입력에서 손해를 본다.</text>
<text x="14" y="166" class="lbl">제어 128 은 안 쓴다 — 한 입력에 답이 둘이 된다</text>
</svg>
