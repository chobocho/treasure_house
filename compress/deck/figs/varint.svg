<svg class="diag" viewBox="0 0 340 150" role="img" aria-label="LEB128 로 300 을 싣는 그림">
<text x="10" y="16" style="font-size:11px;">값 300 = 0b100101100</text>
<rect x="14" y="30" width="150" height="34" class="box"/>
<line x1="36" y1="30" x2="36" y2="64" stroke="var(--border)" stroke-width="1"/>
<text x="25" y="50" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--special);" text-anchor="middle">1</text>
<text x="100" y="50" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;" text-anchor="middle">0101100</text>
<text x="89" y="78" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--muted);" text-anchor="middle">0xAC</text>
<rect x="176" y="30" width="150" height="34" class="box"/>
<line x1="198" y1="30" x2="198" y2="64" stroke="var(--border)" stroke-width="1"/>
<text x="187" y="50" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--muted);" text-anchor="middle">0</text>
<text x="262" y="50" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;" text-anchor="middle">0000010</text>
<text x="251" y="78" style="font-family:ui-monospace,DeckMono,monospace;font-size:11px;fill:var(--muted);" text-anchor="middle">0x02</text>
<text x="10" y="104" style="font-size:11px;">앞 비트 1 = 뒤에 더 있다, 0 = 여기까지.</text>
<text x="10" y="120" style="font-size:11px;">낮은 자리를 먼저 싣는다 — 그래야 읽는 쪽이</text>
<text x="10" y="136" style="font-size:11px;">자리올림을 하며 한 번에 훑을 수 있다.</text>
</svg>
