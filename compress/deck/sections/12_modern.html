<p class="chnum">12부</p>
<h2>현대 포맷</h2>
<p class="chsub">LZ4·LZMA/xz·zstd·brotli 의 설계 결정</p>
<h4>이 부에서 다루는 것</h4>
<ul>
<li>LZ4 — 엔트로피 부호를 아예 안 쓰는 선택</li>
<li>LZMA — 레인지 코더 + 문맥 있는 리터럴 + rep 거리</li>
<li>zstd — FSE 와 반복 오프셋과 사전</li>
<li>brotli — 정적 사전이라는 반칙 같은 수</li>
<li>같은 파일을 여섯 도구로 — 비율과 속도의 지도</li>
</ul>
<p class="cap">준비 중입니다 — PLAN.md §5 10단계에서 이 부를 채운다.</p>
</article>
