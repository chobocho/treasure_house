<h2>정보이론 기초</h2>
<p class="chsub">엔트로피·크래프트 부등식·압축의 한계</p>
<h4>이 부에서 다루는 것</h4>
<ul>
<li>정보량과 엔트로피 — "놀라움"을 비트로 재기</li>
<li>크래프트 부등식 — 접두 부호가 존재할 조건</li>
<li>섀넌의 한계 — 평균 부호 길이는 엔트로피보다 짧아질 수 없다</li>
<li>왜 무손실 만능 압축기는 없나 — 비둘기집 증명</li>
<li>코퍼스 파일마다 실제 엔트로피 재 보기</li>
</ul>
<p class="cap">준비 중입니다 — PLAN.md §5 10단계에서 이 부를 채운다.</p>
</article>
