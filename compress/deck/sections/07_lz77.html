<h2>LZ77 계열</h2>
<p class="chsub">LZSS·해시 체인·게으른 매칭·창 크기의 의미</p>
<h4>이 부에서 다루는 것</h4>
<ul>
<li>앞을 가리키는 (거리, 길이) — 사전은 문서 자신이다</li>
<li>LZSS 토큰과 플래그 바이트</li>
<li>3바이트 해시 체인 — 일치를 빨리 찾는 법</li>
<li>가장 긴 것 대 가장 가까운 것 — 동점 규약</li>
<li>32 KiB 창은 왜 32 KiB 인가</li>
</ul>
<p class="cap">준비 중입니다 — PLAN.md §5 10단계에서 이 부를 채운다.</p>
