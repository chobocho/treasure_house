<h2>손실 압축 입문</h2>
<p class="chsub">양자화·DCT·JPEG-lite·PNG 필터·ADPCM</p>
<h4>이 부에서 다루는 것</h4>
<ul>
<li>버려도 되는 것을 정하는 일 — 양자화와 데드존</li>
<li>8×8 DCT 를 정수만으로</li>
<li>JPEG-lite — 지그재그·런길이·허프만까지</li>
<li>PNG 는 손실이 아니다 — 필터 다섯 가지와 zlib</li>
<li>IMA ADPCM — 소리를 4비트로</li>
</ul>
<p class="cap">준비 중입니다 — PLAN.md §5 10단계에서 이 부를 채운다.</p>
