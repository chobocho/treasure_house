<ul>
<li>PackBits 식 바이트 RLE 와 run 상한</li>
<li>0 런 전용 RLE — 왜 따로 두는가</li>
<li>델타 부호화 — 값이 아니라 차이를 적기</li>
<li>MTF(move-to-front) — 최근에 본 것을 앞으로</li>
<li>변환은 왜 그 자체로는 파일을 못 줄이는가</li>
