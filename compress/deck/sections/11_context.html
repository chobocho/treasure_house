<p class="chnum">11부</p>
<h2>문맥 모델링</h2>
<p class="chsub">PPM·CM·로지스틱 믹싱·APM (paq 계보)</p>
<h4>이 부에서 다루는 것</h4>
<ul>
<li>차수(order)란 무엇인가 — 앞 몇 글자를 보는가</li>
<li>PPM 의 escape 문제와 method C</li>
<li>배제(exclusion) — 이미 아니라고 한 기호는 빼기</li>
<li>문맥 혼합 — 예측기 여럿을 로지스틱으로 섞기</li>
<li>APM/SSE 와 paq 계보가 남긴 것</li>
</ul>
<p class="cap">준비 중입니다 — PLAN.md §5 10단계에서 이 부를 채운다.</p>
