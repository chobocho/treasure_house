<p class="chnum">5부</p>
<h2>산술 부호화와 레인지 코더</h2>
<p class="chsub">구간 축소·캐리·적응 모델</p>
<h4>이 부에서 다루는 것</h4>
<ul>
<li>구간을 쪼개 한 실수로 — 기호마다 정수 비트를 안 쓴다</li>
<li>무한 정밀도를 32비트로 — 정규화와 캐리 전파</li>
<li>LZMA 식 레인지 코더 — 11비트 확률, 시프트 5</li>
<li>적응 이진 모델 — 볼 때마다 고치는 확률</li>
<li>허프만과의 비율 차이를 코퍼스에서 재 보기</li>
</ul>
<p class="cap">준비 중입니다 — PLAN.md §5 10단계에서 이 부를 채운다.</p>
</article>
