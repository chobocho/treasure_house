<h2>BWT 와 bzip2</h2>
<p class="chsub">접미사 정렬·LF 매핑·진짜 .bz2 풀기</p>
<h4>이 부에서 다루는 것</h4>
<ul>
<li>회전 정렬 — 같은 글자를 모아 놓는 변환</li>
<li>접미사 배열 O(n log²n) 과 원래 순서 되돌리기(LF 매핑)</li>
<li>BWT 다음에 MTF, 그 다음에 0 런 — 왜 이 순서인가</li>
<li>bzip2 의 다중 허프만 표 고르기</li>
<li>진짜 bzip2 가 만든 .bz2 를 다섯 언어로 풀기</li>
</ul>
<p class="cap">준비 중입니다 — PLAN.md §5 10단계에서 이 부를 채운다.</p>
