<h2>ANS</h2>
<p class="chsub">rANS·tANS·FSE 가 zstd 를 빠르게 만든 방법</p>
<h4>이 부에서 다루는 것</h4>
<ul>
<li>비대칭 수 체계 — 상태 하나에 정보를 쌓는다</li>
<li>rANS 부호화와 복호화가 왜 거꾸로 도는가</li>
<li>바이트 단위 재정규화 — 32비트 상태 유지하기</li>
<li>tANS 표 만들기 — 곱셈 없는 산술 부호화</li>
<li>FSE 와 zstd 의 관계</li>
</ul>
<p class="cap">준비 중입니다 — PLAN.md §5 10단계에서 이 부를 채운다.</p>
