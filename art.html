<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generative Art Test</title>
  <style>
    body {
      margin: 0;
      overflow: hidden; /* 스크롤바 제거 */
      background-color: #000; /* 우주 같은 느낌을 위해 검은 배경 */
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<canvas id="artCanvas"></canvas>

<script>
  const canvas = document.getElementById('artCanvas');
  const ctx = canvas.getContext('2d');

  // 캔버스 크기를 브라우저 창 크기에 맞춤
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    console.log(canvas.width, canvas.height);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas(); // 초기 실행

  // 애니메이션을 위한 시간 변수
  let time = 0;

  /**
   * 리팩토링된 시각화 함수
   * (화면 중앙 정렬을 위해 좌표 계산 부분만 살짝 수정했습니다)
   */
  function drawGenerativeArt(ctx, time) {
    const cos = Math.cos;
    const sin = Math.sin;

    // 화면 중심 좌표 구하기    const centerX = canvas.width / 2;
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    // 1. 화면 초기화 (약간의 투명도를 줘서 잔상 효과를 남김)
    // 검은색 배경(0,0,0)에 투명도 0.1을 덧칠함 -> 꼬리가 길게 남음
    // 완전히 지우려면 opacity를 1로 설정하세요.
    ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. 점 찍기 설정
    let particleCount = 32000;
    let X = particleCount;
    let Y = particleCount;

    while (particleCount > 0) {
      particleCount--;

      // --- 수학적 좌표 계산 ---
      const layerIndex = Math.floor(particleCount / 1024);

      // time 변수를 이용해 계속 움직이게 함
      const angleA = Y + layerIndex;
      const angleB = X + (time / 1000) + (layerIndex * 20); // 속도 조절을 위해 time을 나눔

      const nextX = cos(angleA) + cos(angleB);
      const nextY = sin(angleA) + sin(angleB);

      X = nextX;
      Y = nextY;

      // --- 그리기 ---
      // 색상: 점의 인덱스에 따라 변함
      const hue = Math.floor(particleCount / 16);

      ctx.fillStyle = `hsla(${hue}, 99%, 60%, 1)`;

      // 좌표 변환:
      // X, Y는 대략 -2 ~ +2 사이의 값이므로 200~300배 확대하고
      // 화면 중앙(centerX, centerY)으로 이동시킴
      const scale = 200;
      ctx.fillRect(centerX + X * scale, centerY + Y * scale, 1.5, 1.5);
    }
  }

  // 애니메이션 루프
  function animate() {
    time++; // 시간 증가
    drawGenerativeArt(ctx, time);
    requestAnimationFrame(animate); // 다음 프레임 요청
  }

  // 실행
  animate();
</script>
</body>
</html>
