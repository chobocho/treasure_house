<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- deck-bookmark: 덱 엔진이 replaceState로 주소를 바꾸기 전에 진입 해시를 잡아둔다 -->
<script>window.__deckInitHash=location.hash;</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🖼️ BitBlt 대백과 — 비트 블록 전송의 역사·수학·구현 (330여 슬라이드)</title>
<meta name="description" content="BitBlt(Bit Block Transfer)의 탄생부터 GPU 시대까지 — 기술 발전사, 부울 대수와 래스터 연산의 수학, 실제 구현 기법, 256개 ROP 코드 전체 카탈로그, 라이브 캔버스 데모를 담은 동적 HTML 슬라이드">
<style>
  :root{
    --bg1:#0a1020; --bg2:#101a33; --panel:#131e38; --panel2:#0d1526;
    --ink:#e9eefb; --mut:#9fb2d6; --acc:#4fc3f7; --acc2:#8aa2ff;
    --line:rgba(140,170,225,.28); --line2:rgba(140,170,225,.14);
    --good:#7ce38b; --warn:#ffb454; --pink:#ff7a90; --purple:#e394ff;
    --mint:#94f5d0; --gold:#ffd166; --sky:#7dd3fc;
  }
  *{box-sizing:border-box}
  html{
    font-size:clamp(14px, 0.55vw + 0.55vh + 8px, 21px);
    -webkit-text-size-adjust:100%;
  }
  html{height:100%}
  body{
    margin:0; height:100%; overflow:hidden;
    color:var(--ink);
    background:radial-gradient(1200px 800px at 75% -10%, #1b2c55 0%, transparent 60%),
               radial-gradient(900px 700px at -10% 110%, #14264a 0%, transparent 55%),
               linear-gradient(160deg, var(--bg1), var(--bg2));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    line-height:1.62; word-break:keep-all;
  }
  #deck{display:flex; flex-direction:column; height:100%}
  #bar{height:4px; background:linear-gradient(90deg,var(--acc),var(--acc2)); width:0%; transition:width .25s; flex:none}

  header#top{
    flex:none; display:flex; align-items:center; gap:.7em;
    padding:.45em clamp(.8em,2.5vw,1.6em); border-bottom:1px solid var(--line2);
    background:rgba(10,16,32,.6); backdrop-filter:blur(8px);
  }
  header#top .brand{font-weight:800; letter-spacing:.02em; white-space:nowrap}
  header#top .brand small{color:var(--mut); font-weight:400}
  #secbadge{
    margin-left:auto; font-size:.78em; font-weight:700; padding:.15em .8em;
    border-radius:999px; border:1px solid var(--line); white-space:nowrap;
  }

  #stage{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    padding:clamp(.9em,2vh,1.6em) clamp(.9em,4vw,3em) 5.5em}
  .slide{max-width:1180px; margin:0 auto; animation:fadein .22s ease}
  @keyframes fadein{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

  .slide h1{font-size:clamp(1.35em,1.2em + 1.2vw,2.05em); line-height:1.25; margin:.1em 0 .55em}
  .slide h1 .no{color:var(--mut); font-size:.55em; font-weight:600; vertical-align:.35em; margin-right:.5em}
  .slide h2{font-size:1.18em; margin:1.1em 0 .45em; color:var(--sky)}
  .slide h3{font-size:1.02em; margin:.9em 0 .35em; color:var(--mint)}
  .slide p{margin:.45em 0}
  .slide ul,.slide ol{margin:.4em 0 .7em; padding-left:1.35em}
  .slide li{margin:.3em 0}
  .slide li>ul{margin:.15em 0}
  .slide strong{color:#fff}
  .slide em{color:var(--gold); font-style:normal}
  .slide a{color:var(--acc); text-decoration:none; border-bottom:1px dotted rgba(79,195,247,.5)}
  .slide a:hover{color:#9fe3ff}
  .mut{color:var(--mut)} .small{font-size:.85em}
  code{font-family:"SF Mono",Consolas,"D2Coding","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans Mono","DejaVu Sans Mono",monospace; background:rgba(80,120,200,.16);
       padding:.08em .38em; border-radius:6px; font-size:.9em}
  pre.code{
    background:#0a0f1e; border:1px solid var(--line2); border-radius:12px;
    padding:.9em 1.1em; overflow-x:auto; font-size:.82em; line-height:1.55;
    font-family:"SF Mono",Consolas,"D2Coding","D2Coding","Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans Mono","DejaVu Sans Mono",monospace;
  }
  pre.code code{background:none; padding:0; font-size:1em}
  .cm{color:#6d82ab} .kw{color:#7dd3fc} .st{color:#a5e3a1} .nb{color:#ffd166}

  .fx{
    background:linear-gradient(120deg, rgba(79,195,247,.10), rgba(138,162,255,.08));
    border-left:4px solid var(--acc); border-radius:10px;
    padding:.7em 1em; margin:.7em 0; font-size:1.04em; overflow-x:auto;
  }
  .fx .big{font-size:1.25em}
  .note{
    background:rgba(255,180,84,.08); border-left:4px solid var(--warn);
    border-radius:10px; padding:.6em 1em; margin:.7em 0; font-size:.93em;
  }
  .tip{
    background:rgba(124,227,139,.08); border-left:4px solid var(--good);
    border-radius:10px; padding:.6em 1em; margin:.7em 0; font-size:.93em;
  }

  .cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr)); gap:1.1em; align-items:start}

  .tw{overflow-x:auto; margin:.6em 0}
  table.tbl{border-collapse:collapse; width:100%; font-size:.9em; min-width:480px}
  table.tbl th,table.tbl td{border:1px solid var(--line2); padding:.42em .7em; text-align:left; vertical-align:top}
  table.tbl th{background:rgba(79,195,247,.12); white-space:nowrap}
  table.tbl tr:nth-child(even) td{background:rgba(140,170,225,.05)}
  table.tt{min-width:0; text-align:center; font-family:Consolas,monospace}
  table.tt th,table.tt td{text-align:center; padding:.25em .7em}
  table.tt td.r1{color:var(--good); font-weight:700}
  table.tt td.r0{color:var(--mut)}

  .figrow{display:flex; flex-wrap:wrap; gap:1em; justify-content:center; margin:.8em 0}
  .figrow figure{flex:1 1 250px; max-width:460px}
  figure.ph{margin:.8em auto; text-align:center; max-width:640px}
  figure.ph img{
    max-width:100%; max-height:46vh; border-radius:12px;
    border:1px solid var(--line); background:#dfe6f2; object-fit:contain;
  }
  figure.ph figcaption{font-size:.8em; color:var(--mut); margin-top:.45em; line-height:1.45}
  figure.ph .src{opacity:.75}
  figure.broken img{display:none}
  figure.broken::before{
    content:"🖼️ 이미지를 불러오지 못했습니다 — 오프라인이거나 원본이 이동됨. 캡션 링크로 확인하세요.";
    display:block; padding:1.2em 1em; border:1.5px dashed var(--line);
    border-radius:12px; color:var(--mut); font-size:.85em;
  }

  .timeline{list-style:none; padding-left:0}
  .timeline li{
    margin:.34em 0; padding:.4em .8em .4em 1em; border-left:3px solid var(--acc2);
    background:rgba(138,162,255,.06); border-radius:0 10px 10px 0;
  }
  .timeline .yr{display:inline-block; min-width:4.4em; font-weight:800; color:var(--gold); font-family:Consolas,monospace}

  .links{list-style:none; padding-left:0}
  .links li{margin:.45em 0; padding:.5em .9em; background:var(--panel2);
    border:1px solid var(--line2); border-radius:10px}
  .links li .k{display:inline-block; font-size:.72em; font-weight:700; padding:0 .6em;
    border-radius:6px; margin-right:.6em; vertical-align:.1em}
  .k.doc{background:rgba(79,195,247,.18); color:var(--acc)}
  .k.paper{background:rgba(227,148,255,.18); color:var(--purple)}
  .k.video{background:rgba(255,122,144,.18); color:var(--pink)}
  .k.src{background:rgba(124,227,139,.18); color:var(--good)}
  .k.wiki{background:rgba(255,209,102,.18); color:var(--gold)}

  .demo{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:1em 1.1em; margin:.8em 0}
  .demo .row{display:flex; flex-wrap:wrap; gap:1em; align-items:flex-end; justify-content:center}
  .demo .cell{text-align:center}
  .demo .cell .lb{font-size:.78em; color:var(--mut); margin-top:.3em; font-family:Consolas,monospace}
  .demo canvas{image-rendering:pixelated; border-radius:8px; border:1px solid var(--line); background:#fff; max-width:100%; height:auto; touch-action:pan-y}
  .demo .ctl{display:flex; flex-wrap:wrap; gap:.6em .9em; align-items:center; justify-content:center; margin:.7em 0 .2em}
  .demo .op{font-size:1.4em; color:var(--gold); align-self:center}
  .demo button, .demo select, .demo input[type=number]{
    background:#1b2a4d; color:var(--ink); border:1px solid var(--line);
    border-radius:9px; padding:.42em .95em; font-size:.92em; cursor:pointer; font-family:inherit;
  }
  .demo button:hover{background:#253762}
  .demo button.on{background:var(--acc); color:#04223a; font-weight:700}
  .demo input[type=range]{width:min(280px,60vw); accent-color:var(--acc)}
  .demo .stat{font-family:Consolas,monospace; font-size:.9em; color:var(--mint); text-align:center; margin-top:.4em; min-height:1.3em}

  /* 표지 */
  .cover{text-align:center; padding-top:5vh}
  .cover .mega{
    font-size:clamp(2.3em, 2em + 3vw, 4.2em); font-weight:900; line-height:1.15; margin:.2em 0;
    background:linear-gradient(90deg,var(--acc),#b3e5ff,var(--acc2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .cover .sub{font-size:1.15em; color:var(--mut); max-width:38em; margin:0 auto 1.4em}
  .cover .chips{display:flex; flex-wrap:wrap; gap:.6em; justify-content:center; margin:1.2em 0}
  .cover .chips span{border:1px solid var(--line); border-radius:999px; padding:.3em 1em; font-size:.88em; background:rgba(19,30,56,.7)}

  /* 하단 내비 */
  nav#ctl{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; align-items:center; justify-content:center; gap:.55em;
    padding:.5em max(.8em, env(safe-area-inset-left)) calc(.5em + env(safe-area-inset-bottom));
    background:rgba(9,14,28,.82); backdrop-filter:blur(10px); border-top:1px solid var(--line2);
  }
  nav#ctl button{
    background:#182849; color:var(--ink); border:1px solid var(--line);
    border-radius:11px; min-width:2.9em; min-height:2.55em; font-size:1em; cursor:pointer;
  }
  nav#ctl button:hover{background:#22345e}
  nav#ctl button.wide{padding:0 1.05em}
  #cnt{font-family:Consolas,monospace; font-size:.95em; color:var(--mut); min-width:6.2em; text-align:center}

  /* 목차 오버레이 */
  #toc{
    position:fixed; inset:0; z-index:40; display:none; overflow-y:auto;
    background:rgba(7,11,23,.96); backdrop-filter:blur(10px);
    padding:1.2em clamp(1em,4vw,3em) 3em;
  }
  #toc.open{display:block}
  #toc .tochead{display:flex; align-items:center; gap:1em; flex-wrap:wrap; margin-bottom:1em}
  #toc h2{margin:.2em 0; font-size:1.4em}
  #toc .close{margin-left:auto; font-size:1.1em; background:#182849; color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:.45em 1.1em; cursor:pointer}
  #toc .jump{display:flex; gap:.5em; align-items:center; font-size:.9em; color:var(--mut)}
  #toc .jump input{width:5.5em; background:#101b36; border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:.4em .6em; font-size:1em}
  #toc h3{margin:1.1em 0 .4em; font-size:1.02em}
  #toc .tgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr)); gap:.45em}
  #toc .tgrid button{
    text-align:left; background:var(--panel2); color:var(--ink); border:1px solid var(--line2);
    border-radius:9px; padding:.42em .7em; font-size:.83em; cursor:pointer; line-height:1.4;
    font-family:inherit;
  }
  #toc .tgrid button:hover{border-color:var(--acc); background:#152442}
  #toc .tgrid button .n{color:var(--mut); font-family:Consolas,monospace; margin-right:.5em; font-size:.85em}
  #toc .tgrid button.cur{border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset}

  /* 좁은 화면(폴드 커버·폰) */
  @media (max-width:640px){
    #stage{padding:1em .85em 5.6em}
    nav#ctl button.wide{padding:0 .7em}
    #cnt{min-width:5em; font-size:.85em}
    table.tbl{font-size:.82em}
  }
  /* 정사각형에 가까운 화면(갤럭시 폴드 펼침 등): 좌우 여백을 살짝 늘려 줄길이 확보 */
  @media (min-aspect-ratio:4/5) and (max-aspect-ratio:5/4) and (min-width:700px){
    .slide{max-width:min(1180px, 94vw)}
    figure.ph img{max-height:40vh}
  }
  @media (hover:none){ nav#ctl button:hover{background:#182849} }
</style>
</head>
<body>
<div id="deck">
  <div id="bar"></div>
  <header id="top">
    <span class="brand">🖼️ BitBlt 대백과 <small>— Bit Block Transfer</small></span>
    <span id="secbadge"></span>
  </header>
  <main id="stage" aria-live="polite"></main>
  <nav id="ctl">
    <button id="bFirst" title="처음 (Home)">⏮</button>
    <button id="bPrev" class="wide" title="이전 (←)">◀ 이전</button>
    <span id="cnt">- / -</span>
    <button id="bNext" class="wide" title="다음 (→ / Space)">다음 ▶</button>
    <button id="bLast" title="끝 (End)">⏭</button>
    <button id="bToc" class="wide" title="목차 (T)">📑 목차</button>
  </nav>
</div>

<div id="toc">
  <div class="tochead">
    <h2>📑 전체 목차</h2>
    <div class="jump">
      <label for="jumpN">번호 이동:</label>
      <input id="jumpN" type="number" min="1" inputmode="numeric">
      <button class="close" id="jumpGo" style="margin-left:0;padding:.4em .8em">이동</button>
    </div>
    <button class="close" id="tocClose">✕ 닫기 (Esc)</button>
  </div>
  <div id="tocBody"></div>
</div>

<script>
'use strict';
/* ============================================================
 * BitBlt 대백과 — 동적 슬라이드 덱
 * 슬라이드는 아래 S 배열 + 자동 생성 ROP 카탈로그(0x00~0xFF)로 구성.
 * ============================================================ */

/* ---------- 섹션 정의(배지 색) ---------- */
var SECS = {
  '표지':'#4fc3f7', '개념':'#7ce38b', '역사':'#ffb454', '수학':'#e394ff',
  '구현':'#ff7a90', 'API':'#7dd3fc', '데모':'#ffd166', '자료':'#94f5d0',
  'ROP 카탈로그':'#8aa2ff', '마무리':'#4fc3f7'
};

/* ---------- 헬퍼 ---------- */
var FP = 'https://commons.wikimedia.org/wiki/Special:FilePath/';
var FILE = 'https://commons.wikimedia.org/wiki/File:';
function fig(name, cap, wpx){
  var u = FP + encodeURIComponent(name) + '?width=' + (wpx || 800);
  var p = FILE + encodeURIComponent(name);
  return '<figure class="ph"><a href="' + p + '" target="_blank" rel="noopener">' +
    '<img loading="lazy" src="' + u + '" alt="' + cap.replace(/"/g,'&quot;') + '"' +
    ' onerror="this.closest(\'figure\').classList.add(\'broken\')"></a>' +
    '<figcaption>' + cap + ' <span class="src">— <a href="' + p + '" target="_blank" rel="noopener">Wikimedia Commons</a></span></figcaption></figure>';
}
function figrow(){ return '<div class="figrow">' + Array.prototype.join.call(arguments,'') + '</div>'; }
function lk(u, t){ return '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>'; }
function li(kind, u, t, d){
  return '<li><span class="k ' + kind + '">' + kind.toUpperCase() + '</span>' +
         lk(u, t) + (d ? ' <span class="mut small">— ' + d + '</span>' : '') + '</li>';
}

/* ---------- 슬라이드 데이터 ---------- */
var S = [];
function sl(sec, title, html){ S.push({s:sec, t:title, h:html}); }

/* ======================= §0 표지 ======================= */
sl('표지','BitBlt 대백과', `
<div class="cover">
  <div style="font-size:3em">🖼️⚡</div>
  <div class="mega">BitBlt 대백과</div>
  <p class="sub">Bit Block Transfer — 1975년 제록스 PARC에서 태어나
  모든 GUI의 심장이 된 <strong>단 하나의 그래픽 연산</strong>.<br>
  그 역사와 수학적 원리, 그리고 실제 구현을 한 권에 담았습니다.</p>
  <div class="chips">
    <span>📜 50년 기술 발전사</span>
    <span>🧮 부울 대수 &amp; 래스터 연산 수학</span>
    <span>⚙️ C·ASM·SIMD·GPU 구현</span>
    <span>🎛️ 라이브 캔버스 데모 4종</span>
    <span>🗂️ ROP 코드 256개 전체 카탈로그</span>
  </div>
  <p class="mut small">← → 방향키 · 스페이스바 · 화면 스와이프로 넘기세요 · <strong>T</strong> 키로 목차</p>
</div>`);

sl('표지','이 문서 사용법', `
<h1><span class="no">사용법</span>이 문서를 읽는 방법</h1>
<div class="cols">
<div>
  <h2>🎹 조작법</h2>
  <ul>
    <li><strong>→ / Space / PgDn</strong> : 다음 슬라이드</li>
    <li><strong>←</strong> / PgUp : 이전 슬라이드</li>
    <li><strong>Home / End</strong> : 처음 / 끝</li>
    <li><strong>T</strong> : 목차 열기 (번호로 바로 이동 가능)</li>
    <li>📱 터치 기기: <strong>좌우 스와이프</strong>로 넘김</li>
    <li>URL 해시(<code>#s12</code>)로 특정 장을 북마크할 수 있습니다.</li>
  </ul>
  <h2>🖼️ 이미지와 링크</h2>
  <ul>
    <li>사진은 <strong>Wikimedia Commons에서 실시간 로드</strong>됩니다. 클릭하면 원본 페이지가 열립니다.</li>
    <li>오프라인이면 이미지 자리에 안내문이 표시되며 내용 읽기에는 지장이 없습니다.</li>
    <li>📄 논문·API 문서·영상 링크가 본문 곳곳과 <strong>자료실 섹션</strong>에 정리되어 있습니다.</li>
  </ul>
</div>
<div>
  <h2>🗺️ 전체 구성</h2>
  <ul>
    <li><strong>개념</strong> — BitBlt가 무엇인지, 프레임버퍼 기초</li>
    <li><strong>역사</strong> — Xerox Alto부터 GPU 시대까지 50년</li>
    <li><strong>수학</strong> — 부울 대수, 256가지 ROP의 유도, 주소·스케일링·알파 수식</li>
    <li><strong>구현</strong> — C 루프부터 마이크로코드·하드웨어 블리터·SIMD·GPU까지</li>
    <li><strong>API</strong> — Win32 GDI·DirectDraw·SDL·X11·Canvas 비교</li>
    <li><strong>데모</strong> — 브라우저에서 직접 조작하는 라이브 BitBlt 4종 🎛️</li>
    <li><strong>자료</strong> — 원전 논문·문서·소스코드·영상 링크 모음</li>
    <li><strong>ROP 카탈로그</strong> — 0x00~0xFF 전 연산을 진리표·부울식·실제 렌더링과 함께 1장씩</li>
  </ul>

sl('개념','BitBlt란 무엇인가', `

<span class="mut" style="font-size:.75em">= 메모리 안의 직사각형 픽셀 블록을, 논리 연산을 곁들여 다른 곳으로 옮기는 연산</span></div>
<ul>

  <li>목적지(Destination)의 직사각형에 <strong>픽셀 단위 부울 연산</strong>을 적용하며 복사합니다.</li>
  <li>단순 복사(<code>D = S</code>)뿐 아니라 <code>D = S XOR D</code>, <code>D = S AND D</code> 등

</ul>
<h2>왜 중요한가</h2>
<ul>

</ul>
<p class="small">🔗 배경 읽을거리: ${lk('https://en.wikipedia.org/wiki/Bit_blit','Wikipedia — Bit blit')} ·

sl('개념','프레임버퍼와 메모리 배치', `
<h1><span class="no">개념 3/6</span>프레임버퍼의 메모리 배치</h1>
<ul>
  <li>2차원 화면은 실제로는 <strong>1차원 메모리</strong>에 한 줄(행)씩 이어 붙여 저장됩니다.</li>
  <li>한 행이 차지하는 바이트 수를 <strong>stride</strong>(또는 pitch)라고 하며,
      정렬 때문에 가로 픽셀 수 × 픽셀 크기보다 클 수 있습니다.</li>
</ul>
<div class="fx big">addr(x, y) = base + y·stride + ⌊x·bpp / 8⌋</div>
<div class="cols">
<div>
  <h3>예: 1024×768, 32bpp</h3>
  <ul>
    <li>stride = 1024 × 4 = 4096 바이트</li>
    <li>픽셀 (100, 50)의 주소 = base + 50×4096 + 100×4 = base + 205,200</li>
  </ul>
  <h3>예: 1bpp 흑백 (Alto 시대)</h3>
  <ul>
    <li>1바이트에 픽셀 8개 — 픽셀 (x,y)는 <code>base + y·stride + (x&gt;&gt;3)</code> 바이트의
        <code>7−(x&amp;7)</code>번째 비트</li>
    <li>→ 바이트 경계에 안 맞는 x에서 <strong>비트 시프트</strong>가 필요해집니다 (수학 파트에서 자세히)</li>
  </ul>
</div>
<div>
  <pre class="code">메모리 (1차원)                     화면 (2차원)
┌─────────────┬─── stride ───┐
│ row 0 ...   │ padding      │   y=0 ────────────▶
│ row 1 ...   │ padding      │   y=1 ────────────▶
│ row 2 ...   │ padding      │   y=2 ────────────▶
│   ⋮         │              │     ⋮
└─────────────┴──────────────┘</pre>
  <div class="note">⚠️ Windows DIB는 기본이 <strong>bottom-up</strong>(마지막 행이 메모리 처음)이라
  stride가 음수인 것처럼 다뤄야 하는 경우도 있습니다. BitBlt 구현이 "행 진행 방향"을 파라미터로 받는 이유입니다.</div>
</div>
</div>`);

sl('개념','BitBlt의 세 입력 — S, D, P', `
<h1><span class="no">개념 4/6</span>BitBlt의 세 가지 피연산자</h1>
<div class="cols">
<div>
  <table class="tbl" style="min-width:0">
    <tr><th>기호</th><th>이름</th><th>뜻</th></tr>
    <tr><td><strong>S</strong></td><td>Source</td><td>원본 비트맵의 직사각형 (복사해 올 그림)</td></tr>
    <tr><td><strong>D</strong></td><td>Destination</td><td>목적지에 <em>이미 있던</em> 픽셀 — 연산에 참여하고, 결과가 다시 여기에 쓰임</td></tr>
    <tr><td><strong>P</strong></td><td>Pattern (Brush)</td><td>반복되는 타일 무늬 (해칭, 단색 브러시 등)</td></tr>
  </table>
  <div class="fx">D<sub>새값</sub> = <strong>f</strong> (P, S, D<sub>옛값</sub>)<br>
  <span class="mut small">f는 픽셀(비트)별로 적용되는 부울 함수 — 이 f가 바로 래스터 연산(ROP)</span></div>
</div>
<div>
  <h3>대표적인 f 들</h3>
  <ul>
    <li><code>D = S</code> — 그냥 복사 (<strong>SRCCOPY</strong>)</li>
    <li><code>D = S | D</code> — 겹쳐 찍기 (SRCPAINT)</li>
    <li><code>D = S &amp; D</code> — 마스크 뚫기 (SRCAND)</li>
    <li><code>D = S ^ D</code> — 반전 겹침, 커서에 애용 (SRCINVERT)</li>
    <li><code>D = ~D</code> — 목적지 반전 (DSTINVERT)</li>
    <li><code>D = P</code> — 패턴 채우기 (PATCOPY)</li>
    <li><code>D = 0</code>, <code>D = 1</code> — 검게/희게 (BLACKNESS/WHITENESS)</li>
  </ul>
  <p class="small mut">입력 3개짜리 부울 함수는 정확히 <strong>256가지</strong> 존재합니다. 왜 256인지는 수학 파트에서 유도합니다.</p>
</div>
</div>`);

sl('역사','선사시대 — 벡터에서 래스터로', `

sl('역사','Alto의 화면이 뜻한 것', `

<ul>
  <li>화면이 60KB 메모리 덩어리가 되자, 곧바로 문제가 드러납니다:
      <strong>"글자 하나 찍기 = 폰트 비트맵을 화면 메모리에 복사"</strong>,
      <strong>"창 스크롤 = 큰 블록을 위로 복사"</strong> — 전부 같은 모양의 작업이라는 것.</li>
  <li>처음에는 글자 그리기, 선 긋기, 영역 채우기 루틴이 <em>제각각</em> 존재했습니다.</li>
  <li>PARC의 연구자들은 이 모두가 <strong>"직사각형 비트 블록의 이동 + 부울 연산"</strong>이라는

<div class="fx">글자 출력 = 폰트 글리프를 OR로 blit<br>

sl('역사','RasterOp — 교과서에 오르다', `
<h1><span class="no">역사 8/24</span>RasterOp — 학계의 정식 개념이 되다</h1>
<ul>
  <li>William Newman과 Robert Sproull(그 자신이 PARC 연구자)의 교과서
      <em>Principles of Interactive Computer Graphics</em> 2판(1979)이
      이 연산을 <strong>RasterOp</strong>라는 이름으로 정식화합니다.</li>
  <li>정의: <em>목적지 픽셀 배열 ← f(원본 픽셀 배열, 목적지 픽셀 배열)</em> 형태의
      2차원 배열 연산. 오늘날 우리가 쓰는 ROP(Raster OPeration)라는 약어가 여기서 나옵니다.</li>
  <li>이후 Sun의 SunView/픽스레이트, 아카데미의 그래픽 문헌은 RasterOp,
      마이크로소프트·코모도어 계열은 BitBlt/blit이라는 말을 쓰게 됩니다 — <strong>같은 것의 두 이름</strong>.</li>
</ul>
<div class="fx">RasterOp: dst[x,y] ← f(src[x+dx, y+dy], dst[x,y])  for all (x,y) in rect<br>
<span class="mut small">f ∈ {16가지 2입력 부울 함수} — 패턴까지 넣으면 256가지 (수학 파트에서 유도)</span></div>
<p class="small">🔗 ${lk('https://archive.org/details/principlesofinte00newm','archive.org — Principles of Interactive Computer Graphics (대출 열람)')} ·
${lk('https://en.wikipedia.org/wiki/Robert_Sproull','Wikipedia — Bob Sproull')}</p>`);

sl('역사','1984 — Macintosh', `

<div>

    <li>Mac은 512×342 1bpp 화면(약 21.9KB)과 <strong>ROM에 구운 QuickDraw</strong>로
        128KB 메모리에서 GUI를 돌렸습니다.</li>
    <li>창 드래그, 메뉴 펼침, 데스크 액세서리 — 전부 <code>CopyBits</code>(=BitBlt) 기반.
        게임들도 이 루틴으로 스프라이트를 찍었습니다.</li>
    <li>흑백 1bpp 세계에서는 XOR·AND·OR 마스크 조합이 투명 스프라이트를 만드는 <em>유일한</em> 방법이었고,

sl('역사','1985 — Windows 1.0과 GDI BitBlt', `

    <li>당시 PC엔 가속 하드웨어가 없어 GDI와 디스플레이 드라이버가 <strong>전부 소프트웨어로</strong> 처리 —

    <li>ROP 코드 체계(SRCCOPY=0x00CC0020 등)와 256개 삼항 래스터 연산 표가 이때 확립되어 지금까지 이어집니다.</li>

sl('수학','수학 파트 개요', `

<div class="tip">💡 이 파트의 모든 수식은 뒤의 <strong>구현 파트</strong> 코드 및 <strong>라이브 데모</strong>와 1:1로 대응합니다.

sl('수학','부울 대수 기초', `
<h1><span class="no">수학 2/17</span>부울 대수 최소한의 기초</h1>
<div class="cols">
<div>
  <p>비트 하나는 {0, 1} 값을 가지며, 기본 연산은 넷입니다.</p>
  <div class="tw"><table class="tbl tt">
    <tr><th>a</th><th>b</th><th>a AND b<br>(a·b)</th><th>a OR b<br>(a+b)</th><th>a XOR b<br>(a⊕b)</th><th>NOT a<br>(¬a)</th></tr>
    <tr><td>0</td><td>0</td><td class="r0">0</td><td class="r0">0</td><td class="r0">0</td><td class="r1">1</td></tr>
    <tr><td>0</td><td>1</td><td class="r0">0</td><td class="r1">1</td><td class="r1">1</td><td class="r1">1</td></tr>
    <tr><td>1</td><td>0</td><td class="r0">0</td><td class="r1">1</td><td class="r1">1</td><td class="r0">0</td></tr>
    <tr><td>1</td><td>1</td><td class="r1">1</td><td class="r1">1</td><td class="r0">0</td><td class="r0">0</td></tr>
  </table></div>
</div>
<div>
  <h3>그래픽에서의 직관</h3>
  <ul>
    <li><strong>AND</strong> = 마스크로 "뚫기" — 0인 곳은 무조건 0(검정/구멍)</li>
    <li><strong>OR</strong> = 겹쳐 "찍기" — 1인 곳은 무조건 1(잉크)</li>
    <li><strong>XOR</strong> = "반전 겹침" — 두 번 적용하면 원상복구되는 유일한 연산</li>
    <li><strong>NOT</strong> = 색 반전 (흑백 뒤집기)</li>
  </ul>
  <div class="fx">유용한 항등식<br>
  a⊕a = 0 · a⊕0 = a · <strong>(a⊕b)⊕b = a</strong> (XOR 복원 법칙)<br>
  드모르간: ¬(a·b) = ¬a+¬b · ¬(a+b) = ¬a·¬b</div>
</div>
</div>
<p class="small">🔗 ${lk('https://en.wikipedia.org/wiki/Boolean_algebra','Wikipedia — Boolean algebra')} ·
${lk('https://ko.wikipedia.org/wiki/%EB%B6%88_%EB%8C%80%EC%88%98%ED%95%99','한국어 위키백과 — 불 대수학')}</p>`);

sl('수학','비트 병렬성 — 공짜 SIMD', `
<h1><span class="no">수학 3/17</span>비트 병렬성 — 워드 연산은 공짜 SIMD다</h1>
<ul>
  <li>부울 연산은 <strong>비트별로 독립</strong>입니다. 따라서 CPU의 32비트 AND 한 번은
      1bpp 화면에서 <strong>픽셀 32개를 동시에 처리</strong>하는 것과 같습니다.</li>
  <li>이것이 1970~80년대 기계가 소프트웨어 BitBlt로 버틸 수 있었던 수학적 근거입니다.</li>
</ul>
<div class="fx">1bpp에서 W비트 워드 연산의 처리량 = W 픽셀/명령<br>
Alto(16비트): ×16 · 68000(32비트): ×32 · 현대 AVX-512: ×512<span class="mut small"> (1bpp 기준)</span></div>
<div class="cols">
<div>
  <h3>픽셀 단위로 보면</h3>
  <pre class="code">for each pixel:          <span class="cm">// 606×808 = 489,648회</span>
    d = s OR d</pre>
</div>
<div>
  <h3>워드 단위로 보면</h3>
  <pre class="code">for each 16-bit word:    <span class="cm">// 30,603회 — 16배 감소!</span>
    D[i] = S[i] | D[i]</pre>
</div>
</div>
<div class="note">⚠️ 단, 공짜 병렬성은 <strong>블록이 워드 경계에 정렬되어 있을 때만</strong> 그대로 성립합니다.
x 좌표가 임의라면? — 시프트 대수가 필요합니다 (잠시 후 11번 슬라이드).</div>`);

sl('수학','2입력 연산은 왜 16가지인가 (ROP2)', `
<h1><span class="no">수학 4/17</span>2입력 부울 함수 = 정확히 16가지 (ROP2)</h1>
<p>입력이 (S, D) 두 비트면 입력 조합은 2² = <strong>4가지</strong>.
함수는 각 조합마다 출력 0/1을 정하므로, 가능한 함수 수는:</p>
<div class="fx big">2<sup>(2²)</sup> = 2⁴ = <strong>16가지</strong></div>
<div class="tw"><table class="tbl tt">
<tr><th>S,D→</th><th>00</th><th>01</th><th>10</th><th>11</th><th>식</th><th>X11 이름</th><th>GDI ROP2</th></tr>
<tr><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>GXclear</td><td>R2_BLACK</td></tr>
<tr><td>1</td><td>0</td><td>0</td><td>0</td><td>1</td><td>S·D</td><td>GXand</td><td>R2_MASKPEN</td></tr>
<tr><td>3</td><td>0</td><td>0</td><td>1</td><td>1</td><td>S</td><td>GXcopy</td><td>R2_COPYPEN</td></tr>
<tr><td>5</td><td>0</td><td>1</td><td>0</td><td>1</td><td>D</td><td>GXnoop</td><td>R2_NOP</td></tr>
<tr><td>6</td><td>0</td><td>1</td><td>1</td><td>0</td><td>S⊕D</td><td>GXxor</td><td>R2_XORPEN</td></tr>
<tr><td>7</td><td>0</td><td>1</td><td>1</td><td>1</td><td>S+D</td><td>GXor</td><td>R2_MERGEPEN</td></tr>
<tr><td>10</td><td>1</td><td>0</td><td>1</td><td>0</td><td>¬D</td><td>GXinvert</td><td>R2_NOT</td></tr>
<tr><td>12</td><td>1</td><td>1</td><td>0</td><td>0</td><td>¬S</td><td>GXcopyInverted</td><td>R2_NOTCOPYPEN</td></tr>
<tr><td>15</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>GXset</td><td>R2_WHITE</td></tr>
</table></div>
<p class="small mut">표는 16개 중 대표 9개만 발췌. 번호(0~15)가 곧 진리표를 2진수로 읽은 값 — 이 <strong>"번호 = 진리표" 인코딩</strong>이 ROP 체계의 핵심 아이디어입니다.
X11의 GC function, GDI의 ROP2(펜 그리기 모드)가 정확히 이 16가지입니다.</p>`);

sl('수학','3입력이면 256가지 (ROP3)', `
<h1><span class="no">수학 5/17</span>패턴을 추가하면 — 2<sup>2³</sup> = 256가지 (ROP3)</h1>
<p>BitBlt의 피연산자는 <strong>P</strong>(패턴), <strong>S</strong>(원본), <strong>D</strong>(목적지) 셋.
입력 조합은 2³ = <strong>8가지</strong>이고, 각 조합의 출력을 자유로 정하면:</p>
<div class="fx big">2<sup>(2³)</sup> = 2⁸ = <strong>256가지</strong> — 그래서 ROP 코드가 딱 1바이트!</div>
<div class="cols">
<div>
  <h3>일반화</h3>
  <div class="fx">n입력 부울 함수의 수 = 2<sup>(2ⁿ)</sup><br>
  <span class="mut small">n=1: 4 · n=2: 16 · n=3: 256 · n=4: 65,536 …</span></div>
  <ul>
    <li>Windows GDI ROP3 = 삼항(ternary) 래스터 연산 256개</li>
    <li>Amiga 블리터의 민텀 LF 필드도 같은 8비트 — <strong>같은 수학의 독립적 재발견</strong></li>
    <li>Windows 드라이버 세계에는 마스크까지 넣은 ROP4(= ROP3 두 개를 비트별 선택)도 있습니다</li>
  </ul>
</div>
<div>
  <h3>왜 "완비"인가</h3>
  <p>256가지는 P,S,D로 만들 수 있는 <strong>모든 픽셀별 논리 효과의 전체 목록</strong>입니다.
  즉 어떤 조합 논리도 이 표 밖에 존재할 수 없습니다 — 아래처럼 임의 진리표를 만들면 그게 곧 하나의 ROP 코드입니다.</p>
  <div class="tip">💡 이 문서 끝의 <strong>ROP 카탈로그</strong>가 256개 전부를
  진리표·부울식·실제 렌더링과 함께 한 장씩 보여줍니다.</div>
</div>
</div>
<p class="small">🔗 ${lk('https://learn.microsoft.com/en-us/windows/win32/gdi/ternary-raster-operations','Microsoft Learn — Ternary Raster Operations')} ·
${lk('https://en.wikipedia.org/wiki/Truth_table','Wikipedia — Truth table')}</p>`);

sl('수학','ROP 코드 해부 — 0xCC는 진리표다', `
<h1><span class="no">수학 6/17</span>ROP 코드 해부 — SRCCOPY가 0xCC인 이유</h1>
<p>여덟 가지 입력 조합 (P,S,D)를 번호 i = 4P + 2S + D 로 매기고,
원하는 함수의 출력을 i번째 비트에 적으면 — 그 8비트 수가 곧 ROP 코드입니다.</p>
<div class="tw"><table class="tbl tt">
<tr><th>i</th><th>P</th><th>S</th><th>D</th><th>D=S (SRCCOPY)</th><th>D=P (PATCOPY)</th><th>D=S⊕D (SRCINVERT)</th><th>D=¬D (DSTINVERT)</th></tr>
<tr><td>7</td><td>1</td><td>1</td><td>1</td><td class="r1">1</td><td class="r1">1</td><td class="r0">0</td><td class="r0">0</td></tr>
<tr><td>6</td><td>1</td><td>1</td><td>0</td><td class="r1">1</td><td class="r1">1</td><td class="r1">1</td><td class="r1">1</td></tr>
<tr><td>5</td><td>1</td><td>0</td><td>1</td><td class="r0">0</td><td class="r1">1</td><td class="r1">1</td><td class="r0">0</td></tr>
<tr><td>4</td><td>1</td><td>0</td><td>0</td><td class="r0">0</td><td class="r1">1</td><td class="r0">0</td><td class="r1">1</td></tr>
<tr><td>3</td><td>0</td><td>1</td><td>1</td><td class="r1">1</td><td class="r0">0</td><td class="r0">0</td><td class="r0">0</td></tr>
<tr><td>2</td><td>0</td><td>1</td><td>0</td><td class="r1">1</td><td class="r0">0</td><td class="r1">1</td><td class="r1">1</td></tr>
<tr><td>1</td><td>0</td><td>0</td><td>1</td><td class="r0">0</td><td class="r0">0</td><td class="r1">1</td><td class="r0">0</td></tr>
<tr><td>0</td><td>0</td><td>0</td><td>0</td><td class="r0">0</td><td class="r0">0</td><td class="r0">0</td><td class="r1">1</td></tr>
<tr><th colspan="4">위에서 아래로 읽으면</th><th>1100 1100<br>= <strong>0xCC</strong></th><th>1111 0000<br>= <strong>0xF0</strong></th><th>0110 0110<br>= <strong>0x66</strong></th><th>0101 0101<br>= <strong>0x55</strong></th></tr>
</table></div>
<div class="fx">평가 공식 (구현 파트와 데모에서 그대로 사용):<br>
<strong>result_bit = (rop &gt;&gt; (4·P + 2·S + D)) &amp; 1</strong></div>
<p class="small mut">Win32의 32비트 상수(예: SRCCOPY=0x00CC0020)에서 상위 바이트 0xCC가 이 진리표이고,
하위 16비트는 드라이버용으로 연산 순서를 부호화한 값입니다.</p>`);

sl('수학','역폴란드 이름 규칙', `

<div class="cols">
<div>
  <h3>연산자 문자</h3>
  <table class="tbl" style="min-width:0">
    <tr><th>문자</th><th>뜻</th></tr>
    <tr><td><code>a</code></td><td>AND</td></tr>
    <tr><td><code>o</code></td><td>OR</td></tr>
    <tr><td><code>x</code></td><td>XOR</td></tr>
    <tr><td><code>n</code></td><td>NOT (앞 항 반전)</td></tr>
  </table>
</div>
<div>
  <h3>읽기 연습</h3>
  <ul>
    <li><code>DSo</code> = D, S를 OR → <strong>S+D</strong> (SRCPAINT 0xEE)</li>
    <li><code>DSna</code> = D와 (¬S)를 AND → <strong>¬S·D</strong> (0x22)</li>
    <li><code>DSon</code> = (D+S) 뒤에 NOT → <strong>¬(S+D)</strong> (NOTSRCERASE 0x11)</li>
    <li><code>DPSoo</code> = D+P+S (0xFE)</li>
    <li><code>DPSDxax</code> = D ⊕ (P·(S⊕D)) — 스택식으로 계산 (0x78)</li>
  </ul>
</div>
</div>
<div class="tip">💡 스택 머신으로 읽으면 됩니다: 피연산자는 push, 연산자는 pop 2개(n은 1개)→계산→push.
하위 16비트 인코딩이 바로 이 "계산 순서"를 담습니다. 전체 256개 이름은
${lk('https://learn.microsoft.com/en-us/windows/win32/gdi/ternary-raster-operations','MS의 Ternary Raster Operations 표')}에서 볼 수 있습니다.</div>`);

sl('수학','주소 산술', `
<h1><span class="no">수학 10/17</span>주소 산술 — (x, y)에서 비트 위치까지</h1>

    <tr><td>1</td><td>byte = base + y·stride + (x≫3), bit = 7−(x&amp;7)</td></tr>
    <tr><td>8</td><td>base + y·stride + x</td></tr>

    <li>stride는 4바이트/캐시라인 정렬 패딩 때문에 <code>width×bpp/8</code>과 다를 수 있음 — 항상 별도 파라미터로.</li>

sl('수학','비트 정렬과 시프트 대수', `
<h1><span class="no">수학 11/17</span>비트 정렬 — 어긋난 만큼 시프트하라</h1>
<p>1bpp에서 원본 x₀와 목적지 x₁이 워드 경계 기준으로 <strong>s = (x₁ mod W) − (x₀ mod W)</strong>만큼 어긋나 있으면,
목적지 워드 하나는 <strong>원본 워드 두 개에 걸칩니다</strong>.</p>
<div class="fx big">D[j] = (S[k] ≪ s) | (S[k+1] ≫ (W − s))<span class="mut small">  (0 &lt; s &lt; W, W=워드 비트수)</span></div>
<pre class="code">원본 워드:    [ S_k          ][ S_k+1        ]
                     ╲ ≪s            ╲ ≫(W−s)
목적지 워드:      [ ◄─── D_j 한 워드 ───► ]</pre>
<ul>
  <li>s = 0이면 시프트 없이 순수 복사 — <strong>정렬된 fast path</strong>를 따로 두는 이유.</li>
  <li>s &lt; 0이면 반대 방향 시프트(또는 원본 인덱스를 하나 당김)로 대칭 처리.</li>
  <li>하드웨어 블리터는 이 식을 <strong>배럴 시프터 + 이전 워드 래치</strong> 회로로 그대로 구현합니다 —
      Amiga의 시프트 필드가 정확히 이 s 값입니다.</li>
  <li>다중 바이트 픽셀(8/16/32bpp)에서는 s가 항상 바이트 배수라 <code>memmove</code>식 바이트 복사로 단순화됩니다 —
      1bpp가 가장 어려운 경우입니다.</li>
</ul>
<div class="note">⚠️ 마지막 원본 워드에서 <code>S[k+1]</code>을 읽으면 <strong>버퍼 밖 읽기</strong>가 될 수 있습니다.
구현은 경계에서 읽기 횟수를 줄이거나 패딩을 보장해야 합니다 — 실전 구현 파트에서 다룹니다.</div>`);

sl('수학','경계 마스크 공식', `
<h1><span class="no">수학 12/17</span>첫/마지막 워드 마스크</h1>
<p>블록의 왼쪽 끝과 오른쪽 끝은 워드 중간에서 시작/끝나므로,
그 워드에서는 <strong>블록 안쪽 비트만</strong> 바꿔야 합니다. (바깥 비트를 건드리면 옆 그림이 깨짐!)</p>
<div class="fx">첫 워드 마스크 M_f = (1 ≪ (W − x mod W)) − 1 <span class="mut small">→ 왼쪽 (x mod W)개 비트가 0</span><br>
마지막 워드 마스크 M_l = ¬((1 ≪ (W − (x+w) mod W)) − 1) <span class="mut small">→ 오른쪽 나머지 비트가 0</span></div>
<div class="fx big">D = (newD · M) | (D · ¬M)<span class="mut small">  — "마스크 안은 새 값, 밖은 옛 값" (merge 공식)</span></div>
<div class="cols">
<div>
  <pre class="code">예: W=8, x=3, w=10  (x=3..12)
첫 바이트:  M_f = 0001 1111
중간:       M   = 1111 1111 (마스크 불필요)
마지막:     M_l = 1111 1000</pre>
</div>
<div>
  <ul>
    <li>블록 폭이 한 워드 안에 다 들어가면 <strong>M = M_f · M_l</strong> 하나로 합쳐집니다.</li>
    <li>Amiga의 <code>BLTAFWM/BLTALWM</code> 레지스터가 정확히 이 두 마스크입니다.</li>
    <li>이 merge 공식은 뒤에 나올 MaskBlt·스프라이트 합성과 <strong>같은 모양</strong>입니다 —

  </ul>
</div>
</div>`);

sl('수학','겹침 정리 — 복사 방향의 증명', `
<h1><span class="no">수학 13/17</span>겹침 정리 — 어느 방향으로 복사해야 하는가</h1>
<p>같은 비트맵 안에서 원본과 목적지가 겹치면(스크롤이 대표적),
순진한 "왼쪽 위부터" 복사는 <strong>아직 읽지 않은 원본을 덮어써</strong> 그림이 뭉개집니다.</p>
<div class="fx"><strong>규칙</strong> — 목적지가 원본보다 아래(또는 같은 행에서 오른쪽)에 있으면
<strong>오른쪽 아래부터 역방향</strong>으로, 그 외에는 정방향으로 복사한다.<br>
<span class="mut small">dy &gt; sy → 아래→위 · dy = sy이고 dx &gt; sx → 오른쪽→왼쪽 · 그 외 → 정방향</span></div>
<h3>증명 스케치</h3>
<ul>
  <li>복사는 픽셀별 대입 D(p+δ) ← S(p)의 나열입니다 (δ = 목적지−원본 오프셋).</li>
  <li>순서가 안전하려면: 어떤 픽셀 q를 <em>쓰기 전에</em>, q를 원본으로 쓰는 픽셀(즉 q−δ 위치의 읽기)이 이미 끝나 있어야 함 —
      즉 <strong>읽기가 쓰기보다 항상 먼저 지나가야</strong> 합니다.</li>
  <li>δ가 "아래쪽"(dy&gt;sy)이면, 진행 방향을 δ와 <strong>반대</strong>(아래→위)로 잡아야
      쓰기 지점이 읽기 지점을 영원히 추월하지 못합니다. 반대 경우도 대칭. ∎</li>
</ul>
<div class="cols">
<div><pre class="code"><span class="cm">// memmove가 같은 문제를 1차원에서 푸는 방식</span>
if (dst &lt; src)  <span class="cm">// 앞으로 복사</span>
    for (i = 0; i &lt; n; i++) d[i] = s[i];
else            <span class="cm">// 뒤에서부터 복사</span>
    for (i = n; i-- &gt; 0; )  d[i] = s[i];</pre></div>
<div>
  <ul>
    <li>Amiga 블리터의 <strong>descending mode</strong>가 바로 이 역방향 모드입니다.</li>
    <li>데모 파트의 <strong>겹침 복사 데모</strong>에서 잘못된 방향이 만드는 "번짐"을 직접 볼 수 있습니다.</li>
  </ul>
</div>
</div>`);

sl('수학','클리핑 수학', `
<h1><span class="no">수학 14/17</span>클리핑 — 사각형 교집합의 산술</h1>
<p>목적지 사각형이 화면(또는 창)의 유효 영역을 벗어나면 잘라내야 합니다.
축 정렬 사각형끼리의 교집합은 max/min 넉 줄이면 끝납니다.</p>
<pre class="code"><span class="cm">// [x0,x1)×[y0,y1) 형식 (반개구간)</span>
cx0 = max(dst.x0, clip.x0);   cy0 = max(dst.y0, clip.y0);
cx1 = min(dst.x1, clip.x1);   cy1 = min(dst.y1, clip.y1);
if (cx0 &gt;= cx1 || cy0 &gt;= cy1) return;      <span class="cm">// 완전히 밖 → 그릴 것 없음</span>

<span class="cm">// 잘려나간 만큼 원본 시작점도 같이 이동!</span>
sx += cx0 - dst.x0;   sy += cy0 - dst.y0;</pre>
<ul>
  <li>⚠️ 흔한 버그: 목적지만 자르고 <strong>원본 오프셋 보정을 잊는 것</strong> — 그림이 "밀려서" 그려집니다.</li>
  <li>창 시스템은 겹치는 창들 때문에 클립 영역이 사각형 하나가 아니라 <strong>사각형들의 집합(Region)</strong>이 됩니다.
      BitBlt를 리전의 사각형 수만큼 반복하는 것이 표준 구현 — QuickDraw의 Region,
      X의 pixman_region이 이 자료를 관리합니다.</li>
  <li>반개구간 [x0, x1)을 쓰면 폭 = x1−x0, 인접 사각형 경계가 겹치지 않아 오프바이원이 사라집니다 — 업계 표준 관례.</li>
</ul>`);

sl('수학','StretchBlt — 정수 DDA', `
<h1><span class="no">수학 15/17</span>확대·축소의 수학 — 정수 DDA</h1>
<p>목적지 픽셀 dx가 참조할 원본 픽셀은 sx = ⌊dx · sw / dw⌋ (최근접 샘플링).
나눗셈 없이 계산하려면 <strong>Bresenham식 오차 누적</strong>을 씁니다.</p>
<div class="cols">
<div>
  <pre class="code"><span class="cm">// dw개의 목적지 픽셀에 sw개의 원본을 분배</span>
sx = 0; err = 0;
for (dx = 0; dx &lt; dw; dx++) {
    dst[dx] = src[sx];
    err += sw;
    while (err &gt;= dw) {   <span class="cm">// 정수만 사용!</span>
        sx++;
        err -= dw;
    }
}</pre>
  <p class="small mut">확대(sw&lt;dw)면 같은 원본 픽셀이 여러 번 복제되고, 축소(sw&gt;dw)면 건너뜁니다.
  세로 방향도 같은 식 — 축소 시 행 전체를 skip할 수 있어 더 큽니다.</p>
</div>
<div>
  <h3>품질 이야기</h3>
  <ul>
    <li>이 방식이 <strong>nearest neighbor</strong> — GDI StretchBlt의 기본(COLORONCOLOR)이자
        레트로 게임 특유의 "픽셀 확대" 느낌.</li>
    <li>GDI의 <code>HALFTONE</code> 모드, GPU의 bilinear 필터는 이웃 픽셀의 <strong>가중 평균</strong>:
        <span class="mut">C = (1−t)·C₀ + t·C₁ (양방향)</span></li>
    <li>축소 시 고품질을 원하면 박스 필터/미프맵 — 하지만 그건 이미 "blit"의 영역을 넘어 샘플링 이론입니다.</li>
  </ul>
  <div class="tip">💡 데모 파트의 <strong>StretchBlt 데모</strong>에서 배율을 바꿔가며 DDA의 픽셀 분배를 눈으로 확인해 보세요.</div>
</div>
</div>
${fig('Bresenham.svg','Bresenham 알고리즘 — 정수 오차 누적으로 기울기를 근사하는 같은 원리가 직선 긋기와 StretchBlt에 쓰인다',480)}`);

sl('수학','알파 합성 — 부울을 대체한 대수', `
<h1><span class="no">수학 16/17</span>알파 합성 — ROP를 은퇴시킨 수학</h1>
<p>컬러 시대가 되자 "겹침"의 의미가 비트 반전이 아니라 <strong>반투명 혼합</strong>이 됩니다.
Porter &amp; Duff(1984)가 이 대수를 정리했습니다.</p>
<div class="fx big">C_out = α_s·C_s + (1 − α_s)·C_d<span class="mut small">  — "over" 연산 (비premultiplied)</span></div>
<div class="cols">
<div>
  <h3>Premultiplied alpha</h3>
  <p>C′ = α·C로 미리 곱해 두면:</p>
  <div class="fx">C′_out = C′_s + (1 − α_s)·C′_d<br>α_out = α_s + (1 − α_s)·α_d</div>
  <ul>
    <li>곱셈이 줄고, <strong>필터링(확대축소)과 합성의 순서가 교환 가능</strong>해져 GPU 세계의 표준이 됨.</li>
    <li>Win32 <code>AlphaBlend</code>는 premultiplied 32bpp를 요구합니다.</li>
  </ul>
</div>
<div>
  <h3>ROP와의 관계</h3>
  <ul>
    <li>α ∈ {0, 1}로 제한하면 over는 정확히 <strong>마스크 blit</strong>(D = S·M + D·¬M)로 퇴화합니다 —
        알파 합성은 부울 마스킹의 <em>연속화</em>입니다.</li>
    <li>Porter-Duff에는 over 외에 in, out, atop, xor 등 12연산이 있고 —
        이름부터 부울 연산의 확장임을 보여줍니다.</li>
    <li>현대 UI(브라우저·모바일)의 모든 픽셀이 이 식으로 화면에 도달합니다.</li>
  </ul>
</div>
</div>
<p class="small">🔗 ${lk('https://en.wikipedia.org/wiki/Alpha_compositing','Wikipedia — Alpha compositing (Porter-Duff 12연산 도해)')} ·
${lk('https://dl.acm.org/doi/10.1145/964965.808606','ACM — Porter &amp; Duff, Compositing Digital Images (1984)')} ·
${lk('https://learn.microsoft.com/en-us/windows/win32/api/wingdi/nf-wingdi-alphablend','MS Learn — AlphaBlend')}</p>`);

sl('수학','투명 스프라이트 공식 + 수학 총정리', `
<h1><span class="no">수학 17/17</span>투명 스프라이트 공식, 그리고 총정리</h1>
<div class="fx big">D = (S · M) | (D · ¬M)<span class="mut small">  — 마스크 M이 1인 곳만 원본이 보인다</span></div>
<div class="cols">
<div>
  <h3>1bpp 시대의 실제 시퀀스 (blit 2번)</h3>
  <pre class="code">BitBlt(dst, ..., mask,   <span class="nb">SRCAND</span>);  <span class="cm">// D &amp;= ¬M′ : 구멍 뚫기</span>
BitBlt(dst, ..., sprite, <span class="nb">SRCPAINT</span>); <span class="cm">// D |= S  : 그림 붓기</span></pre>
  <p class="small mut">(마스크를 반전해 저장하는 관례에 따라 AND→OR 순서. Win32 MaskBlt는 이것을 한 번에,
  DirectDraw 컬러키는 M을 즉석 생성, 알파 합성은 M을 연속값으로 일반화한 것.)</p>
</div>
<div>
  <h3>수학 파트 요약</h3>
  <ul>
    <li>연산 공간: 2<sup>2ⁿ</sup> — ROP2=16, <strong>ROP3=256</strong>, 코드가 곧 진리표</li>
    <li>평가식: <code>bit = (rop ≫ (4P+2S+D)) &amp; 1</code></li>
    <li>주소: base + y·stride + x·bpp/8, 어긋나면 <strong>이중 워드 시프트</strong></li>
    <li>경계: merge 공식 D = new·M + old·¬M</li>
    <li>겹침: 목적지가 뒤면 <strong>역방향 복사</strong> (증명 완료)</li>
    <li>스케일: 정수 DDA (err += sw; err ≥ dw → sx++)</li>
    <li>미래: 부울 마스크 → 연속 알파 (Porter-Duff)</li>
  </ul>
</div>
</div>
<p class="mut small">다음 파트: 이 수식들이 실제 코드가 되는 과정 — 나이브 루프에서 GPU까지. ⚙️</p>`);

sl('구현','1단계 — 나이브 구현', `
<h1><span class="no">구현 2/14</span>1단계 — 가장 단순한 BitBlt (8bpp)</h1>
<pre class="code"><span class="kw">void</span> bitblt_naive(<span class="kw">uint8_t</span> *dst, <span class="kw">int</span> dstStride, <span class="kw">int</span> dx, <span class="kw">int</span> dy,
                  <span class="kw">const uint8_t</span> *src, <span class="kw">int</span> srcStride, <span class="kw">int</span> sx, <span class="kw">int</span> sy,
                  <span class="kw">int</span> w, <span class="kw">int</span> h)               <span class="cm">/* SRCCOPY, 8bpp */</span>
{
    <span class="kw">for</span> (<span class="kw">int</span> y = 0; y &lt; h; y++) {
        <span class="kw">const uint8_t</span> *s = src + (sy + y) * srcStride + sx;
        <span class="kw">uint8_t</span>       *d = dst + (dy + y) * dstStride + dx;
        <span class="kw">for</span> (<span class="kw">int</span> x = 0; x &lt; w; x++)
            d[x] = s[x];                     <span class="cm">/* ROP 넣을 자리 */</span>
    }
}</pre>
<ul>
  <li>수학 파트의 주소 공식이 그대로 코드가 된 모습입니다. <strong>이 버전이 모든 최적화의 정답지</strong> —
      빠른 버전은 반드시 이것과 결과가 같아야 합니다.</li>
  <li>ROP를 지원하려면 안쪽 대입을 <code>d[x] = rop(pat, s[x], d[x])</code>로 바꾸면 끝.</li>
  <li>실전에서는 호출 전에 <strong>클리핑</strong>(수학 14장)과 <strong>겹침 방향 판정</strong>(수학 13장)이 먼저 옵니다.</li>
</ul>
<div class="note">⚠️ 성능 문제: 바이트 단위 접근은 메모리 대역폭을 1/8밖에 못 씁니다(64비트 버스 기준).
컴파일러 자동 벡터화가 구제해 주기도 하지만, 다음 단계처럼 직접 워드화하는 것이 고전적 해법입니다.</div>`);

sl('구현','2단계 — 워드 단위 + memcpy 활용', `
<h1><span class="no">구현 3/14</span>2단계 — 워드 최적화와 fast path</h1>
<pre class="code"><span class="kw">void</span> bitblt_fast(<span class="kw">uint8_t</span> *d, <span class="kw">int</span> dstride,
                 <span class="kw">const uint8_t</span> *s, <span class="kw">int</span> sstride, <span class="kw">int</span> wBytes, <span class="kw">int</span> h)
{
    <span class="kw">if</span> (dstride == sstride &amp;&amp; wBytes == dstride) {
        memcpy(d, s, (<span class="kw">size_t</span>)wBytes * h);   <span class="cm">/* 전체가 연속 → 한 방! */</span>
        <span class="kw">return</span>;
    }
    <span class="kw">for</span> (<span class="kw">int</span> y = 0; y &lt; h; y++, d += dstride, s += sstride)
        memcpy(d, s, wBytes);                <span class="cm">/* 행 단위 복사 */</span>
}</pre>
<ul>
  <li>SRCCOPY이고 픽셀 포맷이 같다면 BitBlt는 결국 <strong>행 단위 memcpy</strong> —
      libc의 memcpy는 이미 SIMD·정렬 최적화가 되어 있으니 공짜로 얻어 갑니다.</li>
  <li>겹침 가능성이 있으면 memcpy 대신 <strong>memmove</strong>(또는 역방향 루프) — 수학 13장의 규칙 그대로.</li>
  <li>폭 전체 = stride이면 h개 행을 <strong>단일 memcpy</strong>로 합치는 것이 첫 번째 점검 항목입니다.</li>
</ul>
<div class="tip">💡 실제 pixman·SDL 소스도 구조가 이와 같습니다: ① 포맷/ROP 검사 → ② 특수 케이스 디스패치 → ③ 일반 루프 폴백.</div>`);

sl('구현','2단계 심화 — 1bpp 비정렬 코어', `
<h1><span class="no">구현 4/14</span>2단계 심화 — 1bpp 비정렬 복사 코어</h1>
<p>수학 11~12장의 시프트·마스크 식을 코드로 옮긴, BitBlt의 "진짜 어려운 부분"입니다.</p>
<pre class="code"><span class="cm">/* 한 행: 원본 비트열을 s비트 밀어 목적지에 merge (0 &lt; s &lt; 32) */</span>
<span class="kw">void</span> blt_row_shift(<span class="kw">uint32_t</span> *d, <span class="kw">const uint32_t</span> *sp, <span class="kw">int</span> nWords,
                   <span class="kw">int</span> s, <span class="kw">uint32_t</span> mFirst, <span class="kw">uint32_t</span> mLast)
{
    <span class="kw">uint32_t</span> prev = sp[0], cur, out;
    <span class="kw">for</span> (<span class="kw">int</span> i = 0; i &lt; nWords; i++) {
        cur = sp[i + 1];
        out = (prev &lt;&lt; s) | (cur &gt;&gt; (32 - s));   <span class="cm">/* 수학 11장의 식 */</span>
        <span class="kw">uint32_t</span> m = 0xFFFFFFFFu;                <span class="cm">/* 중간 워드는 전체 */</span>
        <span class="kw">if</span> (i == 0)          m &amp;= mFirst;
        <span class="kw">if</span> (i == nWords - 1)  m &amp;= mLast;
        d[i] = (out &amp; m) | (d[i] &amp; ~m);           <span class="cm">/* merge 공식 */</span>
        prev = cur;
    }
}</pre>
<ul>
  <li><code>prev/cur</code> 레지스터 쌍이 하드웨어 블리터의 "이전 워드 래치"와 동일한 역할 —
      원본을 워드당 <strong>한 번만 읽습니다</strong>.</li>
  <li>중간 워드에서 마스크 분기를 없애려면 첫/마지막 워드를 루프 밖으로 빼는 것이 정석(peeling).</li>
  <li>여기에 ROP를 끼우려면 <code>out</code> 계산 뒤 <code>out = ROP(pat, out, d[i])</code> 한 줄이면 됩니다.</li>
</ul>`);

sl('구현','3단계 — ROP 디스패치 전략', `
<h1><span class="no">구현 5/14</span>3단계 — 256가지 ROP를 어떻게 처리할까</h1>
<div class="cols">
<div>
  <h3>전략 A: 범용 평가기 (느림, 확실)</h3>
  <pre class="code"><span class="cm">/* 워드 전체에 임의 ROP 적용 — 비트 병렬 !*/</span>
<span class="kw">static uint32_t</span> rop_apply(<span class="kw">int</span> rop,
        <span class="kw">uint32_t</span> P, <span class="kw">uint32_t</span> S, <span class="kw">uint32_t</span> D)
{
    <span class="kw">uint32_t</span> r = 0;
    <span class="kw">for</span> (<span class="kw">int</span> i = 0; i &lt; 8; i++)
        <span class="kw">if</span> (rop &gt;&gt; i &amp; 1) {
            <span class="kw">uint32_t</span> t = 0xFFFFFFFFu;
            t &amp;= (i&amp;4) ? P : ~P;
            t &amp;= (i&amp;2) ? S : ~S;
            t &amp;= (i&amp;1) ? D : ~D;
            r |= t;               <span class="cm">/* 민텀 OR */</span>
        }
    <span class="kw">return</span> r;
}</pre>
</div>
<div>
  <h3>전략 B: 자주 쓰는 것만 특수화</h3>
  <pre class="code"><span class="kw">switch</span> (rop) {
<span class="kw">case</span> 0xCC: *d = s;        <span class="kw">break</span>;
<span class="kw">case</span> 0xEE: *d |= s;       <span class="kw">break</span>;
<span class="kw">case</span> 0x88: *d &amp;= s;       <span class="kw">break</span>;
<span class="kw">case</span> 0x66: *d ^= s;       <span class="kw">break</span>;
<span class="kw">case</span> 0x55: *d = ~*d;      <span class="kw">break</span>;
<span class="kw">default</span>:   *d = rop_apply(rop, p, s, *d);
}</pre>
  <ul>
    <li>실측상 SRCCOPY가 압도적 다수 → <strong>핫 케이스만 인라인</strong>하고 나머지는 범용기로.</li>
    <li>전략 A의 민텀 전개는 이 문서의 <strong>ROP 카탈로그</strong>가 화면을 그리는 방식이기도 합니다.</li>
  </ul>
</div>
</div>
<div class="note">⚠️ 분기를 안쪽 루프에 두면 파이프라인이 죽습니다 — 반드시 <strong>루프 밖에서</strong> 케이스를 골라
행 처리 함수 포인터를 선택하세요. 다음 슬라이드는 그 극한 형태입니다.</div>`);

sl('구현','3단계 극한 — 런타임 코드 생성', `
<h1><span class="no">구현 6/14</span>3단계 극한 — compiled blit (런타임 코드 생성)</h1>
<ul>
  <li>파라미터 조합(ROP × 픽셀깊이 × 시프트 × 클리핑…)은 수천 가지 —
      전부 미리 컴파일하면 코드가 폭발하고, 범용 루프는 분기 투성이가 됩니다.</li>
  <li>고전적 해법: <strong>호출 시점에 그 조합 전용 기계어를 즉석에서 조립해 실행</strong>합니다.
      초기 Windows GDI가 이 기법으로 유명했고, Sun의 RasterOp 라이브러리·수많은 게임 엔진이 같은 길을 갔습니다.</li>
</ul>
<pre class="code"><span class="cm">/* 개념 스케치: x86 조각을 버퍼에 이어붙인다 */</span>
emit(buf, LOAD_SRC);                 <span class="cm">// mov eax, [esi]</span>
<span class="kw">if</span> (shift)      emit(buf, SHIFT(shift));  <span class="cm">// shld ...</span>
<span class="kw">switch</span> (rop) {                       <span class="cm">// 필요한 연산 "만" 삽입</span>
  <span class="kw">case</span> SRCPAINT: emit(buf, OR_DST);  <span class="kw">break</span>;   <span class="cm">// or eax, [edi]</span>
  <span class="kw">case</span> SRCINVERT: emit(buf, XOR_DST); <span class="kw">break</span>;  <span class="cm">// xor eax, [edi]</span>
}
emit(buf, STORE_DST);                <span class="cm">// mov [edi], eax</span>
emit(buf, LOOP_CTRL);
((<span class="kw">void</span>(*)(<span class="kw">void</span>))buf)();             <span class="cm">// 완성된 전용 blitter 실행!</span></pre>
<ul>
  <li>안쪽 루프에 <strong>분기가 0개</strong>인 전용 코드가 만들어집니다 — 오늘날 JIT 컴파일러의 사고방식과 동일.</li>
  <li>현대의 후예: pixman의 케이스별 fast path 테이블, 브라우저 Skia의 런타임 파이프라인 조립(SkRasterPipeline, JIT 포함).</li>
</ul>
<p class="small">🔗 ${lk('https://gitlab.freedesktop.org/pixman/pixman/-/blob/master/pixman/pixman-fast-path.c','pixman-fast-path.c — 현대판 특수화 blit의 실물')} ·
${lk('https://skia.org/','Skia 그래픽 라이브러리')}</p>`);

sl('구현','4단계 — 하드웨어 블리터의 구조', `
<h1><span class="no">구현 7/14</span>4단계 — 하드웨어 블리터의 데이터패스</h1>
<pre class="code">          ┌──────────┐   ┌──────────┐   ┌──────────┐
 채널 A ─▶│ FIFO/래치 │──▶│          │   │          │
          ├──────────┤   │  배럴     │──▶│  민텀     │
 채널 B ─▶│ FIFO/래치 │──▶│  시프터   │   │  로직     │──▶ 마스크 ──▶ 채널 D
          ├──────────┤   │ (비트정렬)│   │ LF(A,B,C) │   (FWM/LWM)   (쓰기)
 채널 C ─▶│ FIFO/래치 │──▶│          │──▶│  8비트    │
          └──────────┘   └──────────┘   └──────────┘
   주소생성기: ptr += 2;  행 끝에서 ptr += modulo;  (채널별 독립)</pre>
<ul>
  <li>소프트웨어 루프의 각 부분이 회로 블록으로 1:1 번역된 모습입니다 —
      <strong>prev/cur 래치 = FIFO, 시프트 식 = 배럴 시프터, rop_apply = 민텀 로직, 경계 마스크 = FWM/LWM</strong>.</li>
  <li>주소생성기의 <code>modulo</code>가 소프트웨어의 "stride − 폭" 보정과 같습니다.</li>
  <li>파이프라인이므로 클럭당 1워드 처리에 수렴 — CPU처럼 명령 페치/디코드 오버헤드가 없습니다.</li>
  <li>같은 구조가 Amiga Agnus, Atari ST의 STE 블리터, 수많은 2D 가속 칩에 반복해 나타납니다.</li>
</ul>
<p class="small">🔗 ${lk('https://en.wikipedia.org/wiki/Blitter','Wikipedia — Blitter')} ·
${lk('https://amigadev.elowar.com/','Amiga Hardware Reference Manual (블리터 장)')}</p>`);

sl('구현','4단계 — Amiga 블리터 실전 코드', `
<h1><span class="no">구현 8/14</span>4단계 — Amiga 블리터로 실제 blit 하기</h1>
<pre class="code"><span class="cm">; 68000 어셈블리 — 320x200 화면에서 사각형 복사 (A→D, LF=$F0)</span>
        lea     $DFF000,a5          <span class="cm">; 커스텀 칩 베이스</span>
.wait:  btst    #6,$02(a5)          <span class="cm">; DMACONR — 블리터 바쁨?</span>
        bne.s   .wait               <span class="cm">; busy-wait (BltWaitQueue)</span>

        move.w  #$09F0,$40(a5)      <span class="cm">; BLTCON0: 채널 A+D 사용, LF=$F0 (D=A)</span>
        move.w  #$0000,$42(a5)      <span class="cm">; BLTCON1: 시프트 0, ascending</span>
        move.l  #src,$50(a5)        <span class="cm">; BLTAPT  — 원본 주소</span>
        move.l  #dst,$54(a5)        <span class="cm">; BLTDPT  — 목적지 주소</span>
        move.w  #(320-64)/8,$64(a5) <span class="cm">; BLTAMOD — 원본 modulo</span>
        move.w  #(320-64)/8,$66(a5) <span class="cm">; BLTDMOD — 목적지 modulo</span>
        move.w  #$FFFF,$44(a5)      <span class="cm">; BLTAFWM — 첫 워드 마스크</span>
        move.w  #$FFFF,$46(a5)      <span class="cm">; BLTALWM — 마지막 워드 마스크</span>
        move.w  #(50&lt;&lt;6)|(64/16),$58(a5) <span class="cm">; BLTSIZE: 높이50, 폭4워드 → 발사!</span></pre>
<ul>
  <li><code>BLTSIZE</code> 쓰기가 방아쇠 — 이후 블리터가 DMA로 알아서 진행하고, CPU는 다른 일을 합니다.</li>
  <li>LF=$F0은 "D=A" — 수학 6장에서 유도한 PATCOPY(0xF0)와 같은 진리표라는 점에 주목!
      (Amiga는 P,S,D 대신 A,B,C를 쓸 뿐 같은 8비트 민텀 체계)</li>
  <li>겹치는 스크롤은 BLTCON1의 <strong>DESC 비트</strong>(descending)로 — 수학 13장의 역방향 규칙.</li>
</ul>`);

sl('구현','5단계 — 캐시와 메모리 대역폭', `
<h1><span class="no">구현 9/14</span>5단계 — 현대 CPU에서의 병목: 메모리</h1>
<div class="fx big">이동량 = w × h × bpp/8 바이트 (읽기) + 같은 양 (쓰기)<span class="mut small"> — ROP가 D를 읽으면 ×1.5</span></div>
<ul>
  <li>예: 4K 화면(3840×2160×4B) 전체 복사 = 읽기 33MB + 쓰기 33MB.
      DDR5 듀얼채널(~60GB/s)에서 이론 최소 <strong>약 1.1ms</strong> — 컴퓨트가 아니라 <strong>대역폭이 상한</strong>입니다.</li>
  <li>따라서 현대 blit 최적화의 관심사는 논리 연산이 아니라 메모리 시스템입니다:</li>
</ul>
<div class="cols">
<div>
  <h3>잘 되는 패턴</h3>
  <ul>
    <li>행 방향(연속 주소) 진행 — 하드웨어 프리페처가 작동</li>
    <li>넓고 낮은 블록 — 캐시라인(64B)을 꽉 채워 사용</li>
    <li>큰 블록엔 <strong>비임시(non-temporal) 스토어</strong> — 캐시 오염 방지 (<code>_mm_stream_si128</code>)</li>
  </ul>
</div>
<div>
  <h3>안 되는 패턴</h3>
  <ul>
    <li>좁고 긴 세로 블록 — 캐시라인 64B를 읽고 4B만 사용 (16배 낭비)</li>
    <li>비디오 메모리(WC/uncached) <strong>읽기</strong> — 쓰기보다 수십 배 느림.
        "화면에서 다시 읽는" ROP(SRCAND 등)가 가속기 시대에 기피된 이유</li>
    <li>스트라이드가 캐시 뱅크 충돌을 일으키는 2의 거듭제곱일 때의 성능 절벽</li>
  </ul>
</div>
</div>
<p class="small">🔗 ${lk('https://en.wikipedia.org/wiki/Memory_bandwidth','Wikipedia — Memory bandwidth')} ·
${lk('https://www.agner.org/optimize/','Agner Fog — 최적화 매뉴얼 (memcpy·스트리밍 스토어 분석)')}</p>`);

sl('구현','5단계 — SIMD 구현', `
<h1><span class="no">구현 10/14</span>5단계 — SIMD로 쓰는 blit (SSE2 / NEON)</h1>
<div class="cols">
<div>
  <pre class="code"><span class="cm">/* x86 SSE2: 한 번에 16바이트, XOR ROP */</span>
<span class="kw">void</span> blt_xor_sse2(<span class="kw">uint8_t</span> *d,
        <span class="kw">const uint8_t</span> *s, <span class="kw">size_t</span> n)
{
    <span class="kw">size_t</span> i = 0;
    <span class="kw">for</span> (; i + 16 &lt;= n; i += 16) {
        __m128i vs = _mm_loadu_si128(
            (<span class="kw">const</span> __m128i*)(s + i));
        __m128i vd = _mm_loadu_si128(
            (__m128i*)(d + i));
        _mm_storeu_si128((__m128i*)(d + i),
            _mm_xor_si128(vs, vd));
    }
    <span class="kw">for</span> (; i &lt; n; i++) d[i] ^= s[i];  <span class="cm">/* 꼬리 */</span>
}</pre>
</div>
<div>
  <pre class="code"><span class="cm">/* ARM NEON: 알파 합성 한 픽셀 8개 (개념) */</span>
uint8x8_t a  = vdup_n_u8(alpha);
uint8x8_t na = vdup_n_u8(255 - alpha);
uint16x8_t t = vmull_u8(src8, a);      <span class="cm">// αS</span>
t = vmlal_u8(t, dst8, na);             <span class="cm">// +(1-α)D</span>
dst8 = vrshrn_n_u16(t, 8);             <span class="cm">// /256 반올림</span></pre>
  <ul>
    <li>부울 ROP는 SIMD로 <strong>자명하게</strong> 병렬화됩니다(비트별 독립 — 수학 3장).</li>
    <li>알파 합성도 곱셈-누산 명령으로 픽셀 8~16개씩 처리 — pixman/Skia에 실물 코드가 있습니다.</li>
    <li>꼬리(tail) 처리와 비정렬 load/store가 코드의 절반을 차지하는 것이 SIMD blit의 현실.</li>
  </ul>
</div>
</div>
<p class="small">🔗 ${lk('https://www.intel.com/content/www/us/en/docs/intrinsics-guide/index.html','Intel Intrinsics Guide')} ·
${lk('https://developer.arm.com/architectures/instruction-sets/intrinsics/','ARM NEON Intrinsics')}</p>`);

sl('구현','5단계 — GPU에서의 blit', `
<h1><span class="no">구현 11/14</span>5단계 — GPU: blit은 삼각형 두 개다</h1>
<div class="cols">
<div>
  <pre class="code"><span class="cm">// GLSL 프래그먼트 셰이더 — 이것이 현대의 BitBlt</span>
<span class="kw">uniform sampler2D</span> uSrc;
<span class="kw">in  vec2</span> vUV;
<span class="kw">out vec4</span> fragColor;
<span class="kw">void</span> main() {
    fragColor = texture(uSrc, vUV);   <span class="cm">// "SRCCOPY"</span>
}</pre>
  <pre class="code"><span class="cm">// 알파 합성은 블렌드 상태로 (Porter-Duff over)</span>
glEnable(GL_BLEND);
glBlendFunc(GL_ONE, GL_ONE_MINUS_SRC_ALPHA);  <span class="cm">// premultiplied</span></pre>
</div>
<div>
  <ul>
    <li>목적지 사각형을 덮는 <strong>삼각형 2개</strong>를 그리고, 원본을 <strong>텍스처</strong>로 샘플링 —
        스케일·회전·필터링이 공짜로 따라옵니다.</li>
    <li>전용 경로도 존재: <code>glBlitFramebuffer</code>, <code>vkCmdBlitImage</code>,
        D3D12 <code>CopyTextureRegion</code> — 드라이버가 DMA 엔진(=현대의 블리터!)으로 처리하기도 합니다.</li>
    <li>부울 ROP의 잔재: OpenGL의 <code>glLogicOp</code>가 아직 16가지 2입력 연산을 지원합니다
        (Vulkan도 logicOp) — X11 GC function의 직계 후손.</li>
    <li>합성 데스크톱(DWM·Wayland)의 최종 프레임 조립이 정확히 이 "텍스처 blit + 블렌드"입니다.</li>
  </ul>
</div>
</div>
<p class="small">🔗 ${lk('https://registry.khronos.org/OpenGL-Refpages/gl4/html/glLogicOp.xhtml','Khronos — glLogicOp (살아있는 ROP)')} ·
${lk('https://learn.microsoft.com/en-us/windows/win32/direct3d12/copying-descriptors','D3D12 리소스 복사 문서')}</p>`);

sl('구현','클리핑·리전·더티렉트', `
<h1><span class="no">구현 12/14</span>실전 구성요소 — 리전과 더티 렉트</h1>
<div class="cols">
<div>
  <h3>리전(Region) 처리</h3>
  <ul>
    <li>겹치는 창 때문에 "보이는 영역"은 사각형들의 합집합 — <strong>밴드(가로 띠)로 정규화</strong>해 저장하는 것이 표준
        (QuickDraw Region, pixman_region, GDI HRGN 모두 동일 아이디어).</li>
    <li>BitBlt는 클립 리전의 <strong>사각형마다 한 번씩</strong> 수행됩니다 — 수학 14장의 교집합 공식을 반복 적용.</li>
    <li>창 이동 시: "가려졌다 드러난 부분"은 원본이 없으므로 blit이 아니라 <strong>다시 그리기 이벤트</strong>(WM_PAINT, Expose)가 갑니다 —
        창 시스템 이벤트 모델이 BitBlt의 한계에서 나온 셈.</li>
  </ul>
</div>
<div>
  <h3>더티 렉트(Dirty Rectangles)</h3>
  <ul>
    <li>프레임마다 화면 전체를 다시 그리는 대신, <strong>바뀐 사각형만 모아서</strong> blit — 8~16비트 게임 시대의 핵심 기법.</li>
    <li>스크롤 최적화: 기존 픽셀을 <code>ScrollWindowEx</code>/자기 blit으로 밀고, 새로 드러난 띠만 렌더링.</li>
    <li>현대에도 살아있음: 브라우저의 부분 무효화, 안드로이드의 partial invalidate, 터미널 에뮬레이터의 라인 스크롤.</li>
  </ul>
  <pre class="code">frame:
  <span class="kw">for</span> r <span class="kw">in</span> dirty_rects:

</div>
</div>`);

sl('API','Win32 실전 — 화면 캡처', `
<h1><span class="no">API 2/6</span>Win32 실전 예제 — 40년째 현역인 화면 캡처</h1>
<pre class="code">HDC hScreen = GetDC(NULL);                     <span class="cm">// 화면 전체 DC</span>
<span class="kw">int</span> w = GetSystemMetrics(SM_CXSCREEN);
<span class="kw">int</span> h = GetSystemMetrics(SM_CYSCREEN);

HDC     hMem = CreateCompatibleDC(hScreen);    <span class="cm">// 오프스크린 DC</span>
HBITMAP hBmp = CreateCompatibleBitmap(hScreen, w, h);
HGDIOBJ old  = SelectObject(hMem, hBmp);

BitBlt(hMem, 0, 0, w, h,                       <span class="cm">// ★ 화면 → 메모리</span>
       hScreen, 0, 0, SRCCOPY | CAPTUREBLT);

<span class="cm">// hBmp를 파일로 저장하거나 클립보드에 …</span>
SelectObject(hMem, old);
DeleteObject(hBmp);  DeleteDC(hMem);  ReleaseDC(NULL, hScreen);</pre>

  <li><code>CAPTUREBLT</code>(0x40000000) 플래그는 레이어드 창까지 포함해 캡처 — ROP 진리표가 아니라 동작 플래그입니다.</li>

SDL_BlitScaled(sprite, NULL, screen, &amp;big);</pre>
</div>
<div>
  <pre class="code"><span class="cm">/* SDL2 — GPU 경로 (렌더러/텍스처) */</span>
SDL_Texture *t = SDL_CreateTextureFromSurface(ren, sprite);
SDL_SetTextureBlendMode(t, SDL_BLENDMODE_BLEND);
SDL_RenderCopy(ren, t, NULL, &amp;dst);   <span class="cm">// = 텍스처 blit</span>
SDL_RenderPresent(ren);</pre>
</div>
</div>
<ul>
  <li>같은 라이브러리 안에 <strong>소프트웨어 blit</strong>(BlitSurface — CPU, 이 문서 구현 파트의 세계)과
      <strong>GPU blit</strong>(RenderCopy — 텍스처, 셰이더의 세계)이 공존합니다 — 50년 역사의 축소판.</li>
  <li>SDL_BlitSurface의 내부 소스는 픽셀 포맷별 fast path 디스패치의 훌륭한 교재입니다.</li>
</ul>
<p class="small">🔗 ${lk('https://wiki.libsdl.org/SDL2/SDL_BlitSurface','SDL 위키 — SDL_BlitSurface')} ·
${lk('https://github.com/libsdl-org/SDL','SDL 소스 저장소 (src/video/SDL_blit_*.c)')}</p>`);

  0x00:'BLACKNESS', 0x11:'NOTSRCERASE', 0x33:'NOTSRCCOPY', 0x44:'SRCERASE',
  0x55:'DSTINVERT', 0x5A:'PATINVERT', 0x66:'SRCINVERT', 0x88:'SRCAND',
  0xAA:'(D — 아무것도 안 함)', 0xBB:'MERGEPAINT', 0xC0:'MERGECOPY', 0xCC:'SRCCOPY',
  0xEE:'SRCPAINT', 0xF0:'PATCOPY', 0xFB:'PATPAINT', 0xFF:'WHITENESS'
};
var ROPFULL = {
  0x00:'0x00000042', 0x11:'0x001100A6', 0x33:'0x00330008', 0x44:'0x00440328',
  0x55:'0x00550009', 0x5A:'0x005A0049', 0x66:'0x00660046', 0x88:'0x008800C6',
  0xAA:'0x00AA0029', 0xBB:'0x00BB0226', 0xC0:'0x00C000CA', 0xCC:'0x00CC0020',
  0xEE:'0x00EE0086', 0xF0:'0x00F00021', 0xFB:'0x00FB0A09', 0xFF:'0x00FF0062'
};
var ROPRPN = {
  0x00:'0', 0x11:'DSon', 0x33:'Sn', 0x44:'SDna', 0x55:'Dn', 0x5A:'DPx',
  0x66:'DSx', 0x88:'DSa', 0xAA:'D', 0xBB:'DSno', 0xC0:'PSa', 0xCC:'S',
  0xEE:'DSo', 0xF0:'P', 0xFB:'DPSnoo', 0xFF:'1'
};

function hex2(n){ return (n < 16 ? '0' : '') + n.toString(16).toUpperCase(); }

/* 민텀 전개 문자열 */
function mintermStr(rop){
  if (rop === 0) return '0';
  if (rop === 255) return '1';
  var parts = [];
  for (var i = 7; i >= 0; i--) if (rop >> i & 1)
    parts.push(((i&4)?'P':'¬P') + '·' + ((i&2)?'S':'¬S') + '·' + ((i&1)?'D':'¬D'));
  return parts.join(' + ');
}

/* 3변수 퀸-매클러스키 단순화 (표시용 — 그리디 커버) */
function qmSimplify(rop){
  if (rop === 0) return '0';
  if (rop === 255) return '1';
  var ms = [];
  for (var i = 0; i < 8; i++) if (rop >> i & 1) ms.push(i);
  var cur = ms.map(function(m){ return {val:m, mask:7}; });
  var primes = [];
  while (cur.length){
    var used = cur.map(function(){ return false; });
    var next = [], seen = {};
    for (var a = 0; a < cur.length; a++)
      for (var b = a + 1; b < cur.length; b++){
        var A = cur[a], B = cur[b];
        if (A.mask !== B.mask) continue;
        var d = (A.val ^ B.val) & A.mask;
        if (d && !(d & (d - 1))){          // 정확히 한 비트 차이 → 결합
          used[a] = used[b] = true;
          var nv = A.val & ~d, nm = A.mask & ~d, key = nv + '/' + nm;
          if (!seen[key]){ seen[key] = 1; next.push({val:nv, mask:nm}); }
        }
      }
    for (var c = 0; c < cur.length; c++)
      if (!used[c] && !primes.some(function(p){ return p.val === cur[c].val && p.mask === cur[c].mask; }))
        primes.push(cur[c]);
    cur = next;
  }
  function covers(p, m){ return (m & p.mask) === p.val; }
  var chosen = [], left = ms.slice();
  while (left.length){
    var best = null, bestC = -1;
    primes.forEach(function(p){
      var c = left.filter(function(m){ return covers(p, m); }).length;
      if (c > bestC){ bestC = c; best = p; }
    });
    chosen.push(best);
    left = left.filter(function(m){ return !covers(best, m); });
  }
  var BITS = [{b:4,n:'P'},{b:2,n:'S'},{b:1,n:'D'}];
  return chosen.map(function(p){
    var lits = BITS.filter(function(v){ return p.mask & v.b; })
                   .map(function(v){ return ((p.val & v.b) ? '' : '¬') + v.n; });
    return lits.length ? lits.join('·') : '1';
  }).join(' + ');
}

/* ============================================================
 *  픽셀 연산 코어 (데모·카탈로그 공용)
 * ============================================================ */
function ropEval(rop, p, s, d){ return rop >> ((p<<2)|(s<<1)|d) & 1; }

var bitsCache = {};
function makeBits(ch, n){
  var key = ch + n;
  if (bitsCache[key]) return bitsCache[key];
  var a = new Uint8Array(n*n), cx = n/2, cy = n/2;
  for (var y = 0; y < n; y++) for (var x = 0; x < n; x++){
    var v = 0;
    if (ch === 'P'){                       // 대각 해칭 패턴
      v = ((x + y) & 15) < 8 ? 1 : 0;
    } else if (ch === 'D'){                // 체커보드
      var b = Math.max(2, n >> 3);
      v = (((x/b)|0) + ((y/b)|0)) & 1;
    } else {                               // S: 스마일 원판
      var dx = x - cx, dy = y - cy, r2 = dx*dx + dy*dy, R = n*0.42;
      if (r2 < R*R){
        v = 1;
        var ex = n*0.16, ey = n*0.14, er = n*0.07;      // 눈
        if ((dx+ex)*(dx+ex) + (dy+ey)*(dy+ey) < er*er) v = 0;
        if ((dx-ex)*(dx-ex) + (dy+ey)*(dy+ey) < er*er) v = 0;
        var m = Math.sqrt(r2);                            // 입
        if (m > R*0.55 && m < R*0.75 && dy > Math.abs(dx)*0.6) v = 0;
      }
    }
    a[y*n + x] = v;
  }
  bitsCache[key] = a;
  return a;
}

var INKS = { P:[122,72,199], S:[10,122,60], D:[190,84,20], R:[16,58,140] };
function drawBits(cv, bits, ink){
  var n = cv.width, ctx = cv.getContext('2d');
  var img = ctx.createImageData(n, n), d = img.data;
  for (var i = 0; i < n*n; i++){
    var o = i*4, on = bits[i];
    d[o]   = on ? ink[0] : 245;
    d[o+1] = on ? ink[1] : 248;
    d[o+2] = on ? ink[2] : 252;
    d[o+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
function ropBits(rop, n){
  var P = makeBits('P', n), Sb = makeBits('S', n), D = makeBits('D', n);
  var R = new Uint8Array(n*n);
  for (var i = 0; i < n*n; i++) R[i] = ropEval(rop, P[i], Sb[i], D[i]);
  return R;
}

function initRopPlayground(box){
  var q = function(sel){ return box.querySelector('[data-r="' + sel + '"]'); };
  var sel = q('sel'), num = q('num'), stat = q('stat'), n = 96;
  var named = Object.keys(ROPNAMES).map(Number).sort(function(a,b){ return a-b; });
  named.forEach(function(r){
    var o = document.createElement('option');
    o.value = r; o.textContent = '0x' + hex2(r) + '  ' + ROPNAMES[r];
    sel.appendChild(o);
  });
  drawBits(q('P'), makeBits('P', n), INKS.P);
  drawBits(q('S'), makeBits('S', n), INKS.S);
  drawBits(q('D'), makeBits('D', n), INKS.D);
  function update(r){
    r = Math.max(0, Math.min(255, r|0));
    num.value = r;
    sel.value = ROPNAMES[r] ? String(r) : '';
    drawBits(q('R'), ropBits(r, n), INKS.R);
    stat.textContent = '0x' + hex2(r) + (ROPNAMES[r] ? ' (' + ROPNAMES[r] + ')' : '') +
      '  —  D ← ' + qmSimplify(r);
  }
  sel.addEventListener('change', function(){ if (sel.value !== '') update(+sel.value); });
  num.addEventListener('input', function(){ update(+num.value); });
  q('prev').addEventListener('click', function(){ update((+num.value + 255) % 256); });
  q('next').addEventListener('click', function(){ update((+num.value + 1) % 256); });
  update(0xCC);
}

/* --- 데모 ②: 스프라이트 합성 --- */
function initSpriteDemo(box){
  var q = function(s){ return box.querySelector('[data-m="' + s + '"]'); };
  var cv = q('cv'), ctx = cv.getContext('2d'), stat = q('stat');
  var W = cv.width, H = cv.height, SP = 44;
  /* 배경 오프스크린 */
  var bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  var bc = bg.getContext('2d');
  var g = bc.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#ffe9b0'); g.addColorStop(.5, '#a8d8ff'); g.addColorStop(1, '#d7b0ff');
  bc.fillStyle = g; bc.fillRect(0, 0, W, H);
  bc.strokeStyle = 'rgba(30,60,120,.5)'; bc.lineWidth = 2;
  for (var i = 0; i < 12; i++){ bc.beginPath(); bc.arc(30 + i*28, H/2 + Math.sin(i)*30, 16, 0, 7); bc.stroke(); }
  bc.fillStyle = '#1b3a70'; bc.font = 'bold 26px sans-serif';
  bc.fillText('BACKGROUND', 60, 34);
  /* 스프라이트 비트 + 색 */
  var sb = makeBits('S', SP);
  function drawFrame(t, mode){
    ctx.drawImage(bg, 0, 0);
    var x = ((W - SP) / 2 + Math.cos(t/700) * (W - SP) / 2.2) | 0;
    var y = ((H - SP) / 2 + Math.sin(t/430) * (H - SP) / 2.6) | 0;
    var img = ctx.getImageData(x, y, SP, SP), d = img.data;
    for (var p = 0; p < SP*SP; p++){
      var o = p*4, on = sb[p];
      if (mode === 'copy'){
        d[o] = on ? 250 : 255; d[o+1] = on ? 200 : 255; d[o+2] = on ? 40 : 255;
      } else if (mode === 'mask'){
        if (on){ d[o] = 250; d[o+1] = 200; d[o+2] = 40; }      /* D=(D&~M)|(S&M) */
      } else { /* xor */
        if (on){ d[o] = 255 - d[o]; d[o+1] = 255 - d[o+1]; d[o+2] = 255 - d[o+2]; }
      }
    }
    ctx.putImageData(img, x, y);
  }
  var mode = 'mask', running = true, msg = {
    mask: 'D = (D AND ¬M) OR (S AND M) — blit 2회, 배경 보존 ✓',
    xor:  'D = D XOR S — 배경 위에서 색 반전. 같은 blit 한 번 더면 지워짐',
    copy: 'D = S — 사각형 전체가 찍혀 배경을 가림 ✗'
  };
  ['mask','xor','copy'].forEach(function(m){
    q(m).addEventListener('click', function(){
      mode = m;
      ['mask','xor','copy'].forEach(function(k){ q(k).classList.toggle('on', k === m); });
      stat.textContent = msg[m];
    });
  });
  q('pause').addEventListener('click', function(){ running = !running; });
  stat.textContent = msg.mask;
  function loop(t){
    if (running) drawFrame(t, mode);
    activeRAF.push(requestAnimationFrame(loop));
  }
  activeRAF.push(requestAnimationFrame(loop));
}

function initStretchDemo(box){
  var q = function(s){ return box.querySelector('[data-t="' + s + '"]'); };
  var art = [
    '0000011111100000','0001100000011000','0010000000000100','0100011001100010',

    '1000100000010001','1000011111100001','0100000000000010','0010000000000100',
    '0001100000011000','0000011111100000','0000001001000000','0000000110000000'
  ];

    var sy = 0, ey = 0;
    for (var dy2 = 0; dy2 < dh; dy2++){

  zy.addEventListener('input', function(){ if (lock) zx.value = zy.value; render(); });
