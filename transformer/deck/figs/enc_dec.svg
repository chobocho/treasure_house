<svg class="diag" viewBox="0 0 340 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인코더-디코더 · 디코더 전용 · 인코더 전용">
<style>
.diag text{font-family:-apple-system,"Noto Sans KR",sans-serif}
.frame{fill:none;stroke:var(--border,#dcc7a6);stroke-width:1}
.ax{stroke:var(--muted,#7a6450);stroke-width:1;fill:none}
.grid{stroke:var(--border,#e8dcc4);stroke-width:.6;
 stroke-dasharray:2 3;fill:none}
.tick{font-size:8px;fill:var(--muted,#7a6450)}
.axname{font-size:9px;fill:var(--accent2,#3d2413);font-weight:700}
.key{font-size:9px;fill:var(--accent2,#3d2413);font-weight:700}
.cap{font-size:8.5px;fill:var(--muted,#7a6450)}
.cv{fill:none;stroke:var(--accent,#8a3b12);stroke-width:1.6}
.cv1{fill:none;stroke:var(--g1,#9a6a2f);stroke-width:1.6}
.cv2{fill:none;stroke:var(--g2,#25507f);stroke-width:1.6}
.cv3{fill:none;stroke:var(--g3,#2f7a52);stroke-width:1.6}
.cv4{fill:none;stroke:var(--g4,#7a4a8c);stroke-width:1.6}
.cv5{fill:none;stroke:var(--g5,#b8322a);stroke-width:1.6}
.cv6{fill:none;stroke:var(--g6,#5c6b73);stroke-width:1.6}
.cvd{fill:none;stroke:var(--muted,#7a6450);stroke-width:1.2;
 stroke-dasharray:4 3}
.dot{fill:var(--accent,#8a3b12);stroke:none}
.dot2{fill:var(--special,#25507f);stroke:none}
.dot5{fill:var(--g5,#b8322a);stroke:none}
.dotn{fill:var(--muted,#7a6450);opacity:.35;stroke:none}
.cell{fill:var(--panel,#fff);stroke:var(--border,#dcc7a6);
 stroke-width:1}
.cell.a{fill:rgba(138,59,18,.16)}
.cell.b{fill:rgba(184,50,42,.14)}
.cell.c{fill:rgba(46,158,91,.14)}
.cell.d{fill:rgba(217,119,6,.16)}
.cell.e{fill:rgba(37,80,127,.14)}
.cell.f{fill:rgba(122,100,80,.12)}
.box{fill:var(--panel,#fffcf4);stroke:var(--border,#dcc7a6);
 stroke-width:1.2}
.box.g1{stroke:var(--g1,#9a6a2f);fill:rgba(154,106,47,.12)}
.box.g2{stroke:var(--g2,#25507f);fill:rgba(37,80,127,.12)}
.box.g3{stroke:var(--g3,#2f7a52);fill:rgba(47,122,82,.12)}
.box.g4{stroke:var(--g4,#7a4a8c);fill:rgba(122,74,140,.12)}
.box.g5{stroke:var(--g5,#b8322a);fill:rgba(184,50,42,.12)}
.box.g6{stroke:var(--g6,#5c6b73);fill:rgba(92,107,115,.12)}
.box.off{fill:none;stroke-dasharray:3 2}
.arw{stroke:var(--net,#8a7d70);stroke-width:1.4;fill:none}
.arw.hot{stroke:var(--special,#25507f);stroke-width:2.2}
.lbl{font-size:11px;fill:var(--muted,#7a6450)}
.diag text{fill:var(--text,#2a1f16)}
.tie{stroke:var(--net,#8a7d70);stroke-width:1;fill:none}
.tie.hot{stroke:var(--special,#25507f);stroke-width:1.6}
</style>
<text x="68.00" y="20.00" class="key" text-anchor="middle">원래 트랜스포머</text>
<rect x="28.00" y="34.00" width="80.00" height="38.00" class="box g3"/>
<text x="68.00" y="56.00" class="tick" text-anchor="middle">인코더 ×N</text>
<rect x="28.00" y="86.00" width="80.00" height="38.00" class="box g2"/>
<text x="68.00" y="108.00" class="tick" text-anchor="middle">디코더 ×N</text>
<text x="174.00" y="20.00" class="key" text-anchor="middle">GPT (이 덱)</text>
<rect x="134.00" y="34.00" width="80.00" height="38.00" class="box g2"/>
<text x="174.00" y="56.00" class="tick" text-anchor="middle">디코더 ×N</text>
<text x="280.00" y="20.00" class="key" text-anchor="middle">BERT</text>
<rect x="240.00" y="34.00" width="80.00" height="38.00" class="box g3"/>
<text x="280.00" y="56.00" class="tick" text-anchor="middle">인코더 ×N</text>
<text x="170.00" y="150.00" class="cap" text-anchor="middle">디코더: 인과 마스크 · 인코더: 양방향</text>
<text x="170.00" y="164.00" class="cap" text-anchor="middle">원래 트랜스포머의 디코더는 인코더 출력도 본다(교차 어텐션)</text>
</svg>
