<text x="232.00" y="54.00" class="cap" text-anchor="middle">x8</text>
<rect x="246.00" y="40.00" width="20.00" height="20.00" class="box g4"/>
<text x="256.00" y="54.00" class="cap" text-anchor="middle">x9</text>
<rect x="270.00" y="40.00" width="20.00" height="20.00" class="box g4"/>
<text x="280.00" y="54.00" class="cap" text-anchor="middle">x10</text>
<rect x="294.00" y="40.00" width="20.00" height="20.00" class="box g4"/>
<text x="304.00" y="54.00" class="cap" text-anchor="middle">x11</text>
<line x1="32.00" y1="66.00" x2="120.00" y2="66.00" class="tie hot"/>
<text x="76.00" y="80.00" class="tick" text-anchor="middle">조각 0</text>
<line x1="128.00" y1="66.00" x2="216.00" y2="66.00" class="tie hot"/>
<text x="172.00" y="80.00" class="tick" text-anchor="middle">조각 1</text>
<line x1="224.00" y1="66.00" x2="312.00" y2="66.00" class="tie hot"/>
<text x="268.00" y="80.00" class="tick" text-anchor="middle">조각 2</text>
<rect x="30.00" y="100.00" width="280.00" height="44.00" class="box"/>
<text x="170.00" y="116.00" class="tick" text-anchor="middle">들고 다니는 것 셋: m (최댓값) · s (Σ e^(x−m))</text>
<text x="170.00" y="132.00" class="tick" text-anchor="middle">· o (지금까지의 가중평균)</text>
<text x="170.00" y="166.00" class="cap" text-anchor="middle">새 최댓값이 오면 s·e^(m−m′), o 는 옛 합에 비례해 다시 섞는다</text>
<text x="170.00" y="180.00" class="cap" text-anchor="middle">메모리 O(조각) — 결과는 한 번에 계산한 것과 같다</text>
</svg>
