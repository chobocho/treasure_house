<text x="136.00" y="54.00" class="cap" text-anchor="middle">x4</text>
<rect x="150.00" y="40.00" width="20.00" height="20.00" class="box g3"/>
<text x="160.00" y="54.00" class="cap" text-anchor="middle">x5</text>
