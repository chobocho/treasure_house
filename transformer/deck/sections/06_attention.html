<h2>어텐션</h2>
<p class="chsub">질의·키·값에서 학습된 어텐션 지도까지</p>
<p class="cap">이 부의 목표 장수는 130장입니다 (PLAN.md §6).</p>
<hr>
<h3>6부에서 다룰 것</h3>
<ul>
<li>질의·키·값 — 비유에서 수식으로</li>
<li>1/√d 로 나누는 까닭 — 내적의 분산 증명</li>
<li>인과 마스크 — 미래를 못 보게</li>
<li>멀티헤드 — 폭을 나눠 여러 관계를 동시에</li>
<li>어텐션 역전파</li>
<li>비용 O(n²d) — 문맥이 길면 무엇이 비싸지나</li>
<li>학습된 어텐션 지도 읽기 — 정렬·덧셈·한국어</li>
</ul>
<p class="cap">아직 없습니다 — 뼈대만 세워 둔 자리입니다.</p>
