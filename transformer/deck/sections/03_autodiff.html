<article class="card section" id="p3">
<p class="chnum">3부</p>
<h2>자동미분 밑바닥부터</h2>
<p class="chsub">수치미분의 한계에서 텐서 역전파까지</p>
<p class="cap">이 부의 목표 장수는 120장입니다 (PLAN.md §6).</p>
<hr>
<h3>3부에서 다룰 것</h3>
<ul>
<li>수치미분은 왜 학습에 못 쓰나</li>
<li>스칼라 Value — 값과 기울기를 함께 든 수</li>
<li>계산 그래프와 위상정렬</li>
<li>역전파 한 번에 모든 기울기</li>
<li>텐서로 넓히기 — 모양이 있는 값</li>
<li>브로드캐스팅의 역전파 — 늘어난 축으로 더한다</li>
<li>유한차분으로 검증하는 습관</li>
</ul>
<p class="cap">아직 없습니다 — 뼈대만 세워 둔 자리입니다.</p>
</article>
