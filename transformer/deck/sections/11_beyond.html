<p class="chnum">11부</p>
<h2>더 나아가기</h2>
<p class="chsub">작은 모델에서 큰 모델로 가는 길목의 기법들</p>
<p class="cap">이 부의 목표 장수는 110장입니다 (PLAN.md §6).</p>
<hr>
<h3>11부에서 다룰 것</h3>
<ul>
<li>온라인 소프트맥스 — 플래시 어텐션의 핵심을 구현하고 동치를 확인</li>
<li>MQA 와 GQA — 키·값 헤드 나눠 쓰기</li>
<li>RoPE 다시 보기</li>
<li>LoRA — 낮은 계수 갱신을 구현하고 시험</li>
<li>인코더 변형 — 가린 토큰 맞히기(MLM)</li>
<li>혼합 정밀도와 스케일링 법칙 — 논문을 인용해 읽기</li>
</ul>
<p class="cap">아직 없습니다 — 뼈대만 세워 둔 자리입니다.</p>
</article>
