<h2>토크나이저</h2>
<p class="chsub">글자를 수로 — UTF-8 과 한글, 그리고 BPE</p>
<p class="cap">이 부의 목표 장수는 90장입니다 (PLAN.md §6).</p>
<hr>
<h3>5부에서 다룰 것</h3>
<ul>
<li>문자·바이트·UTF-8 — 한글 음절이 몇 바이트인가</li>
<li>BPE 학습 — 가장 잦은 짝을 합친다</li>
<li>인코드와 디코드</li>
<li>사전 토크나이저 규칙 — 어디서 자르고 어디서 안 자르나</li>
<li>어휘 크기의 트레이드오프</li>
<li>파이썬과 C 가 바이트까지 같은 토큰을 내는지 확인</li>
</ul>
<p class="cap">아직 없습니다 — 뼈대만 세워 둔 자리입니다.</p>
