<p class="chnum">4부</p>
<h2>텐서 연산</h2>
<p class="chsub">트랜스포머가 쓰는 부품 하나하나의 순전파와 역전파</p>
<p class="cap">이 부의 목표 장수는 110장입니다 (PLAN.md §6).</p>
<hr>
<h3>4부에서 다룰 것</h3>
<ul>
<li>행렬곱과 그 역전파</li>
<li>안정한 소프트맥스</li>
<li>로그소프트맥스 + 교차엔트로피를 한 번에 — 기울기가 p − y 가 되는 까닭</li>
<li>레이어놈 역전파 유도</li>
<li>GELU 와 그 근사</li>
<li>임베딩 조회와 드롭아웃</li>
<li>순수 파이썬의 속도 — 느림이 알려 주는 비용</li>
</ul>
<p class="cap">아직 없습니다 — 뼈대만 세워 둔 자리입니다.</p>
</article>
